name: cdn-integrity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protect-published-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject deleted CDN files and unexpected writes
        shell: bash
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref || 'main' }}"
          git fetch origin "${{ github.base_ref || 'main' }}" --depth=1
          changes="$(git diff --no-renames --name-status "$base"...HEAD)"

          deleted_dist="$(printf '%s\n' "$changes" | awk '$1 == "D" && $2 ~ /^dist\// { print }')"
          if [[ -n "$deleted_dist" ]]; then
            echo "禁止删除已发布的 CDN 文件："
            printf '%s\n' "$deleted_dist"
            exit 1
          fi

          unexpected="$(printf '%s\n' "$changes" | awk '$1 != "D" && $2 !~ /^(dist\/|README\.md$|PUBLISHING\.md$|LICENSE$|\.gitignore$|\.gitattributes$|\.github\/)/ { print }')"
          if [[ -n "$unexpected" ]]; then
            echo "发布仓库出现非白名单写入："
            printf '%s\n' "$unexpected"
            exit 1
          fi
