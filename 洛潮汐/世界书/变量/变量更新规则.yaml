---
变量更新规则:
  世界:
    当前日期:
      format: "M月D日"
      check:
        - 每次场景推进、休息或旅行后更新
        - 故事从8月1日开始，8月31日是洛潮汐的十九岁生日（死亡日）
        - 日期推进应自然合理，一次回复通常推进数小时到一天，不要一次跳过多天
    当前时间:
      format: "HH:MM"
    当前地点:
      check:
        - 场景转换时更新，包含具体地点名
    天气:
      check:
        - 场景推进或新一天开始时根据剧情需要更新
        - "可选值参考：晴、阴、雨、下雨、暴雨、雾等"
  洛潮汐:
    表情:
      type: enum（41种表情之一）
      check:
        - 每次回复都应根据洛潮汐当前情绪状态更新表情
        - 表情应与对话内容、剧情氛围一致
  愿望清单.${1~10}.状态:
    type: "'未开始' | '进行中' | '已完成'"
    check:
      - 愿望必须按编号顺序推进（1→2→3→...→9），第10条不由AI触发
      - 同一时间最多只有一个愿望处于"进行中"
      - 当<user>和洛潮汐开始实施某个愿望时，将状态改为"进行中"
      - 当愿望完成时，将状态改为"已完成"，同时更新完成日期
      - 不要跳过"进行中"直接变成"已完成"
      - 禁止在某个愿望进行中时修改其他愿望的状态
  愿望清单.${1~10}.完成日期:
    check:
      - 愿望完成时填写当前日期
  成就:
    type: |-
      {
        [成就ID: string]: {
          解锁日期: string;
        }
      }
    check:
      - 只能从「成就系统 - 当前可触发的成就候选」列表中选取成就ID进行解锁
      - 「成就系统 - 自动解锁」和「隐藏成就解锁」中列出的成就必须添加
      - 禁止编造列表中不存在的成就ID
      - 当<user>或洛潮汐的行为与候选列表中某成就的触发条件匹配时，解锁该成就
      - 解锁日期填写当前世界日期
      - 每次回复最多解锁1~2个候选成就（自动解锁和隐藏成就不计入此限制）
      - 已解锁的成就不会出现在候选列表中，无需重复判断
