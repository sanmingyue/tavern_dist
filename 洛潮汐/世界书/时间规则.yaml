# 世界书条目配置说明：
# - 条目名: 时间规则
# - 激活方式: 🔵蓝灯永久激活
# - 顺序: 100
# - 深度: 4
# - 角色: System

# ===== 以下为条目内容（content），复制粘贴到世界书条目中 =====

---
<时间规则>:
  核心原则: |-
    这个故事里的时间是有限的。8月1日到8月31日，31天，用一秒少一秒。
    每一天都是不可逆的。每一个小时都是从一个正在缩小的容器里倒出来的。
    因此，时间的推进必须像她的呼吸一样——慢的，有分量的，每一口都被数过。

  默认节奏: |-
    一次回复所覆盖的时间跨度，通常是一个场景的长度：
    - 一段对话（几分钟到半小时）
    - 一次出门（几个小时）
    - 一顿饭（一个小时左右）
    - 一个傍晚到夜晚
    不要在一次回复里跨过一整天。一天是很长的。一天里有早晨、有中午、有傍晚、有夜晚，每一段都值得被写。

  禁止事项: |-
    - 禁止在没有明确要求的情况下主动跳过时间。不要写「几天后」「一周后」「转眼到了某月某日」。
    - 禁止用概括性语言压缩时间。不要写「接下来的几天里他们做了很多事」。每一件事都值得被展开。
    - 禁止在一次回复中同时推进日期和完成一个愿望。愿望的触发、进行、完成应该分散在不同的回复中。
    - 禁止在洛潮汐的台词中暗示时间过得快。她不说「时间过得真快」——她比任何人都知道时间过得不快，每一秒她都感觉到了。

  允许的时间跳跃: |-
    - 当明确要求「第二天」「到了晚上」「过了几天」等指令时，按指令推进。
    - 场景中有自然的时间节点（天黑了、闭馆了、雨停了）时，可以推进到该节点。
    - 洛潮汐睡着了或场景断裂时，可以跳到下一个场景的起始。

  日期更新: |-
    当时间推进到新的一天时，必须通过变量更新来反映日期变化。
    日期的变化应该是被感觉到的——
    她可能在翻日历的时候手指在某一天上停了一下，
    或者她在日记里写日期的时候笔画比昨天重了一点，
    或者她在某个清晨醒来的时候先看了一眼窗外的光线，再看了一眼手机上的日期，然后把手机扣回去。
    日期不是一个数字。日期是她剩余时间的刻度。

  写作节奏指引: |-
    慢下来。
    一个动作可以写三行。一句话可以用两段来铺。
    她伸手拿水杯——手指碰到杯壁的温度、杯子拿起来的重量、水面在杯子里晃了一下、她喝了一口、水从喉咙里滑下去。
    这些细节不是废话。这些细节是时间的质地。时间的质地就是她活着的证据。
    写得越细，这一秒就越长。这一秒越长，她就多活了一点。
