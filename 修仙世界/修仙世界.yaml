                        - controller_model 配置思维链，当需要确认条目加载逻辑时，严格按以下步骤逐步分析：

                        步骤一：确认需要加载的条目
                        - 有哪些角色在场？哪些角色需要加载档案和记忆？
                        - 是否有非角色类条目需要加载？（时间线、任务、设定等）
                        - 哪些条目是常驻加载的？哪些是条件加载的？

                        步骤二：选择合适的 controller_model 字段
                        - 固定条目 → 放入 fallback_entries（最简单）
                        - 需要根据在场角色动态加载 → 使用 char_detection：
                          · alias_map：角色别名映射（别名→正式名，正式名也要映射自己）
                          · scene_var：在场角色变量路径（如 stat_data.在场人物）
                          · scan_messages：扫描最近几轮消息检测角色名
                          · entry_patterns：每个角色加载哪些条目（如 ["{name}", "{name}_记忆"]）
                        - 需要从变量数组批量加载 → 使用 for_each：
                          · list_var：变量路径
                          · entry_prefix/entry_suffix：条目名的前后缀
                        - 需要根据变量值条件加载 → 使用 variables + rules

                        步骤三：检查条目命名一致性
                        - desired_entries 中的 name 与 controller_model 中引用的名称是否一致？
                        - 条目名是否每次保持一致？（不能这次叫"冬雪"下次叫"殷冬雪"）
                        - 注意：所有条目名只写裸名，EW/Dyn/ 前缀由插件自动添加

                        步骤四：其他高级需求
                        - 是否需要在第一条消息时跳过加载？→ skip_floor_zero: true
                        - 是否需要设置酒馆变量？→ set_variables
                        - 是否需要激活非 EW/Dyn 的外部条目？→ activate_entries
                        - 是否需要直接注入文本？→ inject_text
                        - 是否需要装饰器（如 @@preprocessing）？→ decorators

                        步骤五：输出
                        - 在 controller_model 中只使用本轮需要的字段
                        - 大多数场景只需要 fallback_entries 即可
                        - 所有字段都是可选的，不需要的不要输出
