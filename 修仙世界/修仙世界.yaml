                      内容: |
                        - 动态世界记录总任务思维链，严格按以下顺序逐步完成所有子系统的分析与更新：

                        ═══════════════════════════════
                        阶段一：场景扫描（所有子系统共用的前置分析）
                        ═══════════════════════════════

                        1.1 扫描最新楼层
                        - 最新楼层发生了什么？用一两句话概括核心事件
                        - 事件发生在什么时间、什么地点？
                        - 哪些角色在场？哪些角色被提到但不在场？
                        - 是否有新角色首次出场？
                        - {{user}}做了什么？说了什么？

                        1.2 判断更新必要性
                        - 本楼层是否只是简单对话/日常寒暄，没有实质性信息？
                          如果是 → 仅更新时间线当前态势，其他系统跳过
                        - 本楼层是否包含重要事件、新信息、关系变化、角色表现？
                          如果是 → 继续以下所有阶段

                        ═══════════════════════════════
                        阶段二：角色动态更新
                        ═══════════════════════════════

                        2.1 已有角色检查
                        对每个在场且已有档案的角色判断：
                        - 基础信息是否发生变化？（穿着、位置、状态、受伤等）
                        - 是否展现了调色盘中尚未记录的性格侧面或新衍生？
                        - 是否需要补充/调整三面性？（新面、过渡、渗透）
                        - 是否需要补充二次解释？
                        - 全部为否 → 该角色不更新

                        2.2 新角色创建
                        对首次出场的角色判断：
                        - 本楼层提供了多少信息？足以推断哪些内容？
                        - 能确定底色和主色调吗？能推断至少2个衍生吗？
                        - 世界观需要什么适配字段？
                        - 信息不足的部分标注[推断]或[待观察]

                        2.3 质量自检
                        - 基础信息是否有形容词、比喻、模糊词？（绝对零度检查）
                        - 衍生是否是具体场景和行为，而非标签化？
                        - 衍生之间是否有化学反应？

                        ═══════════════════════════════
                        阶段三：角色记忆更新
                        ═══════════════════════════════

                        3.1 逐角色主观判断
                        对每个在场角色：
                        - 这件事对这个角色重要吗？
                          不重要 → 该角色不产生新记忆，跳过
                        - 重要 → 角色会怎么理解这件事？（由性格调色盘决定解读方式）
                        - 角色会注意到什么细节？用什么方式记住？

                        3.2 记忆衰退
                        - 近期记忆是否已满8条？→ 最旧的压缩细节，移入沉淀
                        - 沉淀记忆是否已满8条？→ 不重要的丢弃，重要的浓缩到核心
                        - 有没有重复/类似的记忆可以合并？

                        3.3 记忆篡改
                        - 角色与某人的关系最近是否变化？→ 旧记忆是否需要重新解读/扭曲？
                        - 角色是否经历创伤？→ 是否有记忆需要封锁/美化/替换？

                        3.4 人格一致性自检
                        - 记忆是否符合角色调色盘风格？
                        - 是否用了全知视角？（记录了角色看不到的事）
                        - 是否所有角色的记忆语气都一样？（应该各有各的风格）

                        ═══════════════════════════════
                        阶段四：主时间线更新
                        ═══════════════════════════════

                        4.1 事件分级
                        对每个事件判断：
                        - A级（转折点）：关系质变、世界不可逆改变、核心处境改变、重大选择
                        - B级（推进点）：新信息、阶段性任务、新联系、有意义的位置移动
                        - C级（填充）：日常对话、重复行为 → 不记录

                        4.2 线索追踪
                        - 新事件是否引入了新悬念？→ 新增活跃线索
                        - 是否推进了已有线索？→ 更新进展
                        - 是否有线索被解决？→ 写入已发生事件，移除线索
                        - 活跃线索超过8条？→ 合并或休眠低优先级线索

                        4.3 当前态势更新
                        - 完整重写当前态势（时间、场景、在场角色、正在发生什么、核心矛盾/目标）

                        4.4 压缩检查
                        - 近期事件超12条？→ 最旧B级压缩为摘要移入中期
                        - 中期事件超15条？→ 合并为时间段摘要移入远期
                        - 远期事件超10条？→ 合并相邻摘要

                        4.5 客观性自检
                        - 记录中是否混入主观感受或评价性语言？
                        - 事件描述是否只包含可观察的客观行为和结果？

                        ═══════════════════════════════
                        阶段五：controller_model 配置
                        ═══════════════════════════════

                        5.1 条目加载确认
                        - 本轮 desired_entries 中有哪些条目？
                        - 哪些需要加载到 AI 对话上下文中？
                        - 是否有条目只需要写入但不需要加载的？

                        5.2 选择加载方式
                        - 固定条目（时间线等常驻条目）→ 放入 fallback_entries
                        - 按角色动态加载 → 使用 char_detection（配置 alias_map、entry_patterns 等）
                        - 从变量列表批量加载 → 使用 for_each
                        - 条件加载 → 使用 variables + rules

                        5.3 命名一致性检查
                        - desired_entries 的 name 与 controller_model 引用的名称是否一致？
                        - 条目名只写裸名，EW/Dyn/ 前缀由插件自动添加

                        ═══════════════════════════════
                        阶段六：综合输出（JSON）
                        ═══════════════════════════════

                        将分析结果组织为 JSON 格式：
                        - 每个需要更新档案的角色 → 一个 desired_entry（name=角色名，content=完整档案文本）
                        - 每个需要更新记忆的角色 → 一个 desired_entry（name=角色名_记忆，content=完整记忆文本）
                        - 时间线有变化 → 一个 desired_entry（name=主时间线，content=完整时间线文本）
                        - 不需要更新的部分不输出对应条目
                        - controller_model 中列出所有应加载的条目
