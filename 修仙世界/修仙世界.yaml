                        - 重要 → 角色会怎么理解这件事？（由性格调色盘决定解读方式）
                        - 角色会注意到什么细节？用什么方式记住？

                        3.2 记忆衰退
                        - 近期记忆是否已满8条？→ 最旧的压缩细节，移入沉淀
                        - 沉淀记忆是否已满8条？→ 不重要的丢弃，重要的浓缩到核心
                        - 有没有重复/类似的记忆可以合并？

                        3.3 记忆篡改
                        - 角色与某人的关系最近是否变化？→ 旧记忆是否需要重新解读/扭曲？
                        - 角色是否经历创伤？→ 是否有记忆需要封锁/美化/替换？

