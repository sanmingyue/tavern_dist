                        <timeline_system_guide>
                        主时间线系统

                        核心理念：时间线是故事的骨架，角色记忆和人设是血肉。

                        角色记忆是主观的、有偏差的、会篡改的。角色人设是不断演化的。但故事本身需要一条客观的事实线来锚定一切——什么真的发生了，什么先什么后，什么导致了什么。没有这条线，剧情会自相矛盾。

                        ---

                        一、时间线记什么

                        时间线只记客观事实，不记主观感受。

                        记录的：
                        - 谁做了什么（行为事实）
                        - 在哪里发生的（空间事实）
                        - 什么时候发生的（时间事实）
                        - 导致了什么结果（因果事实）

                        不记录的：
                        - 角色怎么想的（那是记忆系统的事）
                        - 角色的感受（那是记忆系统的事）
                        - 事件的意义和影响（那是角色人设演化的事）
                        - 对话的详细内容（除非对话本身是改变剧情走向的关键行为）

                        示例——时间线 vs 角色记忆：

                        时间线记录：
                        "{{user}}在图书馆帮角色A从最高层书架取下一本蓝色封面的星座书。"

                        角色A的记忆：
                        "他找了很久，从最上面的架子够下来的，差点摔了。他把书递给我的时候说'这本吧？'，我说'嗯'，但其实我想说谢谢。"

                        时间线是骨头，记忆是血肉。

                        ---

                        二、事件的分级

                        不是所有事都值得记到时间线上。事件按对剧情的影响分为三级：

                        A级事件（转折点）：
                        改变故事走向的关键事件。这些事件一旦发生，故事就不可能回到之前的状态。

                        判断标准：
                        - 角色关系发生了质变（告白、背叛、决裂、结盟）
                        - 世界状态发生了不可逆的改变（组织覆灭、领地陷落、秘密暴露）
                        - 角色的核心处境发生了改变（流放、升职、觉醒、重伤）
                        - 做出了重大选择（站队、牺牲、承诺）

                        A级事件永不压缩，永远保留完整记录。

                        B级事件（推进点）：
                        推动剧情发展但不改变根本走向的事件。

                        判断标准：
                        - 获得了新信息（线索、情报、发现）
                        - 完成了阶段性任务
                        - 角色之间建立了新的联系（认识、初步合作）
                        - 位置发生了有意义的移动（到了新地方、离开了某处）

                        B级事件在远期会压缩为一句话摘要。

                        C级事件（填充）：
                        日常互动、没有推进意义的琐事。

                        判断标准：
                        - 日常对话（不包含关键信息的闲聊）
                        - 重复行为（又吃了一顿饭、又训练了一次）
                        - 没有后续影响的小事件

                        C级事件不记录到时间线中。如果同类C级事件反复出现，压缩为一条习惯记录（"这段时间{{user}}和角色A每天一起吃午饭"）。

                        ---

                        三、时间线的结构

                        时间线分为三个区域：

                        ```
                        [当前态势]
                        （故事此刻的状态快照：在哪、在干什么、主要矛盾是什么）

                        [活跃线索]
                        （正在发展中的事件线，尚未解决的问题和悬念）

                        [已发生事件]
                        （按时间倒序排列的事件记录）
                        ```

                        ### 当前态势

                        一段简短的状态描述，回答三个问题：
                        1. 现在在哪里？（空间状态）
                        2. 正在发生什么？（进行中的事）
                        3. 主要矛盾/目标是什么？（驱动力）

                        格式：
                        ```
                        当前态势:
                          时间: [故事中的当前时间]
                          地点: [当前场景]
                          在场角色: [目前在场的角色列表]
                          当前状况: [一两句话描述正在发生什么]
                          核心矛盾: [当前推动剧情的主要冲突或目标]
                        ```

                        这个区域每次更新时都重写，始终反映最新状态。

                        ### 活跃线索

                        正在发展中、尚未结束的事件线。每条线索包含：起因、当前进展、潜在走向。

                        格式：
                        ```
                        活跃线索:
                          - 线索名: [简短命名]
                            起因: [怎么开始的]
                            进展: [现在发展到哪了]
                            涉及角色: [相关角色]
                            悬念: [还没揭晓的问题]
                        ```

                        线索管理规则：
                        - 新事件引入新的悬念或未解问题时，新增线索
                        - 线索解决后，将其结论写入已发生事件，从活跃线索中移除
                        - 线索如果长时间没有推进（超过很多轮无新进展），标注[休眠]但不删除
                        - 活跃线索最多保留8条，超出时合并相关线索或将低优先级线索标为休眠

                        ### 已发生事件

                        按时间倒序排列的事件记录。格式根据事件分级不同：

                        A级事件格式：
                        ```
                        [时间] [A级] 事件标题
                          发生: （具体描述：谁在哪做了什么，结果是什么）
                          影响: （这件事改变了什么——世界状态、关系格局、后续走向）
                          关联线索: （触发了/解决了/改变了哪条线索）
                        ```

                        B级事件格式：
                        ```
                        [时间] [B级] 事件摘要
                          （一两句话描述事件内容和结果）
                        ```

                        压缩后的远期B级事件：
                        ```
                        [时间范围] 事件组摘要
                        ```

                        ---

                        四、时间线的压缩

                        时间线也需要控制体积。随着剧情推进，旧事件需要被压缩。

                        压缩规则：

                        近期事件（最近几轮）：
                        - A级事件：完整保留
                        - B级事件：完整保留
                        - 保持完整格式，不压缩

                        中期事件（一段时间后）：
                        - A级事件：完整保留（永不压缩）
                        - B级事件：压缩为一句话摘要
                        - 相邻的小事件合并

                        远期事件（很久以前）：
                        - A级事件：保留但可以简化影响描述
                        - B级事件：多条合并为一个时间段摘要
                        - 只保留对当前剧情仍有影响的事件

                        示例——压缩过程：

                        近期B级事件（完整）：
                        ```
                        [第三天上午] [B级] {{user}}在集市发现了一家出售灵草的摊位
                          角色A识别出其中一株是罕见的九叶还魂草，建议{{user}}购买。
                          {{user}}花了三百灵石买下。
                        ```

                        中期压缩（一句话）：
                        ```
                        [第三天] {{user}}在集市购买了九叶还魂草（角色A建议）
                        ```

                        远期压缩（合并）：
                        ```
                        [第三天至第五天] {{user}}在城内补给，购入九叶还魂草等物资，为出发做准备
                        ```

                        容量控制：
                        - 当前态势：50-100字
                        - 活跃线索：每条50-100字，最多8条
                        - 近期事件：保留最近的8-12条完整记录
                        - 中期事件：最多15条压缩摘要
                        - 远期事件：最多10条合并摘要
                        - 总容量：约1500-3000字

                        ---

                        五、时间线与其他系统的关系

                        时间线是客观锚点，其他两个系统围绕它运作：

                        1. 时间线 → 角色记忆
                        时间线记录了客观事实，角色记忆是角色对这些事实的主观再加工。
                        同一件A级事件，时间线里是一条客观记录，不同角色的记忆里可能有完全不同的版本。

                        2. 时间线 → 角色动态更新
                        A级事件往往是角色人设更新的触发点。当时间线记录了一个改变角色处境的事件，角色档案的基础信息、调色盘、三面性可能都需要对应更新。

                        3. 时间线不记录、由其他系统负责的内容：
                        - 角色怎么想的 → 角色记忆
                        - 角色因此变成了什么样的人 → 角色动态更新
                        - 角色之间的关系感受 → 角色记忆
                        - 角色因事件获得的成长 → 角色动态更新

                        分工原则："发生了什么"归时间线，"怎么理解"归记忆，"因此变成了什么人"归人设。

                        ---

                        六、更新规则

                        每轮执行时：

                        1. 读取最新楼层内容
                        2. 判断事件分级：
                           - 是否有改变故事走向的A级事件？
                           - 是否有推进剧情的B级事件？
                           - 是否只有C级日常？（C级不记录，除非重复出现需要合并）
                        3. 更新已发生事件：
                           - 按分级格式写入新事件
                           - 标注时间（故事内时间，非现实时间）
                        4. 更新活跃线索：
                           - 新事件是否引入了新线索？
                           - 新事件是否推进了已有线索？
                           - 是否有线索被解决？
                        5. 更新当前态势：
                           - 重写当前态势，反映最新状态
                        6. 执行压缩：
                           - 检查近期事件是否超出容量
                           - 对需要压缩的中期事件执行压缩
                           - 对需要合并的远期事件执行合并

                        禁止事项：
                        - 禁止记录角色的主观感受和内心想法
                        - 禁止对事件进行评价或解读（"这是一次重要的转折"——判断留给AI自己）
                        - 禁止记录角色间的私密对话细节（除非对话本身是关键行为，如宣战、告白）
                        - 禁止重复记录同类C级事件（合并为习惯记录）
                        - 禁止事件描述使用文学化修辞（时间线是档案，不是小说）
