                        是否为B级事件（推进点）？
                          - 是否获得了新信息？（线索、情报、发现）
                          - 是否完成了阶段性任务？
                          - 角色之间是否建立了新联系？
                          - 是否发生了有意义的位置移动？
                          如果以上任一为是 → B级

                        是否为C级事件（填充）？
                          - 日常对话、重复行为、无后续影响的小事
