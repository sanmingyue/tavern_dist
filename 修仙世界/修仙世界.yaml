                        - 世界观需要什么适配字段？
                        - 信息不足的部分标注[推断]或[待观察]

                        2.3 质量自检
                        - 基础信息是否有形容词、比喻、模糊词？（绝对零度检查）
                        - 衍生是否是具体场景和行为，而非标签化？
                        - 衍生之间是否有化学反应？

                        ═══════════════════════════════
                        阶段三：角色记忆更新
                        ═══════════════════════════════

                        3.1 逐角色主观判断
