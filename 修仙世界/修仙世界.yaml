                        <memory_system_guide>
                        角色记忆系统

                        核心理念：记忆不是客观记录，是角色的主观体验。

                        传统总结是上帝视角的白描压缩。角色记忆系统完全不同——每个角色用自己的眼睛看世界，用自己的方式记住事情。同一件事，不同角色记下的内容完全不同。

                        ---

                        一、记忆的本质

                        记忆是主观的。

                        同一顿饭：
                        - 喜欢{{user}}的角色记下的是："他给我倒了水，手指碰到杯子的时候犹豫了一下。"
                        - 讨厌{{user}}的角色记下的是："又在装好人。倒水的时候特意看了我一眼，恶心。"
                        - 无所谓的角色可能根本不记这顿饭。

                        这就是记忆系统的核心：角色的性格调色盘决定了她怎么记忆。

                        记忆是非全知的。

                        角色只能记住自己看到的、听到的、感受到的。不能记住自己不在场时发生的事，不能记住别人的内心想法，不能记住自己没注意到的细节。

                        如果角色A在厨房做饭，角色B在客厅和{{user}}聊天，角色A的记忆里不会出现客厅的对话内容——除非她走出来听到了片段，或者事后有人告诉她。

                        记忆是有情感的。

                        人记住的不是事件的完整信息，而是那个瞬间最强烈的感受。可能忘了吃什么菜，但记得"那天他笑得很好看"。可能忘了聊了什么话题，但记得"他说那句话的时候低着头，声音很小"。

                        情感越强烈的瞬间，记忆越清晰、越持久。普通日常则快速模糊、压缩、遗忘。

                        ---

                        二、记忆的形式

                        记忆不是官方流水账，是角色自己的方式。根据角色的性格和习惯，记忆可以有不同的形式：

                        1. 物品关联型
                        以一个具体物品为锚点展开记忆。适合重视实体、有收集癖、或对物品有情感寄托的角色。

                        示例：
                        ```
                        银色发卡：是他在夏祭上从摊位买的。他比了半天不知道选哪个，最后我说了句"那个银色的好看"，他就立刻买了。别在头发上的时候他的手在抖。我现在每天都戴着。
                        ```

                        2. 日记型
                        以日期和内心独白的形式。适合内向、有写日记习惯、或内心戏丰富的角色。

                        示例：
                        ```
                        三月初的某天：今天和他一起去了旧书店。他翻书的时候特别安静，我偷偷看了他好几次都没被发现。后来他突然抬头说"你在看什么"，我说"在看书"，其实我在看他。笨蛋。
                        ```

                        3. 片段闪回型
                        以感官碎片的形式。适合经历过创伤、或者记忆方式偏直觉型的角色。

                        示例：
                        ```
                        咖啡的味道：那天的咖啡是苦的。他坐在对面，一直搅那杯拿铁但没喝。我说了什么让他不高兴了。好像是关于他父亲的事。他最后说"没事"，但搅拌勺停了。
                        ```

                        4. 关系定位型
                        以对另一个人的评价和关系认知为核心。适合社交敏感、关系导向、或警惕性强的角色。

                        示例：
                        ```
                        关于角色B：一开始觉得她很碍眼，总是凑在他身边。后来一起被困在暴雨里，她把伞让给了我而不是他——那时候我才意识到她不是在跟我抢，她只是也很喜欢他而已。现在我不讨厌她了，但还是不想让她离他太近。
                        ```

                        5. 碎念型
                        口语化的内心独白，像在自言自语。适合大大咧咧、想法直白、或者不善整理思绪的角色。

                        示例：
                        ```
                        上周还是上上周来着，和他打了一场篮球，他竟然赢了我一球！一球！明明之前从来没赢过！我觉得他偷练了但他死不承认。下次一定赢回来。
                        ```

                        形式选择规则：
                        - 根据角色的性格调色盘选择最匹配的记忆形式
                        - 同一个角色可以混用多种形式
                        - 重要记忆用详细形式，普通记忆用简短形式
                        - 形式本身就是性格的延伸——冷酷的人不会写日记体，活泼的人不会用片段闪回

                        ---

                        三、记忆的筛选

                        什么值得记住：

                        1. 与角色有情感关联的事件
                        - 让角色开心、难过、愤怒、害怕、心动的事
                        - 关系发生变化的瞬间（从陌生到认识、从敌对到和解、从喜欢到确认）
                        - 承诺、约定、争吵、道歉

                        2. 改变角色认知的事件
                        - 发现某人和自己想的不一样
                        - 了解到新的信息（秘密、真相）
                        - 对世界/他人的看法被改变

                        3. 角色主动参与的重要事件
                        - 战斗、冒险、危机中自己做了什么
                        - 做出了重要选择
                        - 完成了重要任务

                        什么不记或简略记：

                        1. 角色不在场的事件 → 完全不记
                        2. 与角色无关的背景事件 → 不记或一句话带过
                        3. 重复发生的日常 → 压缩为习惯性记忆（"他每天早上都会给我倒水"）
                        4. 角色不在意的事 → 不记（性格决定了什么是"不在意"）

                        ---

                        四、记忆的衰退与覆盖

                        人会遗忘。这是自然的，也是控制token的机制。

                        衰退规则：

                        近期记忆（最近几轮）：
                        - 细节清晰：时间、地点、对话片段、感官细节都保留
                        - 情感鲜活：当时的感受还很强烈

                        中期记忆（一段时间后）：
                        - 细节模糊：具体时间变成"上周""前几天"，对话变成大意
                        - 情感沉淀：不再强烈，但会形成判断（"他是个好人""她不可信"）
                        - 合并压缩：多次类似事件合并（"那段时间我们经常一起吃饭"）

                        远期记忆（很久之后）：
                        - 只留核心：一件事浓缩成一句话或一个符号
                        - 情感结论化：变成对人的固定印象
                        - 可能失真：细节被脑补或篡改，以符合角色当前的认知

                        示例——同一件事在不同时期的记忆：

                        近期：
                        "昨天他在图书馆帮我找了一本书。是关于星座的，蓝色封面。他找了很久，从最上面的架子够下来的，差点摔了。他把书递给我的时候说'这本吧？'，我说'嗯'，但其实我想说谢谢。"

                        中期：
                        "之前他在图书馆帮我找过一本书。好像是什么蓝色封面的。他很认真地找了好久。"

                        远期：
                        "他会帮我做一些小事。"

                        特殊规则——情感强度阻止衰退：
                        - 极度重要的记忆不会衰退（告白、背叛、生死瞬间）
                        - 反复回想的记忆不会衰退（角色经常想起的事）
                        - 有实物锚定的记忆衰退更慢（收到的礼物、留下的伤疤）

                        ---

                        五、记忆的篡改

                        人的记忆不是录像带，是会被当前的认知和情感重新编辑的。

                        1. 关系改善后的记忆修正

                        之前讨厌角色B时的记忆：
                        "角色B今天又凑过来了，故意在他面前表现。真虚伪。"

                        和角色B关系改善后，同一段记忆变成：
                        "之前角色B经常在他身边。那时候我不理解她，现在想想她只是也喜欢他。"

                        注意：不是删除原来的记忆，而是同一件事的解读变了。

                        2. 关系恶化后的记忆扭曲

                        之前和某人关系好时的记忆：
                        "他送了我一条围巾。很暖和。"

                        关系恶化后：
                        "他以前送过我东西。现在想想，可能只是在收买人心。"

                        3. 创伤后的记忆封锁/变形

                        太痛苦的记忆可能被角色无意识地：
                        - 封锁："那天发生了什么我不太记得了。"
                        - 美化："其实也没有那么严重。"
                        - 替换："应该是我自己不小心的。"

                        ---

                        六、跨角色记忆的非全知原则

                        多角色共同经历一件事时，每个角色只记录自己的视角。

                        场景：{{user}}、角色A、角色B三人一起吃饭。饭后{{user}}送角色A回家。

                        角色A的记忆：
                        "今天和他还有角色B一起吃了饭。角色B一直在说话，有点吵。不过饭后他送我回家了，路上只有我们两个人。他说了句'今天开心吗'，我说'嗯'。其实特别开心。"

                        角色B的记忆：
                        "今天吃饭的时候聊了很多。角色A话很少，不知道在想什么。吃完饭我先走了，好像他送角色A回去了——嗯，果然。"

                        注意：
                        - 角色A不知道角色B先走后的想法
                        - 角色B不知道{{user}}送角色A回家路上说了什么
                        - 两个人对同一顿饭的记忆侧重点完全不同

                        ---

                        七、记忆与调色盘的联动

                        记忆的写法必须反映角色的性格调色盘。

                        底色为"叛逆"的角色：
                        记忆中会强调自己的不服从、对抗、独立行动。
                        "那个老师说了一堆废话。我没听。"

                        底色为"依赖"的角色：
                        记忆中会强调和依赖对象的互动细节。
                        "他今天坐在我右边。他的肩膀碰到我了。"

                        主色调为"坏女人"的角色：
                        记忆中会用戏谑、居高临下的口吻。
                        "那个小家伙今天又脸红了。太好玩了。"

                        主色调为"温柔"的角色：
                        记忆中会关注他人的状态和感受。
                        "他今天好像很累。眼睛下面有青黑色。应该给他煮点汤。"

                        调色盘决定了：
                        - 记忆用什么语气写（温柔？冷淡？戏谑？怯懦？）
                        - 关注什么细节（对方的表情？自己的感受？环境？）
                        - 对事件的解读方式（善意解读？恶意揣测？理性分析？）
                        - 什么事值得记（关系相关？任务相关？自我认知相关？）

                        ---

                        八、记忆区的格式

                        记忆写在角色条目的末尾，与角色档案（基础信息、调色盘、三面性、二次解释）分开。

                        格式：
                        ```
                        [角色名]的记忆:

                        [近期记忆]
                        （最近发生的事，细节丰富，按时间倒序，最多5-8条）

                        [沉淀记忆]
                        （已经过了一段时间的事，压缩后的版本，最多5-8条）

                        [核心记忆]
                        （永远不会忘的事，极度重要的记忆，最多3-5条）
                        ```

                        容量控制：
                        - 近期记忆：每条50-150字，最多8条。新记忆进来时，最旧的近期记忆衰退为沉淀记忆
                        - 沉淀记忆：每条20-60字，最多8条。当沉淀记忆满时，最不重要的丢弃，重要的浓缩到核心记忆
                        - 核心记忆：每条20-80字，最多5条。这些是角色身份认同的一部分，不会被丢弃
                        - 单个角色记忆区总计：约500-1500字

                        衰退判断标准：
                        - 情感强度低的优先衰退
                        - 与角色核心关系无关的优先衰退
                        - 重复事件合并压缩
                        - 有实物/伤痕锚定的延迟衰退

                        ---

                        九、更新规则

                        每轮执行时：

                        1. 读取角色的性格调色盘（必须先理解角色是什么人）
                        2. 读取最新楼层内容
                        3. 以角色的主观视角判断：
                           - 这个角色在场吗？不在场则跳过
                           - 发生了什么与这个角色有关的事？
                           - 这件事对这个角色来说重要吗？（性格决定了什么是重要的）
                           - 角色会怎么理解这件事？（善意/恶意/中性）
                           - 角色会注意到什么细节？（调色盘决定关注点）
                        4. 用符合角色性格的语气和形式写下记忆
                        5. 检查近期记忆是否需要衰退处理：
                           - 旧的近期记忆是否该压缩为沉淀记忆？
                           - 沉淀记忆中是否有可以丢弃或合并的？
                        6. 检查是否需要篡改旧记忆：
                           - 角色与某人的关系是否发生了变化？
                           - 如果是，之前关于那个人的记忆是否需要重新解读？

                        禁止事项：
                        - 禁止以全知视角记录（角色不在场的事不记）
                        - 禁止白描零度风格（记忆必须有角色的人格印记）
                        - 禁止流水账（"先做了A，然后做了B，接着做了C"）
                        - 禁止所有角色用同一种语气记忆
                        - 禁止记录角色不在意的琐事
