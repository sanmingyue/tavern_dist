      - 名称: ZOD结构脚本
        id: 5198f8be-63d9-4956-a8fe-75fa4bc83b38
        启用: true
        类型: 脚本
        内容: |-
          import { registerMvuSchema } from 'https://testingcf.jsdelivr.net/gh/StageDog/tavern_resource/dist/util/mvu_zod.js';

          /* ═══════════════════ 枚举定义 ═══════════════════ */

          // 修为境界
          const 修为境界枚举 = z.enum([
            '',
            '凡人',
            '炼气一层','炼气二层','炼气三层','炼气四层','炼气五层',
            '炼气六层','炼气七层','炼气八层','炼气九层','炼气十层',
            '筑基前期','筑基中期','筑基后期','筑基大圆满',
            '金丹前期','金丹中期','金丹后期','金丹大圆满',
            '元婴前期','元婴中期','元婴后期','元婴大圆满',
            '化神前期','化神中期','化神后期','化神大圆满',
            '炼虚前期','炼虚中期','炼虚后期','炼虚大圆满',
            '合体前期','合体中期','合体后期','合体大圆满',
            '大乘前期','大乘中期','大乘后期','大乘大圆满',
            '渡劫前期','渡劫中期','渡劫后期','渡劫大圆满',
            '真仙境一重天','真仙境二重天','真仙境三重天','真仙境四重天','真仙境五重天',
            '真仙境六重天','真仙境七重天','真仙境八重天','真仙境九重天','真仙境十重天',
            '真仙境十重天大圆满',
          ]);

          // 剑心境界（剑修专属，非剑修为空）
          const 剑心境界枚举 = z.enum([
            '','入剑','剑意','剑势','剑心','剑心通明','无我','无剑','无我无剑'
          ]);

          // 丹道境界（丹修专属，非丹修为空）
          const 丹道境界枚举 = z.enum([
            '','炼精化气','炼气化神','炼神还虚','炼虚合道'
          ]);

          // 场景类型
          const 场景类型枚举 = z.enum([
            '','野外','宗门','城镇','秘境','战场','海域','地府','王朝','商会','酒家','禁地'
          ]);

          // 当前事件
          const 当前事件枚举 = z.enum([
            '','宗门大比','秘境','历练任务','境界突破','炼器','炼丹','奇遇','机缘',
            '宗门战争','拍卖会','阵法','符箓','驭兽','狩猎','宗门职务'
          ]);

          // 当前状态
          const 当前状态枚举 = z.enum([
            '','正常','受伤','重伤','濒死','修炼','闭关','战斗','突破在即','突破中','中毒','昏迷','被困','疗伤','赶路'
          ]);

          /* ═══════════════════ Schema ═══════════════════ */

          export const Schema = z.object({
            /* ────── 世界定位 ────── */
            世界定位: z.object({
              当前大域: z.string().prefault(''),
              当前区域: z.string().prefault(''),
              当前场景: z.string().prefault(''),
              场景类型: 场景类型枚举.prefault(''),
              当前事件: 当前事件枚举.prefault(''),
              日期: z.string().prefault(''),
              天气: z.string().prefault(''),
            }).prefault({}),

            /* ────── 在场人物（境界+势力+年龄） ────── */
            在场人物: z.record(
              z.string().describe('角色名/灵兽名'),
              z.object({
                境界: z.string().prefault(''),
                势力: z.string().prefault(''),
                年龄: z.string().prefault(''),
              }).prefault({})
            ),

            /* ────── 用户信息 ────── */
            用户信息: z.object({
              姓名: z.string().prefault(''),
              性别: z.string().prefault(''),
              年龄: z.coerce.number().prefault(0),
              灵根: z.string().prefault(''),
              体质: z.string().prefault(''),
              称号: z.string().prefault(''),
              修真百艺: z.array(z.string()).prefault([]),
              修为境界: 修为境界枚举.prefault(''),
              修炼进度: z.coerce.number().transform(v => _.clamp(v, 0, 100)).prefault(0),
              所属势力: z.string().prefault(''),
              当前状态: 当前状态枚举.prefault(''),
              剑心境界: 剑心境界枚举.prefault(''),
              丹道境界: 丹道境界枚举.prefault(''),
              宗门贡献: z.coerce.number().prefault(0),

              /* 背包 */
              背包: z.object({
                灵石: z.object({
                  下品: z.coerce.number().prefault(0),
                  中品: z.coerce.number().prefault(0),
                  上品: z.coerce.number().prefault(0),
                  极品: z.coerce.number().prefault(0),
                }).prefault({}),
                丹药: z.record(
                  z.string().describe('丹药名'),
                  z.object({
                    数量: z.coerce.number().prefault(1),
                    品级: z.string().prefault('凡丹·普品'),
                    描述: z.string().prefault(''),
                  }).prefault({})
                ).transform(data => _.pickBy(data, ({ 数量 }) => 数量 > 0)),
                材料: z.record(
                  z.string().describe('材料名'),
                  z.object({
                    数量: z.coerce.number().prefault(1),
                    品级: z.string().prefault(''),
                  }).prefault({})
                ).transform(data => _.pickBy(data, ({ 数量 }) => 数量 > 0)),
                杂物: z.record(
                  z.string().describe('物品名'),
                  z.object({
                    数量: z.coerce.number().prefault(1),
                    描述: z.string().prefault(''),
                  }).prefault({})
                ).transform(data => _.pickBy(data, ({ 数量 }) => 数量 > 0)),
              }).prefault({}),

              /* 功法 */
              功法: z.object({
                主修功法: z.object({
                  名称: z.string().prefault(''),
                  品阶: z.string().prefault(''),
                  总层数: z.coerce.number().prefault(0),
                  当前层数: z.coerce.number().prefault(0),
                  描述: z.string().prefault(''),
                }).prefault({}),
                辅修功法: z.record(
                  z.string().describe('功法名'),
                  z.object({
                    品阶: z.string().prefault(''),
                    总层数: z.coerce.number().prefault(1),
                    当前层数: z.coerce.number().prefault(1),
                    描述: z.string().prefault(''),
                  }).prefault({})
                ),
                术法: z.record(
                  z.string().describe('术法名'),
                  z.object({
                    熟练度: z.string().prefault('入门'),
                    描述: z.string().prefault(''),
                  }).prefault({})
                ),
              }).prefault({}),

              /* 法宝 */
              法宝: z.object({
                本命法宝: z.object({
                  名称: z.string().prefault(''),
                  品阶: z.string().prefault(''),
                  描述: z.string().prefault(''),
                }).prefault({}),
                防御法宝: z.object({
                  名称: z.string().prefault(''),
                  品阶: z.string().prefault(''),
                  描述: z.string().prefault(''),
                }).prefault({}),
                辅助法宝: z.record(
                  z.string().describe('法宝名'),
                  z.object({
                    品阶: z.string().prefault('法器'),
                    描述: z.string().prefault(''),
                  }).prefault({})
                ),
                未装备法宝: z.record(
                  z.string().describe('法宝名'),
                  z.object({
                    品阶: z.string().prefault('法器'),
                    描述: z.string().prefault(''),
                  }).prefault({})
                ),
              }).prefault({}),

              /* 灵兽 */
              灵兽: z.record(
                z.string().describe('灵兽名'),
                z.object({
                  品种: z.string().prefault(''),
                  境界: z.string().prefault(''),
                  描述: z.string().prefault(''),
                }).prefault({})
              ),

              /* 异火 */
              异火: z.record(
                z.string().describe('异火名'),
                z.object({
                  品级: z.string().prefault(''),
                  属性: z.string().prefault(''),
                  描述: z.string().prefault(''),
                }).prefault({})
              ),
            }).prefault({}),

            /* ────── 男性好感度（兄弟情义线） ────── */
            男性好感度: z.record(
              z.string().describe('角色名'),
              z.object({
                好感度: z.coerce.number().transform(v => _.clamp(v, -1000, 1000)).prefault(0),
                关系阶段: z.string().prefault('素不相识'),
                年龄: z.string().prefault(''),
                重要事件: z.string().prefault(''),
              }).prefault({})
            ),

            /* ────── 女性好感度（友情→爱情线） ────── */
            女性好感度: z.record(
              z.string().describe('角色名'),
              z.object({
                好感度: z.coerce.number().transform(v => _.clamp(v, -1000, 1000)).prefault(0),
                关系阶段: z.string().prefault('素不相识'),
                年龄: z.string().prefault(''),
                重要事件: z.string().prefault(''),
              }).prefault({})
            ),

            /* ────── 剧情标记 ────── */
            剧情标记: z.record(z.string(), z.string()),
          });

          $(() => {
            registerMvuSchema(Schema);
          });

