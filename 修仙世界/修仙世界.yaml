                        条件分支（根据变量决定加载哪些条目）：
                        {"template_id":"entry_selector_v1","variables":[{"name":"phase","path":"story_phase","default":"early"}],"rules":[{"when":"phase === 'late'","include_entries":["终章"]}],"fallback_entries":["殷冬雪"]}

                        其他可选字段：
                        - decorators: ["@@preprocessing"] — 给 Controller 条目添加装饰器
                        - skip_floor_zero: true — 第一条消息时跳过控制器
                        - set_variables: [{"key":"level","value":3,"scope":"local"}] — 设置酒馆变量
                        - activate_entries: [{"entry":"通用设定"}] — 激活非 EW 条目（不加前缀）
                        - inject_text: ["注意当前是第三章"] — 直接注入文本到上下文

                        === 无需输出的字段（插件自动处理）===
                        version / flow_id / status / priority / enabled / diagnostics / EW/Dyn/ 前缀

                        === 最简完整输出示例 ===
                        {"operations":{"worldbook":{"desired_entries":[{"name":"殷冬雪","content":"角色当前状态..."}],"remove_entries":[]},"controller_model":{"template_id":"entry_selector_v1","fallback_entries":["殷冬雪"]}}}
