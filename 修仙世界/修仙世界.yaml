                        其他可选字段：
                        - decorators: ["@@preprocessing"] — 给 Controller 条目添加装饰器
                        - skip_floor_zero: true — 第一条消息时跳过控制器
                        - set_variables: [{"key":"level","value":3,"scope":"local"}] — 设置酒馆变量
                        - activate_entries: [{"entry":"通用设定"}] — 激活非 EW 条目（不加前缀）
                        - inject_text: ["注意当前是第三章"] — 直接注入文本到上下文

                        === 无需输出的字段（插件自动处理）===
                        version / flow_id / status / priority / enabled / diagnostics / EW/Dyn/ 前缀

                        === 最简完整输出示例 ===
