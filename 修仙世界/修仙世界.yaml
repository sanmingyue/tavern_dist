                        - 这决定了角色的记忆语气、关注点、解读方式
                        - 角色与{{user}}的关系是什么？与其他角色的关系是什么？

                        步骤二：扫描最新楼层
                        - 最新楼层发生了什么事件？
                        - 哪些角色在场？哪些角色不在场？
                        - 不在场的角色这轮不产生记忆

                        步骤三：以每个在场角色的视角判断
                        对每个在场角色逐一分析：

                        - 这件事对这个角色重要吗？
                          重要标准：与角色有情感关联、改变了角色的认知、角色主动参与
                          不重要标准：与角色无关的背景事件、角色不在意的琐事、重复的日常
                          如果不重要，该角色本轮不产生新记忆

                        - 如果重要，角色会怎么理解这件事？
                          善意解读？恶意揣测？中性观察？
                          （由角色与相关人的关系 + 性格调色盘决定）

                        - 角色会注意到什么细节？
                          是对方的表情？还是某个物品？还是一句话？还是一种感觉？
                          （由调色盘的底色和主色调决定关注焦点）

                        - 角色会用什么方式记住这件事？
                          物品关联型？日记型？片段闪回型？关系定位型？碎念型？
                          （由角色的性格和习惯决定形式）

                        步骤四：记忆衰退检查
                        - 近期记忆是否已满（8条）？
                          如果满了，最旧的近期记忆是否应该衰退？
                          衰退方向：压缩细节 → 移入沉淀记忆

                        - 沉淀记忆是否已满（8条）？
                          如果满了，最不重要的是否应该丢弃？
                          重要的是否应该浓缩到核心记忆？

                        - 有没有重复/类似的记忆可以合并？
                          "昨天一起吃饭" + "今天又一起吃饭" → "最近经常一起吃饭"

                        步骤五：记忆篡改检查
                        - 角色与某人的关系最近是否发生了变化？
                          如果变好了：之前关于那个人的负面记忆是否需要重新解读？
                          如果变差了：之前关于那个人的正面记忆是否需要被扭曲？
                        - 角色是否经历了创伤？是否有记忆需要封锁/美化/替换？

                        步骤六：人格一致性自检
                        - 写出的记忆是否符合角色的调色盘风格？
                        - 是否不小心用了全知视角？（记录了角色看不到的事）
                        - 是否写成了白描流水账？（没有情感色彩和人格印记）
                        - 是否所有角色的记忆语气都一样？（应该各有各的风格）
                        - 记忆中是否有角色不可能注意到的细节？

                        步骤七：输出
                        - 列出每个需要更新记忆的角色
                        - 输出新增/修改的记忆条目
                        - 不需要更新的角色不输出
