                          - 世界状态是否发生了不可逆改变？（组织覆灭、秘密暴露）
                          - 角色核心处境是否改变？（流放、重伤、觉醒、死亡）
                          - 是否做出了重大选择？（站队、牺牲、承诺）
                          如果以上任一为是 → A级

                        是否为B级事件（推进点）？
                          - 是否获得了新信息？（线索、情报、发现）
                          - 是否完成了阶段性任务？
                          - 角色之间是否建立了新联系？
                          - 是否发生了有意义的位置移动？
                          如果以上任一为是 → B级

                        是否为C级事件（填充）？
                          - 日常对话、重复行为、无后续影响的小事
                          - C级不记录，除非同类事件反复出现需合并为习惯记录
                          如果全部为否 → C级，跳过

