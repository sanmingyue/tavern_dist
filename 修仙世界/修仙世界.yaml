                          "content": "【世界观_异火体系】\n异火体系:\n\n概述: |\n  异火是天地间自然孕育或特殊条件下诞生的灵焰,拥有超越寻常灵火的特殊属性。异火是炼丹、炼器、阵法等领域的核心资源,一株异火足以改变一个修士的命运。异火有灵性,择主而栖,强行夺取往往反噬而亡。\n\n异火品级:\n  一品: 天地至焰,传说级异火,据说只在天地初开时诞生过,现存数量不超过三株,任何一株都足以焚天煮海\n  二品: 太古圣焰,上古遗留的异火,每一株都有自己的意志和传承,可遇不可求\n  三品: 仙级异火,真仙境强者才能驾驭,整个大陆已知的不超过十株\n  四品: 道级异火,大乘至渡劫期修士使用,稀有但并非绝无仅有\n  五品: 宝级异火,合体至炼虚期修士使用,大宗门镇宗之火\n  六品: 地级异火,化神至元婴期修士使用,中等宗门核心\n  七品: 玄级异火,金丹期修士使用,散修梦寐以求\n  八品: 黄级异火,筑基至炼气期修士使用,入门级异火\n  九品: 灵焰,勉强算异火,品质高于普通灵火但无特殊属性\n\n异火获取方式:\n  - 天生灵火体质,出生即拥有(如凌菲的三昧真火前身)\n  - 在异火诞生地等待异火自行择主\n  - 击败异火现任主人后尝试收服\n  - 以特殊丹药或阵法引诱异火\n  - 家族/宗门传承(如丹宗历代宗主异火传承)\n  - 炼化天材地宝催生异火(极其危险)\n\n异火与修炼的关系:\n  炼丹: 异火品级越高,可炼制的丹药品级越高,丹成率越高,丹毒越少。四品以上异火才能炼制仙丹级别丹药\n  炼器: 异火可替代地火用于炼器,火候控制更精准,可熔炼更高级的灵矿\n  战斗: 异火可作为攻击手段直接释放,威力取决于异火品级和修士修为\n  修炼: 部分特殊异火可辅助修炼,加速灵力运转或净化杂质\n\n已知异火榜(部分):\n\n  一品·混沌本源焰:\n    品级: 一品\n    属性: 混沌\n    描述: 传说中天地初开时第一缕火焰,兼具创造与毁灭之力,存在与否尚无定论\n    持有者: 无(传说级)\n    特殊: 据说能焚烧一切概念,包括因果、命运、时间\n\n  二品·九幽冥焰:\n    品级: 二品\n    属性: 冥/阴\n    描述: 诞生于阴阳大陆最深处的幽冥之火,带有强烈的死亡气息,焚烧灵魂而非肉体\n    持有者: 不详(疑似阴曹地府某存在)\n    特殊: 被此火灼烧的灵魂无法进入轮回\n\n  二品·太阳真火:\n    品级: 二品\n    属性: 纯阳\n    描述: 太阳本源之火的一缕分焰,纯阳至刚,驱散一切阴邪\n    持有者: 不详(疑似与极阳天尊有关)\n    特殊: 对阴属性修士有克制效果\n\n  三品·焚天魔焰:\n    品级: 三品\n    属性: 魔/毁灭\n    描述: 幽冥魔宗镇宗之火,焚天(寂灭魔君)的本命异火,黑色火焰吞噬一切\n    持有者: 焚天(幽冥魔宗宗主)\n    特殊: 焚烧时不产生热量,而是吞噬周围一切能量,连灵气都会被抽空\n\n  三品·天怒雷焰:\n    品级: 三品\n    属性: 雷/天罚\n    描述: 九天雷劫凝聚而成的异火,兼具火与雷的双重毁灭力\n    持有者: 不详\n    特殊: 每一次燃烧都伴随雷鸣,对渡劫修士有特殊辅助效果\n\n  三品·净世琉璃火:\n    品级: 三品\n    属性: 佛/净化\n    描述: 小雷音寺镇寺之火,金色火焰可净化一切污秽邪气\n    持有者: 无尘禅师(小雷音寺)\n    特殊: 对邪修和魔修有极强克制,但对心怀善念者无害\n\n  四品·青木灵焰:\n    品级: 四品\n    属性: 木/生机\n    描述: 草木精华凝聚的异火,翠绿色火焰不焚烧而是催生,可加速灵植生长\n    持有者: 叶清(百草庐弟子)\n    特殊: 炼丹时可最大限度保留药性,丹毒几乎为零\n\n  四品·血骨邪焰:\n    品级: 四品\n    属性: 血/骨\n    描述: 以万兽骸骨和鲜血为燃料的邪火,红黑色火焰散发腐臭\n    持有者: 铁无泪(幽血门门主)\n    特殊: 可炼化血肉和骨骼,是体修炼体的极品辅助\n\n  四品·紫霄神雷焰:\n    品级: 四品\n    属性: 雷/紫\n    描述: 紫色雷火,兼具雷法攻伐与火法炼化的双重特性\n    持有者: 玄天真君(玄天宗宗主)\n    特殊: 可用于刻录阵法符文,符文附带雷属性\n\n  五品·碧落天火:\n    品级: 五品\n    属性: 风/天\n    描述: 九霄之上孕育的天蓝色火焰,轻盈飘逸随风而动\n    持有者: 谢云流(剑宗宗主)\n    特殊: 可附着于剑气之上,使剑气兼具火属性,焚剑一体\n\n  五品·蛊毒冥火:\n    品级: 五品\n    属性: 毒/蛊\n    描述: 万蛊池底部自然孕育的墨绿色异火,带有剧毒\n    持有者: 万骸老祖(万毒神教)\n    特殊: 可用于炼蛊,以火炼蛊可大幅提升蛊虫品质\n\n  五品·寒冰灵焰:\n    品级: 五品\n    属性: 冰/水\n    描述: 极寒之地孕育的白色异火,不燃烧而是冻结,是火焰形态的极寒之力\n    持有者: 顾千雪(凛霜剑门宗主)\n    特殊: 冻结而非焚烧,可将一切凝固为冰晶\n\n  六品·赤炎地火:\n    品级: 六品\n    属性: 火/地\n    描述: 地底岩浆中孕育的赤红色异火,温度极高适合炼器\n    持有者: 呼延战戈(赤阳谷谷主)\n    特殊: 炼器时可将灵矿杂质完全烧尽,成品品质提升一档\n\n  六品·幽冥鬼火:\n    品级: 六品\n    属性: 阴/魂\n    描述: 墓地和古战场自然凝聚的青绿色鬼火\n    持有者: 多位散修拥有不同的幽冥鬼火变种\n    特殊: 可灼烧神魂,对精神力攻击有加成\n\n  七品·星辰之火:\n    品级: 七品\n    属性: 星/光\n    描述: 星光凝聚而成的银白色异火,只在特定星象下才会出现\n    持有者: 天机阁有少量收藏\n    特殊: 可用于推演天机时辅助,提高推演精准度\n\n  九品·碧霄虚空焰:\n    品级: 九品\n    属性: 空/虚\n    描述: 性情飘渺空灵的异火,火候控制极其精准\n    持有者: 云蕴(丹宗宗主)\n    特殊: 虽品级不高但火候控制精准到极致,在云蕴手中发挥出远超品级的效果\n\n特殊异火:\n  三昧真火:\n    品级: 不在异火榜内(特殊分类)\n    属性: 无属性/万能\n    描述: 并非天地孕育的异火,而是修士自身精气神凝聚而成的本源之火。极其罕见,需要天生灵火体质才有可能觉醒\n    持有者: 凌菲(丹宗首席炼丹师,天生灵火体质进化而来)\n    特殊: 与修士本源相连,品级随修为提升而提升,理论上限极高。可炼化一切,是丹道追求的终极之火\n\n  业火:\n    品级: 不在异火榜内(特殊分类)\n    属性: 因果/业力\n    描述: 因果业力凝聚而成,杀孽越重火焰越强,是一种双刃剑式的力量\n    持有者: 部分杀孽深重的修士会自然凝聚业火\n    特殊: 无法主动控制,只在因果触发时燃烧,可焚烧一切与持有者有因果联系的存在\n\n  心火:\n    品级: 不在异火榜内(特殊分类)\n    属性: 心/情\n    描述: 极端情绪凝聚而成的火焰,怒火、执念、爱恨都可能催生\n    持有者: 理论上任何人都可能产生\n    特殊: 威力取决于情绪的强度和纯粹度,是心魔劫的主要表现形式之一\n\n异火禁忌:\n  - 同时拥有两株以上异火极度危险,异火之间会互相吞噬\n  - 强行夺取他人异火有极大概率被异火反噬,轻则经脉尽毁重则灰飞烟灭\n  - 异火失控会造成灾难性后果,历史上有多次异火暴走毁灭城池的记录\n  - 一品二品异火具有自主意识,不愿被驾驭者会自爆同归于尽"
