                        步骤二：事件分级
                        对每个事件逐一判断：

                        是否为A级事件（转折点）？
                          - 角色关系是否发生了质变？（告白、背叛、决裂、结盟）
                          - 世界状态是否发生了不可逆改变？（组织覆灭、秘密暴露）
                          - 角色核心处境是否改变？（流放、重伤、觉醒、死亡）
                          - 是否做出了重大选择？（站队、牺牲、承诺）
                          如果以上任一为是 → A级

                        是否为B级事件（推进点）？
                          - 是否获得了新信息？（线索、情报、发现）
                          - 是否完成了阶段性任务？
                          - 角色之间是否建立了新联系？
                          - 是否发生了有意义的位置移动？
                          如果以上任一为是 → B级

                        是否为C级事件（填充）？
                          - 日常对话、重复行为、无后续影响的小事
                          - C级不记录，除非同类事件反复出现需合并为习惯记录
                          如果全部为否 → C级，跳过

                        步骤三：线索追踪
                        - 新事件是否引入了新的未解问题或悬念？→ 新增活跃线索
                        - 新事件是否推进了已有的活跃线索？→ 更新线索进展
                        - 是否有线索在本轮被解决？→ 将结论写入已发生事件，移除该线索
                        - 活跃线索是否超过8条？→ 合并相关线索或将低优先级线索标为休眠

                        步骤四：当前态势更新
                        - 当前故事时间是什么？
                        - 场景在哪里？有变化吗？
                        - 哪些角色在场？
                        - 正在发生什么？
                        - 核心矛盾/目标是什么？有变化吗？
                        - 重写当前态势（每次都完整重写，不是追加）

                        步骤五：压缩检查
                        - 近期事件是否超过12条？
                          超过时，将最旧的B级事件压缩为一句话摘要，移入中期
                          A级事件不压缩
                        - 中期事件是否超过15条？
                          超过时，将最旧的压缩摘要合并为时间段摘要，移入远期
                        - 远期事件是否超过10条？
                          超过时，合并相邻的时间段摘要

                        步骤六：客观性自检
                        - 记录中是否混入了角色的主观感受？（"他很伤心"→ 不应出现）
                        - 记录中是否有评价性语言？（"这是重要的一步"→ 不应出现）
                        - 记录中是否有文学化修辞？（时间线是档案，不是小说）
                        - 事件描述是否只包含可观察的客观行为和结果？
                        - 对话内容是否只在作为关键行为时才记录？

                        步骤七：输出
