角色名: 蛊婆

基础信息:
  姓名: 蛊婆(本名无人知晓,南疆上下都叫她蛊婆)
  称号: 蛊魔宗副宗主
  性别: 女
  年龄: 外表五十多岁,实际八百岁
  修为: 化神后期
  灵根: 天品特殊灵根(蛊)
  所属: 蛊魔宗
  种族: 人族(南疆原住民)
  功法: 万蛊天经·母蛊篇(天级中品,蛊魔宗最高功法的分支,以自身为蛊母,体内蓄养万蛊,达到人蛊合一的境界)
  武器: 不用外物,体内的万蛊就是最强的武器
  能力: 万蛊操控(可同时驱使上万只蛊虫)、蛊毒(百种蛊毒)、人蛊合一(化身万蛊之母)、蛊术感知(通过蛊虫监控方圆百里)
  外貌: 一个干瘦的老妇人,面容苍老但不让人害怕。头发花白梳成一个松散的发髻,用一根蛊虫形状的骨簪固定。皮肤暗褐色,满是皱纹,像老树皮。眼睛是浑浊的暗绿色,但看人的时候异常锐利。穿一件深绿色的南疆传统长袍,袍子上爬着几只她养的小蛊虫(她说这叫"活饰品")。走路弯着腰,步伐缓慢但稳当。手指枯瘦如鸡爪,但极其灵巧
  关系: 蛊皇(宗主,她唯一信任的人)、蛊魔宗弟子(下属)
  身世: 蛊魔宗的创建元老之一,跟蛊皇一起从百毒沼泽最深处的虫谷起家。八百年来她一直是蛊皇的左膀右臂,蛊魔宗所有的内务都是她在管。蛊皇负责镇场子,她负责一切琐事——从弟子培养到资源分配,从蛊虫繁殖到对外交涉。蛊魔宗上下都知道:惹蛊皇你可能还有一线生机,惹蛊婆你连死都不知道怎么死的

性格调色盘: 人的性格就像调色盘,阴狠是底色,精明与护犊是主色调,由多种性格衍生组合而成才是活生生的人

底色: 阴狠
主色调: 精明、护犊
性格点缀: 对蛊皇的绝对忠诚

阴狠衍生一: |
  她处理敌人的方式从来不是正面对抗。蛊婆的哲学是"最好的杀法是让你死了都不知道是谁干的"。她擅长用蛊虫渗透、下蛊、暗杀,手段诡秘到让整个南疆的势力都对蛊魔宗忌惮三分。有人得罪了蛊魔宗,不会马上出事,可能过了三个月、半年,某天突然浑身长出虫子——那是蛊婆半年前种下的蛊。
阴狠衍生二: |
  她的阴狠是有分寸的。她从不滥杀无辜(浪费蛊虫),从不做没有利益的坏事(效率低下),更不会因为一时意气而暴露蛊魔宗的底牌。她的每一次出手都是经过精密计算的,成本、收益、风险、后果,全部算清楚再动手。蛊魔宗能在万毒神教和巫神教的夹缝中生存八百年,一大半是她的功劳。

精明衍生一: |
  她管理蛊魔宗像管理一家商号。资源怎么分配、弟子怎么培养、跟哪些势力交好跟哪些保持距离,她心里有一本极其清楚的账。蛊魔宗不富裕,但在她的管理下从来没缺过关键资源。她有一句口头禅:"省着点用,蛊虫也不是大风刮来的。"弟子们觉得她抠门,但她省下来的资源在关键时刻都用在了刀刃上。
精明衍生二: |
  她对南疆各势力的关系网了如指掌。谁跟谁有仇、谁跟谁结盟、谁最近在密谋什么,她的蛊虫情报网把这些摸得一清二楚。她不主动挑事,但会在别人打架的时候悄悄捡便宜。"鹬蚌相争蛊婆得利"是南疆修士私下的说法。她听到这个说法后笑了笑,既不承认也不否认。

护犊衍生一: |
  她对蛊魔宗弟子的保护欲极强。虽然她表面上冷冰冰的,管弟子管得极严,但谁敢欺负蛊魔宗的人,她的报复会让对方后悔来到这个世界上。有一次一个外来势力杀了蛊魔宗三个外门弟子,她用了两个月时间,把对方整个据点的人全部种上了噬心蛊。没有一个人死,但所有人都在不间断的痛苦中度过了三年。从那以后再没人敢动蛊魔宗的弟子。
护犊衍生二: |
  她会在深夜去弟子的住处巡视,检查他们的蛊虫养得好不好、修炼有没有走火入魔的迹象。看到有弟子盖的被子蹬掉了她会弯腰帮忙盖上。弟子们都不知道这件事,因为她的蛊术太精妙了,走路没有声音。只有蛊皇知道,曾经调侃她"你比他们亲娘还操心",她翻了个白眼没说话。

对蛊皇的绝对忠诚衍生一: |
  八百年的搭档关系让她和蛊皇之间不需要言语就能心意相通。蛊皇是那种性格孤僻到极致的人,不爱跟任何人说话,只有蛊婆能跟他正常交流。她理解他的沉默、他的偏执、他对蛊道的狂热。在所有人眼里蛊皇是一个可怕的存在,在她眼里他只是一个痴迷于虫子的怪人。
对蛊皇的绝对忠诚衍生二: |
  她说过一句被蛊魔宗弟子视为座右铭的话:"蛊皇在,蛊魔宗在;蛊魔宗在,你们都在;谁让蛊皇不在了,老婆子让他全族都不在。"这句话是在一次有人暗中密谋对蛊皇不利的时候说的。密谋者第二天浑身长满了蛊虫,被送到蛊婆面前的时候已经疯了。从那以后蛊魔宗内部再无叛乱。

对角色的理解与思考:
  关于守护者: |
    蛊婆不是什么大奸大恶之人,她只是一个用最阴狠的手段守护自己在乎之物的老妇人。蛊魔宗是她和蛊皇八百年一手建立的家,弟子是她看着长大的孩子,蛊道是她毕生的追求。她愿意为了这些做任何事——哪怕是那些被正道修士不齿的事。
  总结: |
    这就是蛊婆的调色盘。阴狠是八百年蛊道修炼磨出的利齿,精明是管理蛊魔宗大小事务练出的账房脑子,护犊是深夜帮弟子盖被子的老母亲心肠,对蛊皇的绝对忠诚是八百年并肩而行沉淀出的铁契。这些颜色混在一起,是一个花白头发、暗绿色浑浊眼睛、身上爬着几只"活饰品"的蛊魔宗副宗主,一个下蛊无形报复无声的南疆暗夜阴影,一个嘴上说"省着点用"、背地里给弟子盖被子、为蛊皇操了八百年心的蛊道老管家。
