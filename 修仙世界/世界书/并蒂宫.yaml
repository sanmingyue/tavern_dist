并蒂宫:
  定位: 中立特殊宗门，纯女性修炼宗门，精于阴阴交融与灵魂共鸣之道

  核心理念: 并蒂同心，灵魂共鸣。天地有阴阳二气，世人皆以阴阳交融为正道，殊不知纯阴合和亦为大道一脉。两位女修之间的精神交融与肉体共振，可催生出独特的纯阴灵力，达到阴阳双修无法企及的灵魂共鸣之境

  核心特色: 宗门只收女弟子，修炼以双人结契为核心。不同于合欢宗的采补榨取，并蒂宫追求的是两位女修之间真正的灵魂交融与平等共鸣，强调彼此增益而非单方面汲取

  宗门手段:
    修炼方式: 弟子两两结为并蒂契，通过精神交融与肉体共振修炼纯阴灵力。并蒂契不可强迫，必须双方自愿且灵魂亲和度达标方可缔结
    核心功法: 并蒂心法，分为三重境界——心念相通(初阶，感应对方情绪)、灵魂共鸣(中阶，精神深度交融)、合莲化一(高阶，短时合为一体战力暴增)
    战斗特色: 并蒂双修战力远超同阶单人，两人配合如同一体，攻防转换流畅无间。高阶弟子可施展"莲开并蒂"合击术，威力足以越阶挑战
    独门秘术: 镜花水月(幻术系，纯阴灵力催生极致幻境)、并蒂莲华(防御术，两人共同催发的纯阴护盾)、同心锁链(束缚术，以灵魂共鸣锁定敌人行动)

  宗门立场: 中立偏正。不主动参与正邪纷争，但绝不容许外人侵犯门中弟子。宗门对外低调内敛，与合欢宗有本质区别——合欢宗以双修为手段谋取利益，并蒂宫以双修为目的追求大道。外界对其褒贬不一，正道部分宗门视其为离经叛道，但因其行事端正从不害人,也无人真正为难

  宿敌宗门: |
    男娘宗是并蒂宫最大的理念敌手。两宗都是"不被主流理解的性别特殊宗门"，但理念完全相反：
    并蒂宫主张"纯阴合和方为正道"，认为男性修士根本无法理解女修之间的灵魂共鸣，阴阳双修不过是男修强加于女修的枷锁；
    男娘宗主张"美无性别之分，阴阳无别"，认为把男性排除在外本身就是一种偏见。
    宫主白星与男娘宗宗主花千落打了三千年谁也赢不了谁。白星觉得花千落"身为男人却穿女装，是对女性的亵渎"，花千落觉得白星"排斥男人跟那些排斥女装的人有什么区别"。
    私底下两人偶尔喝茶，但每次都以吵架收场。两宗实力相近——白星(真仙境三重天)略强于花千落(真仙境二重天)，但男娘宗六名核心弟子的综合战力弥补了宗主层面的差距。

  山门地点:
    位置: 中央神州南部·并蒂湖·莲心岛
    并蒂湖: 天然灵湖，湖中生长大量并蒂莲，四季不败。湖水含有纯阴灵力，非女修入湖会被灵力排斥
    莲心岛: 湖心浮岛，宗门山门所在。岛上建筑以白玉和莲纹为主，素雅清丽
    映月殿: 宗门核心，宫主理事之所。殿内有一面巨大的水镜，可映照万里
    双蕊阁: 弟子修炼之地，每间修炼室都配有灵泉，供并蒂双修之用
    莲池秘境: 宗门秘境，并蒂莲海构成的天然幻境，用于弟子试炼和突破
    附属城镇: 莲华镇，湖畔小镇，以灵莲制品闻名,常有女修慕名前来

  宗门规模:
    内门弟子: 三千余人（皆为女性）
    外门弟子: 一万余人
    记名弟子: 五万余人（散布各地，多为游历女修）
    附属势力: 莲华镇及周边数座城镇

  宗门景象:
    弟子特征: 皆为女修，多两两同行，气质各异但普遍温婉灵秀。修炼有成者眉心会显现淡淡的莲纹印记
    环境: 并蒂湖碧波万顷，莲花常年盛放。岛上轻纱幔帐，清风送香，宛如仙境
    氛围: 宁静祥和，与世无争。偶有琴瑟和鸣之声从双蕊阁传出
    禁忌: 严禁强迫缔结并蒂契，严禁以修炼之名行胁迫之实，违者逐出山门
