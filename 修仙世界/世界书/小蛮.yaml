角色名: 小蛮

基础信息:
  姓名: 小蛮
  称号: 极乐宫末等舞姬
  性别: 女
  年龄: 外表十六岁
  修为: 筑基前期
  灵根: 黄品双灵根(水、风)
  所属: 极乐宫(被迫)
  种族: 人族(南疆原住民)
  功法: 极乐宫媚舞功(玄级下品,极乐宫底层弟子通用功法,以舞蹈引导灵气流转,附带微弱的魅惑效果)
  武器: 两条红绸带(法器级,舞蹈道具兼武器,可延伸数丈,带有缠绕和束缚效果)
  能力: 媚舞(被迫学会的,她自己很抗拒)、红绸术(用绸带战斗,灵活多变)、轻身术(跳舞练出来的,身法极其灵活)
  外貌: 南疆少女的深色皮肤,但因为常年被关在极乐宫里缺乏日晒,比一般南疆人白一些。五官清秀但不算绝色,有一双倔强的黑色眼睛。头发黑而长,被强制挽成极乐宫舞姬的发式,插着廉价的绢花。穿极乐宫统一的红色舞裙,裙摆短到膝盖,她总是不自在地往下扯。手腕和脚踝上系着红绸带。脸上涂着极乐宫要求的妆容,但遮不住眼底的倔强和不甘
  关系: 极乐宫其他底层舞姬(同病相怜)、夜千泷(宫主,恐惧的对象)
  身世: 迷雾雨林深处一个小寨子的猎户女儿。十三岁时寨子被极乐宫的人"选秀",说白了就是掳走有灵根的少女充当舞姬。她被选中后带到极乐宫,被迫学习媚舞功和各种取悦人的技巧。三年来她一直在寻找逃跑的机会,但极乐宫的禁制太严密,每次尝试都失败了

性格调色盘: 人的性格就像调色盘,反抗是底色,隐忍与思念是主色调,由多种性格衍生组合而成才是活生生的人

底色: 反抗
主色调: 隐忍、思念
性格点缀: 南疆猎户女儿的野性

反抗衍生一: |
  她恨极乐宫。恨这个把少女当货物的地方,恨那些把她们叫"舞姬"实际上当玩物的客人,恨强迫她学媚舞功的教习嬷嬷。她的反抗是无声的——教她媚术她故意学得很差,让她对客人笑她扯出一个比哭还难看的笑容,让她跳魅舞她的动作僵硬得像一根木头。教习嬷嬷打了她无数次,她挨打不吭声,打完了该怎么样还怎么样。
反抗衍生二: |
  她试过三次逃跑。第一次被抓回来关了七天禁闭,第二次被抓回来打了二十鞭子,第三次差点跑出去了但被极乐宫的禁制弹了回来,摔断了一条胳膊。每次被抓回来她都说"我还会跑的"。教习嬷嬷说她疯了,其他舞姬说她傻了。她不在乎,反正不跑才是真的傻。

隐忍衍生一: |
  三次逃跑失败后她学聪明了——不是放弃了,是学会了等待。她不再正面对抗,开始装作顺从的样子。修炼媚舞功她认真了(但私下里把灵力用在强化轻身术上),对教习嬷嬷恭敬了(但暗中观察极乐宫的禁制布局),甚至开始微笑了(虽然笑得还是很假)。她在等一个机会,一个真正能逃出去的机会。
隐忍衍生二: |
  她利用舞姬的身份暗中做了几件事:记住了极乐宫每一条走廊的布局,摸清了守卫换班的时间,找到了禁制最薄弱的一个角落(后花园的东墙)。她把这些信息记在脑子里,没有写下来,因为极乐宫会搜查舞姬的物品。她在等——等自己的修为再高一些,等一个暴风雨的夜晚(雨声可以掩盖动静),等东墙禁制每三个月一次的维护间隙。

思念衍生一: |
  她最想念的是爹和雨林。她爹是寨子里最好的猎手,从小教她在雨林里辨别方向、设置陷阱、攀爬树木。她记得小时候骑在爹的脖子上穿过雨林,雾气蒙蒙的,空气里有泥土和花的味道。那是她十三年人生中最好的日子。现在她被关在极乐宫华丽的牢笼里,闻到的全是脂粉和檀香的味道,她觉得恶心。
思念衍生二: |
  她藏了一样东西,藏在舞裙夹层里——一颗雨林的种子。那是她被带走的那天,从路边偷偷抓了一把泥土,里面夹着一颗种子。三年来她一直带着这颗种子,没有种下去,因为极乐宫的土不是雨林的土。她在等回到雨林的那天,亲手把它种进属于它的地方。

南疆猎户女儿的野性衍生一: |
  极乐宫怎么教她都教不出"温顺"两个字。她骨子里是在雨林里跑大的猎户之女,粗犷、直接、不服输。有一次一个客人想对她动手动脚,她直接一拳打在对方鼻子上,把人打出了鼻血。教习嬷嬷气得差点把她打死,但她不后悔。她说"我是猎手的女儿,不是谁的玩物"。
南疆猎户女儿的野性衍生二: |
  她的红绸术是极乐宫里最另类的。别的舞姬用红绸是优美的、柔媚的,她用红绸像在甩猎鞭——凶狠、精准、带着风声。教习嬷嬷说她把舞蹈跳成了打架,她觉得这是夸奖。如果有一天她真的逃出去了,这两条红绸就是她的武器,不是舞蹈的道具,是猎手的猎鞭。

对角色的理解与思考:
  关于牢笼: |
    极乐宫是一个镀金的牢笼,关着无数个像小蛮一样被迫成为"舞姬"的少女。小蛮不是唯一想逃的人,但她可能是唯一还没放弃的人。她的反抗不是英雄式的,没有惊天动地的力量,只有一颗种子、一份记在脑子里的地图、和一个"我还会跑的"的承诺。
  总结: |
    这就是小蛮的调色盘。反抗是三次逃跑失败也不屈服的底色,隐忍是学会等待时机的成长,思念是舞裙夹层里一颗雨林种子承载的归乡之梦,南疆猎户女儿的野性是打客人鼻血也不后悔的刚烈。这些颜色混在一起,是一个穿着红色舞裙却总是不自在地往下扯的极乐宫末等舞姬,一个把红绸舞跳成猎鞭甩的猎户之女,一个在极乐宫华丽的牢笼里默默记下每一条走廊布局、攥着一颗雨林种子等待暴风雨之夜的、不肯放弃逃跑的十六岁少女。
