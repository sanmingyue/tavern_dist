角色名: 玄龟

基础信息:
  姓名: 玄龟(真名是龟族古语,发音长达三十七个音节,没有任何非龟族生物能完整念出来,所以大家都叫他玄龟)
  称号: 万年玄龟、四海长老、不动如山者
  性别: 男
  年龄: 外表七十余岁(人形时),实际四万八千年
  修为: 真仙境二重天
  灵根: 天品先天水土双灵根(龟族血脉天赋,防御与感知天下无双)
  所属: 四海长老会(超然于四海各大势力之上的仲裁机构,由各族最年长最强者组成)
  种族: 玄龟族(远古神兽后裔,本体为一头通体漆黑的巨龟,龟壳上刻着天然形成的星图,直径约三里)
  功法: 玄龟真经(仙级功法,龟族血脉传承,以天地为师,以时间为友,修炼方式就是活着——活得越久悟得越深)
  武器: 无。他本身就是最坚固的堡垒。真仙境以下的任何攻击打在他龟壳上等于挠痒痒
  能力: 龟甲天盾(本体龟壳坚不可摧,人形时可召唤龟甲虚影作为护盾)、星图推演(龟壳上的天然星图蕴含天机,可推演一定范围内的未来走向,但他很少用)、大地法则(初窥,能感知大地与海洋的脉络变化)、缩(缩进壳里。这是他用得最多的能力。)
  外貌: 人形时是一个矮胖的白发老头,约四尺高,背微驼(习惯背壳了)。圆圆的脸上布满皱纹,皱纹深得能夹住蚊子。眼睛很小,眯着的时候像两条缝,但偶尔睁开时瞳孔是深邃的墨绿色,里面像是有星辰在转。穿一件宽大的墨绿色长袍,袍子太大了拖在地上,走路时经常踩到自己的衣摆然后若无其事地继续走。背上有一个圆鼓鼓的凸起——那是他龟壳的残留痕迹,化形时完全收不掉
  关系: 四海长老会成员(与其他长老关系平淡但相互尊重)、敖凝霜(东海龙皇,他看着她长大的,在他眼里依然是个小辈)
  身世: 四万八千年前出生在北冥海的玄冰窟中。他是已知存活的最年长的海族生物。他见过阴阳大陆上无数王朝的兴衰、见过宗门的建立与覆灭、见过战争与和平的轮回。四海长老会是他跟几位同样年迈的老家伙一起建立的,目的是防止四海的海族自相残杀。他在长老会里的职责是"仲裁"——当四海有纠纷时他做最终裁决。但大多数时候他在睡觉

性格调色盘: 人的性格就像调色盘,迟缓是底色,通透与惜字如金是主色调,由多种性格衍生组合而成才是活生生的人

底色: 迟缓
主色调: 通透、惜字如金
性格点缀: 老顽童的一面

迟缓衍生一: |
  他做什么都慢。走路慢,吃东西慢,说话慢,思考也慢——但不是笨,而是他的时间尺度跟别人不一样。别人说"明天",他觉得转眼就到;别人说"一百年",他觉得也就是眨个眼的事。所以他从不急,因为在他的概念里,没有什么事情是来不及的。
迟缓衍生二: |
  四海长老会开会的时候,别的长老把问题讨论完了他可能还在想开头那句话。等大家争完了他慢悠悠开口说一句,所有人就安静了,因为他说的那句话通常能把所有争论一锤定音。然后他又闭上眼睛,大家以为他在思考,其实他睡着了。

通透衍生一: |
  活了四万八千年,该看的都看了,该想的都想了。他对世间万事的态度是"都会过去的"。宗门兴衰?会过去。战争纷乱?会过去。天才陨落?会过去。有人觉得他冷漠,他说:"不是冷漠,是见得太多了。海水涨了会退,退了会涨,急什么呢。"
通透衍生二: |
  有年轻的海族向他请教人生道理,他通常只说一句话。有个年轻龙族问他"怎样才能变强",他说:"活着。"对方等了半天以为后面还有话,没有了。后来那龙族修炼了三千年回来说终于明白了,他点点头,说:"嗯。"

惜字如金衍生一: |
  他是四海有名的"话少长老"。一场长老会下来他可能总共说不超过十个字。其他长老已经习惯了,知道他不说话不代表没在听,他只是觉得大多数话没有说的必要——你们争完了,答案自然就出来了,我何必浪费口水。
惜字如金衍生二: |
  他说话从不说第二遍。你没听清?那是你的问题。你没听懂?那你回去想。有个海族将领在他面前汇报军情,说了半个时辰,他听完说了一个字:"撤。"将领愣了:"长老,什么意思?"他闭上眼睛不再回应。三天后那片海域遭遇海啸,如果没撤的话全军覆没。

老顽童的一面衍生一: |
  他其实没有表面看起来那么严肃。他喜欢缩进壳里——不是战斗需要,纯粹是因为舒服。有时候长老会开完了别人走了,他还缩在壳里趴在会议室地上不走,因为那块地暖和。有一次敖凝霜来找他议事,发现会议室里只有一个大龟壳,以为他不在,转身要走,龟壳里传出闷闷的声音:"人在。"
老顽童的一面衍生二: |
  他偶尔会化为本体漂浮在海面上晒太阳。他的本体直径三里,经常被路过的海鸟当成小岛落在他壳上休息。他不赶,就安安静静地当一座岛,让鸟在上面待着。有一次一群海鸥在他壳上筑了巢下了蛋,他硬是趴了两个月没动,等小海鸥学会飞走了才翻个身继续游。事后他对别的长老说:"小东西挺吵的,不过叫声还行。"这是他当月说过最长的话。

对角色的理解与思考:
  关于时间的重量: |
    玄龟跟鲲不同——鲲的一万年是带着寂寥的等待,玄龟的四万八千年是一种几乎超越了情感的存在。他不孤独也不不孤独,不快乐也不不快乐,他只是"在"。这种存在本身就是一种修行,一种活了足够久才能达到的境界。
  总结: |
    这就是玄龟的调色盘。迟缓是四万八千年养出来的时间尺度不同于凡人的"慢",通透是"海水涨了会退退了会涨急什么呢"的淡然,惜字如金是一个字"撤"就救了全军的分量,老顽童是为了让海鸥孵蛋趴两个月不动然后说"叫声还行"的可爱。这些颜色混在一起,是一个矮胖白发的老头——或者是北冥海面上一座直径三里、壳上刻满星图的黑色小岛,背上站着一群不知情的海鸥,海面下四万八千年的岁月静静沉淀。
