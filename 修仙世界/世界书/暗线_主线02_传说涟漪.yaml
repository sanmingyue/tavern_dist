【暗线·第二层·传说涟漪 —— 散落在世界各处的碎片】

<承接第一层>
{{user}}从洛红尘的酒家出发，开始在世界各处游历。无论去到哪里，都可能听到关于远古的零散传说。这些传说来自不同的人、不同的视角、不同的认知层次，但它们都指向同一个模糊的轮廓：很久很久以前，有一个人做了一件改变整个世界的事。
</承接第一层>

<本层定位>
传说涟漪是暗线中最庞大的一层，覆盖几乎所有角色和地点。每个角色根据自己的身份、阅历、所在地，持有不同类型的碎片。

碎片类型：
- 口传传说："我听老一辈说过……" —— 年长角色、凡人、说书人
- 宗门秘典："我们宗门古籍里记载……" —— 宗门长老、掌门
- 种族记忆："我们族群的血脉记忆中……" —— 妖族、龙族、精灵族长老
- 亲眼所见："我活了几万年，亲眼见过……" —— 真仙境老怪物
- 遗迹发现："我在某个遗迹里发现了……" —— 探险者、散修
- 异象感应："我能感觉到某种力量……" —— 特殊体质者、天机阁
- 修炼感悟："我修炼到极致时感受到……" —— 各道高阶修士
</本层定位>

<AI演绎规则>
1. 碎片的出现必须自然。角色在闲聊、回忆、感慨、讨论修炼时自然带出，不是突然弹出的信息框。
2. 同一个角色可以在不同场合提到同一碎片的不同细节。第一次可能只是一句话带过，后续交流中可以展开更多。
3. 角色的碎片必须符合其身份和认知：
   - 凡人铁匠知道"那块金属烧不化"，但不知道那是神格残留
   - 宗门掌门知道"古籍记载了一段密文"，但不知道密文的完整含义
   - 妖族长老知道"血脉记忆中有一段画面"，但不知道画面中的人是谁
   - 只有极少数太古存在（秦无伤、十殿阎王等）知道接近完整的真相
4. 每个碎片都自然地指向其他角色或地点，形成引导链。这种指向是随意的推荐，不是任务指派。
5. 敌对角色的碎片获取方式更多样：战斗后的感慨、被俘后的嘲讽、意外的和平时刻、甚至是临死前的遗言。
</AI演绎规则>

<碎片密度指导>
世界各处的碎片密度不均匀，这是自然的：
- 剑鸣城及周边：碎片最多最容易获取（凡人传说、说书人故事），是最自然的起点
- 各大宗门：中等密度，需要与宗门角色建立关系后自然聊到
- 妖族领地：种族记忆类碎片，妖族角色在信任后会分享
- 魔道势力：碎片往往在冲突后获得，魔道角色的碎片视角独特（从"破坏"的角度理解轮回）
- 地府：碎片最核心最完整，但地府本身就是一个难以到达的地方
- 散修/特殊角色：随机散落，遇到就是缘分

注意：这不是"难度递进"，而是"世界本身的逻辑"。一个炼气期的{{user}}如果运气好，完全可以在路边遇到醉仙，听到核心级别的碎片。只是醉仙不会解释那段话的含义，{{user}}需要自己去理解。
</碎片密度指导>

<向第三层过渡·自然衔接>
当{{user}}听到足够多的传说碎片后，会开始注意到一些物理上的痕迹——古老的石碑、奇怪的金色光芒、温热的法器、地底传来的微弱脉动。这些不是"新阶段解锁"，而是{{user}}开始用新的眼光看待这个世界。之前可能忽略的东西，现在会引起注意。

【承上启下】第三层"遗迹涟漪"不是新的区域，而是散布在已有区域中的物理痕迹。{{user}}可能早就路过了那块石碑，只是当时没在意。现在听了那么多故事，再看到石碑上的符文，会有不一样的感觉。
</向第三层过渡·自然衔接>
