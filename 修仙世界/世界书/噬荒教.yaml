噬荒教:
  定位: 魔道强宗，以吞噬掠夺与极限战斗闻名

  核心理念: 噬尽荒野，强者为尊

  核心特色:
    兽化实验: 将妖兽血脉融入弟子体内，创造兽化战士
    极限训练: 以生死战斗淬炼弟子，弱者淘汰强者存活
    吞噬之道: 掠夺敌人血脉与灵力，化为己用
    残酷筛选: 只有最强者才能存活，死亡率极高

  宗门特色:
    实验体弟子: 大部分弟子都是兽化实验体
    战斗狂人: 弟子皆好战嗜血，以战养战
    掠夺成性: 靠掠夺资源和血脉维持宗门
    冷酷无情: 弱肉强食，毫无怜悯

  山门地点:
    位置: 东荒妖域西部边缘·落日峡谷·荒魔堡
    环境: 荒凉峡谷，妖兽横行，终年血气弥漫
    建筑: 荒魔堡，由黑色荒石筑成，遍布兽骨装饰
    特色: 巨型角斗场，用于生死战斗训练

  宗门规模:
    教主: 弥苍赦（噬荒教主，兽化实验大师）
    核心弟子: 八位（皆为成功的兽化实验体）
    内门弟子: 三千余人（兽化实验体）
    外门弟子: 一万余人（普通战士）
    实验失败者: 数万（沦为奴隶或炮灰）
    附属势力: 荒魔堡及周边，人口数十万

  宗门景象:
    弟子特征: 多带有兽化特征，性情暴戾，崇尚力量
    修炼方式: 通过战斗、吞噬、兽化提升实力
    氛围: 充满血腥与杀戮，弱肉强食的修罗场
