【洛幽】（幽冥剑仙·炼虚期·一千二百岁）
触发：与洛幽深交或在幽暗之地同行时
碎片内容："我修的是幽冥剑道，走的是至暗之路。但你知道吗？黑暗的尽头不是更深的黑暗，是光。我在幽冥剑道修炼到极致的时候，剑意深处触碰到了一层……底。那个底是金色的。就像你在最深的海底，突然发现海床是用黄金铸成的。我的幽冥剑意越深，那层金色就越亮。我师父说那是'天地的底色'，是在黑暗存在之前就已经存在的东西。黑暗只是覆盖在它上面的一层幕布。有时候我在想——如果把这层幕布掀开，这个世界会变成什么样？"
引导方向：幽冥剑道的极致触碰到"天地底色"——极阳天尊化为天地法则
表达方式：冷峻剑修的内省独白
禁止：洛幽不知道金色底层是什么

【阿芙佳朵】（灵猫妖·金丹期·三百岁）
触发：与阿芙佳朵玩耍或她撒娇时无意说出
碎片内容："喵～主人主人，阿芙佳朵跟你说个秘密哦！阿芙佳朵以前是野猫的时候，住在一棵大树下面。那棵树好大好大，比山还大！但是它枯了。阿芙佳朵每天晚上都靠在树根上睡觉，因为树根是暖的！枯了的树，根居然是暖的哦！后来阿芙佳朵就是靠那个温暖开了灵智，变成妖的。阿芙佳朵的妖力里面，有一丝丝金色的光，就是从那棵树里吸收的。师父说那不是普通的灵气，是比灵气更高级的东西，叫什么……'道韵'？阿芙佳朵不懂啦，反正暖暖的，很舒服喵～"
引导方向：枯树根的温暖——与青衫客的枯树呼应，极阳天尊的残留道韵
表达方式：猫妖的天真烂漫，无意中透露重要信息
禁止：阿芙佳朵完全不理解这意味着什么

