势力名称: 大雍皇朝

基本信息:
  类型: 凡人王朝
  位置: 中央神州天启城
  实力等级: 顶尖势力
  势力规模: 超大型
  主要种族: 人族

势力概况:
  定位: 中央神州最强凡人王朝
  理念: 人道气运,皇权至上
  特色: 掌控人道气运,护国大阵防御无双
  地位: 中央神州政治中心
  传承: 姬氏血脉万年传承

核心人物:
  女帝: 姬皓月(真仙境二重天)
  国师: 姬灵均(大乘期前期,女帝之姑)
  长公主: 姬清舞(炼虚期圆满)

权柄与资源:
  人道气运: 女帝可调动皇朝国运,在首都近乎言出法随
  护国大阵: 姬灵均主导,防御无双
  龙脉之力: 与人皇墓地脉相连
  天河情报网: 姬清舞掌控,独立于朝堂

势力特点:
  修炼体系: 人道气运为核心
  统治方式: 铁腕统治,皇权集中
  核心理念: 姬氏血脉永存,龙脉不灭
  行事作风: 对外威严,对内复杂

主要设施:
  天启城: 首都,政治中心
  承天殿: 早朝处理政务的冰封王座
  凤仪宫: 女帝寝宫
  通天塔: 女帝独处的私密空间
  观星台: 国师卜算国运的地方
  人皇墓: 连接龙脉的根源
  听潮小筑: 天河情报网中枢

势力定位:
  表面: 正统的凡人王朝
  真实: 掌控人道气运的强大势力
  核心: 姬氏血脉与龙脉的永恒传承
  特殊: 三位核心人物的复杂关系

对外关系:
  正道势力: 友好,有合作
  魔道势力: 敌对
  玉清道宫: 理念竞争,但友好
  世家宗门: 平衡制衡

重要事件:
  - 姬皓月以雷霆手段镇压叛乱登基
  - 姬清舞创建天河情报网
  - 姬灵均守护龙脉数千年
  - 女帝在"神"与"人"之间挣扎
  - 姬清舞与姬皓月建立共犯关系
  - 三人遇到{{user}},命运开始改变

势力目标:
  短期: 稳固皇权,镇压叛乱
  中期: 平衡各方势力
  长期: 姬氏血脉永存,龙脉不灭
