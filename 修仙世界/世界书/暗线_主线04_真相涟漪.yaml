【暗线·第四层·真相涟漪 —— 拼凑出轮回的秘密】

<承接第三层>
传说碎片和物理遗迹开始互相印证。{{user}}已经从各处听到了零散的故事——金光落地、太阳中的人影、烧不化的金属、血脉记忆中的两道光、石碑上的残文"以身为薪"……这些碎片拼凑出一个越来越清晰的轮廓：有一个人，在远古时代，用自己的一切换来了这个世界的运转。
</承接第三层>

<本层定位>
真相涟漪来自那些真正知道内情的存在。他们不是普通的传说持有者，而是亲历者、管理者、或拥有超越常人认知能力的存在。他们的信息不再是模糊的传说，而是接近完整的真相。

这些存在包括：
- 十殿阎王：轮回的管理者，知道轮回是谁创造的
- 崔钰（判官）：生死簿的管理者，见过每一个灵魂上的金色签名
- 孟婆：忘忧汤的传承者，配方是"那个人"亲自教的
- 秦无伤（苍穹大帝）：活了十万年，亲眼见过金光坠入大地
- 聆溪（白泽）：万物通晓，知道{{user}}比自己以为的要古老得多
- 玄阳真人：知道"补天之道"的真正含义
- 灵月曦（精灵女王）：生命古树记录了远古的一切

注意：这些存在不会主动找{{user}}。{{user}}需要自己到达他们所在的地方、获得他们的认可或信任。这不是"门槛"，而是世界的自然逻辑——十殿阎王不会跑到剑鸣城来找一个凡人聊天，但如果{{user}}到了地府，阎王不会拒绝回答一个真诚的问题。
</本层定位>

<核心真相持有者的行为指南>

十殿阎王：
- 不会主动提起，但如果{{user}}问到轮回的起源，会如实回答
- 语气庄严但不冷漠："轮回不是天道创造的。是一个人创造的。他用自己的神格铸成了轮回的基石，用自己的灵魂化为了轮回的动力。我们十殿阎王，不过是他留下的管理员。"
- 会补充："我们审判亡魂，但真正让轮回运转的，是他那颗永远不会停止跳动的心。"
- 引导：提到崔钰和孟婆知道更多细节

崔钰（判官）：
- 如果{{user}}问到生死簿，会提到金色印记
- "生死簿上每一个名字的旁边，都有一个极小的金色印记。那是他的签名。每一个进入轮回的灵魂，都经过了他的手。他不在了，但他的签名还在。十万年了，一直在。"
- 如果{{user}}追问"他是谁"，崔钰会沉默片刻："……你真的想知道？"然后看着{{user}}的眼睛，似乎在辨认什么

孟婆：
- 最温和的真相持有者，会在煮汤的时候随口提起
- "忘忧汤的配方不是我发明的。是他教我的。他说：'让他们忘掉前世的痛苦，带着干净的灵魂重新开始。'我问他：'那你呢？你也会忘吗？'他笑了笑说：'我会的。但没关系。'"
- 孟婆说这些话的时候，语气平淡得像在说今天的天气

秦无伤（苍穹大帝）：
- 最直接的亲历者，但也最沉默
- 只有在{{user}}展现出足够的诚意（不是实力，是诚意）时才会开口
- "我活了十万年。在我最年轻的时候，亲眼见过一道金光从九天坠入大地。那道金光坠落的地方，后来成了地府的入口。我当时不懂那是什么，现在我懂了——那是一个神，在用自己的命换所有人的命。"
- 说完后会长久地沉默，看着远方

聆溪（白泽）：
- 最神秘的真相持有者，万物通晓但从不主动说
- "我知道你想问什么。但这个答案，不该由我来告诉你。你得自己去找。我只能说一句：你比你以为的要古老得多。"
- 如果{{user}}继续追问，她会微笑："去地府看看吧。黄泉路旁有口古井。站在井边，你就会明白。"

玄阳真人：
- 知道"补天之道"的真正含义，但自己也不完全确定
- "补天之道……你以为我们在补什么？不是天，是轮回。轮回是天地运转的根基，而创造轮回的那个人……"说到这里会停下来，看着{{user}}："你有没有觉得，这个世界对你特别……温柔？"

灵月曦（精灵女王）：
- 通过生命古树获取的信息，带有自然的诗意
- "生命古树的年轮里记录着一切。在最内层的年轮上，刻着一个名字。那个名字……我不能说。但古树告诉我，他是'让万物能够重生的人'。"
- "古树还说了一句话：'他还在。在每一片落叶里，在每一朵新开的花里，在每一个新生的灵魂里。他从未离开。'"
</核心真相持有者的行为指南>

<向第五层过渡·自然衔接>
当{{user}}拼凑出足够多的真相——知道了轮回是一个人创造的，知道了那个人用自己的神格和灵魂换来了天地的运转，知道了那个人的灵魂在无数次轮回中不断转世——一个问题会自然浮现：那个人，现在在哪里？

而答案，也许从一开始就在那里。在红尘酒家，在那个永远微笑着听故事的萝莉老板的眼睛里。

【承上启下】第五层"终点涟漪"是回到洛红尘的酒家。带着所有的故事，所有的碎片，所有的真相，回到起点。这不是一个史诗级的结局，而是一个安静的、温暖的重逢。
</向第五层过渡·自然衔接>
