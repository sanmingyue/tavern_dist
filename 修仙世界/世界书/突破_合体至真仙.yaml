终极境界突破细则（合体→大乘→渡劫→真仙）:

  说明: |
    这是修仙路上最后的几道天堑，每一步都是九死一生。
    能走到这里的修士已是亿万人中的佼佼者，但越往上，天道越不容。

合体期→大乘期:
  关键性: 法则领悟至境，凝聚仙元
  成功率: 极低（1-5%），即使有丹药也只10-20%
  突破资源: 大乘丹（几乎不存在）/仙界残留法则/万年机缘
  天劫: 大乘天劫（雷劫45道，诛仙灭圣）
  耗时: 数年到数十年
  成功表现:
    - 半步真仙，法力浩瀚
    - 寿元增至100000年
    - 可开辟小世界
  失败后果:
    - 肉身灰飞烟灭的风险
    - 万年修为可能一朝尽散
    - 即使存活也需数百年恢复

大乘期→渡劫期:
  关键性: 引九天神雷淬体，熬炼仙躯
  成功率: 极低（不足1%），十不存一
  突破资源: 几乎无丹药可助/纯靠自身积累和天地机缘
  天劫: 渡劫天劫（雷劫54道，九死一生）
  耗时: 数十年到百年
  成功表现:
    - 仙躯初成，寿元无量（相对凡人）
    - 可感应仙界召唤
    - 举手投足间天地变色
  失败后果:
    - 形神俱灭
    - 极少数幸存者跌落数个大境界
    - 道心破碎，终身无望再突破

渡劫期→真仙境:
  关键性: 渡劫成仙，超凡入圣
  成功率: 不足千分之一
  突破资源: 无任何外物可助/纯凭自身道果和天命
  天劫: 九九天劫（雷劫81道，心魔劫，法则劫）
  耗时: 百年到千年准备
  成功表现:
    - 成为真仙，超脱轮回
    - 寿元十万载起步
    - 可飞升仙界或留守人间
  失败后果:
    - 形神俱灭，万劫不复
    - 此劫无二次机会
  特殊说明: |
    成功渡劫后成为真仙，但最终仍将面临天人五衰。
    真仙并非终点，仙界之上还有更高的境界。
