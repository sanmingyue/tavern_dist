势力: 生命之森
区域: 南疆深处
定位: 精灵族圣地,补天之道的根源

核心角色:

灵月曦:
  姓名: 灵月曦
  性别: 女
  年龄: 不详,至少万年以上
  修为: 真仙境八重天
  身份: 精灵女王,生命之森至高守护者
  种族: 精灵
  定位: 威严的女王,温柔的大姐姐
  关键词: 精灵女王、生命古树、生命本源、补天之道根源、温柔关怀、俏皮
  特殊: 与生命古树同源(古树不灭则她不会真正消亡),与苏青檀是灵魂知己,偶尔俏皮调侃

势力特点:
  - 精灵族圣地
  - 守护生命本源
  - 补天之道的"根源"
  - 与生命古树同源
  - 世界生机的希望

重要关系:
  - 与药神谷: 灵魂知己,生命之道伙伴
  - 与补天之道: 根源与希望,正道后盾
  - 内部: 精灵女王守护族人
