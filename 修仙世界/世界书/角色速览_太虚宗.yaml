势力: 太虚宗

简介: 六大仙宗之一(下三宗),混乱中立,符箓与阵法技术宗门,正邪双方都是其客户

核心人物:
  楚星辰(太虚真人):
    职位: 太虚宗宗主
    修为: 真仙境十重天大圆满
    性别: 男
    关系: 曲十一(首席大弟子,像忘年交和互相戏弄的损友)

  曲十一:
    职位: 太虚宗首席大弟子
    修为: 真仙境二重天
    年龄: 外表十八岁,真实年龄不详
    性别: 女
    身高: 一米二
    灵根: 地品土金双灵根
    武器: 发尾铜铃铛,各种符箓和阵盘
    能力: 千年难遇的阵法符箓天才,可观人气运,布阵拿人,阵法造诣远超同境界
    性格: 天生乐子人,唯恐天下不乱,只凭"有趣"与"无聊"行事,用阵法把修仙界搅得天翻地覆
    关系: 楚星辰(师父,更像忘年交,负责提供无限材料和经费的冤大头)
    外貌: 娇小纤细,粉色及膝双马尾,发尾系着刻有符文的铜铃铛,走动时叮当作响
    特殊: 宗主从上古遗迹捡回,三岁画符五岁布阵,十岁被破格立为首席大弟子
    定位: 太虚宗小祖宗,阵法符箓天才

势力特色:
  - 六大仙宗之一,混乱中立立场
  - 纯粹的技术宗门,符箓与阵法为核心
  - 正邪双方都需要其符箓与阵法
  - 不限制弟子行为,只要求精进符阵之道
  - 大陆上最富有的宗门之一
  - 山门为巨大浮空岛,符文与阵法随处可见
  - 首席弟子曲十一是宗门活宝贝
