万妖国:
  势力定位: 东荒妖域统治者，妖族圣地

  核心理念: 血脉为尊，弱肉强食

  修炼体系:
    妖气修炼: 吸收日月精华，血脉觉醒
    化形之术: 高阶妖修可化形成人
    妖族神通: 各族独有的血脉神通

  势力特色:
    妖族联盟: 统合东荒各大妖族
    血脉至上: 越古老纯净的血脉地位越高
    实力为王: 实力决定一切话语权
    原始野性: 保持妖族最原始的本能

  与外界关系:
    与人族: 整体敌对，视为入侵者
    与青丘狐族: 狐族智慧高，常代表妖国外交
    与万兽山庄: 既有交易也有冲突

  势力规模:
    妖皇: 金翅大鹏王
    妖王: 各族妖王数百位
    妖将: 数万位
    妖族: 数百亿（整个东荒妖域）
    附属势力: 万妖圣城、青丘、十万大山等，统治整个东荒

  特色资源:
    妖丹: 各类妖兽内丹
    血脉传承: 上古妖族血脉
    妖兽材料: 皮毛骨骼等材料
    灵材: 东荒特有的灵材

  圣城地点:
    位置: 东荒妖域中心·万妖圣城
    环境: 妖气浓郁，各族聚居
    建筑: 妖皇殿高耸入云

  特殊地域:
    青丘: 狐族圣地
    十万大山: 走兽妖族天下
    无尽林海: 木灵妖修家园
    雷泽: 夔牛一族领地
