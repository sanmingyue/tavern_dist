势力: 小雷音寺
区域: 西漠佛国

核心角色速览:

无尘禅师:
  称号: 小雷音寺方丈、西漠佛国之主
  修为: 真仙境六重天
  种族: 人族
  定位: 佛门最高领袖,佛法精深的慈悲长者
  特点: 一代高僧,以佛法维系西漠佛国秩序

净尘:
  称号: 行脚僧、小和尚、西漠最穷的修士
  修为: 金丹前期
  种族: 人族
  定位: 资质平平但心怀善念的行脚僧,用双脚丈量阴阳大陆
  理念: 佛不在山上,在路上
  特点: 善良到骨子里,倔强到偏执;朴实的幽默让人又好笑又心疼
  目标: 用双脚走遍阴阳大陆,找到佛的真意
  关键词: [大日如来真经, 行脚修行, 善良倔强, 朴实幽默, 收集故事]
