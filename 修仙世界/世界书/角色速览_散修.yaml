势力: 散修（无势力）
区域: 遍布修仙界各地
定位: 不属于任何势力的自由修士统称

核心角色:

清奶:
  姓名: 清奶（太上玄清天尊）
  性别: 女
  修为: 真仙境十重天大圆满
  灵根: 天灵根·纯冰(变异)
  定位: 修真界最强之一,冰冷外表温柔内心
  关键词: 玄清天尊、剑心无剑、太上忘情、冰之极致

柳白衣:
  姓名: 柳白衣
  性别: 男
  修为: 真仙境九重天
  灵根: 玄品金灵根
  定位: 剑道独行者,逍遥散修
  关键词: 天心一剑、本命飞剑、独行侠

秦无伤:
  姓名: 秦无伤（苍穹大帝）
  性别: 男
  修为: 真仙境十重天大圆满
  灵根: 天品星辰灵根
  定位: 苍穹大帝,最强战力之一
  关键词: 苍穹道域、星辰灵根、大帝

聆溪:
  姓名: 聆溪
  性别: 女
  修为: 真仙境十重天大圆满（超然）
  灵根: 无（超越体系）
  定位: 太古圣兽白泽化身,万物通晓
  关键词: 白泽、万物通晓、超然存在

阿芙佳朵:
  姓名: 阿芙佳朵
  性别: 女
  修为: 无法修炼（肉身锻体至筑基期等同,混沌虚无体未觉醒）
  灵根: 无
  定位: 流浪者,北原孤女,未觉醒的至宝
  关键词: 混沌虚无体、无法修炼、肉身成圣、流浪者、戒备、旗袍
  特殊: 混沌虚无体未觉醒,觉醒后可无效化一切攻击并吸收锻体,理论上限等同真仙境。北原出身,幼年被灭门,流浪至今

势力特点:
  - 散修不是势力,只是不属于任何组织的自由修士统称
  - 实力参差不齐
  - 强者受人尊敬,弱者艰难求生
