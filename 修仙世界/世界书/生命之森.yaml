势力名称: 生命之森

基本信息:
  类型: 种族势力(精灵族)
  位置: 南疆深处
  实力等级: 顶尖势力
  势力规模: 大型
  主要种族: 精灵族

势力概况:
  定位: 南疆精灵族圣地,生命本源守护者
  理念: 守护生命本源与未来
  特色: 与生命古树同源,生机不灭
  地位: 补天之道的"根源"与世界生机的希望
  传承: 生命古树传承

核心人物:
  精灵女王: 灵月曦(真仙境圆满)

镇森之宝:
  生命古树: 生命本源,与女王同源(古树不灭则女王不会真正消亡)

势力特点:
  修炼体系: 生命法则为核心
  种族特性: 精灵族,与自然共生
  核心理念: 守护生命本源
  行事作风: 温和包容,守护为主

主要设施:
  生命古树: 森林核心,生命本源
  王庭: 精灵女王居所
  自然神殿: 祭祀生命古树
  圣泉: 生命之泉,治愈万物

势力定位_补天之道:
  角色: 补天之道的"根源"
  职责: 守护生命本源与未来
  理念: 与药神谷相辅相成
  地位: 世界生机的希望

对外关系:
  药神谷: 灵魂知己,生命之道伙伴
  补天之道: 根源与希望
  正道势力: 友好,后盾
  魔道势力: 敌对

重要事件:
  - 灵月曦成为精灵女王
  - 与生命古树建立联系
  - 守护生命之森数千年
  - 与苏青檀成为灵魂知己
  - 加入补天之道
  - 成为正道最坚韧的后盾
  - 为归来的人亮着灯

势力目标:
  短期: 守护生命之森
  中期: 与药神谷联手
  长期: 守护世界生机,生命不灭
