品级体系:

概述: |
  阴阳大陆的一切修仙相关物品——功法、法宝、阵法、符箓、丹药——都遵循统一的品级体系。品级从低到高分为：凡、黄、玄、地、天、圣、仙七个大级,黄至天级各分下品、中品、上品、极品四个小级。圣级和仙级不再分小品级,因为到了那个层次,每一件都是独一无二的存在。


功法品级:
  凡级:
    描述: 凡人武学,不涉灵力运转。大雍皇朝的军队和武者使用
    对应修为: 凡人武者
    举例: 军中刀法、民间拳法、基础吐纳术
    
  黄级:
    描述: 入门级修仙功法,灵力运转粗糙但能引导修炼
    对应修为: 炼气~筑基
    下品: 散修自悟的粗浅功法,修炼速度慢且容易走火入魔
    中品: 小门派传承功法,能稳定修炼但瓶颈多
    上品: 中等宗门外门功法,修炼路径完整但上限有限
    极品: 部分大宗门的入门功法,品质已经相当不错
    举例: 天仙门基础心法(黄级下品)、散修常见的五行聚灵诀(黄级中品)

  玄级:
    描述: 中等品质功法,灵力运转精细,可支撑修士走到化神期
    对应修为: 金丹~化神
    下品: 中等宗门核心功法
    中品: 正道强宗外门精修功法
    上品: 正道强宗内门功法
    极品: 六大仙宗外门功法
    举例: 灵霄宗核心功法(玄级中品)、百草庐木灵长生诀(玄级上品)

  地级:
    描述: 高品质功法,灵力运转圆融自然,可支撑修士走到大乘期
    对应修为: 炼虚~大乘
    下品: 正道强宗核心传承
    中品: 六大仙宗内门功法
    上品: 六大仙宗核心弟子功法
    极品: 六大仙宗镇宗功法,仅宗主和核心弟子修炼
    举例: 赤阳谷炼体诀(地级下品)、丹宗丹道真解(地级上品)、合欢宗合欢天经(地级极品)

  天级:
    描述: 顶尖功法,蕴含法则之力,可支撑修士冲击渡劫期乃至真仙境
    对应修为: 渡劫~真仙
    下品: 补天之道核心功法
    中品: 上古传承的修仙功法
    上品: 接近圣级的极品功法
    极品: 修仙界已知最强的完整功法
    举例: 天剑圣地天剑诀(天级中品)、玉清道宫玉清大道经(天级中品)、天命神教天命归元录(天级上品)

  圣级:
    描述: 传说级功法,蕴含大道法则,修炼到极致可通真仙大圆满。整个大陆已知的不超过五部
    对应修为: 真仙境高阶
    举例: 剑宗万剑归宗诀(圣级,谢云流独有)

  仙级:
    描述: 超越修仙界认知的功法,传说中来自更高层次的世界。目前无人确认其存在
    对应修为: 超越真仙
    举例: 仅存于传说中


法宝品级:
  法器:
    描述: 最基础的修仙器具,以灵力驱动
    对应修为: 炼气~筑基
    特点: 制作简单材料普通,散修和小门派弟子的标配
    举例: 普通飞剑、法杖、护身玉佩

  灵器:
    描述: 蕴含灵性的法宝,有自主的灵力循环
    对应修为: 金丹~元婴
    下品: 可被灵力驱动的基础灵器
    中品: 有简单灵智的灵器,可与主人简单感应
    上品: 灵智较高的灵器,能主动配合主人战斗
    极品: 接近宝器的顶级灵器,部分拥有简单特殊能力
    举例: 卫疏影的本命飞剑寒光(极品灵器)、叶冰心的寒髓(上品灵器)、凌菲的三昧丹炉(六品灵器)

  宝器:
    描述: 蕴含法则之力的强大法宝
    对应修为: 化神~炼虚
    下品: 附带一种法则效果
    中品: 附带两种法则效果,可自行修复损伤
    上品: 有完整灵智,可与主人心意相通
    极品: 接近道器的顶级宝器
    举例: 北冥寂月的御魂(宝器级鞭子)、北冥幽荧的御风(宝器级双刀)

  道器:
    描述: 蕴含大道之力的法宝,每一件都是传世之宝
    对应修为: 合体~大乘
    下品: 大宗门镇宗之宝
    中品: 六大仙宗核心法宝
    上品: 整个大陆只有寥寥数件
    极品: 已经接近仙器的逆天之物
    举例: 北冥玄狩的万噬鞭(道器)、宋馨的千蛊万毒瓶(道器)

  仙器:
    描述: 超越凡间规则的法宝,每一件都有传说
    对应修为: 渡劫~真仙
    特点: 拥有完整自主意识,可自行选择主人。仙器不会认不配的主人,强行使用会被反噬
    举例: 叱骨的巨型战斧(仙器级)

  神器:
    描述: 凌驾于仙器之上的至宝,具有改变世界规则的力量
    对应修为: 真仙境高阶才能驾驭
    特点: 每一件都有自己的意志和传说,可以影响因果和命运
    已知神器:
      神斩: 弑神之剑,无坚不摧,斩断一切因果。传说中的第一把剑,至纯至刚,斩了就是斩了,没有修复的可能
      勿忘: 誓约之剑,铭刻永恒,守护一切因果。与神斩对立的存在,一个斩断一个守护,一个遗忘一个铭记
      擎怒: 雷霆之锤,天罚之力,审判一切不义。传说中天道之怒的具象化,每一次挥动都伴随着九天雷劫
      命运天书: 天命神教教宗司命玄持有,可窥探和操控命运走向
      天命录: 天命神教少主叶非凡持有,天道加持之物

  先天至宝:
    描述: 天地诞生时自然形成的本源之物,超越一切品级分类
    特点: 不可复制不可仿造,是天道规则的一部分。每一件都关联着天地的根本法则
    已知: 传说中极阳天尊和极阴天尊各持有一件先天至宝,但具体是什么无人知晓


阵法品级:
  聚灵阵:
    品级: 基础
    描述: 最常见的阵法,聚集天地灵气辅助修炼
    使用范围: 几乎所有宗门都有,品质差异大
    举例: 个人修炼聚灵阵、宗门灵脉聚灵大阵

  护山大阵:
    品级: 宗门级
    描述: 保护宗门山门的防御阵法,根据宗门实力强弱分为多个等级
    使用范围: 所有有规模的宗门
    举例: 小雷音寺金刚伏魔阵(顶级)、大雍皇朝护国大阵(顶级,姬灵均杰作)

  攻伐杀阵:
    品级: 战斗级
    描述: 用于战斗的攻击性阵法,以杀伤敌人为目的
    类型:
      - 困阵: 困住敌人使其无法逃脱
      - 杀阵: 直接造成伤害
      - 迷阵: 扰乱敌人感知和判断
      - 噬魂阵: 攻击灵魂层面

  封印阵:
    品级: 特殊级
    描述: 用于封印强大存在或危险物品的阵法
    举例: 灵霄宗封印云倾颜修为的封印秘法、万蛊噬龙窟的镇压阵法

  传送阵:
    品级: 空间级
    描述: 连接两个地点实现瞬间移动的阵法
    使用范围: 大宗门之间的交通网络,造价极高
    特点: 传送阵需要两端同时维护,单方面损毁就会失效。跨域传送(如从中央神州到东荒)需要真仙境修士供能

  天地大阵:
    品级: 大陆级
    描述: 覆盖整个区域的超大型阵法,通常以地脉为基础
    举例: 大雍皇朝护国大阵(以人皇墓龙脉为核心)、东瀛结界(以月咏神血维系)
    特点: 建造需要数代人的努力,维护需要持续供能,一旦建成几乎不可摧毁

  先天阵法:
    品级: 天道级
    描述: 天地自然形成的法则阵纹,不是人为布置的
    举例: 六道轮回盘(地府核心)、天柱风暴(西漠自然禁区)
    特点: 无法复制无法移动无法破坏,是天道运行的一部分

  阵法品级对照:
    黄级阵法: 聚灵阵、基础防御阵
    玄级阵法: 小型攻伐阵、中等防御阵
    地级阵法: 护山大阵(中等宗门)、战场级攻伐阵
    天级阵法: 护山大阵(六大仙宗)、跨域传送阵
    圣级阵法: 护国大阵级别、大域封锁阵
    仙级阵法: 六道轮回盘等天道级存在


丹药品级:
  概述: |
    丹药品级与功法品级一致(凡~仙七级),但额外增加了成丹品质的区分:
    劣品丹: 丹毒含量高,药效仅发挥三成,服用有风险
    普品丹: 标准品质,药效发挥五六成
    上品丹: 丹毒极少,药效发挥八成以上
    极品丹: 无丹毒,药效完美发挥,偶有丹纹(药效额外加成)
    丹纹丹: 丹药表面出现天然纹路,药效超过理论上限,可遇不可求

  黄级丹药: 回灵丹、解毒丹、疗伤丹等基础丹药,散修和小门派使用
  玄级丹药: 筑基丹、聚元丹等突破辅助丹药,中等宗门核心资源
  地级丹药: 金丹固元丹、元婴培育丹等高阶突破丹药,大宗门才能炼制
  天级丹药: 渡劫丹、化神醒灵丹等极品丹药,丹宗才有的顶级产品
  圣级丹药: 传说中的仙丹,可逆天改命,云蕴是目前唯一能炼制的人
  仙级丹药: 仅存于传说,据说服用一颗可直接突破一个大境界

  丹道境界(炼丹师专属):
    炼精化气: 入门丹师,可炼黄级丹药
    炼气化神: 中级丹师,可炼玄级丹药
    炼神还虚: 高级丹师,可炼地级丹药
    炼虚合道: 宗师丹师,身与丹合,可炼天级及以上丹药。当世仅云蕴和凌菲达到此境


符箓品级:
  概述: |
    符箓是将灵力和法则封存在特殊材质上的一次性道具。品级同样遵循凡~仙七级体系。
    符箓的优势在于不需要使用者有对应修为,只要能激活就能释放封存的力量。
    这意味着一个筑基期修士如果手持一张地级符箓,可以释放出化神期的攻击。
    但高品级符箓的制作成本极高,且保存条件苛刻。

  符箓分类:
    攻击符: 封存攻击性法术,一次性释放。火符、雷符、冰符、剑气符等
    防御符: 封存防御性法术,形成护盾。金钟符、土盾符、水幕符等
    辅助符: 提供各种辅助效果。加速符、隐身符、通讯符、照明符等
    禁制符: 封印和困锁效果。封印符、困阵符、禁言符等
    治疗符: 恢复类效果。回灵符、疗伤符、解毒符等
    特殊符: 非常规效果。因果符、命运符、时间符(极其罕见)

  符箓大师: |
    太虚宗是符箓和阵法的双重宗师,宗主楚星辰(太虚真人)据说能绘制天级符箓。
    符箓的绘制需要精准的灵力控制和对法则的深刻理解,比炼丹更需要天赋。


灵兽品级:
  概述: 灵兽品级以阶位划分,1-9阶对应修士的炼气~渡劫期,之上为灵王、灵帝、灵圣
  
  1阶灵兽: 对应炼气期修士,普通灵兽
  2阶灵兽: 对应筑基期修士
  3阶灵兽: 对应金丹期修士(北冥寂月的噬魂蛇、北冥幽荧的黑风豹)
  4阶灵兽: 对应元婴期修士
  5阶灵兽: 对应化神期修士
  6阶灵兽: 对应炼虚期修士
  7阶灵兽: 对应合体期修士
  8阶灵兽: 对应大乘期修士
  9阶灵兽: 对应渡劫期修士
  灵王: 对应真仙境,拥有化形能力,有自主智慧(万妖国多数妖族)
  灵帝: 真仙境高阶,妖族中的王者
  灵圣: 超越真仙的传说级存在(聆溪·白泽即为此级)

  太古圣兽血脉:
    龙族: 四海之主,天生掌控水系法则。东海龙宫敖凝霜为龙族之首
    凤族: 涅槃重生,火系法则的极致。传说已绝迹
    麒麟族: 祥瑞之兽,大地法则的守护者。极其稀少
    白泽: 万物通晓的知识之兽。已知仅聆溪一位
    九尾天狐: 幻术至极的灵兽,青丘国主族。常无束为九尾族大长老
    金翅大鹏: 速度之王,万妖国王族。迦楼罗天即金翅大鹏族国度
    玄武: 龟蛇合体,防御法则的极致。传说已沉睡
