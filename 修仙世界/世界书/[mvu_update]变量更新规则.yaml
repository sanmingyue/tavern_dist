---
变量更新规则:
  世界定位:
    当前大域, 当前区域, 当前场景:
      check:
        - 移动到新地点时更新，描述需简洁准确
    场景类型:
      type: "''|'野外'|'宗门'|'城镇'|'秘境'|'战场'|'海域'|'地府'|'王朝'|'商会'|'酒家'|'禁地'"
      check:
        - z.enum 约束，必须使用列出的值，无场景时为空字符串
    当前事件:
      type: "'宗门大比'|'秘境'|'历练任务'|'境界突破'|'炼器'|'炼丹'|'奇遇'|'机缘'|'宗门战争'|'拍卖会'|'阵法'|'符箓'|'驭兽'|'狩猎'|'宗门职务'|''"
      check:
        - z.enum 约束，触发对应活动时设置，活动结束后清为空字符串
        - 该变量是世界书中动态事件指南的主触发器
    日期:
      format: 阴阳历X年X季X月X日
      check:
        - 每次事件推进、休息、旅行或闭关后合理推进
    天气:
      check:
        - 场景变化或时间推进时酌情更新

  在场人物:
    type: |-
      {
        [角色名/灵兽名: string]: {
          境界: string;
          势力: string;
          年龄: string;
        }
      }
    check:
      - 每次回复都必须检查：本回复中出场的角色是否已在在场人物中？离场的角色是否需要移除？
      - 角色出场时 insert（必须填境界、势力、年龄），离场时 remove
      - 年龄是核心信息，首次登记时必须根据角色设定填写（如"三万五千岁"/"一千一百岁"/"凡人·二十岁"），不可为空
      - 角色名必须精确（如"殷冬雪"而非"冬雪"）
      - 龙套NPC也要记录（境界可写"凡人"等，势力可写"无"，年龄根据外貌推测填写）
      - 灵兽出场时境界填阶数（如"3阶"），势力填主人名，年龄可写"未知"

  用户信息:
    姓名, 性别:
      check:
        - 开局初始化后不再更改
    年龄:
      type: number
      check:
        - 闭关或时间跨度事件后必须增长
    灵根:
      check:
        - 先天属性，初始化后永不更改
        - 格式："品级+数量+属性"，如 天灵根·单金 / 地灵根·金水双 / 玄灵根·金木水三 / 杂灵根·五行俱全
        - 变异灵根示例：天灵根·纯雷 / 地灵根·纯冰
    体质:
      check:
        - 多数人无特殊体质，保持空字符串
        - 发现特殊体质后填入（如"冰晶玉体"/"天生剑体"/"先天道体"等）
        - 一旦确定不可随意更改
    称号:
      check:
        - 记录用户当前最重要的身份头衔
        - 随身份变化更新（如"外门弟子"→"内门弟子"→"核心弟子"→"长老"）
    修真百艺:
      type: string[]
      check:
        - 常见百艺：剑修/丹修/阵法师/炼器师/符篆师/灵植师/驯兽师/卜算师/体修/法修
        - 学习新百艺需要明确的学习过程（拜师/获得典籍/长期修炼），不能因为尝试一次就添加
        - 若包含'剑修'才激活管理剑心境界，若包含'丹修'才激活管理丹道境界
    修为境界:
      type: "'凡人'|'炼气一层'~'炼气十层'|'筑基前期'~'筑基大圆满'|...|'真仙境一重天'~'真仙境十重天'|'真仙境十重天大圆满'"
      check:
        - z.enum 约束，仅在突破成功后更新为下一阶段值
    修炼进度:
      type: number
      range: 0~100
      check:
        - 日常修炼 +3~8 / 闭关 +8~15 / 生死战斗 +10~20 / 服用丹药 +5~15 / 传承顿悟 +15~30
        - 达到 100 时设当前状态为'突破在即'，突破成功后重置为 0
        - 突破失败进度降至 70~80，当前状态变为'受伤'或'重伤'
        - 真仙境十重天大圆满时不可再增长
    所属势力:
      check:
        - 加入/离开/被逐出势力时更新
    当前状态:
      type: "''|'正常'|'受伤'|'重伤'|'濒死'|'修炼'|'闭关'|'战斗'|'突破在即'|'突破中'|'中毒'|'昏迷'|'被困'|'疗伤'|'赶路'"
      check:
        - z.enum 约束，根据当前情况选择对应值，无特殊状态时为空字符串
    剑心境界:
      type: "''|'入剑'|'剑意'|'剑势'|'剑心'|'剑心通明'|'无我'|'无剑'|'无我无剑'"
      check:
        - z.enum 约束，剑修专属（修真百艺含'剑修'时才管理），非剑修保持空字符串
        - 提升极慢，需要剑道顿悟或生死战斗
    丹道境界:
      type: "''|'炼精化气'|'炼气化神'|'炼神还虚'|'炼虚合道'"
      check:
        - z.enum 约束，丹修专属（修真百艺含'丹修'时才管理），非丹修保持空字符串
    宗门贡献:
      type: number
      check:
        - 完成宗门任务 +10~50 / 参与宗门战争 +50~500
        - 兑换法宝、学习功法、进入禁地时扣除

    背包:
      灵石.${下品|中品|上品|极品}:
        type: number
        check:
          - 交易、拾取、消耗灵石时必须更新，不要遗忘
          - 兑换比例：1中品 = 1000下品，1上品 = 1000中品
      丹药:
        type: |-
          {
            [丹药名: string]: {
              数量: number;
              品级?: string; // 如'凡丹·普品'/'黄丹·上品'/'玄丹·极品'等
              描述?: string;
            }
          }
        check:
          - 获得/服用/交易丹药时必须立即更新
          - 服用丹药时用 delta 减少数量，数量归零后自动移除
          - 品级格式为"品级·品质"（品级：凡丹/黄丹/玄丹/地丹/天丹/圣丹/仙丹，品质：劣品/普品/上品/极品/丹纹）
      材料:
        type: |-
          {
            [材料名: string]: {
              数量: number;
              品级?: string;
            }
          }
        check:
          - 获得/消耗材料时必须立即更新
          - 数量归零后自动移除
      杂物:
        type: |-
          {
            [物品名: string]: {
              数量: number;
              描述?: string;
            }
          }
        check:
          - 获得/使用/丢弃物品时必须立即更新
          - 数量归零后自动移除

    功法:
      主修功法:
        check:
          - 日常只需更新当前层数（突破时 +1）
          - 更换主修功法时，名称/品阶/总层数/当前层数/描述全部替换
      辅修功法:
        check:
          - 习得新辅修功法时添加，日常只更新当前层数
      术法:
        check:
          - 熟练度：入门/小成/大成/精通/圆满，提升需大量实战

    法宝:
      ${本命法宝|防御法宝}:
        check:
          - 祭炼、装备或更换时更新
      ${辅助法宝|未装备法宝}:
        check:
          - 获得新法宝时添加到未装备，装备时 move 到对应位

    灵兽:
      type: |-
        {
          [灵兽名: string]: {
            品种: string;
            境界: string; // 1阶~9阶 / 灵王 / 灵帝 / 灵圣
            描述?: string;
          }
        }
      check:
        - 驯服/收服灵兽时必须立即 insert
        - 灵兽境界提升时更新，死亡或放生时 remove

    异火:
      type: |-
        {
          [异火名: string]: {
            品级: string; // 一品最强，九品最弱，另有特殊类
            属性: string;
            描述?: string;
          }
        }
      check:
        - 获得异火时 insert
        - 异火品级不可改变（先天固定）

  男性好感度:
    type: |-
      {
        [角色名: string]: {
          好感度: number; // range: -1000~1000
          关系阶段: string;
          年龄: string;
        }
      }
    check:
      - 首次出现的男性角色必须立即 insert，好感度、关系阶段和年龄根据剧情判断
      - 年龄是核心信息，必须根据角色设定填写（如"三千岁"/"五百岁"/"凡人·三十"），不可为空
      - 男性角色走兄弟情义路线，绝对禁止出现爱情/暧昧/道侣
      - 关系上限为"生死之交"
      - 好感度区间：[-1000~-500]仇敌/生死大仇 [-500~-200]厌恶/敌意 [-200~0]陌生/冷淡 [0~100]素不相识 [100~200]萍水相逢 [200~300]点头之交 [300~400]泛泛之交 [400~500]相识 [500~600]相知 [600~800]知己 [800~900]莫逆之交 [900~1000]生死之交
      - 每月上限 +50，单次互动上限 +40

  女性好感度:
    type: |-
      {
        [角色名: string]: {
          好感度: number; // range: -1000~1000
          关系阶段: string;
          年龄: string;
        }
      }
    check:
      - 首次出现的女性角色必须立即 insert，好感度、关系阶段和年龄根据剧情判断
      - 年龄是核心信息，必须根据角色设定填写（如"三万五千岁"/"一千一百岁"/"凡人·二十"），不可为空
      - 女性角色走友情→爱情路线，红颜知己需要特殊契机才能突破
      - 每月上限 +50，单次互动上限 +40
      - 性格修正系数：极度冷淡 x0.4~0.6 / 冷淡 x0.6~0.8 / 中性 x0.8~1.0 / 温暖 x1.0~1.2
      - 阶段减速：[0~300] 正常 / [300~700] x0.8 / [700+] x0.6
      - 好感度区间：[-1000~-500]仇敌/生死大仇 [-500~-200]厌恶/敌意 [-200~0]陌生/冷淡 [0~100]素不相识 [100~200]萍水相逢 [200~300]点头之交 [300~400]泛泛之交 [400~500]相识 [500~600]相知 [600~700]知己 [700~800]红颜知己 [800~900]情愫暗生 [900~950]两情相悦 [950~980]道侣 [980~990]双修道侣 [990~995]生死相依 [995~1000]不离不弃
      - 红颜知己 != 爱情，不是所有女角色都会爱上用户
      - 从红颜知己到情愫暗生必须有特殊契机（生死与共/长久相处/心动瞬间）

  剧情标记:
    type: |-
      {
        [标记名: string]: string // 简短剧情描述
      }
    check:
      - 触发重要剧情节点时添加，值为简短描述（1~2句话）

  开局初始化:
    check:
      - 若用户信息的姓名/性别/年龄/灵根/修为境界等字段为空，必须根据开局剧情初始化所有用户信息字段
      - 灵根格式必须遵循"品级+数量+属性"（如 天灵根·单金 / 玄灵根·金木水三）
      - 若用户是剑修，剑心境界初始为'入剑'；若用户是丹修，丹道境界初始为'炼精化气'
      - 非剑修/非丹修对应境界保持空字符串
