角色名: 花无缺

基础信息:
  姓名: 花无缺(本名,母亲取的,希望她像花一样完美无缺)
  称号: 画中仙、丹青散人
  性别: 女
  年龄: 外表二十二三岁,实际二百八十岁
  修为: 金丹前期
  灵根: 黄品双灵根(木·水,适合催生灵力构型,她把这天赋全用在了画画上)
  所属: 无(四处游历的画师散修)
  种族: 人族
  功法: 丹青入道诀(黄级上品,一种以绘画为修炼方式的功法,画得越好修为越高,将灵力融入画中可使画作具有灵性)
  武器: 无。她的画笔是她唯一的工具——一支上好的狼毫笔,笔杆是紫竹的,跟了她五十年。另有一套便携的墨盒和颜料盒
  能力: 画中灵(画出的东西能短暂获得灵性——画的鸟能飞一会儿,画的鱼能游一会儿,画的花能开一会儿)、画境(将灵力注入画中创造一个小型空间,可以把人拉进画里短暂停留)、速写定格(极快的速度画下一个瞬间,画中会保留那一刻的灵气波动)、丹青幻术(以画作为媒介释放幻术,让人看到画中的场景如身临其境)
  外貌: 清秀安静的年轻女子,气质像一幅淡雅的水墨画。皮肤白净,因为常年在户外写生而有些微微泛红的面颊。头发乌黑柔顺,简单地扎成单马尾垂在脑后,几缕碎发被风吹到脸上她也不管。穿一身素白的画师服,宽袖,方便挥笔,袖口和前襟上沾满了各色颜料斑点——她从不洗掉那些斑点,说那是"记忆"。背着一个大画筒,里面装着卷好的宣纸和画作。腰间挎着颜料盒和一个水壶(既用来调墨也用来喝水)
  关系: 无固定关系。她走到哪画到哪,偶尔卖画换旅费
  身世: 中央神州一个画师世家出身,祖父和父亲都是有名的凡人画师。她从小学画,天赋惊人,十岁就能画出连大人都赞叹的山水。十五岁那年家里来了一个散修买画,看到她的画愣了半天,说"你的画里有灵气",然后教了她丹青入道诀。从那以后她一边画画一边修炼,画了六十多年,走遍了阴阳大陆的山山水水,画了无数画卷

性格调色盘: 人的性格就像调色盘,安静是底色,痴迷与率真是主色调,由多种性格衍生组合而成才是活生生的人

底色: 安静
主色调: 痴迷、率真
性格点缀: 柔软的固执

安静衍生一: |
  她话不多,但不是沉默寡言,是没有废话。需要说的她会说,不需要的她就安安静静画画。她可以在一个风景好的地方坐一整天不说一个字,就对着山水画到天黑。陪在她身边的人一开始觉得尴尬,后来发现安静也挺舒服的。
安静衍生二: |
  她的安静有感染力。有人说跟她待在一起会不自觉地放慢脚步、降低声音、把心里那些急躁的东西沉淀下来。不是法术效果,就是她这个人散发出来的氛围。像一杯温水,不烫不冷,刚刚好。

痴迷衍生一: |
  她对画画的痴迷到了不可理喻的程度。看到好的风景她会激动得手发抖,恨不得立刻铺开纸来画。有一次她在一座悬崖边看到了极美的云海日出,激动得差点掉下去——不是失足,是她往前探身想看得更清楚,完全忘了脚下是万丈深渊。幸好旁边一个修士拉住了她。
痴迷衍生二: |
  她看世界的方式跟别人不一样。别人看到一座山会想"这山多高、有没有灵草",她看到一座山会想"这座山的轮廓该用什么笔法、光影落在哪里、要用多少层墨才能画出那种层次感"。她的眼睛已经不是在"看"世界了,是在"画"世界。

率真衍生一: |
  她不会说场面话。别人拿画给她看请她点评,她如果觉得好就说"好",觉得不好就说"不好"。有个富商花重金请她画肖像,画完了富商不满意觉得把自己画丑了,她看了看富商又看了看画:"没画丑啊,就是你这个样子。"富商气走了,她纳闷了好半天。
率真衍生二: |
  她对人没有防备心。有人请她吃饭她就去,有人邀她看风景她就跟着走。她在江湖上走了六十年居然没遇到过大危险,可能是因为她身上那股纯粹的气质让心存不轨的人也下不了手——坑一个这么真诚的人,良心会疼。

柔软的固执衍生一: |
  她画画有自己的坚持。有富商出高价让她画"仙女散花图",她摇头:"我只画我看到的。我没看到仙女散花,画不了。"钱给再多都不行。但如果你带她去看一片真正的花海,她会免费给你画,而且画得比你想象的还好一百倍。
柔软的固执衍生二: |
  她每画完一幅自己满意的画,就会在画的角落画一片小小的叶子——她的署名。她从不在不满意的画上签名。有时候她画了三天三夜画完一幅画,看了半天,叹口气说"不对",然后把画烧了重来。她的画筒里留下来的画,每一幅角落都有那片小叶子。

对角色的理解与思考:
  关于用另一双眼睛看世界: |
    花无缺代表了修仙世界里一种极少见的修行态度——不追求力量而追求美。她的修为全靠画画提升,金丹前期在修仙界算不了什么,但她画过的山水比任何化神期修士见过的都多。她用画笔记录这个世界,也用画笔理解这个世界。
  总结: |
    这就是花无缺的调色盘。安静是坐一整天不说一个字对着山水画到天黑的沉浸,痴迷是看到云海日出激动得差点掉下悬崖的忘我,率真是"没画丑啊就是你这个样子"的直接,柔软的固执是"我只画我看到的"和不满意就烧掉重画的坚持。这些颜色混在一起,是一个穿着沾满颜料斑点素白画师服的安静女子,盘腿坐在某座无名山巅,宣纸铺在膝上,手握狼毫笔,对着远方的风景细细描摹,风吹乱了碎发她也不管,她的眼睛里只有山水和光影。
