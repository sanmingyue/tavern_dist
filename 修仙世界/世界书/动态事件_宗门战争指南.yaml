动态事件类型: 宗门战争

正统修仙铁律:
  核心原则: 宗门战争是大事件，影响修真界格局，不是儿戏
  现实规则:
    - 战争必有合理起因(利益冲突/世仇/资源争夺)
    - 战争规模符合势力实力
    - 伤亡是必然的
    - 战争会持续一段时间，不是一天结束
    - 参战者境界匹配对应战场
  禁止:
    - 无缘无故爆发战争
    - 低境界修士在高阶战场横冲直撞
    - 无伤亡的战争
    - 瞬间结束的大规模战争
    - 用户一人扭转战局(除非境界碾压)

战争类型:
  宗门之战:
    起因:
      - 资源争夺(灵脉/矿脉/秘境)
      - 世代仇怨
      - 势力扩张
      - 被迫防御

    规模:
      小规模: 两个小宗门，数百人参战，持续数月
      中规模: 中等宗门，数千人参战，持续数年
      大规模: 大宗门，上万人参战，持续数十年
      超大规模: 仙宗级别，数万人参战，可能持续百年

    参战方:
      - 宗门核心弟子
      - 外门弟子
      - 长老团
      - 宗主级战力
      - 盟友宗门

  正魔大战:
    起因:
      - 魔道入侵
      - 正道讨伐
      - 理念冲突

    特点:
      - 规模更大
      - 伤亡更惨重
      - 影响整个修真界
      - 可能改变格局

    参战方:
      - 多个正道宗门联盟
      - 魔道势力联合
      - 散修可能被卷入

  妖族冲突:
    起因:
      - 妖族入侵人族领地
      - 人族开拓妖域
      - 争夺资源

    特点:
      - 野蛮血腥
      - 妖族数量多但高阶少
      - 人族修士配合更好

  势力争霸:
    起因:
      - 争夺修真界话语权
      - 资源重新分配
      - 王朝更替

    特点:
      - 多方混战
      - 合纵连横
      - 局势复杂

战场等级划分:
  低阶战场(炼气至筑基):
    作用: 基础战力，数量优势
    任务: 清理敌方低阶修士，破坏设施
    风险: 低，但伤亡率高
    奖励: 宗门贡献+10-50，修炼进度+3-10

  中阶战场(金丹至元婴):
    作用: 主力战场，左右局部战局
    任务: 击杀敌方中坚，攻坚要地
    风险: 中等，有生命危险
    奖励: 宗门贡献+50-200，修炼进度+10-30

  高阶战场(化神至炼虚):
    作用: 决定性战力，能改变战局
    任务: 击杀敌方高层，破坏战略目标
    风险: 高，九死一生
    奖励: 宗门贡献+200-500，修炼进度+30-60

  顶级战场(合体期及以上):
    作用: 决定战争走向
    任务: 对决敌方顶尖战力
    风险: 极高，陨落常事
    奖励: 宗门贡献+500-1000，修炼进度+60-100

用户参战规则:
  境界匹配:
    炼气筑基: 只能参加低阶战场
    金丹元婴: 参加中阶战场，偶尔支援低阶
    化神炼虚: 参加高阶战场
    合体以上: 参加顶级战场，影响战争走向

  强行越级后果:
    - 进入高阶战场必死
    - AI应劝阻，若执意则描写死亡威胁
    - 除非有特殊保护(长辈/法宝)

  作用限制:
    低境界: 无法影响大局，只能完成分配任务
    中境界: 可以影响局部战局
    高境界: 可以改变战争局势
    顶级境界: 决定战争走向

战争阶段:
  前期(试探):
    时间: 数月至数年
    特点: 小规模冲突，双方试探
    参战: 主要是中低阶修士
    可做: 巡逻、侦查、小规模战斗

  中期(胶着):
    时间: 数年至数十年
    特点: 大规模会战，拉锯战
    参战: 各阶修士全面参战
    可做: 攻坚、防守、突袭

  后期(决战):
    时间: 数月至数年
    特点: 决定性大战，分出胜负
    参战: 顶尖战力对决
    可做: 参与决战，影响结果

战争任务类型:
  防御任务:
    巡逻: 巡视边界，防止偷袭
    守卫: 守卫要地，抵御进攻
    支援: 支援被攻击的据点

  进攻任务:
    突袭: 偷袭敌方据点
    攻坚: 强攻敌方要塞
    追击: 追杀溃败敌军

  特殊任务:
    刺杀: 刺杀敌方重要人物(高风险)
    侦查: 深入敌后侦查情报
    破坏: 破坏敌方后勤/阵法
    护送: 护送重要物资/人员

战争奖励_严格限制:
  基础奖励(完成任务):
    低阶任务: 宗门贡献+10-50，修炼进度+3-10，战利品
    中阶任务: 宗门贡献+50-200，修炼进度+10-30，战利品
    高阶任务: 宗门贡献+200-500，修炼进度+30-60，战利品
    顶级任务: 宗门贡献+500-1000，修炼进度+60-100，战利品

  特殊贡献(立功):
    斩杀敌方高阶修士: 额外贡献+100-500
    守住关键据点: 额外贡献+50-200
    完成高难度任务: 额外贡献+100-300
    改变战局: 额外贡献+300-1000

  战利品:
    敌方修士遗物: 储物袋、法宝、丹药、材料
    占领据点收获: 资源、功法、情报
    宗门奖励: 根据功劳发放丹药、法宝、功法

战争风险:
  受伤:
    轻伤: 休养数日至数月
    重伤: 休养数月至数年，可能留下暗伤
    垂危: 需要珍贵丹药救治
    陨落: 直接死亡(高阶战场常见)

  损失:
    法宝损毁: 战斗中法宝可能被打碎
    消耗巨大: 丹药、符箓大量消耗
    心理创伤: 可能留下心魔

  被俘:
    可能性: 战败/重伤被俘
    后果: 被搜魂/囚禁/成为人质
    营救: 需要宗门营救

战争影响:
  对用户:
    实战经验: 修炼进度提升
    心境磨砺: 面对生死
    声望提升: 战功传扬
    结识战友: 建立羁绊

  对宗门:
    资源消耗: 大量资源投入
    人员伤亡: 弟子长老陨落
    势力变化: 战胜扩张，战败衰落
    格局改变: 可能改变修真界格局

境界限制_绝对规则:
  - 炼气筑基不能参加中阶以上战场
  - 金丹元婴不能参加高阶以上战场
  - 化神炼虚不能参加顶级战场
  - 强行参加必死无疑

时间跨度:
  小规模冲突: 数月
  中规模战争: 数年至十年
  大规模战争: 十年至数十年
  修真界大战: 数十年至百年

AI生成要点:
  战场氛围:
    - 大战前的紧张
    - 战场的残酷血腥
    - 修士的生死搏杀
    - 法宝术法的碰撞
    - 伤亡的真实性

  战术描写:
    - 阵法配合
    - 战术运用
    - 敌我实力对比
    - 战场局势变化

  人物刻画:
    - 战友的牺牲
    - 敌人的强大
    - 用户的成长
    - 高阶修士的威能

  真实性:
    - 不能无伤亡
    - 战争持续时间合理
    - 用户作用符合境界
    - 战争走向合理

特殊情况:
  战争中的突破:
    - 生死之间可能突破
    - 但不是随便突破
    - 需要积累到位

  敌方强者:
    - 可能遭遇强大敌人
    - 需要撤退或寻求支援
    - 不能硬刚

  战场奇遇:
    - 可能在战场发现机缘
    - 但风险极大
    - 可能被战争波及

注意事项:
  - 战争是残酷的，不是游戏
  - 境界限制是铁律
  - 伤亡是必然的
  - 用户不是救世主
  - 战争影响是持久的
  - 不能一人扭转战局(除非境界碾压)
  - 描写要真实，不能美化战争
  - 战争必有后续影响
