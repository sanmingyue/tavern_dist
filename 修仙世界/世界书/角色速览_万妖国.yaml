势力: 万妖国
区域: 东荒妖域

核心角色速览:

金翅大鹏王:
  称号: 妖皇、万妖国之主
  修为: 真仙境(具体重天不详)
  种族: 妖族(金翅大鹏)
  定位: 东荒妖域名义共主,血脉至上体制的维护者

厉牙:
  称号: 杂种、百兽谷的野狗、十万大山最不该活下来的东西
  修为: 元婴中期
  种族: 混血妖族(父影狼族,母银狐族——两个世仇种族的禁忌血脉)
  定位: 血脉为尊体制的反叛者,靠本能和意志硬磨出修为的混血弃子
  理念: 血脉纯度和修炼潜力之间没有必然联系
  特点: 冷愤怒,硬骄傲,深孤独;嘴上说不在乎谁但偷偷给弃子们留肉
  目标: 变得足够强大,在百兽谷建一个不问血统的收容所(他自己觉得这个想法很蠢)
  关键词: [混血禁忌, 影遁幻雾, 异色瞳, 隐藏的正义感, 百兽谷弃子]

势力关系网:
  妖皇: 金翅大鹏王 → 名义共主
  圣城: 万妖圣城 → 绝对核心
  底层: 厉牙及混血弃子们 → 体制最底层的反抗者
  狐族: 青丘(涂山鸾) → 妖国外交智囊
  边境: 噬荒教(弥苍赦) → 落日峡谷边界势力
