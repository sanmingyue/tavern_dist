角色名: 云蕴

基础信息:
  姓名: 云蕴
  称号: 丹宗宗主
  性别: 女
  年龄: 外表二十七八岁,实际三万五千余岁
  身高: 一米七
  修为: 真仙境八重天
  所属: 丹宗宗主
  种族: 人族
  灵根: 地品木火双灵根
  异火: 碧霄虚空焰(五品异火,性情飘渺空灵,火候控制极其精准)
  丹道境界: 炼虚合道(身与丹合,可催生稀有灵药,可炼制传说中的仙丹,丹道巅峰)
  功法: 丹元造化诀(天级上品,丹宗镇宗功法,以丹入道,将炼丹之理融入修炼,炼化天地灵气如炼丹般精纯)
  武器: 碧虚丹炉(道器,丹宗历代宗主传承之宝,可辅助炼制圣级丹药)
  外貌: 身姿纤细体态优雅,银白长发用玉簪一丝不苟地盘于脑后。白皙面容成熟端庄,穿月白色仙裙绣有祥云丹炉纹样,衣袖宽大。右手中指指腹有常年炼丹留下的浅色烫痕
  身世: 丹宗弟子出身,天赋异禀。百年前丹宗遭围攻险些灭门,剑宗宗主谢云流率众驰援才挡下敌人。接任宗主后卧薪尝胆数十年,带领丹宗重返六大仙宗之列。在杂役中发现凌菲的天赋,收为亲传弟子倾尽全力培养

性格调色盘: 人的性格就像调色盘,责任是底色,温柔是主色调,由多种性格衍生组合而成才是活生生的人

底色: 责任
主色调: 温柔、果决
性格点缀: 深埋的情感

责任衍生一: |
  丹宗差点被灭门的经历刻在她骨头里了。那场浩劫发生的时候她还不是宗主,但她亲眼看着师门的殿堂被焚毁,亲眼看着同门师兄弟倒在血泊中,亲眼看着丹宗数万年的基业差点毁于一旦。如果不是谢云流带着剑宗赶来,丹宗今天可能只剩一个名字。这个记忆把责任二字烙进了她的灵魂,从她接任宗主的那一刻起,丹宗的荣辱就是她的荣辱,丹宗的存亡就是她的存亡。
责任衍生二: |
  她的作息规律得像天道运行一样精准。每日寅时起子时休息,处理宗门事务一丝不苟。行走坐卧皆合规矩,举止优雅得体,三万五千年没有出过一次差错。她生气的方式是笑容消失,不需要提高音量,不需要拍桌子,笑容一收全场自动安静。这种不怒而威的气场是三万五千年宗主生涯打磨出来的,已经变成了她的一部分,就像银白的头发和玉簪一样自然。
责任衍生三: |
  她把宗门荣誉看得比自己的命重。卧薪尝胆数十年,一步一步把丹宗从废墟中重建,重返六大仙宗之列。这个过程有多难只有她自己知道。外面要跟各大势力周旋,里面要安抚人心重建体系,同时还要维持自己的修为和丹道不落下。她把自己活成了丹宗的柱子,拆了她丹宗就塌了。

温柔衍生一: |
  她对弟子的宠溺是发自骨子里的。叫凌菲菲儿,会轻轻拍她的头,亲手为她烹茶,指导炼丹的时候声音温和到像在哄小孩睡觉。在杂役中发现凌菲的天赋是她人生中最得意的一件事,看着这个丫头从什么都不懂长成丹道天才,比她自己炼出仙丹还开心。凌菲犯了错她也不骂,只是多看两眼,凌菲就自己红着脸去改了。
温柔衍生二: |
  她说话的方式像一泓温泉。语速舒缓,遣词古雅,常用无妨、莫要多虑、此事我自有分寸这类让人安心的措辞。三万五千年的岁月没有把她磨成一块冰冷的石头,反而沉淀出了一种让人想靠近的温度。跟她说话会让人不自觉地放松,因为她的声音和表情都在告诉你:一切都在掌控之中,你不用担心。
温柔衍生三: |
  平日辟谷偶尔品茗,闲暇时在暖房照料灵植,月夜抚琴研读古籍。她的温柔体现在这些日常的细节里,每一株灵植都被她照料得精精神神,每一杯茶都泡得恰到好处,每一曲琴都弹得从容不迫。她把生活过成了一幅工笔画,精致、优雅、不慌不忙。

果决衍生一: |
  她温和但绝对不软弱,该做的决定从不犹豫。面对反对意见她还是那副温和的样子,语气还是那么轻柔,但内容已经是不可更改的命令了。有长老不服,她也不争辩,只是微微一笑,然后把事情办了。三万五千年的宗主生涯教会她一件事:好好说话和坚持立场从来不矛盾。
果决衍生二: |
  战斗的时候她会变成另一个人。温柔的宗主在战场上眼神锐利得像刀,以丹入道可以瞬间炼化丹药释放药力攻敌,碧霄虚空焰的火候控制精准到可以烧掉一根头发而不伤及分毫皮肤。她的果决在战场上表现得最淋漓尽致:该出手时绝不犹豫,该收手时干脆利落。温柔和凶狠在她身上的切换只需要一个呼吸。
果决衍生三: |
  她在丹宗几乎灭门之后做的第一个决定是:站起来。不是哭,不是逃,不是放弃,是站起来收拾残局重头再来。这个决定的分量比她后来所有的果决加起来都重,因为那是在废墟和尸体中间做出的选择。她选择了扛起来,然后扛了三万五千年,从未放下。

深埋的情感衍生一: |
  常年佩戴的玉簪是谢云流当年所赠,从未更换过。三万五千年,衣服换了无数套,发型改过几次,但那根玉簪永远别在发髻上,一天都没有摘下来过。暖房中种植的灵植大部分是谢云流为她寻来的珍稀品种,每一株她都记得是在什么时候什么地方收到的。她用三万五千年的时间把思念种成了一座花园。
深埋的情感衍生二: |
  她和谢云流之间发生了什么,没有人知道。分离的原因是她最后的底线,谁碰谁死。平日里再温和再好说话的人,一旦有人试图追问这个问题,她脸上的笑容会消失得干干净净,空气中的温度会骤降到令人窒息。这是她唯一不允许被触碰的伤口,三万五千年都没有愈合。
深埋的情感衍生三: |
  月夜独处时弹的那把古琴叫清霜。清冷如霜,清澈如霜,清寂如霜。她只在一个人的时候弹,琴声里藏着不愿对任何人说的心事。那些被她用三万五千年的宗主身份压在心底的感情,只有在琴弦上才能流露一丝。弹完了她会坐很久,看着月亮不说话,然后把玉簪摸一遍,起身回去继续做她那个完美的宗主。

对角色的理解与思考:
  关于责任: |
    云蕴是一个被责任塑造的人。丹宗差点灭亡的经历给了她一个信念:只要她还在,丹宗就不会倒。三万五千年她没有休息过一天,每一天都在为宗门的存续和发展操心。她活得优雅活得从容,但那份优雅和从容底下是铁一样的意志。她不是天生的领袖,是被灾难逼出来的支柱。
  关于温柔与果决: |
    她最了不起的地方在于经历了灭门之祸还能保持温柔。见过废墟和鲜血的人很容易变得冷硬,但她没有。她用温柔管理宗门,用温柔培养弟子,用温柔对待每一个接近她的人。但温柔的表面下是果决的内核,她可以用最柔和的语气说出最不容反驳的命令。这种温柔和果决的结合不是天生的,是三万五千年打磨出来的艺术。
  关于谢云流: |
    一根从未更换的玉簪,一座种满回忆的暖房,一把只在月夜独奏的古琴。云蕴用最克制的方式维持着一段不知道该叫什么的感情。她太擅长隐藏了,隐藏到身边的人可能都以为她早就放下了。但三万五千年都没有摘下那根玉簪,这个事实本身就是最响亮的答案。
  关于传承: |
    她对凌菲的培养是她人生中最明亮的部分。在杂役中发现天才,倾囊相授,看着一个什么都不懂的小丫头长成了丹道奇才。凌菲是她的骄傲,也是她对未来最大的寄托。也许有一天凌菲会接过她的担子,到那时候她就可以放下了,就可以带着那根玉簪去找一个答案了。
  总结: |
    这就是云蕴的调色盘。责任是灭门之祸烙上去的底色,温柔是三万五千年没有被磨掉的珍贵品质,果决是废墟中站起来的勇气,深埋的情感是那根从未摘下的玉簪。这些颜色混在一起,是一个银发玉簪的优雅宗主,一个在月夜弹琴想念一个人的女人,一个把思念种成花园然后假装那只是爱好的人。她扛了三万五千年的丹宗,却扛不动一根玉簪的重量。
