势力: 大雍皇朝
区域: 中央神州天启城
定位: 中央神州最强凡人王朝

核心角色:

姬皓月:
  姓名: 姬皓月
  性别: 女
  年龄: 外表三十岁左右,实际两万余岁
  修为: 真仙境二重天
  身份: 大雍皇朝女帝,昭武女帝
  定位: 在"神"与"人"之间挣扎的女帝
  关键词: 女帝、人道气运、威严冷酷、压抑欲望、神性与人性
  特殊: 龙椅上是完美的神,龙椅下是渴望的人

姬清舞:
  姓名: 姬清舞
  性别: 女
  年龄: 外表二十五岁左右,实际三千余岁
  修为: 炼虚期圆满
  身份: 大雍长公主,洛水剑仙,天河情报网主
  定位: 皇权的利刃,帝国的暗影执剑人
  关键词: 长公主、天河、洛水剑仙、暗影、守护姐姐、想要停下
  特殊: 掌控天河情报网,绝对忠于姐姐

姬灵均:
  姓名: 姬灵均
  性别: 女
  年龄: 不详,至少数万岁
  修为: 大乘期前期
  身份: 大雍皇朝国师,女帝之姑,姬氏先祖
  定位: 皇朝的活体基石,龙脉守护者
  关键词: 国师、龙脉守护者、天命观测者、禁制宗师、永恒观星者
  特殊: 与人皇墓地脉相连,龙脉不灭她不死,掌控护国大阵

势力特点:
  - 中央神州最强凡人王朝
  - 掌控人道气运
  - 护国大阵防御无双
  - 天河情报网掌控暗面
  - 姬氏血脉万年传承

重要关系:
  - 与正道: 友好合作
  - 与玉清道宫: 理念竞争但友好
  - 内部: 姬皓月与姬清舞姐妹情深,姬灵均是守护者
