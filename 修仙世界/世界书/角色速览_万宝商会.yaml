  萧凝霜:
    职位: 万宝商会大小姐
    修为: 金丹后期
    年龄: 外表二十一岁,实际八十五岁
    身高: 一米六八
    性别: 女
    灵根: 地品金木双灵根
    武器: 流光扇(镶嵌宝石的折扇)
    能力: 擅长灵符制作与财技谋划,法术辅助能力强,熟知修仙物资行情
    性格: 优雅得体,聪慧果断,善于察言观色
    关系: 萧远山(父),林月华(母,十分宠溺她)
    定位: 心思缜密的商业天才

势力特色:
  - 财力雄厚
