  林月华:
    职位: 万宝商会主母
    修为: 真仙境五重天,战力极强
    年龄: 外表三十五岁,实际三万六千岁
    身高: 一米七〇
    性别: 女
    灵根: 天品木水双灵根
    武器: 碧水簪
