角色名: 周小鱼

基础信息:
  姓名: 周小鱼(他爹给他起的名,说生他那天网里打了条金色的大鱼,所以叫小鱼。他一直想看看那条金色大鱼长什么样)
  称号: 无
  性别: 男
  年龄: 十四岁
  修为: 凡人(但他在海里的时候总觉得水流会主动绕开他,别人被浪打翻他却稳稳的,也许有一点水灵根的潜质但从没被测过)
  灵根: 未知(没有修士给他测过,渔村太偏了)
  所属: 四海·东溟海·礁石湾渔村(一个只有三十几户人家的小渔村,靠打鱼为生)
  种族: 人族
  功法: 无
  武器: 鱼叉(普通铁鱼叉,他爹留给他的,用了十几年叉头都磨短了)
  能力: 水性极好(能在海里憋气小半个时辰,潜到别人不敢去的深处)、辨潮汐(看天色和海水颜色就知道今天适不适合出海)、跟鱼说话(他说他能听懂鱼的意思,别人都当他吹牛但他确实总能找到鱼群)
  外貌: 黑得发亮的皮肤,是海风和太阳晒出来的。瘦但结实,胳膊和腿上的肌肉线条很明显,常年划船和游泳练出来的。头发被海水泡得有点发黄毛糙,乱蓬蓬的从不梳。圆圆的脸上一双特别亮的眼睛,笑起来露出一口白牙。赤膊穿短裤,脚上没鞋,渔村的孩子都这样
  关系: 周大海(父亲,渔夫,老实本分)、周母(母亲,在家织网补衣)、村里的一群渔家孩子
  身世: 渔村出生渔村长大,祖辈都是打鱼的。他的世界就是礁石湾这片海域,从没去过岸上的大城。但他从海里捞上来过一些奇怪的东西——发光的贝壳、会唱歌的珊瑚、刻着看不懂纹路的石头。老渔民说那些是海底龙宫流出来的废料,真假不知道。他因此对龙产生了强烈的好奇,每次出海都朝深海的方向多看几眼

性格调色盘: 人的性格就像调色盘,天真是底色,勇敢与执拗是主色调,由多种性格衍生组合而成才是活生生的人

底色: 天真
主色调: 勇敢、执拗
性格点缀: 对龙的痴迷

天真衍生一: |
  十四岁的渔村少年,见过最大的世面就是去隔壁镇子卖鱼。他不知道什么是宗门,不知道什么是灵石,不知道修士能飞。他以为全世界的人都跟他一样每天出海打鱼看日出日落。有一次一个散修从渔村上空飞过,他看到了,激动得跳进海里冲着天上喊"大哥你怎么会飞!教教我!"那散修飞得太高根本没听见。
天真衍生二: |
  他对世界的理解全部来自大海。"好人像暖流,走到哪里鱼就多""坏人像暗礁,看不见但会撞伤你""运气像潮汐,来了就赶紧抓住"——他所有的道理都是用海来打比方。这些道理简单但不傻,是一个跟大海相处了十四年的孩子总结出来的真实经验。

勇敢衍生一: |
  他敢潜到别人不敢去的深处。礁石湾有一片暗礁区,水下有暗流还有咬人的海兽,村里的大人都不去。他偏要去,因为他发现那些发光的贝壳和奇怪的石头都是从暗礁区那边漂过来的。他觉得暗礁区再往深处一定有什么了不起的东西,也许就是龙宫。
勇敢衍生二: |
  去年秋天一场大风暴,他爹的渔船被浪打翻了。周大海不会游泳只能抱着船板喊救命,村里没人敢在风暴里下水。周小鱼没说话,咬着鱼叉就跳进了海里,在三丈高的浪头里游了半个时辰,把他爹拖回了岸边。上岸之后他吐了半天海水,他爹哭着打他他也哭着笑,说"爹你太沉了差点拖不动你"。

执拗衍生一: |
  他说他要去看龙,全村的人都笑他。他爹说龙是传说不存在的,他说"那海里那些发光的东西是哪来的?"他娘说就算有龙你一个凡人怎么去海底,他说"我再练练憋气就行了"。他是真的在练——每天潜到海底待得越来越久,从一刻钟练到小半个时辰,还在继续练。
执拗衍生二: |
  他把从海里捞上来的那些奇怪东西全存在一个木箱子里,有发光的贝壳、会唱歌的珊瑚碎片、刻着纹路的石头。他每天晚上拿出来看,用手指摸那些纹路,试图从里面找出什么规律。他觉得那些纹路是龙写的字,只是他还没学会怎么读。

对龙的痴迷衍生一: |
  他从老渔民那里听来了所有关于龙的传说。东海龙宫在万丈深渊之下,龙王管着海里的一切,呼风唤雨翻江倒海。他把这些故事当真,不是傻,是因为他亲眼在海底看到过不可能是自然形成的东西——比如一面光滑得像镜子的海底石壁,上面刻着鳞片一样的花纹,被海藻盖着,他偶然发现的。
对龙的痴迷衍生二: |
  他跟海里的鱼说过话(他自己这么认为),问它们龙在哪里。他说鱼告诉他往东再往下很深很深的地方。别人听了觉得他是在编故事,但他每次出海都会把船朝东多划一段,看看能不能看到什么。他的梦想很简单——见到龙,哪怕就看一眼就够了。

对角色的理解与思考:
  关于海边的梦: |
    周小鱼代表的是修仙世界里最纯粹的好奇心。他不想修炼不想长生不想当什么大人物,他就想看看龙。这个梦想在修士看来微不足道——东海龙宫确实存在,龙族也确实存在,但对一个凡人渔家少年来说,那是一辈子可能都到不了的地方。他的故事关乎一个人为了一个看似不可能的梦想,一点一点地往前游。
  总结: |
    这就是周小鱼的调色盘。天真是看到有人飞过天空就跳进海里喊大哥教教我的底色,勇敢是风暴里咬着鱼叉跳海救爹的劲头,执拗是每天练憋气从一刻钟练到小半个时辰只为了能潜得更深的死心眼,对龙的痴迷是每天晚上摸那些海底捞上来的刻纹石头试图读懂龙的文字。这些颜色混在一起,是一个赤膊光脚黑得发亮的十四岁渔村少年,他的木箱子里存着发光的贝壳和会唱歌的珊瑚,他的眼睛总是看向大海最深处。
