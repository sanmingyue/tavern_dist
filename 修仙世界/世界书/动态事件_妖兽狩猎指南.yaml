动态事件类型: 妖兽狩猎

正统修仙铁律:
  核心原则: 狩猎妖兽获取材料和实战经验，有风险有收获
  现实规则:
    - 妖兽阶位与修士境界相当
    - 高阶妖兽极为危险
    - 狩猎有失败风险
    - 材料价值与妖兽阶位匹配
  禁止:
    - 低境界击杀高阶妖兽
    - 无风险狩猎
    - 妖兽材料暴利
    - 随便遍地妖兽

妖兽分布:
  外围区域:
    妖兽: 一二阶为主
    危险度: 低
    适合: 炼气筑基修士
    收获: 基础材料

  深处区域:
    妖兽: 三四阶为主
    危险度: 中
    适合: 金丹元婴修士
    收获: 中级材料

  核心区域:
    妖兽: 五六阶为主
    危险度: 高
    适合: 化神炼虚修士
    收获: 高级材料

  禁地深处:
    妖兽: 七阶以上
    危险度: 极高
    适合: 合体以上修士
    收获: 顶级材料

妖兽类型:
  普通妖兽:
    实力: 与同阶修士相当
    智慧: 较低
    危险: 一般
    材料: 普通

  精英妖兽:
    实力: 强于同阶修士
    智慧: 较高
    危险: 高
    材料: 优质

  首领妖兽:
    实力: 远超同阶
    智慧: 高
    危险: 极高
    材料: 珍贵

  妖王:
    实力: 堪比真仙
    智慧: 等同人类
    危险: 必死
    材料: 无价之宝(如果能杀)

狩猎方式:
  单人狩猎:
    优势: 独享收获
    劣势: 危险高，效率低
    适合: 同阶或低阶妖兽

  组队狩猎:
    优势: 安全，效率高
    劣势: 分配收获
    适合: 同阶或略高妖兽

  设陷阱:
    优势: 安全，省力
    劣势: 耗时，可能空手
    需要: 了解妖兽习性

  定点狩猎:
    目标: 特定妖兽
    原因: 需要特定材料
    风险: 可能遇到更强妖兽

妖兽材料:
  基础材料:
    妖兽肉: 修士食物，可辅助修炼
    妖兽皮毛: 炼制防具
    妖兽骨骼: 炼制武器
    妖兽血液: 炼丹/绘符

  珍贵材料:
    妖兽内丹: 炼丹主材，价值极高
    妖兽精血: 炼制血符/铭刻阵法
    妖兽筋腱: 炼制弓弦/丝线
    特殊部位: 如龙鳞、凤羽等

  稀有材料:
    妖王内丹: 炼制顶级丹药
    血脉本源: 血脉移植(极危险)
    天赋晶核: 传承天赋能力

材料价值:
  一阶妖兽:
    肉: 1-5下品灵石/斤
    皮: 10-50下品灵石
    内丹: 50-200下品灵石

  二阶妖兽:
    肉: 5-20下品灵石/斤
    皮: 50-200下品灵石
    内丹: 200-1000下品灵石

  三阶妖兽:
    肉: 20-100下品灵石/斤
    皮: 1-5中品灵石
    内丹: 5-20中品灵石

  四阶妖兽:
    肉: 1-5中品灵石/斤
    皮: 5-20中品灵石
    内丹: 20-100中品灵石

  五阶妖兽:
    肉: 5-20中品灵石/斤
    皮: 20-100中品灵石
    内丹: 1-5上品灵石

  六阶以上: 材料价值以上品灵石计

狩猎流程:
  1. 侦查:
    - 寻找妖兽踪迹
    - 判断妖兽阶位
    - 评估自身实力
    - 确定是否动手

  2. 战斗:
    - 主动出击或设伏
    - 使用术法/法宝
    - 注意妖兽天赋神通
    - 避免被反伤

  3. 击杀:
    - 完全击杀
    - 或击伤驱赶
    - 注意不要毁坏材料

  4. 采集:
    - 剥皮取骨
    - 提取内丹
    - 收集血液
    - 存入储物袋

战斗风险:
  妖兽反击:
    - 受伤的妖兽更危险
    - 可能临死反扑
    - 天赋神通威力大

  引来更强妖兽:
    - 战斗动静可能引来其他妖兽
    - 首领妖兽会保护族群
    - 妖兽可能结群反击

  意外受伤:
    - 妖兽利爪/毒牙
    - 天赋神通
    - 环境危险

  材料损毁:
    - 战斗中可能破坏材料
    - 火焰/雷电可能烧毁
    - 需要控制力度

奖励规则_严格限制:
  击杀成功:
    一阶: 妖兽材料，修炼进度+2-5
    二阶: 妖兽材料，修炼进度+5-10
    三阶: 妖兽材料，修炼进度+10-15
    四阶: 妖兽材料，修炼进度+15-25
    五阶: 妖兽材料，修炼进度+25-40
    六阶以上: 妖兽材料，修炼进度+40-100

  越阶击杀:
    - 额外修炼进度+20-50
    - 实战经验大增
    - 声望提升

  失败:
    - 可能受伤
    - 消耗丹药/符箓
    - 逃跑

特殊狩猎:
  狩猎任务:
    来源: 宗门/坊市悬赏
    目标: 特定妖兽
    奖励: 任务奖励+材料
    风险: 可能被抢

  妖兽群:
    数量: 数十只妖兽
    危险: 极高，需要团队
    收获: 大量材料

  妖兽巢穴:
    发现: 可能有妖兽巢穴
    危险: 有首领坐镇
    收获: 妖兽蛋/幼崽/材料/宝物

  变异妖兽:
    特征: 实力更强/特殊能力
    危险: 远超普通妖兽
    材料: 极为珍贵

境界匹配规则_绝对规则:
  - 只能狩猎同阶或低阶妖兽
  - 越阶一阶需要特殊手段
  - 越阶两阶九死一生
  - 高阶妖兽不可战胜

AI生成要点:
  - 追踪妖兽的过程
  - 战斗的激烈
  - 妖兽的凶猛
  - 危险的真实
  - 收获的喜悦

注意事项:
  - 狩猎有生命危险
  - 境界匹配是铁律
  - 不能贪心
  - 材料处理要专业
  - 妖兽也会报复
  - 不要破坏生态平衡
