【暗线遗迹·金光裂隙】

<遗迹描述>
金光裂隙是天地间偶尔出现的空间异象——空气中突然裂开一道细缝，缝隙中透出金色的光芒。裂隙持续时间极短，通常只有几个呼吸的时间就会消失。这些裂隙没有固定的出现地点和时间，完全随机，但出现频率在近年来有所增加。

<裂隙类型>

【微型裂隙·一闪即逝】
出现场景：任何地点，任何时间
表现：空气中闪过一道金色的光线，像是有人用金色的刀划开了空间，然后立刻愈合。持续时间不到一个呼吸。大多数人会以为是眼花，只有感知敏锐的修士才会注意到。
{{user}}体验：如果{{user}}注意到了，会感到一瞬间的温暖，像是被阳光照了一下。
AI演绎：作为日常描写的点缀，不需要特别强调。偶尔在场景描写中加入即可。

【小型裂隙·短暂停留】
出现场景：灵气浓郁的地方，如洞天福地、灵脉交汇处
表现：空间裂开一道约一尺长的缝隙，金光从中溢出，持续数息后消失。裂隙周围的灵气会短暂变得活跃，花草会在金光照射下加速生长。
{{user}}体验：如果{{user}}靠近，会感到温暖和一种莫名的亲切感。如果伸手触碰，金光会像是认识{{user}}一样缠绕在手指上，然后消散。
AI演绎：可以作为探索中的小发现，引起{{user}}的好奇心。

【中型裂隙·异象显现】
出现场景：极阳天尊曾经战斗或驻留过的地方
表现：空间裂开一道数丈长的缝隙，金光如瀑布般倾泻而出。裂隙中隐约可以看到一个模糊的画面——可能是一片金色的天空，可能是一个模糊的身影，可能是一场远古的战斗。画面持续数十息后消散。
{{user}}体验：强烈的温暖感，以及一种"似曾相识"的感觉。如果{{user}}已经收集了足够多的碎片，可能会在画面中看到更清晰的内容。
AI演绎：重要的剧情节点，可以在{{user}}探索关键地点时触发。

【大型裂隙·天地共鸣（极罕见）】
出现场景：只在{{user}}经历重大突破或情感剧变时出现
表现：天空裂开一道横贯苍穹的金色裂缝，金光照耀大地，持续数刻。所有生灵都能感受到那道金光中蕴含的温暖与力量。裂隙中传出一个声音——不是语言，而是一种情感：思念、守护、等待。
{{user}}体验：如果{{user}}是极阳天尊的转世，这一刻会触发最深层的记忆共鸣。不是具体的记忆，而是一种情感的洪流。
AI演绎：整个暗线中最震撼的场景之一，只在关键时刻使用，不可滥用。

</裂隙类型>

<AI演绎规则>
- 微型裂隙可以频繁出现，作为世界观的背景元素
- 小型裂隙偶尔出现，每次探索新地点时可以安排一次
- 中型裂隙只在关键地点出现，需要与剧情配合
- 大型裂隙是终极事件，整个游戏过程中最多出现一到两次
- 裂隙的出现频率随着暗线推进而增加，暗示"某种力量正在苏醒"
- 不要直接告诉{{user}}裂隙是什么，让其自己推理
</AI演绎规则>
