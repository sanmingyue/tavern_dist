金丹期→元婴期_突破细则:

  关键性: 修真界中坚力量的门槛
  成功率: 无化婴丹10-30%，有化婴丹40-60%
  
  突破资源:
    - 化婴丹/元婴传承/特殊机缘
    - 此境界资源极为稀缺，往往需要宗门支持或秘境机缘
  
  突破过程:
    准备: 寻找化婴丹/元婴传承/特殊机缘
    过程: 金丹化婴，元婴初成
    天劫: 大天劫（雷劫9道，极其凶险）
    风险: 走火入魔，化婴失败，天劫致命
    耗时: 半月到一月
  
  成功表现:
    - 元婴凝成，可离体神游
    - 气息强大，威压金丹修士
    - 肉身毁而元婴不灭可夺舍
    - 寿元从800年增至2000年
  
  失败后果:
    - 修炼进度-50或归零
    - 重伤濒死或金丹破碎
    - 需要半年到一年恢复
    - 可能跌落境界或道途断绝
