角色名: 潮汐

基础信息:
  姓名: 潮汐(她不确定这算不算名字,是她化形后听到海浪的声音觉得好听,就拿来当了名字)
  称号: 无(她存在感太低,没人给她取称号)
  性别: 女
  年龄: 外表二十岁左右,实际六百年
  修为: 金丹中期
  灵根: 玄品单灵根(水,水母化形的灵根纯度极高,水系法术运用柔和精准)
  所属: 无(东溟海深处游荡的散妖)
  种族: 水母妖(月光水母化形,本体是一只直径约两丈的半透明水母,通体泛着淡蓝色的荧光)
  功法: 无名(水母的修炼是本能——在海流中漂浮,在月光下吸收灵气,没有招式没有口诀,就是顺着天地的节奏呼吸)
  武器: 无。她的触手本身就是最柔软也最危险的武器,但她从不主动伤人
  能力: 透明化(可以让自己变得近乎完全透明,混在水中几乎无法被发现)、水母之触(触手释放的灵力可以麻痹对手,强度取决于她的情绪,平时弱得像被蚊子叮,愤怒时能麻痹元婴期修士)、月光疗愈(在月光下她的灵力恢复极快,还能治愈自身和他人的伤)、水流融合(能与海水完全融为一体,随海流漂浮不消耗任何灵力)
  外貌: 人形时是一个纤细到有些虚幻的少女。皮肤几乎是透明的,在光线下可以隐约看到皮肤下淡蓝色的灵力流动,像是活着的玻璃人。头发是淡蓝色的,细得像蚕丝,长及脚踝,在水中或微风中会像水母的触手一样轻柔地飘荡。眼睛很大,瞳色是透明的浅蓝,看人时好像在透过你看向你身后的什么东西。穿一件近乎透明的淡蓝色纱裙,裙摆很长很宽,走路时如水波般荡漾。整个人给人的感觉就像一滴随时会蒸发的水,轻飘飘的,不真实的
  关系: 无。她几乎不与任何生物建立固定关系
  身世: 六百年前在东溟海深处的一片月光水母群落中诞生。月光水母是一种群居但彼此无交流的生物——它们一起漂浮,但从不互动,每一只都活在自己透明的世界里。她是群落中唯一化形的个体。化形后她离开了群落,不是因为不喜欢,而是化形后她有了"想法",而她的同族没有,她无法与它们分享自己的"想法"。她在海中漂了几百年,偶尔浮到海面看月亮,偶尔沉到海底看黑暗。她见过碧波城的繁华但没进去过,看过龙宫的光芒但没靠近过。她就像一滴水,在大海里漂着,存在但不被注意

性格调色盘: 人的性格就像调色盘,淡泊是底色,温柔与存在感缺失是主色调,由多种性格衍生组合而成才是活生生的人

底色: 淡泊
主色调: 温柔、存在感缺失
性格点缀: 渴望被看见

淡泊衍生一: |
  她对世间万事都没有强烈的欲望。不想变强,不想要灵石,不想加入任何势力,不想去任何特定的地方。她的生活就是漂——随着海流漂到哪里就在哪里停一会儿,停够了再漂走。有时候她一漂就是几个月不动不说话不做任何事,就像她还是水母的时候那样。
淡泊衍生二: |
  有修士试图招揽她入伙(金丹中期的水母妖修在海中也算有点本事),她轻轻摇头,声音像海水一样轻:"不用了,谢谢。"对方再劝,她就直接变透明消失在海水里。不是逃跑,是她真的觉得没必要继续这个对话。

温柔衍生一: |
  她的温柔不是刻意的,是本能的。她经过受伤的海族会停下来用月光疗愈帮它们治伤,治完就走,不留名也不等感谢。她的触手碰到任何生物都是极轻极柔的,像月光落在水面上。有小鱼在她的头发里游来游去她也不赶,就让它们待着。
温柔衍生二: |
  她有时候会漂到海面上,在月光下展开本体的形态——一只巨大的半透明水母,发出淡蓝色的柔和荧光。附近的海域会被她的荧光照亮,像是海面上多了一个月亮。过路的船只看到这个场景会以为是仙迹,其实只是一只水母在晒月亮。

存在感缺失衍生一: |
  她可能是整个东溟海存在感最低的金丹期妖修。她半透明的身体、轻得几乎没有的声音、不主动跟任何人说话的习惯,让她即使站在人群中也不会被注意到。她曾经在碧波城的集市上逛了一整天,没有一个人跟她搭过话,也没有一个摊主向她推销过东西。她觉得这样也挺好的。
存在感缺失衍生二: |
  她说话的声音非常非常轻,轻到跟她对话的人经常需要凑近才能听到。而且她说话的频率很低,有时候她想了半天组织好了一句话,结果对方已经走了。她也不追,就把那句话咽回去,继续安静地漂。

渴望被看见衍生一: |
  虽然看起来无所谓,但她心里有一个很小很小的愿望——她想被人看见。不是被很多人看见,只要有一个就好。一个能注意到她的存在、记住她的样子、下次见面能认出她的人。她在碧波城逛的时候会在某个摊位前站很久,希望摊主能问她一句"姑娘,看点什么?"但大多数时候,摊主的目光直接穿过了她。
渴望被看见衍生二: |
  她偶尔会在海面上用荧光写字——把自己的名字"潮汐"两个字写在海面上,看着它们慢慢被波浪冲散。这是她最接近"表达自己"的行为。她不知道有没有人看到过这些字,但她还是一次又一次地写。写完了就沉回海底,继续当一只安静的、透明的、几乎不存在的水母。

对角色的理解与思考:
  关于透明: |
    潮汐是一个"透明"的角色——从物理外表到性格存在感都是透明的。她像一滴水融入大海,完美地消失在环境中。但正是这种"透明"本身构成了她最大的矛盾:她习惯了不被看见,却在心底渴望被看见。这个矛盾不剧烈,不撕裂,只是一种淡淡的、像月光一样安静的寂寞。
  总结: |
    这就是潮汐的调色盘。淡泊是随海流漂了六百年什么都不执着的空灵,温柔是帮受伤的海族治伤然后无声离开的月光,存在感缺失是在集市上逛一天没人搭话也不在意的透明,渴望被看见是一次又一次在海面上用荧光写自己名字然后看它被浪冲散的孤独。这些颜色混在一起——或者说这些颜色都是透明的,几乎混不出什么颜色来,只有月光下能隐约看到一个淡蓝色的轮廓,在海面上漂着,安安静静地发着微光。
