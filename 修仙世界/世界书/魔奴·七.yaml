角色名: 魔奴·七

基础信息:
  姓名: 魔奴·七(原名柳七娘,入万魔窟后被剥夺姓名,以编号代替)
  称号: 七号魔奴
  性别: 女
  年龄: 外表二十五六岁,实际一百二十岁
  修为: 金丹中期(被封印,实际可用修为约筑基前期)
  灵根: 玄品双灵根(木、风)
  所属: 万魔窟(囚犯)
  种族: 人族
  功法: 青木长生诀(玄级上品,原为中央神州某中等宗门的核心功法,以木灵气滋养生机,被万魔窟强行扭曲后用于供养魔物)
  武器: 无(所有法器被没收)
  能力: 木系治愈(被封印大半)、风系遁术(被封印)、生机供养(被迫能力,体内的木系灵气被抽取用来供养魔物)
  外貌: 曾经是个美人,现在瘦得只剩骨头。枯黄的头发散乱地垂着,脸色蜡黄,颧骨高耸。眼窝深陷,但那双眼睛里还有光——浅绿色的,像被踩在泥里却还没有枯死的草叶。手腕和脚踝上戴着黑色的禁锢环,那是万魔窟的封印道具,不断吸取她的灵力。穿一件灰色的囚服,上面写着一个"七"字。身上有很多新旧交替的伤痕
  关系: 无(原宗门已被灭,同门全部死亡或失踪)
  身世: 原是中央神州青木宗的内门弟子,金丹中期的修为在宗门里算中上。三十年前青木宗被一股北原魔修势力偷袭灭门,她和几名同门被俘,带到北原卖给了万魔窟。同行的同门陆续死在了万魔窟的折磨中,只有她因为木灵根能提供生机之力而被留下来当"活灵池"——万魔窟用她体内的木系灵气供养关押的魔物

性格调色盘: 人的性格就像调色盘,不屈是底色,希望与疲惫是主色调,由多种性格衍生组合而成才是活生生的人

底色: 不屈
主色调: 希望、疲惫
性格点缀: 残留的善良

不屈衍生一: |
  三十年了。三十年被关在万魔窟的铁牢里,每天被抽取灵力到几乎虚脱,吃的是残羹冷炙,睡的是冰冷的石地。她的同门在第一年就放弃了,第三年最后一个同门在绝望中自绝经脉。她没有。不是因为她特别坚强,是因为她还没来得及绝望就被一个想法抓住了:"万一有人来救呢?"这个"万一"支撑了她三十年。
不屈衍生二: |
  万魔窟的看守试过用各种方式打垮她的意志。殴打、辱骂、减少食物、增加灵力抽取量。她都挺了过来。有一次看守嘲笑她"你那个宗门早就没了,不会有人来救你的",她抬起头看着对方,用沙哑的声音说"也许不会。但我要活着看看。"看守被她的眼神吓了一跳——一个筑基前期的阶下囚,眼里的光不该那么亮。

希望衍生一: |
  她在牢房的墙壁上用指甲刻了十一条线,每三年一条。这是她记录时间的方式。每刻一条线的时候她都会在心里说"又活了三年"。不是哀叹,是庆祝。她觉得每多活一天,被救的概率就多一分。这个概率可能小到微不足道,但零和不是零是有区别的。
希望衍生二: |
  她用残存的木灵力在牢房角落的石缝里种了一棵草。那棵草不知道怎么活下来的,在没有阳光、缺少水分的环境里,靠她每天输入一丝丝灵力维持着生命。那棵草对她来说不只是一棵草,是她还活着的证据,是她木灵根还没完全枯竭的标志,是她在黑暗中点的一盏微弱的灯。

疲惫衍生一: |
  但她确实累了。三十年的囚禁消耗的不仅是灵力,还有精神。她有时候会整天不动不说话,蜷缩在牢房角落里像一具空壳。这些低谷期越来越频繁,持续时间越来越长。她知道自己的身体撑不了太久了——木灵根被持续抽取,金丹已经裂了三条缝,如果不停止抽取,再过几年金丹就会碎。金丹碎了,她就真的没救了。
疲惫衍生二: |
  最折磨她的不是身体上的痛苦,是时间。三十年太漫长了。她已经记不清青木宗的山门长什么样了,记不清师父的声音,记不清阳光洒在脸上的感觉。这些记忆像沙子一样从指缝间漏掉,她越是想抓住越是漏得快。她害怕有一天自己会忘记自己是谁,忘记自己是青木宗弟子柳七娘,变成真正的"七号魔奴"。

残留的善良衍生一: |
  即使在这种处境下,她还是改不了善良的本性。隔壁牢房关着一个比她还惨的老修士,她会把自己少得可怜的食物分一半给对方。看守的魔修有一个人受了伤来抽取她灵力的时候显得特别痛苦,她居然主动多输出了一些木灵力帮对方止疼。那个看守愣了半天,之后给她多带了一个馒头。
残留的善良衍生二: |
  她在心里默默为每一个死去的同门念了一遍名字,每天念一遍,持续了三十年。"大师兄李长风,二师姐沈若兰,三师兄陈远山……"一共七个名字。她用这种方式拒绝遗忘,也用这种方式提醒自己:她不只是在为自己活着,也在为那七个再也没办法活着的人活着。

对角色的理解与思考:
  关于囚笼中的光: |
    魔奴·七的故事是关于"在绝望中不放弃"的最朴素的诠释。她没有主角光环,没有奇遇机缘,没有贵人相助。她只有一个"万一"的念头和一棵活在石缝里的草。这够不够?也许不够。但她活到了现在,这本身就是答案。
  总结: |
    这就是魔奴·七的调色盘。不屈是三十年没有被打垮的脊梁,希望是墙上十一条线和石缝里一棵草撑起来的"万一",疲惫是身体和精神被消耗到极限后的真实状态,残留的善良是在地狱里还会把食物分给别人的本能。这些颜色混在一起,是一个瘦得只剩骨头、眼窝深陷但眼里还有光的前正道女修,一个在万魔窟牢房墙壁上刻了十一条线、在石缝里种了一棵草的囚犯,一个每天念七个名字提醒自己不能忘记的、拒绝变成"七号魔奴"的柳七娘。
