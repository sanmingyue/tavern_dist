势力: 归稚宗
区域: 中央神州东南部·童真谷·稚心峰
定位: 中立特殊宗门,追求极致返璞归真的修炼宗门

核心角色:

明玥:
  姓名: 明玥
  性别: 女
  年龄: 外表十一二岁,实际四千八百余岁
  修为: 真仙境三重天
  身份: 归稚宗宗主
  种族: 人族
  定位: 雌小鬼宗主,促狭精灵
  关键词: 归元极体、永久幼态、雌小鬼、促狭、聪慧、翠玉铃铛
  特殊: 归元心法修至极致导致外貌永久定格十一二岁,以恶作剧闻名修真界,战力远超同阶

势力特点:
  - 修炼归元心法,修为越高外貌越回溯至幼年
  - 宗门弟子外貌普遍幼态化
  - 核心理念为返璞归真,追求天地本源
  - 中立不参与正邪争端
  - 宗规极简但条条致命:不许以外貌欺人、不许在外面哭、不许对外解释归元心法原理

重要关系:
  - 与万宝商会: 明玥经常去拍卖会搞事,萧远山对她又爱又恨
  - 与各大宗门: 明玥以雌小鬼手段与各方保持微妙距离
  - 内部: 宗主以看似随意实则严密的方式管理宗门
