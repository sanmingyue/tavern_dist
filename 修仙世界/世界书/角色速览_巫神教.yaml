势力: 巫神教
区域: 南疆巫地

核心角色速览:

大巫祝:
  称号: 巫神教教主、南疆之主、天蛛圣殿主人、万部之首
  修为: 真仙境六重天
  种族: 人族(南疆巫族·黑齿族血脉)
  定位: 南疆千万部族名义上的共主,以信仰和母性统治
  理念: 南疆的孩子不需要被拯救,他们需要被保护
  特点: 永远戴面具,说话用譬喻,神出鬼没;对子民如母亲,对敌人如毒蛛
  目标: 维护南疆的自然秩序与部族安宁
  关键词: [天蛛巫神诀, 蛛神杖, 母性与狠辣, 巫道传承]

阿蛮:
  称号: 小蛮虫、千虫市集的偷虫贼、大母最头疼的孩子
  修为: 筑基后期
  种族: 人族(南疆黑齿族血脉)
  定位: 百年难遇的蛊灵体质,天生能与蛊虫沟通的少女
  理念: 蛊虫不是工具,是朋友
  特点: 好奇心旺盛,野性未驯,赤脚乱发黑牙笑容;对被抛弃有深层恐惧
  目标: 听懂所有蛊虫说的话,走遍南疆每一片雨林
  关键词: [蛊灵体质, 大巫祝养女, 与虫为友, 笨拙的温柔]

势力关系网:
  教主: 大巫祝 → 绝对领袖(以信仰维系)
  养女: 阿蛮 → 蛊术天才,大巫祝最看重的继承人选之一
  长老: 十二巫长老 → 各管一方部族事务
  竞争: 蛊魔宗(蛊皇) → 争夺南疆控制权
  邻居: 药神谷(苏青檀) → 互相忌惮的正道邻居
