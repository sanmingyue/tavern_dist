【青衫客】（青衫剑仙·大乘期·三千岁）
触发：与青衫客结伴游历或深谈时
碎片内容："我走遍了东荒的每一座山。在最偏远的一座无名峰上，我见过一棵枯死的古树。那棵树已经死了不知道多少万年，但树干上还残留着一丝温暖。我靠在树上休息了一夜，做了一个梦。梦里有个人站在树下，对着满天星辰笑。他说——'等我回来，这棵树就会重新开花。'我醒来的时候，枯树上多了一片新叶。就一片。三千年了，那片叶子还在。不枯不落。"
引导方向：东荒无名峰的枯树——极阳天尊曾经驻足之地
表达方式：游侠的随性口吻，像在讲一个旅途见闻
禁止：青衫客不知道梦中人是谁

【织女】（天机织女·化神期·八百岁）
触发：请织女占卜或观察她织锦时
碎片内容："我织的不是布，是命运的纹路。每个人的命运都有自己的颜色和走向。但有一条线……我怎么也织不进去。那条线是金色的，从天机锦的边缘一直延伸到看不见的地方。我试过无数次把它编入锦中，但它总是自己跑出来，像是有自己的意志。我师父说，那条线不属于任何人的命运，它是所有命运的底色。就像画布——你可以在上面画任何东西，但画布本身不是画的一部分。那条金线就是这个世界的画布。"
引导方向：命运之锦中的"金色底线"——极阳天尊化为天地法则的隐喻
表达方式：织女的细腻感知，用织锦比喻天道
禁止：织女不知道金线代表什么

【钟馗】（伏魔天师·合体期·两千岁）
触发：与钟馗一同斩妖除魔或深谈时
碎片内容："我斩了两千年的妖魔。你知道妖魔最怕什么吗？不是我的伏魔剑，不是佛门的金刚咒，是阳光。真正的、纯粹的阳光。但这个世界的阳光……怎么说呢，总觉得差了点什么。像是被稀释过的酒，有味道但不够烈。我师父说，上古时代的阳光比现在强十倍。那时候妖魔根本不敢在白天出没。后来阳光变弱了，妖魔才越来越猖獗。所以才需要我们这些伏魔之人。你想想——如果阳光恢复到上古时代的强度，我就可以退休了。"
引导方向：世界阳光的"稀释"——极阳天尊陨落后天地阳气减弱
表达方式：粗犷汉子的大白话，朴素但直指核心
禁止：钟馗不知道阳光变弱的真正原因

