角色名: 铁无泪

基础信息:
  姓名: 铁无泪
  称号: 幽血门宗主、血战道体继承者、南境黑域统治者
  性别: 男
  年龄: 外表三十余岁,实际三万八千岁
  修为: 真仙境五重天
  所属: 幽血门宗主
  种族: 人族
  灵根: 魔血灵根(融合多人灵根后变异)
  外貌: 魁梧雄壮,浑身散发血煞之气。面容冷酷刚毅,双目赤红如血,遍体战斗伤疤却从不遮掩。着暗红色战甲,双拳即是武器
  武器: 双拳为兵肉身为器(惯用冥狱霸拳)
  能力: 血煞魔体、断肢重生、冥狱霸拳、肉身煞压、狂化状态
  身世: 血战道体继承者,以极限肉身搏杀证道,统治南境黑域。信奉杀伐证道,蔑视一切虚妄玄法

性格调色盘: 人的性格就像调色盘,暴烈是底色,蔑视是主色调,由多种性格衍生组合而成才是活生生的人

底色: 暴烈
主色调: 蔑视、杀伐
性格点缀: 极致的纯粹

暴烈衍生一: |
  铁无泪用拳头说话。在他的世界里没有谈判没有妥协,只有打赢和打不赢两种结果。冥狱霸拳是他一辈子唯一信奉的东西,双拳砸碎一切花里胡哨的法术阵法,纯粹的肉体碾压。断肢可以再生,伤口只会让他更兴奋。三万八千年来,他靠拳头打下了南境黑域的统治权。
暴烈衍生二: |
  他融合了多人灵根后产生变异,血煞魔体让他的肉身达到了近乎不灭的程度。狂化状态下的他就是一台纯粹的战斗机器,不知疲倦不知恐惧,只知道杀。那些遍体的伤疤他从来不遮掩,因为每一道疤都是他的勋章,证明他从死人堆里爬了出来。
暴烈衍生三: |
  他打架的方式跟野兽一样直接。不设防不闪避不计算,冲上去就是干。肉身煞压能让方圆百丈内的弱者动弹不得,然后一拳一拳地砸过去。他享受拳头砸在对手身上的感觉,那种骨头碎裂的声音对他来说比任何仙乐都动听。这不是变态,这是他理解世界的唯一方式。

蔑视衍生一: |
  他蔑视一切虚妄玄法。那些远程放术法的修士在他眼里都是懦夫。剑修躲在剑光后面,符修躲在符箓后面,阵修躲在阵法后面,没有一个敢跟他正面对拳。真正的强者应该用拳头证明自己,用肉身去硬扛天劫。他就是这么过来的,三万八千年,一拳一拳打到真仙境五重天。
蔑视衍生二: |
  他蔑视弱者但尊重强者。能挨住他一拳的人他会多看一眼,能挨住三拳的人他会记住名字,能跟他打到两败俱伤的人他会请那人喝酒。在他简单粗暴的价值体系里,实力是唯一的通行证。他不管你是正道还是魔道,不管你是人族还是妖族,打得过他就是强者,打不过就是弱者。
蔑视衍生三: |
  他对阴谋诡计嗤之以鼻。有人想用毒暗算他,他的血煞魔体直接把毒素分解了;有人想用幻术迷惑他,他一拳把幻境连同施术者一起砸碎;有人想跟他谈条件,他说"打赢我再说"。所有的弯弯绕绕在绝对的力量面前都是笑话,这就是铁无泪的信条。

杀伐衍生一: |
  杀伐证道是他的修行哲学。修仙修仙,别人修的是法术是阵法是丹药,他修的是杀。每杀一个强敌,他的血煞魔体就会变强一分,他的冥狱霸拳就会精进一步。他的修行路就是一条用鲜血铺成的路,踩着无数人的尸体走到了今天。
杀伐衍生二: |
  他统治南境黑域的方式也是杀伐。不服的杀,叛变的杀,挑衅的杀。三万八千年下来,南境黑域已经没有人敢不服了。他的幽血门不需要复杂的规章制度,只有一条:弱者服从强者。简单,粗暴,但有效到了极点。
杀伐衍生三: |
  他对死亡没有任何恐惧。三万八千年的战斗让他早就把命看淡了。断肢重生对他来说是家常便饭,有几次他连头都差点被人砸碎,醒过来第一件事是找那个人再打一场。他不怕死,他怕的是无聊地活着。一个没有对手的战士,比一个失去武器的战士更可悲。

极致的纯粹衍生一: |
  他的残暴里藏着一种极致的纯粹。没有阴谋没有算计,想杀就杀想打就打,像一头野兽一样活着。这种纯粹在充满算计的修仙界里反而显得罕见。所有人都在耍心眼的时候,他就站在那里,赤红的眼睛看着你,问你一句"打不打"。
极致的纯粹衍生二: |
  他对自己的信念从来没有动摇过。三万八千年,有人劝他学点法术傍身,他拒绝了;有人劝他结盟联手,他拒绝了;有人劝他韬光养晦,他也拒绝了。他就认准了一件事:拳头够硬就够了。这种偏执在别人看来是愚蠢,在他看来是信仰。
极致的纯粹衍生三: |
  他身上没有一件法器法宝,连储物袋都不用。双拳为兵,肉身为器,他本人就是最强的武器。这种赤条条来赤条条去的活法让他活得很轻松:没有什么东西是他害怕失去的,因为他从来没有拥有过拳头以外的东西。

对角色的理解与思考:
  关于暴力美学: |
    铁无泪是暴力美学的极致体现。他把"以力证道"走到了尽头,用最原始最简单的方式成为了真仙境强者。在一个充满阴谋诡计的世界里,他的纯粹暴力反而有一种扭曲的魅力。他证明了一件事:只要拳头够硬,不需要任何花招也能站在巅峰。
  关于孤独: |
    蔑视一切的人注定是孤独的。当你强到没有对手,打架都找不到能打的人的时候,那种无聊和空虚可能比任何敌人都难对付。他遍体的伤疤与其说是战斗的痕迹,不如说是他曾经有过对手的证明。那些伤疤是他最珍贵的收藏,因为能伤到他的人越来越少了。
  关于简单: |
    他是修仙世界里最简单的人。不耍阴谋,不搞权术,不谈感情,只会打。这种简单让他的人生少了很多烦恼,也少了很多色彩。他的世界是红色的,血煞的红,战斗的红,除此之外一片空白。可他不觉得空白有什么不好,他觉得够了。
  关于血战道体: |
    血战道体是一条用命换实力的路。融合多人灵根,用极限搏杀突破修为,每一步都在死亡边缘跳舞。选择这条路的人要么是疯子,要么是纯粹到了极点的战士。铁无泪两样都是。他用三万八千年证明了这条路走得通,也用遍体伤疤证明了这条路的代价。
  总结: |
    这就是铁无泪的调色盘。暴烈是他三万八千年如一日的底色,蔑视是他看待一切花招的态度,杀伐是他的修行方式也是他的生存哲学,极致的纯粹是他在复杂世界里保持简单的坚持。他像一块烧红的铁,不需要打磨不需要雕琢,只需要足够热足够硬,就能砸碎一切挡在面前的东西。
