动态事件类型: 拍卖会

正统修仙铁律:
  核心原则: 拍卖会是修真界重要交易场所，有规矩，有门槛，不是菜市场
  现实规则:
    - 拍卖物品有等级，低境界买不起高阶物品
    - 拍卖会有入场门槛
    - 竞价要合理，不能无限加价
    - 有人主持维持秩序
    - 成交后必须付款，否则后果严重
  禁止:
    - 无钱参加拍卖
    - 随意竞价后不付款
    - 拍卖会上大打出手
    - 低价拍得神器

拍卖会等级:
  小型拍卖会:
    举办地: 坊市、小城
    频率: 每月一次
    门槛: 炼气期即可，100下品灵石入场费
    物品: 一至三品物品为主
    参与者: 低阶修士

  中型拍卖会:
    举办地: 大城、宗门坊市
    频率: 每季度一次
    门槛: 筑基期以上，1000下品灵石或10中品灵石入场费
    物品: 三至五品物品为主
    参与者: 中阶修士

  大型拍卖会:
    举办地: 修真界名城、大宗门
    频率: 每年一次
    门槛: 金丹期以上，100中品灵石或1上品灵石入场费
    物品: 五至七品物品为主
    参与者: 高阶修士

  顶级拍卖会:
    举办地: 中央神州、四海龙宫
    频率: 数年一次
    门槛: 元婴期以上，100上品灵石入场费
    物品: 七至九品物品、稀世珍宝
    参与者: 顶尖修士、各宗门高层

拍卖会流程:
  入场:
    - 缴纳入场费
    - 验证身份和修为
    - 分配座位(普通席/贵宾包厢)
    - 登记竞拍资格

  开场:
    - 拍卖师介绍规则
    - 展示部分拍品预览
    - 宣布拍卖开始

  竞拍:
    - 拍品依次登场
    - 拍卖师介绍拍品
    - 参与者竞价
    - 价高者得

  成交:
    - 一锤定音
    - 买家付款
    - 交付拍品
    - 拍卖会抽成(10%)

  散场:
    - 拍卖结束
    - 买家离场
    - 拍卖会提供短时间安全护送

拍卖物品类型:
  功法秘籍:
    玄阶功法: 起拍价5-20中品灵石
    地阶功法: 起拍价50-200中品灵石
    天阶功法: 起拍价5-50上品灵石
    失传绝学: 起拍价50-500上品灵石

  法宝:
    三品法宝: 起拍价5-20中品灵石
    四品法宝: 起拍价20-100中品灵石
    五品法宝: 起拍价1-10上品灵石
    六品法宝: 起拍价10-50上品灵石
    七品法宝: 起拍价50-200上品灵石
    八品法宝: 起拍价200-1000上品灵石

  丹药:
    四品丹药: 起拍价10-50中品灵石(一瓶)
    五品丹药: 起拍价1-5上品灵石(一瓶)
    六品丹药: 起拍价5-20上品灵石(一瓶)
    七品丹药: 起拍价20-100上品灵石(一瓶)
    八品丹药: 起拍价100-500上品灵石(一瓶)

  材料:
    稀有矿石: 起拍价根据品质
    天材地宝: 起拍价根据稀有度
    妖兽内丹: 起拍价根据阶位
    特殊材料: 起拍价根据用途

  特殊物品:
    古籍孤本: 起拍价不定
    地图情报: 起拍价不定
    特殊令牌: 起拍价不定

竞价规则:
  起拍价:
    - 由拍卖会评估
    - 一般是市价的60%-80%

  加价幅度:
    100灵石以下: 每次加价至少10灵石
    1000灵石以下: 每次加价至少100灵石
    10000灵石以下: 每次加价至少1000灵石
    10000灵石以上: 每次加价至少一成

  竞价方式:
    举牌: 普通席位举牌竞价
    传音: 贵宾包厢可传音竞价
    代拍: 可委托拍卖会代拍

  竞价限制:
    - 恶意抬价会被驱逐
    - 竞价后不付款会被列入黑名单
    - 超出承受能力不得竞拍

座位类型:
  普通席位:
    费用: 入场费即可
    位置: 大厅
    隐私: 无隐私，身份公开
    服务: 基础服务

  贵宾包厢:
    费用: 入场费+包厢费(1-10上品灵石)
    位置: 二楼包厢
    隐私: 有阵法隔绝，可隐藏身份
    服务: 专人服务，茶点提供

  顶级包厢:
    费用: 入场费+包厢费(10-100上品灵石)
    位置: 顶层独立空间
    隐私: 完全隐私，绝对隐藏身份
    服务: 顶级服务，可提前查看拍品

拍卖会特殊规则:
  安全保障:
    - 拍卖会内绝对禁止动手
    - 有强者坐镇
    - 违者格杀勿论
    - 提供短时间护送服务

  离场后:
    - 拍卖会不负责离场后安全
    - 可能被人盯上
    - 需要自己警惕
    - 可以雇佣护卫

  保密规则:
    - 贵宾包厢身份保密
    - 但拍卖会知道真实身份
    - 拍卖会不会泄露(信誉保证)
    - 可能被有心人推测

  违约后果:
    - 竞拍成功不付款: 列入黑名单，赔偿违约金
    - 恶意扰乱: 驱逐出场，终身禁入
    - 场内动手: 格杀勿论

特殊拍卖环节:
  压轴拍品:
    - 每场拍卖会的最珍贵物品
    - 吸引力最大
    - 竞争最激烈
    - 价格最高

  神秘拍品:
    - 不提前公布的物品
    - 增加期待感
    - 可能是意外惊喜

  以物易物:
    - 部分物品可以交换
    - 需要拍卖会认可
    - 价值对等

用户参与指南:
  参拍准备:
    - 确认自己资金充足
    - 了解想要的物品价值
    - 准备好竞价策略
    - 选择合适座位

  竞价策略:
    保守: 只拍必需品，价格合理时放弃
    积极: 适当加价，争取心仪物品
    激进: 势在必得，不惜代价

  注意事项:
    - 不要暴露全部财力
    - 警惕被人盯上
    - 合理评估物品价值
    - 不要冲动竞价
    - 准备好退路

竞拍结果:
  成功拍得:
    - 支付灵石
    - 获得物品
    - 更新背包变量
    - 可能被人记住

  未能拍得:
    - 无损失
    - 可以关注下一场
    - 可以寻找其他途径

  超出预算:
    - 理智放弃
    - 避免债台高筑

离场后风险:
  被盯上:
    - 拍得珍贵物品可能被盯上
    - 需要警惕跟踪
    - 可以雇佣护卫
    - 可以改变路线

  截杀:
    - 可能遭遇截杀
    - 需要战斗或逃跑
    - 可以寻求拍卖会护送
    - 可以联络同门

奖励规则:
  拍得物品:
    - 获得拍品
    - 支付相应灵石
    - 更新背包

  见识提升:
    - 见识各种珍宝
    - 了解市场行情
    - 认识其他修士
    - 可能获得情报

境界限制:
  - 炼气筑基: 参加小型拍卖会
  - 金丹元婴: 参加中大型拍卖会
  - 化神以上: 参加顶级拍卖会
  - 财力不足不要参加高等级拍卖会

AI生成要点:
  氛围营造:
    - 拍卖会的热闹
    - 竞价的紧张
    - 各方修士的关注
    - 拍卖师的调动气氛

  物品描写:
    - 拍品的精美
    - 功能的强大
    - 稀有度的强调
    - 起源的神秘

  竞价过程:
    - 竞价者的心理
    - 价格的攀升
    - 其他人的反应
    - 用户的决策

  人物刻画:
    - 拍卖师的专业
    - 竞争者的执着
    - 旁观者的议论
    - 用户的心态

注意事项:
  - 拍卖会有严格规则
  - 价格要合理
  - 不能无钱参拍
  - 场内绝对安全，场外自己负责
  - 珍贵物品必有人觊觎
  - 量力而行
  - 拍卖会抽成10%
  - 不能恶意竞价
