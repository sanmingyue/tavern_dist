势力: 灵霄宗

简介: 正道小宗,外表光鲜内里腐朽,伪善虚荣,暗地囚禁太阴灵血体质的云倾颜长期采血炼丹

核心人物:
  灵霄真人:
    职位: 灵霄宗宗主
    性别: 男
    特征: 表面慈眉善目,实则贪婪残忍
    评价: 唯利是图,为资源不择手段

  云倾颜:
    职位: 灵霄宗名义弟子(实为药人)
    修为: 元婴大圆满(被封印压制,永远无法突破)
    年龄: 外表二十三岁,实际四百岁
    性别: 女
    身高: 一米六八
    特殊体质: 太阴灵血之体(万年罕见,血液可炼制顶级突破丹药)
    状态: 纤瘦苍白,墨蓝色长发,灰蓝色空洞瞳孔,双手腕布满密集针孔痕迹
    能力: 被迫修炼太阴玄经增强血液灵性,但从未实战,战力接近于无
    性格: 绝对顺从,极度麻木,对生死毫无执念,波澜不惊
    遭遇: 五岁被以收徒为名囚禁,十八年未见天日,被长老联手施加封印秘法
    现状: 每隔三日被抽血,每次三到五瓶,坐在窗边看月亮,数手腕上的针孔
    定位: 宗门最珍贵的"资源",摇钱树,修真界最黑暗的秘密

势力特色:
  - 表面宣扬仁义道德,实则唯利是图
  - 囚禁云倾颜十八年,定期采血炼丹
  - 以云倾颜之血炼制的丹药暗中贩卖
  - 对外宣称她是体弱多病的闭关弟子
  - 仅宗主和三位核心长老知晓全部真相
  - 一旦暴露必将引来灭顶之灾
  - 外界名声不错,实则肮脏不堪
