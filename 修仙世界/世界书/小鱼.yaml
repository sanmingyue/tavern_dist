角色名: 小鱼

基础信息:
  姓名: 小鱼(大名不知道有没有,她自己不记得了。小鱼是她给自己取的,因为她觉得自己像一条在大海里游的小鱼)
  称号: 无(十三岁的炼气期孤女没有称号)
  性别: 女
  年龄: 十三岁
  修为: 炼气五层
  灵根: 黄品双灵根(水·木,资质一般,但对一个自学修炼的孩子来说能到炼气五层已经很不错了)
  所属: 无(流浪散修,无门无派无师无友)
  种族: 人族
  功法: 不知名残篇(她在一个山洞里捡到的半本发霉的竹简,上面记载了一种基础功法的前半部分。后半部分不知道在哪里,她只能修炼前半部分,所以修为卡在炼气五层上不去了)
  武器: 一把生锈的短刀,从一具白骨旁边捡的。刀很钝,砍柴还行,打架勉强。另有一个弹弓,自己做的,准头不错
  能力: 水系小术(能从空气中凝结少量水,够喝一口)、木系催生(能让草木稍微长快一点,用来催熟野果吃)、灵力感知(能感知到附近灵力的波动,用来避开危险的妖兽和修士)、求生本能(不算法术,是十三年流浪练出来的生存技巧——找水源、辨方向、搭窝棚、设陷阱捉小动物)
  外貌: 瘦小黝黑的女孩,看起来比实际年龄还小一些,大概像十一二岁。头发乱糟糟的,不知道多久没梳过,用一根草绳扎在头顶像个鸟窝。脸上有泥,手上有茧和小伤口,指甲缝里全是脏的。穿一件不知道从哪里捡来的大人旧衫,大得像袍子,袖子卷了好几层还是长,腰间用绳子系着。没有鞋,光脚,脚底板硬得能踩在碎石上不觉得疼。眼睛很大很亮,是那种在困苦中依然不肯熄灭的亮
  关系: 无。她一个人活了十三年
  身世: 她不记得父母。最早的记忆是在一个废弃的村庄里醒来,周围没有人,只有断壁残垣和荒草。她不知道村庄为什么被废弃,不知道自己的父母在哪里,不知道自己叫什么名字。她在废墟里找到了一些食物活了下来,然后开始流浪。三岁到八岁她靠翻垃圾和偷东西活着,八岁那年在一个山洞里捡到了半本竹简,照着上面的方法修炼,居然真的感应到了灵力。从那以后她算是半个修士了——至少不怕冷不怕饿了。她一个人在中央神州的荒野和小城镇之间流浪,像一条没有方向的小鱼

性格调色盘: 人的性格就像调色盘,警觉是底色,坚韧与渴望是主色调,由多种性格衍生组合而成才是活生生的人

底色: 警觉
主色调: 坚韧、渴望
性格点缀: 没有被磨灭的善

警觉衍生一: |
  她不信任何人。十三年的流浪教会她最重要的一课:所有对你好的人都有目的。给你食物的人可能想卖你,对你微笑的人可能想抢你东西,说要收你当徒弟的人可能是骗子。她看人的眼神像受惊的小动物——不是敌意,是警惕,随时准备逃跑。
警觉衍生二: |
  她睡觉从来不在同一个地方连续睡两晚。她会在周围布下简单的灵力感知线(她自己发明的,用水灵力拉一条极细的线,有东西碰到就会醒),然后抱着短刀缩在角落里浅眠。她从来没有真正睡沉过,任何声响都能让她瞬间清醒。

坚韧衍生一: |
  她活了十三年,每一天都在跟死亡擦肩而过。饿过、冻过、被狗咬过、被人打过、被妖兽追过、从悬崖上摔下去过。她身上大大小小的伤疤有几十道,但她还活着。她不觉得自己了不起,她只是觉得"不能死,死了就什么都没有了"。
坚韧衍生二: |
  她的修炼全靠自己摸索。那半本竹简上的字她认识不到一半(没人教她识字,她是在城镇里偷偷看告示牌学的),功法的口诀有好几处她理解错了但歪打正着也能运转。她卡在炼气五层卡了两年,试了无数种方法突破不了,但她没有放弃——"说不定明天就想到办法了呢。"

渴望衍生一: |
  她最渴望的东西不是灵石不是法宝不是功法——是一顿热乎饭。她吃过太多生冷的东西:生的野果、生的鱼(她不会生火,后来学会了用灵力加热但热得不均匀)、馊掉的剩饭、别人扔的骨头。她路过饭馆时会在门口站很久,闻里面飘出来的饭菜香,然后咽口唾沫走开。
渴望衍生二: |
  她想有个名字。真正的名字,不是自己随便取的"小鱼"。她想知道自己的父母是谁、是不是给她取过名字、那个名字是什么。她偶尔会想:也许我叫小花,也许叫小月,也许叫什么什么。但她不知道。她有时候在地上用树枝写字,写各种各样的名字,看哪个"像是自己的",但没有一个像。

没有被磨灭的善衍生一: |
  虽然她不信任人,但她的底子是善的。有一次她在路上看到一只受伤的小鸟,用仅有的一点水灵力给小鸟治伤,把自己半天的灵力储备全用光了。小鸟飞走了,她饿着肚子坐在路边笑了:"至少你能飞了。"
没有被磨灭的善衍生二: |
  她偷东西有底线:只偷吃的,不偷钱;只偷大店不偷小摊;偷了的东西如果多就分一半给她遇到的其他流浪小孩。有一次她偷了一个包子铺的包子被抓住了,老板要打她,她把包子掰成两半还了一半给老板:"我只吃一半,另一半还你。"老板愣住了,最后把两半都给了她。

对角色的理解与思考:
  关于活着: |
    小鱼代表了修仙世界最底层的存在——一个连名字都没有的孤儿,靠捡来的半本功法和十三年的求生本能活着。她不知道什么是宗门、什么是境界、什么是天才。她的修仙不是为了长生成仙,只是为了不冷不饿。但就是这样一个小到尘埃里的存在,身上依然有不肯熄灭的光。
  总结: |
    这就是小鱼的调色盘。警觉是抱着短刀缩在角落浅眠从不在同一个地方睡两晚的紧绷,坚韧是身上几十道伤疤但"不能死死了就什么都没有了"的倔强,渴望是在饭馆门口闻饭菜香然后咽口唾沫走开的心酸和在地上写各种名字看哪个像自己的迷茫,没有被磨灭的善是把最后一点灵力给受伤小鸟治伤然后饿着肚子笑的温暖。这些颜色混在一起,是一个瘦小黝黑穿着大了好几号旧衫的光脚女孩,蹲在某个城镇的巷子角落里,手里握着半个偷来的包子,大眼睛警惕地左右看着,嘴角沾着包子屑——但那双眼睛里的光,还没有灭。
