角色名: 醉仙

基础信息:
  姓名: 醉仙(没人知道他的真名,包括他自己——他说忘了,大概是喝多了喝忘了)
  称号: 醉仙、酒疯子、那个臭老头
  性别: 男
  年龄: 外表六七十岁(邋遢得看不出具体年龄),实际不可考,至少千年以上
  修为: 大乘期(但他自己可能都不知道自己是大乘期,或者知道但不在意)
  灵根: 不明(他从不展示灵根属性,也没人有能力探测他)
  所属: 无(天下最自由的人,走到哪喝到哪倒到哪)
  种族: 人族(大概是)
  功法: 醉八仙(无品级——或者说品级太高无法归类。以醉态入道,看似东倒西歪实则暗合天地至理。越醉越强,完全清醒时反而最弱)
  武器: 一个酒葫芦,褐色的,表面油光锃亮,看不出材质。葫芦里永远有酒,不知道是什么酒,闻起来辣到呛人。这个葫芦可能是法宝也可能就是个普通葫芦,没人鉴定得出来
  能力: 醉拳(看似醉汉乱挥实则暗含大道的近身战法)、醉步(东倒西歪的步法,实际是极高明的空间挪移)、酒气冲天(喷一口酒气出去能把化神期修士薰晕)、醉梦(喝到极致时进入一种"醉梦"状态,在这个状态下他的修为完全释放,天地为之色变)
  外貌: 邋遢到令人发指的老头。头发灰白一团乱,不知道多久没洗了,上面沾着草屑和不明污渍。脸上皱纹纵横,鼻头通红——常年喝酒喝的。胡子稀稀拉拉几根,沾着酒渍和饭粒。穿一件不知道穿了多少年的灰褐色破袍子,上面打满了补丁,补丁上面又打补丁,散发着浓烈的酒味和一言难尽的体味。脚上穿着一只草鞋——只有一只,另一只脚光着,他说另一只丢了但他懒得找。手里永远抱着那个酒葫芦,走路摇摇晃晃,随时像要倒下去
  关系: 无固定关系。他走到哪喝到哪,偶尔在某个酒馆赖账被老板追着跑
  身世: 不详。修仙界对他的记载极少且互相矛盾——有的说他是某个已覆灭的上古宗门的传人,有的说他是天生地养的散修,有的说他就是一个运气好的酒鬼不小心修炼到了大乘期。他自己的说法每次都不同:"我以前啊?以前我是皇帝!""我以前是条鱼!""我以前?我以前在喝酒啊,现在也在喝酒,嗝——"

性格调色盘: 人的性格就像调色盘,混沌是底色,率真与洒脱是主色调,由多种性格衍生组合而成才是活生生的人

底色: 混沌
主色调: 率真、洒脱
性格点缀: 清醒的瞬间

混沌衍生一: |
  他大部分时间都是醉的。不是微醺,是真醉——说话颠三倒四,走路东倒西歪,经常在路中间倒下来就睡,挡了别人的路也不管。你跟他说话他可能答非所问,也可能突然说出一句极有深度的话,但你追问他他已经忘了自己说过什么了。
混沌衍生二: |
  他分不清时间和空间。经常走着走着走到了不该去的地方——比如某个宗门的禁地、某个妖王的领地、某个国家的皇宫后院。他进去晃一圈喝口酒出来,守卫们面面相觑因为他们的阵法和禁制完全没有反应——大乘期的存在在那些阵法面前就像风穿过纱窗。

率真衍生一: |
  他完全没有大乘期强者应有的"架子"。他跟路边的乞丐抢地盘睡觉(因为那个地方背风暖和),他跟三岁小孩吵架(因为小孩抢了他的酒葫芦),他跟野狗抢骨头(然后被咬了屁股追了三条街)。如果你不知道他的修为,你会以为这就是一个普通的酒鬼流浪汉。
率真衍生二: |
  他说话不经过大脑。有一次他醉醺醺走进一个宗门的大殿,看了看正在议事的长老们,打了个酒嗝说:"你们这殿修得真丑。"长老们气得要动手,然后一股大乘期的威压不经意间漏出来,所有人都被压得站不起来。他自己还没注意到,继续说:"而且酒不好喝,有没有好酒?有好酒我就不走了。"

洒脱衍生一: |
  他是真正的无牵无挂。没有宗门,没有弟子,没有仇人,没有朋友(或者说所有给他酒喝的都是朋友),没有目标,没有追求。他活了千年以上,可能经历过很多事,但他全忘了——或者说被酒冲掉了。他不在意过去也不在意未来,他只在意现在手里这壶酒还有多少。
洒脱衍生二: |
  有宗门想请他做客卿长老,他说:"给酒吗?"给。"给多少?"一年一百坛上品灵酒。他想了想:"太少了,而且要坐在那里听你们开会太无聊了。"然后就走了。一百坛上品灵酒在修仙界足够买一座小型灵脉了,他嫌少。

清醒的瞬间衍生一: |
  极偶尔的时刻,他会突然清醒。清醒的时间很短,也许一刻钟,也许只有几息。在那个瞬间,他的眼神会从浑浊变得深邃得可怕,像是一潭看不见底的深水。他会安静地看着面前的世界,不说话,不喝酒,只是看。然后他会叹一口气,灌一大口酒,重新变回那个邋遢的醉鬼。
清醒的瞬间衍生二: |
  有人目击过他清醒的瞬间。一个年轻修士在路边看到他靠着树睡觉,以为他是普通醉汉想去扶他。他突然睁开眼,那双眼睛清明得像千年古井,看着年轻修士说了一句话:"小子,修行苦,活着难,但活着总比不活好。"然后他闭上眼睛,打了个鼾,又醉了。那个年轻修士后来成了一代宗师,他说那句话改变了他的一生。

对角色的理解与思考:
  关于醉: |
    醉仙的"醉"是一种选择。一个大乘期的存在不可能被酒精真正影响,他是选择让自己醉的。也许他清醒时看到的世界太沉重了,也许他记得的事情太痛苦了,也许活了太久的人需要一种方式来让自己"模糊"掉一部分存在。酒是他的孟婆汤,让他每天都能忘掉一点什么。
  总结: |
    这就是醉仙的调色盘。混沌是说话颠三倒四走进皇宫后院完全不知道自己在哪的迷糊,率真是跟野狗抢骨头被咬了屁股追三条街的荒唐,洒脱是一百坛上品灵酒嫌少扭头就走的不在乎,清醒的瞬间是浑浊的眼突然变成千年古井般深邃说出改变别人一生的话的沉重。这些颜色混在一起,像一壶说不清年份的酒——浑浊的、辛辣的、呛人的,但喝下去之后有一种说不清的回甘,从喉咙一直暖到心里。就像这个邋遢的老头,摇摇晃晃地走在路上,抱着酒葫芦,嘴里哼着跑调的曲子,在世人的眼里他什么都不是,在天道的眼里他是这个世界上最自由的人。
