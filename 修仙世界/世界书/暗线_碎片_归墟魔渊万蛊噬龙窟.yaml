【归墟·深渊裂隙】
触发：{{user}}深入归墟探索时
碎片内容：归墟是天地间最深的裂缝，传说是上古大战留下的伤痕。在归墟最深处，有一道永远不会愈合的裂口。裂口中不断涌出混沌之气，但混沌之气的最深处，偶尔会闪过一丝金光。那金光极其微弱，像是被无尽黑暗压制着的最后一缕火苗。归墟中的妖兽都本能地避开那道金光——不是因为恐惧，而是因为敬畏。即使是最凶残的太古凶兽，经过那道金光时也会安静下来。
引导方向：归墟深处的金光——极阳天尊陨落时的战场遗迹
表达方式：环境描写，通过妖兽的本能反应暗示

【魔渊·封印之地】
触发：{{user}}接近魔渊核心区域时
碎片内容：魔渊的最底层有一座巨大的封印阵。封印阵已经运转了十万年，至今仍在发光。阵纹是金色的，与任何已知的阵法体系都不同。万法宗的阵法大师研究了数千年也无法破解其原理。封印阵的中心有一个空洞——像是原本有什么东西在那里，后来被取走了。封印阵周围的空间极其稳定，连空间裂缝都无法在这里存在。有修士尝试用神识探查封印阵的深处，感受到的只有一个字——"镇"。
引导方向：十万年前的封印阵——极阳天尊亲手布下的镇压之阵
表达方式：遗迹探索的发现感

【万蛊噬龙窟·蛊母的记忆】
触发：{{user}}深入万蛊噬龙窟，接触到蛊母或万蛊之祖时
碎片内容：万蛊噬龙窟的最深处住着蛊母——所有蛊虫的始祖。蛊母已经活了不知道多少万年，它的记忆混乱而古老。但在它最深层的本能记忆中，有一个画面反复出现：一道金色的身影站在天地之间，伸出手，将所有的蛊毒、瘴气、魔气统统压入地下。那个身影的力量太过强大，以至于蛊母的祖先们在那一刻集体陷入了沉睡。等它们醒来时，世界已经变了。蛊母不理解那个画面的含义，但它本能地知道——那个金色身影是它唯一恐惧的存在。
引导方向：蛊母的太古记忆——极阳天尊镇压万邪的画面
表达方式：通过蛊虫的本能记忆，原始而直接

