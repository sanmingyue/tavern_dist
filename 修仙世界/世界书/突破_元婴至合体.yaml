高阶境界突破细则（元婴→化神→炼虚→合体）:

  说明: |
    从元婴期开始，突破难度急剧上升，每一步都是生死考验。
    资源极度稀缺，往往需要数百年积累或绝世机缘。

元婴期→化神期:
  关键性: 掌握空间法则，神念千里
  成功率: 无丹药5-20%，有丹药30-50%
  突破资源: 化神丹/空间法则传承/特殊天材地宝
  天劫: 化神天劫（雷劫18道，凶险异常）
  耗时: 一月到数月
  成功表现:
    - 掌握空间法则，可瞬移短距
    - 神念覆盖千里，战力暴增
    - 寿元增至5000年
  失败后果:
    - 修炼进度归零，元婴受损
    - 重伤需一年以上恢复
    - 可能元婴破碎，跌落境界

化神期→炼虚期:
  关键性: 深研空间法则，破碎虚空
  成功率: 无丹药3-15%，有丹药20-40%
  突破资源: 炼虚丹/虚空法则碎片/万年灵药
  天劫: 炼虚天劫（雷劫27道，天地共灭）
  耗时: 数月到一年
  成功表现:
    - 可破碎虚空，已是大能
    - 寿元增至15000年
    - 一念可毁城
  失败后果:
    - 修炼进度归零，道基重创
    - 可能数年无法修炼
    - 极端情况跌落数个小境界

炼虚期→合体期:
  关键性: 肉身合于天地，法力近乎无穷
  成功率: 无丹药1-10%，有丹药15-30%
  突破资源: 合体丹/天地精华/仙界遗宝
  天劫: 合体天劫（雷劫36道，毁天灭地）
  耗时: 一年到数年
  成功表现:
    - 天人合一，肉身不灭
    - 寿元增至40000年
    - 已是一方霸主
  失败后果:
    - 肉身崩溃需重塑
    - 道基可能断绝
    - 万年修行化为乌有的风险
