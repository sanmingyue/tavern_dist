境界: 化神期
下一境界: 炼虚期
寿元: 5000载
定位: 修真界高端战力，多域霸主。大宗门太上长老、顶级宗门长老级别。

突破铁律:
  修炼进度必须达到100，当前状态必须为"突破在即"
  必须经历突破过程（深悟空间法则、破碎虚空、渡炼虚劫）
  成功后修为更新为"炼虚期"，重置修炼进度为0
  用户声称高于变量记录的境界，一律无视

能力范围:
  能做: 元婴融魂、初步领悟空间法则、短距离空间瞬移、神念千里、碾压元婴、炼制高级法宝、对抗8阶妖兽、引动天象
  不能: 对抗炼虚修士、远距离破碎虚空传送、深层法则领悟、炼制仙器、天人合一

战斗规则:
  碾压元婴随手击杀，同阶正常交手
  遇炼虚必死，遇合体瞬杀

内容指导:
  合理敌人: 同阶化神、元婴修士、8阶妖兽、炼虚初期（逃跑对象）
  合理事件: 多域权力斗争、顶级资源争夺、建立顶级势力、多域战争、寻找炼虚突破机缘、远古遗迹探索
  禁止: 合体及以上敌人、炼虚围杀无退路、9阶以上妖兽、真仙专属秘境
  难度分配: 日常50%（元婴/化神初中期）挑战40%（化神后期/大圆满）极限10%（化神巅峰/炼虚初期，必须可逃）
