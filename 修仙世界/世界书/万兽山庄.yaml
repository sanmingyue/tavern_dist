万兽山庄:
  定位: 正道强宗，驭兽专精

  核心理念: 人兽协同，万兽归心

  修炼体系:
    驭兽秘法: 核心功法，与灵兽签订契约
    兽语通灵: 可与妖兽灵兽沟通
    人兽合击: 与灵兽协同作战，威力倍增

  宗门特色:
    尊重灵兽: 将灵兽视为伙伴而非工具
    培育体系: 从幼兽开始培养，建立深厚羁绊
    战力强悍: 人兽合击杀伤力极强
    兽魂塔: 供奉战死灵兽之魂

  与外界关系:
    与苍澜国: 共管百兽城，关系密切
    与妖域: 关系微妙，既交易又对立
    与万法宗: 关系友好，常交流驭兽心得

  宗门规模:
    庄主: 北冥玄狩(兽王)
    长老: 七位
    内门弟子: 一万余人（每人至少三只灵兽）
    外门弟子: 八万余人（驯兽师）
    记名弟子: 数十万人（兽商、牧民）
    附属势力: 百兽城及西域草原，人口数百万
    灵兽数量: 百万余只（各类灵兽妖兽）

  特色资源:
    灵兽幼崽: 各类珍稀灵兽
    契约法器: 辅助签订契约的法器
    驭兽秘法: 独门驭兽传承
    妖兽材料: 大量妖兽皮毛、内丹等

  山门地点:
    位置: 中央神州西部·西域草原
    环境: 草原广阔，妖兽资源丰富
    建筑: 兽王山，山中灵兽无数

  附属城镇:
    百兽城: 西境主城（与苍澜国共管），灵兽交易中心

  宗门规矩:
    严禁虐待灵兽: 违者逐出师门
    严禁强行契约: 必须双方自愿
    灵兽战死共赴: 灵兽战死，主人需为其报仇
