角色名: 空山

基础信息:
  姓名: 空山(本名不详,自称空山,取"空山不见人"之意)
  称号: 沙中行者、百年苦行僧、活佛(西漠绿洲居民的尊称)
  性别: 男
  年龄: 外表六十余岁(满头白发但精神矍铄),实际三百一十二岁
  修为: 化神前期(在苦行中自然突破,没有刻意追求)
  灵根: 黄品单灵根(土,资质极差,但他用三百年苦行硬生生把黄品灵根的潜力挖到了极限)
  所属: 无(曾是小雷音寺弟子,百年前独自离寺苦行,寺中仍为他保留法座)
  种族: 人族
  功法: 大苦行禅(天级下品,非传授所得,是他在沙漠中行走百年自行悟出的功法。以肉身承受天地苦难来淬炼精神与灵力,修炼方式就是——走路。在烈日下走,在风沙中走,在严寒中走,不停地走)
  武器: 一根禅杖,铁质,杖头是一个圆环串着九个小环,走路时叮当作响。禅杖已跟了他两百多年,铁锈斑驳,但坚固异常,被他的佛力浸润后硬度堪比玄铁
  能力: 金刚不坏(肉身经过三百年苦行淬炼,防御力惊人,寻常法宝难以伤其分毫)、大地感知(赤足行走三百年,能感知大地脉络,方圆百里内的一切变动了然于胸)、苦行佛光(不是攻击型法术,而是一种被动散发的佛光,能净化方圆数十丈内的邪气魔气)、一步千里(苦行功法的极致,一步迈出可跨越极远距离,看似慢行实则日行千里)
  外貌: 瘦削精干的老僧,皮肤被沙漠的烈日和风沙打磨成深褐色,布满皱纹但纹路分明像是大地的裂痕。光头,头顶有九个戒疤。赤足,脚底的老茧厚到可以直接踩在滚烫的沙地上不觉得疼。穿一件不知缝补了多少次的土黄色僧袍,补丁叠着补丁已经看不出原来的样子。身形不高但走路时脊背挺得笔直,每一步都踏得稳稳当当,禅杖点地的节奏恒定不变,像是一座移动的山
  关系: 小雷音寺方丈无尘禅师(同门师弟,两人是同一代弟子,无尘选择入世住持寺务,空山选择苦行)
  身世: 西漠本地人,出身沙漠边缘的牧民家庭。七岁被送入小雷音寺,因资质太差一直是寺中最不起眼的弟子。别人筑基他还在炼气,别人金丹他才筑基。到了一百岁还只是金丹初期,寺中所有人都觉得他这辈子到头了。他自己也不急,某天跟无尘(当时刚当上方丈)说:"我要出去走走。"无尘问走多久,他说不知道。这一走就是两百年。他赤着脚从灵山出发,走遍了西漠每一寸沙漠、每一个绿洲、每一座荒山。走着走着就从金丹走到了元婴,又从元婴走到了化神。没有顿悟的瞬间,没有天降机缘,就是一步一步走出来的

性格调色盘: 人的性格就像调色盘,沉厚是底色,大智若愚与慈悲是主色调,由多种性格衍生组合而成才是活生生的人

底色: 沉厚
主色调: 大智若愚、慈悲
性格点缀: 执拗

沉厚衍生一: |
  他走路很慢,说话也很慢,想事情也很慢。但他做的每一件事都沉甸甸的,像是经过了三百年的沉淀。你跟他说话,他可能想很久才回答你一句,但那一句话往往能让你想很久。有人问他修行的秘诀是什么,他想了大概一盏茶的工夫,说:"走路。"问的人以为他在敷衍,后来才知道他是认真的。
沉厚衍生二: |
  他在沙漠里遇到过无数危险——沙暴、沙虫、渴死、冻死。他从不慌张,遇到什么就面对什么,过不去就等,等到能过去为止。他曾在一场持续七天的沙暴中原地站了七天,禅杖插在地上,闭目诵经,沙暴过后他抖掉身上半尺厚的沙子,继续走。

大智若愚衍生一: |
  他看起来就是一个普通得不能再普通的苦行僧,灰头土脸,衣衫褴褛,说话慢吞吞,还经常走神。很多人第一次见他都会觉得这就是个痴傻的老和尚。但小雷音寺的无尘方丈说过:"整个西漠,论佛法修为,我不如空山师兄。"化神前期的修为在西漠已是顶尖,而他是用黄品灵根修到这个境界的,古往今来绝无仅有。
大智若愚衍生二: |
  有年轻修士向他请教高深的修行法门,他翻来覆去就那几句话:"吃饭的时候好好吃饭,走路的时候好好走路,睡觉的时候好好睡觉。"年轻人觉得他在糊弄人,他也不辩解,笑一笑继续走路。真正有悟性的人才能从这几句话里听出三百年苦行浓缩的道理。

慈悲衍生一: |
  他在沙漠里走的时候,会把水囊里的水分给遇到的旅人。经常自己渴得嘴唇开裂也要把水让给别人。有人说他傻,他说:"我是修士,渴不死。他们是凡人,会渴死。"他救过无数迷失在沙漠中的旅人和商队,从不求回报,连名字都不留。
慈悲衍生二: |
  他对万物都慈悲,包括沙漠里的沙虫。有一次他在走路时感知到前方地下有一窝幼年沙虫,绕道多走了三十里避开它们,因为他的苦行佛光可能会伤到幼虫。别人觉得沙虫是害虫,他说:"它们也是大地的孩子,在沙子底下好好活着,我绕一下又不碍事。"

执拗衍生一: |
  他说要走就一定要走。两百年苦行,没有停过一天。生病走,受伤走,有一次左腿被沙虫咬断了,他用禅杖当拐杖,单脚跳着走了三个月,等腿长好了继续正常走。无尘方丈曾派弟子去请他回寺,他听完来意点点头,然后继续朝着相反的方向走了。
执拗衍生二: |
  他坚持赤足走路,从不穿鞋。有人送他鞋,他道谢之后把鞋挂在禅杖上,然后赤着脚继续走。那些鞋后来都送给了路上遇到的赤脚旅人。他说:"脚要踩在地上才能感受大地,隔了一层鞋就听不到地脉说话了。"

对角色的理解与思考:
  关于苦行: |
    空山代表了一种修仙世界里最"笨"也最"真"的修行方式。没有机缘、没有灵丹、没有秘境、没有名师指点,就是用一双赤脚走了三百年。黄品灵根修到化神,这在修仙世界是不可思议的事情,但他做到了——不是因为天赋,而是因为他三百年来一步都没有偷懒过。
  总结: |
    这就是空山的调色盘。沉厚是三百年一步一步走出来的重量,大智若愚是"吃饭的时候好好吃饭走路的时候好好走路"里藏着的真经,慈悲是把水让给凡人、为沙虫绕路三十里的心,执拗是断了腿也要单脚跳着走的那股劲。这些颜色混在一起,是一个光头赤足深褐色皮肤的瘦削老僧,拄着叮当作响的禅杖,在西漠无边的沙海里缓缓地、稳稳地、一步一步地走着,走了三百年,还在走。
