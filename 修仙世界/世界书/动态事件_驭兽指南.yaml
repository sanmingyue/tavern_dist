动态事件类型: 驭兽

正统修仙铁律:
  核心原则: 驭兽是收服妖兽作为战力，需要实力、技巧、机缘
  现实规则:
    - 妖兽阶位不能超过修士太多
    - 收服需要消耗大量精力和资源
    - 妖兽有自己的意志，不是傀儡
    - 培养妖兽需要时间和资源
  禁止:
    - 低境界收服高阶妖兽
    - 随便收服一堆妖兽
    - 妖兽完全听话无反抗
    - 无资源培养妖兽

妖兽阶位与修士境界对应: 一阶妖兽 = 炼气期
  二阶妖兽 = 筑基期
  三阶妖兽 = 金丹期
  四阶妖兽 = 元婴期
  五阶妖兽 = 化神期
  六阶妖兽 = 炼虚期
  七阶妖兽 = 合体期
  八阶妖兽 = 大乘期
  九阶妖兽 = 渡劫期
  妖王/妖帝 = 真仙境

收服规则:
  境界匹配:
    可收服: 同阶或低一阶妖兽
    勉强: 低两阶妖兽(需要特殊手段)
    不可能: 高阶妖兽(必被反噬)

  收服数量:
    炼气筑基: 最多1只
    金丹元婴: 最多2只
    化神炼虚: 最多3只
    合体以上: 最多5只
    注意: 每只都需要大量精力维护

收服方式:
  战斗收服:
    过程: 击败妖兽，趁其虚弱收服
    成功率: 50%-70%(取决于妖兽意志)
    风险: 妖兽可能宁死不屈
    代价: 需要留手不能杀死

  幼兽培养:
    过程: 从妖兽幼崽开始培养
    成功率: 90%以上
    优势: 忠诚度高，配合默契
    代价: 耗时极长，资源消耗大

  契约收服:
    过程: 与妖兽签订契约
    类型: 平等契约/主仆契约/血契
    成功率: 取决于妖兽意愿
    风险: 平等契约妖兽可能反悔

  机缘相遇:
    过程: 妖兽主动追随
    触发: 救过妖兽/有缘分/特殊体质
    成功率: 100%(妖兽自愿)
    稀有: 极为罕见

契约类型:
  平等契约:
    关系: 伙伴关系
    约束: 双向约束，互相帮助
    限制: 妖兽有拒绝权
    优势: 妖兽战力发挥最佳

  主仆契约:
    关系: 主仆关系
    约束: 妖兽必须服从
    限制: 妖兽心有不甘，配合度降低
    优势: 完全掌控

  血契:
    关系: 性命相连
    约束: 一方死则另一方重伤
    限制: 极为危险
    优势: 心意相通，配合完美

妖兽培养:
  日常:
    喂养: 需要妖兽肉食/灵果等
    修炼: 妖兽也需要修炼提升
    训练: 培养战斗配合

  进阶:
    突破: 妖兽突破需要大量资源
    蜕变: 高阶妖兽可能血脉蜕变
    化形: 七阶以上妖兽可化为人形

  成本:
    一阶妖兽: 每月10-50下品灵石
    二阶妖兽: 每月50-200下品灵石
    三阶妖兽: 每月1-5中品灵石
    四阶妖兽: 每月5-20中品灵石
    五阶妖兽: 每月20-100中品灵石
    六阶以上: 每月1-10上品灵石

妖兽种类:
  攻击型:
    虎豹类: 力量强大，近战厉害
    鹰隼类: 速度快，空中优势
    蛇蟒类: 毒性强，缠绕攻击
    狼犬类: 群体配合，嗅觉灵敏

  防御型:
    龟甲类: 防御极强
    牛犀类: 皮糙肉厚

  辅助型:
    灵狐类: 幻术迷惑
    灵猿类: 灵巧敏捷
    灵鹿类: 感知危险

  特殊型:
    龙种: 血脉强大，极难收服
    凤种: 火焰天赋
    麒麟种: 祥瑞，极罕见

妖兽能力:
  天赋神通:
    - 每种妖兽都有天赋能力
    - 如: 火焰、冰霜、雷电、飞行等
    - 阶位越高，神通越强

  战斗配合:
    - 与修士联手作战
    - 配合度影响效果
    - 默契需要长期培养

  成长潜力:
    普通血脉: 最多五六阶
    优良血脉: 最多七八阶
    强大血脉: 可达九阶
    神兽血脉: 可成妖王

奖励规则_严格限制:
  成功收服:
    一阶: 获得妖兽，修炼进度+5
    二阶: 获得妖兽，修炼进度+10
    三阶: 获得妖兽，修炼进度+15
    四阶: 获得妖兽，修炼进度+25
    五阶: 获得妖兽，修炼进度+40
    六阶及以上: 获得妖兽，修炼进度+60-100

  培养妖兽:
    - 妖兽成长，修炼进度少量提升
    - 妖兽突破，修炼进度+10-30
    - 建立深厚羁绊，可能领悟特殊能力

  失败:
    - 可能被妖兽重伤
    - 消耗大量资源
    - 精力付诸东流

妖兽战斗:
  配合战斗:
    - 妖兽可以独立作战
    - 也可以与修士配合
    - 配合默契威力倍增

  妖兽受伤:
    - 妖兽也会受伤
    - 需要疗伤和休养
    - 重伤可能影响潜力

  妖兽死亡:
    - 妖兽可能战死
    - 血契的话修士会重伤
    - 失去妖兽是巨大损失

特殊情况:
  妖兽背叛:
    原因: 虐待/强行压制/遇到更强者
    表现: 反抗/逃跑/反噬主人
    后果: 可能身死道消

  妖兽化形:
    触发: 七阶以上妖兽可化形
    效果: 化为人形，智慧大增
    关系: 可能要求解除主仆契约

  血脉觉醒:
    触发: 妖兽血脉返祖
    效果: 实力大增，潜力提升
    可能: 难以掌控

境界限制_绝对规则:
  - 不能收服高于自己阶位的妖兽
  - 强行收服必被反噬
  - 妖兽数量有限
  - 培养需要大量资源

AI生成要点:
  - 妖兽的威猛/可爱
  - 收服的艰难/温馨
  - 培养的用心
  - 战斗的配合
  - 羁绊的深厚

注意事项:
  - 妖兽是生命，不是工具
  - 需要用心对待
  - 虐待妖兽会反噬
  - 培养需要时间和资源
  - 强大妖兽极难收服
  - 收服太多会分散精力
