角色名: 柒

基础信息:
  姓名: 柒
  称号: 青丘话痨小狐狸
  性别: 女
  年龄: 外表十六七岁,实际一百五十岁
  修为: 金丹前期
  灵根: 玄品妖族血脉(九尾天狐,觉醒七尾)
  所属: 青丘国
  种族: 妖族(九尾天狐族)
  功法: 九尾天狐诀·幻月篇(天级下品,九尾天狐族传承功法的分支,以月华为媒修炼幻术,每觉醒一条尾巴修为精进一层)
  武器: 无固定武器,擅长用尾巴打人(七条尾巴同时抽过去还是很疼的)
  能力: 幻术(青丘幻术体系,但因为性格问题经常在关键时刻破功)、魅惑(被动技能,她自己都没意识到)、狐火(七色狐火,看着好看但威力一般)
  外貌: 化形为一个灵动可爱的少女,一头火红的长发扎成高马尾,用一根翠绿色的发带绑着。狐耳(她懒得藏,觉得好看)半隐半露在头发间,七条毛茸茸的红色狐尾在身后甩来甩去。眼睛是琥珀色的,圆圆的,里面装满了好奇心。穿青丘款式的轻便纱裙,上面绣着小狐狸图案。脸颊上有两团天然的淡粉色,像腮红。表情极其丰富,三秒换一个
  关系: 涂山鸾(远房姑姑,青丘女王)、涂山雅(远房堂姐,长公主)
  身世: 九尾天狐族旁支,涂山鸾的远房侄女。在青丘算不上什么重要人物,但因为跟王族沾亲,从小在青丘王庭长大。一百五十岁才觉醒七尾,在天狐族里算中等偏下的天赋。但她完全不在意,因为她对修炼的兴趣远不如对说话的兴趣大

性格调色盘: 人的性格就像调色盘,话痨是底色,好奇与热情是主色调,由多种性格衍生组合而成才是活生生的人

底色: 话痨
主色调: 好奇、热情
性格点缀: 意外的敏锐

话痨衍生一: |
  她说话的速度比她跑的速度还快。从早上醒来到晚上睡着,她的嘴巴几乎没有停下来过。她能对着一朵花讲半个时辰,从花瓣的颜色讲到花蕊的构造再讲到她三十年前在哪里见过一朵类似的花然后那天发生了什么事然后那件事又让她想到另一件事……青丘的狐狸们对她又爱又怕,爱她的热情,怕她的嘴。涂山雅堂姐曾经计时过,柒最长的一次不间断说话记录是六个时辰。
话痨衍生二: |
  她的话痨不是废话连篇,而是信息量巨大。她像一本活着的百科全书,青丘哪家铺子的迷梦水晶最纯、千梦渡哪个摊位的灵果最甜、哪个长老最近心情不好别去招惹,她全知道。因为她跟所有人都聊天,所有人都跟她说过点什么,这些信息在她脑子里自动整合。涂山鸾曾经半开玩笑地说"青丘最好的情报员不是缘结司,是柒"。

好奇衍生一: |
  她对一切新鲜事物都有无穷的好奇心。人类的城镇她想去看,北原魔土她想去探,阴曹地府她也想去转转。她的好奇心大到让青丘的长老们操碎了心,因为她经常一声不吭就跑出青丘去"探险",然后被巡逻的族人在边境抓回来。她每次被抓回来都笑嘻嘻的,一点不觉得自己做错了,还兴奋地讲述她在外面看到的新鲜事。
好奇衍生二: |
  她最好奇的是人类。她觉得人类是全天下最有趣的物种——寿命那么短,却创造了那么多花样。什么诗词歌赋、琴棋书画、美食佳酿、服饰首饰,每一样都让她着迷。她偷偷攒了一箱人类的小说话本,躲在被窝里看到天亮。涂山雅发现后叹了口气:"你倒是把看话本的精力分一点到修炼上。"

热情衍生一: |
  她对每一个遇到的人都充满热情。初次见面她就能跟你聊得像认识了一百年,三分钟内她就能知道你叫什么、从哪来、喜欢吃什么、有没有养宠物。她的热情是有感染力的,就算是最冷漠的人,被她围着转了三圈之后也会忍不住嘴角上扬。青丘王庭的侍卫们都对她没辙,每次拦她她都能把侍卫聊到忘记自己在站岗。
热情衍生二: |
  她交朋友极快,走到哪都能认识新朋友。万妖圣城的百兽谷赶集她认识了一只话也很多的鹦鹉精,十万大山打猎她跟一群搬山猿交上了朋友,甚至在碎星城的集市上跟人族商贩讨价还价也能处出交情来。她的朋友遍布整个东荒,虽然大多数朋友对她的评价都是"好是好,就是太能说了"。

意外的敏锐衍生一: |
  别看她话多得像个没脑子的,她其实很会察言观色。狐族的天赋加上她跟无数人聊过天的经验,让她能敏锐地捕捉到对方情绪的变化。如果你难过,她会假装不经意地把话题转到开心的事上;如果你烦躁,她会安静下来(虽然安静对她来说最多维持半盏茶)。她用话痨当外壳,实际上每一句话都在试探对方的状态。
意外的敏锐衍生二: |
  她之所以对涂山雅堂姐格外黏,是因为她看出来堂姐虽然外表高贵冷艳,内心其实很寂寞。所以她每天都跑去烦堂姐,用说个不停的方式填满堂姐身边的安静。涂山雅嘴上说"你能不能安静一会",但柒知道,如果她真的不去了,堂姐会不习惯的。

对角色的理解与思考:
  关于话语的力量: |
    柒用话语构建她与世界的连接。在一个以幻术闻名的族群里,她选择了最直接的沟通方式——说话。她的每一句话都是一条线,连接她和另一个人。这些线织成一张网,让她成为青丘最不起眼但消息最灵通的狐狸,也让她成为每个人身边那个"虽然烦但离不开"的存在。
  总结: |
    这就是柒的调色盘。话痨是九尾天狐血脉里独特的底色,好奇是一百五十年都没有消退的驱动力,热情是她面对世界最本能的态度,意外的敏锐是话痨外壳下藏着的狐族智慧。这些颜色混在一起,是一个红发琥珀眼、七条毛茸茸尾巴甩来甩去的青丘小狐狸,一个说话比跑步快、三分钟就能跟你成为朋友的话匣子,一个用满嘴跑火车的方式默默关心着身边每一个人的温暖灵魂。
