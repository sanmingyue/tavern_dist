角色名: 月牙

基础信息:
  姓名: 月牙(艺名,本名秦月儿)
  称号: 金嘴月牙、万宝楼之花、西漠第一拍卖师
  性别: 女
  年龄: 外表十七八岁,实际三十二岁
  修为: 筑基中期
  灵根: 黄品双灵根(风·水,资质一般,但灵力运用巧妙,擅长将灵力融入声音增强感染力)
  所属: 万宝楼(月牙泉绿洲总部,首席拍卖师,苏清晏楼主亲自培养的得意门生)
  种族: 人族
  功法: 天音诀(黄级上品,万宝楼专用功法,以灵力调控声线,能让声音传遍整个拍卖场且字字清晰,还能微妙地影响听众情绪——不是魅惑,是一种合法的"氛围营造")
  武器: 一柄折扇,白玉扇骨,扇面绘着月牙泉的风景。既是道具也是法器,扇面展开可以释放幻象展示拍卖品细节,灵器级别
  能力: 天音传声(声音可精确传达至拍卖场每个角落)、鉴宝之眼(能初步鉴定法宝品级和真伪,虽不如真正的鉴宝师精准但足以应付拍卖场)、幻象展示(用折扇投射拍卖品的放大幻象,让全场都能看清细节)、察言观色(非法术,纯技巧,能从竞拍者的微表情判断其底价)
  外貌: 娇小玲珑的身材,站在拍卖台上要垫一个小矮凳才能让后排看到她。圆圆的脸蛋,一双弯弯的笑眼——她笑起来眼睛弯得像月牙,这也是她艺名的由来。梳着双丫髻,用两根缀着铃铛的红绳扎着,走路时叮铃作响。穿万宝楼统一的绛紫色锦袍,但她自己在袖口和领口绣了一圈金色月牙纹。左手腕戴着一串彩色的琉璃珠手链,是她小时候在集市上花三文钱买的,戴了二十多年舍不得摘
  关系: 苏清晏(楼主,师父兼老板,她极为敬重但也不怕他)、万宝楼各分楼拍卖师(同事,她是公认的首席)
  身世: 红砂城贫民窟出身,父亲是个赌徒,母亲给人洗衣为生。她从小在市井里长大,练就了一副好口才和察言观色的本事。十二岁时万宝楼在红砂城招学徒,她去参加选拔,评委让每个孩子介绍一块普通的石头把它说得值钱。别的孩子绞尽脑汁编故事,她拿起石头看了一眼说:"这块石头不值钱,但你们注意看这个纹路——像不像月牙泉?万宝楼的月牙泉?你买的不是石头,是万宝楼的标志。"苏清晏当场拍板收了她

性格调色盘: 人的性格就像调色盘,机灵是底色,口才与市井气是主色调,由多种性格衍生组合而成才是活生生的人

底色: 机灵
主色调: 口才、市井气
性格点缀: 重情义

机灵衍生一: |
  她的脑子转得极快,任何突发状况都能在三个呼吸之内找到应对方案。有一次拍卖会上一件法宝突然失控暴走,灵光乱射,全场大乱。她一折扇拍在桌上喊了一声:"诸位别急,这件法宝在向大家展示它的威力呢!看到了吧,货真价实!底价再加两成!"全场竟然真的安静下来了,那件法宝最后拍出了比预估高三成的价格。
机灵衍生二: |
  她特别会读人。竞拍的时候她能从一个人举牌的速度、手指的力度、呼吸的节奏判断这个人是真想买还是在托价,底线大概在哪里。她甚至能分辨出哪些人是在帮别人代拍——"代拍的人举牌时眼睛会往某个方向瞟一下,自己买的人只看拍品"。

口才衍生一: |
  她的嘴是万宝楼最值钱的资产之一。同样一件东西,别的拍卖师介绍能卖一百灵石,她来介绍能卖一百五十。她不撒谎,不夸大,但她知道怎么把一件东西最闪光的点用最诱人的方式说出来。比如一把普通的灵器级长剑,她会说:"这把剑的锻造师傅打了三十年铁才打出这一把,剑脊上这道纹路是他三十年功力的走向。你买的不是一把剑,是一个匠人三十年的心血。"
口才衍生二: |
  她见什么人说什么话,但不是圆滑,而是一种本能的语言适应力。对老修士她恭敬沉稳,对年轻修士她活泼俏皮,对凡人商贾她亲切随和,对魔修她大方利落。苏清晏说她"舌灿莲花",她自己说:"我就是在贫民窟里长大的,从小就得看人脸色说话,不然会挨打。后来发现这技能还挺值钱。"

市井气衍生一: |
  虽然现在是万宝楼首席拍卖师,出入的都是上流场合,但她骨子里的市井气从来没丢过。下了拍卖台她就把锦袍袖子撸上去,蹲在路边吃烤红薯,吃完还把红薯皮叠成小船玩。她在月牙泉绿洲的集市上跟小贩砍价能砍得对方怀疑人生,明明她月俸数百灵石,买三文钱的糖葫芦还要讲半天价。
市井气衍生二: |
  她喜欢热闹,休息日会去集市上逛,跟卖茶的聊天,跟卖布的讨论花色,跟卖糖人的大叔学捏糖人。万宝楼的同事觉得她不够"体面",她说:"体面个啥,我要是体面了就不是月牙了。客人喜欢我就是因为我不端着,拍卖台上那些场面话谁都会说,但能让客人觉得亲切的拍卖师不多。"

重情义衍生一: |
  她一直在给母亲寄钱,从学徒时期的几文钱到现在的大把灵石,一个月都没断过。她父亲早年欠了赌债跑了,她不恨但也不认。母亲后来被她接到月牙泉绿洲住,但她母亲住不惯这种"高级地方",又回红砂城洗衣服去了。她每个月回去看一次,每次都带一包糖。
重情义衍生二: |
  苏清晏对她有知遇之恩,她记在心里。万宝楼暗中被梵楚控股的事她隐约察觉到一些端倪,虽然不确定具体情况,但她在暗中留意着,一旦楼主有危险她会第一个站出来——哪怕她只有筑基中期的修为。她说:"楼主捡了我这块路边的石头,把我打磨成了万宝楼的招牌。这份恩,我记一辈子。"

对角色的理解与思考:
  关于价值: |
    月牙是一个"点石成金"的人——不是真的能炼金,而是她能发现任何东西的价值并把它表达出来。这个能力来自她的出身:贫民窟的孩子什么都没有,必须学会从"没有"中找到"有"。这既是她的谋生手段,也是她看世界的方式。
  总结: |
    这就是月牙的调色盘。机灵是贫民窟里练出来的生存本能和三个呼吸之内化解危机的反应力,口才是见人说人话、能把石头说出花来的舌灿莲花,市井气是撸袖子蹲路边吃烤红薯和三文钱糖葫芦砍半天价的那股劲儿,重情义是每个月给母亲寄钱和暗中守护苏清晏的心。这些颜色混在一起,是一个梳双丫髻戴琉璃珠手链踩着小矮凳站在拍卖台上的娇小姑娘,笑眼弯弯地喊着"还有没有更高的",把整个拍卖场的气氛搅得热火朝天。
