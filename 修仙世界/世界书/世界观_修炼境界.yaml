修炼境界:
  凡人:
    寿元: 百年
    特点: 血肉凡胎，生老病死，不脱轮回

  炼气期:
    境界: 十层小境
    特点: 引气入体，淬炼己身
    寿元: 一百五十载
    能力: 五感超常，身手超凡，可御基础五行术法
    意义: 踏入修真第一步，褪凡人之躯

  筑基期:
    境界: 前期、中期、后期、大圆满
    特点: 灵气化液，筑就道基
    寿元: 三百载
    意义: 仙凡之隔，自此可称修士

  金丹期:
    境界: 前期、中期、后期、大圆满
    特点: 灵力凝缩，结不朽金丹
    寿元: 八百载
    能力: 可御剑飞天，金丹不毁则道基永固

  元婴期:
    境界: 前期、中期、后期、大圆满
    特点: 金丹化婴，可离体神游
    寿元: 两千载
    特殊: 肉身毁而元婴不灭，则可夺舍重生

  化神期:
    境界: 前期、中期、后期、大圆满
    特点: 元婴融魂，初悟空间法则
    寿元: 五千载
    能力: 可瞬移，神念千里，初窥天地玄机

  炼虚期:
    境界: 前期、中期、后期、大圆满
    特点: 深研空间法则，破碎虚空
    寿元: 万五千载
    能力: 远距传送，举手投足引动天地伟力

  合体期:
    境界: 前期、中期、后期、大圆满
    特点: 肉身合于天地，法力绵长近乎无穷
    寿元: 四万载
    意义: 天人合一，己身即天地

  大乘期:
    境界: 前期、中期、后期、大圆满
    特点: 法则领悟至境，凝聚仙元
    寿元: 十万载
    意义: 为渡劫做准备，已可称半步真仙

  渡劫期:
    境界: 前期、中期、后期、大圆满
    特点: 引九天神雷淬体，熬炼仙躯
    寿元: 十万载（与大乘期同）
    意义: 成仙最后关隘
    难度: 九死一生，十不存一

  真仙境:
    境界: 一至十重天，十重天之上为大圆满
    特点: 渡过天劫，灵力尽化仙元，超凡入圣
    称号: 陆地真仙
    考验: 仍需面对天人五衰之劫
    寿元详解:
      一重天: 十万载
      二重天: 十一万载
      三重天: 十二万载
      四重天: 十三万载
      五重天: 十四万载
      六重天: 十五万载
      七重天: 十六万载
      八重天: 十七万载
      九重天: 十八万载
      十重天: 十九万载
      十重天大圆满: 三十万载
    说明: 每升一重天，寿元增一万载；而十重天臻至大圆满之境，则可逆天改命，再添十一万载寿元，共得三十万载悠悠岁月

专属境界体系:
  剑修剑心境界:
    概述: 一条纯粹的杀伐与守护之路，专注于内心与剑道的融合
    特殊: 剑修不依赖灵根资质，唯看剑心悟性
    境界层次:
      入剑:
        说明: 明己心，知己念，人剑合一
        意义: 踏入剑道之门，初窥剑道真谛
      剑意:
        说明: 剑出随意动，锋芒初露
        意义: 剑随心意，招式之中已含剑之锋芒
      剑势:
        说明: 引动周遭气机，剑未出而势已成
        能力: 能以剑势压制同阶对手，占据先机
      剑心:
        说明: 将内心最深的执念烙印于剑
        意义: 剑即我心，我心即剑，剑道从此烙印己身
      剑心通明:
        说明: 剑心剔透，再无迷惘
        能力: 一念起，剑万里，斩尽世间一切阻碍
      无我:
        说明: 心中唯有剑，舍弃自我
        意义: 化为最纯粹的剑道化身，超脱凡尘执念
      无剑:
        说明: 手中无剑，心中亦无剑
        能力: 天地万物皆可为剑，草木竹石皆可伤敌
      无我无剑:
        说明: 人与道合，自身即是至高无上的剑道法则
        意义: 剑道巅峰，已臻剑仙之境

  丹修炼丹境界:
    概述: 以身躯为洪炉，以万药为薪柴，炼就无上大道
    特殊: 丹修境界决定可炼制的丹药品质
    境界层次:
      炼精化气:
        说明: 以草木灵气滋养肉身，百病不侵
        能力: 可炼制凡品丹药，为筑基期以下修士疗伤祛病
      炼气化神:
        说明: 引地火丹心，以神念控火
        能力: 可炼制灵品丹药，助修士突破境界，祛除瓶颈
      炼神还虚:
        说明: 神魂强大，可观摩丹药在炉内每一丝精微变化
        能力: 可炼制宝丹，起死回生，夺天地之造化
      炼虚合道:
        说明: 身与丹合，与药草产生共鸣
        能力: 甚至能催生稀有灵药，可炼制传说中的仙丹
        意义: 以丹入道，丹道巅峰
