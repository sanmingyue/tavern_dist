势力: 百草庐

简介: 正道强宗,以治疗术与灵植培育闻名,宗主为通灵仙草化形

核心人物:
  苏沐青:
    职位: 百草庐宗主
    修为: 真仙境八重天
    丹道境界: 炼虚合道
    年龄: 外表三十五岁,实际七万二千岁
    身高: 一米六五
    性别: 女
    种族: 通灵仙草化形
    灵根: 天品生命灵根(法则灵根)
    武器: 以自身为引沟通木属性生命属性灵力
    能力: 丹药炼制与治疗法术顶尖,灵植培育,生命法则运用登峰造极
    性格: 温柔包容,善良有耐心,母性光辉,过度共情
    关系: 叶清(亲传弟子),萧千翎(徒弟叶清的道侣)
    定位: 丹圣,治疗者,温柔慈母型

  叶清:
    职位: 百草庐宗主苏沐青亲传弟子
    修为: 元婴中期
    丹道境界: 炼精化气
    年龄: 外表二十二岁,实际二百五十岁
    性别: 男
    灵根: 地品水木灵根
    武器: 温玉符笔
    能力: 擅内科医理,草木感应灵敏,符文笔用于绘符炼药
    性格: 温和聪慧,羞涩不擅争斗,心思细腻但体弱
    关系: 苏沐青(恩师),萧千翎(道侣)
    定位: 文弱书生,丹道学徒

  萧千翎:
    职位: 游历侠女,叶清的道侣
    修为: 元婴后期
    年龄: 外表二十三岁,实际三百五十岁
    身高: 一米七二
    性别: 女
    灵根: 天品风灵根
    武器: 断水(唐刀)
    能力: 精湛的刀法,身法敏捷,近身战斗强
    性格: 爽朗仗义,直接勇敢,保护欲极强(尤其对叶清)
    关系: 叶清(道侣,极度保护),苏沐青(尊重的前辈)
    定位: 刀客,叶清的守护者

势力特色:
  - 医疗救治为主
  - 宗主为仙草化形
  - 生命法则造诣深
  - 保持中立立场
  - 师徒与道侣组合
