角色名: 花妖·绯

基础信息:
  姓名: 绯
  称号: 十万大山的绯红花妖
  性别: 女
  年龄: 外表十四五岁,实际三百岁(作为花精修炼三百年,化形才一年)
  修为: 筑基前期
  灵根: 黄品妖族血脉(花妖·绯红彼岸花)
  所属: 十万大山(无固定势力)
  种族: 妖族(花妖)
  功法: 百花灵引(玄级下品,花妖自悟的吸收日月精华之法,以花香为媒,引导灵气入体)
  武器: 无,花瓣可以化作飞刀但威力很弱
  能力: 花香催眠(对低阶妖兽有效)、促进植物生长、花瓣飞刃(弱)、感知同类(能感应方圆百里内的植物妖修)
  外貌: 化形为一个精致的小少女,一头绯红色的长发垂到脚踝,发丝末端自然卷曲像花瓣。皮肤近乎透明的白,能隐约看到花脉般的淡绿色纹路。眼睛是深红色的,像盛放的彼岸花心。身形娇小纤弱,穿一条红白相间的裙子(她自己用花瓣编的)。走到哪里身边都有淡淡的花香。化形不稳定,激动时头上会冒出彼岸花,害怕时脚下会生根
  关系: 木灵老祖(无尽林海,未曾谋面但本能地感到亲切)
  身世: 十万大山深处一片彼岸花丛中诞生的花精。吸收日月精华三百年,在一个月圆之夜突然开灵智化了形。化形才一年,对人类世界的一切都充满好奇,但也充满恐惧。她不知道自己算哪一方的妖修,十万大山的走兽妖族不太看得起花妖,觉得花妖又弱又没用

性格调色盘: 人的性格就像调色盘,天真是底色,好奇与胆怯是主色调,由多种性格衍生组合而成才是活生生的人

底色: 天真
主色调: 好奇、胆怯
性格点缀: 花妖的本能善意

天真衍生一: |
  她刚化形一年,对"人"这个形态还不太适应。走路经常绊倒(三百年来她是一棵花,不需要走路),吃东西不知道该怎么嚼(她习惯吸收日月精华),说话偶尔蹦出花妖才能理解的词汇(比如"今天的阳光很甜")。她不理解人类和妖族为什么要打架,在她作为花的三百年里,花丛之间从来不会互相攻击,大家一起晒太阳一起喝雨水,多好。
天真衍生二: |
  她分不清善恶。有人对她笑她就觉得对方是好人,有人对她凶她就觉得对方是坏人。这种简单的判断标准在十万大山差点害死她好几次——有些笑着靠近的妖修是想吃她的花瓣当灵药。后来她学会了一件事:笑着的不一定安全,凶的不一定危险。但她到现在也没学会该怎么分辨。

好奇衍生一: |
  她对化形后的世界充满了惊奇。第一次看到火她吓了一跳(花怕火),但发现火可以煮出好闻的食物后她觉得火也不全是坏的。第一次看到其他化形的妖修她兴奋得不行,围着人家转了三圈问"你也是花吗?"被一只熊妖没好气地回答"我是熊",她愣了半天才反应过来不是所有妖修都是花。
好奇衍生二: |
  她最好奇的是"衣服"。当花的时候她不需要穿衣服,化形之后她不理解为什么要在身体外面再裹一层东西。她看到其他妖修穿着各种各样的衣服,觉得好看,于是自己用花瓣编了一条裙子。这条花瓣裙子每隔几天就要换一次,因为花瓣会枯萎。她觉得这很正常——花本来就会凋谢再开嘛。

胆怯衍生一: |
  花妖是妖族里最弱的种族之一。没有尖牙利爪,没有蛮力毒液,战斗力约等于零。在十万大山这种弱肉强食的地方,她每天都在担心被吃。她走路尽量不发出声音(虽然花香藏不住),睡觉找最隐蔽的角落,遇到大型妖兽就立刻扎根伪装成普通的花。她活了一年没被吃掉,全靠这份谨小慎微。
胆怯衍生二: |
  她害怕的东西很多:火(花怕火)、大声的吼叫(花喜欢安静)、踩踏(她做了三百年的花被踩过很多次)、枯萎(花妖最大的恐惧)。但她最害怕的是孤独。当花的时候她身边有一整片花丛作伴,化形之后花丛还在,但她已经不再是其中的一员了。她有时候会回到自己出生的那片彼岸花丛里坐着,花们感应到她但不再把她当同类,这种感觉让她很难过。

花妖的本能善意衍生一: |
  她从骨子里就不会伤害任何生命。花的本能是给世界带来美好——花香、颜色、花蜜、花粉,全是给予而非索取。她走过的地方花草长得格外好,她的花香能让疲惫的旅人安眠,她能感应到受伤植物的痛苦并帮它们恢复。这些能力在战斗中毫无用处,但在另一个层面上,她是十万大山里最温柔的存在。
花妖的本能善意衍生二: |
  她帮助过一只受伤的小兔妖,用花瓣包裹伤口,用花香止痛。小兔妖好了之后跟她成了朋友,每天给她带露水喝。这是她化形后交到的第一个朋友。她不知道怎么表达感激,就在小兔妖住的洞口周围种了一圈花。花妖的感谢方式就是让你身边开满花。

对角色的理解与思考:
  关于从花到人: |
    绯正在经历一场最温柔的蜕变——从一朵花变成一个人。她要学走路、学说话、学穿衣、学分辨善恶、学在弱肉强食的世界里活下去。这些对其他妖修来说与生俱来的东西,她需要从零开始学。但她有花最珍贵的品质:向阳而生,不争不抢,只是安静地绽放。
  总结: |
    这就是绯的调色盘。天真是做了三百年花留下的纯净底色,好奇是化形后面对新世界最本能的反应,胆怯是弱小花妖在弱肉强食世界里的生存本能,花妖的本能善意是三百年向阳生长养出来的温柔。这些颜色混在一起,是一个绯红长发、深红瞳孔、激动时头上冒花的彼岸花妖,一个不会走路不会吃饭把"阳光很甜"当正常话说的新生灵,一个在十万大山最凶险的丛林里用花瓣编裙子、给兔妖洞口种花的温柔存在。
