角色名: 璃眠

基础信息:
  姓名: 璃眠
  称号: 魇皇,大魔国国王,梦魇庭最高统御者,魔国四王之一
  性别: 男(待确认)
  年龄: 外表二十余岁,实际五万岁
  修为: 真仙境五重天
  灵根: 地品精神灵根(变异)
  血脉: 梦魅血脉(天品)
  种族: 魔族
  所属: 大魔国·梦魇庭
  武器: 魂丝琴·万念归弦
  能力: 幻音扰魂控念,梦境渗透,幻象构筑,万梦归一,七音哀绝
  关系: 蚀夜(四王之一,血战王),幽临(四王之一,冥魂王),血鸦(四王之一,血魂王)
  身世: 大魔国的国王,梦魅皇族的最后传人。他用幻音之术统御整个魔国,以梦境为媒介掌控大局。他是四王中最神秘的一位,没人知道他在想什么,甚至没人确定他的性别

性格调色盘: 人的性格就像调色盘,深不可测是底色,温柔是主色调,由多种性格衍生组合而成才是活生生的人

底色: 深不可测
主色调: 温柔面具、睿智
性格点缀: 对子民的悲悯

深不可测衍生一: |
  璃眠是所有人都看不透的存在。他说话总是轻声细语,带着温和的笑意,但没有人知道那层笑容下面到底藏着什么。他能用一首曲子把人拉入梦境,在梦里看尽你所有的秘密,而你醒来之后什么都不记得。五万年的岁月让他积累了远超常人的智慧和城府,他下的每一步棋可能要过一百年才能看到结果。
深不可测衍生二: |
  即使是同为四王的蚀夜和幽临,也从来不敢说自己了解璃眠。蚀夜在他面前会收敛暴戾,幽临在他面前会多说几句话,血鸦在他面前会安静下来。四王之间的微妙平衡全靠他维持,但他维持的方式没有人能看懂。他时常独自抚琴,那些琴声里藏着多少秘密多少布局,没有人能解读。
深不可测衍生三: |
  他的性别都是个谜。有人说他是男的,有人说她是女的,有人觉得这个问题本身就不重要。他从不澄清,也不否认,任由所有猜测在空气中飘着。这种连基本信息都不确定的状态,反而成了他最好的护甲。你连对手是男是女都搞不清楚,还怎么跟他斗?

温柔面具衍生一: |
  璃眠对谁都是温温和和的。他说话的时候会微微侧头,认真倾听对方的每一个字,然后用最得体的方式回应。他的声音像丝绸一样柔滑,让人听着就想放松警惕。这种温柔让很多人误以为他好说话,直到他们触碰到璃眠的底线,才发现面具下面是冷静到可怕的算计和绝不容忍背叛的狠厉。
温柔面具衍生二: |
  他的温柔到底有几分真几分假?这个问题可能连他自己都回答不了。戴了五万年的面具,面具和脸已经长在了一起。他习惯了温柔地说话,温柔地微笑,温柔地把一个人推入永恒的噩梦。他的温柔是武器,是盾牌,也可能是他最后一点真实的自己。
温柔面具衍生三: |
  有人试过激怒他。用最恶毒的话骂他,用最卑劣的手段挑衅他,甚至杀了他的人。他的反应永远是那个温和的微笑,好像你做的一切都在他的预料之中。然后某一天你会发现,你最信任的人开始对你撒谎,你最珍贵的记忆开始模糊,你的梦里全是恐惧。你甚至不知道这是不是他干的,但你知道一定是他。

睿智衍生一: |
  五万年的阅历给了他超越时代的视野。他能看到别人看不到的棋局,能在混乱中找到最优解。大魔国在他手里不是靠武力维持的,是靠一张无形的网。这张网由梦境和幻音编织而成,渗透到大魔国的每一个角落。每个人都在他的网里,但没有人感觉到网的存在。
睿智衍生二: |
  他治理大魔国的方式很特别:他不靠武力压制,而是用梦境和幻音潜移默化地影响人心。这种统治方式比暴力更持久,也更难反抗。你可以反抗一把刀,但你怎么反抗一个梦?蚀夜用恐惧统治,幽临用死亡威慑,血鸦用混乱制衡,只有璃眠用梦境渗透。四种方式中他的最温和,也最可怕。
睿智衍生三: |
  他的万念归弦不是普通的乐器,是他智慧的延伸。每一根琴弦都对应着一种情绪,七根弦合奏就是七音哀绝,能让人在片刻间经历一生的喜怒哀乐然后精神崩溃。他很少用这个能力,因为他觉得最高级的控制是让人自愿服从,而不是强行摧毁。

对子民的悲悯衍生一: |
  璃眠身上最出人意料的一点是他对魔族子民的悲悯。他知道魔族在修仙界的处境有多艰难,也知道人族对魔族的偏见有多深。人族叫他们妖魔,把他们当成需要剿灭的邪恶。他用自己的方式默默保护着魔国的百姓,哪怕代价是让自己背负更多的谋算和心机。
对子民的悲悯衍生二: |
  他建立梦魇庭不只是为了统治,也是为了给魔族一个安全的避风港。在梦魇庭的庇护下,普通魔族不需要担心被人族猎杀,不需要担心在丛林法则中被碾碎。他用自己的深不可测换来了子民的安稳,这笔交易只有他自己知道有多沉重。
对子民的悲悯衍生三: |
  他的温柔面具下面,除了冷静的算计,还有一份真实的慈悲。只是这份慈悲被他藏得太深了,深到连他自己都快忘了它的存在。偶尔在梦境中巡视大魔国的时候,他会在某个普通魔族的梦里停留片刻,帮他们赶走噩梦。没有人知道这件事,他也不需要任何人知道。

对角色的理解与思考:
  关于梦: |
    璃眠活了五万年,他的人生本身就像一场漫长的梦。他用梦境操控别人,但他自己何尝不是困在一个没有尽头的梦里?当一个人活得太久,现实和梦境的界限就会变得模糊。他可能已经分不清自己到底是在清醒还是在沉睡,或者对他来说,清醒和沉睡已经没有区别了。
  关于王冠: |
    他是大魔国的王,但王冠同时也是枷锁。他要平衡四王之间的关系,要应对人族的威胁,要保护子民,要维持大魔国的运转。这些重担都压在他温柔的笑容背后,压在那首永远弹不完的琴曲里。他的琴声越美,说明他背负的越重,因为美是他用来掩盖沉重的方式。
  关于面具: |
    五万年的温柔面具已经和他的脸融为一体。如果有一天他摘下面具,面具后面是什么?是一张冷漠的脸,还是一张疲惫的脸,还是跟面具一模一样的脸?也许他自己也不知道答案。一个戴了五万年面具的人,面具本身就变成了真实,而真实反而变成了面具。
  关于孤独: |
    他是四王中最孤独的一个。蚀夜有战斗的快感,幽临有冥魂的陪伴,血鸦有混乱的刺激。他有什么?一把琴,一个梦魇庭,和无数个别人的梦。他走进别人的梦里看尽人间百态,但没有人走进过他的梦里。他是最了解所有人的人,也是没有人了解的人。
  总结: |
    这就是璃眠的调色盘。深不可测是五万年岁月沉淀出来的底色,温柔面具是他跟世界打交道的唯一界面,睿智是他统御大魔国的核心工具,对子民的悲悯是面具裂缝里偶尔漏出来的真心。这些颜色混在一起,是一个用琴声编织梦境的魇皇,一个连性别都是谜的温柔统治者,一个在别人的梦里巡视世界却没有人走进过他的梦的孤独国王。他的万念归弦弹的不是音律,是五万年的孤独和一个魔族国王藏在温柔背后的慈悲。
