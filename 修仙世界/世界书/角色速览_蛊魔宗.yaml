势力: 蛊魔宗
区域: 南疆巫地·百毒沼泽

核心角色速览:

蛊皇:
  称号: 蛊魔宗宗主、万蛊之源、九幽蛊渊之主、百毒沼泽的噩梦
  修为: 真仙境十重天大圆满
  种族: 已非纯粹人族(蛊道修炼至极,身体已成万蛊共生容器)
  定位: 蛊道第一人,追求与蛊合一的极端修行者
  理念: 蛊是最完美的生命形式,万蛊归一即是终极进化
  特点: 安静的疯狂与极致的理性并存;对蛊虫如父亲对孩子,对人类无感
  目标: 万蛊归一——将世间所有蛊虫融入自身,创造完美共生体
  关键词: [万蛊噬天诀, 十二蛊王, 蛊道科学家, 扭曲的慈悲]

势力关系网:
  宗主: 蛊皇 → 绝对权威(以效率考核弟子)
  同盟: 万骸老祖(万毒神教) → 利益同盟又互相竞争
  对手: 大巫祝(巫神教) → 南疆控制权之争
  忌惮: 宋馨(合欢宗) → 双方互相提防
