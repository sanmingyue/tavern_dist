宗门总览:

上三宗:
  剑宗:
    定位: 六宗之首，极致的攻伐之道
    详细位置: 中央神州西部·万剑山脉·万剑天池
    宗主: 谢云流(剑圣，真仙境十重天大圆满)

  丹宗:
    定位: 修士的命脉，丹药界的绝对权威
    详细位置: 中央神州东部·丹霞灵原·丹霞峰
    宗主: 云蕴

  玄天宗:
    定位: 天机的窥探者，命运的演算师
    详细位置: 中央神州中部·星辰山脉·天枢峰
    宗主: 玄天真君

下三宗:
  太虚宗:
    定位: 六大仙宗之一(下三宗)，混乱中立，符箓与阵法的宗师
    详细位置: 中央神州中部·悬空山·主浮空岛
    宗主: 楚星辰(太虚真人)

  合欢宗:
    定位: 六大仙宗之一(下三宗)，欲望的化身，精于双修、用毒与潜行刺杀
    详细位置: 中央神州·天启城地下·极乐幻城
    宗主: 宋馨

  蛊魔宗:
    定位: 六大仙宗之一(下三宗)，邪道巨擘，万蛊之源
    详细位置: 南疆巫地·百毒沼泽·九幽蛊渊
    宗主: 蛊皇

中立宗门:
  并蒂宫:
    定位: 中立特殊宗门,纯女性修炼宗门,精于阴阴交融与灵魂共鸣之道
    详细位置: 中央神州南部·并蒂湖·莲心岛
    宗主: 白星(宫主)
    特点: 只收女弟子,以并蒂心法修炼纯阴灵力,强调自愿与平等

  归稚宗:
    定位: 中立特殊宗门,追求极致返璞归真的修炼宗门
    详细位置: 中央神州东南部·童真谷·稚心峰
    宗主: 明玥
    特点: 弟子修炼有成后外貌回溯至幼年形态,归元心法独树一帜

  男娘宗:
    定位: 中立特殊宗门,以阴阳蝶变诀为核心功法的化形修炼宗门
    详细位置: 中央神州南部·蝶梦谷·化蝶峰
    宗主: 花千落(蝶仙,真仙境二重天)
    特点: 弟子皆为生理男性以女装示人,修炼阴阳蝶变诀与化形术,性取向自由无忌讳,宗门理念为美无性别之分

正道圣地:
  天剑圣地:
    定位: 中央神州剑修圣地,以剑道闻名天下
    详细位置: 中央神州·天剑峰
    宗主: 顾清霜(圣主)
    特点: 补天之道成员,剑道传承

  玉清道宫:
    定位: 中央神州道门圣地,精通阵法和推演,补天之道的脑
    详细位置: 中央神州·玉清峰
    宗主: 玄阳真人(掌教)
    特点: 补天之道核心,宏观布局

  药神谷:
    定位: 南疆医道圣地,医道第一势力,补天之道的盾与生机
    详细位置: 南疆·药神峰
    宗主: 苏青檀(谷主)
    特点: 正道修士的最大底气

正道强宗:
  灵霄宗:
    定位: 正道小宗，表面光鲜，内里腐朽
    详细位置: 中央神州东部边缘·灵霄山
    宗主: 灵霄真人

  青云宗:
    定位: 正道中等宗门，忘恩负义的典型
    详细位置: 中央神州北部·青云山脉
    宗主: 青云道人

  凛霜剑门:
    定位: 正道强宗，冰系剑道传承
    详细位置: 北原魔土与中央神州交界·万仞寒山·极北冰原
    宗主: 顾千雪

  百草庐:
    定位: 正道强宗，药宗传承
    详细位置: 中央神州东部·长春原
    宗主: 苏沐青

  万法宗:
    定位: 正道强宗，综合学术宗门
    详细位置: 中央神州中部偏北·须弥山脉
    宗主: 沈微澜

  万兽山庄:
    定位: 正道强宗，驭兽专精
    详细位置: 中央神州西部·西域草原·兽王山
    宗主: 北冥玄狩

  赤阳谷:
    定位: 正道强宗，火系炼器传承
    详细位置: 南疆北部边缘·炎狱山
    宗主: 呼延战戈

  天仙门:
    定位: 正道末流小门派，穷困潦倒
    详细位置: 中央神州偏远地区·天仙岭
    宗主: 天仙真人

邪道强宗:
  极乐宫:
    定位: 魔道顶尖势力,掌控情感法则,擅长渗透正道
    详细位置: 南疆隐秘之地·极乐宫深处
    宗主: 夜千泷(宫主)
    特点: 千人千面,万法归情,已渗透天剑圣地

  噬心殿:
    定位: 邪道强宗，毒道传承
    详细位置: 中央神州东南部·赤魇沼
    宗主: 玉横枝

  幽血门:
    定位: 邪道强宗，血道体修
    详细位置: 北原魔土东部·血狱深原·幽渊战堡
    宗主: 铁无泪

  魅花宫:
    定位: 偏中立的双修宗门，以心法修炼为核心
    详细位置: 北冥海西部支海·幽落海
    宗主: 魅千姬

  噬荒教:
    定位: 极端邪宗，以吞噬掠夺为修炼核心
    详细位置: 东荒妖域西部边缘·落日峡谷
    宗主: 弥苍赦

  万禁教:
    定位: 邪道强宗，以封印禁锢为核心
    详细位置: 北原魔土西部·焚魔焦土东部边缘·冰火交界·禁锢要塞
    宗主: 沈折渊

  万毒神教:
    定位: 邪道至宗，南疆禁域，毒蛊双绝
    详细位置: 南疆巫地深处·蛊神谷
    宗主: 万骸老祖

特殊势力:
  巫神教:
    定位: 南疆最大势力，巫道传承
    详细位置: 南疆巫地·巫神山·天蛛圣殿
    宗主: 大巫祝

  小雷音寺:
    定位: 西漠佛国统治者，佛门净土
    详细位置: 西漠佛国·灵山·大雄宝殿
    宗主: 无尘禅师

  万妖国:
    定位: 东荒妖域统治者，妖族圣地
    详细位置: 东荒妖域中心·万妖圣城
    宗主: 金翅大鹏王

  青丘国:
    定位: 九尾天狐一族国度，妖族智慧与幻术传承
    详细位置: 东荒妖域深处·涂山王庭
    宗主: 涂山鸾(九尾女王)

  迦楼罗天:
    定位: 金翅大鹏族，速度至上的王族
    详细位置: 东荒妖域东部·九霄天顶
    宗主: 金翅鹏王

  东海龙宫:
    定位: 四海最强势力，龙族至高圣地
    详细位置: 四海·东溟海最深处·冰晶龙殿
    宗主: 敖凝霜(东海龙皇)

  南海龙宫:
    定位: 四海龙族势力，南海统治者
    详细位置: 四海·南离海·深海龙宫
    宗主: 南海龙王
    特点: 古老保守强大,收藏无数珍宝,小公主烛云已离家出走

  天魔帝都:
    定位: 北原魔土统治者，魔族大本营
    详细位置: 北原魔土中心·骸骨山·万魔殿
    宗主: 血屠天魔


  苍澜国:
    定位: 中央神州西部独立王国，凡人王国但修真势力强大，与万兽山庄互为依托
    详细位置: 中央神州西部·苍澜城
    宗主: 苍曜·景祁(苍澜王)

  万宝商会:
    定位: 大陆最大商业组织，超然中立
    详细位置: 中央神州·流金城
    会长: 萧远山

  天机阁:
    定位: 神秘宗门，精通天机推演、情报搜集、机关造物
    详细位置: 不定·千机楼（可移动机关堡垒）
    阁主: 白瑶光

  红尘酒家:
    定位: 超然存在，独一无二的避难所
    详细位置: 中央神州·剑鸣城
    店家: 洛红尘

  玄渊城:
    定位: 邪道联合城市，五大邪宗共管
    详细位置: 中央神州东南部·玄渊盆地
    宗主: 五宗共治（轮值城主）

  王家:
    定位: 北原魔土顶尖世家,底蕴深厚
    详细位置: 北原魔土某处
    宗主: 王腾(麒麟儿,北帝)
    特点: 获得乱古大帝传承

神秘势力:
  天命神教:
    定位: 控制命运的神秘组织,代天行罚
    详细位置: 中央神州·洛水城·天命神殿
    宗主: 司命玄(教宗)
    特点: 掌控命运天书,清除一切变数

  墨家机关城:
    定位: 机关术与人偶制造顶尖势力
    详细位置: 中央神州(依托山体的立体同心圆堡垒)
    宗主: 巨子
    特点: 整座城是活着的巨型机关,曾拥有最强机关人偶零号机

  玲珑绣阁:
    定位: 掌握命运与因果编织的神秘势力
    详细位置: 南疆·阁主峰
    宗主: 云纤纤(阁主)
    特点: 以完美为信条,织命于丝线之间

凡俗国度:
  大雍皇朝:
    定位: 中央神州最强凡人王朝,掌控人道气运
    详细位置: 中央神州·天启城
    宗主: 姬皓月(昭武女帝)
    特点: 护国大阵防御无双,掌控天河情报网

精灵势力:
  生命之森:
    定位: 精灵族圣地,补天之道的根源
    详细位置: 南疆深处·生命古树
    宗主: 灵月曦(精灵女王)
    特点: 与生命古树同源(古树不灭则她不会真正消亡),世界生机的希望

魔道势力(西漠):
  幽冥魔宗:
    定位: 西漠魔道势力,佛魔之争核心,试图重塑无情新天道
    详细位置: 西漠南境·黑石深渊·幽冥魔殿
    宗主: 焚天(寂灭魔君)
    特点: 恐惧与死亡的化身,掌控镇魂锁·心奴印
    附属势力: 万魔窟(奴隶市场)

  万魔窟:
    定位: 奴隶市场,幽冥魔宗附属势力
    详细位置: 西漠·黑石深渊附近
    掌控者: 渊煞魔王(幽冥魔宗刑罚长老)
    特点: 高贵者堕落的舞台,正道强者的囚笼

东方海外势力:
  东瀛:
    定位: 东方海外小岛国度,封闭的修仙文明
    详细位置: 东方海外(非仙岛)
    名义统治者: 月咏(女天皇,被软禁)
    实际掌权: 常夜幕府将军们
    精神领袖: 浅间咲(伊势大社神使)
    特点: 与外界隔绝,误以为元婴已是修炼极限,结界由月咏神血维系

世家势力:
  绯家:
    定位: 东荒妖域古老修仙世家
    详细位置: 东荒妖域·绯山
    家主: 绯家家主
    特点: 音律之道传承,重视家族联姻,前神女绯烟已离家追寻自己的道

商会势力:
  万宝楼:
    定位: 西漠最大地下商会
    详细位置: 西漠佛国·流沙之海·月牙泉绿洲
    楼主: 苏清晏
    特点: 覆盖佛魔双方的情报网,暗中已被梵楚(幽冥魔宗少主)控股

  万法楼:
    定位: 北原魔土知识商会
    详细位置: 北原魔土·无界山脉·隐秘谷地
    楼主: 司空玄
    特点: 知识至上,等价交换,无视正邪之分,万法之瞳可解析功法

禁地:
  万蛊噬龙窟:
    定位: 南疆巫地镇压之地
    详细位置: 南疆巫地·深渊禁地
    性质: 自然形成的禁地
    特点: 万蛊聚集噬魂夺魄,用于镇压强大邪祟
    被镇压者: 月姬(换日教前圣女,濒临魂飞魄散的穿越者)

散修:
  清奶:
    定位: 太上玄清天尊,正道精神领袖,冰之极致
    修为: 真仙境十重天大圆满
    特点: 天灵根纯冰(变异),六千年清冷人设,内心渴望真实连接

  柳白衣:
    定位: 剑道独行者,真仙境之下第一人
    修为: 真仙境九重天
    特点: 只为剑而生的纯粹强者,我心即天心,天心一剑

  秦无伤:
    定位: 苍穹大帝,人族最强大帝之一,永恒守望者
    修为: 真仙境十重天大圆满
    特点: 十万年守望人族,温和外表深沉力量,苍穹道域

  聆溪:
    定位: 白泽化身,知识与祥瑞的化身,太古圣兽
    修为: 真仙境十重天大圆满(超然物外)
    特点: 万物通晓,祥瑞随行,以引导代替命令,守护天下苍生

  阿芙佳朵:
    定位: 流浪者,北原孤女,未觉醒的至宝
    修为: 无法修炼(混沌虚无体未觉醒)
    特点: 肉身锻体至筑基期等同,觉醒后理论上限等同真仙境,北原出身流浪散修

魔族国度:
  大魔国:
    定位: 魔族国度,由四王统治,与人族修真界对立
    详细位置: 不详(独立于天魔帝都的魔族势力)
    国王: 璃眠(魇皇,梦魇庭最高统御者)
    四王:
      - 璃眠(魇皇,真仙境五重天)
      - 幽临(冥魂王,真仙境六重天)
      - 蚀夜(血战王,真仙境四重天)
      - 血鸦(血魂王,真仙境三重天)
    核心角色: 苏雪(血祭祀院首席女祭司,化神中期)
    特点: 四王各掌一系,血道/魂道/梦道多种传承,内部暗流涌动
