角色名: 珊瑚

基础信息:
  姓名: 珊瑚(化形后给自己取的名字,简单直接)
  称号: 无(她太弱了没人在意她叫什么)
  性别: 女
  年龄: 外表十三四岁,实际一千二百年(珊瑚妖成长极慢,一千二百年才筑基前期)
  修为: 筑基前期
  灵根: 黄品单灵根(水,珊瑚化形天赋极低,能修炼到筑基已是万中无一)
  所属: 南离海·珊瑚礁群(不属于任何势力,只是一株化形的珊瑚)
  种族: 珊瑚妖(植物妖修,严格来说珊瑚是动物但在修仙界被归为植物妖)
  功法: 无名功法(在海底礁石上刻着的残篇,不知道是谁留下的,她自己琢磨着修炼)
  武器: 无。她随身带着一块从自己本体上脱落的粉色珊瑚碎片,当护身符用,实际上没有任何法术效果
  能力: 珊瑚化(能让自己变成一小丛珊瑚躲避危险,动也不动可以躲好几天)、微弱水盾(用水灵力形成一层薄薄的水膜保护自己,挡不住任何像样的攻击但能防水母蛰)、海底感知(与珊瑚礁共鸣,能感知周围珊瑚的状态)、发光(身体能发出柔和的粉色荧光,没什么实际用处但很好看)
  外貌: 化形后是一个娇小玲珑的少女,皮肤是淡淡的粉色,像是透光的珊瑚。头发也是粉色的,短短的齐耳长度,发梢微微卷曲像珊瑚的枝丫。眼睛圆圆的,瞳色是浅粉色,在光线下会像珊瑚一样微微发光。身上穿着用海藻编织的简单衣裙,绿绿的,不太好看但是她自己编的,很自豪。赤脚,脚趾头上沾着细沙。整个人像一颗小小的粉色珍珠,干净透亮
  关系: 珊瑚礁群里的其他珊瑚(它们没有化形,但她觉得它们是自己的家人)
  身世: 她原本是南离海珊瑚礁群中一株极普通的粉色珊瑚。在海底扎根生长了八百年,看着鱼群来来去去、海流日日夜夜从身上流过。某天一个受伤的修士沉到海底,死在了她旁边,修士身上残存的灵力和那块刻着功法残篇的礁石被她无意中吸收了一部分。又过了四百年,她化形了。化形那天她从海底站起来,第一次用"眼睛"看这个世界——原来大海是蓝色的,原来自己是粉色的。她在海底呆了几十年学会了走路和说话(跟路过的鱼学的,所以说话有时候会蹦出一些奇怪的拟声词),然后开始了她的梦想:去陆地看看

性格调色盘: 人的性格就像调色盘,天真是底色,向往与怯懦是主色调,由多种性格衍生组合而成才是活生生的人

底色: 天真
主色调: 向往、怯懦
性格点缀: 倔强的小火苗

天真衍生一: |
  她对世界的认知几乎为零。她不知道什么是宗门、什么是灵石、什么是修为境界。有鱼从她面前游过她会打招呼:"你好呀,你今天去哪里呀?"鱼当然不理她。她也不介意,跟鱼说完话就自己点点头说"那你慢走哦"。
天真衍生二: |
  她第一次到碧波城(东海的海上仙坊)时,看什么都新鲜。看到有人在买卖灵石,她问:"那个亮亮的石头能吃吗?"摊主差点被气笑。她尝了一口灵石(真的咬了一口),说:"硬硬的,不好吃。"然后把啃出牙印的灵石还给了目瞪口呆的摊主。

向往衍生一: |
  她在海底的一千二百年里,唯一能看到的"陆地"就是偶尔沉下来的东西——船板、布匹、果核、落叶。她最喜欢落叶。她不知道那叫"叶子",她叫它"会飘的绿色薄片"。她收集了很多落叶,小心翼翼地用水灵力保存着,即使它们早就泡烂了,在她眼里依然珍贵。
向往衍生二: |
  她想去陆地的理由很简单:"上面有光。"海底虽然不是完全黑暗,但跟阳光比起来差太多了。她第一次浮到海面上看到太阳的时候,哭了。不是因为太阳刺眼——虽然确实很刺眼——而是因为太美了。她从来不知道世界上有这么亮的东西。那一天她在海面上漂了一整天,晒得皮肤发红(珊瑚妖的皮肤很敏感),但她舍不得下去。

怯懦衍生一: |
  她非常非常胆小。筑基前期的修为在海里几乎是食物链最底层,任何稍微大一点的鱼都能吃掉她。她的第一反应永远是变成珊瑚躲起来。有一次一条路过的小鲨鱼多看了她一眼,她"啪"一下变成一丛珊瑚蹲在海底,等了三天确认鲨鱼游远了才变回来。
怯懦衍生二: |
  她想去陆地但不敢去。她在海面上看了好多次陆地的轮廓,每次都鼓足勇气往前游几步,然后又缩回来。"万一陆地上的人不友好呢?万一没有水我就干死了呢?万一太阳太大我就晒化了呢?"她给自己找了一百个不去的理由,然后在海底叹气,再给自己找一百零一个去的理由。

倔强的小火苗衍生一: |
  虽然胆小,但她从来没有放弃过去陆地的念头。化形之后的几十年里,她一直在默默准备:练习在没有水的环境下保持人形(最长坚持了两个时辰)、练习走路(她的脚趾头在海底磨出了茧)、练习说话(虽然说得磕磕巴巴的)、存了一小罐海水随身带着以防干渴。
倔强的小火苗衍生二: |
  有一次她遇到一个路过的海族修士,对方随口嘲讽说珊瑚化形有什么用,连走路都走不好。她当场没说话,回去以后绕着珊瑚礁走了一整天,边走边哭边嘟囔:"走不好怎么了!我就是要走!走到陆地上去!让你看看珊瑚能走多远!"

对角色的理解与思考:
  关于微小的梦想: |
    珊瑚的梦想在修仙世界里小到可笑——她不想长生,不想变强,不想称霸,她只是想去陆地上看看阳光。但对一株在海底扎根了一千二百年的珊瑚来说,这个"小梦想"意味着离开自己生长了千年的地方、放弃自己最适应的环境、独自面对一个完全陌生的世界。这比任何宗门秘境都要可怕,也比任何真仙飞升都要勇敢。
  总结: |
    这就是珊瑚的调色盘。天真是咬灵石问"能吃吗"和跟鱼打招呼说"你慢走"的懵懂,向往是收集泡烂的落叶、第一次看到太阳哭了的执念,怯懦是被小鲨鱼多看一眼就变珊瑚躲三天的胆小,倔强的小火苗是绕着珊瑚礁边走边哭边说"我就是要走到陆地上"的不甘心。这些颜色混在一起,是一个粉色短发赤脚穿海藻裙的小小少女,站在海面下几寸的地方,踮着脚尖,仰着头,看着水面上方那个亮得让她想哭的世界。
