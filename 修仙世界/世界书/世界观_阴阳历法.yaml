阴阳历法:
  起源: 阴阳初分之刹那，天地始有光暗交替、寒暑轮转，万物由此知晓"时序"。后世修士以此刻为纪元零点，创立阴阳历法，通行大陆万域。

  时间单位:
    转:
      换算: 一转为一百万年
      意义: 阴阳大陆最高时间单位，唯有记述开天辟地、天尊行迹等太古秘辛时方才动用
    纪:
      换算: 一纪为十万年，十纪为一转
      意义: 种族兴衰、大域变迁、仙魔大战等万古级事件之度量
    元:
      换算: 一元为一千年，百元为一纪
      意义: 宗门兴废、大能寿元、王朝更迭之尺度，修真界最常用的中尺度纪年
    年:
      换算: 一年为十二月
      意义: 凡俗与修士日常所用之基本纪年
    月:
      换算: 一月为三十日
      意义: 闭关修炼、任务期限、丹药火候之常用周期
    日:
      说明: 最小计时单位，以日出为始，日落为分，一日分十二时辰

  完整换算: 一转 = 十纪 = 一千元 = 一百万年 = 一千二百万月 = 三亿六千万日

  纪年格式:
    正式: 阴阳历 X转X纪X元·X年X月X日
    简写: X转X纪X元·X年X月X日
    日常: 仅用"X元X年"即可，如"太初四百八十二元八百一十六年"

  纪年起点: 阴阳初分——0转0纪0元·0年0月0日0时

  示例:
    太初开辟: 0转0纪0元·0年0月0日
    黄金大世鼎盛: 0转3纪200元·0年0月0日（距离太初开辟约三十二万年）
    极阳天尊消失: 1转2纪0元·0年0月0日（距离太初开辟约一百二十万年）
    当前故事开始时间: 3转7纪482元·816年9月15日

  各域历法差异:
    中央神州: 严格使用阴阳历法，以转纪元年月日完整记录
    东荒妖域: 妖族以"兽历"纪年，一兽年约等同阴阳历三年，但正式场合仍通行阴阳历
    北原魔土: 魔族以"劫"纪年，一劫约等同一元（千年），常言"历几劫几载"
    南疆巫地: 巫族以世代口传纪年，不书文字，以"几世几春"为度
    西漠佛国: 佛门以"一念"喻时间无常，正式场合沿用阴阳历

  时间感知差异:
    凡人: 以年月日度日，百年即是一生
    筑基至金丹: 已习惯以"甲子"（六十年）为一个修炼周期
    元婴至化神: 以元（千年）为尺度思考，闭关动辄百年
    合体以上: 以纪（十万年）为尺度，对凡间岁月已近乎漠然
    真仙境: 以转（百万年）度量己身存在，时间于其不过指间流沙
