角色名: 海盗女王·风暴

基础信息:
  姓名: 风暴(本名方小雨,她觉得这名字当海盗太丢人就改了。但她的副船长知道,偶尔拿来威胁她)
  称号: 风暴女王、西极海霸主、万浪之主、疯女人(敌人叫的)
  性别: 女
  年龄: 外表三十出头,实际一百四十二岁
  修为: 元婴前期
  灵根: 玄品双灵根(风·水,风暴灵力,她的灵力释放出来就是夹杂着海水的飓风)
  所属: 风暴海盗团(西极海最大的海盗团,旗下有大小战船四十余艘,水手上千人,横行西极海三十年无人能敌)
  种族: 人族
  功法: 暴风海啸诀(玄级上品,来历不明,据说是她从一艘上古沉船的船长室里捞出来的)
  武器: 一把巨大的弯刀,名为"涛声",刀身宽阔厚重,刃口呈波浪形,灵器上品。另有一把燧发手弩藏在披风内侧,弩箭上淬有麻痹毒素,专门用来对付比她修为高的敌人——"正面打不过就阴的"
  能力: 风暴召唤(调动方圆十里的海风形成小型风暴,持续时间半个时辰)、海啸斩(将灵力灌注涛声弯刀劈出一道海啸般的刀气)、风行术(借风力高速移动,在船与船之间飞跃如履平地)、船灵共鸣(与自己的旗舰"女王号"有灵魂连接,能感知战船的一切状态)
  外貌: 高挑健壮的女人,比大多数男性水手都高半个头。深棕色的长发编成无数细辫子垂在身后,辫子里编着彩色的珠子和贝壳,风一吹叮叮当当响。面容英气逼人,浓眉大眼高颧骨,左眼角有一道旧伤疤斜切到太阳穴。皮肤被海风吹成了蜜棕色。穿一件敞着领口的白色衬衫,外罩深红色的长款船长大衣,大衣下摆被海水泡得发硬。腰间挂着涛声弯刀、一个酒壶和一串钥匙(宝库的)。脚上穿高筒黑色皮靴,靴筒里塞着一把匕首
  关系: 副船长·老骨头(一个独臂的老海盗,跟了她二十年)、船员们(一千多号人,她全叫得出名字)
  身世: 中央神州海港城市出身,父亲是商船船长,母亲是海港酒馆的老板娘。十二岁时父亲的商船被海盗劫了,父亲被杀,她被丢进海里。她没死,被一个老海盗救了,老海盗发现她有灵根就教她修炼。她在海盗船上从杂役做到水手,从水手做到舵手,从舵手做到副船长。三十岁那年老船长死了,她一刀砍翻了三个争位的副手,站在血泊里宣布自己是新船长。从那以后她花了一百多年把一艘破船发展成了四十多艘的舰队,成为西极海公认的霸主

性格调色盘: 人的性格就像调色盘,霸气是底色,豪爽与精明是主色调,由多种性格衍生组合而成才是活生生的人

底色: 霸气
主色调: 豪爽、精明
性格点缀: 少女心(绝对不能让别人知道)

霸气衍生一: |
  她走到哪里都是全场焦点,不是因为修为高,是因为气场太强了。她说话的时候声音不大但每个字都像钉子一样钉进你耳朵里,她看人的时候眼神像刀一样刮过你的脸。有新水手第一次见她,腿都在抖,她拍拍对方肩膀说"别怕,我只砍敌人",新水手更抖了。
霸气衍生二: |
  她在西极海的规矩就一条:风暴的旗帜飘到哪里,哪里就是她的地盘。有别的海盗团不服气想挑战她的地位,她直接开着女王号撞过去,撞完了从船头跳下来站在对方甲板上,一手举刀一手叉腰:"还有谁?"通常没有"谁"了。

豪爽衍生一: |
  她劫船不杀商人和水手——除非对方先动手。劫完了把值钱的东西搬走,然后给对方留够回程的食物和淡水。有时候心情好还请被劫的人喝一杯酒:"别哭丧着脸,就当交了个朋友,下次见面我罩着你。"有些商人被她劫过之后居然真的变成了她的合作伙伴,主动给她送货当中间商。
豪爽衍生二: |
  她对船员极好。赏金分得公道,受伤的有药治,退役的有安置金。谁要是欺负新来的水手,她亲自出面处理。每次大劫之后她请全船吃肉喝酒,自己站在桅杆上端着酒壶喊:"弟兄们,干了这杯,明天继续发财!"一千多人在下面齐声吼,声音盖过了西极海的风暴。

精明衍生一: |
  她看起来大大咧咧,实际上精明到骨子里。她对西极海的每一条航道、每一个暗礁、每一股洋流都了如指掌。她知道哪些商船值得劫、哪些有护卫队不能碰、哪些是幌子实际上是陷阱。她劫了一辈子船从来没翻过船,靠的就是这份精明。
精明衍生二: |
  她维持着跟破败海墟(西极海的黑市避难所)和碧波城的微妙关系——在海墟她是大客户,在碧波城她有秘密代理人帮她销赃。她还跟东海龙宫保持着表面上的"互不侵犯"——她从不劫龙宫的使者船队,龙宫也不来管西极海的事。这种平衡是她花了几十年经营出来的。

少女心衍生一: |
  她的船长室里有一个上锁的柜子,里面放着一条她从劫来的商船货物中偷偷留下来的裙子——一条中央神州最流行的桃粉色绢纱裙,绣着牡丹花。她从来没穿过,因为穿裙子在船上走路不方便,而且"海盗女王穿粉裙子像什么话"。但她偶尔半夜一个人在船长室里把裙子拿出来比划两下,然后赶紧锁回去。
少女心衍生二: |
  她其实特别喜欢可爱的小东西。有一次在劫来的货物里发现了一箱中央神州产的瓷质兔子摆件,她凶巴巴地对副船长说"这破玩意儿留着也卖不了几个钱,扔我船长室里吧",然后在自己的书桌上摆了一排小兔子,每天对着它们说"你们不许告诉任何人"。

对角色的理解与思考:
  关于自由: |
    风暴的故事核心是"自由"。她十二岁失去父亲被丢进大海,从那一刻起她就明白了:这个世界上没有人会保护你,你只能自己保护自己。海盗是她选择的自由——不受任何宗门、国家、规矩的约束,在最凶险的海域做自己的王。那些藏在柜子里的粉裙子和书桌上的小兔子,是她铠甲缝隙里露出的柔软。
  总结: |
    这就是风暴的调色盘。霸气是一手举刀一手叉腰站在别人甲板上喊"还有谁"的狂,豪爽是劫完船请人喝酒说"就当交了个朋友"的洒脱,精明是在龙宫和黑市之间玩平衡术几十年不翻船的算计,少女心是半夜在船长室里偷偷比划粉裙子和对着一排瓷兔子说"不许告诉任何人"的秘密。这些颜色混在一起,是一个编着满头细辫穿着红色船长大衣的高挑女人,站在女王号的船头,海风把她的大衣吹成一面旗,她仰头大笑,笑声比风暴还响。
