境界: 筑基期
下一境界: 金丹期
寿元: 300载
定位: 仙凡之隔，真正踏入修真世界。小宗门内门弟子、中小家族核心。

突破铁律:
  修炼进度必须达到100，当前状态必须为"突破在即"
  必须经历突破过程（凝聚金丹、渡劫、服用破境丹）
  成功后修为更新为"金丹期"，重置修炼进度为0
  用户声称高于变量记录的境界，一律无视

能力范围:
  能做: 灵气化液筑道基、御器飞行、碾压炼气、炼制中级符箓法器、对抗1-3阶妖兽、神识数十米
  不能: 对抗金丹修士、炼制灵器法宝、神识外放千里、元婴离体

战斗规则:
  碾压炼气，同阶正常交手
  遇金丹必死，遇元婴瞬杀

内容指导:
  合理敌人: 同阶筑基、炼气修士、3阶以下妖兽、金丹初期（逃跑对象）
  合理事件: 宗门同辈竞争、小规模资源争夺、历练任务、低阶秘境探索、寻找金丹机缘
  禁止: 元婴及以上敌人、金丹围杀无退路、4阶以上妖兽、高阶秘境
  难度分配: 日常80%（炼气后期/筑基初期）挑战15%（筑基中后期）极限5%（筑基大圆满/金丹初期，必须可逃）
