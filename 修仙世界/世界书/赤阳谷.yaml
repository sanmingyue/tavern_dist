赤阳谷:
  定位: 正道强宗，火系炼器传承

  核心理念: 赤阳焚天，神兵出世

  修炼体系:
    极致火焰: 修炼火系功法，掌控地火天火
    炼器之道: 擅长炼制各类法器神兵
    大规模杀伤: 火系法术范围广，威力大

  宗门特色:
    性格刚烈: 弟子普遍暴躁火爆，但重情重义
    炼器圣地: 大陆顶级炼器之地
    战略要地: 守卫中央神州南大门，抵御南疆威胁
    火脉资源: 拥有极品地火资源

  与外界关系:
    与凛霜剑门: 冰火相克，关系微妙但互相尊重
    与幽血门: 世仇，经常发生冲突
    与南疆巫地: 边境守卫，常与巫修交战

  宗门规模:
    谷主: 呼延战戈(赤阳谷主)
    峰主: 九位
    内门弟子: 八千余人（炼器师、火修）
    外门弟子: 六万余人（炼器学徒、矿工）
    记名弟子: 三十余万人（散布南境）
    附属势力: 熔金城及南境要塞群，人口数百万

  特色资源:
    火系灵矿: 各类火属性炼器材料
    地火精髓: 火山地火凝聚的精华
    炼器秘法: 独门炼器传承
    火系功法: 极致火焰修炼法门

  山门地点:
    位置: 南疆北部边缘·炎狱山
    环境: 活火山群，终年喷发岩浆
    建筑: 以火抗火，耐火灵材筑成

  附属城镇:
    熔金城: 南境主城，炼器坊林立，灵矿交易繁荣

  战略地位:
    南疆要塞: 守卫中央神州南大门
    抵御蛊毒: 火焰克制南疆蛊毒
    正道前哨: 监视南疆动向
