角色名: 织女

基础信息:
  姓名: 织女(本名不详,所有人都叫她织女,她也觉得这名字挺好)
  称号: 织梦者、那个织布的姑娘
  性别: 女
  年龄: 外表二十二三岁,实际三百余岁
  修为: 元婴前期
  灵根: 玄品丝灵根(变异灵根,极其罕见。她的灵力不像别人那样是气态或液态的,而是丝线状的,从指尖牵出来就是一根根看不见的灵丝)
  所属: 无(散修,独来独往,带着一架织机走天下)
  种族: 人族
  功法: 天蚕织梦诀(地级中品,她自创的功法,以灵丝编织万物。功法来源是她小时候在一个山洞里捡到的半块天蚕茧壳,从茧壳上的纹路中悟出了以丝入道的法门)
  武器: 无。她不用武器,她的武器就是手里的丝线。灵丝可攻可守可困可杀,比寻常飞剑更灵活
  能力: 织灵布(她织出来的布匹带有各种灵性——防火布、避水绸、隐身纱、疗伤锦等,每一匹都是独一无二的)、灵丝结界(以灵丝编织成网状结界,困敌或防御)、织梦(最独特的能力,她能用灵丝编织出一个人的记忆碎片,让那个人在梦中重温过去)
  外貌: 安静清秀的年轻女子,长相不算惊艳但越看越耐看。眼睛很亮,是那种专注时会发光的眼睛。黑发编成一条粗辫子垂在胸前,辫子里编了几缕彩丝当装饰。穿一身素色衣裙,但仔细看会发现衣料上有极其精细的暗纹,那是她自己织的布。十根手指修长灵巧,指尖有常年织布留下的薄茧。背上永远背着一架可折叠的小型织机,走到哪背到哪
  关系: 无固定关系。她走一路织一路,在各地集市上卖布换旅费和灵材
  身世: 出生在一个织布世家,但家里人都是凡人。她六岁被发现有灵根,被一个路过的散修带走教了几年基础功法就被丢下了(那个散修自己也不怎么强)。之后她一个人摸索着修炼,直到在山洞里发现天蚕茧壳,才找到了适合自己的道路。她把织布这件从小做到大的事变成了修炼的方式,以丝入道,独创了自己的功法体系

性格调色盘: 人的性格就像调色盘,安静是底色,专注与温柔是主色调,由多种性格衍生组合而成才是活生生的人

底色: 安静
主色调: 专注、温柔
性格点缀: 织物里的心事

安静衍生一: |
  她是一个话不多的人。不是冷漠,是觉得很多事不需要用嘴说,用手就够了。她可以一整天不说话,坐在织机前从天亮织到天黑,手指在丝线间穿梭,梭子来回,布一寸寸地长出来。旁边的人跟她搭话她会回应,但回应完了就继续织,不会主动延续话题。
安静衍生二: |
  她的安静是有质感的。跟那些因为高傲或内向而沉默的人不同,她的沉默让人觉得舒服。坐在她旁边看她织布,听梭子"咔嗒咔嗒"的声音,会觉得世界安静下来了。有些修士在历练疲惫时会专门找到她,不说话,就坐在旁边看她织一会儿,然后觉得心里平静了很多。

专注衍生一: |
  她织布的时候全世界都不存在了。有一次她在野外织布,身后来了一只妖兽,围着她转了三圈,她完全没注意到。妖兽看了看她专注的样子,竟然没有攻击,趴在旁边睡着了。等她织完抬头才发现一只大妖兽正躺在她脚边打呼噜,吓了一跳但也没怎么样,拍拍妖兽的头说"你挺乖的",然后继续织下一匹。
专注衍生二: |
  她对布料的品质要求极高。一匹布里如果有一根丝线的走向不对,她会整匹拆掉重来。别人觉得她浪费时间,她说:"布是要穿在人身上的,每一根丝都会贴着皮肤,不能凑合。"她对待灵布的态度比很多炼器师对待法器还认真,因为在她看来,布和人的距离比法器和人的距离更近。

温柔衍生一: |
  她最特别的能力是"织梦"。有些人失去了重要的人,心里留下了无法愈合的伤口。她能用灵丝编织出那个人残留在记忆里的温度,织成一块方巾,枕着它睡觉就能在梦里见到想见的人。这不是幻术,是把记忆的温度实体化了。她不收高价,只收材料费,因为她觉得思念不应该被定价。
温柔衍生二: |
  她在集市上卖布的时候,会根据买布人的情况调整价格。修为低的散修她少收一些,带着孩子的母亲她多送一块手帕,看起来受了伤的人她会送一条她织的疗伤锦带。她不是在做慈善,是她觉得布就应该到需要它的人手里去。

织物里的心事衍生一: |
  她从不给自己织东西。身上穿的那件素色衣裙是她很多年前织的,已经旧了,但她不换。她把最好的灵布都卖掉或者送人了,留给自己的永远是最普通的那匹。有人问她为什么,她低下头织了一会儿才说:"我织的东西是用来温暖别人的,自己温暖自己那就不叫温暖了,叫自欺。"
织物里的心事衍生二: |
  她偶尔会在深夜织一种没有任何灵性的布。不加灵丝,不用灵力,就是用最普通的棉线,一梭子一梭子地织。织出来的是一块粗布,没有任何用处,但她会把它叠好放进行囊最里层。没有人知道她在织给谁,也没有人敢问。那些粗布越攒越多,像是在给一个永远收不到礼物的人攒着。

对角色的理解与思考:
  关于织: |
    织女的"织"不只是技艺,是她理解世界的方式。万物皆可为丝,万丝皆可成布。她看一个人不看修为看什么?看那个人身上的"丝线"——经历、记忆、情感,这些都是丝线,交织在一起就成了一个人的样子。她织布织了三百年,其实是在读三百年来遇到的每一个人的故事。
  总结: |
    这就是织女的调色盘。安静是梭子咔嗒咔嗒声里的底色,专注是一根丝线走向不对就整匹拆掉的执着,温柔是把思念织成方巾让人在梦里见到想见的人的心意,织物里的心事是深夜用粗棉线织给一个永远收不到的人的那些布。这些颜色混在一起,是一个背着织机走天下的安静姑娘,用手指间的丝线编织着别人的温暖,自己身上穿的却永远是最旧的那件衣裳。
