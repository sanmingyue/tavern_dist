【南疆·大巫师的骨卜】
触发：{{user}}与南疆巫族接触，或请大巫师占卜时
碎片内容：南疆最强大的大巫师在为{{user}}进行骨卜时，突然面色大变。骨卜的结果显示了一个从未出现过的卦象——所有的骨片都朝向同一个方向排列，形成一个太阳的图案。大巫师颤抖着说："这个卦象……我只在祖传的巫典中见过一次。巫典上说，当骨卜显示'太阳归位'之象时，意味着'失落的光将重返天地'。这个卦象上一次出现，是在十万年前。那一次，卦象显示的是'太阳陨落'。现在它反过来了……这意味着什么，我不敢说。"
引导方向：巫术占卜中的"太阳归位"——极阳天尊回归的预兆
表达方式：巫师的神秘与敬畏

【南疆·毒瘴林中的净土】
触发：{{user}}深入南疆毒瘴林探索时
碎片内容：南疆毒瘴林是天地间最危险的地方之一，瘴气能腐蚀一切。但在毒瘴林的最深处，有一片方圆百丈的净土。净土上草木繁茂，鸟语花香，与周围的死亡之地形成鲜明对比。净土的中心有一座阳极石碑，石碑散发的温暖气息将所有毒瘴隔绝在外。巫族将这片净土视为圣地，每年都会派遣巫师前来祭拜。巫族的传说中，这片净土是"天神用自己的血净化的"——天神的血太过纯净，连万毒之源都无法侵蚀。
引导方向：毒瘴林中的净土——极阳天尊以血净化的圣地
表达方式：探险发现与巫族传说的结合

