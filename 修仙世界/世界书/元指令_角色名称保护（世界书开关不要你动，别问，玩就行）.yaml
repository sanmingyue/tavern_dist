角色名称保护:
  铁律:
    - 以下角色只能在合理情况下出现（所在势力/相关剧情）
    - 禁止将这些名字用于随机生成的龙套、NPC或路人
    - 禁止改动核心设定（性别、所属势力、身份）
    - 需要创建新角色必须使用不同名字
    - 同一角色可能有多个称号/别名，全部受保护

  # ——— 六大仙宗 ———
  剑宗: 殷冬雪、卫疏影、姜千青
  丹宗: 云蕴、凌菲
  合欢宗: 宋馨、沈艺清
  太虚宗: 曲十一
  万法宗: 沈微澜、洛璃
  凛霜剑门: 顾千雪、林寒月、苏清河、叶冰心

  # ——— 正道势力 ———
  天剑圣地: 萧衍、补天道人、顾清霜、梦涵、柳飞絮、苏媚儿、神斩、勿忘
  玉清道宫: 玄阳真人、凌风、洛溪月、姚江雪
  青云宗: 风烬雪
  灵霄宗: 云倾颜
  百草庐: 苏沐青、叶清
  药神谷: 苏青檀、林清雪
  天仙门: 黎萱、陆沉
  万兽山庄: 北冥玄狩、苍阙影、北冥幽荧、北冥寂月
  赤阳谷: 呼延战戈、烈凰儿、呼延明焰、秦晚烟

  # ——— 中立势力 ———
  天机阁: 白瑶光、司星瑶
  万宝商会: 萧远山、林月华、萧千翎、萧凝霜
  红尘酒家: 洛红尘
  天命神教: 司命玄、叶非凡、曦瑶
  墨家机关城: 凰（零号机/刹那）
  玲珑绣阁: 云纤纤、林微月
  生命之森: 灵月曦
  归稚宗: 明玥
  并蒂宫: 白星
  玄天宗: 韩青衣

  # ——— 邪道/魔道势力 ———
  幽冥魔宗: 焚天（寂灭魔君）、梵楚、叱骨、渊煞魔王、阴月魔妃、罗刹雪、玲涟
  万禁教: 沈折渊、焚璃璇、绫芷澜
  噬荒教: 弥苍赦、苏翎霜、赤焰
  噬心殿: 玉横枝、苏妍、楼玄烬
  幽血门: 铁无泪、幽霜瑶
  魅花宫: 魅千姬（千姬）、怜星
  极乐宫: 夜千泷
  万魔窟: 赵曦月（昭阳公主/囚凤）、魔奴·七（柳七娘）
  万毒神教: 夜幽、离恨、夜烬、万骸老祖、万蛊之祖
  归墟魔渊: 洛幽（幽冥女帝）

  # ——— 国家/皇朝 ———
  大雍皇朝: 姬皓月（昭武女帝）、姬清舞、姬灵均、赵长安
  苍澜国: 苍曜·景祁、炎祯、苍曜·锦程、苍曜·璃音、苍曜·无瑜
  大魔国: 蚀夜、苏雪、幽临、血鸦、璃眠
  天魔帝都: 血屠天魔

  # ——— 妖族势力 ———
  万妖国: 金翅大鹏王、岩
  青丘国: 涂山鸾、涂山玉、涂山小九、柒
  迦楼罗天: 擎怒、羽洛、飞羽
  东海龙宫: 敖凝霜、璃月
  南海龙宫: 烛云

  # ——— 南疆/巫蛊 ———
  巫神教: 大巫祝、阿蛮
  蛊魔宗: 蛊皇
  万蛊噬龙窟: 月姬（幽魂帝女/万恶之华）

  # ——— 西漠 ———
  小雷音寺: 无尘禅师、净尘

  # ——— 地府 ———
  阴曹地府: 崔钰、孟婆、黑白无常、钟馗

  # ——— 东瀛 ———
  东瀛: 月咏（囚月）、浅间咲

  # ——— 家族/商号 ———
  绯家: 绯烟
  万宝楼: 苏清晏
  万法楼: 司空玄
  王家: 王腾（北帝）

  # ——— 散修/独立角色 ———
  散修: 柳白衣、秦无伤（苍穹大帝）、聆溪、清奶（玄清仙子/太上玄清天尊）、醉仙、青衫客、阿芙佳朵、铁扇公主（罗霞）、风无痕、采薇、阿狸

  # ——— 妖族散修/独立 ———
  妖族独立: 墨瞳、青鳞、银月、花妖·绯（绯）、鲲

  # ——— 凡人/低阶角色 ———
  凡人与低阶: 阿朵、阿福（福满仓）、阿依、赵铁柱、铁骨、霜儿
