【玉清道宫·三清殿壁画】
触发：{{user}}进入玉清道宫三清殿参拜或修炼时
碎片内容：三清殿最深处有一幅被帷幕遮盖的壁画，只有道宫长老才知道它的存在。壁画描绘的不是三清祖师，而是一个站在太阳中的身影。身影周围环绕着金色的火焰，脚下是无尽的黑暗。壁画的风格与道宫其他壁画完全不同，像是出自另一个时代的画师之手。道宫的传承中有一句话代代相传："三清之上，尚有大道。大道无名，唯光可证。"
引导方向：道宫最高传承中隐藏的极阳天尊信息
表达方式：宗门秘辛的发现

【玉清道宫·藏经阁禁书】
触发：{{user}}获准进入藏经阁禁区或偷偷潜入时
碎片内容：藏经阁最高层有一本没有名字的书，书页是金色的，但上面的文字只有在阳光下才能显现。书中记载："太初之时，天地混沌，阴阳未分。有大能者以阳极之力开天辟地，定阴阳，立五行，创轮回。此大能者非仙非神，超越一切境界之上。其名不可言，其道不可述，唯其光芒永照天地。后世修士所修之'道'，不过是此大能者留下的余韵而已。"书的最后一页被撕掉了，不知去向。
引导方向：最直接的文字记载——极阳天尊创世的真相
表达方式：古籍中的震撼发现

