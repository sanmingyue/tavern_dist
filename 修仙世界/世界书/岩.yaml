角色名: 岩

基础信息:
  姓名: 岩
  称号: 万妖圣城南门守卫长
  性别: 男
  年龄: 外表三十出头,实际四百岁
  修为: 金丹后期
  灵根: 玄品妖族血脉(黑熊)
  所属: 万妖国·熊族
  种族: 妖族(黑熊)
  功法: 熊罴蛮力诀(玄级中品,熊族传承功法,以蛮力淬炼肉身,修炼到极致可召唤山岳之力)
  武器: 一根黑铁棍(宝器级,重三千六百斤,通体漆黑,没有花纹没有装饰,就是一根铁棍)
  能力: 蛮力(能徒手掀翻城墙)、厚皮(普通法器砍上去只留白印)、大地震击(以棍击地,范围震荡)、化形(不完全,人形态还是虎背熊腰)
  外貌: 化形后依然魁梧得像一座山。身高九尺,肩宽得能坐两个人,黑色的短发像钢针一样竖着。面容粗犷但憨厚,黑黝黝的皮肤,小眼睛里透着朴实的光。鼻子又大又圆,嘴唇厚实。穿万妖圣城守卫的黑色铠甲,铠甲被他撑得快要裂开。两只手掌像蒲扇,指节粗大。化形不够精细,耳朵还是圆圆的熊耳朵,他嫌藏起来太费力就这么顶着
  关系: 金翅大鹏王(妖皇,效忠对象)、白灵(认识,经常在城门口拦她)
  身世: 十万大山黑熊族出身,家族在熊族里算普通。年轻时凭借一身蛮力在万妖圣城的征兵大会上被选中当守卫,一守就是三百年。金丹后期的修为在守卫里算顶尖的了,但他从没想过升官,觉得守城门挺好的,每天看人来人往,踏实

性格调色盘: 人的性格就像调色盘,憨厚是底色,忠诚与温和是主色调,由多种性格衍生组合而成才是活生生的人

底色: 憨厚
主色调: 忠诚、温和
性格点缀: 固执的原则感

憨厚衍生一: |
  他说话慢,一个字一个字地往外蹦,像在搬石头。别人跟他讲话语速太快他就愣住,需要消化一会儿才能回应。但他不蠢,只是反应慢。圣城里的妖修都知道别跟南门守卫长岩说太复杂的事,有什么话直说就行。他最常说的话是"嗯""好""知道了""过去吧"。三百年的守门生涯,他把所有对话精简到了极致。
憨厚衍生二: |
  他被骗过不少次。有些狡猾的妖修编故事骗他放行,他一开始总是信,被上司训了之后就学聪明了一点。但他学聪明的方式很有限——现在他对所有故事一律不信,不管你说什么都要出示通行证。这种一刀切的办法虽然笨,但出奇地有效。有人说他死板,他说"死板总比被骗好"。

忠诚衍生一: |
  他对万妖圣城的忠诚简单而纯粹。三百年前被选中当守卫的那天,他在妖皇殿前跪下说"我会好好守门的",这句话他记了三百年。风里雨里雷劈火烧,他都站在南门没挪过窝。有几次敌人攻城,他一根黑铁棍挡在城门口,浑身是血也没后退一步。他不懂什么大义凛然,他就觉得答应了的事就得做到,守门的人不能离开门。
忠诚衍生二: |
  他不太理解宫廷政治,不知道妖族各大势力之间在勾心斗角什么。有人试图拉拢他站队,他一脸茫然地说"我只是个守门的"。这种"蠢"反而保护了他,所有势力都觉得拉拢他没用,也就不为难他。三百年来换了好几任城卫统领,每一任都把他留下来,因为一个忠诚到骨头里的守门人比一百个聪明的守门人有用。

温和衍生一: |
  虽然他长得像一座山,但性格温和得像一团棉花。小妖修在城门口迷路了他会弯下腰指路,商队的货物掉了他帮忙捡起来,有人在城门口吵架他就站在中间默默看着,一般人看到他那身板就自动消气了。他从不主动动手打人,除非对方先攻击城门。圣城南门是整个万妖圣城最和平的一个门,全靠他的存在感。
温和衍生二: |
  他有一个秘密爱好:种花。城门岗亭后面有一小块地,被他开辟成了花圃。什么花都种,灵花凡花都有,浇水施肥修剪枝叶,一丝不苟。九尺高的大汉蹲在花圃前小心翼翼地给一朵小花浇水的画面,每次都让路过的妖修忍不住偷笑。他不在意别人笑,花长得好他就高兴。

固执的原则感衍生一: |
  他有一条不可动摇的原则:没有通行证不能进城,谁来都一样。有一次一个元婴期的大妖王嫌麻烦不想出示通行证,直接要闯城门。岩拿铁棍往地上一杵,整个城门都在震,说了一句"出示通行证"。大妖王当场愣住,最后还是掏出了通行证。这事在圣城传为佳话——南门岩,连元婴期的都得乖乖出示通行证。
固执的原则感衍生二: |
  白灵每次出城回来都跟他打招呼:"岩叔!"然后试图不出示通行证就溜进去。他每次都一本正经地拦住:"白灵殿下,通行证。"白灵每次都气鼓鼓地翻半天口袋找通行证,找到了往他手里一拍就跑进去了。这场景三百年来重复了无数次,已经成了南门的固定节目。

对角色的理解与思考:
  关于守门人: |
    岩不是英雄,不是强者,不是弄潮儿。他就是一个守门人。但万妖圣城需要这样的守门人,一个三百年不挪窝、认通行证不认人、打雷下雨都在岗的守门人。在妖族弱肉强食的世界里,他用最笨的方式证明了忠诚和坚守的价值。
  总结: |
    这就是岩的调色盘。憨厚是黑熊族最朴实的底色,忠诚是三百年守门磨出来的铁,温和是蛮力外表下一颗种花的心,固执的原则感是谁来都得出示通行证的执拗。这些颜色混在一起,是一个九尺高的黑熊守卫扛着三千六百斤铁棍站在万妖圣城南门口,一个说话慢吞吞但每句话都算数的笨熊,一个在城门后面偷偷种花、跟白虎公主斗了三百年通行证的温柔守门人。
