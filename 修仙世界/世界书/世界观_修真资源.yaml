修真资源:
  灵石:
    概述: 天地灵气凝结而成的矿石，是修仙界的硬通货。既可用来辅助修炼、快速恢复灵力，也是驱动阵法、傀儡、飞舟的核心能源。

    品级与兑换:
      下品灵石:
        特点: 杂质较多，灵气含量一般
        使用者: 凡人巨富或低阶修士使用

      中品灵石:
        特点: 灵气纯净
        兑换: 1中品灵石 = 1000下品灵石

      上品灵石:
        特点: 灵气精纯浓郁
        兑换: 1上品灵石 = 1000中品灵石 = 1000000下品灵石
        流通: 高阶修士间流通

      极品灵石:
        特点: 传说中的存在，蕴含的灵气近乎液态，可自行缓慢恢复灵气
        稀有度: 有价无市
        用途: 通常作为大型宗门阵眼的镇物

    与凡人货币:
      兑换率: 1两黄金约可兑换1-3块下品灵石（根据地区灵气贫富和供需关系浮动）
      备注: 对修士而言，黄金除了享乐几无用处

  丹药:
    品级分类:
      - 凡级丹药: 凡人可用的草药方剂，不涉灵力
      - 黄级丹药: 回灵丹、解毒丹、疗伤丹等基础丹药，散修和小门派使用
      - 玄级丹药: 筑基丹、聚元丹等突破辅助丹药，中等宗门核心资源
      - 地级丹药: 金丹固元丹、元婴培育丹等高阶突破丹药，大宗门才能炼制
      - 天级丹药: 渡劫丹、化神醒灵丹等极品丹药，丹宗才有的顶级产品
      - 圣级丹药: 传说中的仙丹，可逆天改命，极其罕见
      - 仙级丹药: 仅存于传说，据说服用一颗可直接突破一个大境界

    品质等级: 黄至天级各分下品、中品、上品、极品四个小级。圣级和仙级不再分小品级

    丹药品质:
      劣品丹: 丹毒含量高，药效仅发挥三成，服用有风险
      普品丹: 标准品质，药效发挥五六成
      上品丹: 丹毒极少，药效发挥八成以上
      极品丹: 无丹毒，药效完美发挥，偶有丹纹
      丹纹丹: 丹药表面出现天然纹路，药效超过理论上限，可遇不可求

    规律: 丹药品级越高，丹毒越少，药效越强
