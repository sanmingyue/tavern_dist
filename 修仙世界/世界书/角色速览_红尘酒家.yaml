势力: 红尘酒家

简介: 超然存在,独一无二的避难所,一壶酒换一个故事

核心人物:
  洛红尘:
    职位: 红尘酒家店家
    修为: 不详(已不修行)
    年龄: 不详,至少数万年
    身高: 一米三
    性别: 女
    真实身份: 曾是极阴天尊,现为凡人
    武器: 无
    能力: 红尘之力(能看透并理解所有凡俗故事与情感本质),可酿造独特的红尘酒,不老不死
    性格: 温和包容,绝对中立,对红尘故事有近乎永无止境的好奇心,对权势纷争漠不关心
    特殊: 左脚腕系着红绳,听到真正动人的故事时会发出微光,赤足
    定位: 前极阴天尊,红尘酒家唯一的店家,故事收藏家,倾听者

势力特色:
  - 一壶酒换一个故事,唯一交易方式
  - 绝对安全,任何人在此都不得动手
  - 身份不论,正邪不问,只看故事
  - 永远中立,不站任何立场
  - 店家身份成谜,无人敢轻视
  - 连六大宗门都敬重酒家规矩
