地点: 归墟魔渊
区域: 北原魔土深处
定位: 北原魔土禁地,死亡的终焉之地

核心角色:

洛幽:
  姓名: 洛幽
  性别: 女
  年龄: 五万余岁
  修为: 真仙境六重天
  身份: 幽冥女帝,归墟魔渊唯一主宰
  定位: 寂灭的终结者,孤独的死亡女帝
  关键词: 死亡、寂灭、冷绝、孤寂
  特殊: 掌控死亡法则(兼含寂灭之力),五万年孤独

地点特点:
  - 远古战争形成的空间断层
  - 死亡法则弥漫的起源地
  - 修为越低受死亡法则侵蚀越严重的禁地
  - 洛幽是唯一的主宰
  - 充满远古战争的痕迹

危险等级:
  - 极度危险
  - 合体期以下必死
  - 渡劫期生还率极低
  - 真仙境也需谨慎

重要地点:
  - 星屑花海: 洛幽常独坐之地
  - 神陨之坑: 归墟最深处,洛幽居所
  - 远古人偶: 蕴含远古战争秘密

特殊关系:
  - 与所有势力: 互不侵犯,被视为禁地
  - 守护秘密: 远古战争的真相
