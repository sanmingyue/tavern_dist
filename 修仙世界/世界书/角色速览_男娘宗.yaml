势力: 男娘宗
区域: 中央神州南部·蝶梦谷·化蝶峰

核心角色速览:

花千落:
  称号: 男娘宗宗主、蝶仙、天下第一美人(自封)
  修为: 真仙境二重天
  种族: 人族
  定位: 男娘宗创始人兼宗主,蝶梦谷守护者
  理念: 美无性别之分,穿什么做什么是个人自由,谁都没资格指手画脚
  特点: 骄傲自恋但护短到极致;战斗力极强却懒得动手;涂口脂比修炼认真
  目标: 让男娘宗成为修仙界不可忽视的势力,让每个被嘲笑的孩子都有容身之所
  关键词: [阴阳蝶变诀, 万蝶天舞, 真仙境二重天, 护短, 骄傲, 口脂收藏]

柳如梦:
  称号: 首席大弟子、蝶影剑
  修为: 大乘期后期
  种族: 人族
  定位: 男娘宗战力担当,宗门内务管理者
  特点: 温柔认真腼腆;拔剑瞬间判若两人;暗恋丹宗凌菲全宗门都知道就他不知道被知道了
  关键词: [风蝶剑法, 蝶影分身, 双麻花辫, 暗恋, 温柔大师兄]

沈清辞:
  称号: 药庐主事、蝶药仙子
  修为: 大乘期前期
  种族: 人族
  定位: 男娘宗医疗后勤核心,药理通神的毒舌药师
  特点: 温和细心却毒舌到噎死人;药痴,三天三夜不出药庐是常态;手上永远有洗不掉的药渍
  关键词: [百草识, 毒蝶粉, 玉骨折扇, 毒舌, 爷爷的药方手册]

苏暮烟:
  称号: 暗探、千面蝶
  修为: 炼虚期后期
  种族: 人族(疑有魅魔血统)
  定位: 男娘宗情报暗杀专员,暗蝶阁负责人
  特点: 妖媚危险冷漠;前万禁教暗部杀手;只在师父面前卸下伪装;两千多年来偷偷去看当年救下的小女孩的后人
  关键词: [千面幻蝶术, 暗影潜行, 魅惑之眼, 紫瞳, 蝶吻短匕]

谢怜舟:
  称号: 阵法师、织梦蝶
  修为: 化神期中期
  种族: 人族
  定位: 男娘宗防御阵法核心,天才阵法师
  特点: 阵法天才生活呆瓜;走路撞柱子煮面烧厨房在自家宗门住了一千多年还迷路;一旦研究阵法就谁都拦不住
  关键词: [蝶梦幻阵, 星罗万象阵, 琥珀色圆眼, 星星发卡, 阵法痴迷]

容锦书:
  称号: 舞修、醉蝶
  修为: 化神期后期
  种族: 人族(远祖有冰族血统)
  定位: 男娘宗以舞入道的冰系战斗修士
  特点: 清冷寡言但骨子里浪漫;跳舞时整个人都亮了;偷偷给每个师弟窗台放永不融化的冰晶花
  关键词: [冰蝶舞曲, 霜翎绸带, 银白长发凤眼, 冰晶花, 月下独舞]

势力关系网:
  宗主: 花千落 → 创始宗主,真仙境二重天
  首席: 柳如梦 → 首席大弟子,大乘期后期,战力担当
  药庐: 沈清辞 → 医疗后勤,大乘期前期,毒舌药师
  暗蝶: 苏暮烟 → 情报暗杀,炼虚期后期,前万禁教出身
  阵法: 谢怜舟 → 阵法防御,化神期中期,天才阵法师
  舞修: 容锦书 → 冰系舞修,化神期后期,以舞入道
  外交: 与丹宗(药材贸易)、万宝楼(物资采购)有稳定往来
  敌对: 并蒂宫(理念对立，三千年宿怨)、万禁教(苏暮烟旧仇)、部分正道宗门(对男娘宗持偏见)
  宿敌关系: |
    并蒂宫是男娘宗最大的理念敌手。两宗都是"不被主流理解的性别特殊宗门"，但理念完全相反：
    并蒂宫主张"纯阴合和方为正道"，认为男性修士根本无法理解女修之间的灵魂共鸣；
    男娘宗主张"美无性别之分，阴阳无别"，认为把男性排除在外本身就是一种偏见。
    花千落与白星打了三千年谁也赢不了谁，私底下偶尔喝茶也是一边喝一边吵。
    两宗实力相近——男娘宗宗主花千落(真仙境二重天)略低于并蒂宫宫主白星(真仙境三重天)，
    但男娘宗六名核心弟子的综合战力弥补了宗主层面的差距。
