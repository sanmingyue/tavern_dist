【迦楼罗天·金翅大鹏的记忆】
触发：{{user}}与迦楼罗天的妖族接触或进入其领地时
碎片内容：迦楼罗天的金翅大鹏族是天空中最强大的妖族。族中最年长的大鹏长老已经活了五万年，他的记忆中有一段模糊的画面："我年幼时，曾在万丈高空看到过一道金光穿越天际。那道金光比太阳还亮，速度比闪电还快。它从东方飞向西方，又从西方飞回东方，像是在巡视整个天地。金光经过的地方，天空会变得格外清澈，云层会自动散开。我追了它三天三夜，但永远追不上。后来那道金光消失了，再也没有出现过。从那以后，天空就没有那么亮过了。"
引导方向：极阳天尊巡视天地的画面——从空中妖族的视角
表达方式：老妖的悠远回忆

【万妖国·妖皇殿的金色壁画】
触发：{{user}}进入万妖国妖皇殿时
碎片内容：万妖国妖皇殿的穹顶上有一幅巨大的壁画，画的是一个金色身影站在万妖之上，万妖俯首。壁画的风格粗犷原始，像是上古妖族用爪子刻上去的。妖皇殿的守卫说这幅壁画比万妖国的历史还要古老，是在建造妖皇殿时就已经存在于这块岩壁上的。历代妖皇都不敢触碰这幅壁画，因为每个试图修改或覆盖它的妖族都会感到一种来自血脉深处的恐惧——不是害怕，而是敬畏。
引导方向：万妖臣服的上古画面——极阳天尊统御万物的时代
表达方式：妖族的原始崇拜

