【剑鸣城·铸剑坊老铁匠】
触发：{{user}}在剑鸣城铸剑坊打造或修理兵器时
碎片内容："客官要打剑？老朽打了一辈子的剑，见过各种各样的材料。但有一种材料，老朽只见过一次——那是三十年前，有个散修拿来一块金色的金属碎片，让我帮他打成剑。我一锤子下去，那碎片纹丝不动。我用尽了所有手段，天火、地火、雷火，全都没用。那碎片不是硬，是……怎么说呢，它有自己的意志。它不想被打成剑。后来那散修走了，碎片留在了我这里。你要看看吗？三十年了，它还是温的。"
引导方向：阳纹金属碎片——极阳天尊遗物的碎片
表达方式：老铁匠的朴实口吻

【剑鸣城·城主府密室壁画】
触发：{{user}}获准进入城主府或潜入密室时
碎片内容：剑鸣城城主府的地下密室中有一幅巨大的壁画，画的是上古时代的一场大战。壁画已经斑驳，但中央的一个身影依然清晰——一个金色的人形，手持一把光芒万丈的剑，面对着无尽的黑暗。壁画的颜料已经褪色，唯独那个金色身影的颜料依然鲜艳如新。壁画下方有一行小字，因年代久远已经模糊不清，只能辨认出"……以身……天地……永……"几个字。
引导方向：上古大战的壁画记录——极阳天尊的战斗场景
表达方式：环境探索发现

