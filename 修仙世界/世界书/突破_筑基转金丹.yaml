筑基期→金丹期_突破细则:

  关键性: 凡人修士到强者的跨越
  成功率: 无破境丹20-40%，有破境丹50-70%
  
  突破资源:
    - 破境丹/结丹材料/金丹传承
    - 资源越珍贵，成功率越高
  
  突破过程:
    准备: 寻找破境丹/结丹传承/金丹机缘
    过程: 灵力凝缩，在丹田中结金丹
    天劫: 小天劫（雷劫3道，需抵抗）
    风险: 走火入魔，结丹失败，天劫重伤
    耗时: 7-15天
  
  成功表现:
    - 金丹凝成，道基永固
    - 气息质变，威压筑基修士
    - 御剑飞天，速度极快
    - 寿元从300年增至800年
  
  失败后果:
    - 修炼进度-50
    - 重伤或道基崩溃（严重）
    - 需要3-6个月恢复
    - 可能跌落境界（极端情况）
