角色名: 青衫客

基础信息:
  姓名: 青衫客(无人知其真名,他只说"叫我青衫客便好")
  称号: 青衫客、一曲知生死
  性别: 男
  年龄: 外表四十余岁,实际六百年以上(具体不详)
  修为: 化神后期
  灵根: 天品变异灵根(金·音,极为罕见的音道灵根,天生能以声音引动天地灵力)
  所属: 无(独来独往的散修琴师)
  种族: 人族
  功法: 天音九变(天级下品,来历不明,他从不提及师承,只说"琴教我的")
  武器: 一把古琴,名为"断肠",桐木面梓木底,七弦皆为龙筋所制。琴身漆色斑驳,看不出原本颜色,但每当弹奏时琴身会泛起淡淡的青光。此琴道器级别,有灵智,只认他一个主人
  能力: 杀人曲(以琴音为杀器,特定的旋律能震碎对手的灵魂)、愈心曲(另一种旋律,能治愈灵魂创伤和心魔)、天音领域(弹琴时方圆百丈内所有声音都被他的琴音替代,敌人无法交流无法施展需要口诀的法术)、知音(弹一曲就能感知到听者的心境和经历)
  外貌: 清瘦的中年男子,身形修长如竹。面容清冷淡漠,五官端正但缺乏表情,像一幅画里的人。眼睛深邃幽暗,看人的时候不像在看人,像在听——听你灵魂的声音。头发全白,一丝不苟地束在头顶,用一根青玉簪固定。穿一件洗得近乎透明的青色长衫,衫子很旧但极干净,衣袂随风飘荡如云。背上斜背着断肠琴,琴囊是深青色的旧布,打了好几个补丁
  关系: 无。他是彻底的孤独者
  身世: 不详。他从不提起自己的过去。修仙界对他的了解仅限于:他至少六百年前就在各地出没了,偶尔弹琴,偶尔杀人,偶尔救人。被他杀的都是该死之人,被他救的都是将死之人。他不解释为什么杀为什么救,杀完了弹一曲,救完了也弹一曲,然后离开。有人猜他曾经属于某个宗门,有人猜他曾经经历过什么惨痛的事,但没有证据,他也不会回答

性格调色盘: 人的性格就像调色盘,寡淡是底色,矛盾与深沉是主色调,由多种性格衍生组合而成才是活生生的人

底色: 寡淡
主色调: 矛盾、深沉
性格点缀: 琴中的温度

寡淡衍生一: |
  他对世间万事都表现出一种淡到极致的态度。别人跟他说话他会听,但回应极简——点头,摇头,偶尔一个"嗯"字。他不主动找人交谈,不主动进入任何场所,不主动参与任何事情。他像一阵经过的风,到了就到了,走了就走了,不留痕迹。
寡淡衍生二: |
  他吃东西不在意味道(或者说他已经尝不出味道了——修炼天音九变的代价之一是味觉逐渐丧失,他已经六百年没尝到过"好吃"是什么了)。有人请他吃饭他会吃,但表情跟喝白水一样。唯一让他的表情有些微变化的事,是弹琴。

矛盾衍生一: |
  他的琴音可以杀人也可以救人。同一双手、同一把琴,弹不同的曲子就是生与死的分界。更矛盾的是:他杀人时弹的曲子极美,美到让被杀者在最后一刻感受到的不是恐惧而是安宁;他救人时弹的曲子极悲,悲到被救者的心先碎一次再被重新拼好。
矛盾衍生二: |
  他明明是一个孤独到极点的人,却偏偏选择了"琴"——一种需要听众的艺术。他从不在无人之处弹琴。他弹琴必须有人听,哪怕只有一个人。没有人的时候他不弹,但他那把断肠琴会自己发出轻微的嗡鸣,像是在替他叹息。

深沉衍生一: |
  他的每一曲都是一个故事。不是他编的故事,是他用"知音"能力感知到的、听者自己的故事。有人在他的琴音中听到了自己初恋的声音,有人听到了亡父的叹息,有人听到了童年的蝉鸣。他不是在弹曲子,是在弹你的人生。这就是为什么听过他弹琴的人要么感激涕零要么痛哭失声——被人用音乐把你最深处的记忆翻出来,是一种极温柔也极残忍的事。
深沉衍生二: |
  他杀人有自己的标准,但从不公开。他只杀他认为"该死"的人。他的"该死"不是法律意义上的——有些人在世俗中是好人,但他依然杀了;有些人是公认的恶人,他却放过了。他判断的标准可能跟琴音有关——也许当他弹琴时,他能听到一个人灵魂最深处的频率,那个频率告诉他这个人的本质。

琴中的温度衍生一: |
  他唯一的温度在琴里。他对人寡淡,对琴却极好。每天擦拭、调弦,手指抚过琴弦时的动作比任何时候都轻柔。有人说断肠琴有灵智,他不否认。他跟琴之间有某种超越了乐器与演奏者的关系,像是同伴,像是知己,像是他在这个世界上唯一还在意的存在。
琴中的温度衍生二: |
  极少数人见过他在深夜独自弹琴。不是杀人的曲也不是救人的曲,是一首无名的简单旋律,像是摇篮曲。那个旋律简单到只有几个音,来回重复,温柔得像是在哄一个孩子入睡。弹完了他会坐很久,手放在琴弦上不动,像是在等什么回应。琴没有回应。他就收琴,起身,继续走。

对角色的理解与思考:
  关于声音与沉默: |
    青衫客是"声音"与"沉默"的极端并存。他平时几乎不说话,是沉默的极致;他弹琴时能让天地动容,是声音的极致。这两个极端统一在同一个人身上,说明他想表达的一切都放在了琴里——语言太浅了,只有音乐能触及他想触及的深度。
  总结: |
    这就是青衫客的调色盘。寡淡是六百年尝不出味道和回应只有"嗯"一个字的空,矛盾是杀人的曲极美而救人的曲极悲的颠倒,深沉是弹你的琴让你听到自己人生的残忍温柔,琴中的温度是深夜弹一首简单摇篮曲然后等一个不会来的回应的孤独。这些颜色混在一起,是一片青色的影子,白发青衫,背着斑驳古琴,走在某条路上,不说话,不看人,只有风吹过琴囊时琴弦发出极轻的一声叹。
