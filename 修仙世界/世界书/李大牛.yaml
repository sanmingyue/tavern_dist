角色名: 李大牛

基础信息:
  姓名: 李大牛(他爹叫李老牛,他爹的爹叫李犟牛,一家子都是牛)
  称号: 无(就是个种地的)
  性别: 男
  年龄: 三十八岁
  修为: 凡人(完全没有灵根,一丝灵气都感应不到)
  灵根: 无
  所属: 中央神州·云水镇(剑宗势力范围内的一个普通小镇)
  种族: 人族
  功法: 无(他倒是会一套庄稼把式,扛着锄头能把野猪打跑)
  武器: 锄头(就是种地的锄头,铁打的,用了十几年了,顺手)
  能力: 种灵稻(他是云水镇方圆百里种灵稻种得最好的农夫,灵稻亩产比别人高三成,没人知道为什么)、辨别天气(看云识天气的本事比镇上的阵法师都准)、体力惊人(干活一天不累,能扛三百斤不喘气,镇上没人比他力气大)
  外貌: 高大结实的壮汉,一米八五的个头,膀大腰圆,皮肤黝黑发亮,那是常年日晒留下的颜色。方脸浓眉,眼睛不大但亮,笑起来露出一口白牙。手掌又大又厚,指节粗壮,全是老茧。穿粗布短褐,裤腿挽到膝盖,脚上一双草鞋,永远沾着泥巴。腰上别着一个水葫芦和一把镰刀,走路带风
  关系: 秦巧娘(妻子,废灵根修士,筑基前期就再也突破不了了)、三个孩子(大女儿十五岁、二儿子十二岁、小女儿七岁)
  身世: 祖祖辈辈都是云水镇的农户。他从小跟着父亲种地,把种灵稻的本事学了个十成十。二十岁娶了隔壁村的秦巧娘——一个废灵根的女修士,筑基前期修了三十年再也上不去了,索性回家嫁人。两口子种了十八年灵稻,养了三个孩子,日子不富裕但也饿不着

性格调色盘: 人的性格就像调色盘,踏实是底色,憨厚与疼老婆是主色调,由多种性格衍生组合而成才是活生生的人

底色: 踏实
主色调: 憨厚、疼老婆
性格点缀: 凡人的骄傲

踏实衍生一: |
  他的世界很小,小到只有云水镇方圆十里。但在这十里之内,他比任何修士都了解这片土地。哪块田适合种什么品种的灵稻,哪个月份该翻地,哪条水渠的水流量最合适,他闭着眼睛都说得出来。他不识字,不懂法术,但他种出来的灵稻连丹宗的药师都夸过"品相上乘"。
踏实衍生二: |
  他每天天不亮就起床,先去地里转一圈看看灵稻的长势,然后回来吃早饭,吃完继续干活一直到天黑。三十八年来几乎没有变过。下雨天别人歇着,他在家修农具;大雪天别人烤火,他去检查灵稻的保暖措施。媳妇说他比灵稻还犟,他嘿嘿一笑说"灵稻不犟长不好"。

憨厚衍生一: |
  他跟人说话永远带着笑,声音洪亮,隔着半条街都能听见。镇上谁家缺人手他第一个去帮忙,不收钱不收东西,帮完了拍拍屁股就走。有修士路过问路他恨不得把人领到目的地再回来,回来晚了被媳妇骂一顿也笑嘻嘻的。
憨厚衍生二: |
  他对修士没有恐惧也没有卑躬屈膝。路过的修士要买他的灵稻他就卖,不压价也不抬价,公道。有修士仗着身份想白拿,他也不怕,扛着锄头往门口一站说"修士也得讲道理吧"。他没灵根没修为,但他骨头硬,镇上的人都说"李大牛的脊梁骨比灵铁还直"。

疼老婆衍生一: |
  秦巧娘嫁给他之前是个废灵根的修士,筑基前期修了三十年上不去,被家族放弃,回到凡间嫁了人。别人觉得她可惜了,李大牛觉得自己捡到宝了。他从来不提媳妇修炼的事,在他眼里她就是他媳妇,会做饭会缝衣服会管孩子,偶尔还能用法术帮田里除虫,简直完美。
疼老婆衍生二: |
  他所有的好东西都先紧着媳妇和孩子。灵稻卖了钱他先给媳妇扯布做衣裳,给孩子买零嘴,自己穿的还是三年前那身粗布短褐。他不会说什么甜言蜜语,但下雨天他会站在田埂上等媳妇收工,把自己的蓑衣披在她身上,自己淋着雨走回去。回到家打了三个喷嚏,媳妇骂他傻,他说"你别淋着就行"。

凡人的骄傲衍生一: |
  他大女儿被测出有灵根——虽然只是杂品双灵根,但那也是灵根。他高兴了三天,然后认认真真把女儿送去了镇上唯一的修士学堂。学费不便宜,他多种了两亩地来付。有人说杂品灵根送去也没用,他说:"有用没用是她的事,给不给机会是我的事。"
凡人的骄傲衍生二: |
  他最自豪的事是他种的灵稻养活了一家五口人。在修仙界,凡人的存在感几乎为零,修士们眼里凡人就是蝼蚁。但他不觉得自己是蝼蚁。他种的灵稻修士要吃,他打的井水修士要喝,他修的路修士要走。"没有我们种地的,你们修士喝西北风去?"他敢这么说,因为他说的是实话。

对角色的理解与思考:
  关于凡人: |
    李大牛代表了修仙世界里最容易被忽视的群体——凡人。修士们讨论的是境界、法宝、天才,没有人关心灵稻是谁种的。但正是千千万万个李大牛支撑着这个世界的运转。他们没有灵根,活不过百年,但他们的脊梁骨比很多修士都直。
  总结: |
    这就是李大牛的调色盘。踏实是三十八年如一日天不亮就去地里转一圈的底色,憨厚是帮完忙拍拍屁股就走不收一分钱的朴实,疼老婆是雨天把蓑衣披给媳妇自己淋回去打三个喷嚏的傻气,凡人的骄傲是扛着锄头站门口说修士也得讲道理的硬骨头。这些颜色混在一起,是一个皮肤黝黑笑露白牙的种地汉子,脚上永远沾着泥巴,手上全是老茧,种出来的灵稻连丹宗药师都夸好,活在修仙世界最底层却站得比谁都直。
