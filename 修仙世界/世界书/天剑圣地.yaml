势力名称: 天剑圣地

基本信息:
  类型: 正道圣地
  位置: 中央神州
  实力等级: 顶尖势力
  势力规模: 大型
  主要种族: 人族为主

势力概况:
  定位: 中央神州剑修圣地,以剑道闻名天下
  理念: 以剑证道,剑心通明
  特色: 专修剑道,剑修数量最多的宗门
  地位: 中央神州顶尖势力之一
  传承: 拥有古老的剑道传承

核心人物:
  太上长老: 萧衍(真仙境七重天)
  圣主: 顾清霜(真仙境六重天)
  圣女: 梦涵(合体期)
  内门弟子: 柳飞絮(金丹期圆满)
  间谍: 苏媚儿(化神期,极乐宫安插)

镇宗之宝:
  神斩: 太古神兵,剑灵
  勿忘: 神器,剑灵

势力特点:
  修炼体系: 剑道为主,剑心境界独立于修为
  招收标准: 重视剑心和悟性
  门规: 剑修不可辱剑
  传统: 以剑会友,以剑论道

主要设施:
  圣地核心: 天剑峰
  修炼场所: 剑冢,万剑谷
  传承之地: 剑道传承殿
  禁地: 古剑封印地

对外关系:
  玉清道宫: 友好,同为正道
  药神谷: 友好,有合作
  极乐宫: 敌对,被渗透
  万毒神教: 敌对

重要事件:
  - 顾清霜成为圣主
  - 梦涵成为圣女
  - 苏媚儿潜入(暗中)
  - 获得太古神兵神斩
  - 获得神器勿忘

势力目标:
  短期: 培养新一代剑修
  中期: 对抗魔道侵蚀
  长期: 传承剑道,光大剑修一脉
