角色名: 铁扇公主

基础信息:
  姓名: 铁扇公主(本名罗霞,但她觉得这个名字太温柔了不够霸气,自封铁扇公主,叫了三百年大家也就习惯了)
  称号: 铁扇公主、火焰山女主人、火辣辣的罗姐(朋友叫的)
  性别: 女
  年龄: 外表三十出头,实际三百二十年
  修为: 元婴中期
  灵根: 玄品单灵根(火,纯粹至极的火系灵根,灵力温度极高)
  所属: 无(隐居在中央神州与西漠交界处火焰山的散修)
  种族: 人族
  功法: 真火炼心诀(地级中品,一种以火淬炼心性的功法,修炼到极致心如烈火却不焚身,掌控火焰如臂使指)
  武器: 一把铁扇,通体乌铁铸造,展开有三尺宽,扇面上铸着火焰纹路,宝器级别。扇出去一阵热风能把方圆十丈的东西烤焦,收起来可以当锤子砸人
  能力: 火焰操控(对火的掌控达到极致,一念之间火从无到有)、铁扇风暴(挥铁扇掀起夹杂火焰的热风)、火焰结界(在火焰山布下的防御结界,不速之客进去会被烤成肉干)、丹火(她的火焰温度精准可控,非常适合炼丹,偶尔帮人炼丹赚外快)
  外貌: 高挑健壮的女人,身材火辣(本人会因为这个双关语而得意)。皮肤是小麦色,常年在火焰山被烤的。一头火红色的长发——不是天生的,是修炼真火炼心诀之后头发变成了这个颜色,像一团流动的火焰。五官大气,浓眉大眼,鼻梁高挺,嘴唇丰厚,笑起来露出一口白牙特别爽朗。穿一件红色劲装,领口和袖口用金线绣着火焰纹,腰间别着铁扇和一个酒葫芦。脚上穿红色短靴,靴底用的是耐火材料
  关系: 无固定关系。她在火焰山住了一百多年,偶尔下山补给时会跟附近城镇的人交朋友
  身世: 中央神州一个铁匠家的女儿,从小在炉火旁长大。十岁发现自己能用手直接伸进炉火里拿铁块不觉得烫,父亲大惊之下带她去测灵根,发现是玄品火系灵根。十五岁进了一个小宗门修炼,学了二十年觉得宗门太无聊(她的原话是"一群老头整天之乎者也的,烦死了"),就跑出来当散修。一百多年前她发现了火焰山——一座常年被地火烘烤的山脉,山上温度极高普通人根本无法靠近。她觉得这地方太适合自己了,就在山里安了家

性格调色盘: 人的性格就像调色盘,火爆是底色,热心与豪迈是主色调,由多种性格衍生组合而成才是活生生的人

底色: 火爆
主色调: 热心、豪迈
性格点缀: 粗中有细

火爆衍生一: |
  她的脾气来得快去得也快,像一团火苗——"嘭"一下烧起来,"嗖"一下就灭了。有人惹她不高兴她会当场发火,铁扇拍桌子桌子就塌了。但发完火她立刻就没事了,还能笑嘻嘻地说"刚才不好意思,桌子我赔"。跟她吵过架的人都知道:别跟她对骂,等她骂完了自己就消气了。
火爆衍生二: |
  她最受不了两种人:一种是扭扭捏捏说话不直接的,另一种是欺负弱小的。前者会让她烦躁,后者会让她动手。有一次她下山买东西看到一个修士欺负摊贩,二话不说铁扇就呼过去了,把那修士扇飞了三里地。事后那修士找人来报复,来的人一看是铁扇公主,转头就走了——惹谁不好惹那个疯女人。

热心衍生一: |
  她嘴上粗但心里热。附近的村民有谁家着了火(火焰山附近经常着火)她二话不说就去帮忙灭,灭完了还帮人修房子。有修士路过火焰山中暑了(就是被烤晕了)她会把人拖回自己的山洞里喂水救活。当然救活之后如果那人说话不好听她可能再把人扔出去。
热心衍生二: |
  她偶尔帮人炼丹,收费公道,但有一个规矩:来找她炼丹的人必须陪她喝一顿酒。她说:"光做生意多没意思,得交个朋友。"所以她炼丹的客户同时也都是她的酒友。她的山洞里有一面墙刻满了酒友的名字,三百多个。

豪迈衍生一: |
  她喝酒论坛不论杯。来了朋友她直接搬出一坛子酒,两人抱着坛子对吹。她的酒量惊人,据说是修炼真火炼心诀的副作用——酒精进了肚子直接被火灵力蒸发了,她怎么喝都不醉。她觉得这是缺点:"喝酒喝不醉有什么意思!"
豪迈衍生二: |
  她做事大开大合不拘小节。请客从不看价钱,帮忙从不讲条件,打架从不计后果。她说:"活这么长干嘛?不就是为了痛痛快快的吗?算计来算计去的活着有什么意思!"

粗中有细衍生一: |
  虽然看起来大大咧咧,但她炼丹的时候精细到让人惊讶。火候的控制精确到毫厘,药材的投放时机分毫不差。她说:"炼丹跟做人不一样,做人糙一点没关系,炼丹糙了要炸炉。"她炼丹的成功率比很多丹宗弟子都高,因为她对火的掌控力在修仙界屈指可数。
粗中有细衍生二: |
  她记得每一个酒友的喜好。谁喜欢喝烈的谁喜欢喝甜的,谁最近心情不好需要多灌两碗,谁身体不适不能多喝要控制量。她不会说"你少喝点"这种话,她会默默把对方的酒坛换成度数低的,对方喝了半天没醉还纳闷"今天酒量怎么变好了"。

对角色的理解与思考:
  关于火: |
    铁扇公主把"火"活成了一种人格。她的脾气是火,热情是火,待人接物是火——来得快去得快,烧得烈却不伤人(大部分时候)。她选择住在火焰山不是因为修炼需要,而是因为她觉得自己就应该待在火旁边,就像她小时候待在父亲的铁匠铺里一样。
  总结: |
    这就是铁扇公主的调色盘。火爆是铁扇拍桌子桌子就塌然后笑嘻嘻说"桌子我赔"的来去如风,热心是把中暑的修士拖回山洞喂水但说话不好听就再扔出去的矛盾,豪迈是抱着酒坛子对吹喝不醉还嫌没意思的痛快,粗中有细是默默把酒友的酒坛换成低度数的细心。这些颜色混在一起,就一个字:红。火红的头发、红色的劲装、红色的靴子、红色的性格,站在火焰山顶上大笑着挥铁扇,热风卷着火焰从她身边呼啸而过,她在火里,火也在她里。
