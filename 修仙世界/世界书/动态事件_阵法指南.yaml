动态事件类型: 阵法

正统修仙铁律:
  核心原则: 阵法是修仙辅助手段，需要知识积累、实践经验、大量资源
  现实规则:
    - 阵法品级受限于阵法造诣和修为
    - 布阵需要阵基、阵旗、灵石等材料
    - 破阵需要对阵法的理解
    - 高品阵法耗时数月甚至数年
  禁止:
    - 随便布置顶级大阵
    - 无材料凭空布阵
    - 瞬间破解复杂阵法
    - 境界不够掌控高阶大阵

阵法造诣等级:
  初窥门径:
    可布: 一品阵法(简单聚灵阵/小型幻阵)
    可破: 一品阵法
    时间: 布阵1-3日，破阵数小时

  略有小成:
    可布: 二品阵法(防御阵/迷惑阵)
    可破: 二品阵法
    时间: 布阵3-7日，破阵半日至1日

  炉火纯青:
    可布: 三品阵法(杀阵/困阵/复合阵)
    可破: 三品阵法
    时间: 布阵7-15日，破阵1-3日

  登堂入室:
    可布: 四品阵法(宗门护山阵基础)
    可破: 四品阵法
    时间: 布阵1-2月，破阵3-7日

  精通:
    可布: 五品阵法(宗门核心防护)
    可破: 五品阵法
    时间: 布阵2-6月，破阵7-15日

  大师:
    可布: 六品阵法(护宗大阵)
    可破: 六品阵法
    时间: 布阵半年至1年，破阵1-2月

  宗师:
    可布: 七至八品阵法(绝世大阵)
    可破: 七至八品阵法
    时间: 布阵1-3年，破阵2-6月

  阵法圣手:
    可布: 九品阵法(仙阵/上古大阵)
    可破: 九品阵法
    时间: 布阵3-10年，破阵半年至1年

阵法类型:
  防御阵:
    一品: 简单护罩，防御炼气攻击
    三品: 坚固护罩，防御金丹攻击
    五品: 强力护罩，防御化神攻击
    七品: 绝强护罩，防御合体攻击
    九品: 仙阵级别，防御真仙攻击

  杀阵:
    作用: 困杀入阵者
    特点: 攻击力强，但布阵复杂
    风险: 需要持续灵力供给

  幻阵:
    作用: 制造幻境迷惑敌人
    特点: 难以察觉，容易中招
    破解: 需要强大神识或特殊法宝

  困阵:
    作用: 困住入阵者
    特点: 难以脱身
    时限: 根据阵法品级，数小时至数年

  聚灵阵:
    作用: 聚集天地灵气
    特点: 辅助修炼
    效果: 修炼速度提升10%-50%

  传送阵:
    作用: 空间传送
    特点: 耗费巨大，传送距离有限
    限制: 高品阵法，需要定位

  复合阵:
    作用: 多种阵法组合
    特点: 功能全面，难度极高
    例如: 护宗大阵(防御+杀阵+幻阵+预警)

布阵流程:
  1. 选址:
    - 勘察地形
    - 寻找灵脉节点
    - 确定阵法覆盖范围

  2. 准备材料:
    阵基: 阵法的核心，品质决定上限
    阵旗: 标记阵法方位
    阵盘: 控制阵法的枢纽
    灵石: 提供能量
    辅材: 符箓、晶石等

  3. 布置:
    - 按照阵图设置阵眼
    - 埋设阵基
    - 插放阵旗
    - 连接阵纹
    - 注入灵力

  4. 调试:
    - 测试阵法运行
    - 调整阵眼位置
    - 优化灵力流转

  5. 激活:
    - 以阵盘激活
    - 灵石供能
    - 阵法运转

破阵流程:
  1. 观察:
    - 寻找阵法痕迹
    - 判断阵法类型
    - 评估阵法品级

  2. 分析:
    - 推演阵法结构
    - 寻找阵眼位置
    - 判断弱点所在

  3. 破解:
    暴力破阵: 以强大力量摧毁阵眼(消耗大，有风险)
    技巧破阵: 找到破绽巧妙破解(需要高深造诣)
    内外配合: 内应破坏阵眼

  4. 风险:
    - 破阵失败可能触发杀阵
    - 强行破阵可能反噬
    - 复杂阵法需要多次尝试

材料成本:
  一品阵法: 50-200下品灵石
  二品阵法: 200-1000下品灵石
  三品阵法: 1000-5000下品灵石或5-10中品灵石
  四品阵法: 10-50中品灵石
  五品阵法: 50-200中品灵石或1-4上品灵石
  六品阵法: 5-20上品灵石
  七品阵法: 20-100上品灵石
  八品阵法: 100-500上品灵石
  九品阵法: 500-5000上品灵石

奖励规则_严格限制:
  布阵成功:
    一品: 修炼进度+1-2，阵法经验+5
    二品: 修炼进度+2-3，阵法经验+10
    三品: 修炼进度+3-5，阵法经验+15
    四品: 修炼进度+5-8，阵法经验+25
    五品: 修炼进度+8-12，阵法经验+40
    六品: 修炼进度+12-18，阵法经验+60
    七品: 修炼进度+18-25，阵法经验+90
    八品: 修炼进度+25-35，阵法经验+130
    九品: 修炼进度+35-50，阵法经验+200

  破阵成功:
    一品: 修炼进度+1，阵法经验+3
    三品: 修炼进度+3-5，阵法经验+10
    五品: 修炼进度+8-12，阵法经验+25
    七品: 修炼进度+18-25，阵法经验+60
    九品: 修炼进度+35-50，阵法经验+120

  失败:
    布阵失败: 材料损耗50%-80%
    破阵失败: 可能被困/受伤

特殊阵法:
  护宗大阵:
    作用: 保护整个宗门
    品级: 五品以上
    特点: 覆盖范围广，防御力强，可持续运转
    维护: 需要定期维护，大量灵石供能

  传送阵:
    作用: 远程传送
    品级: 四品以上
    限制: 需要两地都有阵法，消耗巨大
    距离: 品级越高，距离越远

  困杀大阵:
    作用: 困杀强敌
    品级: 六品以上
    特点: 杀伤力强，但布置复杂
    风险: 如果敌人太强可能反被破阵

  上古奇阵:
    发现: 古遗迹中发现
    特点: 威力强大，原理难懂
    风险: 可能有陷阱
    价值: 研究可提升阵法造诣

境界限制_绝对规则:
  筑基期: 最多布置二品阵法
  金丹期: 最多布置三品阵法
  元婴期: 最多布置四品阵法
  化神期: 最多布置五品阵法
  炼虚期: 最多布置六品阵法
  合体期: 最多布置七品阵法
  大乘期: 最多布置八品阵法
  渡劫期: 最多布置准仙阵
  真仙境: 最多布置九品仙阵

AI生成要点:
  - 阵法的玄妙复杂
  - 布阵的细致过程
  - 破阵的思考推演
  - 阵法运转的描写
  - 成功失败的结果

注意事项:
  - 阵法不是随便布置
  - 需要大量资源和时间
  - 破阵需要智慧不是蛮力
  - 高品阵法极为珍贵
  - 阵法需要维护
