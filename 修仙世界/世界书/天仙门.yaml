天仙门:
  宗门定位: 正道末流小门派，勉强维持

  核心理念: 苟延残喘，勉力维系传承

  修炼体系:
    功法普通: 传承功法平平无奇，无任何特色
    资源匮乏: 灵石、丹药、法器都极度缺乏
    修炼缓慢: 弟子修炼进度极慢，难以突破

  宗门特色:
    贫穷: 穷得叮当响，宗门最大的特点就是穷
    杂役众多: 大量杂役弟子支撑宗门运转
    欺软怕硬: 对外软弱，对内苛刻
    等级森严: 内门弟子和杂役弟子待遇天差地别
    黎萱处境: 杂役弟子黎萱为赚取弟弟药钱拼命干活

  宗门结构:
    掌门: 天仙真人（修为不高，能力平庸）
    长老: 三位（同样平庸）
    内门弟子: 不到百人
    外门弟子: 数百人
    杂役弟子: 上千人（宗门主要劳动力）

  宗门规模:
    掌门: 天仙真人
    长老: 三位
    内门弟子: 八十余人
    外门弟子: 三百余人
    杂役弟子: 一千余人（黎萱是其中之一）
    附属势力: 天仙镇，人口数万

  杂役制度:
    地位: 杂役弟子地位极低，如同奴仆
    工作: 负责洗衣、做饭、打扫、种田等杂活
    报酬: 每月仅有微薄的灵石和粮食
    晋升: 几乎没有晋升机会，炼气期都难以突破
    压榨: 被内门弟子随意使唤，敢怒不敢言
    黎萱: 为了弟弟的药钱拼命干活，承受各种欺压

  山门地点:
    位置: 中央神州偏远地区·天仙岭
    环境: 灵气稀薄，位置偏僻
    建筑: 破旧简陋，年久失修
    杂役居所: 最简陋的茅草屋，漏风漏雨

  特色资源:
    无: 几乎没有任何值得一提的资源
    贫瘠灵田: 几块贫瘠的灵田，产出极少
    破旧法器: 传承法器都已破损不堪

  与外界关系:
    被轻视: 被其他宗门看不起，地位极低
    被欺凌: 经常被其他小门派欺负，只能忍气吞声
    散修聚集: 一些走投无路的散修会投靠，当杂役混口饭吃

  宗门处境:
    衰落: 已经衰落了数百年，勉强维持不灭门
    收入: 主要靠杂役弟子下山接任务赚取灵石
    危机: 随时可能被其他势力吞并或灭门
    弟子流失: 稍有天赋的弟子都想办法离开

  杂役弟子现状:
    来源: 多为贫苦家庭子弟，为生计投靠
    处境: 地位卑微，任人欺凌
    希望: 幻想有朝一日能晋升内门，但几乎不可能
    黎萱代表: 黎萱是典型的杂役弟子，为家人卖命

  宗门氛围:
    死气沉沉: 全宗上下都笼罩在贫穷和绝望中
    欺压成风: 内门弟子欺压杂役成风
    人情淡薄: 人人自保，毫无温情
    麻木不仁: 对不公已经麻木
