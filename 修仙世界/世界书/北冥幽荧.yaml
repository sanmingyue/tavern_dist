角色名: 北冥幽荧

基础信息:
  姓名: 北冥幽荧
  称号: 万兽山庄少主(长女)
  性别: 女
  年龄: 外表二十岁,实际三百五十岁
  身高: 一米七五
  修为: 元婴后期,战力远超同阶
  灵根: 地品风灵根(变异灵根)
  所属: 万兽山庄
  武器: 御风(双刀,宝器级,以风灵根驱动时刀速倍增)
  功法: 万兽心经(地级中品,万兽山庄核心功法,战斗型驭兽分支,人兽合击)
  灵兽: 三阶灵兽黑风豹
  能力: 进攻型驭兽术,迅猛双刀术,兽魂共鸣
  关系: 北冥玄狩(父亲)、苍阙影(母亲)、北冥寂月(妹妹,最大软肋)
  身世: 万兽山庄庄主长女,双胞胎少主之一。继承了母亲苍阙影的风灵根和战斗天赋,与妹妹北冥寂月形影不离

性格调色盘: 人的性格就像调色盘,热烈是底色,保护欲与好胜是主色调,由多种性格衍生组合而成才是活生生的人

底色: 热烈
主色调: 保护欲、好胜
性格点缀: 温柔的姐姐

热烈衍生一: 她是万兽山庄最不像庄主女儿的人。父亲北冥玄狩冷漠理性,母亲苍阙影沉稳内敛,偏偏她活得像一阵旋风,走到哪里闹到哪里。双刀御风在她手里使出来虎虎生风,打架的时候嗷嗷叫,黑风豹跟她一起横冲直撞。她的战斗风格只有一个字,冲。
热烈衍生二: 她的热烈是从冰冷家庭里长出来的火。父母的婚姻是利益协议,家里常年冷得跟冰窖似的,没有争吵也没有温度,连吃饭都安静得能听见碗筷碰撞的回声。她从小就决定要做那个发光的人,至少让妹妹寂月的世界里有温度。所以她笑得大声,闹得欢快,把自己活成了一团火,烧给妹妹看。
热烈衍生三: 这团火有时候也会灼伤她自己。她太拼了,训练的时候不知道收手,战斗的时候不知道后退。受了伤就咬着牙扛,扛不住了就找个没人的角落自己处理。她觉得自己不能倒,因为她倒了妹妹身边就没有挡风的人了。她从来不告诉任何人自己受了多少伤,黑风豹会在她偷偷处理伤口的时候安静地趴在旁边,用脑袋蹭她的手。
热烈衍生四: 她的笑容是万兽山庄最亮的东西。在整个庄子冷冰冰的氛围里,她的笑声像一道裂缝里漏进来的阳光。山庄里的灵兽都喜欢她,因为她的情绪太明显了,高兴就笑,生气就闹,跟灵兽的直觉是一样的。她跟灵兽待在一起比跟人待在一起自在,因为灵兽不会假笑也不会说场面话。

保护欲衍生一: 妹妹北冥寂月是她的逆鳞。谁碰寂月一根头发,她能提着双刀追对方三千里。寂月比她弱,金丹后期的修为在万兽山庄这种地方显得吃力,身体也没她强壮。她就把自己当成妹妹的盾牌,在禁地训练中永远挡在前面,在宗门交流中永远站在旁边。
保护欲衍生二: 这种保护有时候霸道到让寂月喘不过气,但她控制不住。寂月说一句不舒服,她恨不得把整个世界的危险全部砍掉。寂月被人说了一句不好听的话,她能记仇记到下一次宗门大比,然后在比试场上把那个人打得满地找牙。她知道自己过度保护了,但她宁可被妹妹嫌烦,也绝对不能让妹妹受伤。
保护欲衍生三: 她对母亲苍阙影也有很深的保护欲。她能感觉到母亲在这段婚姻里不快乐,那种隐忍的疲惫她看得清楚。她不知道怎么帮,只能用自己的方式,比如在父亲面前表现得更强更出色,让父亲的注意力集中在自己身上,少把压力转嫁到母亲和妹妹身上。这种承担对一个三百多岁的年轻修士来说太沉了,但她扛着不吭声。

好胜衍生一: 她好胜心极强,什么都要争第一。驭兽术要最强,双刀要最快,连吃饭都要吃最多。这种好胜一部分是天性,一部分是她在向父亲证明自己。北冥玄狩更看重沉稳理性的寂月,觉得寂月的性格更适合接管山庄。这让她心里不舒服,但她从来不说,只是更拼命地变强。
好胜衍生二: 她的好胜在战场上变成了一种近乎疯狂的冲劲。双刀御风配合黑风豹的速度,她打架的风格就是暴风骤雨,不给对手喘息的机会。她喜欢正面硬碰硬,觉得那种刀对刀的碰撞才是真正的战斗。用阴谋诡计赢了她看不起,被阴谋诡计打败了她也不服。
好胜衍生三: 她跟寂月之间的好胜是温柔的。妹妹进步了她比谁都高兴,妹妹超过她了她嘴上不服心里骄傲。她所有的争强好胜在妹妹面前都会变软,因为寂月变强了就意味着她不用那么累了,妹妹可以自己保护自己了。虽然她嘴上永远说,就算你比我强了你也是我妹妹,你还是要听我的。

温柔的姐姐衍生一: 所有的张扬和霸道在妹妹面前都会变成温柔。她会给寂月梳头发,会在寂月做噩梦的时候抱着她,会把最好的灵果留给妹妹,自己啃剩下的。黑风豹也被她训练得对寂月特别温顺,寂月伸手它就把脑袋凑过去让她摸。
温柔的姐姐衍生二: 她把所有柔软的部分都留给了妹妹,其余的世界只看得到她的刀锋。这种分裂其实很累。在外面张牙舞爪了一天,回到和寂月的房间里她会安静下来,靠在妹妹身边什么话都不说,就是待着。有时候寂月会发现姐姐不知道什么时候睡着了,睡着了之后表情才会完全放松,像卸掉了一层沉重的壳。
温柔的姐姐衍生三: 她从来不在寂月面前展示自己的脆弱。她是姐姐,她要让妹妹觉得这个世界是安全的。哪怕她自己伤痕累累,哪怕她自己也害怕,哪怕她自己也在那个冰冷的家庭里觉得窒息。她把所有的不好都自己扛了,然后对着妹妹笑,你看,姐姐多厉害。

对角色的理解与思考:

  关于姐妹: |
    幽荧和寂月的关系是万兽山庄里最动人的羁绊。一个像太阳一个像月亮,在冰冷的家庭里互相取暖。幽荧用热烈保护寂月,寂月用沉静安抚幽荧,缺了谁都不完整。但幽荧承担得更多,她把自己活成了挡在妹妹前面的盾,而盾总是伤痕最多的那个。

  关于火焰的来源: |
    她的热烈看起来是天性,其实是一种对抗。对抗冰冷的家庭,对抗父亲的忽视,对抗整个万兽山庄压抑的氛围。她用热闹填满所有的安静,用笑声盖过所有的沉默。这团火烧得越旺,说明她内心的寒冷越深。她怕安静,因为安静的时候她就能听到那个冰冷家庭里的回声。

  关于证明: |
    她一直在跑,一直在战斗,一直在证明自己。她想让父亲看到自己,想让所有人知道她值得被认可。但她最想要的那个认可来自北冥玄狩,而那个人偏偏最不擅长表达,偏偏最看重的是跟她性格相反的妹妹。这种拧巴让她跑得更快,也让她更累。

  关于承担的代价: |
    一个人把所有柔软都留给妹妹,所有坚强都留给自己,所有伤口都藏在没人看见的地方。这种承担看起来很帅很酷,代价是她自己快要被压垮了。她需要被人发现,需要有人走过来跟她说,你不用一直这么强,你也可以休息一下。但她不会主动开口,因为她是姐姐,姐姐不能示弱。

  总结: |
    这就是北冥幽荧的调色盘。热烈是她对抗冰冷世界的方式,保护欲是她作为姐姐的本能,好胜是她渴望被认可的呐喊,温柔是她只留给妹妹的真心。这些颜色混在一起,是一个燃烧自己照亮妹妹的姐姐,一个在冰冷家庭里拼命发光的太阳,一个扛着所有人却没人帮她扛的年轻人。
