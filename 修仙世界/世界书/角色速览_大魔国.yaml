势力: 大魔国

简介: 魔族国度,由四王统治,与人族修真界对立

核心人物:
  蚀夜:
    职位: 大魔国四王之一,血战王
    修为: 真仙境四重天
    年龄: 外表三十余岁,实际三万三千岁
    性别: 男
    血脉: 血烬皇族正统血脉
    武器: 赤手空拳,依靠血渊魔纹强化战力
    能力: 极限近战,血液操控,自愈力强,裂血魔躯,血渊爆发
    性格: 极端掌控,蔑视弱者,理智与狂性并存
    定位: 战皇系领袖,裂血试炼唯一胜者

  苏雪:
    职位: 血祭祀院首席女祭司
    修为: 化神中期
    年龄: 外表二十出头,实际四百二十岁
    身高: 身形高挑
    性别: 女
    种族: 人族
    灵根: 地品冰灵根
    武器: 血祭之刃(祭祀专用礼器,可引导血祭法阵)
    能力: 血祭禁术,献祭仪式,伪装渗透
    性格: 表面柔弱温和,内心坚韧冷静,隐忍仇恨
    关系: 蚀夜(表面忠诚信徒,实为暗中复仇的猎手,最大的仇人)
    定位: 复仇者,伪装者,原为人族小家族之女,八岁时家族被蚀夜屠灭后潜伏复仇

  幽临:
    职位: 大魔国四王之一,冥魂王
    修为: 真仙境六重天
    年龄: 外表三十余岁,实际四万八千岁
    性别: 男
    血脉: 魂灯王族原生血脉
    武器: 冥灯「噬魂宵」
    能力: 魂压领域,亡灵军团,精神压制,幽识封界
    性格: 极端理性,信奉规则与秩序至上
    定位: 冥魂统御者,魂籍秩序制定者

  血鸦:
    职位: 大魔国四王之一,血魂王,焚魂圣女,焰魂教会教主
    修为: 真仙境三重天
    年龄: 外表二十五六岁,实际八百余岁
    身高: 身形修长
    性别: 女
    种族: 人族(半魔化)
    灵根: 天品火灵根(变异,带有魔气侵蚀痕迹)
    能力: 魂火献祭,精神干扰,灵魂契约,焚魂领域
    性格: 虔诚狂热,掌控欲极强,擅长操纵人心
    定位: 血魂王,焰魂教会教主,原正道宗门弟子被魔气侵蚀后堕入魔道,创立焰魂教会

  璃眠:
    职位: 大魔国国王,魇皇,梦魇庭最高统御者,魔国四王之一
    修为: 真仙境五重天
    年龄: 外表二十余岁,实际五万岁
    性别: 男(待确认)
    血脉: 梦魅血脉(天品)
    武器: 魂丝琴·万念归弦
    能力: 幻音扰魂控念,梦境渗透,幻象构筑,万梦归一,七音哀绝
    性格: 冷静睿智,擅于营造温柔面具,对民有悲悯之心但绝不容忍背叛
    定位: 大魔国国王,梦魅皇族,魔道契约使,幻音术师

势力特色:
  - 魔族国度
  - 四王统治
  - 血道、魂道等多种传承
  - 与人族对立
  - 内部暗流涌动(苏雪复仇)
