势力: 合欢宗

简介: 六大仙宗之一(下三宗),以双修功法、媚术与毒术闻名

核心人物:
  宋馨:
    职位: 合欢宗宗主
    修为: 真仙境十重天大圆满(正面临天人五衰)
    年龄: 外表二十五六岁,真实年龄成谜
    身高: 一米七二
    性别: 女
    灵根: 地品魅惑灵根(变异灵根,天生魅惑之体)
    武器: 不详
    能力: 合欢天经,媚骨销魂诀,千毒万蛊经,精通毒术与媚术
    性格: 慵懒随性,全凭喜好,毫无道德束缚,手段狠辣
    关系: 沈艺清(首席弟子,觉得很有趣),洛红尘(感兴趣的对象)
    特殊: 过往成谜,像凭空出现在合欢宗

  沈艺清:
    职位: 合欢宗首席大弟子
    修为: 渡劫期大圆满
    年龄: 外表二十五岁,实际五万三千岁
    身高: 一米六八
    性别: 女
    特殊状态: 作为合欢宗弟子仍保持处女之身
    灵根: 玄品木火双灵根(无法修炼双修功法)
    武器: 不详
    能力: 千年罕见的毒术天才,可炼制各种剧毒,百毒不侵
    性格: 呆萌天然,对人情世故理解慢半拍,认死理
    关系: 宋馨(师父,抱持敬畏和巨大困惑)
    定位: 合欢宗异类,理论学者型毒术天才

势力特色:
  - 双修功法传承
  - 媚术与毒术并重
  - 宗主实力深不可测
  - 首席弟子是合欢宗异类
  - 与正道关系微妙
