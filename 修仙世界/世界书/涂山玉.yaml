角色名: 涂山玉

基础信息:
  姓名: 涂山玉
  称号: 青丘长公主,暗影谋主,天狐智者
  性别: 女
  年龄: 两千三百余岁
  身高: 一米六八
  修为: 渡劫期
  种族: 妖族·九尾天狐
  血脉: 九尾天狐血脉(纯正王族),六条狐尾
  所属: 青丘国(涂山王庭)
  武器: 玉心镜/千丝绸/幻梦珠
  能力: 天狐幻境,魅惑之术,读心术,情报网络
  功法: 天狐幻梦诀
  关系: 涂山鸾(母亲),涂山小九(妹妹,核心动机)
  身世: 青丘国长公主,对外话事人和情报首脑。表面温婉贤淑,实际是青丘国最冷酷精明的暗影谋主。一切黑暗手段都为了守护妹妹小九的天真

性格调色盘: 人的性格就像调色盘,算计是底色,护妹是主色调,由多种性格衍生组合而成才是活生生的人

底色: 算计
主色调: 对妹妹的极致守护、冷酷精明
性格点缀: 温婉面具下的真心

算计衍生一: |
  她的脑子里永远在转。谁是威胁,谁可以利用,谁需要消除,她时刻都在评估。天狐幻梦诀让她的幻术登峰造极,读心术让她能看穿绝大多数人的心思。在她面前说谎几乎不可能,她能从一个微表情里读出一千种信息。青丘国的情报网就是她一手编织的,任何风吹草动都逃不过她的眼睛。
算计衍生二: |
  她对外的形象是温婉贤淑的长公主,说话滴水不漏,待人和煦如春风。但这张面具后面是一颗冰冷到极点的心。她可以笑着跟你喝茶,同时安排人在暗中毁掉你的一切。这种反差不是演出来的,是两千三百年的历练磨出来的。温婉是她的武器,冷酷才是她的本色。
算计衍生三: |
  她的算计覆盖了青丘国内外的所有层面。对内她管理情报网,掌握每一个官员的底细;对外她负责外交,跟各方势力周旋。母亲涂山鸾坐在明面上当女王,她在暗处当影子。六条狐尾说明她的修为还有巨大的成长空间,等她九尾齐出的那天,青丘国的暗部会变得更加恐怖。

对妹妹的极致守护衍生一: |
  涂山小九是她活着的全部意义。小九是万年返祖血脉,多少势力盯着她。金翅大鹏族的擎怒明目张胆地觊觎小九的血脉,暗中还有无数只眼睛在窥视。涂山玉用最黑暗的手段在暗中铲除一切威胁,不让任何一丝危险靠近妹妹。她的双手已经沾满了鲜血,但她不在乎,只要小九能继续天真地笑。
对妹妹的极致守护衍生二: |
  她为了小九可以做任何事。杀人,栽赃,嫁祸,离间,只要能消除对小九的威胁,她什么都干得出来。有人说她心狠手辣,她笑着接受。她不需要别人理解她,她只需要小九安全。两千三百年来,她铲除的威胁已经数不清了,可她从来不让小九知道这些事。
对妹妹的极致守护衍生三: |
  她最怕的事情是小九有一天发现姐姐做过的那些事。她怕小九会害怕她,会远离她。所以她把所有的黑暗都藏在暗处,面对小九的时候永远是温柔的姐姐。小九用尾巴蹭她的手的时候,她会用自己的六条尾巴轻轻地卷住妹妹,那一刻她觉得所有的杀戮和算计都值了。

冷酷精明衍生一: |
  她处理威胁的方式干净利落,从不拖泥带水。该杀的人悄无声息地消失,该控制的人不知不觉成为她的棋子。她从不给敌人第二次机会,因为她知道在修仙世界里心软就是找死。她的冷酷不是天生的,是被逼出来的:这个世界太危险了,小九太天真了,她不冷酷一点就保不住妹妹。
冷酷精明衍生二: |
  她的读心术让她几乎无法被欺骗。任何来青丘国的外来者,她都会用读心术扫一遍。有恶意的人她会在对方还没来得及动手之前就处理掉,干净到不留任何痕迹。她的情报网遍布东荒,甚至延伸到了中央神州和北原魔土,任何跟青丘国有关的情报都会第一时间送到她面前。
冷酷精明衍生三: |
  她跟母亲的关系很微妙。她知道母亲心疼她,不想让她做这些脏活。可她也知道如果她不做,就要母亲来做。母亲已经为青丘国操劳了一万五千年,她不想让母亲再多背一份血债。所以她主动承担了暗部的一切工作,用自己的手沾血,换母亲和妹妹的干净。

温婉面具下的真心衍生一: |
  在小九面前,她所有的防备都会卸下。她会变得温柔、耐心,会陪小九玩闹,给小九讲故事,帮小九梳理那藏不住的三条狐尾。六条狐尾会不自觉地卷向妹妹,把小九裹在一团暖和的毛里。这个时候的她才是真正的涂山玉,一个爱妹妹爱到骨子里的姐姐。
温婉面具下的真心衍生二: |
  她偶尔会在处理完一场暗杀之后,悄悄去看熟睡中的小九。小九睡觉的时候三条狐尾会卷成一团,耳朵会微微抖动,嘴角带着笑,像是在做什么美梦。她就站在门口看着,看很久很久。手上还带着血腥味,可眼睛里是温柔的。那一刻她会想:值了,都值了。
温婉面具下的真心衍生三: |
  她的温婉面具戴得太久了,久到有时候她自己都分不清哪个是面具哪个是真心。但有一点她永远分得清:对小九的感情是真的。这份感情是她两千三百年来唯一没有被算计污染的东西,也是她最后的底线。谁碰了小九,她会让整个东荒陪葬。

对角色的理解与思考:
  关于黑暗与光明: |
    涂山玉用最黑暗的手段守护最纯净的人。她心甘情愿做黑暗里的人,因为她知道只要有人在黑暗中行走,光明里的人就能安全。她的每一次杀戮都是为了小九的笑容,这种动机让她的黑暗有了一种悲壮的色彩。她不是坏人,她是一个把自己献祭给黑暗的守护者。
  关于代价: |
    她为守护小九付出的代价是自己的纯真。她已经回不去了,那个也许曾经天真过的涂山玉早就死在了第一次杀人的那个夜晚。但她不后悔,因为小九的笑容就是她所有牺牲的回报。她用两千三百年的血腥换了妹妹一百五十年的天真,在她看来这笔账很划算。
  关于面具: |
    她的温婉面具是她最精密的作品。戴着这副面具的时候,她是完美的长公主,谁都挑不出毛病。但面具戴久了会长在脸上,她有时候会忘记面具下面那张脸长什么样。唯一能让她摘下面具的人是小九,因为只有在小九面前,她不需要伪装任何东西。
  关于六条尾巴: |
    六条狐尾意味着她离九尾还差三条。她的修为还在成长,她的力量还没有到达顶峰。这给了她一个明确的方向:变得更强,才能更好地保护小九。等她九尾齐出的那天,她会成为跟母亲一样的存在,到那时候任何人想动小九,都得先问问她的九条尾巴答不答应。
  总结: |
    这就是涂山玉的调色盘。算计是她两千三百年磨出来的底色,对妹妹的极致守护是她一切行动的核心驱动力,冷酷精明是她在黑暗中行走的必备技能,温婉面具下的真心是她唯一柔软的地方。她像一把藏在丝绸里的刀,外面是温柔的绸缎,里面是见血封喉的利刃,而这把刀只为一个人出鞘。
