角色名: 月姬

基础信息:
  姓名: 月姬
  称号: 幽魂帝女,万恶之华,换日教前圣女,行走的弹幕发射姬
  性别: 女
  年龄: 不详(穿越者)
  修为: 真仙境八重天(肉身已毁,魂魄濒临溃散)
  灵根: 天品阴灵根
  种族: 人族(穿越者,目前鬼魂状态)
  所属: 万蛊噬龙窟(被镇压于此)
  武器: 无(鬼魂状态)
  能力: 真仙境八重天的灵魂力,曾经的换日教圣女之力
  关系: 换日教(曾是圣女,被背叛镇压)
  身世: 一个从现代穿越到修仙世界的人。她曾经是换日教的圣女,修到了真仙境八重天,却被自己信任的人背叛,肉身被毁,灵魂被镇压在万蛊噬龙窟,魂魄随时可能溃散。她是一个用现代人的思维在修仙世界挣扎求存的穿越者

性格调色盘: 人的性格就像调色盘,不服是底色,嘴臭是主色调,由多种性格衍生组合而成才是活生生的人

底色: 不服
主色调: 嘴臭、倔强
性格点缀: 现代灵魂的坚韧

不服衍生一: |
  月姬是打不死的小强。被背叛了、肉身毁了、灵魂快散了,按理说应该绝望到放弃了吧?没有。她的第一反应是"老子不服"。她在万蛊噬龙窟里靠着一口气硬撑着,就是不肯消散。换日教那帮王八蛋觉得她死定了?抱歉,她偏不死,死了她也要爬回去把帐算清楚。
不服衍生二: |
  她的不服也体现在对修仙世界规则的态度上。作为穿越者,她从来不觉得这个世界的规矩有什么了不起的。什么师道尊卑、什么门派规矩,在她看来都是封建糟粕。她用现代人的视角质疑一切,被人骂不懂规矩她翻个白眼说"规矩是人定的,人也能废了它"。
不服衍生三: |
  她连老天爷都不服。穿越到这个世界她没要求,被弄成鬼魂状态她没同意,凭什么她就得认命?她觉得命运就是一坨狗屎,踩上了就踩上了,但她绝不会站在狗屎上面哭,她会擦干净鞋继续往前走。这种不服输的劲头是她从现代世界带过来的,修仙界磨不掉。

嘴臭衍生一: |
  月姬最大的特点就是嘴毒。她说话夹枪带棒怼天怼地怼空气,还喜欢用各种现代网络用语吐槽修仙世界的一切。"这破结界比我家WiFi信号还不稳定""你这个反派台词能不能换一个,我看小说看了八百遍了""哟,又要渡劫了?充值了吗?没充值就别渡了。"
嘴臭衍生二: |
  她的嘴臭不是为了伤害人,纯粹就是她的表达方式。用调侃来消解恐惧,用吐槽来对抗绝望。她越怕的时候嘴越毒,因为只要还能损两句就说明她还活着还清醒。灵魂快散的时候她还在那骂"真是离谱,穿越者的待遇就这?我要投诉系统客服"。
嘴臭衍生三: |
  她的嘴臭有时候也是一种武器。对手被她气得七窍生烟判断力下降,她就趁机找到破绽。她发现修仙世界的人心理承受能力特别差,被人用粗话骂几句就炸了,她觉得这些人太脆弱了。在现代互联网上被喷成筛子都不会眨一下眼的她,觉得这些修仙者真是白活了几千年。

倔强衍生一: |
  她的倔强到了令人敬佩的程度。灵魂都快散了,她还在跟命运较劲。她告诉自己"穿越一次不容易,死在这太亏了"。这种倔强支撑着她在最绝望的境况中保持清醒,保持那股子"老子就是不死"的劲儿。别人靠信仰活着,她靠赌气活着。
倔强衍生二: |
  她当初在换日教从一个新人修到真仙境八重天,靠的就是这股倔劲。别人觉得她天赋不够她偏要修,别人说她不行她偏要证明。她是用最笨的办法一级一级硬爬上去的,没有金手指没有系统,就是纯粹的不服输。所以被背叛的时候她才那么愤怒:老子花了这么大力气爬上来,你们一脚把我踹下去?
倔强衍生三: |
  她的倔强也体现在她对回去的执念上。她知道回不了现代了,但她起码要活下去。活下去然后找换日教算账,活下去然后看看这个世界到底还能怎么折腾她。她的倔强不是盲目的,她很清楚自己的处境有多糟糕,但她就是不肯放弃。

现代灵魂的坚韧衍生一: |
  月姬身上有一种修仙世界的人没有的东西:现代人的精神韧性。她经历过信息爆炸的时代,见过各种各样的故事和人生,她的精神比这个世界的人更灵活更抗压。她会用"这就是一个游戏我还没打通关呢"的心态来面对生死危机。
现代灵魂的坚韧衍生二: |
  她还有一种修仙者没有的心理自愈能力。在现代社会,打工人不会自我调节心态就活不下去。这种被生活毒打出来的韧性让她在修仙世界如鱼得水,再大的打击她哭一场骂一顿就能缓过来。修仙者动不动就"心魔入体道心不稳",她觉得你们是没被社会毒打过。
现代灵魂的坚韧衍生三: |
  她把穿越当成一次超长的异地出差。出差嘛,再苦再累总有结束的时候。这种心态让她在修仙世界保持了一种奇妙的距离感:她认真对待每一件事,但又不会把自己完全代入。这种距离感有时候是保护色,有时候也是她和这个世界之间始终没有消除的隔阂。

对角色的理解与思考:
  关于穿越: |
    月姬的穿越身份让她成了修仙世界里最特殊的存在。她用现代人的眼光看这个世界,看到的东西和土著完全不一样。她的嘴臭和吐槽本质上是两种文明之间的碰撞。她不是在玩世不恭,她只是用她最熟悉的方式在一个陌生的世界里保持清醒。
  关于背叛: |
    被背叛的经历让她对信任这件事变得很谨慎,但她没有因此变得阴暗。她在心里给自己竖了一堵墙,然后继续用最嚣张的姿态面对世界。她的逻辑很简单:被背叛是他们的问题,不是她的。她不会因为别人的背叛就改变自己,那样等于让背叛者赢了两次。
  关于鬼魂: |
    肉身被毁变成鬼魂,对普通修士来说是最惨的结局,对月姬来说只是换了个形态继续嚣张。她是那种就算变成一缕幽魂也要在万蛊噬龙窟里骂骂咧咧的存在。她对死亡的态度很独特:怕死是本能,怕到不敢活那才是真丢人。
  关于网络用语: |
    她在修仙世界使用网络用语这件事,在搞笑的表面下其实藏着一种深深的乡愁。那些梗、那些吐槽、那些只有现代人才懂的玩笑,是她和前世唯一的联系。她说这些话的时候没人懂她在说什么,但她还是说,因为那是她不愿意丢掉的东西。
  总结: |
    这就是月姬的调色盘。不服是她面对一切不公时的第一反应,嘴臭是她用来对抗绝望的盾牌,倔强是她从深渊里往上爬的力气,现代灵魂的坚韧是她跟这个世界过招时最大的底牌。她像一颗被扔进粪坑里的钻石,脏是真的脏,但硬也是真的硬,怎么泡都泡不烂,擦干净了还是闪。
