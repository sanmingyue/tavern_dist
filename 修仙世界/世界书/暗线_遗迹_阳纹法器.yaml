【暗线遗迹·阳纹法器】

<遗迹描述>
阳纹法器是散落于天地间的特殊法器，它们的共同特征是表面刻有一种独特的金色纹路——"阳纹"。这种纹路与任何已知的炼器手法都不同，无法被复制或模仿。阳纹法器的品级各不相同，但都拥有一个共同的特性：它们会对特定的人产生共鸣。

<阳纹法器列表>

【阳纹玉简】
品级：上品灵器（但蕴含超越灵器的力量）
外观：一枚温润的白玉简，表面有细如发丝的金色纹路流动。纹路不是刻上去的，像是从玉简内部生长出来的。
功能：玉简中记录着一段残缺的功法。功法没有名字，没有修炼方法，只有一段文字："天地有大美而不言，四时有明法而不议，万物有成理而不说。吾以身证道，以命换生，以阳极之力铸轮回之基。此法非法，此道非道，唯心可证，唯情可通。"
获取方式：可能在任何地方被发现——古迹、拍卖会、散修的遗物中
{{user}}体验：触碰玉简时，金色纹路会主动缠绕{{user}}的手指，传递一股温暖。如果{{user}}尝试参悟其中的文字，会感到一种"似懂非懂"的状态——像是曾经知道答案但忘记了。

【阳纹铜镜】
品级：中品法宝
外观：一面古铜色的圆镜，镜面光滑如水，镜背刻有阳纹。镜面不映照当下，而是映照"本质"。
功能：照妖镜的上位版本。普通照妖镜只能照出妖魔的原形，阳纹铜镜能照出一切事物的"本质"——包括被封印的记忆、被隐藏的真相、被遗忘的过去。
获取方式：可能在万宝楼的拍卖会上出现，或在某个古修士的洞府中被发现
{{user}}体验：如果{{user}}用铜镜照自己，会在镜中看到一个模糊的金色身影与自己重叠。身影的面容看不清，但能感受到那个身影在微笑。

【阳纹残剑】
品级：曾经是仙器，现在只剩残片，品级不可考
外观：一截断剑，约一尺长，剑身布满裂纹但不碎裂。裂纹中流淌着金色的光芒，像是剑的血液。剑柄上刻着一个字——"归"。
功能：残剑没有攻击力，但握住它时会感到一种不可动摇的意志——守护的意志。这种意志不是压迫性的，而是温暖的、包容的。
获取方式：插在东荒无名山的山顶（与独孤求败的碎片呼应）
{{user}}体验：如果{{user}}拔出残剑（独孤求败拔不动，但{{user}}可以），残剑会发出一声低鸣，像是在说"你终于来了"。从此残剑会认主，但不会展现任何战斗力——它只是安静地待在{{user}}身边，偶尔发出温暖的光芒。

【阳纹佛珠】
品级：上品法宝
外观：一串由108颗金色珠子组成的佛珠，每颗珠子上都刻有不同的阳纹。珠子温热，握在手中像是握着一颗小太阳。
功能：佛珠能净化一切邪气、魔气、怨气。但它的净化方式不是消灭，而是"温暖"——将邪恶的力量用温暖包裹，使其自行消散。
获取方式：西漠大雷音寺的地宫中，与阳极石碑放在一起
{{user}}体验：佩戴佛珠时，{{user}}会感到内心平静，且周围的人也会不自觉地对{{user}}产生好感。佛珠会在{{user}}遇到危险时自动发光护主。

