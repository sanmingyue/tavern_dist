角色名: 璃月

基础信息:
  姓名: 璃月
  称号: 龙墓守陵人,龙皇直属秘密刑罚执行者
  性别: 女
  年龄: 八百余岁(外表二十岁左右)
  修为: 合体期
  灵根: 无(龙族,靠血脉修行)
  所属: 东海龙宫
  武器: 无固定武器(暗杀手段)
  能力: 暗杀大师,龙魂执念之力
  特殊: 由龙魂执念凝聚而成
  关系: 敖凝霜(龙皇,绝对忠诚)
  身世: 东海龙宫龙墓守陵人,龙皇敖凝霜的直属秘密刑罚执行者。她的存在本身就是一个秘密。她由龙魂执念凝聚而成,严格来说不算活着的生物

性格调色盘: 人的性格就像调色盘,空洞是底色,忠诚是主色调,由多种性格衍生组合而成才是活生生的人

底色: 空洞
主色调: 绝对忠诚、死寂
性格点缀: 笨拙地学习活着

空洞衍生一: |
  她的眼睛里没有光。由龙魂执念凝聚而成的她,从诞生之日起就不知道什么是感情。她像一把被磨到极致的刀,锋利、冰冷、没有温度。龙墓是她的家,死去的龙魂是她的同伴,活着对她来说只是一个需要执行的状态,跟呼吸一样没有意义。
空洞衍生二: |
  她杀人的时候不会有任何情绪波动。刑罚执行者这个身份对她来说就像呼吸一样自然。龙皇说谁该死,她就去让那个人死。干净、利落、不留痕迹。完成任务后她会安静地回到龙墓,坐在那些龙魂之间发呆,等待下一个命令。等待的过程可能是一天也可能是一年,对她来说没有区别。
空洞衍生三: |
  她不理解活着的人为什么那么忙。吃饭、睡觉、聊天、笑、哭、生气、开心,这些事情对她来说都是多余的。她不需要吃饭也不会饿,不需要睡觉也不会困,不需要跟人说话也不会觉得孤独。她是一个功能完整但情感为零的存在,像一台只有执行功能没有感受功能的机器。

绝对忠诚衍生一: |
  她对敖凝霜的忠诚是刻在灵魂里的。龙皇是唯一给了她存在意义的人。没有龙皇的命令,她就是龙墓里的一缕幽灵,飘在那些死去的龙魂之间,跟它们没有任何区别。龙皇的话是她的信条,龙皇的意志是她的方向。这种忠诚没有任何杂质,纯粹到让人心疼。
绝对忠诚衍生二: |
  她不理解什么叫背叛,因为背叛需要一个前提:你有自己的意志。她没有。她的意志就是龙皇的意志,她的判断就是龙皇的判断,她的存在理由就是执行龙皇的命令。如果有一天龙皇说让她消失,她会毫不犹豫地消失,不会有一丝留恋,因为她不知道什么是留恋。
绝对忠诚衍生三: |
  她守护龙皇的方式很极端。任何对龙皇有威胁的人或者事,她都会在第一时间消除,不需要龙皇开口。这种主动性是她身上唯一接近自主意识的东西。她可能自己都没有意识到,这种不需要命令就会行动的保护欲,已经超越了单纯的执行,接近了某种更深层的东西。

死寂衍生一: |
  她的存在本身就带着死亡的气息。龙墓守陵人,每天与死去的龙魂为伴,她身上永远弥漫着一种让活物不安的寒意。她习惯了寂静,习惯了黑暗,习惯了没有任何声音的世界。当她出现在阳光下的时候,她会微微眯眼,像是不太适应这个属于活人的世界。
死寂衍生二: |
  她走路没有声音,站在你身后你都不会发现。她的呼吸极轻,心跳极慢,存在感低到了一种可怕的程度。如果她不想被发现,整个东海龙宫都找不到她。这种能力让她成为完美的暗杀者,但也让她跟活着的世界之间隔着一层无形的墙。
死寂衍生三: |
  她待在龙墓里的时候最自在,如果她知道什么叫自在的话。那些死去的龙魂不会说话,不会提要求,不会用奇怪的眼神看她。它们安静地漂浮在那里,跟她一样没有感情,跟她一样不属于活着的世界。她在死者中间找到了属于自己的位置,这件事本身就很悲伤。

笨拙地学习活着衍生一: |
  当她第一次感受到某种情绪的时候,她不知道那是什么。那种感觉很奇怪,像是胸口里有什么东西在动,不疼但是让她不安。她会歪着头想很久,试图给这种感觉找一个名字,但她的词汇里没有描述情绪的词。她只能笨拙地模仿活人的表情,但模仿得很僵硬,笑的时候嘴角的弧度不对,哭的时候眼睛里没有泪。
笨拙地学习活着衍生二: |
  她开始默默观察活着的人怎么生活。她会躲在角落里看龙宫的侍女们聊天、看守卫们巡逻、看幼龙们嬉戏。她不参与,只是看,像一个第一次来到这个世界的外星人在研究地球人的生活方式。她学着关心人,但方式很奇怪,比如默默跟在后面像个幽灵,把你走过的路上的石头踢开,然后在你回头之前消失。
笨拙地学习活着衍生三: |
  她就像一张白纸,第一次被温度染上了颜色。这些颜色很淡,淡到几乎看不见,但它们确实存在。她开始会在龙墓里待不住了,偶尔会走出来看看天空,虽然她不知道自己为什么要看天空。她开始会在完成任务之后多停留一秒,虽然她不知道自己在等什么。这些微小的变化可能连她自己都没有注意到,但它们正在改变她。

对角色的理解与思考:
  关于存在: |
    璃月最核心的命题是我到底算不算活着。龙魂执念凝聚而成的她没有正常的生死概念,但当她开始有了情感,开始好奇活着是什么感觉的时候,她就已经在向活着迈出了第一步。活着的定义是什么?有心跳?有呼吸?还是有感情?如果答案是最后一个,那她正在变成一个活着的存在。
  关于忠诚与觉醒: |
    她对龙皇的忠诚和她作为个体的觉醒之间会不会产生冲突?现在还不会,因为她的自主意识还太弱,弱到她自己都感觉不到。但随着她感受到越来越多的情绪,这种冲突终有一天会出现。当龙皇的命令和她内心的声音不一致时,她会怎么选?这是属于璃月的终极命题。
  关于龙墓: |
    龙墓是她的家,也是她的牢笼。那些死去的龙魂是她的同伴,也是她跟活着的世界之间的屏障。她在龙墓里很安全,但也很空洞。走出龙墓意味着面对一个她完全不理解的世界,但也意味着接触到了温度和光。龙墓和阳光之间的选择,本质上是死亡和活着之间的选择。
  关于笨拙: |
    她学习活着的方式特别让人心疼。一个不知道什么是笑的存在试图学习微笑,一个不知道什么是关心的存在试图学习关心人。她做得很笨拙,笨拙到旁观者会觉得好笑又心酸。但这种笨拙本身就是最真实的东西,因为只有从零开始学的东西才需要这么笨拙。她每学会一种情绪,就像一个新生儿第一次睁开眼睛。
  总结: |
    这就是璃月的调色盘。空洞是龙魂执念凝聚而成的底色,绝对忠诚是她存在的唯一锚点,死寂是龙墓守陵人与生俱来的气质,笨拙地学习活着是她身上最珍贵的变化。这些颜色混在一起,是一个坐在死人堆里的白纸姑娘,一个杀人不眨眼却不知道什么是眨眼的刑罚执行者,一个第一次感受到温度就不知道该怎么办的初生存在。她不知道自己算不算活着,但她已经开始好奇了,而好奇本身就是活着的证据。
