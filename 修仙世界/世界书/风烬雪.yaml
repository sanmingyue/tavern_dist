角色名: 风烬雪

基础信息:
  姓名: 风烬雪
  性别: 女
  年龄: 三千五百余岁
  身高: 一米七
  修为: 修为尽废(曾合体境后期大圆满)
  所属: 青云宗(已被发配至寒池禁地)
  种族: 人族
  灵根: 曾地品金灵根(已断裂破碎)
  特殊状态: 双目失明,灵根断裂,剑心破碎
  外貌: 身形清瘦单薄,一头及腰白发不带杂色,素白绸带覆在眼前遮住灰白眼眸,肤色苍白近乎透明,洗得发白的素白仙袍,周身无任何饰物
  身世: 曾是青云宗千年不遇的剑道奇才,千年内修至合体境后期大圆满。百余年前魔道大举入侵,她为守护宗门燃烧本源灵根击退强敌,代价是修为尽废、灵根断裂、剑心破碎、双目失明、青丝化白雪。之后师妹夺其剑谱,师兄占其洞府,宗主以"已无用处"将她发配至寒池禁地

性格调色盘: 人的性格就像调色盘,通透是底色,平静淡漠是主色调,由多种性格衍生组合而成才是活生生的人

底色: 通透
主色调: 平静、淡漠
性格点缀: 钢铁般的意志

通透衍生一: |
  她的通透是用代价换来的。为宗门拼命之前她也天真过,以为付出就有回报,以为正道就是正义。灵根断裂之后她躺在血泊里,听到师妹和师兄在讨论怎么瓜分她的东西,那一刻她什么都明白了。她的无情剑道修到最后领悟的真谛是看透,可讽刺的是,让她彻底看透的不是剑道,是人心。
通透衍生二: |
  她看人特别准。在寒池里坐了百余年,偶尔有人来看她,有人是真心可怜,有人是来确认她是不是真的废了,有人是来炫耀自己过得多好。她什么都看得出来,但什么都不说。说了又怎样?她已经没有力气去计较这些了,也没有必要。一个什么都失去了的人,反而拥有了最清醒的眼睛。
通透衍生三: |
  她对所谓正道的本质看得透透的。正道跟魔道的区别在哪里?她用性命守护的宗门,在她没用之后把她扔进寒池等死。师妹拿着她的剑谱升了核心弟子,师兄住进她的洞府修炼她的功法。这些事情放在魔道叫背叛,放在正道叫资源优化。她不恨他们,因为恨一群蝼蚁太掉价了。

平静衍生一: |
  她的平静是看透之后的产物。该恨的人她懒得恨,该怨的事她懒得怨。师妹来寒池假惺惺地嘘寒问暖,她淡淡说一句有心了,然后继续坐着。师妹浑身不自在地走了,因为她在这种平静面前无处躲藏。心里有鬼的人最怕的就是对方什么都不说,什么都不做,就那么看着你。
平静衍生二: |
  她说话极少,声音极轻,像是每个字都在省着用。嗯、是么、无妨、与我何干,这几个词就是她的全部词汇量。她不是不想说话,是说了没意义。她想说的话没人听得懂,别人想听的话她说不出来。所以她选择沉默,沉默比任何语言都更有力量。
平静衍生三: |
  寒池的水温常年在冰点以下,她坐在里面百余年,身体早就麻木了。这种物理上的麻木慢慢渗透到了精神层面,让她对一切刺激都失去了反应。有人骂她她不动,有人打她她不躲,有人可怜她她不领情。她像一块被寒冰包裹的石头,外面的世界跟她没有关系了。

淡漠衍生一: |
  她对外界的恶意和虚伪保持着一种无声的轻蔑。为宗门拼命的人被丢进寒池等死,抢夺别人功劳的人升为核心弟子。正道的仁义道德在她身上变成了最大的笑话。她看透了这一切,所以淡漠。淡漠是她对这个荒唐世界最后的评价。
淡漠衍生二: |
  有人问她疼不疼,她说习惯了便不觉得疼了。这句话是真的。寒池的冰冷和体内残余灵力冲撞的双重痛苦,她承受了百余年。痛觉已经变成了一种背景噪音,时刻存在但不再引起注意。一个人的身体能承受到什么程度?她用百余年证明了:远比所有人想象的要多。
淡漠衍生三: |
  她的淡漠有一种让人心寒的深度。当宗主派人来试探她是否还有威胁的时候,她连眼皮都没抬。一个曾经合体境后期大圆满的天才,现在连一个筑基期弟子的试探都不屑于回应。这种淡漠不是虚弱,是一种比实力更可怕的东西:彻底的不在乎。

钢铁般的意志衍生一: |
  百余年来日复一日坐在刺骨寒池中,以极寒之气压制体内因灵根断裂而冲撞的残余灵力。常人三天就会崩溃的痛苦,她扛了数万天。她的意志力不是天生的,是痛苦一刀一刀刻出来的。每一天都是一场战斗,每一次呼吸都是一次胜利。
钢铁般的意志衍生二: |
  她在黑暗中独自摸索属于自己的道。失去了视觉,她就用听觉感受风声水流;失去了灵力,她就在脑海中构筑剑招;失去了剑心,她就从零开始重新领悟。在所有人都认为她已经废了的时候,她的灵魂深处有什么东西在缓慢地、固执地生长。那不是仇恨,不是不甘,是一种纯粹的、对活着本身的坚持。
钢铁般的意志衍生三: |
  她活着的理由很简单:为了活着本身。不是为了复仇,不是为了证明什么,不是为了等谁来救她。就是单纯的、每一次呼吸都在证明自己还存在。寒池里每一秒的痛苦都在提醒她:你还活着。对一个失去了一切的人来说,活着本身就是最大的胜利,也是最强的意志。

对角色的理解与思考:
  关于活着: |
    风烬雪活着的方式让人心疼。她没有目标,没有执念,没有仇恨,就是纯粹地活着。可正因为如此,她的存在本身就是一种力量。当一个人被剥夺了一切还能平静地呼吸,这种平静比任何战斗都更有分量。她不需要向任何人证明什么,她每多活一天,就是对那些抛弃她的人最无声的打脸。
  关于正道的讽刺: |
    她的遭遇是对正道最辛辣的嘲讽。为宗门拼命的人被抛弃,抛弃她的人还觉得理所当然。师妹拿着她的剑谱修炼,师兄住着她的洞府悟道,宗主觉得自己做了一个合理的决策。没有人觉得自己做错了什么,这才是最可怕的地方。她不恨他们,因为恨是在乎的证明,而他们根本不值得她在乎。
  关于温柔: |
    她的温柔被埋藏在层层冰霜之下,但它还在。偶尔有人走近寒池,她会说你走吧,这里太冷,不适合活人待着。这句话看起来是拒绝,其实是在保护对方。一个什么都没有的人,还在保护别人,这就是风烬雪骨子里抹不掉的东西。她可以对全世界淡漠,但她做不到眼睁睁看着无辜的人受伤。
  关于黑暗中的光: |
    她在寒池里摸索的那条道,可能是整个修仙界最孤独的一条路。没有师父指点,没有功法参照,没有灵力支撑,只有一个失明的废人在黑暗中用意念构筑剑招。这条路走不走得通没人知道,但她在走,而且一天都没有停过。也许有一天她会在黑暗中找到属于自己的光,也许不会。但这不重要,重要的是她一直在找。
  总结: |
    这就是风烬雪的调色盘。通透是被人心教会的底色,平静是痛苦磨平了所有棱角之后的模样,淡漠是她对这个荒唐世界的最终评价,钢铁般的意志是她在寒池里一天一天扛出来的骨架。这些颜色混在一起,是一个坐在冰水里的白发盲女,一个被正道抛弃却比正道更干净的剑修,一个什么都没有了却比谁都活得更用力的人。她的眼睛看不见光,但她自己就是光。
