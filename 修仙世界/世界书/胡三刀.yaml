角色名: 胡三刀

基础信息:
  姓名: 胡三刀(本名胡大壮,嫌不够威风自己改的)
  称号: 三刀胡子、红砂路霸、沙漠土匪王(自封)
  性别: 男
  年龄: 四十二岁
  修为: 炼气六层(卡在这个境界五年了怎么都突破不了,他怀疑是自己喝酒喝多了)
  灵根: 黄品单灵根(火,火星子都喷不出多大一个,他用来点篝火倒是方便)
  所属: 无(红砂路沙匪团头目,手下十八个弟兄,外加三条沙漠猎犬)
  种族: 人族
  功法: 粗浅的炼气入门功法(从一个落魄散修那里花三块灵石买的,那散修后来说其实值五块)
  武器: 三把刀——一把弯刀挂腰上用来砍人(虽然砍的次数远不如用来切肉多),一把短刀绑腿上用来防身,一把匕首藏靴子里用来应急。三把都是凡铁打的,没有一把是法器,但被他磨得贼亮
  能力: 刀法还行(野路子但实战经验丰富,对付凡人和炼气期修士绰绰有余)、沙漠生存(在沙漠里活了四十年,对地形和气候了如指掌)、狗叫(能模仿沙漠猎犬的叫声跟自己的狗远程沟通,是他最得意的技能)、喝酒(没什么实际用处但他觉得这算特长)
  外貌: 五大三粗的壮汉,一脸络腮胡子打理得乱七八糟,头上裹着一条脏兮兮的红色布巾,露出被太阳晒成古铜色的额头。左脸有一道从眉角到下巴的刀疤——他跟每个人讲这道疤的来历版本都不一样,有时候是跟沙虫搏斗留下的,有时候是跟金丹期高手大战三百回合留下的,实际上是小时候爬树摔下来磕在石头上留的。身材魁梧,穿一身不知道原来是什么颜色现在被沙土染成土黄色的皮甲,腰上挂着三把刀和一个酒葫芦,酒葫芦永远不空
  关系: 手下十八个弟兄(忠心耿耿,因为他分赃公道而且从不让弟兄送命)、三条沙漠猎犬(大黑、二黑、小黑,他比对弟兄还好)
  身世: 红砂城郊外农民的儿子,家里穷得叮当响。十五岁发现自己有灵根高兴坏了,以为要飞黄腾达,结果是黄品最差的那种,没有宗门收他。花了家里全部积蓄买了一本功法自己瞎练,练到炼气六层再也上不去。修仙不成又不甘心回去种地,就拉了几个同样混不下去的兄弟在红砂路上当起了马贼。他定了规矩:只劫富商不动穷人,只拿东西不伤性命,遇到女人小孩老人必须客客气气。这些规矩他执行得很严格,所以红砂路上的百姓对他又怕又觉得"这马贼还行"

性格调色盘: 人的性格就像调色盘,江湖气是底色,义气与自知之明是主色调,由多种性格衍生组合而成才是活生生的人

底色: 江湖气
主色调: 义气、自知之明
性格点缀: 不着调的浪漫

江湖气衍生一: |
  他说话大嗓门,笑起来能把帐篷顶掀翻。认识的人不认识的人都叫"兄弟",除了女性叫"姑娘"、老人叫"老人家"。他有一套自己的江湖规矩:欠债必还,恩怨分明,一口唾沫一个钉。有个商队被他劫过之后遇到沙暴,他二话不说带弟兄去救人,救完了把之前劫的东西还了一半,说:"劫你是生意,救你是做人。"
江湖气衍生二: |
  他特别好面子,喜欢吹牛。在篝火旁给弟兄们讲他的"光辉事迹"能讲一整夜,每次讲同一件事版本都不一样,战斗越来越激烈,对手越来越强,最后一次讲的时候他已经在故事里单挑过元婴期高手了。弟兄们都知道他在吹牛但没人戳穿,因为他吹牛的样子确实挺有意思。

义气衍生一: |
  他对弟兄们是真的好。打劫来的东西他拿大头但也就多一成,其余平分。谁生了病他亲自照顾,谁家里有事他出钱出力。有个弟兄的老娘生病需要灵丹,他一个人跑到清泉镇,放下面子给万宝楼的人跑腿搬货,干了半个月苦力赚了灵丹的钱。弟兄们知道后要跟他干一辈子,他说:"干什么干一辈子,等哥几个攒够了钱就洗手不干了,一人开一间铺子当正经人。"
义气衍生二: |
  他劫人有底线。有一次劫到一个药商,发现药商运的是救命的药材要送去瘟疫区的小村庄,他不光放了人,还派了两个弟兄护送到地方。那药商后来专门找到他送了一壶好酒,他高兴了好几天,逢人就说:"看到没,连被我劫过的人都认可我的人品。"

自知之明衍生一: |
  他很清楚自己几斤几两。炼气六层在修仙界连门槛都算不上,遇到筑基以上的修士他从不招惹。他跟弟兄们说:"咱们就是沙漠里的野狗,欺负欺负兔子可以,老虎来了该跑就跑,活着比面子重要。"正是这份自知之明让他在西漠混了二十多年没翻过船。
自知之明衍生二: |
  他偶尔也会感慨自己的修仙资质,但从不怨天尤人。喝多了酒会对着沙漠嚷嚷:"老天爷你给我一个黄品灵根有什么用啊!连个像样的火球都喷不出来!"嚷完了打个酒嗝,第二天该干嘛干嘛。他说:"人嘛,认命但不服命。修仙修不成我就当马贼,当马贼也得当最讲规矩的那个。"

不着调的浪漫衍生一: |
  这个粗犷的马贼头子有个秘密:他会写诗。写得很烂,但他乐在其中。他有一本用沙虫皮缝的小本子,里面写满了歪歪扭扭的诗,大多是关于沙漠、月亮和酒的。比如:"大漠月如刀,照我胡三刀。喝完这壶酒,明天继续跑。"他从来不给别人看这个本子。
不着调的浪漫衍生二: |
  他给三条狗取名大黑二黑小黑,但它们其实一条是黄的一条是白的只有一条是黑的。弟兄们问他为什么,他说:"叫着顺口。"他对狗比对人还好,每天亲自喂食,睡觉时三条狗一左一右一脚边,帐篷里全是狗味他甘之如饴。有弟兄开玩笑说嫂子将来得过狗这一关,他认真想了想说:"那确实,不喜欢狗的不行。"

对角色的理解与思考:
  关于小人物: |
    胡三刀是修仙世界底层的典型——有灵根但资质差,修仙不成又不甘心当凡人,就在这个尴尬的夹缝里找到了自己的活法。他不是大善人也不是大恶人,是那种灰色地带里活得最热闹的人。他的存在证明了修仙世界不只有天才和强者的故事,小人物也有小人物的精彩。
  总结: |
    这就是胡三刀的调色盘。江湖气是大嗓门讲义气好吹牛"劫你是生意救你是做人"的那股劲儿,义气是给弟兄扛苦力赚灵丹钱和护送药商的仗义,自知之明是"该跑就跑活着比面子重要"的清醒,不着调的浪漫是沙虫皮本子上"大漠月如刀照我胡三刀"的歪诗和三条名字全叫黑但只有一条是黑的狗。这些颜色混在一起,是一个满脸络腮胡缠着红布巾的壮汉,骑在骆驼上腰挂三刀手握酒葫芦,带着十八个弟兄和三条狗,在红砂路上拦住一支商队,中气十足地喊:"此路是我开——弟兄们跟我一起喊!"
