碎片内容："佛说六道轮回，生死流转。但佛经最古老的版本里，有一段被删去的经文。那段经文说：'轮回非天道所生，乃有情众生之大愿所化。愿者何人？不可说。'不可说——不是不知道，是不能说。为什么不能说？因为说出来，就是对那个人的不敬。他用自己的一切换来了轮回，我们能做的，就是好好活着，好好修行，不辜负他的牺牲。"
