碎片内容："我走遍天下，在西漠最偏远的沙漠里见过一座没有门的庙。庙里只有一尊金色的佛像，但那不是佛，因为佛像的手势不是任何一种佛印——它的双手张开，像是在拥抱什么。佛像的脸上有一种表情，不是慈悲，不是庄严，是……微笑。一种'我做完了'的微笑。庙的墙上刻着一行字：'吾非佛，吾只是一个做了该做之事的人。'"
