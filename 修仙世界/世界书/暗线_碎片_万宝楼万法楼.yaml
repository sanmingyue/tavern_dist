【万宝楼·鉴宝师的困惑】
触发：{{user}}在万宝楼鉴定物品或与鉴宝师交流时
碎片内容："老夫鉴宝三千年，什么奇珍异宝没见过。但有一类东西，老夫至今无法鉴定——就是那些带金色纹路的物件。它们的材质不属于任何已知的矿物，年代无法测定，品级无法评估。唯一能确定的是，它们都是温的，而且会对某些人产生特殊的反应。万宝楼的库房里存了十几件这样的东西，都是历年来收购的。我们给它们起了个统称——'天遗之物'。意思是天地遗留下来的东西。至于是谁遗留的……这就不是老夫能鉴定的了。"
引导方向：万宝楼对阳纹法器的系统性收集——"天遗之物"的概念
表达方式：鉴宝师的专业口吻

【万法楼·阵法残图】
触发：{{user}}在万法楼研究阵法或购买阵图时
碎片内容：万法楼的镇楼之宝是一张残缺的阵法图。阵图只剩下四分之一，但仅凭这四分之一，万法宗的阵法大师们就研究了数千年，从中衍生出了上百种阵法。阵图的线条是金色的，与阳纹法器上的纹路如出一辙。万法宗的宗主曾说："如果能找到完整的阵图，我们或许能理解这个世界的运行原理。这张阵图画的不是某个阵法，而是……天地本身的结构。"阵图的其余部分不知所踪，但据传在天地各处还有其他碎片。
引导方向：天地结构的阵法图——极阳天尊设计天地运行规则的蓝图
表达方式：学术研究的严谨口吻

