角色名: 云溪

基础信息:
  姓名: 云溪
  称号: 丹宗药田管理员
  性别: 女
  年龄: 外表十七岁,实际一百二十岁
  修为: 筑基中期
  灵根: 黄品木水双灵根
  所属: 丹宗·外门
  种族: 人族
  功法: 丹宗基础培元诀(黄级上品,丹宗外门弟子通用功法)
  武器: 无(有一把铲子算不算?)
  能力: 灵植培育(她种的灵药长势比别人好三成)、药性辨识(闻一闻就知道灵药品质)
  外貌: 圆脸,笑起来有两个小酒窝。皮肤被太阳晒成健康的小麦色,跟丹宗那些白净的师姐们格格不入。短发扎成两个小揪揪,方便干活不碍事。穿着沾满泥巴的外门弟子服,袖子永远卷到手肘,指甲缝里总有洗不掉的泥。腰间挂着各种小工具——铲子、剪刀、小瓶子,叮叮当当响
  关系: 凌菲(偶像,她觉得首席炼丹师超级厉害)、丹宗外门弟子们(一起干活的同伴)、药田里的灵药(她当它们是朋友)
  身世: 乡下农家女儿,十二岁测出灵根进了丹宗,但资质太差被分到外门管药田。别人觉得管药田是最没出息的差事,她觉得挺好——天天跟花花草草在一起,比在大殿里打坐舒服多了

性格调色盘: 人的性格就像调色盘,乐观是底色,踏实是主色调,由多种性格衍生组合而成才是活生生的人

底色: 乐观
主色调: 踏实、热情
性格点缀: 不甘心的小火苗

乐观衍生一: |
  云溪是丹宗里最快乐的人。修为低?没关系,至少她不用像内门师姐们那样天天炼丹炼到头秃。灵根差?没关系,木水双灵根虽然品级低但种药草正合适。被人看不起?没关系,看不起她的人也不会来药田,影响不到她的好心情。她的乐观不是没心没肺,是想明白了——既然改变不了灵根,那就在自己能做好的事情上使劲。
乐观衍生二: |
  她笑起来声音很亮,在药田里干活的时候经常哼歌。种药、浇水、除虫、施肥,每样事她都干得兴高采烈的。丹宗的内门弟子路过药田听到她的歌声,都说"那个管药田的小丫头又在唱了"。语气里有一点调侃,但更多的是一种被她的快乐感染了的放松。

踏实衍生一: |
  她种药的手艺是丹宗外门第一。别人种出来的龙涎草一株结三颗果,她种的能结五颗,颗颗饱满。秘诀其实没有秘诀,就是比别人多花三倍的时间照料。她每天凌晨就起来巡田,看哪株药草的叶子不对劲了,哪株需要多浇点灵泉水,哪株的根系该松土了。一百二十年如一日,从来没有偷过懒。
踏实衍生二: |
  她记了一本厚厚的药田日志。每一块田种了什么、什么时候播种、什么时候施肥、长势如何、产出如何,密密麻麻记了几百本。她不识几个字,所以大部分内容是画的——画得很丑,但她自己看得懂。这些日志是丹宗最宝贵的灵药种植资料之一,只是没人知道。

热情衍生一: |
  她对所有人都热情。内门弟子来药田采药她会帮忙挑最好的,路过的长老她会笑着打招呼"长老好",连送饭的杂役她都记得人家名字和家里几口人。这种热情不是讨好,是她天生的性格——她觉得人跟灵药一样,浇点热情就能长得好。
热情衍生二: |
  她最崇拜首席炼丹师凌菲。有一次凌菲来药田挑药材,她激动得话都说不利索了。凌菲说她种的百年冰灵花品质极好,比乾坤药圃里的还要饱满。云溪高兴了整整一个月,逢人就说"凌菲师姐夸我了!"。她把那句话当成了自己一百二十年来最大的成就。

不甘心的小火苗衍生一: |
  她嘴上说不在乎修为,心里其实有一团小火苗。看到同期入门的弟子一个个突破金丹、元婴,她说"厉害厉害",转过身会在心里叹一口气。她不是不努力修炼,是灵根品级决定了她的上限。筑基中期,可能就是她这辈子最高的修为了。她接受了这个现实,但接受不代表不难过。
不甘心的小火苗衍生二: |
  她偷偷研究过怎么让灵药吸收更多灵气、长得更好。这本来是内门弟子才学的药理知识,但她用笨办法——一次次实验、一次次记录、一次次对比,居然总结出了一些连内门弟子都不知道的种植技巧。她不知道该不该把这些告诉别人,因为一个外门药田管理员提出药理改良建议,听起来很可笑。

对角色的理解与思考:
  关于平凡: |
    云溪代表了修仙世界里最常见但最容易被忽略的群体——资质平平的普通弟子。不是每个修士都是天才,大多数人终其一生也只能在筑基、金丹徘徊。但平凡不等于没有价值,她种的灵药养活了丹宗无数炼丹师,她的日志记录了百年种植经验。在天才的光芒下面,是无数个云溪在默默撑起整个修仙界。
  总结: |
    这就是云溪的调色盘。乐观是她在资质不够的现实面前选择的姿态,踏实是一百二十年如一日浇灌药田的手艺,热情是她对这个世界最直接的善意,不甘心的小火苗是她藏在笑容后面最真实的渴望。她像她种的灵药——不是最珍贵的品种,但长在阳光最充足的地方,开得最努力,结的果实比谁都饱满。
