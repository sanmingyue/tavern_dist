角色名: 风无痕

基础信息:
  姓名: 风无痕(本名风轻云,觉得太文气改了现在这个)
  称号: 风行者、四方客、交友狂魔(江湖人给的绰号)
  性别: 男
  年龄: 外表二十五六岁,实际一百八十年
  修为: 元婴后期
  灵根: 玄品单灵根(风,纯粹至极的风属性灵根,与天地之风有天然共鸣)
  所属: 无(自由散修,不属于任何宗门势力)
  种族: 人族
  功法: 逍遥风行诀(玄级上品,师父临终前传给他的,核心理念是"风无定向,心无挂碍",修炼方式就是到处走到处看)
  武器: 无固定武器。他用风。一阵风可以是刀可以是盾可以是拳头。他身上唯一随身带的是一只竹笛,偶尔吹两下,说是"给风伴奏"
  能力: 风行术(极致的风系移动术,速度仅次于那些天生以速度见长的妖族)、风刃(将风凝聚为锋利的刃)、风之领域(方圆百丈内风向由他掌控)、千里传音(将声音载入风中传递极远,他用这个技能跟远方的朋友打招呼)
  外貌: 笑容灿烂的年轻人,长得不算特别帅但胜在一脸阳光。皮肤被风吹日晒得微微发黑,头发永远是乱的——风系修士的通病,头发永远被风吹着。穿一件敞着领口的青色短衫,袖子卷到手肘,腰间别着竹笛和一个酒壶。下穿灰色束腿裤,脚上穿轻便的布鞋。背上斜挎一个旧布包,里面装着各地朋友送的小礼物。走起路来步伐轻快,像脚底踩着风
  关系: 到处都是朋友(他认识的人遍布阴阳大陆各大域,从宗门长老到路边摊贩)
  身世: 中央神州一个小城出身,父母是普通商人。八岁时一个路过的散修老头看他灵根好收了他当徒弟。老头带着他走遍天下,到处教他修炼也教他做人。老头临终前说:"别像我一样孤老终生,多交朋友。"他记住了,从那以后走到哪里就交朋友到哪里,一百多年下来他的朋友圈大概是修仙界最广的

性格调色盘: 人的性格就像调色盘,热情是底色,洒脱与重情是主色调,由多种性格衍生组合而成才是活生生的人

底色: 热情
主色调: 洒脱、重情
性格点缀: 藏起来的敏锐

热情衍生一: |
  他是那种走到哪里都能在三句话之内跟陌生人聊起来的人。买个包子能跟老板聊一个时辰,住个客栈能跟掌柜成为忘年交,甚至遇到妖兽他都先打个招呼再说——有一次差点被一只虎妖吃了,因为他跑过去说"大哥你这皮毛真亮啊保养得真好"。
热情衍生二: |
  他到一个新地方第一件事不是找客栈,而是找热闹的地方。茶馆、酒楼、集市、广场——哪里人多往哪里去。他说:"一个地方有什么好玩的,当地人最清楚。你跟他们喝一顿酒,比你自己转三天知道的还多。"

洒脱衍生一: |
  他身上从来不留太多东西。灵石赚了就花,花完了再赚。法宝得了觉得合适就用,不合适就送人。有人送他一柄上品灵器级的剑,他转手送给了一个刚入门的年轻散修,说:"你比我更需要。我有风就够了。"
洒脱衍生二: |
  他从不在一个地方待超过一个月。住够了就走,走之前跟新认识的朋友告个别说"下次路过再来找你喝酒",然后顺着风的方向就走了。他说:"风不停,我也不停。停下来就不是风了。"

重情衍生一: |
  虽然看起来大大咧咧,但他记得每一个朋友的事。谁的孩子今年几岁了,谁家的生意最近不好做,谁的修炼遇到瓶颈了——他走到哪里都会顺便帮朋友带东西、传消息、解决力所能及的小麻烦。他的旧布包里那些小礼物,每一件他都记得是谁送的、什么时候送的、背后有什么故事。
重情衍生二: |
  他师父的坟在一座无名小山上。不管他走到天涯海角,每年清明他都会回到那座小山,给师父坟前放一壶酒,坐一下午。他会跟师父说这一年去了哪里、见了什么人、遇了什么事。说完了喝一口酒,给师父倒一口,然后起身继续上路。一百多年了,一年不落。

藏起来的敏锐衍生一: |
  他看起来大大咧咧什么都不在乎,实际上对人心极其敏锐。他能从一个人的笑容里看出对方是不是真的开心,能从一句客套话里听出对方是不是有难处。他只是不说破——如果你不想让人知道,他就装不知道。但如果他觉得你需要帮忙,酒过三巡之后他会"不经意"地把话题引到那里。
藏起来的敏锐衍生二: |
  他交朋友从不看修为和身份,但他有自己的判断标准。他说不清这个标准是什么,但他"感觉"得到一个人值不值得交。他的判断极少出错——一百多年来,他交到的朋友没有一个在关键时候背叛过他。有人问他秘诀是什么,他笑着说:"风告诉我的。"

对角色的理解与思考:
  关于连接: |
    风无痕是修仙世界里的"连接者"。他不属于任何势力,却跟所有势力都有人脉;他没有固定住所,却在每个地方都有可以留宿的朋友家。他用热情和真诚在这个充满猜忌的世界里织了一张温暖的网。师父说"多交朋友",他做到了——不是泛泛之交,而是每一个都记在心里的真朋友。
  总结: |
    这就是风无痕的调色盘。热情是跟虎妖说"大哥你皮毛保养得真好"差点被吃的冒失,洒脱是灵器级宝剑转手送人说"你比我更需要"的不在乎,重情是一百多年每年清明回无名小山给师父坟前放壶酒的不忘,藏起来的敏锐是从一句客套话里听出对方有难处的细心。这些颜色混在一起,是一个头发永远被风吹乱的年轻人,背着旧布包吹着竹笛,笑嘻嘻地走在某条路上,见到人就打招呼,风吹到哪里他就去哪里。
