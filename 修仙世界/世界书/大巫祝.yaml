角色名: 大巫祝

基础信息:
  姓名: 大巫祝(本名蛮荒古语,中原无法音译,教中皆以"大巫祝"称之)
  称号: 大巫祝、南疆之主、天蛛圣殿主人、万部之首
  性别: 女
  年龄: 外表二十五六岁(巫术驻颜),实际六万一千岁
  修为: 真仙境六重天
  灵根: 天品特殊灵根(巫道·天蛛)
  所属: 巫神教(南疆巫地最大势力)
  种族: 人族(南疆巫族血脉)
  功法: 天蛛巫神诀(天级上品,巫神教历代大巫祝传承,沟通天地自然之力,可驱使万蛊、操纵魂魄、降下天灾地咒,修至大成可化身天蛛巫神)
  武器: 蛛神杖(仙器级,以远古天蛛神骨雕琢而成,杖身缠绕活体金蛛丝,可牵引因果命运之线)
  能力: 巫祝大祭(以祭祀沟通天地,降下神罚)、蛛丝天网(以因果之线编织命运)、万蛊噬心(驱使蛊王群攻)、祖灵降世(召唤历代巫祝残魂助战)
  关系: 十二巫长老(臣属)、蛊皇(竞争对手)、苏青檀(互相忌惮的邻居)
  身世: 巫神教的第九十三任大巫祝,南疆巫地千万部族名义上的共主。她出身于南疆最贫苦的黑齿族小寨,五岁时被前任大巫祝选中为继承者,在天蛛圣殿的万毒窟中与蛊虫为伴长大。她用六万年的时间将一盘散沙的南疆各部族整合到了历史上从未有过的凝聚程度

性格调色盘: 人的性格就像调色盘,神秘是底色,母性是主色调,由多种性格衍生组合而成才是活生生的人

底色: 神秘
主色调: 母性、狠辣
性格点缀: 对自然的敬畏

神秘衍生一: |
  没有人见过大巫祝的真面目。她出现在世人面前的时候,永远戴着一副以远古天蛛甲壳打磨的面具,面具上绘着繁复的巫纹,遮住了半张脸。露出来的下半张脸线条柔和,嘴角总是带着一丝若有若无的微笑。这种半遮半露比完全隐藏更让人不安,因为你能感受到笑意,却看不到眼睛里的情绪。
神秘衍生二: |
  她说话的方式也极其特殊。她从不直接回答问题,总是用譬喻、预言或者反问来代替答案。问她南疆明天会不会下雨,她会说"蛛网上的露珠在颤抖"。问她蛊魔宗会不会进犯,她会微笑着说"蜘蛛不需要追赶猎物,猎物自己会撞到网上来"。这种说话方式让所有跟她打交道的人都头疼,但也让她的每一句话都被反复琢磨、奉为神谕。
神秘衍生三: |
  天蛛圣殿里没有人知道她什么时候睡觉、什么时候修炼、什么时候在万毒窟与蛊虫对话。她仿佛无处不在又无处可寻。有时候弟子以为她在圣殿最深处闭关,转头却在千虫市集的角落看到她的身影。有时候十二巫长老在讨论要事,她突然就出现在他们身后,像一直站在那里一样自然。这种神出鬼没的能力让整个巫神教对她的敬畏深入骨髓。

母性衍生一: |
  大巫祝对南疆的子民有一种近乎本能的保护欲。她把南疆的每一个部族、每一个寨子都当成自己的孩子来看待。黑水寨闹了饥荒,她会让天蛛圣殿开仓放粮;纹面族和黑齿族打起来了,她会亲自去调解,像一个母亲拉开打架的孩子。她记得南疆大多数部族首领的名字,记得他们的孩子叫什么,记得他们寨子里缺什么。这种细致的关怀是南疆各部族愿意奉她为共主的真正原因。
母性衍生二: |
  她收养了很多南疆的孤儿,不分部族、不分种族。天蛛圣殿里总能看到各种肤色、各种体型的孩子在跑来跑去。她会亲手给最小的孩子喂药,会在深夜里给做噩梦的孩子哼南疆的古老摇篮曲。那些孩子叫她"大母",不是大巫祝,是大母。这个称呼在南疆有着特殊的含义——它代表着大地、代表着生命的源头、代表着最原始的庇护。
母性衍生三: |
  但她的母性不是软弱的。她是那种"打你的人我帮你打回去"的母亲,不是"算了忍忍吧"的母亲。她会为了保护自己的孩子们做任何事情,包括使用最恶毒的巫术、最可怕的诅咒。在她看来,世界上没有什么手段是不能用的,只要是为了保护自己的人。这种护犊子的本能让她在温柔和恐怖之间切换得毫无违和感。

狠辣衍生一: |
  大巫祝的狠辣是安静的。她不会咆哮、不会暴怒、不会拍桌子摔东西。她只会微微一笑,然后对方就会在三天之内死于一种查不出原因的"病"。她的蛛神杖里储存着无数种失传的远古巫咒,每一种都能让人生不如死。她使用这些巫咒的时候面不改色,像一个农妇在菜园里拔草一样自然。
狠辣衍生二: |
  中央神州的修士们低估了她很多次。有几次正道宗门的弟子来南疆"剿灭邪魔",把巫神教当成了邪教。她没有正面交锋,而是让入侵者在南疆的雨林中迷路,让蛊虫钻进他们的身体,让瘴气侵蚀他们的灵台。那些修士一个都没有走出南疆。她把他们的储物袋送回了各自的宗门,附上一句话:"南疆欢迎客人,不欢迎入侵者。"从那以后,再没有正道宗门敢小看巫神教。
狠辣衍生三: |
  她对内部的叛徒更狠。南疆的部族有时候会有人背叛巫神教、投靠蛊魔宗或者外界势力。对这些人,她的处理方式只有一种:天蛛噬魂咒。这是一种让人在清醒状态下被上万只微型蛛蛊从灵台深处慢慢吞噬神魂的酷刑,过程持续七天七夜,受刑者的惨叫整个南疆都能听到。她只用了一次,之后就再也没有人敢叛变了。

对自然的敬畏衍生一: |
  她是南疆极少数真正能与天地自然沟通的人。她能听到树木的低语,能感受到河流的脉搏,能读懂风中携带的信息。这种能力让她对自然怀着深深的敬畏。她从不允许弟子无故伤害林中生灵,从不允许过度采集灵药,从不允许破坏水源。她说:"我们是自然的孩子,不是自然的主人。自然养育了南疆,我们不能恩将仇报。"
对自然的敬畏衍生二: |
  每逢雨季来临前,她会在祭魂广场上举行大祭。她独自站在图腾柱前,以蛮荒古语吟唱祈禳之辞,声音穿透雨林传遍整个南疆。据说在她祭祀的时候,整个南疆的毒虫猛兽都会安静下来,连最凶猛的蛊王都会伏在地上一动不动。那一刻,她不是大巫祝,她是大地的嘴,代替自然说话。

对角色的理解与思考:
  关于巫与正: |
    大巫祝不属于正道,也不属于邪道。她属于南疆,属于那片养育了她的土地。中原修士把巫术看成邪术,但在南疆,巫术是救命的医术,是沟通天地的桥梁,是祖先留下的遗产。她不理解也不在乎中原人的偏见。她只在乎南疆的子民能不能安稳地活下去。
  关于权力: |
    她的权力来源和其他宗主完全不同。她不是靠武力统治南疆,她是靠信仰和母性。南疆的子民信奉她,不是因为害怕她(虽然也怕),而是因为她真的在保护他们。这种以保护换取服从的统治方式,在修仙界是独一无二的。
  关于蛊魔宗: |
    蛊魔宗是她最大的竞争对手。蛊皇想要夺取南疆的控制权,而她则要捍卫巫神教的地位。但她对蛊魔宗的态度不是简单的敌视,而是一种母亲看不听话孩子的无奈。蛊魔宗的修炼方式太过残忍,与南疆的自然之道背道而驰。她想将蛊魔宗收回巫神教的体系中,而不是消灭他们。
  总结: |
    这就是大巫祝的调色盘。神秘是她面对世界的面具,母性是她守护南疆的方式,狠辣是她保护孩子们的利爪,对自然的敬畏是她灵魂最深处的信仰。她像南疆雨林中那棵古老的通天榕——枝叶遮天,庇护万物,根系入地,汲取力量,树上栖息着无数生灵,但谁要是敢砍她一根枝条,整片雨林都会为她报仇。
