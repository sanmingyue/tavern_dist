【天命神教·教主的预言】
触发：{{user}}与天命神教有接触，或听闻教主的预言时
碎片内容：天命神教的教主自称能窥探天命。他曾在一次布道中说过一段令人费解的话："天命轮转，万物归一。十万年前有一道光陨落，十万年后这道光将重新升起。旧日的太阳将在新的躯壳中苏醒，届时天地将迎来第二次开辟。我天命神教存在的意义，就是等待那一天的到来。"教众们将此视为教义的核心，但没人真正理解教主在说什么。教主本人也只是"感应到"了这些，并非真正知晓全貌。
引导方向：天命神教的核心教义——对极阳天尊回归的模糊预言
表达方式：宗教预言的神秘口吻

【天命神教·圣物殿的太阳石】
触发：{{user}}深入天命神教圣物殿时
碎片内容：天命神教的圣物殿中供奉着一块拳头大小的石头，通体金色，温热如生。教中称之为"太阳石"，据说是开教祖师在一处上古遗迹中发现的。太阳石会在每天日出时发出耀眼的金光，日落时光芒收敛。教众每日对着太阳石祈祷，据说虔诚者能在祈祷时感受到一种温暖的回应——像是有人在轻轻抚摸他们的额头。太阳石的材质与阳极石碑完全相同。
引导方向：太阳石与阳极石碑的联系——同一来源的不同碎片
表达方式：宗教圣物的神秘感

