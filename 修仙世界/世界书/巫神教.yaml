巫神教:
  势力定位: 南疆最大势力，巫道传承

  核心理念: 敬天畏地，侍奉巫神

  修炼体系:
    巫术: 祈禳、诅咒、沟通天地自然
    蛊术: 培育蛊虫，以蛊杀敌
    魂术: 操控魂魄，驱使鬼物

  势力特色:
    南疆霸主: 统治南疆大部分区域
    部族联盟: 并非单一组织，而是无数部族的联盟
    信仰为纽带: 通过巫神信仰维系各部族
    神秘诡异: 巫术体系与中原修真迥异

  与外界关系:
    与中央神州: 关系复杂，既有敌对也有交易
    与蛊魔宗: 竞争关系，争夺南疆控制权
    与赤阳谷: 边境摩擦不断

  势力规模:
    大巫祝: 教主
    十二巫长老: 十二位
    各部族巫师: 十余万人
    信徒: 数亿（整个南疆巫地）
    附属势力: 千虫市集、黑水寨等，统治整个南疆

  特色资源:
    蛊虫: 南疆特有的奇异蛊虫
    巫器: 各类巫术法器
    祖灵之力: 沟通祖灵获得力量
    巫药: 独特的巫药配方

  总坛地点:
    位置: 南疆巫地·巫神山
    环境: 原始雨林，毒瘴弥漫
    建筑: 天蛛圣殿，巨大地下洞窟群

  附属城镇:
    千虫市集: 南疆最大的毒物蛊虫交易中心
