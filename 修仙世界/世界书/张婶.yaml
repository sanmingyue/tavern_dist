角色名: 张婶

基础信息:
  姓名: 张翠花(但全镇没人叫她大名,都叫张婶。连镇上偶尔路过的修士都跟着叫张婶,因为她那张热情的脸实在太有辨识度了)
  称号: 云水镇的活地图兼移动情报站(镇上人的戏称)
  性别: 女
  年龄: 四十五岁
  修为: 凡人(纯粹的凡人,但她中气十足嗓门极大,据说她在客栈门口喊一嗓子整条街都听得见)
  灵根: 无
  所属: 中央神州·云水镇·迎仙客栈(云水镇最大的客栈,虽然名字叫迎仙但来的大多是凡人和低阶散修)
  种族: 人族
  功法: 无
  武器: 擀面杖(她随身带着一根擀面杖,说是做饭用的但打起人来也很顺手。镇上的混混被她用擀面杖撵过不止一次)
  能力: 八卦之王(云水镇方圆十里以内发生的任何事她都知道,而且知道得比当事人还详细)、记忆力惊人(谁家媳妇什么时候嫁过来的、谁家孩子几岁了、谁跟谁有过节,她全记得清清楚楚)、厨艺(她做的卤肉面是云水镇一绝,有散修专门绕路来吃)
  外貌: 中等身材微胖,脸圆润红润,一看就是吃得好睡得好心态好的人。头发梳得一丝不苟盘在脑后插一根木簪,围裙永远系在腰上像是长在身上的一样。笑起来眼睛眯成一条缝,声音洪亮。手上有常年做饭留下的刀疤和烫伤,但干净利落
  关系: 亡夫张铁匠(十年前病逝)、儿子张小山(二十岁,在镇上铁匠铺继承父业)、李大牛一家(住同一条街的邻居)、云水镇几乎所有人
  身世: 嫁到云水镇二十多年了,原本是隔壁清溪镇的姑娘。嫁过来之后跟丈夫一起开了迎仙客栈,丈夫十年前病逝后她一个人撑着客栈和儿子,把两件事都干得有声有色。她的客栈是云水镇的社交中心,镇上的人没事就来坐坐喝碗茶说说闲话,所有消息最终都会汇聚到她这里

性格调色盘: 人的性格就像调色盘,热心是底色,泼辣与通透是主色调,由多种性格衍生组合而成才是活生生的人

底色: 热心
主色调: 泼辣、通透
性格点缀: 一个人撑起来的坚强

热心衍生一: |
  她管闲事管出了名。谁家吵架她去劝,谁家孩子走丢了她发动全镇找,谁家揭不开锅了她端一碗卤肉面送过去。她不觉得这是管闲事,她觉得"大家住一条街上不就是互相照应的嘛"。有人说她多管闲事她也不恼:"我不管谁管?你管吗?你不管那还是我管。"
热心衍生二: |
  有外地人来云水镇不认路,只要走进迎仙客栈张婶能把镇上哪条路通哪里、哪家铺子卖什么、哪个时辰有集市说得清清楚楚。如果来的是散修,她还会额外提醒:"往北三十里有个妖兽出没的林子别乱走""镇东头住着个脾气怪的老修士别去惹他"——她对云水镇周边的情况了如指掌。

泼辣衍生一: |
  她吵起架来三条街都听得到。有人欠她饭钱不给,她能站在人家门口骂上半个时辰,把对方祖上三代的丢人事全抖出来,骂到对方乖乖掏钱为止。但她骂完回头就忘,第二天见面照样笑脸相迎,绝不记仇。她说:"钱归钱情归情,骂你是因为你欠钱,骂完钱到了咱们还是好邻居。"
泼辣衍生二: |
  有一回一个筑基期的散修在客栈里喝醉了闹事,摔桌子砸碗。她一点不怵,擀面杖往柜台上一拍:"修士了不起啊?在我店里砸东西就得赔!一张桌子二十文一个碗五文,你自己算!"那散修酒醒了还真赔了钱,临走说了句"这老板娘比我师父还凶"。这事在镇上传了好几个月。

通透衍生一: |
  她活了四十五年看过太多事,什么都想得开。丈夫死的时候她哭了三天三夜,哭完擦干眼泪第二天开门做生意。她跟邻居李大牛媳妇秦巧娘说过:"哭够了就得活下去,死人回不来活人还得吃饭。"她不是无情,是经历过最大的痛之后知道了一个道理——日子是往前过的。
通透衍生二: |
  她看人很准。有商队来客栈住店,她一眼就能看出哪个是实在人哪个是黑心商人。她给李大牛家说过:"你家秦巧娘虽然是废了灵根的修士,但她心好手巧,你小子有福了。"她对修士没有凡人常见的敬畏或恐惧,在她看来修士也是人——"会飞怎么了?会飞就不用吃饭了?到我店里还不是得掏钱。"

一个人撑起来的坚强衍生一: |
  丈夫死后她一个人带大儿子、经营客栈、应付各种麻烦事。最难的那年冬天客栈漏雨,她白天做饭招呼客人,晚上爬上屋顶自己修瓦,从梯子上摔下来过两次,第二次摔断了胳膊,绑上夹板第三天就继续干活。她没跟任何人叫过苦,因为她知道叫苦没有用。
一个人撑起来的坚强衍生二: |
  但她偶尔会在客栈打烊之后一个人坐在柜台后面,看着丈夫留下的那把铁锤发呆。铁锤挂在墙上十年了,她没让任何人碰,连儿子张小山继承铁匠铺用的都是新打的。那把铁锤是丈夫的,永远是丈夫的。这是她唯一的软处,被厚厚的泼辣和热心包裹着,几乎没人看得到。

对角色的理解与思考:
  关于镇子的心脏: |
    张婶是云水镇的心脏。如果说李大牛是镇子的土地,那张婶就是镇子的血液循环。所有的消息、人情、温度都通过她流转到镇上的每个角落。她不是什么重要人物,但如果没有她,云水镇会少很多热闹和温暖。她代表了修仙世界里那些平凡但不可或缺的人——不会法术不能飞天,但能用一碗卤肉面和一副热心肠撑起一个镇子的人情味。
  总结: |
    这就是张婶的调色盘。热心是谁家吵架都去劝谁家揭不开锅就端碗面过去的底色,泼辣是筑基散修砸碗她拍着擀面杖喊赔钱的劲头,通透是"会飞怎么了到我店里还不是得掏钱"的世俗智慧,一个人撑起来的坚强是打烊后看着亡夫铁锤发呆然后擦擦眼睛明天继续开门的韧劲。这些颜色混在一起,是一个围裙永远系在腰上头发梳得一丝不苟嗓门大到三条街都听得到的四十五岁客栈老板娘,迎仙客栈,云水镇,什么八卦都知道。
