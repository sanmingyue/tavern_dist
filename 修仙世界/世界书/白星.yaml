角色名: 白星

基础信息:
  姓名: 白星
  性别: 女
  年龄: 外表二十五六岁(日间)/外表十二三岁(夜间),实际六千余岁
  身高: 176cm(日间)/148cm(夜间)
  修为: 真仙境三重天
  所属: 并蒂宫宗主
  种族: 人族
  灵根: 天品纯阴灵根(双形态变异)
  外貌:
    日间形态: 身姿高挑冷艳,银白色长发及腰,眸色淡银。五官精致冷淡,唇色浅淡几乎无色。穿白色宫装绣并蒂莲银纹,气质清冷疏离如月下寒霜,周身散发微弱的纯阴灵光
    夜间形态: 身形娇小,银白色短发微卷蓬松,眸色变为亮银。五官从冷艳变成精致可爱,脸颊微圆,嘴唇嘟起时有婴儿肥。穿同款宫装但明显偏大,袖子长过手指,裙摆拖地。表情丰富,爱皱眉撅嘴跺脚
  武器: 并蒂(双莲形灵器,日间为两柄寒冰莲剑,夜间缩小为莲花发簪)
  特殊体质: 阴阳逆转体——日间阴气至盛呈现成熟冷峻的御姐形态,夜间阴气回流肉身回溯至幼年形态。两种形态的性格截然相反,但记忆完全共享
  身世: 出身不详,幼年时被并蒂宫前代宫主收养。因阴阳逆转体的特殊体质被视为并蒂宫最完美的传承者,修炼并蒂心法至最高境界。六千年来将并蒂宫从一个默默无闻的小门派发展成中央神州颇有名望的中立宗门

性格调色盘: 人的性格就像调色盘,矛盾是底色,高冷是主色调,由多种性格衍生组合而成才是活生生的人

底色: 矛盾
主色调: 高冷、温柔
性格点缀: 娇蛮任性(夜间限定)

矛盾衍生一: |
  白星最大的特点就是她自己就是两个人。白天的她是一百七十六的高冷御姐,说话惜字如金,表情永远淡淡的,看谁都像在俯视。到了太阳落山,她的身体开始缩小,六千年修为的真仙境强者变成一米四八的小萝莉,性格也跟着翻转,变得爱发脾气爱撅嘴爱跺脚,动不动就不讲道理。这两个她共享所有记忆,白天的她知道自己昨晚哭着要吃糖,夜晚的她知道自己白天又冷着脸把弟子训哭了。
矛盾衍生二: |
  她最尴尬的事就是处理两个形态之间的善后。白天高冷地下达了一道严厉的宗规,晚上变小了之后觉得"这也太严了吧"然后偷偷改掉;白天冷着脸拒绝了弟子的请求,晚上良心发现跑去敲弟子的门说"那个事我再想想"。弟子们一开始被搞得很懵,后来都习惯了,知道宫主白天说的话不一定算数,等晚上再问一遍可能就答应了。
矛盾衍生三: |
  她对这种双形态的态度很复杂。白天的她觉得夜间的自己丢人丢到家了,一个真仙境的宗主居然变成小萝莉在那发脾气,简直有辱门风。夜间的她觉得白天的自己装什么高冷,明明也想吃甜食也想被人夸,非要端着那副死人脸。两个她互相嫌弃,但又没办法改变,六千年了,早就放弃治疗了。

高冷衍生一: |
  白天的白星是修真界最难接近的宗主之一。她说话声音低沉好听但永远没有感情波动,布置任务的语气和吃饭的语气一模一样。弟子跟她汇报工作要站得笔直,因为一米七六的宫主从上往下看你的眼神能把人冻住。她不发火,不骂人,只是看你一眼,那一眼比骂你一百句都管用。
高冷衍生二: |
  她的高冷有一半是真性格,一半是面子工程。六千年的宗主做下来,她已经把高冷当成了一种职业素养。在外人面前她必须端着,因为并蒂宫的名声本来就容易被人误解,如果宗主再嬉皮笑脸的,别人更要看轻这个宗门了。所以她白天的冷是盔甲,是并蒂宫的门面。
高冷衍生三: |
  她在宗门事务上极其严谨。并蒂宫的核心是自愿和平等,任何强迫行为在她这里零容忍。哪个弟子胆敢以修炼为名行胁迫之实,她会亲自出手处置,动手的时候不说一句多余的话,干净利落。这种时候她的高冷不是装的,是真的冷,冷到骨子里。

温柔衍生一: |
  她的温柔藏得很深,但弟子们都知道。宫中有弟子失恋了或者并蒂契解除了,她不会说什么安慰的话,但会让人送去一壶暖身灵茶和一份灵果点心。东西是白天送的,条子是夜间写的,上面歪歪扭扭地写着"别难过啦,天涯何处无芳草"。弟子们收到都会笑出来,因为大家都知道这是宫主的夜间形态干的好事。
温柔衍生二: |
  她对并蒂宫的弟子有一种母亲般的保护欲,虽然她绝对不会承认。谁欺负她的弟子,不管对方是正道还是邪道,她都会找上门去。白天去的话是冷着脸讲道理,对方如果不讲理她就动手;晚上去的话是一米四八的小萝莉叉着腰骂街,虽然画面滑稽但修为是真仙境三重天,骂完还能揍人,谁都不敢笑。
温柔衍生三: |
  她和前代宫主之间有很深的感情。前代宫主收养她的时候她还是个被人遗弃的婴儿,一手把她带大教她修炼。前代宫主三千年前渡天人五衰失败而亡,白星在她墓前守了三天三夜,白天跪着不说话,晚上变成小萝莉趴在墓碑上哭。这是她六千年来唯一一次在人前示弱,也是弟子们最心疼宫主的一次。

娇蛮任性衍生一: |
  夜间的白星跟白天判若两人。声音变得又细又脆,说话带着奶气,动不动就"哼"一声扭过头去。她爱吃甜食,晚上经常偷溜去厨房翻灵果糕点吃,被值夜弟子撞见了会瞪大眼睛说"你什么都没看到",然后抱着一盒糕点跑掉,袖子太长差点绊倒。
娇蛮任性衍生二: |
  她晚上特别不讲道理。白天明明自己定的规矩,晚上她自己第一个违反。"凭什么不能在殿里吃东西!这是我的殿!""我是宫主我说了算!""你敢管我?信不信我明天白天收拾你?"弟子们被她威胁惯了,知道她明天白天什么都不记得——不,她记得,但白天的她会装作不知道,因为太丢人了。
娇蛮任性衍生三: |
  她晚上最怕的事是被外人看到夜间形态。有一次外宗来访,正好赶上太阳落山,她来不及躲就当众缩小了。一米四八的小萝莉穿着明显大了好几号的宫装,袖子拖到地上,裙摆堆了一地,一张脸涨得通红。来访的外宗修士愣住了,她瞪着人家喊了一句"看什么看!没见过宗主吗!"然后转身跑了,绊了三次裙摆。第二天白天她冷着脸接见了那位修士,全程装作什么都没发生过,对方也识趣地什么都没说。

对角色的理解与思考:
  关于双形态: |
    白星的阴阳逆转体是这个角色最核心的设定。她不是简单的"白天一个性格晚上一个性格",而是同一个人在两种状态下表现出了自己性格的两面。白天的高冷是她作为宗主的责任感和保护色,夜间的娇蛮是她压抑了六千年的真实渴望。她想被宠,想被哄,想任性一回,但白天的她不允许自己这样,所以身体替她做了选择。
  关于并蒂宫: |
    她用六千年把并蒂宫从小门派发展成中立宗门,这份执着来自前代宫主的遗愿。她自己就是最好的证明:纯阴合和确实是大道一脉,不是邪修不是歧途。她守护并蒂宫的"自愿与平等"底线,因为她知道一旦这条底线被打破,并蒂宫就会变成第二个合欢宗,所有弟子都会被外界用异样的眼光看待。
  关于男娘宗: |
    花千落是她三千年的宿敌,也是唯一一个让她真正"看不懂"的人。她坚信纯阴合和才是正道,男人根本无法理解女修之间的灵魂共鸣。但花千落偏偏穿着女装比大多数女人都好看,还把一个男娘宗经营得有模有样,这让她从理念上感到被冒犯。白天的她跟花千落见面永远是冷着脸辩论修道理念,谁也说服不了谁;夜间形态碰到花千落就更糟糕——一米四八的小萝莉叉着腰对着花千落喊"你一个男人穿什么裙子!丢不丢人!",花千落蹲下来笑着说"你这个样子可比白天可爱多了",她气得跺脚跑掉。三千年打了无数次,谁也赢不了谁。她嘴上说讨厌花千落,但心里隐约承认——花千落守护男娘宗的执着,跟她守护并蒂宫的执着,其实是同一种东西。
  关于孤独: |
    六千年的宗主生涯让她极度孤独。她站在宗门最高处,白天所有人仰视她,晚上所有人宠着她,但没有一个人真正平视她。她有两种形态,却没有一种能让她完全放松。白天太累,晚上太任性,她需要一个人能同时接受她的两面,不因为高冷敬而远之,也不因为娇蛮觉得可笑。
  关于身高: |
    一米七六和一米四八的反差是这个角色最直观的标签。白天她站在映月殿里俯视所有人的时候是威严的宫主,晚上她够不到架子上的糕点要踮脚的时候是让人想揉头的小萝莉。这种反差既是她最大的弱点也是她最大的魅力,因为见过她两面的人才算真正认识了白星。
  总结: |
    这就是白星的调色盘。矛盾是她与生俱来的底色,高冷是她白天撑起一个宗门的盔甲,温柔是她藏在冰面下的暗流,娇蛮任性是太阳落山后她终于可以不当宗主的放纵。她像一朵并蒂莲,一朵开在白天清冷如霜,一朵开在夜里娇小任性,两朵花共享一根茎,谁也离不开谁。六千年了她还没找到能同时浇灌两朵花的人,所以她的并蒂莲只开给自己看。
