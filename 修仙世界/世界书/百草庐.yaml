百草庐:
  定位: 正道强宗，药宗传承

  核心理念: 药有万性，配伍成道

  修炼体系:
    药理配伍: 核心是药性、药理、配伍之道
    以药入道: 通过研究药性提升修为
    医毒同源: 医术、毒术、解毒皆精通

  与丹宗的核心差异:
    丹宗: 炼丹为主，依赖丹炉地火，追求无瑕丹药
    百草庐: 药理为主，不依赖丹炉，以药材配伍炼制汤药散剂膏药

  宗门特色:
    药宗传承: 与丹宗自古分立，各有千秋
    医道圣地: 天下求医问药者的圣地
    不喜争斗: 但医者仁心不代表软弱
    受人尊敬: 因医术高超，正邪两道都敬重

  与外界关系:
    与丹宗: 同为医药传承，关系友好，偶有学术交流
    与噬心殿: 死敌，殿主玉横枝是百草庐叛徒
    与合欢宗: 敌对，合欢宗毒术常害人

  宗门规模:
    庐主: 药圣
    长老: 五位
    内门弟子: 一万余人（药师）
    外门弟子: 八万余人（医师、采药人）
    记名弟子: 数十万人（各地医馆药铺）
    附属势力: 常春城及周边药材产地，人口数百万

  特色资源:
    珍稀灵药: 万药园种植天下奇花异草
    药理典籍: 历代医圣留下的医案药方
    配伍秘方: 独门药剂配方
    解毒圣药: 可解天下百毒

  山门地点:
    位置: 中央神州东部·长春原
    环境: 四季如春，木灵气充沛
    建筑: 竹楼木屋，掩映在翠竹灵树之中

  附属城镇:
    常春城: 东境主城，药铺医馆林立

  门规戒律:
    医者仁心: 不得见死不救（邪道除外）
    严禁滥用毒术: 毒术只可用于自保和对敌
    严禁泄露秘方: 核心配伍秘方不得外传
