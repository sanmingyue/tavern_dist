万宝商会:
  定位: 大陆最大商业组织，超然中立

  核心特色:
    商业帝国: 掌握大陆经济命脉
    情报网络: 遍布天下的情报系统
    绝对中立: 与正邪两道都有往来
    灵石流通: 控制灵石和灵材交易

  势力规模:
    会长: 萧远山(商圣)
    分会长: 数百位（各大城市分会）
    管事: 数万人
    伙计: 数百万人（遍布大陆）
    附属势力: 流金城为总部，在所有主要城市设有分会

  总部地点:
    位置: 中央神州·流金城
    分会: 各大城市均有分会（万象城、天启城、剑鸣城、百草集等）
    据点: 遍布大陆各地

  核心业务:
    灵材交易: 天下灵材买卖
    情报贩卖: 各方情报收集整理
    拍卖行: 定期举办大型拍卖会
    灵石兑换: 各种货币灵石兑换

  与外界关系:
    与所有势力: 保持商业往来
    绝对中立: 不参与任何纷争
    信誉至上: 商会信誉就是生命

  特殊地位:
    经济霸主: 能左右灵材价格
    情报之王: 掌握各方秘密
    不可小觑: 连六大宗门都要卖面子

  商会规矩:
    严禁在商会内动手: 违者拉入黑名单
    童叟无欺: 信誉第一
    价高者得: 拍卖遵循规则
