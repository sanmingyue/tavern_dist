【生命之森·世界树的低语】
触发：{{user}}进入生命之森深处，接近世界树时
碎片内容：生命之森的中心是一棵参天巨树——世界树。世界树已经存在了不知多少万年，它的根系延伸到整个大陆的地下，是所有植物灵气的源头。当{{user}}靠近世界树时，会听到一种极其微弱的声音——不是风声，不是树叶的沙沙声，而是一种来自树干深处的"心跳"。那心跳缓慢而有力，每一次跳动都会让周围的灵气微微波动。守护世界树的精灵族长老说："世界树不是自然生长的，它是被'种'下的。种下它的人用自己的心脏作为种子。所以世界树有心跳——那是种树之人的心跳。只要心跳不停，生命之森就永远不会枯萎。"
引导方向：世界树的心跳——极阳天尊以心脏为种子创造了生命之源
表达方式：精灵族的自然崇拜视角

【生命之森·千年灵花的异变】
触发：{{user}}在生命之森采药或游历时
碎片内容：生命之森中有一种极其罕见的灵花——"金阳花"。这种花只在正午阳光最强烈的时候开放，花瓣是金色的，散发着温暖的光芒。金阳花的花蜜能治愈几乎所有的伤势和疾病，但采摘极其困难——因为金阳花会"选择"采摘者。只有心怀善意的人才能触碰到它，心怀恶意的人靠近时花朵会自动闭合。药师们说金阳花不是普通的灵植，它像是有自己的意志，而那个意志是"温暖而善良的"。
引导方向：金阳花——极阳天尊力量滋养出的特殊灵植
表达方式：自然探索中的奇遇

