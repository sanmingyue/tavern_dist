绯家:
  定位: 东荒妖域世家,古老修仙世家
  详细位置: 东荒妖域·绯山
  势力性质: 修仙世家

  核心信息:
    家主: 绯家家主
    势力规模: 中型世家
    主要种族: 人族
    势力特点: 古老、传统、重视联姻

  主要地点:
    - 绯山主峰
    - 绯家祖地
    - 问心崖

  势力特色:
    - 古老世家传承
    - 重视家族联姻
    - 音律之道传承
    - 培养神女

  重要角色:
    - 绯烟: 曾为绯家神女,勘破宿命离家,现为自由修士

  势力现状:
    - 势力稳固
    - 绯烟已离家
    - 与北帝王腾的联姻计划破裂
    - 家族对绯烟态度复杂

  特殊设定:
    - 传统世家
    - 重视联姻和家族利益
    - 绯烟的离开是对传统的挑战
    - 但也尊重她的选择
