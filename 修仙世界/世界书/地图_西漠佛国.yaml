西漠佛国:

概述: |
  西漠佛国位于阴阳大陆最西端,是一片以沙漠、戈壁和零星绿洲构成的广袤土地。这里是佛门净土与魔道深渊并存的矛盾之域,小雷音寺的金钟梵唱与幽冥魔宗的死亡呢喃在风沙中交织。西漠的天空永远有一层淡淡的金色,那是佛光与魔气碰撞后残留的痕迹。

  西漠不像中央神州那样繁华,也不像东荒妖域那样蛮荒。它有一种独特的苍凉之美,大漠孤烟直的壮阔中夹杂着残酷的生存法则。水源是这里最珍贵的资源,围绕着每一处绿洲都建立了大大小小的势力。凡人与修士的界限在西漠比任何地方都模糊,因为在这里,不会修炼的人连活着都困难。

地理分区:

  北境·灵山净土:
    描述: |
      西漠北部是小雷音寺的核心地盘。以灵山为中心,方圆千里内佛光笼罩,沙漠在这里变成了翠绿的净土。灵山不是一座山,而是九座山峰首尾相连形成的莲花状山脉,每一座峰上都建有寺庙和道场。
      
      灵山的空气里弥漫着檀香,四季如春,灵气充沛。这里是整个西漠最不像西漠的地方,像一滴落在沙漠中的翡翠。
    核心地标:
      大雄宝殿: 小雷音寺主殿,九峰之首的灵鹫峰顶,金顶寺庙气势恢宏。殿内供奉着一尊以佛骨舍利雕成的古佛像,据说是上古佛祖留下的本源法身
      菩提净土: 灵山东麓的封闭修行区,种满了菩提古树,每一棵都有数千年树龄。弟子在菩提树下打坐修行,据说能加速感悟佛法
      藏经阁: 九峰之中专门辟出一座山峰存放经文,收藏了上古至今的佛门典籍数十万卷,由一位活了三万年的老僧守护
      金刚伏魔阵: 环绕灵山的护山大阵,由历代高僧以佛力维持。能抵御真仙境以下的任何攻击,是小雷音寺的最后防线
      万佛窟: 灵山西麓的石窟群,数千个石窟中雕刻了上万尊佛像。每一尊佛像都被注入了佛力,在紧急时刻可以化作金刚力士护寺
      苦行沙海: 灵山外围的环形沙漠地带,是僧侣修行苦行的必经之地。沙海中布满了幻阵,行走其中会经历心魔考验,是佛门弟子的试炼场
    势力: 小雷音寺

  中部·大漠腹地:
    描述: |
      西漠中部是真正的死亡沙漠。无边无际的金色沙丘在风中不断变换形状,白天酷热难当,夜晚冰寒刺骨。普通人踏入此地必死无疑,即使是修士也需要时刻消耗灵力抵御恶劣环境。
      
      大漠中有数条古老的商路,连接着各个绿洲,是西漠的生命线。这些商路上偶尔能看到万宝楼的商队,他们是唯一有能力在大漠中自由穿行的组织。
    核心地标:
      流沙之海: 中部最大的沙漠区域,沙子呈流动状态,像液体一样会吞没一切。传说流沙之下埋着一座上古城市的遗迹,偶尔会有古物被沙暴卷出
      天柱风暴: 大漠中心地带常年存在的巨型风暴,高达数万丈直插云霄。风暴内部蕴含着狂暴的风属性灵气,是天然的禁区。有传言说风暴中心有一处上古修士的洞府
      古丝路: 连接各大绿洲的商路网络,由万宝楼和凡人商队共同维护。路上设有驿站和补给点,每隔百里就有一座风灵塔指引方向
      沙虫领地: 大漠深处有巨型灵兽沙虫出没,最大的沙虫体长超过百丈,能一口吞掉整支商队。沙虫极难击杀,但它们的内丹是炼制突破丹药的稀有材料
    势力: 无固定势力,各方势力的缓冲地带

  东部·绿洲带:
    描述: |
      西漠东部靠近中央神州的区域,水源相对充沛,分布着大大小小数十个绿洲。这里是西漠人口最密集的区域,凡人和低阶修士聚居于此。绿洲之间的关系错综复杂,联盟与敌对交替上演。
    核心地标:
      月牙泉绿洲: 西漠最大的绿洲,万宝楼总部所在地。绿洲中央有一湾月牙形的泉水,泉水富含灵气,是方圆千里内最珍贵的水源。围绕月牙泉建立了繁华的商业城镇,各色人等汇聚于此
      清泉镇: 月牙泉绿洲的主城,西漠最繁华的城镇。街道上能看到佛门弟子和魔修擦肩而过,这里是少数佛魔双方默认的中立区域
      枯骨绿洲: 一处被废弃的绿洲,传说百年前这里发生了一场大规模瘟疫,所有居民一夜之间化为白骨。现在绿洲的水源依然清澈,但没有人敢在这里居住,成了过路修士临时歇脚的地方
      红砂城: 用红色砂岩建造的古城,是西漠凡人最大的聚居地。城中住着数万凡人,由一位退隐的老修士守护。城墙上刻满了防护符文,能挡住一般的沙暴和妖兽
      望天绿洲: 靠近中央神州边界的小绿洲,是进入西漠的第一站。这里有一座简陋的客栈,客栈老板是个话很多的老头,据说知道西漠所有的秘密,但大部分都是他编的
    势力: 万宝楼(商业影响力),各小势力割据

  南境·黑石深渊:
    描述: |
      西漠南境是幽冥魔宗的地盘。与北境灵山净土截然相反,这里寸草不生,大地龟裂发黑,空气中弥漫着死亡的气息。黑色的岩石构成了诡异的地形,像一片被火焰灼烧过又冷却的废土。
      
      黑石深渊是一条贯穿南境的巨大裂缝,深不见底,从中不断涌出魔气。幽冥魔宗的幽冥魔殿就建在深渊边缘,俯瞰着这片死亡之地。
    核心地标:
      幽冥魔殿: 幽冥魔宗总部,建在黑石深渊边缘的悬崖上,半嵌入岩壁。魔殿通体黑色,由不知名的黑色金属铸造,殿内常年笼罩在阴冷的死气中
      万魔窟: 幽冥魔宗附属的奴隶市场,建在黑石深渊下方的天然洞穴群中。这里关押着从各地掳掠来的修士和凡人,是整个修仙界最黑暗的角落之一
      焚魔战线: 佛魔对峙的前线地带,位于灵山净土和黑石深渊之间。双方在这里交战了数万年,大地被反复摧毁又重建,留下了无数战斗痕迹。焚魔战线上散布着废弃的军营和阵法残骸
      亡者荒原: 万魔窟外围的荒地,逃跑失败的奴隶尸骨散落其中。这里不允许收敛遗体,是对其他奴隶的警告。偶尔有不知来历的修士会在深夜偷偷收敛遗骨,没有人知道是谁
      魔化沙漠: 黑石深渊的魔气外溢,导致周围的沙漠变成了黑色。黑沙中蕴含腐蚀性魔力,普通修士踏入会被缓慢侵蚀。但魔修反而能在这里获得修炼加成
    势力: 幽冥魔宗

  西极·虚空边境:
    描述: |
      西漠最西端是阴阳大陆的边界。这里的大地逐渐碎裂,最终消失在虚空风暴之中。没有人知道虚空的另一边有什么,所有进入虚空的人都再也没有回来过。
    核心地标:
      天涯崖: 大陆的最西端,一道悬崖面对着无尽的虚空。崖上常年大风,风声中偶尔能听到奇异的低语,像是另一个世界的回声。有修士在这里悟道,也有修士在这里发疯
      虚空裂隙: 天涯崖附近偶尔会出现虚空裂隙,裂隙中会飘出不属于这个世界的碎片——奇异的矿石、陌生的灵植、甚至半截不知什么生物的残骸。万宝楼会定期来这里收集这些域外之物
      守界碑: 上古修士在天涯崖立下的巨大石碑,碑上刻着禁制,据说能阻止虚空风暴侵蚀大陆。石碑已经存在了不知多少万年,表面的禁制正在缓慢衰退
    势力: 无

佛魔对峙格局:
  现状: |
    西漠的核心矛盾是佛魔之争。小雷音寺占据北境,幽冥魔宗盘踞南境,双方以大漠腹地为缓冲区,在焚魔战线上断断续续交战了数万年。
    
    这场战争没有赢家。小雷音寺无法彻底消灭幽冥魔宗,因为黑石深渊源源不断地为魔宗提供魔气。幽冥魔宗也无法攻破灵山,因为金刚伏魔阵固若金汤。双方陷入了僵持,偶尔爆发局部冲突,但谁都没有能力发动全面战争。
    
    万宝楼是这场对峙中唯一的赢家。它同时向佛魔双方出售物资,从战争中攫取暴利。苏清晏（万宝楼楼主）在佛魔之间左右逢源,但暗地里已经被梵楚(幽冥魔宗少主)控股,这个秘密一旦暴露,西漠的格局将发生剧变。

  灰色地带: |
    佛魔之间并非只有对立。大漠腹地存在着一些两不管的灰色区域,亦佛亦魔的修士在这里生存。有的是被佛门逐出的叛僧,有的是厌倦了杀戮的魔修,他们在沙漠中建立了小型的聚落,过着不被双方承认但也不被追杀的生活。
    
    清泉镇是最大的灰色地带。在这里,佛门弟子和魔修可以坐在同一间酒馆里喝酒,只要不在镇内动手。这个规矩是万宝楼定下的,违反者会被永久禁止使用万宝楼的一切服务——在西漠,这等于被判了死刑。

西漠特产:
  - 佛光石: 灵山附近的特产矿石,蕴含纯净的佛力,是炼制佛门法器的上等材料
  - 魔化黑铁: 黑石深渊出产的金属,被魔气浸染,硬度极高,是炼制魔道法器的首选
  - 沙漠灵参: 生长在沙漠深处的稀有灵药,百年才能长成一株,有起死回生之效
  - 流沙珍珠: 流沙之海深处偶尔冲出的圆形结晶,蕴含风属性灵气,是布置阵法的好材料
  - 沙虫内丹: 巨型沙虫的内丹,蕴含土属性灵气,可用于炼制突破瓶颈的丹药
  - 天涯虚空碎片: 虚空裂隙飘出的域外物质,性质各异,价值不可估量

西漠气候与危险:
  - 白天地表温度可达凡人致死程度,夜晚则骤降至冰点以下
  - 沙暴随时可能爆发,大型沙暴可持续数日,连化神期修士都无法在暴风中立足
  - 沙虫领地极度危险,沙虫能感知地面震动,走路太重就可能招来
  - 流沙区域会吞噬一切,连飞行都不安全,因为流沙上方的气流紊乱
  - 黑石深渊周围的魔气会侵蚀凡人和低阶修士的心智
