势力名称: 万魔窟

基本信息:
  名称: 万魔窟
  定位: 西漠奴隶市场,幽冥魔宗附属势力
  位置: 西漠·黑石深渊附近
  掌控者: 渊煞魔王(幽冥魔宗刑罚长老)
  势力等级: 特殊势力(依附幽冥魔宗)

核心业务:
  主营:
    - 奴隶交易
    - 角斗表演
    - 折磨展示
    - 拍卖珍品

  特色:
    - 高贵者堕落的舞台
    - 正道强者的囚笼
    - 渊煞魔王的作品展
    - 魔道的黑市中心

组织结构:
  幕后主宰:
    - 渊煞魔王: 真正掌控者

  明面管理:
    - 管事: 负责日常运营
    - 角斗士训练师: 训练奴隶
    - 拍卖师: 主持拍卖

  特殊存在:
    - 赵曦月: 渊煞魔王最完美的作品(已被{{user}}买走)

标志性地点:
  核心区域:
    - 拍卖场: 奴隶珍品交易中心
    - 角斗场: 血腥角斗表演
    - 牢笼区: 囚禁高贵俘虏
    - 折磨室: 渊煞魔王的工作室
    - 训练场: 训练角斗奴隶

特殊商品:
  顶级珍品:
    - 正道宗门弟子
    - 各国公主贵族
    - 修为被封印的强者
    - 特殊体质者

  曾经的镇店之宝:
    - 赵曦月: 大明皇朝末代长公主(大明皇朝为中央神州上一代凡人王朝,已被大雍皇朝取代灭亡),曾为真仙境前期

势力关系:
  隶属:
    - 幽冥魔宗: 附属势力
    - 渊煞魔王: 实际掌控者

  客户:
    - 魔道修士: 主要客户
    - 邪道散修: 常客
    - 部分正道败类: 隐秘客户

  货源:
    - 幽冥魔宗: 战争俘虏
    - 各地掠夺: 绑架劫掠
    - 自愿者: 极少数

特殊设定:
  渊煞魔王的作品展:
    - 万魔窟是他展示作品的舞台
    - 拍卖不是抛弃而是炫耀
    - 每个珍品都带有他的烙印

  罗刹雪的起源:
    - 罗刹雪曾是万魔窟角斗奴隶
    - 尸山血海中爬上高位
    - 现已成为幽冥魔宗核心战力

势力优势:
  - 依附幽冥魔宗
  - 垄断奴隶市场
  - 情报收集便利
  - 资金充足

势力劣势:
  - 依附幽冥魔宗无独立性
  - 正道围剿目标
  - 名声极度败坏
  - 易成为攻击幽冥魔宗的突破口
