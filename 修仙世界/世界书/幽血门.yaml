幽血门:
  定位: 邪道强宗，血道体修

  核心理念: 以血炼体，以战证道

  修炼体系:
    血煞魔体: 核心功法，以血炼体，肉身强悍
    噬灵战诀: 近战搏杀，吞噬敌人精血
    冥狱霸拳: 纯粹的力量碾压

  宗门特色:
    体修为主: 专注肉身修炼，近战无敌
    弱肉强食: 内部竞争残酷，强者为尊
    爆发力惊人: 短时间内战力可数倍提升
    战斗疯狂: 战斗时不顾生死，极其疯狂

  与外界关系:
    与赤阳谷: 世仇，经常血战
    与北原魔族: 关系密切，常为魔族效力
    与正道: 不死不休的敌对关系

  宗门规模:
    门主: 铁无泪(血罗尊者)
    血堂堂主: 五位
    内门弟子: 八千余人
    外门弟子: 五万余人
    记名弟子: 二十余万人（血狱深原及周边魔修）
    附属势力: 血崖堡及泣血山脉势力，人口数百万

  特色资源:
    血髓矿: 炼制血道魔器的材料
    血精: 修炼血煞魔体的资源
    怨骨: 强者遗骨，可炼制法器
    煞气结晶: 凝聚的煞气晶体

  山门地点:
    位置: 北原魔土东部·血狱深原
    环境: 血泉涌动，煞气冲天
    建筑: 幽渊战堡，血色岩石筑成

  核心设施:
    血煞修炼场: 地底血脉喷涌，淬炼肉身
    角斗血池: 内部争斗频繁，血池浸泡无数尸骸
    血狱禁地: 埋葬万族遗骨，怨气血气交织

  门规:
    强者为尊: 实力决定一切
    允许内斗: 但不得残杀同门核心弟子
    战死为荣: 战死沙场是最高荣耀
