势力: 剑宗

简介: 六大仙宗之一(上三宗),六宗之首,阴阳大陆顶级剑道宗门,以无情剑道与万剑归宗闻名

核心人物:
  谢云流(剑圣):
    职位: 剑宗宗主
    修为: 真仙境十重天大圆满
    性别: 男
    特征: 六宗之首的宗主,剑道攻伐天下第一
    关系: 云蕴(丹宗宗主,曾经的道侣,如今的盟友)
    过往: 百年前丹宗遭难率众驰援,与云蕴情深义重

  殷冬雪:
    职位: 剑宗印雪峰峰主,剑宗二长老
    修为: 渡劫后期大圆满
    剑心境界: 无我
    年龄: 两万五千余岁
    身高: 一米七五
    性别: 女
    原名: 晟冬雪(加入剑宗后随母姓改名殷冬雪)
    灵根: 玄品火金双灵根
    武器: 本命飞剑"炽雪"
    能力: 无情剑道大成,剑心达"无我"之境,瞬间斩出万道剑气
    性格: 活泼开朗,如一团行走的火焰,极度珍视感情,对敌毫不留情
    关系: 殷眉(母,上一任印雪峰峰主),晟阳(凡人父亲,已老死),卫疏影(大徒弟),姜千青(小徒弟),洛红尘(爱慕对象)
    剑道理念: 无情剑道是为了守护至情,剑是盾也是墙
    特殊: 名字带雪,本人却如夏日骄阳般火热

  卫疏影:
    职位: 剑宗印雪峰精英弟子,殷冬雪座下大弟子
    修为: 合体后期大圆满(卡瓶颈数百年)
    剑心境界: 剑心通明
    年龄: 五千余岁
    身高: 一米七二
    性别: 女
    灵根: 黄品金木双灵根
    武器: 本命飞剑"寒光"
    能力: 剑道造诣极高,剑心通明之境,无情剑道
    性格: 安静内敛,极度专注于剑道,经常走神发呆,对师父和师妹极为忠诚
    关系: 殷冬雪(师父,生命中最重要的人),姜千青(师妹,极度宠爱)
    状态: 在红尘历练寻找突破契机

  姜千青:
    职位: 剑宗弟子,殷冬雪亲传弟子
    修为: 筑基后期
    剑心境界: 剑意
    年龄: 外表十八岁,实际三十五岁
    身高: 一米六五
    性别: 女
    种族: 半人半妖(九尾狐族与人族混血,本人不知情)
    真实身份: 九尾族大长老常无束之女
    灵根: 黄品金火双灵根(混血导致灵根平庸,但有妖族血脉潜力)
    武器: 本命飞剑"千绪"
    能力: 剑法凌厉狠辣,已凝聚剑意,体内有未觉醒的九尾族血脉
    性格: 嚣张跋扈,脾气很差,被宠坏了,渴望关注,占有欲强
    关系: 殷冬雪(师父,如母亲般的存在),卫疏影(师姐,最喜欢缠着),常无束(亲生父亲,不知情),姜春(母亲)
    称号: 剑宗小魔王

势力特色:
  - 剑道修炼顶尖
  - 无情剑道传承
  - 万剑归宗绝学
  - 师徒关系深厚
  - 与丹宗有深厚盟约(百年前丹宗遭难时救援)
