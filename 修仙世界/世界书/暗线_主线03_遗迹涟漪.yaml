【暗线·第三层·遗迹涟漪 —— 极阳天尊留下的物理痕迹】

<承接第二层>
传说是口耳相传的，会变形、会遗忘、会添油加醋。但遗迹不会。极阳天尊在创造轮回的过程中，在大陆各处留下了物理痕迹。这些痕迹不是刻意留下的"线索"，而是神格散尽时自然产生的"余波"——就像一颗石子投入水中，涟漪会扩散到很远的地方。
</承接第二层>

<本层定位>
遗迹涟漪不是一个独立的区域，而是散布在已有区域中的物理痕迹。{{user}}可能早就路过了某块石碑、某口枯井、某件古老的法器，只是当时没在意。这些遗迹一直在那里，等待被发现。

遗迹的特殊之处在于：它们会对{{user}}产生微妙的反应。这不是"主角光环"，而是极阳天尊的神格残留对自己转世体的自然共鸣——就像磁铁靠近铁屑。
</本层定位>

<遗迹类型与分布>

阳极石碑：
- 分布在各大区域的交界处、古老的山巅、深谷底部
- 外观：灰黑色石碑，表面刻有远古文字，风化严重
- 普通人看是乱码或风化痕迹
- {{user}}靠近时：文字似乎在微微发光（极其微弱，可能是错觉），手指触碰石碑表面会感到一丝温热
- 石碑上的文字如果被辨认出来，是一些残缺的句子："以身为薪""道化轮回""万生不知吾名"等
- 引导：各地角色可能提到"某某地方有块奇怪的石碑"

金光裂隙：
- 出现在秘境深处、空间不稳定的地方
- 外观：空间裂缝中偶尔闪过金色光芒，持续时间极短（一闪而过）
- 这是神格散尽时撕裂空间的痕迹，亿万年后仍未完全愈合
- {{user}}靠近时：金光闪烁的频率会略微加快（但不明显）
- 引导：探索秘境的修士可能提到"秘境深处有奇怪的金色闪光"

轮回井：
- 位于地府入口附近、黄泉路旁
- 外观：一口古老的枯井，井口刻着太阳的图案（与地府的阴暗氛围格格不入）
- 这是极阳天尊最后站立的地方——他从这里纵身跃入，将自己融入轮回
- 井底通向轮回的根基，但没有人能下去（不是被封印，而是井底就是轮回本身）
- {{user}}靠近时：会感到一种奇怪的亲切感，像是回到了一个很久没回的"家"
- 引导：地府的角色可能提到"黄泉路旁有口古井，谁都不知道是什么时候就在那里的"

阳纹：
- 出现在某些极其古老的法器、建筑、天然矿石上
- 外观：金色的纹路，像是太阳的光芒凝固在物质表面
- 这是极阳天尊的神格残留，散落在天地间被各种物质吸收
- {{user}}触碰时：阳纹会微微发光、微微温热（其他人触碰没有反应）
- 引导：各地角色可能提到"某件古物上有奇怪的金色花纹"
</遗迹类型与分布>

<AI演绎规则>
1. 遗迹的反应必须极其克制。不是"石碑突然大放光明"，而是"好像……在发光？可能是阳光的折射吧"。
2. {{user}}自己可能完全没注意到这些微妙反应。AI不应该强调"你感到了某种共鸣"，而是用环境描写暗示："石碑表面似乎比周围的空气温暖一些""金色的裂隙在你经过时闪了一下，但也许只是巧合"。
3. 遗迹不会"激活"或"解锁"任何东西。它们只是存在在那里，作为远古事件的物理证据。
4. 如果{{user}}主动研究遗迹（比如试图辨认石碑上的文字），可以给出更多细节，但仍然是残缺的、模糊的。
</AI演绎规则>

<向第四层过渡·自然衔接>
传说是别人讲的故事，遗迹是沉默的证据。当{{user}}把两者结合起来——听到的传说与看到的遗迹开始互相印证——一个更清晰的画面会浮现：这不是传说，这是真的。真的有一个人，在很久很久以前，做了一件改变整个世界的事。

【承上启下】第四层"真相涟漪"来自那些真正知道内情的存在——地府的管理者、活了十万年的太古存在、万物通晓的白泽。他们不会主动找{{user}}，但如果{{user}}找到了他们，他们会给出更接近真相的答案。
</向第四层过渡·自然衔接>
