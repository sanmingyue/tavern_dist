男娘宗:
  定位: 中立特殊宗门，以化形易容、阴阳调和为修炼核心，弟子皆为生理男性却以女装示人
  宗主: 花千落(宗主，真仙境二重天)

  核心理念: 天地有阴阳，人身亦然。男子体内阴阳失衡者居多，唯有调和阴阳、兼修内外，方能窥得大道真谛。以女装修行非为戏谑，乃引阴入阳、以柔克刚之法门，外柔内刚、形阴神阳，最终达到阴阳合一之境

  核心特色: 化形术、幻容术、阴阳调和功法三位一体，是修仙界最独特也最具争议的宗门

  宗门手段:
    弟子特征: 全部为生理男性，修炼化形术后皮肤细腻、身形纤细、容貌秀美，着女装时足以以假乱真。性取向不受限制，男女皆可，宗门对此毫无忌讳
    核心功法: 阴阳蝶变诀——以阴柔灵力淬炼肉身，使修炼者外表趋于阴柔之美，同时内在阳刚之力不减反增，形成"外阴内阳"的独特体质，战斗力极为诡异
    化形术: 不同于合欢宗的易容，男娘宗的化形术是真正改变体态气质的功法，修炼到高深处甚至能短暂改变骨骼结构
    独门秘术: 蝶梦幻境——利用阴阳错位的灵力波动扰乱对手判断，让敌人无法分辨其真实实力与性别，战斗中造成极大的心理压迫
    隐藏实力: 外表柔弱实则体修功法极为强悍，一拳能打碎金丹期修士的护体灵光
    情报能力: 弟子善于以各种身份混入不同势力，获取情报能力仅次于天机阁

  山门地点:
    位置: 中央神州南部·蝶梦谷·化蝶峰
    特色: 谷中常年飘舞彩蝶，灵花遍地，宛如仙境，外人初见以为是某个仙子门派

  宗门规模:
    内门弟子: 三千余人
    外门弟子: 八千余人
    暗线成员: 数千人（以各种身份活跃于各大势力）

  宗门景象:
    行事: 弟子行事风格各异，有娇俏可人的、有飒爽英姿的、有冷艳高贵的，但无一例外皆为女装。宗门内部氛围开放包容，对性别表达和性取向完全自由
    处境: 被正道视为怪异，被邪道视为软弱，实则两边都不敢轻易招惹——曾有邪宗嘲笑男娘宗，结果被宗主花千落一人打上门去，三天没出来，对方宗主亲自出门赔礼道歉
    特长: 化形潜伏、阴阳调和功法、体修暗劲、情报搜集
    与其他宗门关系: 与合欢宗有微妙的竞争关系（都擅长易容渗透），与并蒂宫势同水火（两宗皆为性别相关特殊宗门，并蒂宫主张"纯阴合和方为正道"，男娘宗主张"阴阳无别美无性分"，理念根本冲突。两宗宗主花千落与白星修为相近，常年互不对付，三千年来大小摩擦不断），万宝商会是重要客户（男娘宗的化妆品和女装法器是硬通货）
