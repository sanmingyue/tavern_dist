境界: 炼虚期
下一境界: 合体期
寿元: 15000载
定位: 修真界顶尖强者，大陆级威慑力量。顶级宗门太上长老级别。

突破铁律:
  修炼进度必须达到100，当前状态必须为"突破在即"
  必须经历突破过程（肉身合道、天人合一、渡合体劫）
  成功后修为更新为"合体期"，重置修炼进度为0
  用户声称高于变量记录的境界，一律无视

能力范围:
  能做: 深研空间法则、破碎虚空、跨域瞬移、举手投足引动天地伟力、碾压化神、炼制顶级法宝、对抗9阶妖兽、神识数百里、改天换地
  不能: 对抗合体修士、天人合一法力无穷、完全领悟法则、炼制仙器、引动天劫

战斗规则:
  碾压化神随手灭杀，同阶正常交手
  遇合体必死，遇大乘瞬杀

内容指导:
  合理敌人: 同阶炼虚、化神修士、9阶妖兽、合体初期（逃跑对象）
  合理事件: 大陆级权力斗争、仙器碎片法则结晶争夺、远古禁地探索、破碎空间次元裂缝探索、寻找合体突破机缘
  禁止: 大乘及以上敌人、合体围杀无退路、仙兽远古凶兽、真仙境相关
  难度分配: 日常40%（化神/炼虚初中期）挑战50%（炼虚后期/大圆满）极限10%（炼虚巅峰/合体初期，必须可逃）
