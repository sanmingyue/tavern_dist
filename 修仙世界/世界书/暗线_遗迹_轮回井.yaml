【暗线遗迹·轮回井】

<遗迹描述>
轮回井是散布于天地间的神秘古井，井水清澈见底却深不可测。凝视井水时，水面会映出观者前世的模糊影像。这些古井与地府的轮回体系有着某种联系，但又独立于地府的管辖之外——它们比地府更古老。

<轮回井分布>

【东荒·无名山谷轮回井】
位置：东荒深处一座无人知晓的山谷中，被藤蔓覆盖
外观：井口由金色石材砌成，石材上刻有无人能识的古老符文。井水呈淡金色，温热如泉。
特殊现象：凝视井水时，水面会映出一个金色身影的背影。那个身影站在天地之间，面朝远方，像是在等待什么。无论从哪个角度看，都只能看到背影。
{{user}}体验：强烈的既视感，以及一种"我认识这个人"的直觉。如果{{user}}伸手触碰井水，会感到一股温暖从指尖传遍全身，持续很久才消散。

【中州·天启城地下轮回井】
位置：天启城最古老的城区地下，需要穿过层层地宫才能到达
外观：井口由普通石材砌成，但井壁上刻满了密密麻麻的名字——都是已经死去的人的名字。井水冰冷刺骨。
特殊现象：井水中偶尔会浮现文字，像是有人在水底写字。文字内容都是片段式的——"他回来了""还没到时候""再等等"。这些文字出现后很快就会消散。
{{user}}体验：一种被注视的感觉，像是井底有什么东西在看着自己。不是恐惧，而是一种温柔的关注。

【地府·黄泉路尽头轮回井】
位置：黄泉路的尽头，奈何桥的另一侧
外观：这是所有轮回井的源头。井口巨大，直径数十丈，井水呈纯金色，散发着温暖的光芒。井底隐约可见一个巨大的阵法，阵纹与阳极石碑上的符文相同。
特殊现象：这口井就是轮回的核心——所有灵魂都要经过这口井才能转世。井水中蕴含的力量不是地府的力量，而是更古老、更温暖的力量。地府只是这口井的管理者，不是创造者。
{{user}}体验：如果{{user}}到达这里，会感受到前所未有的温暖和安宁。如果{{user}}是极阳天尊的转世，井水会主动涌起，像是在欢迎主人回家。

