- 轮回井是极阳天尊创造轮回体系时留下的核心装置
- 地府的十殿阎王知道轮回井的存在，但不完全理解其原理
- 孟婆的忘忧汤之所以能消除记忆，是因为汤中混入了轮回井的井水
- 崔钰的生死簿之所以能记录所有生灵的命运，是因为生死簿的材质来自轮回井井壁的石材
</与地府暗线的联系>

