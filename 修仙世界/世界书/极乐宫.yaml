势力名称: 极乐宫

基本信息:
  类型: 魔道宗门
  位置: 南疆隐秘之地
  实力等级: 顶尖势力
  势力规模: 中型
  主要种族: 人族为主

势力概况:
  定位: 南疆魔道势力,以情感法则闻名
  理念: 万法归情,情感即法则
  特色: 掌控情感法则,擅长渗透和操纵
  地位: 魔道顶尖势力,正道大敌
  传承: 情感法则传承

核心人物:
  宫主: 夜千泷(真仙境六重天)
  间谍: 苏媚儿(化神期,潜入天剑圣地)

势力特点:
  修炼体系: 情感法则为主
  招收标准: 天赋和潜力
  门规: 以情为兵,情感为武器
  传统: 渗透正道,操纵人心
  核心: 千人千面,虚无魅惑

主要设施:
  宫内核心: 极乐宫深处
  修炼场所: 红尘殿
  传承之地: 情感法则传承殿

宫主特殊性:
  千人千面: 形态随观测者而变
  情感操纵: 掌控情感法则
  内心虚无: 勘破情感后的空洞
  目标: 颠覆现有修真体系

苏媚儿任务:
  身份: 极乐宫间谍
  目标: 潜入天剑圣地
  定位: 夜千泷最完美的作品
  转变: 觉醒真实情感后的背叛

对外关系:
  天剑圣地: 敌对,已渗透
  玉清道宫: 敌对
  药神谷: 敌对
  其他魔道: 复杂

重要事件:
  - 夜千泷成为宫主
  - 培养苏媚儿为棋子
  - 苏媚儿潜入天剑圣地
  - 苏媚儿觉醒情感
  - 苏媚儿背叛

势力目标:
  短期: 渗透正道
  中期: 瓦解正道同盟
  长期: 万法归情,颠覆修真体系
