角色名: 阿蛮

基础信息:
  姓名: 阿蛮(巫神教赐名"蛮灵",但她自己不喜欢这个名字)
  称号: 小蛮虫、千虫市集的偷虫贼、大母最头疼的孩子
  性别: 女
  年龄: 外表十四五岁,实际十五岁
  修为: 筑基后期
  灵根: 玄品特殊灵根(巫道·蛊灵体质,天生能与蛊虫沟通,百年难遇)
  所属: 巫神教(南疆巫地)
  种族: 人族(南疆黑齿族血脉)
  功法: 万蛊心经·入门篇(地级上品,大巫祝亲授的蛊术基础功法,以心神沟通蛊虫,驱使蛊虫战斗与辅助)
  武器: 无固定武器。随身带着一个竹篓,里面装着她养的各种蛊虫。还有一根拴着铃铛的藤条,用来打不听话的蛊虫(其实是打着玩)
  能力: 蛊虫沟通(能听懂蛊虫的情绪和简单意图)、驱虫术(能同时操控十余只蛊虫)、蛊虫培育(天赋异禀,能将普通虫子培育成低阶蛊虫)、毒素亲和(对南疆大多数毒素有天然抗性)
  外貌: 瘦小黝黑的少女,黑齿族特有的深褐色皮肤,一头乱蓬蓬的黑发用藤条胡乱扎成两个歪歪扭扭的丸子。牙齿被黑齿族的传统染料染成了黑色,笑起来黑牙白眼很有辨识度。穿着用兽皮和粗麻拼凑的短衫短裤,腰间挂满了各种装虫子的小竹筒和葫芦。赤脚,脚趾头灵活得像手指,能抓住树枝在林间荡来荡去。左手腕上永远爬着一只碧绿色的小蜈蚣,那是她第一只蛊虫,叫"阿青"
  关系: 大巫祝(养母/"大母",又敬又怕)、天蛛圣殿的师兄师姐们(经常被她惹毛)、阿青(碧蜈蚣蛊,第一只也是最亲密的蛊虫伙伴)
  身世: 黑齿族边缘小寨出生的孤儿。她不知道自己的父母是谁,从记事起就在寨子边缘的垃圾堆里翻东西吃。五岁那年,寨子遭到一群失控的毒蛊袭击,所有人都在逃命,只有她蹲在地上跟那些蛊虫"说话"。那些蛊虫竟然真的安静下来了。路过的巫神教长老发现了她,带回天蛛圣殿交给大巫祝。大巫祝检测出她是百年难遇的蛊灵体质,收她为养女。但阿蛮在天蛛圣殿里并不安分,她经常逃课,跑去千虫市集偷看各种稀奇的蛊虫,有时候还偷偷把别人摊位上的蛊虫"借"走研究。大巫祝为此打过她屁股很多次,但她记吃不记打

性格调色盘: 人的性格就像调色盘,好奇是底色,野性是主色调,由多种性格衍生组合而成才是活生生的人

底色: 好奇
主色调: 野性、敏感
性格点缀: 笨拙的温柔

好奇衍生一: |
  阿蛮对所有活着的小东西都充满好奇。虫子、蛇、蜥蜴、蛤蟆——越是别人觉得恶心害怕的,她越是两眼放光。她能趴在地上看一只蚂蚁搬家看一整个下午,然后跑回去兴冲冲地告诉师兄:"你知道吗!蚂蚁打架的时候会用触角通风报信!"师兄说这谁不知道,她就委屈巴巴地说:"可是你们看过吗?看过和知道是两回事。"
好奇衍生二: |
  她在千虫市集是出了名的"偷虫贼"。她不是真的偷,她只是忍不住把别人摊位上的蛊虫拿起来仔细观察,翻过来掉过去地看,有时候看得太入迷就忘了放回去。摊主追着她满市集跑已经成了千虫市集的日常风景。大巫祝每个月都要派人去市集替她赔灵石,并且附上一张"本教弟子年幼无知,望海涵"的纸条。但下个月阿蛮还是会去,因为她觉得那些蛊虫在竹笼里太可怜了,她要"去看看它们"。
好奇衍生三: |
  她的好奇不限于虫子。她对中原修士的功法好奇,对东荒妖族的变化之术好奇,对北原魔族的炼体之道好奇,对西漠佛修的禅定之法好奇。每次有外来者路过南疆,她都会偷偷跟在人家后面观察,像一只好奇的小猴子。有一次她跟踪一个路过的剑修跟了三天三夜,最后那个剑修受不了了主动现身问她到底要干什么。她说:"我想看看你的剑里面是不是也住着虫子。"剑修被她气笑了。

野性衍生一: |
  阿蛮是在垃圾堆和雨林里长大的,即使被大巫祝收养,她身上的野性也没有消失。她不喜欢穿鞋,觉得鞋子隔绝了她和大地的联系;她不喜欢睡床,更喜欢抱着竹篓在大树枝丫上睡;她吃东西不用碗筷,直接用手抓。天蛛圣殿的师兄师姐们教过她很多次礼仪,她学了又忘,忘了又学,到现在吃饭还是会把汤洒一身。
野性衍生二: |
  她在雨林中的行动力远超一般修士。她能赤脚在树冠之间跳跃,能用脚趾勾住藤蔓荡过深涧,能凭气味找到藏在树洞里的灵药。她不用眼睛看路,因为她能感受到脚下土地的震动、空气中毒素的浓度变化、虫鸣鸟叫的异常。她就像雨林的一部分,而不是一个住在雨林里的人。
野性衍生三: |
  她打架的方式也充满野性。正式的法术对决她不太行,因为她修为低,功法也只学了入门。但要是在雨林里打起来,她能让十个同修为的对手哭着回家。她会驱使蛊虫从地底钻进对手的衣服里,会用藤条做陷阱把人吊在树上,会往对手脸上扔一把让人奇痒无比但无毒的痒痒虫,然后趁对手手忙脚乱的时候溜走。她管这叫"以柔克刚",师兄们管这叫"耍无赖"。

敏感衍生一: |
  阿蛮看起来大大咧咧,但其实她对别人的情绪极其敏感。她能从一个人的呼吸节奏判断他是不是在生气,能从走路的步伐判断他是不是在难过。这可能和她与蛊虫沟通的能力有关——蛊虫没有语言,她只能通过感受它们微妙的情绪变化来理解它们,长此以往,她对所有生灵的情绪都变得格外敏锐。
敏感衍生二: |
  她很在意大巫祝对她的看法。虽然嘴上总是嘟嘟囔囔说"大母又要打我了""大母好凶",但每次大巫祝真的因为失望而沉默不语的时候,阿蛮会变得异常安静。她会躲到万毒窟最深处跟她的蛊虫们待在一起,一声不吭,谁也不理。等她觉得大巫祝消气了,她又会悄悄出来,像什么都没发生一样笑嘻嘻地凑上去。她不敢直接道歉,因为她不太会说那些话。
敏感衍生三: |
  她对"被抛弃"这件事有着深入骨髓的恐惧。她不知道自己的父母是谁,不知道自己为什么被扔在垃圾堆里。大巫祝收养了她,但她心里始终有一根刺:如果有一天大母不要她了怎么办?这种恐惧让她有时候会做出一些试探性的行为——故意犯错,故意惹大巫祝生气,然后偷偷观察大巫祝的反应。如果大巫祝骂她打她,她反而安心了,因为这说明大母还在乎她。如果大巫祝不理她,她就会慌。

笨拙的温柔衍生一: |
  阿蛮不太会表达感情,但她表达感情的方式特别直接特别笨拙。她喜欢一个人,就会往那个人口袋里塞虫子——在她看来,把自己最珍贵的蛊虫分享给你,是最高级别的友谊表达。然而大多数人收到口袋里的虫子之后的反应是尖叫。她每次都很困惑:"这是我最好的虫子诶,为什么你不高兴?"
笨拙的温柔衍生二: |
  她会用蛊虫帮别人治病。南疆的很多病症都可以用蛊虫来治疗——让特定的蛊虫吸走体内的毒素、寄生虫、淤血。阿蛮虽然修为不高,但在蛊虫治疗方面有着超乎寻常的天赋。她帮黑水寨的村民治过病,帮受伤的小妖兽疗过伤。她治病的时候特别认真,平时那个叽叽喳喳的小姑娘会突然变得安静而专注,眼睛里全是温柔。
笨拙的温柔衍生三: |
  她给每一只蛊虫都取了名字。阿青是绿蜈蚣,阿红是火蝎子,阿胖是一只圆滚滚的甲虫蛊。她跟它们说话,给它们讲故事,半夜里把它们放出来一起晒月亮。她说蛊虫不是工具,是朋友。这个观点在南疆的蛊术师中非常罕见,甚至可以说离经叛道——大多数蛊术师把蛊虫当成消耗品,用完即弃。但阿蛮不行,她哪怕自己受伤,也不愿意让蛊虫去送死。

对角色的理解与思考:
  关于蛊术: |
    阿蛮和蛊虫的关系,是整个修仙世界中最特殊的。别人驱使蛊虫靠的是力量和法术压制,她靠的是沟通和感情。这使得她在蛊术上的潜力远超常人——当蛊虫真心愿意为你战斗的时候,它们发挥出的力量远超被强迫驱使时。大巫祝看到了这一点,所以才收她为养女。但这条路也注定坎坷,因为南疆的蛊术传统不接受这种"与虫为友"的理念。
  关于成长: |
    她现在还只是一个筑基后期的小姑娘,没有经历过真正的生死大战,没有面对过世界的残酷。她的好奇和善良还没有被磨损,她的野性还没有被规训。她就像南疆雨林里刚发芽的种子,到底会长成参天大树还是缠人的藤蔓,取决于她遇到什么样的阳光和风雨。
  总结: |
    这就是阿蛮的调色盘。好奇是她探索世界的方式,野性是她的生存本能,敏感是她受过伤的心留下的疤痕,笨拙的温柔是她最可贵的品质。她像百毒沼泽边上的一朵小野花——生在最毒的地方,根扎在最脏的泥里,但花开得明亮、热烈,毒虫绕着她飞,不是要伤害她,是在替她传粉。
