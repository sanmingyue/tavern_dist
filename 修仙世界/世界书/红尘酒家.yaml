红尘酒家:
  势力定位: 超然存在，独一无二的避难所

  核心特色:
    老板: 洛红尘（前极阴天尊，现为凡人，身份未公开）
    外貌: 永恒的萝莉姿态，是极阴本源最纯粹的体现
    绝对中立: 不参与任何纷争
    超然地位: 连六大宗门都敬重酒家规矩

  酒家规矩:
    一壶酒换一个故事: 唯一交易方式
    绝对安全: 任何人在此都不得动手
    身份不论: 正邪不问，只看故事
    永远中立: 不站任何立场

  势力规模:
    老板: 洛红尘（唯一）
    伙计: 无（洛红尘一人经营）
    客人: 每日数人至数十人不等
    特殊地位: 虽只有一人，但无人敢轻视

  地点:
    位置: 中央神州·剑鸣城（剑宗山下）
    环境: 普通酒家外表
    氛围: 温馨宁静，远离纷争

  特殊性:
    前神明: 洛红尘曾为极阴天尊
    自愿凡人: 不知何故成为凡人
    萝莉形态: 始终保持萝莉姿态，不老不死
    故事收藏家: 收集天下所有故事

  与外界关系:
    所有修士: 都可来此避难
    六大宗门: 尊重其超然地位
    正邪两道: 皆敬重酒家规矩

  酒家传说:
    极阴天尊: 曾经的绝世强者
    自封修为: 不知何故成为凡人
    守护之谜: 为何无人敢在此闹事
    故事之力: 据说故事本身有力量

  特殊地位:
    独一无二: 大陆唯一绝对中立之地
    修士避难所: 任何人都可暂避纷争
    超然存在: 不受任何势力控制
