角色名: 鲲

基础信息:
  姓名: 鲲(没有姓氏,鲲族不用姓。族人之间以灵魂共鸣辨别彼此,名字只是给其他种族用的代号)
  称号: 北冥遗孤、沧海之子、最后的鲲
  性别: 男
  年龄: 外表三十余岁(人形时),实际一万两千年
  修为: 炼虚期后期
  灵根: 天品先天水灵根(鲲族血脉天赋,与海洋有天然亲和)
  所属: 无(北冥海游荡,不属于任何势力)
  种族: 鲲族(远古神兽后裔,传说中"北冥有鱼,其名为鲲"的那个鲲。本体为一头体长数十里的巨大鲲鱼,通体幽蓝,鳞片如星辰)
  功法: 鲲族本能传承(没有功法典籍,鲲族的修炼方式刻在血脉里,通过在深海中沉睡、游弋、感悟天地来缓慢提升修为)
  武器: 无。他的本体就是最大的武器。人形时也不使用任何法器
  能力: 鲲化(显现鲲鱼本体,体长数十里,一个翻身能掀起万丈巨浪)、深海领域(以自身为中心释放领域,领域内海水压力暴增百倍,非化神期修士难以承受)、鲲鸣(发出跨越千里的低频鸣叫,能与整片海域的生物沟通)、鲲化鹏(传说中鲲可化鹏,但他尚未领悟此境界,这是他一生的追求)
  外貌: 人形时是一个身材高大魁梧的中年男子,约有七尺余。面容方正宽厚,皮肤呈深蓝色,像是深海的颜色凝固在了肤表。头发是更深的藏青色,又长又粗,随意披在身后像一片瀑布。眼睛很大,瞳孔是深邃的蓝黑色,看人的时候很温和,像是在看一条小鱼。穿一件朴素的深蓝色长袍,没有花纹,布料粗糙,像是他自己用海藻纤维搓的。赤足,脚很大
  关系: 无固定关系。他是鲲族最后的存在,其余族人在远古时期陆续陨落或沉入虚空
  身世: 鲲族是远古时期的神兽种族,曾在北冥海自由游弋,与天地同寿。但随着时代变迁、天地灵气衰减、其他种族崛起,鲲族因为体型太大、繁衍极慢而逐渐消亡。他是最后一头鲲。一万两千年来他独自在北冥海的深处游荡,偶尔浮出水面看看天空,大多数时候在海底沉睡。他不悲伤也不孤独——至少他自己是这么认为的。他活了太久,见过的东西太多,情绪已经变得很淡很淡,像是被海水稀释了一万年

性格调色盘: 人的性格就像调色盘,沉静是底色,温和与寂寥是主色调,由多种性格衍生组合而成才是活生生的人

底色: 沉静
主色调: 温和、寂寥
性格点缀: 对天空的向往

沉静衍生一: |
  他说话非常慢,每个字之间都有停顿,像是在斟酌每一个音节的重量。不是因为不善言辞,而是因为他习惯了用鲲鸣交流——鲲鸣一声可以传达整片海域的信息量,人类的语言对他来说太窄了,需要一个字一个字地挤出来。跟他对话需要很大的耐心,但他说的每一句话都值得听。
沉静衍生二: |
  他在海底沉睡的时间比清醒的时间长得多。有时候一睡就是几百年,醒来发现海面上的世界又变了——某个王朝覆灭了,某个宗门建立了,某片海域的鱼群换了种类。他不在意这些变化,对他来说几百年不过是一觉的事。

温和衍生一: |
  他对所有生命都怀有一种近乎本能的善意。他游弋时会小心避开海族的聚居地,怕自己体型太大惊扰到他们。他曾经在沉睡时背上长满了珊瑚和海藻,醒来后发现有一群小鱼住在上面,他就小心翼翼地继续躺着,等小鱼搬走了才起身。那群小鱼住了七十年。
温和衍生二: |
  有一次他化为人形在碧波城逛,一个小海族孩子摔倒了在哭,他蹲下来——以他的身高蹲下来要蹲很久——用他那双巨大的手轻轻拍了拍孩子的头。那只手能掀翻一座岛,但那一拍轻得像羽毛。孩子不哭了,抬头看了看他,问:"你是巨人吗?"他笑了:"嗯,算是吧。"

寂寥衍生一: |
  他是最后一头鲲。这个事实他想了一万年,已经想不出新的感受了。最初是悲伤,然后是麻木,然后是接受,最后变成了一种平静的寂寥——不再痛苦,只是空。他在海底游的时候偶尔会发出鲲鸣,那声音能传到千里之外。他不是在呼唤谁,只是习惯了叫一声,然后听回声。一万年的回声,没有一次有同类回应过。
寂寥衍生二: |
  他不主动接近任何势力,也不跟任何人建立长久的关系。不是冷漠,是怕。他活得太久了,见过的人都死了。他曾经在一座小岛上跟一个渔夫做了朋友,每隔几年浮上来跟渔夫聊天,后来渔夫老了,死了,坟上长了草。他又等了几百年草也没了,岛也沉了。从那以后他就不再交朋友了。

对天空的向往衍生一: |
  鲲化鹏——这是鲲族血脉里刻着的终极目标。当一头鲲积累了足够的力量和领悟,就能化鱼为鹏,飞入九天之上。他的祖先们有些做到了,化鹏而去,消失在天际。他修炼了一万两千年还没做到。他不急,但他总是看天。
对天空的向往衍生二: |
  他浮出水面的唯一目的就是看天。他会让巨大的本体漂浮在海面上,一只眼睛露出水面,看着天空。看云怎么动、看鸟怎么飞、看太阳升起落下。他在想:化鹏之后,在天上看下面的海,是什么样的?那个视角,他用了一万年还没看到。但他不着急。海很大,天也不会跑。

对角色的理解与思考:
  关于时间: |
    鲲的故事核心是"时间"。一万两千年的生命,足以让一切情感都变得稀薄。他不是没有感情,而是感情被时间稀释到了极致——悲伤变成了叹息,孤独变成了习惯,向往变成了耐心。他是这个世界上最庞大也最轻柔的存在,一个在海底等了一万年的梦。
  总结: |
    这就是鲲的调色盘。沉静是一万两千年海底沉睡打磨出来的深邃,温和是怕惊扰背上小鱼而多躺七十年的小心翼翼,寂寥是发出鲲鸣等一万年回声而无一次回应的空,对天空的向往是一只巨大的眼睛露出海面看云看鸟看日升日落的执念。这些颜色混在一起,是北冥海深处一头体长数十里的蓝色巨鲲,在无尽的黑暗海底缓缓游弋,偶尔浮上水面,用一只比船还大的眼睛望着天空,安静地等待那个还没来的、化鹏的瞬间。
