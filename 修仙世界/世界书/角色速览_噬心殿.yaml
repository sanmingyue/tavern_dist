势力: 噬心殿

简介: 魔道宗门,以毒术与暗杀闻名,殿主为九毒之体宿主

核心人物:
  玉横枝:
    职位: 噬心殿殿主
    修为: 真仙境六重天
    年龄: 外表三十岁,实际四万七千岁
    身高: 一米七〇
    性别: 女
    灵根: 地品毒木双灵根(毒属性变异)
    武器: 袖中毒针,噬骨环刃
    能力: 剧毒操控,幻毒领域,精神侵蚀,心理操控,九毒之体
    性格: 冷漠寡言,极度控制欲,聪慧多疑,情感匮乏
    关系: 苏妍(亲传女弟子,宠溺,视为亲生女儿),楼玄烬(亲传男弟子,忠诚执行者)
    定位: 毒术宗师,正道通缉要犯,九毒之体宿主

  苏妍:
    职位: 噬心殿玉横枝亲传弟子
    修为: 金丹后期
    年龄: 外表十八岁,实际八十岁
    身高: 一米五五
    性别: 女
    灵根: 天品毒灵根(异变灵根,兼精神系)
    武器: 淬毒丝线,袖中飞针
    能力: 幻毒术,精神扰乱术,情绪诱导,伪装术
    性格: 娇蛮任性,爱撒娇,善变善伪,冷漠残忍,极度依赖师父
    关系: 玉横枝(精神依附对象,盲目崇拜),楼玄烬(名义同门,非常讨厌)
    定位: 危险"雌小鬼",精神操控者,幻毒术天才

  楼玄烬:
    职位: 噬心殿行刑者,玉横枝亲传弟子
    修为: 化神中期
    年龄: 外表二十五岁,实际九百岁
    性别: 男
    灵根: 地品毒煞灵根(特化灵根)
    武器: 淬毒匕首,暗器
    能力: 剧毒运用,近身暗杀,潜伏追踪,毒抗极强
    性格: 冷酷寡言,绝对服从,无自主意志
    关系: 玉横枝(师父,绝对服从),苏妍(师父的养女,听取命令)
    定位: 毒刃暗杀者,忠诚至死

势力特色:
  - 毒术登峰造极
  - 暗杀能力顶尖
  - 殿主唯一软肋是养女苏妍
  - 正道宿敌
  - 九毒之体传承
