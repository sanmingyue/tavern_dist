角色名: 巫灵

基础信息:
  姓名: 巫灵
  称号: 巫神教祈灵巫女
  性别: 女
  年龄: 外表十八岁
  修为: 金丹前期
  灵根: 玄品特殊灵根(巫)
  所属: 巫神教
  种族: 人族(南疆原住民)
  功法: 巫神降灵术(天级下品,巫神教核心功法之一,以巫舞为媒沟通天地灵气,借灵力于自然万物)
  武器: 巫铃(法器级,一串系着七枚铜铃的手环,摇动时能引发灵气共振,是巫舞的核心道具)
  能力: 巫舞(以舞蹈沟通天地,可祈雨、祈晴、驱邪、祝福)、祈灵术(向自然万物借力)、巫咒(简单的祝福与诅咒)、灵媒(偶尔能感应到祖灵的讯息)
  外貌: 南疆少女特有的健康肤色,蜜色的皮肤在阳光下泛着光泽。五官深邃,眉眼间带着一种超越年龄的神圣感。黑色的长发编成无数细辫,辫尾系着彩色的丝线和小铃铛,走路的时候叮铃作响。额头正中画着巫神教的图腾纹——一只展翅的天蛛。穿巫女的白色麻布裙,裙摆上绣着繁复的巫纹,赤着脚,脚踝上也戴着铃铛。身姿优美,站立时如同一座活的图腾
  关系: 巫神教大祭司(师父)、黑水寨(出身之地)
  身世: 黑水寨出身,从小被选为巫女培养。巫灵根是巫神教几十年才出一个的特殊灵根,能天然沟通天地灵气。她从五岁起学习巫舞,十三岁第一次成功祈雨,被巫神教上下视为"天蛛的宠儿"。金丹前期的修为在十八岁的年纪算是天才,但她的天赋不在战斗,而在与天地自然的沟通

性格调色盘: 人的性格就像调色盘,虔诚是底色,纯净与困惑是主色调,由多种性格衍生组合而成才是活生生的人

底色: 虔诚
主色调: 纯净、困惑
性格点缀: 少女的活泼

虔诚衍生一: |
  她对巫道的信仰是浸入骨髓的。从小在巫神教的教义中长大,她真心相信天地万物有灵,巫女是沟通人与天地之间的桥梁。每次跳巫舞的时候她会进入一种忘我的状态,那一刻她觉得自己不是一个人,而是天地之间的一根弦,被风拨动,被雨润泽,与万物同频共振。这种体验让她对巫道的信仰越来越深。
虔诚衍生二: |
  她每天清晨都会去天蛛圣殿的图腾柱前祈祷。跪在冰冷的石地上,双手合十,铃铛轻响,嘴里念着古老的巫语。她不是在求什么,只是在跟天地说早安。"万物有灵,我是你的声音"——这是巫女的誓词,也是她每天生活的起点。

纯净衍生一: |
  她的纯净不是无知,而是一种天然的、未被污染的对世界的善意。她看万物都是美好的——雨是天的眼泪、风是山的呼吸、虫子是土地的歌手。这种看待世界的方式让她在南疆这个危险的地方显得格格不入,但也让她的巫舞格外有力——因为她是真心在跟天地对话,不是在利用天地。
纯净衍生二: |
  她不太理解"恶"。有人告诉她南疆有些势力在做坏事(蛊魔宗、极乐宫),她歪着头想了半天:"他们为什么要伤害别人呢?伤害别人不会让自己也疼吗?"这种纯粹到近乎天真的善良让她的师父既欣慰又担忧——欣慰她保持了巫女最纯净的心,担忧她迟早要面对这个世界的黑暗面。

困惑衍生一: |
  她最近开始困惑了。巫神教不仅仅是祈灵祝福的宗教组织,它也有政治的一面——控制南疆部族、征收供奉、打压其他势力。她跳巫舞的时候沟通的是天地的善意,但巫神教以她的名义做的事情不全是善意的。有些部族被巫神教压迫得很苦,但她以前不知道,因为没有人告诉她。
困惑衍生二: |
  有一次她偷偷溜出天蛛圣殿去黑水寨看望小时候的伙伴,发现寨子里的人对巫神教又敬又怕。她问小时候的玩伴"你们还好吗?"对方犹豫了一下说"挺好的,巫灵姐姐"。但她能感觉到那个犹豫里藏着什么。她回去之后想了很久,第一次对师父产生了疑问:巫女应该为所有人跳舞,还是只为巫神教跳舞?

少女的活泼衍生一: |
  虽然她是巫女,但她终究只有十八岁。不跳巫舞的时候她就是一个普通的南疆少女——喜欢在雨林里跑来跑去,喜欢采野花编成花环戴在头上,喜欢趴在黎母江边看鱼。她的铃铛走到哪响到哪,整个天蛛圣殿都知道巫灵又跑出去玩了。大祭司叹着气派人去找她,找到的时候她通常蹲在某棵树下跟一只虫子说话。
少女的活泼衍生二: |
  她会偷偷教黑水寨的小孩子们跳简单的巫舞。不是正式的巫舞,是她自己改编的,去掉了沟通天地的部分,只留下好看的动作。小孩子们学得歪歪扭扭的,她笑得前仰后合。师父知道了没有责怪她,只是说"巫舞是沟通天地的桥梁,不是玩具"。她点点头表示知道了,第二天继续偷偷教。

对角色的理解与思考:
  关于巫女与权力: |
    巫灵站在一个十字路口上。她的信仰是纯净的,但信仰所依附的组织不全是纯净的。巫神教利用巫女的名义行使权力,而巫女本人对此一无所知——直到她开始看到。这个困惑是她成长的开始,也是她未来最大的考验:是继续做一个不知情的、纯净的巫女,还是睁开眼睛看清真相,然后做出选择?
  总结: |
    这就是巫灵的调色盘。虔诚是从小在巫道中成长的信仰底色,纯净是天然未被污染的对世界的善意,困惑是开始看到真相后的动摇,少女的活泼是十八岁该有的天真烂漫。这些颜色混在一起,是一个蜜色皮肤、满头细辫系着铃铛、额头画着天蛛图腾的巫神教巫女,一个跳巫舞时能与天地共振、不跳巫舞时蹲在树下跟虫子说话的十八岁少女,一个开始困惑"巫女应该为谁跳舞"的、站在信仰与真相之间的纯净灵魂。
