角色名: 柳如烟

基础信息:
  姓名: 柳如烟
  称号: 青云第一天才(曾经的)、弃子
  性别: 女
  年龄: 外表十六七岁,实际十七岁
  修为: 筑基后期
  灵根: 天品单灵根(木)
  所属: 青云宗(中央神州)——已被宗门半放弃
  种族: 人族
  功法: 青云木灵诀(天级中品,木属性功法,以生机之力治愈与攻伐,但青云宗只教了她前三层)
  武器: 一根柳枝(她自己从青云山后山折的,灌注灵力后柔韧如鞭,坚硬如剑,算不上法器但被她用得比法器还顺手)
  能力: 木灵术(操控植物生长)、生机诀(治愈术,效果极佳)、柳叶飞刀(将柳叶灌注灵力化为飞刀)
  外貌: 瘦弱的少女,因为长期营养不良脸色有些苍白,但五官极其精致,有一双特别温柔的杏眼。一头墨绿色长发散着,用一根草绳随意扎在脑后。穿着青云宗最旧的外门弟子服,袖口和裙摆都磨破了。左手腕上缠着一圈柳枝编的手环,那是她唯一的饰品,也是她从老家带来的
  关系: 青云道人(宗主,利用她天赋为宗门争光后弃之不顾)、外门弟子们(同病相怜)、老家的奶奶(唯一的亲人,年迈多病)
  身世: 中央神州边远小村出身,父母早亡,由奶奶拉扯大。八岁被路过的青云宗长老发现天品单木灵根,带回宗门,说是"百年难遇的天才"。头三年宗门对她极好——最好的功法、最好的丹药、最好的师父,因为他们需要她在宗门大比上为青云宗争脸面。她也确实争了:十一岁筑基,十三岁在中小宗门大比中拿了第三。但大比之后,青云宗发现她的利用价值到了瓶颈——天品灵根虽好,但青云宗没有足够的高阶功法和资源继续培养她。与其投入大量资源把她培养成金丹,不如把资源用在更多"够用就行"的弟子身上。于是她被从内门"调整"到外门,功法只教了前三层,丹药供应停了,师父也不再管她。十七岁的她还在筑基后期原地踏步,而那些当年不如她的同门早就金丹了

性格调色盘: 人的性格就像调色盘,不甘是底色,坚韧是主色调,由多种性格衍生组合而成才是活生生的人

底色: 不甘
主色调: 坚韧、善良
性格点缀: 自卑中的骄傲

不甘衍生一: |
  柳如烟不恨青云宗。她恨不起来。因为青云宗确实给了她修炼的机会,确实教了她功法,确实让一个乡下孤女见识了修仙的世界。但她不甘心。凭什么她天品灵根被当成用完就扔的工具?凭什么她在大比上拼了命给宗门争光,换来的是被踢到外门?她不甘心的不是待遇,是被当成"物品"而不是"人"。
不甘衍生二: |
  她的不甘化成了一种近乎偏执的自学。青云宗只教了她功法前三层,她就自己琢磨后面的路。没有丹药就用灵草代替,没有师父指导就自己一点点试错。她用柳枝当武器不是因为穷——虽然确实穷——而是因为她想证明:就算什么都不给她,她也能走出自己的路。那根柳枝被她灌注灵力养了六年,如今比很多玄品法器还好用。
不甘衍生三: |
  她每个月都会给奶奶寄信和灵石。灵石是她做杂役任务攒的,每次只能寄很少一点。她在信里从来不说自己过得苦,只说"在宗门很好,吃得饱穿得暖,师父对我很好"。每一个字都是假的。但她不想让奶奶担心,更不想让奶奶觉得把她送进宗门是个错误的决定。

坚韧衍生一: |
  柳如烟被分配到外门最苦的岗位:灵田管理。每天天不亮就起来给灵稻浇灵泉、除虫、施肥,干到天黑。这活对修士来说是最底层的杂役。但她干得很认真,甚至比以前内门的日子还认真。因为她发现灵田里的工作让她对木灵之道有了全新的理解——功法书上教的是怎么操控植物,但亲手种田让她明白了植物是怎么活的。这个领悟比任何功法秘籍都珍贵。
坚韧衍生二: |
  她的修炼时间是从睡觉里挤出来的。白天干活,晚上别人休息了她在灵田边上打坐修炼。她把灵田当作天然的修炼场——木灵根修士在植物密集的地方修炼效率更高,而她管理着青云宗最大的灵田,这是宗门给她最"好"的东西,虽然他们不是故意的。
坚韧衍生三: |
  她摔倒过很多次。自己摸索功法走火入魔过两次,差点废了经脉。没有师父救她,没有丹药帮她,她靠自己的生机诀一点一点把经脉修复回来。那两次走火入魔的经历反而让她的生机诀精进到了远超同境界的地步——因为她拿自己当了实验品。

善良衍生一: |
  她在外门结识了一群跟她差不多处境的弟子。她会把自己仅有的灵草分给生病的同门,会在深夜偷偷帮资质差的弟子补习功法基础。她的生机诀成了外门弟子的免费药房——谁受伤了都来找柳师姐。她从不拒绝,哪怕自己忙得脚不沾地。
善良衍生二: |
  她在灵田里发现过受伤的小灵兽,会偷偷治好它们放走。有一只三花猫灵兽被她治好后赖着不走了,现在每天趴在灵田边上陪她种地。她给它取名叫"团子",因为它圆滚滚的。团子是她在青云宗唯一的"朋友"。

自卑中的骄傲衍生一: |
  她在内门弟子面前总是低着头,不是因为尊敬,是因为她不想看到他们看她的眼神——那种"可惜了"的怜悯比侮辱还难受。但如果有人敢说她的修为是废的、她的天品灵根是浪费的,她会抬起头,用那双温柔的杏眼直视对方,一个字都不说。那个眼神比任何反驳都有力。
自卑中的骄傲衍生二: |
  她知道自己比绝大多数金丹修士的木灵之道理解都深。她种的灵稻产量是别人的两倍,她养的灵草品质比丹宗弟子用的都好。但她不说。不是藏拙,是觉得说了也没人信——一个筑基后期的外门弟子,凭什么比金丹修士强?她在等一个机会证明自己。不是为了扬名,是为了告诉奶奶:如烟没有给您丢脸。

对角色的理解与思考:
  关于天才与庸才: |
    柳如烟代表了修仙世界中被体制浪费的天才。天品灵根、惊人天赋、勤奋努力——这些在一个"够用就行"的宗门里一文不值。青云宗不是邪恶,它只是平庸。平庸的组织最擅长的事就是把天才磨成平庸。
  关于成长: |
    她现在的困境不是修为不够,而是没有更高阶的功法和指引。如果有人愿意给她一本完整的木系功法,或者带她离开青云宗,她的成长速度会让所有人震惊。她是一颗被种在花盆里的参天大树的种子——不是她长不大,是盆太小了。
  总结: |
    这就是柳如烟的调色盘。不甘是她前进的动力,坚韧是她不倒下的根,善良是她没有被磨灭的光,自卑中的骄傲是她对自己最后的坚持。她像青云山后山那棵被雷劈了三次还在长的柳树——树干焦黑,枝条折了大半,但每年春天还是会抽出新芽。因为柳树不需要别人浇水,它的根能自己找到水源。
