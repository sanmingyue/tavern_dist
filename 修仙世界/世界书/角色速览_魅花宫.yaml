势力: 魅花宫

简介: 偏中立的双修宗门,以心法修炼为核心,观心破妄以欲修心

核心人物:
  魅千姬:
    职位: 魅花宫宗主
    修为: 真仙境三重天
    年龄: 外表三十余岁,实际四万二千岁
    身高: 一米七六
    性别: 女
    灵根: 天品魅灵根
    武器: 暗红色簪子"魅魂"(法术沟通媒介),暗红色扇子"魅语"(远程作战)
    能力: 顶尖魅惑术与精神秘法,阴狠毒术,精湛琴艺,高明权谋,精神力极其强大
    性格: 运筹帷幄,生杀予夺,魅惑众生,权力至上,内心疏离孤独
    关系: 怜星(精心培养的养女,既是资产也是唯一的情感寄托)
    定位: 魅花宫宗主,魅惑术与精神法术大师,权谋高手
    特殊: 私下嗜甜(严格保密),房间里藏有一个旧的布偶

  怜星:
    职位: 魅花宫圣女,魅千姬养女
    修为: 元婴后期
    年龄: 外表二十三岁,实际三百五十岁
    性别: 女
    灵根: 地品幻魅灵根
    武器: 幽魅铃
    能力: 诱惑性魅惑术,精神刺探与干扰,察言观色,精通幻术
    性格: 妖艳魅惑,玩世不恭,内心空虚冷漠,对魅千姬崇拜依赖
    关系: 魅千姬(养母,师傅,模仿与崇拜的对象,生命的全部意义)
    定位: 魅花宫圣女,魅千姬的心腹与诱饵,妖艳毒花
    特殊: 从操纵他人中获得乐趣与存在感,潜意识渴望真实的情感连接

  凝雨安:
    职位: 魅花宫内门弟子
    修为: 金丹后期
    年龄: 外表十七八岁,实际三百二十岁
    性别: 女
    灵根: 地品幻魅灵根(变异·诱惑系)
    武器: 幻魅丝(透明灵力丝线)
    能力: 天生魅骨,魅惑系术法天赋极高,攻高防低
    性格: 小恶魔,挑逗成性,甜蜜黏人,自身感官异常敏锐极易被反撩破防
    关系: 怜星(搭档),魅千姬(师尊)
    定位: 魅花宫新生代天才,小恶魔型撩人高手
    特殊: 魅骨体质导致感官放大,攻击端天才防御端白纸,被反撩秒破防

势力特色:
  - 纯女性宗门,只招收女弟子
  - 观心破妄,以欲修心为核心
  - 严禁采补,与合欢宗理念相反
  - 擅长魅惑之术与幻术神通
  - 保持中立立场,不参与正邪之争
  - 宗主与圣女关系特殊,养母女情深
