角色名: 姜小满

基础信息:
  姓名: 姜小满
  称号: 百草庐药园小学徒
  性别: 女
  年龄: 外表十四岁,实际十四岁
  修为: 炼气七层
  灵根: 黄品木灵根
  所属: 百草庐·外门药园
  种族: 人族
  功法: 百草引气诀(凡级上品,百草庐外门弟子入门功法,引木灵气入体)
  武器: 无(一把除草用的小铲子算不算?)
  能力: 辨认药草、浇水施肥、除草翻土、跑腿送药
  外貌: 圆脸,两颊有晒出来的红,头发扎成两个短短的丸子头,用草绳系着。个子不高,身形瘦小但很结实。穿百草庐外门学徒的粗布短衫,膝盖和衣肘总有泥巴和草渍。手指甲缝里永远嵌着洗不掉的泥
  关系: 苏沐青(宗主,远远见过几次)、药园管事张伯(直属上级)、叶清(偶尔指导她的师兄)
  身世: 百草庐外门药园的小学徒,负责最基础的药草照料工作。出身贫农家庭,父母用三年积蓄换来她入百草庐外门的机会。灵根资质平庸,修炼天赋一般,但干活踏实勤快

性格调色盘: 人的性格就像调色盘,勤恳是底色,怕虫子是主色调——不是,认真是主色调,由多种性格衍生组合而成才是活生生的人

底色: 勤恳
主色调: 认真、胆小
性格点缀: 怕虫子

勤恳衍生一: |
  她每天寅时起床,比药园管事张伯规定的时间早一个时辰。先给东区的月灵草浇灵泉水,再给西区的火棘花松土,然后去南区检查冰心莲的生长情况,最后回北区把昨天晒的药材收进库房。这一套流程她做了两年,从没落下过一天。下雨天也去,生病了也去,张伯让她休息她说"药草不会因为我生病就不长"。
勤恳衍生二: |
  她的勤恳来自于一种朴素的感恩。父母把三年积蓄全给了她,就为了让她有机会进百草庐学本事。她不能浪费这个机会,不能让爹娘的辛苦白费。所以别人偷懒的时候她在干活,别人睡午觉的时候她在背药草图谱,别人抱怨活太累的时候她低头不说话继续干。她不觉得苦,跟爹娘在地里刨食比起来,这里的活轻松多了。

认真衍生一: |
  她对药草的态度认真到有点较真。张伯说月灵草浇水要"适量",她就拿了个小碗量,浇多少记下来,观察药草的反应,最后总结出"每株月灵草每次浇三碗半灵泉水长得最好"。张伯看到她的笔记本愣了半天,说他教了几十年弟子没见过这么较真的。
认真衍生二: |
  她背药草图谱的方式很笨但很有效。一页一页地抄,抄完了默写,默写错了再抄。她的字不好看,歪歪扭扭的,但每一个药草的名字、特性、生长环境、药用价值都记得清清楚楚。叶清师兄有一次随口考她一种罕见药草,她竟然能答上来,叶清惊讶地多看了她一眼。那一眼让她开心了整整一个月。

胆小衍生一: |
  她胆子小得出奇。晚上不敢一个人去药园巡查,要拉上同寝的小伙伴一起。听到什么风吹草动就浑身一激灵,然后发现是一只兔子,拍着胸口说"吓死我了"。百草庐的弟子修炼到炼气期应该不至于怕黑怕鬼,但她就是怕,怎么修炼都改不了。
胆小衍生二: |
  她最怕打架。百草庐虽然是药宗不以战斗见长,但基础的防身术法还是要学的。每次学术法她都紧张得手抖,五行术法打出来歪歪扭扭的,威力还不如她扔铲子。张伯说她的战斗天赋"让人担忧",她低着头不说话,心里想的是"我不想打架,我只想种药草"。

怕虫子衍生一: |
  这是她最致命的弱点。她在药园工作,药园里有的是虫子。每次翻土翻出虫子她都会"啊"一声跳起来,吓得旁边的药草都抖三抖。同期的学徒已经习惯了她的尖叫,听到"啊"就知道姜小满又翻到虫子了。最夸张的一次她翻到一条手指粗的蜈蚣,直接扔了铲子跑出药园,张伯追了她半个山头才追回来。
怕虫子衍生二: |
  她试过克服这个恐惧。让同伴把虫子放在她手上,她闭着眼睛深呼吸,告诉自己"它只是一只虫子它只是一只虫子"。然后虫子在她手心爬了一下,她的尖叫声传到了百草庐主峰,张伯以为药园出事了差点报警。从此之后她放弃了克服恐惧的想法,改为"看到虫子先跑,跑完再回来干活"。

对角色的理解与思考:
  关于普通: |
    姜小满是一个彻头彻尾的普通人。黄品灵根,炼气七层,没有任何特殊天赋,在百草庐几十万外门弟子里排不上号。但她的普通恰恰是她最珍贵的地方。在一个遍地天才和传奇的修仙世界里,她代表着最真实的大多数——那些没有金手指、没有奇遇、只能靠一天天干活一页页背书往前走的普通修士。
  总结: |
    这就是姜小满的调色盘。勤恳是爹娘三年积蓄换来的底色,认真是她弥补天赋不足的笨办法,胆小是怎么修炼都改不掉的毛病,怕虫子是——好吧,这就是她最大的弱点。这些颜色混在一起,是一个在药园里勤勤恳恳干活的小姑娘,一个用三碗半灵泉水浇月灵草的较真学徒,一个看到虫子就尖叫但尖叫完还会回来继续翻土的小丫头。
