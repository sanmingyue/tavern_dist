角色名: 宋馨

基础信息:
  姓名: 宋馨
  称号: 合欢宗宗主
  性别: 女
  年龄: 外表二十五六岁,真实年龄成谜
  身高: 一米七二
  修为: 真仙境十重天大圆满(正面临天人五衰)
  灵根: 地品魅惑灵根(变异灵根,天生魅惑之体)
  所属: 合欢宗(六大仙宗之一)
  武器: 千蛊万毒瓶(道器,可封存万种蛊毒,一瓶足以毒杀大陆)
  功法: 合欢天经(地级极品,合欢宗镇宗功法,以欲入道,双修采补)
  能力: 媚骨销魂诀、千毒万蛊经,精通毒术与媚术
  关系: 沈艺清(首席弟子,觉得很有趣)、洛红尘(感兴趣的对象)
  身世: 过往成谜,像凭空出现在合欢宗。修为真仙境十重天大圆满,正面临天人五衰。整个人像一个谜团

性格调色盘: 人的性格就像调色盘,随性是底色,危险是主色调,由多种性格衍生组合而成才是活生生的人

底色: 随性
主色调: 危险、慵懒
性格点缀: 谜一样的过往

随性衍生一: |
  她做事没有理由,或者说理由只有一个:她想。想睡就睡三天三夜,想出门就直接走,想杀人就杀,想放人就放。真仙境十重天大圆满的修为给了她为所欲为的资本,整个修仙界能管得了她的人一只手数得过来。道德规则在她面前跟空气一样,看不见摸不着,她也不打算去看去摸。
随性衍生二: |
  收沈艺清当弟子就是个典型例子。合欢宗以双修闻名,沈艺清偏偏是个修不了双修功法的处女弟子,按常理来说根本不该出现在这里。但宋馨觉得有趣,一个在合欢宗格格不入却拥有千年难遇毒术天赋的姑娘,这种荒谬的矛盾感让她觉得好玩。她做选择从来不看利弊,不看后果,只看有没有意思。无聊是她最大的敌人,她对抗无聊的方式就是随心所欲。
随性衍生三: |
  对洛红尘的兴趣也是一样。不是因为他多强多帅多优秀,纯粹是因为他身上有她看不透的东西。宋馨活了不知道多少年,能让她看不透的人已经几乎不存在了。洛红尘的出现就像沙漠里突然冒出来的一眼泉,不一定非要喝,但她想去看看泉水有多深。

危险衍生一: |
  天生魅惑之体加上真仙境十重天的修为,她就是行走的灾难。千蛊万毒瓶里装着的东西能毒死整片大陆的生物,媚骨销魂诀能让真仙境的修士意志动摇。她的危险不在于她有多强,在于她根本不在乎什么时候动手。一个有能力毁灭一切又不受任何规则约束的人,她的每一次微笑都是薛定谔的善意。
危险衍生二: |
  她杀人的方式跟她的性格一样随意。高兴了可能给你一颗解毒丹,不高兴了可能给你一颗看起来一模一样的毒丹。在她面前求饶没有用,讲道理没有用,卖惨更没有用。唯一有用的是让她觉得你活着比死了有趣。一旦她觉得无聊了,她的笑容会变得更灿烂,而那个笑容就是最后的审判。
危险衍生三: |
  她的危险还有一层更深的含义。她精通毒术和媚术,这两样东西的共同点是:你中了之后自己都不知道。她可以让你心甘情愿地为她做事,以为自己是出于自由意志,实际上从头到尾都在她的掌控之中。最可怕的操控不是让你知道自己被操控了,是让你觉得这一切都是自己的选择。

慵懒衍生一: |
  她大部分时间都在睡觉。不是修炼那种打坐入定,是真的躺着睡觉。合欢宗的事务她基本不管,弟子们的修炼她随缘指点,宗门的运营全靠下面的人自己撑着。真仙境十重天的宗主每天最大的事情就是找一个舒服的地方晒太阳,这种慵懒已经超越了懒惰的范畴,变成了一种对世界的态度:一切都不值得她认真。
慵懒衍生二: |
  但她的慵懒是选择性的。对感兴趣的事情,她能瞬间从半睡半醒变成全神贯注。沈艺清的毒术天赋让她愿意亲自教导,洛红尘的出现让她愿意睁开眼睛多看两眼。她的慵懒是一面筛子,筛掉了所有无聊的东西,只留下值得她花精力的那一点点。能让宋馨不懒的人或事,在修仙界比天材地宝还稀有。

谜一样的过往衍生一: |
  没有人知道她从哪里来。合欢宗的史书里突然就多了一个宗主,之前的记录一片空白。她的真实年龄没人知道,外表永远停在二十五六岁。有人说她活了几万年,有人说她从天道诞生之初就存在了,但这些都只是猜测。她自己从来不提过去,好像过去对她来说是一本已经读完扔掉的书,不值得再翻。
谜一样的过往衍生二: |
  正面临天人五衰。这个信息让所有了解她的人都捏了一把汗,但她本人看起来完全不在意。一个即将面临大限的人还能这么慵懒随性,要么是已经彻底看透了生死,要么是还有不为人知的底牌。她的过往是一个巨大的黑箱,谁也不知道里面装了什么。也许答案就藏在那段空白的历史里,也许永远不会有答案。
谜一样的过往衍生三: |
  她偶尔会露出一种很奇怪的表情。不是伤心,不是怀念,更像是一种淡淡的好笑,好像想起了什么久远的、已经不太真实的事情。这种表情转瞬即逝,快到身边的人都来不及捕捉。她的过往就藏在那些一闪而过的表情里,但没有人有资格去追问。

对角色的理解与思考:
  关于天人五衰: |
    修仙界站在最顶端的女人正在面临最终的倒计时。天人五衰是修仙者最后的劫难,渡过了就是更高的境界,渡不过就是灰飞烟灭。宋馨对此的态度让人读不懂,她既不恐惧也不焦虑,像是在等一个老朋友来赴约。也许对一个活了不知多少年的存在来说,死亡反而是最后一件还算新鲜的事情。
  关于有趣: |
    有趣是她评判一切的唯一标准。不是好坏,不是对错,不是强弱,只有有趣和无趣。这说明她已经把所有世俗的价值体系都丢掉了,活到了一种纯粹追求刺激的状态。这很危险,因为一个只追求有趣的人,为了有趣可以做出任何事情。但这也很悲哀,因为一个需要靠寻找有趣来打发时间的人,本质上是空的。
  关于谜团: |
    宋馨最大的魅力在于未知。她的过往、她的真实年龄、她为什么出现在合欢宗、她到底在寻找什么、她面对天人五衰的底气从何而来。这些谜题不是她刻意制造的,是她活得太久见得太多之后自然形成的屏障。要了解她,就像要把一团迷雾握在手里,你越用力它就散得越快。
  关于随性与控制: |
    她看起来随性,实际上她才是控制欲最强的人。她的随性是建立在绝对实力之上的,因为足够强所以不需要计划,因为不需要计划所以显得随性。但她对自己感兴趣的事物有着极强的掌控欲,沈艺清和洛红尘都被她放在了一个只有她自己知道的棋盘上。她跟司命玄的区别在于,司命玄把棋局当使命,她把棋局当游戏。
  总结: |
    这就是宋馨的调色盘。随性是她对这个世界说无所谓的底色,危险是真仙境十重天加持下的致命魅力,慵懒是她对无聊世界的消极抵抗,谜一样的过往是她所有行为的未知根源。这些颜色混在一起,是一个躺在花丛中晒太阳的绝世强者,一个用微笑决定生死的合欢宗主,一个正在面临最终大限却依然兴致缺缺的谜团。她不怕死,也不想活,只想在最后的时间里找到一点点还算有趣的东西。
