势力名称: 幽冥魔宗

基本信息:
  名称: 幽冥魔宗
  定位: 西漠魔道势力,试图重塑无情新天道
  位置: 西漠南境·黑石深渊
  宗主: 焚天(寂灭魔君)
  势力等级: 顶尖魔道宗门

核心理念:
  理念: 万物终亡,夺魂炼魂,追求永生
  目标: 建立以幽冥魔宗为核心的魔道新秩序
  手段: 恐惧与死亡
  声望: 恐惧与瘟疫的化身,出现即伴死亡

组织结构:
  最高领袖:
    - 焚天: 宗主,真仙境五重天

  继承者:
    - 梵楚: 少主,化神期前期

  三大长老:
    - 叱骨: 战伐长老,真仙境三重天
    - 渊煞魔王: 刑罚长老,炼虚期圆满
    - 阴月魔妃: 情报长老,大乘期圆满

  核心战力:
    - 罗刹雪: 血屠卫指挥使,元婴期圆满
    - 玲涟: 堕落菩萨,元婴期前期

核心传承:
  根本大法:
    - 万魂魔典: 由无数亡魂哀嚎凝成的幽冥长卷

  镇宗咒印:
    - 镇魂锁·心奴印: 以痛苦与幻觉控制神魂的奴印

  隐藏功法:
    - 大域天魔经: 终极魔功,可吞噬天道化身心魔

标志性地点:
  核心区域:
    - 幽冥魔殿: 总坛,殿顶万灵血池映照人间生死
    - 罪渊: 剥离记忆令灵魂陷于无尽幻痛
    - 炼魂炉: 锻造魔兵诅咒法器之地
    - 葬魂台: 进行活祭与炼魂仪式的祭台
    - 奴园: 训练与折磨俘虏的地狱

势力关系:
  敌对势力:
    - 小雷音寺: 西漠佛国,佛魔之争
    - 正道各宗: 邪道宗门,人人喊打

  附属势力:
    - 万魔窟: 奴隶市场,渊煞魔王掌控
    - 焚天战团: 叱骨统帅的军团
    - 血屠卫: 罗刹雪统帅的精锐
    - 蛛网: 阴月魔妃的情报网络

特殊设定:
  佛魔之争:
    - 与小雷音寺争夺西漠控制权
    - 玲涟是对佛国最大的羞辱
    - 长期处于对抗状态

  核心矛盾:
    - 焚天与梵楚的理念之争
    - 渊煞魔王与阴月魔妃的竞争
    - 魔道与正道的对立

  终极目标:
    - 建立魔道新秩序
    - 焚天成为新的神明
    - 梵楚超越父亲的理念

势力优势:
  - 顶尖魔道宗门
  - 拥有真仙境强者
  - 情报网络遍布
  - 军事实力强大
  - 精神控制手段高明

势力劣势:
  - 与佛国对抗
  - 正道围攻
  - 内部理念分歧
  - 过于残忍名声败坏
