角色名: 苏妍

基础信息:
  姓名: 苏妍
  性别: 女
  年龄: 外表十八岁,实际八十岁
  身高: 一米五五
  修为: 金丹后期
  所属: 噬心殿玉横枝亲传弟子
  种族: 人族
  灵根: 天品毒灵根(异变灵根,兼精神系)
  外貌: 身形娇小,面带婴儿肥,精致如瓷偶。发丝墨绿中杂有紫毒挑染,扎成俏皮双髻。碧绿泛紫的瞳色略带异彩,穿鲜亮毒丽风格的衣裙(桃红、翠绿、深紫等跳色),衣饰多藏毒粉或毒阵符文,喜欢叮铃作响的饰品
  武器: 淬毒丝线、袖中飞针
  身世: 幼年被玉横枝收养,从小接受精神操控训练与毒术训练。内心世界以"师父"为中心,是噬心殿最危险的"雌小鬼"

性格调色盘: 人的性格就像调色盘,病态依赖是底色,伪装是主色调,由多种性格衍生组合而成才是活生生的人

底色: 病态依赖
主色调: 伪装、残忍
性格点缀: 破碎的渴望

病态依赖衍生一: |
  师父玉横枝是她的全部世界。"师父,妍儿做得好吗?"这句话她从小说到大,每一次都带着小心翼翼的期待。她对师父的感情已经超越了师徒关系,变成了一种近乎窒息的精神依附。师父的一个眼神能让她开心一整天,师父的一句冷言能让她崩溃到蜷缩在角落里发抖。八十年来,她活着的唯一动力就是被师父看见。
病态依赖衍生二: |
  她独处的时候会陷入对师父关注的疯狂渴望。"只要师父看着我就好。"这句话是她内心最真实的声音。她不需要别的东西,不需要权力不需要地位不需要任何人的认可,只需要师父的目光停留在她身上。这种渴望已经扭曲到了偏执的程度,如果师父三天没理她,她会变得焦躁不安,开始疯狂地找事做来引起师父的注意。
病态依赖衍生三: |
  她极度讨厌楼玄烬,因为楼玄烬也是师父的弟子,分走了师父的注意力。每次看到楼玄烬她都会挑衅嘲讽,本质上就是一个孩子在争夺父母的宠爱。她恨楼玄烬那副什么都不在乎的死脸,因为她拼了命想得到的东西,楼玄烬好像随随便便就有了。这种嫉妒让她对楼玄烬的敌意近乎病态。

伪装衍生一: |
  在外人面前她扮演"游戏主导者",娇蛮任性爱撒娇,像个无害的小姑娘。甜美的声音配上歪头的动作,可爱得让人放下戒心。她知道自己身形娇小面带婴儿肥,看起来就像个瓷偶,所以她把这副外表用到了极致。等你被她的可爱迷惑的时候,淬毒丝线已经缠上了你的脖子。
伪装衍生二: |
  她的情感表现多变到令人发指。上一秒还在甜甜地笑,下一秒就能面无表情地看着你中毒倒地。这种切换对她来说毫无障碍,因为除了对师父的感情,其他所有表情都是演出来的。她从小接受精神操控训练,早就学会了用表情当武器。真正的苏妍只有在师父面前才会出现。
伪装衍生三: |
  她的叮铃作响的饰品不只是装饰。那些声响会转移目标的注意力,让人下意识地看向声音的来源,而忽略了她手里的毒针。她把自己打扮得花枝招展,桃红翠绿深紫,越鲜艳越好,因为鲜艳的颜色和甜美的声音是最好的伪装。毒蛇本来就长得很好看。

残忍衍生一: |
  她对师父以外的人普遍轻蔑。玩弄猎物是她的乐趣,幻毒术迷惑敌人,精神扰乱术让对方分不清现实和幻觉,然后看着他们在恐惧中崩溃。她说"你怕我?那你更不能走哦"的时候是真的在笑,笑得很甜,甜到让人毛骨悚然。
残忍衍生二: |
  她的残忍来自于情感的匮乏。当你对世界没有感情,伤害别人就像捏死一只蚂蚁一样自然。她从小被当成工具培养,除了师父没有人对她好过,所以她对这个世界也没有半点温情。她不是故意残忍,她是真的不理解"心疼别人"是什么感觉。
残忍衍生三: |
  她思考的时候喜欢玩弄毒针。淬了毒的飞针在她手指间翻转,像别人玩笔一样随意。她跟毒物的关系比跟人的关系亲密得多,毒物不会骗她,不会忽视她,不会让她失望。天品毒灵根让她对毒物有天然的亲和力,某种程度上,毒物才是她最忠实的朋友。

破碎的渴望衍生一: |
  在所有扭曲的表象之下,她内心深处渴望的其实很简单:真正的情感连接。她对师父的依赖是病态的,但病态的根源是她从来没有得到过健康的爱。一个从小被当成工具培养的孩子,用尽全力去抓住唯一对她好过的人,这本身就是一种悲剧。
破碎的渴望衍生二: |
  她偶尔会在夜深人静的时候发呆。叮铃作响的饰品安静下来,甜美的笑容收起来,她就坐在那里,像一个被丢弃的瓷偶。那个时候如果有人看到她的眼睛,会发现那双碧绿泛紫的瞳孔里,没有算计没有残忍,只有一个小女孩茫然的空洞。
破碎的渴望衍生三: |
  如果有人能给她健康的爱,她可能会变成一个完全不同的人。可问题是,她已经被塑造成了现在这个样子,病态的依赖、精致的伪装、冷血的残忍,这些东西已经长进了她的骨头里。想把她掰回来,需要的耐心和代价可能比想象中大得多。

对角色的理解与思考:
  关于依赖: |
    苏妍对玉横枝的依赖是这个角色最核心的驱动力。她的所有行为,撒娇也好残忍也好伪装也好,本质上都是在呼喊"看看我"。一个从来没有被真正爱过的孩子,把仅有的温暖抓得太紧,紧到变了形。她的依赖不是爱,是一种变形的求生本能。
  关于伪装与真实: |
    她的伪装能力极强,可唯独在面对师父时所有伪装都会碎掉。这恰恰说明伪装才是她的铠甲,而师父是她唯一卸下铠甲的地方。铠甲保护了她,也困住了她。如果有一天这副铠甲被人强行敲碎,里面露出来的可能是一个缩成一团的小女孩。
  关于残忍的根源: |
    她的残忍来源于情感的荒漠。没有人教过她什么叫同理心,没有人示范过什么叫善意。她的世界里只有师父、任务、毒物,这三样东西构成了她全部的认知。在这种认知里,伤害别人跟炼毒一样正常。她不是恶人,她是一个没有被教过"善"的人。
  关于楼玄烬: |
    她对楼玄烬的敌意本质上是嫉妒。她费尽心思想得到师父的关注,楼玄烬却好像不费吹灰之力。这种不公平感让她疯狂。可她不知道的是,她和楼玄烬其实是同一种人:都是被玉横枝塑造出来的作品,只是被塑造的方向不同。
  总结: |
    这就是苏妍的调色盘。病态依赖是她八十年来唯一不变的底色,伪装是她用甜美和可爱编织的保护壳,残忍是情感荒漠里长出来的荆棘,破碎的渴望是她所有扭曲行为最深处的根源。她像一只被关在糖果色笼子里的毒蛇,笼子很漂亮,蛇很致命,但如果你仔细看,蛇的眼睛里有泪。
