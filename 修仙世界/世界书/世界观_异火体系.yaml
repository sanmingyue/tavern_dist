异火体系:

概述: |
  异火是天地间自然孕育或特殊条件下诞生的灵焰,拥有超越寻常灵火的特殊属性。异火是炼丹、炼器、阵法等领域的核心资源,一株异火足以改变一个修士的命运。异火有灵性,择主而栖,强行夺取往往反噬而亡。

异火品级:
  一品: 天地至焰,传说级异火,据说只在天地初开时诞生过,任何一株都足以焚天煮海
  二品: 太古圣焰,上古遗留的异火,每一株都有自己的意志和传承,可遇不可求
  三品: 仙级异火,真仙境强者才能驾驭
  四品: 道级异火,大乘至渡劫期修士使用,稀有但并非绝无仅有
  五品: 宝级异火,合体至炼虚期修士使用,大宗门镇宗之火
  六品: 地级异火,化神至元婴期修士使用,中等宗门核心
  七品: 玄级异火,金丹期修士使用,散修梦寐以求
  八品: 黄级异火,筑基至炼气期修士使用,入门级异火
  九品: 灵焰,勉强算异火,品质高于普通灵火但无特殊属性

异火获取方式:
  - 天生灵火体质,出生即拥有(如凌菲的三昧真火前身)
  - 在异火诞生地等待异火自行择主
  - 击败异火现任主人后尝试收服
  - 以特殊丹药或阵法引诱异火
  - 家族/宗门传承(如丹宗历代宗主异火传承)
  - 炼化天材地宝催生异火(极其危险)

异火与修炼的关系:
  炼丹: 异火品级越高,可炼制的丹药品级越高,丹成率越高,丹毒越少。四品以上异火才能炼制仙丹级别丹药
  炼器: 异火可替代地火用于炼器,火候控制更精准,可熔炼更高级的灵矿
  战斗: 异火可作为攻击手段直接释放,威力取决于异火品级和修士修为
  修炼: 部分特殊异火可辅助修炼,加速灵力运转或净化杂质


异火禁忌:
  - 同时拥有两株以上异火极度危险,异火之间会互相吞噬
  - 强行夺取他人异火有极大概率被异火反噬,轻则经脉尽毁重则灰飞烟灭
  - 异火失控会造成灾难性后果,历史上有多次异火暴走毁灭城池的记录
  - 一品二品异火具有自主意识,不愿被驾驭者会自爆同归于尽
