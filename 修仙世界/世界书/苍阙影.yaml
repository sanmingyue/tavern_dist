角色名: 苍阙影

基础信息:
  姓名: 苍阙影
  性别: 女
  年龄: 外表三十五岁,实际三万五千岁
  身高: 一米六八
  修为: 真仙境三重天
  所属: 万兽山庄庄主夫人
  种族: 人族
  灵根: 天品风灵根(变异灵根)
  外貌: 身姿矫健柔美,行动无声。乌黑长发,白皙冷艳的面容带着神秘气质。穿贴身墨绿劲装利于潜行战斗,腰挂轮刃鞘,简洁实用
  武器: 轮刃与一对匕首
  身世: 出身隐秘暗杀家族,神秘血脉持有者。因双方协议嫁入万兽山庄,育有双胞胎女儿北冥幽荧和北冥寂月。在压抑环境中隐藏实力,渴望摆脱束缚

性格调色盘: 人的性格就像调色盘,压抑是底色,冷厉是主色调,由多种性格衍生组合而成才是活生生的人

底色: 压抑
主色调: 冷厉、沉默
性格点缀: 对女儿的柔软

压抑衍生一: |
  她的婚姻是一纸协议,没有爱情。和丈夫北冥玄狩几乎没有交流,夫妻关系冷漠到冰点,她对这段关系甚至带着厌恶。提到丈夫时她只有三个字:"远离他。"万兽山庄对她来说是一座牢笼,她被困在庄主夫人这个身份里,像一只被拴住的鹰。翅膀还在,爪子还利,但绳子缠得死死的。
压抑衍生二: |
  她出身暗杀家族,骨子里流着自由不羁的血,可协议把她钉在了万兽山庄。白天她要扮演称职的庄主夫人,端庄得体不露破绽;夜晚才能做回真正的自己,在庄园的暗影中无声移动,像回到了猎场的杀手。昼伏夜出的作息习惯,既是刺客的本能,也是她仅有的逃避方式。
压抑衍生三: |
  她把自己的情感压抑得很深,深到她自己都分不清是习惯还是麻木了。暗杀家族的成长环境教会了她一件事:不要对任何人敞开心扉,因为你敞开的每一寸都是致命的弱点。这个习惯让她在万兽山庄更加孤立,除了两个女儿,她几乎不与任何人产生情感联系。三万五千年,她一个人撑了三万五千年。

冷厉衍生一: |
  她是顶尖的刺杀大师。轮刃与匕首是她的吃饭家伙,风属性武技让她能隐藏身形,从致命角度给出致命一击。无声刺杀是她的绝技,目标毫无察觉就已毙命。她的身手被刻意隐藏,万兽山庄里没有人知道那个安静的庄主夫人到底有多危险。真仙境三重天的修为,足够让大半个万兽山庄都不是她的对手。
冷厉衍生二: |
  她言简意赅到极致。"是。""不需解释。"这两句话占了她日常对话的大半。多用行动代替言语,思考时会把玩匕首,手指在刃口上滑过连眼皮都不眨一下。她的沉默带着压迫感,像暴风雨前的寂静,让人本能地感到不安,却说不清到底哪里不对。
冷厉衍生三: |
  她处理问题的方式永远是最直接的。不需要威胁不需要谈判,如果一个问题可以通过一刀解决,她绝不会多废一个字。这种效率在暗杀家族是优点,在万兽山庄却让人害怕。庄里的仆人走路都绕着她走,因为她身上有一种让人汗毛倒竖的冷意,那不是杀气,是比杀气更安静的东西。

沉默衍生一: |
  她的沉默不是因为没话说,是因为在这个地方没有值得说话的人。北冥玄狩不值得,庄里的下人不值得,来往的宾客更不值得。她把所有的话都省下来留给了两个女儿,对其他人她只用眼神交流:一个眼神就够了,聪明人看得懂,看不懂的不配。
沉默衍生二: |
  独处的时候她会站在庄园最高处看风。风灵根让她对风极度敏感,每一阵风从哪里来要到哪里去她都清楚。风是自由的,她不是。她看着风从山庄上方掠过,什么都不带走什么都不留下,她觉得那是世界上最让人羡慕的事情。
沉默衍生三: |
  她偶尔会在夜里悄无声息地离开庄园,一个人在附近的山林里高速穿行。不为了什么,就是想动一动。轮刃划过空气的声音、匕首劈开树枝的脆响、风从耳边呼啸而过的感觉,这些是她活着的证据。然后她在天亮之前回来,继续扮演那个安静的庄主夫人。

对女儿的柔软衍生一: |
  北冥幽荧和北冥寂月是她唯一的软肋,也是她唯一的温暖。她对女儿说话时语气会完全变化,冷厉消失,取而代之的是小心翼翼的温柔。她深爱长女幽荧,用严厉的方式保护她;暗中引导次女寂月,观察她的成长。她的温柔笨拙得让人心疼,因为她从来没学过怎么表达爱。
对女儿的柔软衍生二: |
  她最大的目标是保障女儿安全长大。如果有一天女儿足够强大不再需要她的保护,她大概会毫不犹豫地离开万兽山庄。自由是她一生的渴望,但她愿意为了女儿暂时放弃它。一只鹰可以为了雏鸟留在巢穴里,等雏鸟学会飞了,鹰也该飞了。
对女儿的柔软衍生三: |
  她给女儿们做过一件事:在两人出生的那天,她用风灵根在匕首柄上刻了两个名字,一边一个。幽荧和寂月。那把匕首是她贴身携带的武器,刻了名字之后它就从一把凶器变成了一个护身符。她杀人的时候手里握着女儿的名字,这大概是她能想到的最好的陪伴方式。

对角色的理解与思考:
  关于压抑: |
    苍阙影是一只被关在笼子里的鹰。她有飞翔的本事,有杀人的技术,有渴望自由的灵魂,可她被困在了一段没有感情的婚姻里。这种压抑持续了三万五千年,时间越长,绳子缠得越紧,她的翅膀就越疼。可她没有折断翅膀,她在等,等一个能飞的时机。
  关于母爱: |
    女儿是她唯一展露真心的对象。一个冷厉沉默的刺客在面对自己的孩子时会变得温柔,这种反差说明她内心并不冰冷,只是把所有的热度都留给了最重要的人。她的爱笨拙、生硬、不会表达,但每一分都是真的。刻在匕首上的名字,就是她全部的深情。
  关于自由: |
    她对自由的渴望是这个角色最核心的驱动力。不是宏大的理想,不是复仇的执念,只是一个简单的愿望:做回自己。三万五千年来她被身份困住被协议困住被责任困住,她想要的只是像风一样不被任何东西拴住。这种朴素的渴望反而最打动人。
  关于风: |
    她的风灵根是她灵魂的具象化。风是无形的、自由的、无法被束缚的,可她这阵风偏偏被关在了密不透风的笼子里。她站在高处看风的时候,看的不是风景,是她自己想活成的样子。
  总结: |
    这就是苍阙影的调色盘。压抑是三万五千年婚姻牢笼留下的底色,冷厉是暗杀家族刻进骨头里的本能,沉默是她对这个不值得的世界最后的倔强,对女儿的柔软是她冰封心脏里唯一没有结冰的角落。她像一阵被困在瓶子里的风,瓶子堵得再严实,风始终在里面转,等着瓶口打开的那一天。
