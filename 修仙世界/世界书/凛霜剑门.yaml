凛霜剑门:
  定位: 正道强宗，冰系剑道传承

  核心理念: 冰心剑魄，霜冷九州

  修炼体系:
    冰系剑诀: 核心功法，剑气附带极寒之力
    寒心诀: 修炼心法，以冰寒淬炼剑心，磨砺意志
    霜冻领域: 高阶剑修可展开寒冰领域，冻结万物

  宗门特色:
    纯女性宗门: 只招收女弟子
    门规森严: 戒律严苛，违者严惩
    气质清冷: 弟子皆气质清冷，不苟言笑
    剑术高绝: 以冰系剑道闻名天下，攻守兼备

  与外界关系:
    与剑宗: 同为剑修，互相尊重，偶有切磋
    与赤阳谷: 冰火相克，关系微妙，有竞争
    与北原魔土: 常年守卫北境，与魔族交战

  宗门规模:
    门主: 顾千雪(凌霜仙子)
    峰主: 七位
    内门弟子: 八千余人
    外门弟子: 五万余人
    记名弟子: 二十余万人（北境各地）
    附属势力: 临渊城及北境要塞群，人口数百万

  特色资源:
    寒晶: 极寒之力凝聚的晶石
    冰髓: 万年寒冰精华
    霜铁: 炼制冰系飞剑的材料
    冰系剑诀: 独门冰系剑道传承

  山门地点:
    位置: 北原魔土与中央神州交界·万仞寒山·极北冰原
    环境: 终年冰封，寒风凛冽，积雪千年不化，北望魔土，南望神州
    建筑: 冰霜宫殿，晶莹剔透
    战略意义: 守卫北境要塞，抵御魔族南侵

  附属城镇:
    临渊城: 北境主城，寒晶交易中心，北境守卫前哨

  门规戒律:
    严禁与男子私通: 违者逐出师门
    严禁泄露剑诀: 冰系剑诀不得外传
    严禁畏战: 面对强敌不得退缩
