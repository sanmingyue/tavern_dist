势力: 青云宗

简介: 正道中等宗门,表面正派内里复杂,以恩将仇报闻名修真界

核心人物:
  青云道人:
    职位: 青云宗宗主
    性别: 男
    特征: 表面公正,实则被世家势力左右
    评价: 能力平庸,缺乏魄力

  风烬雪:
    职位: 原青云宗首席大弟子(已被发配至寒池禁地)
    修为: 曾是合体境后期大圆满,现已修为尽废
    年龄: 三千五百余岁
    性别: 女
    身高: 一米七
    特殊状态: 双目失明,灵根断裂,剑心破碎
    能力: 曾是无情剑道大成,剑心通明,千年不遇的剑道奇才
    性格: 平静淡漠,无悲无喜,已勘破世情,意志钢铁
    过往: 百余年前魔道入侵,为守护宗门燃烧本源灵根击退强敌,代价是修为尽废双目失明
    遭遇: 救宗门后被恩将仇报,师妹夺其剑谱,师兄占其洞府,被宗主发配至寒池禁地
    现状: 日复一日坐在刺骨寒池中,以极寒之气压制体内残余灵力,忍受锥心刺骨之痛
    定位: 被抛弃的英雄,修真界悲剧的象征

势力特色:
  - 以剑道为主,但水平不及剑宗
  - 世家势力强大,把持话语权
  - 等级森严,世家子弟与散修弟子地位天差地别
  - 恩将仇报,英雄无用后一脚踢开
  - 寒池禁地囚禁"无用之人"
  - 修真界耻辱,被人瞧不起
