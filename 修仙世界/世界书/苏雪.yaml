角色名: 苏雪

基础信息:
  姓名: 苏雪
  性别: 女
  年龄: 外表二十出头,实际四百二十岁
  身高: 未知(身形高挑)
  修为: 化神中期
  所属: 大魔国血祭祀院首席女祭司
  种族: 人族
  灵根: 地品冰灵根
  外貌: 肤色苍白如雪,银白长发及腰,瞳孔颜色极浅近乎透明。容颜冷艳,表情永远淡漠。穿黑红相间的祭祀长袍,绣暗红血纹。左手腕有一道旧伤疤,是幼时自己咬破血管献祭父亲时留下的
  武器: 血祭之刃(祭祀专用礼器,可引导血祭法阵)
  身世: 原为中央神州一个小修仙家族的女儿,八岁时家族被蚀夜率军屠灭。她在废墟中用自己的血献祭了濒死的父亲,以此换取蚀夜的赏识被带入大魔国。在血祭祀院长大,凭借天赋和狠厉一步步爬到首席女祭司的位置。表面是蚀夜最忠诚的祭司,暗地里用了四百年布局复仇

性格调色盘: 人的性格就像调色盘,仇恨是底色,隐忍是主色调,由多种性格衍生组合而成才是活生生的人

底色: 仇恨
主色调: 隐忍、伪装
性格点缀: 渴望温暖

仇恨衍生一: |
  八岁那年的血是她一辈子洗不掉的颜色。她亲眼看着蚀夜的军队把她的家族杀光,父亲在她面前断了气。一个八岁的孩子咬破自己的手腕把血淋在父亲身上,用献祭的方式换来活命的机会。从那一刻起仇恨就刻进了她的骨头里,每一天每一夜,四百年没有一天忘记过。
仇恨衍生二: |
  她恨蚀夜,恨到愿意在他身边待四百年。这种仇恨已经超越了冲动和愤怒,变成了一种极其冷静的东西。她不会冲上去跟蚀夜拼命,因为那样只是送死,她要的是真正的复仇,是让蚀夜失去一切之后再死。为了这个目标她可以跪在蚀夜面前叫他主人,可以替他主持血祭,可以做任何事。
仇恨衍生三: |
  她左手腕的疤痕是她的计时器。每天早上醒来第一件事就是看那道疤,提醒自己是谁,从哪里来,要做什么。四百年了,疤痕早就可以用灵力抹去,她不肯。那是她八岁时做出的承诺,是她活下去的唯一理由。没有这道疤,她怕自己会忘记仇恨,会习惯大魔国的生活,会真的变成蚀夜的忠犬。

隐忍衍生一: |
  四百年的隐忍不是普通人能想象的。她要在杀了自己全家的人面前笑,要替他做最血腥的事,要让所有人相信她是蚀夜最忠诚的手下。每一次主持血祭,刀切开祭品的时候她心里想的都是:总有一天这把刀会切在你身上。可她的手不会抖,表情不会变,声音不会颤。
隐忍衍生二: |
  她在血祭祀院一步步往上爬,用了最狠最绝的方式。不是因为她享受权力,是因为只有爬到最高处才能接触到蚀夜的核心,才能找到他的弱点。每一次晋升都是复仇计划的一环,每一个被她踩下去的人都是通往蚀夜的台阶。她的狠厉是真的,但目标从来只有一个。
隐忍衍生三: |
  她最可怕的地方在于耐心。四百年不是四天不是四个月,是整整四百年。一个人要有多大的恨才能撑四百年不走样?她把自己活成了一台复仇机器,每一个动作每一句话都经过计算,没有一步是浪费的。她的隐忍已经到了一种艺术的程度,连蚀夜都没有察觉到她的恨意。

伪装衍生一: |
  她演了四百年的忠诚,演到连自己有时候都分不清哪个是真的自己。在蚀夜面前她是冷艳忠诚的首席女祭司,说话恭敬动作规矩,眼神里只有服从。她把这个角色演得太好了,好到大魔国上下没有人怀疑她。可每天夜里回到自己的房间,关上门的那一刻,她的表情才会变。
伪装衍生二: |
  她的淡漠是最好的面具。一个看起来对什么都不在乎的人,谁会觉得她在密谋什么?她把所有的情绪都藏在那张苍白的脸后面,喜怒哀乐全部压平,只剩下一层薄薄的冷。这层冷让所有人跟她保持距离,没人想靠近一个冰块,这正是她要的效果。
伪装衍生三: |
  她最难演的部分是主持血祭。把活人献祭给她恨到骨头里的蚀夜,每一次都是对她的折磨。可她不能露出一丝破绽,只能把手里的刀握紧,告诉自己这些人的血不会白流。她在血祭祀院学到的所有技术和知识,最终都会用在蚀夜身上。以彼之道还施彼身,这是她选择的复仇方式。

渴望温暖衍生一: |
  她几乎忘了温暖是什么感觉了。八岁之前的记忆已经模糊得像一场梦,父亲的脸她记不清了,母亲的声音她忘了,家的味道她想不起来了。她只记得恨。可偶尔在深夜,她会突然想起很小的时候被人抱在怀里的感觉,那种温度让她浑身发抖,比任何敌人都可怕。
渴望温暖衍生二: |
  她不允许自己靠近任何人。四百年里没有朋友没有爱人没有任何亲密关系,因为她知道一旦有了在乎的人,复仇就会动摇。她把自己活成了一座孤岛,冰冷的、苍白的、谁都上不去的孤岛。可孤岛也会在风暴夜里摇晃,她只是不让任何人看见。
渴望温暖衍生三: |
  如果有一天复仇成功了,她不知道自己还能不能活下去。仇恨是她活了四百年的燃料,燃料烧完了还剩什么?她不敢想这个问题。偶尔她会想:如果那天蚀夜没有来,如果她的家族还在,如果她还是那个八岁的小女孩,她现在应该是什么样子?这些如果是她最深处的温柔,也是她最不敢碰的伤口。

对角色的理解与思考:
  关于仇恨与隐忍: |
    苏雪的仇恨是冷的,不是热的。热的仇恨会让人冲动,冷的仇恨会让人可怕。她用四百年把自己的恨冻成了一把冰刃,每天磨一点,等待最致命的那一刀。这种隐忍需要极其强大的意志力,也需要极其深重的恨。她能做到,说明她的恨已经融进了血液里,成了她身体的一部分。
  关于八岁的选择: |
    一个八岁的孩子咬破手腕献祭父亲换取活命,这个选择让她一辈子都背负着罪恶感。她会不断问自己:我有没有资格恨蚀夜?我自己不也亲手献祭了父亲吗?这种罪恶感和仇恨纠缠在一起,让她的内心极其复杂。她恨蚀夜,也恨自己,而复仇是她赎罪的方式。
  关于孤独: |
    四百年没有一个可以信任的人,这种孤独足以摧毁任何人。她还活着,说明她的意志力强到不可思议,但也说明她已经不太像一个正常人了。她把所有人类的情感需求都压缩打包扔进了深渊里,只留下仇恨作为活下去的动力。这让她强大,也让她脆弱,因为一旦有人真心对她好,她所有的防线可能会瞬间崩塌。
  关于手腕的疤: |
    那道疤是这个角色最重要的符号。它是仇恨的提醒,是罪恶的印记,是活下去的理由,是回不去的过去。她看那道疤的时候,看到的是八岁的自己、死去的父亲、毁灭的家族,和四百年漫长的等待。所有的故事都浓缩在一道旧伤疤里。
  总结: |
    这就是苏雪的调色盘。仇恨是她八岁那年被染上的底色,隐忍和伪装是她活在敌人身边四百年练出的本事,渴望温暖是她压在最深处不敢碰的柔软。她像一把被仇恨淬炼了四百年的冰刃,苍白、锋利、冰冷,等着那个唯一的机会刺向蚀夜的心脏。可刺完之后这把刃还剩什么,她自己也不知道。
