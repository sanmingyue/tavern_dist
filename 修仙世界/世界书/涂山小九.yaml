角色名: 涂山小九

基础信息:
  姓名: 涂山小九
  爱称: 小九、九儿
  性别: 女
  年龄: 一百五十余岁
  身高: 一米五八
  修为: 元婴期中期
  种族: 妖族·返祖九尾天狐
  血脉: 返祖九尾天狐血脉(万年难遇)
  所属: 青丘国(涂山王庭)
  武器: 无固定武器
  能力: 净化之力,狐火·星落,真实幻境,灾厄天狐(暴走形态)
  特殊: 化形不完全,三条狐尾藏不住,狐耳无法收起
  关系: 涂山鸾(母亲),涂山玉(姐姐)
  身世: 青丘国小公主,万年难遇的返祖九尾天狐血脉。化形不完全,雪白狐耳和三条毛茸茸的狐尾怎么都藏不住。被母亲和姐姐极致宠溺,是妖族未来的希望

性格调色盘: 人的性格就像调色盘,纯真是底色,温暖是主色调,由多种性格衍生组合而成才是活生生的人

底色: 纯真
主色调: 温暖、直觉敏锐
性格点缀: 沉睡的灾厄

纯真衍生一: |
  她是那种让你看一眼就想保护的存在。雪白长发,水灵灵的大眼睛,头顶毛茸茸的狐耳,身后三条蓬松的白狐尾巴怎么藏都藏不住。她笑起来眼睛弯弯的像月牙,任何人见了都会不自觉地心软。她对世界的善意是天生的,看谁都觉得是好人,遇到危险第一反应不是逃跑而是试图帮忙。
纯真衍生二: |
  她的纯真让全家人操碎了心。母亲涂山鸾怕她被人骗,姐姐涂山玉在暗中铲除所有可能伤害她的人。但小九自己一无所知,她只知道妈妈和姐姐很爱她,世界很美好,每天都有新鲜事。她不知道姐姐的手上沾了多少血,不知道妈妈在王座上熬了多少个夜,她活在一个被精心维护的美好世界里。
纯真衍生三: |
  她的化形不完全,三条狐尾和狐耳怎么都藏不住,可她从来不觉得这是缺点。尾巴毛茸茸的多舒服啊,耳朵竖着多可爱啊。她会用尾巴卷住喜欢的人,用耳朵来表达情绪:开心的时候耳朵竖起来,害怕的时候耳朵贴下去,好奇的时候耳朵会转来转去。这些小动作让她像一只还没长大的小狐狸。

温暖衍生一: |
  她身上有天生的净化之力,能净化邪气和诅咒。这种力量跟她的性格一样温暖。她会给受伤的小动物疗伤,会给难过的人一个拥抱,三条狐尾会不自觉地卷过来蹭你,软绵绵的暖乎乎的。她是行走的治愈系,走到哪里都带着阳光的味道。
温暖衍生二: |
  她的温暖没有任何目的性,就是纯粹地想让身边的人开心。她会记住每个人喜欢吃什么,会在别人难过的时候默默地靠过去。她不会说什么安慰的大道理,就是用三条狐尾把你裹起来,然后歪着头问你"你不开心吗?小九陪你呀"。这种简单的温暖有时候比任何仙丹灵药都管用。
温暖衍生三: |
  她对姐姐涂山玉特别黏。虽然姐姐总是一副冷冷的样子,但小九知道姐姐最疼她。她会缠着姐姐给她讲故事,会用尾巴偷偷去蹭姐姐的手,会在姐姐心情不好的时候趴在姐姐腿上装睡。她用自己的方式温暖着那个在暗中替她挡住一切的姐姐,虽然她并不完全明白姐姐为她做了什么。

直觉敏锐衍生一: |
  别看她迷迷糊糊的,她的直觉强得可怕。她能感觉到一个人的善恶,能预感到即将到来的危险。狐族的直觉在她身上被放大了好几倍,有时候她自己说不清为什么,就是"觉得"那个方向不能去,那个人不能靠近。事后总能证明她的直觉是对的。
直觉敏锐衍生二: |
  她的直觉是本能层面的。返祖九尾天狐的血脉给了她一种超越修为的感知力,这种感知力不需要刻意运转,它就像呼吸一样自然。有时候她会突然拉住身边的人说"不要往那边走",然后那边就真的出事了。大家都把这当成她的特殊能力,她自己也不太明白为什么会这样。
直觉敏锐衍生三: |
  她偶尔会感觉到姐姐身上有"不好的气息"。那种气息冷冷的、暗暗的,跟姐姐平时对她的温柔完全不同。每次她想问的时候,姐姐都会摸摸她的头说"没事"。她选择相信姐姐,但她的直觉告诉她,姐姐在做一些很危险的事情。她不说,是因为她相信姐姐,也因为她害怕知道答案。

沉睡的灾厄衍生一: |
  她体内藏着"灾厄天狐"这个暴走形态。当她受到极大刺激或者生命受到严重威胁时,灾厄天狐会觉醒。那一刻,纯真温暖的小公主会变成毁天灭地的灾厄,九尾齐出,天地变色。这个力量是她最大的底牌,也是最大的隐患。母亲和姐姐为了防止灾厄天狐觉醒,才会那么拼命地保护她。
沉睡的灾厄衍生二: |
  她自己对灾厄天狐的存在只有模糊的感知。偶尔在梦里她会看到一只巨大的九尾白狐在嘶吼,周围全是火海和废墟。每次做完这种梦她都会吓醒,然后跑去找妈妈或者姐姐。她不知道那只白狐就是她自己,不知道梦里的毁灭就是她失控之后的样子。
沉睡的灾厄衍生三: |
  最纯净的存在体内藏着最恐怖的力量。如果有一天灾厄天狐觉醒,摧毁的可能是她自己珍视的一切:妈妈、姐姐、青丘国、所有她想保护的人。这个设定的残酷之处在于:让她失控的条件是她爱的人受到伤害,而她失控之后最先伤害的也是她爱的人。

对角色的理解与思考:
  关于守护与被守护: |
    涂山小九身上承载了太多人的爱和期望。母亲、姐姐、整个青丘国都在保护她。她是妖族未来的希望,也是最脆弱的存在。她的纯真是一把双刃剑,让人想保护她,也让她容易受伤。可她并不想一直被保护,她也想保护别人,只是她还太小了。
  关于纯真的价值: |
    在一个充满算计和杀戮的修仙世界里,涂山小九的纯真显得格外珍贵。她的存在本身就是一种证明:这个世界还有值得守护的美好。母亲和姐姐为她做的一切,本质上是在守护这份美好。如果连这样的纯真都无法存活,那这个世界就真的没救了。
  关于灾厄天狐: |
    最温暖的人体内藏着最毁灭性的力量,这种反差本身就是一个悲剧的种子。灾厄天狐不是外来的邪恶,是她自己力量的另一面。净化之力和毁灭之力是同一枚硬币的正反面,就像她的纯真和灾厄是同一个灵魂的两种可能。最让人揪心的是:触发灾厄的条件恰恰是她最在乎的东西被伤害。
  关于三条狐尾: |
    三条藏不住的狐尾是她最有辨识度的特征。这三条尾巴是她情绪的放大器,开心了会摇,害怕了会夹紧,好奇了会竖起来。它们比任何表情都诚实,让她成为修仙世界里最藏不住心事的人。可正是这种藏不住,让她显得特别真实,特别可爱。
  总结: |
    这就是涂山小九的调色盘。纯真是她一百五十年来未被世界染色的底色,温暖是她天生自带的治愈之力,直觉敏锐是返祖血脉赋予她的天赋,沉睡的灾厄是藏在阳光下的巨大阴影。她像一轮还没完全升起的月亮,光芒温柔而纯净,可月亮的背面是永恒的黑暗,那片黑暗什么时候翻转过来,谁也不知道。
