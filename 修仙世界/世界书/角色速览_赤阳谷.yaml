势力: 赤阳谷

简介: 正道宗门,以火系修炼与部族战法闻名,守护中央神州南大门

核心人物:
  呼延战戈:
    职位: 赤阳谷宗主,铁匠宗师,熔炉之躯
    修为: 真仙境七重天
    年龄: 外表四十五岁,实际五万八千岁
    性别: 男
    灵根: 天品赤焰灵根(变异灵根,纯火)
    武器: 不用(双拳即是最强的武器,但他锻造的法宝遍布修仙界)
    异火: 赤炎地火(六品异火)
    能力: 体修极致,赤阳锻体,炼器宗师,铁拳碎山
    性格: 实在,热忱,执拗,说话跟打铁一样一锤一个坑
    家族: 烈凰儿(妻),呼延明焰(女)

  烈凰儿:
    职位: 赤阳谷主母
    修为: 真仙境一重天
    年龄: 外表三十五岁,实际两万三千岁
    身高: 一米六八
    灵根: 天品离火灵根(变异灵根)
    武器: 焰净(镜子)
    能力: 精通辅助和控制类火系法术,符箓大师,火焰操控精细
    性格: 温柔体贴,端庄贤淑,外柔内韧,重视家庭
    关系: 呼延战戈(夫),呼延明焰(女)

  呼延明焰:
    职位: 赤阳谷少主
    修为: 化神中期,实力远超同辈
    年龄: 外表二十二岁,实际九百岁
    身高: 一米八〇
    灵根: 天品赤焰灵根(变异灵根)
    武器: 碎星(红色巨锤)
    能力: 毁灭性火系攻击,赤焰部特殊血脉,巨锤战技
    性格: 豪迈仗义,果决自信,责任感强,渴望被理解
    关系: 呼延战戈(父),烈凰儿(母),秦晚烟(闺蜜,并称赤阳双美)

  秦晚烟:
    职位: 赤阳谷内门大师姐
    修为: 元婴后期
    年龄: 外表二十五岁,实际三百八十岁
    身高: 一米七二
    灵根: 天品流火灵根(变异灵根)
    武器: 璃火(流焰长鞭)
    能力: 精通火系术法,擅用法阵封锁敌域,控场能力顶尖
    性格: 沉着冷静,外冷内热,护短而温柔
    关系: 呼延战戈(师尊),呼延明焰(闺蜜,并称赤阳双美)

势力特色:
  - 火系修炼为主
  - 部族与宗门结合
  - 家族氛围浓厚
  - 与凛霜剑门良性竞争
  - 守护南疆边境要地
