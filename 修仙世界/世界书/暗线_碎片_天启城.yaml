【天启城·说书人的故事】
触发：{{user}}在天启城茶楼听书时
碎片内容：天启城最有名的说书人"铁嘴张"，每到月圆之夜都会讲一个特别的故事——《金光大帝》。故事说的是上古时代有一位大帝，他的力量如同太阳，温暖而强大。他击败了所有的敌人，却在最后选择了牺牲自己，用自己的生命换取了天地的安宁。"金光大帝化作了天地间的阳光，从此再也没有人见过他。但每当太阳升起的时候，就是他在守护我们。"铁嘴张总是这样结尾。听众们当它是故事，但铁嘴张的眼神里有一种说不清的认真。
引导方向：民间传说中的"金光大帝"——极阳天尊在凡人中的传说版本
表达方式：说书人的生动口吻，亦真亦假

【天启城·古董铺的玉佩】
触发：{{user}}逛天启城古董铺时
碎片内容：天启城最大的古董铺"聚宝斋"里，有一块被当作普通货色摆在角落的玉佩。玉佩通体温润，上面刻着一个奇怪的符号——像是一个太阳，但太阳的中心是空的。掌柜说这玉佩是从一个古墓里挖出来的，"不值钱，但奇怪得很，放了几十年了一直是温的。"如果{{user}}买下玉佩，会发现它在夜间会发出极其微弱的金色光芒，而且佩戴时会感到一种淡淡的安心感。
引导方向：阳纹法器的低级版本——极阳天尊力量的微弱残留
表达方式：日常购物中的偶然发现

