小雷音寺:
  势力定位: 西漠佛国统治者，佛门净土

  核心理念: 慈悲为怀，普度众生

  修炼体系:
    佛法修炼: 锤炼金身，凝聚舍利
    心性修为: 注重功德积累和心性修炼
    佛光神通: 梵音、法相、佛光等神通

  势力特色:
    佛门净土: 西漠唯一大势力，一家独大
    纯粹干净: 无邪道势力，环境清净
    实力强大: 虽慈悲为怀，但实力极强
    中立调停: 常调解各方争端

  与外界关系:
    与北原魔土: 天然对立，常派僧兵镇守边界
    与中央神州正道: 关系友好
    与妖域南疆: 关系微妙，保持距离
    超然中立: 不主动参与争斗

  势力规模:
    方丈: 无尘禅师
    长老院: 五位高僧
    罗汉堂: 十八罗汉
    僧人: 三十余万（包括各地分寺）
    信徒: 数十亿（整个西漠佛国）
    附属势力: 琉璃城及整个西漠佛国

  特色资源:
    舍利子: 高僧圆寂留下的舍利
    佛法经文: 贝叶经书，佛法传承
    佛器: 各类佛门法器
    八宝功德池水: 可涤荡业力

  总坛地点:
    位置: 西漠佛国·灵山
    环境: 七彩佛光笼罩，祥和宁静
    建筑: 大雄宝殿恢宏庄严

  附属城镇:
    琉璃城: 西漠最大城市，佛器香料交易中心

  特殊地位:
    镇守西漠: 抵御魔气侵蚀
    佛门圣地: 天下佛子朝圣之地
    超然势力: 连六大宗门都尊重
