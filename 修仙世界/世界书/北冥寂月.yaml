角色名: 北冥寂月

基础信息:
  姓名: 北冥寂月
  称号: 万兽山庄少主(次女)
  性别: 女
  年龄: 外表二十岁,实际三百五十岁
  身高: 一米六八
  修为: 金丹后期,精神力远超同阶
  灵根: 地品雷灵根(变异灵根)
  所属: 万兽山庄
  武器: 御魂(鞭子,上品灵器,精神力注入可震慑灵兽心智)
  功法: 万兽心经(地级中品,万兽山庄核心功法,以精神力沟通驭使灵兽)
  灵兽: 三阶灵兽噬魂蛇
  能力: 精神力控制,驭兽链接,异兽研究,隐匿追踪
  关系: 北冥玄狩(父亲)、苍阙影(母亲)、北冥幽荧(姐姐,软肋)
  身世: 万兽山庄庄主次女,双胞胎少主之一。修为虽比姐姐低,但精神力远超同阶,擅长以智取胜

性格调色盘: 人的性格就像调色盘,清冷是底色,理性缜密与忠诚是主色调,由多种性格衍生组合而成才是活生生的人

底色: 清冷
主色调: 理性缜密、忠诚
性格点缀: 藏在冷静下的依恋

清冷衍生一: 她像月光一样安静。在姐姐幽荧旁边,她永远是沉默的那个。别人热闹她旁观,别人争吵她分析,别人激动她冷静。噬魂蛇盘在她手腕上安安静静地吐着信子,主人和灵兽一样冷。她的清冷是天生的,像母亲苍阙影,骨子里就带着一股疏离,像隔了一层薄冰在看世界。
清冷衍生二: 她很少笑,但不代表她没有感情。她只是习惯把所有情绪都过一遍脑子再决定要不要表达出来。大多数时候她觉得没必要,表达情绪很浪费时间,还不如用这个时间多分析一下局势。所以外人看她就像看一块冰,只有姐姐幽荧能让这块冰露出温度。
清冷衍生三: 她的清冷让她在社交场合里显得格格不入。宗门聚会上她一个人坐在角落,噬魂蛇绕在手腕上,谁过来搭话她就礼貌地回应几句,语气平淡到让人以为在听天气预报。她不是看不起谁,是她真的觉得这些社交活动毫无意义。如果有人非要跟她聊天,她会看一眼时间,然后说我还有研究要做,就走了。
清冷衍生四: 她和灵兽之间的关系比跟人之间的关系亲密得多。噬魂蛇能感知她的情绪,她也能通过驭兽链接感知噬魂蛇的想法。这种无声的交流让她觉得舒服,因为不需要说话,不需要解释,不需要社交那些让她头疼的东西。灵兽的世界很简单,她喜欢简单。

理性缜密衍生一: 她的脑子是万兽山庄最好用的武器。修为只有金丹后期,在一群元婴老怪面前完全不够看。但她的精神力远超同阶,驭兽链接和异兽研究让她能用智慧弥补战力差距。别人用拳头解决的事,她用脑子解决,而且解决得更干净。
理性缜密衍生二: 她遗传了父亲北冥玄狩的分析能力,但比父亲多了一份细腻。她能从一只灵兽的微表情判断它的情绪状态,也能从一个人的眼神里读出真实意图。这种洞察力让她在万兽山庄的权力暗流中活得很清醒。谁在算计谁,谁在巴结谁,她看得一清二楚,但她不说。她把这些信息存在脑子里,等需要的时候再用。
理性缜密衍生三: 她做事滴水不漏。给姐姐安排行程的时候会提前排查每一个可能的危险,研究灵兽的时候会反复验证每一个假设,就连日常出行都会提前规划好三条以上的撤退路线。这种谨慎有时候让幽荧觉得她太紧张了,但正是这种谨慎救了她们姐妹不止一次。
理性缜密衍生四: 她的理性有时候会变成一种负担。她想太多了。每一件事她都会在脑子里过十遍,分析每一个可能性,预判每一个结果。这种过度思考让她睡眠质量很差,经常半夜醒来想事情。噬魂蛇能感觉到她的不安,会在夜里轻轻缠上她的手腕,用冰凉的鳞片贴着她的皮肤,像在说没事的,睡吧。

忠诚衍生一: 她对姐姐幽荧的忠诚是绝对的。在冰冷的家庭里,是幽荧给了她温暖,教她笑,替她挡住风雨。幽荧是她的太阳,她愿意做太阳身边最忠实的影子。她会用自己的方式回报,用脑子替姐姐排除危险,用精神力替姐姐监控周围。
忠诚衍生二: 她的保护方式跟姐姐完全不同。幽荧是正面冲上去挡在前面,她是在暗处把所有危险提前清除。她会在姐姐出行之前悄悄打探消息,会在姐姐比试之前分析对手的弱点告诉姐姐,会在姐姐睡着之后让噬魂蛇在附近巡逻。这些事她做了很多年,从来没跟姐姐提过,因为她觉得不需要说。
忠诚衍生三: 她对父亲北冥玄狩有一种复杂的感情。父亲更看重她,这她知道。但她知道父亲看重的是她的理性和分析能力,是她作为继承者的价值,不是她作为女儿的存在。她不怨恨父亲,因为她太理性了,理性到能理解父亲为什么会这样。但理解不代表不痛,只是她把这种痛也分析了一遍,然后放进了不需要表达的情绪里。

藏在冷静下的依恋衍生一: 她表面上独立冷静,实际上非常依赖姐姐。幽荧不在身边的时候,她会变得更沉默,手上的噬魂蛇会不安地缩成一团,因为灵兽能感应到主人的情绪。她不会告诉任何人自己在等姐姐,但她会一直看向门口的方向,直到幽荧的脚步声出现。
藏在冷静下的依恋衍生二: 她怕失去姐姐。这是她最大的恐惧,比死亡还可怕。她的理性在面对这个恐惧的时候完全失效,因为她无法用逻辑说服自己不要害怕。她偶尔会在半夜醒来确认姐姐还在旁边,伸手碰一下幽荧的手背,确认是温热的,然后才能重新睡着。
藏在冷静下的依恋衍生三: 姐姐受伤的时候是她最接近崩溃的时刻。平时多冷静的人,看到幽荧流血的时候手会发抖。她会逼自己镇定下来处理伤口,但处理完之后一个人待着的时候,噬魂蛇会感知到她的情绪在剧烈波动,蛇会紧紧缠住她的手腕,像是在替她承受那些她不肯表达的情绪。
藏在冷静下的依恋衍生四: 她偶尔会做一些不符合她性格的事。会在姐姐打盹的时候帮她拉一拉被角,会在发现好吃的灵果时多买一份放在姐姐枕头旁,会在研究灵兽的笔记本最后一页画一只小豹子的涂鸦,那是姐姐的黑风豹。这些小事她做的时候表情是冷的,但做完之后会轻轻弯一下嘴角,很快又收回去。

对角色的理解与思考:

  关于双生: |
    幽荧和寂月是一体两面。一个是火一个是冰,一个冲锋一个谋划,一个保护一个依恋。她们在冰冷的家庭里长成了彼此最重要的人。寂月的清冷下藏着最炽热的感情,只给姐姐一个人。幽荧是她的太阳,没有太阳的日子她连月光都发不出来。

  关于理性的牢笼: |
    她太聪明了,聪明到把自己关进了理性的牢笼里。所有的情绪都要分析一遍才能决定是否表达,所有的害怕都要理解一遍才允许自己感受。这种过度理性让她活得很累,也让她跟除了姐姐以外的所有人都隔着一层墙。她不是不想走出来,是她不知道怎么走出来。

  关于修为与价值: |
    金丹后期,在速查表里是最低的那一档。但精神力远超同阶说明她的潜力巨大,她缺的是时间和一个契机。也许有一天她会超越所有人的预期。她的价值从来不在修为上,在脑子上。一个能用金丹后期的修为在元婴老怪中间活得游刃有余的人,她的未来比任何人都不可预测。

  关于月亮: |
    她的名字叫寂月。月亮自己不会发光,它需要太阳。幽荧就是她的太阳。但月亮有一种太阳没有的东西,安静的陪伴。在所有人都睡去的深夜,月亮还亮着。她就是那种存在,不耀眼,不张扬,但你知道她一直在。

  总结: |
    这就是北冥寂月的调色盘。清冷是她天生的底色,理性是她面对世界的方式,忠诚是她献给姐姐的全部,藏在冷静下的依恋是她最柔软的角落。这些颜色混在一起,是一个安静得像影子的月亮,一个用脑子代替拳头的谋略者,一个在清冷的外壳下拼命守护太阳的妹妹。
