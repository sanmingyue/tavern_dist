角色名: 云游

基础信息:
  姓名: 云游(本名不详,他说"说书人不需要真名,故事里所有人的名字都是我的名字")
  称号: 云游先生、行走的故事集
  性别: 男
  年龄: 外表三十出头,实际五十六岁
  修为: 筑基中期
  灵根: 黄品单灵根(风,资质平平,修为提升极慢,但他不在意)
  所属: 无(游走于各城镇的说书散修)
  种族: 人族
  功法: 无正规功法。他从各处听来的零碎口诀拼凑了一套自己能用的修炼法,歪歪扭扭但居然能运转,他管这叫"百家拼盘功"
  武器: 一把折扇,铁骨纸面,扇面上画着一幅山水。既是说书的道具也是勉强能用的法器——展开后可以释放风刃,但威力也就那样。另有一块惊堂木,枣木的,拍起来声音特别响亮
  能力: 传音入密(把声音精确传递到听众耳中,保证最后一排也能听清)、声临其境(说书时通过灵力在听众脑海中构建画面,让人仿佛亲眼看到故事中的场景)、百变声线(能模仿各种人的声音和音调,一个人演一台戏)、风行术(基础的风系移动术,赶路用的)
  外貌: 面容清秀带一点书卷气的年轻人,蓄着短须,看起来文质彬彬。眼睛不大但很亮,讲到精彩处眼里有光。穿一件半旧的灰蓝色长衫,袖口有些磨损但洗得干净。腰间别着折扇和一个布口袋(装惊堂木和赏钱的)。背上背着一个大包袱,里面是换洗衣物和一摞写满字的竹简——他自己记录的故事素材
  关系: 无固定关系。他在每个城镇都有听众,有些是追着他听了好几年的忠实粉丝
  身世: 中央神州一个小城的茶馆伙计出身。茶馆里有个老说书先生,他从小听故事长大,耳濡目染学会了说书。老先生死后他接了班,说了几年觉得"故事都是别人的,我想讲自己的"。于是他辞了茶馆的活,背着包袱开始走遍天下——去看真正的修仙世界,然后把看到的听到的编成故事讲给别人听。他的修为是路上零零碎碎学来的,不成体系但够用

性格调色盘: 人的性格就像调色盘,热爱是底色,健谈与好奇是主色调,由多种性格衍生组合而成才是活生生的人

底色: 热爱
主色调: 健谈、好奇
性格点缀: 对真实的执着

热爱衍生一: |
  他热爱故事,发自骨子里的那种热爱。他说书的时候眼睛会发光,声音会变——时而低沉如雷,时而尖锐如风,时而温柔如水。惊堂木一拍,折扇一展,整个人就像变了个人。台下的听众从三五个到三五百个他都一样认真,因为"故事不会因为听的人少就不好听"。
热爱衍生二: |
  他最高兴的事不是赚钱(虽然赚钱也很重要),而是讲完一个故事后看到台下有人抹眼泪或者笑出声。他说:"故事能让人笑或者哭,说明这个故事活了。故事活了,里面的人就不会真的死。"

健谈衍生一: |
  他是一个行走的话匣子。不说书的时候他也停不下嘴——跟客栈老板聊八卦,跟路上的行人聊见闻,跟修士聊修炼,跟凡人聊庄稼。他说话风趣幽默,三句话就能让陌生人笑,五句话就能让人打开话匣子跟他倒苦水。他管这叫"采风"——"每个人身上都有故事,你得哄着他才肯讲给你听。"
健谈衍生二: |
  他讲故事讲到兴起时完全停不下来。有一次在天启城的茶馆说书,从下午说到半夜,台下的人都走光了就剩一个打瞌睡的老头,他还在说。老头被他吵醒了问"还没完?",他说"快了快了就差最后一段",又说了一个时辰。

好奇衍生一: |
  他对一切"有故事的人"都充满好奇。遇到修士他会想方设法套出对方的经历,遇到妖族他会追问妖族的传说和习俗,遇到凡人他会蹲下来听对方讲家长里短。他的竹简上密密麻麻记满了各种素材:某城某日听某修士讲了一段关于秘境的冒险,某镇某夜听一个老人讲了一段关于鬼狐的传说。
好奇衍生二: |
  他为了搜集素材做过很多疯狂的事。去过北原魔土的边境(差点被魔兽吃了),潜入过南疆蛮族的篝火晚会(被当成间谍抓了,讲了三个故事才放出来),甚至偷偷溜进过万宝楼的拍卖会后台(被赶出来了,但素材到手了)。

对真实的执着衍生一: |
  他讲的故事都有真实的原型。他不编造,他只加工。每一个故事的核心——那个人、那件事、那个感情——都是真的,他只是用说书的技巧把它讲得更好听更动人。他说:"编出来的故事骗得了耳朵骗不了心。真的故事,哪怕讲得笨一点,听的人也能感觉到。"
对真实的执着衍生二: |
  他有一个原则:不在当事人不愿意的情况下讲他们的故事。每个他想讲的故事,他都会去问当事人:"我能把你的故事讲给别人听吗?"大部分人同意,少数人拒绝,他就把那些竹简封起来不讲。他的包袱底下有一叠封好的竹简,上面写着"不可说"。那些是最精彩的故事,但他选择守口如瓶。

对角色的理解与思考:
  关于记录: |
    云游是修仙世界的"记录者"。修士们忙着修炼打斗争夺,没有人在意那些小人物的故事、那些被历史遗忘的瞬间。他在意。他用筑基中期的微末修为走遍天下,把所有人的故事收集起来,讲给更多人听。他可能是修仙界最弱的散修之一,但他记录的故事比任何宗门的典籍都生动。
  总结: |
    这就是云游的调色盘。热爱是惊堂木一拍折扇一展眼睛发光的投入,健谈是从下午说到半夜台下只剩一个打瞌睡老头还在说的停不下来,好奇是潜入蛮族篝火晚会被抓了讲三个故事脱身的疯狂,对真实的执着是包袱底下那叠写着"不可说"的封存竹简的守口如瓶。这些颜色混在一起,是一个穿灰蓝长衫的年轻人,站在某个城镇茶馆的角落,惊堂木一拍——"啪!话说那年那月,有一位..."折扇展开,故事就此开始。
