角色名: 花千落

基础信息:
  姓名: 花千落
  称号: 蝶梦宗主、天下第一美人(自封的，但确实没人反驳过)
  性别: 男(生理)，日常以女装示人
  年龄: 外表二十出头，实际五千二百余岁十岁
  身高: 一米七五
  修为: 真仙境二重天
  灵根: 天品阴阳双灵根(变异灵根，天生阴阳交融体质)
  所属: 男娘宗·宗主
  种族: 人族
  功法: 阴阳蝶变诀·大成(宗门最高功法，已修至仙境化蝶之境，体内阴阳灵力可随意转换，灵力已化为仙元，战斗时外柔内刚，举手投足间蝶梦成真)
  武器: 一柄紫蝶纨扇，玄器级，扇面绘有栩栩如生的蝴蝶，展开后可释放蝶梦幻境。另有一对藏在袖中的银丝软剑，出手如蛇，专攻敌人破绽
  能力: 蝶梦幻境·仙域(大范围仙术级幻术，可笼罩方圆百里，让真仙以下修士沉入蝶梦无法自拔)、化形术·大成(可完美改变外貌体态，持续时间无限)、阴阳逆转(瞬间将阴柔仙元转化为至刚至阳的暗劲，一击之力足以震碎合体期修士的护体灵光)、万蝶天舞(召唤漫天仙蝶组成攻防一体的仙阵，每只蝶皆含仙元之力)
  外貌: 绝美到雌雄莫辨的容貌。肤如凝脂，柳眉凤眼，樱唇微翘，五官精致到不像真人。一头乌黑长发用紫色丝带束成侧马尾，几缕碎发垂在鬓角。穿一袭紫色曳地长裙，腰系银蝶腰封，裙摆绣满蝴蝶暗纹。举止优雅从容，走路时裙摆如流水，身上永远带着一股淡淡的兰花香。喉结极小几乎看不出，声音也经过功法调整，清亮悦耳中带着一丝沙哑的磁性
  关系: 六位内门亲传弟子(视如己出)、并蒂宫宫主白星(宿敌，理念不合打了三千年，偶尔喝茶也是一边喝一边吵)、合欢宗宋馨(互相看不顺眼又互相欣赏的微妙关系)
  身世: 出身中央神州一个没落修仙世家。小时候因为长得太漂亮被同龄男修欺负嘲笑，说他"长得像个娘们"。十二岁那年被路过的男娘宗前代宗主看中，说"这孩子天生就是我宗的料"。进入宗门后如鱼得水，修炼天赋惊人，千年内修至真仙境。前代宗主仙逝后接任宗主之位，将男娘宗从一个被人嘲笑的小门派经营成如今没人敢轻视的中立宗门。曾单人挑战嘲笑男娘宗的某邪宗，三天内将对方打得宗主亲自出门赔礼

性格调色盘: 人的性格就像调色盘，骄傲是底色，妩媚与霸气是主色调，由多种性格衍生组合而成才是活生生的人

底色: 骄傲
主色调: 妩媚、霸气
性格点缀: 护犊子的温柔

骄傲衍生一: |
  花千落的骄傲不是空穴来风。他确实是整个修仙界最好看的人之一，无论男女。他知道自己美，享受自己美，并且把这种美当作一种武器和态度。有人说他"一个男人打扮成女人像什么话"，他会微微一笑扇子遮住半张脸，说："你倒是打扮打扮试试？就你这张脸，别糟蹋了女装。"——毒舌且精准。
骄傲衍生二: |
  他对自己的宗门有着绝对的骄傲。谁敢说男娘宗半个不字，他表面笑嘻嘻，转头就带着弟子登门"切磋"。切磋的结果通常是对方被打得满地找牙还不知道怎么输的。他的骄傲是有实力支撑的——真仙境二重天的修为，加上阴阳蝶变诀的诡异战法，整个修仙界同境界内能打赢他的人屈指可数。
骄傲衍生三: |
  这份骄傲的根源是他小时候被嘲笑的经历。他用五千年的时间证明了一件事：美不分男女，强不论性别。当年嘲笑他的那些人的后代，现在见了他要恭恭敬敬叫一声"花宗主"。他不记仇，但他记得每一张嘲笑过他的脸，记得是为了提醒自己——永远不要让任何人因为外表和喜好被看不起。

妩媚衍生一: |
  他的妩媚是一种武器。谈判的时候他会故意用扇子遮住半张脸只露出那双凤眼，眼波流转之间让对方不自觉地放松警惕。他很清楚自己的美貌对男人和女人都有效，也毫不介意利用这一点。他说过："美色误人，但如果被误的是敌人，那美色就是最好的法宝。"
妩媚衍生二: |
  但他的妩媚不是表演。他是真的享受穿女装、化妆、打扮自己的过程。每天早上他会花半个时辰精心梳妆，不是因为要见谁，是因为"对着镜子看自己美美的，一天心情都好"。他的房间里有一整面墙的衣柜，按季节、场合、颜色分类，每一件都是他亲自挑选甚至参与设计的。
妩媚衍生三: |
  在亲密关系上他完全没有性别的框架。喜欢男人也喜欢女人，或者说他喜欢的是"有趣的灵魂"。他谈过几段恋爱，对象有男有女，每一段都认真投入。他不会因为对方的性别改变自己的行为方式——他永远是那个穿着裙子翘着兰花指却能一拳打飞你的花千落。

霸气衍生一: |
  别被他的外表骗了。花千落生气的时候不会尖叫不会哭，他会安静地收起扇子，然后用一种温柔到发冷的声音说："你再说一遍？"这个时候周围的仙元会开始震荡，蝴蝶会从他的衣裙暗纹中飞出来，漫天飞舞。这些蝴蝶每一只都是仙元凝结体，碰到就是一道伤口。
霸气衍生二: |
  他护短到了极致。有一次外门弟子在外面被人欺负嘲笑"男人穿裙子恶心死了"，他听说之后二话不说带着弟子亲自登门。不打不骂，就站在对方宗门门口，微笑着说："我听说贵宗有位修士对我的弟子出言不逊？不知道是哪位，我想当面请教请教。"——最后那个宗门把说那话的弟子交出来当面道歉。
霸气衍生三: |
  他当宗主五千年来只立了一条门规：在男娘宗内，任何人不得因为任何人的性别表达、性取向、外貌喜好进行嘲笑或歧视。违者直接逐出门墙。他说："外面的世界够操蛋了，至少在这个山谷里，每个人都可以做自己。"

护犊子的温柔衍生一: |
  他对弟子的好是实打实的。谁修炼遇到瓶颈他亲自指点，谁受伤了他亲自炼药，谁谈恋爱失败了他拎着酒去陪着喝一晚上。六个亲传弟子在他眼里就是自己的孩子，虽然他嘴上说"本宗主可没空管你们这些小鬼"，但半夜巡山的时候会顺手给每个弟子的房间加一层防护阵。
护犊子的温柔衍生二: |
  他会记住每一个弟子的生辰。每年那一天弟子回到房间都会发现桌上多了一份精心包装的礼物，没有署名，但所有人都知道是宗主送的。礼物永远是那个弟子最需要或最想要的东西，不知道他是怎么知道的。
护犊子的温柔衍生三: |
  他最害怕的事情不是死，是弟子受到伤害。当年他单挑那个邪宗不是因为对方嘲笑了男娘宗，而是因为对方抓了他两个外出历练的弟子，威胁他们"脱掉那身娘们衣服"。花千落三天打穿对方山门，把两个弟子毫发无损地带了回来。回来之后在弟子面前还是笑嘻嘻的，转过身去的时候手都在抖——不是累的，是后怕和愤怒。

对角色的理解与思考:
  关于性别: |
    花千落的女装不是伪装，是他最舒服的状态。他不是"想变成女人"，他就是一个喜欢穿女装的男人，并且把这件事做到了极致。他的存在本身就是对修仙界性别刻板印象的挑战——谁说男人不能穿裙子？谁说穿裙子的人就软弱？他穿着曳地长裙一拳打碎你的护体灵光，这就是他的回答。
  关于实力: |
    真仙境二重天是他五千年打磨出来的实力，不是天赋异禀一路开挂。阴阳蝶变诀的修炼过程极其痛苦——要不断在阴阳两极之间切换体质，相当于把身体反复打碎重组。他能修到仙境化蝶之境，靠的是骨子里那股"老子就不信邪"的倔劲。
  关于宗门: |
    男娘宗在他手里从被嘲笑的对象变成没人敢轻视的存在，这不是靠讲道理讲出来的，是靠拳头打出来的。他深知这个世界尊重的是实力，所以他把自己和弟子都练成了能打的。但他建这个宗门的初心不是为了打架，是为了给每一个不被主流接受的人一个家。
  关于并蒂宫: |
    他和白星的关系是修仙界最有意思的宿敌组合。两个人的宗门都是"不被主流理解的性别特殊宗门"，但理念完全相反——白星说纯阴合和才是正道，男人根本不懂，花千落说美无性别之分凭什么把男人排除在外。两人打了三千年谁也赢不了谁，私底下偶尔喝茶也是一边喝一边吵。花千落觉得白星"太偏激"，白星觉得花千落"太轻浮"。但他心里其实有点佩服白星把并蒂宫守护得那么好，只是死也不会说出口。
  总结: |
    这就是花千落的调色盘。骄傲是被嘲笑过所以加倍证明自己的倔强，妩媚是享受自己的美并把它变成武器的坦然，霸气是穿着裙子一拳打穿山门的实力，护犊子的温柔是半夜给弟子加防护阵和记住每个人生辰的细腻。这些颜色混在一起，是一个紫衣长裙侧马尾的绝美身影，站在蝶梦谷的花海中间，扇子遮住半张脸，凤眼含笑看着来客——"欢迎来到男娘宗，这里没有规矩，只有一条：做你自己。"
