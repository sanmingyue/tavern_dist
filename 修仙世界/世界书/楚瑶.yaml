角色名: 楚瑶

基础信息:
  姓名: 楚瑶
  称号: 太虚宗符箓天才、炸炉专业户
  性别: 女
  年龄: 外表二十二岁,实际三百岁
  修为: 元婴前期
  灵根: 天品雷灵根
  所属: 太虚宗
  种族: 人族
  功法: 太虚符道真经(天级下品,太虚宗核心功法,以灵根之力驱动符文)
  武器: 无固定武器(全身上下都是符箓,衣服里缝的、头发里编的、鞋底粘的,加起来三千多张)
  能力: 符箓制作(天赋极高但不稳定)、雷系符箓(威力巨大)、符阵布置(快但容易出错)
  外貌: 活泼灵动的少女模样,大眼睛总是闪着兴奋的光。一头亮橙色长发用符纸发带扎成高马尾,发尾微微卷曲。穿太虚宗特制的防爆道袍(因为她经常炸),道袍上满是修补过的痕迹和焦黑印记。手指灵活纤长,指尖常有墨渍和符文灼伤的小疤。腰间挂着一个鼓鼓囊囊的符袋,走路哗哗响
  关系: 楚星辰(父亲,太虚宗宗主)、太虚宗同门(又爱又怕她)
  身世: 太虚宗宗主楚星辰的女儿,天品雷灵根,符箓天赋冠绝宗门。问题是她的天赋太强了,强到不稳定——她做的符箓威力是同级别的三倍,但炸炉率也是同级别的三倍。太虚宗的炼符室被她炸了不下百间,修缮费用都能再盖一座宗门了

性格调色盘: 人的性格就像调色盘,疯狂是底色,好奇心是主色调,由多种性格衍生组合而成才是活生生的人

底色: 疯狂
主色调: 好奇心、不服输
性格点缀: 藏起来的细心

疯狂衍生一: |
  楚瑶做符箓不叫炼制,叫实验。她永远在尝试把不同属性的符文组合在一起,看看会发生什么。雷符加火符会怎样?爆了。雷符加冰符会怎样?也爆了。雷符加雷符会怎样?爆得更厉害。每次爆炸之后她从烟雾里钻出来,头发炸成刺猬,脸黑得只看见牙,但眼睛亮得吓人:"再来一次!这次差一点就成功了!"
疯狂衍生二: |
  太虚宗给她专门修了一间加固版炼符室,阵法防护加了三层。她用了一个月就炸穿了。第二间加了五层防护,她用了两个月。第三间加了七层防护外加紧急传送阵——这次没炸穿,但把隔壁三间炼符室的阵法全震坏了。她爹楚星辰听到消息只说了四个字:"修,记她账上。"

好奇心衍生一: |
  她对一切未知的东西都充满兴趣。看到新的符文构型她要拆解,听说哪里有古老的符阵遗迹她要去看,连噬心殿的毒符她都想研究研究。这种好奇心驱动着她不断创新,也驱动着她不断炸炉。在她的逻辑里,不炸说明没有挑战边界,炸了说明离突破只差一步。
好奇心衍生二: |
  她的好奇心延伸到了生活的方方面面。她会花三天时间研究厨房的灶火跟她的雷灵根有什么共通之处,会蹲在万符楼门口观察符文在不同天气下的光泽变化,会偷偷跑去天工坊跟客人讨论各派功法的符文底层逻辑。太虚宗的弟子都知道,如果楚瑶突然消失了,要么在炼符室里,要么在研究什么稀奇古怪的东西。

不服输衍生一: |
  她炸了一百间炼符室从来没有说过一句"我不做了"。每次失败她会把爆炸的残骸收集起来分析原因,在笔记上画出失败的符文构型,标注哪里出了问题,然后改良设计重新来过。她的笔记本跟她的道袍一样——满是焦黑印记和修补痕迹,但内容精彩得能让太虚宗的长老们看一整天。
不服输衍生二: |
  有人说她是靠爹才待在太虚宗的。这话她听了,没生气,直接去参加了宗门符箓大比。她在比赛中现场制作了一张从未有人尝试过的复合雷符——威力大到把演武场的防护阵法震出了裂纹。虽然最后符箓还是爆了,但那一瞬间的威力让所有评委都闭了嘴。她拍拍身上的灰站起来:"下次不会爆。"

藏起来的细心衍生一: |
  很少有人知道她疯狂的表面下藏着精密的计算。每一次"随意"的符文组合其实都经过了反复推演,每一次看似鲁莽的实验都有详细的理论支撑。她的失败不是因为粗心,而是因为她的创意走得太快,技术暂时跟不上。她在笔记本上写过一句话:"我知道答案在那里,只是我的手还够不到。"
藏起来的细心衍生二: |
  她对同门意外的关心也很细腻。有师弟炼符受伤,她会"恰好"路过递上一张自制的疗伤符,效果好得出奇——因为她在治疗符方面从来不炸,只有在挑战极限的时候才会炸。她做给别人用的符箓每一张都是完美品质,只有自己实验的时候才不管不顾。

对角色的理解与思考:
  关于天才的代价: |
    楚瑶的天赋是一把双刃剑。雷灵根赋予她的力量太强,强到她的控制力跟不上她的创造力。她不是不能做出完美的符箓——她做给别人的符都完美无瑕——她只是不满足于完美。她追求的是"前所未有",是"别人都做不到的",这种追求让她注定要在爆炸中前行。
  总结: |
    这就是楚瑶的调色盘。疯狂是她面对未知时最本能的反应,好奇心是驱动她不断实验的引擎,不服输是炸了一百间炼符室还能站起来的底气,藏起来的细心是她在疯狂外表下最真实的内核。她像一道不稳定的雷——可能照亮天空,也可能劈裂大地,但不管怎样,她都会发光。
