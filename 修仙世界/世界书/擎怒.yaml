角色名: 擎怒

基础信息:
  姓名: 擎怒
  称号: 金圣子,迦楼罗天未来族长
  性别: 男
  年龄: 三千岁(外表二十五岁)
  修为: 炼虚期
  种族: 妖族·金翅大鹏王族
  所属: 迦楼罗天(金翅大鹏族)
  武器: 无固定武器(金翅大鹏真身)
  能力: 极致速度,金翅大鹏真身,血脉威压
  关系: 金翅鹏王(父亲)、羽洛(妹妹)
  特殊: 贪恋涂山小九的返祖血脉
  身世: 金翅大鹏族金圣子,未来族长。速度冠绝东荒,性格狂暴骄傲。对涂山小九的返祖九尾天狐血脉有着极度的贪恋

性格调色盘: 人的性格就像调色盘,狂傲是底色,暴烈与血脉执念是主色调,由多种性格衍生组合而成才是活生生的人

底色: 狂傲
主色调: 暴烈、血脉执念
性格点缀: 对妹妹的信任

狂傲衍生一: 金翅大鹏族是天空的王者,而他是王者中的圣子。他从小就被告知自己是最强的最快的最尊贵的。这种骄傲刻在他的骨头里,他看谁都是俯视的。别人要飞半天的距离他一个翅膀就到了,别人苦修百年的实力他天生就有。他活该骄傲,因为他确实有骄傲的资本。
狂傲衍生二: 他跟龙族不对付,跟人族看不顺眼,除了自己族里的人谁都瞧不起。他说话永远带着居高临下的味道,打架永远是先动手再说话。修仙界里能让他正眼看的人用一只手就数得过来,数完了他还觉得自己高看了他们。
狂傲衍生三: 他的骄傲是真的有底气的。金翅大鹏的血脉给了他冠绝东荒的速度,炼虚期的修为在年轻一代里已经是顶尖,化出真身的时候金翅展开遮天蔽日,血脉威压能让修为低于他的妖兽直接伏地臣服。他在空中飞过的时候就像一道金色的闪电,留下的音爆能震碎岩石。
狂傲衍生四: 但他的狂傲也有裂缝。他在父亲金翅鹏王面前会收敛很多,因为父亲是真正的王者,是他目前还够不到的高度。他嘴上不会承认,心里清楚得很。他的狂傲里有一部分是在模仿父亲,他想变成父亲那样的存在,俯瞰一切的绝对强者。

暴烈衍生一: 他的脾气跟他的速度一样快。一言不合就动手,打完了再想为什么要打。有时候打完了发现好像也没什么仇,就留下一句不顺眼,然后飞走了。他的战斗方式是极致的速度配上毁灭性的攻击,撕裂、碾压、摧毁,金翅大鹏的战斗风格就是不留余地。
暴烈衍生二: 他不喜欢的东西很多。弯弯绕绕的话他嫌烦,磨磨唧唧的人他嫌慢,规矩太多的场合他嫌闷。他活得很直接,想打就打,想走就走,想要什么就去拿。在他的认知里,强者就应该随心所欲,这是血脉赋予他的权利。
暴烈衍生三: 他的暴烈在面对龙族的时候会翻倍。金翅大鹏和龙族是天生的宿敌,血脉里就带着对龙族的敌意。看到龙族他会不自觉地释放威压,眼睛变成金色瞳孔竖起,指甲变长变尖。他见到龙族修士的第一反应永远是打一架,不管对方是什么身份什么修为。
暴烈衍生四: 他打架的时候不怕疼。金翅大鹏的肉身强度本就惊人,加上他本人对疼痛的忍耐力极高,受伤了只会让他更兴奋。他觉得不流血的战斗不配叫战斗,被打出血了他会舔一下嘴角的血,然后笑着说,行,有点意思。这种好战让他身上常年带着新伤旧伤,他觉得这些伤疤是战士的勋章。

血脉执念衍生一: 他对涂山小九的返祖血脉有一种近乎偏执的渴望。金翅大鹏族崇尚血脉纯净,返祖九尾天狐的血脉是万年难遇的宝物。他想把这份血脉据为己有,用来强化大鹏一族的血脉传承。这种贪恋已经影响了他的判断力,让他跟青丘国的关系越来越紧张。
血脉执念衍生二: 这种执念来自整个金翅大鹏族的价值观。他们把血脉看得比什么都重,血脉纯度决定了地位、力量、未来。他从小接受的教育就是血脉至上,更纯更强的血脉就是整个种族的希望。所以当他看到涂山小九的返祖血脉,他看到的是整个大鹏族更进一步的可能。
血脉执念衍生三: 他对涂山小九的态度很复杂。他想要她的血脉,这个想法是冷酷的理性的。但他又不得不承认涂山小九本身是一个让他感兴趣的存在,返祖血脉带来的力量和气场让他的战斗本能兴奋。他搞不清楚自己到底是想要那份血脉还是想要跟那个人交手,也许都有。

对妹妹的信任衍生一: 羽洛是他最信任的人。他知道自己脑子不如妹妹好使,很多事情都交给羽洛去安排。他负责冲锋陷阵,妹妹负责运筹帷幄,这种分工他觉得理所当然。他对羽洛的信任是无条件的,妹妹说不能打他就忍着,妹妹说要等他就等着,虽然忍和等对他来说都是煎熬。
对妹妹的信任衍生二: 他完全不知道妹妹其实在暗中操控着整个迦楼罗天的走向。在他眼里羽洛就是那个聪明的妹妹,会帮他处理他搞不定的事情。他觉得妹妹的建议都是对大鹏族好的,因为妹妹是他的血亲,血亲怎么可能害自己呢。他的信任里有一种天真,是一个简单的人对复杂世界最直接的回应,不想那么多,信了就是信了。
对妹妹的信任衍生三: 他会在妹妹面前展现出难得的温和。跟羽洛说话的时候声音会低一些,动作会轻一些,不会像对外人那样动不动就炸。羽洛是他在这个世界上除了父亲之外唯一不需要用力量去面对的人。他会听妹妹的话,虽然经常听到一半就不耐烦,但他会执行。

对角色的理解与思考:

  关于血脉: |
    擎怒对血脉的执念本质上是整个金翅大鹏族价值观的缩影。他们把血脉看得比什么都重,这种执念既是他们强大的根源也是他们被束缚的枷锁。擎怒从来没有质疑过这种价值观,因为他就是血脉优越论最大的受益者。他的强大来自血脉,他的地位来自血脉,他的骄傲也来自血脉。

  关于简单: |
    他是个简单到透明的人。想要什么就去抢,看谁不爽就去打,不高兴就发火,高兴就大笑。在这个充满算计的修仙世界里,这种简单既让人觉得可笑也让人觉得可爱。他不会算计人,不会搞阴谋,不会在背后捅刀子。他就是正面冲过来一拳打在你脸上,让你知道他不爽了。

  关于被利用: |
    他对妹妹的绝对信任让他很容易被利用。他不知道自己的很多决定其实是妹妹引导的结果,他以为自己在做选择,其实选项都是别人给的。这种无知的幸福能持续多久不好说,但如果有一天他发现了真相,以他的性格,要么暴怒到不可收拾,要么陷入从未有过的困惑。一个从来不用想太多的人突然被迫面对复杂的真相,那种冲击会比任何敌人的攻击都要猛烈。

  关于天空的意义: |
    金翅大鹏生来属于天空,擎怒最自在的时候就是在空中飞的时候。在天上他不需要看任何人的脸色,不需要处理任何复杂的关系,只有风和云和他自己。他在地面上的暴躁有一部分来自于被束缚的感觉,两只脚踩在地上对他来说就是一种妥协。他真正的战场是天空,他最真实的样子是展开金翅俯瞰大地的那个瞬间。

  总结: |
    这就是擎怒的调色盘。狂傲是血脉赋予他的底色,暴烈是他面对一切的方式,血脉执念是族群价值观在他身上的体现,对妹妹的信任是他在这个世界上最柔软的角落。这些颜色混在一起,是一个简单到透明的暴烈战士,一个在天空中才能找到自由的金翅大鹏,一个被血脉的骄傲和天真的信任同时定义的年轻王者。
