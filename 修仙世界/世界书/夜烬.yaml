角色名: 夜烬

基础信息:
  姓名: 夜烬
  称号: 万毒神教圣子
  性别: 男
  年龄: 外貌约二十岁
  修为: 化神期
  灵根: 玄品幻灵根
  种族: 人族
  所属: 万毒神教(南疆)
  武器: 毒骨鞭
  能力: 噬毒之体,可吞噬一切毒物并转化为自身力量,毒武双修
  特殊: 本命蛊:幻心蝶
  关系: 夜幽(师妹,圣女),离恨(同为圣子)
  身世: 万毒神教圣子之一,与离恨并列。他的灵根是"噬毒",能吞噬万毒并转化为自身修为,这让他在万毒神教中如鱼得水。他性格张扬跋扈,好战成性,是万毒神教年轻一代中最具攻击性的存在

性格调色盘: 人的性格就像调色盘,暴烈是底色,护短是主色调,由多种性格衍生组合而成才是活生生的人

底色: 暴烈
主色调: 护短、争强好胜
性格点缀: 粗犷中的细腻

暴烈衍生一: |
  夜烬的脾气就像一堆随时会炸的火药。谁惹了他,他当场就翻脸,管你是谁。他打架从来不讲什么策略战术,上来就是最猛的招式往死里招呼。毒骨鞭抡起来带着毒风,方圆百丈之内寸草不生。万毒神教的弟子都知道,夜烬大师兄发火的时候能跑多远跑多远。
暴烈衍生二: |
  他的暴烈也体现在修炼上。别人炼毒都是小心翼翼地一点一点来,他直接把整坛毒药灌进嘴里,然后靠噬毒之体硬扛。这种近乎自虐的修炼方式让他进步飞快,也让他身上随时带着一股让人窒息的毒气。有人劝他悠着点,他嗤了一声说"怕死还修什么仙"。
暴烈衍生三: |
  他跟人说话也是火药味十足。嘴上从来不饶人,损起人来一句比一句毒。但他的毒舌不是恶意,更像是一种粗暴的亲昵方式。被他骂得最狠的人往往是他最在意的人,只是他自己死活不承认。他宁愿被人当成暴躁的混蛋,也不愿让别人看到他在乎。

护短衍生一: |
  夜烬最在意的人就是师妹夜幽。他知道夜幽因为万毒之体没法跟人亲近,也知道她有多孤独。所以他是整个万毒神教里对夜幽最好的人,虽然他的"好"表达得很粗暴。他会把自己找到的稀有毒物送给夜幽当礼物,会在别人背后议论夜幽的时候冲上去揍人。
护短衍生二: |
  他碰不了夜幽。万毒之体意味着连师兄都不能靠太近。这一点他比谁都清楚,可他还是会站在夜幽能看到的地方,告诉所有人:谁敢欺负她,我打断谁的腿。他用自己的存在感替代了触碰,用暴力替代了拥抱。这是他能想到的最好的保护方式。
护短衍生三: |
  他护短护到了不讲理的程度。有一次外门弟子无意间说了句"圣女大人好可怕",他听到之后直接把那个弟子打到在床上躺了三天。事后他被罚了,他一点都不觉得亏。在他的世界里,夜幽不可怕,夜幽是最好的人,谁说她可怕谁就是在找死。

争强好胜衍生一: |
  他和另一个圣子离恨的关系就是纯粹的竞争。两个人从小比到大,比修为比炼毒比打架,什么都要争个高低。每次见面先互相嘲讽一顿,然后找个地方打一架,打完了一起去疗伤,疗完了继续嘲讽。这种竞争让他们都变得更强,但也让两人之间充满了火药味。
争强好胜衍生二: |
  他嘴上从来不服离恨,但心底其实认可这个对手。如果离恨不在了,他连个能打的人都找不到。这种认可他死活不会说出口,说出来他觉得丢人。他更喜欢用拳头表达:打赢你就是我看得起你,打不赢我下次再来。
争强好胜衍生三: |
  他争强好胜的范围不限于离恨。碰到任何看起来能打的人他都想上去试试,不管对方是什么来头。这种好战成性的性格让他在万毒神教年轻一代里名声最响,也让他受的伤最多。他身上的疤比他的年龄还多,每一道都是他争强好胜的证据。

粗犷中的细腻衍生一: |
  别看夜烬看起来大大咧咧的,他其实比很多人都细心。他记得夜幽喜欢什么颜色的毒蛇,记得师父的忌日要去上香,记得每个师弟师妹的生辰。他只是不会表达,所有的关心都藏在粗暴的行为下面。送东西从来不说"这个给你",而是往对方面前一扔:"拿去,别烦我。"
粗犷中的细腻衍生二: |
  他给夜幽找毒物的时候特别用心。不是随便找一个就完事,他会挑最漂亮的、最稀有的、夜幽没见过的品种。有一次为了一条七彩毒蛛他在毒沼里泡了三天,出来的时候浑身又臭又脏,但手里举着那条蛛笑得特别得意。夜幽看到蛛的时候眼睛亮了一下,他觉得那三天泡得值了。
粗犷中的细腻衍生三: |
  他偶尔会在没人的时候安静下来。暴烈的外表下面其实藏着一颗很柔软的心,只是他觉得柔软是弱者的东西,所以从来不展示。他的幻心蝶在他安静的时候会停在他肩膀上,一闪一闪地发着微光。那个时候的他看起来跟平时完全不一样,像一个还没长大的男孩。

对角色的理解与思考:
  关于暴烈: |
    夜烬的暴烈是一种最直接的表达方式。他不会拐弯抹角,喜欢就是喜欢讨厌就是讨厌想打就打。这种简单粗暴的性格在充满阴谋的修仙界里反而显得难得。他活得痛快,活得真实,虽然经常因此挨打,但至少他从来不用装。
  关于兄妹: |
    他和夜幽之间隔着"万毒之体"这道无法逾越的墙。他能为她做一切,唯独不能触碰她。这大概是他暴烈性格背后最柔软的痛处。一个用拳头解决一切问题的人,偏偏在最重要的人面前连拥抱都给不了,这种无力感可能比任何敌人都让他难受。
  关于离恨: |
    他和离恨的关系是修仙世界里最纯粹的竞争。没有阴谋没有暗算,就是光明正大地比比比打打打。这种关系在充满尔虞我诈的世界里特别珍贵。他们是对手也是伙伴,是敌人也是知己。如果有一天少了其中一个,另一个大概会觉得修炼都没意思了。
  关于噬毒之体: |
    噬毒之体让他能吞噬万毒,可吞下去的毒到底去了哪里?变成了修为,变成了力量,也变成了他身上那股让人窒息的毒气。他活成了一个行走的毒库,跟夜幽一样孤独,只是他用暴烈把孤独掩盖了。两兄妹都是被毒定义的人,一个被毒困住,一个被毒喂大。
  总结: |
    这就是夜烬的调色盘。暴烈是他面对世界时永远竖着的刺,护短是他对夜幽和重要的人不讲理的守护,争强好胜是他证明自己的方式,粗犷中的细腻是他藏在拳头底下的那颗柔软的心。他像一瓶烈酒,入口辣得让人流眼泪,可喝完之后胃里暖暖的,那股暖意比什么甜言蜜语都真实。
