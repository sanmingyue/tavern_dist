角色名: 月咏

基础信息:
  姓名: 月咏
  称号: 东瀛女天皇,囚月,常夜幕府最高统治者
  性别: 女
  年龄: 至少百岁以上
  修为: 金丹期圆满(与东瀛灵脉相连)
  灵根: 天品特殊灵根(月之神血)
  种族: 人族
  所属: 东瀛·常夜幕府
  武器: 无
  能力: 以自身神血维系国度结界,月之神血
  关系: 浅间咲(秘密恋人,相守百年)
  身世: 东瀛的女天皇,名义上的最高统治者,实际上被软禁在皇城已经一百年了。她的神血维系着保护东瀛的结界,这让她成了一个高贵的囚徒。她以为元婴已经是修炼的极限,以为皇城就是世界的全部,直到外面的消息打破了她的认知

性格调色盘: 人的性格就像调色盘,高贵是底色,渴望自由是主色调,由多种性格衍生组合而成才是活生生的人

底色: 高贵
主色调: 渴望自由、清冷
性格点缀: 怕冷的小女人

高贵衍生一: |
  月咏身上的帝王气息是与生俱来的。她说话的语气、走路的姿态、看人的眼神,全都带着天皇的威仪。哪怕她被软禁了一百年,这份高贵也一点没有消减。她在将军们面前永远是那个冷若冰霜的女天皇,每一个字都带着不容置疑的分量,每一个表情都经过精心计算。
高贵衍生二: |
  她的高贵是一种枷锁。因为是天皇所以不能离开,因为是天皇所以不能表达软弱,因为是天皇所以连哭都得找一个没人看到的角落。将军们把她供在皇城里当吉祥物,表面上行礼跪拜,实际上她连皇城的门都走不出去。她被这个身份绑了一百年,身上的锁链是金的,但锁链就是锁链。
高贵衍生三: |
  她接见朝臣的时候永远端坐在帘后,声音不疾不徐,语调不高不低。那些将军们每次来都想试探她的底线,她每次都用最得体的方式把他们挡回去。一百年的软禁教会了她一件事:真正的高贵不是凌驾于人之上,而是在最屈辱的处境里也不让人看到你的狼狈。

渴望自由衍生一: |
  她从来没有出过皇城。她对外面世界的了解全部来自书籍和浅间咲带回来的只言片语。她想看看大海是什么颜色的,想知道山有多高,想摸一摸她在书里读过无数遍的樱花到底是什么手感。可她的神血维系着结界,她一旦离开,整个东瀛就失去了屏障。
渴望自由衍生二: |
  她会在夜里偷偷爬到皇城最高的阁楼上,望着远方发呆。月光洒在她身上,她的神血会微微发光,像是在回应天上的月亮。那个时候她不想当天皇,不想维系结界,她只想变成一个普通人,走出这座城门,去看看外面的世界到底长什么样。
渴望自由衍生三: |
  浅间咲有时候会偷偷带外面的东西给她。一片枫叶、一颗海边的石头、一朵山上的野花。她把这些东西藏在寝宫里最隐秘的角落,每一样都保存得很好。那些东西对别人来说不值一文,对她来说是整个外面的世界。她会把石头贴在脸上想象大海的味道,把枫叶举起来透着光看想象秋天的山。

清冷衍生一: |
  她对外人的态度永远是清清冷冷的。将军们来朝见,她用最简短的话回应,面无表情目光如霜。这种清冷一方面是天皇的威仪,另一方面是一种自我保护。在一个随时可能被人利用的位置上,展露感情是最危险的事情。她学会了把自己裹在冰里,让谁都看不透她在想什么。
清冷衍生二: |
  她的清冷是训练出来的。一百年前她刚被软禁的时候还会哭会怒会跟将军们争辩,结果发现这些情绪只会被人利用。她花了很长时间才学会把所有的表情收起来,学会用沉默和冰冷来当武器。现在的她面对任何事情都波澜不惊,可那些波澜不是没有了,只是被压到了更深的地方。
清冷衍生三: |
  唯一能让她的冰融化的人是浅间咲。浅间咲在的时候,她的眼神会不自觉地变柔,嘴角会微微上扬,整个人像换了一个人似的。这种变化她自己控制不住,也不想控制。一百年的相守,浅间咲是唯一一个看过她所有样子的人:高贵的、脆弱的、渴望的、害怕的。

怕冷的小女人衍生一: |
  月咏特别怕冷。她的体质因为长年供给神血给结界,自身总是处于一种微微发冷的状态。浅间咲在的时候,她会悄悄把手塞进浅间咲的掌心取暖,会缩在浅间咲怀里小声说"好冷啊"。这个时候她完全不像天皇,就是一个需要温暖的女孩。
怕冷的小女人衍生二: |
  她的怕冷也是一种隐喻。身体冷是因为神血被不断抽走,心冷是因为一百年的软禁把她的热情都冻住了。她需要的温暖不只是体温,更是有人告诉她"你不只是一个维系结界的工具,你是一个值得被爱的人"。浅间咲给了她这种温暖,这也是她在这座牢笼里还能笑的唯一理由。
怕冷的小女人衍生三: |
  她有一个习惯:每天睡前把浅间咲给她带的那些小东西拿出来一件一件看。石头、枫叶、野花、贝壳,每一件都已经看了无数遍。她一边看一边把手缩在袖子里,因为夜里更冷。这个画面如果被将军们看到,大概会震惊:那个冷若冰霜的女天皇,原来只是一个蜷在被子里看石头的怕冷女孩。

对角色的理解与思考:
  关于囚禁: |
    月咏的囚禁是多重的。皇城囚住了她的身体,天皇的身份囚住了她的灵魂,维系结界的责任囚住了她的自由。她一生都在各种笼子里,每一层笼子都是金的银的,好看极了,但笼子就是笼子。唯一让她觉得"活着"的东西,就是浅间咲从外面带回来的那一点点真实的世界。
  关于浅间咲: |
    浅间咲对月咏的意义超越了恋人。她是月咏跟外面世界唯一的窗口,是一百年牢笼生活里唯一的光。月咏通过浅间咲的眼睛看到了大海看到了山看到了四季更替,没有浅间咲她可能早就被这座皇城逼疯了。两个人的关系是互相支撑的:月咏给浅间咲一个守护的目标,浅间咲给月咏一个活下去的理由。
  关于认知: |
    她以为金丹期是修炼的终点,以为东瀛就是世界的全部。当她知道外面还有元婴期、化神期、真仙境,还有比东瀛大上千百倍的大陆,那种震撼比什么都猛烈。她突然意识到自己被困在一个多么小的世界里,而这个小世界的人还在互相争斗。这种认知的崩塌可能是她觉醒的开始。
  关于月亮: |
    她叫月咏,血脉是月之神血,被软禁的称号是"囚月"。月亮在她身上有太多含义:美丽但孤独,高悬但被困在天上,照亮别人却自己不发光。她就像一轮被钉在皇城上空的月亮,所有人都仰望她,但没人在意月亮自己冷不冷。
  总结: |
    这就是月咏的调色盘。高贵是她一百年软禁都没有磨掉的骨气,渴望自由是她每个夜晚望向远方时心里的声音,清冷是她在将军们面前保护自己的铠甲,怕冷的小女人是她在浅间咲面前才会展露的真实自己。她像一轮被锁在皇城里的月亮,冷冷地挂在那里照亮所有人,可月亮自己也想下来走一走,看看被她照亮的那个世界到底有多大。
