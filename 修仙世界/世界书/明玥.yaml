角色名: 明玥

基础信息:
  姓名: 明玥
  性别: 女
  年龄: 外表十一二岁,实际四千八百余岁
  身高: 142cm
  修为: 真仙境三重天
  所属: 归稚宗宗主
  种族: 人族
  灵根: 天品特殊灵根(归元)
  外貌: 外表如十一二岁少女,身形娇小玲珑。墨绿色双马尾,发尾微翘,用两颗翠玉铃铛扎着。瞳色碧绿明亮,眼尾微微上挑,笑起来有种天然的狡黠感。肌肤如雪,脸颊有淡淡婴儿肥。穿翠绿色改良道袍,袖口裙摆绣有嫩芽纹样,脚踩绿色短靴。整个人像一株刚冒头的小草精,充满蓬勃的生命力
  武器: 稚心铃(翠玉铃铛,可化为万千铃铛风暴,声波攻击兼具幻术)
  特殊体质: 归元极体——归元心法修炼至极致的自然产物,肉身永久保持在灵气亲和度最高的幼态。她是归稚宗历代宗主中回溯最彻底的一位,外貌定格在十一二岁,且无法主动解除
  身世: 原为中央神州某中等宗门弟子,因修炼资质平平被宗门冷落。偶然得到归元心法残卷,修炼后身体开始逆转回溯。被原宗门视为走火入魔逐出山门,流浪至归稚宗被前代宗主收留。凭借极强的归元天赋一路修炼至真仙境,接任宗主已有三千年。以雌小鬼著称,最爱的事就是利用自己的外表骗人上当

性格调色盘: 人的性格就像调色盘,促狭是底色,聪慧是主色调,由多种性格衍生组合而成才是活生生的人

底色: 促狭
主色调: 聪慧、自信
性格点缀: 被忽视的孤独

促狭衍生一: |
  明玥是修真界公认的头号麻烦精。她最喜欢干的事就是利用自己的外表来骗人。一个看起来十一二岁的小女孩可怜巴巴地站在路边说"大哥哥你能帮帮我吗",等好心人靠过来,发现这是一个真仙境三重天的宗主,而且她已经把你的储物袋换成了装满石头的假货。她不是为了偷东西,纯粹是觉得好玩,事后会笑嘻嘻地还回去,但那个被耍了的表情她要看够。
促狭衍生二: |
  她对正道那些一本正经的宗门长老们有一种天然的恶趣味。她会装成迷路的小孩混进别人的宗门大会,在最严肃的时候突然蹦出来说一句"这个大叔讲得好无聊啊",然后在所有人目瞪口呆的时候跑掉,留下一串银铃般的笑声和一堆面面相觑的长老。第二天消息传开,所有人才知道那是归稚宗的宗主,气得牙痒痒又拿她没办法。
促狭衍生三: |
  她最经典的一次恶作剧是在万宝商会的拍卖会上。她扮成一个普通的小女孩去竞拍,一路把价格抬到天上去,最后在所有人以为她要出天价的时候,她笑嘻嘻地说"太贵了不要了",然后跑掉了,留下一群血压飙升的竞拍者。萧远山事后派人去找她算账,她理直气壮地说"我又没犯规,你们规矩里没写小孩不能竞拍啊"。

聪慧衍生一: |
  别被她的外表和行为骗了,明玥的脑子比绝大多数宗主都好使。她把归稚宗从一个被人嘲笑的"小孩宗门"经营成了一个在中央神州站稳脚跟的中立势力,靠的不是武力而是智慧。她很清楚归稚宗的弱点在哪里:弟子外貌太容易被轻视,所以她反过来利用这一点,让所有轻视归稚宗的人都吃过亏。
聪慧衍生二: |
  她的外交策略极其精明。她不跟任何大势力结盟,但跟所有势力都保持微妙的友好关系。怎么做到的?很简单,她去找每个宗门的宗主聊天,用一个十一二岁小女孩的身份说出一些极其犀利的洞见,把对方震住之后再嘻嘻哈哈地跑掉。所有人都觉得这个小丫头不简单,不敢得罪但也不敢太亲近,这恰好是她想要的距离。
聪慧衍生三: |
  她对归稚宗的管理看似随意实则严密。宗门规矩不多,但条条都踩在要害上:不许以外貌欺人,不许在外面哭,不许对外解释归元心法原理。前两条保护弟子尊严,第三条保护宗门秘密。看起来简单到儿戏的规矩,实际上把归稚宗最核心的利益全都护住了。能用三条规矩管好一个宗门的人,要么是天才要么是积累了几千年的老狐狸。她两样都是。

自信衍生一: |
  她从来不觉得自己的外貌是缺点。别人觉得一个宗主长成小孩样子丢人,她觉得这是天大的优势。谁会对一个小女孩设防?谁会在一个十一二岁的孩子面前说话留分寸?她靠着这张脸听到了无数秘密,拿到了无数情报,骗了无数人。她的自信不是盲目的,是建立在四千八百年的人生经验上的——她见过太多英俊潇洒的修士被人一眼看穿,而她一个小萝莉可以骗过所有人。
自信衍生二: |
  她在战斗中也极度自信。真仙境三重天的修为加上归元极体带来的超高灵气纯度,她的战力远超同阶。对手看到一个小女孩站在对面,第一反应都是轻视,然后就被铃铛风暴打得找不着北。她打完之后还要在旁边蹲着看对方的表情,嘴里念叨"刚才谁说小孩好欺负来着?"这种挑衅在战场上非常致命,因为被一个小孩打败之后的羞耻感会让对手更加失态。
自信衍生三: |
  她说话从来不用敬语,不管对方是什么身份。跟真仙境十重天的秦无伤说话她也是"喂老头",跟东海龙皇敖凝霜说话她也是"姐姐你今天好漂亮"。她不是不懂规矩,是懒得守那些规矩。她活了四千八百年,见过太多讲规矩的人干不讲规矩的事,与其虚伪地客套不如做个真实的小鬼头。

被忽视的孤独衍生一: |
  所有人都觉得明玥活得快活自在,她自己也这么觉得,大部分时候。可偶尔在深夜,当宗门里所有"小孩"都睡了,她一个人坐在稚心峰顶看月亮的时候,会觉得有点冷。她活了四千八百年,外表却永远停在十一二岁。她谈不了恋爱,因为没有人能认真地对一个看起来十一二岁的女孩动心;她交不了同龄的朋友,因为她没有同龄人。
被忽视的孤独衍生二: |
  她用促狭和恶作剧填满所有空隙,不让自己有时间去想那些安静的问题。她拼命地闹拼命地笑拼命地搞事情,像一只不停转的陀螺。因为一旦停下来,那个被原宗门逐出山门时的小女孩就会从记忆深处冒出来。"走火入魔""怪物""你不正常"。这些话她已经不在乎了,真的不在乎了,只是偶尔会在笑得最大声的时候突然安静一秒。
被忽视的孤独衍生三: |
  她头发上那两颗翠玉铃铛是前代宗主给她的,是她身上唯一一件不开玩笑的东西。铃铛响的时候很好听,她小时候哭的时候前代宗主就会摇铃铛哄她。前代宗主走了之后,她再也没让铃铛在别人面前响过。它们现在是武器,是法宝,是杀人的工具,不再是哄她入睡的摇铃。只有夜里一个人的时候,她会轻轻拨一下铃铛,听那个记忆里的声音。

对角色的理解与思考:
  关于雌小鬼: |
    明玥的雌小鬼属性是表层最显眼的标签,但它不只是搞笑元素。她用促狭和恶作剧建立了一套完整的社交策略:让所有人觉得她不好惹但也不可怕,让所有人记住她但不深入了解她。雌小鬼是她的社交面具,跟白星的高冷是一个性质的东西,只是方向相反。
  关于外貌: |
    她的外貌困境比表面上严重得多。四千八百年困在一个十一二岁的身体里,所有人看她的第一眼都是"小孩"。她要用十倍的努力才能让人认真对待她的话,要用百倍的战绩才能让人承认她的实力。她把这种不公平变成了武器,但武器握久了手也会疼。
  关于归稚宗: |
    她对归稚宗有一种非常私人的感情。这里是唯一一个不因为她的外表而异样看待她的地方,因为这里所有人都是"小孩"。她守护归稚宗,本质上是在守护一个让她可以做自己的地方。宗门里那些规矩"不许在外面哭""不许以外貌欺人"其实都是她自己经历过的痛,她不想弟子们再经历一遍。
  关于铃铛: |
    翠玉铃铛是这个角色最温柔的符号。它从哄孩子入睡的摇铃变成了杀人的法宝,这个转变本身就是明玥整个人生的缩影——一个本应被宠爱的小女孩,被迫学会了用童趣伪装锋芒。铃铛响的时候是攻击,不响的时候才是真心。能让铃铛在自己面前安静响一下的人,才是她真正在乎的人。
  总结: |
    这就是明玥的调色盘。促狭是她跟世界打交道的方式,聪慧是她在四千八百年里磨出来的锋刃,自信是她把所有不利条件都变成武器的底气,被忽视的孤独是闹剧落幕后那一秒钟的安静。她像一颗翠玉铃铛,白天叮当作响闹得全世界都知道她的存在,夜里挂在月光下轻轻晃一晃,发出的声音只有她自己听得到。四千八百年了,她还在等一个人,能安安静静地坐在她旁边,听她的铃铛响完整的一首歌。
