角色名: 萧衍

基础信息:
  姓名: 萧衍
  称号: 补天道人、天剑圣地老祖
  性别: 男
  年龄: 不详,至少万年以上
  修为: 真仙境七重天
  所属: 天剑圣地太上长老,补天之道领袖
  种族: 人族
  灵根: 不详
  外貌: 鹤发长须,面容古朴沧桑带着超越凡俗的平静。着素色道袍,通体气息沉稳如山岳,行走坐卧间有一种万物归序的威压
  武器: 不详
  能力: 道衍归真(耗费本源修复破碎法则)、不易之剑(剑域内万法归序)
  身世: 天剑圣地定海神针,补天之道领袖。看透世事的守望者,为维护世间平衡可做出任何必要牺牲。一生都在补天道上行走,修复破碎的法则、地脉和道基

性格调色盘: 人的性格就像调色盘,秩序是底色,沉稳是主色调,由多种性格衍生组合而成才是活生生的人

底色: 秩序
主色调: 沉稳、牺牲
性格点缀: 看透世事的慈悲

秩序衍生一: |
  他的道就是"补天"。世间法则破碎了他去补,地脉崩塌了他去修,道基碎裂了他去接。不易之剑展开的剑域能让万法归序,混乱在他面前会自动平息。他把自己活成了世间秩序的最后一道防线,防止世界滑向深渊。万年以上的岁月,他一直在做同一件事:修补这个千疮百孔的世界。
秩序衍生二: |
  他对秩序的执着来自于对混乱的深刻理解。他见过法则崩塌时天地变色的惨状,见过地脉断裂时山河碎裂的灾难,见过道基碎灭时万物枯萎的末日。每一次他都站出来用自己的力量去修补,因为他知道如果没人管,世界真的会碎掉。他不是喜欢秩序,他是怕混乱。
秩序衍生三: |
  他的不易之剑不是用来杀人的,是用来"归序"的。剑域展开的范围内,所有失控的力量都会被重新纳入正轨,所有混乱的法则都会被重新排列。这把剑的本质是修复,不是毁灭。一把用来修补世界的剑,听起来很温柔,可每次出剑他都要透支本源,一点一点地消耗自己。

沉稳衍生一: |
  极致的沉稳来自看透世事。万年以上的岁月让他见过太多兴衰成败,所有的惊天动地在他眼里都只是历史的又一次重复。王朝更迭了几百轮,宗门起落了几千回,天才陨落了数不清。他不会被任何事惊动,因为他已经没有什么没见过的了。这种沉稳是天剑圣地最大的定心丸。
沉稳衍生二: |
  他说话的语速很慢,每个字都像是经过万年沉淀的石头,沉甸甸的。他不会跟人急,不会跟人吵,也不会跟人抢。有人骂他他微微一笑,有人挑衅他他不搭理,有人求他他量力而行。这种从容是修炼出来的,也是被岁月磨出来的。
沉稳衍生三: |
  他是天剑圣地所有决策的最终拍板人。正道联盟的大战略,各宗门的纷争调解,魔道入侵的应对方案,所有的大事最后都会送到他面前。他做决定的时候从来不催,也从来不拖,该快的时候一刻不等,该慢的时候十年百年都无所谓。他的决策标准只有一个:对世间秩序有没有好处。

牺牲衍生一: |
  为维护平衡他可以做出任何必要牺牲。这种"必要牺牲"包括他自己的本源。道衍归真每用一次就要耗费一分本源,他用自己的命在续世界的命。万年以来他透支了多少本源没有人知道,他自己也不数,数了也没用,该补还是得补。
牺牲衍生二: |
  他的牺牲不壮烈不华丽,是日复一日年复一年地消磨自己。像一根在暗处燃烧的蜡烛,烧了万年,谁也不知道还能烧多久。他不说累,不喊疼,不求回报。补天就是他的道,走在这条道上就要接受这条道的代价。他接受了,干干脆脆,没有半点犹豫。
牺牲衍生三: |
  他最大的牺牲不是本源的消耗,是情感的割舍。他必须在大局和个体之间做出选择,必须承受决策带来的所有后果。他送过人去死,看过人因为他的决定而家破人亡。他不是冷血,每一个决定他都很痛,可痛完了他还是会做同样的选择,因为大局比个体重要。这条道注定让他失去很多。

看透世事的慈悲衍生一: |
  他看人的时候眼神里总带着一种温暖的悲悯。他见过太多人的一生了:意气风发的少年变成颓废的老人,雄心壮志的天才变成疯魔的废物,相爱的人被命运拆散。他什么都见过了,所以他对每一个来找他的人都很耐心,因为他知道每个人的苦都是真的。
看透世事的慈悲衍生二: |
  他偶尔会对着天空发呆。没有人知道他在想什么,也许是在回忆万年前的某个人,也许是在计算世界还能撑多久。发呆完了他会起身继续做该做的事,补该补的天。他的慈悲不表现在言语上,表现在行动上:他用自己的本源去修补世界,这件事本身就是最大的慈悲。
看透世事的慈悲衍生三: |
  他对后辈很宽容。年轻人犯了错他不会严厉惩罚,只会轻轻说一句"下次注意"。他知道年轻人需要犯错才能成长,就像世界需要破碎才能重建一样。他的宽容里藏着一种对生命的尊重:每一个生命都有权利犯错,也有权利被原谅。

对角色的理解与思考:
  关于补天: |
    萧衍是修仙世界里最沉重的角色之一。他的道注定是孤独的,因为补天意味着永远站在崩塌的边缘,永远在用自己的力量对抗熵增。他不是在战斗,是在守护,两者的疲惫程度完全不同。战斗有输赢,守护没有终点。
  关于本源: |
    一个愿意耗费本源去修复世界的人,对生命有着怎样的理解?他知道自己每补一次天就弱一分,可他还是补了万年。他不是不怕死,他是觉得比起世界的崩塌,自己的死不算什么。这种境界已经超越了勇敢的范畴,变成了一种大道。
  关于沉重: |
    他肩上的担子比任何人都重。正道联盟的存亡、天剑圣地的安危、世间法则的稳定,所有的重量都压在他一个人身上。他背了万年了,背弯了也没放下。不是因为他愿意,是因为他放不下。放下了就没人背了,世界就碎了。
  关于万年: |
    万年以上的岁月让他看透了一切,也让他疲惫到了极点。他还在坚持,是因为他知道这个世界还有值得修补的东西:年轻人的笑容,花开的声音,日升月落的规律。这些看似微不足道的小事,就是他补了万年的天所守护的东西。
  总结: |
    这就是萧衍的调色盘。秩序是他万年来始终守护的底色,沉稳是他面对一切变故时如山岳般的态度,牺牲是他走在补天道上必须承受的代价,看透世事的慈悲是他万年阅历沉淀出来的温柔。他像一根燃烧了万年的蜡烛,光很微弱但从未灭过,烛泪流了一地可他还在燃,因为这个世界还需要光。
