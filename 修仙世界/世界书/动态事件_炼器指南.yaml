动态事件类型: 炼器

正统修仙铁律:
  核心原则: 炼器需要时间、材料、火候、境界，不存在一蹴而就
  现实规则:
    - 炼器品级受限于修为境界和炼器造诣
    - 材料品质决定法宝上限
    - 失败会损耗材料
    - 高品法宝需要数月甚至数年时间
  禁止:
    - 随便炼制出神器
    - 无材料凭空炼器
    - 境界不够强行炼制高阶法宝
    - 一次成功炼制顶级法宝

时间消耗规则_真实修仙:
  低阶法宝(一至三品):
    耗时: 3-7日
    适合境界: 炼气期至金丹期

  中阶法宝(四至六品):
    耗时: 1-3个月
    适合境界: 元婴期至炼虚期

  高阶法宝(七至九品):
    耗时: 半年至数年
    适合境界: 合体期至真仙境

  本命法宝:
    耗时: 需长期温养，数十年至百年
    特殊: 与修士性命相连，成长型

炼器造诣等级:
  入门: 可炼制一品法宝，成功率30%
  熟练: 可炼制二至三品法宝，成功率50%
  精通: 可炼制四至五品法宝，成功率60%
  大师: 可炼制六至七品法宝，成功率70%
  宗师: 可炼制八品法宝，成功率80%
  炼器圣手: 可炼制九品法宝，成功率85%

材料需求:
  基础材料:
    金属: 赤铜、玄铁、寒铁、星辰铁、五行精金等
    木材: 灵木、千年木心、建木枝等
    兽材: 妖兽骨骼、皮毛、内丹、精血等
    矿石: 灵石、五行矿石、特殊晶石等

  辅助材料:
    符文材料: 用于铭刻阵法
    淬火材料: 提升法宝品质
    融合材料: 增加特殊属性

炼器流程:
  1. 选材:
    - 根据法宝类型选择主材
    - 准备足够的辅材
    - 材料品质影响成品上限

  2. 熔炼:
    - 需要适合的火源(地火/丹火/异火)
    - 控制火候至关重要
    - 境界越高，火候控制越精准

  3. 塑形:
    - 用神识和灵力塑造形状
    - 需要长时间专注
    - 容易失败的环节

  4. 铭刻:
    - 刻画阵法纹路
    - 需要阵法造诣
    - 决定法宝功能

  5. 淬火:
    - 最后一步
    - 决定法宝最终品质
    - 容易功亏一篑

  6. 温养:
    - 新炼制的法宝需要温养
    - 本命法宝需长期温养

成功率影响因素:
  提升成功率: + 修为境界高
    + 炼器造诣深
    + 材料品质好
    + 环境适合(地火室等)
    + 有丹药辅助(恢复神识)
    + 心境平和

  降低成功率:
    - 强行炼制超境界法宝
    - 材料品质不足
    - 火候控制失误
    - 中途被打断
    - 神识不足
    - 心境浮躁

奖励规则_严格限制:
  成功炼制:
    一品法宝: 获得法宝，修炼进度+1-2，炼器经验+5
    二品法宝: 获得法宝，修炼进度+2-3，炼器经验+10
    三品法宝: 获得法宝，修炼进度+3-5，炼器经验+15
    四品法宝: 获得法宝，修炼进度+5-8，炼器经验+25
    五品法宝: 获得法宝，修炼进度+8-12，炼器经验+40
    六品法宝: 获得法宝，修炼进度+12-18，炼器经验+60
    七品法宝: 获得法宝，修炼进度+18-25，炼器经验+90
    八品法宝: 获得法宝，修炼进度+25-35，炼器经验+130
    九品法宝: 获得法宝，修炼进度+35-50，炼器经验+200

  失败: 材料损耗50%-80%
    炼器经验+少量
    神识消耗严重，需要休养

  注意: 修炼进度奖励仅限炼器过程中的感悟，不是直接提升境界

材料成本参考:
  一品法宝: 50-200下品灵石
  二品法宝: 200-500下品灵石
  三品法宝: 500-2000下品灵石或1-4中品灵石
  四品法宝: 5-20中品灵石
  五品法宝: 20-50中品灵石
  六品法宝: 50-200中品灵石或1-4上品灵石
  七品法宝: 5-20上品灵石
  八品法宝: 20-100上品灵石
  九品法宝: 100-500上品灵石

炼器类型:
  攻击型:
    剑: 飞剑、重剑、软剑等
    刀: 战刀、弯刀等
    枪: 长枪、标枪等
    其他: 锤、斧、鞭、爪等

  防御型:
    护甲: 战甲、法袍等
    护盾: 盾牌、护身符等
    阵盘: 防御阵法

  辅助型:
    飞行: 飞舟、飞剑(兼用)、飞毯等
    储物: 储物袋、储物戒等
    炼丹: 丹炉
    其他: 各种功能性法宝

特殊炼器:
  本命法宝:
    - 需要滴血认主
    - 可随修为成长
    - 损坏会伤及本源
    - 炼制难度极高

  法宝升级:
    - 可以对现有法宝进行升级
    - 需要额外材料
    - 有失败风险
    - 升级比重炼简单

  法宝修复:
    - 修复破损法宝
    - 根据损坏程度决定难度
    - 完全损毁无法修复

境界限制_绝对规则:
  炼气期: 最多炼制一品法宝
  筑基期: 最多炼制二品法宝
  金丹期: 最多炼制三品法宝
  元婴期: 最多炼制四品法宝
  化神期: 最多炼制五品法宝
  炼虚期: 最多炼制六品法宝
  合体期: 最多炼制七品法宝
  大乘期: 最多炼制八品法宝
  渡劫期: 最多炼制准仙器
  真仙境: 最多炼制九品仙器

事件触发条件建议:
  - 用户主动提出炼器
  - 用户获得了炼器材料
  - 修真百艺中包含"炼器"
  - 用户进入炼器室/地火室

AI生成要点:
  环境描写:
    - 炼器场所(地火室/炼器阁等)
    - 火焰描写(赤红/青蓝/金色等)
    - 材料准备

  过程描写:
    - 熔炼金属的过程
    - 神识控制的细节
    - 塑形时的专注
    - 铭刻阵法的精细
    - 淬火的紧张

  结果描写:
    - 成功: 法宝成形，散发光芒，品质如何
    - 失败: 材料崩碎/形体失控/阵法破裂等
    - 消耗: 神识疲惫，灵力消耗

注意事项:
  - 炼器是技术活，不是运气活
  - 境界不够强行炼制必然失败
  - 材料不足无法炼制
  - 炼器需要专注，不可分心
  - 失败是常态，成功需要积累
  - 越高品级的法宝，失败率越高
  - 本命法宝极为珍贵，不可轻易炼制
