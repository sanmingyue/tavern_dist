南海龙宫:
  定位: 四海龙族势力,南海统治者
  详细位置: 四海·南离海·深海龙宫
  势力性质: 龙族圣地

  核心信息:
    宗主: 南海龙王
    势力规模: 大型龙族势力
    主要种族: 龙族
    势力特点: 古老、保守、强大

  主要地点:
    - 南海龙宫
    - 水晶宫殿
    - 龙珠宝库
    - 深海秘境

  势力特色:
    - 龙族血脉纯正
    - 掌控南海水域
    - 收藏无数珍宝
    - 过度保护后代

  重要角色:
    - 烛云: 南海龙宫小公主,离家出走的迷糊小龙女

  势力现状:
    - 势力稳固
    - 与世无争
    - 小公主烛云离家出走
    - 龙王担忧但未追回

  特殊设定:
    - 龙族世家
    - 古老传承
    - 对人间认知来自话本小说
    - 过度保护导致后代不懂险恶
