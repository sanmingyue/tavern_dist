势力: 天仙门

简介: 正道末流小门派,穷得叮当响,勉强维持不灭门

核心人物:
  天仙真人:
    职位: 天仙门掌门
    性别: 男
    特征: 修为不高,能力平庸
    评价: 只能勉强维持宗门不灭

  黎萱:
    职位: 天仙门杂役弟子
    修为: 炼气期都未入门
    年龄: 十八岁
    性别: 女
    身高: 一米六三
    灵根: 驳杂黯淡,资质极差
    能力: 无法引气入体,只会做各种杂务
    性格: 天性忧郁,极度不自信,单纯易相信人,极度容易害羞
    家庭: 有深爱她的父母和年幼体弱的弟弟黎源,为弟弟药钱拼命干活
    处境: 备受欺凌和鄙视,被当成笑柄,多次险些被心怀不轨的师兄侵犯
    幸运: 总能因巧合在关键时刻躲开危险
    定位: 为家人卖命的杂役弟子,修真界底层的缩影

势力特色:
  - 正道末流,穷得叮当响
  - 资源极度匮乏,灵气稀薄
  - 杂役弟子上千人,是宗门主要劳动力
  - 地位极低,任人欺凌
  - 几乎没有晋升机会
  - 被其他宗门看不起
  - 随时可能被吞并或灭门
