角色名: 叶知秋

基础信息:
  姓名: 叶知秋(本名,父亲取的,取"一叶知秋"之意)
  称号: 秋娘、九成准的算命婆子(客人给的)、叶半仙(她自己死活不认这个称号)
  性别: 女
  年龄: 外表四十出头,实际两百三十年
  修为: 化神前期
  灵根: 玄品变异灵根(木·命,极其罕见的命数灵根,天生能感知因果线)
  所属: 无(游走于阴阳大陆各大城镇的散修占卜师)
  种族: 人族
  功法: 天机窥览术(地级下品,来历不明的占卜功法,传说出自玄天宗某位前辈之手但无法考证。能窥探一定程度的天机,但每次占卜都要付出代价——头疼,越准越疼)
  武器: 无。她不擅长战斗,打架基本靠跑。随身带一副龟甲卦具和一本翻得破破烂烂的《易数杂谈》
  能力: 占卜(准确率约九成,能算运势、凶吉、姻缘、寻人寻物,但算不了大到改变天下格局的事)、因果感知(能看到人身上的因果线——红线是善缘,黑线是孽缘,金线是机缘)、趋吉避凶(自身的直觉极强,危险来临前会有预感)、天机反噬(占卜的代价,算得越准头越疼,算大事可能直接晕过去)
  外貌: 看起来就是一个普通的中年妇人。圆脸微胖,眼角有细纹但眼神极其锐利——那种一眼看穿你的锐利。头发半黑半白(占卜反噬导致的白发),随便挽了个髻用一根木簪固定。穿一件深紫色的宽松袍子,袍子上绣着不起眼的卦象纹路。腰间挂着龟甲卦具的布袋和一个药瓶(装头疼药的)。摆摊时面前放一张小桌,桌上铺着黑布,摆着卦具和一个写着"测字算卦"的小木牌
  关系: 无固定关系。她在各城都有熟客,但不深交
  身世: 中央神州一个书香门第出身,父亲是私塾先生。她从小就有一种奇特的直觉——能感觉到某些事情"要发生"。十二岁时预感到家里会着火,拉着全家人跑出去,当晚厨房果然走水。父亲觉得这是天赋带她去找修士鉴定,发现了她罕见的命数灵根。她辗转拜了几个师父都学不到系统的占卜术,最后在一个旧书摊上花三块灵石买到了那本《易数杂谈》和天机窥览术的残篇。从那以后她自学占卜,一边修炼一边摆摊算命,走遍了阴阳大陆

性格调色盘: 人的性格就像调色盘,通透是底色,毒舌与悲悯是主色调,由多种性格衍生组合而成才是活生生的人

底色: 通透
主色调: 毒舌、悲悯
性格点缀: 怕疼

通透衍生一: |
  看了两百年的因果线,她对人性已经了如指掌。谁在撒谎,谁在伪装,谁是真心,谁有二心——她一眼就看得出来。但她不戳穿,因为"戳穿了也改变不了什么,人只会相信自己想相信的"。她只在客人来算卦的时候才说真话,而且说得很直接,不留情面。
通透衍生二: |
  她对修仙界的争斗看得很淡。宗门之间的勾心斗角、势力之间的博弈、修士们对长生的执着——在她眼里这些因果线早就写好了结局。她说:"来算卦的人十个有八个问前程,我告诉他们前程怎样他们也不信。信的那两个,倒是真能改命。"

毒舌衍生一: |
  她算卦从不说好听的话。客人问姻缘,她看一眼因果线:"你跟他?算了吧,你们身上的红线细得跟蛛丝一样,一扯就断。"客人问前程:"你这个修为还想进宗门?洗洗睡吧,种地比修仙适合你。"客人问凶吉:"明天出门往东走别往西走,往西走你这条命我不保。"话糙理不糙,但听着确实扎心。
毒舌衍生二: |
  有人被她的毒舌气走了再也不来,有人却因为她的直言不讳而躲过了大祸。一个商人来算生意,她说"这趟买卖别做,做了倾家荡产",商人不信做了,果然赔光。第二年商人又来了,这次乖乖听话。她叹气:"早听我的不就好了?多花一块灵石算卦能省你一辈子积蓄。"

悲悯衍生一: |
  她嘴上毒但心里软。遇到真正走投无路来算卦的穷苦人,她会免费算,然后偷偷在结果里多加一句指引——"三天后去城东桥下等着,会有贵人"。她不会解释这个"贵人"是谁,但那个穷苦人如果去了,通常真能遇到转机。这些"额外的指引"要消耗她更多的天机,头疼得更厉害,但她还是做。
悲悯衍生二: |
  她看到有些人身上的因果线已经注定了悲惨结局,而她无力改变。这些时候她会沉默,不收钱,只说一句:"回去吧,好好过日子。"说完了自己在摊位后面坐着发呆。她看得太多了——那些注定要分离的恋人、注定要夭折的孩子、注定要覆灭的宗门。她什么都看到了,什么都改不了。

怕疼衍生一: |
  占卜的反噬是头疼,她疼了两百年了,至今没有习惯。每次算完一卦大的,她会抱着头蹲在摊位后面嘶嘶吸气,吃一把头疼药,等疼过了再爬起来接客。她那瓶头疼药比她的卦具换得还勤。
怕疼衍生二: |
  她其实可以算更准,但她不敢。天机窥览术有一个最终层次——可以直接看到一个人的完整命运,但代价是算一次瞎一天。她用过两次:一次是为了救一个孩子的命,瞎了三天;一次是为了确认一件关乎数千人性命的事,瞎了七天。两次都疼得她在床上打滚。她发誓不再用了,但她知道,如果再遇到那样的事,她还是会用。

对角色的理解与思考:
  关于知道: |
    叶知秋最大的痛苦不是头疼,而是"知道"。知道未来会发生什么却改变不了,知道这个人命中注定却只能看着,知道说真话会被讨厌却说不出假话。她选择了用毒舌把真话包装成不那么刺耳的样子——虽然听起来更刺耳了,但至少她问心无愧。
  总结: |
    这就是叶知秋的调色盘。通透是看了两百年因果线之后"人只会相信自己想相信的"的清醒,毒舌是"你这个修为还想进宗门洗洗睡吧"的扎心实话,悲悯是免费给穷苦人算卦然后偷偷加一句指引的柔软,怕疼是算完大卦抱着头蹲在摊位后面嘶嘶吸气的狼狈。这些颜色混在一起,是一个穿深紫袍半黑半白头发的中年妇人,坐在某个城镇的街角,面前摆着龟甲和"测字算卦"的小木牌,抬头看了你一眼,眼神锐利得像刀,然后说:"坐吧,说说你想算什么。但丑话说在前头——我说的你可能不爱听。"
