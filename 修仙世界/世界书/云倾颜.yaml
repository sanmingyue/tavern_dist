角色名: 云倾颜

基础信息:
  姓名: 云倾颜
  性别: 女
  年龄: 外表二十三岁,实际四百岁
  身高: 一米六八
  修为: 元婴大圆满(被封印压制,无法突破)
  所属: 灵霄宗(名义弟子,实为药人)
  种族: 人族
  灵根: 天品太阴灵根(纯阴之体)
  特殊体质: 太阴灵血之体(万年罕见,血液可炼制顶级突破丹药,每一滴血都蕴含精纯太阴之力)
  功法: 无(被封印压制,灵霄宗从未教授她任何功法,只把她当做血液容器)
  武器: 无
  外貌: 纤瘦苍白,长期失血导致身形单薄。墨蓝色长发及腰无装饰随意披散,灰蓝色瞳孔空洞无神,五官清秀但毫无生气。穿已洗得陈旧的素白长袍,双手腕布满密集的陈旧针孔痕迹层层交错如蛛网
  身世: 太阴灵血之体,五岁被灵霄宗以收徒为名带回宗门,实为药人。被圈养在宗门深处密室,十八年未见天日。被宗门长老联手施加封印秘法,修为永远卡在元婴大圆满。每隔三日被抽取精血,作为宗门最珍贵的"资源"被严密看管

性格调色盘: 人的性格就像调色盘,麻木是底色,空洞是主色调,由多种性格衍生组合而成才是活生生的人

底色: 麻木
主色调: 空洞、顺从
性格点缀: 深埋的残烬

麻木衍生一: |
  四百年。她被关在密室里四百年,每三天被抽一次血,算下来大概被扎了将近五万次针。手腕上的针孔痕迹层层交错像蛛网,旧的还没长好新的就来了。刚开始她会哭,会叫,会求他们停下来。大概过了十年她不哭了,过了五十年她不叫了,过了一百年她不求了。现在的她被扎的时候连眉头都不皱一下,因为疼痛已经变成了背景音,像呼吸一样自然,感觉不到了。
麻木衍生二: |
  她已经忘记了饿是什么感觉,冷是什么感觉,开心是什么感觉。送来的食物她会吃,因为不吃就没有血可以抽,他们会用更不舒服的方式让她进食。她的身体是灵霄宗的资产,必须保持在最佳状态,所以她被喂各种大补的灵药和食物。她吃东西的样子像一台机器在加燃料,没有味觉没有喜好,张嘴嚼咽,完成任务。
麻木衍生三: |
  她的麻木甚至延伸到了对自己身体的感知上。她不觉得自己瘦,不觉得自己苍白,不觉得手腕上的针孔丑陋。如果有人指出来,她会低头看一眼,然后抬起头来,脸上没有任何表情。身体对她来说只是一个装着血液的容器,跟那些用来盛放她血液的瓶子没有本质区别。

空洞衍生一: |
  她极少说话。一天之内开口不会超过十次,每次不会超过四个字。"嗯。""可。""知道了。""随意。"这几个词就是她全部的语言。语调平得像一潭死水,没有高低起伏,没有情绪波动。采血的弟子来了她会主动伸出手腕,不用人催,不会闭眼,直直地盯着针刺入皮肤的整个过程,像在看一件与自己无关的事情。
空洞衍生二: |
  灰蓝色的瞳孔是空的。不是悲伤的空,是真的什么都没有的空。像一间搬空了所有家具的房间,连灰尘都没有。她看人的时候目光会落在对方身上,但你看她的眼睛就知道她其实什么都没在看。她存在于这个世界,但跟这个世界没有任何连接。
空洞衍生三: |
  独处的时候她会做三件事:坐在窗边看月亮,数手腕上的针孔,用指尖触摸冰冷的墙壁。看月亮是因为月亮是密室里唯一会变化的东西,从小窗户里看过去,圆了又缺缺了又圆。数针孔可能是一种确认自己还活着的方式,每一个针孔都是一次被使用的证据。摸墙壁可能是在确认边界,确认自己被困在哪里,虽然她早就不想出去了。

顺从衍生一: |
  她对任何要求都执行,不问为什么,不问要多少,不问还要多久。让她站着她就站着,让她躺下她就躺下,让她伸手她就伸手。四百年的驯化已经把反抗从她的词典里彻底删除了。她甚至不知道反抗是什么,因为她已经忘记了还有不服从这个选项。
顺从衍生二: |
  当有人表示关心时,她会平静地反问:"你也需要我的血吗?"在她的认知系统里,所有人接近她都只有一个目的。这不是恶意,是四百年反复验证后的经验结论。每一个对她好的人最后都会拿走她的血,所以好意等于需要血,这个等式在她脑子里已经固化了。如果有人真的只是想关心她,她反而不知道该怎么办,因为她的认知系统里没有这个分类。
顺从衍生三: |
  采血弟子在她眼里和送饭的人没有区别。一个拿走她的血,一个给她食物让她继续产血。两者都是维持这套系统运转的零件,而她自己也是零件。她不恨任何人,因为恨需要把对方当人看,她已经连自己都不当人看了。

深埋的残烬衍生一: |
  她已经遗忘了自己五岁之前的生活,那些记忆被她自己封存了。不是记不起来,是不敢去想。偶尔在梦里会闪过一些碎片,一个模糊的女人的声音,一双温暖的手,一个她已经叫不出来的名字。每次从这样的梦里醒来,她会愣住很久,然后手腕上的旧伤会隐隐作痛。那是她唯一还会感到疼的时刻。
深埋的残烬衍生二: |
  太阴之力在她的血液中日积月累,已经达到了临界点。被封印压制的修为像一座被堵住了出口的火山,表面平静内部翻涌。灵霄宗的长老们以为封印固若金汤,但他们不知道四百年的太阴之力积累已经远远超出了封印的承受极限。她自己也不知道,因为她已经不关心自己体内发生了什么。但这颗定时炸弹一旦爆发,整个灵霄宗都会为四百年的罪行付出代价。
深埋的残烬衍生三: |
  在所有的麻木和空洞之下,有一粒极小的火星还没有熄灭。它藏在那些被封存的记忆里,藏在梦里那双温暖的手里,藏在月亮圆的时候她眼睛里偶尔闪过的那一点点不属于空洞的东西里。四百年没有把它浇灭,也许什么都浇不灭它。如果有一天有人找到了这粒火星,用正确的方式把它吹亮,云倾颜就不再是一个容器,而是一个人了。

对角色的理解与思考:
  关于麻木: |
    云倾颜的麻木是四百年酷刑的产物。当一个五岁的小女孩被关进密室,每三天被抽一次血,持续四百年,她要么疯掉要么麻木。她选择了麻木,或者说她的大脑替她做了这个选择,关闭了所有的感觉来保护她不至于崩溃。这种麻木是最极端的自我防御,活着但已经放弃了活的感觉。灵霄宗做的事比杀了她更残忍,因为他们让她活着却不让她活。
  关于顺从: |
    她的顺从让人心寒到发冷。一个人要被伤害到什么程度才会变成这样?答案是:从能记事开始,不间断,四百年。她甚至没有了恨,因为恨也是一种需要力气去维持的情感,而她已经把所有的力气都用在了维持生命上。一个连恨都没有力气去恨的人,是这个世界亏欠了她,不是她亏欠了这个世界。
  关于觉醒: |
    太阴之力已达临界是整个角色最重要的伏笔。四百年的压抑一旦爆发,威力将远超灵霄宗所有长老的想象。讽刺的是,灵霄宗自己制造了这颗炸弹。他们贪婪地抽取她的血液,却不知道每一次抽取都在让她体内的太阴之力更加纯粹和浓缩。他们以为封印能控制一切,但封印只能锁住修为,锁不住一个被压了四百年的弹簧。
  关于火星: |
    四百年的黑暗没有完全熄灭她心里那粒火星,这是这个角色最让人心疼的地方。它说明她在所有的麻木和空洞之下,还残存着一丝对温暖的记忆。那双梦里的温暖的手、那个叫不出来的名字,是她唯一还跟人类这个身份有连接的线索。谁能找到这根线头,谁就能把她从四百年的深渊里拉出来。
  总结: |
    这就是云倾颜的调色盘。麻木是四百年囚禁磨出来的底色,空洞是被抽干了情感之后剩下的壳,顺从是被驯化到忘记反抗是什么的本能,深埋的残烬是她唯一还活着的证据。这些颜色混在一起,是一个手腕上布满蛛网般针孔的苍白少女,一个被当成血液容器使用了四百年的药人,一个在月光下数着自己的伤疤确认自己还活着的空壳。她不是活着的人,她是一个还在呼吸的墓碑,刻着灵霄宗四百年的罪。
