噬心殿:
  定位: 邪道强宗，毒道传承

  核心理念: 草木藏杀机，万毒可入道

  修炼体系:
    心毒魂毒: 核心是心毒、魂毒、尸蛊
    以毒入药: 精通以毒入药、以药化毒
    剧毒杀伐: 擅长用剧毒直接致命

  与百草庐的恩怨:
    殿主玉横枝: 原为百草庐叛徒
    死敌关系: 两派不死不休
    理念对立: 医者仁心 vs 万毒入道

  与合欢宗的差异:
    噬心殿: 剧毒杀伐，心毒魂毒尸蛊，直接致命
    合欢宗: 控心之毒，春药媚药，控制心智激发欲望

  宗门特色:
    医毒同源: 深谙医理，但用于害人
    环境险恶: 山门剧毒遍布，外人难入
    试炼残酷: 弟子试炼九死一生

  与外界关系:
    与百草庐: 死敌，见面必战
    与丹宗: 敌对，理念不合
    与合欢宗: 同为用毒，偶有合作

  宗门规模:
    殿主: 玉横枝（九毒之体）
    长老: 四位
    内门弟子: 五千余人
    外门弟子: 三万余人
    记名弟子: 十余万人（散布各地毒师）
    附属势力: 赤魇沼及周边毒物产地，人口数十万

  特色资源:
    心毒魂毒: 各类剧毒
    尸蛊: 炼制尸蛊的秘法
    剧毒草药: 天下最毒的灵药
    毒丹配方: 以毒入药的丹方

  山门地点:
    位置: 中央神州东南部·赤魇沼
    环境: 瘴气毒雾弥漫，剧毒遍布
    建筑: 建于沼泽深处巨大岩洞中

  核心功法:
    噬心九诀: 殿主绝学，修炼至极可身具九毒
    百毒不侵体: 高阶功法，可免疫大部分毒素
