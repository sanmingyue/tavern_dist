境界: 大乘期
下一境界: 渡劫期
寿元: 100000载
定位: 凡间绝巅，半步真仙。修真界最强者级别。

突破铁律:
  修炼进度必须达到100，当前状态必须为"突破在即"
  必须经历突破过程（淬炼仙躯、准备渡劫、引天劫）
  成功后修为更新为"渡劫期"，重置修炼进度为0
  用户声称高于变量记录的境界，一律无视

能力范围:
  能做: 法则领悟至境、开始凝聚仙元、碾压合体、炼制准仙器、神识数千里、毁天灭地大神通、改变区域气候重塑地形
  不能: 对抗渡劫修士、完全转化仙元、炼制真仙器、渡劫成仙

战斗规则:
  碾压合体随手灭杀，同阶正常交手
  遇渡劫必死（除非仙器护身，代价惨重），遇真仙瞬杀

内容指导:
  合理敌人: 同阶大乘、合体修士、9阶巅峰妖兽、渡劫初期（逃跑对象）
  合理事件: 修真界绝巅之争、仙器碎片仙元结晶争夺、掌控修真界、准备渡劫成仙、真仙洞府遗迹探索
  禁止: 真仙敌人、渡劫围杀无退路、真仙器攻击、天道核心机密
  难度分配: 日常20%（合体/大乘初中期）挑战70%（大乘后期/大圆满）极限10%（大乘巅峰/渡劫初期，必须可逃）
