动态事件类型: 奇遇机缘

正统修仙铁律:
  核心原则: 机缘可遇不可求，有运气成分但不能过度，符合实际实力和因果
  现实规则:
    - 机缘应当合理，不能凭空获得逆天宝物
    - 高价值机缘必有高风险或代价
    - 机缘等级应匹配用户当前境界
    - 连续获得大机缘不合理
  禁止:
    - 无脑送神器/绝世功法
    - 低境界获得完全超阶的宝物
    - 无风险获得天大好处
    - 机缘过于密集

机缘类型与境界匹配:
  小机缘(适合炼气至筑基):
    功法类:
      - 普通功法残篇
      - 低阶术法秘籍
      - 基础心法

    宝物类:
      - 一二品法宝
      - 下品灵石若干(10-100枚)
      - 低阶丹药(数瓶)

    传承类:
      - 前辈的修炼笔记
      - 普通修士的洞府

    奖励: 修炼进度+3-10
      获得对应物品
      可能提升某项修真百艺

  中机缘(适合金丹至元婴):
    功法类:
      - 完整的玄阶功法
      - 强大的术法
      - 特殊体质觉醒线索

    宝物类:
      - 三四品法宝
      - 中品灵石若干(10-100枚)
      - 中阶丹药
      - 稀有材料

    传承类:
      - 元婴期修士洞府
      - 某个流派的传承
      - 古老宗门遗迹

    奖励: 修炼进度+10-25
      获得对应物品
      可能领悟特殊能力

  大机缘(适合化神至炼虚):
    功法类:
      - 地阶功法
      - 强大神通
      - 体质改善

    宝物类:
      - 五六品法宝
      - 上品灵石若干(10-100枚)
      - 高阶丹药
      - 天材地宝

    传承类:
      - 化神期大能洞府
      - 失传的宗门传承
      - 远古修士的感悟

    奖励: 修炼进度+25-50
      获得对应物品
      可能引起体质蜕变

  顶级机缘(适合合体期及以上):
    功法类:
      - 天阶功法
      - 失传的绝学
      - 法则感悟

    宝物类:
      - 七品以上法宝
      - 大量上品灵石
      - 仙丹线索
      - 逆天材料

    传承类:
      - 合体/大乘期大能传承
      - 远古宗门核心
      - 天地奇物

    奖励: 修炼进度+50-100
      获得对应物品
      可能突破瓶颈

    代价: 必须面对极大风险
      可能引来强敌觊觎
      需要足够实力守护

机缘触发场景:
  探索类:
    - 误入隐秘山谷
    - 发现古老洞府
    - 探索无人区域
    - 深入禁地

  战斗类:
    - 击败强敌后搜刮
    - 妖兽巢穴中发现
    - 战场遗迹

  奇遇类:
    - 偶遇隐世高人
    - 天降异象
    - 特殊天象下的发现
    - 梦境启示

  因果类:
    - 帮助他人的回报
    - 先祖庇佑
    - 前世因果
    - 善举感召

机缘的代价与风险:
  无代价机缘(小机缘):
    - 运气好捡到的低阶物品
    - 路边发现的普通材料
    - 前辈好心赠予

  低代价机缘(中机缘):
    - 需要解决简单考验
    - 击败守护妖兽
    - 破解简单阵法
    - 消耗一定时间精力

  中代价机缘(大机缘):
    - 面对危险守护者
    - 承受试炼考验
    - 消耗大量资源
    - 可能受伤

  高代价机缘(顶级机缘):
    - 生死考验
    - 引来强敌觊觎
    - 需要放弃某些东西
    - 可能留下隐患

特殊机缘类型:
  传承机缘:
    触发: 进入前辈洞府/遗迹
    内容: 功法、法宝、修炼感悟
    考验: 考验悟性、心性、实力
    注意: 传承有适配性，不适合强行接受

  体质觉醒:
    触发: 特殊契机下觉醒隐藏体质
    效果: 修炼速度提升/特殊能力
    条件: 需要符合体质觉醒条件
    注意: 不能凭空赋予逆天体质

  功法机缘:
    触发: 获得古老功法/秘籍
    内容: 比当前功法更强的修炼法门
    考验: 需要足够悟性修炼
    注意: 更换功法需要时间适应

  宝物机缘:
    触发: 发现隐藏宝物
    内容: 法宝、丹药、材料等
    风险: 可能有守护/诅咒
    注意: 宝物等级要合理

  高人指点:
    触发: 偶遇隐世高人
    内容: 修炼指点、解惑、传授经验
    效果: 修炼进度提升、突破瓶颈
    注意: 高人不会无缘无故倾囊相授

机缘频率限制:
  小机缘: 每月可能遇到1-2次
  中机缘: 每年可能遇到1-2次
  大机缘: 数年难遇一次
  顶级机缘: 数十年甚至百年难遇

  注意: 短期内连续获得多个大机缘不合理

境界限制_绝对规则:
  炼气筑基: 只能获得对应境界的机缘，获得高阶宝物也无法使用
  金丹元婴: 可能遇到化神期传承，但接受有难度
  化神炼虚: 可能遇到合体期传承
  合体以上: 可能遇到真仙传承，但极为罕见

因果规律:
  善因善果:
    - 行善积德可能获得善报
    - 救人一命可能获得回报
    - 帮助他人可能获得感谢

  恶因恶果:
    - 作恶多端难有好机缘
    - 强取豪夺可能留下祸根
    - 杀戮过重可能心魔缠身

  因果平衡:
    - 大机缘往往伴随大危机
    - 获得越多，责任越大
    - 破坏规则会有代价

AI生成要点:
  机缘描写:
    - 发现机缘的过程
    - 环境氛围营造
    - 宝物/传承的具体描述
    - 考验/风险的设置

  合理性判断:
    - 机缘等级是否匹配境界
    - 是否有合理的触发原因
    - 代价/风险是否对等
    - 是否会破坏平衡

  后续影响:
    - 机缘对修炼的帮助
    - 可能引发的后续事件
    - 其他人的反应
    - 是否留下隐患

常见机缘场景示例:
  洞府探索:
    发现: 在荒山中发现隐蔽洞府入口
    考验: 破解阵法/击败守护傀儡
    收获: 前辈遗留的功法、丹药、法宝
    风险: 洞府可能有陷阱/禁制

  高人指点:
    遭遇: 修炼遇到瓶颈，巧遇高人
    过程: 高人考验后给予指点
    收获: 修炼进度大增，突破瓶颈
    后续: 高人可能留下线索/任务

  天材地宝:
    发现: 在特殊地点发现天材地宝
    竞争: 可能有他人/妖兽争夺
    收获: 获得宝物提升修为
    风险: 引来觊觎，需要实力守护

  传承试炼:
    触发: 进入传承之地
    试炼: 心性/实力/悟性考验
    成功: 获得完整传承
    失败: 可能受伤/空手而归

注意事项:
  - 机缘不是开挂，要符合逻辑
  - 境界限制是硬性的
  - 大机缘必有大风险
  - 机缘频率要合理控制
  - 不能让用户轻易获得破格机缘
  - 机缘质量与用户付出成正比
  - 考虑其他NPC的反应
  - 守护宝物要有足够实力
