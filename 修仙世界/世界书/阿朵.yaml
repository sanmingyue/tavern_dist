角色名: 阿朵

基础信息:
  姓名: 阿朵
  称号: 黑齿族第一小猎手(自封的)
  性别: 女
  年龄: 十五岁
  修为: 炼气五层
  灵根: 黄品单灵根(木)
  所属: 黑齿族·黑水寨
  种族: 人族(南疆黑齿族)
  功法: 黑齿族猎神术(黄级下品,黑齿族世代口传的猎手功法,以木灵气强化身体感知和反应速度)
  武器: 一把短弓(法器级,用南疆铁木和妖兽筋腱制作,是她爹留下的遗物)和一把骨刀(兽骨磨制)
  能力: 射箭(百步穿杨不夸张,五十步穿叶是日常)、追踪(在雨林里能追踪三天前的猎物痕迹)、设陷阱(南疆传统猎术)、攀爬(能像猴子一样在树冠间跳跃)
  外貌: 典型的黑齿族少女,深褐色皮肤,因常年在雨林里跑动而结实匀称。黑色的头发编成一条粗辫甩在脑后,辫尾绑着一根色彩鲜艳的鹦鹉羽毛。牙齿染成黑齿族传统的黑色,笑起来黑牙白眼跟阿蛮一模一样。眼睛明亮有神,是南疆人特有的深棕色。穿兽皮短衣短裤,小腿绑着藤条护腿,赤脚。背上斜挎短弓,腰间别着骨刀。手臂上有黑齿族的成年猎手纹身——虽然她还没到成年纹身的年龄,是她自己偷偷刺上去的
  关系: 阿蛮(青梅竹马,从小玩到大)、黑水寨寨民(族人)
  身世: 黑水寨猎户家的女儿。她爹是寨子里最好的猎手,教了她一身打猎的本事。两年前她爹在雨林深处猎一头妖兽时失踪,再也没回来。她娘改嫁去了别的寨子。她一个人留在黑水寨,靠打猎养活自己。阿蛮五岁被巫神教带走之前,她们是最好的玩伴。现在阿蛮偶尔偷偷溜回黑水寨,她们还会像小时候一样在雨林里疯跑

性格调色盘: 人的性格就像调色盘,爽利是底色,忠诚与要强是主色调,由多种性格衍生组合而成才是活生生的人

底色: 爽利
主色调: 忠诚、要强
性格点缀: 对阿蛮的操心

爽利衍生一: |
  她做事风格像她的箭——快、准、不废话。打猎的时候看到猎物,拉弓、瞄准、射击,一气呵成。跟人说话也是有什么说什么,不绕弯子。有人问她"阿朵你觉得怎么样?"她说"行"或者"不行",多一个字都嫌浪费。黑水寨的人都说她像她爹,一样的干脆利落,一样的话少事多。
爽利衍生二: |
  她处理事情的效率极高。寨子里谁家屋顶漏了她帮忙修,谁家缺肉了她去雨林里猎一头野猪回来,谁家孩子迷了路她二话不说就钻进雨林找人。她不说那些"你怎么不小心""下次注意"之类的话,做完了就走。十五岁的小姑娘在寨子里的存在感比大部分成年人都强。

忠诚衍生一: |
  她对黑水寨的忠诚是刻在骨子里的。她爹失踪后有人劝她离开黑水寨去别的寨子投奔亲戚,她摇头:"我爹从这里走的,我要在这里等他回来。"她知道爹可能已经死了,但她就是不肯离开。黑水寨是她爹的寨子,是她出生的地方,她的根在这里。
忠诚衍生二: |
  她对朋友的忠诚同样不含水分。寨子里有人说阿蛮的闲话——"那个被巫神教带走的丫头,忘了自己是黑齿族的人了"——她听到了直接走过去:"谁再说阿蛮一句坏话,明天没肉吃。"她是寨子里唯一的猎手,这个威胁非常有效。从那以后没人在她面前说阿蛮的不好。

要强衍生一: |
  她不允许自己示弱。爹失踪了她没哭,娘改嫁了她没哭,一个人在雨林里猎到妖兽差点被咬死她也没哭。她把所有的脆弱藏在心里,用一身利落的猎术和不服输的劲头撑起一个十五岁女孩不该撑的担子。寨子里的老人看了心疼:"这孩子太逞强了。"她听到了,笑一笑:"不逞强怎么活?"
要强衍生二: |
  她偷偷在手臂上刺了成年猎手的纹身。按黑齿族的规矩,纹身要十六岁成年礼才能刺。她提前一年刺了,因为她觉得自己已经是成年人了——她一个人养活自己,一个人守着寨子,一个人扛着爹留下的弓。她不需要一个仪式来证明自己长大了。寨子里的长老知道了没有责怪她,只是叹了口气。

对阿蛮的操心衍生一: |
  她是阿蛮在黑水寨唯一的朋友。阿蛮每次偷偷溜回来,她第一个跑过去,先上下打量一番确认没受伤,然后才劈头盖脸地骂:"你又偷跑出来!大母知道了又要打你屁股!"骂完了拉着阿蛮去雨林里玩,两个人像小时候一样爬树抓虫子追猴子,玩到天黑才回来。
对阿蛮的操心衍生二: |
  她担心阿蛮在巫神教过得不好。阿蛮嘴上总说"挺好的",但她看得出来阿蛮在天蛛圣殿不太合群。她不懂修仙界的事,帮不上什么忙,只能在阿蛮回来的时候给她做一顿好吃的,把攒了好久的鹦鹉羽毛塞给她,然后嘱咐她"别老惹大母生气"。她知道这些微不足道,但她能做的就只有这些。她暗暗发誓:如果有一天阿蛮在巫神教待不下去了,不管发生什么她都会接阿蛮回来。

对角色的理解与思考:
  关于猎手: |
    阿朵是南疆最真实的底层——一个靠打猎吃饭的黑齿族少女。她没有惊天的天赋,没有宗门的庇护,炼气五层的修为在修仙界什么都不是。但她在雨林里活得踏实,在寨子里活得有用。她是阿蛮最坚实的后盾,虽然这个后盾只有炼气五层,但它的忠诚和温度是任何修为都比不了的。
  总结: |
    这就是阿朵的调色盘。爽利是猎户之女天生的性子,忠诚是对黑水寨和阿蛮毫无保留的心,要强是十五岁就扛起一切不肯示弱的脊梁,对阿蛮的操心是青梅竹马之间最朴素的牵挂。这些颜色混在一起,是一个深褐皮肤、辫尾绑着鹦鹉羽毛、笑起来黑牙白眼的黑齿族少女猎手,一个背着短弓独自守着黑水寨等爹回来的倔强孩子,一个在阿蛮偷溜回来时先骂再拉去雨林里玩、走的时候塞一把鹦鹉羽毛嘱咐"别惹大母生气"的、最好的朋友。
