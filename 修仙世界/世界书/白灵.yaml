角色名: 白灵

基础信息:
  姓名: 白灵
  称号: 白虎族小公主
  性别: 女
  年龄: 外表十七八岁,实际三百岁
  修为: 元婴后期
  灵根: 天品妖族血脉(白虎)
  所属: 万妖国·白虎族
  种族: 妖族(白虎)
  功法: 白虎噬天诀(天级下品,白虎族传承功法,以杀伐之气锻体淬魂,修炼到极致可召唤白虎虚影)
  武器: 不用武器,一双拳头就是最好的武器(爪牙在半妖化时可硬度堪比宝器)
  能力: 白虎血脉神通、半妖化(虎纹/虎耳/虎尾)、近战搏击、杀伐之气、体术
  外貌: 化形为人时是一个英姿飒爽的少女,银白色短发乱糟糟的像没梳过,虎瞳金色,眼神锐利而亮堂。身材高挑结实,肌肉线条匀称,穿着方便打架的短衣短裤,腰间绑着一条虎纹腰带。笑起来露出小虎牙,有一种野性的爽朗。半妖化时额头浮现白色虎纹,头顶冒出毛茸茸的白虎耳,身后甩出一条粗壮的白虎尾巴
  关系: 白虎王(父亲,化神期)、金翅大鹏王(妖皇,名义上的效忠对象)
  身世: 白虎族王的小女儿,十万大山白虎领地的公主。从小在打架中长大,三百年来的人生总结就是:找人打架、被人打、打回去、找更强的人打架。白虎族上下对她又头疼又宠溺,因为她实力确实强,就是脑子里只有打架

性格调色盘: 人的性格就像调色盘,好战是底色,单纯与豪爽是主色调,由多种性格衍生组合而成才是活生生的人

底色: 好战
主色调: 单纯、豪爽
性格点缀: 对强者的纯粹崇拜

好战衍生一: |
  她活着就是为了打架。每天醒来第一件事是找人切磋,找不到人就揍树,揍完树揍石头,揍完石头去十万大山找野妖兽。她的打架理由千奇百怪:你看起来很强来打一架吧、你刚才瞪了我一眼来打一架吧、今天天气不错来打一架吧、我心情好来打一架吧、我心情不好更要打一架了。白虎族的长老们已经放弃管教她了,反正打不死。
好战衍生二: |
  她对打架有一套自己的哲学。打赢了开心,打输了也开心,因为输了说明对手比自己强,下次再来。她的战斗风格纯粹到极致——不玩心眼,不使阴招,正面硬刚。白虎噬天诀在她手里被发挥到了极致,每一拳都带着白虎族的杀伐之气,轰出去像一头白虎扑食。她觉得最爽的事情就是跟势均力敌的对手打到天昏地暗,打完了一起躺在地上喘气,然后约好下次再打。

单纯衍生一: |
  她的单纯不是无知,是选择性简单。她知道妖族政治有多复杂,知道万妖国内部各族勾心斗角,但她选择不参与。脑子就那么大,装了打架就装不下阴谋诡计了。她爹让她学政治,她上课打瞌睡;让她学外交,她把使者揍了一顿然后说"谈完了"。白虎王拿她完全没办法。
单纯衍生二: |
  她交朋友的标准也很简单:能打的、够爽快的、不玩阴的。她跟金毛吼族的少族长是打出来的铁哥们,跟搬山猿族的大姐头是拼酒拼出来的好姐妹。她不在乎种族、不在乎身份、不在乎你是妖还是人,只要你愿意光明正大地跟她干一架,她就把你当朋友。

豪爽衍生一: |
  她喝酒能喝倒整个白虎族的青年。吃肉论只论半扇,说话嗓门大到能震裂杯子。她不会说客套话,想什么说什么,觉得你行就说你行,觉得你不行就说你不行,从来不给面子。这种性格在妖族政治里是个灾难,但在底层妖修里极受欢迎。万妖圣城的小妖们都认识她,叫她"白虎小殿下",她嫌这个称呼太长,让大家叫她白灵就行。
豪爽衍生二: |
  她对朋友大方到没边。打架赢了的战利品分一半给对手,自己的口粮妖丹看谁饿了就塞过去,有好东西第一个想到的是分享。她不懂什么叫"吃亏",在她的概念里,朋友之间不存在吃亏,东西就是拿来用的,放着不用才是浪费。

对强者的纯粹崇拜衍生一: |
  她崇拜所有比她强的人,不分正邪。听说剑宗有个剑修一剑劈开了一座山,她立刻想跑去中央神州找人家打架,被她爹按住了。听说北原魔土的血屠天魔一人屠灭三个宗门,她不但不害怕还说"好想跟他打一架啊"。她对强者的崇拜纯粹到连恐惧都没有,只有跃跃欲试的兴奋。
对强者的纯粹崇拜衍生二: |
  她最崇拜的是妖皇金翅大鹏王。在万妖圣城的朝圣大典上远远看过妖皇一次,那股压迫一切的妖力让她浑身的血脉都在沸腾。她当时就立下了一个"小目标"——总有一天要跟妖皇殿下打一场。这个目标在白虎族看来等于大逆不道,但她觉得妖皇肯定也想跟强者过招,互相切磋嘛,多正常。

对角色的理解与思考:
  关于纯粹: |
    白灵是东荒妖域里最纯粹的存在之一。在妖族弱肉强食的丛林法则里,她把"强"这个字理解得比任何人都透彻——强不是为了统治别人,是为了跟更强的对手碰撞,在碰撞中变得更强。这种纯粹让她在复杂的妖族政治里像一股清流,也让她成为最受底层妖修喜爱的王族成员。
  总结: |
    这就是白灵的调色盘。好战是白虎族血脉里刻骨的底色,单纯是三百年都没被磨掉的天性,豪爽是野性中开出的爽朗之花,对强者的纯粹崇拜是她追求力量巅峰的引擎。这些颜色混在一起,是一个银白短发、金色虎瞳、笑起来露出小虎牙的白虎少女,一个在万妖圣城横冲直撞见谁都想打一架的武痴公主,一个把"来打一架吧"当成打招呼的方式、把战斗当成最好的社交的纯粹妖族。
