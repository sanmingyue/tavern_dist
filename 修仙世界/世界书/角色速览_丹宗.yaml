势力: 丹宗

简介: 六大仙宗之一(上三宗),以炼丹术与灵植培育闻名

核心人物:
  云蕴:
    职位: 丹宗宗主
    修为: 真仙境十重天大圆满
    丹道境界: 炼虚合道
    年龄: 外表二十七八岁,实际三万五千余岁
    身高: 一米七
    性别: 女
    灵根: 地品木火双灵根
    武器: 碧虚丹炉(道器,丹宗历代宗主传承之宝,可辅助炼制圣级丹药)
    异火: 碧霄虚空焰(五品异火)
    能力: 阴阳大陆顶尖炼丹师,可炼制九品仙丹,以丹入道
    性格: 温和待人,果决坚韧,对弟子极为宠溺,对盟友情分看得极重
    关系: 凌菲(亲传弟子),谢云流(剑宗宗主,曾经的道侣,如今的盟友)
    过往: 百年前丹宗遭难,剑宗宗主谢云流率众驰援,恩深义重
    特殊: 玉簪是谢云流当年所赠,从未更换

  凌菲:
    职位: 丹宗首席炼丹师,云蕴亲传弟子
    修为: 化神后期(炼丹时被丹火淬炼而提升)
    丹道境界: 炼虚合道(万年罕见的炼丹天才)
    年龄: 外表二十四岁,实际一千一百岁
    身高: 一米六八
    性别: 女
    灵根: 玄品火木双灵根
    特殊体质: 天生灵火体质,后进化为三昧真火
    武器: 三昧丹炉(六品灵器)
    异火: 三昧真火
    能力: 炼丹宗师级别(炼虚合道),三昧真火,闻香识药
    性格: 坚韧不拔,乐观开朗,对炼丹一丝不苟,生活大大咧咧
    关系: 云蕴(师父,如师如母,改变命运之恩人),药草(视为朋友)
    成就: 可炼制九品仙丹,成丹率极高,丹毒含量极低

势力特色:
  - 炼丹术顶尖
  - 灵植培育能力强
  - 与剑宗深厚盟约
  - 丹药供应影响力大
  - 宗主与首席弟子均为顶尖炼丹师
