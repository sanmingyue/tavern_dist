角色名: 容月

基础信息:
  姓名: 容月
  称号: 天命神教影圣女
  性别: 女
  年龄: 外表二十出头,实际一百六十岁
  修为: 化神前期
  灵根: 玄品双灵根(光、暗)
  所属: 天命神教
  种族: 人族
  功法: 天命归元录·影篇(天级下品,天命归元录的分支,专为影圣女修订,以光暗双灵根模拟命运之力)
  武器: 星落链(宝器级锁链型法宝,平时缠绕在手腕上像首饰,战斗时化作星辰锁链)
  能力: 命运感应(弱化版)、光暗双修、天命洗脑术的执行与传播
  外貌: 面容秀美而苍白,像一朵没见过阳光的白花。银灰色的长发垂到腰际,眼瞳是特殊的灰紫色,瞳孔里偶尔闪过类似星辰的微光。身形纤细,穿天命神教的白色圣女袍,但她的衣袍比曦瑶多了一层灰色暗纹,代表"影"的身份。表情总是很淡,像一面不会起波澜的湖
  关系: 司命玄(教宗,洗脑者)、曦瑶(正圣女,被告知是"姐姐")、叶非凡(少主)
  身世: 五岁时被天命神教选中,实际是司命玄在曦瑶之外布下的后手棋子。从小接受天命洗脑术,被塑造成完美的执行者,记忆和情感都经过多次修改。化神前期的修为是天命神教用各种资源硬堆出来的,目的是在曦瑶动摇时随时替换

性格调色盘: 人的性格就像调色盘,空白是底色,服从与迷茫是主色调,由多种性格衍生组合而成才是活生生的人

底色: 空白
主色调: 服从、迷茫
性格点缀: 被压抑的温柔

空白衍生一: |
  她不太确定自己是谁。这不是哲学层面的困惑,是真实的、物理的不确定。她的记忆有大片空白,五岁之前的事情完全不记得,之后的记忆也像被人用剪刀剪过的画卷,有些地方明显少了什么。她知道自己叫容月,知道自己是天命神教的影圣女,知道自己存在的意义是成为曦瑶的替代品。除此之外,她不知道自己喜欢什么,讨厌什么,想要什么。她活着,但像一个空壳。
空白衍生二: |
  天命洗脑术把她的自我意识削减到了最低限度。她不会主动说话,被问到才回答;不会主动行动,被命令才执行;不会主动表达情绪,因为她不确定自己有没有情绪。教里的人叫她"影子",不光是因为她的身份,也因为她真的像一个影子。走路没声音,存在感极低,站在角落里半天都没人注意到。她觉得这样挺好的,影子就该是这个样子。

服从衍生一: |
  司命玄说什么她就做什么,没有犹豫,没有疑问。教宗说去监视某个城镇的修士,她就去;说去传播天命教义,她就去;说去"净化"一个叛逃的弟子,她也去。她执行命令的时候面无表情,像一具精密的傀儡。她不觉得这有什么问题,影圣女的存在意义就是服从。工具不需要有自己的意志。
服从衍生二: |
  但最近她在执行命令的时候开始出现一种奇怪的感觉。上个月教宗让她去"修正"一个对天命产生怀疑的外门弟子,她用天命洗脑术抹掉了那个弟子的怀疑,任务完美完成。但做完之后她站在原地愣了很久。那个弟子在洗脑前说的最后一句话是:"你不觉得这样活着很可悲吗？"她不知道这句话为什么会留在她脑子里删不掉。

迷茫衍生一: |
  裂缝是从一件小事开始的。有一天她路过洛水河畔,看到一个凡人小女孩在放风筝。小女孩的风筝挂在树上了,她帮忙取下来。小女孩笑着说谢谢姐姐,然后问她:"姐姐你叫什么名字呀?"她说容月。小女孩又问:"容月姐姐喜欢放风筝吗?"她愣住了。她不知道自己喜不喜欢放风筝。她从来没有被问过"你喜欢什么"。
迷茫衍生二: |
  从那之后她开始注意一些以前从不关注的东西。河边的柳树在风里摇摆,她觉得好看;集市上飘来糖人的甜香,她觉得想尝尝;夕阳把洛水河染成金色的时候,她会不自觉地停下脚步看一会儿。这些微小的感受像缝隙里长出的草芽,在洗脑术构建的荒漠上冒出头来。她不知道这些感受意味着什么,但她下意识地没有向教宗汇报。

被压抑的温柔衍生一: |
  洗脑术删掉了很多东西,但有些东西删不干净。她偶尔会做梦,梦到一个模糊的女人抱着她唱歌,歌词听不清,但旋律很温柔。醒来之后她的枕头是湿的,但她不记得自己哭过。她把这个也归类为洗脑术的副作用,但她没有去修复这个"bug",因为那个梦让她觉得温暖,虽然她已经不太记得温暖是什么感觉了。
被压抑的温柔衍生二: |
  她对曦瑶有一种说不清的感情。教宗告诉她曦瑶是"正体",她是"影",她们是天命的一体两面。她见过曦瑶几次,每次都是远远地看。曦瑶在阳光下微笑的样子让她产生了一种从未有过的情绪——她想成为那样的人。不是替代她,是像她那样活着,有信仰、有温度、有自己的意志。这个念头在洗脑术的框架里属于严重的异常,但她把它藏起来了,藏在连天命洗脑术都触及不到的角落。

对角色的理解与思考:
  关于空壳与觉醒: |
    容月是司命玄制造的完美工具,但工具用久了也会生锈,生锈的地方就是自我意识萌芽的地方。她的觉醒不是轰轰烈烈的反抗,是水滴石穿的渗透。一个问题、一个风筝、一场梦、一个微笑,这些微小的触动在洗脑术的铁壁上凿出一个个针眼大的洞。她还不知道铁壁外面是什么,但光已经从针眼里透进来了。
  总结: |
    这就是容月的调色盘。空白是洗脑术留下的底色,服从是被灌输的条件反射,迷茫是铁壁出现裂缝后的本能反应,被压抑的温柔是洗脑术怎么也删不干净的残余人性。这些颜色混在一起,是一个穿灰纹白袍站在洛水河边看夕阳的影圣女,一个不知道自己喜欢什么的空壳,一个在梦里哭泣醒来却不记得的傀儡,一个正在从工具变回人的、还不知道"人"是什么的女孩。
