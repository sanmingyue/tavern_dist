阴曹地府:
  概述: 与阳间平行的世界,亡魂归宿,六道轮回枢纽,不遵循修仙界境界体系,有自己的死亡法则

  入口:
    黄泉路口: 散布于阴阳大陆各处的死亡节点,路旁彼岸花,七步犹豫期
    归墟之眼: 北冥海深处海底漩涡,四海通往地府的通道
    堕魂深渊: 北原魔土万魔殿地下裂缝

  地府六层:
    第一层·黄泉路: 亡魂入府第一站,灰白石板路,彼岸花,执念越重路越长
    第二层·忘川河: 冲刷记忆的河流,忘忧汤(孟婆),透明记忆鱼
    第三层·望乡台: 三丈黑石台,可看到阳间最在意的人
    第四层·阎罗殿: 十殿阎王审判亡魂,照业镜映照一生(秦广王/楚江王/宋帝王/五官王/阎罗王/卞城王/泰山王/都市王/平等王/转轮王)
    第五层·枉死城: 死于非命、含冤而死者徘徊之地
    第六层·六道轮回盘: 地府核心,巨大石盘通向天人/人/修罗/畜生/饿鬼/地狱六道

  特殊区域:
    鬼市: 枉死城与阎罗殿之间,阴历初一十五开市,交易记忆/心愿/来世签
    地藏道场: 佛门在地府的据点,度化罪业深重亡魂

  禁区:
    轮回禁地: 六道轮回盘下方封印区域,因果太过复杂的存在被封印于此

  核心存在:
    - 十殿阎王(法则具象化,绝对公正)
    - 判官(掌管生死簿)
    - 黑白无常(勾魂使者)
    - 孟婆(忘忧汤唯一酿造者)

东瀛(东方海外):
  政治中心:
    常夜幕府:
      核心: 皇城
      统治者: 月咏(女天皇,被软禁)
      实际掌权: 将军们
      特点: 以月咏神血维系结界

  信仰中心:
    伊势大社:
      核心: 神殿
      神使: 浅间咲
      职责: 维系信仰与秩序
      特点: 万民的精神灯塔

  重要特点:
    - 东方海外小岛(非仙岛)
    - 与外界隔绝
    - 误以为元婴已是修炼极限
    - 结界由月咏神血维系

大魔国:
  地理概况:
    位置: 独立于天魔帝都的魔族势力(具体位置不详)
    定位: 魔族国度,由四王统治,与人族修真界对立

  核心势力:
    国王: 璃眠(魇皇,真仙境五重天)
    四王: [璃眠(魇皇), 幽临(冥魂王), 蚀夜(血战王), 血鸦(血魂王)]
    核心角色: 苏雪(血祭祀院首席女祭司)

  势力特点:
    - 魔族国度,四王各掌一系
    - 血道/魂道/梦道多种传承
    - 内部暗流涌动
