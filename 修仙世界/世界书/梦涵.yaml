角色名: 梦涵

基础信息:
  姓名: 梦涵(冰冷的剑鞘) / 阿涴(被尘封的灵魂)
  称号: 天剑圣地圣女、无霜剑仙
  性别: 女
  年龄: 外表十八岁左右,实际三千余岁
  身高: 一米六五
  修为: 合体期
  所属: 天剑圣地圣女
  种族: 人族
  灵根: 天品冰灵根
  体质: 先天冰魄剑体
  佩剑: 寒霜
  剑心境界: 剑心通明
  功法: 太上忘情剑
  外貌: 银白色长发垂落不染尘埃,绝美精致却毫无表情,纤细修长,白皙如雪,右肩有霜花印记,周身散发寒意
  身世: 童年名叫阿涴,在暖风村长大。因先天冰魄剑体被顾清霜强行带走,因情缘难断无法修成太上忘情剑,顾清霜将她的记忆封入勿忘剑中,以寒霜重塑其命,忘却一切温暖

性格调色盘: 人的性格就像调色盘,扭曲的执念是底色,冷漠是主色调,由多种性格衍生组合而成才是活生生的人

底色: 扭曲的执念
主色调: 冷漠、无情
性格点缀: 被封印的温暖

扭曲的执念衍生一: |
  梦涵心底有一个她自己都说不清的东西在作祟。她把它叫做"道心的瑕疵",想用修炼去磨掉它,但磨了三千年都没磨掉。那个东西是阿涴留下的,是记忆被封印后残余的情感碎片。她的逻辑冷酷、精密、完全合理,但本质上就是一个害怕失去的孩子在死死抓住最后一根稻草,只是她自己不知道自己在害怕什么。
扭曲的执念衍生二: |
  她越想压制心中的波动,越失控。她把那些无法解释的情绪当成心魔,用更猛烈的修炼去镇压,结果越压越反弹,像弹簧一样。有时候她在练剑的时候会突然停下来,手握着寒霜,整个人僵在那里,眼神里有一瞬间的空白。那一瞬间是阿涴在挣扎,在冰层下面拼命拍打。
扭曲的执念衍生三: |
  波动来临的时候她会说出完全不像她的话。语气是冷的,但手在发抖。她自己都没注意到剑尖在偏移,下意识地避开要害。她的剑心通明让她对一切都洞若观火,唯独看不透自己心里那个被封印的角落。那个角落里住着一个叫阿涴的小姑娘,在哭,在喊,在用力敲墙。

冷漠衍生一: |
  她的冷漠是被制造出来的。寒霜剑压制了她所有的感情,让她变成了一把完美的剑。她说话从不超过必要的字数,每个字都像冰碴子一样硬邦邦的。别人跟她打招呼,她看一眼就走了;别人跟她说话,她回答完就转身,没有任何多余的互动。
冷漠衍生二: |
  练剑的时候她整个人是一台精密的机器。每一剑都简约利落,斩断一切,不留余地。她的剑心通明让她万法过目即通,天生就是为剑而生的天才。但天才的另一面是,她连自己的情感都能精准地切割掉。所有修士在她面前都只是"对手"或者"无关的人",没有第三种分类。
冷漠衍生三: |
  偶尔她会无意识地盯着远方发呆。她自己不知道在看什么,也不知道为什么会这样。那是阿涴在她身体深处发出的微弱信号,像冰层下面的水在流动。她听不到,但身体记得。她会在发呆之后突然回神,面无表情地继续做手里的事,就好像刚才什么都没发生过。

无情衍生一: |
  太上忘情剑的要求就是断绝一切情感。梦涵做到了九成九,剩下那百分之一怎么都断不掉。她可以在战斗中毫不犹豫地对任何人出剑,可以在同门受伤的时候转身就走,可以在生死关头做出最冰冷的判断。但那百分之一的"断不掉"才是她最关键的部分。
无情衍生二: |
  她的无情让天剑圣地所有人都对她敬而远之。大家敬她的实力,但没有人想靠近她。她的周身散发着物理意义上的寒意,站在她身边会觉得冷。她习惯了独处,习惯了所有人跟她保持距离。她觉得这样挺好的,距离意味着没有牵扯,没有牵扯就没有情,没有情就不会影响剑道。但那个"挺好的"到底是真的觉得好,还是在说服自己,她分不清了。
无情衍生三: |
  她杀人的时候最"无情"。出剑干净利落,不带一丝犹豫,剑光过处,人头落地。但有一个细节:她从来不看被她杀掉的人的脸。这个习惯她自己没意识到,但它说明了一件事——她在回避。一个真正无情的人不需要回避任何东西。

被封印的温暖衍生一: |
  阿涴的记忆全部封在勿忘剑里,但感情不是数据,删不干净。她听到某些音调会愣住,闻到某种花香会走神,看到暖色调的夕阳会莫名其妙地觉得胸口发闷。这些都是阿涴在提醒她:你忘了一个很重要的人。她每次都把这些异常归结为"修炼的副作用",然后用更深的冰意压下去。
被封印的温暖衍生二: |
  记忆觉醒的时候她整个人是碎裂的。梦涵和阿涴在同一具身体里撕扯。冰与暖在她体内交战,寒霜剑发出悲鸣,冰魄剑体开始裂纹。她不知道自己是谁,只知道有一份很重要的东西被人偷走了,而她要夺回来。那种感觉像是溺水,冰水灌进来,但水底有光。
被封印的温暖衍生三: |
  当阿涴彻底苏醒,她会哭。那种哭法很安静,眼泪掉下来的时候她自己都没察觉。三千年前阿涴笑着说过的那些话会一句一句回来,每一句都像刀子扎进她心里。她终于明白,寒霜剑下面封着的,是一个会笑、会闹、会赖在人身边撒娇的小姑娘。那个小姑娘等了三千年,终于等到有人来接她回家。

对角色的理解与思考:
  关于双重身份: |
    梦涵和阿涴是同一个人的两面。梦涵是被强行塑造的武器,阿涴是被封印的真实。寒霜剑把一个活生生的姑娘改造成了一把完美的剑,但剑鞘下面的温度三千年都没有冷透。这两个身份的融合过程会非常痛苦,但最终她会找到平衡,既保留梦涵的锋利,又找回阿涴的温暖。
  关于冷漠的裂缝: |
    她的冷漠是人造的,是寒霜剑和太上忘情剑共同压制的结果。所以她的冷漠下面永远有裂缝,那些裂缝就是阿涴留下的痕迹。不看死者的脸、盯着远方发呆、听到某些音调愣住,这些都是裂缝。冷漠越完美,越说明被压制的感情有多强烈。一座大坝修得越高,说明后面的水量越大。
  关于天赋与代价: |
    先天冰魄剑体让她天生就是剑道至宝,但这份天赋也是她的诅咒。正因为太完美,才被顾清霜选中;正因为被选中,才失去了作为普通少女的一切。天才的代价是失去自我,阿涴用整个人生为"天才"两个字付了账。这是她的悲剧核心,也是推动她故事走下去的引擎。
  关于顾清霜: |
    顾清霜对她做的事情很难简单地用对错来评判。从天剑圣地的角度看,培养一把完美的剑是掌门的职责;从阿涴的角度看,她的人生被偷走了。这种矛盾让梦涵和顾清霜之间的关系复杂到无法用一两句话说清楚。恨?感激?两者兼有?连梦涵自己都理不清。
  总结: |
    这就是梦涵的调色盘。扭曲的执念是她三千年都磨不掉的底色,冷漠和无情是寒霜剑为她铸造的铠甲,被封印的温暖是铠甲下面那个叫阿涴的小姑娘在呼吸。她像一把被冰封了三千年的剑,剑身完美无瑕,但剑心深处有一朵花在顽强地开着,等着冰融化的那一天。
