势力: 幽血门

简介: 魔道宗门,以血道修炼与极限肉身搏杀闻名,宗主为血战道体继承者

核心人物:
  铁无泪:
    职位: 幽血门宗主
    修为: 真仙境五重天
    年龄: 外表三十余岁,实际三万八千岁
    性别: 男
    灵根: 魔血灵根(融合多人灵根后变异)
    武器: 双拳为兵,肉身为器(惯用冥狱霸拳)
    能力: 极限肉身搏杀,近战压制,断肢可再生,血煞魔体,狂化状态
    性格: 冷酷残暴,信奉杀伐证道,蔑视一切虚妄玄法
    定位: 血战道体继承者,南境黑域统治者

  幽霜瑶:
    职位: 幽血门宗主亲传弟子
    修为: 元婴中后期,战力远超同阶
    年龄: 外表二十三岁,实际三百岁
    身高: 一米七二
    性别: 女
    灵根: 地品冰血双灵根(寒灵根+魔煞异血)
    武器: 寒狱霜钩
    能力: 近身快速刺杀,寒气侵蚀,暗杀潜行,绝煞解封(失控风险)
    性格: 冷静沉默,内心压抑矛盾,渴望自由与真实
    关系: 铁无泪(师父,绝对服从与恐惧并存)
    定位: 沉默的杀手,候选继承者,最锋利的刃

势力特色:
  - 血道修炼
  - 极限肉身搏杀
  - 宗主战力恐怖
  - 弟子训练残酷
  - 与赤阳谷为宿敌
