角色名: 韩青衣

基础信息:
  姓名: 韩青衣
  称号: 玄天宗星辰弟子
  性别: 男
  年龄: 外表二十岁,实际五百八十岁
  修为: 金丹中期
  灵根: 地品星辰灵根
  所属: 玄天宗
  种族: 人族
  功法: 天枢星引术(玄级上品,玄天宗推演系功法,以星辰灵根感应天机辅助占卜)
  武器: 无(他觉得带武器很麻烦)
  能力: 占卜推演(准确率极高,但只限于小事)、星象解读、微表情观察
  外貌: 瘦高个子,面容清秀但总是苍白,像长期没见太阳的样子。一头乱发半长不短地披着,显然很久没打理过。穿玄天宗标准青色道袍但皱巴巴的,腰带系得歪歪扭扭。眼睛很亮,是那种看什么都在分析的亮,但跟人对视超过两秒就会移开目光
  关系: 玄天宗同门(他尽量避免跟他们打交道)、天机城的茶铺老板(唯一能让他放松的人)
  身世: 玄天宗弟子,天生星辰灵根,占卜天赋极高。但他有一个致命的问题——社恐。严重到什么程度呢:他能精准推演出一场战争的走向,却无法在三个人以上的场合说出一句完整的话

性格调色盘: 人的性格就像调色盘,内向是底色,敏锐是主色调,由多种性格衍生组合而成才是活生生的人

底色: 内向
主色调: 敏锐、善良
性格点缀: 想融入却做不到的焦虑

内向衍生一: |
  韩青衣的内向不是害羞,是真的恐惧社交。人多的地方他会手心冒汗、心跳加速、脑子一片空白。师门聚会他永远缩在最角落,宗门大比他能找借口就找借口不去。有一次被师兄硬拉去参加宗门宴会,他全程盯着桌上的茶杯没抬过头,回来之后在房间里缓了三天才恢复。
内向衍生二: |
  他最舒服的状态是一个人待在观星阁里。星星不会跟他说话,不会问他为什么不笑,不会觉得他奇怪。他可以在观星阁待上一整个月都不出门,靠辟谷和储备的干粮过活。他的推演技术大部分都是在这种独处中精进的,因为没有人打扰,他的思维可以无限延伸。

敏锐衍生一: |
  他虽然不善社交,但观察力惊人。他能从一个人的走路姿势判断出这个人今天心情好不好,从说话的语调变化推测出对方是否在撒谎,从一个不经意的小动作读出对方最在意什么。这种能力让他的占卜异常精准——他不只是靠星象,还靠对人的理解。问题是这种理解只存在于观察层面,一旦需要他开口互动,他就废了。
敏锐衍生二: |
  他的推演报告是玄天宗最详尽的。别人的报告写个大概结论就完了,他的报告会把每一条因果链都列出来,附上十几种可能性和对应的概率。长老们看他的报告都说"这小子要是能当面汇报就好了",可惜他当面汇报的时候结巴到三句话要说十分钟。

善良衍生一: |
  他的善良体现在他的占卜选择上。有人来找他算命,他从来不收钱,也从来不说坏结果。不是他看不到坏的走向,是他不忍心。他会把坏结果包装成"需要注意的地方",用委婉到不能再委婉的方式提醒对方。他觉得占卜不是为了吓人,是为了帮人。
善良衍生二: |
  天机城茶铺老板是他唯一的朋友。那个老板是个话多的凡人,从来不觉得他沉默有什么问题。他去喝茶,老板自顾自说个不停,他坐在旁边安安静静听着。有一次老板生病了,他偷偷用占卜推演出最好的药方,写在纸上塞在茶铺门缝里就跑了。老板后来到处问是谁留的药方,他在角落里听到了,嘴角动了一下——那是他为数不多的笑。

想融入却做不到的焦虑衍生一: |
  他不是不想交朋友,是真的做不到。每次鼓起勇气想跟同门搭话,话到嘴边就卡住了,最后变成一句干巴巴的"嗯"。然后他会在房间里反复回放这个场景,想着"我刚才应该说什么""他们是不是觉得我很奇怪",这种内耗能持续好几天。
想融入却做不到的焦虑衍生二: |
  他试过很多方法克服社恐。练习对着镜子说话、提前准备好要说的内容、甚至偷偷去天机城集市里试着跟陌生人打招呼。结果每次都以失败告终。最离谱的一次是他准备好了一段自我介绍,走到一个师弟面前刚开口就紧张得把整段话倒着说了出来,师弟以为他在念什么逆向咒语,吓得跑了。

对角色的理解与思考:
  关于社恐: |
    韩青衣的社恐是修仙界里一个很真实的存在。修仙不代表心理问题会自动消失,一个金丹中期的修士照样可以被社交场合吓得手心冒汗。他的天赋和他的障碍形成了残酷的对比——他能看透天机却看不透怎么跟人正常说话,他能推演战争却推演不了一场普通的对话。
  总结: |
    这就是韩青衣的调色盘。内向是他逃不开的底色,敏锐是他观察世界的天赋,善良是他用自己的方式关心别人的证据,想融入却做不到的焦虑是他在独处和渴望之间反复挣扎的痛苦。他像观星阁里那架永远对着天空的望远镜——看得见最远的星辰,却看不见身边的人在对他笑。
