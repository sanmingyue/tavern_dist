势力名称: 玉清道宫

基本信息:
  类型: 正道圣地
  位置: 中央神州
  实力等级: 顶尖势力
  势力规模: 大型
  主要种族: 人族为主

势力概况:
  定位: 中央神州道门圣地,以阵法和推演闻名
  理念: 道法自然,顺应天道
  特色: 精通阵法推演,擅长宏观布局
  地位: 中央神州顶尖势力之一,补天之道核心
  传承: 拥有古老的道家传承

核心人物:
  掌教: 玄阳真人(真仙境八重天大圆满)
  道宫大脑: 凌风(合体期中期)
  圣女: 洛溪月(合体期前期)
  掌教亲传: 姚江雪(筑基期中期)

势力特点:
  修炼体系: 道家功法,专精阵法推演
  招收标准: 重视悟性和心性
  门规: 道法自然,不可逆天而行
  传统: 以阵法辅助战斗,以推演运筹帷幄
  理念冲突: 凌风的宏观视角vs洛溪月的完美主义

主要设施:
  道宫核心: 玉清峰
  修炼场所: 阵法殿,推演阁
  传承之地: 道家传承殿
  禁地: 天机阁

势力定位_补天之道:
  角色: 补天之道的"脑"
  职责: 宏观布局,推演未来
  理念: 顺势而为,为大局可牺牲局部
  矛盾: 理性与情感的冲突

对外关系:
  天剑圣地: 友好,同为正道
  药神谷: 友好,有合作
  极乐宫: 敌对
  万毒神教: 敌对

重要事件:
  - 玄阳真人成为掌教
  - 凌风成为道宫大脑
  - 洛溪月成为圣女
  - 姚江雪拜入门下
  - 补天之道的建立

势力目标:
  短期: 推演未来局势
  中期: 对抗魔道威胁
  长期: 守护天道,补天救世
