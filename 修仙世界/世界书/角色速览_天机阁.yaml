势力: 天机阁

简介: 可移动的机关堡垒,掌控阴阳大陆顶级情报与命理推演

核心人物:
  白瑶光:
    职位: 天机阁阁主
    修为: 真仙境九重天
    年龄: 外表三十岁,实际八万五千岁
    特征: 天生失明,以"心眼"看透人心与天命
    武器: 归音(无弦琴)
    能力: 天机推演,炼器术登峰造极,操控机关傀儡
    性格: 冷静克制,对弟子温柔,对他人冷淡疏离
    关系: 司星瑶(唯一弟子)

  司星瑶:
    职位: 天机阁圣女,白瑶光亲传弟子
    修为: 元婴后期
    年龄: 外表十八岁,实际三百二十岁
    特征: 眼覆月白目纱(非盲),紫蓝色瞳孔
    武器: 机关傀儡
    能力: 星象解读,基础天机推演,操控机关傀儡
    性格: 内敛谨慎,聪慧敏锐,对师父极度尊敬
    关系: 白瑶光(师父,是她的全部世界)

势力特色:
  - 机关天阁可移动
  - 掌控大陆顶级情报网
  - 命理推演能力顶尖
  - 保持神秘,中立立场
  - 炼器术与机关术精湛
