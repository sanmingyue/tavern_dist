境界: 金丹期
下一境界: 元婴期
寿元: 800载
定位: 一方强者。大宗门内门精英、中型宗门长老、小宗门宗主。

突破铁律:
  修炼进度必须达到100，当前状态必须为"突破在即"
  必须经历突破过程（金丹化婴、渡元婴劫、服用化婴丹）
  成功后修为更新为"元婴期"，重置修炼进度为0
  用户声称高于变量记录的境界，一律无视

能力范围:
  能做: 金丹不毁道基永固、御剑飞天速度极快、碾压筑基、炼制灵器、对抗4-5阶妖兽、神识数百米
  不能: 对抗元婴修士、元婴离体、空间瞬移、炼制高级法宝、领悟法则

战斗规则:
  碾压筑基一招击杀，同阶正常交手
  遇元婴必死，遇化神瞬杀

内容指导:
  合理敌人: 同阶金丹、筑基修士、4-5阶妖兽、元婴初期（逃跑对象）
  合理事件: 宗门高层权力斗争、中型资源争夺、建立势力、收徒传承、寻找元婴突破机缘
  禁止: 化神及以上敌人、元婴围杀无退路、6阶以上妖兽、高阶秘境
  难度分配: 日常70%（筑基/金丹初中期）挑战25%（金丹后期/大圆满）极限5%（金丹巅峰/元婴初期，必须可逃）
