【流金城·拍卖会上的残卷】
触发：{{user}}参加流金城拍卖会时
碎片内容：流金城万宝楼的一次拍卖会上，出现了一卷来历不明的残卷。残卷材质特殊，既不是兽皮也不是纸张，像是用凝固的光制成的。残卷上记载着一段话："……天尊以阳极之力镇压九幽，以自身精血铸就轮回之基。天地为之动容，日月为之失色。自此之后，天地间再无能与天尊比肩者……"残卷到此戛然而止。拍卖师说这是从一处上古遗迹中发掘出来的，但没人能鉴定其年代。最终以极高的价格成交——或者被{{user}}拍下。
引导方向：上古文献中对极阳天尊的直接记载
表达方式：拍卖会的热闹氛围中突然出现的严肃线索

【流金城·醉酒商人的胡话】
触发：{{user}}在流金城酒楼饮酒时
碎片内容：一个喝醉的灵石商人在隔壁桌胡言乱语："你们知道吗……嗝……流金城地下的灵石矿脉为什么这么丰富？因为地底下有个东西一直在往外冒灵气！我爷爷的爷爷说，那不是普通的灵气，是'道韵'！比灵气高级一万倍的东西！流金城就是建在那个东西上面的！什么东西？谁知道啊……嗝……反正暖乎乎的，挖矿的时候越往深处越暖和……"
引导方向：流金城地下的"道韵"源头——极阳天尊力量的地脉残留
表达方式：醉话中的真相，容易被忽略

