苍澜国:
  势力定位: 西域凡人王国，修真势力强大

  核心特色:
    修真王国: 王室本身就是修士
    与万兽山庄共治: 共同管理百兽城
    驭兽传统: 王室成员多修炼驭兽术
    血脉优异: 王室血脉天生灵根优秀

  势力规模:
    国王: 苍澜王
    王室成员: 数百位，多为修士
    贵族: 数千个修仙世家
    凡人百姓: 数十亿（覆盖西域大部分区域）
    修士: 数百万（境内修仙家族、散修）
    附属势力: 苍澜城为首都，统治西域数十座城池

  都城特色:
    苍澜城: 王室居所
    修真氛围浓: 城内修士众多
    灵兽贸易: 国内灵兽交易繁荣

  与外界关系:
    与万兽山庄: 互为依托，关系密切
    与大雍皇朝: 名义上臣服，实则独立，已谈合互不侵犯，但仍有资源竞争
    与妖域: 边境国家，常与妖族交易

  与大雍皇朝关系:
    正道同盟: 两国皆为正道王朝
    名义臣服: 表面臣服大雍，维持正道统一
    实际独立: 拥有完整的军事政治体系
    已谈合: 目前两国和平共处，互不侵犯
    暗地竞争: 资源、灵脉、地盘仍有争夺

  共管城市:
    百兽城: 与万兽山庄共管，灵兽交易中心

  特色:
    王室修真: 不同于大雍的凡人王朝
    驭兽传承: 王室有独特驭兽秘法
    边境堡垒: 守卫西域门户
