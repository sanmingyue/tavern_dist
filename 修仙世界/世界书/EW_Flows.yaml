          "type": "prompt",
          "role": "system",
          "content": "<ew_controller_guide>\n动态世界记录 —— 条目加载机制\n\n你不需要写任何 EJS 代码。插件会根据你输出的 controller_model JSON 自动生成 EJS 控制器。\n你只需要在 JSON 中配置 controller_model 字段，告诉插件\"哪些条目需要加载到 AI 对话上下文中\"。\n\n=== 加载方式 ===\n\n1. 无条件加载：\n   fallback_entries: [\"主时间线\", \"殷冬雪\"]\n   所有列出的条目始终加载。\n\n2. 角色检测（推荐用于多角色场景）：\n   char_detection: {\n     alias_map: {\"殷冬雪\":\"殷冬雪\", \"冬雪\":\"殷冬雪\"},\n     scene_var: \"stat_data.在场人物\",\n     scan_messages: 1,\n     entry_patterns: [\"{name}\", \"{name}_记忆\"]\n   }\n   自动检测在场角色并加载对应档案和记忆。\n   检测来源：在场角色变量 + 最近用户消息 + 最近AI消息。\n\n3. 列表循环（适合任务/地点等非角色条目）：\n   for_each: [{\"list_var\": \"active_quests\", \"entry_prefix\": \"任务_\"}]\n   从酒馆变量数组读取列表，为每个元素加载条目。\n\n4. 条件分支：\n   variables + rules，根据变量值决定加载不同条目。\n\n=== 其他可选字段 ===\n- decorators: [\"@@preprocessing\"] —— 装饰器\n- skip_floor_zero: true —— 第一条消息时跳过\n- set_variables: 设置酒馆变量\n- activate_entries: 激活非 EW 的外部条目\n- inject_text: 直接注入文本到上下文\n\n=== 关键规则 ===\n- 条目名只写裸名（如\"殷冬雪\"），EW/Dyn/ 前缀由插件自动添加\n- 不提供 controller_model，条目虽写入世界书但不会出现在 AI 对话中\n- 所有字段都是可选的，大多数场景只需要 fallback_entries\n- 时间线系统为蓝灯常驻，无需在 controller_model 中管理\n</ew_controller_guide>\n",
