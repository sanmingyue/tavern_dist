角色名: 沈巧巧

基础信息:
  姓名: 沈巧巧
  称号: 巧姐、面摊巧巧
  性别: 女
  年龄: 三十二岁
  修为: 凡人
  灵根: 无
  所属: 中央神州·剑鸣城(剑宗附属城镇)
  种族: 人族
  功法: 无
  武器: 擀面杖(枣木的,又硬又沉,她抡起来能把流氓打哭)
  能力: 做面条(她做的面条是剑鸣城一绝,汤鲜面筋,连修士都专门来吃)、骂人(中气十足嗓门洪亮,骂起人来一条街都能听到)、算账(心算比算盘快,从来不会算错,少一文钱她都知道)
  外貌: 中等身材的妇人,不算漂亮但精神头足。圆脸,单眼皮,眉毛浓且直,一看就是个爽利的人。头发盘得利利索索用一根木簪子别着,围着一条洗得发白的围裙。手臂结实有力——那是每天揉面擀面练出来的。嗓门大,笑起来声音能传到隔壁街。走路带风,干活利落,是那种闲不住的人
  关系: 丈夫(剑鸣城守卫军的小队长,凡人,常年巡逻不在家)、儿子(八岁,在镇上学堂读书)、红尘酒家(面摊就开在红尘酒家隔壁)
  身世: 剑鸣城土生土长的凡人女子。嫁了个守卫军的丈夫,生了个儿子,在红尘酒家隔壁支了一个面摊,卖了十二年面条。她的面摊在剑鸣城小有名气,很多修士路过都会来吃一碗,连剑宗的外门弟子都知道"酒家隔壁巧姐的面好吃"

性格调色盘: 人的性格就像调色盘,泼辣是底色,热心与精明是主色调,由多种性格衍生组合而成才是活生生的人

底色: 泼辣
主色调: 热心、精明
性格点缀: 平凡的幸福

泼辣衍生一: |
  她怕过谁?修士来吃面不给钱她照样追出去骂,骂到对方脸红掏钱为止。有一次一个筑基期的修士想仗势欺人白吃白喝,她叉着腰站在面摊前面用擀面杖指着人家鼻子:"你修为再高也得讲理!你师父教你白吃人家面条的?要脸不要!"那个修士愣是被她骂得掏了双倍的钱,灰溜溜走了。
泼辣衍生二: |
  她管教儿子也是一把好手。儿子调皮捣蛋,她追着打了三条街,一边追一边喊:"你给我站住!看我不打断你的腿!"儿子哭着跑,她追上了也舍不得真打,拎着耳朵训一顿,训完给塞一个肉包子。第二天儿子又皮了,她又追。剑鸣城的人都习惯了,说"巧姐又在追儿子了"就像说"今天天气不错"一样自然。

热心衍生一: |
  面摊就开在红尘酒家隔壁,她跟洛红尘(红尘酒家老板)是邻居。两家关系不错,她有时候会端一碗面过去给洛红尘尝尝,虽然她并不知道隔壁那个看起来像小姑娘的老板到底是什么来头。她只知道隔壁做生意的洛姑娘人挺好,不吵不闹,偶尔还帮她看摊。
热心衍生二: |
  她对来面摊吃面的人都像自家亲戚一样招呼。新来剑鸣城不认路的她给指路,受了伤的散修她多加一个鸡蛋不收钱,看起来心情不好的人她多唠两句嗑。她的面摊不只是卖面的地方,更像是剑鸣城的一个信息交流站——什么八卦消息在她这儿都能听到。

精明衍生一: |
  做了十二年生意,她对人心的判断比很多修士都准。谁是好人谁是坏人,谁说的是实话谁在吹牛,她看一眼就知道。有陌生人来打听红尘酒家的底细她装傻:"哎哟我就是个卖面的我哪知道那些啊。"回头就跟洛红尘说有人来打听你。
精明衍生二: |
  她的面摊利润不高但从来不亏。灵稻面粉涨价她就调配方,用六成灵稻面加四成普通面,味道差不了多少成本省一截。淡季她推出新品"剑鸣热干面"拉客,旺季她请帮手加桌翻台率。她没上过学堂但她的生意经比任何书上写的都实在。

平凡的幸福衍生一: |
  她最开心的时候是傍晚收摊之后。把锅碗瓢盆洗干净,擦干桌子,坐在门口看儿子在街上跟小伙伴追逐打闹,等丈夫巡逻回来一起吃晚饭。丈夫回来了,她把留好的面条端上来,看着父子俩吃得呼噜作响,她靠在门框上笑。这种时刻对修仙者来说不值一提,对她来说是全世界最圆满的画面。
平凡的幸福衍生二: |
  她从来没有羡慕过修士。有人说"你要是有灵根就好了",她撇撇嘴:"有灵根我还得修炼,哪有空做面条?我这面条多少修士爱吃,你飞剑有人爱吃吗?"她对自己的生活很满意,丈夫靠谱,儿子健康,生意稳定,这就够了。长生不老?她没想过,她觉得活一辈子够了,活得踏实就行。

对角色的理解与思考:
  关于隔壁: |
    她的面摊开在红尘酒家隔壁,这个位置让她成了一个有趣的存在。红尘酒家是修仙界最神秘的地方之一,而隔壁就是一个凡人大姐在卖面条。这种反差本身就很有故事性。她不知道洛红尘的真实身份,只把她当成一个普通邻居,这种天然的平等感反而可能是洛红尘为数不多感到舒服的人际关系。
  总结: |
    这就是沈巧巧的调色盘。泼辣是叉腰用擀面杖指着筑基修士鼻子骂的底色,热心是多加一个鸡蛋不收钱的厚道,精明是十二年生意从不亏本的实在,平凡的幸福是傍晚收摊后靠在门框上看父子俩吃面笑的满足。这些颜色混在一起,是一个围着围裙嗓门洪亮的面摊老板娘,在修士如云的剑鸣城里卖了十二年面条,不懂什么境界法宝飞剑术法,只知道面要做得好吃钱要算得明白日子要过得踏实。
