势力: 万兽山庄

简介: 中央神州西部的驭兽宗门,以御兽之术闻名

核心人物:
  北冥玄狩:
    职位: 万兽山庄庄主
    修为: 真仙境四重天
    年龄: 外表四十余岁,实际四万二千岁
    性别: 男
    灵根: 天品兽灵根
    武器: 万噬鞭(专属武器)
    能力: 御兽万兽,血脉秘术,万兽威压,血脉洞察
    性格: 理性冷漠,掌控欲强,守护血脉,手段残酷
    家族: 夫人苍阙影,长女北冥幽荧,次女北冥寂月

  苍阙影:
    职位: 万兽山庄庄主夫人
    修为: 真仙境三重天
    年龄: 外表三十五岁,实际三万五千岁
    身高: 一米六八
    灵根: 天品风灵根(变异灵根)
    武器: 轮刃与一对匕首
    能力: 刺杀大师,潜行能力卓越,特殊血脉秘术
    性格: 冷静精准,情感压抑,与夫关系冰冷,深爱女儿
    关系: 北冥玄狩(协议夫妻),北冥幽荧(长女),北冥寂月(次女)

  北冥幽荧:
    职位: 万兽山庄少主(长女)
    修为: 元婴后期,战力远超同阶
    年龄: 外表二十岁,实际三百五十岁
    身高: 一米七五
    灵根: 地品风灵根(变异灵根)
    武器: 御风(双刀)
    灵兽: 三阶灵兽"黑风豹"
    能力: 进攻型驭兽术,迅猛双刀术,兽魂共鸣
    性格: 活泼冲动,好胜心强,保护欲极强,对妹妹霸道保护
    关系: 北冥玄狩(父),苍阙影(母),北冥寂月(妹妹,最大软肋)

  北冥寂月:
    职位: 万兽山庄少主(次女)
    修为: 金丹后期,精神力远超同阶
    年龄: 外表二十岁,实际三百五十岁
    身高: 一米六八
    灵根: 地品雷灵根(变异灵根)
    武器: 御魂(鞭子)
    灵兽: 三阶灵兽"噬魂蛇"
    能力: 精神力控制,驭兽链接,异兽研究,隐匿追踪
    性格: 清冷寡言,理性缜密,洞察力强,极度忠诚于珍视之人
    关系: 北冥玄狩(父),苍阙影(母),北冥幽荧(姐姐,软肋)

势力特色:
  - 驭兽术为主
  - 禁地中培养精英
  - 血脉传承重要
  - 家族内部关系复杂
  - 双胞胎少主天赋异禀
