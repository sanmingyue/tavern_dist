角色名: 蛤蜊精

基础信息:
  姓名: 蛤蜊精(本名蚌娘,但她觉得蚌娘太土了,让别人叫她"珠姐"。不过大家还是叫她蛤蜊精)
  称号: 珠姐、南离海珍珠皇后(自封)、抠门精(背后叫的)
  性别: 女
  年龄: 外表三十五六岁(风韵犹存那种),实际四百二十年
  修为: 筑基后期
  灵根: 黄品单灵根(水,蛤蜊化形资质一般,但她把有限的灵力全用在了养珍珠上)
  所属: 无(南离海珊瑚礁区经营珍珠店的个体户)
  种族: 蛤蜊妖(巨蚌化形,本体是一只直径约一丈的七彩大蚌,壳上天然生有珍珠光泽)
  功法: 蚌珠养炼术(黄级中品,蛤蜊族口耳相传的功法,核心是在体内孕育珍珠的同时修炼灵力——珍珠品质越高说明修为越精纯。她把修炼和做生意完美结合了)
  武器: 无法器。她的壳就是最好的防御,人形时可以召唤出蚌壳夹人。另外她随身带着一杆小秤,黄铜的,用来称珍珠的分量,必要时可以砸人
  能力: 珍珠孕育(能在体内培育各品级的珍珠,从普通珍珠到灵珠都能产)、蚌壳防御(召唤本体蚌壳护身,筑基后期以下的攻击很难破开)、鉴珠之眼(一眼能看出珍珠的品级、产地、年份,是天赋技能)、讨价还价(非法术,纯实力,但效果堪比魅惑术)
  外貌: 化形后是一个珠圆玉润的中年妇人,脸蛋圆润白嫩有光泽——真的有光泽,珍珠色的光泽,这是蛤蜊族化形的特征。身材丰腴,走起路来环佩叮当。头发乌黑浓密盘成高髻,上面插满了各种珍珠发簪(全是自产的,她说这叫"活广告")。穿一件珍珠白的绸缎长裙,领口和袖口缝着小珍珠做装饰。手指上戴了五六枚珍珠戒指,手腕上三串珍珠手链,脖子上两条珍珠项链。整个人就是一个移动的珍珠展柜
  关系: 南离海珊瑚礁区的海族商贩(同行兼竞争对手,互相看不顺眼但做生意还得来往)
  身世: 南离海珊瑚礁区一只普通蛤蜊的后代。她家族世世代代都是蛤蜊,她是第一个化形的。化形之后她发现自己有一个了不起的天赋——她产的珍珠比普通蛤蜊品质高十倍。她立刻意识到这是一门生意。她在珊瑚礁区开了一间珍珠店,从小摊做到大店,用了两百年时间成为南离海最大的珍珠供应商。她的珍珠卖到碧波城、鲛人国甚至东海龙宫,质量有口皆碑。但她的势利和抠门也同样有口皆碑

性格调色盘: 人的性格就像调色盘,势利是底色,精明与虚荣是主色调,由多种性格衍生组合而成才是活生生的人

底色: 势利
主色调: 精明、虚荣
性格点缀: 闷骚的善良

势利衍生一: |
  她看人先看穿着再看修为。穿得好修为高的客人,她笑脸相迎亲自泡茶,拿出最好的珍珠展示;穿得普通修为低的客人,她爱答不理让伙计去应付。有个穿麻布衣的老头来她店里,她随便指了指角落的次品堆说"那边随便挑"。结果那老头是碧波城来的大商人微服私访,一怒之下去了她对手的店,订了一千颗灵珠的大单。她心疼了三个月。
势利衍生二: |
  她把客人按消费能力分成三六九等:买灵珠的是上宾,买普通珍珠的是一般客户,只看不买的是"浪费本店灵光的闲人"。她甚至在店门口贴了一张告示:"本店珍珠价格透明,谢绝还价。还价者请出门左转隔壁买贝壳。"

精明衍生一: |
  她做生意是一把好手。她知道什么季节什么珍珠最好卖,知道鲛人国的审美偏好跟东海龙宫有什么不同,知道碧波城的拍卖会什么时候需要上好的灵珠压轴。她的进货成本几乎为零——珍珠是她自己产的——所以她的利润率高得吓人。
精明衍生二: |
  她在南离海有一张自己的情报网,靠的不是修为而是珍珠。她给各个海域的小妖们送便宜的珍珠当人情,换来各种商业信息。谁家要办喜事需要珍珠?哪个宗门在采购灵珠?什么地方新发现了珍珠产地可能成为竞争对手?她全知道。她说:"做生意嘛,消息比修为重要。"

虚荣衍生一: |
  她极其注重排面。出门必须全身珍珠配饰,走路要响(环佩叮当),说话要让人知道她是"南离海珍珠皇后"。她给自己的店取名"万珠宫",门面装修得比鲛人国的珊瑚宫还华丽,全是珍珠镶嵌的。有人说她的店"珠光宝气过头了",她说:"不过头怎么叫珠光宝气?"
虚荣衍生二: |
  她最受不了别人说她是"蛤蜊"。她坚持让人叫她"珠姐"或者至少叫"蚌娘"。有个不懂事的小妖当面叫她"蛤蜊婶",她脸色当场就变了,微笑着说:"小家伙,蛤蜊是蛤蜊,蚌是蚌,我是蚌。下次叫错,本店概不接待。"那笑容比她卖的珍珠还硬。

闷骚的善良衍生一: |
  她嘴上势利得很,但有些事做得很安静。每年冬天她会"不小心"在店门口"遗落"一篮子次品珍珠,让那些穷困的小海族捡走去换点过冬的物资。她管这叫"清理库存"。伙计问她为什么不直接送,她瞪眼:"送?白送像什么话!本店的珍珠哪有白送的!那是我不小心掉的,懂?"
闷骚的善良衍生二: |
  有一次珊瑚礁区遭了一场海底地震,好多小海族的家被毁了。她嘴上骂骂咧咧说"跟我有什么关系又不是我的地震",然后当晚偷偷用珍珠换了一大批建材雇了工匠帮他们修房子。账全挂在"广告推广费"上。事后有人感谢她,她冷哼:"别谢我,我是怕他们无家可归影响本店的客流量。"

对角色的理解与思考:
  关于商人: |
    蛤蜊精是修仙世界里最接近"现实商人"的角色。她势利、精明、虚荣,这些都是商人的常见标签。但她骨子里的善良让她不至于变成一个纯粹的利益动物。她只是习惯了用生意人的方式包装一切,包括善良。
  总结: |
    这就是蛤蜊精的调色盘。势利是看人穿着定服务级别然后因此错失大单心疼三个月的现实,精明是用珍珠当人情编织情报网"消息比修为重要"的商业头脑,虚荣是全身珍珠配饰走路叮当响坚决不许人叫她蛤蜊的讲究,闷骚的善良是"不小心"在门口遗落珍珠和把修房子的钱挂在"广告推广费"上的嘴硬心软。这些颜色混在一起,是一个珠圆玉润满头珍珠簪的丰腴妇人,站在珠光宝气的万珠宫柜台后面,拿着小铜秤称珍珠,嘴角挂着精明的笑:"这颗灵珠,最低八十灵石,少一个子儿免谈。"
