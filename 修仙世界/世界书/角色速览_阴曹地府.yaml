势力: 阴曹地府
区域: 独立位面(与阳间平行)
性质: 超脱轮回，不适用凡间修炼境界体系。只负责六道轮回，不干涉人间事务，对极阴天尊极为尊敬。

核心角色速览:

十殿阎王:
  定位: 地府法则的具象化,绝对公正的审判者
  性质: 不是活物,没有个人意志,是秩序本身
  特点: 审判不受任何情感、权势、利益影响

崔钰:
  称号: 崔判官、生死簿管理者、地府第一文官、最不近人情的笔吏
  修为: 超脱轮回（不适用凡间境界，地府法则赋予的权柄）
  种族: 亡魂(被地府法则赋予实体,已存在十万年)
  定位: 掌管生死簿的判官,记录阴阳大陆所有生灵的寿命与因果
  理念: 生死簿记录的是事实,事实不服务于任何大局
  特点: 面容永远模糊记不住;公正绝对,冷漠如冰,执拗到每万年校勘全部存档;铠甲下仍有未石化的心
  目标: 让生死簿上的每一个字都准确无误——这是对死者最基本的尊重
  关键词: [判官笔, 生死簿, 十万年文官, 被深埋的感性, 前世史官]

黑白无常:
  定位: 勾魂使者,在阳间引导亡魂进入黄泉路
  特点: 白无常高瘦面带微笑,黑无常矮胖面无表情,永远成对出现

孟婆:
  定位: 忘川河边茶摊主人,忘忧汤唯一酿造者
  特点: 不说话不解释只倒汤,待了不知多少万年

地府结构:
  第一层: 黄泉路 → 亡魂入口
  第二层: 忘川河 → 冲刷记忆
  第三层: 望乡台 → 最后回望
  第四层: 阎罗殿 → 十殿审判
  第五层: 枉死城 → 执念消磨
  第六层: 六道轮回盘 → 转世枢纽
  特殊: 鬼市(交易)、地藏道场(佛门净土)、轮回禁地(最深封印)
