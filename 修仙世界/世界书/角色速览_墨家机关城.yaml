势力: 墨家机关城
区域: 中央神州
定位: 机关术与人偶制造顶尖势力

核心角色:

凰:
  姓名: 凰
  前代名号: 零号机、刹那
  性别: 女(机关人偶)
  年龄: 存在数百年,记忆丧失后如新生
  修为: 真仙境一重天(特殊)
  身份: 失落的墨家神兵
  定位: 纯白的新生求索者,从机械到学会情感
  关键词: 机关人偶、零号机、记忆丧失、纯白求索、学习情感
  特殊: 核心破碎记忆丧失,无心跳无体温,身体即武器,在学习中重构自我

