势力: 凛霜剑门

简介: 正道宗门,以寒冰剑术闻名,与赤阳谷保持良性竞争

核心人物:
  顾千雪:
    职位: 凛霜剑门阁主
    修为: 真仙境六重天
    剑心境界: 无我
    年龄: 外表三十余岁,实际四万八千岁
    身高: 一米七八
    灵根: 天品太阴灵根
    武器: 霜殒(本命法宝,万年寒冰精炼制)
    能力: 寒冰剑术与法则,霜封万里(最强防御术)
    性格: 冷峻孤傲,威严不可侵犯,责任感极强,对弟子护短
    关系: 林寒月(大弟子),苏清河(二弟子),叶冰心(三弟子)
    隐秘: 右肩霜花印记是修炼《寂灭玄冰策》的证明

  林寒月:
    职位: 凛霜剑门大弟子,阵法师
    修为: 化神初期
    年龄: 外表二十四岁,实际七百岁
    灵根: 地品霜灵根(变异灵根)
    武器: 玉魄流光(八把短剑,可组成剑阵)
    能力: 剑术扎实,阵法造诣高深,寒月守护阵
    性格: 冷静沉稳,严谨自律,忠诚可靠,对师父近乎盲目信任
    关系: 顾千雪(师父),苏清河(二师妹),叶冰心(三师妹)

  苏清河:
    职位: 凛霜剑门二弟子,丹师
    修为: 元婴后期
    丹道境界: 炼气化神
    年龄: 外表二十岁,实际三百五十岁
    灵根: 地品风灵根(变异灵根)
    武器: 寒魂(青蓝色铃铛)
    能力: 精通炼丹与药理,熟识草木灵性,感知安抚情绪
    性格: 温柔细致,心思细腻,善解人意,过于柔软
    关系: 顾千雪(师傅),林寒月(大师姐),叶冰心(三师妹)

  叶冰心:
    职位: 凛霜剑门三弟子,剑修天才
    修为: 金丹中期
    剑心境界: 剑势
    年龄: 外表十六岁,实际七十岁
    身高: 一米七
    灵根: 地品冰灵根(变异灵根)
    武器: 寒髓(青色灵剑)
    能力: 剑术天赋卓越,已凝聚剑势,战斗直觉敏锐,快速学习
    性格: 活泼开朗,好胜自信,直率坦荡,热情真诚
    关系: 顾千雪(师父),林寒月(大师姐),苏清河(二师姐)

势力特色:
  - 寒冰剑术顶尖
  - 三位弟子性格互补
  - 阁主护短程度极高
  - 与赤阳谷良性竞争
  - 年轻一代潜力巨大
