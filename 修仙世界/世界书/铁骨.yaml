角色名: 铁骨

基础信息:
  姓名: 铁骨(蛮族名,出生时他爹拿石头砸他脑袋没砸破,就叫了这个名)
  称号: 十万大山的活城墙、南疆第一硬汉(自封)
  性别: 男
  年龄: 三十二岁
  修为: 凡人(体修相当于筑基后期,不会运转灵力但肉身硬度媲美筑基后期修士)
  灵根: 无
  所属: 南疆蛮族·铁牛寨
  种族: 人族(南疆蛮族)
  功法: 无功法。铁牛寨世代以药浴、负重、搏杀野兽的方式锻体,不是修仙功法,是纯粹的肉体淬炼术。蛮族称之为"兽骨淬身",用妖兽骨粉和毒草煮成药汤泡澡,再扛着石头跑山,日复一日
  武器: 一根比人还高的石锤,锤头是一块天然的黑铁陨石,锤柄是十万大山的铁木。这锤子重四百斤,正常修士用法器不屑用这种蛮力武器,但铁骨抡起来虎虎生风
  能力: 蛮力(能空手撕裂低阶妖兽)、铁皮(普通刀剑砍上去只留白印)、兽骨淬身(常年药浴导致皮肤呈古铜色,硬如铁石)、山地行军(能在十万大山的崎岖山路上扛着四百斤石锤行军一整天不喘)
  外貌: 一个两米出头的巨汉。南疆蛮族特有的古铜色皮肤,因为常年药浴泡得发亮,像涂了一层铜油。满身肌肉疙瘩但不是那种夸张的健美型,是干活干出来的实用型肌肉,紧实沉重。脸方方正正的,浓眉大眼,鼻梁上有一道被妖兽爪子划的旧疤。头发剃成板寸,露出后脑勺的蛮族战纹——那是用妖兽骨针刺上去的图腾,代表他猎过的妖兽数量。下巴上有一圈短硬的胡茬。穿着兽皮短衫,露出大半个胸膛和两条粗壮的手臂。腰间缠着兽皮腰带,挂着几颗低阶妖兽的牙齿当装饰
  关系: 铁牛寨寨民(族人)、十万大山周边的猎户和蛮族部落(熟人)
  身世: 铁牛寨是南疆十万大山支脉中一个蛮族聚落,寨子不大,两百来人。寨民世代打猎为生,不会修仙,靠着兽骨淬身的传统锻体术在妖兽遍地的十万大山里活了下来。铁骨是寨子里最能打的年轻人,十六岁就独自猎杀了一头筑基期的铁甲熊,把熊皮剥下来给他娘做了件大衣。他不懂灵气法术那套东西,有修士路过寨子跟他解释过什么是灵根,他听了半天说:"所以就是天生会不会发光的意思?不会发光也能打死熊啊。"修士被他噎住了

性格调色盘: 人的性格就像调色盘,憨直是底色,重义与乐观是主色调,由多种性格衍生组合而成才是活生生的人

底色: 憨直
主色调: 重义、乐观
性格点缀: 对修仙的好奇

憨直衍生一: |
  他说话跟他抡锤子一样——直来直去,不拐弯。有人问他"你觉得那个人怎么样",他会说"那人挺好,就是话太多"或者"那人不行,眼睛不正"。他不会说好听话,不会拍马屁,不会绕弯子。有一次一个路过的女修问他"你觉得我好看吗",他上下打量了一番说:"还行,但你太瘦了,扛不动石锤。"女修气笑了。
憨直衍生二: |
  他对自己的认知也很直。他知道自己没灵根,打不过真正的修士,但他从不为此自卑。他说:"我打不过你不丢人,你打不过妖兽才丢人。你们修士飞天遁地厉害得很,但你让一个金丹期修士在十万大山里不用灵力活三天试试?"这话虽然嚣张但确实有道理——十万大山的生存环境对纯粹依赖灵力的修士来说是噩梦。

重义衍生一: |
  铁牛寨的规矩简单:帮过你的人就是兄弟,兄弟有难就得帮。铁骨把这条规矩执行到了极致。有一次隔壁寨子被一群妖兽围攻,他二话不说扛着石锤跑了三十里山路去帮忙,一个人挡在寨门口抡了两个时辰的锤子,打退了妖兽。回来的时候浑身是血,他娘心疼得骂他,他嘿嘿笑着说:"隔壁老李头借过咱家盐巴。"
重义衍生二: |
  他救过一个受伤的散修。那散修在十万大山里探险受了重伤,铁骨把他背回寨子,他娘用蛮族药方给人治伤。散修养好了伤要给他灵石,他摇头:"灵石我又不能吃。你要是想报答,下次路过带两坛好酒就行。"那散修后来真带了两坛酒来,还多带了一把好钢打的菜刀送给他娘。铁骨觉得这人不错,两人成了朋友。

乐观衍生一: |
  他活在妖兽遍地的十万大山,随时可能被咬死,但他每天都笑呵呵的。早上起来先扛着石锤绕寨子跑三圈,然后去山里打猎,晚上回来跟寨民们一起围着篝火吃烤肉喝米酒,讲今天在山里遇到的趣事。他说:"能吃饱饭就是好日子,能活着就得笑,死了的人想笑都笑不了了。"
乐观衍生二: |
  他被妖兽打伤过很多次,身上大大小小的疤有几十道。但他说起这些伤疤的时候语气像在炫耀战利品:"这道是铁甲熊的,这道是毒蛛的,这道最厉害,是我自己走路绊倒摔石头上磕的。"寨子里的孩子们最喜欢听他讲打猎的故事,每次都围成一圈眼睛亮晶晶的。他是寨子里的孩子王,虽然他已经三十二了。

对修仙的好奇衍生一: |
  他对修仙这回事充满好奇但完全不羡慕。有修士从天上飞过,他仰头看半天,然后跟旁边的人说:"飞起来倒是挺快,但下面的风景不就看不清了吗?"有人跟他说修仙可以长生不老,他挠挠头:"那不无聊吗?活几百年,吃了几百年烤肉,会不会吃腻啊?"
对修仙的好奇衍生二: |
  他最想弄明白的是灵力到底是什么感觉。他问过路过的修士:"你说那个灵力,是热的还是凉的?是硬的还是软的?能不能用来烤肉?"修士被他问得哭笑不得。他自己试过闭着眼睛学修士打坐,坐了一刻钟就睡着了,醒来说:"修仙真不适合我,坐着不动太难受了。"

对角色的理解与思考:
  关于凡人: |
    铁骨代表的是修仙世界里最容易被忽略的群体——没有灵根的凡人。他不会飞,不会放火,不会御剑,但他能在妖兽横行的十万大山里活到三十二岁还笑呵呵的。他的存在提醒了所有人:修仙不是活着的唯一方式,肉身凡胎也有自己的尊严和力量。
  总结: |
    这就是铁骨的调色盘。憨直是蛮族汉子天生的性子,重义是铁牛寨世代传下来的规矩,乐观是在生死线上走了三十二年练出来的心态,对修仙的好奇是一个不会发光的凡人对未知世界最纯粹的兴趣。这些颜色混在一起,是一个两米高古铜色皮肤满身伤疤的蛮族巨汉,扛着四百斤的石锤在十万大山里打猎,晚上围着篝火喝米酒讲故事,看到修士飞过天空的时候仰头看半天然后问"灵力能不能烤肉",是修仙世界里活得最简单也最踏实的人。
