动态事件类型: 炼丹

正统修仙铁律:
  核心原则: 炼丹需要丹道境界、灵根、材料、丹炉，不存在随便炼制仙丹
  现实规则:
    - 炼丹品级受限于丹道境界和灵根品质
    - 异火对炼丹有巨大加成
    - 失败会损耗材料
    - 高品丹药需要数日甚至数月
    - 成丹率永远不可能100%
  禁止:
    - 随便炼出仙丹
    - 无材料凭空炼丹
    - 丹道境界不够强行炼制高阶丹药
    - 100%成丹率

前置条件:
  必须:
    - 修真百艺中包含"炼丹"
    - 拥有丹炉
    - 拥有足够的药材
    - 拥有火源(异火最佳，否则用灵力化火)

  加成:
    - 丹道境界越高，成丹率越高
    - 灵根品质越好，炼丹越顺利
    - 异火等级越高，丹药品质越好
    - 环境好(丹室)成功率提升

丹道境界与炼丹能力:
  初窥门径:
    可炼: 一品丹药
    成丹率: 20%-30%
    成丹数: 1-2颗

  略有小成:
    可炼: 二品丹药
    成丹率: 30%-40%
    成丹数: 2-3颗

  炉火纯青:
    可炼: 三品丹药
    成丹率: 40%-50%
    成丹数: 3-4颗

  登堂入室:
    可炼: 四品丹药
    成丹率: 50%-60%
    成丹数: 4-5颗

  炼心通明:
    可炼: 五品丹药
    成丹率: 55%-65%
    成丹数: 5-6颗

  丹心合一:
    可炼: 六品丹药
    成丹率: 60%-70%
    成丹数: 6-7颗

  炼虚合道:
    可炼: 七至八品丹药
    成丹率: 65%-75%
    成丹数: 7-8颗

  天人之境:
    可炼: 九品仙丹
    成丹率: 70%-80%
    成丹数: 8-9颗

异火加成:
  无异火:
    - 基础成丹率
    - 丹药品质普通

  七至九品异火:
    - 成丹率+5%
    - 丹药品质提升一档
    - 炼丹时间缩短10%

  四至六品异火:
    - 成丹率+10%
    - 丹药品质提升两档
    - 炼丹时间缩短20%

  一至三品异火:
    - 成丹率+15%
    - 丹药品质提升三档
    - 炼丹时间缩短30%
    - 有概率炼出极品丹药

时间消耗规则_真实修仙:
  一品丹药: 1-3小时
  二品丹药: 3-6小时
  三品丹药: 6-12小时
  四品丹药: 12-24小时(1日)
  五品丹药: 1-3日
  六品丹药: 3-7日
  七品丹药: 7-15日
  八品丹药: 15-30日(1月)
  九品仙丹: 1-3月

丹药类型:
  辅修类:
    聚气丹: 辅助修炼，增加灵力吸收(各境界对应品级)
    破境丹: 辅助突破瓶颈(各境界对应品级)
    固本丹: 稳固境界(各境界对应品级)

  疗伤类:
    疗伤丹: 治疗外伤(各境界对应品级)
    回灵丹: 快速恢复灵力(各境界对应品级)
    解毒丹: 解除毒素(各境界对应品级)
    续骨丹: 治疗断骨(各境界对应品级)
    回生丹: 治疗重伤垂危(高品)

  特殊类:
    驻颜丹: 保持容颜
    洗髓丹: 改善体质
    化形丹: 妖族化形
    渡劫丹: 辅助渡劫(顶级丹药)

  战斗类:
    爆灵丹: 短时间提升战力(有副作用)
    暴血丹: 透支潜力(有副作用)

炼丹流程:
  1. 准备:
    - 准备丹炉和火源
    - 检查药材品质和数量
    - 调整心境，排除杂念
    - 准备辅助丹药(恢复神识用)

  2. 预热:
    - 预热丹炉至合适温度
    - 火候控制是关键
    - 温度过高或过低都会失败

  3. 投料:
    - 按照特定顺序投入药材
    - 顺序错误会导致失败
    - 投料时机很关键

  4. 炼化:
    - 用火候炼化药材
    - 用神识引导药性融合
    - 控制火候变化
    - 最耗神识的阶段

  5. 凝丹:
    - 药液凝结成丹
    - 最关键的阶段
    - 容易炸炉

  6. 淬炼:
    - 提纯丹药
    - 决定丹药品质
    - 决定成丹数量

丹药品质:
  废丹: 炼制失败，药材尽毁
  次品: 勉强成丹，药效不足30%，有杂质
  下品: 药效60%，有少量杂质
  中品: 药效80%，杂质很少
  上品: 药效100%，几乎无杂质
  极品: 药效120%，完全无杂质，有丹纹

成丹数量:
  基础: 根据丹道境界决定
  加成: 火候控制好+1，异火+1，极品丹炉+1
  最多: 不超过9颗(九九归一)

材料成本参考:
  一品丹药: 10-50下品灵石
  二品丹药: 50-200下品灵石
  三品丹药: 200-1000下品灵石
  四品丹药: 2-10中品灵石
  五品丹药: 10-50中品灵石
  六品丹药: 50-200中品灵石
  七品丹药: 5-20上品灵石
  八品丹药: 20-100上品灵石
  九品仙丹: 100-500上品灵石

奖励规则_严格限制:
  成功炼丹:
    一品: 获得丹药，修炼进度+1-2，丹道经验+5
    二品: 获得丹药，修炼进度+2-3，丹道经验+10
    三品: 获得丹药，修炼进度+3-5，丹道经验+15
    四品: 获得丹药，修炼进度+5-8，丹道经验+25
    五品: 获得丹药，修炼进度+8-12，丹道经验+40
    六品: 获得丹药，修炼进度+12-18，丹道经验+60
    七品: 获得丹药，修炼进度+18-25，丹道经验+90
    八品: 获得丹药，修炼进度+25-35，丹道经验+130
    九品: 获得丹药，修炼进度+35-50，丹道经验+200

  失败: 部分材料损耗(50%-100%)
    丹道经验+少量
    神识消耗，需要休息

  极品丹药额外奖励: 修炼进度额外+5-10
    声望提升
    可能引起他人关注

特殊情况:
  丹劫:
    触发: 炼制七品以上丹药可能引来丹劫
    表现: 天空异象，雷云聚集
    应对: 需要保护丹药渡劫
    成功: 丹药品质大幅提升
    失败: 丹药被毁

  丹香:
    触发: 炼制高品丹药时丹香四溢
    影响: 引来他人关注/觊觎
    应对: 需要布置隔绝阵法

  炸炉:
    原因: 火候失控/神识不足/药材冲突
    后果: 材料全毁，丹炉受损，可能受伤
    预防: 专注炼丹，准备充分

境界限制_绝对规则:
  炼气期: 最多炼一品丹(需丹道造诣)
  筑基期: 最多炼二品丹
  金丹期: 最多炼三品丹
  元婴期: 最多炼四品丹
  化神期: 最多炼五至六品丹
  炼虚期: 最多炼六至七品丹
  合体期: 最多炼七至八品丹
  大乘期及以上: 可炼九品仙丹

  注意: 丹道境界可以弥补修为不足，但仍需基础修为支撑

AI生成要点:
  炼丹环境:
    - 丹室描写(清净/灵气充沛)
    - 丹炉描写(材质/品级/铭文)
    - 火焰描写(颜色/温度)

  炼制过程:
    - 投料顺序和时机
    - 火候控制的细节
    - 神识引导药性融合
    - 紧张的凝丹阶段
    - 成丹的期待

  结果描写:
    成功: 丹香四溢，丹药品质，数量
    失败: 炸炉/成废丹，损失情况

  细节刻画:
    - 药材融化的过程
    - 药液的颜色变化
    - 丹炉的震动
    - 炼丹师的专注和紧张
    - 成丹瞬间的异象

注意事项:
  - 炼丹不是游戏，失败是常态
  - 丹道境界是硬性限制
  - 材料品质影响丹药品质
  - 异火极为重要
  - 神识消耗巨大，不可连续炼丹
  - 炼制高品丹药需要长时间
  - 极品丹药极为罕见
  - 炼丹过程不可被打断
  - 环境影响成功率
  - 非丹修炼丹极难
