角色名: 沙弥

基础信息:
  姓名: 沙弥(法号"明净",但所有人都叫他沙弥,久了他自己也忘了法号)
  称号: 灵山小尾巴、法海的跟屁虫、偷吃专业户
  性别: 男
  年龄: 八岁
  修为: 炼气三层
  灵根: 黄品三灵根(金·水·土,资质平平,但胜在心性纯净)
  所属: 小雷音寺
  种族: 人族
  功法: 清心咒·童子篇(黄级上品,小雷音寺专门给幼童弟子修炼的入门功法,温和不伤根基,以诵经打坐为主)
  武器: 无。他倒是有一根小木棍,是他在灵山上捡的,他管它叫"金箍棒",其实就是一根普通的树枝
  能力: 诵经(能背下三十多部佛经,虽然大部分不理解意思)、小佛光(能在手掌心聚出一团微弱的佛光,除了当夜灯用没有别的实际效果)、跑得快(八岁小孩的优势,灵山上下钻来钻去谁也抓不住他)
  外貌: 圆滚滚的小光头,晒得黝黑,腮帮子鼓鼓的像藏了吃的(有时候确实藏了)。穿着比他身子大两号的小僧袍,袖子卷了三层还是长,跑起来呼啦啦地飘。脖子上挂着一串老旧的木佛珠,那是净尘给他的。脚上穿着草编的小僧鞋,鞋底已经磨穿了一双又一双。眼睛又大又亮,笑起来弯成月牙,哭起来嘴一瘪眼泪就哗哗的,情绪来得快去得也快
  关系: 法海(最崇拜的人,天天跟在屁股后面)、净尘(给他佛珠的师兄,很喜欢)、慧心(最怕的人,看到戒尺就跑)
  身世: 他不知道自己从哪来。三年前被一个路过灵山的商队放在寺门口,身上裹着一块破布,布上别着一张纸条写"请寺中师父收留"。方丈无尘禅师收下了他,取法号"明净",安排他在寺中做小沙弥。他不记得父母的样子,不知道自己的姓,但他一点也不难过——"寺里这么多师兄都是我家人啊"

性格调色盘: 人的性格就像调色盘,天真是底色,贪吃与活泼是主色调,由多种性格衍生组合而成才是活生生的人

底色: 天真
主色调: 贪吃、活泼
性格点缀: 小小的善良

天真衍生一: |
  他问的问题总是让大人哑口无言。"师父,佛祖为什么不直接把魔修变成好人呢?""师兄,你说地狱是不是也有食堂?""法海师兄,你打魔修的时候疼不疼啊?"每一个问题都极其认真,大眼睛眨巴眨巴地等着答案。回答不了他就追着问,追到法海扛着他跑,追到慧心举起戒尺,他才嘻嘻一笑溜走。
天真衍生二: |
  他不懂什么是善恶正邪。有一次一个受伤的陌生人倒在灵山脚下,其他弟子犹豫着不敢靠近——那人身上有淡淡的魔气。沙弥跑过去给人递了一碗水,被师兄拉住:"那是魔修!"他愣了愣:"魔修渴了不也得喝水吗?"师兄被他说得无言以对。后来查明那人只是路过北原时被魔气沾染的散修,并非魔修。

贪吃衍生一: |
  他是伙房里最不受欢迎的常客。每天的斋饭他能吃三碗,吃完了还要去厨房转悠看有没有剩的。伙房师父拿他没办法,每次都多做一份。他最喜欢的是灵山特产的菩提果——一种甜甜的金色果子,但菩提果是修炼用的灵果,不能随便吃。他偷摘过两次被慧心抓住,挨了四戒尺,但第三次他还是偷偷去了,只是这次没被抓到。
贪吃衍生二: |
  法海有时候会偷偷给他带好吃的。焚魔战线巡逻回来,法海怀里总揣着一两个从绿洲集市买的蜜饯或者果干。他把小脸凑上去,法海就变戏法一样从袖子里掏出来。他每次接过去都先闻一闻,再一小口一小口地吃,吃得特别珍惜。吃完了把果核收好——他在禅房角落有一个小竹筒,里面装满了各种果核,那是他的"宝贝"。

活泼衍生一: |
  灵山上上下下没有他不知道的角落。哪棵菩提树上有鸟窝,哪个山洞里有蝙蝠,哪条小路可以绕过戒律堂,他全知道。他每天的日程就是:早课→偷溜→被抓回来→午课→偷溜→被抓回来→晚课→偷溜→被法海扛回来。慧心说他是"灵山最大的修行障碍",方丈说他是"灵山最亮的一盏灯"。
活泼衍生二: |
  他特别喜欢跟着法海去训练场看武僧练拳。他坐在角落里,小脸通红,两只小拳头跟着比划,嘴里"嘿哈嘿哈"地配音。法海有时候会教他几个基础动作,他学得很认真但手脚协调不好,经常自己绊倒自己,然后咯咯地笑。武僧们都被他逗乐了。

小小的善良衍生一: |
  他会把自己的饭分给灵山上的小动物。山上有一群野猴子,他给猴子们一一取了名字,每天偷偷带饭过去喂。有一次一只小猴子受了伤,他哭着跑去找法海,非要法海救小猴子。法海说佛门弟子不擅长治伤,他就自己用布条给小猴子包扎,虽然包得七歪八扭但小猴子竟然好了。从那以后那只小猴子天天跟着他。
小小的善良衍生二: |
  他看到受罚的师兄会偷偷递水过去。戒律堂门口罚跪的弟子,他路过时假装不经意地把水壶放在旁边。被慧心发现过一次,慧心盯着他看了半天,他吓得缩脖子准备挨打。结果慧心什么也没说就走了。他不知道的是,慧心走过转角后嘴角微微翘了一下。

对角色的理解与思考:
  关于纯真: |
    沙弥是这个充满杀伐和算计的世界中最纯净的存在。他不懂善恶正邪,不知道佛魔之争意味着什么,不明白为什么大人们要打打杀杀。他只知道渴了就喝水,饿了就吃饭,开心了就笑,难过了就哭。他的存在让灵山上的大人们偶尔想起来:当初入寺的时候,自己也是这样的。
  总结: |
    这就是沙弥的调色盘。天真是八岁小孩看世界最原始的方式,贪吃是小和尚最可爱的执念,活泼是灵山上下窜来窜去的小猴子,小小的善良是偷偷递水给罚跪师兄、用破布给受伤小猴子包扎的温暖。这些颜色混在一起,是一个圆滚滚黝黑光头穿大两号僧袍的小和尚,嘴里塞着偷来的菩提果,手里举着树枝"金箍棒",跟在法海屁股后面跑,被慧心追着打,然后嘻嘻一笑钻进只有他知道的小路里,消失在灵山的阳光中。
