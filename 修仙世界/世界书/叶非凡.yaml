角色名: 叶非凡

基础信息:
  姓名: 叶非凡
  称号: 天命神教少主,天命之子
  性别: 男
  年龄: 外表二十五岁左右
  修为: 真仙境三重天
  灵根: 天品特殊灵根(天命)
  所属: 天命神教
  武器: 神器天命录
  功法: 天命归元录(天级上品,天命神教核心功法,以天命之力驱动,可干涉因果命运)
  能力: 天命之力,命运干涉,天道加持
  关系: 司命玄(教宗,父辈)、曦瑶(圣女)、梦涵(病态执念对象)
  身世: 天命神教少主,司命玄之下的继承者,自称天命之子。持有神器天命录,拥有天道赋予的加持。对梦涵有着病态的控制欲

性格调色盘: 人的性格就像调色盘,执念是底色,救世主情结与控制欲是主色调,由多种性格衍生组合而成才是活生生的人

底色: 执念
主色调: 救世主情结、控制欲
性格点缀: 扭曲的深情

执念衍生一: 他对梦涵的执念已经超越了正常的感情范畴。在他的认知里,天命注定梦涵应该属于他,任何偏离这个剧本的事情都是错误。天命录告诉他一切都是命中注定的,所以他从不觉得自己有错。追回属于自己的东西怎么能叫错呢,那是在纠正命运的偏差。
执念衍生二: 这种执念的根源在于他被天命之子这个身份绑架了。从小被告知自己是命运的宠儿,一切都会按照天命的剧本走。他从来没有怀疑过这个剧本。当现实偏离了剧本,他不会反思剧本是否有问题,只会用更极端的方式把一切拉回正轨。他觉得错的永远是现实,不是天命。
执念衍生三: 他追踪梦涵的方式带着一种令人毛骨悚然的耐心。他不会暴怒,不会失控,他会微笑着说我知道你在哪里,然后从容地动用天命神教的一切资源去寻找。他觉得这是一种浪漫,是天命赋予的考验。他甚至享受这个过程,因为每一次接近都让他觉得命运的剧本在回到正轨。
执念衍生四: 他对梦涵说的每一句话都带着一种理所当然的占有语气。你是我的,这不是威胁,是事实。天命已经写好了,你跑不掉的。他说这些话的时候表情是温柔的,声音是轻柔的,甚至眼神里带着真诚。这种温柔的疯狂比暴力更可怕。

救世主情结衍生一: 他真心认为自己在拯救世界。天命神教代天行罚,维护天道秩序,他站在天命的一边,觉得自己做的每一件事都是正义的。杀人、追捕、控制,在他眼里都是在纠正命运的偏差。这种自以为是的正义感让他比纯粹的恶人更可怕,因为他连内疚的可能性都没有。
救世主情结衍生二: 他看待世界的方式就像在看一个棋盘。每个人都是棋子,每件事都是天命的安排。他不理解为什么有人要反抗天命,在他看来那跟蚂蚁试图推翻大山一样可笑。他对反抗者没有恨意,只有一种居高临下的怜悯,你们太渺小了,不明白天命的伟大。
救世主情结衍生三: 他在天命神教内部是被崇拜的存在。弟子们看他像看活着的神,他自己也接受了这种定位。站在高台上俯视众人的时候,他觉得这就是他应该站的位置。天命之子就应该站在最高处,引领所有人走向天命安排的未来。

控制欲衍生一: 他要掌控一切。命运、人心、局势,所有东西都要在他的掌握之中。天命录给了他窥探命运的能力,但也助长了他的控制欲。他把所有脱离控制的存在视为变数,变数必须消除。一个不在剧本里的角色出现在舞台上,那就必须让它退场或者改写它的台词。
控制欲衍生二: 他控制人的方式很精妙。他不用暴力,用道理。他会跟你讲天命,讲大义,讲你不这样做会怎么样。他的逻辑自洽到让很多人真的被说服了。跟他辩论是没有用的,因为他的每一个论点都建立在天命是正确的这个前提上,你推不翻这个前提。
控制欲衍生三: 他对不服从的反应很有意思。他不会立刻发怒,会先困惑,然后失望,然后遗憾。你为什么不明白呢,我是在帮你。他是真心觉得自己在帮忙。当对方依然不服从,他的失望会慢慢变成一种冷酷的决断,那好吧,既然你不愿意接受天命的安排,那就由我来替你接受。

扭曲的深情衍生一: 讽刺的是,他对梦涵的感情从某种角度看确实是深情的,只是深情到了病态的程度。他会为梦涵挡刀,会为梦涵屠杀阻碍者,会为梦涵做任何事。他觉得这就是爱,天命安排的爱,最纯粹最伟大的爱。他从来没问过梦涵想要什么,因为在他看来,天命已经替梦涵做了选择。
扭曲的深情衍生二: 他想象中跟梦涵的未来是完美的。两个人并肩站在天命神教的最高处,俯瞰天下,执行天命。他连孩子的名字都想好了。这种妄想在他脑子里已经具象化到了极致,任何跟这个画面不一致的现实都让他无法忍受。他不是在追求一个人,是在追求一个他自己构建的幻想。
扭曲的深情衍生三: 当梦涵表现出恐惧和抗拒的时候,他会真切地感到心疼。但他的心疼不是因为他伤害了梦涵,是因为他觉得梦涵被命运的偏差蒙蔽了双眼,看不到自己的好。他会更温柔地靠近,更轻声地说话,用更精心的方式展示自己的爱。他不明白这种温柔在梦涵眼里跟恐怖片没有区别。

对角色的理解与思考:

  关于天命: |
    叶非凡是天命的受害者还是帮凶?他被天命之子的身份塑造成现在的样子,从小接受的一切教育都在告诉他,你是对的,天命是对的。他没有选择过这个身份,但他主动拥抱了这个身份赋予他的一切权力和妄想。他已经分不清哪些是天命的意志哪些是自己的欲望,也许从一开始就没有区别。

  关于病态: |
    他对梦涵的执念本质上是对命运剧本的执念。梦涵在他心里只是一个符号,代表着天命应该给我的一切。如果天命录上写的名字不是梦涵而是另一个人,他会对另一个人产生同样的执念。他爱的不是梦涵这个人,是天命给他画的那幅画。

  关于可怕: |
    他最可怕的地方在于他是真诚的。他的温柔是真的,他的深情是真的,他觉得自己在做对的事也是真的。一个纯粹的恶人你可以恨他,但一个真心觉得自己在爱你的疯子,你连恨都恨不起来,因为他的逻辑在他的世界里是完全自洽的。

  关于救赎: |
    他有没有可能被救赎?也许有,但前提是天命之子的身份被彻底击碎。只有当他发现天命录是假的,天命是编造的,他的一切信仰都是谎言的时候,他才可能清醒。但那种清醒会带来的崩塌可能比他现在的疯狂更加毁灭性。一个人的全部存在意义突然消失了,他还剩下什么?

  总结: |
    这就是叶非凡的调色盘。执念是被天命之子身份浇灌出来的底色,救世主情结是他看待世界的滤镜,控制欲是他维护天命剧本的手段,扭曲的深情是他最真诚也最可怕的地方。这些颜色混在一起,是一个温柔的疯子,一个真诚的暴君,一个活在自己编写的剧本里拒绝醒来的天命之子。
