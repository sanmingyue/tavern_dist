阴曹地府:

概述: |
  阴曹地府不属于阴阳大陆的任何一个大域,它是与阳间平行存在的另一个世界,是亡魂的归宿,六道轮回的枢纽。地府不遵循修仙界的境界体系,这里有自己的法则和秩序——死亡的法则。
  
  活人不该来这里。但偶尔,极少数修士通过特殊手段进入地府,或为寻找亡者魂魄,或为探索死亡的奥秘,或纯粹因为走错了路。进入地府的活人会被冥界法则排斥,时间一长灵魂就会被同化,变成这里的一部分。
  
  地府的天空永远是铅灰色的,没有太阳也没有星星,只有一轮永远不圆的残月挂在那里,散发着幽冷的光。这里的空气闻起来像旧纸和香灰,一切颜色都被冲淡了,像一幅褪色的水墨画。

入口:
  黄泉路口: |
    散布在阴阳大陆各处的死亡节点。每一个大量死亡发生过的地方都可能形成黄泉路口——古战场、瘟疫废墟、灭门遗址。路口平时不可见,只有在特定条件下才会显现,比如月食之夜、鬼门关开启之时,或者有人以特殊术法召唤。
    
    黄泉路口看起来像一条铺满灰白色石板的小路,路两旁开着彼岸花,红得像凝固的血。踏上这条路就意味着与阳间告别,走完了就到了地府。活人如果误入,还有七步的犹豫期,七步之内转身还能回去,七步之后就只能一路走到底了。

  归墟之眼: |
    北冥海深处的海底漩涡,是四海水域通往地府的通道。传说中所有溺亡者的灵魂都会被海流卷入归墟之眼,然后进入地府。
    
    归墟之眼常年存在,但被海水和水压保护,只有极少数修士有能力潜入那个深度。东海龙宫对归墟之眼的存在心知肚明,但从不干涉,那是龙族与地府之间古老协议的一部分。

  万魔殿·堕魂深渊: |
    北原魔土天魔帝都万魔殿地下的裂缝,连通着地府的某个区域。这条通道被天魔帝都严密把守,只有血屠天魔知道如何使用它。
    
    据说天魔帝都之所以建在这里,就是因为堕魂深渊的存在。魔族利用这条通道从地府获取亡魂之力,这是他们的秘密之一。

地府地理:

  第一层·黄泉路:
    描述: |
      所有亡魂进入地府的第一站。一条无尽的灰白石板路,两旁开满彼岸花,花红如血,没有叶子。空气中弥漫着一种奇异的花香,闻久了会让人忘记生前的事。
      
      黄泉路上永远有魂在走。他们排成长长的队伍,面无表情,脚步机械,像被一根看不见的线牵着往前走。偶尔有魂回头看一眼来时的方向,然后继续走。没有人说话,只有脚步声和花香。
    特殊: 黄泉路的长度因人而异。执念越重的魂,走的路越长。有的魂走了几步就到了,有的走了几百年还在路上。

  第二层·忘川河:
    描述: |
      黄泉路的尽头是一条宽阔的河,河水浑浊发黄,看不见底。河面上漂浮着各种记忆的碎片,有的像照片有的像声音有的像气味。亡魂涉水渡河的过程中,河水会冲刷掉他们生前的记忆。
      
      河边有一个简陋的茶摊,摊主是一个看不清面容的老妇人。她不说话,只是默默地给每一个路过的魂倒一碗汤。那碗汤叫忘忧汤,喝了就忘,不喝就记着,但记着也没有用,因为前面等待他们的是审判。
    特殊: |
      极少数意志极强的魂能拒绝喝忘忧汤并保留记忆渡过忘川河。这些魂会被特别标记,送往阎罗殿进行额外审判。保留记忆不一定是好事,因为带着记忆转世的人往往过得比失去记忆的人更痛苦。
      
      忘川河中有一种鱼,通体透明,以记忆碎片为食。偶尔有鱼跃出水面,嘴里叼着一段不知是谁的回忆。

  第三层·望乡台:
    描述: |
      渡过忘川河后,亡魂会经过一座三丈高的黑色石台。站在台上可以看到自己生前最在意的人现在在做什么。
      
      大部分魂在这里停留的时间很短,看一眼就走了。但有的魂会站在台上看很久,看到阳间的亲人在哭,在笑,在继续活着。地府的规矩是不催促,看多久都行,但看完了就必须继续走。
    特殊: 望乡台是地府中唯一能看到阳间的地方。有修士试图利用这一点来窥探阳间,但望乡台只对亡魂显示画面,活人站上去只能看到一片白雾。

  第四层·阎罗殿:
    描述: |
      十殿阎王审判亡魂的地方。十座大殿排成一列,每一座殿的阎王负责审判不同类型的罪业。
      
      阎罗殿的建筑风格庄严肃穆,黑瓦白墙,殿内烛火长明。每一座殿前都有一面巨大的照业镜,镜子能映照出亡魂生前的一切行为,无法伪装无法欺瞒。
      
      审判不是简单的善恶二分。阎王们会综合考量亡魂一生的因果,做出裁决:转世为何物,投生到何处,是否需要在地狱受罚。审判的过程平静而严肃,没有戏剧性的对质,只有照业镜里无声播放的一生。
    十殿阎王:
      - 秦广王: 掌管第一殿,负责初审和分类
      - 楚江王: 掌管第二殿,审判伤害类罪业
      - 宋帝王: 掌管第三殿,审判欺诈类罪业
      - 五官王: 掌管第四殿,审判不孝类罪业
      - 阎罗王: 掌管第五殿,十殿之首,负责复杂案件和最终裁决
      - 卞城王: 掌管第六殿,审判亵渎类罪业
      - 泰山王: 掌管第七殿,审判掠夺类罪业
      - 都市王: 掌管第八殿,审判残忍类罪业
      - 平等王: 掌管第九殿,审判背叛类罪业
      - 转轮王: 掌管第十殿,负责执行转世投胎
    特殊: 十殿阎王不是人也不是鬼,是地府法则的具象化存在。他们没有私心没有感情,审判绝对公正。任何试图贿赂或威胁阎王的行为都会被加重处罚。

  第五层·枉死城:
    描述: |
      那些死于非命、含冤而死、不愿接受审判结果的魂被送到这里。枉死城是一座永远笼罩在阴雾中的灰色城市,城中的魂徘徊在街道上,重复着死前最后的片段。
      
      被谋杀的魂在这里等待凶手的到来,等到了才肯离开。怀有执念的魂在这里消磨执念,有的消磨了几千年还没放下。自杀的魂在这里反复经历死亡的瞬间,直到彻底接受了自己的选择。
    特殊: |
      枉死城的判官会定期巡视,帮助那些愿意放下执念的魂离开。但判官不会强制,因为地府尊重每一个魂的选择,哪怕那个选择是永远留在枉死城。
      
      偶尔有阳间的修士会来枉死城寻找特定的亡魂,但枉死城的魂大多已经不记得自己是谁了,只记得那份执念。

  第六层·六道轮回盘:
    描述: |
      地府的核心。一个巨大的石盘悬浮在虚空中缓缓转动,盘面上刻着六条通道,分别通向六种转世去处:天人道、人道、修罗道、畜生道、饿鬼道、地狱道。
      
      完成审判的魂被送到这里,根据阎罗殿的裁决进入对应的通道。进入通道的瞬间,魂会被轮回之力彻底洗涤,所有的记忆、执念、灵力全部清空,以最纯净的状态开始新的一世。
      
      轮回盘的转动声沉闷而有节奏,像一颗巨大心脏的跳动。它已经转了不知道多少万年,从天地开辟以来就没有停过。
    特殊: |
      轮回盘是地府运转的根基,如果它停止转动,死者将无法转世,阳间也将不再有新的生命诞生。这是天道运行的一部分,任何试图干涉轮回盘的行为都会遭到天道本身的反噬。
      
      极少数修炼到极致的存在可以跳过轮回盘直接转世,保留前世的记忆和修为。但这种行为需要付出巨大的代价,而且会在因果上留下深深的烙印。

  特殊区域·鬼市:
    描述: |
      地府也有自己的市集。鬼市开在枉死城和阎罗殿之间的一片空地上,逢阴历初一十五开市。卖的东西五花八门:前世的记忆碎片、未了的心愿、别人的遗憾、甚至是阳寿——是的,地府也有货币,叫冥钱,可以用来购买各种奇怪的东西。
      
      鬼市上最珍贵的商品是"来世签",买了可以选择下一世投胎的方向,但不保证准确,偶尔会出差错,比如想投胎成人结果变成了猫。
    特殊: 活人的灵魂如果进入鬼市会被当成稀有商品,因为活人的阳气在地府是硬通货。所以修士进入地府时必须隐藏自己的生者气息。

  特殊区域·地藏道场:
    描述: |
      佛门在地府设立的据点。地藏菩萨发愿"地狱不空誓不成佛",在地府深处建立了一方净土,专门度化那些罪业深重但仍有善念的亡魂。
      
      道场不大,只有一座小庙和一棵枯而不死的菩提树。地藏菩萨不常在,但他留下的佛力渗透在道场的每一寸土地里。任何走进道场的魂都会感到一种温暖,像是被人轻轻拥抱了一下。
    特殊: 地藏道场是地府中唯一不受地府法则管辖的区域,这里的规则由佛法决定。阎罗殿对此睁一只眼闭一只眼,因为地藏度化的魂最终还是会进入轮回。

  禁区·轮回禁地:
    描述: |
      六道轮回盘的下方,一片被封印的区域。这里是地府最深处,据说封印着那些因果太过复杂、无法被轮回洗涤的存在。
      
      没有人知道禁地里到底关着什么,十殿阎王对此绝口不提。偶尔会有奇异的声响从禁地深处传出,像是低语,像是叹息,像是有什么东西在封印里缓慢地呼吸。
    特殊: 轮回禁地的封印由十殿阎王共同维护,任何一位阎王陨落都会导致封印力量减弱。这是地府最大的秘密,也是最危险的隐患。

地府核心存在:
  十殿阎王: 地府法则的具象化,绝对公正的审判者。不是活物,没有个人意志,是秩序本身
  判官: 掌管生死簿的文官,记录阳间每一个生灵的寿命和因果。判官不止一个,但都面容模糊,像是被刻意隐藏了身份
  黑白无常: 勾魂使者,负责在阳间引导亡魂进入黄泉路。白无常高瘦面带微笑,黑无常矮胖面无表情。两人永远成对出现,从不分开
  孟婆: 忘川河边的茶摊主人,忘忧汤的唯一酿造者。没有人见过她的真面目,只知道她已经在河边待了不知多少万年。她不说话,不解释,只是倒汤

地府与阳间的关系:
  鬼门关: 每年七月十五鬼门关开启,地府中部分无主孤魂被允许返回阳间游荡一日。这一天阳间修士通常会避免外出,凡人则焚香祭祀
  招魂术: 部分修士掌握从地府召回特定亡魂的术法,但代价极高,而且召回的魂不能在阳间停留太久,否则会被地府强制收回
  长生与地府: 修仙者追求长生的本质就是逃避死亡,逃避地府的管辖。真仙境以上的存在已经不在生死簿上,地府对他们没有管辖权。这也是修仙者拼命提升修为的原因之一
  魂修: 有极少数修士以死亡为修行之道,自愿在地府和阳间之间往返,借助地府的力量修炼。这种修行方式极其危险,但一旦成功,对灵魂和因果的掌控会达到恐怖的程度
