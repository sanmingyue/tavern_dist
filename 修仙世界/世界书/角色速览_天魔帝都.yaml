势力: 天魔帝都
区域: 北原魔土

核心角色速览:

血屠天魔:
  称号: 天魔帝都魔帝、北原之主、血魔王族末裔
  修为: 真仙境八重天
  种族: 魔族(远古血魔王族末裔)
  定位: 北原魔土绝对统治者,以铁血手腕统治魔族
  理念: 魔族不需要怜悯,只需要秩序。用力量建立绝对秩序
  特点: 霸道中隐藏着隐忍,孤独中保有对弱者的怜悯
  目标: 统一北原魔土,使魔族强盛,不再被正道视为蝼蚁
  关键词: [血魔王族, 铁血统治, 霸道隐忍, 五方魔王]

势力关系网:
  魔帝: 血屠天魔 → 绝对统治
  五方魔王: 冰魔/炎魔/影魔/血魔/骨魔 → 各领一方
  外交: 与中央神州天然敌对,与西漠佛国势不两立,与东荒妖域时敌时友
