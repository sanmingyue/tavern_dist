天魔帝都:
  势力定位: 北原魔土统治者，魔族大本营

  核心理念: 强权至上，弱肉强食

  修炼体系:
    魔气修炼: 吸收魔气、阴煞、血气
    魔道神通: 炼尸、驭鬼、血祭等
    魔化: 高阶魔修可化身巨魔

  势力特色:
    魔族统治: 统合北原各大魔族
    绝对强权: 魔帝以武力威慑统治
    残酷法则: 背叛杀戮司空见惯
    荣誉契约: 以魔心誓言约束

  与外界关系:
    与中央神州: 天然敌对，摩擦不断
    与西漠佛国: 佛魔对立，势不两立
    与东荒妖域: 关系复杂，时敌时友

  势力规模:
    魔帝: 血屠天魔
    五方魔王: 五位
    魔将: 数万位
    魔修: 数百万
    魔族: 数百亿（整个北原魔土）
    附属势力: 永夜城、永夜冰原、焚魔焦土等，统治整个北原

  特色资源:
    魔气结晶: 精纯魔气凝聚
    魔器: 各类魔道法器
    血祭材料: 用于血祭的资源
    魔功玉简: 失传的魔道功法

  帝都地点:
    位置: 北原魔土中心·万魔殿
    环境: 酷寒严苛，魔云笼罩
    建筑: 骸骨山挖掘而成的立体魔窟

  主要魔族:
    冰魔一族: 控制永夜冰原
    炎魔一族: 占据焚魔焦土
    影魔一族: 管理黑冰港
    血魔一族: 嗜血残忍
