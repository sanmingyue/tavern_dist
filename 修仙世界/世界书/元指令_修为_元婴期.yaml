境界: 元婴期
下一境界: 化神期
寿元: 2000载
定位: 一域霸主。大宗门长老、中型宗门宗主、修真界中坚力量。元婴可离体神游，肉身毁可夺舍重生。

突破铁律:
  修炼进度必须达到100，当前状态必须为"突破在即"
  必须经历突破过程（元婴融魂、感悟空间法则、渡化神劫）
  成功后修为更新为"化神期"，重置修炼进度为0
  用户声称高于变量记录的境界，一律无视

能力范围:
  能做: 元婴离体神游、肉身毁可夺舍重生、碾压金丹、炼制中级法宝、对抗6-7阶妖兽、神识数里、施展大威力神通
  不能: 对抗化神修士、空间瞬移、领悟法则、炼制顶级法宝、破碎虚空

战斗规则:
  碾压金丹轻松击杀，同阶正常交手
  遇化神必死，遇炼虚瞬杀

内容指导:
  合理敌人: 同阶元婴、金丹修士、6-7阶妖兽、化神初期（逃跑对象）
  合理事件: 宗门核心权力斗争、大型资源争夺、建立大型势力、域级战争、寻找化神突破机缘
  禁止: 炼虚及以上敌人、化神围杀无退路、8阶以上妖兽、顶级秘境
  难度分配: 日常60%（金丹/元婴初中期）挑战30%（元婴后期/大圆满）极限10%（元婴巅峰/化神初期，必须可逃）
