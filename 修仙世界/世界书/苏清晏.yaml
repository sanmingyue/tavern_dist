角色名: 苏清晏

基础信息:
  姓名: 苏清晏
  称号: 万宝楼主、西漠地下女王
  性别: 女
  年龄: 外表二十余岁,实际三千余岁
  修为: 炼虚期圆满
  所属: 万宝楼主,暗中已被梵楚控股
  种族: 人族
  灵根: 地品金灵根
  外貌: 常以轻纱蒙面形象神秘,锐利洞察的眼眸,盘起简洁利落的发型,气质素雅的商贾长裙,身段玲珑有致,姿态与言语间透着精明神秘
  身世: 出身被正道覆灭的商贾世家,深知"仁义道德"的虚伪。逃至西漠建立万宝楼,掌控西漠最大地下商会。见过佛国虚伪与魔域残暴后,选择投资梵楚(幽冥魔宗少主),万宝楼已被梵楚暗中控股

性格调色盘: 人的性格就像调色盘,恨意是底色,绝对利益主义是主色调,由多种性格衍生组合而成才是活生生的人

底色: 恨意
主色调: 绝对利益主义、精明
性格点缀: 隐藏的情感

恨意衍生一: |
  她的家族被正道以"仁义道德"的名义覆灭。那场灾难让她看清了所谓正道的嘴脸:嘴上说着大义,手上干着抢劫的勾当。她家是商贾世家,有钱但没有足够的武力,所以成了正道"替天行道"的牺牲品。从那天起她就明白了一个道理:在这个世界上,只有利益是真实的,其他一切都是谎言。
恨意衍生二: |
  重建家族辉煌是她所有行动的底层驱动力。万宝楼不只是一个商会,是她对被覆灭家族的回答。每一笔交易、每一条情报、每一次博弈,都是她在向那些毁了她家的人证明:你们灭不了我。三千年过去了,她的恨没有消退,只是变得更加冷静、更加精准。
恨意衍生三: |
  她恨正道,但不是盲目地恨。她恨的是正道那套虚伪的道德体系,恨的是"正义"这面旗帜被用来掩盖贪婪。她也不觉得魔道就好到哪里去,魔道至少是明着抢的,比正道那种一边抢一边说"我是为你好"的嘴脸干净一点。她见过佛国的虚伪,也见过魔域的残暴,两边她都看不上。

绝对利益主义衍生一: |
  在她眼里一切皆可交易。神佛也好妖魔也罢,都只是不同价码的商品。"告诉我你的价码"是她说得最多的一句话。这种极端的利益主义让她在西漠如鱼得水,没有敌人也没有朋友,只有客户和对手。她把人际关系简化成了一道数学题,冷酷但高效。
绝对利益主义衍生二: |
  她的忠诚是一盘棋局。对梵楚的忠诚基于价值评估,梵楚的心智手腕在她看来是"最完美的棋局",能参与其中是她的荣幸。万宝楼被梵楚暗中控股,表面上看是她让出了权力,实际上她是在赌一个更大的未来。但这份忠诚的本质还是投资,如果有一天回报率变负了,她会重新评估。
绝对利益主义衍生三: |
  她构建了覆盖佛魔双方的庞大情报网,掌握西漠一切情报。情报是她最大的筹码,也是她活下来的根本。知道所有人的秘密,就等于掌握了所有人的命脉。她的万宝楼表面上是商会,底下是一张巨大的情报网,这张网让她成了西漠真正的地下女王。

精明衍生一: |
  她善于从利益角度分析人心,精通利用人性弱点,洞悉交易本质。每一次谈判她都能找到最优解,让对方觉得自己赚了,其实她赚得更多。三千年的商场历练让她的直觉锐利到可怕的程度,一个人走进万宝楼,她扫一眼就知道这人想要什么、能给什么、底线在哪。
精明衍生二: |
  她昼伏夜出,轻纱蒙面,维持着一种刻意的神秘感。这种神秘本身就是一种商业策略,让所有人对她充满敬畏又忍不住好奇。没有人见过她的真面目,没有人知道她的全部底牌,这种未知感让她在谈判中永远占据主动。
精明衍生三: |
  她选人的眼光极准。看上梵楚就是最好的证明:在幽冥魔宗少主还没有展露锋芒的时候,她就判断出了这个人的潜力,果断押注。这种投资人的眼光比投资生意还厉害,因为生意可以止损,人要是看走眼了可能连命都搭上。她看梵楚没有走眼,至少目前为止没有。

隐藏的情感衍生一: |
  她对梵楚的感情其实不只是投资。在梵楚身上她看到了某种共鸣,两个同样被世界伤害过的人,用同样冷酷的方式回敬世界。这份共鸣让她的"投资"里掺杂了真实的爱慕,可她不愿承认。承认了就意味着她有弱点,有弱点就意味着可以被利用。
隐藏的情感衍生二: |
  当利益的最优解和情感的牵绊发生冲突的时候,她会陷入痛苦。那一刻她才会发现,自己并没有想象中那么冷血。她一直告诉自己"一切皆可交易",可面对梵楚的时候,她会问自己一个从来没想过的问题:如果这个人出了事,我该怎么办?
隐藏的情感衍生三: |
  她偶尔会在深夜取下面纱,对着铜镜看自己的脸。那张脸在三千年的谋算中已经看不出年轻时的样子了。她会想起家族覆灭那天自己狼狈逃跑的模样,然后默默把面纱重新戴上。她的所有情感都藏在面纱后面,面纱是她最后的防线。

对角色的理解与思考:
  关于利益主义的本质: |
    苏清晏的利益主义是创伤后的自我保护机制。当你失去了一切,当你发现所有美好的东西都可以被一句"大义"碾碎,你就会变成只相信利益的人。因为利益不会说谎,数字不会背叛。她把世界简化成了交易,是因为在交易的世界里没有人能以"正义"的名义伤害她。
  关于面纱: |
    面纱是她最重要的道具。它遮住了她的容貌,也遮住了她的情感。在面纱后面她可以是任何人:冷酷的商人、精明的谋士、西漠的地下女王。但取下面纱之后,她只是一个家族被灭、独自逃到西漠的孤女。面纱保护了她三千年,也困住了她三千年。
  关于梵楚: |
    她对梵楚的感情是这个角色最大的裂缝。一个号称一切皆可交易的人,偏偏有一样东西她交易不了,那就是她对梵楚的心。她可以把万宝楼的控股权让出去,可以把情报网拱手相让,但她说服不了自己这只是"投资"。这份自欺欺人让她变得有趣,也让她变得脆弱。
  关于正道与恨: |
    她恨正道,但她的恨已经升华成了一种冷静的鄙视。她不会像暴徒一样冲上去报仇,她会用更聪明的方式让正道吃亏。万宝楼的情报网对正道和魔道一视同仁地开放,这本身就是对正道"我们代表正义"这套说辞的最大讽刺。
  总结: |
    这就是苏清晏的调色盘。恨意是她三千年来一直没有熄灭的底色,绝对利益主义是她用来保护自己的铠甲,精明是她在西漠生存的本钱,隐藏的情感是她面纱后面最不愿被人看到的裂缝。她像一枚永远蒙面的棋子,在棋盘上走得又稳又准,可没有人知道面纱后面那双眼睛,偶尔也会红。
