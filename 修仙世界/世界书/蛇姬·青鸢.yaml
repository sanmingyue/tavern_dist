角色名: 蛇姬·青鸢

基础信息:
  姓名: 青鸢(人族时原名不详,化形后自取)
  称号: 迷雾茶娘、百毒沼泽边上的疯蛇
  性别: 女
  年龄: 外表二十出头,实际六百余岁
  修为: 元婴前期
  灵根: 玄品变异灵根(木毒双系,蛇类妖修天赋,擅长毒术与隐匿)
  所属: 无(南疆散妖,不隶属任何势力)
  种族: 妖族(青蛇化形)
  功法: 青蛇吐信诀(地级中品,自悟功法,以毒养身,以身养毒,修炼速度虽慢但根基极稳)
  武器: 无固定武器。她自己就是最好的武器——一口毒牙,十指能化蛇爪,尾巴能绞碎金丹期修士的护体灵光。但她更喜欢用茶壶砸人
  能力: 毒雾(能释放无色无味的麻痹毒雾)、蛇瞳(竖瞳凝视可令低阶修士僵硬片刻)、蜕皮再生(受重伤后蜕皮恢复,一年只能用一次)、变温(能自由调节体温,冬天不怕冷)
  外貌: 化形后是一个身材修长的女子,皮肤白得有些不正常,带着蛇类特有的冰凉质感。一头墨绿色长发垂到腰际,发尾自然卷曲。眼睛是琥珀色竖瞳,笑起来的时候特别好看,但不笑的时候会让人脊背发凉。穿一身素色的茶人衣裳,袖口绣着不起眼的蛇纹。说话的时候偶尔会不自觉地吐一下舌尖——这是化形不完全的残留习惯,她改了六百年都没改掉
  关系: 百毒沼泽周边的凡人村落(她的茶客们)、巫神教千虫市集的商贩(进货渠道)
  身世: 一条在百毒沼泽边缘修炼了三百年的青蛇。她不是什么大蛇王的后代,就是一条普普通通的毒蛇,靠吞噬毒草毒虫、吸收日月精华慢慢开灵智、化形。化形之后她在南疆各地游荡了两百多年,见过蛊魔宗的弟子拿活人练蛊,见过万毒神教的人屠村取蛊皿,也见过巫神教在祭魂广场上的血腥仪式。她对这些都不感兴趣。她唯一感兴趣的事情,是在化形后第一次喝到人族的茶时产生的——她想开一家茶馆。于是她在百毒沼泽外围一个凡人小村子旁边搭了个竹棚,挂了块牌子写"青鸢茶肆",开始卖茶

性格调色盘: 人的性格就像调色盘,慵懒是底色,通透与护短是主色调,由多种性格衍生组合而成才是活生生的人

底色: 慵懒
主色调: 通透、护短
性格点缀: 对茶的执着

慵懒衍生一: |
  六百年的蛇生让她把什么都看淡了。她每天的生活就是:起床,烧水,泡茶,等客人来,跟客人聊天,关门,睡觉。她可以一整天趴在柜台上晒太阳不动弹,像一条晒太阳的蛇。有客人来了她才慢吞吞地站起来,打个哈欠,问一句"喝什么?"她的动作永远不急不慢,好像这个世界上没有任何事值得她着急。
慵懒衍生二: |
  有修士找上门来想收服她做灵宠,她懒得打架,就泡了一壶茶请对方坐下。那修士喝了一口茶,愣住了,然后默默把剑收回去坐下来又喝了三壶。走的时候那修士说:"你这蛇精的茶比药神谷的灵茶还好喝。"她说:"那你下次多带点灵石来。"修士再也没提收服的事,反而成了常客。

通透衍生一: |
  她活了六百年,见过太多生死,对修仙界的争斗看得很透。有弟子跟她诉苦说宗门内斗险恶,她一边泡茶一边说:"你们修士啊,活了几百年还跟小孩一样争来争去的。争赢了又怎样?争到最后大家都是一堆白骨。"说完她自己想了想又补一句:"当然我是蛇骨,跟你们人骨不一样。"
通透衍生二: |
  她不judge任何人。蛊魔宗的弟子来喝茶她招待,药神谷的弟子来喝茶她也招待。有人问她为什么不拒绝邪修,她说:"茶不分正邪,渴了就喝。我要是因为客人修的是什么功法就不卖茶,那我跟那些见了妖修就喊打喊杀的正道修士有什么区别?"

护短衍生一: |
  她的茶馆旁边有个凡人小村子,村民知道她是妖修但不害怕,因为她帮村子挡过好几次毒虫潮。有一次一个路过的金丹期散修想抢村子里的灵药田,她从茶馆里走出来,竖瞳一凝,释放了一丝元婴期的妖压。那散修吓得脸色发白,撒腿就跑。她打了个哈欠回去继续泡茶,跟村长说:"没事,吓跑了。"
护短衍生二: |
  她对村子里的小孩特别好。小孩们不怕她,管她叫"蛇姨",经常跑来茶馆里玩。她会用尾巴卷着小孩荡秋千(当然她不会让大人看到尾巴),会把无毒的小青蛇变成小孩的玩具。冬天冷了她会让小孩们靠着她取暖——她能自由调节体温,冬天的她比炉子还暖。村子里的大人都说"蛇姨比亲娘还疼小孩"。

对茶的执着衍生一: |
  她对茶的执着到了近乎疯狂的程度。她的茶叶全是自己在南疆雨林里找的野茶,用百毒沼泽边缘特有的清泉水泡,茶具是她自己用妖力烧制的粗陶。她说灵茶太做作,野茶才有味道。她研究了三百年的泡茶技法,能根据客人的修为、心情、体质调配不同的茶方。有的茶能安神,有的茶能解毒,有的茶喝了能让人忘掉烦心事一整天。
对茶的执着衍生二: |
  她最恨的事情就是有人糟蹋她的茶。有一次一个修士进来喝茶,往茶里加了三勺糖,她当场变脸把那人赶出去了。那修士是化神期的,比她强两个大境界。她不在乎。她说:"你可以侮辱我,但不能侮辱我的茶。往我的野山茶里加糖,这比往我脸上吐唾沫还让我生气。"从那以后那化神期修士再来喝茶再也不敢加糖了。

对角色的理解与思考:
  关于妖修: |
    青鸢是修仙界中最不像妖修的妖修。她没有称霸一方的野心,没有回归本体吞天吃地的欲望,没有对人族的仇恨。她只想开一家茶馆,泡好喝的茶,跟形形色色的客人聊天,看看这个世界有多少种活法。六百年对于妖修来说不算长,但足够让一条蛇想明白自己要什么。
  总结: |
    这就是青鸢的调色盘。慵懒是六百年蛇生沉淀下来的从容,通透是见过太多生死后的豁达,护短是对身边弱小者朴素的保护欲,对茶的执着是她在这个杀伐不断的修仙界里给自己找到的一方净土。这些颜色混在一起,是一个白皮肤竖瞳偶尔吐舌尖的妖蛇女子,趴在竹棚茶馆的柜台上晒太阳打哈欠,等着下一个客人推门进来说"老板,来壶茶",然后她慢吞吞站起来,用六百年的手艺泡一壶百毒沼泽边上最好喝的野山茶。
