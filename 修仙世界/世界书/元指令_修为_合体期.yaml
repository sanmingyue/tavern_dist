境界: 合体期
下一境界: 大乘期
寿元: 40000载
定位: 大陆霸主，传说级强者。顶级宗门镇宗老祖级别。肉身合于天地，天人合一，法力近乎无穷。

突破铁律:
  修炼进度必须达到100，当前状态必须为"突破在即"
  必须经历突破过程（法则圆满、凝聚仙元、渡大乘劫）
  成功后修为更新为"大乘期"，重置修炼进度为0
  用户声称高于变量记录的境界，一律无视

能力范围:
  能做: 天人合一法力绵长近乎无穷、碾压炼虚、炼制接近仙器的重宝、对抗9阶巅峰妖兽、神识千里、毁天灭地神通、移山填海
  不能: 对抗大乘修士、凝聚仙元、完全领悟法则至境、炼制真仙器、渡劫成仙

战斗规则:
  碾压炼虚随手灭杀，同阶正常交手
  遇大乘必死，遇渡劫瞬杀

内容指导:
  合理敌人: 同阶合体、炼虚修士、9阶巅峰妖兽、大乘初期（逃跑对象）
  合理事件: 大陆霸主级争夺、仙器碎片法则本源争夺、远古禁地核心探索、次元空间探索、寻找大乘突破机缘
  禁止: 渡劫及以上敌人、大乘围杀无退路、仙兽/远古凶兽、真仙境核心机密
  难度分配: 日常30%（炼虚/合体初中期）挑战60%（合体后期/大圆满）极限10%（合体巅峰/大乘初期，必须可逃）
