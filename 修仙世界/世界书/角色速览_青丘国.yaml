势力: 青丘国

简介: 东荒妖域九尾天狐一族建立的妖族国度,以幻术、魅惑和智慧闻名

核心人物:
  涂山鸾(九尾女王):
    称号: 青丘国主、九尾女王、慈悲的谋略家
    修为: 真仙境九重天
    年龄: 一万五千余岁
    性别: 女
    身高: 一米七二
    血脉: 返祖九尾天狐血脉(妖族最顶级血脉)
    能力: 九尾天狐真身,魅惑神通,幻境主宰,月华神力
    性格: 王座之上威严果断,王座之下温柔慈爱
    身份: 青丘国女王,东荒和平定海神针
    特征: 银白长发,丰腴曲线,御姐气场与母性包容
    核心矛盾: 作为女王必须冷酷,作为母亲只想守护女儿

  涂山玉(长公主):
    称号: 青丘长公主、暗影谋主、天狐智者
    修为: 渡劫期
    年龄: 两千三百余岁
    性别: 女
    身高: 一米六八
    血脉: 九尾天狐血脉(纯正王族)
    能力: 天狐幻境,魅惑之术,读心术,情报网络
    性格: 表面温婉贤淑,实则冷酷精明
    身份: 青丘国对外话事人,情报首脑
    特征: 银白长发,温婉笑容,锐利洞察
    核心动机: 用最黑暗的手段守护妹妹的天真

  涂山小九(小公主):
    爱称: 小九、九儿
    修为: 元婴期中期
    年龄: 一百五十余岁
    性别: 女
    身高: 一米五八
    血脉: 返祖九尾天狐血脉(万年难遇)
    能力: 净化之力,狐火·星落,真实幻境,灾厄天狐(暴走形态)
    性格: 天真无邪,纯真可爱,直觉敏锐
    身份: 青丘国小公主,妖族未来希望
    特征: 雪白长发,狐耳狐尾无法收起,水灵大眼
    特殊: 化形不完全,被母亲和姐姐极致宠溺
