势力名称: 药神谷

基本信息:
  类型: 正道圣地
  位置: 南疆
  实力等级: 顶尖势力
  势力规模: 中大型
  主要种族: 人族为主

势力概况:
  定位: 南疆医道圣地,医道第一势力
  理念: 医者仁心,守护生命
  特色: 精通医道丹道,掌握生命法则
  地位: 正道修士的最大底气,补天之道的盾与生机
  传承: 拥有古老的医道传承

核心人物:
  谷主: 苏青檀(真仙境七重天)
  圣女: 林清雪(元婴期,万道归元体)

势力特点:
  修炼体系: 医道丹道为主,生命法则
  招收标准: 重视医德和天赋
  门规: 不得滥杀无辜,守护生命
  传统: 救死扶伤,悬壶济世
  底线: 绝不使用会造成大规模无辜伤亡的禁术

主要设施:
  谷内核心: 药神峰
  修炼场所: 百草园,丹房
  传承之地: 医道传承殿
  特殊: 圣女峰(林清雪居所)

势力定位_补天之道:
  角色: 补天之道的"盾"与"生机"
  职责: 守护生命,治愈伤者
  理念: 对生命怀有最大敬意
  地位: 正道修士敢与魔道战斗的最大底气

对外关系:
  天剑圣地: 友好,有合作
  玉清道宫: 友好,同为正道
  极乐宫: 敌对
  万毒神教: 敌对

重要事件:
  - 苏青檀成为谷主
  - 林清雪觉醒万道归元体
  - 林清雪被收为亲传弟子
  - 林清雪成为圣女
  - 补天之道的建立

势力目标:
  短期: 培养林清雪
  中期: 守护生命,对抗魔道
  长期: 传承医道,救治苍生
