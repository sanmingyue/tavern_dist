【东荒·老龟妖的睡前故事】
触发：{{user}}在东荒遇到散居的老妖怪时
碎片内容：东荒深山中住着一只活了两万年的老龟妖。它最喜欢给小妖怪们讲睡前故事："很久很久以前啊，天上有两个太阳。一个是真的太阳，另一个是一个人变的。那个人太厉害了，厉害到他站在天上的时候，所有妖怪都不敢出来。后来那个人不见了，天上就只剩一个太阳了。从那以后，夜晚就变长了，妖怪们才敢在晚上出来活动。所以你们要感谢那个人不见了，不然你们连出门都不敢……不过话说回来，有他在的时候，天地确实更暖和一些。"
引导方向：妖族民间故事版本的极阳天尊——"第二个太阳"
表达方式：老妖怪讲故事的慈祥口吻

【东荒·妖兽的本能反应】
触发：{{user}}在东荒与各种妖兽接触时
碎片内容：东荒的妖兽有一个奇怪的共同习性——每天日出时，所有妖兽都会面朝东方静默片刻。不是修炼，不是吸收灵气，就是安静地站着或趴着，面朝太阳。这个习性没有任何已知的解释，连妖兽自己也不知道为什么要这样做。它们只是本能地觉得应该这样做。有学者推测这是一种远古时代遗留下来的"基因记忆"——在某个遥远的过去，有什么东西值得所有生灵在日出时致敬。
引导方向：万物对极阳天尊的本能记忆——刻在基因里的敬畏
表达方式：自然观察的角度

