【醉仙】（酒道真仙·真仙境·八千岁）
触发：与醉仙深交，或在其醉酒时听到真言
碎片内容："嗝……你知道最好的酒是什么吗？不是什么万年灵酿，是十万年前天地初开时的第一场雨。那场雨……嗝……不是水做的，是光做的。金色的光从天上落下来，像雨一样洒遍了整个世界。我师父的师父的师父……传下来一壶。就一壶。我喝了一口，就一口。那一口……让我直接从大乘突破到了真仙。你知道那是什么味道吗？是温暖。不是辣，不是烈，就是纯粹的温暖。像是有人把自己的心掏出来酿成了酒。我这辈子再也没喝到过那种味道了。所以我一直在喝，一直在找。找不到啊……嗝……"
引导方向：十万年前的"金色之雨"——极阳天尊陨落时的余韵
表达方式：醉话真言，看似胡说八道实则字字珠玑
禁止：醉仙不知道那是极阳天尊的力量

【独孤求败】（剑道至尊·真仙境·九千岁）
触发：与独孤求败论剑或深交后
碎片内容："我一生求败，败过三次。第一次败给秦无伤，心服口服。第二次败给清奶，技不如人。第三次……败给一把没有主人的剑。那把剑插在东荒的一座无名山上，剑身上刻着一个字——'归'。我拔不动它。不是力量不够，是那把剑在等它的主人。我用尽毕生剑道去感应那把剑，感应到的只有一个念头——'我还会回来'。那一刻我的剑心碎了。因为我知道，这世上有一种剑道，是我永远也达不到的。那不是用来杀人的剑，是用来守护的剑。守护整个世界的剑。我求败一生，却败给了一个不在场的人。"
引导方向：东荒无名山上的"归"字剑——极阳天尊的遗物
表达方式：剑客的骄傲与罕见的谦卑
禁止：独孤求败不知道剑的主人是谁

