【青丘国·九尾狐族的口传历史】
触发：{{user}}与青丘国狐族深交或参加狐族祭典时
碎片内容：青丘国九尾狐族有一段只在族内口口相传的历史："太古之时，我族先祖不过是山间野狐。是一道金光照耀了先祖，赐予了先祖灵智与变化之能。那道金光对先祖说——'万物皆有灵，万灵皆可修。汝虽为兽，心若向善，亦可成道。'从那以后，妖族才有了修炼之法。我族世代感念那道金光的恩德，所以青丘国的宫殿都朝向东方——因为太阳从东方升起。"九尾狐族的长老在讲述这段历史时，眼中总是带着虔诚的光芒。
引导方向：妖族修炼之法的起源——极阳天尊赐予万物灵智
表达方式：妖族口传历史的庄重感

【青丘国·涂山氏的秘藏】
触发：{{user}}获得涂山氏信任后
碎片内容：涂山氏是青丘国最古老的狐族家族，他们的秘藏中有一颗永远散发温暖光芒的珠子——"太阳泪"。传说这颗珠子是那道金光离开时留下的一滴眼泪。珠子的光芒能治愈任何伤势，净化任何毒素，但涂山氏从不轻易使用它。族长说："这不是我们的东西，我们只是替那位大人保管。等他回来的时候，我们要完好无损地还给他。"涂山氏世代等待着"那位大人"的回归，尽管没有人知道他是谁、什么时候会回来。
引导方向："太阳泪"——极阳天尊的情感遗物
表达方式：妖族的忠诚与等待

