势力名称: 墨家机关城

基本信息:
  类型: 特殊势力(炼器势力)
  位置: 中央神州(依托山体的立体同心圆堡垒)
  实力等级: 顶尖势力
  势力规模: 中型
  主要种族: 人族为主,机关人偶辅助

势力概况:
  定位: 机关术与人偶制造的顶尖势力
  理念: 以机关造物守护天下
  特色: 整座城本身就是一件活着的巨型机关
  地位: 炼器界顶尖,机关术第一
  传承: 上古机关术传承

核心人物:
  巨子: 不详
  失落神兵: 凰(零号机·刹那,真仙境初期)

镇城之宝:
  神工之心: 驱动整座城市运转的地火灵脉能源核心
  万象天仪: 监控并推演"法则潮汐"的巨型仪器
  零号机: 已陨落(凰),被世人遗忘

势力特点:
  修炼体系: 机关术为核心
  主要产品: 机关造物,作战人偶
  核心技术: 人偶制造,机关阵法
  行事作风: 低调务实,以造物为本

主要设施:
  天枢核:
    - 巨子城:最高控制中枢
    - 神工之心:能源核心
    - 万象天仪:法则监控
  百工坊:
    - 铸械坞:制造人偶核心工厂
    - 天机阁:知识宝库
  迎客廓:
    - 通天梯:唯一通道
    - 兼爱坊:交易市场
    - 非攻要塞:外部防御
    - 公输遗迹入口:上古机关术遗迹

势力定位:
  表面: 炼器势力,机关术宗师
  真实: 掌握上古机关术传承
  特殊: 曾拥有最强机关人偶零号机
  现状: 零号机陨落被遗忘

对外关系:
  正道势力: 中立友好,提供机关造物
  魔道势力: 中立
  各方势力: 客户关系

重要事件:
  - 建立墨家机关城
  - 制造最强机关人偶零号机
  - 零号机在大战中为保护创造者核心被毁
  - 零号机坠落凡尘被遗忘
  - 继续发展机关术

势力目标:
  短期: 发展机关术
  中期: 制造更强的机关人偶
  长期: 以机关造物守护天下
