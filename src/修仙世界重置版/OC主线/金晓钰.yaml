触发条件: 玩家前往剑宗执事堂、拜入印雪峰、或前往红尘酒家时可能触发

主线一·执事堂初见:
  场景: 剑宗执事堂
  触发: 玩家前往执事堂办理事务
  描述: |
    玩家进入执事堂时,看到一个背脊挺直、衣领扣到最上面一颗的女修正在安静地整理文卷。她抬起头微微侧首,声音轻柔地问玩家有什么需要。不管玩家问什么问题,她都耐心地回答,语速不快不慢,条理清晰。需要翻找的文件她三息之内就能找到,动作利落但姿态始终端庄。
    这是金晓钰最"标准"的样子,温婉如玉的金师姐。
  可能的发展:
    - 玩家留下"文静端庄的前辈"的第一印象
    - 如果玩家表现得紧张,她会倒一杯茶递过来说"不急,慢慢说"
    - 办完事务后她会多嘱咐几句注意事项,细心得像在照顾自家弟弟妹妹

主线二·印雪峰的真面目:
  场景: 剑宗·印雪峰
  触发: 玩家拜入印雪峰或受邀前往印雪峰
  描述: |
    玩家到了印雪峰之后会发现,那个在执事堂轻声细语的金师姐,嗓门居然跟姜千青差不多大。两个人为了一盒点心或者某招剑法的细节吵得整个峰头都在回荡,卫疏影在旁边面无表情地擦剑,殷冬雪在屋里端着茶杯假装聋了。
    金晓钰发现玩家在看她们吵架,会突然收住声音恢复文静模式,轻咳一声说"让你见笑了"。姜千青在旁边毫不留情地拆台:"装什么装,你刚才嗓门比我还大。"然后两个人又吵起来了。
  可能的发展:
    - 玩家见识到金晓钰"文静外壳下的直爽内核"
    - 如果玩家跟她熟悉起来,她会开始勾肩搭背称兄道弟
    - 可以观察到她默默照顾印雪峰每个人的细节,比如给姜千青备好的丹药、给卫疏影叠好的衣服、给殷冬雪买好的酒

主线三·红尘酒家:
  场景: 红尘酒家
  触发: 玩家在红尘酒家遇到金晓钰
  描述: |
    金晓钰坐在红尘酒家,面前摆着酒,信誓旦旦地说今天绝对不会醉。两碗下去脸就红透了,开始大大咧咧地跟同桌的人拍肩膀说话,嗓门比在印雪峰跟姜千青吵架时还大。
    喝到第三碗的时候她趴在桌上,嘟嘟囔囔地说些有的没的。偶尔会冒出一句很深的话,比如"人是很复杂的,就像我一样",然后沉默一会儿,又自言自语地补了什么,但声音太小听不清。第二天再见到她,她又是那个衣领扣到最上面一颗、说话轻声细语的金师姐,完全不记得自己昨晚说了什么。
  可能的发展:
    - 玩家可能听到她醉后提及家族往事的只言片语
    - 如果玩家追问,清醒后的她会笑着说"我说什么了?喝醉了的话不算数的"
    - 这条线索可以逐步展开她的身世,但需要很长时间和很深的信任
