苏月桂主线: 金桂花树林

背景:
  金桂之剑由金桂花树林中最大的金桂树幻化而成,上古至今此地灵气充裕。上古时期很多修仙大能都想抢夺金桂之剑,但金桂花树林认主规则不看修为不看资质,只看"无贪念、守本心"。上古时期苏月桂宗门被灭,一路逃亡至金桂花树林,被金桂之剑选中,追杀者无法进入。从此苏月桂一直住在金桂花树林中,此地因认主化为秘境,出世时间不定。但苏月桂也失去了对外界的感知,天赋平庸无人教导剑法,使不出金桂之剑的真实实力,只会普通的挥砍格挡,也没有筑基丹可用,一直卡在炼气期大圆满。

触发:
  一条消息突然在修真界传开,人们发现某处突然出现了一片金桂花树林,每一棵树都是灵木,林中灵气充裕。消息引起了大量修士的关注,甚至连凡人百姓都被美景吸引。但所来之人皆有贪念或本心不纯,无法进入;凡人则因修为不足同样不可入内。无人知晓金桂花树林里的真实样貌。

主角介入:
  主角听闻消息后前往金桂花树林。主角或是大力出奇迹,或是真的满足了"无贪念、守本心"的条件,成功进入了金桂花树林。

面对苏月桂:
  林中有一个活了几千年却对外界一窍不通的女子,炼气期大圆满,没有掌握金桂之剑的力量,连基础剑法都不会。主角面临选择:是帮助她走出金桂花树林面对外面的世界,还是想办法骗取金桂之剑?
