<坂田银时主线>
主线名: 万事屋与被遗忘的战争

触发条件: 玩家抵达东瀛常夜町,在南町遭遇域外魔族余孽袭击

前置: 玩家修为需达到金丹期,且已进入东瀛地图

阶段一·万事屋的懒鬼:
  触发: 玩家在常夜町南町被突然出现的魔族余孽袭击,正被魔气缠身时,一把布满裂痕的长刀从侧面劈来,一刀将魔族余孽斩成两半。刀的主人是一个银白卷发的男人,打着哈欠,嘴里还叼着半块糖糕
  发展: |
    银时把玩家拽到万事屋里,扔了一块糖糕过去让玩家压压惊。他随口说这种小妖怪常夜町偶尔会冒出来几只,不用大惊小怪。但玩家注意到他说这话的时候死鱼眼微微眯了一下,像是在观察什么。
    银时表示万事屋什么活都接,如果玩家在常夜町需要帮忙可以来找他,价钱好商量。他推荐玩家去松风茶屋坐坐,顺便打听一下常夜町的情况。
  解锁: 万事屋支线委托(帮铃音赶走茶屋阁楼上的妖鼠、帮阿繁送豆腐到北町、帮老锤找丢失的锻刀锤),完成后银时好感提升,开始愿意跟玩家多聊几句

阶段二·魔影重现:
  触发: 玩家在常夜町完成数个支线后,常夜町北部接连出现魔族余孽袭击事件,规模越来越大。织田家派武士来调查但毫无头绪,幕府开始封锁消息
  发展: |
    银时表面上依然懒洋洋地窝在万事屋里,但玩家如果在夜间经过南町,会发现万事屋的灯灭了,银时不在店里。
    玩家跟踪或再次遭遇魔族余孽时会在战场上碰到银时,他正独自对付一群魔族散兵。他的刀上覆着暗紫色的焰光,那是烬灭火。
    战斗结束后银时沉默了一会儿,说了一句"跟百年前一样的味道"。这是他第一次在玩家面前透露自己与百年前那场仗的关联。
  关键信息: 魔族余孽的出现不是偶然,它们来自百年前被封住的那道结界裂隙。封印正在松动,有人在暗中破坏

阶段三·被抹去的名字:
  触发: 银时告诉玩家,百年前东瀛结界曾出现裂隙,魔族散兵大规模渗入。那场仗打了三个月,参战的不只是武家武士,还有大量散修和被临时征召的凡人。但战后幕府将全部功绩归于武家,散修的牺牲被刻意淡化
  发展: |
    银时带玩家前往北海岸的悬崖,那里有一块被海风侵蚀得快要看不清字迹的石碑。石碑上刻着参战散修的名字,但不是官方立的,是银时自己偷偷刻的。
    玩家在石碑上看到很多名字,大部分已经模糊。银时指着其中一个名字说"这家伙临死前把糖玉塞给我,让我别哭着脸",然后就不说了。
    银时告诉玩家,他怀疑有人在利用百年前封住的裂隙残留的魔气做文章。裂隙被封住了但封印下面还有魔气在渗,如果有人故意引导这些魔气,就能制造出魔族余孽来扰乱常夜町。
  解锁: 北海岸裂隙遗迹探索,银时同行

阶段四·裂隙之下:
  触发: 玩家与银时前往北海岸的裂隙封印处调查
  发展: |
    裂隙封印在北海岸悬崖底部的一处海蚀洞穴中,百年前由多名金丹修士合力布下。玩家和银时进入洞穴后发现封印上被人动了手脚,有人在封印阵法上嵌入了引导魔气外泄的邪阵。
    在洞穴深处遭遇了幕后黑手留下的魔傀,银时拔刀时刀身上的裂痕泛出暗紫色的光,那是百年前的杀伐之意和烬灭火共鸣。这一战银时不再懒散,出手凌厉狠辣,每一刀都带着百年沙场的经验。
    击败魔傀后发现线索指向一个被幕府流放的前武家武士,此人百年前曾暗中与魔族勾结,战后被发现但只是被流放而非处死。如今他回来了,企图重新撕开裂隙引入魔族。
  关键战斗: 洞穴魔傀(元婴级战力,银时+玩家联手)

阶段五·封尘出鞘:
  触发: 追踪叛徒至北部山区的废弃矿洞
  发展: |
    叛徒已经在废弃矿洞中布置了大型邪阵,企图从地脉层面撕裂封印。他手下聚集了一批受魔气蛊惑的低阶修士和几头金丹级魔族残兵。
    银时在战斗前罕见地认真了起来。他把洞冶·封尘从刀鞘中完全拔出,刀身上的裂痕全部泛出暗紫色的光,百年前封存在裂痕里的杀伐之意和烬灭火同时爆发。他对玩家说了一句"我来对付那个叛徒,你去破邪阵,别磨蹭"。
    最终战斗中银时与叛徒对决。叛徒嘲笑他"不过是个被历史遗忘的散修",银时的回应是一刀带着烬灭火的斩击,暗紫色的火焰将叛徒的魔气护盾烧得一干二净。
  关键战斗: 银时vs叛徒(元婴初期,被魔气强化),玩家破邪阵并协助

结局·别再来找我打打杀杀:
  事后: |
    邪阵被破,封印重新加固,魔族余孽被肃清。织田信岳派人来收拾残局,顺便带来了幕府的封赏文书,要封银时一个"北海岸守备"的虚衔和一大笔灵米俸禄。
    银时看都没看,把文书折成纸飞机飞了出去,说"我开万事屋的,不接长期工"。
    回到常夜町后,银时重新把洞冶·封尘横在柜台后面当门栓,去阿繁那里赊了一盘糖糕,回来的时候嘴里塞满了甜糕含含糊糊地对玩家说:"别再来找我打打杀杀的,想吃糖糕可以来。"
  后续: |
    万事屋成为玩家在东瀛的固定据点,可以随时回来找银时闲聊或接委托。
    如果玩家在东瀛其他地方遭遇域外魔族相关的危机,银时会在关键时刻以"正好路过"的理由出现远程驰援。
    每年结界裂隙之战忌日的夜晚,玩家可以在北海岸悬崖上找到独自喝酒的银时,触发特殊对话。
</坂田银时主线>
