<两仪清霜主线>
主线名: 蝶影失踪案

触发条件: 玩家在莲华镇或蝶梦谷附近活动时,听闻蝶化宗弟子近期接连失踪的消息

前置: 玩家修为需达到金丹期以上

阶段一·清霜女侠:
  触发: 玩家在莲华镇的九曲廊桥附近遭遇一伙修士欺压凡人商贩,正要出手时被一道银白色的剑气抢先。一个白裙长发的女剑修挽起袖子走到恶修面前:"欺负弱者,很有意思?"黑白双剑出鞘,三招之内将恶修全部制伏
  发展: |
    这位女剑修就是两仪清霜,以"清霜女侠"之名在中央神州行走的蝶化宗四长老。
    玩家如果在事后道谢,他会扭过头说"正好路过而已",耳根微红。如果玩家认出他是蝶化宗的人,他会稍显意外但不否认。
    通过交谈得知,他此行来莲华镇不是路过,而是在调查一件事:蝶化宗近半年来有数名外出历练的弟子失踪,失踪地点都在南境水乡附近,但找不到任何线索。

阶段二·失踪的蝶:
  触发: 玩家协助两仪清霜调查失踪弟子的去向
  发展: |
    调查过程中发现,失踪的弟子有一个共同特征:都是外出执行情报搜集任务的暗蝶阁成员,修为在筑基到金丹之间,而且都是以女装身份活动时失踪的。
    线索指向南境水乡边缘一个不起眼的小镇,镇上新开了一家"梦蝶坊",表面是高档茶楼,实际暗中从事以蝶化宗弟子为目标的绑架勾当。
    幕后黑手是一个跟合欢宗有关联的地下组织,专门掳掠容貌出众的修士,将其修为封印后贩卖到玄渊城的黑市。蝶化宗弟子因为阴阳蝶变诀修炼出的容貌格外出众,成了重点目标。
  解锁: 梦蝶坊调查(潜入茶楼搜集证据、追踪运送失踪弟子的秘密路线)

阶段三·深入虎穴:
  触发: 线索明确后,两仪清霜决定亲自潜入梦蝶坊
  发展: |
    两仪清霜以"清霜女侠"的身份前往梦蝶坊,他的容貌足以引起对方的注意。这是一步险棋,用自己做诱饵。
    玩家可以选择在暗中接应,或与他一同进入。
    梦蝶坊内部远比外表复杂,地下有一整套封印阵法和囚禁设施。失踪的蝶化宗弟子被关押在地下密室中,修为被封印,情况不妙但尚有生机。
    两仪清霜在解救弟子的过程中暴露,被梦蝶坊的元婴级打手围攻。

阶段四·两仪出鞘:
  触发: 梦蝶坊大战
  发展: |
    两仪清霜在困境中全力出手,黑白双剑齐出,两仪剑法封锁空间。他的战斗风格堂堂正正,一剑一剑地推进,阴阳剑气将敌人的阵法撕开口子。
    玩家协助两仪清霜击败梦蝶坊的打手,救出被囚禁的蝶化宗弟子。
    战斗结束后两仪清霜检查每一位被救出的师弟的伤势,嘴上说"一个个的出去也不知道小心点",手上给人渡灵力的动作温柔得不像话。
  关键战斗: 两仪清霜+玩家 vs 梦蝶坊元婴级打手及其手下

结局·真拿你没办法:
  事后: |
    失踪弟子全部救回,梦蝶坊被连根拔除,幕后与合欢宗关联的线索移交给蝶化宗宗主花千落处理。
    两仪清霜向玩家道谢时别扭得要命,脸红了半天才说出一句"这次的事,多谢了",说完立刻转身走掉。
    如果玩家追上去说什么关心的话,他会拔高音量:"吵、吵死了!笨蛋!"然后走得更快,但耳根已经红透了。
  后续: |
    两仪清霜成为玩家在蝶化宗的联络人。
    后续在南境水乡活动时有概率在莲华镇或蝶梦谷附近遇到他,他会假装不经意地打招呼,然后问玩家有没有什么麻烦需要帮忙,"不是我主动来找你的,正好路过而已"。
    花千落私下跟玩家说:"清霜那家伙嘴硬心软,他要是跟你说'真拿你没办法',那就是把你当自己人了。"
</两仪清霜主线>
