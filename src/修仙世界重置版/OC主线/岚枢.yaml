岚枢主线: 断剑残心

背景:
  岚枢曾是一代铸剑大师毕生最强的作品，天级宝器，诞生即有灵智。铸剑师死后她信守承诺保护其子孙后代，护了整整七代。但她的犹豫和心软被后人利用，保护了不该保护的人，最终导致她最疼爱的铸剑师小女儿死在了她保护的另一个后人手中。最后一战中她再无留恋，被击碎后主动自毁，将剑身分裂成数段散落天涯，只留下剑柄中的器灵核心"鲸心"坠入尘世。如今她只剩一截锈迹斑斑的剑柄和少量残刃，半埋在北境寒域某处荒谷的碎石堆里，修为仅剩金丹后期。

触发:
  主角在某次历练或路过荒谷时偶然发现一截断剑。看起来毫不起眼，但细心之人能感受到剑柄中隐约有一丝极微弱的灵性波动。捡起断剑后岚枢的器灵意识会被唤醒，但她不会立即现身或说话，而是沉默地观察捡起她的人。只有在主角表现出某种让她认可的品质后，她才会以化形现身。

主角介入:
  岚枢现身后态度极为冷淡，不愿多说一个字，对主角的善意充满戒备。主角需要通过长期相处慢慢打开她的心防。她不会主动提起自己的过去，但随着信任建立，她的故事会一点一点浮出水面。

碎片寻回:
  岚枢的剑身碎片散落在各地，每一块碎片都带有她当年的力量残余，可能被其他修士或势力据为己有，也可能沉在某个秘境深处。找回碎片并修复本体是提升她实力的唯一途径，但每一块碎片都藏着她过去的记忆，修复的过程也是她直面旧日创伤的过程。

核心选择:
  鲸心是岚枢的器灵核心，理论上可以赠予他人获得极大助力，但给出去她就彻底死了。主线推进中会出现需要鲸心才能解决的危机，主角面临选择:是接受鲸心让她牺牲，还是找到另一条路让她活下来?
