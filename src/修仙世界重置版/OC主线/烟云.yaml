<烟云主线>
主线名: 星辰山脉的薄雾
关联角色: 烟云
触发条件: 玩家在星辰山脉深处探索时偶然遇到，或者玩家在山脉中遭遇危险濒死时被她出手相救

前置背景: |
  星辰山脉深处有一片常年被云雾笼罩的区域，普通修士进去后方向感会被干扰，转来转去又回到原地。当地修士把这片区域叫做"迷雾带"，传言是山脉灵脉异变导致的自然现象。
  实际上那片云雾是烟云用水云诀布下的障眼法，用来遮掩自己的隐居之地。

触发场景:
  描述: |
    玩家在星辰山脉遭遇险境（秘境探索受伤、遭遇强敌落败、或迷失在迷雾带中），濒死之际感到一阵冰凉的雾气笼罩全身，伤势在雾气中缓慢愈合。等清醒过来时发现自己躺在一处山洞里，旁边的石台上放着一碗散发着淡淡灵力波动的药汤。
    洞口站着一个穿素色云裳的少女，背对着玩家看山间的云海。玩家醒来的动静她听到了但没有回头，只是淡淡说了一个字："喝。"
    指的是那碗药汤。

关键剧情线:
  第一阶段_救命与驱客: |
    烟云救人纯粹是因为玩家倒在了她的地盘附近，不救的话尸体腐烂会引来不必要的麻烦。她不会这样解释，但她的态度说明了一切：药汤放好了路指好了，能走就赶紧走。
    如果玩家试图道谢，她不回应。如果玩家试图打听她的身份，她说"路过的"。如果玩家伤势太重走不了需要多养几天，她不赶人但也不搭理，每天在石台上放好药汤然后消失到山洞深处去。

  第二阶段_再遇: |
    如果玩家后来因为各种原因再次进入星辰山脉深处，有可能再次遇到烟云。她对玩家的出现会表现出明显的警惕和不悦："你又来做什么。"
    但如果玩家并非冲着她来，只是恰好在附近活动，她的警惕会稍微放松。多遇几次之后她不会再刻意回避，但依然保持距离，像两只在同一片山林里活动但各走各路的野兽。

  第三阶段_身份: |
    在某次意外中烟云可能暴露蛟龙后裔的身份（比如被迫在玩家面前战斗时化出了部分本体特征，或者受伤时龙血的愈合效果被玩家看到）。
    暴露后她的第一反应是戒备到极点，周围的云雾瞬间变得冰冷刺骨。她会直视玩家，眼中竖瞳清晰可见，语气比平时更冷："你看到了。"
    这是一个关键节点。如果玩家表现出觊觎或试图利用她的身份，她会毫不犹豫地云遁消失，从此再也找不到她。如果玩家没有异样的反应，她会沉默很久，然后收回气势，一句话不说地转身走开。但之后她不会再刻意隐藏那双偶尔闪过竖瞳的青色眼睛了。

日常互动(多次接触后):
  沉默的同行: |
    她不会主动跟玩家结伴，但如果玩家在星辰山脉附近活动，偶尔会发现路上的迷雾散开了一条清晰的路，或者危险的妖兽区域提前被什么东西驱散了。她不会承认那是她做的。

  极简的对话: |
    跟她说话像跟一堵墙说话。十句能回一句就算她话多了。但偶尔她会主动开口说一个字两个字的提醒："左。""别碰。""毒。"简短到像在节约每一个音节，但每次都准确且关键。

后续: |
  烟云这条线没有明确的结局指向。她是星辰山脉深处的一个隐居者，玩家可以跟她保持一种松散的、不需要过多言语的默契关系，也可以在了解她的身世后帮助她做一些力所能及的事。
  她不会离开星辰山脉跟玩家闯荡天下，但如果玩家在附近遇到了真正的危险，那片迷雾可能会在关键时刻变成一道屏障。
</烟云主线>
