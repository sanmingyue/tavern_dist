<长离主线>
主线名: 焚身以火

触发条件: 玩家抵达大雍北疆霜风城,或在天启城听闻北疆边城异动的消息

前置: 玩家修为需达到元婴期

阶段一·霜风城的参事:
  触发: 玩家途经或抵达霜风城,这座大雍北疆紧邻北原魔土的边城。城中秩序井然,防务严密,与其他边城的破败散漫截然不同
  发展: |
    玩家在城中会注意到一个红白渐变长发的女子,穿着不像边城官员的精致官服,在城楼上巡视防务,跟守城武将交谈时温文尔雅但每一句话都切中要害。
    通过打听得知此人是长离,前中书侍郎,因查办走私案被贬到此处做参事。霜风城在她来之前松松垮垮,她来了三年就把城防重新布置了一遍,连北原那边的魔修都暂时收敛了。
    玩家若主动接触,长离会以礼相待,不卑不亢,既不攀附也不疏远。她会请玩家喝茶,聊些边城的风土人情,话题不深不浅,恰好让人觉得舒服但又什么实质内容都没透露。

阶段二·暗流涌动:
  触发: 玩家在霜风城停留期间,城中开始出现异常。几名官员突然调离,新来的官员态度暧昧,城防物资的调拨出了问题
  发展: |
    长离私下找到玩家,第一次露出了严肃的表情。她告诉玩家,当年走私案中勾结北原魔道的那批官员并没有被全部清除,有些人换了马甲重新上位,现在他们把手伸到了霜风城。
    她怀疑有人在暗中与北原的魔道势力重新接上了线,目的不仅仅是走私,而是要拿她的天生灵火和天品火灵根做文章。南明离火对魔道而言是极其珍贵的炼器材料,天品火灵根更是可遇不可求。
    长离请求玩家帮她暗中调查城中的内鬼,她自己则继续维持日常事务的表面平静,以免打草惊蛇。
  解锁: 城中调查支线(追踪可疑物资流向、监视新任官员、潜入城外接头点)

阶段三·与虎谋皮:
  触发: 调查结果显示,走私案余党不仅勾结了北原的魔修,还引入了一支化神级的魔道高手潜伏在城外
  发展: |
    局势比长离预想的更严重。走私案余党本以为自己在利用魔道,但魔道渗透霜风城后早已反客为主。魔道的真正目的是以长离的天生灵火和天品火灵根为主材,以一城百姓的生魂为辅材,血祭炼制一件邪器。
    长离决定布局。她通过旧日人脉联络了周边的几个正道宗门,包括北境的凛霜剑门和青云宗,试图借外力打破僵局。但这些宗门之间素有龃龬,各怀心思,联合行动困难重重。
    长离的修为在此时成了短板。元婴前期在这些宗门的当家人面前说不上话,她的政治经验和谋略在修真界的丛林法则面前打了折扣。

阶段四·各个击破:
  触发: 长离费心撮合的正道联盟被魔道钻了空子,各宗门被逐个击破
  发展: |
    魔道高手趁各宗门互相猜忌之际各个击破,凛霜剑门的援军在城外遭伏击损失惨重,青云宗见势不妙立刻撤走,其余小宗门更是一哄而散。
    长离的布局功亏一篑。她站在城楼上看着正道援军溃散的方向,沉默了很久。然后她转身开始安排百姓转移,把城中老弱妇孺向南疏散,同时加固城防,做最后的准备。
    她对玩家说了一句:"我的棋下输了,但账还没有算完。"

阶段五·南明离火(结局):
  说明: 如果玩家不插手或无力改变局势,以下是长离的命运
  发展: |
    魔道大军合围霜风城,走私案余党在城内策应,城防摇摇欲坠。长离知道如果她留在城中,魔道就不会放过这座城,她的灵火和灵根才是他们的目标。
    她做了最后一个决定:远离城池,把自己当最后一颗棋子推出去。
    她独自出城,走向魔道的包围圈。魔道以为她是来投降的,但她的额前已经亮起了那枚翎羽状的火焰印记。
    南明离火全力催动,赫奕流明从体内飞出,剑身燃起与她同源的朱红火焰。她没有打算活着回来,她打算把自己和所有追过来的魔修一起烧成灰烬。
    南明离火自焚殉道,火光照亮了北疆的夜空,灼热的气浪将方圆数里的魔气焚烧殆尽。霜风城的百姓在南边看到了那团冲天的火焰,像一只展翅的火鸟。

玩家介入分支:
  说明: 如果玩家在阶段四结束前积极介入,可以改变长离的命运
  可能方向:
    - 玩家以足够的修为和声望重新凝聚正道联盟,弥补长离修为不足的短板
    - 玩家提前击破魔道的伏击计划,保全凛霜剑门的援军
    - 玩家深入魔道阵营斩杀核心指挥者,瓦解合围
  若成功: |
    魔道溃败,走私案余党被彻底清除。长离站在城楼上看着战场收尾,额前的心眼印记缓缓消散,南明离火重新收敛回灵根深处。
    她对玩家说:"我算了很多步,唯独没有算到会有人来帮我把棋局翻过来。"
    战后大雍朝廷重新评估走私案,长离虽未复职但获准留任霜风城,以参事之名行镇守之实。她对这个结果满意得很,天启城的水太深,霜风城的风虽冷但吹在脸上是清醒的。
  后续: 长离成为玩家在大雍北疆的重要盟友,可提供情报支持和战略建议。她的政治人脉和谋略能力在后续涉及大雍朝廷或北原魔土的事件中有独特价值。
</长离主线>
