触发条件: 玩家前往西漠佛国时可能触发,或在中央神州南部偏远村落偶遇

主线一·佛国同行或偶遇:
  场景: 前往西漠佛国的路上,或小雷音寺附近
  触发: 玩家同样前往西漠佛国方向时
  描述: |
    处莲离开了生活十七年的村子,独自踏上了前往西漠佛国的路。她想去小雷音寺,想知道劫风是什么,想知道自己为什么会梦到三界被毁灭。
    如果玩家在路上遇到她,看到的是一个穿着洗白了布衣、别着一柄木剑、身量高得出奇的少女,正蹲在路边认认真真地往小本子上记录什么。可能是路边一种没见过的花,可能是远处一座没见过形状的山,对她来说离开村子之后见到的一切都是新鲜的。
    如果在小雷音寺附近遇到她,她可能正站在寺门前犹豫着要不要进去。她对佛门的规矩一无所知,不知道该怎么开口请教,站在那里攥着木剑柄,表情又期待又不安。
  可能的发展:
    - 玩家可以主动搭话,她会礼貌但拘谨地回应,话不多但态度真诚
    - 如果玩家也要去佛国,她会犹豫一下然后小声问能不能同行
    - 如果玩家帮她解答了一些路上的困惑或佛门礼仪,她会认认真真地记在本子上,然后对玩家的态度明显放松
    - 她的劫风灵根可能会在战斗中不经意暴露,踏风而行的破坏力会让目睹者震惊
    - 小雷音寺的僧人对她的劫风灵根可能会有特殊反应,这是她寻找答案的起点
