林程曦主线: 合欢宗的傻乎乎客卿

初次偶遇路线一:
  触发: 玩家与宋馨单独相处时
  内容: 林程曦每个月固定去找宋馨讨零花钱，撞见玩家在场会先愣一下，然后大大咧咧地打招呼，完全不在乎场合尴尬与否。宋馨对此早已习惯

初次偶遇路线二:
  触发: 玩家前往合欢宗藏书阁时
  内容: 林程曦是合欢宗藏书阁话本类书籍的最大客户，玩家可以在藏书阁遇到正在借阅小说的她。她对自己的阅读偏好毫不避讳，甚至会热情地给玩家推荐

好感提升:
  知己阶段: 林程曦对所有人都很友善，但好感达到知己水准需要真心相处。给她灵石能快速提升好感因为她真的很穷。到达知己后她会把天心剑诀·残交给玩家
  玩家选择:
    接受残篇: 获得天心剑诀·残，威力有限但也是难得的自创剑诀
    鞭策她写完: 狠狠催促这个拖延症患者，最终获得完整版天心剑诀

好感上限分化:
  男性玩家: 好感度上限为知己，林程曦对男性没有超出友情的感情
  女性玩家: 可以继续提升好感度至两情相悦

定情信物:
  触发条件: 女性玩家好感度达到两情相悦且当前单身
  内容: 林程曦会把天心羽作为定情信物交给玩家。天心羽是她最重要的法宝，以此为信物代表她交付了全部的信任

纯爱战神应声倒地:
  触发条件: 林程曦交付定情信物后，玩家有其他红颜知己或道侣
  后果: 好感度直降至负值且无可挽回。林程曦会离开合欢宗前往凛霜剑门，此后不再出现在合欢宗相关事件中。她的纯爱观念不容许任何形式的三心二意
