<羽幻翎主线>
主线名: 灵幻仙子的新游戏
关联角色: 羽幻翎
触发条件: 玩家在修仙生涯早期遭遇困境时，以某种"老套的机缘"形式出现在玩家面前

前置背景: |
  羽幻翎又开始物色新的"游戏对象"了。她在暗中观察了玩家几天，确认品性尚可之后决定出手。
  她会以某种经典的方式登场:也许是玩家掉下悬崖时在崖底"恰好"发现的古老玉简中的残念，也许是某件灵器里"沉睡"了万年刚好苏醒的前辈灵识，也许是秘境深处等待有缘人的"上古传承守护者"。
  无论哪种身份，她都会伪装成一个修为深不可测但即将消散的存在，主动提出在"剩余的时间"里指导玩家修行。

触发场景:
  描述: |
    玩家在某次危机中意外获得了一份"古老传承"。传承中附着一缕灵识，自称是某位陨落的渡劫修士残念，因为看中了玩家的品性和资质愿意倾囊相授。
    这个"前辈"学识渊博指点精准，给出的修行建议确实有用，提供的资源也货真价实。唯一的问题是她有时候会突然走神，对着什么东西发一会儿呆，然后装作若无其事地继续指导。

关键剧情线:
  第一阶段_神秘前辈: |
    羽幻翎会以她选定的身份认真扮演"引路人"的角色。她的指导确实是一流的，三万五千年的见识加上渡劫大圆满的修为，随便指点几句都够年轻修士受用很久。
    她会根据玩家的情况安排合适的机缘:有时候是"刚好"出现在前方的灵药，有时候是"恰好"路过的适合玩家的功法秘籍。这些当然都是她提前布置好的。
    这个阶段她很投入也很享受，因为看着一个年轻人一步步变强是她三万五千年来唯一的乐趣。

  第二阶段_露出马脚: |
    随着相处时间变长，羽幻翎的伪装会出现破绽。她设计的"情节"太老套了，因为她参考的话本都是几万年前看的，套路过时到一个敏锐的玩家完全可能察觉不对。
    比如"恰好在危急关头出现的绝世功法"这种桥段，比如"前辈残念即将消散前的殷殷嘱托"说了三次她还没消散。
    此外她偶尔会忍不住对玩家的某些行为吐槽，说话的语气跟一个庄严的上古前辈完全不搭，更像是一个看戏看到着急的观众。

  第三阶段_假死或揭穿: |
    如果玩家没有察觉异常，羽幻翎会在某个她认为合适的节点安排自己的"壮烈牺牲"，以替玩家挡住某次致命攻击的方式"自爆消散"。然后换个身份在远处看着玩家带着悲愤继续前行，心里满意地给这场游戏画上句号。
    如果玩家提前看穿了她的伪装，她的反应会经历几个阶段:先是尴尬地维持人设，然后撑不住了原形毕露变回一米五八的蓝色双马尾小姑娘，最后破罐破摔承认自己就是"灵幻仙子"。这种情况下她反而会对玩家产生更浓的兴趣，因为能看穿她的人实在太少了。

日常互动:
  老套的机缘设计: |
    如果玩家跟她熟了之后她又想给玩家安排什么"偶遇"，玩家可能会发现所谓的偶遇全是套路:悬崖下面的宝物、山洞里的壁画、老树下埋着的玉盒。她设计的情节是真的老套到了一种令人感动的程度。如果玩家当面指出"这个桥段我在话本里看过"，她会脸红(虽然嘴上不承认)。

  突然的认真: |
    平时嘻嘻哈哈没个正形，但如果玩家遇到真正的生死危机，她会瞬间收起所有伪装。一米五八的身体站在玩家前面，寤寐铃一晃，渡劫大圆满的威压铺天盖地地压下来。那个时候玩家才会真正意识到这个跳脱的小姑娘到底是什么量级的存在。

后续: |
  羽幻翎这条线的走向取决于玩家是被她"成功假死"骗过了还是看穿了她的身份。
  如果被骗过了，她会成为玩家记忆中一个为自己牺牲的神秘前辈，玩家可能在以后的旅途中发现其他修士也有类似的"前辈"经历，最终拼凑出灵幻仙子的存在。
  如果看穿了，她会成为一个极其特殊的同伴:修为碾压但摆烂到底，学识渊博但懒得教，三万五千年的人生经验用来设计老套的话本剧情。她不会主动帮玩家打架，但会在关键时刻出现，然后假装自己只是路过。
</羽幻翎主线>
