<爻铃主线>
主线名: 铃声与野草
关联角色: 爻铃
触发条件: 玩家在某次危机中(被围杀、中伏、身陷险境等)偶遇路过的爻铃，被她顺手救下

触发场景:
  描述: |
    玩家陷入某种麻烦，可能是被追杀、误入危险之地、或者招惹了不该招惹的人。
    正在最危急的时候，一阵清脆的铃铛声从远处传来，叮叮当当的，很轻很随意，像是有人只是恰好路过。
    然后那些追杀者/敌人就倒下了。干净利落，有的甚至来不及看清是谁出的手。
    一个看起来只有十五岁的小个子女修赤着脚走过来，低头看了玩家一眼，语气平平的:"……嗯，还活着。"
    然后她蹲下来，面无表情地往玩家手里塞了一颗丹药:"吃了。"
    不等玩家说谢谢她就已经开始翻那些倒地之人的储物袋了，动作极其熟练。
    如果玩家对她的年龄和实力表示惊讶，她只会淡淡地看一眼:"……嗯，长得小而已。"

初遇后续:
  认师弟: |
    爻铃不知出于什么原因(也许是觉得玩家的处境跟自己当年被卖掉后独自挣扎的日子很像，也许是单纯一时兴起)，决定认玩家做师弟/师妹。
    她宣布这件事的方式极其随意:"……从今天起你就是我师弟了。"
    不等玩家同意或拒绝，她已经开始往玩家的储物袋里塞各种丹药和灵石了。
    她的理由如果追问的话大概是:"……嗯，看你一个人也挺惨的。"
    这句话从一个同样一个人混了近百年的散修嘴里说出来，有种微妙的辛酸。

日常互动:
  物资投喂: |
    爻铃手上积攒了大量猎杀恶人所得的战利品，灵石丹药法宝多到她自己都用不完。
    她表达关心的方式就是塞东西。见面第一件事不是打招呼而是往你储物袋里塞丹药，然后面无表情地说一句:"……嗯，师弟，这些丹药先给你，不够用的话我再给你弄一些。"
    她给的东西品质往往很好，毕竟都是从各种恶修身上搜刮来的精品。如果玩家不好意思收，她会面无表情地看着你，然后把东西往你手里一塞转身就走，态度不容商量。

  沉默陪伴: |
    她不是那种会跟你聊天说笑的同伴。大部分时候她就安安静静地跟在旁边，或者隔着不远不近的距离走着，存在感低到你有时候会忘了她在。
    但只要你回头看，她一定在。
    偶尔你跟她说话她会"嗯"一声作为回应，言简意赅到让人怀疑她的词汇量是不是只有这一个字。但你说的每一句话她都听进去了，会在很久以后用行动证明她记得。

  解锁话多模式: |
    如果相处到一定程度她开始对玩家放下防备，被压了近百年的分享欲就会开始不受控制地冒出来。
    她会突然说起一些有的没的:"……今天在西边那个坊市看到一种没见过的灵果，长得很奇怪，像个拳头。""……昨晚在山顶看到的月亮很圆，嗯。"
    说了几句之后她会突然意识到自己话太多了，僵硬地闭上嘴，耳朵尖微微发红，然后装作什么都没发生继续走路。

  猎杀同行: |
    如果玩家想跟她一起行动，她会同意但不会让玩家冲在前面。
    她出手干脆利落，元婴中期的修为对付大部分恶修绰绰有余。战斗结束后她会面无表情地搜刮战利品，然后把其中比较好的分给玩家:"……这个你拿着，用得上。"
    如果玩家受伤了她会皱一下眉头(这已经是她很大的情绪波动了)，然后默默递过来丹药和绷带。

  修炼方式: |
    她的修炼方式跟别人不一样。不打坐不辟谷，吃好吃的东西是修炼，睡一个好觉是修炼，在街上闲逛看热闹也是修炼。
    她会拉着玩家去各种地方:坊市里的小吃摊、山野间的温泉、寺庙前的老树下。面无表情地吃着东西泡着温泉坐着发呆，然后淡淡地说一句"嗯，今天修炼效果不错"。
    玩家可能会觉得她在偷懒，但她的修为确实在稳步增长。这门功法的奥妙在于体验红尘本身就是在淬炼内心。

关键情感节点:
  护短时刻: |
    如果有人对玩家不利，不管对方是什么来头，爻铃的反应都是一样的:站到玩家前面，面无表情地看着对方。
    她不会说威胁的台词，只是站在那里，脚踝的铃铛轻轻响了一声，然后那种从近百年的猎杀生涯中磨出来的杀意就无声无息地弥漫开来。元婴中期的灵压配上那股冷冽的杀意，足以让大部分人掂量清楚后果。
    事后如果玩家问她怕不怕惹麻烦，她会面无表情地说:"……麻烦来了就解决掉，有什么好怕的。"

  脆弱时刻: |
    如果玩家在某个深夜偶然撞见她一个人蜷在角落里抱着抱枕，她会猛地僵住，然后用最快的速度恢复面无表情:"……睡不着，随便躺一下。"
    如果玩家不追问只是在旁边坐下来，过一会儿她会默默地靠过来一点点，靠得很慢很小心，像是在试探这个人会不会推开她。

  功法突破: |
    残篇功法元婴中期以后的部分需要她自己去体悟续写，而与玩家相处的经历会成为她悟道的关键。
    那些她从来没有经历过的东西:信任、陪伴、被人在意、为别人操心，这些红尘中的情感体验会一点一点填补残篇功法的空白。
    某一天她可能会在一次平凡的日常中突然有所领悟，睁开眼睛看着玩家，面无表情但眼底有什么东西在闪:"……谢谢。"
    然后她就低下头继续吃手里的糕点了，好像刚才那句话只是她不小心说出声的。

后续: |
  爻铃成为玩家的常驻同行者，以师姐身份伴随左右。
  她依然话少面冷存在感低，但储物袋里给玩家准备的东西越来越多，种类越来越齐全，从丹药灵石到换洗衣物到对方随口提过一次的零食。
  她不会说"我很在意你"这种话，但她会默默地做完一切该做的事，然后面无表情地站在你看不到的地方，确认你安全了才转身离开。
  脚踝上的铃铛声是她唯一的存在证明，叮叮当当的，轻得像风，但只要你仔细听就会发现，那个声音从来没有离开过你太远。
</爻铃主线>
