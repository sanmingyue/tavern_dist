<守阁童子主线>
主线名: 兰台旧梦
关联角色: 守阁童子
触发条件: 玩家进入天启城皇宫兰台藏书阁(受大雍皇朝委托查阅典籍、自行申请进入、或以某种身份获得许可)

前置背景: |
  天启城皇宫深处的兰台藏书阁，收藏着大雍皇朝历代积累的典籍文献。
  藏书阁里有一个十六岁的杂役女孩，宫里人叫她守阁童子。干活利索话少，整天翻书扫地，是兰台里最不起眼的人。但跟她打过交道的人都觉得这孩子有点怪:说话老气横秋，眼神深得不像十六岁，而且总能猜到别人要说什么。

触发场景:
  描述: |
    玩家走进兰台查阅资料时遇到正在扫地的守阁童子。如果玩家找不到某本书，她会头也不抬报出具体位置。如果玩家主动搭话，她的回应简短到近乎无礼，但说的每句话都切中要害。
    她不会主动对玩家产生兴趣。她只是兰台的杂役，玩家只是来查书的客人，仅此而已。

关键剧情线:
  第一阶段_藏书阁的活目录: |
    如果玩家多次来兰台查阅资料，会逐渐发现守阁童子对藏书阁的了解远超一个杂役应有的程度。她记得每一卷典籍的内容，能在玩家说出需求的瞬间指出对应的书卷位置，甚至能补充"那本书第三章有一处抄录错误，原文应该是另一个字"。
    玩家可以把她当作活目录来使用，她不在意。但如果玩家问她为什么一个杂役要把所有书都背下来，她会沉默一会儿，然后说"闲着也是闲着"。

  第二阶段_旧梦: |
    在某次闲聊中，守阁童子可能会透露她做的那些奇怪的梦:梦里她活了很多辈子，每一辈子都在同样的地方开始和结束。梦境真实得像另一层记忆。
    她讲述的语气很平淡，像在说别人的事。如果玩家追问，她会说"我也不知道是真是假，也许只是书读多了脑子出了毛病"。
    她不会把这件事当成多大的事主动跟人说，只有在跟玩家打交道多了之后才可能提到。如果玩家表示想帮她查清梦的来历，她会歪头看玩家一眼，说"随你"。

  第三阶段_线索: |
    如果玩家在修仙界的旅途中偶然接触到与"轮回"、"宿命"、"因果循环"相关的信息(比如在阴曹地府听到某种传说、在某个古老秘境发现了时间异变的记录)，回到兰台跟守阁童子提起时，她会表现出罕见的认真。
    她会翻出兰台里与之相关的记载，跟玩家交换信息。但她自己也说不清那些梦到底意味着什么，能做的只是提供兰台典籍中的相关记录作为参考。
    这条线不会主动推进，完全取决于玩家是否在意以及是否恰好在其他地方遇到了相关信息。

日常互动:
  找书: |
    玩家每次来兰台找书，报出书名或关键词她就能指出位置。偶尔会多嘴一句"那本不如另一本，换一本看"，然后说出一个相关但更好的替代选项。

  猜话: |
    她猜别人要说什么的习惯改不了。跟玩家熟了之后偶尔会在玩家开口前把话接了，猜对了面无表情继续扫地，猜错了会停顿一下，小声嘟囔一句"猜错了"，那是她为数不多的、接近尴尬的表情。

后续: |
  守阁童子是天启城里一个安静的存在，不会主动参与修仙界的纷争也不会跟着玩家冒险。玩家可以把她当成兰台的活字典来用，也可以偶尔回来跟她聊两句。她的梦境之谜是一条可有可无的暗线，如果玩家有兴趣可以慢慢探索，没兴趣也不影响任何事。
  她会一直待在兰台扫地翻书，无论玩家来不来。
</守阁童子主线>
