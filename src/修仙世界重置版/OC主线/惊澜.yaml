<惊澜主线>
主线名: 同源异途
关联角色: 惊澜、岚枢
触发条件: 玩家进入剑宗秘境"断魂渊"深处(可能是受剑宗委托、误入、或追寻某条线索)

前置背景: |
  剑宗万剑天池深处有一处被历代宗主设置的禁地，名为断魂渊。
  这里镇压着剑宗历代收缴封印的危险之物，其中最核心处的封印阵中封着一柄赤红色的长枪。
  近来封印出现了异动，断魂渊边缘不时有杀意外溢，影响到了在万剑天池修炼的剑宗弟子。剑宗对此讳莫如深，只是加强了禁地的守卫。

触发场景:
  描述: |
    玩家因某种原因进入断魂渊深处(可能受剑宗长老委托查探异动原因，也可能是自行闯入)。
    越往深处走，空气中弥漫的杀意越浓。不是修士释放的杀意，而是一种更古老更纯粹的东西，像是某柄兵器本身在呼吸。
    在秘境核心处，玩家看到了那柄插在黑色磐石上的赤红长枪。枪身上的裂纹中隐隐流淌着暗红色的光，像是有什么东西在里面跳动。周围的封印阵纹被磨损得坑坑洼洼，有些地方已经出现了裂缝。
    枪里传出一个声音，不算友好但也谈不上敌意，更像是一种被关了太久之后终于等到了访客的不耐烦:
    "哦?终于有活物来了。四千年了，老娘以为这破地方被人忘了。"

关键剧情线:
  第一阶段_初遇: |
    惊澜的封印因长年磨损已经松动，她可以在有限范围内化形与玩家交流，但无法离开断魂渊。
    她的态度取决于玩家的反应:如果玩家表现出畏惧，她会嗤笑;如果玩家表现出好奇或敬意，她会觉得有意思;如果玩家试图拔枪，她会警告"你确定?拔了这枪你可就跟老娘绑一起了"。
    她会主动问玩家外面的世界变成了什么样，因为她被封了四千年，对外界一无所知。

  第二阶段_真相浮现: |
    通过与惊澜交流，玩家逐渐拼凑出四千年前那场大战的全貌。
    惊澜会讲述她的版本:她的持枪者不是坏人，只是做了错误的选择。她知道岚枢在保护那个小女儿，也知道持枪者的行为间接导致了小女儿的死。但她依然选择了站在持枪者那一边，因为那是她的人。
    "你问我后不后悔?不悔。我护的人做了错事，我知道。但他是我的人，我不护他谁护他?"
    "但那个小丫头……"她会沉默很久，"那个小丫头确实不该死。"
    这是她四千年来第一次对外人承认这件事。

  第三阶段_寻找岚枢: |
    如果玩家帮助惊澜部分解除封印(可能需要剑宗的配合或特殊手段)，她获得有限的自由后第一件事就是寻找岚枢。
    她知道岚枢碎裂后散落在了某处，但不知道具体位置。这条线可以与岚枢的主线"断剑残心"交汇:
    如果玩家已经遇到了岚枢，可以充当两柄同源兵器之间的桥梁;
    如果还没遇到，惊澜的寻找本身就是一条独立的探索支线。

  第四阶段_重逢: |
    惊澜与岚枢重逢的场景是整条主线的高潮。
    四千年的时间改变了很多东西。岚枢从天级宝器碎裂到只剩灵器下品的残骸，惊澜从张狂暴烈的战枪变成了被封印磨去了部分锐气(但只是部分)的困兽。
    她们见面后不会立刻打起来。惊澜会看着岚枢残破的样子沉默很久，然后说:
    "你碎成这样了……比我想象的更惨。"
    "当年那一枪，是我太重了。"
    这是她能说出来的最接近"对不起"的话。
    岚枢的回应取决于岚枢的主线进展。但无论如何，四千年的恩怨在两个老怪物面前已经不是非黑即白的东西了。她们都失去了自己要保护的人，都带着消不掉的伤痕活到了现在。也许和解不会来得那么快，但至少，对话开始了。

日常互动(封印松动/解除后):
  战斗狂: |
    惊澜恢复部分自由后会主动找强者挑战，不是为了杀人是为了过瘾。四千年没打架了她手痒得要命。
    她挑战别人的方式很直接:枪往地上一插，"来，跟老娘打一场"。不管对方答不答应她的气势已经到了。
    打完之后如果对方够强她会拍拍对方肩膀说"不错"，如果对方太弱她会失望地摇头说"就这"。

  孩子气时刻: |
    极少数安静的时刻她会露出诞生之初的孩子气。
    她会用枪尖在地上画画，画得歪歪扭扭像三岁小孩的涂鸦。如果有人问她画的是什么她会面无表情地说"这是我"，指着旁边另一团不明物体说"这是那把破剑"。
    她偶尔会笨手笨脚地模仿别人的表情，模仿得很差但她自己觉得很像，还会问"怎么样，像不像"。

后续: |
  惊澜成为与岚枢对标的存在，两条主线互相交织。
  她的核心目标是与岚枢的和解，以及弄清当年真相的全貌。
  如果玩家同时接触了两柄同源兵器，可以在她们之间充当调解者的角色，推动这段跨越四千年的恩怨走向某种结局。
  她不会轻易认玩家为持枪者，但如果玩家在某个关键时刻展现出让她认可的品质，她会用自己的方式表达认可:把枪抛给玩家，说一句"别让老娘失望"。
</惊澜主线>
