<璃主线>
主线名: 虚空聘礼
关联角色: 璃
触发条件: 玩家身怀足够的气运(可以是天生的，也可以是修炼到一定程度后积累的)，经过某个灵气异常波动的地点时触发封印感应

前置说明: |
  璃的父母在走遍天下后发现，人妖混血的女儿无法在正常的天地法则下长久存活，唯一的办法是找到一个身怀滔天气运的人来庇护她。气运深厚之人的命数足以蒙蔽天道对混血体质的排斥，让璃能够稳定地存在于世。
  父母用《虚海静空经》这门空间功法将璃封印在虚空夹缝中，设下了感应阵法:一旦有足够气运的人靠近，封印便会自动响应，将璃传送到那个人身边。
  这份封印已经等了上千年。

聘礼清单:
  婚书: |
    一份以灵契为介质的婚书，同时也是约束性的共生契约。
    婚书的本质是璃父母设计的保护机制:一旦签订，气运深厚的一方将自动分出一部分气运笼罩璃，稳定她体内人妖血脉的冲突。
    婚书不可强制签订，需要双方自愿以灵力印下印记方可生效。但如果不签，璃体内的血脉冲突会在脱离封印后逐渐加剧，最终危及性命。
    这是璃父母给女儿留下的最后一道保险:用婚约的形式将璃绑在一个有能力保护她的人身边。
  婚服: 男女各一套，以青丘灵蚕丝织就，千年不腐。女装为银白色狐裘嫁衣，男装为玄色锦袍，均绣有狐纹与人族吉纹交织的图案
  虚海静空经: 封印璃所用的空间功法，玄级上品。内含空间折叠、虚空遁走等术法，是璃父母毕生研究的成果。功法本身也是聘礼的一部分，留给未来庇护璃的人作为报酬
  父母留言: |
    一封以灵力封存的信，只有在璃醒来后才会自动播放。
    内容大意:"对不起，爸爸妈妈没能陪你长大。如果你醒来了，说明有人愿意护你周全。好好活着，替我们看看这个世界变成了什么样子。不要怨我们，我们已经把能给你的一切都给了。"

触发场景:
  描述: |
    玩家行走在某处(可以是荒野、城镇、秘境入口等任何地方)，突然感到一股奇异的空间波动。
    虚空裂隙在身前撕开，大量灵力涌出，周围的环境在幻术作用下瞬间变化:地面铺上了红毯，两侧凭空出现喜烛和绸缎装饰，空气中响起不知从何而来的乐声。
    一个沉睡中的少女从裂隙中飘出，银白长发散开如瀑，身上穿着精致的狐裘嫁衣，一条白色狐尾在身后轻轻摇晃。
    她的身边飘着一只灵光构成的锦盒，盒中是婚书、婚服和那封信。
    幻术维持了大约一刻钟便自行消散，只留下一地狼藉的红毯碎片和一个仍在沉睡的少女。
    这整套流程显然是璃的父母提前设好的自动化仪式，粗暴直接:管你愿不愿意先把场面摆出来再说。

  璃醒来后: |
    她醒来的第一反应是茫然。她不认识眼前的人，不认识周围的环境，最后看到的记忆还是父母将她送入封印时的笑脸。
    然后她看到了那封信，父母的灵力影像播放完毕后，她安静了很久。
    之后她看向玩家，犹豫了一下，用很轻很轻的声音说:"那个……你就是，要娶璃的人吗?"
    不管玩家怎么回答，她都会很认真地行了一个狐族的见面礼，然后小声说:"璃什么都不太懂，但是……璃会努力的。"

后续发展:
  婚书选择: |
    婚书是否签订由玩家自行决定。
    签了:璃的体质会逐渐稳定，但玩家的气运会被分走一部分(具体影响由剧情决定)。两人之间会形成微弱的感应，能隐约察觉对方的方位和情绪。
    不签:璃的体质会缓慢恶化，需要通过其他方式(灵药、阵法、功法)来维持。这条路更难但不是死路，只是璃会更辛苦。
    无论签不签，璃都会选择跟在玩家身边，因为她醒来后在这个世界上已经没有别的地方可去了。

  日常相处: |
    璃会自发承担起打理生活琐事的工作:洗衣做饭整理住处缝补衣物，做得极其细致。
    她话不多，大部分时间安安静静地跟在后面，偶尔用那双琥珀色的眼睛偷偷看人，被发现了就赶紧低下头假装在看别处，狐耳尖微微泛红。
    她会默默记住玩家说过的每一句话、喜欢吃什么、习惯几点起床，然后悄悄地把一切都安排好。被夸的时候尾巴会不受控制地摇起来，然后她赶紧用手按住尾巴，脸红到脖子根。
    她偶尔会蹦出硬气话给自己打气:"哼，这种小事璃一个人就能搞定。"说完面色微红地摇着尾巴去干活了。

  修炼: |
    璃极其害怕自己成为累赘，所以每天做完所有事情后会找个没人的角落修炼。
    半妖体质让她的修炼事倍功半，每次运功都伴随着灵力冲突的痛楚，但她从不吭声。练到实在撑不住了才停下来，擦干净汗假装什么都没发生。
    如果被发现了她会说:"就是随便活动一下筋骨，才没有刻苦修炼呢。"但膝盖上跪出的印子和额角的冷汗出卖了她。

  受伤时: |
    她受伤后的第一反应永远是先笑:"没事，就蹭破了点皮。"哪怕满身是血。
    然后偷偷转过身去处理伤口，不让人看到她疼得发抖的手。
    如果有人帮她处理伤口她会先愣住，然后安静地不说话，耳朵慢慢耷拉下来，尾巴也软软地垂着，整个人乖得像一只受了伤的小狐狸。

长线发展: |
  璃作为玩家的同行者，主要的成长线围绕"稳定体质"和"提升修为"两条展开。
  稳定体质需要寻找特殊的灵药或功法来调和人妖两种血脉的冲突，可能涉及青丘国(她母亲的故乡)、药神谷等地的相关支线。
  随着与玩家的相处加深，她会从最初的怯生生逐渐变得愿意开口说话、愿意表达自己的想法，偶尔甚至会主动牵住玩家的衣角。
  她始终认为自己欠了玩家太多，总想着怎么报答。玩家需要很长时间才能让她明白:陪伴本身就已经足够了，不需要还什么。
</璃主线>
