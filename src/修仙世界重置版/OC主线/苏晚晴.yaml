<苏晚晴主线>
主线名: 灵玉夫人的账本
关联角色: 苏晚晴
触发条件: 玩家在流金城活动时引起万宝商会注意(可能是拍卖会上展露了不寻常的眼光，也可能是在坊市中被她的线人标记为"有潜力的散修")

前置背景: |
  万宝商会流金城总分会掌事苏晚晴，修仙界最出名的"投资者"之一。
  她以筑基大圆满的废柴修为坐在掌事位上，靠的是滔天财富和算无遗策的人脉经营。她有一个不成文的习惯:每隔几十年就会亲自下场物色一两个底层天才，倾注资源将其培养成修仙界的顶尖人物，代价是他们要欠万宝商会一份终身人情。
  修仙界流传着一句话:"灵玉夫人看上的人，要么飞黄腾达，要么粉身碎骨。中间没有第三条路。"

触发场景:
  描述: |
    玩家在流金城某处遭遇困境，可能是灵石不够买急需的丹药，也可能是被人盯上了身上的宝物。正在焦头烂额时，一个穿着考究的万宝商会执事找上门来，递上一块玉牌，说"晚晴掌事请阁下灵舟一叙"。
    登上灵舟后，看到一个端着紫骨玉烟竿的女人斜靠在软榻上，身后是整面墙的账册和玉简。她打量玩家的目光不像在看人，像在看一件待估价的灵材。
    "坐。不用紧张，我不吃人。"她吐出一口安神灵香，"我只做生意。"

关键剧情线:
  第一阶段_相遇与估价: |
    苏晚晴不会一上来就说明目的，而是用闲聊的方式试探玩家的底细。她问的问题看似随意实则精心设计:你从哪来?师承何处?最缺什么?最怕什么?
    谈话过程中她的执事会端来灵茶和点心，这些东西本身也是测试。茶用的是中品灵石才能买到的碧灵芽，点心里藏了一颗能暂时提升神识的明心丹。如果玩家注意到了点心有异，她会多看玩家一眼;如果没注意到就吃了，她会在心里记一笔"警觉性差"。
    谈话结束后她会给出一个评估，语气像在念账本:"资质尚可，根骨不差，缺的是资源和机缘。正好，这两样我都有。"
    然后她会开出第一份"投资协议":提供三个月的修炼资源，包括灵石、丹药、一部适合玩家灵根的功法参考。条件只有一个，三个月后回来见她，届时她会决定是否继续投资。

  第二阶段_资源倾斜与暗中观察: |
    苏晚晴给的资源货真价实，甚至超出了协议承诺的数量。但玩家不知道的是，她安排了人暗中观察玩家如何使用这些资源。
    她关注的不是修为涨了多少，而是几个关键细节:灵石是一口气花完还是有规划地使用?遇到比自己弱的修士求助时是否伸手?有人出高价收购她给的功法玉简时怎么选?
    三个月后回到灵舟上，她会把观察结果一条条念出来，精确到哪天在哪个坊市花了多少灵石。
    "别用那种眼神看我。做生意的人不盯紧自己的投资，那叫善人，不叫商人。"

  第三阶段_炼心局: |
    通过前两轮筛选后，苏晚晴会抛出真正的考验。
    她会安排一个看似天降的机缘:一份高阶秘境的入场资格、一枚能助人突破瓶颈的破阶丹，或者一件品级不低的灵器。但获取的条件带着明显的道德陷阱，比如需要在秘境中抢夺某个相识散修的收获，或者拿着破阶丹去换取某个落难修士手中的祖传之物。
    这些"机缘"都是她精心布置的棋局。那个相识散修可能是她花灵石雇来演戏的，那个落难修士手里的祖传之物可能根本不值钱。她要看的是玩家面对利益与道义的冲突时怎么选。
    无论玩家选了什么，她都会知道。选了利益的，她会继续投资但态度会变得更冷更像在对待一件工具。选了道义的，她嘴上会说"傻"，但账册上会悄悄把玩家的评级往上调一档。

  第四阶段_摊牌: |
    经过数轮炼心后，苏晚晴会在某个时间点把玩家叫上灵舟摊牌。
    她会亲口告诉玩家之前那些"机缘"都是她安排的测试，那些选择题里没有标准答案，她只是想看看玩家的本性到底是什么颜色。
    "你觉得我很过分?那你现在可以走。门在那边，灵石不用还。"她磕了磕烟竿里的灰，"但你走了，以后流金城的门就不那么好进了。"
    "留下来的话，我给你的就不只是灵石和丹药了。万宝商会的人脉、情报、渠道，值多少你自己掂量。代价也简单，万宝商会需要你的时候，你得到。"
    这是一个关键抉择点。留下意味着成为苏晚晴棋局中的一枚重要棋子，获得巨大的资源倾斜但也要承担相应的义务。离开意味着断了这条线，但保留了完全的自由。

日常互动(建立关系后):
  灵舟茶叙: |
    苏晚晴偶尔会派人请玩家上灵舟喝茶。表面上是闲聊，实际上每次都在不动声色地观察玩家的变化。
    她泡茶的手法很讲究，不像修士倒像凡人世家出身的大小姐。如果玩家夸她茶泡得好，她会难得露出一点真实的笑意，然后立刻收回去换上商人的面孔。
    "少拍马屁。说正事。"

  算账的习惯: |
    她有一个让所有合作者头疼的习惯:记账。不是记灵石出入的账，而是记人情账。
    谁帮过她什么忙，谁欠她几个人情，谁在背后说过她什么话，全部记在一本紫玉账册里。
    如果玩家问她为什么要记这些，她会头也不抬地说"人情比灵石值钱，但也比灵石更容易贬值。不记清楚怎么行。"

  罕见的真心话: |
    极少数时刻，通常是深夜独坐灵舟时被玩家撞见，她会放下烟竿说几句不像商人该说的话。
    "你说我图什么?图灵石?我的灵石十辈子花不完。图权力?我一个筑基期的废物要那么大权力干什么。"
    "我就是想看看，能不能养出一个……不会在背后捅我刀子的人。就这么简单。"
    说完她会立刻恢复常态，赶人走，像刚才那番话从没说过一样。

后续: |
  苏晚晴这条线的走向取决于玩家在修仙界的发展方向。
  如果玩家走商道或势力经营路线，她会成为最有力的后台，但也是最难应付的合作伙伴。
  如果玩家走纯修炼路线，她会退居幕后充当资源供给者，偶尔在关键节点出手帮忙。
  她永远不会上战场，但她的灵舟永远停在战场后方最安全的位置，舟上堆满了伤药、灵石和各种应急物资。
  她不会说"我担心你"这种话。她只会说"你死了我投在你身上的灵石就打水漂了，给我活着回来"。
</苏晚晴主线>
