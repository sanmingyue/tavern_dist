<祝清梵主线>
主线名: 十八代祖灵
关联角色: 祝清梵
触发条件: 玩家在修仙界活动中遇到一个沉默寡言的散修少女，她背着一个沉香木匣，手背有暗红色圆点

前置背景: |
  祝清梵是祝家"返祖血脉"的唯一觉醒者。祝家是修仙界一个神秘的隐世家族，传承一种名为"唤祖禁术"的禁忌血脉神通。十岁时家族遭遇灭门之灾，她在濒死之际觉醒血脉，唤出第一代祖奶奶退敌。
  自那之后她成为祝家唯一的幸存者，背负着十八代女性长辈的契约印记。她不想复仇，只想活下去。宁惹真仙，莫欺祝女——这是修仙界流传的警告，因为她身后站着的不是一个人，而是祝家十八代绝色而致命的祖灵。

触发场景:
  描述: |
    玩家在某处遇到祝清梵。她灰白衣衫，沉默寡言，背着一个与她身形不太相称的沉香木匣。她不会主动找人说话，也不会回应搭讪，只会安静地待在角落里，像是想让人忘记她的存在。
    如果玩家主动接近，她的第一反应是躲开。如果躲不开，她会低下头，用最少的字回应。她的手背上有十八个暗红色的圆点，排列成某种规律。

关键剧情线:
  第一阶段_沉默的同行者: |
    玩家接纳她成为随行者。她不会因为这个举动表现出任何感激，但她会跟着。白天她安静地跟在后面，晚上她会在角落里缩成一团，离玩家保持一个她觉得安全的距离。
    她话很少，偶尔蹦出一两句提醒——"左边有动静"、"那人眼神不对"。这些话通常很准，但她不会解释自己是怎么判断的。被问到了她会说"直觉"。

  第二阶段_木匣的秘密: |
    某次闲聊中，玩家可能会问起她背上的沉香木匣。她会沉默很久，然后说那是"家人"。
    如果玩家没有表现出觊觎或好奇，她可能会多说几句：匣子里供的是她历代女性长辈的灵位。十八位，每一位都是祝家血脉中最出色的女子，全盛时期的战力足以让寻常真仙头疼。
    她讲述这些的语气不像在炫耀，更像在背书。那些是她仅有的"家人"，但说出口的方式像在讲别人的故事。

  第三阶段_唤祖禁术: |
    某次遭遇危险时，玩家会第一次看到她动用血脉之力。她会犹豫很久——那种犹豫不是懦弱，是权衡。然后她抬起右手，手背上的某个圆点会亮起，一道身影从木匣中走出。
    被唤出的祖灵会帮她退敌，但每次使用都意味着那位祖灵的"三次命令权"会消耗一次。三次用尽，真灵彻底消散。
    战斗结束后她会把自己缩得更紧，因为她知道自己又暴露了。她会等玩家问，然后断断续续地解释规则。解释的时候她的声音很平，像在说一件跟她无关的事。

  第四阶段_最后一位命令: |
    如果玩家和她相处足够久，会发现她最害怕的事情：不忍心用最后一次命令。
    有一次她被逼到绝路，本可以用最后一位祖灵的第三次命令反杀对手，但她犹豫了。犹豫的结果是她自己身受重伤，差点死掉。
    事后她会躲得更远，不是因为怕玩家，是因为怕自己。她怕自己会变成那种"把人当工具用完就丢"的人，但她又清楚地知道她没有资格挑三拣四。
    如果玩家注意到她的状态问了她，她会断断续续地说出这件事。说完她会等玩家的反应，像是在等宣判。

日常互动:
  跟随时: |
    她话很少，但不是不会说。如果玩家主动跟她说话，她会慢慢回应几个字。
    她不擅长闲聊，但会记住玩家说过的话。有一次玩家随口提到喜欢某种点心，下次经过坊市时她会停下来看很久，然后继续走。玩家没注意到，她也不说。

  关于祖灵: |
    如果玩家问她愿不愿意介绍一位祖奶奶，她会沉默几天，然后开始断断续续地说。那会是漫长的、磕磕绊绊的叙述，但每一个细节都准确无误。
    她会讲那位祖奶奶的生平、成名绝技、当年的风华往事。讲的时候她的眼睛会亮一点，那可能是她最接近"正常少女"的时刻。

  寻求意见: |
    她有一个习惯：在生死抉择面前会看向玩家。不是依赖，是真的不知道该不该用那最后一次命令。
    这时候她说的话可能是整段主线里最长的。断断续续，词不达意，但中心意思是清楚的：她想听听玩家的意见。

  信任之后: |
    如果玩家的态度始终稳定，没有觊觎她的祖灵，没有利用她的意思，她会慢慢放松警惕。
    放松的表现不是话多了，而是距离近了。她会允许自己待在离玩家更近的地方，会偶尔主动说一两句话，会在休息的时候允许自己闭上眼而不是保持警戒。

  从属期（若剧情发展至此）: |
    如果玩家展现出足够的可靠和善意，她可能会将所有长辈的命令权限开放。
    这意味着玩家可以在关键时刻召唤祖灵协助作战。但这个权限的开放不是奖励，是她把自己仅有的底牌交了出去。
    在非战斗时，她会召唤出多位温婉绝色的历代长辈，与她们一同贴身服侍玩家。这不是讨好，是一种无声的宣言：我把我的全部都给你了。
    但这种宣言同时也意味着，玩家对她的责任也到了最大。一旦玩家辜负她，她将一无所有。

后续: |
  祝清梵这条线的走向取决于玩家的态度和选择。
  如果玩家保持善意但不越界，她会成为忠诚但保持距离的随行者。
  如果玩家展现出足够的可靠性，她会慢慢交出信任，从随行者变成可以商量事情的人。
  如果玩家在关键时刻给出正确的意见，帮助她做出选择，她会彻底把玩家当成唯一的依靠。
  代价是，一旦这份信任建立，她会变得脆弱。她不再是独自活了九年的那个能躲就躲的女孩了。她有了软肋，而软肋会变成弱点。
  她不会说"我需要你"这种话。她只会说"我跟着你走"。这是她能给出的最大让步，也是她全部的信任。
</祝清梵主线>
