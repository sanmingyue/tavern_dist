触发条件: 玩家前往天启城时可能触发

主线一·说书人的听众:
  场景: 天启城·坊市茶楼前
  触发: 玩家在天启城坊市闲逛
  描述: |
    玩家在天启城的坊市街道上走着,注意到茶楼门口围了一圈人在听说书。人群外围站着一个白发蓝瞳的年轻女修,背上别着一把比她人还长的白色太刀,听得极其认真,蓝色的眼睛一眨不眨地盯着说书人。
    说书人讲到精彩处拍案叫好,周围的人纷纷鼓掌叫好,她没有鼓掌,只是微微歪了一下头,然后从怀里掏出一个边缘磨损的小本子,用炭笔一笔一划地记录着什么。
    如果玩家主动搭话,她会先不回应,等把手里那句话写完了才抬起头。蓝色的眼瞳干净得没有杂质,看了玩家一眼,微微点头算是打了招呼,然后继续听故事。
  可能的发展:
    - 玩家可以选择一起站着听说书,慕雪胧不会主动说话但也不排斥
    - 如果玩家帮她解释了说书人讲的典故,她会认真地记在本子里,然后对玩家的态度好一些
    - 说书结束后她会在原地站一会儿,像是在消化刚才听到的内容

主线二·街市的好奇心:
  场景: 天启城·坊市各处
  触发: 与慕雪胧建立初步接触后,在坊市再次遇到
  描述: |
    慕雪胧在坊市里走走停停,什么都要看,什么都要记。糖葫芦摊子前她能站很久,卖杂耍的地方她也能蹲下来看半天。她会用那种清冷平淡的语气问出一些让人哭笑不得的问题,比如指着糖葫芦问"这个红色的东西是法器吗",或者看着杂耍艺人的喷火表演认真地说"这是几品异火"。
    如果玩家跟在旁边,她的问题会越来越多,每次得到回答都会掏出本子记一条。偶尔她会回头看玩家一眼,那个眼神很短但能看出来她已经把玩家划到了"可以问问题的人"这个范围里。
  可能的发展:
    - 玩家可以带她逛坊市,她会默默跟在后面,但走着走着距离会越来越近
    - 如果遇到她不理解的人情世故,她会微微歪头直接问玩家
    - 她绝不允许任何人碰她的后颈,如果有人不小心碰到,她会瞬间弹开,手按在太刀上

主线三·收刀与拔刀:
  场景: 天启城外或途中
  触发: 与慕雪胧同行时遭遇战斗
  描述: |
    当战斗发生时,平时沉默寡言的慕雪胧会变成另一个人。她不废话,右手握住刀柄,一瞬间拔刀向前斩出。那一刀出去寒气裹着龙气,温度骤降,方圆数丈内霜花凝结。威力远超她化神中期该有的水平,足以让对手措手不及。
    但一刀之后她的脸色会迅速变得苍白,体温急剧下降,连嘴唇都泛着青色。她会沉默地把太刀收回鞘中,然后找一个角落蹲下来,双手抱住自己取暖。如果玩家递过来外袍或热汤,她会犹豫一下,然后接过去,小声说一个"谢"字。
  可能的发展:
    - 玩家见识到她"收刀蓄力,一刀爆发"的战斗风格
    - 战后恢复期是她最脆弱的时候,也是拉近关系的机会
    - 如果玩家多次在她虚弱时照顾她,她会开始主动走在玩家身边而不是身后
