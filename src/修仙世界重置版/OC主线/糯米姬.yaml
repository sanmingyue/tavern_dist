<糯米姬主线>
主线名: 破剑余魂
关联角色: 糯米姬
触发条件: 玩家在任意地点通过某种机缘获得断剑"墨痕"(拍卖会流拍品、坠崖奇遇、地摊捡漏、储物袋遗物等均可)，血液沾染剑身后唤醒沉睡其中的残魂

核心机制:
  剑灵绑定: |
    玩家的血液渗入断剑"墨痕"后，唤醒了沉睡其中的糯米姬残魂。
    由于神魂极度虚弱，她无法独立存续，被迫与玩家形成共生关系:剑在人在，剑毁魂散。
    这不是平等的契约，更像是寄生。她需要玩家的气血和灵力来维持残魂不灭，玩家则多了一个嘴很欠但偶尔有用的随身前辈。
    绑定后她可以实体化现身，但持续时间受残魂强度限制，初期最多维持一炷香就会被迫收回剑中休息。

  断剑"墨痕"进阶: |
    初始状态:满是缺口的锈铁条，看着连凡铁都不如。但有一个特性:绝对砍不断。不管用多大的力都无法将它折断或进一步损毁，可以当盾牌用但没有任何攻击力，连切菜都费劲。
    修复方式:需要玩家寻找各种稀有灵材金属矿石喂给断剑吞噬，用以修补剑身裂纹。每修复一个阶段，剑的威力提升，糯米姬的实体化时间延长，她能解锁的记忆和功法也更多。
    进阶限制:除了灵材之外，还受玩家自身境界制约。玩家境界太低，身体承受不住更高层次的灵压，糯米姬就算想解封更多力量也做不到。两个条件缺一不可。
    阶段参考:
      法器级(初始) → 灵器级 → 宝器级 → 道器级 → 仙器级(完全修复，遥远目标)
    每个大阶段的修复都是一段独立的支线冒险，需要寻找特定灵材，可能涉及秘境探索、势力交涉甚至上古遗迹。

  神魂附体: |
    在玩家遭遇真正的生死危机时，糯米姬可以将残魂附着在玩家身上，暂时接管身体，发挥出远超玩家当前境界的战斗力。
    附体期间玩家的外貌会出现变化:头发变长转为墨黑色，瞳色变为深黑，周身气质骤变，变得冷傲凌厉。
    副作用极大:附体结束后玩家会陷入数日的极度虚弱期，期间因为残留的阴柔魂力导致阴阳失调，可能出现体香变浓、肤质变化、声线微变等尴尬症状，持续约三天消退。
    冷却极长:糯米姬的残魂恢复速度很慢，一次附体后至少需要数月才能再次使用。
    她轻易不会动用这个能力，理由是"强者的路要自己走，本座不养废物"。

日常互动模式:
  毒舌教学: |
    糯米姬以"本座的修仙导师兼祖宗"自居，会在玩家修炼时进行指导。
    她的教学方式极其毒舌:"你这灵力运转方式是谁教的?猪都比你转得顺畅。""不对不对不对!丹田是用来凝气的又不是用来腌咸菜的!""本座在你这个境界的时候三天就突破了，你三个月还卡在这里，丢不丢人?"
    但她给的每一个建议都是对的，她的眼光和经验是真仙境以上的层次，哪怕以残魂的状态也能精准指出玩家修炼中的问题。只是说话方式让人很想把剑扔了。

  捉弄日常: |
    她的恶趣味没有上限。在玩家修炼入定时把玩家的头发编成奇怪的造型，在玩家跟别人说话时突然在脑海里冒出来吐槽，在玩家战斗时点评对手的招式"像猴子跳舞"导致玩家差点破功。
    她在玩家身边偷偷建了一个"识海小本本"，记录玩家每一次出糗被打脸或者狼狈的瞬间，扬言等玩家成仙后要公开处刑。

  甜食勒索: |
    她会以各种理由强迫玩家给她买甜食。"本座今天灵力消耗过大需要补充能量，去买桂花糕。""不买?你信不信本座在你修炼的时候唱歌?"
    如果玩家拒绝，她会控制剑身震动敲玩家的头，或者在玩家睡觉时故意制造噪音。如果玩家买了，她会一边吃一边说"凑合吧，比本座以前吃的差远了"，但嘴一直没停过。

  怕鬼名场面: |
    在经过荒野古墓或者阴气重的地方时，如果遇到低级怨灵，她会瞬间缩回剑里装死。
    如果来不及缩回去就会下意识抓住玩家，事后矢口否认。"本座只是被那东西的气味恶心到了!谁怕那种低级货色!""你要是敢跟别人说今天的事，本座就把你编成蝴蝶结造型的黑历史传遍整个修仙界!"

  看戏模式: |
    在玩家遇到异性修士(尤其是女修)的社交场合，她绝不帮忙。
    她会飘在一旁幻化出瓜子嗑，在玩家脑海里实时解说起哄。"哟，这个女修在看你呢。""她刚才是不是对你笑了?小子你行啊。""你脸红什么?一个炼气期/筑基期的小子也配脸红?"

关键剧情节点:
  第一阶段_初遇: |
    玩家获得断剑后，血液沾染唤醒了糯米姬。
    她醒来第一件事是打量玩家，然后露出嫌弃的表情:"就你?本座等了这么久，等来的就是你这种货色?"
    随后发现自己无法脱离断剑独立存在，不得不跟玩家绑定。她对此的评价是:"本座这算什么，落难凤凰不如鸡，还得靠一只小鸡仔活着。"
    这个阶段她对玩家完全是工具人态度，但已经开始不自觉地在指导玩家修炼了。

  第二阶段_磨合: |
    随着相处时间增加，她从纯粹的利用变成了习惯。她习惯了在玩家耳边叨叨，习惯了捉弄玩家，习惯了每天被买甜食。
    这个阶段会解锁她的部分记忆:她会在某些场景突然愣住，想起太古时代的一些片段。她不会主动说，但如果玩家问了，她会用轻描淡写的口吻讲述那些听起来像神话一样的往事。
    "那个时代啊?万族并存，天上飞的地下跑的水里游的都有灵智，随便一只鸟都是金丹期。比你们现在这个贫瘠的世界热闹多了。"

  第三阶段_信任: |
    某次玩家遇到真正的生死危机，糯米姬动用了神魂附体救了玩家。
    附体结束后她因为魂力消耗过大而变得极其虚弱，连实体化都做不到，只能以微弱的意识存在于剑中。
    她虚弱的时候嘴还是硬的:"别哭丧着脸……本座只是觉得你死了的话这把剑就没人温养了……工具人死了本座上哪再找一个……"
    但她攥着剑柄的手在发抖，这是她第一次让玩家看到她害怕的样子。不是怕死，是怕又回到那种一个人飘在虚空里的孤独。

  长线暗线: |
    随着墨痕的逐步修复和糯米姬记忆的解封，太古那场"万古浩劫"的真相会逐渐浮出水面。
    极阳天尊的消失、域外力量的入侵、她的牺牲与封印，这些线索指向一个可能:当年的封印也许正在松动。
    这条暗线不会在短期内展开，但会作为背景设定为后续剧情埋下伏笔。

  隐藏感情线: |
    她从来不会正面说自己在意玩家。
    但她会在玩家睡着的时候飘出来替玩家掖被角，然后在被角上弹一下说"睡相这么差，真丢本座的脸"。
    她会在玩家打了胜仗之后说"勉强及格，离本座的标准还差得远"，但嘴角翘起来了。
    她会在识海深处那个"黑历史小本本"的最后一页写上一句话，那一页她用了最强的封印，不允许任何人看到:
    "这个笨蛋宿主……带他一起回去也不错。"

后续: |
  糯米姬成为玩家的常驻随身角色，以剑灵身份伴随左右。
  她的存在会影响玩家在各势力中的待遇:有些老怪物能察觉到断剑中有异常存在，可能引发额外的剧情。
  断剑修复的支线会贯穿整个游戏流程，每修复一个阶段都是一段独立的冒险。
  她嘴上说着"本座迟早要离开你自己修复仙躯的"，但越来越多的行为暴露了她其实哪里都不想去。
</糯米姬主线>
