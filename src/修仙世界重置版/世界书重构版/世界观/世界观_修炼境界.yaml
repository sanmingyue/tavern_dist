<修炼境界>
修炼境界:
  凡人: 寿百年，血肉凡胎，无法感知灵气
  炼气期:
    小境界: 一层、二层、三层、四层、五层、六层、七层、八层、九层、十层
    寿元: 150年
    特征: 引气入体，五感超常，可御基础五行术法
    渡劫: 十层修满需渡劫方可进入筑基期
  筑基期:
    小境界: 前期、中期、后期、大圆满
    寿元: 300年
    特征: 灵气化液筑道基，仙凡之隔
    渡劫: 大圆满修满需渡劫方可进入金丹期
  金丹期:
    小境界: 前期、中期、后期、大圆满
    寿元: 800年
    特征: 灵力凝丹，可御剑飞天，丹不毁则道基永固
    渡劫: 大圆满修满需渡劫方可进入元婴期
  元婴期:
    小境界: 前期、中期、后期、大圆满
    寿元: 2000年
    特征: 金丹化婴可离体神游，肉身毁而元婴不灭可夺舍重生
    渡劫: 大圆满修满需渡劫方可进入化神期
  化神期:
    小境界: 前期、中期、后期、大圆满
    寿元: 5000年
    特征: 元婴融魂，初悟虚空之道，可瞬移，神念千里
    渡劫: 大圆满修满需渡劫方可进入炼虚期
  炼虚期:
    小境界: 前期、中期、后期、大圆满
    寿元: 15000年
    特征: 深研虚空之道，可破碎虚空远距传送
    渡劫: 大圆满修满需渡劫方可进入合体期
  合体期:
    小境界: 前期、中期、后期、大圆满
    寿元: 40000年
    特征: 肉身合天地，法力绵长近乎无穷
    渡劫: 大圆满修满需渡劫方可进入大乘期
  大乘期:
    小境界: 前期、中期、后期、大圆满
    寿元: 100000年
    特征: 悟道至境凝聚仙元，半步真仙
    渡劫: 大圆满修满需渡劫方可进入渡劫期
  渡劫期:
    小境界: 前期、中期、后期、大圆满
    寿元: 100000年
    特征: 引九天神雷淬体，九死一生十不存一
    渡劫: 大圆满修满需渡劫方可飞升真仙境
  真仙境:
    小境界: 一重天、二重天、三重天、四重天、五重天、六重天、七重天、八重天、九重天、十重天、大圆满
    寿元: 在渡劫期寿元基础上，每升一重天额外增加3万年寿元。一重天额外+3万年，二重天额外+6万年，以此类推，十重天大圆满额外+30万年
    特征: 灵力尽化仙元，超凡入圣，仍需面对天人五衰之劫

剑修剑心境界:
  说明: 不依赖灵根资质，唯看剑心悟性，杂灵根亦可凭剑道崛起
  规则: 剑心境界仅提升同修炼境界内的战力上限，不可越境而战
  层次:
    入剑: 明己心知己念，人剑合一
    剑意: 剑出随意动，锋芒初露
    剑势: 剑未出而势已成，可压制同阶
    剑心: 内心执念烙印于剑
    剑心通明: 剑心剔透无迷惘，一念起剑万里
    无我: 舍弃自我，化为剑道化身
    无剑: 手中无剑心中无剑，天地万物皆可为剑
    无我无剑: 人与道合，自身即剑道，剑仙之境

丹修丹道境界:
  说明: 不依赖灵根，决定可炼丹药品质，杂灵根亦可成丹道宗师
  层次:
    炼精化气: 可炼黄玄级丹药，疗伤祛病
    炼气化神: 可炼地级丹药，助突破祛瓶颈
    炼神还虚: 可炼天级丹药，起死回生夺造化
    炼虚合道: 身与丹合，可催生灵药炼圣级乃至仙级丹药，丹道巅峰
</修炼境界>
