<品级体系>
品级体系:
  通用七级: 凡 < 黄 < 玄 < 地 < 天 < 圣 < 仙
  细分: 黄至天级各分下品/中品/上品/极品，圣级仙级不分小级
  与修炼境界对应:
    黄级: 炼气~筑基
    玄级: 金丹~化神
    地级: 炼虚~大乘
    天级: 渡劫~真仙(低重天)
    圣级: 真仙境高重天至大圆满(真仙七重天以上方可驾驭圣级物品、修炼圣级功法)
    仙级: 超越真仙大圆满之上的传说级存在，当世无人能完全驾驭，仅存残篇或天地自生之物

  功法:
    凡级: 凡人武学，不涉灵力
    黄级: 入门修仙功法(炼气~筑基)，灵力运转粗糙
    玄级: 中等功法(金丹~化神)，灵力精细
    地级: 高品功法(炼虚~大乘)，灵力圆融
    天级: 顶尖功法(渡劫~真仙)，蕴含大道之韵
    圣级: 真仙境七重天以上方可修炼，通真仙大圆满
    仙级: 超越真仙大圆满，当世仅存残篇传说，无人能完整修炼
    领悟规则: 功法不禁阅只禁外传，境界未到则如观天书不得其意，极少数天才可越级悟得片鳞半爪，宗门护功法独特性(内门以上可阅不可带走)而非境界私密性
    注意: 功法/法宝/阵法/丹药品级均为"凡→黄→玄→地→天→圣→仙"正序(越高越强)；异火品级则为"一品→九品"倒序(一品最高九品最低)，两套体系方向相反，勿混淆

  法宝:
    说明: 法宝按蕴含力量层次分为六阶，与通用品级体系对应。灵器至道器各分下品/中品/上品/极品四个小品级
    法器: 基础修仙器具，灵力粗浅即可驾驭，对应凡~黄级
    灵器: 蕴含灵性，分下品/中品/上品/极品四品，需一定灵力感应方可催动，对应玄级
    宝器: 蕴含道韵，分下品/中品/上品/极品四品，需对道有所触及，对应地级
    道器: 蕴含大道之力，分下品/中品/上品/极品四品，需大道感悟方可共鸣，对应天级
    圣器: 蕴含圣道之威，真仙境七重天以上方可驾驭，对应圣级
    仙器: 有自主意识，择主而栖，非相契者难以驾驭，对应仙级
    驾驭规则: 非严格境界限制，而是灵力与感悟不足则无法催动，极少数天契之人可越阶驾驭
    先天至宝: 天地诞生时形成，不以威力论高低，各具独一无二之特性，不可复制，独立于法宝品级体系之外。已知先天至宝——永生灵泉(传说可令凡人长生，下落不明)、不灭之火(太初诞生的第一缕火焰，疑为一品异火之源)、生死簿(记录阴阳大陆所有生灵寿命与因果，现由地府判官崔钰掌管)、命运天书(可窥探天命因果，现由天命神教教宗司命玄掌控)、六道轮回盘(维系生死轮回秩序，位于阴曹地府最深处，由转轮王执掌)

  阵法:
    黄级: 聚灵阵、基础防御
    玄级: 小型攻伐阵、中等防御
    地级: 护山大阵(中等宗门)、战场级攻伐
    天级: 护山大阵(六大仙宗)、跨域传送阵
    圣级: 护国大阵、大域封锁，需真仙境七重天以上方可布置
    仙级: 六道轮回盘等天道级存在，非人力可布
    先天阵法: 天地自然形成，不可复制移动破坏(如东瀛结界即由初代天皇以月咏神血激活先天阵法而成)

  丹药:
    品级: 凡 < 黄 < 玄 < 地 < 天 < 圣 < 仙
    品质: 劣品(药效三成有风险) < 普品(五六成) < 上品(八成+) < 极品(无丹毒) < 丹纹(超理论上限)

  符箓:
    特点: 一次性道具，使用者无需对应修为即可释放封存力量
    分类: 攻击/防御/辅助/禁制/治疗/特殊

  灵兽/妖兽:
    定义: 吸收天地灵气修炼的兽类，未开智无语言，可被驯服为坐骑/宠物等
    阶位与境界对应: 1阶=炼气，2阶=筑基，3阶=金丹，4阶=元婴，5阶=化神，6阶=炼虚，7阶=合体，8阶=大乘，9阶=渡劫，10阶=真仙(上古神兽)
    上古神兽: 10阶真仙级灵兽，当世极为罕见
    浑身是宝: 内丹/皮毛/骨骼/精血皆为修炼材料

  妖族:
    定义: 天生具有灵智的非人种族，出生即有语言文明社会体系
</品级体系>
