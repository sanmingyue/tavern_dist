<阴阳历法>
阴阳历法:
  起源: 阴阳初分之刻为纪元零点

  时间单位:
    转: 1000万年(最高单位，记述太古秘辛)
    纪: 100万年(种族兴衰、仙魔大战)
    元: 1000年(宗门兴废、大能寿元，最常用中尺度)
    年: 12月
    月: 30日
    日: 12时辰
  换算: 1转=10纪=10000元=1000万年，1纪=1000元=100万年

  纪年格式: X转X纪X元·X年X月X日，日常简写"X元X年"
  当前故事时间: 3转7纪482元·816年9月15日

  各域差异:
    中央神州: 严格使用阴阳历
    东荒妖域: 兽历(1兽年≈3阴阳年)，正式场合通行阴阳历
    北原魔土: 劫(1劫≈1元即千年)
    南疆巫地: 世代口传，以"几世几春"为度
    西漠佛国: 佛门以"一念"喻时间，正式沿用阴阳历
</阴阳历法>
