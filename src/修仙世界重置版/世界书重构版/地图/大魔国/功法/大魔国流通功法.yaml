<大魔国流通功法>
大魔国流通功法:
  魔气炼体基础功:
    品级: 黄级下品
    来源: 大魔国最基础的功法
    流通: 废墟区散修人人可得，在魔气弥漫的洞天中存活的最低门槛
  暗煞凝气诀:
    品级: 黄级中品
    来源: 大明皇朝覆灭后从废墟中翻出的残卷
    流通: 暗域集市有售，被魔气改造后勉强可用于魔道修炼
  血煞拳经·简化版:
    品级: 黄级上品
    来源: 幽血门外传版本
    流通: 暗域集市偶见，只有血煞锻体诀的皮毛
  梦蚀心法:
    品级: 黄级中品
    来源: 梦魇庭百梦阁流出的简化版入梦术
    流通: 只能让自己做清醒梦，无法操控他人梦境
  阴魂夺舍术:
    品级: 黄级上品
    来源: 不明，可能源自冥魂域弃用的旧法
    流通: 暗域集市明面上禁售，但地下交易从未断绝
</大魔国流通功法>
