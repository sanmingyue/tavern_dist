<亡灵营垒>
亡灵营垒:
  定位: 冥魂域中央的军事要地，亡灵军团驻扎之所

  环境:
    位置: 冥魂域正中央，占据了骨灰平原上最大的一片区域
    规模: 数十万亡灵以军阵排列驻守，营垒以噬魂灵铁铸成的栅栏围合，共分十二个方阵营区
    氛围: 营垒中没有活人军营的喧嚣。数十万亡灵整齐列队，一动不动，如同雕像。空气中弥漫着淡蓝色的魂火气息，安静得能听到魂力流动的嗡鸣声

  军团编制:
    十二方阵: 每个方阵约三万亡灵，各由一名亡灵将领统帅。将领由幽临亲自指定，以魂力链接直接接收命令
    先锋阵: 以速度见长的轻装亡灵，充当战场侦察与突袭
    重甲阵: 以防御和冲锋见长的重装亡灵，是正面交战的主力
    弓弩阵: 以远程魂力箭矢攻击的亡灵射手，箭矢带有魂力侵蚀效果
    特殊阵: 由生前修为达到金丹期以上的亡灵组成，保留了部分生前的战斗技巧和法术能力

  亡灵来源:
    大魔国战死者中被魂籍制度编入军团的魂魄
    战俘的魂魄——蚀夜的战皇系定期移交战俘供幽临编入军团
    自愿以魂魄换取后代优待的老年魔族

  核心设施:
    指挥塔: 营垒中央的一座灰白色石塔，幽临偶尔在此调度军团。塔内有一面以魂力驱动的沙盘，可实时呈现大魔国全境的亡灵分布
    魂力补给阵: 营垒地下的一座大型阵法，从冥魂域灵脉中汲取阴属性灵力转化为魂力，持续维持亡灵军团的存续
    修复区: 在战斗中受损的亡灵会被送至此处，由魂道修士以魂力修补其魂体。修复不了的亡灵会被彻底消散，魂力回收

  驻守:
    亡灵大将·冥骨: 幽临以自身魂力亲手塑造的最强亡灵，修为相当于化神后期。冥骨没有自主意识，完全听命于幽临，是亡灵军团的最高指挥官

  可触发事件:
    - 幽临每月亲自检阅一次军团，检阅时数十万亡灵齐步行军，步伐统一到像一个人在走路，地面因此震颤
    - 蚀夜偶尔会来亡灵营垒"借兵"，每次都要与幽临进行一番公文交涉，双方态度冷淡但程序完备
    - 营垒中偶有亡灵残留微弱的生前记忆，在"暗时"发出极低的呻吟。魂道修士会及时清除这些残留记忆，以防影响军团稳定性
</亡灵营垒>
