<魂籍殿>
魂籍殿:
  定位: 幽临处理政务之所，大魔国魂籍制度的中枢

  环境:
    位置: 冥魂域中心偏西，一座以灰白色骨石建造的方正大殿，建筑风格简素刚直，没有任何多余装饰
    规模: 殿内分为前殿、中殿、后殿三进。前殿为魂籍官办公之所，中殿为幽临议事之处，后殿为魂籍簿册存放地
    氛围: 殿内安静到令人窒息，所有人说话都压低声音，脚步声被阴属性灵力铺设的地面吸收。唯一的声响是魂籍官翻动簿册和刻录魂印的沙沙声

  主要区域:
    前殿·登录厅: 数十名魂籍官在此处理日常事务。新生魂登记、亡者魂归档、转生名额审批、跨领地魂籍调动等全部在这里办理
    中殿·审判堂: 幽临处理重大魂籍争议之处。当魂魄归属出现纠纷或有人试图违反魂籍制度时，幽临会亲自在此裁决。堂中央有一面黑石审判台，台上长年悬浮着一枚淡蓝色魂印——那是幽临的魂籍大印，可直接宣判魂魄的最终去处
    后殿·魂籍库: 存放大魔国建国以来所有魂籍簿册的地方，四万年的魂魄记录尽在其中。簿册以魂力刻录在噬魂灵铁薄片上，堆叠如山。后殿由幽临亲设禁制守护，除他本人外无人可入

  魂籍制度运作:
    生录: 大魔国境内每一个新生命诞生后三日内，所属领地的魂籍官必须前往登记。登记内容包括魂魄属性、血脉成分、灵根潜力
    死归: 魂魄离体后会被魂灯塔牵引至魂归所，由魂籍官核实身份后归档。归档后的魂魄有三种去处——转生、编入亡灵军团、或交由地府
    转生: 转生名额极为有限，需要经过严格审核。功勋卓著者优先，普通亡者多数被编入亡灵军团或交由地府
    违规处罚: 篡改魂籍、私藏魂魄、逃避登记均为重罪。最高刑罚为魂灭——由噬魂宵吞噬魂魄，永不超生

  魂籍体系层级:
    冥魂王: 幽临，魂籍制度的制定者与最高裁决者
    魂籍总管: 仅一人，统管全部魂籍事务。当前为骨寒
    高级魂官: 约五人，元婴期，各负责一类核心事务（生录、死归、转生、跨域调动、违规审查）
    正式魂官: 约三十人，金丹期，处理日常登记与归档
    见习魂官: 约十余人，筑基期，负责跑腿、传递文书、整理簿册

  驻守:
    魂籍总管·骨寒: 化神后期，魂灯王族旁支，跟随幽临四千余年的老臣。负责统管所有魂籍官的日常运作，是冥魂域中除幽临外权力最大的人

  常驻人物:
    高级魂官·魂册: 元婴初期的魔族，负责"死归"事务。面容枯瘦，眼窝深陷，终年披着一件灰白色的魂袍。他经手的亡者魂魄不下百万，能从一缕魂力的波动中精确判断亡者的生前修为、死因和死亡时间。话极少，但每一句都精准到像在念判决书
    正式魂官·冥笙: 金丹后期的魔族，负责跨领地魂籍调动。是魂籍殿里少有的话多的人，因为他的工作需要跟四王各领地的人打交道。嘴皮子利索，什么人都能聊得来，连蚀夜的军需官都被他磨得没脾气。骨寒骂他"嘴巴比法器还好使"
    见习魂官·幽萤: 筑基后期的年轻魔族女子，入职不到三十年的新人。她对魂道有天生的敏感，能感知到极微弱的魂力波动，但性格怯懦，在骨寒面前说话都结巴。每天最早到最晚走，整理簿册一丝不苟。骨寒嘴上说她"胆子小得像只冥魂蛾"，实际上已经在考虑提拔她

  可触发事件:
    - 魂籍官偶尔会发现登记在册的魂魄与实际不符的情况——某个"应该死了"的魂魄还活着，或某个"应该活着"的魂魄已经消失。这类异常会被直接上报幽临
    - 后殿的古老簿册中偶有四万年前的魂籍记录自行发光，骨寒对此讳莫如深
</魂籍殿>
