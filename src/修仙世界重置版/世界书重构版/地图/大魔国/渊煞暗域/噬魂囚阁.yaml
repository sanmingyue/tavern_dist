<噬魂囚阁>
噬魂囚阁:
  定位: 渊煞暗域中最大的设施，奴隶市场与"作品展览馆"

  环境:
    位置: 渊煞暗域中央最大的溶洞群内
    外观: 一个由数十个大小溶洞改造而成的地下建筑群，洞壁被人工打磨平整并刻上各种禁制符文。入口处悬挂着两盏散发着惨绿色光芒的灵灯，像两只阴森的眼睛盯着每一个进入的人
    氛围: 噬魂囚阁内弥漫着一种难以言喻的压抑感。空气中混合着陈旧的血腥味、药草味和某种让人精神恍惚的香气。灯光昏暗，通道曲折，每一个转角都可能看到令人不适的"展品"

  核心区域:
    展厅: 噬魂囚阁最大的溶洞被改造成了一个环形展厅，四周的石壁上凿出了一个个壁龛，每个壁龛中以灵力牢笼关押着一名"展品"——全是被渊煞折磨驯服过的高贵俘虏。他们衣着整洁、姿态端正，但眼神空洞如死人
    交易厅: 展厅旁的一个较小溶洞，是实际进行奴隶交易的场所。交易以密封竞价的方式进行，买家将出价写在纸条上投入石箱，渊煞的手下统一开价。出价最高者得
    囚笼区: 噬魂囚阁深处的囚禁区域，关押着尚未"完成"的俘虏和新到的战俘。牢笼以特制的灵力栅栏封锁，根据俘虏的身份和修为分为不同等级
    折磨工坊: 渊煞的私人空间，以最高等级的禁制封锁，仅渊煞本人和极少数亲信可以进入。内部布满精神折磨所需的法阵——镇魂锁阵、心奴印阵、幻境投射阵等，每一个都是渊煞亲手布置

  商品来源:
    蚀夜移交的战俘中被渊煞看中的"素材"
    大魔国各处掳掠来的高贵身份者——落难的宗门弟子、被灭国的贵族、世家子女
    偶有四王麾下犯了重罪的魔族被送来此处作为惩罚

  驻守:
    总管·影匿: 化神初期的魔修，噬魂囚阁的日常管理者。影匿沉默寡言，面容被黑色面具遮掩，极少说话。他是渊煞少数信任的手下之一，负责处理交易、看守俘虏等渊煞懒得管的杂事

  可触发事件:
    - 噬魂囚阁偶尔会举行"品鉴会"——渊煞邀请大魔国各方势力的权贵前来观赏他最新的"作品"。品鉴会上提供美酒佳肴，气氛诡异地优雅，与展品们的悲惨处境形成刺目的反差
    - 囚笼区偶有新送来的俘虏试图反抗或逃跑。影匿会冷静地将其制服，然后送去折磨工坊由渊煞"亲自接待"
    - 赵曦月被关在囚笼区最深处一间单独的石室中，那间石室的装饰比其他牢笼精致得多——有床、有桌、有镜子，像一间精心布置的囚笼。渊煞偶尔会来这里坐上很久，端详他最得意的作品
</噬魂囚阁>
