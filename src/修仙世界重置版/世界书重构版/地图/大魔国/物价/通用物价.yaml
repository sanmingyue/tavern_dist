<大魔国通用物价>
大魔国通用物价:
  货币体系:
    灵石: 四王领地内通行，购买力约为外界的40-60%
    魂石: 渊煞暗域和暗域集市的硬通货
    以物易物: 废墟区和边荒地带
  奴隶(噬魂囚阁/暗域集市):
    凡人: 3-8下品灵石
    炼气期修士: 50-200下品灵石
    筑基期修士: 500-2000下品灵石
    渊煞的"作品": 底价×20
    心奴印加刻: 额外100-500下品灵石
  材料:
    魔气结晶: 低品质5-10/高品质50-100下品灵石
    幻梦丝: 百年20-50/千年200-500下品灵石/尺
    血铁矿: 原矿10-30/精炼100-300下品灵石
    冥火灵石: 普通30-80/高品质300+下品灵石
  税费:
    四王领地入境: 需持令牌
    暗域集市: 无税费
    北原裂口出入: 无令牌者10-50下品灵石"过路费"
</大魔国通用物价>
