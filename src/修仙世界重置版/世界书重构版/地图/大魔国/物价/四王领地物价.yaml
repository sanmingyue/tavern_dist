<大魔国四王领地物价>
大魔国四王领地物价:
  食物:
    魔兽烤肉: 2-5下品灵石/份
    血食(血战城特产): 1-3下品灵石/份
    梦酿(梦魇庭特产): 10-20下品灵石/壶
    焚魂酒(焰魂圣域): 5-8下品灵石/壶
    冥食(冥魂域): 3-5下品灵石/份
  武器:
    炼气级魔器: 50-200下品灵石
    筑基级魔器: 200-1000下品灵石
    金丹级魔器: 1-10中品灵石
    血战城军械: 比同级贵20-30%但附带血道加持
  丹药:
    疗伤丹: 5-10下品灵石(外界1-2灵石)
    聚灵丹: 15-30下品灵石
    破境丹: 300-800下品灵石
    血煞丹(血战城): 20-40下品灵石
  住宿: 各区域简陋客舍5-15下品灵石/夜
  服务:
    幻梦服务(百梦阁): 10-100下品灵石/次
    魂籍登记(冥魂域): 免费，但登记后受幽临管辖
</大魔国四王领地物价>
