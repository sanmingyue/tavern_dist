<常夜幕府>
常夜幕府:
  定位: 东瀛的实际统治机构，由五大武家将军组成的军政集团，以"维护结界稳定"为名架空天皇权力
  位置: 幕府殿设于皇城外城，五大武家各据东瀛一方。幕府在神岳山脚东南方的皇城内外城之间建有幕府殿，作为军政中枢

  核心理念: 武家治天下，天皇守结界。五大武家认为天皇的职责是以神血维系结界，天下政务应由武家执掌。百余年来幕府以此理念架空天皇，将月咏软禁于皇城内城

  大将军:
    名号: 织田信岳
    修为: 金丹后期
    灵根: 地灵根·火金双
    身份: 织田家当代家主，常夜幕府现任大将军
    功法: 修罗斩铁诀，玄级上品，织田家祖传刀术功法，以灵力灌注刀身斩出附带修罗杀意的刀气
    说明: 执政风格铁腕强硬，是五大武家中修为最高的家主。任期十年，已执政七年。推行扩军备战政策加强各地武家卫所的兵力，名义上防范海中妖兽实际是巩固幕府统治

  五大武家:
    织田家:
      领地: 东瀛北部
      特长: 刀术
      家主: 织田信岳，金丹后期，性情刚烈好战。兼任大将军
      核心武士: 约二十名筑基期武士，百余名炼气期武士
      说明: 五大武家之首，军力最强。织田家崇尚武力至上，家训是"刀未出鞘便已分胜负"。北部领地多山地峡谷，民风彪悍。织田家掌控东瀛最大的铁矿和刀匠村
    德川家:
      领地: 东瀛东部
      特长: 阵法
      家主: 德川秀隐，金丹中期，老谋深算善于权衡
      核心武士: 约十五名筑基期武士，近百名炼气期武士
      说明: 五大武家中最善权谋的家族。德川家不以武力见长，而以阵法和计略取胜。东部领地是沿海平原，农田广袤渔港繁忙，是东瀛粮仓。德川家掌控粮食命脉，任何家族与德川交恶都要掂量饿肚子的后果
    丰臣家:
      领地: 东瀛西部
      特长: 灵药炼丹
      家主: 丰臣秀药，金丹中期，重商轻武
      核心武士: 约十名筑基期武士，六十余名炼气期武士
      说明: 五大武家中武力最弱但财力最雄厚的家族。西部丘陵地带盛产灵药灵茶，丰臣家垄断东瀛灵药贸易。丰臣秀药本人痴迷炼丹术，武功稀松但炼丹水准是东瀛第一。其他四家的丹药大多出自丰臣家
    上杉家:
      领地: 东瀛南部
      特长: 忍术和暗杀术
      家主: 上杉影月，金丹初期，行事诡秘
      核心武士: 约十名筑基期武士，五十余名炼气期武士。另有暗部忍者数量不明
      说明: 五大武家中最令人忌惮的家族。南部领地密林湿地地形复杂，上杉家利用地利培养忍者。上杉影月本人修为在五大家主中最低，但没有人敢小觑他，因为上杉家的暗部从未暴露过全部实力。上杉家负责幕府的情报收集和暗中监视
    武田家:
      领地: 神岳山腰
      特长: 守护灵脉
      家主: 武田守岳，金丹后期，忠于古道尊崇天皇
      核心武士: 约十五名筑基期武士，七十余名炼气期武士
      说明: 五大武家中唯一暗中同情天皇的家族。武田家世代守护神岳山腰的灵脉入口，掌控着东瀛灵气的源头。武田守岳为人刚正不阿，认为将军们架空天皇有悖先祖之道，但势单力孤不敢公然对抗其余四家。他暗中为月咏传递消息，是月咏在幕府中唯一的同情者

  幕府体制:
    大将军: 五大武家家主轮值，每任十年。大将军掌管东瀛军政大权，可调动除皇城守卫外的所有武家兵力
    评定会: 五大家主共同参与的最高决策机构，重大事务须三家以上同意方可执行。评定会在幕府殿召开
    奉行所: 幕府下设各类奉行负责具体政务。町奉行管理民政，勘定奉行管理财税，武家奉行管理军务
    皇城侍卫: 由五大武家各派武士轮值守卫皇城，名为保护天皇实为监视。皇城侍卫直接向幕府殿汇报月咏的一切行踪

  幕府与天皇的关系:
    说明: 百余年前初代大将军以"天皇专心维系结界，政务由武家分担"为由逐步接管政权。到如今天皇已被彻底架空，月咏的一切起居饮食均由幕府安排。月咏每日须在皇城祭坛以神血供养结界，其余时间被限制在内城范围内。五大武家之间虽有明争暗斗，但在架空天皇这件事上立场一致，因为一旦天皇收回权力所有武家都将失去特权

  幕府殿常驻路人:
    松永: 筑基后期，人族，幕府殿的町奉行。管理常夜町的民政事务，整日在幕府殿和常夜町之间来回奔波。为人精明能干但胆小怕事，对上唯唯诺诺对下颐指气使
    秋山: 筑基中期，人族，幕府殿的寺社奉行。负责管理东瀛各地神社和寺院事务，是幕府安插在伊势大社的眼线之一。面带微笑说话温和，实际上每月都向幕府汇报浅间咲的动向
    甲斐: 炼气大圆满，人族，幕府殿的传令武士。负责在五大武家之间传递幕府文书和命令。骑术精湛，一匹灵马日行千里。沉默寡言只管送信从不多问信中内容
    阿菊: 凡人，幕府殿的侍女头领。管理幕府殿内的数十名侍女，负责各位大人的茶水膳食。年过五十精明干练，对幕府殿里的暗流涌动心知肚明但从不插嘴，只管把茶泡好把饭做热
</常夜幕府>
