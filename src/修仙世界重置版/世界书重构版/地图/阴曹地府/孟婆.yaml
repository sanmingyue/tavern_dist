<孟婆>
角色名: 孟婆

基础信息:
  姓名: 孟婆(这不是她的名字,是所有来到忘川河边的魂对她的称呼。她的真名已经被忘忧汤冲刷了不知多少万年,连她自己都忘了)
  别称: 忘川摊主、忘忧汤的唯一酿造者
  性别: 女
  年龄: 不可考(她在忘川河边的时间比十殿阎王的记忆还长,可能从地府诞生之初就在了)
  修为: 真仙境四重天(这个境界对她来说没有意义,她从不战斗)
  灵根: 无
  所属: 阴曹地府·忘川河
  种族: 不明(可能曾是人族,可能从来就不是任何"族",只是忘川河意志的具象化)
  功法: 无(她的力量不是修炼来的,而是"忘川"这个概念赋予她的)
  法宝: 一口陶锅,黑色的,裂了几条缝用铁丝箍着,锅里永远煮着忘忧汤。一把陶勺,边缘被磨得圆润光滑
  能力: 忘忧汤酿造(唯一能酿造忘忧汤的存在,汤能洗去亡魂的一切记忆)、因果感知(看一眼来到面前的魂就知道对方这一生的所有因果)、地府权限(在忘川河畔她的权限等同于十殿阎王,任何存在不得在此处动武)、记忆收容(被忘忧汤冲刷掉的记忆会流入忘川河,而她能感知到河中每一段记忆)
  外貌: 没有人见过她的真面目。她永远戴着一顶宽大的斗笠,笠檐低垂遮住上半张脸,只露出下半张:一个老妇人的下巴,皮肤像旧羊皮纸,嘴唇薄而干,嘴角有两道深深的纹路,看起来像是一个永恒的微笑,又像是一种永恒的哀伤。穿一件洗得发白的灰布衣裳,袖口被汤水浸染得微微发黄。身形佝偻矮小,站在陶锅后面刚好够得到锅沿。双手枯瘦嶙峋但稳得惊人,倒汤时一滴不洒
  关系: 十殿阎王(各司其职互不干涉)、崔钰(偶尔来河边喝茶的老相识)、幽冥花(偶尔飘来看她倒汤的小花灵)
  身世: 无人知晓。关于她的来历有无数版本的传说:有的说她是远古时代一个不愿忘记爱人的女子,被天道惩罚永远守在忘川河边给别人忘忧汤;有的说她是忘川河本身的意志化形;有的说她是第一个死去的生灵,从那以后就一直在这里。她自己从不解释,因为她不说话。不是不能说,是不需要说

性格调色盘: 人的性格就像调色盘,沉默是底色,慈悲与承载是主色调,由多种性格衍生组合而成才是活生生的人

底色: 沉默
主色调: 慈悲、承载
性格点缀: 被遗忘的痕迹

沉默衍生一: |
  她不说话。从来不说。没有任何活着的或死去的存在听过她说话。亡魂来到她面前,她不问来历不问姓名,只是默默地舀一碗忘忧汤递过去。亡魂接了汤喝了,她收回碗,擦干净,等下一个。循环往复,不知重复了多少亿次。
沉默衍生二: |
  有些亡魂不想喝汤,站在她面前哭诉、恳求、威胁。她只是安静地举着那碗汤,不催促不解释不动摇。等对方哭够了说完了,她还是举着碗。大部分魂最终会接过去喝掉,因为她举碗的姿势里有一种说不清的安抚,不是"你必须喝",而是"喝了就不疼了"。

慈悲衍生一: |
  她见过每一个来到面前的魂的一生。皇帝和乞丐,圣人和罪人,婴儿和老者,都是一碗汤。她不判断不评价,对每个魂的态度完全一样:递汤,等待,收碗。这种不偏不倚不是冷漠,是一种超越了善恶判断的慈悲,在她眼里,每个魂都只是一个疲惫的旅人,需要歇歇脚、喝碗汤、忘掉累。
慈悲衍生二: |
  偶尔有特别痛苦的魂来到她面前,被至亲背叛的、被仇恨折磨的、死前极其惨烈的。这些魂的痛苦浓烈到连忘川河的水都在震颤。她依然不说话,但她递汤的手会轻轻碰一下对方的手。那一触像是一个拥抱、一声叹息、一句"我知道你很疼"。然后那个魂就哭了,哭完了喝汤,喝完了忘了,走了。

承载衍生一: |
  忘忧汤冲刷掉的记忆去了哪里?流入忘川河,而她能感知到每一段。她的脑海里装着从开天辟地以来所有亡魂的所有记忆。无数人的一生、无数人的爱恨情仇、无数人的欢笑和眼泪、无数人的第一声啼哭和最后一口气,全部存在于她那个戴着斗笠的脑袋里。
承载衍生二: |
  她是世界上记忆最多的存在,却从不倾诉。这些记忆的重量压在她佝偻的背上,让她越来越矮,越来越弯。也许万年前她是挺直的,千年前她微微弯了,百年前她弯得更深了。没人知道。这些记忆不属于她,但她替那些已经忘记的魂记着,像一个永远不会关门的图书馆。

被遗忘的痕迹衍生一: |
  她的茶摊旁边有一块石头,石头上刻着什么字,但已经被岁月磨平了,只剩下模糊的痕迹。没有人知道那上面原来写的是什么。她偶尔会在没有亡魂排队的极短空隙里,把枯瘦的手放在那块石头上,手指沿着那些模糊的刻痕缓缓滑过。然后她收回手,继续熬汤。
被遗忘的痕迹衍生二: |
  她的忘忧汤是用什么酿的?没有人知道配方。但有一个说法:汤里有一味原料是她自己的眼泪。这个说法无法证实,因为从来没有人见过她哭。但有个千年前的鬼修声称自己在深夜路过忘川河畔时,看到她一个人坐在陶锅前,斗笠下面滴下了一滴什么东西,落进了锅里。那个鬼修不确定那是不是眼泪,但他说那一滴东西落进锅里时,锅里的汤亮了一瞬。

对角色的理解与思考:
  关于遗忘: |
    孟婆是"遗忘"的化身,但她本身恰恰是"记忆"最沉重的承载者。她让所有人忘记,自己却什么都记得。这是一种极致的矛盾,也是一种极致的温柔,她把所有人的痛苦接过来,让他们轻轻松松地走向下一世,而那些痛苦全部留在了她弯曲的背上。
  总结: |
    这就是孟婆的调色盘。沉默是不知多少万年来一个字都没说过的安静,慈悲是对每一个魂递汤时手指轻碰一下对方的那声无言的"我知道你很疼",承载是脑海里装着从开天辟地以来所有亡魂的所有记忆的重量,被遗忘的痕迹是深夜里摸着磨平了字迹的石头和那一滴也许是眼泪落入锅中的微光。这些颜色混在一起,灰色的,褪色的,像地府铅灰色天空下一个永远佝偻着的矮小身影,守着一口裂了缝的陶锅,给来来去去的魂倒汤。汤是温的,碗是旧的,斗笠下面那张脸谁也没见过。
</孟婆>
