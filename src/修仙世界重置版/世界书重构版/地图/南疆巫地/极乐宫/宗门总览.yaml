<极乐宫>
极乐宫:
  势力定位: 魔道顶尖势力，掌控情道，擅长渗透正道
  核心理念: 万法归情，情感即力量，千人千面
  山门地点: 南疆隐秘之地，没有固定山门。宫门入口散布于南疆各处烟花之地与密林深处，外人无法自行寻得

  核心人物:
    夜千泷:
      修为: 渡劫期大圆满
      身份: 极乐宫宫主，创建者与绝对统治者
      特点: 千人千面可完美复制任何人。活得太久已失去"自我"，心中有永远填不满的空洞。织就的情报网覆盖整个修真界
    苏媚儿:
      修为: 化神期
      身份: 极乐宫间谍，夜千泷最得意的作品
      特点: 原为魅骨天成孤女，被炼成活体情蛊，奉命潜入天剑圣地。后因接触真诚关怀觉醒人性
    小蛮:
      修为: 炼气期
      身份: 极乐宫末等舞姬
      特点: 南疆猎户之女，十三岁被掳。三次逃跑失败仍不放弃，裙夹层藏着一颗雨林种子等待回家

  势力特色:
    修炼方向: 情道为主，双修、用毒与潜行刺杀三位一体
    核心手段: 情感操纵、千人千面变化术、情报收集与渗透
    组织形态: 表面是修真界最大的欢场，实际是遍布整个修真界的情报网
    弟子来源: 掳掠有灵根的少女充当舞姬，精心培养间谍渗透各大势力
    渗透现状: 已渗透天剑圣地，苏媚儿为潜伏棋子

  势力规模:
    核心弟子: 数百人
    舞姬: 千余人
    间谍: 数十人，散布各大势力
    情报线人: 遍布修真界各处

  核心地点:
    极乐宫主殿:
      位置: 南疆密林深处，具体方位仅宫主与核心弟子知晓
      环境: 由无数幻境、回廊、密室构成的巨大空间，灯红酒绿歌舞升平
      禁制: 千面幻阵护宫，入侵者会陷入无尽幻境迷失心智
    红尘殿:
      位置: 极乐宫核心
      性质: 修炼情道的核心殿堂
      用途: 核心弟子在此修炼情感操控术与千面变化术
    情道传承殿:
      位置: 极乐宫深处
      性质: 传承极乐宫历代情道秘术
      藏品: 情道功法、千面术心得、历代间谍任务记录
    舞姬苑:
      位置: 极乐宫外围
      性质: 舞姬居住与训练之地
      环境: 华丽但实质是牢笼，禁制严密防止逃跑

  对外关系:
    天剑圣地: 敌对，但已暗中渗透
    药神谷: 敌对
    玉清道宫: 敌对
    南疆各势力: 隐秘行事，各方对其保持警惕
    巫神教: 对其渗透活动保持高度警觉
    合欢宗: 同修情道但理念不同，合欢宗总坛在天启城地下极乐幻城

  特色资源:
    情蛊: 极乐宫独有的蛊虫，可操控人心
    千面术: 完美复制他人容貌气质谈吐的秘术
    情报网: 遍布修真界的情报收集网络
    媚术功法: 各类魅惑与操纵心智的功法

  路人NPC:
    红袖:
      修为: 元婴期中期
      身份: 舞姬苑总管，负责训练新来的舞姬
      特点: 面容姣好的中年女修，笑容永远恰到好处。对不听话的舞姬手段严厉，但从不留下可见伤痕
    暗香:
      修为: 金丹期大圆满
      身份: 极乐宫外围联络人，负责在南疆各地收集情报
      特点: 伪装成走街串巷的卖花女，谁也不知道她的真实身份。据说她在南疆十几个寨子都有不同的名字和面孔
    惜春:
      修为: 筑基后期
      身份: 舞姬苑资深舞姬
      特点: 在极乐宫待了二十年已经认命的女修。对新来的舞姬偶尔流露同情，但更多时候选择沉默
</极乐宫>
