<南疆秘境残卷>
南疆秘境残卷:
  上古巫帝传承:
    品级: 天级(残缺)
    所在: 古巫战场核心区域
    状态: 远古巫族内战中两大派系首领的巫道传承残篇，封印在战场中央的破碎石柱之中。石柱被战魂环绕守护，进入核心区的修士十之八九会被战魂侵蚀心智沦为傀儡
  瘴母心法:
    品级: 地级上品(残缺)
    所在: 瘴母之源核心
    状态: 以瘴母深潭中的毒之本源为修炼根基的毒道功法，刻在深潭底部的黑色岩壁上。瘴气浓度极高，炼虚期以下进入必死，至今无人取得完整版
  万蛊之祖残经:
    品级: 天级(残缺)
    所在: 万蛊噬龙窟深层
    状态: 据传是上古真龙陨落后龙尸孕育万蛊之祖时留下的远古蛊道传承，封印在噬龙窟最深处月姬残魂镇压之地。真仙以下进入必死
  祖灵巫阵图谱:
    品级: 地级(残缺)
    所在: 巫神山祖灵之地
    状态: 历代大巫祝的巫道传承与毕生功力封存其中，是巫神教最高机密。巫神山祖灵之地由万灵巫阵守护，仅现任大巫祝可入
</南疆秘境残卷>
