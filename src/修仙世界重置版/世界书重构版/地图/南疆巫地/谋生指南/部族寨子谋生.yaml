<南疆部族寨子谋生>
南疆部族寨子谋生:
  凡人:
    猎人: 最普遍的谋生方式。出寨猎低阶灵兽与毒虫，卖皮毛肉骨。日收入约3-8兽牙串
    采药人: 在雨林边缘采集草药灵草，卖给寨中巫师或千虫市集药贩。日收入2-5兽牙串
    编织工: 编藤篮、竹器、绳索等日用品。手巧者日收入3-6兽牙串
    巫师学徒: 跟随寨中巫师学习初级巫术。不给报酬但管饭
    渔民: 黎母江沿岸寨子的常见营生。日收入2-5兽牙串。需防水蛊和毒蛟
    向导: 带外来修士穿越雨林或沼泽边缘。日收入10-30兽牙串，风险高但收入远超其他凡人工作
    日常: 天亮起床生火做饭，白天劳作，傍晚回寨。寨门日落即关，防毒虫夜行
  日常生活节奏:
    卯时(5-7点): 天色微亮即起，生火煮竹筒饭
    辰时(7-9点): 猎人出寨，采药人入林，妇女编织或照料灵田
    午时(11-1点): 在林中或田间吃干粮
    申时(3-5点): 猎人开始返程，采药人收工
    酉时(5-7点): 回寨交货，篝火旁聚餐
    亥时(9-11点): 关门掩窗，点燃驱虫香入睡
    瘴气季: 全寨不出门，靠储备粮度日
</南疆部族寨子谋生>
