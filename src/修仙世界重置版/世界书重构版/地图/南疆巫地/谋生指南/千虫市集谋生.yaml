<南疆千虫市集谋生>
南疆千虫市集谋生:
  凡人:
    摊贩: 在市集摆摊卖杂货、食物、低级材料。需向巫神教缴纳摊位费(5蛊珠/月)。日收入3-15蛊珠不等
    搬运工: 给摊主搬货、整理蛊虫笼。日收入2-3蛊珠加一顿饭
    虫饲: 替蛊师喂养低级蛊虫。日收入1-2蛊珠
    日常: 市集卯时开市酉时散摊。白天在市集忙碌，晚上回市集外围的窝棚区休息
  低阶修士特有:
    蛊虫鉴定: 帮买家鉴别蛊虫品种和品级。1-5下品灵石/次
    毒物提炼: 从灵兽体内提取毒液毒粉。按材料价值抽成
    巫器修复: 修复损坏的巫器法器。5-20下品灵石/件
    赌蛊庄家: 开赌蛊档口。利润极高但需要货源
  修士一天:
    无固定作息。市集卯时开市酉时散摊但蛊虫交易区全天运作
    白天在市集摆摊交易或在雨林中猎取材料
    夜间修炼或到市集深处的斗蛊场观战下注
    每月初一十五巫神教举办大型祭祀，市集休市一天
</南疆千虫市集谋生>
