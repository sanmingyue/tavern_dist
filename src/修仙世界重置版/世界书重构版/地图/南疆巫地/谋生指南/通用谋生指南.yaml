<南疆通用谋生指南>
南疆通用谋生指南:
  低阶修士(炼气至筑基)通用:
    猎妖: 雨林和沼泽边缘猎灵兽毒虫。炼气期日收入5-20下品灵石，筑基期日收入20-80下品灵石
    采药: 深入雨林采集中高阶灵草。比凡人采药人能进入更深的区域
    护卫: 给商队当护卫。千虫市集到熔金城线路，筑基期一趟10-30下品灵石
    驱蛊解毒: 有驱蛊解毒本领的修士在南疆极受欢迎。上门服务5-30下品灵石/次
    炼蛊: 有蛊术基础的修士可在千虫市集代客炼蛊养蛊

  宗门体系:
    巫神教外门弟子: 学习巫术蛊术，参与祭祀巡逻。宗门包食宿
    赤阳谷外门弟子: 学炼器、修炼火系功法。宗门包食宿
    药神谷外门弟子: 学医术炼丹。宗门包食宿，药材供给充足
    蛊魔宗外门弟子: 在百毒沼泽外围采集蛊虫材料。宗门管饭不给钱
    玲珑绣阁弟子: 仅收女修。学习因果之术与绣阵。待遇优厚
    生命之森: 极少收外族弟子

  中阶修士(金丹至元婴):
    经营: 在千虫市集或熔金城开铺子。蛊虫买卖、药材交易、炼器坊都是利润丰厚的营生
    宗门管理: 在各宗门中担任长老、堂主等中层职务
    独立探索: 进入百毒沼泽深层、古巫战场等危险区域寻找机缘
    巫师寨主: 在偏远地区建立自己的部族寨子
    客座药师: 受邀前往各寨子行医解蛊

  生存建议:
    新手区: 熔金城(最安全)
    落脚区: 千虫市集、黎母江沿岸寨子
    进阶区: 迷雾雨林边缘
    危险区: 百毒沼泽
    禁区: 百毒沼泽深层/万蛊噬龙窟/古巫战场/各宗门核心
</南疆通用谋生指南>
