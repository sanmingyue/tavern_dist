<南疆通用物价>
南疆通用物价:
  货币体系:
    灵石: 修士间硬通货，下品→中品→上品，每级兑换比1:1000
    兽牙串: 南疆部族凡人通用货币。1串(10颗)约等于1斤普通妖兽肉
    蛊珠: 千虫市集特殊货币。1颗蛊珠约等于5-10兽牙串
    兑换参考: 1下品灵石约等于150-250兽牙串，约等于20-30蛊珠

  丹药(药神谷正品):
    疗伤丹(黄级下品): 1-2下品灵石
    解毒丹(黄级中品): 3-5下品灵石
    驱蛊丹(南疆特色): 5-10下品灵石
    筑基丹: 200-500下品灵石
  散修游方药师: 林药师级别的配药3-8下品灵石/副

  材料:
    蛊玉(十万大山南疆支脉): 30-80下品灵石/块
    火晶石(炎狱山): 50-120下品灵石/块
    毒铁矿(南疆支脉): 20-50下品灵石/块
    百毒沼泽毒藻: 5-15下品灵石/斤

  凡人武器:
    猎刀(骨制): 10-15兽牙串
    毒箭(自制): 5兽牙串/10支
    兽皮甲(简易): 30兽牙串
    吹箭筒(含毒针): 20兽牙串

  服务:
    向导(部族猎人): 10-30兽牙串/天，修士向导5-20下品灵石/天
    解毒(药神谷弟子): 5-30下品灵石
    驱虫阵(临时): 3-5下品灵石/夜

  瘴气季物价普遍翻倍
</南疆通用物价>
