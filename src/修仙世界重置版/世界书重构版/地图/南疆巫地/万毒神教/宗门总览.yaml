<万毒神教>
万毒神教:
  势力定位: 邪道至宗，南疆禁域，毒蛊双绝
  核心理念: 万蛊之祖即是神，以蛊为媒，以毒入道
  山门地点: 南疆巫地深处·蛊神谷

  核心人物:
    万骸老祖:
      修为: 真仙境三重天
      身份: 万毒神教教主，蛊神代言人
      特点: 已非人形，身体与万蛊池融为一体。献祭全族换来力量，丧失全部人类情感，以蛊虫逻辑思考。唯一能引起注意的是高品质炼蛊材料
    毒娘子:
      修为: 渡劫期
      身份: 万毒神教七彩长老，万骸老祖唯一亲传弟子
      特点: 天生七彩毒体，深紫色瞳孔，七彩指甲，走到哪都有甜腻花香。把毒当成艺术，给毒取名"梦里花开"
    夜幽:
      修为: 化神期
      身份: 万毒神教圣女
      特点: 万毒之体，血液眼泪呼吸皆含剧毒，碰触即死。孤居万毒殿深处，万毒共鸣可操控百里内一切毒物
    夜烬:
      修为: 化神期
      身份: 万毒神教圣子
      特点: 噬毒灵根，能吞噬万毒转化为修为。张扬跋扈好战成性，对师妹夜幽极为护短
    离恨:
      修为: 化神期
      身份: 万毒神教圣子
      特点: 蚀骨灵根，能炼制侵蚀一切的剧毒。阴柔冷静如毒士，与夜烬风格截然相反

  势力特色:
    修炼方向: 毒蛊双修，以活人炼蛊为核心
    信仰核心: 信奉万蛊之祖，蛊神谷最深处万骸坑底部的远古存在
    组织结构: 教主为绝对统治者，下设左右护法、七彩长老、圣子圣女
    淘汰机制: 弟子是工具，有用留着没用扔进万蛊池喂蛊

  势力规模:
    核心弟子: 数千人
    外门弟子: 万余人
    附属蛊师村落: 若干
    炼蛊奴: 数千人，被掳来的凡人与低阶修士

  核心地点:
    蛊神谷:
      位置: 南疆巫地深处
      环境: 终年被七彩虹瘴笼罩，外人踏入即中毒。谷内地形复杂，毒虫遍地
      禁制: 万蛊护教大阵，以万骸老祖与万蛊池的连接为核心驱动
    蛊祖祭坛:
      位置: 蛊神谷中央
      性质: 祭祀万蛊之祖的圣地
      特殊: 祭坛石面上刻满远古蛊文，每逢祭日会自行发出微光
    万蛊池:
      位置: 蛊神谷核心
      性质: 饲养万蛊的巨大蛊池，教主万骸老祖与之融为一体
      环境: 池中蛊液翻涌，无数蛊虫在其中诞生与死亡，弱肉强食永不停歇
    万骸坑:
      位置: 蛊神谷最深处
      性质: 埋葬无数尸骸的深坑，蛊虫的天然温床
      底部: 万蛊之祖的本体深植于此处地脉之下，与整个山谷融为一体
    死寂阁:
      位置: 蛊神谷禁地中的禁地
      性质: 万毒神教最高机密所在
      进入条件: 仅教主可入

  对外关系:
    巫神教: 同域势力，互不侵犯但暗中竞争
    蛊魔宗: 同为蛊毒之道，既竞争又忌惮
    正道各宗: 敌对，尤其与药神谷医毒对立
    天剑圣地: 敌对
    玉清道宫: 敌对

  特色资源:
    蛊毒: 万毒神教独有的蛊毒配方，种类繁多威力惊人
    炼蛊材料: 万蛊池与万骸坑提供的大量炼蛊原料
    七彩虹瘴: 蛊神谷独有的天然毒瘴，可提炼为毒素
    蛊文残卷: 远古蛊道的典籍残篇

  路人NPC:
    骨面:
      修为: 元婴期大圆满
      身份: 万毒神教左护法
      特点: 戴一副骨制面具的高瘦男子，面具下据说已被蛊虫侵蚀面目全非。执行教主意志毫不迟疑
    蛊奴七:
      修为: 金丹期中期
      身份: 万蛊池守池人
      特点: 全身被蛊虫叮咬得体无完肤的中年男子，已对毒素产生耐受。日夜守在万蛊池畔，负责投喂与记录蛊虫变化
    赤蛊:
      修为: 筑基大圆满
      身份: 万毒神教外门弟子，负责捕猎炼蛊材料
      特点: 沉默寡言的年轻修士，擅长在雨林中追踪猎杀灵兽获取炼蛊材料。身上总带着一股刺鼻的毒气
</万毒神教>
