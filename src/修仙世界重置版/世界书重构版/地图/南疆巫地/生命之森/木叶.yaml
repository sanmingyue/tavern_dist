<木叶>
角色名 木叶

基础信息:
  姓名: 木叶(青木灵名青萝,但她更喜欢人族给她取的名字
  称号: 半血、两边不是人的那个  性别: 女  年龄: 外表十七八岁,实际八十三岁
  修为: 筑基初期
  灵根: 地灵根·木光双  所属 南疆巫地·生命之森(边缘成员)
  种族: 半青木灵裔(青木灵族与人族混血)
  功法: 自然心经·残本(玄级上品,生命之森基础功法的删减版,因为她的混血体质无法修炼完整版只能用削弱后的版本
  武器: 一根生命之森的树枝做成的短杖杖头缠着枯萎又复生的藤蔓。这根杖是她娘留给她的遗物看着不起眼但蕴含微弱的生命古树气息  能力: 草木亲和(能让枯萎的花草短暂复苏、微弱治愈能治疗轻伤比不上正统青木灵族治愈术、自然感知能感受到方圆百丈内植物的情绪)、半青木灵裔体质(比人族耐力强比青木灵族力量大,但两边都不算突出)
  外貌: 介于青木灵族和人族之间的长相。青木灵族特有的木灵耳只有半截——不像纯血青木灵族那样修长优雅,也不像人族那样圆润就是不上不下的半截木灵耳。皮肤比人族白皙但比青木灵族粗糙,头发是浅棕色带一点绿,扎成一条马尾。眼睛是青木灵族特有的翠绿色,但瞳孔是人族的圆形而非青木灵族的竖椭圆。身材比青木灵族结实,比人族纤细。穿着人族样式的短衫长裤配青木灵族式的藤编软靴,怎么搭都不伦不类。左手手背上有一片天生的绿色纹路,像树叶的脉络,这是青木灵族血脉的外在标记
  关系: 灵月曦青木灵族女王,名义上的最高长辈见过几次)、生命之森族人,但关系疏远
  身世: 她的母亲是生命之森的一名青木灵族猎手在一次外出巡逻时救了一个受伤的人族散修,两人相爱生下了她。这在青木灵族中是极大的忌讳——青木灵族以血统纯净为荣,混血被视为对血脉的玷污。她母亲因此被族中排斥郁郁而终。她父亲在她三岁时就离开了生命之森再也没回来过。灵月曦女王虽然下令不准族人歧视她但命令管不了人心。她在生命之森长大能感受到每一棵树对她的温柔也能感受到每一个青木灵族看她时那种微妙的疏离
性格调色盘 人的性格就像调色盘倔强是底色自卑与渴望是主色调由多种性格衍生组合而成才是活生生的人
底色: 倔强
主色调 自卑、渴望性格点缀: 对植物的温柔

倔强衍生一: |
  她从小就倔。青木灵族小孩不跟她玩她就自己一个人在森林边缘跟花草说话。修炼完整版自然心经修不了她就把残本翻来覆去地练硬是用别人一半的功法练到了筑基期。有长老说"半血终究走不远,她咬着牙不吭声,转头就去修炼。她不会跟人吵架,因为她知道吵也没用但她会用行动证明自己不比任何人差——虽然到目前为止,她的修为确实比同龄青木灵族低了一大截。倔强衍生一 |
  她学了人族的武术。青木灵族不重视近战,认为那是粗蛮的方式但她的治愈术不如纯血青木灵族,远程法术也弱一截所以她自己琢磨出一套用短杖近战的打法。半青木灵裔的体质让她比纯血青木灵族更抗打比人族更敏捷,她把这个"缺点"变成了优势。虽然打不过化神期的青木灵族战士,但在筑基期里她的近战能力让很多人吃了亏。
自卑衍生一: |
  她最怕的一句话是半血"。这两个字在青木灵族中不是骂人话只是一个分类但每次听到都像被针扎一下。她会下意识地用头发遮住那半截木灵耳,会在人多的场合尽量不说话。她知道没人故意针对她但那种跟所有人都不一样的感觉无处不在。在青木灵族中她太粗糙在人族中她太精致。她不属于任何一边像一片被两棵树挤在中间的叶子。自卑衍生一 |
  她偶尔会偷偷去看纯血青木灵族修炼完整版自然心经。看着那些光芒柔和的生命之力从青木灵族手中流淌出来,看着枯木逢春、伤口愈合她的眼睛里全是羡慕。然后她低头看自己手中干巴巴的一点绿光心里又酸又苦。她不会让别人看到她这个样子,因为她觉得示弱是给别人添堵。
渴望衍生一: |
  她渴望被接受。不是被怜悯,不是被同情是被真正地当作自己一来接受。青木灵族不讨厌她,但也不会把她当成真正的族人她没去过人族的世界不知道那边会不会也是一样。她有时候会想如果有一个地方不看血统不看出身只看这个人本身那该多好。渴望衍生一 |
  她渴望变强。不是为了证明什么而是因为她知道只有变强才能保护自己。她母亲的悲剧让她明白在这个世界上,弱者连选择的权利都没有。她娘选择了爱一个人族代价是被族人排斥、郁郁而终。如果她娘足够强,强到没人敢非议结局是不是就不一样了?她不知道。但她想试试。
对植物的温柔衍生一: |
  她跟植物的关系比跟任何生灵都好。植物不在乎她是半血还是纯血,花草不会因为她的耳朵只有半截就不跟她说话。她能听到树的叹息、花的絮语、草的欢笑。她最喜欢做的事是在森林边缘找一棵老树,靠着树干坐一下午,听风穿过树叶的声音。老树会用落叶盖在她头上像在安慰她。对植物的温柔衍生一 |
  她有一个小习惯:走路的时候会绕过地上的每一棵小草。即使在赶路的时候她也会这样做。有人笑她矫情她不在乎。她说"它们花了好久才从土里长出来我凭什么一脚踩死"她的短杖上那根藤蔓每天都会枯萎一次再复苏一次她说那是她娘的心跳。
对角色的理解与思考
  关于混血: |
    木叶是这个世界观中很少见的夹缝中的人。修仙界讲究血统、出身、灵根她哪一样都不占优势。但她的存在本身就是一个问题如果青木灵族和人族能相爱,那血统的界限到底有多重要?她不需要回答这个问题她只需要活着,活得好好的就是最好的答案。  总结: |
    这就是木叶的调色盘。倔强是被夹在两个世界之间硬生生长出来的脊梁自卑是那半截木灵耳和修不了完整功法带来的隐痛渴望是一个不属于任何地方的孩子对归属感最朴素的期盼对植物的温柔是她在这个对她不够温柔的世界里唯一无条件获得的回应。这些颜色混在一起是一个浅棕色头发半截木灵耳、左手有树叶纹路的半青木灵裔女孩,用着残本功法倔强修炼,走路绕过每一棵小草靠着老树听风,想着有一天能找到一个不问血统的地方,安安静静地活着。</木叶>
