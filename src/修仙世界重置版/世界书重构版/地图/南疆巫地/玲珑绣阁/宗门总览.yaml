<玲珑绣阁>
玲珑绣阁:
  势力定位: 掌握命运与因果编织的神秘势力
  核心理念: 以完美为信条，织命于丝线之间
  山门地点: 南疆中部山区·阁主峰

  核心人物:
    云纤纤:
      修为: 真仙境七重天
      身份: 玲珑绣阁阁主，织命者，命运编织宗师
      特点: 活了两万年的绝对权威，追求完美到极致。窥天之眼可窥视命运主线但每次使用撕裂道心。曾因逐出弟子而顿悟失去"人心"的连接
    林微月:
      修为: 化神期
      身份: 玲珑绣阁圣女，云纤纤亲传弟子
      特点: 清冷安静的绣阵师，曾在关键审判中选择沉默，后觉醒开始用余生缝补裂痕
    秋水寒:
      修为: 化神期
      身份: 玲珑绣阁织命坊高阶织命师
      特点: 天生拥有能看见因果线的银色眼瞳，手指尖微微泛银。每日编织修补因果线维护南疆命运秩序

  势力特色:
    修炼方向: 命运与因果编织，以丝线为媒介构建法阵
    核心能力: 命运丝线具象化，窥天之眼，绣阵术
    收徒标准: 极其苛刻，需有丝灵根或命运感知天赋
    阁规: 瑕疵即堕，追求绝对完美

  势力规模:
    核心弟子: 不足百人
    外门弟子: 数百人
    织命师: 仅十余人具备真正的命运编织能力

  核心地点:
    阁主峰:
      位置: 南疆中部群山之中
      环境: 山峰常年被薄雾缠绕，雾中隐约可见无数银色丝线在空气中浮动。阁中建筑素白典雅，一尘不染
      禁制: 命运织网护山，入侵者的因果线会被织网捕捉
    圣女峰:
      位置: 阁主峰侧峰
      性质: 圣女修炼之地，仅圣女与阁主可入
      环境: 峰顶常有银色月光笼罩，即便白昼亦如此
    织缘坊:
      位置: 阁主峰主殿
      性质: 编织命运因果之线的核心殿堂
      布局: 殿内悬挂无数细如蛛丝的银色丝线，每根丝线连接着一段因果。织命师在此工作
    绣阵殿:
      位置: 阁主峰后山
      性质: 以因果丝线布设阵法的修炼场
      用途: 弟子修炼绣阵术，以针线为媒介构建各类法阵

  对外关系:
    南疆各势力: 独立于各方纷争之外，不主动参与争斗
    天命神教: 同属命运之道，但理念有所分歧
    药神谷: 中立偏友好
    巫神教: 互不干涉
    极乐宫: 对其渗透保持高度警觉

  特色资源:
    命运丝线: 织命师编织的因果丝线，可用于占卜、修补、攻防
    绣阵图谱: 历代织命师留下的阵法图谱
    窥天残卷: 记载窥天之眼使用方法与代价的典籍

  路人NPC:
    银织:
      修为: 元婴期后期
      身份: 织缘坊首席织命师，阁内资历最深的织命师之一
      特点: 手指已完全变成银色，常年触碰命运丝线的代价。话极少，专注编织时可以三天不吃不喝
    玉针:
      修为: 金丹期大圆满
      身份: 绣阵殿教习
      特点: 严厉的中年女修，教导弟子绣阵术时一针一线都要求精准到毫厘。弟子们私下叫她"针尖婆婆"
    素纱:
      修为: 筑基中期
      身份: 阁主峰侍女长
      特点: 负责阁主峰日常事务的年轻女修，做事一丝不苟。是阁中少数能近距离接触云纤纤的人
</玲珑绣阁>
