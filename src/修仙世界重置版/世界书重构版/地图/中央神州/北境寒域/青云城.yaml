<青云城>
青云城:
  定位: 青云宗附属城池,北境中型修仙城市

  地理位置: 青云山脉山脚,云雾缭绕

  城池规模:
    人口: 数百万
    面积: 中型城池
    城墙: 普通灵石加固,防御中等

  城池特色:
    世家云集: 城中世家大族众多,与青云宗盘根错节
    等级分明: 世家子弟与普通修士待遇差距极大
    剑修聚集: 剑修数量较多,但水平参差不齐
    表面繁华: 看似热闹繁荣,内里阶层固化严重

  经济活动:
    世家垄断: 主要贸易被世家把持,散修难以插足
    灵田产出: 周边灵田产出中等,供养宗门与城中居民
    杂役市场: 大量底层修士在此接杂役任务糊口
    二手法器: 世家子弟淘汰的法器在此低价流通

  重要地点:
    青云剑场: 宗门弟子与城中剑修切磋之地
    百味楼: 城中最大的酒楼,世家子弟常出入之所
    散修巷: 城南一条窄巷,低阶散修聚居之地,物价低廉
    杂役行会: 发放杂役任务的机构,底层修士赖以生存

  城池氛围:
    表里不一: 外表正派光鲜,内里世家横行
    阶层固化: 出身决定一切,散修几乎没有出头之日
    人情冷暖: 对世家子弟热情恭敬,对散修和杂役冷眼相待
    议论纷纷: 风烬雪之事在城中广为流传,人人心知肚明却无人公开谈论

  常驻路人:
    周掌柜:
      身份: 百味楼掌柜
      年龄: 五十余岁
      修为: 炼气九层
      灵根: 黄灵根·双属性(水火)
      特征: 圆滑世故,见人说人话见鬼说鬼话,世家子弟来了满脸堆笑,散修来了爱答不理,但私下对风烬雪的遭遇唏嘘不已
    刘小满:
      身份: 散修巷杂货铺小贩
      年龄: 二十三岁
      修为: 炼气五层
      灵根: 黄灵根·三属性(金水土)
      特征: 散修出身,在城中讨生活,专收世家子弟淘汰的法器低价转卖,嘴碎话多但心眼不坏
    赵氏:
      身份: 杂役行会登记员
      年龄: 四十余岁(凡人)
      修为: 无修为
      特征: 凡人寡妇,丈夫死于魔族入侵,在杂役行会当了十五年登记员,对每个来接任务的底层修士都和颜悦色
    陈世安:
      身份: 青云宗外门弟子,散修巷值守
      年龄: 三十五岁
      修为: 筑基初期
      灵根: 玄灵根·双属性(金木)
      特征: 散修出身勉强入了外门,被派来看管散修巷,对同为散修的底层人多有照顾,暗中敬佩风烬雪
    王老三:
      身份: 青云剑场看门老头
      年龄: 七十余岁(凡人)
      修为: 无修为
      特征: 在剑场扫地三十年,见过无数世家子弟和散修比剑,常感叹世道不公,但从不敢大声说
</青云城>
