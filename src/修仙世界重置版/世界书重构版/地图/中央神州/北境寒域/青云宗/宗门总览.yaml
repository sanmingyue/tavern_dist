<青云宗>
青云宗:
  定位: 正道中等宗门,表面正派,内里复杂

  核心理念: 维护宗门荣誉,重视血脉传承

  修炼体系:
    剑道传承: 以剑道为主,但水平不及剑宗
    血脉重视: 极为看重弟子出身和血统
    等级森严: 世家子弟与散修弟子地位天差地别

  宗门特色:
    门阀势力: 宗门内世家势力强大,把持话语权
    忘恩负义: 百余年前风烬雪燃烧本源击退魔道救宗门,事后却被无情抛弃
    寒池禁地: 设有专门囚禁无用之人的禁地,条件极其恶劣
    冷血无情: 英雄无用后便一脚踢开,典型的过河拆桥
    派系斗争: 内部派系林立,明争暗斗不断

  宗门结构:
    宗主: 青云道人,表面公正,实则被世家势力左右
    长老院: 多由世家长老把持
    世家弟子: 享有特权,资源倾斜
    散修弟子: 地位低下,常被欺压
    囚徒: 风烬雪等罪人被囚禁在寒池禁地

  宗门规模:
    宗主: 青云道人
    长老: 十余位,多为世家出身
    内门弟子: 八百余人
    外门弟子: 五千余人
    附属势力: 青云城,人口数百万

  弟子阶梯:
    杂役弟子:
      人数: 两千余人
      修为范围: 凡人至炼气初期
      职责: 侍候世家弟子、打扫山门、种植灵田、搬运杂物
      特征: 多为散修出身或走投无路之人,地位如同奴仆,几乎无晋升可能
    外门弟子:
      人数: 五千余人
      修为范围: 炼气中期至筑基中期
      职责: 日常巡逻、接取宗门任务、协助世家弟子修炼
      特征: 散修弟子与世家旁系混杂,资源分配极不均等,散修仅得最低配给
    内门弟子:
      人数: 八百余人
      修为范围: 筑基后期至金丹中期
      职责: 协助长老处理宗务、参与宗门对外交涉、修习核心剑诀
      特征: 八成以上为世家子弟,散修晋升内门难如登天,需世家长老举荐
    核心弟子:
      人数: 不足五十人
      修为范围: 金丹后期至元婴初期
      职责: 随长老修行、代表宗门参加比武、执掌一方事务
      特征: 清一色世家嫡系,从未有散修出身者跻身其中

  特色地点:
    寒池禁地:
      位置: 青云宗后山极寒之地
      环境: 终年冰封,灵气稀薄,条件恶劣
      用途: 发配无用之人的地方
      现状: 风烬雪日复一日坐在刺骨寒池中,以极寒压制体内残余灵力
      监管: 有专门看守,定期送来最低等的饭食,禁止探访
      意义: 名为禁地,实为遗弃,让无用之人自生自灭

  山门地点:
    位置: 中央神州北部·青云山脉
    环境: 云雾缭绕,灵气充沛
    建筑: 恢宏大气,等级分明
    分殿: 世家弟子住处奢华,散修弟子简陋

  与外界关系:
    与剑宗: 同为剑道传承,但差距明显
    与世家势力: 内部世家与外界世家盘根错节
    与正道: 名义上是正道中坚,实则名声不佳

  宗门黑历史:
    风烬雪事件:
      百余年前: 魔道大举入侵,风烬雪为守护宗门燃烧本源灵根,以自毁为代价击退强敌
      付出代价: 修为尽废,灵根断裂,剑心破碎,双目失明,青丝化白雪
      事后态度: 师妹夺其剑谱,师兄占其洞府,同门虚伪探望
      宗主决定: 以已无用处为由将风烬雪发配至寒池禁地
      现状: 风烬雪独自在寒池中忍受刺骨寒冷和体内灵力冲撞的双重痛苦
      真相: 英雄救了宗门却被当垃圾扔掉
      禁忌话题: 宗门上下都知道此事,但无人敢提,成为最大的耻辱

  宗门处境:
    实力: 正道中等宗门,不上不下
    名声: 外界名声尚可,但修真界都听说过风烬雪救宗门后被抛弃的事
    耻辱: 恩将仇报的名声已经传开,青云宗在修真界被人瞧不起
    隐患: 世家势力过大,散修弟子离心,人心涣散
    矛盾: 宗门上下都觉得对不起风烬雪,但没人敢说,也没人愿意改变

  宗门氛围:
    表面: 正气凛然,仙风道骨
    内里: 等级森严,暗流涌动
    世家弟子: 骄横跋扈,欺压散修
    散修弟子: 敢怒不敢言,只能忍气吞声

  关键人物:
    青云道人:
      身份: 青云宗宗主
      修为: 大乘期后期
      性格: 表面公正,实则被世家势力裹挟,优柔寡断
    风烬雪:
      身份: 曾经的青云宗第一天才,现被囚禁于寒池禁地
      修为: 修为尽废,曾合体期后期大圆满
      灵根: 曾地灵根·金,已断裂破碎
      性格: 通透平静,淡漠世事,钢铁意志
    柳如烟:
      身份: 外门弟子,曾被誉为青云第一天才
      修为: 筑基后期
      灵根: 天灵根·单木
      性格: 不甘坚韧,善良温柔,自卑中带着骄傲
</青云宗>
