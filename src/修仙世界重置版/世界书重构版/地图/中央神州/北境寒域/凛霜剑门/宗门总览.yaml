<凛霜剑门>
凛霜剑门:
  定位: 正道强宗,冰系剑道传承

  核心理念: 冰心剑魄,霜冷九州

  修炼体系:
    冰系剑诀: 核心功法,剑气附带极寒之力
    寒心诀: 修炼心法,以冰寒淬炼剑心,磨砺意志
    霜冻领域: 高阶剑修可展开寒冰领域,冻结万物

  宗门特色:
    纯女性宗门: 只招收女弟子
    门规森严: 戒律严苛,违者严惩
    气质清冷: 弟子皆气质清冷,不苟言笑
    剑术高绝: 以冰系剑道闻名天下,攻守兼备

  与外界关系:
    与剑宗: 同为剑修,互相尊重,偶有切磋
    与赤阳谷: 冰火相克,关系微妙,有竞争
    与北原魔土: 常年守卫北境,与魔族交战

  山门地点:
    位置: 中央神州极北·万仞寒山
    霜剑主峰: 凛霜剑门核心,峰顶常年被冰霜风暴笼罩
    寒池剑庐: 弟子修炼之所,建于冰湖之上
    环境: 终年冰封,寒风凛冽,积雪千年不化
    战略意义: 守卫北境要塞,抵御魔族南侵

  宗门规模:
    门主: 顾千雪
    峰主: 七位
    内门弟子: 八千余人
    外门弟子: 五万余人
    附属势力: 临渊城及北境要塞群

  弟子阶梯:
    杂役弟子:
      人数: 三万余人
      修为范围: 凡人至炼气初期
      职责: 打扫山门、清理冰霜、搬运物资、维护阵法灵石供给
      特征: 多为北境贫寒女子,入门后先做杂役磨砺心性,需通过寒池试炼方可晋升
    外门弟子:
      人数: 五万余人
      修为范围: 炼气中期至筑基后期
      职责: 日常巡防、北境要塞轮值、接取悬赏任务、协助寒系材料采集
      特征: 已习得基础冰系剑诀,可独立执行巡逻任务,多数一生止步于此
    内门弟子:
      人数: 八千余人
      修为范围: 筑基大圆满至金丹后期
      职责: 驻守要塞核心、参与对魔族作战、修习高阶冰系剑诀
      特征: 通过冰心试炼选拔而出,每人配有专属冰系飞剑,战力远超同阶
    核心弟子:
      人数: 三百余人
      修为范围: 金丹大圆满至元婴后期
      职责: 随峰主修行、领军出征、执行高危任务、代师授课
      特征: 各峰峰主亲传,冰系剑道已入小成,可施展寒冰领域雏形

  特色资源:
    寒晶: 极寒之力凝聚的晶石
    冰髓: 万年寒冰精华
    霜铁: 炼制冰系飞剑的材料

  门规戒律:
    严禁与男子私通,违者逐出师门
    严禁泄露剑诀,冰系剑诀不得外传
    严禁畏战,面对强敌不得退缩

  关键人物:
    顾千雪:
      身份: 凛霜剑门宗主
      修为: 渡劫期后期
      灵根: 天灵根·冰
      性格: 冷峻严苛,责任心极重,护短偏执。以铁腕治宗,被誉为千年来最强宗主
    林寒月:
      身份: 大弟子,阵法师
      修为: 化神初期
      灵根: 地灵根·霜
      性格: 冷静沉稳,严谨自律,对师父近乎盲目信任
    苏清河:
      身份: 二弟子,丹师
      修为: 元婴后期
      灵根: 地灵根·风
      性格: 温柔细致,心思细腻,善解人意
    叶冰心:
      身份: 三弟子,剑修天才
      修为: 金丹中期
      灵根: 地灵根·冰
      性格: 活泼开朗,好胜自信,直率坦荡
</凛霜剑门>
