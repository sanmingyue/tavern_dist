<天仙门>
天仙门:
  定位: 正道末流小门派,勉强维持

  核心理念: 苟延残喘,勉力维系传承

  修炼体系:
    功法普通: 传承功法平平无奇,无任何特色
    资源匮乏: 灵石、丹药、法器都极度缺乏
    修炼缓慢: 弟子修炼进度极慢,难以突破

  宗门特色:
    贫穷: 穷得叮当响,宗门最大的特点就是穷
    杂役众多: 大量杂役弟子支撑宗门运转
    欺软怕硬: 对外软弱,对内苛刻
    等级森严: 内门弟子和杂役弟子待遇天差地别

  宗门结构:
    掌门: 天仙真人,修为不高,能力平庸
    长老: 三位,同样平庸
    内门弟子: 不到百人
    外门弟子: 数百人
    杂役弟子: 上千人,宗门主要劳动力

  宗门规模:
    掌门: 天仙真人
    长老: 三位
    内门弟子: 八十余人
    外门弟子: 三百余人
    杂役弟子: 一千余人
    附属势力: 天仙镇,人口数万

  弟子阶梯:
    杂役弟子:
      人数: 一千余人
      修为范围: 凡人至炼气二层
      职责: 种灵田、劈柴挑水、洗衣做饭、修补茅屋、下山采买
      特征: 多为走投无路的穷人,图一口饭吃,修炼资源几乎为零,全靠苦力维系宗门运转
    外门弟子:
      人数: 三百余人
      修为范围: 炼气三层至炼气七层
      职责: 下山接杂役任务赚灵石、巡逻山门、协助照看灵田
      特征: 功法粗浅,修炼进度极慢,大多一生卡在炼气期,但比杂役弟子多分到一点灵石
    内门弟子:
      人数: 八十余人
      修为范围: 炼气八层至筑基中期
      职责: 修习宗门核心功法、管理外门弟子、代表宗门出席小型聚会
      特征: 天仙门最精锐的力量,但放在外界不过是散修水准,享有宗门最好的资源配给
    核心弟子:
      人数: 无(天仙门无力培养核心弟子)

  杂役制度:
    地位: 杂役弟子地位极低,如同奴仆
    工作: 负责洗衣、做饭、打扫、种田等杂活
    报酬: 每月仅有微薄的灵石和粮食
    晋升: 几乎没有晋升机会,炼气期都难以突破
    压榨: 被内门弟子随意使唤,敢怒不敢言

  山门地点:
    位置: 中央神州偏远地区·天仙岭
    环境: 灵气稀薄,位置偏僻
    建筑: 破旧简陋,年久失修
    杂役居所: 最简陋的茅草屋,漏风漏雨

  特色资源:
    贫瘠灵田: 几块贫瘠的灵田,产出极少
    破旧法器: 传承法器都已破损不堪

  与外界关系:
    被轻视: 被其他宗门看不起,地位极低
    被欺凌: 经常被其他小门派欺负,只能忍气吞声
    散修聚集: 一些走投无路的散修会投靠,当杂役混口饭吃

  宗门处境:
    衰落: 已经衰落了数百年,勉强维持不灭门
    收入: 主要靠杂役弟子下山接任务赚取灵石
    危机: 随时可能被其他势力吞并或灭门
    弟子流失: 稍有天赋的弟子都想办法离开

  宗门氛围:
    死气沉沉: 全宗上下都笼罩在贫穷和绝望中
    欺压成风: 内门弟子欺压杂役成风
    人情淡薄: 人人自保,毫无温情
    麻木不仁: 对不公已经麻木

  关键人物:
    天仙真人:
      身份: 天仙门掌门
      修为: 化神期中期
      性格: 能力平庸,守成无为,对宗门衰败无能为力
    陆沉:
      身份: 天仙门唯一正式弟子
      修为: 炼气九层
      灵根: 黄灵根·三属性(土水木)
      性格: 踏实乐观,责任感强,种地修仙
    黎萱:
      身份: 天仙门杂役弟子
      修为: 炼气未入门
      灵根: 杂灵根·五行俱全
      性格: 怯懦自卑,心中有家人之爱支撑,倔强不屈
</天仙门>
