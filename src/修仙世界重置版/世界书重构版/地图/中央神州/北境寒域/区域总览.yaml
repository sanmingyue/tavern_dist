<北境寒域>
北境寒域:
  方位: 中央神州极北,靠近凛风海峡
  地貌: 万仞寒山终年冰封,青云山脉寒气凝重,天仙岭灵脉贫瘠
  气候: 常年严寒,暴雪频繁,北风刺骨。越往北越冷,靠近凛风海峡处已有魔气渗透

  核心势力:
    凛霜剑门: 万仞寒山,冰系剑道传承,只收女弟子,宗主顾千雪(渡劫期后期)
    青云宗: 青云山脉,正道中等宗门,宗主青云道人(大乘期后期)
    天仙门: 天仙岭,正道末流穷困潦倒,宗主天仙真人(化神期中期)

  附属城镇:
    临渊城: 北境主城,凛霜剑门管辖,寒晶交易中心,北境守卫前哨
    青云城: 青云宗管辖的城池,寒属性灵材集散地
    天仙镇: 天仙门管辖的小镇,人口稀少,灵脉贫瘠

  区域特色:
    北境门户: 中央神州面对北原魔土的第一道防线,凛霜剑门承担主要守卫职责
    灵气偏寒: 区域内灵气偏冰寒属性,适合冰系修士修炼
    资源分化严重: 万仞寒山寒晶冰髓丰富,天仙岭则灵脉贫瘠资源匮乏
    正道势力梯度: 从强宗凛霜剑门到中等青云宗再到末流天仙门,展现修仙界宗门实力差距的缩影
</北境寒域>
