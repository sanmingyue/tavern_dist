<中央神州功法总览>
中央神州功法总览:
  说明: 中央神州各势力功法体系。中央神州是阴阳大陆修真文明的核心，功法传承源远流长，体系完备，正邪兼备。六大仙宗各执一道，正道强宗各有特色，邪道宗门别走蹊径。宗门专属功法严禁外传，流通功法多源自覆灭宗门残卷、外传简化版或青冥秘境抄录。

  宗门专属功法:

    剑宗:
      万剑归宗:
        品级: 仙级
        传承: 谢云流自创的终极剑道，独一无二
        特点: 核心理念是万法归一、一剑破万法。修至极致时一草一木皆可为剑，天地万物皆是剑意。当世仅谢云流一人修成
      万剑归宗诀·无情篇:
        品级: 圣级
        传承: 剑宗镇宗功法分支，仅无情道顶尖弟子可修
        特点: 以冰系灵根催动无情剑道，将七情六欲尽数斩断，换取极致的剑道攻伐之力。修至大成则天地无情，一剑之下万物寂灭
      无情剑诀:
        品级: 天级下品至上品，视修炼层次而定
        传承: 印雪峰传承剑法，仅印雪峰弟子可修
        特点: 斩断七情六欲以剑入道，是无情道的核心功法。修炼越深越冷漠无情，但内心深处的执念反而越发炽烈。品级下限为天级下品，大成后可攀至天级上品
      万剑归宗诀·基础篇:
        品级: 地级中品
        传承: 剑宗外门弟子标准功法
        特点: 万剑归宗的入门版本，以灵力化剑气，习练御剑飞行和基础剑术。入门门槛不高但精通极难，是剑修入道的正统根基

    丹宗:
      丹元造化诀:
        品级: 天级上品
        传承: 丹宗镇宗功法，仅核心弟子修炼
        特点: 以丹入道，将炼丹之理融入修炼，炼化天地灵气如炼丹般精纯。修至大成则天地为炉、万物为药，可催生稀有灵药、炼制传说中的仙丹
      丹元基础功:
        品级: 玄级中品
        传承: 丹宗外门弟子标准功法
        特点: 丹元造化诀的基础版本，教授灵力控火、药性感知、药力引导等丹师基础功夫。丹宗外门弟子皆修此功打底

    百草庐:
      木灵长生诀:
        品级: 天级中品
        传承: 百草庐核心功法，仅内门弟子修炼
        特点: 以木灵气为根基，修炼者与草木灵性相通，可感知方圆百里内一切草木的生机状态。修至大成可以灵力催生万年灵药，寿元极长
      百草引气诀:
        品级: 凡级上品
        传承: 百草庐外门弟子入门功法
        特点: 引木灵气入体的最基础功法，教人感知天地间的草木灵性。修炼者对灵药的辨识能力会随修炼提升

    玄天宗:
      天机推演诀:
        品级: 天级上品
        传承: 玄天宗镇宗功法，仅核心弟子修炼
        特点: 以星辰灵力沟通天机，推演因果吉凶。修至大成可拨动命运轨迹，窥探未来一角。每一次推演都要承受天机反噬，或折寿或失明或疯癫
      星象观测功:
        品级: 玄级中品
        传承: 玄天宗外门弟子标准功法
        特点: 以星辰灵力感应天象变化的基础功法，修炼者可夜观星象推算简单吉凶。是踏入天机之道的第一步

    太虚宗:
      太虚符阵经:
        品级: 天级中品
        传承: 太虚宗镇宗功法，仅核心弟子修炼
        特点: 以符引天地、以阵锁乾坤的核心功法。修炼者可将灵力转化为符文之力，以自身为阵眼布置大阵。修至大成可一念成符、一步成阵
      符箓入门心法:
        品级: 玄级下品
        传承: 太虚宗外门弟子标准功法
        特点: 学习基础符文绘制与灵力注入的入门功法，教人将灵力凝聚为符文并刻录于符纸之上。太虚宗弟子入门必修

    天剑圣地:
      太上忘情剑:
        品级: 天级上品
        传承: 天剑圣地核心剑法，仅剑心通明以上弟子可修
        特点: 忘情而非无情，将世间一切情感化为剑意。修炼者表面如寒冰无波，实则内心深处铭记一切。剑心越纯粹剑意越强，是天剑圣地最强的攻伐剑法
      天剑道典:
        品级: 天级中品
        传承: 天剑圣地通用功法，内门弟子皆修
        特点: 天剑圣地的基础剑道传承，涵盖剑心磨砺、剑意凝聚、御剑飞行等核心功夫。弟子在此基础上自行领悟剑道方向

    玉清道宫:
      玉清大道经:
        品级: 天级中品
        传承: 玉清道宫镇宫功法，仅核心弟子修炼
        特点: 融合推演之道与阵法之理，以道法自然为核心理念。修炼者可推演天机、布置攻防阵法、调动地脉之力。是综合性极强的道家正统功法
      玉清大道经·入门篇:
        品级: 玄级上品
        传承: 玉清道宫入门功法
        特点: 玉清大道经的基础部分，适配先天道心修炼。教授道家基础的吐纳、存想、引气入体之法

    万法宗:
      万法归元诀:
        品级: 天级中品
        传承: 万法宗核心功法，仅核心弟子修炼
        特点: 海纳百川的综合性功法，修炼者可同时修炼多种属性灵力而互不冲突。万法宗弟子在此基础上择道而行，选修五行、炼体、丹器、符阵等分支
      万法基础功:
        品级: 玄级下品
        传承: 万法宗外门弟子标准功法
        特点: 万法归元诀的基础版，以均衡的灵力运转方式打好多属性修炼的根基。修炼者可初步尝试多种灵力运用

    大雍皇朝:
      人皇经:
        品级: 天级上品
        传承: 历代帝王传承，仅大雍帝王可修
        特点: 以人道气运为根基，万民之力加身。帝王修炼此功可调动国运、庇佑苍生，修为与国祚相辅相成。大雍历代帝王皆修此功
      星辰禁典:
        品级: 天级中品
        传承: 姬氏先祖创立，仅姬氏嫡系可修
        特点: 以星辰灵根沟通地脉，推演天命布置禁制。修炼者可布置护国大阵，是大雍皇朝最重要的防御体系支柱
      皇朝龙气诀:
        品级: 天级中品
        传承: 大雍皇族专修功法，仅皇族血脉可修
        特点: 借人道龙气修炼，以国运加持修为。皇族成员皆修此功，修为提升速度与皇朝气运密切相关
      天河暗影诀:
        品级: 地级极品
        传承: 大雍皇朝暗卫专修功法，仅暗影系传人可修
        特点: 融合刺杀与隐匿之道，修炼者可化入暗影悄无声息。是大雍皇朝培养暗卫刺客的顶级功法
      金刚体魄诀:
        品级: 玄级下品
        传承: 大雍禁军通用炼体功法
        特点: 以金灵气淬炼肉身，修炼者肉身坚硬如金。大雍禁军士卒皆修此功，效果稳定可靠

    天命神教:
      天命归元录:
        品级: 天级上品
        传承: 天命神教创教功法，仅教主可修完整版
        特点: 以天命之力驱动，可干涉因果命运，操控因果线。修至大成可窥破天机改写命运走向
      天命归元录·星篇:
        品级: 天级中品
        传承: 天命神教核心弟子分支功法
        特点: 天命归元录的分支，以星辰灵根感应天命流转，可预知吉凶
      天命归元录·影篇:
        品级: 天级下品
        传承: 天命神教影圣女专修
        特点: 天命归元录的分支，以光暗双灵根模拟命运之力，擅长暗中操控

    合欢宗:
      合欢天经:
        品级: 地级极品
        传承: 合欢宗镇宗功法，仅宗主和核心弟子可修
        特点: 以欲入道，通过灵与肉的极致交融修炼阴阳大道。双修可大幅提升修为并采补对方元气，配合媚术与幻术威力倍增
      合欢天经·暗香篇:
        品级: 地级极品
        传承: 合欢宗暗香阁专修功法
        特点: 合欢天经的隐匿分支，专精情报与暗杀。修炼者可变换面孔气息，潜伏于目标身边不被察觉
      千毒万蛊经:
        品级: 地级上品
        传承: 合欢宗毒术分支功法
        特点: 木火双灵根无法修炼双修功法者的替代功法，专精毒道与蛊术。以毒入道，可炼制千种蛊毒

    墨家机关城:
      墨家兼爱诀:
        品级: 玄级上品
        传承: 墨家机关城通用功法
        特点: 以灵力驱动机关术的核心功法，修炼者可将灵力精准注入机关造物使其运转。墨家弟子皆修此功
      墨家基础功法:
        品级: 黄级上品
        传承: 墨家机关城外门弟子入门功法
        特点: 教授基础灵力运转和机关原理的入门功法，为修炼墨家兼爱诀打基础

    万兽山庄:
      万兽心经·庄主秘卷:
        品级: 天级下品
        传承: 万兽山庄最高传承，仅庄主可修
        特点: 以兽灵根沟通天地万兽，掌控血脉奥秘。修至大成可令万兽臣服，以万噬鞭统御方圆千里灵兽
      万兽心经:
        品级: 地级中品
        传承: 万兽山庄核心功法，内门弟子皆修
        特点: 以精神力沟通驭使灵兽的驭兽功法，分战斗型和牧养型两大分支。战斗型重人兽合击，牧养型重灵兽培育

    苍澜国:
      苍风御气诀:
        品级: 玄级上品
        传承: 苍澜王室传承功法，仅王室血脉可修
        特点: 以风灵根驾驭天地之气，修炼者可催动狂风、凝聚风刃、御风飞行。苍澜王室子弟修炼此功

    并蒂宫:
      并蒂心法:
        品级: 天级上品
        传承: 并蒂宫镇宫功法，仅宫主修炼完整版
        特点: 纯阴灵力修炼功法，追求两位女修之间的灵魂交融与平等共鸣。修至最高境界纯阴灵力可凝为实质，护体攻敌两相皆宜
      并蒂心法·冰莲诀:
        品级: 天级中品
        传承: 并蒂宫通用功法
        特点: 并蒂心法的分支功法，以纯阴灵力修炼，双修可大幅提升速度但单修亦可。修炼者可幻化冰莲护体

    蝶化宗:
      阴阳蝶变诀:
        品级: 天级上品，大成境界
        传承: 蝶化宗核心功法，弟子皆修
        特点: 以阴柔灵力淬炼肉身，使修炼者外表趋于阴柔之美，同时内在阳刚之力不减反增，形成外阴内阳的独特体质。共九层，修至大成为仙境化蝶之境，阴阳灵力可随意转换

    噬心殿:
      噬心九诀:
        品级: 天级中品
        传承: 噬心殿殿主绝学，仅核心弟子可修
        特点: 以毒入道的核心功法，修炼至极可身具九毒，分别为心毒、魂毒、血毒、骨毒、筋毒、气毒、神毒、蛊毒、意毒。每凝聚一种毒性实力大增一截
      百毒不侵体:
        品级: 地级中品
        传承: 噬心殿内门弟子标准功法
        特点: 以微量毒素淬炼肉身使之百毒不侵的体修功法。修至大成则万毒不侵，触之者中毒，是修炼噬心九诀的前置功法

    归稚宗:
      归元心法:
        品级: 天级上品，完整版
        传承: 归稚宗核心功法
        特点: 修炼时将灵气注入全身经脉进行逆洗，肉身逐渐回溯至灵气亲和度最高的幼年形态。分三重，褪凡归真使外貌年轻数岁，婴儿大道回归稚童形态，混沌初心肉身完全归于初始态一念动天地

    凛霜剑门:
      寂灭玄冰策:
        品级: 天级上品
        传承: 凛霜剑门最高传承，仅宗主可修
        特点: 以极致寒冰之力融入剑道，修至大成可展开寂灭冰域，领域内万物冻结、生机断绝。千年来最强宗主顾千雪凭此功法威震北境
      凛霜剑诀:
        品级: 地级上品
        传承: 凛霜剑门核心剑法，内门弟子皆修
        特点: 以冰灵根为基走极寒剑道，剑气附带极寒之力，可冻裂敌手法器和经脉。修至大成可展开霜冻领域

    青云宗:
      青云木灵诀:
        品级: 天级中品
        传承: 青云宗传承功法，仅内门弟子可修，但世家垄断传承导致传授不完整
        特点: 木属性功法，以生机之力治愈与攻伐。本是一门上乘功法，但青云宗世家垄断传承，外门弟子和散修只能学到前三层

    天仙门:
      天仙引灵诀:
        品级: 黄级上品
        传承: 天仙门唯一的功法
        特点: 平平无奇的入门级修炼功法，勉强能修炼到金丹期再往上就没有了。天仙门贫穷至极，连功法都是残破不全的

    灵霄宗:
      灵霄风雷诀:
        品级: 天级下品
        传承: 灵霄宗核心功法
        特点: 以风雷之力攻伐，速度见长。品级不算低但灵霄宗弟子根基不稳，大量依赖丹药堆砌修为，实战能力偏弱

    天机阁:
      天机星衍诀:
        品级: 地级上品
        传承: 天机阁核心功法，仅核心弟子可修
        特点: 以星辰灵根感应天机辅助推演，兼修机关造物之术。修炼者可操控精密机关傀儡作战

  流通功法:

    灵气引导诀:
      品级: 凡级上品
      来源: 中央神州最基础的入门功法，来源已不可考
      流通: 各大城镇书铺都有出售，几乎不要钱。凡人习武者中广泛流传，可感知灵气但无法真正修炼

    五行聚灵功:
      品级: 黄级下品
      来源: 上古散修体系最基础的引气入体功法
      流通: 万宝商会大量铺货，几块下品灵石即可购得。中央神州散修的标准入门功法，比灵气引导诀高一级，可真正引气入体

    青冥剑法·残篇:
      品级: 黄级中品
      来源: 青冥秘境藏经楼一至三层抄录
      流通: 万宝商会和各大坊市均有出售，价格不高。已被多次抄录流入市场，只有青冥宗剑法的皮毛，但对散修剑修而言已是不错的参考

    太虚符阵入门:
      品级: 黄级上品
      来源: 太虚宗符箓入门心法的简化外传版本
      流通: 太虚宗万符楼公开出售，价格公道。只教最基础的符文绘制，画出的符箓威力远不及太虚宗弟子。但对散修而言已足够在野外防身

    星辉淬体功:
      品级: 黄级中品
      来源: 星河秘境外层修士自行总结的修炼法门
      流通: 天机城周边散修中广泛流传。以星辉沐浴淬炼肉身，净化灵力杂质。在星河秘境外层修炼效果显著，离开秘境后效果大减

    万法宗抄录功法:
      品级: 黄级至玄级不等
      来源: 万法宗藏经阁外层功法的简化版本
      流通: 万象城各书铺有售。万法宗有教无类，将部分基础功法以简化版本对外出售，种类繁多但每种都不算精深。是散修选择修炼方向的试金石

    金身铁布衫:
      品级: 黄级上品
      来源: 大雍禁军金刚体魄诀的简化外传版
      流通: 天启城周边武馆和散修中广泛流传。只有淬体之效没有灵力运转之法，修至大成可刀枪不入但仅限于凡铁兵器。凡人武者和炼气期散修中颇受欢迎

    百草辨识经:
      品级: 凡级上品
      来源: 百草庐对外传授的灵药辨识之法
      流通: 百草庐常春城公开出售，各地医馆药铺皆有。教人辨别灵药品种、年份、药性，不涉及修炼。采药散修和凡人药师的必备之物

  秘境残卷:

    青冥剑诀:
      品级: 天级上品
      所在: 青冥秘境·剑试崖崖顶
      状态: 末代宗主的佩剑"青冥"中封存的剑道核心传承。拔剑需通过剑试，崖壁上的剑招化为剑影攻击拔剑者，需以纯粹剑心一一应对。历次开启中无人通过剑试。传闻此剑诀融合了剑道与阵道双修之理

    天罗阵盘传承:
      品级: 地级上品
      所在: 青冥秘境·阵海中央阵塔
      状态: 青冥宗阵道长老的全套阵道传承和法宝"天罗阵盘"。进入阵塔需破解七重阵法守护，对阵道修士来说是无价之宝。曾有太虚宗弟子破解至第五重后被困数日方才脱身

    青冥宗主传承:
      品级: 天级以上，具体未知
      所在: 青冥秘境·青冥主峰宗主殿
      状态: 末代宗主留下的终极传承，至今无人获取。登顶需突破按境界递增的剑气屏障，即便登顶还需通过宗主殿内的最终考验。传闻考验与青冥宗覆灭的真相有关

    太虚之境竹简:
      品级: 天级以上，具体未知
      所在: 星河秘境·深层星核·太虚之境
      状态: 传说是太虚宗和玄天宗共同始祖的终极星道传承。石亭十丈之内星辰之力骤然增强百倍，至今无人靠近。取得竹简需星辰灵根修士以自身灵力与星辰之力共鸣，要求极高的灵根品质和对星道的深刻感悟

    星源泉:
      品级: 天级，传闻
      所在: 星河秘境·深层星核·星源岛
      状态: 岛上泉水即液态星辉，饮之可改善灵根资质。但泉水旁盘踞着一头化神期的星辰巨兽，万年来无人将其击退。此泉严格来说并非功法传承，但其价值不亚于任何功法
</中央神州功法总览>
