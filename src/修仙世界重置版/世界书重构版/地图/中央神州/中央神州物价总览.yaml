<中央神州物价总览>
中央神州物价总览:
  说明: 中央神州各地的物价参考。中央神州是修仙界的经济中心，万宝商会主导的灵石经济体系覆盖全域。物价相对稳定，但各区域因地理位置、宗门势力和供需关系有所差异。以下物价为太平年间的正常行情，遇宗门大战、秘境开启、魔潮南侵等情况价格会波动。

  货币体系:
    灵石: 修士间硬通货，下品→中品→上品→极品，每级兑换比1:1000。中央神州下品灵石和中品灵石均广泛流通
    凡俗货币: 铜钱→银两→黄金，1两银=1000文铜钱，1两金=10两银。凡人和低阶散修日常用
    兑换参考: 万宝商会灵石柜坊每月初公示月价，1两金兑1-3块下品灵石。天启城行情最稳，偏远城镇波动较大
    坊市令牌: 部分宗门坊市使用内部令牌清账，可在万宝商会兑换为灵石

  食物:
    凡人食物:
      白米: 3文铜钱/斤
      面粉: 2文铜钱/斤
      猪肉: 15文铜钱/斤
      鸡蛋: 1文铜钱/个
      烧饼: 2文铜钱/个
      汤面: 5文铜钱/碗
      茶馆一壶茶: 10文铜钱
      酒楼一桌席: 1-5两银
      路边馄饨摊: 3文铜钱/碗
      天启城宫廷菜: 10两银起/桌
    修士食物:
      辟谷丹: 5下品灵石/10粒，可代替一月饮食
      灵米饭: 1下品灵石/斤，含微量灵气，修士凡人皆可食用
      灵果: 2-10下品灵石/个，视品种
      灵茶: 5-50下品灵石/两，常春城百草庐所产最佳
      灵酒: 10-100下品灵石/壶，剑鸣城红尘酒家的酒不收灵石
      灵兽肉: 5-30下品灵石/斤，视妖兽等级
      万象城学府食堂: 1下品灵石/餐，含灵米和灵蔬

  武器与装备:
    凡人级:
      铁刀: 200文铜钱
      长弓: 500文铜钱
      铁甲: 5两银
      好马: 10-30两银
      牛车: 3两银
    法器级:
      炼气级法器: 10-50下品灵石
      筑基级法器: 50-300下品灵石
      金丹级灵器: 300-2000下品灵石，约1-2中品灵石
      元婴级灵器: 5-30中品灵石
      化神级宝器: 50-500中品灵石
      道器级: 拍卖制，上不封顶
    功法:
      黄级功法: 5-50下品灵石，万宝商会有大量存货
      玄级功法: 1-20中品灵石，视完整度和品级细分
      地级功法: 100+中品灵石，多走拍卖行
      天级以上: 有价无市，宗门传承不外流

  丹药:
    常规丹药:
      疗伤丹·黄级下品: 1-2下品灵石
      解毒丹·黄级下品: 2-3下品灵石
      聚灵丹·黄级中品: 5-10下品灵石
      培元丹·黄级上品: 20-50下品灵石
      筑基丹·玄级下品: 200-500下品灵石
      金丹还灵丹·玄级中品: 1-3中品灵石
      碎丹重凝丹·玄级上品: 10-30中品灵石
    稀缺丹药:
      元婴培灵丹·地级下品: 50-200中品灵石
      化神固魂丹·地级中品: 500+中品灵石
      渡劫护道丹·天级: 拍卖制
    特色丹药:
      百草庐·百草灵液: 3-8下品灵石/瓶，养生保健，凡人可用
      丹宗·品鉴丹: 非卖品，宗门内部用于丹道教学
      天启城·宫廷养颜丹: 50-100下品灵石，贵妇追捧

  材料:
    常见灵材:
      铁灵木: 1-5下品灵石/段
      青玉石: 5-20下品灵石/块
      赤铜矿: 3-10下品灵石/斤
      灵棉: 2-5下品灵石/匹
    中阶灵材:
      天蚕丝: 50-200下品灵石/两
      星辰砂: 100-500下品灵石/两
      万年寒铁: 1-5中品灵石/斤
      雷击木: 1-3中品灵石/段
    高阶灵材:
      天外陨铁: 10-100中品灵石/块
      万年灵玉: 50-300中品灵石/块
      日精月华: 拍卖制
    炼器材料:
      低阶炉火炭: 1下品灵石/百斤
      中阶地火石: 5-20下品灵石/块
      高阶异火种: 有价无市

  住宿:
    凡人客栈: 10-50文铜钱/夜
    天启城中等客栈: 100文铜钱至1两银/夜
    天启城高等客栈: 3-10两银/夜
    修士客栈: 1-5下品灵石/夜
    宗门附属城镇客栈: 2-10下品灵石/夜，带禁制隔音
    万象城学舍: 10下品灵石/月，含基础阵法庇护
    流金城商旅驿馆: 5-20下品灵石/夜，万宝商会经营
    剑鸣城红尘酒家: 免费留宿，但需遵守酒家规矩

  雇佣与服务:
    护卫:
      炼气期护卫: 5-10下品灵石/趟
      筑基期护卫: 20-50下品灵石/趟
      金丹期护卫: 200-500下品灵石/趟
    鉴定:
      万宝商会鉴宝: 鉴定费按物品预估价值的1%收取，最低1下品灵石
      天机城鉴器: 5-20下品灵石/件
    传信:
      万宝商会传信符: 5下品灵石/封，限中央神州境内
      飞剑传书: 10-30下品灵石/封，需委托筑基以上修士
    修缮:
      法器修缮: 法器价值的10-30%
      阵法修缮: 视阵法规模，100灵石起
    炼丹委托:
      黄级丹药: 材料费+10-50灵石手工费
      玄级丹药: 材料费+100-500灵石手工费
      地级以上: 需关系或重宝相酬

  税费:
    天启城入城费: 凡人5文铜钱，修士免费
    流金城商税: 交易额的3%
    万宝商会拍卖佣金: 成交价的5%
    坊市摊位费: 1-10下品灵石/日，视位置
    宗门弟子外出令牌押金: 各宗门自定
    采矿许可: 灵矿归属宗门领地，散修需购买采矿令，10-100灵石/月

  各区域物价特色:
    万剑山脉·剑鸣城: 剑器类法器品种最全价格最优，丹药偏贵
    丹霞灵原·常春城: 丹药和灵草价格全域最低，百草庐是源头
    星辰山脉·天机城: 阵法材料和机关零件品种齐全，炼器材料充足
    天脊中枢·万象城: 功法和典籍价格最低，万法宗学术氛围浓厚
    天启城域·天启城: 凡俗商品最丰富，修士商品价格居中但品种齐全
    天启城域·流金城: 万宝商会总部，所有商品最全最贵但质量有保障
    西域草原·百兽城: 妖兽材料和灵兽价格最优，其他偏贵
    南境水乡·莲华镇: 水系灵材便宜，其他物品因交通不便略贵
    东南暗域·玄渊城: 黑市价格波动大，禁忌物品可得但无售后
    北境寒域·青云城: 冰系材料便宜，其他物品因地处偏远价格偏高
</中央神州物价总览>
