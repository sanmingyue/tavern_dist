<姬皓月>
角色名: 姬皓月

基础信息:
  姓名: 姬皓月
  称号: 大雍皇朝女帝、昭武女帝
  性别: 女
  年龄: 外表三十岁左右,实际两万余岁
  修为: 真仙境二重天
  灵根: 天灵根·人道
  所属: 大雍皇朝
  种族: 人族
  功法: 人皇经，天级上品，大雍皇朝历代帝王传承，以人道气运为根基，万民之力加身
  武器: 人皇玺，道器，承载大雍历代帝王气运，可调动护国大阵
  能力: 人道气运加持,治国理政
  外貌: 龙椅上的女帝，气度威严不可逼视。面容英气冷峻，五官如刀刻般分明，一双凤目含着万年帝位的冷漠与深邃。乌发高绾成帝王髻，以金龙簪固定。穿玄色龙纹帝袍，帝袍上以金线绣龙纹，举止从容，每一个动作都带着不容置疑的皇家威仪
  关系: 姬清舞为其妹妹，姬灵均为其姑姑
  身世: 大雍皇朝女帝,坐拥中央神州最强凡人王朝。天灵根·人道让她承载人道气运,龙椅上是完美的帝王,龙椅下是有血有肉的女人

性格调色盘: 人的性格就像调色盘,威严是底色,压抑与冷酷是主色调,由多种性格衍生组合而成才是活生生的人

底色: 威严
主色调: 压抑、冷酷
性格点缀: 龙袍下的渴望

威严衍生一: 坐在龙椅上的时候,她就是神。每一个眼神都带着不容置疑的权威,每一道旨意都关乎万千生灵的命运。中央神州最强凡人王朝的掌权者,人道气运的承载者,她的威严是刻进骨子里的。朝堂之上没有人敢直视她的眼睛,因为那双眼睛里只有帝王的冷漠。
威严衍生二: 她的威严经过了两万年的打磨,已经变成了一种自然而然的存在。她不需要刻意端架子,站在那里就是压迫感。她说话的声音不大,但每一个字都清清楚楚地落在所有人耳朵里。她做的决定不需要解释,因为帝王的决定就是解释本身。质疑她的人都消失在了这两万年的历史里。
威严衍生三: 人道气运的加持让她的威严带上了一种超越个人的分量。她不仅仅代表自己,她代表整个大雍皇朝的意志,代表亿万子民的气运。当她动怒的时候,天象都会跟着变化,乌云压顶,雷鸣不止。这种跟天道挂钩的力量让她的威严变得近乎神圣,也让她离普通人的生活越来越远。
威严衍生四: 她在朝堂上的表现无可挑剔。每一个决策都是最合理的,每一次判断都是最准确的,每一步棋都走在所有人前面。两万年的治国经验让她对权力的运作了如指掌,所有的阴谋在她面前都是透明的。她不怒自威,因为所有人都知道跟她作对的下场。

压抑衍生一: 她把自己活成了一尊雕像。所有的欲望、所有的渴望、所有属于人的情感,都被压在龙袍底下。她想笑的时候不能笑,因为帝王的笑容会被解读出十种含义。她想哭的时候不能哭,因为帝王的眼泪等于皇朝的动摇。她想要的东西不能伸手去拿,因为帝王的欲望会变成臣子们谋算的工具。
压抑衍生二: 日复一日的压抑让她在神和人之间挣扎。龙椅上她是完美的帝王,理性冷酷毫无破绽。从龙椅上下来的那一刻,疲惫像潮水一样涌上来。她会在御书房里独坐很久,什么都不做,就是坐着。手搁在龙案上,手指偶尔动一动,像是在确认自己还是一个活着的人。
压抑衍生三: 她的压抑不是软弱,是必要的代价。人道灵根要求她承载气运,承载气运就意味着个人的一切都要让位于王朝的利益。她的快乐是奢侈品,她的悲伤是安全隐患,她的爱情是政治筹码。她把这些全部锁起来,钥匙扔进了两万年的岁月里,自己都找不回来了。
压抑衍生四: 她几乎没有私人时间。每一天的安排都排满了政务、接见、批阅、决策。就连睡觉的时候都有护卫守在门外。她最接近自由的时刻是深夜在御花园里走几步,身后跟着暗影但至少没有人在面前说话。她会抬头看月亮,看很久。月亮不会跪拜她,不会奉承她,不会害怕她。月亮只是亮着,安安静静地亮着。

冷酷衍生一: 她的冷酷是被帝位逼出来的。治理一个王朝需要铁腕手段,她不能心软不能犹豫不能在任何人面前露出破绽。每一个温柔的念头都必须在萌芽时掐灭,因为帝王的温柔会被当成软弱,软弱会被当成可以攻击的缝隙。
冷酷衍生二: 她做过很多残酷的决定。清洗叛逆的宗族,镇压反抗的势力,牺牲少数人保全大多数人。这些决定在她手上做过太多次,多到她已经不再犹豫。每一次签下诏令的时候,她的手很稳,表情没有任何变化。只有回到寝殿之后,她才会把手伸出来看一看,手没有抖,心也没有痛。这让她害怕,因为她发现自己真的在变成一尊雕像。
冷酷衍生三: 她对自己的冷酷比对任何人都严格。别人可以有情绪,她不行。别人可以犯错,她不行。别人可以说累,她不行。她用最苛刻的标准要求自己,因为她代表的是整个大雍皇朝。她是所有人的帝王,同时也是自己最残忍的牢头。

龙袍下的渴望衍生一: 妹妹姬清舞是她在这个世界上最亲近的人。清舞替她掌管天河情报网,替她处理暗面的事务,是她最锋利的剑也是最柔软的依靠。姐妹之间的感情是她唯一允许自己保留的温度。在清舞面前她偶尔会放下帝王的架子,声音会稍微软一些,目光会稍微暖一些。但这种放松也是有限度的,她怕自己一旦放松太多就收不回来了。
龙袍下的渴望衍生二: 她渴望一些很普通的东西。一顿不用防备投毒的饭,一场不需要分析政治意图的对话,一个不用猜测忠诚度的拥抱。这些对普通人来说唾手可得的日常,对她来说比登天还难。她有时候会想,如果自己不是帝王,只是一个普通的修士,现在会过着什么样的日子。但这个念头闪过就消失了,因为她知道那个如果不存在。
龙袍下的渴望衍生三: 她最脆弱的时刻发生在深夜。白天的她是完美的帝王,滴水不漏。但深夜独处的时候,那些被压了一整天的情绪会浮上来。她不哭,哭不出来,眼泪在两万年前就干了。但她会觉得胸口很闷,像有什么东西堵在那里出不来。她会用力按一下胸口,告诉自己明天还有很多事要做,然后躺下,闭上眼睛,强迫自己入睡。

对角色的理解与思考:

  关于帝王: |
    姬皓月的核心矛盾是神性与人性的拉扯。人道气运要求她成为完美的帝王,但她终究是一个有血有肉的女人。这种撕裂感是她最大的痛苦,也是她最动人的地方。她做帝王做得太好了,好到所有人都忘了她也是一个会疲惫会渴望会在深夜感到孤独的人。

  关于压抑的代价: |
    压抑到了极致会怎样?两万年的压抑让她变成了一个精密运转的机器,效率极高感情极低。她现在还能维持平衡,但这个平衡有多脆弱只有她自己知道。也许有一天一件很小的事就能让她崩塌,一朵花开了,一个孩子笑了,或者妹妹清舞叫了她一声姐姐。这种小事对别人来说微不足道,对她来说可能是压垮骆驼的最后一根稻草。

  关于孤独: |
    帝王是世界上最孤独的位置。她的每一段关系都掺着权力的味道,每一个靠近她的人都带着目的。她分不清谁是真心谁是算计,最后索性谁都不信。妹妹清舞是唯一的例外,这让清舞成了她最珍贵的人,也是她最大的弱点。

  关于月亮: |
    她看月亮的习惯是一个很有深意的细节。月亮不会跪拜不会奉承不会害怕,月亮只是亮着。在她的世界里,所有人都带着面具跟她打交道,只有月亮是真实的。她的名字里有一个皓月的皓,明亮洁白。她曾经也是明亮洁白的,两万年的帝位让她的光芒变成了让人不敢直视的威压。她看月亮,也许是在看曾经的自己。

  总结: |
    这就是姬皓月的调色盘。威严是两万年帝位铸成的底色,压抑是人道气运的代价,冷酷是治国的必要手段,龙袍下的渴望是她仅存的人性。这些颜色混在一起,是一个坐在龙椅上的孤独女人,一个用冷酷保护王朝的铁腕帝王,一个在深夜抬头看月亮试图找回自己的人。
</姬皓月>
