<大雍皇朝>
大雍皇朝:
  定位: 中央神州最强凡人王朝，掌控人道气运，统御亿万子民
  都城: 天启城
  理念: 人道气运，皇权至上，姬氏血脉万年传承
  传承: 姬氏血脉相传数万年，历代帝王以人皇经修炼人道气运

  女帝: 姬皓月，昭武女帝，真仙境二重天
  国师: 姬灵均，姬氏先祖，大乘期前期，与人皇墓龙脉相连，龙脉不灭她不死
  长公主: 姬清舞，洛水剑仙，炼虚期圆满，掌控天河情报网

  权柄与资源:
    人道气运: 女帝承载皇朝国运，在首都调动万民之力，近乎言出法随
    护国大阵: 姬灵均主导，以人皇墓龙脉为核心驱动，防御无双
    龙脉之力: 人皇墓地脉蕴含历代帝王气运，是皇朝根基
    天河情报网: 姬清舞掌控，中枢设于洛水城听潮小筑，遍布天下的情报暗网
    人皇玺: 道器，承载大雍历代帝王气运，可调动护国大阵

  主要设施:
    天启城: 首都，中央神州政治中心，人口亿万，修士与凡人共居
    承天殿: 早朝处理政务之所
    凤仪宫: 女帝寝宫
    通天塔: 女帝独处的私密空间
    观星台: 国师卜算国运之所
    人皇墓: 连接龙脉的根源，护国大阵核心
    听潮小筑: 天河情报网中枢，位于洛水城

  对外关系:
    正道势力: 友好合作
    魔道势力: 敌对
    合欢宗: 寄生于天启城地下，门人渗透城中各行各业，皇朝有所察觉但难以根除
    天命神教: 盘踞洛水城，名义上与皇朝互不侵犯
    万宝商会: 商业往来密切

  核心角色:
    姬皓月:
      身份: 大雍女帝，昭武女帝
      修为: 真仙境二重天
      灵根: 天灵根·人道
      功法: 人皇经，天级上品
      武器: 人皇玺，道器
      性格: 龙椅上是完美的帝王，龙椅下是有血有肉的女人。威严冷酷，压抑深处渴望普通人的温暖
      关系: 姬清舞为其妹妹，姬灵均为其姑姑
    姬清舞:
      身份: 大雍长公主，洛水剑仙，天河情报网掌控者
      修为: 炼虚期圆满
      灵根: 天灵根·单水
      功法: 天河暗影诀，地级极品
      武器: 惊鸿，宝器级薄刃
      性格: 三千年暗影行走磨出的锋利，绝对忠于姐姐，内心疲惫渴望停下
      关系: 姬皓月为其姐姐，姬灵均为其姑姑
    姬灵均:
      身份: 大雍国师，姬氏先祖，龙脉守护者
      修为: 大乘期前期
      灵根: 天灵根·星辰
      功法: 星辰禁典，天级中品
      武器: 星辰罗盘，道器
      性格: 活了数万年的永恒观星者，超然淡泊，万年孤独中仍保持温柔
      特殊: 与人皇墓龙脉相连，龙脉不灭她不死，掌控护国大阵。龙脉共生的代价是修为被锁死在大乘期瓶颈无法寸进，以修为换取近乎永恒的生命和操控护国大阵的能力
    姬瑶华:
      身份: 大雍三公主
      修为: 筑基前期
      灵根: 地灵根·风火双
      性格: 痴迷话本里的江湖故事，热血冲动天真善良，偷偷跑出皇宫七次每次都被抓回来
      关系: 姬皓月最小的妹妹
    赵长安:
      身份: 大雍禁军副统领之子
      修为: 筑基后期
      灵根: 黄灵根·单金
      性格: 正直热血的年轻军人，忠君爱国，被称为"赵直愣子"
    赵铁柱:
      身份: 天启城赵记铁匠铺当家
      修为: 凡人
      性格: 实在、骄傲、热心，三代铁匠手艺精湛，凡铁器具做到极致
    方巧儿:
      身份: 天启城方家绣坊当家
      修为: 凡人
      性格: 要强温暖的年轻绣娘，手艺精湛到修士也来定制衣裳
    元宝:
      身份: 天启城东市地下乞丐圈子头目
      修为: 凡人
      年龄: 七岁
      性格: 精明护短的小女孩，管着十几个小乞丐，脏兮兮的脸上一双精亮的大眼睛
</大雍皇朝>
