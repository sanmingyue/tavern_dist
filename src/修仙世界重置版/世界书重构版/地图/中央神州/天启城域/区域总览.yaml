<天启城域>
天启城域:
  方位: 中央神州中部平原
  地貌: 平原沃野千里，洛水自西向东穿流而过，沿岸沃土万顷，是中央神州人烟最稠密、最为繁华的区域。大雍皇朝以天启城为都，统御亿万凡民，修士与凡人在此共居共存
  灵气: 灵气丰沛但分布均匀，不如山脉区域灵脉密集，胜在覆盖面广，适宜万民修养生息。地下深处暗藏极乐幻城，阴柔气息渗透城底

  核心势力:
    大雍皇朝:
      位置: 天启城
      定位: 中央神州最强凡人王朝，掌控人道气运，统御亿万子民
      领袖: 昭武女帝姬皓月，真仙境二重天
    天命神教:
      位置: 洛水城
      定位: 控制命运的神秘组织，代天行罚
      领袖: 教宗司命玄，真仙境三重天
    合欢宗:
      位置: 天启城地下极深处·极乐幻城
      定位: 六大仙宗之一，双修、毒术、暗杀三位一体
      领袖: 宗主宋馨，真仙境八重天
    墨家机关城:
      位置: 天启城域西北方，依托山体的立体机关堡垒
      定位: 机关术与人偶制造顶尖势力，整座城是活的巨型机关
      领袖: 城主巨子，渡劫期大圆满
    万宝商会:
      位置: 流金城
      定位: 阴阳大陆最大商业组织，超然中立
      领袖: 会长萧远山，大乘期大圆满

  重要城镇:
    天启城: 大雍皇朝首都，中央神州政治中心，人口亿万，修士与凡人共居。护国大阵覆盖全城，神州传送总枢位于城外
    洛水城: 洛水河畔的古城，天命神教总部所在，听潮小筑为天河情报网中枢
    流金城: 万宝商会总部所在，中央神州商业贸易中心，灵石交易量居各城之首

  势力格局:
    - 大雍皇朝是名义上的统治者，天启城中凡人事务归皇朝管辖，修士事务则由各宗门自理
    - 合欢宗隐匿于天启城地下，门人渗透城中各行各业，暗中经营情报与暗杀网络
    - 天命神教盘踞洛水城，以宗教面貌示人，信众遍布
    - 万宝商会在流金城独立运营，与各方势力保持商业往来，绝对中立
    - 墨家机关城偏居西北山体，低调务实，以机关造物闻名，与各方保持中立友好的客户关系
    - 天河情报网由长公主姬清舞掌控，中枢听潮小筑设于洛水城，是皇朝暗面的情报核心
</天启城域>
