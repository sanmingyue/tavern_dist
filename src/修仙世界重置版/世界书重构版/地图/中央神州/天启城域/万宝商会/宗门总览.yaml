<万宝商会>
势力名称: 万宝商会

基本信息:
  类型: 特殊势力(商业组织)
  位置: 中央神州·天启城域·流金城
  实力等级: 顶尖势力
  势力规模: 超大型
  主要种族: 人族

势力概况:
  定位: 大陆最大商业组织,超然中立
  理念: 信誉至上,童叟无欺
  特色: 掌握大陆经济命脉,遍布天下的情报网络,与正邪两道都有往来
  地位: 经济霸主,能左右灵材价格,连六大宗门都要卖面子
  传承: 萧氏家族经营

核心人物:
  会长: 萧远山(大乘期大圆满)
  主母: 林月华(大乘期后期)

势力规模:
  分会长: 数百位(各大城市分会)
  管事: 数万人
  伙计: 数百万人(遍布大陆)
  总部: 流金城
  分会: 万象城、天启城、剑鸣城、百草集等各大城市

核心业务:
  灵材交易: 天下灵材买卖
  情报贩卖: 各方情报收集整理
  拍卖行: 定期举办大型拍卖会
  灵石兑换: 各种货币灵石兑换

对外关系:
  与所有势力: 保持商业往来
  绝对中立: 不参与任何纷争
  信誉至上: 商会信誉就是生命

商会规矩:
  - 严禁在商会内动手,违者拉入黑名单
  - 童叟无欺,信誉第一
  - 价高者得,拍卖遵循规则

核心角色速览:

  萧远山:
    身份: 万宝商会会长
    性别: 男
    修为: 大乘期大圆满
    灵根: 地灵根·单金
    定位: 商业巨擘,精明果断又重情重义的大陆第一商人
    关键词: 商道天赋、万宝金尺、以财化兵、重情、果断

  林月华:
    身份: 万宝商会主母
