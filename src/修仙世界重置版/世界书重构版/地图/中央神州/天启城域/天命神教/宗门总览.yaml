<天命神教>
宗门名: 天命神教

基础信息:
  名称: 天命神教
  地位: 特殊势力,控制命运代天行罚的神秘组织
  驻地: 洛水城,天启城域边缘,建于洛水河畔
  特色: 掌握命运天书,以天命之名行事,将众生视为棋子

宗门概况:
  宗门特征: 天命神教不同于传统宗门,更像一个以"天命"为信仰的神权组织。教中弟子深信天命不可违,一切皆有定数,他们的使命是维护天道秩序、清除命运的偏差。表面上与正道友好,实则高高在上,视所有宗门为棋盘上的棋子
  镇宗之宝: 命运天书,可窥探因果命运脉络
  传承功法: 天命归元录,天级上品,以天命之力驱动,可干涉因果命运
  宗门规模: 弟子数量不多但质量极高,外门弟子分布各地传播天命教义,核心层极少数人掌握真正的命运之力
  势力关系: 与正道表面友好实际高高在上;与魔道敌对视为失谐存在;内部等级森严,教宗拥有绝对权威

核心人物速览:
  司命玄:
    身份: 天命神教教宗
    修为: 真仙境三重天
    灵根: 天灵根·命运
    简介: 地球穿越者,背叛换日教获得天道加持,手持命运天书将众生视为棋子
  叶非凡:
    身份: 天命神教少主,天命之子
    修为: 真仙境二重天
    灵根: 天灵根·天命
    简介: 持有神器天命录,自认命运宠儿,救世主情结与控制欲并存
  曦瑶:
    身份: 天命神教圣女,星谕者
    修为: 炼虚期圆满
    灵根: 天灵根·星辰
    简介: 能洞悉万物命运,最虔诚的信徒,但信仰已出现裂缝
  容月:
    身份: 天命神教影圣女
    修为: 化神前期
    灵根: 玄灵根·光暗双
    简介: 五岁起被天命洗脑术塑造的执行者,曦瑶的替代品,自我意识正在萌芽

洛水城:
  概况: 天命神教总部所在,建于洛水河畔,城中弥漫着一种庄严肃穆的氛围。城内建筑以白石为主,星纹遍布,入夜后整座城散发微弱的星辉。普通人不得入内,只有天命神教弟子和被"天命选中"的人才能进入
  核心区域:
    天命大殿: 教宗议事之所,殿内悬挂命运天书的投影,星辰图纹覆盖穹顶
    星谕台: 圣女占卜之所,可观测天命流转
    影堂: 影圣女驻地,教中隐秘机构
    洗心池: 天命洗脑术的核心设施,用于"净化"动摇者
</天命神教>
