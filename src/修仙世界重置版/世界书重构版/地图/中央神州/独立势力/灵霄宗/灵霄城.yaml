<灵霄城>
灵霄城:
  定位: 灵霄宗附属城池,中央神州东部边缘城市

  地理位置: 灵霄山山脚,地处中央神州东部边缘

  城池规模:
    人口: 数十万
    面积: 中小型城池
    城墙: 普通灵石加固

  城池特色:
    灵霄宗管辖: 城中修士多为灵霄宗附属
    表面光鲜: 城中建筑华丽,看似繁荣
    暗地交易: 灵霄宗暗中在此进行血丹等不正当交易
    中规中矩: 对外界来说只是一座普通的宗门附属城池

  经济活动:
    灵石矿脉: 灵霄宗控制的灵石矿脉在此交易
    丹药市场: 普通丹药公开贩卖,血丹暗中流通
    灵材贸易: 中低阶灵材交易

  重要地点:
    灵霄坊市: 城中最大的坊市,灵材丹药法器交易
    迎仙楼: 城中最大的酒楼,灵霄宗弟子常出入
    城主府: 由灵霄宗长老兼任城主

  城池氛围:
    表里不一: 表面繁荣有序,暗中交易频繁
    宗门色彩浓厚: 灵霄宗弟子在城中享有特权
    外来修士: 偶有散修和其他宗门弟子路过,对灵霄宗印象尚可
</灵霄城>
