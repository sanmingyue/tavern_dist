<天机阁>
天机阁:
  定位: 神秘势力，精通天机推演、情报搜集、机关造物
  核心理念: 洞悉天意，掌命运之轨，于无声中掌控大局

  山门地点:
    位置: 不定，宗门本体为千机楼
    千机楼: 巨型可移动机关堡垒，随时变换方位，外人难以寻觅
    特性: 唯有受邀者方可进入，内部空间远超外观

  修炼体系:
    天机推演: 通晓卜算，擅推演因果、预判未来
    情报网络: 弟子遍布大陆各方势力，收集各方情报
    机关造物: 精研傀儡与机关术，造物巧夺天工，威能不逊灵宝

  宗门特色:
    弟子稀少: 行踪隐秘，少涉权斗，招收极为严苛
    情报交易: 以情报交易为生，各方势力均有合作
    中立立场: 不偏袒任何一方，严守中立
    机关精湛: 傀儡机关造物每一件都是精品

  与外界关系:
    与玄天宗: 同样擅长推演，但天机阁更偏情报与机关
    与太虚宗: 同为技术流，偶有交流
    与万宝商会: 情报交易合作频繁

  特色资源:
    情报网络: 各方势力的情报收集与交易
    天机玉简: 记录推演结果的特殊玉简
    机关傀儡: 各类精妙机关与傀儡
    预言卷轴: 天机预言，价格极高

  宗门规矩:
    严守中立: 不得偏袒任何势力
    情报保密: 客户情报绝对保密
    价高者得: 天机预言售价极高

  弟子阶梯:
    外勤暗子:
      人数: 数百人
      修为范围: 炼气后期至筑基后期
      职责: 潜伏于大陆各方势力中收集情报、维护情报网络末端、传递密信
      特征: 身份隐秘,多以散修、商人、行脚医者等身份示人,一生可能不回千机楼一次,以天机玉简单线联络
    内勤机师:
      人数: 不足百人
      修为范围: 金丹初期至元婴中期
      职责: 在千机楼内整理分析情报、研制维护机关傀儡、炼制天机玉简、维护千机楼运转
      特征: 精通机关术与阵法,常年不出千机楼,手上多有灵纹烙印,对外界事务了如指掌却从不亲身涉足
    推演师:
      人数: 不足二十人
      修为范围: 元婴后期至化神期
      职责: 天机推演、星象解读、撰写预言卷轴、指导外勤暗子部署
      特征: 天赋异禀者方可入选,精通卜算之术,推演时消耗极大,每次推演后需闭关数月恢复
    亲传弟子:
      人数: 仅司星瑶一人
      修为范围: 元婴后期
      职责: 阁主白瑶光唯一弟子,继承天机阁全部传承
      特征: 习得阁主全部技艺,是天机阁下一任阁主的唯一人选

  核心人物:
    白瑶光:
      职位: 天机阁阁主
      修为: 渡劫期中期
      灵根: 天灵根·玄冥
      年龄: 外表三十岁，实际八万五千岁
      特征: 天生失明，以心眼洞察万物
      武器: 归音·无弦琴
      能力: 天机推演、炼器术登峰造极、操控机关傀儡
      性格: 冷静克制，对弟子温柔，对他人冷淡疏离
    司星瑶:
      职位: 天机阁圣女，白瑶光唯一弟子
      修为: 元婴后期
      灵根: 地灵根·星辰
      年龄: 外表十八岁，实际三百二十岁
      特征: 眼覆月白目纱，紫蓝色瞳孔
      武器: 机关傀儡
      能力: 星象解读、基础天机推演、操控机关傀儡
      性格: 内敛谨慎，聪慧敏锐，对师父极度敬仰
</天机阁>
