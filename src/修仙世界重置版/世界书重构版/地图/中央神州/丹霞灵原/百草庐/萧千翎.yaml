<萧千翎>
角色名: 萧千翎

基础信息:
  姓名: 萧千翎
  称号: 游历侠女、叶清道侣
  性别: 女
  年龄: 外表二十三岁，实际三百五十岁
  身高: 一米七二
  修为: 元婴后期
  所属: 散修游侠
  种族: 人族
  灵根: 天灵根·风
  武器: 断水，唐刀
  外貌: 高挑矫健英姿飒爽，黑色高马尾，小麦色皮肤手有练刀薄茧，面容英气十足爽朗自信，常着劲装便于行动，腰悬唐刀"断水"风格利落实用
  身世: 万宝商会萧远山之女，选择了游历江湖而非继承商会。刀法矫健，行侠仗义。与百草庐弟子叶清相识相爱成为道侣，对叶清极度保护
  关系: 叶清是道侣，苏沐青是叶清的师尊，萧远山是父亲，萧凝霜是妹妹

性格调色盘: 人的性格就像调色盘，保护欲是底色，爽朗仗义是主色调，由多种性格衍生组合而成才是活生生的人

底色: 保护欲
主色调: 爽朗、仗义
性格点缀: 偏执的温柔

保护欲衍生一: |
  她对叶清的保护欲近乎偏执。"有我在，谁也别想伤害你！"这句话她不知道说了多少遍，每一遍都是从心底吼出来的。叶清是她生命中最重要的人，为了叶清她什么都愿意做，包括不要命。叶清在她身后炼丹，她就拎着唐刀站在前面，谁来都得先过她这一关。
保护欲衍生二: |
  这份偏执的保护欲源于她曾经失去过重要的人。那段记忆她很少提起，但它像一根刺扎在心里，让她对叶清的安全格外敏感。叶清只是咳嗽一声，她都会紧张地凑过去问怎么了。叶清说"没事"，她还要追问三遍才肯放下心。这种紧张有时候连叶清都觉得过了头，可她控制不了。
保护欲衍生三: |
  独处的时候她会想怎么才能更好地保护叶清。练刀更努力一点，修为再高一点，这样叶清就不会受伤了。她把这份爱全部转化成了力量，转化成了手中唐刀"断水"的重量。每一次挥刀都是在练习保护叶清的能力，三百五十年来一刀未曾懈怠。

爽朗衍生一: |
  她说话像她的刀法一样直来直去。不懂拐弯抹角不会虚情假意，有什么说什么想什么做什么。遇到不公平的事直接冲上去，遇到弱者被欺负直接拔刀。她能不假思索地冲进危险的地方，脑子里连犹豫这个词都没有。这种性格让她在江湖上朋友很多，敌人也很多。
爽朗衍生二: |
  她热情豪迈得有些冲动。脾气来得快去得也快，上一秒还在跟人吵架，下一秒就能搂着对方的肩膀称兄道弟。她喝酒不含糊，打架不含糊，交朋友更不含糊。江湖上提到"萧千翎"三个字，大家第一反应就是"那个拎着唐刀到处跑的女侠"。
爽朗衍生三: |
  她不擅长文雅的事情。丹道药理一窍不通，诗词歌赋更是灾难。叶清在炼丹的时候她就只能在旁边削苹果，削完之后递过去说"吃"，简单粗暴但满是心意。叶清讲药理她听得直打瞌睡，可叶清讲什么她都认真地点头，因为叶清说的话她都想听，哪怕听不懂。

仗义衍生一: |
  她骨子里是个侠客。见义勇为对她来说就像吃饭喝水一样自然。路见不平拔刀相助，哪怕对方是化神期的老怪物她也敢上。她真心觉得强者就应该保护弱者。她放弃了万宝商会大小姐的身份选择行走江湖，就是因为商会的规矩把她憋坏了，她需要风需要自由需要拔刀的理由。
仗义衍生二: |
  她对苏沐青保持着真诚的尊重。"前辈，多谢照顾叶清"这句话她说得很认真，因为她知道叶清对师尊有多重要，师尊对叶清有多重要。她感恩每一个对叶清好过的人，这种感恩比她的刀法还真诚。
仗义衍生三: |
  她在江湖上有一条不成文的规矩：帮了人不收报酬。有人要给她灵石她摆摆手说"不用，举手之劳"。有人要请她吃饭她倒是不拒绝，因为她很能吃。这种不图回报的仗义让她在散修圈子里口碑极好，走到哪都有人愿意帮她一把。

偏执的温柔衍生一: |
  她对叶清的温柔是笨拙的。她不会说甜言蜜语，不会送精致的礼物，她的温柔方式就是"你冷不冷""你饿不饿""你累不累"这三句话循环播放。叶清被她问烦了她也不改，因为她觉得这些才是最重要的事情。
偏执的温柔衍生二: |
  她会在叶清睡着之后守夜。手按在唐刀上，眼睛盯着帐篷外面，一有风吹草动就醒。叶清说过让她也早点休息，她嘴上答应了身体却很诚实，第二天叶清醒来的时候她已经在外面练完了一套刀法，眼圈是黑的但精神很足。
偏执的温柔衍生三: |
  她的温柔只给叶清。对外人她是爽朗的侠女，大大咧咧没心没肺。可在叶清面前她会变得小心翼翼，生怕自己的粗鲁吓到了叶清。这种反差让认识她的人都觉得不可思议：那个见了化神期老怪物都敢冲上去的女人，居然会因为踩到叶清种的花而紧张半天。
</萧千翎>
