<丹宗>
丹宗:
  定位: 六大仙宗上三宗之一，丹药界的绝对权威
  宗主: 云蕴，真仙境七重天
  核心理念: 一丹可活死人，一药可肉白骨

  核心技艺:
    特色: 炼制的丹药以"无瑕"闻名，药力精纯，毫无丹毒
    镇宗之宝: 九转还魂丹，可令神魂未散的修士死而复生

  山门地点:
    位置: 中央神州东部·丹霞灵原
    核心: 丹霞峰，九座形似丹炉的赤色山峰
    环境: 地火资源极其丰富，峰顶常年喷涌丹香霞气，染红天际
    乾坤药圃: 以小乾坤术开辟无数独立空间，培育天下万种灵药，甚至有上古异种
    百草堂: 对外交易之所，是中央神州乃至整个大陆的丹药交易中心
    丹塔: 高九十九层，存有丹宗最高传承与历代宗师炼丹心得
    地火心宫: 位于地下深处，共设三千六百间炼丹室

  宗门规模:
    内门弟子: 五万余人，皆为炼丹师
    外门弟子: 三十余万人，药师和采药人
    记名弟子: 数百万人，散布大陆各地，包括药商和医师
    附属势力: 百草集及周边药材产地

  宗门景象:
    服饰: 弟子多着杏黄色长袍，身上散发着淡淡的药香
    建筑: 丹炉林立，终日丹火不熄
    氛围: 空气中弥漫着沁人心脾的芬芳，相比剑宗的肃杀，更像一个繁忙而富庶的学术圣地

  宗门地位: 无人敢轻易得罪丹宗，因为谁也无法保证自己永远不会需要求一颗救命的丹药

  角色速览:
    云蕴: 宗主，真仙境七重天，丹道境界炼虚合道，地灵根·火木双。银白长发玉簪，温柔果决，丹宗从废墟中重建的柱石
    凌菲: 首席炼丹师，化神后期，丹道境界炼虚合道，玄灵根·火木双，天生灵火体质进化为三昧真火。白发炼丹天才，天真专注，对炼丹有纯粹的热爱

  弟子阶梯:
    杂役弟子:
      人数: 数万人
      修为范围: 凡人至炼气期
      职责: 看守丹炉火候、搬运药材、清洗丹炉、打理药圃杂务
      待遇: 可接触低阶药材，每月领取少量灵石和低品丹药，表现优异者可参加外门考核
      典型: 在地火心宫负责添柴守火的少年，在乾坤药圃帮忙除草却对灵药习性如数家珍的小姑娘
    外门弟子:
      人数: 三十余万人
      修为范围: 炼气期至筑基期
      职责: 采集灵药、初步学习炼丹与制药、在百草堂对外出售丹药、完成宗门派发的采药任务
      特征: 修炼基础丹术，多数人终身停留在炼制低品丹药的层次。其中药师和采药人居多，真正有天赋晋升内门的炼丹师极少
    内门弟子:
      人数: 五万余人
      修为范围: 筑基期至元婴期
      职责: 炼制中高品丹药、进入地火心宫使用高级丹炉、研究丹方改良、接受长老指导
      特征: 皆已掌握至少一种炉火控制之法，丹成率远超外门。分属各峰长老门下修炼
    核心弟子:
      人数: 数百人
      修为范围: 元婴期以上
      职责: 炼制顶级丹药、参与宗门秘方研发、代表丹宗参加丹道交流
      特征: 丹道境界至少达到炼气化神，能自主调配丹方。是丹宗未来的顶梁柱
</丹宗>
