<百草集>
百草集:
  位置: 丹霞灵原西侧，丹宗山门丹霞峰脚下
  定位: 丹宗附属城池，中央神州乃至整个大陆最大的丹药交易中心
  规模: 常住人口约五百万，其中修士占四成，凡人占六成
  管辖: 丹宗派遣执事弟子维持秩序，城主由丹宗指派

  城市格局:
    百草堂: 丹宗对外交易的核心场所，丹药、灵草、丹方交易量冠绝神州
    药王街: 主街，两侧尽是丹药铺、灵草行、药材仓库，药香弥漫整条街
    丹火广场: 城中央的巨大广场，每月十五有丹宗弟子主持的公开炼丹展示，围观者络绎不绝
    灵草坊: 专门交易各品级灵草的坊市，从凡级草药到天级灵植都能找到
    凡人区: 城南一带，制药工坊、晾晒场、包装铺一应俱全，凡人在此为丹药产业提供基础劳力

  城市氛围: 空气中永远弥漫着各种药草的香气，有的清冽有的甘甜有的刺鼻。街上随处可见身着杏黄色长袍的丹宗弟子，手捧丹炉匆匆赶路。凡人早已习惯了这种气味，卖包子的小贩会在包子上印个小丹炉的图案讨个好彩头

  常驻人物:
    周药农:
      身份: 凡人药农，百草集最大的灵草供应商之一
      年龄: 五十二岁
      修为: 凡人
      特征: 种了三十年灵草，虽是凡人但对灵草的生长习性了如指掌，连丹宗外门弟子都经常来向他请教。性格憨厚沉默，手上全是老茧，只有说到灵草才会滔滔不绝
    林巧娘:
      身份: 凡人制药工，凡人区最大制药工坊的女工头
      年龄: 三十八岁
      修为: 凡人
      特征: 手脚麻利管理有方，手下二百余名工人将灵草研磨、炮制、包装的流程安排得井井有条。脾气泼辣但对手下照顾有加，工坊里谁家有困难她第一个帮忙
    齐明远:
      身份: 散修丹师，药王街上"济世堂"的掌柜
      修为: 金丹中期
      灵根: 玄灵根·火木双
      特征: 原是丹宗外门弟子，修为到金丹后选择离开宗门自立门户。炼丹手艺在散修里算上等，擅长炼制中低品级的常用丹药。为人精明但不奸滑，童叟无欺是他的招牌
    孟婆婆:
      身份: 凡人草药铺老板，丹火广场旁卖草药茶的老太太
      年龄: 七十三岁
      特征: 用凡人手法将低品级灵草泡成草药茶，据说喝了能延年益寿强身健体。她的茶摊前永远排着长队，修士凡人都来喝。口头禅是"药在山里，茶在壶里，好不好自己品"

  特色资源: 高品灵药、地心火莲、丹方玉简、各类成品丹药、灵草种子
  交通: 设有飞舟码头，可通往天启城、剑鸣城、常春城等中央神州主要城池
</百草集>
