<西域草原天材地宝>
西域草原天材地宝:
  矿石类:
    风灵石:
      品级: 黄级至玄级
      产地: 西域草原·高原崖壁
      分布: 西域草原高处崖壁上经年累月被风灵力浸染的岩石
      用途: 风系修炼辅材、炼制轻身类和飞行类法器
      采集: 高处崖壁危险，需飞行能力或攀爬本事
  灵植类:
    兽灵花:
      品级: 玄级
      产地: 西域草原·兽王山
      分布: 兽王山深处只有灵兽出没的区域才会生长的五色花朵
      用途: 灵兽契约仪式的辅材、驭兽类丹药的主料
      采集: 万兽山庄管控，百兽城有少量出售
  兽材类:
    灵兽血:
      品级: 玄级至地级
      产地: 西域草原·兽王山
      分布: 高阶灵兽自然蜕换或受伤时留下的血液
      用途: 驭兽类和体修类丹药的珍贵辅料
      采集: 万兽山庄偶有外售，价格极高
</西域草原天材地宝>
