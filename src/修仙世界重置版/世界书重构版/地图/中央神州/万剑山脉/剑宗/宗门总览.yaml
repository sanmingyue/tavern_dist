<剑宗>
剑宗:
  定位: 六大仙宗之首，极致的攻伐之道
  宗主: 谢云流，剑圣，真仙境十重天大圆满
  位置: 中央神州西部·万剑山脉·万剑天池

  核心理念: 剑修不问出身，不看根骨，只重一颗纯粹的剑心

  三大剑道:
    无情道:
      核心: 斩断尘缘，心中唯有剑道
      修士特征: 孤高冷傲，出剑绝情，剑锋所指，了无生机
      本质: 将所有情感都献祭给了手中的剑
    杀伐道:
      核心: 以战养战，在生死搏杀中领悟剑道真谛
      修士特征: 煞气缠身，好勇斗狠，剑法充满血腥与霸道
      本质: 每一剑都力求取人性命
    红尘道:
      核心: 入世修行，于人间百态、爱恨情仇中磨砺剑心
      修士特征: 或为浪子，或为侠客，或为王侯将相
      本质: 剑法多变，充满人性的复杂与光辉

  山门地点:
    万剑天池: 山门核心，一柄插入苍穹的万丈石剑，传说为先天剑气所化。周遭悬浮七十二座剑峰，皆指向主峰，形成天然万剑朝宗大阵。剑气纵横千里，非剑心通明者寸步难行
    洗剑池: 位于主峰之巅，池水乃天地灵液，可涤荡剑心，温养飞剑
    论剑坪: 七十二峰之间无数巨大平台，门内弟子比剑、悟剑之所
    藏经剑阁: 一道贯通山体的巨大裂隙，内有无形剑气托举万千玉简
    剑冢: 万剑山脉阴面巨大山谷，埋葬无数折断遗弃之飞剑，剑悲鸣之声日夜不绝

  宗门规模:
    内门弟子: 三万余人
    外门弟子: 二十余万人
    记名弟子: 百万余人，散布大陆各地
    附属势力: 剑鸣城及周边十数座城池，人口数千万

  宗门景象:
    服饰: 弟子皆着朴素的青、白、黑三色剑袍，背后负剑
    建筑: 论剑坪、藏经剑阁，除修炼之所再无他物
    氛围: 肃杀而纯粹

  核心人物速览:
    谢云流: 宗主，真仙境十重天大圆满，剑圣。千年前将宗门日常事务交由大弟子代管后云游四方，剑宗上下仍尊他为宗主
    殷冬雪: 印雪峰峰主，剑宗二长老，渡劫后期大圆满，剑心无我之境。活泼开朗如火焰，修无情剑道却极度珍视感情
    叶霜寒: 内门首席弟子，渡劫前期，天灵根·冰，霜剑仙子。冷傲纯粹，剑宗年轻一代第一人
    卫疏影: 印雪峰精英弟子，殷冬雪座下大弟子，合体后期大圆满，剑心通明。安静内敛，卡瓶颈数百年
    姜千青: 印雪峰弟子，殷冬雪亲传弟子，筑基后期，剑意境。嚣张跋扈的小魔王，半人半妖不知情

  弟子阶梯:
    杂役弟子:
      人数: 数万人
      修为范围: 凡人至炼气期
      职责: 打扫剑峰、搬运灵材、照料灵田灵兽、伺候师兄师姐日常起居
      待遇: 可旁听外门弟子修炼课程，每月领取少量灵石，表现优异者可参加外门考核
      典型: 做了三年杂役只为参加一次外门考核的少年，在剑冢旁扫地时偶然感悟剑意的老杂役
    外门弟子:
      人数: 二十余万人
      修为范围: 炼气期至筑基期
      职责: 修炼剑术、完成宗门任务、守卫宗门外围、在剑鸣城执勤
      特征: 修炼宗门基础剑法，竞争激烈，每年外门比剑大会选拔优秀者入内门。其中不乏修炼数十年仍卡在外门的老弟子，也有天赋异禀三年便入内门的新秀
    内门弟子:
      人数: 三万余人
      修为范围: 筑基期至元婴期
      职责: 修炼高阶剑法、代表宗门出战、进入剑冢悟剑、接受峰主指导
      特征: 每人至少初步凝聚剑意，分属七十二峰各峰主门下修炼
    核心弟子:
      人数: 数百人
      修为范围: 元婴期以上
      职责: 峰主亲传弟子、宗门精英战力、代表剑宗参加各类比试
      特征: 皆已凝聚本命飞剑，剑意圆满，是宗门未来的中坚力量

  特色资源: 天外剑铁、庚金精粹、悟剑石

  与其他势力关系:
    丹宗: 深厚盟约，百年前丹宗遭难时谢云流率众驰援
    红尘酒家: 位于剑鸣城内，剑宗默许其超然中立地位
</剑宗>
