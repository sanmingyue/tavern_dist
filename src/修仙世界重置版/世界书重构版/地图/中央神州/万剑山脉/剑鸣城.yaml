<剑鸣城>
剑鸣城:
  位置: 万剑山脉脚下，依山而建
  定位: 剑宗附属城池，中央神州最大的剑修聚集地
  规模: 常住人口约三百万，其中修士占三成，凡人占七成
  管辖: 剑宗派遣执法弟子维持秩序，城主由剑宗指派

  城市格局:
    剑街: 主街，两侧尽是铸剑坊、剑铺、灵铁行。天外剑铁和庚金精粹在此的交易量占全神州七成
    论剑广场: 城中央巨大石台广场，散修剑客常在此比剑切磋，围观者众。每月初一有剑宗弟子主持的公开论剑
    红尘酒家: 东街尽头，洛红尘经营的小酒馆，城中唯一不受剑宗管辖之地
    万剑坊: 城中最大的铸剑坊，承接从灵器到宝器级别的铸剑委托
    剑鸣客栈: 城中最大客栈，专门接待来访修士，掌柜是退役的剑宗外门弟子
    凡人区: 城东南一带，铁匠铺、布庄、食铺、药铺齐全，凡人在此为剑修提供日常所需

  城市氛围: 城内随处可见负剑而行的修士，街巷之间偶有剑气溢出。凡人早已习以为常，卖包子的大婶会在剑修比武时主动收摊子让出空地。入夜后论剑广场仍有灯火，剑鸣声不绝于耳

  常驻人物:
    沈巧巧:
      身份: 凡人绣娘，在凡人区开一间绣坊
      年龄: 二十三岁
      特征: 手艺精湛，能在剑袍上绣出极细腻的纹路，不少剑宗弟子专程来找她绣剑纹。性格温柔腼腆，见到修士会紧张，但一拿起绣针就沉静下来
    赵铁柱:
      身份: 凡人铁匠，万剑坊的凡铁部主事
      年龄: 四十五岁
      修为: 凡人
      特征: 身材魁梧力大无穷，打铁三十年。虽是凡人但对金属材质的理解让不少低阶剑修都自愧不如。性格粗犷直爽，嗓门比锤子还响
    柳惊鸿:
      身份: 散修剑客，论剑广场常客
      修为: 金丹后期
      灵根: 玄灵根·单金
      特征: 自号剑痴，常年泡在论剑广场与人切磋。剑术不错但修为卡在金丹后期多年。为人热情好客，是剑鸣城散修圈子的核心人物，谁来了都找他打听消息
    孙婆婆:
      身份: 凡人食铺老板，剑街口卖剑鸣面的老太太
      年龄: 六十七岁
      特征: 做面五十年，一碗剑鸣面能让赶路的修士暖到骨子里。据说连殷冬雪都夸过她的面好吃。脾气倔，修士插队一样要排。口头禅是"再厉害也得先把面吃完"
    方岳:
      身份: 剑宗执法弟子，剑鸣城驻守队长
      修为: 元婴中期
      灵根: 地灵根·金水双
      特征: 沉稳寡言，在剑鸣城驻守三百年，处事公正。城中修士闹事第一个想到的就是方岳会来。平时穿黑色执法剑袍，背负一柄无鞘长剑

  特色资源: 天外剑铁、庚金精粹、悟剑石、各类剑胚、铸剑材料
  交通: 设有飞舟码头，可通往天启城、万象城等中央神州主要城池
</剑鸣城>
