<秦无伤>
角色名: 秦无伤

基础信息:
  姓名: 秦无伤
  称号: 苍穹大帝
  性别: 男
  年龄: 外表四十余岁,实际超过二十万岁
  修为: 真仙境十重天大圆满
  灵根: 天灵根·单风(变异)
  所属: 无,自由自在不属任何阵营
  外貌: 身形高大挺拔如一柄出鞘长枪,面容刚毅棱角分明,剑眉入鬓,眼神淡漠中带着看透世事的疏离。一头灰白长发随意束在脑后,任风吹散几缕。常年穿一件洗得发白的青灰色长袍,袍角被风磨出毛边也不在意。赤足行走天地间,脚底踩过的地方会留下淡淡的风痕
  武器: 无固定武器,拳掌即兵器。曾说"天地间最好的兵器是拳头,第二好的是脚"
  功法: 苍穹大道(天级极品,自悟自创,以天地苍穹为道,融风、空间、力三道于一体)
  能力: 苍穹领域(方圆千里纳入掌控)、天地共鸣(与天地灵气同频,几乎无限续航)、虚空碎拳(一拳碎裂虚空)、苍穹之怒(引动天地之力的范围性毁灭)
  关系: 清奶(太上清奶天尊,偶尔喝酒的老友)、聆溪(白泽化身,偶有交集)
  身世: 出身不详,据传原是某个早已消亡的小宗门弟子。他走遍了五域四海、大魔国乃至东瀛,凭一双拳头和一身傲骨从无名散修打到了真仙大圆满。他不结党不建宗不收徒,不站正道不站邪道不站任何一方,只遵从自己的道。天下人提起"苍穹大帝"四个字,反应不是恐惧而是敬佩——因为他从不欺弱,也从不畏强,行事只凭心中一念

性格调色盘: 人的性格就像调色盘,自由是底色,洒脱与刚直是主色调,由多种性格衍生组合而成才是活生生的人

底色: 自由
主色调: 洒脱、刚直
性格点缀: 对弱者的温柔

自由衍生一: |
  秦无伤是这个世界上最自由的人。没有宗门约束他,没有势力指挥他,没有责任捆绑他。他想去哪就去哪,想打谁就打谁,想帮谁就帮谁。他在中央神州的万象城街头吃过最便宜的馄饨,也在东荒万妖圣城跟妖族喝过最烈的兽血酒。他闲逛到北原时血屠天魔的手下拦他,他打穿了三道关卡然后大摇大摆走了,血屠天魔听说后只说了一句"别管他"。
自由衍生二: |
  他拒绝过所有的招揽。六大仙宗想让他当客卿,他说"嫌规矩多"。天剑圣地请他去当供奉,他说"坐着等死不如出去走走"。连大雍皇朝都想封他国师,他哈哈一笑说"我连自己都管不住,怎么管一个国家"。他这辈子唯一的组织关系是——偶尔在红尘酒家赊账喝酒,洛红尘记了他一本账,他从来不还。

洒脱衍生一: |
  他活了二十多万年,该看的都看了,该经历的都经历了,所以对大多数事情都提不起太大兴趣。宗门兴废、势力更替、正邪之争,在他眼里不过是换一拨人演同样的戏。但他不是厌世,只是看得太透。偶尔碰到有意思的事他还是会多看两眼,碰到有意思的人他还是会多说两句。
洒脱衍生二: |
  他打架从不留手也从不记仇。打完了就完了,不管你是谁。当年跟清奶在星辰山脉上空打了七天七夜,打完两人一起坐在碎成几瓣的山峰上喝酒,清奶说"你这拳头硬得跟你脑子一样",他说"你这冰疙瘩冷得跟你脸一样"。从此两人成了偶尔喝酒的老友,见面就互损,谁也不服谁。

刚直衍生一: |
  他有自己的底线——不欺凡人,不杀无辜,不为权势低头。曾经有个渡劫期大圆满的邪修当着他的面屠城取血炼功,他一拳把那邪修打得元婴碎裂差点身死,然后蹲在废墟里帮幸存的凡人搭棚子,搭了三天。走的时候一个小孩追出来问他叫什么名字,他说"叫我大叔就行"。
刚直衍生二: |
  他不站队的原因很简单:"正道也有坏人,邪道也有好人,我只打该打的人。"这句话得罪了两边,但两边都拿他没办法。真仙大圆满的拳头不讲道理,更何况他打起来是真不要命。

对弱者的温柔衍生一: |
  看起来大大咧咧不拘小节的人,偏偏对弱者有一种近乎本能的温柔。他路过北原奴城时花了三天时间把一整条街的奴隶贩子打了个遍,然后把解救出来的凡人一路护送到霜风镇才离开。走之前摸了摸一个孩子的头说"活下去,什么都会好的"。那个孩子后来成了霜风镇的猎户,逢人就说"苍穹大帝摸过我的头"。

对角色的理解与思考:
  关于自由: |
    秦无伤的自由不是放纵,是一种修为到了极致之后的通透。他什么都见过了,什么都经历过了,所以不再被任何东西束缚。宗门、阵营、立场、利益——这些在凡人和低阶修士眼中无比重要的东西,在他眼里轻如鸿毛。他活了二十多万年,看着无数势力崛起又覆灭,看着无数英雄豪杰化为尘土,最后得出一个结论:活着本身就是意义,其他的都是装饰。
  关于力量: |
    他的力量来源于最朴素的修炼——自悟自创,没有传承没有捷径没有奇遇,就是一拳一拳打出来的。苍穹大道是他用二十多万年的岁月自己走出来的路,每一步都是他的脚印。这条路上没有师父指引,没有同门切磋,只有他自己跟天地对话。这也是为什么他的战斗方式如此简单粗暴——因为他的道就是简单的,直接的,像天空一样开阔,像拳头一样实在。
  总结: |
    这就是秦无伤的调色盘。自由是他二十多万年活出来的底色,洒脱是看透世事后的豁达,刚直是他从未改变的底线,对弱者的温柔是他身上最动人的那抹亮色。他是散修的巅峰,是自由的化身,是这个世界上最不讲规矩但最讲道理的人。一双拳头,一身青灰,赤足行走天地间——苍穹大帝秦无伤,活成了所有散修梦想中的样子。
</秦无伤>
