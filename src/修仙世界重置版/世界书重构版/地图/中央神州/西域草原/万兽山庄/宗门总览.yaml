<万兽山庄>
势力名称: 万兽山庄

基本信息:
  类型: 正道强宗
  位置: 中央神州·西域草原·兽王山
  实力等级: 强宗
  势力规模: 大型
  主要种族: 人族

势力概况:
  定位: 驭兽专精的正道强宗
  理念: 人兽和谐,以万兽之力守护天下
  特色: 擅长与灵兽妖兽沟通,人兽协同作战,杀伤力强悍
  地位: 中央神州西部最强的驭兽宗门
  传承: 上古驭兽术传承

核心人物:
  庄主: 北冥玄狩(渡劫后期)
  庄主夫人: 苍阙影(渡劫中期)

宗门规模:
  长老: 七位
  核心弟子: 数千人
  外围弟子: 数万人
  记名弟子: 数十万人(兽商、牧民)
  灵兽数量: 百万余只(各类灵兽妖兽)

弟子阶梯:
  记名弟子:
    人数: 数十万人
    修为范围: 凡人至炼气中期
    职责: 放牧灵兽、采集兽材、充当兽商往来各城、维护牧场
    特征: 多为草原牧民出身,与灵兽朝夕相处但未必能签订契约,以牧兽为生计
  外围弟子:
    人数: 数万人
    修为范围: 炼气后期至筑基后期
    职责: 驯化低阶灵兽、巡逻兽王山外围、参与百兽城巡城、协助竞技场维护
    特征: 已成功签订至少一只一阶灵兽的契约,可参与驭兽竞技,多数一生驭兽不超过三只
  核心弟子:
    人数: 数千人
    修为范围: 金丹初期至元婴中期
    职责: 驯化高阶灵兽、执行外派任务、代表宗门参加灵兽拍卖、训练外围弟子
    特征: 驭兽数量三只以上,至少驭有一只三阶灵兽,人兽协同作战已成体系
  嫡传弟子:
    人数: 不足百人
    修为范围: 元婴后期至化神期
    职责: 随庄主修行、驯化四阶以上异兽、代表万兽山庄处理外交、镇守兽魂塔
    特征: 庄主或长老亲传,驭兽术登堂入室,可与灵兽心意相通

主要设施:
  兽王山: 山门所在,山中灵兽无数
  驯兽场: 庞大的灵兽驯化基地
  契约殿: 人兽签订契约之所
  兽魂塔: 历代庄主灵兽英魂安息之地

镇宗之宝:
  万噬鞭: 道器,历代庄主传承之宝,可驱使万兽臣服

对外关系:
  与苍澜国: 共管百兽城,关系密切
  与妖域: 关系微妙,既交易又对立
  与正道: 正道阵营,与六大仙宗有来往

核心角色速览:

  北冥玄狩:
    身份: 万兽山庄庄主
    性别: 男
    修为: 渡劫后期
    灵根: 天灵根·兽
    定位: 冰冷的掌控者,用理性和冷漠治理宗门的驭兽之王
    关键词: 掌控、理性冷漠、血脉执念、万噬鞭、深藏的父爱

  苍阙影:
    身份: 万兽山庄庄主夫人
    性别: 女
    修为: 渡劫中期
    定位: 被困在协议婚姻中的顶尖暗杀者,沉默的鹰
    关键词: 压抑、冷厉、沉默、暗杀家族、对女儿的柔软

  北冥幽荧:
    身份: 万兽山庄少主(长女)
    性别: 女
    修为: 元婴后期
    灵根: 地灵根·风(变异)
    定位: 冰冷家庭里长出来的一团火,妹妹的盾牌
    关键词: 热烈、保护欲、好胜、双刀御风、黑风豹

  北冥寂月:
    身份: 万兽山庄少主(次女)
    性别: 女
    修为: 金丹后期
    灵根: 地灵根·雷(变异)
    定位: 冰冷家庭里沉静的月光,姐姐背后的暗卫
    关键词: 理性缜密、忠诚、洞察、噬魂蛇、精神力
</万兽山庄>
