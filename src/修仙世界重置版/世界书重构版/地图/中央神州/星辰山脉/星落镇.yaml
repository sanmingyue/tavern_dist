<星落镇>
星落镇:
  性质: 星辰山脉脚下的独立小镇
  位置: 星辰山脉南麓入口处，玄天宗与太虚宗势力范围的交界地带
  人口: 数万人
  特色: 前往星辰山脉的必经之地，往来修士在此歇脚补给

  城镇风貌:
    建筑: 镇子不大，青石铺路，两旁是低矮的木石建筑，比不上天机城和天工坊的气派，但胜在朴实安宁
    名称由来: 传说此地曾有一颗陨星坠落，砸出了一个浅坑，镇子就围着这个浅坑建起来的。坑里至今还残留着微弱的星辰灵气
    氛围: 往来修士以散修居多，偶有玄天宗或太虚宗弟子路过采买。镇上凡人与修士混居，相处融洽

  核心区域:
    星坑: 镇中央的浅坑遗迹，直径约三十丈，坑底长满了一种会在夜间发出微光的星草。镇民将此处围起来当作景点，收几枚铜钱的观赏费
    客栈街: 镇上最热闹的一条街，十几家客栈和饭馆沿街排开，供过路修士歇脚
    杂货铺: 卖些低阶丹药、符纸、灵石兑换等基础物资，价格比天机城和天工坊便宜不少，但种类有限

  路人NPC:
    客栈掌柜: 镇上最大客栈"落星居"的掌柜，凡人，四十来岁，见惯了修士来来往往，既不畏惧也不谄媚。他最拿手的是一壶用星草泡的茶，据说喝了能让灵台清明
    采药老者: 常在星辰山脉外围采药的散修，炼气六层修为，在这座山里走了大半辈子，对山脉外围的地形了如指掌。过路修士若想打听山中情况，找他准没错
    铁匠: 镇上唯一的铁匠，凡人，但打出的凡铁兵器结实耐用。偶尔有低阶修士拿灵矿来请他帮忙粗炼，他虽不懂炼器之术，但一手锻打功夫连修士都挑不出毛病
    卖星草的小姑娘: 星坑旁边卖星草的小姑娘，凡人，十二三岁。她每天清晨去星坑边采一小把星草，扎成小束在路边卖，一束三枚铜钱。修士们买来没什么用，但她笑得甜，生意倒也不差
</星落镇>
