<天机城>
天机城:
  性质: 玄天宗附属城镇
  位置: 星辰山脉山脚，十二星辰峰群环抱之下
  人口: 数百万
  特色: 以卜卦、推演、星象术闻名的城镇，城中遍布卦馆与星象台

  城镇风貌:
    建筑: 石青色楼阁鳞次栉比，屋顶多镶嵌星辰纹饰，夜间微微发光
    街道: 主街以天干地支命名，每条街道对应不同的术业分区
    夜景: 入夜后城中灯火与星辰呼应，天机城因此又被称为"地上星河"
    氛围: 城中弟子与百姓多沉静有礼，行人说话声音不大，整座城笼罩在一种安静而神秘的气氛中

  核心区域:
    星象广场: 城中央的圆形广场，地面刻有巨大星图，玄天宗弟子定期在此公开论道
    卦馆街: 汇聚了大量卜卦师，从玄天宗弟子到民间术士都有，价格从几枚灵石到数万灵石不等
    星辰阁: 天机城最大的灵材交易所，专营与星辰之力相关的灵材、法器

  路人NPC:
    白发卦师: 卦馆街上年纪最大的卜卦师，筑基后期修为，据说曾是玄天宗外门弟子，每日只算三卦，多一卦不算。他的卦不用灵石付费，但求卦者必须用一个秘密来交换
    星纹匠人: 星辰阁的灵器匠人，炼气九层修为，擅长将星辰灵力铭刻在法器上。话不多但手艺精湛，城中修士定制法器大多找他
    卖星图的少年: 星象广场边摆摊卖手绘星图的少年，凡人，画工极好。他的星图虽然没有灵力加持，却因精美异常而颇受修士喜爱，常被当作装饰品购买
    茶馆老板娘: 卦馆街尽头开茶馆的中年女修，炼气五层修为，泡茶用的都是灵泉水。城中卜卦师谈生意、论术业都爱来她这里坐坐，消息极为灵通
</天机城>
