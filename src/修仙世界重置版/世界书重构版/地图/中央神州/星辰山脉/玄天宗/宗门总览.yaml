<玄天宗>
玄天宗:
  定位: 六大仙宗上三宗之一，天机的窥探者，命运的演算师
  宗主: 玄天真君，真仙境六重天
  核心理念: 星辰运转，天道有常，窥一斑而知全豹

  核心能力: 弟子精通卜卦、推演、星象之术，能预测吉凶祸福，甚至在一定程度上拨动命运的轨迹

  山门地点:
    位置: 中央神州中部·星辰山脉
    峰群: 十二座星辰峰，以北斗七星与南斗五星命名
    主峰天枢峰: 峰顶悬浮着巨大的冰晶卦盘，能映照周天星斗
    玉衡峰: 护山大阵"寒梅照影"的核心，大阵开启时十二星峰被无尽寒气与梅花幻影笼罩，美轮美奂却暗藏杀机
    天权峰: 执法堂所在，弟子犯错会在此峰的"思过崖"面壁

  观星阁:
    位置: 天枢峰顶的九层星塔
    性质: 宗门禁地
    内容: 塔内没有书籍，只有一枚枚悬浮在空中的冰髓玉简，其上流动着天机道文
    规则: 唯有以特殊灵绡蒙住双眼，断绝视觉，用心眼去"看"的人才能解读玉简中的真谛
    代价: 窥探天机者必承其反噬，或折寿或失明或疯癫

  宗门规模:
    内门弟子: 两万余人
    外门弟子: 十五万余人
    记名弟子: 数十万人，天机城及各地分支
    附属势力: 天机城

  宗门景象:
    服饰: 弟子身着绣有星辰云纹的蓝色道袍
    气质: 飘逸出尘
    氛围: 庄严肃穆，弟子们多沉静少言，热衷于观星论道

  角色速览:
    玄天真君: 宗主，真仙境六重天，天机推演之道的巅峰存在
    星渊: 副宗主，真仙四重天，天枢峰长老。推演造诣甚至超过宗主，代价是失去视力、左手僵硬。终年蒙灵绡坐于观星阁第九层，沉默寡言，偶尔冷不丁一句话点醒弟子

  弟子阶梯:
    杂役弟子:
      人数: 数千人
      修为范围: 凡人至炼气期
      职责: 打扫星辰峰、整理卦具星盘、抄录星图、伺候长老起居
      待遇: 可旁听外门弟子的星象基础课，每月领取少量灵石
      典型: 在观星阁外台阶上擦拭星盘的少年，虽然看不懂星象但已能准确辨识二十八宿方位
    外门弟子:
      人数: 十五万余人
      修为范围: 炼气期至筑基期
      职责: 学习基础卜卦之术、绘制星图、在天机城卦馆坐堂为人算卦、完成宗门布置的推演习题
      特征: 多数人终身只能掌握简单的吉凶卜算，真正能触及天机推演之术的极少。不少外门弟子在天机城自立卦馆谋生
    内门弟子:
      人数: 两万余人
      修为范围: 筑基期至元婴期
      职责: 深入研习星象推演、进入观星阁研读天机道文、接受峰主指导、承接宗门推演任务
      特征: 皆已初步掌握天机推演之术，能预判数日内的吉凶。但每次窥探天机都要承受反噬，轻则头痛数日，重则暂时失明
    核心弟子:
      人数: 数百人
      修为范围: 元婴期以上
      职责: 承接重大天机推演任务、守护观星阁、代表玄天宗参加各宗交流
      特征: 天机推演造诣极深，可推算数月乃至数年之事。但修为越深窥探越多，反噬也越重，不少核心弟子双目已半盲
</玄天宗>
