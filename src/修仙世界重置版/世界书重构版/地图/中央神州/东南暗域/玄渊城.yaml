<玄渊城>
玄渊城:
  势力定位: 邪道联合城市,五大邪宗共管的三不管灰色地带

  核心理念: 邪道自治,强者为尊

  地理位置:
    位置: 中央神州东南部·玄渊盆地
    环境: 四周峭壁环绕,常年笼罩紫黑迷雾,灵气扭曲
    特点: 易守难攻,天然要塞

  管理结构:
    共管宗门: 噬心殿、幽血门、合欢宗、噬荒教、万禁教
    议事制度: 五宗各派长老驻守,重大事项共同决策
    城主轮值: 每十年轮换一次,由五宗推举
    自治权: 不受大雍皇朝和苍澜国管辖

  城市特色:
    城墙: 玄铁与符文阵法打造,坚不可摧
    护城大阵: 幽影迷惑阵,迷惑来犯之敌
    五宗分殿: 五大邪宗各有分殿,围绕玄渊河布局
    黑市繁荣: 禁术、邪器、血材、各类违禁品交易中心

  主要区域:
    暗影巷: 禁术与黑市交易区,鱼龙混杂
    炼狱炼堂: 邪修试炼与切磋之地
    幽冥牢狱: 囚禁犯人与敌对修士
    玄渊河: 贯穿全城的暗河,传闻通往地府

  特殊组织:
    影绳: 暗杀组织,掌控情报与刺杀
    黑骨商会: 专营邪道物资的商业组织
    血契盟: 雇佣兵组织,接受各类任务

  与外界关系:
    与正道: 敌对,正道宗门重点关注目标
    与散修: 吸引大量邪修和散修聚集
    与魔族: 有秘密交易往来

  城市规矩:
    强者为尊: 实力决定一切
    不问出身: 只要有实力,不管正邪
    严禁内斗: 城内禁止大规模战斗,违者五宗共诛
    契约至上: 以血契、魂契约束交易

  战略地位:
    邪道大本营: 邪道五宗的联合据点
    资源集散地: 各类邪道资源汇聚之地
    防御堡垒: 正道多次围攻未果
    情报中枢: 影绳组织遍布大陆的情报网络

  常驻路人:
    骨爷:
      身份: 黑骨商会掌柜
      年龄: 不详(面容如枯骨)
      修为: 元婴初期
      灵根: 地灵根·暗
      特征: 瘦得像骷髅,说话阴阳怪气,但做买卖从不掺假。什么违禁品都能搞到,价高者得,买卖公道童叟无欺,就是店铺阴森得让人发毛
    红缨:
      身份: 血契盟佣兵,接头人
      年龄: 二十五岁
      修为: 筑基后期
      灵根: 变异灵根·暗火
      特征: 总穿一身红衣,一头红发扎成马尾,在暗影巷的小酒馆里接发任务。嘴角常年挂着笑,但眼神冷得像刀
    老瞎子:
      身份: 暗影巷算命摊主
      年龄: 不详
      修为: 金丹后期
      灵根: 地灵根·幻
      特征: 双目失明却能看透人心,算命奇准但从不说好话,每次都是"你命不久矣"开头。城中邪修敬而远之,据说曾是某大宗门被逐出的弟子
    阿九:
      身份: 炼狱炼堂杂役
      年龄: 十七岁
      修为: 炼气三层
      灵根: 黄灵根·双属性(金火)
      特征: 孤儿,在炼狱炼堂打扫战斗残渣为生。看多了邪修比斗,偷学了几手旁门左道,梦想加入血契盟当佣兵
    毒娘子:
      身份: 噬心殿驻城分殿药师
      年龄: 一百余岁
      修为: 金丹中期
      灵根: 变异灵根·毒
      特征: 长相艳丽但浑身散发淡淡毒香,在分殿经营毒药铺。卖毒也卖解药,价格翻倍,口头禅是"中了毒再来找我,打折"
</玄渊城>
