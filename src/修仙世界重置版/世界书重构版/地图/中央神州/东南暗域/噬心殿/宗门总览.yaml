噬心殿:
  定位: 邪道强宗,毒道传承
  殿主: 玉横枝(九毒之体,渡劫期后期)

  核心理念: 草木藏杀机,万毒可入道

  修炼体系:
    心毒魂毒: 核心是心毒、魂毒、尸蛊
    以毒入药: 精通以毒入药、以药化毒
    剧毒杀伐: 擅长用剧毒直接致命
    医毒同源: 深谙医理,但用于害人

  与百草庐的恩怨:
    殿主玉横枝: 原为百草庐叛徒
    死敌关系: 两派不死不休
    理念对立: 医者仁心 vs 万毒入道

  与合欢宗的差异:
    噬心殿: 剧毒杀伐,心毒魂毒尸蛊,直接致命
    合欢宗: 控心之毒,春药媚药,控制心智激发欲望

  山门地点:
    位置: 中央神州东南部·赤魇沼
    环境: 瘴气毒雾弥漫,剧毒遍布
    建筑: 建于沼泽深处巨大岩洞中

  宗门规模:
    殿主: 玉横枝(九毒之体)
    长老: 四位
    内门弟子: 五千余人
    外门弟子: 三万余人
    附属势力: 赤魇沼及周边毒物产地

  弟子阶梯:
    毒奴:
      人数: 五万余人
      修为范围: 凡人至炼气初期
      职责: 采集毒物、饲养毒虫、清理瘴气通道、充当毒药试验体
      特征: 多为被掳掠或走投无路之人,被种下心蚀蛊控制,生死全在噬心殿手中
    外门弟子:
      人数: 三万余人
      修为范围: 炼气中期至筑基后期
      职责: 炼制低阶毒药、维护赤魇沼外围毒阵、外出搜集毒材、执行暗杀任务
      特征: 已修炼百毒不侵体初阶,可抵御大部分低阶毒素,身上常年带着三种以上毒药
    内门弟子:
      人数: 五千余人
      修为范围: 金丹初期至元婴中期
      职责: 研发新毒、炼制高阶毒药蛊虫、执行高难度暗杀、镇守赤魇沼核心
      特征: 百毒不侵体大成,体内可蓄三毒以上,精通以毒入药,每人都有独门毒术
    亲传弟子:
      人数: 不足二十人
      修为范围: 元婴后期至化神期
      职责: 随殿主修行、研习噬心九诀、执掌一方毒域、代表噬心殿处理外务
      特征: 殿主亲传,体内蓄毒六种以上,一举一动皆带毒性,寻常修士不敢近身三丈

  核心功法:
    噬心九诀: 殿主绝学,修炼至极可身具九毒
    百毒不侵体: 高阶功法,可免疫大部分毒素

  核心NPC速览:
    玉横枝:
      身份: 噬心殿殿主
      修为: 渡劫期后期
      灵根: 天灵根·毒
      性格: 冷漠寡情,掌控欲极强。百草庐叛出者,吞噬他人心智,以毒入道
    楼玄烬:
      身份: 噬心殿行刑者
      修为: 化神中期
      灵根: 地灵根·暗
      性格: 冷酷寡言,绝对服从。心蚀之力可侵蚀他人心智,精准高效的行刑者
    苏妍:
      身份: 玉横枝亲传弟子
      修为: 金丹后期
      灵根: 玄灵根·幻
      性格: 娇蛮任性,病态依赖师父。精神操控与幻毒术天才,危险的雌小鬼
