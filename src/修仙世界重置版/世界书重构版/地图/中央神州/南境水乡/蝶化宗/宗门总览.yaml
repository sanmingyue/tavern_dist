蝶化宗:
  定位: 中立特殊宗门,以化形易容、阴阳调和为修炼核心,弟子皆为生理男性却以女装示人
  宗主: 花千落(蝶仙,真仙境二重天)

  核心理念: 天地有阴阳,人身亦然。男子体内阴阳失衡者居多,唯有调和阴阳、兼修内外,方能窥得大道真谛。以女装修行非为戏谑,乃引阴入阳、以柔克刚之法门,外柔内刚、形阴神阳,最终达到阴阳合一之境

  核心特色: 化形术、幻容术、阴阳调和功法三位一体,是修仙界最独特也最具争议的宗门

  宗门手段:
    弟子特征: 全部为生理男性,修炼化形术后皮肤细腻、身形纤细、容貌秀美,着女装时足以以假乱真。性取向不受限制,男女皆可,宗门对此毫无忌讳
    核心功法: 阴阳蝶变诀,以阴柔灵力淬炼肉身,使修炼者外表趋于阴柔之美,同时内在阳刚之力不减反增,形成"外阴内阳"的独特体质,战斗力极为诡异
    化形术: 蝶化宗的化形术是真正改变体态气质的功法,修炼到高深处甚至能短暂改变骨骼结构
    独门秘术: 蝶梦幻境,利用阴阳错位的灵力波动扰乱对手判断,让敌人无法分辨其真实实力与性别,战斗中造成极大的心理压迫
    隐藏实力: 外表柔弱实则体修功法极为强悍,一拳能打碎金丹期修士的护体灵光
    情报能力: 弟子善于以各种身份混入不同势力,获取情报能力仅次于天机阁

  山门地点:
    位置: 中央神州南部·蝶梦谷·化蝶峰
    特色: 谷中常年飘舞彩蝶,灵花遍地,宛如仙境,外人初见以为是某个仙子门派

  宗门规模:
    内门弟子: 三千余人
    外门弟子: 八千余人

  弟子阶梯:
    记名弟子:
      人数: 两万余人
      修为范围: 凡人至炼气中期
      职责: 学习基础化形术、打理蝶梦谷花圃、照料灵蝶、经营宗门名下的胭脂铺与女装法器坊
      特征: 初入门者,尚未完成阴阳蝶变诀的初阶修炼,外貌变化不大,多数仍以男装示人
    外门弟子:
      人数: 八千余人
      修为范围: 炼气后期至筑基后期
      职责: 外出搜集情报、经营各地分铺、参与宗门对外贸易、维护蝶梦谷结界
      特征: 化形术初成,外表已趋阴柔秀美,开始以女装修行,可施展蝶梦幻境的基础版
    内门弟子:
      人数: 三千余人
      修为范围: 金丹初期至元婴中期
      职责: 执行高难度潜伏任务、参与宗门核心功法研修、代表蝶化宗参加各方聚会
      特征: 阴阳蝶变诀已入小成,外阴内阳体质初具,以假乱真,一拳碎护体灵光
    亲传弟子:
      人数: 不足二十人
      修为范围: 元婴后期至大乘期
      职责: 随宗主修行、掌管宗门核心机密、执行宗门最高级别任务
      特征: 阴阳蝶变诀大成,外表完美无瑕,战力诡异莫测,每人都有独特的"蝶号"

  宗门景象:
    行事: 弟子行事风格各异,有娇俏可人的、有飒爽英姿的、有冷艳高贵的,无一例外皆为女装。宗门内部氛围开放包容,对性别表达和性取向完全自由
    处境: 被正道视为怪异,被邪道视为软弱,实则两边都不敢轻易招惹。曾有邪宗嘲笑蝶化宗,结果被宗主花千落一人打上门去,三天没出来,对方宗主亲自出门赔礼道歉
    特长: 化形潜伏、阴阳调和功法、体修暗劲、情报搜集
    与其他宗门关系: 与合欢宗有微妙的竞争关系(都擅长易容渗透);与并蒂宫势同水火(两宗皆为性别相关特殊宗门,并蒂宫主张"纯阴合和方为正道",蝶化宗主张"阴阳无别美无性分",理念根本冲突。花千落修为真仙二重天高于白星渡劫大圆满,但白星以渡劫境战力抗衡真仙修士三千年不落下风,两人之间的争斗旗鼓相当);万宝商会是重要客户(蝶化宗的化妆品和女装法器是硬通货)

  核心NPC速览:
    花千落:
      身份: 蝶化宗宗主、蝶仙
      修为: 真仙境二重天
      灵根: 天灵根·阴阳双
      性格: 骄傲自恋但护短到极致,战斗力极强却懒得动手,涂口脂比修炼认真
    柳如梦:
      身份: 首席大弟子、蝶影剑
      修为: 大乘期后期
      灵根: 天灵根·风
      性格: 温柔认真腼腆,拔剑瞬间判若两人。暗恋丹宗凌菲全宗门都知道就他不知道被知道了
    沈清辞:
      身份: 药庐主事、蝶药仙子
      修为: 大乘期前期
      灵根: 地灵根·单木
      性格: 温和细心却毒舌到噎死人,药痴,三天三夜不出药庐是常态
    苏暮烟:
      身份: 暗探、千面蝶
      修为: 炼虚期后期
      灵根: 地灵根·暗
      性格: 妖媚危险冷漠,前万禁教暗部杀手,只在师父面前卸下伪装
    谢怜舟:
      身份: 阵法师、织梦蝶
      修为: 化神期中期
      灵根: 玄灵根·单土
      性格: 阵法天才生活呆瓜,走路撞柱子煮面烧厨房在宗门住了一千多年还迷路
    容锦书:
      身份: 舞修、醉蝶
      修为: 化神期后期
      灵根: 天灵根·冰
      性格: 清冷寡言但骨子里浪漫,跳舞时整个人都亮了,偷偷给每个师弟窗台放永不融化的冰晶花
