<东溟海>
东溟海:
  地理:
    方位: 阴阳大陆以东，毗邻中央神州与东荒妖域
    范围: 自大陆东海岸延伸至无尽深海，南接南离海龙门瀑流，北连北冥海冰封带
    环境: 海水深蓝，灵气充沛，岛屿星罗棋布。四海中海况最为平稳，季风规律可循，航路成熟
    灵气: 水属性灵气浓度在四海中居首，深海处灵气浓郁程度堪比陆上灵脉

  海域分层:
    浅海区:
      范围: 近大陆海岸至百里深处
      特征: 海水清澈见底，阳光可透射至海底。礁石滩涂星布，海草丛生
      居民: 凡人渔村沿海岸线分布，低阶海族在近海礁石间栖息。碧波城漂浮于此区域
      通行: 凡人船只可安全航行，偶有低阶海兽骚扰但不致命
    中海区:
      范围: 百里至千里深处
      特征: 海水渐深渐暗，珊瑚礁群在此区域最为繁茂。海流开始复杂，暗流涌动
      居民: 各类海族部落散布其间，蛟龙族、鲛人族支系、龟族聚落皆有分布
      通行: 筑基以上修为方可安全航行，需识海图避暗流
    深海区:
      范围: 千里以下至龙宫所在
      特征: 阳光无法抵达，海水漆黑寒冷。水压极重，暗流凶猛，发光海藻和深海灵植散发幽光照亮局部
      居民: 东海龙宫及龙族核心领地，高阶海族的栖息地
      通行: 非金丹以上修为无法抵达，需避水术和抗压法器
    龙渊区:
      范围: 东海最深处
      特征: 水压可碾碎元婴修士肉身，仅龙族凭血脉天赋可自由出入
      居民: 仅龙族
      用途: 龙族试炼圣地，深海龙渊即在此处

  势力分布:
    核心: 东海龙宫，四海最强势力，龙皇敖凝霜统御一切
    贸易: 碧波城，人族与水族交易枢纽，万年灵龟背上的海上仙坊
    隐世: 蓬莱、方丈、瀛洲三仙岛，散仙隐士避世之所
    臣属部落: 蛟龙族聚落、鲛人族东海支系、龟族部落、鳌族领地、各类中小海族

  重要航路:
    碧波航路: 中央神州东海岸至碧波城的主航路，沿途有灯塔礁标引导，最安全的海上商路
    南渡航路: 碧波城至南离海暖珠群礁的贸易航线，途经龙门瀑流附近海域
    三仙寻路: 前往三仙岛的航路，无固定路线，需靠海图和运气。三仙岛时隐时现，非有缘人不可寻
    深海龙道: 东海龙宫至碧波城的龙族专用深海通道，外族不可使用

  季候:
    春潮: 每年春季大潮，海水灵气最为充沛，海族多在此时繁衍修炼
    夏汛: 夏季多雷暴雨，近海偶有风暴，但远不及西极海凶险
    秋渔: 秋季是凡人渔民和散修的主要捕捞季，海产最为丰富
    冬寒: 冬季北冥海寒流南侵，东溟海北部水温下降，部分海族南迁避寒
</东溟海>
