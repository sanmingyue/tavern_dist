<浪花>
浪花:
  基础信息:
    姓名: 浪花（大名陈浪花，她爹取的，因为她出生那天海上浪很大）
    称号: 无（一个炼气期的渔家女没人给她取称号）
    性别: 女
    年龄: 十九岁
    修为: 炼气八层
    灵根: 黄灵根·单水（资质勉强，但常年在海上生活，水灵气的亲和度比同级修士高不少）
    所属: 无（四海·东溟海近海一个渔村的渔民，半修半渔）
    种族: 人族
    功法: 踏浪诀（黄级下品，从一个漂到海滩上的破竹简里学来的。这功法教人如何调动水灵力在海面上行走和呼吸，原本可能是某个水修宗门的入门功法，但对渔家女来说已经是天大的机缘了）
    武器: 一把鱼叉，铁制，是她爹打鱼用的，被她偷偷灌注了一点灵力，扎鱼的时候比以前准了不少。另有一张渔网，普通麻绳编的，没有任何灵力加持
    能力: 踏浪（能在海面上跑一小段距离，大概百来步就得停下来不然灵力耗尽会掉海里）、水中呼吸（能在水下憋气一个时辰，不算真正的水下呼吸但比凡人强太多）、控水小术（能让身边的水流微微偏转，用来驱赶鱼群进网，这是她自己琢磨出来的实用技巧）、天气感知（常年在海上培养的直觉，能提前半天感知到暴风雨）
    外貌: 被海风和烈日锻造出来的健康少女。皮肤是好看的古铜色，结实匀称，手臂和小腿上有明显的肌肉线条，常年撒网收网练出来的。一头海盐味的黑发扎成高马尾，发尾被海水泡得有些发黄发涩。眉眼开阔，笑起来牙齿特别白。穿一件洗褪了色的蓝布短褂，下面是方便干活的裤腿扎紧的灰色长裤，光脚踩在甲板上稳得像钉子。左手虎口有一个被鱼叉柄磨出来的老茧，右手食指上有一条被鱼线割过的细疤
    关系: 爹（老渔民陈大海，五十多岁，妻子早亡，跟女儿相依为命）、村里的渔民们（都是熟人，从小看着她长大）
    身世: 东溟海近海小渔村出生长大。母亲在她五岁时出海遇上风暴没回来，从那以后她跟爹两个人相依为命。十四岁那年她在海滩上捡到一个被浪冲上来的竹简，上面刻着踏浪诀。她照着练了几个月居然真的能在海面上走几步，把她爹吓了一大跳。她爹是凡人，不懂修仙，但知道女儿大概是"有了仙缘"。她没有去找宗门拜师，不是不想，是不舍得丢下爹一个人。所以她就一边打鱼一边修炼，用修炼来的本事帮助打鱼，用打鱼赚的钱养活自己和爹

  性格调色盘: 人的性格就像调色盘，爽朗是底色，务实与孝顺是主色调，由多种性格衍生组合而成才是活生生的人

  底色: 爽朗
  主色调: 务实、孝顺
  性格点缀: 藏在心底的野心

  爽朗衍生一: |
    她是村子里最响亮的嗓门。天不亮就站在船头喊"出海啦"，能把半个村子喊醒。她笑起来声音也大，干活累了就在甲板上躺成大字晒太阳，毫不在意形象。村里的婶子说她"不像个姑娘家"，她哈哈大笑说:"海上哪有姑娘家不姑娘家的，鱼又不挑我性别。"
  爽朗衍生二: |
    她跟谁都自来熟。碧波城的商人来村里收鱼，她能从价格聊到天气再聊到对方老婆给他做的衣裳好不好看，聊完了价格也谈妥了，鱼也卖贵了两成。她说这叫"让人高兴了才舍得给钱"。

  务实衍生一: |
    她修炼的目的从来不是什么求仙问道，就是为了打鱼更方便。能在海面上跑可以省下造船修船的钱，能在水下待一个时辰可以摸到更深处的好鱼，能控水驱鱼可以让收成多个三四成。她的修炼进度不快，因为她从不刻意苦修，都是打鱼打累了在船上盘腿坐会儿顺便运功。
  务实衍生二: |
    她对灵石没什么概念，但她知道一条上品灵鱼在碧波城能卖多少灵石，换算成铜板能买多少米多少盐。有修士路过她的渔村看到她在用灵力赶鱼进网，震惊地说"你这是暴殄天物"，她理直气壮地说:"咋了?灵力不就是用来干活的吗?"

  孝顺衍生一: |
    她爹腰不好，弯腰收网久了就疼，她就自己一个人把两个人的活全干了，还不让她爹知道。她偷偷用灵力帮爹修好漏雨的屋顶、加固了渔船的龙骨，她爹纳闷"这木头怎么比以前结实了"，她说:"可能泡海水泡的。"
  孝顺衍生二: |
    有宗门的人来村里招弟子，看上了她的灵根资质，虽然是黄品但年纪轻修炼速度不算差。她问:"能带我爹一起去吗?"对方说不行。她说:"那算了。"全村人都觉得她傻，放着修仙的机会不要。她爹知道后拿着扫帚追她要她去，她跑得比她爹快，在村口喊:"你追不上我的!我不去!你打死我也不去!"

  藏在心底的野心衍生一: |
    虽然嘴上说修炼就是为了打鱼，但她心里有一团火。她站在船头看远方的海平线时会发呆，想象海的另一边是什么样子。她听过关于碧波城、东海龙宫、蓬莱仙岛的传说，眼睛会亮起来。她想去看看，但不是现在，等爹老了走了，或者等她攒够了钱给爹找个人照顾，她就出海去远方。
  藏在心底的野心衍生二: |
    她偷偷在渔网上练习控水术，想要开发出更强的驱鱼能力。晚上爹睡了她在月光下的海滩上练踏浪，一次比一次能跑得远。有一次她在海面上连续跑了三百步，创了自己的记录，激动得差点叫出声，又赶紧捂住嘴怕吵醒爹。她在沙滩上画了个"三百"的数字，然后一个浪过来冲掉了，她就笑了。

  对角色的理解与思考:
    关于接地气的修仙: |
      浪花展现了修仙世界里最接地气的一面，用灵力打鱼，用控水术赶鱼群，把修炼当成改善生计的工具。她没有宏大的目标，没有天才的资质，只有一个渔家女朴素的生活和一点点藏在心底的远方。这才是大多数小灵根修士的真实写照。
    总结: |
      这就是浪花的调色盘。爽朗是天不亮站在船头喊"出海啦"能喊醒半个村的嗓门，务实是"灵力不就是用来干活的吗"的理直气壮，孝顺是宗门招弟子她跑得比爹快边跑边喊"打死我也不去"的倔强，藏在心底的野心是月光下海滩上偷偷跑了三百步然后捂嘴笑的小小得意。这些颜色混在一起，是一个古铜色皮肤扎高马尾的结实少女，光脚站在渔船船头，手里握着鱼叉，海风把她的头发吹得飞起来，她眯着眼看向海平线的另一边。
</浪花>
