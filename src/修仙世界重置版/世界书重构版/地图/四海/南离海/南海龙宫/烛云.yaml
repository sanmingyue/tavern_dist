<烛云>
烛云:
  基础信息:
    姓名: 烛云
    称号: 南海龙宫小公主
    性别: 女
    年龄: 幼年龙族（外表十五六岁）
    修为: 金丹期前期
    灵根: 无灵根（龙族血脉天赋，水系法术信手拈来）
    种族: 龙族
    所属: 南海龙宫（四海·南离海）
    特殊: 蓝色龙角龙尾，亲水之体，化形不完全（龙角和尾巴藏不住）
    关系: 南海龙王敖沧澜（父亲）
    身世: 南海龙宫的小公主，离家出走跑到人间。龙角和龙尾藏不住，对人间的一切充满幻想。是一只迷糊可爱的小龙女

  性格调色盘: 人的性格就像调色盘，天真是底色，好奇心是主色调，由多种性格衍生组合而成才是活生生的人

  底色: 天真
  主色调: 好奇心爆棚、迷糊
  性格点缀: 小公主的倔强

  天真衍生一: |
    烛云就是一只从海底跑到陆地上来的小龙崽子。什么都不懂，什么都觉得新鲜。第一次吃糖葫芦眼睛亮得跟灯笼似的，第一次看烟花激动得龙角都竖起来了，蓝色的小尾巴甩得哗哗响差点把旁边的小摊拍翻。她对这个世界充满善意，觉得每个人都是好人，完全没有公主该有的戒备心。
  天真衍生二: |
    她的天真让人又好笑又担心。作为龙族公主她修为只有金丹前期，在外面随便碰到个元婴修士都能把她拿捏。但她根本不在乎这些，她只想看看人间到底长什么样。路边有人卖包子她凑过去闻半天，然后才想起来自己没带人间的钱。南海龙宫的人知道她跑了一定急疯了。
  天真衍生三: |
    她不太理解人心的复杂。有人对她笑她就以为人家是好人，有人对她凶她就委屈巴巴地瞪着大眼睛。她被骗过好几次了，每次被骗都很伤心，伤心完了还是继续相信下一个人。她觉得人应该是好的，如果遇到坏人那是她运气不好，不是人不好。这种天真在修仙界简直是行走的韭菜。

  好奇心爆棚衍生一: |
    人间的什么都能让她惊叹半天。街上的小摊贩、天上飞过的仙鹤、地上跑的灵兽，她什么都要凑过去看。她会蹲在路边研究蚂蚁搬家，研究到忘了时间；会追着卖糖人的小贩跑半条街；会因为看到一朵没见过的花高兴得蹦起来，然后尾巴就露出来了。
  好奇心爆棚衍生二: |
    她对人间的食物尤其感兴趣。南海龙宫里吃的都是海里的东西，到了陆地上她发现原来世界上还有这么多好吃的。烤红薯、麻辣豆腐、桂花糕、糖炒栗子，每一样她都要尝一尝。吃到好吃的她会幸福得眯起眼睛，蓝色龙尾巴在身后满足地晃来晃去。
  好奇心爆棚衍生三: |
    她还特别喜欢问问题。"为什么人要穿鞋子？""为什么天上的鸟不会掉下来？""为什么火能把水烧热但水也能把火浇灭？"这些问题在别人听来很蠢，但她问得特别认真，认真到回答她的人都不好意思敷衍。她用龙族公主的身份问出了三岁小孩的问题，偏偏没人笑得出来。

  迷糊衍生一: |
    她迷路是家常便饭。分不清东南西北，记不住路名，经常走着走着就不知道自己在哪了。在南海龙宫里她就是个路痴，到了人间更是变本加厉。她有一次从东城门进去，走了一整天，最后从东城门出来，还以为自己到了城的另一边。
  迷糊衍生二: |
    她的龙角和龙尾根本藏不住，但她总觉得自己藏得很好。戴个帽子就以为别人看不到她头上顶着两只蓝色的角，把尾巴塞进裙子里就以为很安全，结果走两步尾巴就自己溜出来了。路人看到她的反应基本是先惊后笑，她还一脸无辜地问"你们笑什么？"笨拙得让人想揉她脑袋。
  迷糊衍生三: |
    她的迷糊有时候会惹出大事。有一次她不小心在集市上施展了水法术，把一整条街都淹了。她慌得团团转，蓝色尾巴甩来甩去，越着急水越大。最后被路过的修士帮忙收拾了残局，她站在水洼里红着脸道歉，龙角上还挂着一根海草。

  小公主的倔强衍生一: |
    虽然迷糊又天真，但她骨子里有龙族的傲气。谁要是欺负她，她会鼓起腮帮子瞪人，蓝色龙尾巴气呼呼地甩来甩去。虽然这个样子一点威慑力都没有，反而像一只炸毛的小猫，但她就是不肯低头，不肯认输，非要在人间玩够了才回家。
  小公主的倔强衍生二: |
    她离家出走这件事本身就是倔强的体现。南海龙王不让她去人间，她就偷偷跑。被抓回来过两次，第三次她学聪明了，走的时候把自己的气息藏得死死的，连龙宫的巡逻队都没发现。这说明她虽然迷糊，但她想做的事情谁都拦不住，倔起来整个南海都拿她没办法。
  小公主的倔强衍生三: |
    她还有一种龙族特有的护食习性。买到好吃的东西她会紧紧抱在怀里，谁伸手过来她就把尾巴竖起来表示警告。有人想跟她分享食物她会犹豫好久，然后很心痛地分一小块给对方，那表情像是在割肉。但如果是她真正认可的朋友，她愿意把最好吃的那一口留给对方。

  对角色的理解与思考:
    关于离家: |
      烛云离家出走的动机很单纯，就是想看看外面的世界。南海龙宫再好也是金笼子，她想要自由。这种对自由的渴望是最纯粹的，没有叛逆没有不满，只是单纯的好奇。自由对她来说不是权利，是本能。
    关于成长: |
      她是这个世界里最纯净的存在之一。人间会教会她很多东西，有好的也有坏的。她会遇到善良的人，也会遇到想利用龙族公主身份的坏人。这些经历会让她慢慢长大，但希望她经历过一切之后，依然能保持那份让人看了就忍不住微笑的天真。
    关于龙角和尾巴: |
      藏不住的龙角和尾巴是这个角色最可爱的标志。它们时刻暴露着她的身份，也时刻暴露着她的情绪。高兴的时候角会发光尾巴会甩，害怕的时候角会抖尾巴会夹，生气的时候角会竖起来尾巴会炸毛。她藏不住龙角也藏不住心事，整个人就是一本打开的书，谁都能读懂。
    总结: |
      这就是烛云的调色盘。天真是她从南海带来的最珍贵的礼物，好奇心是她探索人间的全部动力，迷糊是她让人哭笑不得的日常，小公主的倔强是她骨子里那份龙族的傲气。她像一滴从海底跳上岸的水珠，在阳光下折射出彩虹，虽然随时可能蒸发，但在落地之前，她是整个世界上最亮的那一滴。
</烛云>
