<南海龙宫>
南海龙宫:
  定位: 四海龙族势力，南海统治者
  位置: 南离海火山深海中一片奇异冷水区域，水晶宫殿隐于温差屏障之后
  种族: 龙族为主，统御南海水族
  核心功法: 真龙皇典·南海支脉

  宗门理念:
    - 龙族血脉为尊，古法传承不可废
    - 守成为上，不争天下只守一方
    - 宝藏是龙族底蕴，代代积累不可轻散
    - 后代是龙族未来，须竭力庇护

  权力结构:
    龙王:
      敖沧澜: 南海龙王，渡劫期大圆满，两万余岁。性情古板保守，治龙宫以稳为要。一生最大的骄傲是南海龙宫万年未遭外敌入侵，最大的烦恼是小公主烛云离家出走
    长老团:
      规模: 两位渡劫期龙族长老
      成员:
        敖沉: 大长老，渡劫期后期，一万五千余岁。南海龙王的兄长，性情沉稳如海，主管军务
        敖珠: 二长老，渡劫期中期，八千余岁。女性龙族长老，掌管龙宫宝库和内务。对宝物极为珍视，清点库存是她每日必做之事
    龙将:
      南海龙将仅两位，不设四方龙将。南海龙宫规模远小于东海龙宫
      珊瑚将·敖珊: 合体期后期，统领南海水族军队。与鲛人族关系最密切的龙将，其母为鲛人族
      深渊将·敖渊: 合体期中期，驻守火山深海区域。性情暴烈，擅长水火双属性攻击
    龙卫: 龙王亲卫六名，化神期纯血龙族。另有百余名元婴至化神龙族战士

  皇室成员:
    敖沧澜: 南海龙王，渡劫期大圆满。古板保守的老龙王
    烛云: 小公主，金丹期前期。天真迷糊的小龙女，已离家出走去人间冒险。详见独立角色文件
    敖沧澜还有两位年长的子嗣，皆为成年龙族:
      敖潮: 长子，大乘期前期，一万岁。性情稳重如父，被龙王视为继承人。常年驻守龙宫处理政务
      敖澜: 次女，化神大圆满，五千岁。擅长水系术法，负责与鲛人珊瑚宫的外交联络

  地理与建筑:
    水晶宫殿:
      位置: 火山深海中一片奇异冷水区域，周围热海环绕形成天然屏障
      建筑: 以海底水晶和珊瑚筑成的宫殿群，晶莹剔透。宫殿内陈列无数珍宝，堪称四海最豪华的龙宫
      环境: 温度适宜，灵气充沛。宫殿以龙族禁制维持，非龙族或经许可者无法穿越温差屏障
    龙珠宝库:
      位置: 水晶宫殿核心，龙王寝宫之下
      特征: 南海龙宫万年积累的宝藏尽在其中。珍珠成山，灵石如河，法器宝物堆积如山。二长老敖珠亲自看管，一颗灵石也不许外流
    深海秘境:
      位置: 水晶宫殿后方的海底溶洞群
      用途: 龙族修炼之地，溶洞中有天然火水双属性灵脉，适合南海龙族特有的水火兼修功法
    龙产房:
      位置: 水晶宫殿最深处
      特征: 龙族幼崽孵化之地，温度和灵气经过精密调控。南海龙王对此处守卫极严

  与鲛人族的关系:
    历史: 南海龙宫与鲛人族世代联姻，关系比其他海域的龙族与臣属更为紧密
    现状: 名义上龙宫为主鲛人为臣，实际上鲛人族在珊瑚浅海和温流中海拥有高度自治权
    联姻: 珊瑚将敖珊之母即为鲛人族，此类跨族联姻在南海龙宫并不罕见
    矛盾: 鲛人族自治权日益膨胀，年轻一代鲛人中有人主张脱离龙宫管辖。龙王对此感到忧虑但未采取强硬措施

  水族臣属:
    鲛人族: 最大臣属，自治权极高。鲛人族长与龙王地位接近平等
    巨螯族: 体型巨大的蟹族，占据温流中海东部。性情粗犷，以力量著称，忠于龙宫
    火龟族: 栖息于火狱群岛，耐热体质。为南海龙宫看守火山区域
    海蛇族: 分布于珊瑚浅海，数量众多但修为普遍不高。以采珠和捕鱼为生

  对外关系:
    东海龙宫: 同为龙族，但关系平淡。敖沧澜对敖凝霜的态度是敬而远之，认为东海龙皇行事过于强硬
    鲛人珊瑚宫: 联姻关系，合作大于竞争。但鲛人自治权的扩大是隐忧
    南疆巫地: 几无往来，浊水湾是天然屏障
    碧波城: 南海鲛人在碧波城有商铺，经营鲛绡和鲛人泪珠贸易

  当前局势:
    内部: 龙王治下稳定但缺乏活力，保守风气让年轻龙族和鲛人族感到压抑
    烛云出走: 小公主离家出走后龙王极为忧虑，曾派龙卫搜寻但被烛云甩脱。龙王没有大张旗鼓追捕，因为不想让四海知道南海龙宫连自己的公主都看不住
    宝库: 南海龙宫的宝库在四海中首屈一指，这既是底蕴也是其他势力觊觎的目标

  路人NPC速览:
    敖潮: 龙王长子，大乘期前期。稳重守成，处理政务井井有条，与父性情如出一辙
    敖澜: 龙王次女，化神大圆满。擅长外交，与鲛人族关系融洽，性情比父兄开朗
    敖珠: 二长老，渡劫期中期。看管宝库的守财老龙，每天清点宝库是她的乐趣
    银鳞: 龙王亲卫统领，化神后期，纯血龙族。面无表情的忠诚卫士，话极少
    火鳌: 火狱群岛巡守，金丹大圆满，火龟族。脾气火爆，把火山岛看得比自己命还重
</南海龙宫>
