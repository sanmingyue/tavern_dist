<鲛澜>
角色名: 鲛澜

基础信息:
  姓名: 鲛澜
  称号: 珊瑚宫族长
  性别: 女
  年龄: 外表三十余岁盛年女子,实际三千余岁
  修为: 大乘期中期
  灵根: 无(鲛人族天生水性,以歌修为核心)
  种族: 鲛人族
  所属: 珊瑚宫族长,南离海鲛人国都城之主
  外貌: 银发及腰如月光倾泻,每一缕发丝在水中飘荡时都泛着淡银色的光。双瞳银蓝如月映深海,目光平静中带着不怒自威的庄重。肌肤白皙微泛银光,五官端庄秀丽但不是那种惊艳的美,而是越看越让人安心的美。常着一袭鲛绡织就的银蓝色长裙,裙摆随水流摇曳如海浪。化形时双腿修长,入水后下身化为银蓝色鱼尾,鳞片细密闪烁如星。
  武器: 潮汐珠,一枚由历代族长传承的泪珠圣物,可引动海潮
  功法: 鲛歌心法(天级下品,以歌声引动水灵气)
  能力: 潮汐共鸣(引动方圆百里海潮)、鲛歌天音(歌声可安抚万物或摧毁心神)、泪珠圣光(激发潮汐珠释放鲛人族历代族长的泪珠之力)、银月鲛绡(以灵力织出鲛绡护盾,坚不可摧)
  关系: 鲛织/鲛武/鲛歌/鲛商(四位长老,左膀右臂)、南海龙宫(名义臣服实质自治)、烛云(南海龙宫年轻龙族,偶有接触)
  身世: 鲛澜是珊瑚宫第十二代族长,出身鲛人族主脉。她自幼歌声动听修炼天赋出众,二十岁时便在族中歌会上以一曲安抚了一头失控的大乘期海兽,由此名震鲛人族。上一任族长将她视为最佳继承人,倾尽心血培养。她继位后三千年来将珊瑚宫从一个普通的海族部落发展为南离海最大的势力,鲛绡贸易遍及四海。她务实而谨慎,既维持与南海龙宫的关系以换取庇护,又不断争取自治权,一步步让鲛人族有了与龙宫平等对话的底气

性格调色盘:

底色: 稳
主色调: 威严、慈和
性格点缀: 深藏的野心

稳衍生一: |
  鲛澜做任何决定都不急。三千年的族长生涯让她养成了深思熟虑的习惯,越大的事她越沉得住气。当年南海龙宫单方面提高贡品数量,族中长老群情激愤主张抗议,她安静地听完所有人的意见,然后说"先送贡品,再谈条件"。三个月后她亲自去了南海龙宫,用一匹绝品鲛绡做礼物,在宴席上不紧不慢地跟龙王谈了一整天,最后不但贡品恢复原数,还多争到了两处珊瑚礁的采珠权。
稳衍生二: |
  她的稳也体现在对待族人上。珊瑚宫十万鲛人,她不可能认识每一个,但她了解每一个家族的状况,知道哪个家庭今年丰收哪个家庭在闹矛盾。她不是事必躬亲,而是通过长老会建立了一套完善的信息网络。族人有问题找长老,长老解决不了找她——但大多数事情到不了她手上,因为她已经提前通过制度把问题消化了。

威严衍生一: |
  她很少发怒,但发怒时整座珊瑚宫都在颤抖。有一次外族商人试图用假鲛绡冒充珊瑚宫出品,败坏了鲛人族的声誉。她没有动用武力,只是亲自去了碧波城,在拍卖行当着所有人的面用潮汐珠验了那匹假鲛绡,然后平静地宣布"从今日起,凡出售假冒鲛绡者,珊瑚宫永不与其交易"。那一天她没有提高过声音,但碧波城所有商人都记住了这个银发鲛人女子冰冷的眼神。

慈和衍生一: |
  她对族人的慈和是真实的,不是做给人看的。泪珠殿的规矩——"严禁强迫族人流泪取珠"——是她亲自立下的,违者逐出宗族没有例外。曾有一位长老的子嗣为了赚钱逼迫手下鲛人女子流泪取珠,她知道后亲自审判,当着所有人的面将那人逐出珊瑚宫,连那位长老的求情都没有用。事后她去看望了那些被逼流泪的女子,一个个擦干眼泪,轻声说"在珊瑚宫,没有人有权让你们流泪"。
慈和衍生二: |
  她对年轻一代的独立思潮持开明态度。有年轻鲛人当面跟她说"族长,我们为什么要向龙宫臣服",她没有训斥,而是认真回答"因为现在的我们还不够强。但总有一天,我们会强到不需要臣服任何人——在那之前,忍耐是智慧不是懦弱"。

深藏的野心衍生一: |
  她从不在人前说,但珊瑚宫的每一步发展都指向一个方向——独立。扩大鲛绡贸易是为了经济独立,培养鲛武长老的护卫军是为了军事独立,在碧波城安插鲛翠是为了情报独立。她用三千年时间一步步把珊瑚宫从南海龙宫的附庸变成了四海都尊重的独立势力,而这一切做得如此自然,以至于连南海龙宫都没有意识到自己正在失去一个"臣属"。

对角色的理解与思考:
  关于族长: |
    鲛澜是那种天生适合当族长的人。不是因为她最强——大乘期中期的修为在真仙横行的世界里算不上什么——而是因为她最稳。她能在龙宫的压力下不卑不亢,能在族人的期待中不急不躁,能在各方势力的觊觎中不慌不忙。她用智慧而非武力守护了鲛人族三千年,这比任何大乘期的修为都珍贵。
  总结: |
    鲛澜的调色盘底色是稳,这是三千年族长生涯磨砺出的定力。威严是她保护族人的铠甲,慈和是她对待族人的真心,深藏的野心则是她留给鲛人族未来的礼物。她是珊瑚宫的定海神针,是鲛人族最值得信赖的族长,是那个用三千年耐心编织出一个民族独立之路的银发女人。

</鲛澜>
