<四海龙族功法>
四海龙族功法:
  真龙皇典:
    品级: 仙级
    归属: 东海龙宫龙皇独传
    属性: 水/冰/龙
    特征: 龙族至高功法，唯有龙皇一脉有资格修炼
    限制: 需纯正龙族血脉
  龙吟诀:
    品级: 天级上品
    归属: 东海龙宫
    属性: 水
    特征: 龙族通用功法，以龙吟震荡灵气引导修炼
    限制: 需龙族血脉。混血龙族修炼效果减半
  化龙九式:
    品级: 天级下品
    归属: 蛟龙族
    属性: 水
    特征: 蛟龙族核心秘传功法，辅助蛟龙化真龙。成功率极低
    限制: 蛟龙族专属
</四海龙族功法>
