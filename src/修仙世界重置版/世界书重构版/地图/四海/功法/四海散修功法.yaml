<四海散修功法>
四海散修功法:
  碧波诀:
    品级: 玄级上品
    来源: 碧波城散修公会
    属性: 水
    特征: 四海散修中流传最广的基础水系功法，无种族限制
    获取: 碧波城散修公会以极低价格出售
  潮汐功:
    品级: 地级下品
    来源: 四海各处流传
    属性: 水
    特征: 在海上修炼效率极高，陆地减半
    获取: 碧波城各大商铺有售
  辟水心法:
    品级: 黄级上品
    来源: 四海广泛流传
    属性: 水
    特征: 最基础的水系功法，海上必备
    获取: 随处可得
  风雷体:
    品级: 地级中品
    来源: 西极海流传
    属性: 风/雷
    特征: 在西极海风暴中淬炼体魄
    获取: 西极海黑市偶有出售
</四海散修功法>
