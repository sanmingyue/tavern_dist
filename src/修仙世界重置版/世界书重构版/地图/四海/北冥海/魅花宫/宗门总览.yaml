<魅花宫>
魅花宫:
  定位: 偏中立的双修宗门，北冥海幽落海中的隐秘势力
  位置: 北冥海西部支海幽落海，海底珊瑚宫殿
  性质: 只收女弟子的双修宗门。修炼以情入道、以欲证心的功法。在正道眼中是邪道，在邪道眼中太过温和，实际上走的是偏中立的路线
  宫主: 魅千姬，渡劫期中期

  幽落海:
    位置: 北冥海西部一片独立支海，与北冥海主体由一道海底山脉隔开
    环境: 终年浓雾迷障笼罩。与北冥海的极寒不同，幽落海的水温温和，是北冥海中唯一的暖水区域
    海面: 漂浮着无数幻梦之花，释放迷幻香气。花瓣呈半透明淡紫色，在雾中发出微弱荧光
    迷障: 浓雾中包含幻术阵法，不知路线的闯入者会在雾中迷失方向，最终被幻梦之花的香气催眠
    特殊: 幽落海的暖水来源不明，有人猜测海底有特殊地脉，也有人说是魅花宫的大阵在运作

  宗门结构:
    宫主:
      魅千姬: 渡劫期中期，千余岁。魅花宫第七代宫主，以魅术和幻术闻名四海。双修功法修至极高境界，容貌永驻盛年
    长老:
      规模: 三位长老
      成员:
        梦蝶: 大乘期前期，掌管弟子修炼和功法传授。性情柔和，擅长以梦入道的修炼法门
        红袖: 合体期大圆满，掌管宗门防务和对外事务。性格泼辣直爽，是魅花宫中最好战的长老
        幻烟: 合体期后期，掌管幽落海迷障阵法和幻梦之花的培育。沉默寡言，极少露面
    圣女:
      怜星: 魅千姬的养女，元婴后期。魅花宫圣女，被宫主当作继承人培养
    弟子:
      规模: 内门弟子约两百人，外门弟子约五百人。全部为女性
      来源: 多数是被正道宗门排斥的女修、流浪的散修、或被魅花宫弟子在外游历时带回的孤女
      修炼: 内门弟子修炼双修功法，外门弟子修炼基础功法。不强制双修，自愿选择
      阶层: 外门→内门→真传→圣女→长老→宫主

  建筑:
    珊瑚宫殿:
      位置: 幽落海海底
      特征: 以粉色珊瑚和发光宝石构建的宫殿群，规模宏大华美。与南离海珊瑚宫的风格截然不同，更加妖媚绮丽
      布局: 主殿为魅千姬寝宫，两侧分列长老殿和弟子居所
    心涧:
      位置: 珊瑚宫殿后方的海底峡谷
      功能: 幻境观心修炼地。弟子在此用幻术直面自己内心的欲望和恐惧，以此磨炼心境。修炼失败者会陷入心魔
    花镜:
      位置: 珊瑚宫殿中央的水晶大厅
      功能: 一面巨大的水晶镜，能映射来者内心最深处的欲望。魅花宫以此考验弟子的心性，也用来甄别来客的真实意图
    红莲殿:
      位置: 珊瑚宫殿最深处
      功能: 禁地，极致双修之所。只有宫主和长老级别才有资格进入。殿内的红莲阵法可以将双修效果放大数倍
    幻梦花田:
      位置: 幽落海海面
      功能: 培育幻梦之花的花田。幻梦之花是魅花宫独有的灵植，其香气可用于炼制各类魅惑丹药和幻术法宝

  修炼体系:
    核心: 以情入道，以欲证心。通过直面和掌控自身的情感与欲望来突破修炼瓶颈
    功法: 天魅心经，天级下品。双修功法，既可与他人双修也可独自修炼心境。修至高深处可控制他人情绪
    魅术: 魅花宫独创的术法体系，介于幻术和惑心术之间。可让对手心神失守，也可在日常中感知他人情绪
    幻术: 以幻梦之花为媒介的幻术体系，可创造逼真幻境
    战斗风格: 不以力取胜，以术惑人。先乱心神后取要害，擅长以弱胜强

  收徒标准:
    必要: 女性，有修炼资质
    优先: 情感丰富者、有心魔困扰者、被正道排斥的女修。魅花宫认为情感越丰富的人在情道上走得越远
    禁止: 心性扭曲嗜杀成性者。魅花宫的道是驾驭欲望而非被欲望驱使

  对外关系:
    正道: 正道宗门普遍视魅花宫为邪道，但因魅花宫从不主动挑衅且行事有底线，不会刻意针对
    邪道: 邪道势力视魅花宫太过温和，不愿与之深交。魅花宫也不屑与残忍的邪道为伍
    东海龙宫: 互不侵犯的默契。魅千姬与敖凝霜有旧识之缘，两人偶有往来
    北冥海族: 与玄龟族、冰螭族等北冥海势力保持距离，不参与北冥海事务
    四海长老会: 不参与长老会事务，但长老会也不干涉魅花宫

  宗门规矩:
    不可强迫他人双修。违者逐出师门
    不可利用魅术残害无辜。以术害人者重罚
    弟子外出游历时不可主动暴露魅花宫身份，以免招惹是非
    接受被正道排斥的女修，但不接受被正道通缉的杀人犯

  当前局势:
    平稳: 魅花宫千余年来一直保持低调，与世无争。宫主魅千姬实力强大足以震慑宵小
    隐忧: 圣女怜星的实力尚不足以继承宫主之位，魅千姬在考虑加速培养
    外部: 近年来北原魔族有从北冥海渗透的迹象，幽落海的迷障可能面临考验

  路人NPC速览:
    梦蝶: 大乘期前期，长老。温柔似水，说话轻声细语。擅长以梦入道，能在他人梦中传授功法
    红袖: 合体期大圆满，长老。泼辣直爽，是魅花宫中最不像魅花宫弟子的人。外出办事时常被误认为散修女侠
    幻烟: 合体期后期，长老。终年待在幻梦花田中培育幻梦之花，极少与人交流。据说她与幻梦之花融为一体，半人半花
    绮罗: 内门首席真传弟子，元婴前期。美貌出众但性格高冷，视怜星为竞争对手。修炼天赋极高但心性不够沉稳
    小蝶: 外门弟子，筑基前期。被红袖从外面捡回来的孤女，性格活泼开朗。偷偷崇拜怜星，梦想成为下一任圣女
</魅花宫>
