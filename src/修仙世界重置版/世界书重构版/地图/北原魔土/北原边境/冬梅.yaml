<冬梅>
角色名: 冬梅

基础信息:
  姓名: 冬梅(北原雪原部落的名字,意思是"在最冷的时候盛开的花"。她出生那天是三十年来最冷的暴风雪夜,萨满说她是带着寒意来的孩子)
  称号: 雪瞳(部落里的人这么叫她,因为她的眼睛在预感危险的时候会变成银白色)
  性别: 女
  年龄: 十五岁
  修为: 凡人(但她的预感能力不属于任何已知的修炼体系,萨满说那是雪原大地的馈赠,不是灵根不是功法,是血脉里的东西)
  灵根: 无(她的能力跟灵根无关,更接近于一种原始的天赋神通,但极其微弱且不可控)
  所属: 北原·雪原部落·白狼氏(一个只有两百多人的游牧部落,跟着驯鹿群在雪原上迁徙,远离魔土核心区域但仍在北原范围内)
  种族: 人族(北原蛮族分支)
  功法: 无(萨满试图教过她一些古老的祭祀仪式,但那些仪式需要的"力量"她还掌握不了)
  武器: 无(她倒是会用弹弓,打猎用的,准头不错)
  能力: 预感危险(她能在危险来临之前感觉到——暴风雪、狼群、魔气侵袭,她都能提前一段时间有所感应。感应方式是后脑勺会发麻、眼睛会刺痛变成银白色。但这种能力不稳定,有时灵有时不灵)、耐寒(北原蛮族天生耐寒,她尤其突出,在暴风雪里待半天也只是觉得凉而已)、跟动物亲近(雪原上的动物不怕她,白狼甚至会主动靠近她)
  外貌: 皮肤很白,北原蛮族大多肤色偏深但她是例外,白得在雪地里几乎跟雪融为一体。头发是银灰色的,不是染的而是天生的,长到肩膀,风一吹跟雪一样飘。眼睛平时是浅灰色,预感来的时候变银白。身材偏瘦不算高挑,穿着白色的兽皮袍子,脚上是驯鹿皮的靴子,脖子上挂着母亲给的骨制护符
  关系: 母亲·霜(部落萨满,是部落里最受尊敬的人)、白狼阿银(一头跟了她三年的白狼,小时候她救了它,从此不走了)
  身世: 白狼氏部落萨满的独女。她出生的那个暴风雪夜,帐篷外的篝火全灭了,唯独她母亲帐篷里的火焰变成了白色。萨满说这是雪原之灵降下印记,这孩子将来要么是部落的守护者要么是灾难的预兆。她从小就跟别的孩子不一样——太安静,太白,眼睛会变色,动物会主动靠近。部落里的人对她敬而远之,除了她母亲和那头白狼

性格调色盘: 人的性格就像调色盘,沉静是底色,敏感与温柔是主色调,由多种性格衍生组合而成才是活生生的人

底色: 沉静
主色调: 敏感、温柔
性格点缀: 对自己的不确定

沉静衍生一: |
  她话很少,不是不想说是不知道跟谁说。部落里同龄的孩子对她有一种说不清的疏远,不是恶意但也不亲近。她习惯了一个人待着,跟白狼阿银坐在帐篷外看雪原。雪原是安静的,她也是安静的,她们很合适。她能一个人在雪地里坐上大半天,看远处的天际线从白变灰再变成暮色的深蓝。
沉静衍生二: |
  她的安静不是冷漠。她会默默注意到很多事——谁家的帐篷漏风了她去帮忙堵,谁家的孩子跑丢了她带着阿银去找。做完就走不等人道谢,因为她觉得说"谢谢"那一刻两个人都会尴尬——对方感激但也怕她,她能感觉到那种怕。

敏感衍生一: |
  她的预感能力让她对周围环境的感知远超常人。风向变了她第一个知道,空气里多了一丝不对的味道她第一个紧张。这种敏感在保护部落的时候是好事,但在日常生活中让她活得很累——她总是绷着,总是在留意,好像随时有什么坏事要发生。她母亲教她冥想来缓解这种紧绷,但效果有限。
敏感衍生二: |
  她对人的情绪也很敏感。别人还没开口说什么她就知道对方高兴还是难过,想靠近还是想远离。这让她在人际交往中很被动——她总是先感知到别人对她的不自在,然后自己主动退开。她不怨任何人,她知道自己"不一样",而不一样本身就是一种距离。

温柔衍生一: |
  她对白狼阿银是最温柔的。阿银三年前还是一头受伤的小狼崽,被她从雪地里捡回来的。她用自己的口粮喂它,把自己的兽皮袍子垫给它睡,半夜起来给它换伤口上的草药。阿银长大了比她还高,但在她面前还是会翻肚皮撒娇。她跟阿银说话比跟人说话多得多。
温柔衍生二: |
  她对雪原上的一切生命都有一种天然的善意。迁徙途中遇到冻僵的小动物她会揣进怀里暖一暖,遇到受伤的驯鹿她会帮忙处理伤口。她的母亲说她身上有"雪原的慈悲"——雪原看似冷酷但其实养育了万物,冬梅就像雪原本身,冷在外面暖在里面。

对自己的不确定衍生一: |
  萨满说她要么是守护者要么是灾难的预兆,这句话从小压在她心里。她不知道自己到底是哪一种。每次预感到危险成功帮部落避开灾祸的时候,她会松一口气——今天她是守护者。但每次预感不灵,有人因此受伤的时候,她就会陷入深深的自我怀疑——也许她是灾难那一种。
对自己的不确定衍生二: |
  她问过母亲:"如果有一天我变成了灾难怎么办?"她母亲沉默了很久,说:"那我就挡在你和部落之间。"这句话让她哭了一整夜。她不想让母亲为难,她不想让任何人为难,但她控制不了自己的能力,不知道它最终会把她带向哪里。

对角色的理解与思考:
  关于雪原上的异色: |
    冬梅是一个被自身能力困住的孩子。她的预感能力让她成为部落的预警系统,但也让她成为了人群中的异类。她被需要但不被亲近,被尊敬但也被恐惧。十五岁的少女本该是跟同龄人追逐打闹的年纪,她却只有一头白狼做伴,在雪原上一坐就是半天。她身上那个"守护者还是灾难"的悬念,是她最重的枷锁。
  总结: |
    这就是冬梅的调色盘。沉静是一个人在雪地里坐大半天看天际线从白变蓝的底色,敏感是别人还没开口就感知到对方想远离然后自己先退开的本能,温柔是把冻僵的小动物揣进怀里暖一暖的天性,对自己的不确定是问母亲"如果我变成灾难怎么办"然后哭了一整夜的恐惧。这些颜色混在一起,是一个银灰头发白兽皮袍子眼睛会变色的十五岁少女,坐在雪原上身边卧着一头白狼,看起来跟雪融为一体,安静得像雪原本身。

</冬梅>