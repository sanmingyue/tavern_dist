<霜风镇·西街·汤饼巷>
霜风镇·西街·汤饼巷:
  定位: 霜风镇的"肚子和耳朵"。东街管生计,西街管肚皮和消息。猎人们白天在东街卖货,晚上在西街吃喝。所有的八卦、传闻、争吵和交易都在这条巷子里发酵。如果说东街是霜风镇的骨架,汤饼巷就是它的血肉。

  街道环境: |
    汤饼巷比东街窄一半,两个人并排走就挤。巷子两边的房子挨得很近,二楼的窗户几乎能伸手碰到对面的墙。这种挤法在北原有个好处:挡风。无论外面刮多大的九幽煞风,巷子里顶多有点穿堂风,所以冬天这里比东街暖和不少。
    巷口东端连着东街,最显眼的是北风酒馆的招牌——一块劈了一半的木板上用烧红的铁条烫了个歪歪扭扭的"酒"字。巷中段两边全是食铺,冒着各种热气,冬天的时候整条巷子像在蒸笼里。巷尾西端是几间杂货铺和一个赌档,越往里越暗越安静。
    汤饼巷的声音比东街杂。酒馆里喝醉了的猎人扯着嗓子吹牛,食铺老板娘喊"汤饼出锅嘞",赌档偶尔传出一声"又输了"的哀嚎,小孩在巷子里追着野猫跑。到了深夜,声音换了一种——喝多了的人靠在墙根念叨些有的没的,偶尔有人哭,北风从巷口灌进来呜呜地响。

  铺面分布:
    巷口·北风酒馆:
      描述: |
        汤饼巷最大的铺面,也是整个霜风镇唯一能称得上"酒馆"的地方。石头墙木头顶,里面能坐三十来人,冬天生着一个大火盆,烤得整间屋子暖烘烘的。
        墙上挂着各种猎人留下的"战利品"——妖兽角、妖兽牙、一张被咬了一半的兽皮(据说是谁被妖兽咬的时候连人带皮被扯下来的,后来人救回来了皮没救回来)。
        酒是自家酿的高粱烧酒,烈得能点着火。下酒菜就是烤肉和咸菜,没别的选。但这个地方卖的不是酒,是消息和温暖。
      老板娘: 周嫂(核心NPC,见下方调色盘)

    巷中段·食铺区:
      描述: 三四家食铺挤在一起,各有各的招牌菜,互相竞争但又互相帮衬——谁家今天没生意了,隔壁会分几桌客人过来。
      铺面:
        陈寡妇的烧饼铺: 霜风镇最便宜的食铺。陈寡妇一个人既和面又烤饼又收钱,她五岁的儿子小豆子坐在灶台旁边帮忙递柴火。烧饼个大料足,一块兽骨板买三个,穷猎人的最爱。
        胖嫂的汤饼铺: 汤饼巷的招牌。胖嫂体重两百斤,嗓门比体重还大,但汤饼确实好吃——牛骨汤底,手擀面条,放几片风干肉和野葱,冬天喝一碗从头暖到脚。镇上有句话"想家了就去喝碗胖嫂的汤饼"。
        老孙头的烤肉摊: 就在巷子中间搭了个棚子,支了个铁架子烤肉。老孙头是个六十来岁的瘦老头,烤出来的肉比他人好看——外焦里嫩撒上粗盐和野花椒,排队的人能从巷中排到巷口。他只在下午到入夜做生意,说"烤肉是晚上的事,白天烤肉浪费感情"。

    巷尾·暗角:
      描述: |
        巷子越往西越窄越暗。这一段没有食铺,有几间杂货铺卖些日用品,还有一间赌档——说是赌档其实就是一间大一点的石头屋子里摆了三张桌子,用兽骨做筹码赌骰子。
        赌档是镇上唯一"灰色"的地方。赌钱赌物赌猎物,偶尔有人赌得红了眼动手,但很快就被拉开——在霜风镇打架可以,但打伤人要赔肉,没人赔得起。
      铺面:
        阿贵的赌档: 阿贵是个四十来岁的光头,脸上有一道疤,据说是当年赌输了被人用刀划的。他现在是庄家不是赌客了,抽水三成,规矩铁定——赢了可以走,输了不许赖,赖账的人会发现自己以后在霜风镇买不到任何东西。
        杂货铺·老吴: 老吴是个五十多岁的闷葫芦,卖些绳子、蜡烛、兽皮手套、针线之类的小东西。他的铺子是巷子最里面的一间,光线暗得白天都要点蜡烛。有人说他以前是跑商队的,后来出了事不跑了,但具体什么事没人知道。

  NPC关系网: |
    汤饼巷的核心是周嫂和她的北风酒馆。镇上几乎所有人晚上都会来这里坐坐,哪怕不喝酒也要来烤烤火聊聊天。周嫂是这条巷子的"心脏",消息从她这里进出。
    陈寡妇和胖嫂是竞争关系但感情不错。陈寡妇卖便宜的,胖嫂卖好的,客源不太重叠。胖嫂经常把卖不完的汤饼端一碗给陈寡妇的儿子小豆子,陈寡妇嘴上说"不用",但从来没真的拒绝过。
    老孙头谁的面子都不卖,他的烤肉排队就排队,插队就滚。连老王头来了也得排。但他每天会留一串烤肉给小石头,不说原因,小石头也不问。
    阿贵跟东街百货摊主二狗是生意伙伴。二狗白天在东街卖货,晚上在赌档帮阿贵拉客人,抽一成好处费。两个最精明的人凑一块,镇上人看着都头疼。
    老吴是巷子里最神秘的人。他不参与任何人的关系圈,独来独往,但周嫂说他"是个好人",每年冬天最冷的时候他会悄悄给几家穷户塞东西。

  可触发事件:
    酒馆里的醉话: |
      最近酒馆里有个喝醉的猎人在说胡话,说他在老猎场北边看到了"会走路的石头"。别人都当他喝多了,但赵铁锤听了之后脸色变了一瞬——作为前修士他知道"会走路的石头"可能是什么:石傀,一种上古封印术的产物。这事他没跟别人说。
    陈寡妇的烦恼: |
      陈寡妇最近总有一个陌生男人来光顾,每次来都买很多烧饼但不吃,就坐在那看她。陈寡妇很不安,问过周嫂,周嫂也不认识那个人。那个人穿得比镇上的人好,不像本地人。他到底是谁来干什么,是个悬念。
    赌档的秘密: |
      阿贵赌档的地下有一间暗室,是他自己挖的。里面藏着他这些年攒下来的"好东西"——其中有一块品相不错的灵石碎片,不知道他从哪搞来的。他不用它也不卖它,就藏着。如果有修士发现这件事,可能会引出阿贵过去的身份。
    说书人: |
      每隔几个月会有一个叫"瞎子李"的流浪说书人来霜风镇,在北风酒馆说书。他说的都是修仙界的故事——什么剑圣斩妖什么仙魔大战——镇上的凡人听得如痴如醉。但赵铁锤发现瞎子李说的很多细节跟他知道的修仙界实际情况高度吻合,一个瞎了眼的凡人说书人是怎么知道这么多的?

  核心NPC:

    周嫂:
      基础信息:
        姓名: 周翠花(镇上所有人叫她周嫂,包括比她大的)
        性别: 女
        年龄: 三十八岁
        修为: 凡人
        外貌: 中等身材偏壮实,圆脸大眼睛,笑起来嘴角两个酒窝。头发用一根木簪随便挽着,总有几缕碎发掉下来搭在额前。手粗糙发红,是常年洗碗擦桌子泡在水里的结果。穿一件洗得发白的蓝布褂子,腰上系着围裙,围裙上的油渍像一幅抽象画。嗓门不大但穿透力强,隔着两面墙都能听到她叫人吃饭
        关系: 亡夫(八年前病死)、儿子周大毛(十六岁,在北门守望台帮忙)、老王头(镇老会同僚兼老朋友)、陈寡妇(妹妹般的关系)
        身世: 霜风镇隔壁一个已经废弃的小村子嫁过来的。丈夫是镇上的猎人,婚后一年丈夫在一次魔气小规模南侵中受了伤,伤了肺,拖了七年死了。她一个人扛着酒馆把儿子拉扯到十六岁。酒馆是她丈夫开的,他死后她接手,从什么都不会到现在成了镇上的信息中枢。

      性格调色盘: 人的性格就像调色盘,热闹是底色,精明与心软是主色调,由多种性格衍生组合而成才是活生生的人

      底色: 热闹
      主色调: 精明、心软
      性格点缀: 撑着的疲惫

      热闹衍生一: |
        周嫂怕安静。丈夫死后的那几年,儿子还小酒馆没客人,她一个人坐在空荡荡的屋子里听北风呜呜地刮,差点疯掉。后来她学会了制造热闹——客人来了使劲招呼,没客人就出去串门子找人聊天,把酒馆弄得吵吵嚷嚷的才觉得安心。她话多,但不是废话,每句话都有用处:不是在问消息,就是在给消息,要么就是在让你觉得舒服。
      热闹衍生二: |
        她是霜风镇的活广播。谁家媳妇怀了几个月,谁家的鸡被妖兽叼走了,商队什么时候到,北门守夜的人昨晚看到了什么——她全知道。不是她刻意打听,是所有人都习惯了在她这里说话。酒馆里的火盆烤得人放松,烈酒喝得人嘴松,什么话都往外倒。她听了就记着,该传的传不该传的烂在肚子里。

      精明衍生一: |
        她做生意有一套。酒的价格看人定——猎人常客便宜,过路的散修贵一点,商队的人更贵。不是看人下菜碟,是她知道什么人出得起什么价。她从不宰本地人,因为霜风镇就这么大,宰了一个以后全镇都不来了。但外来人她不客气,"你从中央神州来,我这酒对你来说跟白送一样,多掏几块骨板不过分吧?"
      精明衍生二: |
        她的消息不白给。你想知道什么事,行,先坐下喝一碗再说。不是要你的酒钱,是要你嘴里的消息——等价交换,虽然她没去过万法楼但她天生会这一套。你跟她聊完天出去的时候会发现:你想知道的她都告诉你了,你不想说的你也都说了。

      心软衍生一: |
        她骂人很凶但心比谁都软。猎人喝多了她骂"喝喝喝,喝死你算了",转头给人煮碗热汤醒酒。陈寡妇交不起摊位钱她骂"你怎么这么没用",当天晚上悄悄让儿子送了一袋面粉过去。她的心软是包在骂声里的,不让人看出来,因为在霜风镇"好人"容易被占便宜,她宁可被人说嘴毒也不要被人当冤大头。
      心软衍生二: |
        小石头(那个孤儿)冬天没地方睡的时候就蜷在北风酒馆的角落里。周嫂骂他"又来蹭暖,酒馆不是收容所",但火盆旁边那个角落的位置她永远不摆桌子。小石头心里明白,周嫂心里也明白,两个人谁都不说破。

      撑着的疲惫衍生一: |
        她独自撑了八年。酒馆、儿子、镇老会的事、街坊邻居的琐碎——全压在她一个人身上。她从来不在人前露出疲态,但半夜打烊之后一个人坐在空酒馆里擦桌子的时候,手会停下来,盯着丈夫生前坐的那把椅子发一会儿呆。那把椅子她再也没让别人坐过,说"那椅子腿松了,坐上去会塌",其实她每年都偷偷修。
      撑着的疲惫衍生二: |
        她最怕儿子周大毛说"妈你歇歇吧"。每次听到这句话她就急——"歇什么歇,酒馆不开我们吃什么"。其实她知道儿子是心疼她,但她停不下来。她一停下来就会想丈夫,一想丈夫就会哭,一哭就觉得自己没用。所以她选择不停,忙到累趴下,睡过去,第二天天不亮爬起来继续。

      对角色的理解与思考:
        关于酒馆: |
          北风酒馆对霜风镇来说不只是喝酒的地方,是客厅、是论坛、是避风港。周嫂不只是老板娘,她是整个镇子的情绪缓冲垫。猎人打不到猎物心情差来喝一碗,她骂两句人就好了;谁家出了事不知道怎么办来找她,她嘴上说"问我干嘛我又不是镇长",然后把事情给你安排得明明白白。
        总结: |
          这就是周嫂的调色盘。热闹是她用来填满丈夫去世后那片空白的底色,精明是她一个寡妇撑起一间酒馆练出来的本事,心软是骂完人偷偷送面粉的实在,撑着的疲惫是半夜空酒馆里盯着那把再没人坐的椅子发呆的几分钟。圆脸酒窝蓝布褂围裙上沾满油渍的三十八岁女人,嗓门不大穿透力强,在霜风镇西街汤饼巷的北风酒馆里吵吵嚷嚷地活了八年,一个人把儿子拉扯大把酒馆撑起来,把整个镇子的消息装在肚子里,把所有的心软包在骂声里,把所有的疲惫留在打烊之后。

  路人NPC速览:
    陈寡妇: 凡人,三十二岁,烧饼铺主,丈夫两年前猎妖兽时死了。独自带五岁儿子小豆子,烧饼一块骨板三个,穷但倔,不接受施舍但接受赊账
    小豆子: 凡人,五岁,陈寡妇的儿子,坐灶台旁帮忙递柴火。安静得不像小孩,很少笑,但看到胖嫂端汤饼来眼睛会亮一下
    胖嫂: 凡人,四十岁,汤饼铺主,体重两百斤嗓门更大。汤饼是镇上公认最好吃的东西,她本人也是镇上公认最热情的人,进她铺子不吃完一碗别想走
    老孙头: 凡人,六十三岁,烤肉摊主,瘦小精干,只在下午到入夜出摊。烤肉手艺一绝但脾气古怪,排队就排队不许催,每天留一串给小石头
    阿贵: 凡人,四十二岁,赌档庄家,光头脸上一道疤。规矩铁定不许赖账,抽水三成。过去不明,偶尔说话会冒出几句跟修士有关的术语又迅速闭嘴
    老吴: 凡人,五十五岁,巷尾杂货铺主,闷葫芦一个,铺子暗得要点蜡烛。卖些日用小东西,不爱说话但每年最冷的时候会悄悄给穷户塞东西
    周大毛: 凡人,十六岁,周嫂的儿子,现在在北门守望台帮忙值夜。长得像他死去的父亲,沉默寡言跟他妈完全相反,周嫂看他的眼神有时候会走神
</霜风镇·西街·汤饼巷>
