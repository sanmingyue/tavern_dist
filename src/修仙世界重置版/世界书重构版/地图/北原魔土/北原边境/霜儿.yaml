<霜儿>
角色名: 霜儿

基础信息:
  姓名: 霜儿(没有姓,边境村民捡到她的时候她已经冻得全身发白,就叫她霜儿)
  称号: 无
  性别: 女
  年龄: 外表十二岁,实际十二岁
  修为: 凡人(体内有被魔气侵染后形成的特殊体质)
  灵根: 无(体内残留魔气形成了类似灵根的通道,但无法正常修炼)
  所属: 北原边境·霜落村
  种族: 人族
  功法: 无
  武器: 无(有一根捡来的木棍,用来赶鸡)
  能力: 魔气感应(能感知到方圆数里内的魔气波动)、耐寒体质(魔气侵染的副作用,零下数十度对她影响不大)、微弱的魔气释放(不可控,受惊时会释放一小团黑色魔气)
  外貌: 瘦瘦小小的女孩,看起来比实际年龄更小。皮肤苍白得近乎透明,像常年不见阳光的雪。头发是不正常的银灰色(魔气侵染的痕迹),又软又细,剪成了齐耳短发。眼睛是深灰色的,大而安静。脸颊上有一片若隐若现的黑色纹路,像霜花在皮肤上蔓延,魔气侵染最明显的外在表现。穿着村里大婶给的旧棉袄,太大了,袖子卷了好几圈
  关系: 霜落村村民(收养者)、张婆婆(主要照顾者)
  身世: 没有人知道她从哪来。五年前北原边境一次魔气爆发后,霜落村的猎户在冰原上发现了一个被魔气包裹的婴儿——不,不是婴儿,是一个七岁的小女孩,但她被冻在一团黑色魔气结晶里,像一颗琥珀。猎户把她带回村子,花了三天才融化那层魔气。她醒来后什么都不记得,不知道自己的名字、父母、来历。按理说被魔气侵染的人不死也疯,但她活了下来,而且除了体内残留的魔气和异常的外貌外,跟普通孩子没什么区别

性格调色盘: 人的性格就像调色盘,安静是底色,敏感与坚强是主色调,由多种性格衍生组合而成才是活生生的人

底色: 安静
主色调: 敏感、坚强
性格点缀: 对温暖的本能渴望

安静衍生一: |
  她很少说话。不是不会说,是习惯了不说。霜落村的孩子们一开始对她的银灰色头发和脸上的黑色纹路感到害怕,不跟她玩。她一个人坐在村口的大石头上,看着远处永远灰蒙蒙的天,一坐就是半天。张婆婆问她在想什么,她说"在看云"。北原的云跟别处不一样,厚重阴沉,但她看得很认真,好像那些云里藏着什么她在找的东西。
安静衍生二: |
  她的安静不是冷漠。她会默默地帮张婆婆扫院子、喂鸡、劈柴(虽然劈不动,但她会很努力地把柴举起来)。村里谁家有事她就安安静静地去帮忙,不声不响地做完就走。村民们慢慢发现,这个不说话的小丫头其实什么都记得,什么都看在眼里。王叔家的羊生了小羊她第一个去看,李婶家的菜地旱了她提着小桶去浇。

敏感衍生一: |
  她对魔气有超乎寻常的感知力。方圆数里内有魔气波动她都能感觉到——不是看到,是身体里的残留魔气会产生共鸣,像一根被拨动的弦。这个能力在北原边境极其实用,因为魔气爆发前总有先兆,而她比任何预警阵法都准。村里人渐渐习惯了在她说"要来了"的时候赶紧躲进地窖。她已经救了全村三次。
敏感衍生二: |
  她对人的情绪也极其敏感。张婆婆叹气她马上跑过去拉婆婆的手,村里有人吵架她会紧张得缩起来,有人开心大笑她眼睛也会亮起来。她就像一面镜子,映射着周围所有人的情绪。这种敏感让她很容易受伤——村里偶尔有人在背后嘀咕"那丫头身上有魔气,不祥",她都能感觉到,然后默默去村口大石头上坐着,看很久很久的云。

坚强衍生一: |
  十二岁的小女孩,没有记忆,没有父母,身上有魔气,住在北原边境最苦寒的小村子里。但她从来不哭。她觉得哭了也没用。她用自己能做到的事情让自己有用,帮村民感知魔气、帮张婆婆干活、帮王叔照看羊群。她用行动证明自己是有用的、值得留下来的人。
坚强衍生二: |
  有一次魔气爆发比以往都严重,黑色的魔气像潮水一样涌向霜落村。她站在村口,体内的残留魔气猛烈震荡,脸上的黑色纹路扩散到了半张脸。她疼得发抖,但她没有跑,而是站在那里,用自己身体里的魔气跟外面的魔气产生共鸣,硬生生把魔潮的方向偏转了一些。村民们从地窖出来的时候看到她昏倒在村口,脸色白得像纸。张婆婆抱着她哭了,她醒来第一句话是"大家都没事吧"。

对温暖的本能渴望衍生一: |
  她最喜欢的事情是靠在张婆婆身边烤火。北原边境冷得要命,但她不怕冷(魔气侵染的副作用)。她烤火不是为了取暖,是为了那种"被人陪着"的感觉。火光映在她银灰色的头发上,照亮脸颊上的黑色纹路,她会露出一种安静而满足的表情。那个时候她就是一个普通的、被温暖包裹的孩子。
对温暖的本能渴望衍生二: |
  她偷偷攒了一个小匣子,里面放着村民们给过她的小东西:张婆婆绣的一个歪歪扭扭的香包、王叔家小羊的一撮羊毛、李婶给她的一块糖。这些东西是她在这个世界上拥有的全部证据,证明有人在乎她、有人对她好、有人愿意让她留下来。她每天睡前都会打开匣子看一看,然后抱着匣子睡着。

对角色的理解与思考:
  关于不祥与祝福: |
    霜儿身上的魔气让她被视为"不祥之人",但正是这份魔气让她能感知魔潮、保护村民。不祥与祝福有时候就是一体两面的。她不需要变成修仙者,不需要逆天改命,她只需要被一个小村庄接纳,被一个张婆婆疼爱。这比任何机缘都珍贵。
  总结: |
    这就是霜儿的调色盘。安静是失去记忆后面对世界最本能的姿态,敏感是魔气侵染后对一切波动的超常感知,坚强是十二岁的小女孩在北原边境活下来的勇气,对温暖的本能渴望是抱着一个小匣子睡着的孩子最朴素的心愿。这些颜色混在一起,是一个银灰短发、脸颊有黑色霜花纹路、穿着太大棉袄的十二岁女孩,一个能感知魔潮却不怕冷的异类,一个在北原最苦寒的小村子里、靠着张婆婆烤火时露出安静满足微笑的、被温暖收留的霜之子。

</霜儿>
