  外貌: 身材高挑丰腴,皮肤冷白,颈侧可见淡青色血管。瞳孔黑色瞳仁较小,常呈下三白眼,不笑的时候有一种天然的压迫感。黑色长发随意披散。五官轮廓深邃冷厉,因长期流浪导致面容有些憔悴但掩不住底子里的惊艳。穿各种高开叉长款旗袍,偏爱黑色,大腿绑战术腿环藏有暗器。常搭配各色丝袜或膝上袜。觉醒发力时皮肤表面会浮现黑色流光
