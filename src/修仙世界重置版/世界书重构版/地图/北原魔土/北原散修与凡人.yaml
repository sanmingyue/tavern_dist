<散修与凡人>
北原魔土散修与凡人:
  说明: 北原魔土中不属于任何宗门势力的散修和凡人

  散修概况:
    - 北原魔土散修多为魔修，在各势力夹缝中求生
    - 强者可受人尊敬甚至被大势力招揽
    - 弱者在荒野中艰难挣扎，朝不保夕
    - 部分散修依附于各大势力，以记名弟子身份换取庇护

  凡人概况:
    - 北原魔土凡人多聚居在各大势力的附属城镇中
    - 生存条件恶劣，受魔气和煞气影响
    - 资质好的凡人子弟有机会被宗门选拔
    - 无修为庇护的凡人在北原荒野几乎无法生存

  北原相关散修角色:
    阿芙佳朵: 无法修炼，肉身锻体至筑基期等同，北原孤女，混沌虚无体未觉醒，幼年被灭门后流浪至今
</散修与凡人>
