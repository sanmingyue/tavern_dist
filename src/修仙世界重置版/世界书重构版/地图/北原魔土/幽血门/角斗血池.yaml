<角斗血池>
角斗血池:
  定位: 幽渊战堡深坑边缘,幽血门最重要的竞技场。角斗血池是一个天然的深坑延伸区域,池底浸泡着无数尸骸和凝聚的血煞之气。这里是晋升挑战、仇敌决斗、荣誉之战的专用场地——在角斗血池里打的每一场架,都有可能改变一个人在幽血门的命运。

  环境描述: |
    角斗血池位于幽渊深坑的边缘,利用深坑自然形成的一处凹地改造而成。凹地呈椭圆形,长约四十丈宽约三十丈,深约五丈。池壁是天然的红色岩石,被多年的血气和煞气侵蚀得表面光滑如镜。
    池底不是普通的地面——那是一层约半尺深的暗红色液体,看起来像血但不完全是血。它是血泉、战斗者的鲜血和长年积累的煞气混合物,温度略低于体温,踩进去会感到一种微弱的灵力侵蚀。低阶修士光站在里面就会消耗灵力,这是角斗血池的"天然规则":拖得越久越不利。
    池壁上方是环形看台,能容纳约两千人。看台是粗糙的石阶,没有座位没有遮挡,观众站着或坐在石头上看。最好的位置在正北方的高台上——那是堂主和宗主的观战位,用一块巨大的平整红岩充当。
    池底散落着各种残破的武器碎片和偶尔露出半截的骨头——那是历年来在池中战死者留下的。幽血门不清理这些东西,它们是角斗血池历史的一部分,"踩着前人的骨头战斗,才能记住输的代价"。

  角斗规则: |
    角斗血池的战斗分几种:
    晋升挑战: 外门弟子挑战内门弟子可获得内门资格;内门弟子挑战血堂堂主可争夺堂主之位。挑战者需提前三天登记,被挑战者不得拒绝,拒绝等于认输让位。
    仇敌决斗: 同门之间有解不开的仇,可以申请角斗血池决斗。一旦进入血池,生死自负,宗门不追究。但只能一对一,不许帮手。
    月赛: 每月十五举办的公开角斗赛,自愿报名,分修为档次进行。赢了有修炼资源作为奖赏,输了受伤自负。月赛是幽血门最热闹的日子,几乎所有在战堡的弟子都会来看。
    宗主召斗: 铁无泪偶尔会召集特殊角斗,比如让两个他看好的弟子当众对决,或者让某个犯了错的弟子在血池里跟一头魔兽打来"赎罪"。宗主召斗没有规律,但每次都是大场面。
    通用规则: 不许使用毒物,不许攻击观众,不许提前偷袭——进池之后才能动手。除此之外什么都可以——法器、武器、血煞魔体爆发,全凭本事。

  NPC关系网: |
    角斗血池的管理者是"血裁",化神中期,五位血堂堂主中主管执法的那一个。他负责角斗血池的秩序——确认挑战资格、宣布规则、裁判胜负、处理意外。他是幽血门少有的"讲规矩"的人,这不是因为他温和(他一点也不温和),而是因为"规矩能让人打得更痛快,乱来只会浪费时间"。
    血裁有一个助手叫"计数",金丹大圆满,专门负责记录每一场角斗的结果——谁赢了、谁输了、用了几招、受了什么伤。他的记录详细到近乎偏执,幽血门上千年的角斗记录全在他和前任"计数"留下的石板上。
    角斗血池还有一个不属于任何血堂的特殊存在——"池底老人"孙铁骨。他是幽血门上一代的内门弟子,两千多年前跟年轻时的血裁在角斗血池打了一场决斗,被打成重伤后沉入池底。他靠吸收池底的煞气维持生命,两千年下来修为从当初的金丹初期长到了元婴后期,但身体已经半透明——长期浸泡在煞气液体中让他的肉身被侵蚀殆尽,现在靠煞气凝聚出一个模糊的人形。他偶尔浮上来看看角斗,用沙哑的声音说几句评语——通常是技术性的点评,比如"出拳慢了半息""那一刀要是再偏三寸就赢了"——说完就沉下去。他跟血裁是旧识,两人见面不打招呼但都知道对方在。

  可触发事件:
    堂主挑战: |
      一个元婴初期的内门弟子向血甲堂主拓跋烈发起了晋升挑战。整个幽血门都炸了——挑战堂主的事几十年才发生一次。拓跋烈听到消息后大笑了三声,说"好,三天后血池见"。三天里所有弟子都在讨论这件事,赌局从血炼广场一直开到外门营地。角斗当天看台挤满了人,连其他几位堂主都来观战了。
    宗主召斗: |
      铁无泪突然出现在角斗血池上方的高台上,指着池底说"今天找个人陪我活动活动"。整个战堡鸦雀无声。他指了疤面。疤面脸上没有一丝恐惧(或者说伤疤太多看不出来),走进血池,抱拳,然后被铁无泪一拳打飞了三十丈,撞在池壁上。疤面从岩壁上爬起来,吐了口血,冲了上去。整场"活动"持续了不到十招,疤面全身骨折躺在池底。铁无泪走了,丢下一句"比上次多撑了两招"。
    池底异变: |
      月赛进行到一半,池底突然涌出了比平时浓烈十倍的煞气。正在角斗的两个弟子被煞气冲击当场昏倒,池底的暗红色液体开始翻涌沸腾。血裁立刻叫停比赛,命令所有人撤离。煞气持续涌了一个时辰才平息下来。事后有人说看到池底深处有什么东西在动,但谁也说不清是什么。池底老人那天没有浮上来。

  核心NPC:

    血裁:
      基础信息:
        姓名: 血裁(本名已弃用)
        性别: 男
        年龄: 三千多岁
        修为: 化神中期
        外貌: 精瘦高挑,跟幽血门其他壮汉形成鲜明对比。面容冷峻,颧骨高耸,眼窝深陷,双眼赤红但目光锐利而非狂暴。穿一件暗红色的长袍(幽血门少有穿长袍的人),袍子干干净净没有褶皱没有血迹。腰间挂一把未开刃的铁尺——那不是武器,是他裁决角斗时用来指人的道具。说话声音不大但清晰到血池里每个角落都能听到
        关系: 铁无泪(宗主)、其他四位堂主(同僚)、计数(助手,信任)、池底老人(复杂)

      调色盘: |
        底色是规则的信徒。在一个"拳头就是道理"的宗门里,血裁是唯一一个相信"规矩也是道理"的人。他管角斗血池三千年,从未偏袒任何一方,从未因为个人好恶影响裁决。他的铁尺指向谁,谁就是赢家或输家,没有第二次机会。他制定和维护角斗规则的态度近乎虔诚——"没有规矩的打架叫械斗,有规矩的打架才叫角斗,角斗是幽血门的核心,我守的是幽血门的根"。
        主色调是冷酷的清醒。血裁看过太多人在血池里死去了。他不为胜者欢呼也不为败者惋惜,他只关心规则有没有被遵守、比赛有没有公平进行。有人骂他冷血,他不否认,"我是裁判,不是观众,观众可以有感情,裁判不行"。但他的冷酷不是天生的,是三千年角斗裁判生涯磨出来的——最初他也会为精彩的战斗叫好,后来他发现叫好会影响判断,就把那部分的自己封印了。
        性格点缀是对池底老人的在意。池底老人孙铁骨是血裁年轻时的对手,两千多年前他们在角斗血池里打过一场差点双双毙命的决斗。后来孙铁骨沉入池底,血裁以为他死了。几十年后孙铁骨浮上来跟他打了个招呼,他愣了很久。从那以后他每次月赛结束都会在池边站一会儿,不知道在想什么。

  路人NPC速览:
    计数: 金丹大圆满,六百多岁,角斗记录员。瘦弱矮小(在幽血门格外显眼),戴着自制的放大镜(法器),刻字速度极快。话少但记忆力惊人,幽血门近千年的角斗结果他都能背出来
    池底老人·孙铁骨: 元婴后期(从金丹初期在池底修炼两千年所得),两千多岁,幽血门上一代内门弟子。外表是一个半透明的老人形态,五官模糊但能看出曾经是个方脸大汉。长期浸泡在煞气液体中肉身几乎溶解,靠煞气凝聚维持人形。偶尔浮上来点评角斗技术,声音沙哑像从水底传来,说完就沉回去。跟血裁是两千年前的老对手
    铁牛: 金丹中期,二十多岁,月赛常客。块头极大脑子简单,打架只会直线冲过去硬碰硬。赢的时候赢得很爽,输的时候输得很惨,但每次月赛都报名,拓跋烈说他"勇气可嘉但脑子欠费"
    影子: 筑基大圆满,年龄不详,外门弟子中的异类。身手极快极灵活,擅长闪避和偷袭,跟幽血门正面硬刚的风格完全相反。他在月赛中靠拖时间耗死对手赢了几场,被其他弟子鄙视但血裁认可——"规则没说不能这样打"
</角斗血池>
