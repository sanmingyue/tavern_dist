<血狱深原外围>
血狱深原·外围:
  定位: 幽渊战堡外围方圆百里的血泉荒野,外门弟子的野外修炼区和猎杀区。这片荒原是幽血门弟子从"能打"变成"能杀"的地方——在血炼广场打的是同门,到了血狱深原打的是真正想要你命的魔兽和敌人。

  环境描述: |
    血狱深原外围的地貌是一片暗红色的荒原,地面由被血泉和煞气侵蚀的红色岩石和碎石组成,坑洼不平。血泉从地面裂缝中不规则地涌出,有的是小股细流,有的是拳头大的泉眼,有的是突然喷涌一丈高然后消退的间歇泉。踩在地上要随时留意脚下——踩到血泉涌出点会被煞气灼伤。
    荒原上散布着一些暗红色的岩石柱,高低不等,像是从地底长出来的巨大骨头。这些岩柱是天然的地标,弟子们用它们来辨别方向。岩柱之间偶尔能看到倒塌的石墙或破碎的石像——据说血狱深原在上古时代是一个古老种族的领地,这些是他们留下的遗迹。
    荒原的天空永远是灰红色的,煞气弥漫所致,看不到太阳但不完全黑暗。风是热的,带着血腥味和金属味,吹在脸上像砂纸一样粗糙。能见度约百丈,再远就被煞气雾气遮挡了。
    越靠近战堡越安全,离战堡越远危险越高。外门弟子通常活动在战堡方圆三十里内,三十里到六十里是内门弟子的猎场,六十里以外只有金丹以上的修士才敢去。

  魔兽与危险: |
    血狱深原外围的魔兽都是被煞气长期浸染的变异生物。常见的有:
    血蛛: 拳头大的暗红色蜘蛛,成群出没,单个不强,炼气期弟子就能对付,但群攻很麻烦。它们的丝有侵蚀性,粘在皮肤上会缓慢吞噬灵力。
    煞牙犬: 体型如牛的变异犬类,独行,筑基期水平。攻击力强但智力低,正面硬刚不难但容易被偷袭——它们喜欢藏在岩柱后面。
    血蟒: 数丈长的暗红色蟒蛇,生活在血泉附近,金丹期水平。不主动攻击但领地意识极强,踏入它的领地就会被缠住。
    深原蝎: 罕见,元婴期水平。全身血红色,毒刺含有煞毒,被刺一下连血煞魔体都扛不住。是血狱深原外围最危险的生物,遇到了最好绕路。

  外门营地: |
    外门弟子五万余人分散在战堡外围十几个营地中。每个营地约两三千人,有简易的石墙围栏、石棚住所和训练场地。营地由各营"营头"——金丹期的资深外门弟子——管理,日常就是训练和猎杀魔兽。
    外门弟子的修炼方式比内门简单粗暴:白天出去猎魔兽,晚上回来修炼消化战斗经验。猎到的魔兽材料可以上交换取修炼资源,也可以自己留着。偶尔有弟子在猎杀中失踪,被魔兽吃了或者被别的营地的弟子暗杀抢东西,营头一般不管——"死在外面是你自己没本事"。

  NPC关系网: |
    外围最有名的人是"独眼",一个金丹后期的外门弟子,已经在血狱深原外围活了一百多年。他只有一只眼睛——另一只被深原蝎的毒刺废了——但他在外围活得比谁都久。他对外围的每一处地形、每一种魔兽的习性都了如指掌,被外门弟子称为"外围王"。他不当营头,嫌麻烦,但所有营头都敬他三分。
    另一个关键人物是"铁娘",筑基大圆满的女外门弟子,三号营地的营头。她是外围少有的女性管理者,靠实力打服了整个营地。她的管理风格比其他营头细致一些——她会组织弟子编队猎杀而不是单打独斗,这让她管的营地存活率是最高的。其他营头嘲笑她"护犊子",她说"活着的弟子才能变强,死了就什么都不是了"。

  可触发事件:
    魔兽潮: |
      血狱深原深处突然涌出大量魔兽,像潮水一样向外围推进。外门营地首当其冲,几个靠外的营地被魔兽冲散。铁娘组织三号营地弟子结阵防守,独眼独自站在营地外面挡了一阵,被三头煞牙犬咬得浑身是伤但一只都没放进去。魔兽潮持续了一天一夜才退去,外围损失了近千人。事后拓跋烈带内门弟子出来善后,骂了一句"一群废物"就走了。
    遗迹发现: |
      有弟子在猎杀魔兽时无意间发现了一处被血泉冲刷出来的古老地下入口。入口被暗红色的岩石半掩着,里面黑漆漆的,传出一股比外面更浓烈的煞气。独眼听说后赶来查看,他的表情罕见地凝重——他在外围一百多年,从来没见过这个入口。消息传到战堡后,血裁亲自来了一趟,然后封锁了入口附近的区域。
    营地冲突: |
      二号营地和五号营地因为一处优质的魔兽猎场归属权爆发了冲突。两边各出了几十人在猎场上打了一架,死了三个伤了十几个。事情闹到了拓跋烈那里,他的裁决简单直接:"两个营头血炼广场打一场,赢的人得猎场。"

  核心NPC:

    独眼:
      基础信息:
        姓名: 独眼(真名已无人记得)
        性别: 男
        年龄: 两百多岁
        修为: 金丹后期
        外貌: 中等身材但极其精悍,肌肉不是那种块头很大的类型,而是线条紧实充满爆发力。左眼戴着一块粗糙的黑色皮革眼罩(深原蝎毒导致眼球溃烂后自己挖掉的),右眼赤红锐利,扫视周围时像猎鹰一样。皮肤暗红粗糙,满是旧伤但比起其他幽血门弟子伤疤反而少——不是因为没打过架,是因为他很少受伤(太了解外围了,知道怎么避免不必要的伤)。穿一身磨得发白的暗红色兽皮短衣,腰间挂着三把不同的短刀(对付不同魔兽用不同的刀)
        关系: 各营头(敬重)、铁娘(互相认可)、拓跋烈(认识但不亲近)、外围的魔兽(了如指掌)

      调色盘: |
        底色是老猎人的从容。独眼在血狱深原外围活了一百多年,对这片荒原的了解比任何人都深。哪块岩柱后面有煞牙犬的巢穴,哪条血泉每隔几天会突然喷发,哪片区域深原蝎出没最频繁——他全知道。这种了解让他在外围行走时从容得像在自家院子散步。新来的弟子看他在荒原上闲庭信步,不知道他每一步踏的位置都是精心选择的,每一次停顿都是在用仅剩的一只眼睛扫描四周。
        主色调是实用至上的生存哲学。独眼不在乎荣耀不在乎排名不在乎晋升,他在乎的只有一件事:活着。他的战斗风格跟幽血门主流的正面硬刚完全不同——他打架讲究效率,一刀解决绝不用两刀,能偷袭绝不正面刚,打不过就跑(这在幽血门是奇耻大辱,但他不在乎)。他认为"活着的弱者比死了的强者有用",这话在幽血门里属于异端邪说,但没人敢当面反驳他,因为他确实活得比谁都久。
        性格点缀是对新弟子的护短。独眼嘴上说"死在外面是你自己没本事",但他偶尔会在新弟子第一次出营猎杀时远远跟着,在弟子快扛不住时"恰好路过"帮一把。他不承认这是护短,说只是"顺路"。铁娘看穿了他,笑着说"你这个独眼比我还护犊子",他瞪了她一眼没说话。

  路人NPC速览:
    铁娘: 筑基大圆满,四十多岁,三号营地营头。外门少有的女性管理者,身材壮实嗓门大,管营地跟管自家孩子一样。组织编队猎杀让她的营地存活率最高,被嘲笑也不在乎
    断骨: 金丹初期,三十多岁,二号营地营头。打架凶猛管理粗暴,他的营地弟子怕他跟怕魔兽一样。跟五号营地的冲突就是他挑起来的
    老泥鳅: 筑基后期,一百多岁,外围最会逃命的弟子。遇到打不过的魔兽或对手他跑得比谁都快,被嘲笑了一辈子但活了一辈子。独眼对他评价很高,"会跑的人才能活着学到东西"
    小红: 炼气大圆满,十五岁,刚被分配到外围的新外门弟子。第一天就在营地外面碰到了一只煞牙犬,被吓得哭着跑回来。铁娘骂了她一顿然后教她怎么判断煞牙犬的攻击方向
</血狱深原外围>
