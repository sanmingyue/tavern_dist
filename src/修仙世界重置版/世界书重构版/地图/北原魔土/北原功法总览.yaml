<北原功法总览>
北原功法总览:
  说明: 北原魔土各势力功法体系。北原以魔道修炼为主，吸收炼化魔气、阴煞、血气、怨力，功法风格粗犷凶猛，重实战轻理论。宗门专属功法严格限制传承，流通功法多源自覆灭势力残卷或简化外传版本。

  宗门专属功法:

    天魔帝都:
      天魔九转血帝诀:
        品级: 天级上品
        传承: 历代魔帝传承，仅魔帝一人可修
        特点: 以万族之血淬炼魔体，每转一次实力暴涨一截，九转大成可成魔帝之体，血气滔天撼天动地。修炼需大量高阶血食，且每一转都是生死关
      魔煞炼体功:
        品级: 玄级上品
        传承: 帝都魔修标准功法，万魔殿弟子皆修此功
        特点: 吸收北原魔气淬炼肉身，入门容易精通极难。修至大成可在魔气中来去自如不受侵蚀，是北原最通用的魔修功法体系

    幽血门:
      冥狱霸拳:
        品级: 地级上品
        传承: 铁无泪所创，仅传宗主和亲传弟子
        特点: 纯粹的拳道功法，以杀伐淬炼拳意，越战越强。无招无式，一拳之力可碎山岳。修炼者需以命相搏，每一次突破都是从死人堆里爬出来
      血煞锻体诀:
        品级: 玄级中品
        传承: 幽血门内门弟子标准功法
        特点: 以血狱深原的血泉煞气淬炼肉身，修成血煞魔体。血煞魔体自带断肢重生之能，越靠近深坑修炼效果越强但危险也越大

    万禁教:
      万禁封神诀:
        品级: 地级上品
        传承: 沈折渊完善的禁制核心功法，仅核心弟子修炼
        特点: 以自身灵力为锁，天地元气为链，封印万物。修至大成可封印同阶修士修为，禁锢空间，困杀敌手于无形
      禁锢符印功:
        品级: 玄级下品
        传承: 万禁教外门弟子基础功法
        特点: 学习基础封印与禁制符文的入门功法，可刻录简单封印符、布置低阶禁制。外门弟子借此打基础，通过考核方可修炼万禁封神诀

    冰魔族:
      九幽冰魄功:
        品级: 玄级上品
        传承: 冰魔一族世代传承，冰魔族人皆修此功
        特点: 吸收永夜冰原的极寒之气淬炼冰魄，修至大成周身寒气可冻结万物。与炎魔功法水火不容，冰魔修士体内寒气越重修为越高，但情绪也越发冷漠

    炎魔族:
      焚天熔岩诀:
        品级: 玄级中品
        传承: 炎魔一族传承，需在焚魔焦土地火环境中修炼
        特点: 借助地底岩浆之力淬炼魔体，火系体修功法。修炼者体温极高，血液近乎沸腾，近身战斗时周身热浪可灼伤敌手

    影魔族:
      暗渊匿影术:
        品级: 玄级上品
        传承: 影魔一族传承，族内秘授
        特点: 融入黑暗隐匿气息，修炼者可化为暗影穿行阴暗之地，擅隐匿暗杀情报刺探。修至大成白日亦可遁入自身之影

    嗜血部落:
      噬血狂化功:
        品级: 玄级下品
        传承: 散修联盟拼凑的血道功法，无统一传承
        特点: 以妖兽鲜血淬体，激发体内血煞狂化战力。粗糙但见效快，副作用是狂化后理智下降，用多了容易丧失心智沦为嗜血狂魔

    万法楼:
      万法通览诀:
        品级: 地级中品
        传承: 司空玄独修，不外传
        特点: 非战斗功法。以万法之瞳为核心，解析理解天下万法，可一眼看破功法阵法的运转原理与破绽。修炼者战力平平但见识无人能及

  流通功法:

    炼魔化气诀:
      品级: 黄级下品
      来源: 北原最基础的入门魔功，来源已不可考
      流通: 北原散修人人可得，几乎不值灵石。凡是在北原讨生活的散修都会修炼，用以吸收魔气转化为己用，否则连呼吸都会被魔气侵蚀

    阴煞吞噬功:
      品级: 黄级中品
      来源: 数千年前被天魔帝都覆灭的小魔门残卷流出
      流通: 万法楼有售，价格不高。可将阴煞之气转化为修炼资源，比炼魔化气诀高效但有走火入魔风险

    赤血炼魔功:
      品级: 黄级上品
      来源: 上古血魔族残篇，来路不明
      流通: 黑冰港黑市偶有出售，价格波动大。以自身精血为引吸收外界血气淬体，效果显著但伤根基

    玄冰护体功:
      品级: 黄级中品
      来源: 冰魔族九幽冰魄功的简化外传版，流出已久
      流通: 永夜城周边散修中广泛传播。只有护体之效没有攻击手段，修至大成可在永夜冰原的极寒中勉强存活

    煞气凝兵术:
      品级: 黄级上品
      来源: 古魔战场外围残卷，被散修带出
      流通: 万法楼偶见拍卖。可将魔气煞气凝聚为兵刃，解决散修无趁手兵器的困境。凝出的兵刃品质取决于修为和当地魔气浓度

  秘境残卷:

    太古魔帝真诀·上卷残篇:
      品级: 天级(残缺)
      所在: 古魔战场核心区
      状态: 被上古仙魔大战残留的战魂怨念守护，进入核心区的修士无一生还。传闻此诀为上古魔帝所创，上下两卷合一可通天魔之道
      备注: 下卷残篇在大魔国深渊古窟最深层

    虚空魔瞳术:
      品级: 地级上品
      所在: 魔神陨坑深层
      状态: 域外魔神陨落时遗留的异界功法残篇，刻在陨坑深层的黑色晶壁上。沾染域外魔气，修炼有走火入魔甚至被域外意志侵蚀之危。偶有胆大的散修抄录片段带出，但无人敢修炼完整版

    冥火噬魂功:
      品级: 地级中品
      所在: 归墟魔渊外围
      状态: 据传是远古时代某位魂道大能留下的功法，融合冥火与魂力，可焚烧敌人魂魄。归墟魔渊是洛幽的领地，无人敢擅入，此功法至今无人取得

    万骨锻魂诀:
      品级: 玄级上品
      所在: 古魔战场外围
      状态: 部分残页已被散修带出，在万法楼有售但不完整。以万族遗骨中的残魂之力淬炼己身神魂，修炼者神魂坚韧远超同阶，但需大量遗骨为材
</北原功法总览>
