    火灵矿: 30-80下品灵石/块
    冰魂晶: 100-300下品灵石/枚(极难获取)
    万年玄冰: 50-150下品灵石/块(冰魔族管控)
  奴隶(奴隶市场):
    凡人成年男: 5下品灵石
    凡人成年女: 3-8下品灵石，外貌影响大
