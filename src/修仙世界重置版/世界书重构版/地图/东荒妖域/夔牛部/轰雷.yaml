<轰雷>
角色名: 轰雷

基础信息:
  姓名: 轰雷
  称号: 夔牛部战酋、雷原第一猛将
  性别: 男
  年龄: 逾四千年
  修为: 化神中期
  种族: 夔牛
  所属: 夔牛部·雷原
  能力: 雷蹄冲锋(全力冲锋时雷光覆体势不可挡)、耐雷体魄(全身焦黑的雷击伤疤覆盖皮肤,以被雷劈的次数为荣)、雷角撞击(独角蓄雷后撞击力惊人)
  外貌: 人形态为年轻壮汉,浑身上下找不到一块完好的皮肤——全是焦黑的雷击伤疤,层层叠叠新旧交替。独角从额头正中刺出,角尖常年有电弧跳动。赤红双目,嘴角咧着永远在笑的弧度,露出一口白牙。不穿上衣,下身围一条雷击木皮制成的短裙,赤脚踏地每一步都有电光迸溅
  关系: 夔牛王(族长,他崇拜的存在)、雷奔(副族长)、雷母(疗伤恩人)
  身世: 夔牛部最凶猛的战士。他以被雷劈的次数为荣,据他自己说已经被天雷劈过"三千多次,记不太清了反正很多"。浑身焦黑伤疤不是战伤而是天雷留下的,他把每一道疤都当勋章。在雷鸣祭坛上他是承受天雷最多的战士,每次引雷淬体他都冲在最前面,被劈趴下了就爬起来继续站着等下一道

性格调色盘:
底色: 狂热
主色调: 勇猛、憨直

狂热: |
  轰雷对雷的狂热到了近乎疯癫的地步。下雷雨的时候别人躲他冲出去,张开双臂迎接天雷劈下来,被劈得外焦里嫩然后哈哈大笑说"这道雷够劲"。没有雷雨的日子他就去雷鸣祭坛主动引雷,雷母说他"不是在被劈就是在去被劈的路上"。他的理想是"被天雷劈到皮肤比雷王殿的殿柱还硬",目前看来差得还远,但他从不气馁。
勇猛与憨直: |
  打架时他是冲在最前面的那个,想战术?不存在的,就是冲。一头撞过去,角先行蹄跟上,撞不动就退回来再撞。这种打法简单粗暴但配上他变态的耐雷体魄,一般妖族还真拿他没办法。私下里他其实很好相处,笑嘻嘻的没什么心眼,谁请他喝酒他就跟谁好。雷母每次给他疗伤他都乖乖坐着不动,因为"雷母说了疗伤时候不能乱跑"。
</轰雷>
