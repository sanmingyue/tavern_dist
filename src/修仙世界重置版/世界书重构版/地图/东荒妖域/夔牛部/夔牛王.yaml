<夔牛王>
角色名: 夔牛王

基础信息:
  姓名: 夔牛王
  称号: 夔牛部至高统领、雷泽霸主
  性别: 男
  年龄: 逾十万年
  修为: 真仙境四重天
  种族: 夔牛
  所属: 夔牛部·雷王殿
  能力: 雷霆召唤(一声怒吼可引九天雷霆)、雷体(周身雷光缭绕刀枪不入)、地震踏(铁蹄跺地可引发方圆十里地震)、雷域(以雷力覆盖领域内一切敌人)
  外貌: 牛形态如山岳般庞大,通体漆黑如铁,四蹄踏处雷光迸溅,独角指天时刻有电弧缠绕。人形态为魁梧至极的壮年男子,身高近丈,肌肉虬结如铁铸,肤色古铜泛着金属光泽。独角依然矗立额头,赤红双目,下颌方阔如铁砧。赤膊上身不着铠甲,浑身满布被雷电击打的焦黑伤疤,每一道伤疤他都引以为豪
  关系: 雷奔(副族长)、轰雷(战酋)、雷母(祭雷使)、金翅大鹏王(妖皇,三次交锋虽败不服)
  身世: 夔牛部至高统领,东荒最好战最桀骜的妖族首领。他多次拒绝向万妖国朝贡,认为朝贡是弱者才做的事。与妖皇有过三次正面交锋——第一次被一翅扇飞,第二次扛住了三招,第三次打了五十回合才落败。他的目标很简单:第四次交锋,他要赢

性格调色盘:
底色: 暴烈
主色调: 桀骜、崇雷

暴烈: |
  夔牛王的暴烈是天生的。他出生的那天据说雷泽落了九千九百九十九道天雷,劈得整个雷泽白昼通明。他从小就在雷击中长大,被劈得次数比吃饭还多。他解决问题的方式永远只有一个:打。不服?打。有意见?打。朝贡?那是什么东西能打吗?他的暴脾气让所有邻族都头疼,但没人敢在他面前说什么。
桀骜与崇雷: |
  他不服妖皇但不是因为野心,而是因为他的信仰。在他看来,"力量"才是妖族的根本,而朝贡、礼仪、等级那些都是弱者发明出来的东西。天雷不讲道理不看身份,劈下来就是劈下来,扛住了你就变强扛不住你就死。这才是世间至理。他让族人以被雷劈的次数为荣,不是残酷,是他真心觉得只有雷才能让夔牛变强。雷母是族中少有的温和派,他虽然嫌她啰嗦但从不反对她用雷力给伤者疗伤——毕竟活着才能继续被劈。
</夔牛王>
