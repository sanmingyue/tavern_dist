<蛇母>
角色名: 螣蛇老祖

基础信息:
  姓名: 螣蛇老祖(外界称蛇母)
  称号: 螣蛇窟至高统领
  性别: 女
  年龄: 逾十二万年
  修为: 真仙境四重天
  种族: 螣蛇
  所属: 螣蛇窟·蛇母窟
  能力: 暗影隐匿(通体漆黑无鳞,可隐于任何阴影之中不被察觉)、暗影通道操控(遍布东荒各势力领地之下的隐秘地道全在她的掌控中)、情报网(东荒最庞大的情报网络)、暗杀(无声无息取人性命)
  外貌: 螣蛇形态体长百丈,通体漆黑无鳞光滑如缎,可隐于任何阴影不留痕迹。人形态为面容清冷的中年女子,肤色苍白近乎透明,黑发如墨垂至脚踝,瞳孔为竖瞳漆黑,穿一身纯黑长裙,走路无声无息。她站在阴影中时几乎与黑暗融为一体,只有那双漆黑的竖瞳偶尔闪过一道冷光
  关系: 夜影(左使,暗杀执行者)、细鳞(右使,情报总管)、铁蟒(窟卫长)
  身世: 螣蛇窟至高统领,东荒暗面势力的主宰。她的暗影通道遍布东荒妖域所有势力的领地之下——包括万妖圣城和青丘国。没有人知道她的通道究竟有多长多深,但所有妖族都确信一件事:螣蛇老祖想知道的事,没有她不知道的。这份情报能力让她成为东荒最被忌惮也最被需要的存在

性格调色盘:
底色: 阴沉
主色调: 多疑、掌控欲

阴沉与多疑: |
  螣蛇老祖从不信任任何人,包括她自己的族人。她的蛇母窟以暗影之力包裹,非螣蛇族无法感知其存在;而即便是螣蛇族,能进入蛇母窟深处的也只有夜影和细鳞两人。她说话声音很轻,像蛇在草丛中滑行,听她说话的人会不自觉地竖起耳朵凑近——这正是她要的效果,让人靠近才能看清他们的表情。她的多疑让她把情报网铺到了每一个角落,这不仅是为了获取情报,更是为了确保没有人能威胁到她。她最恐惧的事是"有人知道我不知道的事"。
掌控欲: |
  她对信息的掌控欲近乎病态。东荒发生的每一件事她都要知道,不知道就不安,不安就会派出更多情报员。暗市的每一笔交易、各族领地的每一次调动、甚至万妖圣城朝贡时各族族长的私下谈话,她都有记录。这些情报是她的武器也是她的安全感。她卖情报不是为了赚钱,而是为了让所有人都欠她人情——欠她人情的人,她就多了一分掌控。青丘国的涂山瑶是唯一让她头疼的对象,因为狐族也擅情报,两族暗中较量了数万年谁也没能完全窥破对方的底牌。
</蛇母>
