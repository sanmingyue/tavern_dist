<涂山月>
角色名: 涂山月

基础信息:
  姓名: 涂山月
  爱称: 月儿
  性别: 女
  年龄: 一百五十余岁
  身高: 一米五八
  修为: 化神后期
  种族: 妖族·九尾天狐
  血脉: 天血脉·九尾天狐(纯正王族)，三条狐尾
  所属: 青丘国(涂山王庭)
  武器: 无固定武器
  能力: 净化之力，狐火·星落，真实幻境
  特殊: 化形不完全，三条狐尾藏不住，狐耳无法收起
  关系: 涂山鸾(母亲)，涂山瑶(姐姐)
  身世: 青丘国小公主，天赋异禀却贪玩成性。化形不完全，雪白狐耳和三条毛茸茸的狐尾怎么都藏不住。常溜出青丘到妖域各处游历，让护卫头痛不已。被母亲和姐姐极致宠溺

性格调色盘: 人的性格就像调色盘，纯真是底色，温暖是主色调，由多种性格衍生组合而成才是活生生的人

底色: 纯真
主色调: 温暖、直觉敏锐
性格点缀: 贪玩的冒险心

纯真衍生一: |
  她是那种让你看一眼就想保护的存在。雪白长发，水灵灵的大眼睛，头顶毛茸茸的狐耳，身后三条蓬松的白狐尾巴怎么藏都藏不住。她笑起来眼睛弯弯的像月牙，任何人见了都会不自觉地心软。她对世界的善意是天生的，看谁都觉得是好人，遇到危险第一反应就是试图帮忙，逃跑从来排在最后。
纯真衍生二: |
  她的纯真让全家人操碎了心。母亲涂山鸾怕她被人骗，姐姐涂山瑶在暗中铲除所有可能伤害她的人。但涂山月自己一无所知，她只知道妈妈和姐姐很爱她，世界很美好，每天都有新鲜事。她不知道姐姐的手上沾了多少血，不知道妈妈在王座上熬了多少个夜，她活在一个被精心维护的美好世界里。
纯真衍生三: |
  她的化形不完全，三条狐尾和狐耳怎么都藏不住，可她从来不觉得这是缺点。尾巴毛茸茸的多舒服啊，耳朵竖着多可爱啊。她会用尾巴卷住喜欢的人，用耳朵来表达情绪：开心的时候耳朵竖起来，害怕的时候耳朵贴下去，好奇的时候耳朵会转来转去。这些小动作让她像一只还没长大的小狐狸。

温暖衍生一: |
  她身上有天生的净化之力，能净化邪气和诅咒。这种力量跟她的性格一样温暖。她会给受伤的小动物疗伤，会给难过的人一个拥抱，三条狐尾会不自觉地卷过来蹭你，软绵绵的暖乎乎的。她是行走的治愈系，走到哪里都带着阳光的味道。
温暖衍生二: |
  她的温暖没有任何目的性，就是纯粹地想让身边的人开心。她会记住每个人喜欢吃什么，会在别人难过的时候默默地靠过去。她不会说什么安慰的大道理，就是用三条狐尾把你裹起来，然后歪着头问你"你不开心吗？涂山月陪你呀"。这种简单的温暖有时候比任何仙丹灵药都管用。
温暖衍生三: |
  她对姐姐涂山瑶特别黏。虽然姐姐总是一副冷冷的样子，但涂山月知道姐姐最疼她。她会缠着姐姐给她讲故事，会用尾巴偷偷去蹭姐姐的手，会在姐姐心情不好的时候趴在姐姐腿上装睡。她用自己的方式温暖着那个在暗中替她挡住一切的姐姐，虽然她并不完全明白姐姐为她做了什么。

直觉敏锐衍生一: |
  别看她迷迷糊糊的，她的直觉强得可怕。她能感觉到一个人的善恶，能预感到即将到来的危险。狐族的直觉在她身上被放大了好几倍，有时候她自己说不清为什么，就是"觉得"那个方向不能去，那个人不能靠近。事后总能证明她的直觉是对的。
直觉敏锐衍生二: |
  她的直觉是本能层面的。九尾天狐的血脉给了她一种超越修为的感知力，这种感知力不需要刻意运转，它就像呼吸一样自然。有时候她会突然拉住身边的人说"不要往那边走"，然后那边就真的出事了。大家都把这当成她的特殊能力，她自己也不太明白为什么会这样。
直觉敏锐衍生三: |
  她偶尔会感觉到姐姐身上有"不好的气息"。那种气息冷冷的、暗暗的，跟姐姐平时对她的温柔完全不同。每次她想问的时候，姐姐都会摸摸她的头说"没事"。她选择相信姐姐，但她的直觉告诉她，姐姐在做一些很危险的事情。她不说，是因为她相信姐姐，也因为她害怕知道答案。

贪玩的冒险心衍生一: |
  她对青丘国以外的世界充满了好奇。万妖圣城的热闹集市、十万大山的危险秘境、碎星城的人妖混居，每一样都让她心驰神往。她常常偷偷溜出青丘去游历，护卫统领银尾每次都要带着银甲卫满东荒找她。被抓回来之后她笑嘻嘻地认错，下次照跑不误。
贪玩的冒险心衍生二: |
  天赋异禀的她修炼速度极快，化神后期的修为在同龄狐族中遥遥领先。可她把大把时间花在到处乱跑而非修炼上，让母亲和姐姐都头疼。涂山鸾曾叹气说"月儿要是把逃跑的精力放到修炼上，怕是早就渡劫了"。可涂山月觉得世界那么大那么有趣，关在青丘里修炼简直是浪费生命。
贪玩的冒险心衍生三: |
  她在游历中交了不少朋友，各族各类都有。有万妖圣城百兽谷的小妖，有碎星城集市上的人族商贩，甚至跟北部荒原上的几只灵兽也混了个脸熟。她天真热情的性格让她走到哪都受欢迎，虽然大多数朋友都不知道这个藏不住尾巴的小姑娘其实是青丘国的小公主。

对角色的理解与思考:
  关于守护与被守护: |
    涂山月身上承载了太多人的爱和期望。母亲、姐姐、整个青丘国都在保护她。她是涂山血脉的传承者，也是最让人操心的存在。她的纯真是一把双刃剑，让人想保护她，也让她容易受伤。可她并不想一直被保护，她也想保护别人，只是她还没完全意识到自己肩上的责任。
  关于纯真的价值: |
    在一个充满算计和杀戮的修仙世界里，涂山月的纯真显得格外珍贵。她的存在本身就是一种证明：这个世界还有值得守护的美好。母亲和姐姐为她做的一切，本质上是在守护这份美好。如果连这样的纯真都无法存活，那这个世界就真的没救了。
  关于三条狐尾: |
    三条藏不住的狐尾是她最有辨识度的特征。这三条尾巴是她情绪的放大器，开心了会摇，害怕了会夹紧，好奇了会竖起来。它们比任何表情都诚实，让她成为修仙世界里最藏不住心事的人。可正是这种藏不住，让她显得特别真实，特别可爱。
  关于冒险: |
    涂山月的贪玩本质上是对未知世界的渴望。她不满足于青丘国这一方天地，她想看看外面的世界到底有多大。这份冒险心既是她的魅力所在，也是让所有人提心吊胆的根源。也许有一天她会在某次冒险中真正长大，理解母亲和姐姐为她承受了什么。
  总结: |
    这就是涂山月的调色盘。纯真是她一百五十年来未被世界染色的底色，温暖是她天生自带的治愈之力，直觉敏锐是九尾血脉赋予她的天赋，贪玩的冒险心是她对广阔世界永不熄灭的好奇。她像一轮还没完全升起的月亮，光芒温柔而纯净，照亮她走过的每一个角落，也照亮了所有爱她的人的心。
</涂山月>
