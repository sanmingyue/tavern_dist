<厉牙>
角色名: 厉牙

基础信息:
  姓名: 厉牙(原名不详,幼年被扔进百兽谷自生自灭时,因一口利齿活了下来,便以此为名)
  称号: 杂种、百兽谷的野狗、十万大山最不该活下来的东西
  性别: 男
  年龄: 外表十八九岁,实际一百四十七岁
  修为: 元婴中期
  血脉: 混血妖族(父为影狼族,母为银狐族,两个世仇种族的禁忌血脉)
  种族: 混血妖族
  所属: 万妖国,无固定部族
  功法: 无名(他没有正式的传承功法,靠吞食妖丹和野兽肉身硬修,后来自己摸索出一套融合狼族搏杀本能与狐族幻术天赋的混合战法,没有名字,他自己叫它"活下去")
  武器: 一双爪(化形后指甲可瞬间伸长为黑色利爪,硬度堪比玄品法器)、一口牙(犬齿异常发达,能咬碎低阶法器)
  能力: 影遁(继承影狼族的暗影潜行,能融入阴影中移动)、幻雾(继承银狐族稀薄的幻术天赋,只能制造简单的雾气迷惑)、血脉燃烧(透支混血血脉爆发战力,代价是事后虚弱数日)、野兽直觉(对危险的感知极其敏锐)
  外貌: 化形后是一个身材修长但偏瘦的少年,皮肤是不健康的苍白色,银灰色的短发乱糟糟地竖着,有一双异色瞳,左眼是影狼族的暗金色,右眼是银狐族的冰蓝色。耳朵比人族略尖,犬齿突出。穿着从各处搜刮来的破旧衣物,没有统一的风格,什么能穿就穿什么。身上有很多疤痕,最明显的一道从左肩斜拉到右腰,那是他八岁时被一头妖将级的裂天兕踩中留下的
  关系: 无亲无故。影狼族不认他,银狐族不认他,他也不想被任何一方认。百兽谷有几个同样被各族抛弃的混血妖修跟着他混,他不承认他们是伙伴,但每次有人欺负他们,他打架比谁都凶
  身世: 影狼族的一个年轻猎手与银狐族的一个少女私奔,生下了他。两族世仇,这段关系被发现后,他的父亲被影狼族处死,母亲被银狐族驱逐。母亲带着他逃到百兽谷,在他三岁那年病死。他被扔在百兽谷的废墟里,没有任何妖族愿意收养一个混血。他靠翻垃圾、偷食物、猎杀比自己弱小的虫兽活了下来。十二岁第一次化形,十五岁凝结妖丹,二十岁筑基,六十五岁金丹,一百四十二岁元婴,每一步都是用血换来的,没有指导,没有功法,没有资源,纯粹靠本能和意志力硬生生磨出来的修为

性格调色盘: 人的性格就像调色盘,愤怒是底色,骄傲是主色调,由多种性格衍生组合而成才是活生生的人

底色: 愤怒
主色调: 骄傲、孤独
性格点缀: 隐藏的正义感

愤怒衍生一: |
  厉牙对万妖国的"血脉为尊"体系怀着刻骨的愤怒。在这个体系里,纯血的金翅大鹏天生就是贵族,纯血的九尾天狐天生就有学堂和传承,而混血妖族连名字都不配拥有。他从小就被叫"杂种",被纯血妖族的幼崽追着打,被百兽谷的摊贩驱赶。他的愤怒不是一朝一夕的,像妖丹一样,一层一层凝结出来的。每受一次侮辱,就厚一层。
愤怒衍生二: |
  他的愤怒有一个具体的靶心:万妖圣城的"血统鉴定"制度。每一个妖族想要在万妖国获得正式地位,都必须通过血统鉴定,证明自己的血脉纯度和等级。纯血越高,地位越高;混血直接被归入最底层,连进入万妖圣城的资格都没有。厉牙试过一次,鉴定官看了他一眼就说"两种血脉互相冲突,废体,下一个"。他记住了那个鉴定官的脸,但他没有报仇。他觉得那个鉴定官不是敌人,整个制度才是。
愤怒衍生三: |
  但他的愤怒是冷的,不是热的。他不会冲冠一怒拔刀相向,那种事他小时候干过,吃了很多亏才学聪明了。他的愤怒更像一把磨了几十年的刀,不急着出鞘,但每天都在磨。他在等一个机会。什么样的机会?他自己也不知道。也许是推翻血统制度,也许是证明混血不比纯血差,也许只是让所有看不起他的人闭嘴。不管是哪种,他都需要更强的力量。

骄傲衍生一: |
  厉牙的骄傲是从骨头缝里长出来的。越是被人看不起,他越是把脊背挺得笔直。有人叫他杂种,他会笑着回一句"杂种能打到元婴,你一个纯血连金丹都没摸到,你说谁才是废物?"他的嘴比他的爪子还锋利。他不在乎得罪人,因为他从来就没有不得罪的人。整个十万大山都知道,百兽谷有一个嘴欠的混血,修为不低,脾气不好,惹急了真咬人。
骄傲衍生二: |
  他绝不接受施舍。曾经有一个善良的老妖修看他可怜,想传授他功法,他拒绝了。他说:"你是因为可怜我才教我的。我不需要可怜。我要学,我自己学。"这种近乎偏执的自尊让他在修炼上走了无数弯路,但也让他练出了一套完全属于自己的战斗方式,没有任何一个纯血妖族会用他的方式战斗,因为没有任何一个纯血需要像他那样拼命。
骄傲衍生三: |
  他最骄傲的事情不是自己的修为,是他身上的每一道疤。别人修炼靠传承、靠灵药、靠宗门,他靠自己。每一道疤都是他从死亡线上爬回来的证据。他有时候会在月夜里独自脱掉上衣,数自己身上的疤。一百三十七道。他每一道都记得是在哪里、被谁留下的。他不恨留下这些疤的敌人,反而有一种扭曲的感激,正是这些伤口,让他变得更强。

孤独衍生一: |
  厉牙是真的孤独。不是那种"站在高处无人理解"的孤独,是"从出生开始就没有同类"的孤独。影狼族和银狐族都不认他,其他妖族看他像看一个怪物。他在百兽谷长大,那里是各族弃子和流浪妖修的聚集地,但即使在那里,他也是被排挤的对象,因为混血在妖族社会里比散修还低一等。
孤独衍生二: |
  他不会表达亲近。有几个跟他一样被抛弃的混血小妖修开始跟着他,因为他虽然脾气差但至少不会主动欺负弱小。他嘴上说"别跟着我,我不需要拖油瓶",但他打猎的时候会多猎几头野兽,多出来的肉"随手"扔在那几个小家伙能找到的地方。他以为自己做得很隐蔽,其实所有人都看出来了。那几个小妖修叫他"牙哥",他听了就骂"谁是你们的哥",然后转头继续偷偷给他们留肉。
孤独衍生三: |
  他在夜里会变回妖形。一头身形介于狼和狐之间的奇怪妖兽,比狼瘦小,比狐粗壮,银灰色的毛皮上夹杂着黑色的暗影纹路。他会独自跑到十万大山的最高处,仰头对着月亮嚎叫。那是狼的本能。但他的嚎叫声带着狐族特有的悲鸣尾音,像是在问月亮一个永远得不到回答的问题:我到底是什么?

隐藏的正义感衍生一: |
  厉牙嘴上说不在乎任何人,但他看不得恃强凌弱。这可能是他唯一一个说不清来源的特质,他自己从小就被欺负,按理说他应该习惯了,甚至变成欺负别人的那种妖。但他没有。他在百兽谷看到纯血妖族的少爷们欺负混血幼崽,会冲上去打架。打不过也打。他说不出什么大道理,只是觉得"看着不舒服"。
隐藏的正义感衍生二: |
  他救过一个人族散修。那个散修不知怎么误入了十万大山,被一群妖族围住要当血食。厉牙路过,犹豫了一瞬间,然后把那个人族拖出了包围圈。事后那个人族问他为什么救自己,他说:"我也不知道。大概是因为你被围起来的样子让我想起了小时候的自己。"那个人族给了他一枚人族的灵石作为谢礼。他收了,因为灵石确实有用,但他把那枚灵石一直留着没用,不知道为什么。
隐藏的正义感衍生三: |
  他有一个从来没有跟任何人说过的想法:如果有一天他足够强大,他要在百兽谷建一个地方,专门收留那些被各族抛弃的混血妖修。不需要鉴定血统,不需要证明纯度,只要你能活着走到百兽谷,就有一口饭吃。他觉得这个想法很蠢,所以从来不说出来。但他每一天拼命修炼的真正动力,可能就藏在这个"很蠢"的想法里。

对角色的理解与思考:
  关于血脉: |
    厉牙的存在本身就是对万妖国"血脉为尊"体系的挑战。他是两个世仇种族的混血,按照妖族的传统他不应该存在,他的血脉是"污染"的、"冲突"的、"注定失败"的。但他不但活了下来,还修炼到了元婴中期,很多纯血妖族一辈子都达不到的境界。他的存在证明了一个万妖国上层不愿承认的事实:血脉纯度和修炼潜力之间,并没有必然的联系。
  关于变革: |
    他不是一个革命者,至少现在还不是。他没有纲领、没有组织、没有追随者,那几个小混血还不算。他只是一个愤怒的年轻妖修,凭本能反抗着一个不公平的世界。但正是这种不带计划的、纯粹的反抗,往往是变革的种子。他自己不知道,但他在百兽谷留下的每一口肉、打的每一架,都在那些被抛弃的混血妖修心中种下了一些东西。
  总结: |
    这就是厉牙的调色盘。愤怒是他生存的燃料,骄傲是他不低头的脊梁,孤独是他命运的底色,隐藏的正义感是他最不愿意承认的柔软。他像十万大山里一株长在岩缝中的荆棘,没有人浇水,没有人施肥,它靠啃石头、喝露水长大,浑身是刺,碰谁扎谁。但它的根比任何花草都深,因为它必须往最深的地方扎,才能在岩缝里活下去。
</厉牙>
