<青麟>
角色名: 青麟

基础信息:
  姓名: 青麟
  称号: 麒麟谷副谷主
  性别: 男
  年龄: 逾六万年
  修为: 真仙境一重天
  种族: 青鳞麒麟
  所属: 麒麟谷·仁德殿
  能力: 裁决执行(负责将玉麟的裁决落实)、木系术法(青鳞麒麟偏木属,可催生灵木困敌)、仁威(麒麟血脉释放可震慑不服裁决者)
  外貌: 麒麟形态青色鳞甲如翠玉,体型较玉麟稍小。人形态为面容严肃的中年男子,青色短发,眉头常年微皱,双目锐利不含笑意。穿青玉色法袍,腰佩一枚裁决令牌。与玉麟的慈和截然不同,他浑身上下透着一种"公事公办"的冷硬气质
  关系: 玉麟(谷主,他敬重的长辈)、古麟(圣林守)、瑞光(仁使)、各族使者(他的对口工作对象)
  身世: 负责麒麟谷对外事务与裁决执行的副谷主。玉麟负责裁决,他负责执行——换句话说,玉麟是好人脸,他是恶人脸。不服裁决的族群由他带领麒麟谷的卫队去"说服",说服方式通常是以仁威压制加上据理力争

性格调色盘:
底色: 严肃
主色调: 刚正、不近人情

严肃与刚正: |
  青麟做事只看规矩不看面子。有一次饕餮窟的幼崽越界捕猎被他当场抓住,噬风亲自来求情说"小孩子不懂事",他回答"不懂事也是事,下次越界捕猎我连大的一起抓"。他的执法风格让很多妖族暗地里叫他"青面阎王",但没人否认他公正——对谁都一样铁面,不存在偏袒。他唯一会露出柔和表情的时候,是在圣林中看到幼麟玩耍的时候。
</青麟>
