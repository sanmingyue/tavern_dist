<古麟>
角色名: 古麟

基础信息:
  姓名: 古麟
  称号: 麒麟谷圣林守
  性别: 男
  年龄: 逾四千五百年(麒麟谷最年长者)
  修为: 化神大圆满
  种族: 苍鳞麒麟
  所属: 麒麟谷·圣林
  能力: 圣林共鸣(与圣林中所有灵木心意相通)、仁道传承(守护圣林深处麒麟先祖的仁道遗留)、长眠感知(沉眠中依旧能感知圣林内一切动静)
  外貌: 麒麟形态鳞甲苍灰如古石,遍布岁月斑驳的裂纹,独角已磨损大半呈灰白色。体型不大但浑身散发着极其古老厚重的气息。人形态为佝偻的白发老翁,面容如树皮般沟壑纵横,双目浑浊但偶尔精光一闪。穿苍色旧袍,袍上沾满落叶和青苔,像是从圣林中长出来的一棵老树
  关系: 玉麟(谷主,他看着长大的后辈)、圣林灵木群(他的"老友")
  身世: 麒麟谷最年长的存在之一,守护圣林数千年。他的修为只有化神大圆满,在族长级别中并不算高,但他活得够久——久到他见证过东荒妖域数次大变迁。他平日沉眠于圣林深处,与灵木融为一体,除非大事发生否则不会苏醒

性格调色盘:
底色: 苍老
主色调: 通透、慈悲

苍老与通透: |
  古麟已经老到不在乎任何世俗纷争了。谁当妖皇、谁打谁、哪个族兴哪个族衰,在他看来都是云烟过眼。他活了数千年,看过太多"以为天大的事"最后不过如此。有时候玉麟遇到难以裁决的纠纷会来请教他,他通常只说一句话就把问题点透——不是因为他多聪明,是因为他见得太多了,什么事都有先例。他最常说的话是"急什么,等等看"。事实证明他说对的次数比说错的多得多。他唯一在乎的就是圣林不能被破坏,灵木不能被砍伐。圣林是麒麟先祖的遗产,是麒麟谷的根,毁了就真的没了。
</古麟>
