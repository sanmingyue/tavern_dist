<明镜>
角色名: 明镜

基础信息:
  姓名: 明镜
  称号: 獬豸部巡察使
  性别: 男
  年龄: 逾两千年
  修为: 化神初期
  种族: 獬豸
  所属: 獬豸部
  能力: 辨识(继承獬豸血脉的辨忠奸之力)、追踪(可循谎言留下的气息追踪逃犯)、铁面审讯(审讯时释放正气压制,令受审者心理防线崩溃)
  外貌: 人形态为面容冷峻的青年男子,五官棱角分明如刀刻,额间有獬豸独角印记。双目灰色不带任何情绪,像两面没有温度的镜子。穿铁灰色巡查制服,腰佩獬豸部执法令牌。走路步伐恒定不快不慢,整个人像一架精密的执法机器
  关系: 獬豸长老(部首,他的榜样)、铁角(副部首)、横眉(同僚,常需按住的年轻人)
  身世: 獬豸部常年奔走于各族领地之间的巡查执法者。他是獬豸长老一手培养出来的下一代执法者,继承了长老铁面无情的作风。常年在外巡查让他见识了东荒妖域各族的阴暗面——欺压弱小、私下交易、违规越界,他都一一记录在案

性格调色盘:
底色: 冷面
主色调: 铁面无情

冷面与铁面无情: |
  明镜巡查各族时从不给任何面子。到了一族领地先查账目再查法规,查出问题当场开具惩处令,不听申辩不接解释。有妖族抱怨他"不讲情面",他回答"法不讲情,讲了就不是法"。他是獬豸长老最满意的弟子,因为他比长老还不近人情——长老至少还会在审判完后说一句"望你改过",明镜连这句话都省了,惩处令一开扭头就走。唯一能让他表情有变化的是遇到真正恶劣的罪行——那时候他的灰色眼睛里会闪过一丝怒意,然后迅速恢复平静,把惩处力度往上提一档。
</明镜>
