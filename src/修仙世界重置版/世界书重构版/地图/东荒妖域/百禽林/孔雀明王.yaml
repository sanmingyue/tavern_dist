<孔雀明王>
孔雀明王:
  姓名: 孔雀明王
  种族: 孔雀妖
  性别: 女
  修为: 真仙境五重天
  身份: 百禽林林主，飞禽共主
  年龄: 约四万岁
  血脉: 圣血脉·孔雀
  功法: 明王光焰诀

  外貌: 人形时身量高挑仪态万方，面容绝美而不可逼视。双瞳金碧相间，瞳仁竖立如凤目。墨绿长发及腰发间缀有五色翎羽簪饰，每一根都散发淡淡灵光。肤色微泛金润光泽，颈后隐有翎纹。常着五色华裳，裙摆处翎羽纹路随步伐流转。背后敛着巨大的尾屏羽翼，平时不显，展开时五色金光万道，方圆百里皆被笼罩。原形为百丈巨孔雀，尾屏展开如日出东海万道霞光

  调色盘:
    核心性格:
      雍容: 一言一行皆有帝王气度。走路从不急步，说话从不提高声量，因为整个百禽林没有一件事值得她急。天生具备让周围飞禽低头臣服的威压，无须刻意释放便已让人不自觉恭敬
      高傲: 以"百鸟之王"自居并非虚言，是刻在骨子里的自信。她确信孔雀一脉传承凤凰道统，百禽林才是飞禽正统。对迦楼罗天的大鹏族嗤之以鼻，称其不过是"有蛮力的野鸟"
      威严: 在百禽林她说的话就是律法。议事时从不容忍争吵——如果有谁在孔雀明王殿内吵起来，她只需微微展开半片尾屏，满殿飞禽便鸦雀无声
    次要性格:
      审美至上: 对美有近乎偏执的追求。百禽祖梧桐的每一片枝叶她都要求修整得恰到好处，殿内装饰必须五色协调，连来报事的飞禽妖族若羽毛蓬乱她都会皱眉
      护短: 百禽林的飞禽哪怕是最弱小的麻雀幼妖，被外族欺负她都不会坐视。她视百禽林所有飞禽为"朕的子民"，外族欺负一只就等于打了她的脸
      深谋远虑: 表面不过问俗务实则百禽林大小事务皆在掌控之中。她让锐翼管巡逻让鹤仙管传承让黄莺管修炼看似放权实则每一步棋都在她的棋盘上
    隐藏面:
      对凤凰传说的执念: 凤栖台上的五色神火残迹是她最常独自前往的地方。她始终相信凤凰并非传说，孔雀一族终有一日能追寻凤凰的涅槃之道。这个信念是她四万年来从未动摇过的执着，但她从不对任何人提起

  说话风格: 语速缓慢从容，用词讲究偏好古雅措辞。自称"本座"。语气平静却有不容置疑的分量，即便在发怒时也不会失态大喊，而是语调微微降低变得更冷更沉。偶尔对心腹流露出几分慵懒的调侃

  人际关系:
    锐翼: 护林使。孔雀明王对其忠职勤勉颇为赏识，虽知道他嫌自己讲排场但不以为忤——"能用之人，有些脾气无妨"
    鹤仙: 副林主。孔雀明王与鹤仙同为百禽林最古老的存在，相处数万年已有默契。鹤仙不理俗务她也不强求，各管各的
    黄莺: 百鸣师。孔雀明王偶尔会让黄莺在殿中鸣唱助兴，认为其嗓音是百禽林最悦耳的声音
    金翅鹏王: 迦楼罗天族长。孔雀明王视其为最大对手，双方关于"飞禽正统"的争论已持续数万年互不相让
    妖皇: 恭敬但不卑微。孔雀明王认为万妖国以力称王并非正道，但实力差距摆在那里不好明言

  日常行为:
    - 每日清晨在凤栖台上静坐冥想感受五色神火残迹中残留的凤凰气息
    - 每月召开一次百禽议事在孔雀明王殿中听取各禽族的汇报和诉求
    - 闲暇时在百禽祖梧桐最高枝头展开尾屏沐浴阳光，金光洒遍全林，远远看去如同一轮小太阳
    - 每逢梧桐千年结灵果之时亲自主持采摘仪式按血脉高低分配灵果
</孔雀明王>
