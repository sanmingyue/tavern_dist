<金翅鹏王>
角色名: 金翅鹏王

基础信息:
  姓名: 金翅鹏王
  称号: 迦楼罗天族长、天空之王
  性别: 男
  年龄: 逾十万年
  修为: 真仙境五重天
  种族: 金翅大鹏
  所属: 迦楼罗天·九霄天顶
  能力: 极速飞行(展翅三千丈，极速之下可撕裂虚空)、雷羽攻击(翅羽蕴含雷力)、领域压制(大鹏血脉释放可令低阶飞禽本能臣服)
  外貌: 鹏形态翅展三千丈，金色羽翎如烈日铸就，双目如两轮金日高悬天际。人形态为高大英挺的青年男子，金发如瀑垂至腰间，瞳孔为竖瞳金色，鹰钩鼻高耸，嘴角始终微微上扬带着与生俱来的傲慢。穿金翎战甲，背后常有金色羽翼虚影闪烁
  关系: 金翅大鹏王(妖皇，同出大鹏一脉但辈分较低，对此始终不服)、苍翎(心腹副族长)、裂空(第一战将)、风吟(祭风使)
  身世: 迦楼罗天族长，大鹏一脉分支首领。与万妖国的金翅大鹏王同出一脉，但辈分较低血脉纯度也稍逊一筹。这是他毕生的刺——明明同为大鹏后裔，凭什么对方高居妖皇之位而自己只能做分支族长？他不服，但实力差距摆在那里，不服也得忍着。这种被压一头的憋屈铸就了他极端高傲的性格，在自己的地盘上他要让一切都按他的规矩来

性格调色盘:
底色: 高傲
主色调: 不甘、霸道
性格点缀: 对族人的责任感

高傲: |
  金翅鹏王的高傲刻在骨子里。在九霄天顶，他就是天。任何妖族进入迦楼罗天领空必须先降落行礼，否则视为挑衅——上次有只不知死活的金雕闯入领空没有行礼，被他一翅扇飞三百里。他说话从不低头看人，因为他觉得低头是一种侮辱。唯一让他低头的场合是万妖大祭面见妖皇时，每次低头他的脖子都僵硬得像要折断。
不甘: |
  他对妖皇的不甘不是嫉妒，是不服。同样的大鹏血脉，凭什么妖皇是真仙七重天而他只有五重天？他认为这不是天赋的差距，而是资源的差距——万妖圣城的万灵血池、朝圣古道上的灵脉，那些本该属于大鹏一族的资源，全被妖皇一个人占了。他在九霄天顶修炼，没有血池只有雷泽借来的天雷淬羽，能修到五重天已经是他天赋的证明。这种想法让他既痛苦又亢奋——痛苦于差距，亢奋于"如果给我同样的资源我一定能超过他"。
霸道与责任: |
  他对族人的态度是典型的严父——严厉到近乎残酷但绝不允许外族欺负自己的族人。绝影台的俯冲训练每年都有族人因此丧命，他的态度是"怕死就别飞"。但有一次百禽林的金雕偷袭了一只迦楼罗天的幼鸟，他二话不说亲自飞到百禽林上空，用血脉压制逼得孔雀明王出面赔礼道歉。他的逻辑很简单：我的族人只有我能罚，别人碰一下试试。
</金翅鹏王>
