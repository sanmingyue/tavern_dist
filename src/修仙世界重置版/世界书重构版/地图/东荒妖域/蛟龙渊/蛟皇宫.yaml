<蛟皇宫>
蛟皇宫:
  位置: 云梦大泽最深处的水底，距水面约千丈。四周是漆黑的深水区，水压大到普通金丹修士都无法久留。只有顺着蛟族设置的水底灵脉通道才能安全抵达，否则极易被暗流卷入泥沙层窒息而亡
  规模: 宫殿以万年蛟骨为梁柱、以压缩的泥沙巨石为墙壁筑成。整体呈蛟龙盘踞之势蜿蜒数里，主殿居中各殿围绕。宫殿不发光也无照明，蛟族天生能在黑暗深水中视物，外族来访则需自备照明。深水中宫殿显得沉默而压抑，黑色蛟骨在水中隐约可见，像是一头巨兽沉睡的骨架
  氛围: 宫中终年寒冷安静，只有水流穿过蛟骨缝隙时发出的低沉呜咽声。蛟族不喜喧哗，宫中行走者多以水流震动传递信息而非开口说话。整座宫殿弥漫着一种沉闷而压抑的气息，仿佛承载着蛟族世代化龙不成的郁结

  蛟皇殿:
    位置: 蛟皇宫正中央
    说明: 蛟龙王议事之所。殿中央悬浮着一颗拳头大小的墨色龙珠，是蛟龙王历代相传的至宝，据说蕴含着一丝远古真龙之气。殿内两侧排列着十二根万年蛟骨柱，每根骨柱都是历代蛟皇死后脊骨所化。蛟龙王盘踞在龙珠之下的蛟台上，接见来访者时通常保持蛟体原形，极少化为人身

  骨藏阁:
    位置: 蛟皇殿后方深处
    说明: 蛟族的功法秘藏之所。阁内存放着蛟族历代先祖的修炼手记和搜集来的所有与化龙相关的典籍残卷。阁门以蛟皇血脉禁制封锁，非蛟皇血脉不得进入。据说阁中最深处有一卷残缺的化龙诀，但关键部分缺失始终无法修炼

  蛟兵营:
    位置: 蛟皇宫外围，环绕宫殿的一圈水底洞窟
    说明: 蛟族战士的驻扎之所。数百名蛟族战士常年驻守于此，分为三班轮值巡逻宫殿周边水域。蛟兵以修为分队，筑基为前锋金丹为主力元婴为统领。洞窟内简陋至极只有石台和兽皮，蛟族认为深水中的冷硬磨砺才能养出硬鳞

  沉渊牢:
    位置: 蛟皇宫最底层，深入泥沙之下
    说明: 蛟龙渊的囚牢。关押犯了族规的蛟族和被俘的外族。牢房开凿在泥沙层中，水压更大温度更低。囚犯被困在仅能容身的石室中动弹不得，连灵力都会被水压抑制。据说在沉渊牢中关过最久的囚犯被困了三百年，出来时修为倒退了两个大境界

  常驻路人:
    铁鳞: 元婴初期，黑蛟妖，蛟兵营统领。全身鳞甲漆黑如铁，是蛟龙渊防务的实际执行者。做事严谨一丝不苟，对手下蛟兵管教极严。每日亲自巡查宫殿周边三次，风雨无阻
    暗水: 金丹后期，蛟妖，蛟皇殿前的传令官。负责传达蛟龙王的命令和接待来访者。声音低沉平板毫无感情，传达命令时一字不多一字不少
    老骨: 金丹大圆满，老蛟妖，骨藏阁的守阁者。年岁极大鳞甲已泛白，行动迟缓但对阁中每一卷典籍的位置烂熟于心。极少说话，有人问起化龙诀时只摇头不答
    泥爪: 筑基后期，蛟妖，沉渊牢的狱卒。天生力大擅长在泥沙中穿行。对囚犯态度冷淡但从不虐待，按时送食从不短缺。被问到牢中关了谁时只说"该关的"
    清鳞: 筑基初期，小蛟妖，蛟兵营中最年轻的蛟兵。刚从幼崽期蜕完第一层皮，鳞甲还是浅灰色的。对化龙充满憧憬，闲暇时总缠着老骨打听化龙诀的事
</蛟皇宫>
