<化鹏台>
化鹏台:
  位置: 逍遥崖最顶端，碎星海峡千丈绝壁的极点。从逍遥崖巢穴群沿崖壁向上攀行需大半日，最后一段路只有飞行才能到达，崖壁在此处向外倾斜形成倒悬之势，无翼者根本无法攀附
  规模: 一块从悬崖顶端向海面方向突出的巨型天然石台，长约三十丈宽十余丈，三面临空一面连接崖壁。台面被海风和灵气冲刷得极为平整，边缘处刻有上古鲲鹏的血脉纹路随潮汐明灭闪烁
  氛围: 站在化鹏台上脚下是万丈碧海头顶是无尽苍穹，海风猛烈到能将筑基修士直接吹落悬崖。鲲鹏后裔在此处进行鲲化鹏的蜕变仪式，鲲形态的族人从深渊潭中跃出海面冲天而起在化鹏台上空展翅化鹏。蜕变时妖力激荡方圆百里海面掀起滔天巨浪，远处碎星海峡的渔民看见后便知又有一头鲲鹏诞生

  蜕变仪式:
    说明: 鲲鹏后裔最重要的血脉觉醒仪式。鲲形态的族人在深渊潭底修炼至瓶颈后，由族长或核心成员引导至化鹏台下方海域。族人从海中跃出冲向化鹏台上空，在半空中妖力爆发鲲身碎裂鹏翼展开。成功者翼展数十丈翱翔九天，失败者坠入大海由深渊潭中的族人接应。蜕变成功率极低，鲲鹏后裔每一代能成功化鹏者不过三五只

  血脉石壁:
    位置: 化鹏台连接崖壁的内侧岩面
    说明: 崖壁上刻满了历代成功化鹏者的名号和化鹏时的妖力波动纹路。每一道纹路都是化鹏瞬间妖力灼烧崖壁留下的天然印记，纹路越深越宽代表化鹏时的妖力越强。最古老的纹路已有数万年之久几乎与岩石融为一体，最新的一道是三百年前留下的

  观潮亭:
    位置: 化鹏台侧方崖壁上凿出的石亭
    说明: 供等候蜕变的族人和观礼者休息之处。亭中可俯瞰整片碎星海峡，天气晴朗时能看到海面上零星的岛屿。观潮亭中常年备有深海灵鱼干和海藻酒，是鲲鹏后裔少有的待客之所

  常驻路人:
    潮声: 元婴初期，鲲鹏后裔，化鹏台守台者。已成功化鹏的老族人，鹏形态翼展八十丈在族中属中等。常年守在化鹏台上维护血脉石壁、清理台面。沉默寡言但每逢蜕变仪式时会亲自下海接应失败者
    铁翅: 金丹大圆满，海鹰妖，依附鲲鹏后裔的飞禽。负责在化鹏台周围巡逻驱赶靠近的外族飞禽。翅膀坚硬如铁能在暴风中稳定飞行，对鲲鹏后裔忠心耿耿
    浪花: 筑基后期，海豚妖，深渊潭与化鹏台之间的联络员。在海面与崖顶之间来回跳跃传递消息。性格活泼话多，是鲲鹏后裔领地中少见的开朗妖族
    刻石: 筑基初期，石蟹妖，血脉石壁的维护者。用坚硬的蟹钳清理石壁上的苔藓和海盐结晶，确保历代化鹏纹路清晰可辨。干活慢但极其仔细，一寸石壁能打理半天
    雾角: 炼气大圆满，海牛妖，观潮亭的杂役。负责在观潮亭中准备食物和清扫，体型笨重在狭窄的石亭中转身都困难。做的灵鱼干味道不错但卖相难看
</化鹏台>
