<鲲鹏后裔>
鲲鹏后裔:
  定位: 上古鲲鹏血脉后裔，横跨海空的稀有妖族
  位置: 东荒妖域最东端·碎星海峡上空与海面之间。悬崖巢穴面朝大海，海面下有万丈深渊供鲲形态栖息

  核心理念: 鲲化鹏则翔九天，鹏归鲲则潜深渊。鲲鹏后裔可在鲲与鹏两种形态间切换，是东荒唯一同时称霸海空的妖族。族中极少个体但每一只都实力非凡

  族长:
    名号: 鲲鹏遗子
    种族: 鲲鹏
    修为: 真仙境四重天
    身份: 鲲鹏后裔至高族长
    说明: 鹏形态翼展千丈遮天蔽日，鲲形态体长万丈潜行深渊。上古鲲鹏血脉最纯正的继承者，据说其先祖是真正鲲鹏的后代。性情孤傲寡言，不与世争但不容侵犯领地

  核心成员:
    左翼: 天翔，化神后期，鹏形态偏重的族人。常年翱翔于碎星海峡上空巡视领地，速度仅次于迦楼罗天的族人
    右翼: 渊潜，化神中期，鲲形态偏重的族人。常年潜伏于海面下巡视深渊通道，能在万丈水压下自如行动

  鲲鹏后裔核心:
    逍遥崖: 面朝大海的悬崖巢穴群，巢穴建在千丈绝壁之上。崖上常年海风呼啸，鹏形态族人在此起落如同平地
    化鹏台: 鲲化鹏的蜕变圣地，悬崖顶端的巨型平台。鲲形态族人在此跃出海面化为鹏形，是鲲鹏血脉觉醒的关键仪式
    深渊潭: 万丈海渊中的鲲栖息之所，海水幽深漆黑。潭底有上古鲲鹏留下的血脉印记，族人在此修炼可加速两形态切换
    破浪道: 连接海面与深渊潭的水下通道，仅鲲鹏后裔知晓路径

  与各族关系:
    迦楼罗天: 争夺东部天空霸权的劲敌，双方时有空中对峙
    百禽林: 态度复杂。百禽林将鲲鹏后裔视为飞禽一脉，但鲲鹏族并不认同
    万妖国: 名义臣服但极少参与妖域事务，朝贡以深海灵材为主
    东海龙宫: 在碎星海峡海域偶有接触，互不侵犯

  逍遥崖常驻路人:
    海燕: 筑基大圆满，海燕妖，逍遥崖的信使。在悬崖与海面之间穿梭传递消息，身形小巧但不惧风暴
    老鲸: 金丹后期，鲸妖，深渊潭外围的守卫。体型巨大但性情温和，负责驱赶误入深渊的外族海妖
    螺旋: 筑基初期，海螺妖，逍遥崖脚下的小贩。在崖壁上开了间小铺卖深海采集的珊瑚和贝壳，生意冷清但他乐在其中
    风筝: 炼气大圆满，风筝鹞妖，依附鲲鹏后裔的小飞禽。负责在悬崖上打扫巢穴，常被海风吹得东倒西歪但从不抱怨
</鲲鹏后裔>
