<裂腹>
角色名: 裂腹

基础信息:
  姓名: 裂腹
  称号: 饕餮窟猎首
  性别: 男
  年龄: 逾五千年
  修为: 化神初期
  种族: 饕餮
  所属: 饕餮窟
  能力: 追猎(嗅觉极灵,能在百里外嗅到猎物血肉的气息)、吞噬术(饕餮血脉的吞噬能力)、奔袭(四肢爆发力极强,短距离冲刺速度惊人)
  外貌: 人形态为精瘦的青年男子,面容凶狠,颧骨高耸双目深陷,嘴唇薄且常年外翻露出尖牙。腹部有一道触目惊心的巨大伤疤从胸口直贯至小腹——据说是年幼时吞了一头铁甲灵兽,兽角从肚子里刺出来留下的。穿兽皮背心,四肢缠着猎物筋腱制成的绑带,赤脚,脚底长满了厚茧
  关系: 饕餮王(窟主)、噬风(副窟主)、碎骨(猎队先锋)
  身世: 饕餮窟猎队的首领,负责率领猎队外出狩猎为整个饕餮窟寻找食物。他是饕餮窟中最善于捕猎的战士——不是最强的,但嗅觉最灵跑得最快最会找猎物。他的腹部伤疤是他的标志,也是他名字的由来

性格调色盘:
底色: 凶狠
主色调: 务实

凶狠与务实: |
  裂腹捕猎时毫不留情,但他的凶狠是猎人的凶狠而非暴君的残忍——他杀猎物是为了族人有饭吃,不是为了取乐。他带猎队外出时纪律严明:不准浪费猎物,不准猎杀幼崽(留种),不准越过麒麟谷的边界(惹不起)。他最恨浪费食物——有猎队成员只啃了猎物最肥美的部分就扔掉,被他一脚踹进深坑罚饿三天。他说"饿过的人才知道食物的金贵"。他是饕餮窟中少数几个有长远眼光的妖族,知道如果把猎物全杀光了明天吃什么,所以他会控制猎区轮换和捕猎量——这种理性在饕餮窟中相当稀缺。
</裂腹>
