<玄甲大圣>
角色名: 玄甲大圣

基础信息:
  姓名: 玄甲大圣
  称号: 玄武渊至高主宰
  性别: 男
  年龄: 不可考(东荒最古老的妖族之一,至少二十万年以上)
  修为: 真仙境五重天
  种族: 玄武
  所属: 玄武渊·龟息殿
  能力: 龟甲天机(龟甲可窥天机但从不主动泄露)、绝对防御(龟壳坚不可摧,刻满天然龟纹蕴含太古阵法)、长眠术(可沉眠数千年,眠中修为缓慢增长)、一言定乾坤(醒时开口必有深意)
  外貌: 本体龟壳方圆百丈,壳面刻满天然龟纹,青苔与藤蔓覆盖大半——他睡得太久了,身上已经长满了植被。壳上盘踞的黑蛇与龟甲一体,蛇身黝黑如铁。极少现人形,偶尔化形为一个佝偻至极的老者,白发白须垂地,双目半睁半闭永远一副没睡醒的样子,穿一身灰黑色旧袍,走三步打一个哈欠
  关系: 灵龟(龟相,他沉睡时的代理人)、黑鳞(蛇将)、甲纹(卜师)
  身世: 玄武渊至高主宰,东荒最古老最沉默的妖族首领。他上一次苏醒是三千年前的万妖大祭,平日沉眠于龟息殿中,龟壳占据了大殿一半空间。醒时一言定乾坤,睡时万事不相干。龟甲可窥天机但他从不主动泄露——他说"天机不可轻泄,泄了就不灵了"

性格调色盘:
底色: 沉默
主色调: 深不可测

沉默与深不可测: |
  玄甲大圣一辈子说过的话加起来可能还不如夔牛王一天说的多。他大部分时间都在睡觉,而且是真的睡觉——龟息殿中他的龟壳纹丝不动,连呼吸都感知不到,如果不是偶尔龟甲上闪过一丝灵光,还以为他已经死了。但没人敢小看他。三千年前的万妖大祭上,各族吵得不可开交,他被灵龟叫醒后只说了一句话就让所有人安静了。那句话是什么没人记得,但效果记得——所有在场的真仙境妖族都感到了来自血脉深处的压制。他说完就又睡了。灵龟说他梦里能看到天地间很多东西,但醒来后大部分都忘了,偶尔记住的那一点就足以改变东荒的格局。
</玄甲大圣>
