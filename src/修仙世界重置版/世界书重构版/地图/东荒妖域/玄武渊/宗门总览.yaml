<玄武渊>
玄武渊:
  定位: 龟蛇合体之族的深渊居所，东荒最古老最沉默的妖族
  位置: 东荒妖域北部，深海与大陆交界的万丈深渊。渊口常年迷雾弥漫寒气逼人，渊底与北冥海有隐秘通道相连

  核心理念: 静观其变，万年不动方得大道。玄武一族性情沉稳寡言，千年一醒万年一动，是东荒妖域中最不问世事的种族

  渊主:
    名号: 玄甲大圣
    种族: 玄武
    修为: 真仙境五重天
    身份: 玄武渊至高主宰
    说明: 龟壳方圆百丈刻满天然龟纹，壳上盘踞黑蛇与玄甲一体。上一次苏醒是三千年前的万妖大祭，平日沉眠于龟息殿中。醒时一言定乾坤，睡时万事不相干。龟甲可窥天机，但从不主动泄露

  核心成员:
    龟相: 灵龟，化神大圆满，老龟妖。玄甲大圣沉睡时代掌渊务，是玄武渊实际管事者。性子慢但思虑极深，一句话能想三天
    蛇将: 黑鳞，化神后期，巨蛇妖。负责玄武渊防务，盘踞在渊口。性急好动与龟相形成鲜明对比
    卜师: 甲纹，元婴大圆满，龟妖。以龟甲占卜吉凶，是玄武渊中唯一被允许窥探天机的族人

  玄武渊核心:
    龟息殿: 玄武族沉眠修炼的水底洞府，位于深渊最底部。洞府以万年玄铁石自然形成，水压极大。玄甲大圣的龟壳占据了大殿一半空间
    蛇峦: 渊壁上缠绕的巨蛇群居之地，数百条大小蛇妖盘踞于渊壁洞穴中。蛇峦温度比渊底略高，是蛇族偏好的栖息之地
    冥水池: 深渊最深处的一汪漆黑深水，据传通往冥界。池水冰冷彻骨且会吞噬灵力，非玄武族体魄者触之即亡。族中传说冥水池中有上古玄武的残念
    观星台: 渊口上方的一块平台，夜间可观星象推演天机。甲纹常在此处以龟甲占卜，但准确率据他自己说"七成靠算三成靠猜"

  与各族关系:
    万妖国: 按时朝贡但从不主动参与任何事务，妖皇也懒得去叫醒一群乌龟
    蛟龙渊: 偶有往来，同为水属妖族有几分情面
    北冥海: 通过隐秘通道与北冥海相连，偶有北冥海的妖修经此通道进入东荒
    麒麟谷: 互相尊重，玄武族认可麒麟的仁德

  蛇峦常驻路人:
    老蛰: 金丹后期，老龟妖，渊口看守。蹲在渊口一蹲就是几十年，来人问路才抬一下眼皮。说话极慢但每句话都在点上
    赤信: 筑基大圆满，赤链蛇妖，蛇峦的巡逻兵。在渊壁上游走速度极快，性子活泼话多，是玄武渊中少见的话痨
    龟背: 筑基初期，小龟妖，龟息殿外的打杂小厮。整天背着一堆东西慢悠悠走来走去，催他快点他就缩进壳里装死
    黑尾: 炼气大圆满，水蛇妖，冥水池边的守卫。负责阻止外族接近冥水池，终日盯着漆黑的池面发呆
    藤壶: 炼气后期，海龟妖，从北冥海经隐秘通道来到玄武渊定居的外来户。壳上长满藤壶，自称"见多识广"，爱讲北冥海的故事
</玄武渊>
