<石猴>
石猴:
  姓名: 石猴
  种族: 石猿妖
  性别: 男
  修为: 化神后期
  身份: 猿王峰大弟子，通臂猿王首徒
  年龄: 约一千八百岁
  血脉: 天血脉·太古石猿
  功法: 碎岩七十二式

  外貌: 人形时身材矮壮敦实，浑身肌肉如铁石浇铸。肤色灰白带石纹，面容方正粗犷双目赤金。一头灰白短发根根倒竖如铁刺。常年穿粗麻短衣露出结实的手臂和布满老茧的双拳。背上扛一根万斤石棍，棍身刻满裂纹却从未断裂。原形时通体灰白如花岗岩，毛发坚硬如石针，双拳击地能裂山崩

  调色盘:
    核心性格:
      烈性: 脾气火爆一点就着，谁敢惹猿王峰他第一个冲出去干架。打架从不讲花巧，上来就是一棍子。输了爬起来再打
      重义: 义气为天，对师父猿王忠心如父。猿王从石中将他救出赐他修行之法，这份恩情他铭记于心。对同门师弟白臂和山中猿族视如手足
      刚直: 黑就是黑白就是白，从不和稀泥。看到噬荒教的人就想动手，看到欺负弱小的就管。说话做事不绕弯子
    次要性格:
      粗中有细: 看似莽撞实则对周围的危险极为敏感。在猿王峰外围巡视时能察觉极细微的异动，战斗中的判断力也比外表看起来强得多
      护犊: 对猿王峰的小猿们极为照顾。虽然嘴上骂他们不争气，但谁敢欺负小猿他绝不放过
      倔: 认死理不服输。跟师弟白臂争论功法时能争上三天三夜不睡觉，谁也说服不了谁
    隐藏面:
      感恩之心: 石猴是从灵石中自然化生的石猿，原本无父无母无依无靠。猿王将他从石中敲出的那一棍是他这辈子最刻骨铭心的记忆。每当独自修炼时会不自觉地抚摸身上残留的石纹，那是他来处的印记

  说话风格: 嗓门大语气冲，常用"老子""揍他""你找打"等粗直用语。说话不讲铺垫开口就是重点。跟师父说话时会收敛很多但依旧直来直去。骂人时声如雷鸣，夸人时别别扭扭憋出一句"还行吧"

  人际关系:
    通臂猿王: 师父如父。石猴对猿王的敬爱溢于言表，师父让他往东他绝不往西
    白臂: 师弟，亦友亦对手。两人经常因功法见解不同而争吵，但关键时刻配合默契。石猴嘴上嫌白臂磨磨蹭蹭，心里认可他的学问
    黑背: 护山长老，石猴尊称"黑叔"。石猴的棍法有一半是黑背教的
    断臂: 猿王峰的独臂猿妖，石猴对他极为敬佩。断臂对噬荒教的恨让石猴感同身受

  日常行为:
    - 每天天不亮就扛着石棍在悟道崖上练棍，一套棍法打下来崖面被砸出无数坑洞
    - 巡视猿王峰外围时遇到可疑者先打一棍再问话。打完发现是路过的散修就粗声粗气道个歉
    - 跟小猿们一起吃灵果时总是自己少拿几个多分给幼猿，然后板着脸说自己不饿
    - 每月去藏经石窟找白臂辩论一次，两人从功法争到修行观，白臂翻着典籍引经据典石猴就一句"说那么多有什么用不如打一架"
</石猴>
