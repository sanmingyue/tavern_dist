<灵矿集>
灵矿集:
  位置: 聚宝山山脚外围，一片被灵矿碎渣铺就的开阔平地。平地上搭建着数十间以矿石和灵木建造的铺面和摊位，是东荒妖域中灵矿灵石交易量最大的集市
  规模: 集市沿聚宝山山脚呈半环形分布，长约三里。中央是露天交易广场，四周是固定铺面。广场上摆满了各种矿石样品，从低阶的铁精石到高阶的天星陨铁都有展示。铺面里则存放着大宗交易的灵矿。集市入口处矗立着一座三丈高的貔貅石像，口大张开寓意"吞万物而不泄"
  氛围: 灵矿集是东荒少有的繁忙集市之一。各族妖修来此采购灵矿灵石，从夔牛部买雷鸣石到毕方巢进火晶石，不同族群的身影在市场中交错。空气中弥漫着矿石特有的金属味和泥土腥气。貔貅族的信誉让交易极为顺畅，报价公道绝不掺假，但也绝不降价。吆喝声、敲击矿石验货声和讨价还价声混作一团

  估价大厅:
    位置: 灵矿集中央广场旁最大的建筑
    说明: 大掌柜金算坐镇的估价之所。任何来客带来的灵矿灵石都可在此免费估价，金算或其弟子一眼便能看出品级年份和市价。估价后可选择当场交易也可另行处置，绝不强买强卖。大厅内一面墙上挂着灵矿品级对照表和当日各类灵矿的参考价格，每日更新

  灵沙铺:
    位置: 灵矿集东段
    说明: 专门出售貔貅族吞噬灵矿后排出的灵沙。灵沙品质极高可用于阵法铺设、法器镶嵌和炼丹辅料。各族对灵沙需求极大但产量有限，因此灵沙铺前常年排着长队。灵沙按纯度分级，最高纯度的灵沙价格堪比同等重量的天级灵材

  散矿区:
    位置: 灵矿集外围
    说明: 低阶灵矿的散卖区域。摊位简陋以石板铺地，卖的多是聚宝山外围矿脉出产的低级矿石。价格便宜适合散修和小妖族购买。散矿区也是穿山甲矿工和各路小贩聚集之处，偶尔能在杂乱的矿石堆中淘到品质不错的漏网之鱼

  常驻路人:
    金算: 化神中期，貔貅族，大掌柜兼首席估价师。体态圆胖面色红润，一双小眼精光闪闪。看灵矿一眼便知品级价值从不走眼。待客和气报价公道但砍价时寸步不让，"老夫报的价再公道不过了"
    铜钱: 金丹初期，貔貅族小掌柜。灵矿集中最忙碌的估价师，手持一杆铜秤整日称量灵矿。笑脸迎人招呼客人极为热情但砍价时比金算还固执
    石胆: 筑基大圆满，穿山甲妖，散矿区的矿工头。带着一群小妖在聚宝山外围挖掘低级矿脉，挖出的矿石先给金算过目，品质好的留给貔貅族差的自己在散矿区卖。干活卖力但总想多藏几块好矿
    珠儿: 炼气大圆满，蚌妖，灵矿集中卖珍珠的小贩。她的摊位是灵矿集中唯一不卖矿石的摊位。每颗珍珠都是自己体内孕育的品质上乘但产量极低。性格温柔腼腆不善叫卖，常常一天也开不了张
    铁算盘: 筑基后期，蜘蛛妖，灵矿集的总账房。以蛛丝编织的账本记录每笔交易，手脚极多算账极快。每日清账完毕后将账本封存在蛛丝茧中防潮防虫。谁也别想在他面前做假账
    啃石: 炼气后期，貔貅幼崽，金算的小孙子。还在学习分辨灵矿品级的小家伙，经常把普通石头当灵矿吞下去然后吐出来挨骂。不过偶尔也能歪打正着发现一块被忽视的好矿
</灵矿集>
