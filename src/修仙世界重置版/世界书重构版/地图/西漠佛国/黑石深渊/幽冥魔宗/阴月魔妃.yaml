  对角色的理解与思考:
    关于千面: |
      阴月魔妃最可怕的地方在于她是一个没有身份的人。所有人都有一个固定的自己，她没有。她可以是任何人意味着她谁都不是。这种彻底的去人格化让她在情报领域无可匹敌，但也让她在存在的层面变成了一个空洞。她是修仙界最强大的情报大师，但如果有一天有人问她"你到底是谁"，她可能会沉默很久，然后换一张脸走开。
    关于蛛网: |
