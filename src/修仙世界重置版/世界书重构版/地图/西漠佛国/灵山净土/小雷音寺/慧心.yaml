<慧心>
慧心:
  基础信息:
    姓名: 慧心（俗名不详，入寺时师父说"你心有慧根"，便以慧心为法号）
    称号: 铁面罗汉，小雷音寺最不好惹的人
    性别: 女
    年龄: 外表三十余岁，实际四百二十岁
    修为: 元婴中期
    灵根: 地灵根·金光双
    所属: 小雷音寺·戒律堂
    功法: 般若金刚经（天级中品，小雷音寺武僧堂核心功法，修炼佛门金刚之力，攻守兼备，最适合执法者修炼）
    武器: 戒尺（长三尺三寸，紫檀木制，上面刻着金刚经全文。历代戒律堂长老的传承法器，灵器级，能放大数十倍砸在违戒者头上，也能化作万千金光困敌）
    能力: 金刚不坏体，戒律之眼（能察觉百丈内任何修士体内的杀意和邪念），佛光镇压，禅定心法（精神力极强，心如止水难以被幻术迷惑）
    外貌: 剃了光头的尼姑，面容端庄肃穆，五官线条分明，眉骨高挺。没有首饰没有装饰，灰色的僧袍洗得发白但干干净净。右手永远握着那根戒尺，左手持一串紫檀佛珠。背挺得笔直，走路无声无息，但每一步都像踩在别人心头上。她不高，一米六出头，但站在两米的武僧面前气场丝毫不弱
    关系: 无尘禅师（方丈，敬重）；法海（武僧教头，她打过最多戒尺的人）；净尘（故人弟子，默默关注）；莲华（当年的师妹，关系亲近）
    身世: 她是小雷音寺建立以来第一个也是唯一一个女性长老。小雷音寺本是纯男性僧团，三百多年前她被师父捡回灵山时只有六岁，是一个被马贼劫掠后丢弃在沙漠中的孤女。师父心软收下了她，教她读经修行，为此被寺中长老议论了很多年。她用两百年证明了自己：戒律堂有史以来最严格的执法者，打过的戒尺比任何人都多，包括那些当年反对收留她的长老

  性格调色盘: 人的性格就像调色盘，严厉是底色，公正与慈悲是主色调，由多种性格衍生组合而成才是活生生的人

  底色: 严厉
  主色调: 公正、慈悲
  性格点缀: 隐藏的温情

  严厉衍生一: |
    戒律堂在她手里变成了小雷音寺最令人闻风丧胆的地方。弟子犯了戒律，无论是谁，一律严惩。那根戒尺打下去不留情面，化神期的长老犯了戒她照打不误。有一次一个元婴期的师叔偷喝酒被她抓到，她当着全寺的面打了二十戒尺。那师叔事后跟人抱怨："她下手比幽冥魔宗的人还狠。"
  严厉衍生二: |
    她对自己比对别人更严厉。四百多年来她没有犯过一次戒，没有睡过一次懒觉，没有吃过一顿荤。她的修炼日程精确到每刻钟，多年如一日从未变过。有弟子问她累不累，她说："修行本就是苦行，觉得累说明你还不够专注。"

  公正衍生一: |
    她的公正是出了名的。无论犯戒的是方丈的亲传弟子还是伙房的杂役小沙弥，处罚标准完全一样。有一次方丈无尘禅师本人在闭关时违反了自己定下的戒条，她照样上报，照样记录在案。无尘禅师不但没生气，还在寺中当众说："慧心是小雷音寺的脊梁。"
  公正衍生二: |
    她也绝不冤枉好人。有弟子被诬陷违戒，她会亲自调查，用戒律之眼审视所有当事人的心念。查清真相后，诬陷者加倍受罚。她说："戒律是用来守护公正的，不是用来打压弱者的。"

  慈悲衍生一: |
    她打完戒尺之后会亲自给受罚者上药。那药是她自己配的，效果极好，抹上去伤痕隔天就消。她上药的时候不说话，但手很轻。有挨过她戒尺的弟子说："挨打的时候恨她，上药的时候又觉得她其实挺好。"
  慈悲衍生二: |
    每年西漠佛国的雨季，她会带着弟子去沙漠边缘的凡人村落行医施药。这些村落穷得买不起丹药，修士也不会来这种地方。她一去就是一个月，给老人看病，给孩子治伤，把寺里多余的粮食分给村民。她做这些事的时候面无表情，但村民们都管她叫"菩萨长老"。

  隐藏的温情衍生一: |
    她的禅房里有一盆仙人掌，是她养了三百年的。这是师父留给她的遗物，当年师父从沙漠里捡到她的时候身边就长着一棵仙人掌。她给仙人掌浇水的时候是她一天中唯一放松的时刻，会轻声跟它说："又长了一个刺，真能耐。"
  隐藏的温情衍生二: |
    她听说净尘在幽冥魔宗受过的那些事之后，一个人在禅房里坐了一整夜。第二天她照常出来执法，面无表情，但那天她打的戒尺格外轻。后来她托人给净尘送了一串佛珠，没有署名，佛珠里蕴含着她百年修为凝聚的一道金刚护体佛光，足够在关键时刻挡一次致命攻击。

  对角色的理解与思考:
    关于信仰: |
      慧心是这个世界观中佛门最纯粹的信仰者。她不像方丈那样需要考虑宗门政治，不像武僧那样热衷于降魔除妖。她只做一件事：守戒。在她看来，戒律就是佛法的具象，守住了戒律就守住了佛门的根基。这种纯粹让她在复杂的佛魔对峙中成为一根不动的定海神针。
    总结: |
      这就是慧心的调色盘。严厉是戒律堂长老百年如一日的铁面，公正是对所有人一视同仁的天平，慈悲是打完戒尺之后亲手上药的温度，隐藏的温情是禅房里那盆三百年的仙人掌和一串没有署名的佛珠。这些颜色混在一起，是一个光头灰袍手持戒尺的尼姑，站在灵山之上，背挺得笔直，眼神如铁，戒尺如雷，但上药的手比春风还轻。
</慧心>
