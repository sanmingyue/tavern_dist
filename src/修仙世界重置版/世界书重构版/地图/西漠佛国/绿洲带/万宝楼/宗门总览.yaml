<万宝楼>
万宝楼:
  基本信息:
    名称: 万宝楼
    定位: 西漠最大商会，表面中立的商业巨头，暗中已被幽冥魔宗控股
    总部: 月牙泉绿洲·清泉镇
    楼主: 苏清晏，炼虚期圆满
    势力等级: 非宗门形态的商业组织，但实力和影响力不亚于一流宗门

  注意区分: 万宝楼与中央神州流金城的万宝商会是两个完全不同的组织。万宝楼扎根西漠经营佛魔之间的灰色贸易，万宝商会是中央神州的正规大型商会

  核心业务:
    拍卖行: 万宝楼最知名的业务。每季度举办一次大型拍卖会，吸引整个西漠乃至中央神州的修士。拍品涵盖法器、丹药、灵材、功法残卷甚至秘境坐标
    商铺网络: 在西漠各主要绿洲和琉璃城都设有分号。日常贩卖灵材、法器、丹药、生活物资
    镖局运输: 经营大漠商路运输。万宝楼的金牌商队配有防沙法器和驱虫灵旗，是最安全的运输选择
    情报交易: 万宝楼最赚钱也最隐秘的业务。只要出得起价，佛门和魔宗的动向都能买到
    驿站维护: 古丝路上的驿站大部分由万宝楼出资建造和维护，借此控制大漠中的信息和物流命脉

  组织架构:
    楼主: 苏清晏。表面决策者，实际已被梵楚以秘法控制心智。她仍保留大部分自主意识和商业判断力，但在关键决策上会无条件服从梵楚的指令
    四大掌柜: 分管拍卖、商铺、镖局、情报四大业务的高层管理者。他们只知道楼主有一位神秘的合作伙伴，不知道具体是谁
    伙计和掌柜: 遍布各地分号的普通员工，总计数千人。大多只是普通商人不知道万宝楼的暗面
    暗线: 专门为幽冥魔宗服务的情报网络，只有苏清晏和梵楚知道完整名单。暗线人员混杂在正常员工中，负责刺探佛门动向并传递给魔宗

  暗中控股:
    控制者: 梵楚，幽冥魔宗少主，化神期前期
    控制方式: 梵楚以秘法寄生虫控制苏清晏的心智，通过苏清晏间接掌控万宝楼。苏清晏表面一切正常，连她自己有时都分不清哪些决定是自己做的哪些是梵楚的意志
    目的: 通过万宝楼为魔宗提供情报和财力支持，同时从佛魔战争中两边牟利
    知情者: 知道这个秘密的人屈指可数：梵楚本人、苏清晏本人、情报长老阴月魔妃。甚至焚天都只知道梵楚在西漠有自己的情报来源，不知道具体是万宝楼

  清泉镇铁规:
    内容: 镇内禁止动手，违者永久禁用万宝楼一切服务
    执行: 万宝楼在清泉镇暗藏数位高手，违规者当场制服。处罚结果会公示在镇中心的告示牌上
    效力: 这条规矩数千年来只被打破过两次。一次是一位元婴期魔修失控杀人，万宝楼请了三位化神期客卿将其击杀。另一次是两个佛门弟子起了争执拔剑相向，结果两人都被永久拉入黑名单
    意义: 清泉镇的中立地位全靠这条铁规维持。没有它，佛魔双方的修士不可能在同一个镇子里和平共处

  特色设施:
    拍卖大厅: 月牙泉绿洲最宏伟的建筑，可容纳千人同时竞拍。设有隐私包厢供不愿露面的买家使用
    醉月楼: 清泉镇最大的酒楼兼歌舞坊。表面是娱乐场所，实际也是情报交换的重要据点。杏儿是台柱子
    万宝库: 总部地下的存储设施，存放万宝楼最珍贵的库存和客户寄存的贵重物品。防御等级极高
    信鸽塔: 万宝楼使用经过特殊训练的灵鸽传递信息。信鸽塔分布在西漠各处，构成一套完整的通信网络

  对外关系:
    与小雷音寺: 表面恭敬，佛门默许万宝楼在绿洲带的商业活动。小雷音寺不知道万宝楼已被梵楚控股
    与幽冥魔宗: 暗中从属关系。万宝楼是魔宗在西漠的眼睛和钱袋
    与散修: 万宝楼是西漠散修最依赖的组织。买卖灵材、接受委托、获取情报都离不开万宝楼
    与凡人: 万宝楼在凡人中的口碑很好，清泉镇的治安和驿站的维护让凡人商队得以在西漠生存

  日常景象:
    清泉镇白日: 街上修士和凡人熙来攘往，茶楼里隐约能听到各种口音的讨价还价声。佛门弟子和魔修可能就坐在同一家面摊的隔壁桌
    拍卖日: 整个月牙泉绿洲人满为患，各路修士争相竞拍。苏清晏亲自在贵宾室接待重要客户，月牙站在拍卖台上口若悬河
    夜间: 醉月楼灯火通明歌舞升平。暗处情报掮客在交换消息，暗线人员在不引人注目的角落里传递密信
</万宝楼>
