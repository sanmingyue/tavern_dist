<杏儿>
杏儿:
  基础信息:
    姓名: 杏儿（本名没人知道，她说自己忘了，也许是真忘了也许是不想提）
    称号: 月牙泉的百灵鸟（绿洲周边几个聚落的人都这么叫她）
    性别: 女
    年龄: 二十二岁
    修为: 凡人（但她唱歌的时候偶尔能引动周围的灵气微微波动，有经验的修士会觉得她可能有极其微弱的音灵根残体，不足以修炼但让她的声音天生带一点灵性）
    灵根: 疑似音灵根残体（无法修炼的程度）
    所属: 西漠·绿洲带·月牙泉绿洲·醉月楼（一家绿洲上的酒馆，不是青楼，她很在意这个区别）
    功法: 无
    武器: 无（她倒是随身带着一把小匕首防身，西漠不太平）
    能力: 歌喉（她的声音清亮悠远，能在空旷的沙漠里传出很远。唱悲歌能让人落泪唱欢歌能让人忘忧，有修士说她的歌声里有一丝天然的摄心之力）、舞技（西漠风格的舞蹈，用纱巾和铃铛，热烈奔放）、察言观色（在酒馆里见多了各种人，她一眼就能看出谁心情不好谁在说谎谁兜里有钱）
    外貌: 五官轮廓深邃带一点西漠特有的异域感，眉眼间有种说不清的妩媚但笑起来又很爽朗。皮肤不算白但很细腻。身段柔韧纤细，跳起舞来像沙漠里的风。黑发长而卷曲垂到腰间，跳舞时散开像黑色的瀑布。穿色彩艳丽的纱裙，手腕脚腕戴满了银铃铛，走路都带着细碎的铃声
    关系: 醉月楼老板娘胡妈妈（收留她的人，对她很好）
    身世: 她说自己是孤儿，八岁流浪到月牙泉被胡妈妈收留。但她偶尔说梦话会用一种没人听得懂的语言，胡妈妈觉得她可能不是普通来历。她对自己八岁之前的事要么真的不记得，要么刻意回避

  性格调色盘: 人的性格就像调色盘，热情是底色，聪敏与洒脱是主色调，由多种性格衍生组合而成才是活生生的人

  底色: 热情
  主色调: 聪敏、洒脱
  性格点缀: 被藏起来的过去

  热情衍生一: |
    她对每一个走进醉月楼的客人都笑脸相迎，不管你是满身风沙的商人还是冷着脸的散修。她的热情不是表演出来的那种，是真的对人有兴趣："你从哪来的？""路上有没有遇到什么有趣的事？""东边的天启城现在什么样了？"她喜欢听故事，客人的故事就是她了解外面世界的窗户。
  热情衍生二: |
    她唱歌的时候是最热情的。不管台下坐的是三个人还是三十个人，她都全力以赴。有一次暴风沙刮了三天，醉月楼只剩两个客人，她照样唱了整晚。唱完那两个客人站起来鼓掌，她笑得比那两个客人还开心。她说："歌是唱给愿意听的人的，一个人听和一百个人听没区别。"

  聪敏衍生一: |
    在酒馆里混了十四年，她的察言观色功夫练到了极致。谁喝高了要闹事她提前就能感觉到，悄悄让后厨准备好醒酒汤。谁是第一次来西漠的菜鸟她看一眼就知道，会主动提醒人家水囊要灌满、出绿洲要带遮阳的纱巾。谁看着和善其实心怀不轨，她绝不会单独跟那人待在一处。
  聪敏衍生二: |
    她不识字，但记性惊人。每个来过醉月楼的客人她都能记住脸和名字，哪怕隔了好几年再来她都能认出来："张大哥你又来了！上次你说要去东海看看，看到了吗？"这种本事让她在绿洲上人缘极好，大家都觉得被她记住是一件很舒服的事。

  洒脱衍生一: |
    有修士看出她声音里的灵性，说可以带她去宗门试试能不能修炼，她想了想拒绝了。"我在这里挺好的，有酒喝有歌唱有故事听，干嘛要去宗门过那种苦日子？"她是真的不在乎修炼不修炼，在她看来凡人的快乐修士未必懂。
  洒脱衍生二: |
    有客人喝醉了对她动手动脚，她不哭不闹，一脚踹过去，然后笑着说"大哥你喝多了，醒酒汤在那边"。事后不记仇，第二天那人清醒了来道歉她还是笑脸相迎。胡妈妈问她怎么不生气，她说："跟喝醉的人生气，不是跟自己过不去吗？"

  被藏起来的过去衍生一: |
    八岁之前的事她从不主动提。有人问她就笑着岔开话题，问得紧了她眼神会变，那种笑意不到眼底的变化只有胡妈妈注意到过。她说梦话用的那种语言，胡妈妈偷偷请一个路过的学者听过，学者说像是某种古老的祭祀用语，但具体是哪里的说不准。
  被藏起来的过去衍生二: |
    她脖子后面有一个胎记，形状像一弯新月。她总是用头发遮住，穿衣服也注意不露出来。这个胎记有时候会在月圆之夜微微发光，但光芒极其微弱，只有她自己知道。她不知道这意味着什么，也不想知道，或者说她害怕知道。

  对角色的理解与思考:
    关于绿洲里的星光: |
      杏儿是西漠绿洲上的一盏灯。来往的旅人在风沙里走了几天几夜，推开醉月楼的门听到她的歌声，那一刻就觉得活着真好。她用歌声和笑脸给这个荒凉的地方注入了温度，但她自己身上可能藏着一个她自己都不敢面对的秘密。那个新月胎记、那种古老的祭祀语言、那微弱到不足以修炼的音灵根残体，这些碎片指向一个她刻意回避的来历。
    总结: |
      这就是杏儿的调色盘。热情是对每个走进酒馆的人笑脸相迎听故事的底色，聪敏是记住每个客人脸和名字隔几年都认得出来的本事，洒脱是修士说带她去宗门她想想就拒绝了的坦然，被藏起来的过去是脖子后面月圆会发光的新月胎记和说梦话时那种没人听得懂的古老语言。这些颜色混在一起，是一个戴满银铃铛穿艳丽纱裙的西漠舞娘，二十二岁，在绿洲酒馆唱了十四年的歌，声音里带着连她自己都不知道来源的灵性。
</杏儿>
