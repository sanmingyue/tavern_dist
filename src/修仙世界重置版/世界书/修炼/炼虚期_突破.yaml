<炼虚期突破>
炼虚期突破合体:
  前提: 炼虚大圆满，虚空之道大成，道韵完整，肉身与天地产生共鸣
  过程: 以道韵为媒介将肉身与天地融合，肉身蜕变为半天地之体
  关键挑战:
    天地灵气灌注: 肉身合天地需要承受天地灵气的灌注，肉身不够强大会被灵气洪流撕碎
    道韵完整性: 道韵若有缺陷则无法作为肉身与天地的桥梁，融合过程中断
    心魔侵入道韵: 心魔直接侵入修士的道韵，在修士最强大的力量中植入怀疑的种子，修士需在自己构建的世界中找到修炼的根本意义
    天地排斥: 天地并非无条件接纳修士，若修士与天地的共鸣不够深则会被天地之力排斥
  辅助手段: 合体丹(传说级)、需在天地灵气最浓郁之地突破、需数位同阶修士护法
  失败后果: 肉身被天地灵气撕裂，道韵崩溃，轻则修为大跌肉身残缺，重则形神俱灭
  注意: 灵根品级仅影响修炼速度，不影响突破成败。突破成败取决于肉身强度、道韵完整性和能否通过心魔考验
</炼虚期突破>
