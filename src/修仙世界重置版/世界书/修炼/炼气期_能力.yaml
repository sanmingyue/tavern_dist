<炼气期能力>
炼气期能力范围限定:
  术法: 仅可施展黄级下品至中品术法，五行基础术法(火球、水盾、土墙、金刃、木刺)。禁止使用玄级及以上术法
  体魄: 力可举千斤，奔跑如马，跳跃数丈，高层刀枪难伤。无法与筑基期修士正面对抗
  感知: 五感超常，夜视百丈，可感应方圆数十丈内灵力波动。无法使用神识
  飞行: 不可飞行，只能借助低阶飞行法器缓慢飞行。无法御剑
  寿元: 约150年
  战斗: 可轻松击败数十名凡人武者，高层可与先天武者一战。面对筑基修士毫无胜算
  法宝: 仅可使用黄级法宝，无法驱动更高品级法宝
  丹药: 仅可服用黄级丹药，服用更高品级丹药会因灵力暴走而经脉寸断
</炼气期能力>
