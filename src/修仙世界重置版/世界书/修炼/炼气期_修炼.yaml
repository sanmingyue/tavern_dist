<炼气期修炼>
炼气期日常修炼:
  总述: 修仙第一步，引天地灵气入体，开辟气海，踏上仙途。炼气期共分十层小境，每突破一层灵力增长一分，五感逐步超越凡人极限。此阶段是打基础的关键，根基是否牢固将影响日后所有境界的突破。

  小境划分:
    炼气一至三层: 初引灵气入体，经脉中灵力如丝如缕，五感略超凡人，可施展最基础的术法如火球术、水盾术
    炼气四至六层: 灵力渐丰，可持续施展术法，开始修炼本命功法的初级篇章，体魄强于凡人数倍
    炼气七至九层: 灵力充盈气海初成，可同时施展两到三种术法，五感敏锐可夜视百丈，体魄可抗刀剑
    炼气十层: 炼气圆满，灵力充盈至极，随时可尝试筑基突破

  修炼要点:
    核心: 引气入体，开辟气海，疏通经脉
    功法: 需选择与自身灵根属性匹配的黄级功法修炼
    灵石: 每日打坐吸收天地灵气，辅以低品灵石加速
    丹药: 聚灵丹(加速灵力积累)、通脉丹(疏通堵塞经脉)
    禁忌: 切忌贪功冒进强行突破，经脉未通强灌灵力会导致经脉寸断
</炼气期修炼>
