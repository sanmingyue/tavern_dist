<合体期能力>
合体期能力范围限定:
  术法: 可施展天级全品阶术法，威力足以移山填海。禁止使用圣级术法
  体魄: 肉身为半天地之体，寻常法宝难以伤害，可在虚空中长期生存。无法与大乘期修士正面对抗
  感知: 神念覆盖数万里，与天地灵气共鸣可感应更远处的异动
  飞行: 虚空传送随心所欲，可携带他人一同传送
  寿元: 约40000年
  战斗: 一人可镇一域，合体后期可担任六大仙宗太上长老。面对大乘修士毫无胜算
  法宝: 可使用天级全品阶法宝。无法驱动圣级法宝
  丹药: 可服用天级全品阶丹药。服用圣级丹药会因仙元冲击导致天地融合不稳
  特殊: 天地共鸣(操控周围天地灵气为己用)、灵力不竭(战斗中持续汲取天地灵气)、天地异象(出手时引发风云变色雷电交加)
</合体期能力>
