<元婴期能力>
元婴期能力范围限定:
  术法: 可施展玄级全品阶术法，开始修炼地级下品术法。禁止使用地级中品及以上术法
  体魄: 肉身坚如灵器，可在虚空中自由行走，水火雷电难伤。无法与化神期修士正面对抗
  感知: 神识覆盖方圆数十里，可穿透大部分禁制探查。神识范围远不及化神期
  飞行: 御剑飞行速度极快，可日行数万里，开始感悟虚空挪移之术。无法进行虚空瞬移
  寿元: 约2000年
  战斗: 一人可镇一方，元婴后期可担任六大仙宗外门长老。面对化神修士毫无胜算
  法宝: 可使用玄级全品阶及地级下品法宝。无法驱动地级中品及以上法宝
  丹药: 可服用玄级全品阶及地级下品丹药。服用更高品级丹药会导致元婴不稳
  特殊: 元婴离体神游、夺舍重生(需找到合适肉身且成功率极低)
</元婴期能力>
