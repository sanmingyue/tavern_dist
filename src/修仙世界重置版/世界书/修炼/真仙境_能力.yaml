<真仙境能力>
真仙境能力范围限定:
  术法: 可施展圣级全品阶术法及仙级术法。仙术威力与凡人修士的术法有本质区别，一道仙术可轻易毁灭一座大城
  体魄: 仙体不朽，寻常攻击无法造成任何伤害。唯有同为真仙的仙元之力或仙级法宝才能伤及仙体
  感知: 神念覆盖百万里以上，高重天真仙可感应整片大陆的灵气变动。可直接感应天道运转
  飞行: 瞬移无距离限制，可在天地间任意穿梭。高重天真仙可撕裂空间开辟临时通道
  寿元: 一重天起寿3万年，每升一重天增加3万年，大圆满极限30万年
  战斗: 真仙与凡人修士有本质区别，即便是一重天真仙也可轻易碾压渡劫大圆满。真仙之间的战斗足以改变地貌山河
  法宝: 可使用圣级全品阶法宝及仙级法宝。仙级法宝极其稀有，多为上古真仙遗物
  丹药: 可服用圣级全品阶丹药及仙级丹药。仙级丹药极其稀有，炼制需仙级丹炉和仙级材料
  特殊: 仙威(真仙威压可令大乘期以下修士直接昏厥)、天道感应(可感知天道运转预知天灾)
</真仙境能力>
