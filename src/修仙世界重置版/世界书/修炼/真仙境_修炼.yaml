<真仙境修炼>
真仙境日常修炼:
  总述: 超凡入圣灵力尽化仙元，修仙之路的终点。真仙境分一至十重天，十重天之上为大圆满。真仙与凡人修士有本质区别——仙体、仙元、寿元、对天道的感悟都是完全不同的层次。真仙境大圆满之上再无更高境界，这就是天道的尽头。

  重天划分:
    一至三重天: 初入仙道，仙元尚浅但已远超渡劫期。适应仙体、熟悉仙元运用、初步感悟天道
    四至六重天: 仙元浑厚，可施展真正的仙术。对天道的感悟逐渐深入，开始触及大道之理
    七至九重天: 仙元深不可测，举手投足间天地变色。已能窥见天道本源的一角
    十重天: 仙元臻至极致，对天道的感悟达到极限。当世最强的存在之一
    大圆满: 真仙境的终点，也是修仙之路的终点。仙元圆满无缺，与天道共鸣。天道的尽头，再无更高境界

  寿元: 一重天起寿3万年，每升一重天增加3万年，大圆满极限30万年

  修炼要点:
    核心: 以仙元感悟天道，在天道中寻求更深层次的领悟，每一重天都是对天道理解的质变
    功法: 圣级功法为主，参悟仙级功法。凡人修士的功法已无用处
    资源: 仙晶、天材地宝中的仙级材料、蕴含天道之力的奇物
    丹药: 仙级丹药(极其稀有)、圣级丹药辅助
    特殊: 真仙修炼不再依赖外物，更多是对天道的感悟和自身仙元的打磨。闭关一次可能就是数千年
</真仙境修炼>
