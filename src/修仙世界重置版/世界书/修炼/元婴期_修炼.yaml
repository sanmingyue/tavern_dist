<元婴期修炼>
元婴期日常修炼:
  总述: 金丹化婴，元神初成。元婴期分前期、中期、后期、大圆满四个小境。元婴可离体神游，肉身毁灭而元婴不灭可夺舍重生，修士从此拥有了第二条命。此阶段修士已是一方强者，可担任大宗门长老或中小宗门宗主。

  小境划分:
    元婴前期: 元婴初成如婴儿般脆弱，不可离体过远，灵力质变为元婴之力
    元婴中期: 元婴成长壮大，可短暂离体神游百里，开始感悟虚空之道
    元婴后期: 元婴成熟强健，可离体神游千里，元婴可独立施展术法
    元婴大圆满: 元婴圆满如真人缩影，灵力浑厚可独立战斗，随时可尝试化神突破

  修炼要点:
    核心: 壮大元婴，深入参悟功法大道，融合元婴与肉身
    功法: 修炼玄级上品至地级下品功法
    灵石: 需上品灵石乃至极品灵石，普通灵石已无用
    丹药: 育婴丹(壮大元婴)、悟道丹(辅助参悟大道)、固魂丹(稳固神魂)
    禁忌: 元婴离体时肉身空虚极易被人趁虚而入，闭关修炼必须有人护法
</元婴期修炼>
