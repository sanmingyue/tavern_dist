<炼虚期能力>
炼虚期能力范围限定:
  术法: 可施展地级全品阶术法及天级下品术法。禁止使用天级中品及以上术法
  体魄: 肉身坚如道器，可在虚空裂缝中长时间存活，寻常攻击难以伤害。无法与合体期修士正面对抗
  感知: 神念覆盖万里，可感应极远处的空间波动。神念范围远不及合体期
  飞行: 可撕裂虚空远距传送，速度远超御剑飞行
  寿元: 约15000年
  战斗: 一人可镇一域，炼虚后期可担任六大仙宗核心长老。面对合体修士毫无胜算
  法宝: 可使用地级全品阶及天级下品法宝。无法驱动天级中品及以上法宝
  丹药: 可服用地级全品阶及天级下品丹药。服用更高品级丹药会导致道韵不稳
  特殊: 虚空传送、道韵外放(在道韵范围内修士拥有灵力加持)、虚空封锁(封锁一片区域阻止他人传送)
</炼虚期能力>
