变量更新规则:
  # ═══ 钓鱼数据规则 ═══
  # 【重要】每次AI回复只代表一次钓鱼的结果
  # 钓鱼装备（鱼竿/鱼饵/渔网/钓箱）的更新规则在基础变量规则中，此处不重复

  $钓鱼_成功次数:
    type: number
    check:
      - 成功+1，失败不变
      - 【硬性上限】每次AI回复最多+1
  $钓鱼_鱼获记录:
    check:
      - 成功时记录本次鱼获
  $钓鱼_最高记录:
    check:
      - 成功且超过历史最高时更新

  储物戒_鱼获:
    check:
      - 成功时将鱼获添加到储物戒_鱼获中，如 { "青鳞鱼": 1 }
      - 【硬性上限】每次AI回复最多添加1种鱼获
      - 失败时不添加
