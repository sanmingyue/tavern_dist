变量更新规则:
  #═══ 炼丹数据规则 ═══
  # 材料扣除由前端完成，AI不扣材料
  # 【重要】无论用户一次操作了多少次，每次AI回复只算一次操作结果

  $炼丹_熟练度:
    type: number
    check:
      - 成功+1，失败不加
      - 【硬性上限】每次AI回复最多+1，绝不允许一次加多个

  $炼丹_经验值:
    type: number
    check:
      - 成功+5~15（根据难度和品质）
      - 【硬性上限】每次AI回复最多+15，绝不允许超过此值
      - 满100封顶不再增加（境界升级取决于熟练度阈值，见境界规则）
      - 失败不加

  储物戒_丹药:
    check:
      - 成功时将产出丹药添加到储物戒_丹药中，如 { "聚气丹": 3 }
      - 【硬性上限】每次AI回复最多添加1种产出物品，数量不超过3
      - 失败时不添加
