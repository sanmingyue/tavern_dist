变量更新规则:
  #═══ 种植采药数据规则 ═══
  # 材料扣除由前端完成，AI不扣材料
  # 【重要】无论用户一次操作了多少次，每次AI回复只算一次操作结果

  $种植采药_熟练度:
    type: number
    check:
      - 成功+1，失败不加
      - 【硬性上限】每次AI回复最多+1，绝不允许一次加多个

  $种植采药_经验值:
    type: number
    check:
      - 成功+5~15（根据难度和品质）
      - 【硬性上限】每次AI回复最多+15，绝不允许超过此值
      - 满100封顶不再增加（境界升级取决于熟练度阈值，见境界规则）
      - 失败不加

  储物戒_药材:
    check:
      - 成功时将产出药材添加到储物戒_药材中，如 { "千年灵芝": 2 }
      - 【硬性上限】每次AI回复最多添加1种产出物品，数量不超过3
      - 失败时不添加

  # ═══ 种植采药境界（AI控制升级） ═══
  种植采药境界:
    check:
      - 可选值：""、草药入门、草药小成、草药大成、草药宗师
      - 提升条件：熟练度达到对应阈值（500/2000/10000）且有剧情突破契机时升级
      - 需要大量实践感悟，不可凭空突破
