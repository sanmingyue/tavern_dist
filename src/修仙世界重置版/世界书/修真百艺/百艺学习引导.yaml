<百艺学习引导>
修真百艺·习艺之途:
  说明: |-
    修真百艺乃修仙界谋生立命之本。并非人人都是天纵之才，大多数修士需经拜师学艺方能入门。
    各大宗门、城镇中皆有传授百艺的师长或学堂，只需有心求学、资质达标，自可拜入门下习艺。
    习得一门百艺，便能在修仙界安身立命——丹师炼丹换取灵石，炼器师锻器养家，医师行医积德，符师画符护身。

  AI行为规范:
    - 当{{user}}表达想学习某种百艺时，AI应以当前场景中的NPC自然引导
    - 不可生硬告知"你需要去XX地方学习"，应通过NPC对话、见闻、传闻等方式自然引导
    - 例如茶馆小二说"听说丹宗在收外门弟子"，或路人谈论"百草庐的药师手艺不错"
    - 到达学习地点后，AI应描写完整的拜师/学习过程，不可一句话带过
    - 学习成功后，AI必须在变量更新中设置 习得百艺 为对应百艺名称
    - 学习可能因资质不足、灵石不够、师傅不收等原因失败，不应保证一定成功

  习艺途径:
    炼丹:
      条件: 筑基期以上，需有基础灵识
      去处: 丹宗（正统丹道）、百草庐（药理入门）、药神谷（南疆丹道）、各城丹师铺面（散修丹师）
      费用: 拜师礼或学费（数百至数千下品灵石不等）
      入门标志: 习得百艺="炼丹"
    炼器:
      条件: 筑基期以上，最好有火灵根或金灵根
      去处: 天工坊（中央神州最大炼器所）、墨家机关城（机关傀儡兼炼器）、各城铁匠铺
      费用: 学徒可打工抵学费
      入门标志: 习得百艺="炼器"
    阵法:
      条件: 金丹期以上，需有较强神识
      去处: 万法宗（阵道正宗）、天机阁（阵法研究）、各大宗门阵法堂
      费用: 门槛较高，多需宗门推荐或考核
      入门标志: 习得百艺="阵法"
    符箓:
      条件: 筑基期以上，需稳定灵力输出
      去处: 万象城符箓商铺、各宗门符阁、散修符师处
      费用: 需购买符笔灵墨等工具
      入门标志: 习得百艺="符箓"
    驭兽:
      条件: 炼气期以上，需与灵兽结契
      去处: 万兽山庄（正统驭兽之道）、百兽城（灵兽交易与驯养）、妖族领地（需交情）
      费用: 较低，重在与灵兽缘分
      入门标志: 习得百艺="驭兽"
    医术:
      条件: 炼气期以上，心性仁善者更易入门
      去处: 百草庐（医药兼修）、药神谷（南疆医术）、各城医馆药铺
      费用: 学徒可在医馆帮工抵学费
      入门标志: 习得百艺="医术"
    傀儡术:
      条件: 金丹期以上，需炼器基础
      去处: 墨家机关城（傀儡术正宗）、部分炼器宗门兼授
      费用: 门槛极高，需展示炼器天赋
      入门标志: 习得百艺="傀儡术"
    种植采药:
      条件: 无特殊要求，凡人亦可学
      去处: 百草庐（药圃实习）、各城药铺、灵田山庄、野外药农处
      费用: 极低，多以帮工换取指导
      入门标志: 习得百艺="种植采药"

  剑心说明: |-
    剑心不同于百艺，无法通过拜师学习获得。
    剑心如灵根，有人天生便有，有人在生死之间、剑道感悟中后天觉醒。
    剑心的突破完全取决于剧情中的顿悟、磨砺与机缘，AI可根据剧情发展直接更新剑心境界。
</百艺学习引导>
