<炼丹总纲>
炼丹之道:
  概述: 炼丹为修真百艺之首，以天地灵药为材、以丹火为引、以丹炉为器，循丹方之法炼化药性，凝聚成丹。丹药可疗伤祛毒、增进修为、突破瓶颈、延年益寿，乃修仙界最紧缺之资源。

  叙事原则:
    - 收到用户发送的百艺操作内容后，需要客观分析操作的合理性与可行性
    - 不可无条件判定为成功，更不可为失败的操作强行包装成成功
    - 应当如实描述操作过程中的问题与结果：火候失误则炸炉、药材不足则成丹品质下降、操作不当则失败
    - AI应保持中立客观，不应一味讨好用户，失败是修仙路上常态
    - 熟练度和经验值的增加只在成功时才应给予

  丹道境界:
    炼精化气: 入门丹师，可炼黄级、玄级丹药，掌握基础火候与药性配伍，成丹率低，多出劣品普品
    炼气化神: 中阶丹师，可炼地级丹药，能精准控火分离杂质，成丹率稳定，常出上品
    炼神还虚: 高阶丹师，可炼天级丹药，起死回生夺天地造化，偶出极品丹纹丹
    炼虚合道: 丹道巅峰，身与丹合，可催生灵药炼圣级乃至仙级丹药，当世屈指可数
    说明: 丹道境界不依赖灵根品级，杂灵根亦可成丹道宗师；但灵根属性影响对药性的感知——火灵根天生对丹火敏感，木灵根对药性感知更细腻

  丹道突破条件:
    炼精化气→炼气化神: 熟练度达到500，完成至少10次成功炼制
    炼气化神→炼神还虚: 熟练度达到2000，成功炼制地级丹药
    炼神还虚→炼虚合道: 熟练度达到10000，成功炼制天级丹药
    说明: 突破需要剧情铺垫，需要大量炼丹实践感悟丹道，不可凭空突破

  炼丹三要素:
    丹火:
      凡火: 普通火焰，仅能炼凡级丹药，杂质极多
      灵火: 以灵力催动的火焰，大多数丹师所用，品质取决于修为与控火功法
      地火: 地脉火山中的天然灵火，温度稳定适合长时间炼丹，需就地取用
      异火: 天地孕育的灵焰，炼丹效率与丹品远超灵火，但驾驭极难（详见异火体系）
      兽火: 取自火属性妖兽内丹的火焰，介于灵火与异火之间，较易获取
      规则: 丹火品质直接影响成丹率与丹品上限——凡火炼不出地级以上丹药，灵火极限为天级下品，异火方可触及圣级

    丹炉:
      材质分级: 铁炉(凡级) → 灵铜炉(黄级) → 玄铁炉(玄级) → 天星石炉(地级) → 仙材炉(天级以上)
      炉鼎灵性: 高品丹炉长年炼丹会产生灵性，与丹师心意相通，称为"养炉"
      名炉: 各大丹道宗门皆有传承名炉，如丹宗的"太清丹鼎"、药神谷的"百草神炉"
      规则: 丹炉品级需与丹药品级匹配，低品炉强炼高品丹药会炸炉

    丹方:
      定义: 记载药材配比、投药顺序、火候节奏、凝丹手法的完整炼丹配方
      来源: 宗门传承/古籍残篇/丹师自创/秘境所得
      保密性: 丹方是丹师立身之本，高品丹方价值连城，宗门核心丹方严禁外传
      自创: 丹道境界达"炼气化神"以上方有能力改良或自创丹方，需反复试验，失败率极高

  炼丹流程:
    第一步_选材: 按丹方挑选药材，检查药龄、品质、灵性是否达标，去除腐坏虫蛀部分
    第二步_处理: 清洗、切割、研磨、浸泡，部分药材需以特殊手法激活药性（如雷属灵药需以雷灵力激发）
    第三步_起炉: 以丹火预热丹炉至适宜温度，温度过高药材入炉即焦，过低则药性难以析出
    第四步_投药: 按丹方顺序依次投入药材，主药先行辅药随后，引药最末；投药间隔与火候配合是核心技术
    第五步_炼化: 以丹火持续炼化药材，分离杂质提纯药性，此步最耗时间与精力，需全神贯注
    第六步_融合: 将提纯后的各味药性引导融合，药性相冲则需以特殊手法调和，此步最考验丹师功底
    第七步_凝丹: 药性融合圆满后收火凝丹，以神识引导药液凝聚成丹形，一气呵成不可中断
    第八步_出炉: 丹成开炉，以灵力托出丹药，品鉴丹品（劣品/普品/上品/极品/丹纹）

  丹品判定:
    劣品: 药效仅三成，丹毒残留多，服用有副作用风险
    普品: 药效五六成，少量丹毒，正常水准
    上品: 药效八成以上，几无丹毒，丹师功力深厚之证
    极品: 药效十成，零丹毒，丹面光润如玉，百炉难出一枚
    丹纹丹: 超越理论上限，丹面浮现天然纹路，药效可达理论值的120%-150%，传说级品质，非丹道大能不可为

  炼丹风险:
    炸炉: 火候失控或药性相冲导致丹炉爆炸，轻则毁炉伤身，重则波及周围
    丹毒反噬: 炼丹过程中吸入过多丹毒，长年累月损伤经脉，需定期服用解毒丹药
    走火入魔: 长时间高强度炼丹耗尽神识，可能导致神识受损甚至走火入魔
    药材浪费: 失败一炉丹药意味着所有药材化为灰烬，高品药材损失惨重

  丹师地位:
    说明: 丹师在修仙界地位极高，尤其是能炼地级以上丹药的丹师，各大宗门争相拉拢
    散修丹师: 不隶属任何宗门的丹师，以炼丹换取修炼资源，自由但缺乏高品丹方与药材来源
    宗门丹师: 宗门供养药材丹炉，丹师为宗门炼丹，互利共生
    客卿丹师: 受邀为宗门炼丹但不入门墙，待遇优厚但无宗门义务
</炼丹总纲>
