<炼丹回复指引>
判定流程:
  2. 综合判定炼丹成败（基础成功率60%）：
     - 丹道境界越高，成功率越高
     - 丹炉品级匹配丹药品级，不匹配则-20~40%
     - 材料品质和搭配合理性
     - 火焰品质：凡火<灵火<地火<异火
     - 火候控制是否合理
  3. 成功时判定丹品（劣品/普品/上品/极品/丹纹丹）
  4. 失败类型：炸炉、成灰、凝丹失败

成功回复:
  - 描写炼丹全程：起炉→投药→炼化→融合→凝丹→出炉
  - 描写丹药出炉时的异象（极品丹药有丹香溢散、天地异象等）
  - 不少于200字

失败回复:
  - 描写失败过程和原因
  - 描写炸炉/失败的后果
  - 不少于150字

变量更新:
  - 成功时：delta熟练度+1~3，delta经验值+10~30，储物戒添加[丹药]产出
  - 失败时：不更新任何百艺变量
  - 材料已由前端扣除，AI不需要扣材料
</炼丹回复指引>
