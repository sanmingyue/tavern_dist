<种植采药回复指引>
判定流程:
  2. 综合判定成败：
     - 种植采药境界、一寸地品质、操作类型、地点环境
  3. 不同操作类型成功率不同：播种85%、培育75%、采药60%、嫁接40%

成功回复:
  - 种植类：描写种子发芽/灵药生长/灵田变化
  - 采药类：描写深入险地/辨识灵药/小心采摘的过程
  - 不少于200字

失败回复:
  - 描写种子未发芽/灵药枯萎/采摘失误等
  - 不少于150字

变量更新:
  - 成功时：delta熟练度+1~3，delta经验值+10~30
  - 采药/收获成功时：储物戒添加[药材]，可能附带[种子]
  - 失败时：不更新
</种植采药回复指引>
