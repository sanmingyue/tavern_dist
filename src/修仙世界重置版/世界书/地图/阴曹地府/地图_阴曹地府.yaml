<阴曹地府>
阴曹地府:
  概述: 与阳间平行的亡魂世界，六道轮回枢纽，不遵循修仙境界体系而遵循死亡法则。天空铅灰无日无星仅一轮残月，空气似旧纸与香灰。活人进入会被冥界法则排斥，久留灵魂被同化

  入口:
    黄泉路口: 散布大陆各处死亡节点(古战场/瘟疫废墟/灭门遗址)，月食或鬼门关开启时显现。灰白石板路两旁彼岸花血红无叶，活人误入七步内可回头，七步后只能走到底
    归墟之眼: 北冥海深处海底漩涡，溺亡者灵魂被海流卷入。东海龙宫知晓但依古老协议不干涉
    堕魂深渊: 万魔殿地下裂缝通地府，天魔帝都严密把守仅血屠天魔知用法，魔族借此获取亡魂之力

  地府六层:
    第一层_黄泉路:
      结构: 无尽灰白石板路，两旁彼岸花花香令人遗忘生前事。亡魂排队无表情机械前行
      特殊: 路长因人而异，执念越重路越长，有魂走几百年仍在路上

    第二层_忘川河:
      结构: 黄泉路尽头宽阔浑浊黄河，河面漂浮记忆碎片(画面/声音/气味)，涉水渡河冲刷生前记忆
      忘忧汤: 河边茶摊面目不清老妇(孟婆)默默倒汤，喝则忘不喝则记但前方仍是审判
      特殊: 极少数意志极强者拒饮保留记忆渡河，被标记送阎罗殿额外审判。河中透明鱼以记忆碎片为食

    第三层_望乡台:
      结构: 三丈黑色石台，亡魂站上可见生前最在意之人现状。不催促看多久都行看完必须继续走
      特殊: 地府唯一能看阳间之处，活人站上只见白雾

    第四层_阎罗殿:
      结构: 十座大殿一列排开，黑瓦白墙烛火长明。每殿前照业镜映照亡魂一生行为无法伪装
      审判: 非善恶二分，综合一生因果裁决转世去处及是否需地狱受罚
      十殿阎王: 秦广王(初审分类)→楚江王(伤害)→宋帝王(欺诈)→五官王(不孝)→阎罗王(十殿之首/复杂案件/最终裁决)→卞城王(亵渎)→泰山王(掠夺)→都市王(残忍)→平等王(背叛)→转轮王(执行转世)
      特殊: 十殿阎王非人非鬼，是地府法则具象化，无私心无感情审判绝对公正

    第五层_枉死城:
      结构: 永远阴雾笼罩的灰色城市，死于非命/含冤/不服审判者在此徘徊重复死前片段
      居民: 被谋杀者等凶手到来才肯离开，有执念者消磨数千年未放下，自杀者反复经历死亡瞬间
      特殊: 判官定期巡视帮助愿放下者离开但不强制。久居者多已忘记身份仅记执念

    第六层_六道轮回盘:
      结构: 巨大石盘悬浮虚空缓缓转动，盘面六条通道(天人道/人道/修罗道/畜生道/饿鬼道/地狱道)
      功能: 完成审判的魂按裁决入对应通道，进入瞬间轮回之力彻底洗涤记忆/执念/灵力，纯净状态开始新一世
      特殊: 轮回盘停转则死者无法转世阳间不再有新生命。极少数修至极致者可跳过轮回盘直接转世保留前世记忆修为，代价巨大且因果烙印极深

  特殊区域:
    鬼市: 枉死城与阎罗殿之间空地，阴历初一十五开市。售前世记忆碎片/未了心愿/阳寿等，货币为冥钱。"来世签"可选下世投胎方向但不保准。活人灵魂在此被视为稀有商品(阳气是硬通货)
    地藏道场: 佛门在地府据点，一小庙一枯而不死菩提树。地藏菩萨留佛力渗透道场度化罪重但有善念者。地府唯一不受地府法则管辖区域，规则由佛法决定
    轮回禁地: 轮回盘下方封印区域，地府最深处，封印因果过于复杂无法被轮回洗涤之存在。十殿阎王共同维护封印，任一阎王陨落则封印削弱

  核心存在:
    十殿阎王: 地府法则具象化，非活物无个人意志，是秩序本身
    判官: 掌管生死簿记录阳间每个生灵寿命因果，面容模糊身份被刻意隐藏
    黑白无常: 勾魂使者引导亡魂入黄泉路。白无常高瘦面带微笑，黑无常矮胖面无表情，永远成对不分开
    孟婆: 忘川河边茶摊主人忘忧汤唯一酿造者，无人见过真面目，不说话不解释只倒汤

  地府与阳间:
    鬼门关: 每年七月十五开启，部分无主孤魂返阳间游荡一日
    招魂术: 部分修士可从地府召回特定亡魂，代价极高且不能久留
    长生本质: 修仙者追求长生即逃避地府管辖，真仙境以上不在生死簿上
    魂修: 极少数修士自愿在地府阳间往返借地府之力修炼，极危险但成功后对灵魂因果掌控恐怖
</阴曹地府>
