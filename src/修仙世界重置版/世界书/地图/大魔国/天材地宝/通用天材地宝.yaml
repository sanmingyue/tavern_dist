<大魔国通用天材地宝>
大魔国通用天材地宝:
  魔气结晶:
    品级: 凡级至玄级
    产地: 洞天各处，尤其是魔气潮汐涌泉附近
    分布: 魔气潮汐在暗时浓缩凝结的暗红色晶体，明时在地面可拾取
    用途: 魔道修炼辅材、充当低阶灵石替代品
  废墟凤血草:
    品级: 黄级至玄级
    产地: 废墟区·祭天台附近
    用途: 火系修炼辅材、据说可辅助凤凰灵体修炼
  凤凰血泪:
    品级: 天级
    产地: 废墟区·祭天台
    用途: 可能是解除心奴印或唤醒神凤灵体的关键材料
  分布速查:
    按采集难度:
      凡人可采: 魔气结晶(低品质)、血蘑菇、废墟拾荒品
      炼气~筑基: 血甲虫壳、魔蝠翼膜、噩梦藤、幽冥藻、废墟凤血草
      金丹期以上: 血铁矿(深层)、暗域魂石(深处)
      元婴期以上: 冥火灵石(千年品)、幻梦丝(千年品)、焚魂石
      化神期以上: 梦境残液、焚魂精华
    按交易渠道:
      暗域集市: 各区域常见材料的集散地
      血战城军需: 血铁矿及血系材料
      梦魇庭·幻花集市: 幻梦丝、梦酿、幻术类材料
      冥魂域·铸魂坊: 冥火灵石、魂道材料
      废墟区: 低价拾荒品，以物易物
</大魔国通用天材地宝>
