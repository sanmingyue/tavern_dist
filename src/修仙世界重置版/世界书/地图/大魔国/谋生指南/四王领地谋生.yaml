<大魔国四王领地谋生>
大魔国四王领地谋生:
  低阶修士:
    投靠: 最稳定的活法。向四王中的任何一方效忠，包食宿有修炼资源但必须绝对服从
    打手: 替四王势力执行各种脏活
    守卫: 驻守各区域要道、地点入口

  中阶修士(金丹~元婴):
    投靠四王: 成为四王势力的中层管理者
    独立势力: 在废墟区或边荒地带建立自己的小据点
    探索秘境: 万梦迷宫和深渊古窟对金丹以上修士开放部分区域

  四王麾下低阶魔修一天:
    作息不固定，以任务为主
    空闲时修炼或去本区域的商业设施消费
    不同势力之间的魔修几乎不往来，除非有公务
</大魔国四王领地谋生>
