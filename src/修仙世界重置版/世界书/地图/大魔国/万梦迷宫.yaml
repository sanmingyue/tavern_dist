<万梦迷宫>
万梦迷宫:
  定位: 大魔国两大秘境之一，位于梦魇庭地下深处，由璃眠以五万年梦道之力构筑

  环境:
    位置: 梦魇庭·梦境深渊更深处
    外观: 一座以梦境之力凝结而成的巨大地下迷宫。通道墙壁呈半透明的银紫色，像是凝固的梦境碎片，隐约可以看到墙壁深处流动着模糊的画面——那是被困在迷宫中的生灵留下的梦境残影。通道的形状和走向并不固定，每隔一段时间就会发生变化
    氛围: 踏入万梦迷宫的瞬间，外界的一切感知都会变得模糊。时间、方向、现实与幻象的界限在这里被彻底打碎。迷宫中回荡着低低的呢喃声，那是无数梦境残影交织在一起的声音，听久了会让人分不清哪些是真实的声音，哪些是自己脑中的幻听

  迷宫结构:
    外层·梦境走廊:
      深度: 入口至地下约百丈
      准入: 金丹期以上可尝试进入
      特点: 通道相对稳定，每隔一刻钟变化一次走向。墙壁中的梦境残影多为模糊的日常场景——花开花落、日升日落、人来人往。对精神力的消耗不大，但方向感会逐渐丧失。璃眠偶尔在此布置考验，筛选值得进入更深层的访客
      危险: 迷路。走廊会引导入侵者在原地打转直到灵力耗尽
      可得之物: 幻梦丝碎片、低品质梦境残液

    中层·噩梦领域:
      深度: 地下百丈至千丈
      准入: 元婴期以上方有存活的可能
      特点: 通道变化频率加快至数息一次。墙壁中的梦境残影变为入侵者本人的记忆和噩梦——你会看到自己最恐惧的场景、最痛苦的回忆在墙壁上如走马灯般播放。精神力弱者会被自己的噩梦吞噬，永远沉睡在迷宫中成为新的梦境残影
      危险: 噩梦侵蚀。你的噩梦会从墙壁中走出来攻击你，而且越战斗越多，因为恐惧本身就在不断产生新的噩梦
      可得之物: 高品质幻梦丝、中品质梦境残液、偶有被噩梦吞噬的修士遗留的法器

    深层·璃眠之梦:
      深度: 地下千丈以下
      准入: 化神期以上，且需璃眠认可
      特点: 这是璃眠的私人领域。通道不再变化，因为整个空间已经完全由璃眠的意志控制。这里不是迷宫，是璃眠五万年梦境的具象化——一个由她的记忆、情感和孤独构筑的世界。能看到什么，取决于璃眠想让你看到什么
      危险: 璃眠本人。在她的梦境中，她拥有近乎绝对的控制权
      可得之物: 天级梦境残液(仅璃眠赐予)、璃眠传承(极特殊情况)

  秘境规则:
    - 万梦迷宫没有固定的开放时间，入口在梦境深渊底部，需要找到被幻梦丝覆盖的特定裂缝
    - 进入迷宫后无法使用传送类法术或法器，唯一的出路是原路返回或走到迷宫的尽头
    - 迷宫中的时间流速与外界不同，在迷宫中的一天可能对应外界的数个时辰或数日
    - 在迷宫中死亡的修士不会留下尸体，而是化为迷宫墙壁中的新梦境残影

  与璃眠的关系: 万梦迷宫是璃眠的杰作，也是她的避难所。她把五万年的孤独和回忆都注入了这座迷宫。对她来说，万梦迷宫不是陷阱，是一座记忆的博物馆。但对外来者来说，别人的记忆就是最致命的武器
</万梦迷宫>
