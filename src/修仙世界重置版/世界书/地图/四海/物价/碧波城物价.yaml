<四海碧波城物价>
四海碧波城物价(四海最大仙坊):
  货币: 灵石通用，部分海族使用灵贝(1灵贝≈10下品灵石)
  日常:
    海兽肉(一斤): 2下品灵石
    灵鱼干(一斤): 5下品灵石
    淡水(一坛): 10下品灵石(海上稀缺)
    灵酒(一壶): 20~50下品灵石(从大陆运来)
  灵材:
    水灵石(下品): 8下品灵石
    灵珠级: 50~200下品灵石
    鲛人泪珠: 500~2000下品灵石(有价无市)
    鲛绡(一尺): 300~800下品灵石
    深海玄铁(一斤): 100下品灵石
    龙涎香(一两): 1000下品灵石以上
  丹药:
    辟水丹: 30下品灵石(海上必需品)
    避水珠: 200下品灵石
  法器:
    普通法舟: 500~2000下品灵石
    耐火法舟: 5000下品灵石以上
  服务:
    传送阵(至万象城): 100下品灵石/人
    海图抄本(局部): 200下品灵石
</四海碧波城物价>
