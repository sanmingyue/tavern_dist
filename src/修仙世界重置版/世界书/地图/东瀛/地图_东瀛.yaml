<东瀛>
东瀛:
  概况: 东方海外孤岛，四面环海，与大陆完全隔绝的封闭修仙文明。岛屿南北长约三百里东西宽约一百五十里，面积不及中央神州一个郡县。全岛被一层肉眼不可见的古老结界笼罩，结界由历代天皇以神血维系，外界修士无法感知岛屿的存在，岛内修士也无法穿越结界离开。东瀛修士误以为元婴期已是修炼的极限，不知外界修仙体系远比他们想象的庞大
  地理: 岛屿中央是一座终年积雪的灵峰，东瀛人称之为神岳，是全岛灵脉的汇聚点。灵峰周围是连绵的丘陵和山林，岛屿四周是平原和海岸。气候温润四季分明，春有樱花秋有红枫，冬有飞雪夏有萤火，灵气浓度远不及大陆但足以支撑岛内修士修炼到元婴
  结界: 上古时期由初代天皇以月之神血铸就的护国结界。结界以神岳为锚点覆盖全岛，需要历代天皇持续以自身神血供养。结界的存在保护了东瀛免受外界强敌侵扰，但也将整座岛屿封锁在认知的牢笼中。当代天皇月咏的神血是结界唯一的能源，她一旦离开皇城结界便会动摇

  政治格局:
    说明: 东瀛实行双重统治，名义上天皇是最高统治者，实际权力掌握在常夜幕府的将军们手中。伊势大社的神使作为精神领袖维系万民信仰，三方势力形成微妙的平衡
    天皇: 月咏，女天皇，金丹期圆满，被软禁于皇城。以自身月之神血维系国度结界，是高贵的囚徒
    幕府: 常夜幕府，由五大武家将军共同组成的军政集团。以"月咏神血维系结界不可中断"为由架空天皇权力，实际掌控东瀛军政大权已逾百年
    神宫: 伊势大社，东瀛唯一的信仰中心。神使浅间咲以元婴前期的修为冠绝全岛，是万民心目中圣洁的灯塔，也是月咏在囚禁中唯一的慰藉

  常夜幕府:
    说明: 东瀛的实际统治机构，总部设在皇城内城与外城之间的幕府殿。由五大武家将军轮值执政，每任执政将军称"大将军"，任期十年。五大武家各据一方，手握兵权，以维护结界安全为名把持朝政
    皇城: 神岳山脚东南方，东瀛最宏伟的建筑群。分为内城和外城，内城是天皇寝宫所在月咏被软禁于此，外城是幕府政务中心和五大武家在京的宅邸
    五大武家:
      织田家: 据守东瀛北部，以刀术闻名，当代家主织田信岳的修为是金丹后期，性情刚烈好战
      德川家: 据守东瀛东部，以阵法见长，当代家主德川秀隐的修为是金丹中期，老谋深算善于权衡
      丰臣家: 据守东瀛西部，以灵药炼丹著称，当代家主丰臣秀药的修为是金丹中期，重商轻武
      上杉家: 据守东瀛南部，以忍术和暗杀术闻名，当代家主上杉影月的修为是金丹初期，行事诡秘
      武田家: 据守神岳山腰，守护灵脉入口，当代家主武田守岳的修为是金丹后期，忠于古道尊崇天皇
    当代大将军: 织田家当代家主织田信岳，金丹后期，现任大将军，执政风格铁腕强硬
    幕府与天皇的关系: 五大武家以"保护天皇安全""维护结界稳定"为名限制月咏的自由。月咏的一切起居饮食均由幕府安排，名为侍奉实为监禁。五大武家之间也有明争暗斗，但在架空天皇这件事上立场一致

  伊势大社:
    说明: 东瀛唯一的信仰圣地，位于神岳山脚西侧的一片古老樱林之中。大社以千年灵木建造，建筑风格古朴庄严。神社内供奉着初代天皇留下的圣物"天照之镜"，据说镜中映照着东瀛结界的真正核心
    神使: 浅间咲，元婴前期，东瀛修为最高的修士。她是万民心中圣洁的灯塔，以温柔慈悲的姿态抚慰百姓。她与月咏秘密相恋百年，是月咏在牢笼中唯一的光
    神官团: 大社内有数十名神官，修为从炼气到金丹不等，负责日常祭祀和信仰维系。神官团名义上独立于幕府，实际上幕府安插了不少眼线
    信仰: 东瀛百姓信奉"天照大御神"，相信天皇是天照大御神在人间的化身。这份信仰是维系东瀛社会稳定的精神支柱，也是浅间咲肩上最重的担子

  町市与村落:
    说明: 东瀛的平民聚居区散布在岛屿各处。岛上最大的城镇是皇城脚下的常夜町，其余各地有大大小小数十个村落和集市
    常夜町: 皇城外围最大的城镇，商铺林立人烟稠密，是东瀛最繁华之地。茶屋、刀铺、药房、布庄一应俱全。凡人与低阶修士混居
    各地村落: 五大武家领地内各有村落，百姓以务农种茶养蚕捕鱼为生。灵田产出的灵稻和灵茶是东瀛修士的日常修炼辅助

  修为分布:
    说明: 东瀛修为整体偏低，最高仅一人达到元婴前期，金丹期修士屈指可数，绝大多数修士停留在炼气和筑基
    元婴期: 浅间咲(元婴前期)，全岛唯一
    金丹期: 月咏(金丹圆满)、五大武家家主(金丹初期至后期)、伊势大社首席神官(金丹初期)，约十人左右
    筑基期: 五大武家核心武士、神官团骨干、各地散修，约数百人
    炼气期: 五大武家普通武士、神官团普通成员、民间修士，约数千人
    凡人: 占东瀛人口绝大多数，约数万人

  特殊:
    封闭认知: 东瀛修士误以为元婴期已是修炼的极限，不知道外界还有化神、渡劫、真仙等更高的境界。他们的功法体系和修炼理念都以元婴为终点设计，这意味着即使有天资横溢者也会被认知限制住
    结界困局: 月咏的神血是结界唯一的燃料。她每日都要供给神血维系结界，长年累月导致她体质虚弱怕冷。如果月咏死亡或离开，结界将在数月内崩溃，届时东瀛将暴露在外界视野中，以岛内修士的实力根本无法抵御任何一个大陆宗门的觊觎
    秘密恋情: 月咏与浅间咲秘密相恋百年。圣女应当纯洁无私，天皇应当为国联姻，两人的关系在东瀛是绝对的禁忌。一旦暴露两人都将万劫不复
    武田家的暗流: 五大武家中唯有武田家暗中尊崇天皇，认为将军们架空天皇有悖古道。武田家主虽不敢公然对抗其余四家但暗中为月咏传递消息，是月咏在幕府内唯一的同情者

  区域分布:
    神岳山: 岛屿中央的灵峰，全岛灵脉汇聚点。山腰以上常年云雾缭绕积雪不化，武田家驻守山腰关隘。山顶有一处上古遗迹，传说是初代天皇铸造结界之处
    皇城区: 神岳东南山脚，包含皇城内外城和常夜町。东瀛政治经济中心
    伊势区: 神岳西侧山脚，以伊势大社为核心，古樱林环绕。信仰中心
    北方领地: 织田家领地，多山地和峡谷，民风彪悍。有刀匠村和铁矿
    东方领地: 德川家领地，沿海平原，农田广袤渔港繁忙。东瀛粮仓
    西方领地: 丰臣家领地，丘陵地带盛产灵药灵茶。有灵药集市
    南方领地: 上杉家领地，密林和湿地，地形复杂易于隐匿。有忍者修行地
    环岛海岸: 四面环海，海岸风光各异。北岸多礁石悬崖南岸多沙滩渔村。结界从海面一直延伸到海底

  秘境:
    神岳顶: 神岳山顶的上古遗迹，传说是初代天皇铸造结界之处。遗迹被厚重的禁制封印，数百年来无人能够进入。禁制上刻有上古文字，东瀛现有修士无人能解读。遗迹内可能藏有初代天皇的传承和结界的真正秘密
    海底龙宫残迹: 环岛海底深处有一处远古建筑遗迹，据传是上古海族留下的宫殿残骸。偶有渔民在风暴后从海中打捞出奇异的灵材，均来自这处遗迹。海底遗迹被结界覆盖，潜入极深处需要至少金丹期的修为
</东瀛>
