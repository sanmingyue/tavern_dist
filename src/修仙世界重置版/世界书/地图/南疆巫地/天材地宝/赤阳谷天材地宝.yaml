<南疆赤阳谷天材地宝>
南疆赤阳谷天材地宝(炎狱山):
  火晶石:
    品级: 黄级至玄级，视纯度而定
    产地: 炎狱山·赤阳谷矿区
    分布: 火山群内矿脉广泛分布，浅层矿脉储量大品质一般，深层靠近地火的矿脉纯度极高
    用途: 火道修炼辅材、炼制火属性法器、赤阳谷地火炼器坊的能源来源
    采集: 赤阳谷管控，外人需经许可。矿洞高温，筑基期以上方可作业
    备注: 南疆最大宗的矿产，熔金城常年有售
  炎髓:
    品级: 玄级至地级
    产地: 炎狱山·最深层火脉
    分布: 炎狱山地火核心处凝结的金红色液态矿物，产量极少
    用途: 炼制地级以上火属性法器的核心材料，赤阳谷镇宗之宝的炼器原料
    采集: 地火核心温度极高，元婴期以上方可进入
  地火精华:
    品级: 地级至天级
    产地: 炎狱山·地火核心
    分布: 地火核心处极偶尔凝结的金红色晶体
    用途: 炼制天级火系法器的核心材料、火道突破瓶颈的至宝
    采集: 地火核心化神期以下极度危险，赤阳谷视为镇宗资源
</南疆赤阳谷天材地宝>
