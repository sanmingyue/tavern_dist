<赤阳谷>
赤阳谷:
  势力定位: 正道强宗，火系炼器传承，中央神州南大门守卫者
  核心理念: 以火淬身，以锤铸道，刚烈不屈
  山门地点: 南疆北部边缘·炎狱山火山群

  核心人物:
    呼延战戈:
      修为: 真仙境六重天
      身份: 赤阳谷宗主，修仙界顶尖炼器宗师
      特点: 体修极致，双拳即是最强武器。出身南疆炎狱山矿工世家，五万八千年以体修之道配合炼器之术锻造自身
    烈凰儿:
      修为: 渡劫期前期（实际更强，藏锋）
      身份: 赤阳谷主母
      特点: 外柔内韧，火焰操控精细入微。是赤阳谷最深的底牌
    呼延明焰:
      修为: 元婴期
      身份: 赤阳谷少主
      特点: 一米八身高拿红色巨锤，实力远超同辈，与秦晚烟并称赤阳双美
    秦晚烟:
      修为: 元婴期
      身份: 赤阳谷内门大师姐
      特点: 冷静沉稳，精通控场和封锁，流焰长鞭"璃火"精准如手术刀

  势力特色:
    修炼方向: 火系功法为主，兼修体修与炼器之道
    弟子特征: 性格普遍刚烈暴躁，修炼极致火焰之力
    炼器传承: 赤阳谷锻造的法宝遍布修仙界，地火炼器坊是大陆顶级炼器之地
    战略价值: 火焰克制南疆蛊毒，是中央神州抵御南疆巫修蛊修入侵的天然屏障

  势力规模:
    核心弟子: 数千人
    外门弟子: 万余人
    附属城镇: 熔金城，南境主城
    炼器坊: 九百九十九间炼器室

  核心地点:
    赤阳谷山门:
      位置: 炎狱山火山群中央
      环境: 建筑皆由耐火灵材筑成，恢宏壮丽。终年火焰映照，远望如一座燃烧的城池
    地火炼器坊:
      位置: 山门西侧
      性质: 引动地底火脉，共设九百九十九间炼器室
      地位: 大陆顶级炼器之地，各宗门常来此定制法宝
    火脉丹炉:
      位置: 山门东侧地底
      性质: 九口巨炉以火山地火为能源，专供炼制火系丹药与淬体丹
    炎龙洞:
      位置: 炎狱山主峰深处
      性质: 火灵脉聚集的修炼圣地，洞内温度极高
      用途: 核心弟子闭关突破之所，凡人踏入瞬间化为灰烬
    炎狱山:
      位置: 南疆北部边缘
      性质: 南疆最大活火山群，终年喷发岩浆与火焰
      资源: 地火资源极其丰富，火系灵矿藏量巨大
    熔金城:
      位置: 炎狱山南麓
      性质: 南境主城，赤阳谷管辖
      特色: 城内炼器坊林立，灵矿交易繁荣。是南疆与中央神州之间最重要的贸易中转站
      人口: 约十万，修士与凡人混居

  对外关系:
    中央神州正道: 关系友好，是正道在南疆的桥头堡
    巫神教: 边境摩擦不断，火焰与蛊毒互克
    凛霜剑门: 冰火相克但互相尊重，有良性竞争
    药神谷: 友好，丹药与炼器互通有无
    幽血门: 世仇，经常血战

  特色资源:
    火系灵矿: 炎狱山出产的各类火系灵矿，品质上乘
    炼器材料: 耐火灵材、地火精髓、火山灵晶
    火系功法: 赤阳锻体诀等火系传承
    法宝: 赤阳谷锻造的法宝品质极高，供不应求

  路人NPC:
    铁锤:
      修为: 化神期后期
      身份: 地火炼器坊坊主，赤阳谷首席炼器师
      特点: 光膀子干活的壮汉，胳膊比寻常人腿粗。除了炼器什么都不关心，嫌跟人说话浪费炼器的时间
    赤霞:
      修为: 元婴期中期
      身份: 炎龙洞守护者
      特点: 沉默的红发女修，常年在炎龙洞中修炼，皮肤被火焰灼成古铜色。据说她已在洞中闭关三十年未出
    石火:
      修为: 金丹期后期
      身份: 熔金城城卫队长
      特点: 退役的赤阳谷外门弟子，左臂在一次与南疆蛊修的冲突中被蛊毒侵蚀截断，换上了赤阳谷打造的铁臂。办事认真，对城中治安铁面无私
    炭娘:
      修为: 筑基大圆满
      身份: 熔金城最大丹药铺"火丹居"掌柜
      特点: 三十来岁模样的妇人，面色红润，说话嗓门大。擅长炼制各类火系辅助丹药，价格公道货真价实
    阿铁:
      修为: 炼气初期
      身份: 地火炼器坊最小的学徒
      特点: 十岁出头的黑脸小子，矿工家的孩子。力气大得出奇，能徒手搬动百斤灵矿。梦想是打出一把跟宗主一样厉害的锤子
</赤阳谷>
