<生命之森>
生命之森:
  势力定位: 精灵族圣地，生命本源守护者，补天之道的根源
  核心理念: 守护生命本源与未来，万物有灵皆当珍视
  位置: 南疆深处，密林最茂盛之地

  核心人物:
    灵月曦:
      修为: 真仙境八重天
      身份: 精灵女王，生命之森至高守护者
      特点: 与生命古树同源，古树不灭则她不会真正消亡。温柔如春风，发怒时整片森林暴动
    木叶:
      修为: 筑基初期
      身份: 生命之森边缘成员，半精灵
      特点: 精灵与人族混血，半截尖耳，浅棕色带绿发。母亲为精灵猎手，因混血受族中排斥

  势力特色:
    种族构成: 精灵族世居，以血统纯净为荣，与外界往来极少
    修炼方向: 生命之道，自然之力，木系与治愈系功法
    社会结构: 精灵女王为至高统治者，下设长老议会辅佐
    传承方式: 精灵天生亲和自然灵气，以感悟天地为主要修炼方式
    对混血态度: 精灵族视混血为血脉玷污，虽女王下令禁止歧视但人心难管

  势力规模:
    精灵族人: 数万
    精灵战士: 数千
    长老议会: 七位长老

  核心地点:
    生命古树:
      位置: 生命之森最中心
      性质: 树龄万年以上的参天巨树，散发无尽生机。根系延伸极广，是世界生机的源头之一
      特殊: 树干深处有缓慢而有力的"心跳"，那是种树之人留下的生命脉动
      重要性: 古树枯萎之日便是世界走向毁灭的开始
    王庭:
      位置: 生命古树树冠之间
      性质: 精灵议事之地，由活体树木生长而成的宫殿群
      环境: 终年绿意盎然，花朵四季绽放，空气中弥漫甜润清香
    自然神殿:
      位置: 生命古树根部
      性质: 祭祀生命古树的殿堂
      用途: 精灵族重大节庆祭祀、新生儿觐见古树、战士出征前祈福
    圣泉:
      位置: 生命古树根部涌出
      性质: 生命之泉，泉水含有纯净生命灵力
      功效: 泉水可加速伤口愈合、净化毒素、延缓衰老。但对非精灵族效果减半
    密林外围:
      位置: 生命之森边缘
      性质: 精灵巡逻的缓冲地带
      禁制: 自然迷阵护林，外人踏入会在林中迷失方向，只有精灵族或获准者才能通行

  对外关系:
    药神谷: 灵魂知己，灵月曦与苏青檀情谊深厚，同修生命之道
    补天之道: 生命之森是补天之道的根源与希望
    巫神教: 保持距离，精灵族与巫族各有领地互不干涉
    南疆各势力: 极少主动来往，保持神秘与独立
    中央神州: 偶有正道宗门前来求取圣泉水或灵药，需经女王允许

  特色资源:
    圣泉水: 生命之泉的泉水，极其珍贵
    金阳花: 只在正午阳光最强时开放的金色灵花，花蜜能治愈几乎所有伤病，但花朵会"选择"采摘者
    生命之森灵木: 万年灵木，可用于制作顶级法器
    精灵灵药: 精灵族独有的灵药培育方法，产出的灵药药性温和持久

  路人NPC:
    翠叶:
      修为: 化神期初期
      身份: 精灵巡林长，负责生命之森外围巡逻防御
      特点: 严肃的精灵战士，绿发编成战辫，弓术精湛。对所有靠近森林的外族保持高度警惕
    露珠:
      修为: 金丹期中期
      身份: 圣泉守护者
      特点: 温柔的精灵女子，常年驻守圣泉畔。她能感知泉水的状态变化，据此判断古树的健康情况
    老根:
      修为: 元婴期大圆满
      身份: 长老议会末席长老，森林最年长的精灵之一
      特点: 看似年迈的精灵老者，皮肤上有树皮纹路。记忆力惊人，能讲述万年前的精灵族往事
    半夏:
      修为: 筑基后期
      身份: 自然神殿祭祀学徒
      特点: 年轻的精灵少女，对古树有着狂热的崇敬。每日在古树根部打坐冥想，试图感受古树"心跳"的含义
</生命之森>
