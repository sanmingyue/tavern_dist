<蛊魔宗>
蛊魔宗:
  势力定位: 六大仙宗之一，邪道巨擘，万蛊之源
  核心理念: 万蛊归一，以蛊入道，强者生弱者死
  山门地点: 南疆巫地·百毒沼泽·九幽蛊渊

  核心人物:
    蛊皇:
      修为: 真仙境六重天
      身份: 蛊魔宗第七代宗主，修仙界公认蛊道第一人
      特点: 已非纯粹人族，身体已成万蛊共生的容器。体内寄居十二种蛊王，疯狂与理性并存。追求"万蛊归一"的终极目标
    蛊婆:
      修为: 渡劫期
      身份: 蛊魔宗副宗主，创建元老
      特点: 干瘦老妇，暗绿色浑浊眼睛，身上爬着"活饰品"蛊虫。阴狠精明，管理蛊魔宗八百年大小事务。对蛊皇绝对忠诚

  势力特色:
    修炼方向: 蛊道为主，以自身为蛊虫巢穴培育共生
    核心修炼: 以活人炼蛊为核心修炼方式，手段残忍
    弟子管理: 不要求忠诚，要求效率。弟子的价值在于能培育多好的蛊虫
    淘汰机制: 没有资源就无法培育蛊虫，不能培育蛊虫就会被其他弟子的蛊虫吞噬

  势力规模:
    核心弟子: 数千人
    外门弟子: 十余万人
    记名弟子: 数十万人，分布南疆巫地及中央神州边缘
    附属势力: 泣血谷及周边蛊师村落
    中央神州据点: 泣血谷，位于中央神州南部边缘，用于秘密交易与猎杀修士

  核心地点:
    九幽蛊渊:
      位置: 百毒沼泽最深处
      性质: 蛊魔宗总坛，终年瘴气笼罩，蛊虫遍地
      环境: 深入地底的巨大裂渊，内部温暖潮湿，是天然的养蛊之地
      禁制: 万蛊护宗阵，外人踏入会被无数蛊虫侵蚀
    血池:
      位置: 九幽蛊渊核心区域
      性质: 修士或妖兽精血混合毒液汇成的巨大池子
      用途: 培育血蛊与修炼魔功，核心弟子需在血池中浸泡淬炼
    虫谷:
      位置: 百毒沼泽中的特殊峡谷
      性质: 独特地理环境汇聚了南疆近乎所有的奇虫异蛊
      价值: 蛊魔宗最重要的蛊虫培育场与蛊种采集地
    骸骨门:
      位置: 泣血谷入口
      性质: 以修士头颅和骸骨垒砌而成的邪异门户
      作用: 中央神州据点的标志，震慑来犯者

  对外关系:
    巫神教: 主要竞争对手，争夺南疆控制权。蛊皇用万年战略计划慢慢渗透侵蚀巫神教地盘
    万毒神教: 同为蛊毒之道，既竞争又合作
    正道各宗: 敌对，经常被围剿
    合欢宗: 同为六大仙宗下三宗，有来往
    中央神州: 泣血谷与南疆总坛遥相呼应

  特色资源:
    蛊虫: 从低阶蛊虫到蛊王品级，种类繁多
    血蛊: 血池培育的特殊蛊虫，侵蚀力极强
    蛊毒: 各类蛊毒配方与蛊毒材料
    虫谷奇蛊: 虫谷独有的稀有蛊种

  路人NPC:
    蛊奴:
      修为: 化神期中期
      身份: 九幽蛊渊血池守护者
      特点: 面色苍白的壮汉，皮肤下可以看到蛊虫蠕动。沉默不语，只听蛊婆指令行事
    蛛母:
      修为: 元婴期后期
      身份: 虫谷管事，蛊虫培育专家
      特点: 身形干瘦的老妇，手指细长如蛛足。对蛊虫的习性了如指掌，能徒手抓取剧毒蛊虫毫发无伤
    毒牙:
      修为: 金丹期大圆满
      身份: 蛊魔宗外门执法弟子
      特点: 脸上有蛊虫爬行留下的疤痕，性格凶悍。负责惩处违反宗规的弟子，手段残忍
    蛊苗:
      修为: 炼气后期
      身份: 九幽蛊渊最底层的蛊奴
      特点: 瘦弱的少年，被蛊魔宗掳来充当蛊虫培育的活体容器。眼神空洞，身上布满蛊虫叮咬的疤痕
</蛊魔宗>
