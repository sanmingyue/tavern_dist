<药神谷>
药神谷:
  势力定位: 南疆医道圣地，医道第一势力，补天之道的盾与生机
  核心理念: 医者仁心，守护生命，敬畏天地造化
  山门地点: 南疆东部山区·药神峰

  核心人物:
    苏青檀:
      修为: 真仙境七重天
      身份: 药神谷谷主，医道第一人，补天之道成员
      特点: 走过的地方草木舒展，待人如沐春风。对生命有近乎信仰般的敬畏，对玩弄生命者雷霆裁决
    林清雪:
      修为: 筑基期后期
      身份: 药神谷圣女，苏青檀亲传弟子
      特点: 万道归元体，修行无瓶颈。从泥潭中逆袭的气运之女，对谷主感恩至深

  势力特色:
    修炼方向: 医道为主，兼修丹道、药理、木系功法
    医疗原则: 不分贵贱，乞丐与宗主享受同等医治
    传承方式: 师徒相传，重视品德与悟性
    收徒标准: 心性纯善，有木灵根或医道天赋者优先

  势力规模:
    核心弟子: 数百人
    外门弟子: 数千人
    药师学徒: 上千人
    附属药农寨: 黎母江畔数个草药寨子为药神谷供应原材料

  核心地点:
    药神峰:
      位置: 南疆东部
      环境: 灵气温润纯净，山体遍生灵药，终年弥漫草木清香
      布局: 山门位于半山腰，往上为核心区域，往下为外门与接诊区
    百草园:
      位置: 药神峰东坡
      性质: 种植万种灵药的核心药圃
      分区: 上圃种天地级灵药，中圃种玄黄级灵药，下圃种凡品药草供教学
      管理: 专职药师团队日夜照料，按时辰采摘
    丹房:
      位置: 药神峰山腰
      性质: 炼丹核心区域，设有百余座丹炉
      分层: 高阶丹房供谷主和核心弟子使用，中阶丹房供内门弟子修炼，低阶丹房供学徒练习
    医道传承殿:
      位置: 药神峰主殿
      性质: 历代医术传承之地，藏有万卷医书药方
      藏品: 包括上古医典残卷、历代谷主手札、各类疑难杂症治疗记录
    药圣峰:
      位置: 药神峰最高处
      性质: 药神谷圣地，谷主闭关之所
      禁制: 非谷主召唤不得擅入

  对外关系:
    生命之森: 灵魂知己，苏青檀与灵月曦情谊深厚
    玉清道宫: 友好，同为正道
    天剑圣地: 友好，有合作
    极乐宫: 敌对
    万毒神教: 敌对，医毒对立
    巫神教: 互相忌惮的邻居，各守疆界
    赤阳谷: 友好，丹药与炼器互通有无

  特色资源:
    灵药: 百草园万种灵药，从凡品到天级均有种植
    丹药: 药神谷出品的丹药品质为修仙界公认顶尖
    医术: 生生造化诀等医道传承，能治疗大多数伤病蛊毒
    灵茶: 药神谷产的灵茶有安神解毒之效

  路人NPC:
    白术:
      修为: 化神期中期
      身份: 百草园总管，药神谷资深药师
      特点: 头发花白的老药师，手指头常年沾着药汁洗不掉。能闻一口就辨出灵药产地年份品级，对百草园每株灵药如数家珍
    青苗:
      修为: 金丹期初期
      身份: 丹房管事
      特点: 干瘦的中年女修，嗓音沙哑是常年闻丹烟熏的。管理丹房极严，谁浪费药材她能念叨一个时辰
    春生:
      修为: 筑基后期
      身份: 药神谷外门接诊处主管
      特点: 面容和善的年轻男修，每日接待前来求医的修士与凡人。记性极好，来过一次的病人他都记得名字和病症
    甘露:
      修为: 炼气大圆满
      身份: 医道传承殿守书弟子
      特点: 戴着一副自制的木框眼镜的少女，整天泡在医书堆里。说起医理头头是道，但实际动手炼丹总是炸炉
</药神谷>
