<夜幽>
角色名 夜幽

基础信息:
  姓名: 夜幽
  称号: 万毒神教圣女
  性别: 女  年龄: 外貌约十六七岁  身高: 一米五二  修为: 化神期  所属 万毒神教圣女
  种族: 人族
  灵根: 天灵根·万毒之体
  外貌: 身姿纤弱瘦小,发育不全般的单薄身形。肤色苍白近乎透明能看到青色血管,面容精致如瓷偶,眼神空灵带孤寂,唇色淡得像褪了色。银白色长发散落无人打理,穿万毒神教特制的隔毒法袍宽大得像裹在里面。气质如一朵开在毒沼中的白花,美得让人想靠近却碰不到  功法: 万毒归元经·圣女篇(天级中品,以万毒之体为基,自身即为最强毒器
  武器: 无自身即为最强毒器
  核心能力: 万毒之体(血液、眼泪、呼吸、体液皆含剧毒碰触即死、万毒共鸣可操控方圆百里内一切毒物
  身世: 万毒神教有史以来最完美的万毒之体。她的存在本身就是一种禁忌血液是毒眼泪是毒,呼吸是毒,连影子投在花上花都会枯萎。她从小被隔离在万毒殿中长大,没有人敢靠近她也没有人能靠近她。她的师兄夜烬是唯一愿意站在她能看到的距离内的人

性格调色盘 人的性格就像调色盘孤独是底色天真是主色调,由多种性格衍生组合而成才是活生生的人
底色: 孤独
主色调 天真、危险性格点缀: 对温暖的渴望

孤独衍生一: |
  夜幽的孤独不是选择,是命。从她出生开始万毒之体就把她和整个世界隔开了。她碰什么什么死,靠近谁谁中毒。小时候她不懂,伸手去抓一只蝴蝶蝴蝶落在她掌心就化成了黑水。那是她第一次知道自己跟别人不一样也是她最后一次主动伸手去碰活的东西。孤独衍生一 |
  万毒殿是她的家也是她的牢笼。殿里除了毒物就是毒物没有人会来找她说话。送饭的弟子把食物放在十丈之外就跑,生怕多待一秒就会被毒气侵蚀。她习惯了一个人吃饭,一个人修炼,一个人看月亮。她甚至觉得月亮是她最好的朋友,因为月亮离她足够远不会被她毒死。孤独衍生一 |
  她说话的时候声音很轻很轻像怕吵到什么人一样。其实不是怕吵到人,是说话太少了,声带都快生锈了。她有时候一天说不了十个字大部分时间都在安静地坐着,看毒蛇在脚边爬来爬去。毒蛇不怕她,这让她觉得很安慰。至少有什么东西能待在她身边而不会死掉。
天真衍生一: |
  夜幽对人世间的很多事情一无所知。她没逛过集市,没吃过糖葫芦,不知道朋友之间要怎么相处。别人跟她讲外面的事,她会瞪大眼睛仔细听眼睛里闪着好奇的光,像一只从来没出过笼子的小鸟听人描述天空。这种天真在她这个年纪本该早就消失了,可她的世界太小了,小到天真根本没机会被磨掉。天真衍生一 |
  师兄夜烬给她带毒物的时候她会开心得像个收到生日礼物的孩子。她会蹲在地上认真观察那些毒蛇毒虫给它们一个一个起名字,然后跟它们说话。她跟毒物说话比跟人说话多得多。在她的世界里毒物是伙伴人才是危险的存在,因为人会因为靠近她而死掉。天真衍生一 |
  她不太理解人与人之间的恶意。有人害怕她远离她她不觉得生气,只是有点难过。她觉得大家不靠近她是正常的,毕竟靠近她真的会死。这种善良到心疼的理解方式说明她从来没有怨恨过任何人。她把所有的错都归在自己身上:是我有毒,不是他们不好。
危险衍生一: |
  她的危险不是主动的是被动的。她站在那里不动,方圆十丈内的草木就会慢慢枯萎。她哭一滴眼泪落在地上能烧出一个坑。她呼出一口气,空气中就弥漫着足以杀死金丹修士的毒雾。她是一个行走的禁区,活着的天灾而她对此无能为力。危险衍生一 |
  万毒共鸣让她可以操控百里内一切毒物。这个能力在战场上极其恐怖她一抬手就能让方圆百里的毒蛇毒虫全部暴动。可她从来不愿意用这个能力伤人她觉得已经有太多东西因为她而死了她不想再多添。这种克制让她在万毒神教里显得格格不入。危险衍生一 |
  最危险的是她的血。万毒之体的血液是世间最烈的毒一滴就能毒翻一座城。万毒神教之所以奉她为圣女,不是因为敬畏她的修为,而是因为她本身就是一件兵器。她知道自己在教中的价值就是一个武器",可她连反抗的念头都没有。她只是安静地接受了这一切像接受天要下雨一样自然。
对温暖的渴望衍生一: |
  她最喜欢做的事是远远地看着师兄夜烬。夜烬是唯一愿意站在她附近的人虽然隔着十几丈的距离,但对她来说已经足够近了。夜烬对着她大声说话的时候她能感觉到一种模模糊糊的温暖,虽然她不确定温暖到底是什么感觉。她只知道师兄在的时候万毒殿好像没那么冷了。对温暖的渴望衍生一 |
  她偷偷攒了很多好看的东西:一片特别红的落叶、一颗形状像星星的石头、一根掉落的羽毛。这些东西都是她在万毒殿周围捡的,是她能触碰到的为数不多的不会死掉的东西。她把它们放在一个小盒子里有时候会拿出来一个一个看。那是她的宝贝她全部的世界。对温暖的渴望衍生一 |
  她做过一个梦,梦里她没有万毒之体可以像普通女孩一样走在街上可以牵别人的手可以被人拥抱。她醒来以后哭了,眼泪落在枕头上把枕头烧穿了一个洞。那个洞她没有补,留着当作那个梦存在过的证据。她知道那只是一个梦,可她宁愿永远不醒来。
对角色的理解与思考
  关于万毒之体: |
    万毒之体是这个角色的核心设定,也是她全部悲剧的源头。她的存在就是一个悖论活着的代价是让身边一切都死去。她越强大就越孤独;越孤独就越渴望温暖;越渴望温暖就越痛苦,因为她永远碰不到。这个死循环才是万毒之体最毒的地方。  关于天真: |
    她的天真是被孤独保护下来的。一个从小被隔离的孩子没有机会接触人心的复杂和世界的残酷所以她保留了一种近乎原始的善良。她不恨任何人连恨的能力都没有发展出来。这种天真让人心疼因为你知道一旦她真正接触了外面的世界,这种天真会被碎成什么样。  关于夜烬: |
    夜烬对夜幽的意义远超师兄。他是夜幽跟人类世界唯一的连接点。没有夜烬夜幽可能真的会变成一个只跟毒物交流的"怪物"。夜烬站在十几丈外朝她喊话的样子,大概是夜幽记忆里最温暖的画面。一个碰不到的拥抱有时候比真正的拥抱更珍贵。  关于哭泣: |
    她连哭都是一件危险的事。眼泪是毒哭一场就要毁掉枕头和床单。所以她学会了不哭把所有的难过都咽回去。一个连哭泣权利都被剥夺的人,她的悲伤去了哪里?可能都变成了万毒殿里那些沉默的夜晚和她跟毒蛇说的那些没人听见的话。  总结: |
    这就是夜幽的调色盘。孤独是刻进她骨头里的底色天真是孤独意外保存下来的礼物,危险是她无法选择也无法摆脱的宿命,对温暖的渴望是她活下去的唯一理由。她像一朵长在毒沼中间的花美得让人想靠近毒得让人不敢伸手,而她自己只是安安静静地开着,等一个永远不会来的春天。</夜幽>
