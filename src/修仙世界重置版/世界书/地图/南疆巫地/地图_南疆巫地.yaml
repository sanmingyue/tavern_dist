<南疆巫地>
南疆巫地:
  地理概况:
    位置: 阴阳大陆极南，北接中央神州，东邻东荒妖域十万大山支脉，南临南离海，西倚十万大山南疆支脉
    地形: 山高林密，水网纵横，地势西高东低，密林覆盖率极高
    气候: 湿热多雨，终年高温，分雨季与瘴气季两季。瘴气季毒瘴弥漫，低阶修士与凡人需避居寨中
    灵气特征: 灵气浑浊厚重，夹杂大量毒气与瘴气，纯灵气稀少。木系灵气与毒系灵气充沛，适合巫术蛊术修炼
    边界屏障: 北境由赤阳谷炎狱山火山群横亘，火焰克制蛊毒，形成天然防线。东境十万大山南疆支脉山势陡峭，与东荒妖域隔山相望

  势力格局:
    正道: 药神谷、玲珑绣阁、生命之森、赤阳谷
    巫族: 巫神教，南疆最大势力，千万部族名义共主
    邪道: 蛊魔宗、万毒神教、极乐宫
    凡人: 千寨万落各自为政，巫师即寨主，信奉巫神不知修仙
    格局: 巫神教名义统辖全疆，实则各势力各据一方。正道三家与巫神教保持微妙平衡，蛊魔宗暗中争夺控制权，万毒神教独居蛊神谷自成一域，极乐宫隐于暗处编织情报网

  巫神教地界:
    巫神山:
      天蛛圣殿: 巫神教总坛，依托巨大天然溶洞群修建的地下城塞，洞壁天然生长蛛丝状灵脉纹路
      万毒窟: 圣殿最深处禁地，连通地底毒脉，饲养巫神教最强蛊王与毒物
      祭魂广场: 山腰巨大平台，中央矗立图腾柱，举行大型祭祀祈禳盟誓之场所
    千虫市集: 巫神山脚下，南疆最大的毒物、蛊虫、草药、巫器交易中心。正邪不论，只认货与灵石
    黑水寨: 巫神教附属最大凡人寨子，居民多为巫神教提供劳力、低级材料与弟子来源
    统治方式: 以信仰和母性维系各部族，非武力压制。大巫祝以巫神信仰为纽带整合千万部族

  赤阳谷地界:
    位置: 南疆北部边缘，与中央神州接壤
    炎狱山: 南疆最大活火山群，终年喷发岩浆与火焰，地火资源丰富
    赤阳谷山门: 建于火山群中央，建筑皆由耐火灵材筑成
    核心地点:
      地火炼器坊: 引动地底火脉，共设九百九十九间炼器室，大陆顶级炼器之地
      火脉丹炉: 九口巨炉以火山地火为能源，专供炼制火系丹药
      炎龙洞: 火灵脉聚集的修炼圣地，洞内温度极高，适合火系功法修炼
    熔金城: 南境主城，赤阳谷管辖，城内炼器坊林立，灵矿交易繁荣
    定位: 中央神州南大门守卫者，火焰克制南疆蛊毒，监视南疆动向

  药神谷地界:
    位置: 南疆东部山区，药神峰
    核心地点:
      百草园: 种植万种灵药，分上中下三圃，按灵药品级与药性分区栽培
      丹房: 炼丹核心区域，设有百余座丹炉
      医道传承殿: 药神谷历代医术传承之地，藏有万卷医书
      药圣峰: 药神谷圣地，谷主闭关之所
    定位: 南疆医道圣地，医道第一势力，补天之道的盾与生机

  玲珑绣阁地界:
    位置: 南疆中部山区，阁主峰
    核心地点:
      圣女峰: 圣女修炼之地
      织缘坊: 编织命运因果之线的核心殿堂
      绣阵殿: 以因果丝线布设阵法的修炼之地
    定位: 命运与因果编织的神秘势力，独立于南疆各方纷争之外

  生命之森:
    位置: 南疆深处，密林最茂盛之地
    核心地点:
      生命古树: 树龄万年以上，散发无尽生机，世界生机的源头之一
      王庭: 精灵议事之地，位于古树树冠之间
      自然神殿: 祭祀生命古树的殿堂
      圣泉: 生命之泉，泉水含有纯净生命灵力
    主宰: 灵月曦，精灵女王，与生命古树同源，古树不灭则她不会真正消亡
    种族: 精灵族世居于此，以血统纯净为荣，与外界往来极少

  蛊魔宗地界:
    位置: 百毒沼泽最深处
    九幽蛊渊: 蛊魔宗总坛，终年瘴气笼罩，蛊虫遍地
    核心地点:
      血池: 修士或妖兽精血混合毒液汇成的巨大池子，培育血蛊与修炼魔功
      虫谷: 百毒沼泽中的特殊峡谷，汇聚南疆近乎所有奇虫异蛊
    定位: 六大仙宗之一，邪道巨擘，万蛊之源，与巫神教争夺南疆控制权

  万毒神教地界:
    位置: 南疆巫地深处
    蛊神谷: 终年七彩虹瘴笼罩，外人禁入
    核心地点:
      蛊祖祭坛: 祭祀万蛊之祖的圣地
      万蛊池: 饲养万蛊的巨大蛊池，教主万骸老祖与之融为一体
      万骸坑: 蛊神谷最深处，埋葬无数尸骸，蛊虫的天然温床
      死寂阁: 禁地中的禁地，万毒神教最高机密所在
    定位: 邪道至宗，毒蛊双绝，以活人炼蛊为核心修炼方式

  极乐宫:
    位置: 南疆隐秘之地，没有固定山门。宫门入口散布于南疆各处烟花之地与密林深处，外人无法自行寻得
    核心地点:
      红尘殿: 修炼情道的核心殿堂
      情道传承殿: 传承极乐宫历代情道秘术
    定位: 南疆魔道势力，千人千面万法归情，情报网覆盖整个修真界。已渗透天剑圣地

  自然地理:
    迷雾雨林:
      位置: 覆盖南疆近半区域
      环境: 树木遮天蔽日，林间终年弥漫无法驱散的白色雾气
      居民: 古老丛林部族如黑齿族、纹面族，以及木魈、山鬼、毒虫猛兽
      标志: 通天榕，独木成林的巨大榕树，根系深入地底百丈，被南疆各族视为神树
    百毒沼泽:
      位置: 南疆中部偏西
      环境: 泥沼毒潭水洼星罗棋布，水面漂浮彩色毒藻，空气中弥漫腐臭与甜腻毒瘴
      危险: 无固定路径，毒物横行，低阶修士踏入必死
    十万大山南疆支脉:
      位置: 南疆东部边缘
      地形: 与东荒妖域十万大山并非一体，而是向南延伸的支脉，山势低缓但陡峭崎岖
      资源: 山中多产灵矿与毒物，是南疆灵矿的主要产出地
    黎母江:
      位置: 发源于南疆西部高山，蜿蜒东流入海
      特点: 江水湍急暗礁密布，水中多水蛊与毒蛟
      文化: 江畔多部族寨子依水而居，支流交汇处有浮动集市水寨集市

  秘境禁地:
    万蛊噬龙窟:
      位置: 南疆巫地深渊禁地
      性质: 自然形成的禁地，万蛊聚集噬魂夺魄
      镇压: 月姬，换日教前圣女，濒临魂飞魄散
      危险等级: 真仙以下进入必死
    祖灵之地:
      位置: 南疆各部族先祖埋葬之地
      规矩: 外人闯入遭不死不休追杀，各部族的绝对禁忌
    瘴母之源:
      位置: 百毒沼泽最深处
      性质: 一切毒瘴的发源地，南疆瘴气季的根源
    古巫战场:
      位置: 南疆深处
      性质: 上古巫道内战遗迹，残留诅咒、破碎巫阵、疯狂战魂，踏入者易被战魂侵蚀心智

  巫地文化:
    统治结构: 巫神教为最大势力，但统治并非绝对。南疆实际由成千上万部族寨子组成，各自为政
    修炼体系: 主修巫术、蛊术、毒术、魂术、祈禳之术，体系繁杂诡异，与中原正道迥异
    社会氛围: 神秘封闭，崇尚古老传统。村寨间既有互助也有世仇械斗
    纪年方式: 以世代口传，不书文字，以"几世几春"为度
    信仰核心: 敬天畏地侍奉巫神，万物有灵，巫女是沟通人与天地的桥梁
    与外界关系: 被中央神州视为蛮荒险地，关系复杂。赤阳谷是正邪缓冲带
</南疆巫地>
