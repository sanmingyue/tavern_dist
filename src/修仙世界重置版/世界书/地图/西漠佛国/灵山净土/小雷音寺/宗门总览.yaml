<小雷音寺>
小雷音寺:
  基本信息:
    名称: 小雷音寺
    定位: 西漠佛国统治者，佛门净土，天下佛子朝圣之地
    位置: 西漠佛国·灵山九峰
    方丈: 无尘禅师，真仙境六重天
    势力等级: 与六大仙宗同级的超然势力，连上三宗都给予尊重

  核心理念:
    宗旨: 慈悲为怀，普度众生
    修行方向: 锤炼金身凝聚舍利，注重功德积累和心性修炼
    对外态度: 超然中立，不主动参与正邪纷争，但绝不退让魔道侵犯

  修炼体系:
    佛法修炼: 以大日如来真经为核心，锤炼金刚不坏之体，凝聚舍利元神
    心性修为: 佛门修行注重心境与修为并进。心境不到境界再高也无法突破，这与其他宗门以灵气修为为主截然不同
    佛光神通: 梵音、法相、佛光、金刚掌、净世琉璃火等佛门独有神通
    特殊传承: 大日如来真经为镇寺佛法，天级上品。全本仅方丈和特选弟子可修。基础篇向所有弟子开放

  组织架构:
    方丈: 无尘禅师。西漠佛国精神与世俗的双重领袖，掌管一切大事
    长老院:
      说明: 五位高僧组成，辅佐方丈处理寺务，各管一方
      成员:
        慧心: 戒律长老，掌管戒律堂，小雷音寺有史以来唯一女性长老
        法源: 首座长老，主持寺中法会和日常修行安排
        持经老僧: 藏经长老，守护藏经峰三万年，从不离峰半步
        明镜: 药师长老，主持莲华峰药师殿，精通佛门医术
        觉远: 梵音长老，主持梵音峰梵音殿，佛音之道传承者
    罗汉堂: 十八罗汉，寺中最强战力梯队。每一位都是金丹期以上修为的精锐武僧，承担护寺和对外征伐职责
    武僧堂: 法海任教头，统管全寺武僧训练和焚魔战线僧兵调度。武僧堂弟子以金刚峰为主殿
    俗务院: 管理寺外事务，包括琉璃城行政、各地分寺协调、信众事务。由一位元婴期长老主持
    外院弟子: 散布在各地分寺和绿洲小庙中传法的僧人，修为参差不齐

  势力规模:
    僧人总数: 三十余万，含灵山主寺和各地分寺
    灵山主寺: 约两万僧人常驻，含武僧堂三千人
    各地分寺: 散布在西漠各绿洲和凡人聚居点，每寺数十至数百人不等
    信徒: 西漠绝大多数凡人都信奉佛门，总计数十亿
    僧兵: 焚魔战线常驻僧兵约五千人，由武僧堂统一调度

  核心地标:
    大雄宝殿: 灵鹫峰顶金顶寺庙。殿内供奉一尊以佛骨舍利雕成的古佛像，据说是上古佛祖留下的本源法身。方丈在此主持重大法会和接见来客
    菩提净土: 灵山东麓封闭修行区，种满数千年菩提古树。弟子在菩提树下打坐修行能加速感悟佛法，是闭关突破的圣地
    藏经阁: 藏经峰独占一座山峰。收藏上古至今佛门典籍数十万卷，按佛法、医术、阵法、炼器、丹道分类存放。部分上古孤本设有禁制，需持经老僧许可方可阅览
    金刚伏魔阵: 环绕灵山的护山大阵。由历代高僧以佛力维持，阵法核心分布在九峰的九处阵眼中。可抵御真仙境以下任何攻击，是小雷音寺的最后防线
    万佛窟: 灵山西麓石窟群。数千石窟中雕刻万尊佛像，每尊佛像都被注入佛力。紧急时可化金刚力士护寺，是小雷音寺最大的底牌之一
    八宝功德池: 灵鹫峰半山腰的天然泉池，池水由灵脉暗河汇聚而成。池水可涤荡业力、净化魔气、疗愈伤势。水量有限，仅供方丈特许之人使用
    苦行沙海: 灵山外围环形沙漠地带。布满幻阵和心魔考验，行走其中会经历内心最深处的执念。通过苦行沙海是低阶弟子晋升的必修考验

  特色资源:
    舍利子: 高僧圆寂后留下的佛力结晶，品质越高佛力越纯。可入药可炼器可辅助修行
    佛光石: 灵山附近特产矿石，蕴含纯净佛力，是炼制佛门法器的上等材料
    贝叶经书: 以菩提叶为纸张书写的佛法经文，比普通纸张耐久百倍且能承载佛力加持
    佛门法器: 佛珠、禅杖、金刚杵、法铃等。小雷音寺炼制的佛器在西漠声名远播
    八宝功德池水: 极为珍贵的圣水，对佛门修士有奇效，对魔道修士则有净化作用
    菩提子: 菩提古树结出的果实，服用可清心明神辅助突破心境瓶颈

  对外关系:
    与幽冥魔宗: 数万年宿敌，焚魔战线佛魔对峙的核心。无尘禅师与焚天交手无数次，互相了解到骨子里
    与中央神州正道: 关系友好，天剑圣地和玉清道宫常有高僧往来论道
    与东荒妖域: 保持距离但不敌对，偶有妖族高手上灵山求法
    与南疆巫地: 关系微妙，佛门与巫族修行理念相去甚远
    与万宝楼: 默许其在绿洲带的商业活动，但不知晓万宝楼已被梵楚控股的秘密
    超然中立: 不主动参与六大仙宗之间的纷争，不选边站队。但若有大规模魔道入侵，会出手援助正道

  弟子日常:
    晨课: 天未亮即起，灵鹫峰钟声响彻九峰。全寺弟子集体诵经一个时辰
    修行: 上午修炼功法打坐参禅，下午习练武艺或学习佛学经典
    劳作: 寺中倡导劳作修行，弟子需轮流承担挑水、扫地、种菜、做饭等杂务
    化缘: 外出化缘和行脚是佛门修行的重要组成。弟子每年须外出行脚至少一月
    试炼: 每三年举行一次弟子大考，包括苦行沙海试炼、佛法问答、武技比试
    医疗: 药师殿面向所有人开放，凡人和修士皆可求医。这是小雷音寺与世俗联系的重要纽带

  特殊设定:
    "先救再问": 无尘禅师立下的铁规。任何人到了小雷音寺地界，不论正邪，先救再问。魔族探子也是人也会受伤，先救活再审问
    佛门逐出: 犯下重戒的弟子会被逐出佛门，但不会被追杀。被逐者多流落到焚魔战线的灰色聚落中
    行脚修行: 佛门弟子修到一定境界后必须外出行脚，用双脚丈量世界。净尘便是行脚修行中最执着的一个
</小雷音寺>
