<西漠魔道功法>
西漠魔道功法:
  核心功法:
    寂灭魔经:
      品级: 天级上品
      传承: 幽冥魔宗镇宗魔功，焚天自创
      修炼方向: 以寂灭之力毁灭一切
      层次: 入门篇、噬灵篇、灭世篇、寂灭篇
    血煞天魔功:
      品级: 天级下品
      传承: 幽冥魔宗战伐长老一脉
      修炼方向: 以杀伐为修行，越战越强
  魔道神通:
    幽冥鬼火: 地级上品，召唤阴冷鬼火灼烧灵魂
    灭世魔瞳: 天级下品，精神攻击
    噬魂之术: 地级中品，吞噬他人灵魂
    血煞天劫: 天级中品，大范围攻击
  魔道阵法:
    深渊魔阵: 天级上品，以黑石深渊魔气为动力
</西漠魔道功法>
