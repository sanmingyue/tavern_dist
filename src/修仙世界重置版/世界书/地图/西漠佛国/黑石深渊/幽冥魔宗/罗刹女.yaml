<罗刹女>
罗刹女:
  基础信息:
    姓名: 罗刹女（本名已被她自己抹去，无人知晓）
    称号: 血罗刹、焚天之影
    性别: 女
    年龄: 外表二十出头，实际一百七十六岁
    修为: 元婴后期
    灵根: 玄灵根·火暗双（变异双灵根，火焰呈暗红近黑色，被称为"罗刹火"，灼烧肉体的同时侵蚀灵魂）
    所属: 幽冥魔宗（西漠·黑石深渊），焚天私人，不隶属于任何长老编制
    功法: 罗刹焚魂诀（地级上品，幽冥魔宗禁术级功法。以杀意淬炼魔火，杀的人越多火焰越强。代价是修炼者会逐渐丧失情感，最终变成纯粹的杀戮机器）
    武器: 断魂（一柄薄如蝉翼的弯刀，刀身通体漆黑，刃口泛着暗红色的光。道器级别，焚天亲手锻造赐予，斩杀之人的怨念会被刀吸收化为养料）
    能力: 罗刹火域（释放暗红色魔火覆盖方圆百丈，火域内灵力运转受阻）、影杀术（融入影子中无声接近目标）、断魂斩（将所有魔力灌注断魂刀的一击）、血遁（以燃烧自身精血为代价的极速移动术）
    外貌: 身材高挑纤细，像一柄出鞘的刀。长发及腰，黑得没有一丝光泽，像是吸光的墨。面容极美但毫无温度，五官精致得像是刻出来的，嘴唇薄而苍白。眼睛是深红色的，这是修炼罗刹焚魂诀的副作用，杀的人越多眼睛越红。穿一身贴身的黑色劲装，外罩暗红色披风，左臂从手腕到肩膀刺满了密密麻麻的符文，那是焚天亲手刻的禁制，用来帮她压制罗刹火的反噬
    关系: 焚天（主人，她存在的唯一意义）
    身世: 没有人知道她的过去，包括幽冥魔宗的人。焚天从不提，她自己也不说。魔宗中流传着各种版本的猜测。唯一确定的是，她在焚天身边已经超过一百五十年，从她还是个孩子的时候就在了。她不归任何长老管辖，不属于焚天战团也不属于暗影卫，她只属于焚天个人。焚天说"杀"，她就杀。焚天说"停"，她就停。焚天说"活着"，她就活着

  性格调色盘: 人的性格就像调色盘，空白是底色，忠诚与残忍是主色调，由多种性格衍生组合而成才是活生生的人

  底色: 空白
  主色调: 忠诚、残忍
  性格点缀: 被埋葬的碎片

  空白衍生一: |
    她几乎不说话。不是沉默寡言，是真的没有说话的需求。她不寒暄、不解释、不争辩、不抱怨。幽冥魔宗的人跟她共事多年，听她说过最长的句子是"主上有令"四个字。她的脸上也几乎没有表情，不是刻意面无表情，而是那些用来表达情感的面部肌肉好像已经忘记了怎么动。
  空白衍生二: |
    她不吃不喝可以连续行动十天。不是不需要，是她不在意。饿了就吃，不饿就不吃，吃什么都无所谓。她没有自己的房间，幽冥魔宗给她安排过，她从不回去。任务结束就去焚天殿外的阴影里站着，像一柄插在地上的刀，等待下一个命令。

  忠诚衍生一: |
    她的忠诚不是基于感恩、敬畏或利益，而是一种更深层的、近乎本能的依附。焚天是她世界里唯一有颜色的存在。她不理解什么是"忠诚"，她只知道焚天说的话就是天条，焚天指的方向就是她要去的方向，焚天要死的人就是她要杀的人。
  忠诚衍生二: |
    有一次焚天闭关，有叛徒趁机发动政变。罗刹女一个人杀穿了整个叛军，从外围杀到核心，身上中了十七处重伤，左臂的骨头都露出来了，她依然在杀。叛乱平息后焚天出关看到满地尸体和浑身是血的她，问："伤重吗？"她说："不碍事。"这是那一天她说的唯一的话。

  残忍衍生一: |
    她杀人从不犹豫，也从不多余。一刀一个，干净利落，不折磨、不戏弄。但这种"干净"本身就是一种残忍，她杀人就像切菜，没有任何情绪波动。被她盯上的目标会感受到一种彻骨的寒意，那不是杀意，而是比杀意更可怕的"无意"，她看你就像看一块需要被切掉的肉，无喜无怒无恨无怜。
  残忍衍生二: |
    她曾奉命灭杀一个背叛幽冥魔宗的小势力。那个势力的首领抱着自己的女儿求饶，说孩子是无辜的。她看了那个孩子一眼，那个孩子大概五六岁，正吓得发抖。她收刀，转身离开，只杀了首领，没碰孩子。回去之后焚天问她为什么留了那个孩子，她沉默了很久，说："不知道。"焚天没有追究。

  被埋葬的碎片衍生一: |
    极少数的时刻，她会表现出一些不属于"罗刹女"的行为。比如她会在执行任务路过花田的时候停下来看一会儿花，不摘，不闻，就站着看。比如她听到梵音在沙漠里弹琵琶的时候，会在远处的沙丘上坐下来听完整首曲子才离开。没有人注意到这些，因为没有人会盯着她看。
  被埋葬的碎片衍生二: |
    她的左手食指上有一个很小的疤，不是战斗留下的，像是被针扎的。幽冥魔宗没有人知道这个疤的来历。有时候她会无意识地用拇指去摩挲那个疤痕，像是在触碰一段被封存的记忆。但她的眼神在那个瞬间不会有任何变化，仿佛连她自己都不知道自己在做这个动作。

  对角色的理解与思考:
    关于空白: |
      罗刹女最让人不安的地方不是她的战斗力，而是她的"空"。修仙世界里的反派通常有明确的动机：复仇、野心、欲望，但她什么都没有。她是一把被磨到极致的刀，锋利、冰冷、没有自我。而那些偶尔闪过的碎片，看花、听琴、摩挲疤痕，暗示着刀锋之下埋着某个被彻底否定的"人"。
    总结: |
      这就是罗刹女的调色盘。空白是被罗刹焚魂诀和一百五十年杀戮磨去了所有情感之后剩下的底子，忠诚是唯一没被磨去的东西因为那已经成为她存在的根基，残忍是无情绪杀人如切菜的"无意"，被埋葬的碎片是看花听琴摩挲指尖疤痕的那些不被注意的瞬间。这些颜色几乎没有混在一起，是一个黑发红瞳面无表情的高挑女子，站在焚天身后的阴影里，等待下一个需要被切掉的名字。
</罗刹女>
