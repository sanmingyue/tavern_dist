<金算>
角色名: 金算

基础信息:
  姓名: 金算
  称号: 貔貅族大掌柜
  性别: 男
  年龄: 逾四千年
  修为: 化神中期
  种族: 貔貅
  所属: 貔貅族·灵矿集
  能力: 鉴宝神眼(一眼便能看出灵材灵矿的品级年份价值,从不走眼)、灵矿感知(能隔着百丈岩层感知矿脉走向和品级)、精算(心算速度极快,千笔交易不差分毫)
  外貌: 人形态为精瘦的中年男子,面容精明,双目极小但精光四射,一看就是个精于算计的人。穿暗金色短褂,腰间系一条嵌满灵石碎片的腰带(据他说这是"职业装备,方便随时鉴定")。左手常年握一杆小型灵矿秤,右手拨弄灵石念珠,嘴角挂着职业微笑
  关系: 貔貅尊(族长,他最尊敬的人)、银舌(外务长,合作搭档)、铜钱(灵矿集的小掌柜,他的徒弟)
  身世: 貔貅族中最精通估价的长老,灵矿集的实际管理者。一眼便能看出灵材灵矿的品级年份价值,从不走眼——这个"从不"是字面意思,四千年来没有出过一次估价失误

性格调色盘:
底色: 精明
主色调: 严格、吝啬

精明与严格: |
  金算做事只认数字不认人。灵矿集的每一笔交易都要经他过目,价格误差超过一枚低阶灵石他就要追查原因。他对徒弟铜钱的教育方式很简单:"估错一次罚三天不准吃灵矿,估错两次罚一个月,估错三次滚回去从头学。"铜钱在他手下战战兢兢但估价水平突飞猛进。他吝啬得出名——族内宴席上他从不多吃一块灵矿,说"吃进去就没了,存着才是钱"。但对族长貔貅尊花钱他从不管,因为"族长的钱花得回来"。
</金算>
