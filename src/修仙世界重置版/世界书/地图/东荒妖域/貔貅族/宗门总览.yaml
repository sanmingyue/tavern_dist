<貔貅族>
貔貅族:
  定位: 辟邪聚财之瑞兽，东荒最富裕的妖族，妖域中罕见的重商之族
  位置: 东荒妖域中部偏东·灵矿富集的聚宝山。山体内蕴藏大量灵矿灵石，山外碧草如茵看不出富裕，山内洞穴中堆满珍宝

  核心理念: 吞万物而不泄，聚百财而守信。貔貅族以灵矿灵石为食，天生拥有辟邪之力。性贪财但重信誉，交易从不赖账

  族长:
    名号: 貔貅尊
    种族: 貔貅
    修为: 真仙境三重天
    身份: 貔貅族至高族长
    说明: 龙首狮身口大无肛，体型庞大如小山。吞噬灵矿灵石如饮水吃饭。性情贪婪但极守信用，凡与貔貅尊做过交易的妖族都承认其一诺千金。东荒妖域中最富裕的存在，藏宝洞中的宝物据说能铺满整座聚宝山

  核心成员:
    大掌柜: 金算，化神中期，貔貅族中最精通估价的长老。一眼便能看出灵材灵矿的品级年份价值，从不走眼
    护宝使: 铁口，化神初期，貔貅族防务长老。负责守护藏宝洞，在洞口蹲了三千年不曾挪步
    外务长: 银舌，元婴大圆满，貔貅族中最善交际者。负责与各族洽谈交易，口才了得

  貔貅族核心:
    藏宝洞: 貔貅族世代积攒的宝库，位于聚宝山最深处。洞中分门别类存放灵石、灵矿、法器、灵材、妖丹等珍宝，数量之巨连貔貅尊自己也数不清。入口有七重禁制层层守护
    吞金窟: 以灵矿灵石为食的修炼之所，洞壁嵌满各类矿石。貔貅族在此吞噬灵矿提纯灵力，吞噬后排出的废渣反而是品质极高的灵沙，被各族争相收购
    辟邪台: 驱散邪祟的阵法核心，以貔貅族先祖辟邪之力为基础建造。聚宝山方圆百里内邪祟不侵，许多弱小妖族依附在聚宝山外围求取庇护
    灵矿集: 聚宝山山脚的灵矿交易集市，是东荒妖域中灵矿灵石交易量最大的场所

  与各族关系:
    万妖国: 朝贡最丰厚的族群，妖皇对貔貅族颇为满意
    各族: 与所有妖族都有交易往来，因信誉良好而受各族信赖
    螣蛇窟: 生意伙伴也是防范对象，螣蛇族的情报值钱但貔貅族也怕被偷窥家底
    噬荒教: 不做生意，噬荒教的信誉太差

  灵矿集常驻路人:
    铜钱: 金丹初期，貔貅族小掌柜。灵矿集中最忙碌的估价师，手持一杆铜秤整日称量灵矿。笑脸迎人但砍价时寸步不让
    石胆: 筑基大圆满，穿山甲妖，灵矿集的矿工头。带领一群小妖在聚宝山外围挖掘低级矿脉，靠卖矿给貔貅族为生
    珠儿: 炼气大圆满，蚌妖，灵矿集中卖珍珠的小贩。每颗珍珠都是自己体内孕育的，品质上乘但产量极低。性格温柔腼腆不善叫卖
    铁算盘: 筑基后期，蜘蛛妖，灵矿集的账房先生。以蛛丝编织账本记录每笔交易，记忆力惊人。手脚极多算账极快，谁也别想在他面前做假账
    啃石: 炼气后期，貔貅幼崽，还在学习分辨灵矿品级的小家伙。经常把普通石头当灵矿吞下去然后吐出来，被金算骂了无数次
</貔貅族>
