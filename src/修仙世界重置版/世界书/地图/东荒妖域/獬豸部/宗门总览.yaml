<獬豸部>
獬豸部:
  定位: 独角神兽獬豸一族，东荒妖域的执法者与审判者
  位置: 东荒妖域东南部·麒麟谷以东的铁角原。原上灵草低矮铁灰色的独角灵木成林，肃穆庄严

  核心理念: 明辨善恶，铁面无私。獬豸天生能辨忠奸，受万妖国委任巡查各族。即便妖皇的命令若有不公亦敢直谏

  部首:
    名号: 獬豸长老
    种族: 獬豸
    修为: 真仙境二重天
    身份: 獬豸部至高首领
    说明: 形如青牛独角如铁，双目可洞察一切谎言。性情刚正至极，不近人情也不通世故。曾当着妖皇的面指出其裁决不公，被妖皇怒斥但依旧不改口

  核心成员:
    副部首: 铁角，化神中期，獬豸族副首领。比部首稍圆滑一些，负责与各族周旋以免部首把所有妖族都得罪光
    巡察使: 明镜，化神初期，獬豸族执法巡查者。常年奔走于各族领地之间巡查执法，铁面无情
    审判官: 直言，元婴大圆满，獬豸族老者。负责在明镜台上主持审判，声如洪钟宣判不留情面

  獬豸部核心:
    明镜台: 獬豸族审判之所，以铁灰色灵石筑成的高台。台上立有一面天然形成的灵石镜面，据说谎言者站在镜前会现出原形
    铁角林: 独角灵木组成的森林，灵木笔直如铁角指天。獬豸族在此修炼辨识之道，林中有阵法可考验修炼者明辨是非的能力
    裁断崖: 处决罪妖之地，悬崖下万丈深渊。被獬豸族审判定罪的罪妖从此处推下，不死则视为天不绝其路
    执法营: 獬豸族日常驻扎之所，简朴整洁如军营。族人起居作息皆有严格规律

  与各族关系:
    麒麟谷: 最亲近的盟友，两族理念相近常联手行事
    万妖国: 受妖皇委任执法，但不完全听命于妖皇
    各族: 多数妖族对獬豸部又敬又怕，明面上不敢得罪但私下颇有怨言
    螣蛇窟: 最提防的势力，螣蛇族的情报网让獬豸部的巡查时常扑空

  执法营常驻路人:
    方正: 金丹中期，獬豸族巡查员。面方口阔一丝不苟，巡查时连路边的蚂蚁打架都要管。同族都觉得他过于较真但谁都说不过他
    铁笔: 筑基大圆满，獬豸族书记官。负责记录所有审判案卷，字迹方正如同刻版。从不收受任何好处，有人递来的东西一律推回去
    横眉: 筑基后期，獬豸族年轻巡查。刚入行火气极旺，见到不公之事就怒目圆睁。铁角常要按住他不让他当场动手
    老直: 金丹后期，獬豸族退役巡查。年迈退休后在执法营门口摆了张椅子，每天坐着给年轻人讲过去审判的案例。说教起来没完没了但句句在理
    黑犬: 炼气大圆满，猎犬妖，依附于獬豸部的追踪手。嗅觉极灵，专门负责追踪逃跑的罪妖。忠诚可靠，指哪追哪
</獬豸部>
