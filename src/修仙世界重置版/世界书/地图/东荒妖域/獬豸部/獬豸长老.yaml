<獬豸长老>
角色名: 獬豸长老

基础信息:
  姓名: 獬豸长老
  称号: 獬豸部至高首领、东荒执法者
  性别: 男
  年龄: 逾七万年
  修为: 真仙境二重天
  种族: 獬豸
  所属: 獬豸部·明镜台
  能力: 辨忠奸(天生能分辨一切谎言与伪装)、铁角触裁(独角触碰对象可强制显露其真实意图)、正气领域(方圆百丈内一切幻术隐匿失效)
  外貌: 本体形如青牛,独角如铁直指苍天,双目如两面铜镜可倒映一切真相。人形态为面容方正刚毅的中年男子,肤色青灰,额间有铁色独角印记。双目炯炯有神目光如刀,被他盯着看的人会不自觉地心虚。穿铁灰色法袍,不佩饰物不带法器——他自己就是最好的审判工具
  关系: 铁角(副部首)、明镜(巡察使)、直言(审判官)、玉麟(最亲近的盟友)、金翅大鹏王(曾当面指出其裁决不公)
  身世: 獬豸部至高首领,受万妖国委任巡查各族的执法者。獬豸天生能辨忠奸,他的这项能力更是强到了极致——不管你是千年老妖还是真仙境强者,在他面前说谎就会被当场揭穿。他曾当着妖皇的面指出其一项裁决不公,被妖皇怒斥仍不改口,最后妖皇不得不修改了裁决

性格调色盘:
底色: 刚正
主色调: 不近人情、固执

刚正: |
  獬豸长老的刚正到了令人窒息的地步。在他的世界里只有对和错,没有灰色地带。他审判不看身份不看背景只看事实——饕餮幼崽偷猎是错,妖皇裁决不公也是错。副部首铁角经常要替他善后,因为他把所有妖族都得罪了个遍,但他完全不在意。他说"我不是来交朋友的,我是来执法的"。
不近人情与固执: |
  他从不出席任何宴会社交,不接受任何礼物馈赠,不参与任何私下交易。有妖族试图用珍宝贿赂他免去审判,他不仅拒绝还把行贿者当场审判加罪。他的固执有时候近乎偏执——有一次一起纠纷双方各有理,铁角建议各打五十大板了事,他硬是花了三个月调查取证,非要查出谁对谁错不可。最后查出来确实是一方有错,他觉得这三个月花得值。麒麟谷的玉麟是唯一一个他会主动拜访的人,因为"玉麟的仁德与我的公正是一体两面"。
</獬豸长老>
