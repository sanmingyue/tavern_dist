<噬荒教>
噬荒教:
  定位: 邪道强宗，以吞噬掠夺与兽化改造闻名的邪修势力
  位置: 东荒妖域西部边缘·落日峡谷·荒魔堡

  核心理念: 噬尽荒野，强者为尊。弱肉强食是唯一法则，吞噬一切有价值的血脉与灵力化为己用

  教主:
    名号: 弥苍赦
    种族: 人族（半兽化状态）
    修为: 渡劫期后期
    灵根: 天灵根·兽
    身份: 噬荒教宗主，荒魔堡统治者
    功法: 荒体三炼
    说明: 详见弥苍赦单独文件

  核心弟子:
    苏翎霜: 化神初期，人族女修，弥苍赦亲传弟子。寒鹰兽化实验体，沉默寡言冷酷高效，是弥苍赦最满意的作品。半人半兽状态下战力远超同阶
    铁脊: 化神初期，人族男修，兽化实验体·熊类血脉。体型魁梧蛮力惊人，负责荒魔堡角斗场的管理。沉默寡言只听弥苍赦一人命令
    血牙: 元婴后期，人族男修，兽化实验体·狼类血脉。速度型战士，负责外出掠夺血脉资源。性情暴戾嗜杀成性
    骨刺: 元婴中期，人族女修，兽化实验体·蝎类血脉。毒道高手，负责调配兽血精华与毒药。阴沉狡诈善用毒计

  核心区域:
    荒魔堡: 落日峡谷深处的黑色要塞，由荒石筑成遍布兽骨装饰。峡谷终年血气弥漫，妖兽嚎叫不绝于耳
    角斗场: 荒魔堡中央的巨型圆形竞技场，弟子在此进行生死战斗训练。地面被鲜血浸透呈暗红色，看台上刻满了历代"优胜者"的名字
    兽血池: 荒魔堡地下的秘密区域，储存着各种妖兽血脉精华。弟子在此接受兽化改造，成功者获得力量失败者沦为废人
    万噬殿: 弥苍赦的修炼之所，殿内陈列着历年来吞噬的灵兽骨骸。殿门常闭，只有弥苍赦和苏翎霜可以进入

  与各族关系:
    万妖国: 名义上承认万妖国霸权但实际独立行事，偶尔向万妖圣城缴纳"贡品"以换取不被讨伐
    东荒妖族: 大多数妖族对噬荒教深恶痛绝，因其掠夺妖兽血脉。但畏惧弥苍赦实力不敢轻易招惹
    玄渊城: 噬荒教是玄渊城五大邪宗之一，在城中有一定势力和话语权
    人族修士: 噬荒教虽为人族邪修但身处妖域，处境微妙。既被妖族排斥也不受正道待见

  荒魔堡常驻路人:
    铁链: 金丹大圆满，人族男修，角斗场的看守。浑身伤疤满脸横肉，负责押送参加角斗的弟子。自己也是兽化失败者但侥幸保住性命，对成功兽化者既羡慕又畏惧
    哑巴: 筑基后期，人族男修，荒魔堡的杂役。舌头被割掉无法说话，每日搬运兽血桶和尸体。眼神麻木但偶尔流露出恐惧
    蛛娘: 金丹初期，蜘蛛妖，荒魔堡附近的散修。与噬荒教做血脉交易，用蛛丝换取兽血精华。精明算计从不亏本
    秃鹰: 筑基大圆满，秃鹫妖，落日峡谷的食腐妖。专门清理角斗场的残骸尸骨，与噬荒教形成了诡异的共生关系
    小奴: 炼气后期，人族少年，荒魔堡最底层的奴隶。等待被送入兽血池接受改造，每天都可能是最后一天。瘦弱发抖但眼中还有一丝不甘
</噬荒教>
