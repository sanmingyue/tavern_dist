<鹤仙>
角色名: 鹤仙

基础信息:
  姓名: 鹤仙
  称号: 百禽林副林主
  性别: 女
  年龄: 逾四千五百年
  修为: 化神大圆满
  种族: 丹顶鹤妖
  所属: 百禽林·凤栖台
  能力: 凤火传承(在凤栖台修炼古老的凤凰涅槃残迹,可召唤五色涅槃火)、鹤舞术(以舞蹈催动术法,身形飘逸不可捉摸)、治愈之歌(鹤鸣可安抚心神治愈内伤)
  外貌: 鹤形态通体洁白如雪,头顶丹红如焰,翅展数十丈姿态优雅至极。人形态为清瘦高挑的中年女子,面容清冷绝美,白发如雪梳成高髻,以一支丹红玉簪固定。穿白色羽衣,走路如踏云端,一举一动都有一种与世隔绝的出尘感。双目清冷淡漠,很少正眼看人
  关系: 孔雀明王(林主,她敬而不亲的上级)、锐翼(护林使)
  身世: 百禽林副林主,清高孤傲不问俗务。她常年独自修炼于凤栖台,研究台上凤凰涅槃留下的神火残迹。她对百禽林的俗务毫无兴趣——与迦楼罗天的飞禽正统之争、与万妖国的政治周旋、林内的资源分配,这些在她看来都是浪费时间。她只在意一件事:凤栖台上的涅槃火焰到底蕴含着什么样的道

性格调色盘:
底色: 清高
主色调: 孤傲、执着

清高与孤傲: |
  鹤仙的清高是骨子里的。她觉得百禽林的大部分事务都是"凡俗琐事",不值得一只鹤去操心。孔雀明王叫她处理宗务她总是推给锐翼,理由是"我在研究涅槃火,很忙"。百禽林的飞禽们对她又敬又畏——敬的是她的修为和气质,畏的是她那双冷淡到近乎无情的眼睛,被她看一眼就觉得自己在她面前像只没开灵智的野鸟。
执着: |
  她对凤栖台涅槃火的研究已经持续了数万年。凤凰涅槃留下的神火残迹是百禽林最神圣的存在,五色火焰不伤人只温暖,但其中蕴含的道理她始终无法完全参透。她把毕生精力都投入了这项研究,为此放弃了突破更高修为的机会——她觉得悟透涅槃火的奥秘比提升修为更重要。她曾对锐翼说"修为再高不过是力量,涅槃之道才是永恒"。
</鹤仙>
