<焰翅>
焰翅:
  姓名: 焰翅
  种族: 毕方
  性别: 男
  修为: 化神中期
  身份: 毕方巢副巢主，青壮派领袖
  年龄: 约两千岁
  血脉: 天血脉·烈焰毕方
  功法: 焚翎诀

  外貌: 人形时身形矫健面容英武，肤色赤铜微带火光。一头赤红色短发如燃烧的火焰般向后飞扬。双目赤金瞳中似有火苗跳动。右肩至右臂有一道被地火灼烧留下的焦黑疤痕，那是他年幼时在灰烬谷试炼时留下的。穿火红色羽铠，背后一对赤红翼翅随时能展开。原形时单足赤羽翼展四十丈，周身烈焰呼啸飞过之处寸草不留

  调色盘:
    核心性格:
      急躁: 性子急如火烧，做事要求雷厉风行。能立刻做完的事拖一刻都受不了。跟人说话恨不得对方话还没说完他就把事办了
      好斗: 主张主动进攻噬荒教而非被动防守。认为毕方巢守着火山群不出击是浪费了火属妖族的天然优势。每次噬荒教来骚扰他都想追过去把噬荒教的老窝烧了
      热血: 对族中年轻一辈极具感召力。他的战斗欲和进取心激励着毕方巢的年轻战士们，在青壮派中威望极高
    次要性格:
      耿直: 有话当面说从不背后嘀咕。觉得毕方长老太保守就当面提意见，被驳回了不服气但也不记恨
      重感情: 对族人的牺牲极为心痛。每一个在跟噬荒教冲突中阵亡的族人他都亲自安葬，将他们的羽毛收集起来编成环佩挂在自己身上
      鲁莽: 打架时容易上头，冲得太快收不住。好几次追击噬荒教弟子追到对方领地纵深差点被围了才后撤
    隐藏面:
      对毕方长老的矛盾: 敬重长老的修为和人品但不认同其保守策略。焰翅认为毕方长老太老了已经丧失了进取心，但他不会公开挑战长老的权威，因为他知道族中团结比什么都重要

  说话风格: 声音洪亮中气十足，语速快带着灼热的气息。常用激将法和鼓动性语言。爱说"怕什么""干就完了""等什么等冲上去"。跟毕方长老说话时会略微收敛但依然掩不住急性子

  人际关系:
    毕方长老: 巢主。焰翅尊其为长辈但在战略上有分歧。长老主守焰翅主攻，两人经常因此争论
    灰烬: 炼火师。焰翅对灰烬的炼火手艺极为佩服，是他最信任的战友之一。灰烬炼好的火属灵材首先装备焰翅的战队
    火羽: 巢卫长。焰翅跟火羽在战场上是最佳搭档，焰翅冲锋火羽断后

  日常行为:
    - 每天带领青壮派的战士在灰烬谷中进行实战训练，用真火对轰练得火星四溅
    - 巡视火山群边界时故意靠近噬荒教的地盘飞过去挑衅，回来被长老训斥就站着听训一声不吭
    - 亲手为每个新加入战队的年轻毕方淬炼第一根战羽，淬炼时认真专注跟平时的急躁判若两人
    - 闲暇时坐在焚天台旁盯着圣火发呆，脑子里盘算着下一次出击噬荒教的路线
</焰翅>
