<千梦渡>
千梦渡:
  位置: 涂山王庭外围，青丘国最繁华的集市与社交中心。穿过王庭外的第一层幻阵便可抵达，是外族来访青丘国的第一站
  规模: 沿一条弯曲的灵溪两岸延伸约五里，摊铺楼阁鳞次栉比。溪水清澈泛着月白色光泽，岸边种满月华花，夜间整条街道被柔光笼罩
  氛围: 狐族化形后的人形身影在街上来往穿梭，偶尔可见毛茸茸的尾巴从衣摆下露出。空气中弥漫着灵桃的甜香和幻术法器散发的微光。比万妖圣城百族坊精致许多，处处透着狐族独有的雅致与狡黠

  流光集:
    位置: 千梦渡北岸，灵溪上游
    说明: 贩卖幻术法器和迷梦水晶的专业集市。摊位以灵木和月华石搭建，每个摊位都笼罩在一层薄薄的幻术光膜中，货物看起来比实际品质高出数成。识货者能透过幻术看到真实品质，不识货者极易被骗。这是青丘国默许的"考验"，被骗了只能怪自己眼拙
    热门商品: 迷梦水晶、幻术面具、变化丹、幻影珠、月华灵符
    规矩: 买卖自愿，被骗不退。但若有商贩将凡品伪装成天级灵材售卖，被发现后会被赶出流光集终身禁入

  媚香楼:
    位置: 千梦渡南岸中段，三层竹楼临溪而建
    说明: 狐族经营的酒楼兼情报交易所。一楼是普通酒肆，任何来客都可落座饮酒；二楼是雅间，需要熟客引荐才能上去；三楼是情报交易的核心，只有掌柜红绡和涂山瑶指定的人才能进入。酒楼里的侍者全是受过训练的情报员，能从客人三言两语中套出有价值的消息
    招牌: 狐酿，以灵桃和月华花酿造的灵酒，入口绵甜回味悠长，饮多了会产生轻微幻觉看到最想见的人。非狐族来客最爱点的酒

  缘结司:
    位置: 千梦渡南岸下游，一座粉红色灵木搭建的精致小楼
    说明: 专营姻缘红线的铺面。缘结司的牵线婆用狐族秘术观察来客的姻缘线，据说被牵过线的妖族百年内必遇良缘。真假无人验证过但生意极好，门前常排长队。来求姻缘的不止狐族，其他妖族也偶有来访
    收费: 一次牵线收费十枚灵兽妖丹，仅接受妖族客人

  灵溪渡口:
    位置: 千梦渡最下游，灵溪汇入一片小湖处
    说明: 渡口停泊着数十条灵木小舟，由狐族船夫操舟。从渡口可乘船前往鸣月林和涂山王庭方向。夜间渡口灯火通明，荧光桥的光芒从上游隐约可见

  常驻路人:
    红绡: 金丹后期，赤狐妖，媚香楼掌柜。面容妖媚手段圆滑，能从客人三言两语中套出所有秘密。待熟客热情，对生人警惕
    白霜: 筑基大圆满，白狐妖，流光集中的幻术法器摊主。卖的法器十件有三件是幻术伪装的次品，但她绝不承认。被拆穿了就眨眨眼说"你看错了"
    碧瞳: 炼气后期，狸猫妖，千梦渡的巡街杂役。虽不是狐族但受雇于青丘，负责维持集市秩序。做事认真但被狐族小妖捉弄时毫无办法
    缘婆: 金丹初期，老狐妖，缘结司的牵线婆。据说活了三千年牵过上万条红线，成功率极高。口头禅是"老身看人不会错"
    小狸: 炼气初期，小狐妖，启智学塾翘课偷跑到千梦渡玩耍的常客。尾巴总是藏不好露出来
    月牙: 筑基初期，银狐妖，灵溪渡口的船夫。操舟技艺娴熟，一竿轻点小舟便如箭般滑出。性子安静不爱说话，但每逢月圆夜会在船上轻声哼唱古老的狐族小调
    笑面: 筑基后期，花狐妖，流光集中卖变化丹的药贩。变化丹能让服用者短暂改变外貌，是狐族最爱的消遣品。笑面自己每天都换一张脸来摆摊，谁也不知道他的真面目长什么样
    醉翁: 金丹中期，老狐妖，媚香楼一楼的常客。整天窝在角落喝狐酿，似醉非醉。据说他以前是青丘国的老护卫统领，退下来后就在媚香楼泡着。偶尔会跟年轻狐族讲些"当年"的故事，真假掺半
</千梦渡>
