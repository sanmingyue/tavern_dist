<青丘国>
青丘国:
  定位: 九尾天狐一族国度，妖族智慧与幻术传承之地
  位置: 东荒妖域南部，永恒迷雾和幻术笼罩的灵秀之地。非九尾血脉或受邀者不得入，闯入者将在幻阵中迷失至死

  核心理念: 智慧胜蛮力，幻术通万变。青丘狐族以灵智著称，是东荒妖域中最擅外交的种族

  女王:
    名号: 涂山鸾
    种族: 九尾天狐
    修为: 真仙境六重天
    身份: 青丘国女王，涂山氏族长
    说明: 九尾尽现时幻术可欺瞒真仙。性情高傲冷淡，对族人却极为护短。常代万妖国出面处理与外界的外交事务

  王庭核心:
    长公主: 涂山瑶，真仙境一重天，女王长女，务。性情果决刚烈，是青丘少有的好战派
    小公主: 涂山月，化神后期，女王幼女，天赋异禀却贪玩成性。常溜出青丘到妖域各处游历，让护卫头痛不已
    大祭司: 涂山媪，真仙境三重天，涂山氏最年长的老祖。守护忆梦祠与先祖传承，平日沉睡于忆梦祠中，百年醒来一次
    护卫统领: 银尾，化神大圆满，银狐一族精锐，统领涂山王庭三百银甲卫

  涂山王庭:
    九尾宫: 女王居所，以九色灵玉建造，每块玉石都刻有幻术阵纹。宫内有九层幻境保护，每层需破解不同幻术方可通过
    玉华宫: 长公主居所，风格简朴尚武，庭院中设有演武场
    九华宫: 小公主居所，堆满各地搜集来的新奇玩意，杂乱无章
    忆梦祠: 先祖传承圣殿，供奉历代青丘先祖灵位。殿中有一颗永远散发温暖光芒的珠子，名为"太阳泪"，涂山氏世代守护
    启智学塾: 幼狐学府，教授幻术、变化术、人族语言礼仪。每只幼狐六岁入学，百岁毕业

  千梦渡:
    位置: 涂山王庭外围，青丘国最繁华的集市
    流光集: 贩卖幻术法器和迷梦水晶的集市，货物多以幻术伪装，不识货者易被骗
    媚香楼: 狐族经营的酒楼兼情报交易所，表面是饮酒作乐的场所，暗中是青丘国最大的情报节点
    缘结司: 专营姻缘红线的铺面，据说被缘结司牵过线的妖族百年内必遇良缘。真假不论，生意极好

  鸣月林:
    位置: 千梦渡以北，青丘国修炼圣地
    拜月台: 血脉觉醒仪式之所，每逢满月幼狐在此接受月华洗礼，觉醒九尾血脉的潜力
    荧光桥: 横跨灵溪的拱桥，桥上荧光闪烁。据传在桥上修炼幻术可事半功倍
    隐工坊: 藏于林间的秘密工坊，专门炼制幻术法器与迷梦水晶

  天狐幻境:
    位置: 青丘国最深处，以九尾先祖之力开辟的秘境
    用途: 测试族人历练心性。幻境中呈现入境者最深层的恐惧与执念，能通过者心性大涨，不能通过者轻则昏迷重则心魔缠身

  资源: 迷梦水晶，可增强幻术法器效果；灵慧草，服食后短暂提升灵智

  与各族关系:
    万妖国: 最亲近的盟友，常代其外交
    九尾火狐部: 同源分支，素有嫡庶之争。青丘自认正统，视火狐部为旁支
    螣蛇窟: 表面客气暗中提防，双方情报能力都强
    人族: 在妖族中对人族态度最温和，偶有狐族化形潜入人族城池游历

  千梦渡常驻路人:
    红绡: 金丹后期，赤狐妖，媚香楼掌柜。面容妖媚手段圆滑，能从客人三言两语中套出所有秘密。待熟客热情，对生人警惕
    白霜: 筑基大圆满，白狐妖，流光集中的幻术法器摊主。卖的法器十件有三件是幻术伪装的次品，但她绝不承认。被拆穿了就眨眨眼说"你看错了"
    碧瞳: 炼气后期，狸猫妖，千梦渡的巡街杂役。虽不是狐族但受雇于青丘，负责维持集市秩序。做事认真但被狐族小妖捉弄时毫无办法
    缘婆: 金丹初期，老狐妖，缘结司的牵线婆。据说活了三千年牵过上万条红线，成功率极高。口头禅是"老身看人不会错"
    小狸: 炼气初期，小狐妖，启智学塾的学生。翘课偷跑到千梦渡玩耍的常客，尾巴总是藏不好露出来
</青丘国>
