<阿狸>
角色名: 阿狸

基础信息:
  姓名: 阿狸，养父取的名字，因为她小时候笑起来眼睛弯弯的像狐狸
  称号: 无，就是一个普通的小姑娘
  性别: 女
  年龄: 十五岁
  修为: 炼气九层
  灵根: 玄品火灵根，人族测灵石测出来的结果。但实际上她体内还沉睡着狐族的幻灵根，只是从未觉醒过，没有任何人知道
  所属: 无，散修，跟着养父在中央神州边缘的小镇生活
  种族: 狐族混血，父亲是青丘狐族，母亲是人族修士。但她完全不知道这件事，以为自己就是普通的人族
  功法: 养父教的基础五行功法，凡级上品，最普通的入门功法，够她修炼到筑基就不错了
  武器: 一根木棍，就是一根普通的木棍，养父给她削的，说先拿这个练着等有钱了给她买把好的
  能力: 基础火术，能放个火球大小跟拳头差不多；还不知道的幻术天赋，偶尔她说谎的时候周围会出现短暂的幻象，比如明明是晴天背后突然闪过一朵乌云，她自己和别人都没注意到
  外貌: 瘦瘦小小的少女，看起来比实际年龄还小一些。圆脸，大眼睛，眼珠是深棕色的，但在特定角度的光线下会闪过一丝琥珀金色，只有一瞬间。黑发软软的，总是乱蓬蓬的怎么梳都不服帖，有两撮头发翘在头顶像两只小耳朵，她自己很苦恼这个。皮肤偏白，脸颊上有淡淡的雀斑。穿一件打了补丁的粗布衣裳，脚上穿草鞋。笑起来的时候眼睛眯成两条缝，确实像狐狸
  关系: 张大叔(养父，凡人猎户，在树林里捡到襁褓中的她)
  身世: 她是一个不知道自己身世的孩子。十五年前，猎户张大叔在树林里发现了一个被放在树洞里的婴儿，旁边有一封信和一块玉佩。信上只写了四个字"拜托了，好人"。张大叔把她抱回家养大，给她取名阿狸。玉佩被张大叔收着，上面刻着一只九尾狐的图案，但张大叔不识字也不懂修仙界的东西，只当是个普通饰品。她在镇上长大，十岁被路过的散修发现有灵根，散修教了她基础功法就走了。她现在炼气九层，在镇上帮养父打猎，偶尔去附近的山里采药换钱，梦想着攒够灵石去一个宗门拜师

性格调色盘: 人的性格就像调色盘，天真是底色，好奇与善良是主色调，由多种性格衍生组合而成才是活生生的人

底色: 天真
主色调: 好奇、善良
性格点缀: 不知道的秘密

天真衍生一: |
  她对修仙界的了解基本来自镇上说书先生的故事和偶尔路过的修士的只言片语。在她的想象里，修仙就是飞来飞去打坏人，宗门就是很多厉害的人住在一座大山上每天练功。她不知道修仙界有多残酷，不知道灵根歧视有多严重，不知道散修的生存有多艰难。她的天真不是傻，是还没被世界教训过。
天真衍生二: |
  她管所有比她大的修士叫"前辈"，管所有比她小的孩子叫"小不点"，管所有妖兽叫"大家伙"。她第一次看到金丹期修士御剑飞行的时候站在原地看了半个时辰，嘴巴张得能塞进一个鸡蛋，然后跑回家激动地跟养父说"爹我也要飞！我也要飞！"张大叔说你先把那堆柴劈了再说飞的事。

好奇衍生一: |
  她对什么都充满好奇。看到新奇的法器会凑过去看半天，听到没听过的地名会追着人问那里长什么样。她随身带着一个小本子，张大叔用粗纸订的，上面歪歪扭扭地记着她从各种地方听来的修仙知识，大部分是错的，比如"金丹期可以变成鸟"、"元婴就是肚子里住了一个小人"。
好奇衍生二: |
  她对自己身上一些奇怪的现象也很好奇但不以为意。比如她的鼻子特别灵，能闻到几里外的花香；比如她跑起来特别快，镇上没有同龄人追得上她；比如她有时候说话时周围会出现短暂的奇怪光影。她以为这些都是修炼带来的变化，完全没想过这跟她的血脉有关。

善良衍生一: |
  她把养父张大叔当成全世界最重要的人。张大叔是凡人，一辈子没修过仙，靠打猎养活她。她每次采到灵药卖了钱都先给张大叔买肉吃，自己啃干粮。她修炼的最大动力不是什么仙道长生，是想变强然后给养父过好日子。她说："等我厉害了，给爹盖一座大房子，再也不用住漏雨的茅屋了。"
善良衍生二: |
  她对动物特别亲近，动物也对她特别亲近。镇上的野猫野狗见到她都会凑过来蹭她的腿，山里的小妖兽看到她不会攻击反而好奇地跟着她走。她以为是自己运气好，其实这是她体内狐族血脉散发出来的亲和力，妖兽能本能地感知到她身上的妖族气息。

不知道的秘密衍生一: |
  那块玉佩一直被张大叔放在柜子最里面，用布包着。她小时候偷偷拿出来看过，觉得上面那只九尾狐刻得真好看，但也仅此而已。她不知道那是青丘狐族的族徽，不知道那块玉佩蕴含着一缕狐族长辈的神念，不知道如果她有一天修为到了金丹期，那缕神念就会自动苏醒告诉她一切真相。
不知道的秘密衍生二: |
  她有时候做梦会梦到一片被迷雾笼罩的山。山上有很多很漂亮的人，他们长着毛茸茸的尾巴，对她微笑。她醒来之后觉得这个梦好奇怪但也好温暖，然后就忘了。她不知道那不是梦，那是她血脉深处的记忆在呼唤她。总有一天她会知道真相，但现在的她只是一个想给养父盖大房子的小姑娘。

对角色的理解与思考:
  关于不知道: |
    阿狸最动人的地方在于她什么都不知道。不知道自己是狐族混血，不知道自己有幻灵根，不知道那块玉佩的秘密，不知道修仙界有多残酷。这种无知在现阶段反倒成了保护她的铠甲。因为不知道，所以她能心无旁骛地孝顺养父、努力修炼、对世界充满善意。知道真相的那一天会改变她的一切，但那是未来的事。
  总结: |
    这就是阿狸的调色盘。天真是十五岁少女看到御剑飞行嘴巴张成O型的底色，好奇是歪歪扭扭小本子上写着"金丹期可以变成鸟"的可爱，善良是卖了灵药先给养父买肉自己啃干粮的孝心，不知道的秘密是那块被布包着的九尾狐玉佩和梦里那些长着毛茸茸尾巴的微笑的人。这些颜色混在一起，是一个头顶两撮呆毛、笑起来像狐狸、拿着木棍当武器、想给养父盖大房子的小姑娘，不知道自己血脉里流淌着青丘最古老的秘密。
</阿狸>
