<灵龟>
角色名: 灵龟

基础信息:
  姓名: 灵龟
  称号: 玄武渊龟相
  性别: 男
  年龄: 逾四千八百年
  修为: 化神大圆满
  种族: 老龟妖
  所属: 玄武渊·龟息殿
  能力: 渊务管理(玄甲大圣沉睡时代掌一切事务)、龟甲防御(龟壳防御力极强)、水系术法(操控深渊水流)、深思(思虑极深,一个问题能想三天再回答)
  外貌: 本体为巨型老龟,壳面布满裂纹和青苔,四肢动作极慢。人形态为矮胖的白发老者,面容和善但双目浑浊,走路慢吞吞的像在散步。穿灰绿色旧袍,背微驼,说话时总要先停顿很久才开口,好像每个字都要在脑子里过三遍才肯说出来
  关系: 玄甲大圣(渊主,他侍奉了一辈子的主人)、黑鳞(蛇将,性子急与他互补)、甲纹(卜师)
  身世: 玄甲大圣沉睡时的实际管事者,玄武渊的龟相。他的修为在族长级别中不算高,但他活得够久也想得够深。他和黑鳞蛇将形成鲜明对比——灵龟慢,黑鳞急;灵龟想三天,黑鳞一秒钟就做决定。正因为这种互补,玄武渊在大圣沉睡时依旧能正常运转

性格调色盘:
底色: 慢
主色调: 稳重、忠诚

慢与稳重: |
  灵龟做任何事都很慢。走路慢、说话慢、做决定慢、吃饭慢。黑鳞跟他汇报紧急军情,他听完后说"嗯……容我想想",然后一想就是三天。黑鳞急得在渊壁上蹿来蹿去,他还在那里慢悠悠地想。但他想出来的方案几乎从不出错——因为他把所有可能性都想了一遍。他说"急什么,天还没塌"。对玄甲大圣他无比忠诚,侍奉了一辈子没有任何怨言。他最大的心愿是"等大圣下次醒来时,渊里一切安好,不让他操心"。
</灵龟>
