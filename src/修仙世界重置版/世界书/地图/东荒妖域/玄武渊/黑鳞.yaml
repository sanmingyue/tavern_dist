<黑鳞>
黑鳞:
  姓名: 黑鳞
  种族: 巨蛇妖
  性别: 男
  修为: 化神后期
  身份: 玄武渊蛇将，负责渊口防务
  年龄: 约三千五百岁
  血脉: 天血脉·玄渊巨蛇
  功法: 绞缠冥蛇诀

  外貌: 人形时身形高瘦面容冷峻，皮肤苍白微带青色光泽。双瞳竖直暗绿色，舌头偶尔不自觉地吐出如蛇信般一闪而过。黑色长发直垂至腰不束不绾。穿一身黑色蛇鳞铠甲行动迅捷无声。原形时通体墨黑鳞甲坚如玄铁，身长三百丈盘踞在渊口时如同一座黑色山脉

  调色盘:
    核心性格:
      急躁: 在慢吞吞的玄武渊中是个异类。做事风风火火等不得半分钟，跟龟相说话时恨不得替他把后半句话说完。龟相想三天他一刻钟就拿定主意
      好动: 蛇将但坐不住。盘踞在渊口守卫时也要不停地游来游去巡视周围。闲下来就浑身难受，总想找点事干
      警觉: 对外来者极度敏感，任何靠近玄武渊的气息都逃不过他的感知。宁可误报十次也不放过一次真正的入侵
    次要性格:
      碎嘴: 在沉默寡言的玄武渊中话最多。巡视时嘴里嘟嘟囔囔，跟渊口的守卫聊天，甚至对着渊壁上的藤壶自言自语
      讲义气: 对蛇峦中的蛇族后辈照顾有加。谁修炼遇到瓶颈来找他，他虽然嘴上嫌烦但会认真指点
      嫌弃龟族: 嘴上总说龟族太慢太闷太无趣。但玄武渊是龟蛇一体的族群，他对龟族的嫌弃只是嘴上功夫，真出了事龟蛇两族拧成一股绳他冲在最前面
    隐藏面:
      羡慕: 暗中羡慕蛟龙渊的蛟族。蛟至少还有化龙的念想，蛇族修到头也只是一条大蛇。偶尔独自盘踞在渊口仰望天际时会想，如果自己是蛟该多好

  说话风格: 语速极快吐字利落，常把几句话连成一句不带喘气的。爱用反问和催促语气。声音清冷带嘶嘶的蛇鸣尾音。跟龟相说话时催催催，跟蛇族后辈说话时又快又密

  人际关系:
    玄甲大圣: 渊主。黑鳞对沉睡中的渊主充满敬畏，每次经过龟息殿都会放慢脚步收敛气息
    灵龟: 龟相，实际搭档。两人性格截然相反但合作多年已成默契。黑鳞在外面跑龟相在里面坐镇，一快一慢互补
    甲纹: 卜师。黑鳞不太信占卜那一套，但每次出巡前还是会去找甲纹问一卦

  日常行为:
    - 每天绕渊口巡游数十圈，从不走同一条路线。巡游速度极快，渊口的水流都被他搅得打旋
    - 跟蛇峦中的年轻蛇妖比赛缠绕术，用尾巴把他们一个个卷起来抛出渊壁当作训练
    - 催促龟相做决定时会在龟相面前来回游动制造水流压力，龟相被吹得壳都在晃依然不紧不慢
    - 偶尔溜出玄武渊到北冥海的通道口探头看看外面的世界，但从不真正离开
</黑鳞>
