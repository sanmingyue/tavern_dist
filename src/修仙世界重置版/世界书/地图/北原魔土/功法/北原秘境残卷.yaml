<北原秘境残卷>
北原秘境残卷:
  太古魔帝真诀·上卷残篇:
    品级: 天级(残缺)
    所在: 古魔战场核心区
    状态: 被上古仙魔大战残留的战魂怨念守护，进入核心区的修士无一生还。传闻此诀为上古魔帝所创，上下两卷合一可通天魔之道
    备注: 下卷残篇在大魔国深渊古窟最深层

  虚空魔瞳术:
    品级: 地级上品
    所在: 魔神陨坑深层
    状态: 域外魔神陨落时遗留的异界功法残篇，刻在陨坑深层的黑色晶壁上。沾染域外魔气，修炼有走火入魔甚至被域外意志侵蚀之危。偶有胆大的散修抄录片段带出，但无人敢修炼完整版

  冥火噬魂功:
    品级: 地级中品
    所在: 归墟魔渊外围
    状态: 据传是远古时代某位魂道大能留下的功法，融合冥火与魂力，可焚烧敌人魂魄。归墟魔渊是洛幽的领地，无人敢擅入，此功法至今无人取得

  万骨锻魂诀:
    品级: 玄级上品
    所在: 古魔战场外围
    状态: 部分残页已被散修带出，在万法楼有售但不完整。以万族遗骨中的残魂之力淬炼己身神魂，修炼者神魂坚韧远超同阶，但需大量遗骨为材
</北原秘境残卷>
