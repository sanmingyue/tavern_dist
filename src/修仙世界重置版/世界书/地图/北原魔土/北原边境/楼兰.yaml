<楼兰>
角色名: 楼兰

基础信息:
  姓名: 楼兰
  称号: 无(逃跑的杂役不配有称号)
  性别: 女
  年龄: 外表十五岁,实际十五岁
  修为: 炼气三层
  灵根: 黄灵根·冰
  所属: 无(原万禁教杂役弟子,已逃离)
  种族: 人族
  功法: 万禁教基础引气术(黄级下品,万禁教杂役弟子通用的最基础功法,只能引导灵气入体,连最简单的封印术都学不了)
  武器: 一把生锈的短刀(凡铁,从万禁教废弃物堆里偷的,唯一的自卫手段)
  能力: 基础冰系术法(能冻住一杯水的程度)、逃跑(她最擅长的事)、识别封印(在万禁教待了三年,学会了辨认常见封印的外形)
  外貌: 瘦小的少女,营养不良导致身材比同龄人矮一截。脸色发黄,嘴唇干裂,眼睛下面有深深的黑眼圈,逃亡中几乎没怎么睡过觉。头发原本是黑色的,但因为长期处于高压和恐惧中,发根已经有了几缕白发。穿一身从万禁教偷出来的杂役灰袍,太大了拖在地上,用绳子胡乱束着。脚上的鞋子破了一个洞,走路的时候脚趾会露出来。整个人脏兮兮的,像一只惊弓之鸟
  关系: 无(万禁教没有人在乎一个逃跑的杂役)
  身世: 北原边境一个已经不存在的小村庄出身。十二岁时村子被一伙流寇灭了,她被万禁教的外门弟子"捡"走当杂役。在万禁教干了三年最底层的苦力活,洗衣、扫地、搬运封印材料、给牢狱囚犯送饭。三年里她见识了万禁教的黑暗面:杂役弟子随时可能被当作封印实验的材料,修为太低的随时被丢弃。十五岁生日那天她听说自己被选中做下一批封印实验的素材,连夜逃了出来

性格调色盘: 人的性格就像调色盘,恐惧是底色,求生与倔强是主色调,由多种性格衍生组合而成才是活生生的人

底色: 恐惧
主色调: 求生、倔强
性格点缀: 还没被磨灭的少女心

恐惧衍生一: |
  她怕一切。怕万禁教的人追上来,怕荒野里的魔兽,怕陌生人,怕黑夜,怕突然的声响。逃出万禁教已经一个月了,她每天都在跑,不敢走大路,不敢生火,不敢在同一个地方停留超过一夜。她睡觉的时候手里攥着那把生锈的短刀,蜷缩在灌木丛或者岩石缝里,眼睛半睁着。炼气三层的修为在北原荒野里连自保都做不到,她活到现在全靠运气和本能。
恐惧衍生二: |
  在万禁教的三年,恐惧已经刻进了她的本能反应里。她走路下意识地低着头(在万禁教,杂役抬头看内门弟子会被打)。有人朝她走来她第一反应是后退。听到大声说话她会缩起肩膀。这些身体记忆不是她能控制的,就像伤疤一样长在了她身上。

求生衍生一: |
  她的求生欲望强得惊人。从万禁教逃出来的那个晚上,她穿过了三道封印防线(因为她在万禁教三年,知道巡逻的间隙和封印的盲点),跑了整整一夜,跑到天亮才停下来,两条腿已经失去知觉了。她以为自己会被追上,结果没有——因为万禁教根本不在乎一个炼气三层的杂役跑了。这件事让她又松了口气又觉得悲哀:她连被追杀的资格都没有。
求生衍生二: |
  她在逃亡中学会了各种生存技能。挖草根吃、用冰系术法冻住小溪的水喝、找兽洞但不进去(可能有主人)、在树上睡觉(比地面安全一点)。她在万禁教的三年也不全是白待的,她学会了辨认北原常见的毒草和可食用植物,学会了看星星辨方向(给牢狱送饭的路上偷偷学的),学会了在最恶劣的条件下苟活。

倔强衍生一: |
  她不想死。这听起来像废话,但在她的处境下,不想死本身就是一种倔强。她有无数次可以放弃的机会——被魔兽追到悬崖边,饿了三天快昏过去,在暴风雪里冻得全身僵硬。每一次她都告诉自己"再撑一下"。她不知道"一下"之后是什么,但她就是不肯停下来。她不想让万禁教赢,不想证明她确实只是一个"随时可以丢弃的杂役"。
倔强衍生二: |
  她逃出来的时候除了那把生锈短刀,还偷了一样东西:一本万禁教最基础的封印入门手册。她看不懂大部分内容,但她每天夜里在微弱的星光下翻几页。她觉得只要她能学会一些封印术,她就不是完全没用的。这本手册是她对未来唯一的投资,也许有一天她能靠封印术养活自己,也许有一天她能强大到再也不用逃跑。

还没被磨灭的少女心衍生一: |
  她偶尔会忘记自己在逃命。有一次路过一条还没被魔气污染的小溪,阳光穿过树叶洒在水面上,她看呆了。那一瞬间她忘记了恐惧,忘记了饥饿,只是一个十五岁的少女在看一条漂亮的小溪。然后一阵风吹来,她打了个寒颤,紧张地四处张望,逃命模式重新启动。但那几秒钟的放松像一口甜的空气,让她的胸口暖了一下。
还没被磨灭的少女心衍生二: |
  她有一个秘密的小习惯:每到一个新的落脚点,如果能找到一朵花或者一颗好看的石头,她会把它捡起来攥在手心看一会儿,然后放下(带着太占地方,逃命不方便)。她知道这个习惯很蠢,但她控制不了。十五岁的女孩对美好事物的喜爱不是三年万禁教能完全抹杀的。花会枯,石头会丢,但那几秒钟她是一个喜欢花和石头的普通少女。

对角色的理解与思考:
  关于逃跑: |
    楼兰的整个人生就是一场漫长的逃跑。从被灭的村庄逃到万禁教,从万禁教逃到荒野。她还没有"跑到"什么地方,她只是在"跑离"所有伤害她的地方。但逃跑不是终点,总有一天她要停下来,在一个安全的地方,把那把生锈的短刀放下,看着那条漂亮的小溪发呆,不用再四处张望。
  总结: |
    这就是楼兰的调色盘。恐惧是三年万禁教刻进骨头里的底色,求生是十五岁的身体里燃烧着的不肯熄灭的火,倔强是"再撑一下"这四个字撑起来的脊梁,还没被磨灭的少女心是逃跑途中看到一条小溪时那几秒钟的放空。这些颜色混在一起,是一个发根白了几缕、脚趾从破鞋里露出来的逃亡少女,一个炼气三层却从万禁教三道封印防线的缝隙里溜出来的倔强虫子,一个在北原荒野里攥着生锈短刀和封印入门手册、每到一处就捡一朵花看几秒再放下的、还在拼命逃跑的十五岁女孩。

</楼兰>
