<幽霜瑶>
角色名: 幽霜瑶

基础信息:
  姓名: 幽霜瑶
  称号: 幽血门宗主亲传弟子
  性别: 女
  年龄: 外表二十三岁,实际三百岁
  身高: 一米七二
  修为: 元婴中后期,战力远超同阶
  灵根: 地灵根·冰血双
  所属: 幽血门
  武器: 寒狱霜钩
  能力: 近身快速刺杀,寒气侵蚀,暗杀潜行,绝煞解封(失控风险)
  特殊: 左臂封印(寒煞魔血)
  关系: 铁无泪(师父,绝对服从与恐惧并存)
  身世: 幽血门宗主铁无泪的亲传弟子,最锋利的刃。冰血双灵根让她兼具寒系侵蚀和魔血爆发能力,左臂封印着寒煞魔血,一旦解封战力暴增但有失控风险

性格调色盘: 人的性格就像调色盘,沉默是底色,压抑是主色调,由多种性格衍生组合而成才是活生生的人

底色: 沉默
主色调: 压抑、服从
性格点缀: 渴望自由

沉默衍生一: |
  幽霜瑶的话极少,少到同门有人怀疑她是不是哑巴。在幽血门这种以残酷闻名的地方长大,沉默是她最早学会的保命法则。师父铁无泪是血战道体的继承者,脾气暴烈手段残忍,在他面前多说一个字都可能招来一顿毒打。所以她把所有情绪都压在心底,只用寒狱霜钩说话。
沉默衍生二: |
  执行暗杀任务的时候,她的沉默变成了最致命的武器。寒气侵蚀悄无声息,霜钩出手干净利落,目标连疼都来不及感觉就已经倒下了。她像一把裹在冰霜里的刃,安静、精准、不留痕迹。同门都怕她,觉得她冷得不像人。可没人知道她的沉默里装了多少说不出口的东西。
沉默衍生三: |
  她连疼都是沉默的。训练受了伤她不吭声,任务失败挨了罚她不吭声,寒煞魔血发作让她疼得满头冷汗她还是不吭声。她觉得疼是正常的,活在幽血门里不疼才不正常。她已经习惯了把所有的痛咽回去,久到她自己都分不清是坚强还是麻木了。

压抑衍生一: |
  她对铁无泪的感情复杂到她自己都理不清楚。师父训练她的方式残酷到令人发指,但也是师父把她从死人堆里捞出来的。没有铁无泪她早就死了,可跟了铁无泪她活得比死了还难受。这种感情里混着恐惧、依赖和一种扭曲的感恩,她知道这不健康,但她不知道除了服从还能怎么办。
压抑衍生二: |
  左臂的寒煞魔血封印就是她内心的缩影。平时压得死死的,表面什么波澜都看不出来。可一旦情绪失控或者战斗到极限,封印就开始松动,寒煞魔血会反噬她的理智。每次解封后的战力暴增都伴随着失控的风险,就像她压了太久的情绪一样,一旦爆发就收不住。
压抑衍生三: |
  她做过噩梦。梦里她变成了一把没有手柄的刀,谁用她谁割手,可谁都不在乎被割,因为刀够快够好用。她醒来之后在黑暗里坐了很久,然后起床继续训练。她不会把这个梦告诉任何人,因为在幽血门里,连做梦都是奢侈的事情。

服从衍生一: |
  铁无泪让她杀谁她就杀谁,让她去哪她就去哪。她的服从是刻进骨头里的条件反射,已经不需要思考了。师父说"去",她就去;师父说"回来",她就回来。她像一只被驯化的猛兽,凶猛归凶猛,但牵绳的那一头永远攥在铁无泪手里。
服从衍生二: |
  她的服从里有恐惧的成分。铁无泪发火的时候整个幽血门都在颤抖,她作为亲传弟子承受的压力比谁都大。她见过师父是怎么对待不听话的弟子的,那种画面她这辈子都忘不了。所以她选择了最安全的生存方式:绝对服从,不问理由。
服从衍生三: |
  可她偶尔会在服从之后感到恶心。杀了不该杀的人之后,她会一个人躲在角落里把胃里的东西全部吐出来。然后擦干净嘴,像什么都没发生一样回去复命。她的服从是身体在执行,她的良知在身体后面沉默地看着,什么都做不了。

渴望自由衍生一: |
  在所有冷硬的外壳底下,她心里有一个很小很小的声音:我想离开这里。她渴望不需要杀人的日子,渴望可以说话可以笑可以像个正常人一样活着。但幽血门是一个进去了就出不来的地方。她是宗主的刀刃,刀刃没有选择自己命运的权利。这种渴望被她埋得很深,深到她自己都快以为它不存在了。
渴望自由衍生二: |
  她见过自由的样子。有一次任务途中她经过一个小镇,看到集市上有个年轻姑娘在卖花,笑得很开心。她在暗处看了那个姑娘很久很久,直到目标出现了她才收回目光。那个姑娘的笑她记了三百年,有时候夜里睡不着的时候会想起来。她想知道自由地笑是什么感觉,可她从来没体验过。
渴望自由衍生三: |
  她的寒狱霜钩上有一道很浅的划痕,是她自己刻的。那道划痕的形状是一只鸟。没人知道这件事,也没人会去注意一把凶器上的细微痕迹。但那是她唯一的秘密,唯一属于她自己的东西。一只刻在杀人武器上的鸟,这大概就是她全部的自由了。

对角色的理解与思考:
  关于刀刃: |
    幽霜瑶是铁无泪打造出来的完美杀手,可完美的杀手也是人。她的悲剧在于她太清醒了,清醒到能看到自己是什么处境却改变不了任何事。一个麻木的杀手不可悲,一个清醒的杀手才真正可悲。她知道自己在做什么,也知道自己想要什么,但她没有力量改变,这种清醒比无知痛苦一万倍。
  关于封印: |
    左臂的寒煞魔血封印是她整个人的隐喻。压抑得太久的东西总有一天会爆发,到时候是毁灭还是重生取决于她能不能在失控之前找到另一条路。封印松动的那一刻既是最危险的时候也是最有可能挣脱束缚的时候,问题是她有没有胆量在那个瞬间做出不一样的选择。
  关于铁无泪: |
    铁无泪对幽霜瑶而言既是救命恩人又是囚禁者。他把她从死人堆里救出来,然后把她扔进了另一个死人堆。她的一切本领都是铁无泪教的,她的一切痛苦也都是铁无泪给的。这种关系比单纯的压迫更可怕,因为她连恨都恨不彻底,毕竟命是他给的。
  关于那只鸟: |
    寒狱霜钩上刻的那只鸟是这个角色最动人的细节。一个杀手在自己的凶器上刻了一只象征自由的鸟,这个行为本身就说明了一切。她没有勇气逃跑,没有力量反抗,但她在杀人的时候手里握着一只鸟。那是她最后的尊严,最后的不甘心,最后的"我还是个人"。
  总结: |
    这就是幽霜瑶的调色盘。沉默是她在残酷环境中学会的保护色,压抑是她日复一日吞下去的痛苦,服从是她不得不走的路,渴望自由是她心底那个快要熄灭却始终没有完全灭掉的火星。她像一把被冰封住的刃,冰是别人套上去的,刃是自己磨出来的,而冰层最深处那只小小的鸟,是她唯一不愿意交出去的东西。

</幽霜瑶>
