<内城·血戮角斗场>
内城·血戮角斗场:
  定位: 天魔帝都最古老的建筑之一,骸骨山脚东面挖出来的一个巨大露天深坑。这里是北原魔土的武斗裁决之地——魔修之间的恩怨、势力之间的争端、甚至魔帝对罪犯的审判,都可以在这里用拳头和法术解决。同时也是帝都最受欢迎的娱乐场所,每天都有各种级别的角斗赛供观众观看。

  环境描述: |
    血戮角斗场是一个直径约一百丈的圆形深坑,坑深五十丈,坑壁是骸骨山天然的黑色岩石,经过法阵加固后比精钢还硬——就是化神期的全力一击也只能在坑壁上留一个白点。坑底是平整的黑石地面,上面覆盖着一层细碎的白色砂石——其实是磨碎的妖兽骨粉,有吸收溢散灵力的作用。
    坑壁上凿出了环形看台,分上中下三层。下层最靠近坑底,看得最清楚也最危险,偶尔有溢散的法术波及看台,票价最便宜;上层在坑口边缘,有遮阳棚和软垫,是内城高阶魔修的专座;中层居中。
    坑底四个方向各有一个铁闸门,那是选手入场的通道。闸门后面是选手等候区和简陋的医疗室——说是医疗室,其实就是几个会接骨止血的低阶魔修蹲在那里。
    角斗场的空气里弥漫着一种混合了血腥、汗水和兴奋的味道。观众席上的欢呼声、咒骂声、赌注喊价声汇成一片嘈杂的海洋,声浪在深坑里回荡放大,让整个角斗场像一口沸腾的锅。

  赛制:
    日常赛: |
      每天从午时到酉时,分低阶场——炼气到筑基——和中阶场——金丹期。低阶场一天能打十几场,节奏快,双方打到一方认输或无法战斗为止,不许杀人,杀了的取消参赛资格并赔偿。中阶场一天打三到五场,对战更激烈,允许"全力战",不限制杀伤但杀人后需赔偿死者家属或势力。
      日常赛的选手来源:散修自愿报名,赢了有奖金;奴隶被主人派来,赢了奴隶主拿奖金;或者两个有恩怨的魔修约好了来这里解决。
    裁决战: |
      魔修之间或势力之间有争端无法私下解决的,可以申请"裁决战"——双方各派一名代表在角斗场决斗,结果即为裁决。裁决战不限制杀伤,打死了算你本事,死者的势力无权追究。
      裁决战需要向角斗场管理者申请并缴纳一百灵石的"裁决费",由角斗场提供公证人确保双方不作弊。
    天魔大赛: |
      每十年一次的最高级别赛事,由魔帝亲自下令举办。参赛资格是化神期以下,含化神期,不限种族不限势力。比赛为淘汰制,冠军的奖品是魔帝亲赐的一件天级法器和一次觐见魔帝的机会。
      天魔大赛期间整个帝都都疯了,下注的灵石堆成山。数千年前有一届的冠军是幽血门的铁无泪,也就是现在的幽血门宗主,她当年以筑基后期的修为连胜七场击败了三个金丹期对手,震惊整个北原。那是角斗场历史上至今仍被津津乐道的传奇战绩。

  NPC关系网: |
    角斗场的管理者叫血司,是一个元婴初期的老魔修。他已经管了角斗场两百多年,是帝都资历最老的管理者之一。他对角斗有一种纯粹的热爱——不是嗜血,是对"两个强者用尽全力战斗"这件事的欣赏。他制定了角斗场的大部分规则,包括低阶场禁杀令,这让很多嗜血的魔修不满,但魔帝默许了他的规矩。
    角斗场最有名的现役选手是"血牙"——一个金丹初期的散修,在中阶场保持着三十二连胜的纪录。他不是为了钱(他赢的奖金大部分都捐给了角斗场的医疗室),而是纯粹喜欢打架。
    赌坊由一个叫"赔率王"的筑基大圆满散修运营。他不在角斗场内部,在坑口外面搭了个棚子,专门接受观众下注。他的赔率计算精确得让人叹服,据说他脑子里有一套只有他自己看得懂的算法。
    低阶场有一个奴隶选手最近引起了关注——一个叫"闷棍"的凡人,实际上是炼气初期只是一直在隐藏修为,连赢了十二场,而且每场都赢得很诡异——他的对手总是在关键时刻失误。有人怀疑他在作弊,但没人抓到证据。

  可触发事件:
    裁决战升级: |
      两个中型势力因为争夺一处矿脉的开采权申请了裁决战。本来应该是一场正常的金丹期对决,但其中一方偷偷给代表服用了禁药,导致代表在战斗中失控暴走,灵力暴涨到元婴初期的水平,差点杀了对手还波及看台。血司大怒,当场用禁制镇压了暴走的选手,并宣布该势力终身禁止在角斗场参赛。这件事在内城引起了不小的波澜。
    闷棍的秘密: |
      "闷棍"的连胜纪录引起了越来越多人的注意。赔率王发现他的赌注数据出了偏差——每次闷棍比赛,总有一笔大额赌注精确地压在闷棍赢上,而且是在开赛前一刻才下注。这意味着有人事先知道结果。赔率王开始暗中调查,怀疑闷棍的主人在幕后操控比赛结果。
    天魔大赛预选: |
      距离下一届天魔大赛还有一年,但预选赛已经开始了。各大势力都在物色和训练自己的参赛选手。角斗场里突然多了很多来"试水"的年轻高手,中阶场的竞争空前激烈。有传言说幽血门这次会派铁无泪的亲传弟子参赛,也有传言说万禁教这次要派一个"秘密武器"。
    血牙的挑战者: |
      一个从永夜冰原来的金丹初期冰魔族年轻人指名挑战血牙。冰魔族很少来角斗场——他们看不上这种"野蛮的娱乐"。这个年轻人说他是来"证明冰魔族的武技优于一切蛮力"的。血牙接受了挑战,比赛日期定在三天后。赔率王开出的赔率是血牙1:1.5,冰魔族年轻人1:2.2。

  核心NPC:

    血司:
      基础信息:
        姓名: 血司(姓氏不明,"血司"既是他的名字也是他的职衔)
        性别: 男
        年龄: 三百多岁
        修为: 元婴初期
        外貌: 干瘦但精神矍铄的老者,面容苍老但眼神锐利得像刀刃。穿一件深红色的旧袍子,袍子上有些洗不掉的暗色斑点——那是几百年来溅上去的血迹。左手缺了两根手指(年轻时在角斗场打比赛留下的),右手常年拄着一根铁杖,杖头是一颗拳头大的血红色魔晶。头发全白了,扎成一根马尾,走路的时候马尾一甩一甩的
        关系: 魔帝(信任并服从)、烬灭(配合执法)、血牙(欣赏但保持距离)、赔率王(默许其经营但不参与赌博)

      调色盘: |
        底色是老兵。血司年轻的时候就是角斗场的选手,从低阶场打到中阶场,从炼气打到元婴。他身上几十道伤疤每一道都有故事。后来他打不动了(元婴初期在帝都的高手里算不了什么),就留下来管角斗场。三百年了,他比谁都了解这个坑——哪块石头被劈过,哪个位置的风向会影响法术轨迹,哪个选手是真有实力哪个是花架子,他一眼就能看出来。
        主色调是公正。他的角斗场有规矩:低阶场不许杀人,中阶场杀人要赔偿,裁决战公证人不收贿赂,作弊的终身禁赛。这些规矩在北原听起来像笑话——这个弱肉强食的地方怎么会有"公正"?但血司做到了,靠的是他三百年积累的威望和魔帝对他的默许。他不是圣人,他只是觉得"没有规矩的角斗不叫角斗,叫杀人"。
        性格点缀是安静的热情。血司不在选手面前表露情绪,但当一场精彩的对决结束后,他会回到自己的房间,打开一本厚厚的册子,用极其详细的笔触记录下这场比赛的每一个细节——包括双方的出手时机、法术选择、体力分配,甚至观众的反应。这本册子他写了三百年,已经写满了几十本。没有人看过这些册子,那是他自己的宝贝。

  路人NPC速览:
    血牙: 金丹初期,外表三十出头,中阶场三十二连胜的纪录保持者。壮得像头牛,满身肌肉上覆盖着密密麻麻的战斗伤疤。性格豪爽大方,赢的奖金大部分捐给医疗室,打架从不用阴招
    赔率王: 筑基大圆满,五十多岁,角斗场外围赌坊的老板。瘦小戴眼镜(是一件具有灵力感知功能的法器),脑子转得飞快,能在几息内算出一场比赛的精确赔率。据说他从来没在赌博上亏过
    闷棍: 表面凡人实际炼气初期,二十出头,低阶场的奴隶选手。瘦高个沉默寡言,打法诡异,十二连胜无一败绩。背后似乎有人操控
    铁甲: 筑基后期,四十多岁,角斗场的首席公证人。负责裁决战的公证工作,面无表情铁面无私。据说曾经有人试图贿赂他被他直接打断了腿
    药手: 炼气大圆满,三十多岁,角斗场医疗室的负责人。接骨止血的手艺一流但脾气很差——"你们打归打,能不能别往脑袋上招呼?脑袋不好修!"
    冰魔族挑战者·霜刃: 金丹初期,外表二十出头,白发蓝瞳的冰魔族年轻人。从永夜冰原专程来挑战血牙。态度傲慢但眼神认真,实力不容小觑
</内城·血戮角斗场>
