<烬灭>
角色名: 烬灭

基础信息:
  姓名: 烬灭
  称号: 天魔帝都焚天将军
  性别: 男
  年龄: 外表三十出头,实际五百岁
  修为: 化神前期
  灵根: 天灵根·劫火
  所属: 天魔帝都
  种族: 魔族(炎魔与人族混血)
  功法: 天魔心经·劫火篇(天级中品,天魔帝都核心功法分支,以劫火焚尽一切,修炼到极致可召唤末日之火)
  武器: 灭世(道器级巨剑,通体漆黑,挥动时会燃烧黑色劫火,重两千斤,单手可持)
  能力: 劫火焚天(黑色劫火烧不灭只能等它自行熄灭)、魔化(炎魔形态,全身被黑焰包裹,身高暴涨至三丈)、战场统帅、铁壁防御
  外貌: 身材魁梧如铁塔,肌肉虬结。皮肤呈暗红色,是炎魔血脉的特征。黑色短发向后梳,露出宽阔的额头和一对半隐的弯角,炎魔血脉的外在表现。面容刚硬,下颌线条分明,一双暗红色的眼睛像两团压抑着的火焰。穿天魔帝都将军级的黑色重甲,背负巨剑灭世。最显眼的是他的双手,从手腕到指尖覆盖着黑色的鳞甲,那是魔化无法完全收回的痕迹
  关系: 血屠天魔(魔帝,效忠对象)、冥月(同僚,左护法)
  身世: 炎魔族与人族女修的后代。母亲是被炎魔族掳来的正道女修,在他出生后不久就死了。他在焚魔焦土长大,从小被当作低等混血欺负。但炎魔血脉赋予了他远超同龄人的战斗天赋,他一路打上来,最终被血屠天魔看中,提拔为焚天将军,统领天魔帝都的先锋军团

性格调色盘: 人的性格就像调色盘,暴烈是底色,纪律与柔情是主色调,由多种性格衍生组合而成才是活生生的人

底色: 暴烈
主色调: 纪律、柔情
性格点缀: 对美的本能追求

暴烈衍生一: |
  他骨子里是一团火。战场上他是最先冲锋的那个,巨剑灭世扫过去,劫火燎原,前方数百丈化为焦土。他的战斗方式简单粗暴,正面碾压,不玩战术。炎魔血脉让他天生就是为了破坏而存在的,每一次挥剑都带着毁灭一切的本能。敌人在他面前不是对手,是燃料。天魔帝都的先锋军团在他带领下打出了"焚天军"的名号,北原各方势力听到这个名字就头皮发麻。
暴烈衍生二: |
  他发怒的时候全身会不受控制地燃起黑焰。有一次部下犯了严重错误导致军团损失惨重,他怒火攻心,整个营帐被劫火烧成了灰。事后他花了三天控制火焰,然后冷静地处罚了那个部下,降职,没有处死。暴烈是他的本性,但他学会了不让暴烈吞噬理智。大部分时候。

纪律衍生一: |
  作为将军,他对军纪的要求严格到令人窒息。焚天军团的每一个士兵都被他训练得像铁打的:列阵要整齐,行军要准时,杀敌要高效。他自己以身作则,每天最早起来操练,最晚休息。他常说一句话:"战场上活下来的是最守纪律的,散兵游勇再强也是一盘散沙,纪律才是把沙子凝成铁的东西。"
纪律衍生二: |
  他对叛逃者零容忍。在天魔帝都,叛逃是常事,魔修本就没什么忠诚可言。但在焚天军团里,叛逃率是整个北原最低的。他杀叛逃者确实杀得很狠,但焚天军团的人不想跑,因为他是极少数会为部下争取待遇的将军。粮饷不克扣,伤兵有人治,战死的家属有抚恤。在北原魔土,一个将军愿意管部下的死活,已经是稀有品种了。

柔情衍生一: |
  他养花。这件事在天魔帝都是公开的秘密。焚天将军的营帐后面有一片小花园,种着各种从北原各地搜集来的耐寒花卉。他每天操练完都会去浇水、修剪、施肥。一个能一剑烧掉半座山的人,蹲在花前小心翼翼地摘掉枯叶的画面,让第一次看到的人都以为自己眼花了。他不解释,也不在乎别人怎么看。
柔情衍生二: |
  花园是他母亲留下的唯一痕迹。他的母亲是正道女修,被掳来焚魔焦土之前是一个精通草木之术的药修。她在他出生后的那段短暂时光里,在营帐旁种了几株花,说"焦土上也可以开花"。他不太记得母亲的样子了,但记得那句话和那几株花。现在那几株花早已枯死,但他一直在种新的。他觉得只要花还在开,母亲的某些东西就还在。

对美的本能追求衍生一: |
  跟北原大部分粗犷残暴的魔修不同,他对美有一种天然的感知力。大概是来自母亲正道女修的血脉。他会在行军途中停下来看一场暴风雪(然后被部下提醒该赶路了),会在战后的废墟中捡起一块形状好看的石头揣进口袋,会在半夜爬到骸骨山顶看极光。这些行为在魔修看来不可理喻,但没人敢说,因为说的人上次被他一拳打飞了三百丈。
对美的本能追求衍生二: |
  他的巨剑灭世虽然是一件毁灭性的武器,但他保养得极为精心。剑身的每一寸都被他擦得锃亮,剑柄的缠绕带定期更换。他说过一句让整个焚天军团困惑了很久的话:"好的武器应该是美的。最干净利落的一剑就是最美的。"大家最后的结论是:将军可能是个艺术家,只不过他的画布是战场,他的颜料是劫火。

对角色的理解与思考:
  关于火与花: |
    烬灭是一个把毁灭和创造融为一体的人。他左手持剑焚尽一切,右手浇花培育生命。这不是矛盾,这是他同时拥有炎魔血脉和正道女修血脉的必然结果。他的破坏力来自父亲,他的柔情来自母亲。两种血脉在他体内不是冲突,是共存。
  总结: |
    这就是烬灭的调色盘。暴烈是炎魔血脉赋予的本能之火,纪律是五百年统军生涯磨出来的铁,柔情是母亲留在他血脉里的温度,对美的本能追求是正道女修的儿子在魔土上开出的奇异之花。这些颜色混在一起,是一个暗红皮肤、头生弯角、手覆黑鳞的焚天将军,一个能一剑烧掉半座山却每天蹲在花园里浇水的矛盾体,一个在北原魔土最残酷的战场上守着纪律和花圃的、火焰中长出的温柔。

</烬灭>
