苍澜国:
  势力定位: 中央神州西部独立王国,修真势力与凡人国度并存,与万兽山庄互为依托

  核心特色:
    修真王国: 王室本身就是修士,以驭兽术闻名
    与万兽山庄共治: 共同管理百兽城,两方关系密切
    驭兽传统: 王室成员多修炼驭兽术,民风彪悍
    凡人与妖兽共处: 境内凡人与灵兽和平共处,形成独特的西域文化

  势力规模:
    国王: 苍澜王苍曜·景祁
    王室核心: 王后炎祯(驭灵营统帅)、长子苍曜·锦程、长女苍曜·璃音、次子苍曜·无瑜
    王室旁系: 三公主苏念卿等数十位王室成员
    贵族: 数千个修仙世家
    凡人百姓: 数十亿,覆盖西域大部分区域
    修士: 数百万,境内修仙家族与散修众多
    军事力量: 驭灵营,以灵兽兵阵闻名

  驭灵营层级:
    兽卒:
      人数: 数十万人
      修为范围: 凡人至炼气中期
      职责: 照料军用灵兽、搬运军需物资、维护牧场营地、协助凡人防务
      特征: 多为草原牧民征召,与灵兽有基础亲和但未签订契约,是驭灵营最基层的力量
    驭灵士:
      人数: 数万人
      修为范围: 炼气后期至筑基后期
      职责: 骑乘灵兽巡逻边境、参与小规模战斗、组成基础兽阵
      特征: 每人配有一只一阶或二阶军用灵兽,经过基础兵阵训练,可协同作战
    驭灵将:
      人数: 数千人
      修为范围: 金丹初期至元婴初期
      职责: 统领百人兽阵、驻守边防要塞、执行剿灭任务、训练新兵
      特征: 驭兽数量两只以上,可指挥兽阵变阵,具备独立领军能力
    驭灵统领:
      人数: 不足百人
      修为范围: 元婴中期至化神期
      职责: 统帅千人营阵、参与大规模作战、护卫王室出行、镇守苍澜城
      特征: 驭灵营精锐中的精锐,人兽合一可施展灵兽兵阵,直接听命于王后炎祯

  都城:
    苍澜城: 王室居所,修真氛围浓厚,城内修士与灵兽共存

  共管城市:
    百兽城: 与万兽山庄共管,灵兽交易中心

  与外界关系:
    与万兽山庄: 互为依托,关系密切,共管百兽城
    与大雍皇朝: 名义上臣服,实则独立,已议和互不侵犯,仍有资源竞争
    与妖域: 边境国家,常与妖族交易

  NPC速览:
    苍曜·景祁:
      身份: 苍澜国国王,兽皇
      修为: 渡劫前期
      灵根: 地灵根·火木双
      性格: 刚毅担当,笨拙柔情。以铁腕治国,对家人深沉但不善表达
      契灵: 幽炎焰蜥(五阶)
    炎祯:
      身份: 苍澜国王后,驭灵营统帅
      修为: 渡劫中期
      灵根: 天灵根·璃火
      性格: 刚毅威严,笨拙温柔。战场上杀伐果断,面对孩子手足无措
      契灵: 曜焰斩角狮(五阶)
    苍曜·锦程:
      身份: 苍澜国长子,首席驭阵师
      修为: 元婴中期
      灵根: 地灵根·玄雷
      性格: 秩序理智,沉稳谋略。痴迷阵法,做事滴水不漏
    苍曜·璃音:
      身份: 苍澜国长公主,五宗使节代表
      修为: 元婴中期
      灵根: 地灵根·冰火双
      性格: 温婉坚韧,隐藏疲惫。外柔内刚,二百五十年完美公主的代价
      契灵: 雪魇、焰鬃(两头高阶灵兽)
    苍曜·无瑜:
      身份: 苍澜国次子,暗探
      修为: 金丹初期
      灵根: 地灵根·土木双
      性格: 孤僻锋利,渴望被接纳。因契灵被视为不祥,在暗处守护家人
      契灵: 幽翳噬梦蝶
    苏念卿:
      身份: 苍澜国三公主
      修为: 金丹前期
      灵根: 地灵根·风
      性格: 克制聪慧,被困住的向往。被当作储君培养却渴望自由
    小倩:
      身份: 枉死城新鬼,生前为苍澜国落雁镇绣娘
      修为: 筑基中期(鬼修)
      灵根: 变异阴灵根
      性格: 懵懂善良,不甘倔强。死后三个月仍未接受自己已死的事实
