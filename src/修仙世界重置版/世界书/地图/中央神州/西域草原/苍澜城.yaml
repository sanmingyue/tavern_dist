苍澜城:
  定位: 苍澜国都城,西域草原的政治与军事中心

  地理:
    位置: 西域草原西南部,背靠苍澜山脉,面朝广袤草原
    地形: 依山而建,城墙高耸厚重,王宫修建在山腰处俯瞰全城
    灵脉: 苍澜山脉中有一条中品灵脉,供王室与城中修士修炼
    规模: 大型城市,常住人口约三百万,修士数十万

  城市特色:
    修真王都: 与大雍天启城不同,苍澜城由修士王室直接统治,城中修真氛围远比凡人王朝浓厚
    驭兽之城: 城中随处可见修士携带灵兽出行,街道设计比普通城市宽阔数倍以容纳大型灵兽通行
    西域风情: 建筑风格粗犷大气,以石材与灵木为主,城中多露天广场和驭兽训练场
    军事要塞: 驭灵营总部设在城中,城防坚固,是中央神州西部最强的军事堡垒

  主要区域:
    王宫: 苍曜王庭所在,修建在苍澜山半腰,居高临下气势恢宏
    军营区: 驭灵营驻扎地,占据城西大片区域,常年有数万驭灵营将士操练
    修士坊市: 城中最繁华的商业区,经营丹药、法器、功法、灵材等修仙物资
    凡人城区: 凡人百姓聚居地,虽无灵力但生活富足,受王室庇护
    演武场: 城中公共训练场,修士与驭灵营将士在此切磋训练
    外交馆: 接待各方使节的场所,苍曜·璃音常驻此地处理五宗外交事务

  经济:
    支柱产业: 灵兽养殖、驭兽用品制造、军事物资供给
    贸易: 与百兽城互通有无,灵兽相关物资输出,丹药法器等物资输入
    农牧: 城外草原是天然牧场,凡人牧民供应城中肉食与皮革

  治安:
    管理: 苍澜王室直管,驭灵营负责城防,城卫军负责治安
    规矩: 城内禁止私斗,修士纠纷需到王庭裁决
    特殊: 王宫区域禁止外人进入,军营区未经许可不得靠近

  与外界关系:
    百兽城: 共管城市,经济互补
    万兽山庄: 盟友,定期互派使节
    大雍天启城: 名义上的宗主,实际互不干涉
    各大宗门: 通过苍曜·璃音维持外交关系

  常驻路人:
    哈尔巴:
      身份: 凡人牧民,城外牧场头领
      年龄: 五十五岁(凡人)
      修为: 无修为
      特征: 草原汉子,管着城外三百里牧场,每月进城送肉食皮革,嗓门能震碎茶碗,对灵兽敬而远之
    乌兰:
      身份: 修士坊市丹药铺女掌柜
      年龄: 八十余岁
      修为: 金丹初期
      灵根: 玄灵根·双属性(火木)
      特征: 草原散修出身,自学成才的三品丹师,丹药价格公道,常给驭灵营打折,军营里人缘极好
    秦远:
      身份: 外交馆侍从武官
      年龄: 三十岁
      修为: 筑基后期
      灵根: 黄灵根·双属性(金土)
      特征: 大雍出身的游历剑修,因仰慕苍澜国驭兽文化留下效力,在外交馆负责接待各方使节,做事利落
    阿依古丽:
      身份: 演武场茶水摊贩
      年龄: 二十岁(凡人)
      修为: 无修为
      特征: 牧民家的小女儿,在演武场边卖奶茶烤肉,看驭灵营将士操练看得入迷,暗中记下每种灵兽阵法的走位
    老巴图:
      身份: 城卫军老兵,巡逻队长
      年龄: 六十岁
      修为: 炼气九层
      灵根: 黄灵根·双属性(土火)
      特征: 驭灵营退役老兵,契灵战死后无力再签新契,转为城卫军巡逻,对城中每条街巷了如指掌
