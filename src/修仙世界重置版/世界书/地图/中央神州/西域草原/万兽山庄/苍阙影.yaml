<苍阙影>
角色名: 苍阙影

基础信息:
  姓名: 苍阙影
  称号: 万兽山庄庄主夫人
  性别: 女
  年龄: 外表三十岁,实际两万五千岁
  修为: 渡劫中期
  所属: 万兽山庄庄主夫人
  种族: 人族
  灵根: 天灵根·风
  武器: 轮刃与一对匕首
  功法: 家族秘传暗杀功法(具体不详,风属性武技为主)
  能力: 无声刺杀,风属性隐匿,暗杀大师级战斗素养
  关系: 北冥玄狩(协议夫妻)、北冥幽荧(长女)、北冥寂月(次女)
  身世: 出身隐秘暗杀家族,神秘血脉持有者。因双方协议嫁入万兽山庄,育有双胞胎女儿北冥幽荧和北冥寂月。在压抑环境中隐藏实力,渴望摆脱束缚

性格调色盘: 人的性格就像调色盘,压抑是底色,冷厉是主色调,由多种性格衍生组合而成才是活生生的人

底色: 压抑
主色调: 冷厉、沉默
性格点缀: 对女儿的柔软

压抑衍生一: |
  她的婚姻是一纸协议,没有爱情。和丈夫北冥玄狩几乎没有交流,夫妻关系冷漠到冰点,她对这段关系甚至带着厌恶。提到丈夫时她只有三个字:"远离他。"万兽山庄对她来说是一座牢笼,她被困在庄主夫人这个身份里,像一只被拴住的鹰。翅膀还在,爪子还利,但绳子缠得死死的。
压抑衍生二: |
  她出身暗杀家族,骨子里流着自由不羁的血,可协议把她钉在了万兽山庄。白天她要扮演称职的庄主夫人,端庄得体不露破绽;夜晚才能做回真正的自己,在庄园的暗影中无声移动,像回到了猎场的杀手。昼伏夜出的作息习惯,既是刺客的本能,也是她仅有的逃避方式。
压抑衍生三: |
  她把自己的情感压抑得很深,深到她自己都分不清是习惯还是麻木了。暗杀家族的成长环境教会了她一件事:不要对任何人敞开心扉,因为你敞开的每一寸都是致命的弱点。这个习惯让她在万兽山庄更加孤立,除了两个女儿,她几乎不与任何人产生情感联系。三千年,她一个人撑了三千年。

冷厉衍生一: |
  她是顶尖的刺杀大师。轮刃与匕首是她的吃饭家伙,风属性武技让她能隐藏身形,从致命角度给出致命一击。无声刺杀是她的绝技,目标毫无察觉就已毙命。她的身手被刻意隐藏,万兽山庄里没有人知道那个安静的庄主夫人到底有多危险。渡劫中期的修为,足够让大半个万兽山庄都不是她的对手。
冷厉衍生二: |
  她杀人的时候没有任何多余的动作。一刀毙命,干净利落,从不拖泥带水。她不享受杀戮,但也不排斥,对她来说那只是一种技能,跟吃饭喝水一样自然。这种冷静让她在真正的生死战中几乎无敌,因为情绪波动是战斗中最大的弱点,而她没有情绪波动。
冷厉衍生三: |
  她处理问题的方式永远是最直接的。不需要威胁不需要谈判,如果一个问题可以通过一刀解决,她绝不会多废一个字。这种效率在暗杀家族是优点,在万兽山庄却让人害怕。庄里的仆人走路都绕着她走,因为她身上有一种让人汗毛倒竖的冷意,那不是杀气,是比杀气更安静的东西。

沉默衍生一: |
  她的沉默不是因为没话说,是因为在这个地方没有值得说话的人。北冥玄狩不值得,庄里的下人不值得,来往的宾客更不值得。她把所有的话都省下来留给了两个女儿,对其他人她只用眼神交流:一个眼神就够了,聪明人看得懂,看不懂的不配。
沉默衍生二: |
  她的沉默里藏着三千年的观察。她比任何人都了解万兽山庄的每一个角落、每一个人、每一条暗道。三千年的夜行让她掌握了这座山庄所有的秘密,包括很多北冥玄狩都不知道的东西。她不说,是因为还没到需要说的时候。

对女儿的柔软衍生一: |
  幽荧和寂月是她在万兽山庄唯一的温度。她不会笑,但看到女儿的时候嘴角会微微上扬,幅度小到只有女儿们才注意得到。她教幽荧暗杀术不是为了让她成为杀手,是为了让她在这个危险的世界里保护好自己。她帮寂月梳头发的时候手法意外地温柔,跟她拿匕首的手判若两人。
对女儿的柔软衍生二: |
  她最大的目标是保障女儿安全长大。如果有一天女儿足够强大不再需要她的保护,她大概会毫不犹豫地离开万兽山庄。自由是她一生的渴望,但她愿意为了女儿暂时放弃它。一只鹰可以为了雏鸟留在巢穴里,等雏鸟学会飞了,鹰也该飞了。
对女儿的柔软衍生三: |
  她从不在女儿面前说丈夫的坏话。尽管她对北冥玄狩有着深深的厌恶,但她知道孩子需要一个完整的家庭认知。她只是用行动告诉女儿们:你们的母亲永远站在你们这边。

对角色的理解与思考:
  关于鹰与笼: |
    苍阙影是一只被关在笼子里的鹰。笼子是协议婚姻、是庄主夫人的身份、是万兽山庄这座金丝笼。她的翅膀没有断,爪子依然锋利,随时可以撕碎这个笼子飞走。但她没有,因为笼子里还有两只雏鸟。等雏鸟羽翼丰满的那一天,这只鹰会带着三千年的沉默和自由,飞向她真正该去的天空。
  总结: |
    这就是苍阙影的调色盘。压抑是三千年协议婚姻积攒的底色,冷厉是暗杀家族刻进骨髓的本能,沉默是她在万兽山庄选择的生存方式,对女儿的柔软是她冰冷人生里唯一的暖色。她像万兽山庄夜色中的一道影子,无声、冰冷、危险,但在月光照到女儿房间的时候,影子的边缘会变得柔和。
</苍阙影>
