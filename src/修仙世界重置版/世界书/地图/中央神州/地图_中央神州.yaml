<中央神州>
中央神州:
  地理: 阴阳大陆核心腹地，灵气最鼎盛，西北高峻东南平缓，四通八达

  剑宗地界:
    万剑天池: 山门核心，万丈石剑插入苍穹，七十二座剑峰悬浮形成万剑朝宗大阵
    核心: [洗剑池(天地灵液涤荡剑心), 论剑坪, 藏经剑阁(巨大裂隙中玉简), 剑冢(阴面山谷埋葬折断飞剑)]
    附属: 剑鸣城，城内十之八九剑修
    资源: 天外剑铁、庚金精粹、悟剑石

  丹宗地界:
    丹霞峰: 九座丹炉状赤色山峰，地火资源丰富
    核心: [乾坤药圃(小乾坤术开辟独立空间培育万种灵药), 百草堂(大陆丹药交易中心), 丹塔(九十九层存最高传承), 地火心宫(地下三千六百间炼丹室)]
    附属: 百草集(药材铺/丹炉阁/医馆)
    资源: 高品灵药、地心火莲、丹方玉简

  玄天宗地界:
    天枢峰: 主峰，峰顶观星阁冰晶卦盘日夜运转
    核心: [玉衡峰(护山大阵寒梅照影阵眼), 天权峰(执法堂/思过崖), 星河秘境]
    附属: [天机城(修士交换情报), 星落镇]
    资源: 星纹石、占卜法器、预言典籍

  太虚宗地界:
    主浮空岛: 巨大浮空山，殿宇由符文凝聚
    核心: [符海(流动液态符文平原), 阵枢殿, 万符楼(建筑本身是复合阵法), 试炼迷宫(随机变化阵法)]
    附属: 天工坊(立体城市，正邪不拘)
    资源: 高阶符纸、灵墨、阵旗阵盘、空间石

  凛霜剑门地界:
    位置: 中央神州极北边缘，靠近凛风海峡北接北原魔土
    核心: [霜剑主峰(冰霜风暴笼罩), 寒池剑庐(冰湖上), 冰封剑冢]
    附属: 临渊城(寒晶交易所，北境最大灵石交易中心)
    资源: 寒晶、冰髓、霜铁

  百草庐地界:
    位置: 中央神州东部，靠近东荒边界，四季如春
    核心: [万药园(灵药培育), 医道堂, 试药崖]
    附属: 常春城(药铺医馆林立)
    资源: 珍稀灵药、配伍秘方、解毒圣药

  万法宗地界:
    核心: [万法殿(五行/炼体/丹器/符阵分殿), 藏经万卷楼, 试炼百峰(108座)]
    附属: 万象城(四方贸易枢纽)

  天剑圣地地界:
    位置: 天脊山脉主脉之上
    核心: 圣剑殿(供奉神斩与勿忘), 天剑试炼场

  玉清道宫地界:
    核心: [推演殿(玄阳真人推演天机), 阵法传承阁, 藏经洞]

  万兽山庄地界:
    位置: 中央神州西部边缘
    核心: [驯兽场, 契约殿, 兽魂塔]
    附属: 百兽城(与苍澜国共管)

  并蒂宫地界:
    位置: 中央神州南部靠近南疆
    并蒂湖: 天然灵湖，并蒂莲四季不败，湖水纯阴灵力非女修入湖被排斥
    核心: [莲心岛(山门), 映月殿(水镜映照万里), 双蕊阁(配灵泉双修), 莲池秘境(并蒂莲海幻境试炼)]
    附属: 莲华镇

  归稚宗地界:
    童真谷: 灵气蕴含回溯之力，花草树木呈幼态，千年古木只三五丈高
    核心: [稚心峰(山门), 归元殿(归元泉), 百趣园, 逆生林(时光之道紊乱万物逆向生长)]
    附属: 稚趣坊

  蝶化宗地界:
    蝶梦谷: 中央神州中部，终年蝶群纷飞花香弥漫，幻境与现实交织
    核心: [化蝶峰(山门), 蝶变殿(阴阳蝶变诀传承), 梦蝶池(幻术修炼), 蝶舞坊]

  噬心殿地界:
    位置: 中央神州东南部靠近南疆
    赤魇沼: 暗红色水体弥漫剧毒
    核心: [百蛊池(心毒/魂毒/尸蛊), 噬魂林(食人毒草), 炼毒渊(毒液如湖)]

  合欢宗地界:
    位置: 天启城地下极深处
    极乐幻城: [合欢殿(宗主议事修炼), 温柔乡, 暗香阁(情报/暗杀), 百花楼(双修核心), 千毒阁(春药/媚药/奇毒), 毒圃(炼毒之所)]

  大雍皇朝:
    天启城: 中央神州最强凡人王朝都城
    核心: [承天殿, 凤仪宫, 通天塔, 观星台, 人皇墓]
    天河情报网中枢: 听潮小筑(洛水城)，长公主姬清舞掌控

  天命神教:
    位置: 洛水城·洛水河畔
    核心: [天命神殿, 星谕塔(观测命运), 轮回池, 织命坊(编织命运), 裁决之崖(处决异端)]

  墨家机关城:
    核心: 天枢核(城心)
    地点: [巨子城(政治中心), 神工之心(动力源), 万象天仪, 铸械坞, 天机阁, 通天梯, 兼爱坊(居民区), 非攻要塞(防御核心)]

  自然地理:
    天脊山脉: 横贯东西如大陆脊梁，主峰不周峰，险地[葬妖谷, 风吼涧, 雷鸣顶]
    洛水: 母亲河，发源天脊山脉东流入海，河水蕴灵气

  泣血谷:
    位置: 中央神州东南靠近南疆
    性质: 蛊魔宗在神州的秘密据点，终年血雾弥漫蛊虫横行
    核心: [蛊血祭坛, 炼蛊窟, 血蛊牢笼]

  交通: 神州传送总枢(天启城附近，六大宗门共管), 各城飞舟码头
</中央神州>
