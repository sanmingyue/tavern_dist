<南境水乡>
南境水乡:
  方位: 中央神州南部
  地貌: 并蒂湖碧波万顷,并蒂莲四季不败。蝶梦谷终年蝶群纷飞花香弥漫,幻境与现实交织
  核心势力: 并蒂宫、蝶化宗
  附属城镇: 莲华镇

  区域特色:
    灵气特质: 南部灵气温润纯净,偏阴柔,适合阴属性修炼
    环境风貌: 湖光山色,花海蝶舞,是中央神州最美的区域之一
    文化氛围: 两个中立宗门都有独特的性别文化,并蒂宫为纯女性宗门,蝶化宗弟子皆男性以女装示人
    宿敌关系: 并蒂宫与蝶化宗理念对立三千年,并蒂宫主张"纯阴合和方为正道",蝶化宗主张"美无性别之分,阴阳无别"

  势力分布:
    并蒂宫:
      位置: 并蒂湖·莲心岛
      定位: 中立纯女性宗门,阴阴交融灵魂共鸣
      宫主: 白星(渡劫大圆满)
    蝶化宗:
      位置: 蝶梦谷·化蝶峰
      定位: 中立特殊宗门,弟子皆男性以女装示人
      宗主: 花千落(蝶仙,真仙境二重天)
    莲华镇:
      位置: 并蒂湖东岸
      定位: 依湖而建的小镇,两宗弟子采买休闲之地

  区域关系:
    并蒂宫与蝶化宗: 理念宿敌,三千年对抗。白星与花千落打了三千年谁也赢不了谁,私底下偶尔喝茶但每次都以吵架收场
    与正道宗门: 两宗均保持中立,不主动参与正邪纷争
    与合欢宗: 并蒂宫经常被外界与合欢宗混淆但理念截然不同;蝶化宗与合欢宗有微妙竞争关系
</南境水乡>
