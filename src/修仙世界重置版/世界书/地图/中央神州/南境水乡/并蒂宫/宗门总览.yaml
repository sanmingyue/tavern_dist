并蒂宫:
  势力定位: 中立特殊宗门,纯女性修炼宗门,精于阴阴交融与灵魂共鸣之道

  核心特色:
    纯女性宗门: 只收女弟子,以并蒂心法修炼纯阴灵力
    双修理念: 追求两位女修之间真正的灵魂交融与平等共鸣,强调彼此增益而非单方面汲取。与合欢宗有本质区别
    自愿与平等: 宗门一切关系建立在自愿基础上,强迫行为零容忍

  山门:
    位置: 中央神州南部·并蒂湖·莲心岛
    并蒂湖: 天然灵湖,并蒂莲四季不败。湖水含纯阴灵力,非女修入湖会被灵力排斥
    莲心岛: 湖心浮岛,并蒂宫山门所在。建筑以白玉和莲纹为主,素雅清丽

  核心建筑:
    映月殿: 宗门核心,宫主理事之所。殿内有一面巨大的水镜可映照万里
    双蕊阁: 配灵泉双修之所
    莲池秘境: 并蒂莲海幻境试炼

  势力规模:
    宫主: 白星(渡劫大圆满)
    执事: 温如玉(元婴后期)
    弟子: 数百名女修

  弟子阶梯:
    侍莲:
      人数: 百余人
      修为范围: 凡人至炼气中期
      职责: 照料并蒂湖莲花、打理山门日常、侍奉高阶弟子起居
      特征: 多为被并蒂宫收留的孤女或逃婚女子,在宗门中安身立命,尚未正式修习并蒂心法
    外门弟子:
      人数: 三百余人
      修为范围: 炼气后期至筑基后期
      职责: 维护并蒂湖结界、在莲华镇采购物资、协助灵茶馆经营
      特征: 已修习并蒂心法初阶,可独立运用纯阴灵力,但尚未寻得心意相通的道侣
    内门弟子:
      人数: 不足百人
      修为范围: 金丹初期至元婴初期
      职责: 守护莲心岛、修习高阶并蒂功法、代表宗门外出交涉
      特征: 皆已寻得灵魂共鸣的道侣,双修默契深厚,战力远超同阶单修
    亲传弟子:
      人数: 不足十人
      修为范围: 元婴中期至化神期
      职责: 随宫主或执事修行、掌管宗门核心事务、守护映月殿
      特征: 宫主白星亲自指点,并蒂心法已入大成,可施展灵魂共鸣领域

  宗门立场: 中立偏正。不主动参与正邪纷争,但绝不容许外人侵犯门中弟子。与合欢宗有本质区别,合欢宗以双修为手段谋取利益,并蒂宫以双修为目的追求大道

  宿敌: 蝶化宗。两宗皆为性别特殊宗门但理念完全相反。并蒂宫主张"纯阴合和方为正道",蝶化宗主张"美无性别之分,阴阳无别"。宫主白星与蝶化宗宗主花千落争论三千年谁也说服不了谁

  NPC速览:
    白星:
      身份: 并蒂宫宫主
      修为: 渡劫大圆满
      灵根: 天灵根·纯阴
      特殊体质: 阴阳逆转体,日间成熟冷峻御姐形态,夜间回溯幼年形态,两种形态性格截然相反但记忆共享
      性格: 白天高冷威严,夜间娇蛮任性。六千年来将并蒂宫从小门派发展为中立宗门
    温如玉:
      身份: 并蒂宫执事
      修为: 元婴后期
      灵根: 变异灵根·冰
      性格: 温柔果决,保护欲强。逃离包办婚姻后加入并蒂宫,成为宗门除宫主外修为最高者
