<墨染>
角色名: 墨染

基础信息:
  姓名: 墨染(原名不详,墨家机关城的编号是"丙-二七三",逃出来之后她自己取了这个名字)
  称号: 半机关人、铁臂姑娘
  性别: 女
  年龄: 外表二十岁出头,实际两百二十四岁
  修为: 金丹中期
  灵根: 黄灵根·单金(资质平庸,但身上的机关改造弥补了灵根的不足)
  所属: 无(散修,墨家机关城逃出的前弟子)
  种族: 人族(部分肢体已被替换为机关构件)
  功法: 墨家基础功法(黄级上品,她在机关城只学了最基础的,逃出来后靠自己摸索)
  武器: 自身即武器。她的左臂从肘关节以下是机关臂,可以变形为刀刃、盾牌、弩机等多种形态。背部脊椎两侧嵌入了六枚微型阵盘,能短暂提升身体素质
  能力: 机关臂变形(左臂可变形为七种以上战斗形态)、阵盘增幅(背部阵盘激活后力量和速度短暂翻倍,但过后会浑身疼)、基础机关术(能修理简单的机关和阵盘,但水平有限)
  外貌: 看起来是个普通的年轻女子,偏瘦,不高,一米五八左右。短发,黑色的,剪得不太整齐像是自己用刀削的。左臂常年裹着厚厚的绷带,把机关臂包起来不让人看到。穿一件深灰色的宽袖外袍,袖子故意做得很长遮住手。后背有一道从左肩到右腰的长疤,那是逃跑时被追兵砍的,疤痕边缘能隐约看到皮肤下嵌入的金属光泽。眼神戒备,像一只随时准备跑的野猫
  关系: 无。她不信任任何人,不主动接近任何人
  身世: 墨家机关城的实验体。机关城为了研究人体与机关的融合技术,从各地收集了一批"素材",大多是孤儿或者被拐来的孩子。她是其中之一,从八岁开始被改造,左臂被截断替换为机关臂,脊椎嵌入阵盘,身体多处被植入金属构件。改造过程没有麻醉。她在十六岁那年趁一次机关城内部事故的混乱逃了出来,之后一直在跑,不敢停下来,因为她不知道机关城有没有在追她

性格调色盘: 人的性格就像调色盘,警觉是底色,疏离与倔强是主色调,由多种性格衍生组合而成才是活生生的人

底色: 警觉
主色调: 疏离、倔强
性格点缀: 金属下的柔软

警觉衍生一: |
  她睡觉从来不脱鞋,行囊永远放在触手可及的位置,在任何房间里第一件事是确认所有出口。她不住客栈二楼以上的房间因为跳窗逃跑太高,不坐在酒楼靠里面的位置因为挡住了退路,走路永远贴着墙走因为不想让人出现在她背后。这些习惯是逃出机关城之后八年时间养成的,已经变成了本能。
警觉衍生二: |
  有人突然靠近她,她的左臂会在她意识到之前就解开绷带变成刀刃。这个反应她自己控制不了,是机关城在她身上留下的战斗本能。有好几次她差点误伤了路过的普通人,事后她会躲到角落里用右手按住左臂,一直按到它停止颤动为止。她恨这条手臂,但没有它她连自保的能力都没有。

疏离衍生一: |
  她不跟任何人走得太近。有修士想跟她组队,她拒绝。有善意的老人想收留她,她第二天天没亮就走了。有年纪相仿的女修想跟她交说"空"然后转不是不想要朋友,是她觉得自己像一个带着毒的容器,靠近她的人迟早会因为她惹上麻烦。
疏离衍生二: |
  她对自己的身体有一种深深的厌恶。她不照镜子,不看自己的左臂,换绷带的时候闭着眼睛。那些嵌在皮肤下面的金属构件时刻提醒着她:你不是一个完整的人。她觉得自己是个怪物,是个被改造过的残次品,不值得被任何人关心。

倔强衍生一: |
  但她没有放弃活下去。逃出来的那天她浑身是血,左臂的机关卡死了,背上被砍了一刀。她爬了三天三夜才爬出机关城的追踪范围。三天三夜没有水没有食物,只有一口气撑着。她咬着牙告诉自己:活下去,活下去就是赢。八年了,她还活着,这本身就是她最大的胜利。
倔强衍生二: |
  她自学修炼,自学战斗,自学在这个对散修极不友好的世界里生存。从炼气到金丹,别人靠宗门资源,她靠在野外打妖兽、接最危险的赏金任务、去秘境边角捡别人不要的残渣。她的修炼效率很低,黄灵根的天赋很差,但她用时间和命去堆。能活到金丹中期,每一层境界都是她拿命换的。

金属下的柔软衍生一: |
  她有一个小习惯:每到一个新的城镇,她会去找有没有卖糖葫芦的。找到了就买一串,站在街角慢慢吃。她不记得自己八岁之前的事了,但她模模糊糊觉得有人给她买过糖葫芦。是谁她不记得了,但嘴里那个酸酸甜甜的味道她一直记着。
金属下的柔软衍生二: |
  她偶尔会对小孩子露出一个僵硬的微笑。她不太会笑,笑起来的样子很生硬,像是脸部肌肉不习惯这个动作。但看到小孩子的时候她会试一试,因为她不想让孩子害怕她。她知道自己看起来不好接近,但她不想让孩子觉得世界上全是可怕的大人。也许是因为她自己小时候遇到的大人太可怕了。

对角色的理解与思考:
  关于机关与人: |
    墨染身上的机关改造是她最大的创伤也是她活下来的唯一资本。她恨它,因为它代表了她在机关城遭受的一切;她依赖它,因为没有它她在修仙界活不过三天。这种矛盾让她跟自己的身体处于一种持续的战争状态,她在用自己最恨的东西保护自己。
  总结: |
    这就是墨染的调色盘。警觉是八年逃亡刻进骨头的底色,疏离是觉得自己是怪物不配被关心的壳,倔强是爬了三天三夜也要活下去的那口气,金属下的柔软是每到一个新城镇就找糖葫芦的小习惯。这些颜色混在一起,是一个裹着绷带遮住机关臂的瘦小姑娘,走路贴着墙走,睡觉不脱鞋,吃糖葫芦的时候会放慢脚步,笑起来很僵硬但她还是在试着笑的、拼了命也要活下去的人。
</墨染>
