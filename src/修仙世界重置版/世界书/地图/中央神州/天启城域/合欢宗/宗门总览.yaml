<合欢宗>
宗门名: 合欢宗

基础信息:
  名称: 合欢宗
  地位: 六大仙宗之一,下三宗
  驻地: 天启城地下极深处·极乐幻城,入口分散于城中各大烟花之地、赌坊、酒楼
  特色: 双修、毒术、暗杀三位一体,以欲入道

宗门概况:
  核心理念: 顺应本心,极乐修仙。压抑欲望乃是逆天而行,唯有通过灵与肉的极致交融,方能窥得阴阳大道
  宗门手段: 弟子无论男女皆容貌绝美,精通媚术与幻术;双修功法可快速提升修为并采补对方元气;毒术擅长控制人心、激发欲望;暗杀通过双修接近目标后无声取命
  独门秘药: 合欢散,天下第一奇毒,无色无味,一旦中了唯有与人交欢方能化解,否则便会欲火焚身爆体而亡
  渗透能力: 门人渗透于天启城各行各业甚至宫廷之中,通过双修采补、下毒控制、情报暗杀等手段收集资源发展势力
  宗门规模: 内门弟子一万余人,外门弟子五万余人,暗线成员数十万人渗透于各大势力
  处境: 被正道所不容,常年处于被追杀的状态,但极其擅长隐藏身份与气息

核心人物速览:
  宋馨:
    身份: 合欢宗宗主
    修为: 真仙境八重天
    灵根: 地灵根·魅惑
    简介: 过往成谜,慵懒随性全凭喜好,天生魅惑之体,精通毒术与媚术,对世界已然倦怠
  沈艺清:
    身份: 合欢宗首席大弟子
    修为: 渡劫期大圆满
    灵根: 玄灵根·木火双
    简介: 合欢宗异类,作为弟子仍保持处女之身,千年罕见的毒术天才,呆萌天然
  柳倾城:
    身份: 合欢宗暗香阁阁主
    修为: 金丹后期
    灵根: 地灵根·阴
    简介: 掌管情报与暗杀部门,拥有数十张面孔,天启城最精密的暗棋
  九娘:
    身份: 叛逃者,现为独立赏金猎人
    修为: 金丹后期
    灵根: 玄灵根·水魅双
    简介: 前合欢宗内门弟子,无法接受宗门手段而叛逃,用合欢宗的本事反猎邪修

极乐幻城:
  概况: 合欢宗山门所在,隐于天启城地下极深处。城中以幻阵伪装,不知情者即使走入入口也只会迷失在幻境中。城内灯红酒绿如同不夜之都,弟子行事放浪形骸,追求感官刺激,实则是修炼与采补的一环
  核心区域:
    合欢殿:
      定位: 宗主议事修炼之所,极乐幻城最深处
      布局: 大殿以玉石筑就,阵法隔绝外界窥探,殿内常年弥漫淡紫色雾气(合欢香,可安神定魂亦可催情)。正殿为宗主宋馨议事与接见外客之处,后殿为宋馨私人修炼室,设有天地阴阳双修大阵。殿外守卫森严,非宗主亲传不得入内
    百花楼:
      定位: 弟子修炼双修功法的核心区域,极乐幻城最繁华之处
      布局: 七层高楼,每层百余间修炼室,配有不同品级的双修阵法。一至三层为外门弟子区,四至五层为内门区,六层为核心弟子区,七层为宗主亲传专用。楼外有百花园,种植各类灵花异草,兼具观赏与炼药之用。底层设有迎宾厅,亦是合欢宗对外交际的门面
    暗香阁:
      定位: 情报暗杀部门驻地,由柳倾城掌管,极乐幻城最隐秘之处
      布局: 隐于幻城地下夹层,入口极难发现。阁内设有情报汇总殿(各地暗线传回的情报在此汇总分析)、易容术修炼室(弟子在此学习千面之术)、毒针暗器库(存放暗杀用具)、任务发布厅(暗杀与渗透任务的分配之所)。柳倾城的私室位于阁中最深处,据说连宋馨也不常去
    毒圃:
      定位: 毒术研究与炼毒之所,沈艺清常驻,极乐幻城东侧独立区域
      布局: 以阵法与幻城主体隔离(防止毒气扩散)。圃内分为毒草园(种植上百种毒草灵药)、炼毒房(配有特制玄铁炼毒炉,可炼制合欢散等宗门秘药)、试毒场(以妖兽或俘虏试验毒效)、藏毒阁(存放历代积累的毒物与解药配方)。沈艺清虽为首席弟子,却几乎不去百花楼,终日泡在毒圃研究毒术
</合欢宗>
