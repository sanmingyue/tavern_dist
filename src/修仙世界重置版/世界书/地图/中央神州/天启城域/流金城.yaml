<流金城>
流金城:
  位置: 天启城域西南部，洛水支流金沙河畔
  定位: 万宝商会总部所在，中央神州商业贸易中心，灵石交易量居各城之首
  规模: 常住人口约八百万，修士与凡人各占五成。城中流动商客日均数十万
  管辖: 万宝商会自治，大雍皇朝不直接干涉。城中设有仲裁堂处理商业纠纷

  城市格局:
    金沙大街: 贯穿全城的主街，两侧尽是各大商会的总号与分号，建筑以金饰为点缀，入夜后灵灯辉煌如流金淌银
    万宝总号: 城中最宏伟的建筑群，万宝商会总部所在。前厅是开放式的灵材交易大厅，日交易额以百万灵石计。后院是萧家宅邸
    拍卖大殿: 万宝商会举办定期拍卖会之所，每月十五小拍，每年除夕大拍。大拍时各大宗门、世家都会派人前来，一件珍品的价格动辄数十万灵石
    灵石兑换行: 城中有数十家灵石兑换铺，下品灵石、中品灵石、上品灵石的兑换汇率每日波动，专门有人守在门口报价
    百货坊市: 城中最大的综合坊市，分区明确——丹药区、法器区、灵材区、灵兽区、功法区各占一方。比天启城东市的灵宝巷大十倍不止
    仓储街: 城北一带，各大商会的灵材仓库和保险库密密麻麻排列。防盗阵法层层叠叠，比一般宗门的山门禁制还严密
    凡人商街: 城南沿金沙河一带，凡人经营的布庄、粮铺、食铺、客栈聚集。虽然比不上修士坊市的规模，但人气更旺
    赌石坊: 流金城特色，专营未开封的灵矿原石和未鉴定的储物法器。花一笔钱赌里面藏着什么，运气好的一夜暴富，运气差的倾家荡产

  城市氛围: 流金城是一座彻底被金钱驱动的城市。空气中弥漫着灵石摩擦的清脆声和讨价还价的嘈杂声。每个人走路都快，说话都直奔主题，寒暄在这里被视为浪费时间。凡人伙计在灵材铺里报价比修士还利索，修士在赌石坊里赌红了眼比凡人还疯。唯一能让整座城安静下来的时候，是每月十五拍卖大殿开拍的那一刻

  常驻人物:
    钱多多:
      身份: 灵石兑换行"通宝号"掌柜
      年龄: 外表三十余岁
      修为: 金丹前期
      灵根: 黄灵根·单金
      特征: 流金城灵石兑换行当里的老手，精通灵石品鉴之术，下品灵石里掺了碎渣他用指头一捻就知道。脑子里装着一本活账簿，各类灵材的市价浮动、各家商会的信誉评级他全记得清清楚楚。为人嘴碎但消息灵通，想知道流金城最近出了什么好货找他就对了
    赵搬山:
      身份: 仓储街搬运队头领
      年龄: 四十岁
      修为: 炼气八层
      灵根: 黄灵根·单土
      特征: 带着一帮炼气期的散修在仓储街做搬运工。修为低微但胜在力气大人踏实，各大商会的灵材入库出库都找他的队伍。他立了规矩——手下的人偷一颗灵石就永远不许踏入仓储街。十年来没出过差错，各大商会都放心把货交给他
    翠娘:
      身份: 凡人商街"翠娘包子铺"老板
      年龄: 三十八岁
      修为: 凡人
      特征: 做包子的手艺一般但分量足实在。她的包子铺是仓储街搬运工和凡人商街伙计们最爱去的地方，便宜管饱。性格爽利，遇到穷困潦倒的散修会免费送几个包子，说"饿着肚子做什么生意"
    马牙子:
      身份: 赌石坊"万象原石行"掌柜
      年龄: 外表四十余岁
      修为: 筑基后期
      灵根: 玄灵根·双属性(土金)
      特征: 赌石坊最出名的原石鉴定师兼庄家。他卖的原石成色公道，既不暗中做手脚也不保证赌出好东西，愿赌服输是他的规矩。据说他自己从不赌石，因为"卖石头的人要是也赌，那就没有人信了"。私下里收藏了几块舍不得卖的极品原石，有时候半夜拿出来摩挲
    柳账房:
      身份: 万宝商会流金城总部账房先生
      年龄: 外表五十余岁
      修为: 筑基中期
      灵根: 黄灵根·单木
      特征: 在万宝商会做了八百年账房，经手的灵石能堆成一座山。性格古板严谨，一个铜板的差错都会让他追查到底。萧远山信任他如信任自己的左手。他对周老三这种小伙计态度严厉，但年底总是多给几块灵石当红包
    独眼张:
      身份: 百货坊市法器区散修商贩
      修为: 筑基前期
      灵根: 黄灵根·单金
      特征: 左眼被妖兽抓瞎，但鉴定法器的眼力反而更毒。他不开铺子，就在法器区支个摊位，卖的都是自己从秘境和废墟里捡回来的旧法器。有些是宝贝有些是废铁，他一概不欺客如实说明，至于买不买全看缘分
    方伯:
      身份: 拍卖大殿引导侍从
      年龄: 五十岁
      修为: 凡人
      特征: 在拍卖大殿做了二十年引导侍从，专门负责接待贵客入场安排座次。察言观色的本事堪称一流，谁有钱谁装有钱他一眼便知。举止得体进退有度，连大乘期的修士都夸他懂规矩

  特色资源: 各类灵材(汇聚天下货源)、灵石兑换、拍卖珍品、赌石原矿、商业情报
  交通: 金沙河码头(连接洛水水系可通天启城)、飞舟码头(通往中央神州各大城市)、万宝商会专属传送阵(仅限商会高层使用)
</流金城>
