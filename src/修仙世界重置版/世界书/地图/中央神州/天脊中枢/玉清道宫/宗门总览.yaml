<玉清道宫>
势力名称: 玉清道宫

基本信息:
  类型: 正道圣地
  位置: 中央神州·天脊中枢·玉清峰
  实力等级: 顶尖势力
  势力规模: 大型
  主要种族: 人族为主

势力概况:
  定位: 中央神州道门圣地，以阵法和推演闻名
  理念: 道法自然，顺应天道
  特色: 精通阵法推演，擅长宏观布局
  地位: 中央神州顶尖势力之一，补天之道核心
  传承: 拥有古老的道家传承

核心人物:
  掌教: 玄阳真人，真仙境三重天
  道宫大脑: 凌风，合体期中期
  圣女: 洛溪月，合体期前期
  掌教亲传: 姚江雪，筑基期中期

势力特点:
  修炼体系: 道家功法，专精阵法推演
  招收标准: 重视悟性和心性
  门规: 道法自然，不可逆天而行
  传统: 以阵法辅助战斗，以推演运筹帷幄
  理念冲突: 凌风的宏观视角与洛溪月的完美主义

主要设施:
  道宫核心: 玉清峰
  修炼场所: 阵法殿，推演阁
  传承之地: 道家传承殿
  禁地: 天机阁

势力定位_补天之道:
  角色: 补天之道的"脑"
  职责: 宏观布局，推演未来
  理念: 顺势而为，为大局可牺牲局部
  矛盾: 理性与情感的冲突

对外关系:
  天剑圣地: 友好，同为正道圣地，补天之道成员
  药神谷: 友好，补天之道成员
  生命之森: 友好，补天之道成员
  极乐宫: 敌对
  万毒神教: 敌对

角色速览:
  玄阳真人:
    性别: 男
    年龄: 外表五十余岁，实际数千岁
    修为: 真仙境三重天
    身份: 玉清道宫掌教
    定位: 道门领袖，补天之道核心
    关键词: 掌教、道法自然、阵法推演
  凌风:
    性别: 男
    年龄: 外表二十五岁，实际一千五百余岁
    修为: 合体期中期
    身份: 玉清道宫掌教亲传弟子，道宫大脑
    定位: 宏观布局者，理性化身
    关键词: 道宫大脑、宏观视角、阵法推演、理性
