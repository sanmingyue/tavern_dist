弟子阶梯:
  杂役弟子:
    人数: 数千人
    修为范围: 凡人至炼气期
    职责: 打扫宫殿、整理阵图典籍、伺候长老起居、维护道宫日常运转
    待遇: 可旁听外门弟子的道家基础课，每月领取少量灵石
  外门弟子:
    人数: 数万人
    修为范围: 炼气期至筑基期
    职责: 学习道家基础功法与阵法入门、完成道宫布置的修炼任务、在道宫外围巡逻
    特征: 修炼道家功法，注重心性修养。玉清道宫选拔严格，外门弟子数量不多但素质较高
  内门弟子:
    人数: 数千人
    修为范围: 筑基期至元婴期
    职责: 研习高阶阵法推演、参与道宫战略布局讨论、接受峰主亲授
    特征: 皆已初步掌握推演之术，能在战斗中布置中型阵法辅助作战。心性沉稳者居多
  核心弟子:
    人数: 数十人
    修为范围: 元婴期以上
    职责: 参与补天之道的战略推演、代表道宫参加各宗交流、守护道宫禁地
    特征: 阵法推演造诣极深，能独立布置大型防御阵法。是玉清道宫未来的中坚力量
</玉清道宫>
