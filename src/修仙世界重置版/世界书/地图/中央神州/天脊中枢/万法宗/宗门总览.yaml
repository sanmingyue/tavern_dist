<万法宗>
势力名称: 万法宗

基本信息:
  类型: 正道强宗
  位置: 中央神州·天脊中枢·须弥山脉
  实力等级: 顶尖势力
  势力规模: 大型
  主要种族: 人族为主

势力概况:
  定位: 综合学术宗门，万法归宗海纳百川
  理念: 有教无类，兼容并蓄
  特色: 收藏天下各派功法典籍，重视理论研究和功法创新
  地位: 中央神州正道强宗之一
  传承: 古老的万法传承，弟子可自由择道

核心人物:
  宗主: 沈微澜，渡劫期大圆满
  宗主亲传: 洛璃，元婴后期

势力特点:
  修炼体系: 万法归宗，弟子可同时修炼多种功法
  招收标准: 有教无类，只要有灵根不看出身
  门规: 万法归宗，海纳百川
  传统: 学术交流和辩论，定期举办法术研讨会
  派系: 内部分为五行派、炼体派、丹器派、符阵派等

主要设施:
  宗门核心: 须弥山脉·万法殿
  修炼场所: 各派分殿
  传承之地: 万法藏经阁
  附属城镇: 万象城，四方贸易枢纽，金融重镇

宗门规模:
  各派峰主: 十二位
  内门弟子: 三万余人
  外门弟子: 二十余万人
  记名弟子: 百万余人
  附属势力: 万象城及周边学派，人口数千万

对外关系:
  与各派: 关系融洽，常进行学术交流
  与太虚宗: 同为学术宗门，关系密切
  中立立场: 不主动参与正邪之争，但立场偏正道

角色速览:
  沈微澜:
    性别: 女
    年龄: 外表三十五岁，实际六万八千岁
    修为: 渡劫期大圆满
    身份: 万法宗宗主，阵尊
    定位: 无声操盘者，将整个大陆视为一盘棋局
    关键词: 宗主、阵法幻术、精神力、战略规划
  洛璃:
    性别: 女
    年龄: 外表十九岁，实际三百三十岁
    修为: 元婴后期
    身份: 万法宗宗主亲传弟子
    定位: 师尊的左膀右臂，核心助手
    关键词: 亲传弟子、多属性法术、潜行侦查、绝对忠诚

弟子阶梯:
  杂役弟子:
    人数: 数万人
    修为范围: 凡人至炼气期
    职责: 整理藏经阁典籍、打扫各派分殿、搬运研究材料、维护万象城学术交流区
    待遇: 可旁听外门弟子的基础功法课，每月领取少量灵石。万法宗对杂役弟子最为宽厚，有教无类的理念从最底层开始贯彻
  外门弟子:
    人数: 二十余万人
    修为范围: 炼气期至筑基期
    职责: 选择一到两种功法方向修炼、参加各派基础课程、在万象城完成宗门任务、参与学术交流活动
    特征: 万法宗外门弟子来源最杂——正道子弟有，邪道改投的有，散修入门的有，甚至有妖族化形来学艺的。宗门不问出身只看天赋和品性，这也让外门弟子之间的氛围比其他宗门更加包容
  内门弟子:
    人数: 三万余人
    修为范围: 筑基期至元婴期
    职责: 深入研习所选功法体系、参与功法创新与改良、在学术论坛上发表研究成果、接受峰主指导
    特征: 皆已在至少一种功法体系上有所建树，不少人同时修炼两三种功法。万法宗内门弟子的特点是"杂而不弱"，虽单项不及专精宗门但综合能力强
  核心弟子:
    人数: 数百人
    修为范围: 元婴期以上
    职责: 主导功法研究项目、代表万法宗参加各宗交流、承担宗门最重要的学术与战斗任务
    特征: 万法归宗之境，能将多种功法融会贯通。是万法宗学术传承的核心力量
</万法宗>
