<百草庐>
百草庐:
  定位: 正道强宗，药宗传承
  宗主: 苏沐青，渡劫期中期，通灵仙草化形
  核心理念: 药有万性，配伍成道

  修炼体系:
    药理配伍: 核心是药性、药理、配伍之道
    以药入道: 通过研究药性提升修为
    医毒同源: 医术、毒术、解毒皆精通

  与丹宗的核心差异:
    丹宗: 炼丹为主，依赖丹炉地火，追求无瑕丹药
    百草庐: 药理为主，不依赖丹炉，以药材配伍炼制汤药散剂膏药

  宗门特色:
    药宗传承: 与丹宗自古分立，各有千秋
    医道圣地: 天下求医问药者的圣地
    不喜争斗: 医者仁心，受人尊敬，正邪两道都敬重

  与外界关系:
    与丹宗: 同为医药传承，关系友好，偶有学术交流
    与噬心殿: 死敌，殿主玉横枝是百草庐叛徒
    与合欢宗: 敌对，合欢宗毒术常害人

  山门地点:
    位置: 中央神州东部·长春原
    环境: 四季如春，木灵气充沛
    建筑: 竹楼木屋，掩映在翠竹灵树之中
    万药园: 种植天下奇花异草

  宗门规模:
    长老: 五位
    内门弟子: 一万余人，皆为药师
    外门弟子: 八万余人，医师和采药人
    记名弟子: 数十万人，各地医馆药铺
    附属势力: 常春城及周边药材产地

  特色资源:
    珍稀灵药: 万药园种植天下奇花异草
    药理典籍: 历代医圣留下的医案药方
    配伍秘方: 独门药剂配方
    解毒圣药: 可解天下百毒

  门规戒律:
    医者仁心: 不得见死不救
    严禁滥用毒术: 毒术只可用于自保和对敌
    严禁泄露秘方: 核心配伍秘方不得外传

  角色速览:
    苏沐青: 宗主，渡劫期中期，天灵根·生命，通灵仙草化形。翡翠绿长发，慈悲温暖，七万二千岁的古老存在
    叶清: 宗主亲传弟子，元婴中期，地灵根·水木双。温和文弱的丹道学徒，与萧千翎为道侣
    萧千翎: 叶清道侣，元婴后期，天灵根·风，散修游侠。万宝商会萧远山之女，行侠仗义的刀客
    姜小满: 外门药园小学徒，炼气七层，黄灵根·木。勤恳认真的采药少女

  弟子阶梯:
    杂役弟子:
      人数: 数千人
      修为范围: 凡人至炼气期
      职责: 浇灌灵草、翻晒药材、清扫药圃、为师兄师姐研磨药粉
      待遇: 每月领取少量灵石和滋补药剂，可旁听外门课程，表现优异者可参加外门考核
      典型: 天不亮就起来浇灵草的少年，在万药园帮忙拔杂草却比谁都认识灵草的小学徒
    外门弟子:
      人数: 八万余人
      修为范围: 炼气期至筑基期
      职责: 采集灵药、学习药理配伍基础、在常春城坐诊义诊、完成宗门采药任务
      特征: 多为药师和采药人，跋山涉水采集灵草是日常。医术水平参差，有些治跌打损伤很在行，有些连脉都把不准。但百草庐门风仁善，即便是外门弟子也恪守"不得见死不救"的门规
    内门弟子:
      人数: 一万余人
      修为范围: 筑基期至元婴期
      职责: 研习高阶药理、配制珍稀药剂、进入万药园深处照料珍贵灵植、接受长老亲授
      特征: 皆已掌握至少数十种常用药方，能独立诊治常见伤病。内门弟子之间常以配伍心得相互切磋
    核心弟子:
      人数: 数十人
      修为范围: 元婴期以上
      职责: 研究疑难杂症解法、开发新药方、代表百草庐参加医道交流、处理正邪两道送来的棘手伤患
      特征: 医术已至通神之境，能辨识天下大部分毒素并配制解药。多为长老亲传弟子
</百草庐>
