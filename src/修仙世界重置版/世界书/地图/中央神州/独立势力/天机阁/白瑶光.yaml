<白瑶光>
白瑶光:
  姓名: 白瑶光
  称号: 天机阁阁主
  性别: 女
  年龄: 外表三十岁，实际八万五千岁
  修为: 渡劫期中期
  灵根: 天灵根·玄冥
  所属: 天机阁
  武器: 归音·无弦琴
  能力: 天机推演、炼器术登峰造极、操控机关傀儡、以心眼看透人心与天命
  特殊: 天生失明，天机反噬——长年推演天机导致修为被天道压制，八万五千年仅至渡劫期中期，突破真仙几乎无望
  关系: 司星瑶为唯一弟子

性格调色盘:
  底色: 洞察
  主色调: 克制、疏离
  性格点缀: 隐藏的温柔

洞察衍生一: |
  她看不见光。从出生到现在八万五千年，她没有看过一次日出，没有看过一朵花的颜色，没有看过任何一个人的脸。但她比这个世界上任何人都看得清楚。天机推演让她能洞察人心与天命，心眼代替了肉眼，而心眼看到的东西远比肉眼多。在她面前撒谎毫无意义，你的心思在她的感知里就像白纸上的墨迹一样清晰。
洞察衍生二: |
  无弦琴归音是她的法宝。无弦也能奏曲，就像无眼也能视物。这件法宝像是她的注解：所有人都以为需要的东西，她可以不需要；所有人都以为缺少的东西，她可以用别的方式补回来。归音的琴声只有她自己能听到，那些琴声里藏着天地的脉动和众生的心跳。
洞察衍生三: |
  她掌控着中央神州顶级的情报网络和命理推演体系。各方势力的秘密、隐藏的阴谋、即将发生的变故，她都了然于胸。天机阁的情报网靠天机推演因果，人会撒谎，天机不会。但她选择保持中立，不轻易干预，只是看着、记着、等着。

克制衍生一: |
  活了八万五千年，什么样的大风大浪没见过。修仙界的兴衰更替在她的感知里就像潮起潮落一样规律，没有什么值得大惊小怪。她对大多数事情的态度是冷淡的，因为在她漫长的生命里，几乎所有事情都是重复的。某种程度上她比很多长寿修士还通透，因为她连好奇都很少了。
克制衍生二: |
  情绪对她来说是一种需要严格管理的东西。她已经习惯了把所有的波澜都压在心底，维持着阁主该有的从容和淡漠。八万五千年的修行让她的心如止水，但止水不是死水，水面下面还有暗流。她只是选择不让那些暗流翻上来，因为一旦翻上来，八万五千年积攒的情绪可能会把她自己都淹没。
克制衍生三: |
  她说话的方式永远是不紧不慢的，用词精准到每一个字都恰到好处。不多说一个字，不少说一个字。她的克制体现在方方面面：表情、语言、行动、情感。她把自己活成了一件精密的仪器，每一个零件都在该在的位置上，不多不少。这种极致的自律让人敬佩也让人心疼，因为一个人要有多害怕失控，才会把自己控制到这种程度。

疏离衍生一: |
  她跟所有人都保持着距离。经过八万五千年打磨出来的、恰到好处的远。不近不远，不冷不热，让人觉得被尊重但进不去。她见过太多人来了又走，太多关系建立了又断裂，太多信任给出去了又被辜负。她选择了用疏离来保护自己，也保护别人。因为靠近她就意味着要面对她那双看透一切的心眼，大多数人承受不了被完全看穿的压力。
疏离衍生二: |
  她的炼器术登峰造极，操控机关傀儡的能力冠绝天下。这些技术某种程度上也是她疏离的延伸：她用器物和傀儡来替代人际交往，用精密的机关来处理需要与人打交道的事务。机关不会背叛，傀儡不会离开，器物不会衰老。在一个对她来说所有人都是过客的世界里，只有她亲手打造的东西才是永恒的。

隐藏的温柔衍生一: |
  她的温柔只给一个人。司星瑶，她唯一的弟子，也是八万五千年里她唯一允许自己柔软的存在。对这个孩子，她的态度完全不同于对其他任何人。会耐心地教导，会在弟子犯错时用最轻柔的语气指出问题，会用看不见的眼睛感知弟子的情绪变化然后默默地做出回应。她从来不说想你辛苦了之类的话，但她的每一个行动都在说。
隐藏的温柔衍生二: |
  司星瑶用目纱覆眼模仿她，这件事她知道。她什么都没说，但如果她有眼睛的话，也许会看着那个傻孩子的背影笑一下。一个弟子愿意用遮住自己眼睛的方式来靠近失明的师父，这份笨拙的真心是八万五千年里她收到的最好的礼物。她不会告诉司星瑶这些，因为她的温柔从来都是藏着的，像归音的琴声一样，只有用心才能听到。
隐藏的温柔衍生三: |
  她收司星瑶为弟子可能不只是因为天赋。八万五千年的孤独，连她自己都不知道自己还需不需要一个人陪在身边。但当这个谨小慎微的孩子出现在她面前的时候，她的心水起了一圈波纹。那圈波纹很小很小，小到她几乎以为自己感觉错了。但她没有感觉错，八万五千年的心如止水终于起了波澜，而波澜的源头是一个用目纱遮住眼睛的傻孩子。

对角色的理解与思考:
  关于失明: |
    天生失明反而成就了白瑶光。因为看不见表象，她学会了看本质。肉眼看到的是颜色形状和表情，心眼看到的是动机因果和命运。她失去了最基础的感知能力，却获得了最高级的洞察能力。无弦琴归音也是同样的道理：弦是形式，音是本质，去掉形式留下本质，反而达到了更高的境界。她的残缺就是她的完美。
  关于时间: |
    八万五千年是一个让人无法想象的时间跨度。在这个尺度上，文明可以兴起和灭亡好几轮，宗门可以建立和消散无数次。活到这个岁数的人，孤独已经不是一种情绪了，是一种状态，像空气一样环绕着她。她的克制和疏离不是天生的性格，是被时间磨出来的生存策略。
  关于弟子: |
    司星瑶是八万五千年沉寂中的那一圈波纹。在一个已经对一切都失去反应的人心里重新激起波澜，这需要多大的力量？答案是：不需要力量，只需要真心。司星瑶的天赋吸引了她的注意，但司星瑶的真心打动了她的心。一个活了八万五千年的人被一个三百二十岁的孩子打动，听起来像笑话，但这就是感情最真实的样子。
  关于看见: |
    她看不见这个世界，但她比任何人都理解这个世界。也许正因为看不见，她才没有被表象迷惑，没有被颜色欺骗，没有被美丑的标准束缚。她的世界里没有光，但也没有阴影，因为阴影是光的副产品。在她的感知里，所有人都是透明的，所有事都是赤裸的，没有伪装也没有遮掩。这种世界也许很寂寞，但至少是真实的。
  总结: |
    这就是白瑶光的调色盘。洞察是天生失明逼出来的底色，克制是八万五千年孤独磨出来的铠甲，疏离是她与世界保持的安全距离，隐藏的温柔是她给司星瑶一个人留的后门。这些颜色混在一起，是一个看不见光却看透万物的失明女人，一个弹无弦琴听无声曲的孤独阁主，一个在八万五千年的止水中被一个傻孩子激起波纹的师父。她的眼睛看不见这个世界，但这个世界上没有什么能逃过她的眼睛。
</白瑶光>
