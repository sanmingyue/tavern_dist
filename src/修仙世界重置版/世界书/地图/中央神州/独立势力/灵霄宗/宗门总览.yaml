<灵霄宗>
灵霄宗:
  定位: 正道小宗,外表光鲜,内里腐朽

  核心理念: 表面宣扬仁义道德,实则唯利是图

  修炼体系:
    功法平庸: 传承功法属于中下水平
    依赖外物: 大量依赖丹药和灵材堆砌修为
    根基不稳: 弟子修为虚浮,实战能力偏弱

  宗门特色:
    伪善虚荣: 表面热衷于在修真界经营正道形象
    暗地肮脏: 私下进行各种见不得光的勾当
    云倾颜囚禁: 囚禁天生太阴灵血体质的云倾颜,长期采血炼丹
    血丹供应: 以云倾颜之血炼制的丹药暗中贩卖给高阶修士
    利益至上: 为了资源和利益不择手段

  宗门结构:
    宗主: 灵霄真人,表面慈眉善目,实则贪婪残忍
    长老: 数位,多为既得利益者
    内门弟子: 数百人,知情者寥寥
    外门弟子: 数千人,多数蒙在鼓里
    秘密囚徒: 云倾颜,太阴灵血体质,宗门最大秘密

  宗门规模:
    宗主: 灵霄真人
    长老: 五位
    内门弟子: 三百余人
    外门弟子: 两千余人
    附属势力: 灵霄城,人口数十万

  弟子阶梯:
    杂役弟子:
      人数: 五百余人
      修为范围: 凡人至炼气初期
      职责: 打扫山门、照料灵田灵矿、侍奉长老弟子起居、搬运灵材
      特征: 多为灵霄城贫苦人家子弟,冲着宗门"正道"名声而来,勤恳老实,对宗门内幕一无所知
    外门弟子:
      人数: 两千余人
      修为范围: 炼气中期至筑基中期
      职责: 巡逻灵霄山、接取宗门任务、协助矿脉开采、维护灵霄城治安
      特征: 修为虚浮根基不稳,多依赖丹药堆砌,真心以为宗门是正道中坚,对外维护宗门名声
    内门弟子:
      人数: 三百余人
      修为范围: 筑基后期至金丹中期
      职责: 修习核心功法、协助长老炼丹(不知原材料来源)、代表宗门出席各方聚会
      特征: 享受宗门核心资源配给,其中极少数隐约察觉到不对劲但不敢深究
    核心弟子:
      人数: 不足二十人
      修为范围: 金丹后期至元婴初期
      职责: 随长老修行、参与血丹分销(仅知是"特殊丹药")、看守宗门禁地外围
      特征: 宗主心腹培养的亲信,知晓部分内幕但被禁制封口,享受血丹带来的修炼加速

  特色资源:
    太阴血丹: 以云倾颜之血炼制,药效极强但来源不正
    灵材矿脉: 控制数条中型灵石矿脉
    丹药交易: 暗中贩卖血丹给各方势力

  山门地点:
    位置: 中央神州东部边缘·灵霄山
    环境: 云雾缭绕,灵气中等
    建筑: 外表华丽,内部奢靡
    秘密禁地: 地下囚禁云倾颜的密室,重重封印

  与外界关系:
    与正道宗门: 表面保持友好,实则利益交换
    与邪道势力: 暗中有来往,交易血丹
    与大宗门: 攀附讨好,但不被真正接纳

  宗门黑幕:
    云倾颜真相: 以收徒为名囚禁她四百年,定期采血炼丹
    采血频率: 每隔三日被抽血,每次三到五瓶
    知情人数: 仅宗主和三位核心长老知晓全部真相
    封口手段: 对知情者下禁制,泄密者魂飞魄散
    对外说辞: 对外宣称云倾颜是体弱多病的闭关弟子

  宗门处境:
    实力: 在正道小宗中属于中等偏上
    名声: 外界名声不错,被视为守正的小宗门
    野心: 宗主一直想跻身正道强宗之列
    弱点: 一旦云倾颜的事暴露,必将引来灭顶之灾
    危机: 随着云倾颜被采血时间越长,她的状态越差,宗门担心她死去失去摇钱树

  宗门氛围:
    表面: 光明正大,仙气飘飘
    内里: 尔虞我诈,利益至上
    弟子: 多数弟子不知内幕,真心认为宗门是正道

  关键人物:
    灵霄真人:
      身份: 灵霄宗宗主
      修为: 大乘期大圆满
      性格: 表面慈眉善目,实则贪婪残忍,唯利是图
    云倾颜:
      身份: 灵霄宗名义弟子,实为药人
      修为: 元婴大圆满,被封印压制永远无法突破
      灵根: 天灵根·太阴
      体质: 太阴灵血之体,万年罕见
      性格: 绝对顺从,极度麻木,对生死毫无执念
    沐清漪:
      身份: 灵霄宗内门首席弟子
      修为: 金丹后期
      灵根: 变异灵根·风雷
      性格: 正义隐忍,暗中搜集宗门罪证,等待时机揭露真相
</灵霄宗>
