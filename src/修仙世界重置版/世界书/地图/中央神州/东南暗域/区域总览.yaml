<东南暗域>
东南暗域:
  方位: 中央神州东南部,靠近南疆巫地
  地貌: 赤魇沼暗红毒雾弥漫,玄渊盆地鱼龙混杂,正邪交错。童真谷灵气充沛,与周围阴暗环境形成鲜明反差
  定位: 正邪交错的灰色地带,毒道传承、归真修炼、邪道联盟三方共存

  区域特征:
    赤魇沼: 广袤的沼泽地带,水体呈暗红色,弥漫剧毒瘴气。噬心殿盘踞于此,是中央神州最危险的区域之一
    童真谷: 灵气充沛的山谷,谷中花草树木都呈现幼态生机,连千年古木都只长到三五丈高。归稚宗山门所在
    玄渊盆地: 三不管的灰色地带,五大邪宗共管的玄渊城坐落于此,正邪魔妖各族修士皆可出入
    泣血谷: 蛊魔宗在神州的据点,靠近南疆通道

  核心势力:
    噬心殿: 邪道强宗,毒道传承,医毒同源。殿主玉横枝(渡劫期后期),百草庐叛出者。盘踞赤魇沼,以心毒魂毒尸蛊闻名
    归稚宗: 中立特殊宗门,追求极致返璞归真。宗主明玥(渡劫期后期),修炼有成后外貌回溯幼年。山门在童真谷·稚心峰
    玄渊城: 邪道联合城市,五大邪宗(噬心殿/幽血门/合欢宗/噬荒教/万禁教)共管,轮值城主。城内邪道规矩,正邪魔妖各族皆可入

  势力关系:
    噬心殿与百草庐: 死敌。殿主玉横枝原为百草庐弟子,叛出后以毒道立宗,两派不死不休
    噬心殿与合欢宗: 同为邪道但手段不同。噬心殿擅长剧毒杀伐,合欢宗擅长控心之毒。在玄渊城内勉强维持合作
    归稚宗的中立: 归稚宗虽在东南暗域地界,但保持严格中立。凭借宗主明玥的智慧和实力,在正邪夹缝中存活数千年
    玄渊城的平衡: 五大邪宗共管维持微妙平衡,城内禁止内斗,提供黑市/拍卖行/雇佣/悬赏等灰色服务。所有势力都需要这样一个灰色交易场

  对玩家的意义:
    高风险高回报: 赤魇沼毒物资源丰富,毒系灵材、毒蛊等在此可大量获取,但危险程度极高
    灰色交易: 玄渊城是中央神州最大的灰色交易场,正道买不到的东西这里都有
    特殊修炼: 归稚宗的归元心法独树一帜,若有缘可拜入门下
    情报枢纽: 各方势力在此交汇,是获取邪道情报的最佳地点
</东南暗域>
