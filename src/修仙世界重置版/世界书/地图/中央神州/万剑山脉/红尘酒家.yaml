<红尘酒家>
红尘酒家:
  位置: 剑鸣城东街尽头，一间不起眼的小酒馆
  定位: 超然中立避难所，一壶酒换一个故事
  店家: 洛红尘

  酒家规矩:
    唯一交易方式: 一壶酒换一个故事，不收灵石，不收法宝，只收故事
    绝对安全: 任何人在此不得动手，违者后果自负
    身份不论: 正邪不问，只看故事
    永远中立: 不站任何立场
    店家身份成谜: 无人敢轻视，连六大宗门都敬重酒家规矩

  酒家环境: 门面窄小，挂着一块褪色木牌，上书红尘二字。推门进去比外面看着大得多，十几张桌子，木质陈旧但擦得干净。柜台后面摆满酒坛，每一坛都是洛红尘亲手酿的红尘酒，据说喝了能看见自己最在意的人。角落里有一把旧摇椅，洛红尘不听故事的时候就窝在那里打瞌睡

  红尘酒: 洛红尘亲酿，入口温热醇厚，饮后心中会浮现自己最在意之人或最深的记忆。修为越高感受越深，凡人只觉得好喝，真仙级修士喝了会沉默很久
</红尘酒家>
