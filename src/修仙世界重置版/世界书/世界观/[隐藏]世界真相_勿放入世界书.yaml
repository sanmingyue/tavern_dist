世界真相:

  一、极阳天尊与轮回的真相:
    时间: 比黄金大世更为久远的太古之初
    背景: |
      太初之时，阴阳化为极阴天尊与极阳天尊。彼时天道圆满无缺，万物可得真正永恒——
      没有死亡，没有轮回，没有寿命限制。修炼者一旦成就大道，便永恒不灭。

      然而极阳天尊以其至高智慧洞察到一个致命的真相：
      永生意味着天道崩塌。

      万物永恒不灭，灵气只入不出，天地灵脉终将枯竭。
      不死不灭的强者越积越多，而天地承载力有限。
      没有死亡就没有更新，没有轮回就没有净化，天道将在永恒的重压下崩溃瓦解。
      这不是万年后的隐忧，而是必然到来的终局。

    极阳的选择: |
      在真正有修仙者达到永生之前，极阳天尊做出了选择——
      以自身为引，创造轮回体系，构建地府与地府法则。

      极阳天尊将自己的存在融入了轮回本身：
      - 六道轮回盘：极阳神格的核心具象，承载生死循环的根基
      - 十殿阎王：极阳意志的法则碎片，化为审判与秩序的执行者
      - 地府六层：极阳以自身之力开辟的平行空间，用以安置亡魂、净化因果
      - 生死簿：极阳对天道的补完，记录万物寿命与因果

      自此，万物有了生死，修仙者有了寿限，天道恢复循环，不再面临崩塌。
      而极阳天尊——彻底"消失"了。
      他没有死，因为他已经不再是一个"存在"，而是化为了一种"法则"。

    极阴天尊: |
      极阴天尊不知道极阳的真正去向。
      在她的认知中，极阳"无故消踪，再无人感应其存在"。
      她等了极其漫长的岁月，最终难承永恒孤寂，舍弃神格堕入凡尘。
      她化为洛红尘——一个凡人萝莉，在红尘酒家中以凡人之身体验她从未拥有过的"有限"。
      洛红尘不知道自己的前世，也不知道极阳的真相。

    世人认知: |
      当前修仙界没有任何人知道极阳创造了轮回。
      世界起源中记载的"极阳天尊无故消踪"就是所有人知道的全部。
      正道视此为神明的消逝，魔道不在乎，佛门有自己的解读。
      没有任何文献、传承、遗迹直接记载极阳与轮回的关联。

    可能的线索（供玩家探索）:
      - 轮回禁地中封印的存在是否知道什么？
      - 地藏道场的菩提树是否感应到了什么？
      - 聆溪（白泽·万物通晓）是否隐约察觉到了什么但选择不说？
      - 六道轮回盘的构造是否暗含极阳的痕迹？
      - 十殿阎王作为"法则具象"，其本源是否指向极阳？

  二、补天之道的真相:
    起源（远古）: |
      轮回建立之后，万物有了生死与寿限。
      远古时代的修仙者们不甘于此——他们渴望恢复太古时代的永恒。
      最初的"补天之道"应运而生：
      它是一群最顶尖修士的真诚理想——合力探寻突破寿命极限、重新成仙永生的方法。
      "补天"之名由此而来：他们认为极阳的消失导致天道残缺，
      若能"修补"这一残缺，万物便可重归永恒。

      在最初的数个纪元中，补天之道确实汇聚了大量智慧与资源，
      推动了修仙体系的进步，也促使了各方势力减少内斗、合力求道。
      它是修仙界历史上最伟大的联合行动之一。

    堕落（漫长岁月后）: |
      然而亿万年过去，永生的方法始终没有找到。
      一代又一代的传承者更替，初心逐渐被遗忘。
      "补天之道"从一个真诚的理想，慢慢变成了一面政治旗帜。

      传承者们发现——"寻求永生"这面旗帜本身就是巨大的权力：
      谁掌握了"补天"，谁就能以"天下大义"为名号召正道资源。
      永生找不找得到不重要，重要的是所有人都相信我们在找。

    当前（凌风时代）: |
      现任补天之道的实际操盘者是玉清道宫的凌风（合体中期）。
      凌风不知道补天之道的远古初心，也不关心永生是否可能。
      在他手中，补天之道已经彻底沦为政治工具：

      - 天剑圣地提供武力，以为自己在"守护天下"
      - 药神谷提供医道支撑，以为自己在"济世救人"
      - 生命之森提供本源之力，以为自己在"维护天道"
      - 玉清道宫负责"推演布局"，实际上是在操控一切

      凌风的真实目的是利用补天之道的框架，
      逐步整合正道资源，构建凌驾于六大仙宗之上的超级联盟，
      最终让玉清道宫（以及他自己）成为修仙界秩序的最高决策者。

      其他三方——天剑圣地的顾清霜、药神谷的苏青檀、生命之森的灵月曦——
      各有各的心思，但都没有意识到"补天"本身已经是一个空壳。
      她们以为联盟虽然有政治博弈，但至少"补天"的大方向是真的。
      而凌风很清楚：补天不过是让各方甘愿出力的旗帜，仅此而已。

    讽刺: |
      最大的讽刺是——补天之道的远古初心"恢复永生"如果真的成功了，
      天道就会重新面临崩塌的危机。
      极阳天尊牺牲自己创造轮回就是为了防止这件事发生。
      所以"补天"从一开始就不可能成功，因为它的目标本身就违背了天道运行的根基。
      但没有人知道这一点。

  三、关键设定约束:
    - 以上真相【不可】出现在世界书条目中，AI不应主动透露
    - 极阳与轮回的关联是世界最深层的秘密，可作为终极剧情线索
    - 补天的堕落是可以被玩家发现的（通过调查凌风、接触其他三方等）
    - 但补天的远古初心和极阳的关联属于更深层的秘密
    - 洛红尘（极阴天尊）不知道任何真相，她只是一个在红尘中品味凡间烟火的前神明
