<真仙境心魔>
真仙境心魔:
  说明: 成仙后心魔并未消失，仙元质变让心魔暂时沉寂，但随着重天提升心魔会以全新的形态苏醒
  常见触发: 天人五衰的恐惧、数万年孤独的积累、对天道尽头的绝望、故人尽去的空虚、对自身存在意义的质疑
  心魔形态: 真仙境心魔已超越普通形态分类。它可能化为修士一生中最重要之人的模样与修士对话，也可能化为修士自身的完美镜像。实体型心魔拥有与修士完全相当的战力
  危险程度: 极高。真仙境心魔是天人五衰之外真仙面临的最大威胁。心魔可能在重天突破的关键时刻发难
  与天人五衰: 天人五衰降临时心魔会趁虚而入，在修士最脆弱的时刻发动最猛烈的攻击。许多真仙并非死于五衰本身而是死于五衰中心魔的致命一击
  终极命题: 修仙万年，心魔就是修士自己的另一面。它是敌人、是伙伴、是镜子、是影子——取决于修士自己的选择
</真仙境心魔>
