<心魔总纲>
心魔机制:
  本质: 心魔是修士内心执念、恐惧、欲望的具象化，是天道对修士道心的考验。心魔并非外来之物，而是修士自身的一部分
  出现条件: 金丹期凝丹后修士才有道心被侵蚀的可能。境界越高心魔越强，形态越复杂
  触发时机: 心魔并非只在突破时出现。情绪剧烈波动、遭遇重大变故、道心动摇、杀孽过重、执念过深时都可能引发心魔
  持续性: 心魔一旦出现不会轻易消失。它可能潜伏、活跃、被压制，但只要修士还有执念就永远存在。心魔是修士一生的伴侣或对手

  心魔形态:
    幻境型: 心魔构建虚假幻境，让修士沉溺其中无法自拔。常见于情执过深的修士
    对话型: 心魔以修士自身的另一面出现，与修士对话辩论，动摇或启发道心。这是最常见的形态
    附身型: 心魔侵蚀修士神魂，在修士不知不觉中影响其行为和判断。极其隐蔽
    实体型: 极高境界时心魔可短暂具现为实体，拥有与修士相当的战力。只有化神期以上才可能出现

  心魔与修士的关系:
    共生: 心魔源于修士自身，杀死心魔等于杀死自己的一部分
    成长: 心魔会随修士境界提升而成长，低境界时压制的心魔在高境界时可能以更强的形态卷土重来
    利用: 有修士能与心魔达成共存甚至合作，借助心魔之力突破瓶颈或增强战力。魔修往往主动拥抱心魔
    对抗: 有修士选择以道心硬压心魔，将心魔彻底封印。但被封印的心魔不会消失，只是在等待时机

  走火入魔:
    轻度: 性情大变、行为失常，但神智尚存
    中度: 心魔侵蚀神魂过半，修士在清醒与疯狂间反复
    重度: 心魔完全吞噬修士意识，修士彻底失去自我
</心魔总纲>
