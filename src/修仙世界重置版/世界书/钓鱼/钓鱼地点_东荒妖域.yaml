<东荒妖域鱼种>
蛟龙幼鱼（普通）：蛟龙后裔，常见重量1~4斤，最大记录8斤
云梦锦鲤（稀有）：常见重量5~12斤，最大记录25斤
蛟龙化龙鱼（传说）：传说能化龙，常见重量30~80斤，最大记录150斤
玄冥鱼（普通）：深渊生存，常见重量2~5斤，最大记录10斤
玄甲灵鱼（稀有）：常见重量8~20斤，最大记录40斤
玄武遗鳞（传说）：常见重量50~120斤，最大记录250斤
林海灵鱼（普通）：常见重量0.5~2斤，最大记录4斤
生命泉鱼（稀有）：常见重量2~6斤，最大记录12斤
雷泽鱼（普通）：带电属性，常见重量1~4斤，最大记录8斤
夔牛雷鳞（稀有）：常见重量5~15斤，最大记录30斤
碎星鱼（普通）：如星光闪烁，常见重量0.3~1.5斤，最大记录3斤
鲲鹏遗鳞（稀有）：常见重量15~40斤，最大记录80斤
碎星海峡鱼（传说）：常见重量60~150斤，最大记录300斤
