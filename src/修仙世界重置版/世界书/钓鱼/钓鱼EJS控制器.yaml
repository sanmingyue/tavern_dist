  // 根据地点加载对应水域鱼种数据
  if (location) {
  // 中央神州水域
  if (location.includes('洛水') || location.includes('天命')) {
    print(await getwi('钓鱼地点_中央神州_洛水'));
  } else if (location.includes('并蒂') || location.includes('莲心') || location.includes('莲华')) {
    print(await getwi('钓鱼地点_中央神州_南境水乡'));
