  } else if (location.includes('东溟') || location.includes('东海') || location.includes('龙宫') || location.includes('碧波') || location.includes('龙门')) {
    print(await getwi('钓鱼地点_四海_东溟海'));
  } else if (location.includes('西极') || location.includes('风暴')) {
    print(await getwi('钓鱼地点_四海_西极海'));
  }
  // 南疆巫地
  else if (location.includes('南疆') || location.includes('黎母') || location.includes('药神') || location.includes('赤阳') || location.includes('生命')) {
