  else if (location.includes('焚魔') || location.includes('焦土') || location.includes('熔岩') || location.includes('火山')) {
    print(await getwi('钓鱼地点_北原魔土'));
  } else if (location.includes('寂灭') || location.includes('黑冰') || location.includes('深渊')) {
    print(await getwi('钓鱼地点_北原魔土'));
  } else if (location.includes('永夜') || location.includes('冰原') || location.includes('冰狱')) {
    print(await getwi('钓鱼地点_北原魔土'));
