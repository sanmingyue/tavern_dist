<南疆巫地鱼种>
黎母江鱼（普通）：南疆特产，常见重量1~3斤，最大记录6斤
木灵鱼（稀有）：生命气息，常见重量2~5斤，最大记录10斤
灵月鱼（稀有）：月光照耀，常见重量1~3斤，最大记录5斤
生命古鱼（传说）：常见重量20~50斤，最大记录100斤
药泉鱼（普通）：蕴含药力，常见重量0.5~2斤，最大记录4斤
九转灵鱼（稀有）：常见重量5~12斤，最大记录20斤
药神锦鲤（传说）：常见重量15~35斤，最大记录70斤
毒沼鱼（普通）：适应毒沼，常见重量0.5~1.5斤，最大记录3斤
百毒灵鱼（稀有）：剧毒，常见重量2~5斤，最大记录10斤
赤阳鱼（普通）：火属性，常见重量1~3斤，最大记录5斤
烈凰灵鱼（稀有）：常见重量5~10斤，最大记录18斤
南疆银鳞（稀有）：常见重量3~8斤，最大记录15斤
