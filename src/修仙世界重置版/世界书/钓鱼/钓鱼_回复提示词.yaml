<钓鱼回复指引>
判定流程:
  综合以下因素决定鱼获：
     - 钓鱼地点的水域环境和灵气浓度
     - 鱼竿品质
     - 鱼饵品质（见前端发送内容中的鱼饵字段）
     - 提竿表现：反应<500ms极佳,500-800ms良好,>800ms一般
     - 3/3全成功>2/3>1/3>0/3空军
  3. 空军（0次成功）：不添加鱼获，描写空军经历

成功回复:
  - 描写钓鱼过程：抛竿→等待→提竿→收获
  - 描写鱼获的品种、大小、灵性
  - 不少于200字

空军回复:
  - 描写等待→鱼跑了的过程
  - 不少于150字

变量更新:
  - 成功时：delta钓鱼_成功次数+1，更新钓鱼_鱼获记录和最高记录，储物戒添加[鱼获]
  - 空军时：不更新鱼获相关变量
</钓鱼回复指引>
