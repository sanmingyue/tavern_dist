<北原魔土地带鱼种>
灰烬鱼（普通）：适应高温，常见重量0.2~0.8斤，最大记录1.5斤
熔岩鲤（稀有）：鳞片泛红，常见重量1~3斤，最大记录5斤
烈焰鱼（普通）：熔岩边缘生存，常见重量0.5~2斤，最大记录3.5斤
焚天鳞鱼（稀有）：极度高温环境，常见重量2~5斤，最大记录8斤
魔鳞鱼（普通）：暗青色，常见重量0.5~2斤，最大记录4斤
深渊乌贼（稀有）：冰层下生存，常见重量1~3斤，最大记录6斤
寂灭海兽（传说）：远古海魔，极其危险，常见重量50~200斤，最大记录500斤
冰魄鱼（普通）：极寒生存，常见重量0.3~1.5斤，最大记录3斤
玄冰银鳞（稀有）：透明如冰，常见重量2~4斤，最大记录7斤
幽魂鱼（普通）：精纯魂力，常见重量0.2~1斤，最大记录2斤
玄冥鬼鳞（稀有）：常见重量1~3斤，最大记录5斤
冰狱魂鱼（传说）：常见重量10~30斤，最大记录50斤
