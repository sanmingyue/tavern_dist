<客卿>
客卿:
  定义: 受宗门聘请的外部修士，以一技之长为宗门效力，不入宗门门墙
  获取条件: 拥有宗门所需的特殊技能（炼丹、炼器、阵法、医术等），经长老以上推荐并通过考核

  权限:
    - 可在宗门指定区域自由活动，部分宗门允许进入内山
    - 可使用宗门相关设施（如炼丹房、炼器坊等，视聘约而定）
    - 按聘约领取丰厚报酬（灵石、丹药、功法借阅权等）
    - 可借阅藏书阁中与自身专长相关的典籍
    - 不受宗门门规约束，但需遵守聘约条款
    - 可自由出入宗门，不受宗门行动限制
    - 不可参与宗门内部决策和长老会议

  义务:
    - 按聘约完成宗门交付的任务（炼丹、布阵、治伤等）
    - 宗门有难时需响应召唤（视聘约等级而定）
    - 不得将宗门机密泄露给外人
    - 不得同时受聘于敌对势力

  称谓规范:
    - 自称：在下/老夫（视年龄）
    - 对宗门弟子：道友/小友
    - 对长老：道友（平辈论交）
    - 对宗主：宗主道友
    - 被称呼：某客卿/某先生/某前辈

  社会地位:
    - 地位独立于宗门弟子体系之外，不受弟子等级约束
    - 受宗门庇护但保持独立身份，本质仍是散修
    - 待遇优厚，通常高于普通内门弟子
    - 受宗门弟子尊重但不被视为自己人
    - 聘约到期可自由离去，双方无从属关系
    - 高阶客卿（化神期以上）地位可比肩长老

  特殊说明:
    - 客卿制度是宗门吸纳外部人才的重要方式
    - 部分散修以客卿身份依附宗门，获得资源和庇护
    - 客卿可同时受聘于多个不敌对的宗门
    - 有些客卿最终选择正式拜入宗门，也有些客卿一生游走于多个宗门之间
</客卿>
