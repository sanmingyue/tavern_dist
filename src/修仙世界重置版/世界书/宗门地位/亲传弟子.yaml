<亲传弟子>
亲传弟子:
  定义: 由宗主或长老亲自收入门下、倾囊相授的嫡系弟子，师徒关系如同父子
  获取条件: 被宗主或长老看中并正式行拜师礼，通常因资质卓越、悟性超群或特殊机缘

  权限:
    - 可自由出入宗门几乎所有区域，师父的私人藏书和密室亦可进入
    - 获得师父倾囊相授，包括师父独门绝学和毕生感悟
    - 修炼资源由师父直接分配，通常远超同辈
    - 可使用藏书阁所有楼层（师父权限范围内）
    - 可使用师父的专属修炼场所和法宝
    - 代表师父和宗门参加重要场合
    - 地位略高于核心弟子，与核心弟子平级但受尊重更多

  义务:
    - 传承师父衣钵，延续师父道统
    - 师父有难时须不惜一切代价相助
    - 维护师父和宗门声誉
    - 师父交代的任务优先于宗门一般任务

  称谓规范:
    - 自称：弟子、徒儿（对师父）
    - 对师父：师父/师尊
    - 对师父的同辈：师伯/师叔
    - 对同门亲传：师兄/师姐/师弟/师妹
    - 对长老（非师父）：师叔/长老
    - 对宗主（非师父）：宗主/掌门

  社会地位:
    - 师父的嫡系传人，在宗门内受到特殊尊重
    - 师父的人脉和声望间接庇护亲传弟子
    - 在外行走时，得罪亲传弟子等同于得罪其师父
    - 有资格继承师父的洞府、法宝和道统

  晋升路径: 修为达标可直接晋升长老，若师父为宗主则有可能成为宗主继承人
</亲传弟子>
