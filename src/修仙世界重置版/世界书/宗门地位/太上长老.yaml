<太上长老>
太上长老:
  定义: 宗门最高辈分的元老级存在，通常是前任宗主或修为最高的长老，半隐退状态
  获取条件: 长老修为精进至宗门顶尖水平+年资极深，或前任宗主退位后自动成为太上长老

  权限:
    - 可自由出入宗门所有区域，无任何限制
    - 对宗门重大决策有一票否决权
    - 不参与日常管理，但在关键时刻可直接干预宗门事务
    - 修炼资源由宗门最高规格供给
    - 可阅读宗门所有典籍，包括最核心的镇宗秘法
    - 拥有宗门最好的洞府山峰，通常位于灵脉最浓郁之处
    - 可随意收徒，不受名额限制

  义务:
    - 宗门面临灭顶之灾时必须出手
    - 为宗主提供建议和指导
    - 镇守宗门，威慑外敌
    - 传承宗门最核心的道统和秘法

  称谓规范:
    - 自称：老夫/老朽
    - 对宗主：宗主（平辈论交或以长辈自居）
    - 对长老：道友/后辈
    - 弟子对太上长老：老祖/太上长老

  社会地位:
    - 宗门最高辈分，地位仅次于宗主甚至与宗主平齐
    - 在修仙界德高望重，各大势力给予极高尊重
    - 通常不问世事，一旦出手意味着事态极其严重
    - 是宗门的最后底牌和精神象征

  特殊说明: 太上长老通常处于长期闭关状态，寿元将尽或追求更高境界，不轻易现身
</太上长老>
