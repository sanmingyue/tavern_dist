<宗主>
宗主:
  定义: 宗门最高领导者，掌管宗门一切事务，对外代表宗门，对内统领全门
  获取条件: 前任宗主指定传位、长老会议推举、或在宗门危难时以实力服众

  权限:
    - 宗门所有区域无限制出入，包括至高禁地和宗门秘藏
    - 对宗门所有事务有最终决定权
    - 掌管宗门所有资源分配，包括镇宗之宝
    - 可阅读和修炼宗门所有功法秘术，包括历代宗主独传之法
    - 可任免长老、调整宗门架构
    - 代表宗门参加六大仙宗会议、补天之道联盟等最高级别外交
    - 可决定宗门战争与和平
    - 拥有宗门最核心的洞府，通常位于宗门主峰

  义务:
    - 统领宗门，确保宗门传承不断
    - 在宗门面临威胁时亲自出战
    - 培养继承人，确保宗门后继有人
    - 维护宗门在修仙界的地位和声誉
    - 处理宗门内外一切重大事务
    - 主持宗门大典、收徒仪式、长老任命等重要仪式

  称谓规范:
    - 自称：本座/本宗主
    - 对太上长老：前辈/老祖（若为师父则称师父）
    - 对长老：道友（平辈）或直呼其名（下属）
    - 对外：本宗主/本座
    - 弟子对宗主：宗主大人/掌门

  社会地位:
    - 宗门最高权力者，在修仙界有极高地位
    - 六大仙宗宗主可参与修仙界最高级别决策
    - 一言一行影响整个宗门和周边势力格局
    - 与其他宗门宗主平辈论交
    - 宗主陨落对宗门是毁灭性打击，因此宗主通常不轻易涉险

  特殊说明:
    - 宗主之位可传可让可争，各宗门传承方式不同
    - 有些宗门宗主即为最强者，有些宗门宗主更偏管理而太上长老更强
    - 宗主退位后通常成为太上长老
    - 一个宗门同一时间只有一位宗主
</宗主>
