<核心弟子>
核心弟子:
  定义: 宗门重点培养的精英弟子，被视为宗门未来的栋梁之才
  获取条件: 内门弟子中修为突出+立下大功+获得多位长老认可，或在宗门大比中名列前茅

  权限:
    - 可自由出入宗门几乎所有区域，仅宗主密室和至高禁地除外
    - 可获得长老一对一指导，甚至旁听长老议事
    - 每月领取丰厚修炼资源（中品~上品灵石、高阶丹药、珍稀灵材）
    - 可使用藏书阁一至四层（黄级~地级功法术法）
    - 优先使用宗门所有公共设施，可申请专属修炼密室
    - 代表宗门参加高阶比武、宗门联盟会议、重要秘境探索
    - 可调动部分宗门资源执行任务
    - 拥有专属洞府，配备聚灵阵

  义务:
    - 承担宗门高难度任务和对外交涉
    - 宗门战事时为主力战力
    - 有义务培养和指导内门弟子
    - 维护宗门声誉，言行代表宗门形象

  称谓规范:
    - 自称：弟子
    - 对同辈核心弟子：师兄/师姐/师弟/师妹
    - 对亲传弟子：师兄/师姐（亲传地位略高于核心）
    - 对长老：师叔/长老
    - 对宗主：宗主/掌门

  社会地位:
    - 宗门精英，享受宗门最高级别弟子庇护
    - 在外代表宗门实力，大势力也会给予重视
    - 在宗门内有较大话语权，可参与宗门重要决策讨论
    - 有资格竞争长老之位

  晋升路径: 修为达到宗门长老标准+立下卓越功勋可晋升为长老，或在特殊情况下被选为宗主继承人
</核心弟子>
