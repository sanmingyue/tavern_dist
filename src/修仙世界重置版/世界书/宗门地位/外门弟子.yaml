<外门弟子>
外门弟子:
  定义: 宗门正式弟子的基础等级，已通过入门考核正式拜入宗门
  获取条件: 记名弟子通过外门考核（修为达标+完成指定任务），或入门时直接被收为外门弟子

  权限:
    - 可在宗门外山和部分内山区域活动
    - 可参加外门传法堂的定期授课
    - 每月领取固定修炼资源（下品灵石、基础丹药、功法指导）
    - 可使用藏书阁一至二层（黄级功法术法）
    - 可代表宗门参加低阶比武和外出历练任务
    - 可申请使用宗门炼丹房、炼器房等公共设施（需排队）

  义务:
    - 每年完成一定数量的宗门任务（巡逻、采药、护送等）
    - 每半年接受一次考核，修为停滞过久会被降为记名弟子
    - 遵守宗门戒律，不得私斗、不得擅自外出
    - 宗门有难时须响应召集

  称谓规范:
    - 自称：弟子
    - 对同辈外门：师兄/师姐/师弟/师妹
    - 对内门弟子：师兄/师姐
    - 对核心弟子及以上：前辈
    - 对长老：长老大人
    - 对宗主：宗主大人

  社会地位:
    - 宗门正式成员，享受宗门基本庇护
    - 在外可报宗门之名，一般势力不敢轻易招惹
    - 但在宗门内仍属底层，资源分配优先级低

  晋升路径: 通过内门选拔（修为突破+宗门贡献+长老推荐）可晋升为内门弟子
</外门弟子>
