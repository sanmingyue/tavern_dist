<记名弟子>
记名弟子:
  定义: 宗门最低等级弟子，仅挂名于宗门门下，尚未正式入门
  获取条件: 通过宗门最基础的入门考核，或由外门弟子以上引荐

  权限:
    - 可在宗门外围区域活动，不得进入内山禁地
    - 可旁听外门公开课，不可参加内门传法
    - 可领取最基础的修炼资源（每月少量下品灵石、基础丹药）
    - 可使用宗门外围练功场和藏书阁一层（凡级~黄级下品功法）
    - 不可代表宗门参加宗门间交流或比武

  义务:
    - 完成宗门分配的杂务（打扫、搬运、看守等）
    - 每季度接受一次考核，连续两次不合格则除名
    - 不得泄露宗门任何信息，违者逐出并追杀

  称谓规范:
    - 自称：弟子、小子/小女
    - 对外门弟子：师兄/师姐
    - 对内门及以上：前辈
    - 对长老：长老大人
    - 对宗主：宗主大人

  社会地位:
    - 在宗门内地位最低，常被外门弟子差遣
    - 在宗门外仍比散修有靠山，可借宗门之名行走
    - 不享受宗门全面庇护，遇险宗门不一定出手

  晋升路径: 通过外门考核（修为达标+完成指定任务）可晋升为外门弟子
</记名弟子>
