<长老>
长老:
  定义: 宗门高层管理者和战力支柱，参与宗门决策，掌管宗门各项事务
  获取条件: 修为达到宗门长老标准（通常元婴期以上，大宗门要求更高）+立下卓越功勋+长老会议通过

  权限:
    - 可自由出入宗门所有区域，包括大部分禁地
    - 参与长老会议，对宗门重大事务有投票权
    - 可掌管宗门某一方面事务（戒律长老、藏经长老、外事长老、炼丹长老等）
    - 每月领取大量修炼资源（上品灵石、高阶丹药、珍稀灵材）
    - 可使用藏书阁所有楼层，可阅读宗门核心功法
    - 拥有专属洞府山峰，配备高阶聚灵阵
    - 可收亲传弟子，传授自身道统
    - 可调动宗门资源执行任务，可指挥弟子

  义务:
    - 参与宗门决策和管理
    - 宗门战事时为核心战力
    - 定期为弟子传法授课
    - 维护宗门利益和秩序
    - 必要时代表宗门出席外交场合

  称谓规范:
    - 自称：老夫/本座/本长老
    - 对同辈长老：道友/师兄/师姐
    - 对宗主：宗主/掌门
    - 对太上长老：前辈/老祖
    - 弟子对长老：长老大人/师叔

  社会地位:
    - 宗门高层，在修仙界有相当地位和人脉
    - 在外行走代表宗门实力，一般势力不敢轻易得罪
    - 在宗门内有实权，掌管一方事务
    - 可独立决定部分宗门资源分配

  晋升路径: 修为继续精进+年资深厚可成为太上长老，或在宗主退位/陨落时被推举为新宗主
</长老>
