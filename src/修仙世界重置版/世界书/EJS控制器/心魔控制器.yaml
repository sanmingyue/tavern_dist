@@preprocessing
<%
if (typeof xinmoState === 'undefined') var xinmoState = getvar('stat_data.心魔状态', { defaults: '无' });
if (typeof curRealm2 === 'undefined') var curRealm2 = getvar('stat_data.当前境界', { defaults: '' });

// 从完整境界提取大境界（如 "金丹期前期" → "金丹期"）
var xinmoRealm = '';
var xinmoRealms = ['金丹期', '元婴期', '化神期', '炼虚期', '合体期', '大乘期', '渡劫期', '真仙境'];
for (var xi = 0; xi < xinmoRealms.length; xi++) {
  if (curRealm2.indexOf(xinmoRealms[xi]) === 0) {
    xinmoRealm = xinmoRealms[xi];
    break;
  }
}

if (xinmoState !== '无') {
  print(await getwi('心魔总纲'));
  print(await getwi('心魔互动_回复提示词'));
  if (xinmoRealm === '金丹期') { print(await getwi('金丹期心魔')); }
  if (xinmoRealm === '元婴期') { print(await getwi('元婴期心魔')); }
  if (xinmoRealm === '化神期') { print(await getwi('化神期心魔')); }
  if (xinmoRealm === '炼虚期') { print(await getwi('炼虚期心魔')); }
  if (xinmoRealm === '合体期') { print(await getwi('合体期心魔')); }
  if (xinmoRealm === '大乘期') { print(await getwi('大乘期心魔')); }
  if (xinmoRealm === '渡劫期') { print(await getwi('渡劫期心魔')); }
  if (xinmoRealm === '真仙境') { print(await getwi('真仙境心魔')); }
}
%>
