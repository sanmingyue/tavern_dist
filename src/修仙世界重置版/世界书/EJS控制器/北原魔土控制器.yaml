<%- await getwi('奴城·灰骨城') %>
<%- await getwi('雪原部落·白狼氏') %>
<% } %>
<% if (place) { %>
<% if (_notScanned('阿芙佳朵')) { %><%- await getwi('阿芙佳朵') %><% } %>
<% if (_notScanned('冬梅')) { %><%- await getwi('冬梅') %><% } %>
