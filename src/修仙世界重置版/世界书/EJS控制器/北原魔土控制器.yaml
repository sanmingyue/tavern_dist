@@preprocessing
<%/* 北原魔土控制器
 * 根据位置变量动态激活北原魔土相关世界书条目
 * 会跳过已被扫描控制器激活的条目
 */-%>
<%
if (typeof mainArea === 'undefined') var mainArea = getvar('stat_data.大区域', { defaults: '中央神州' });
if (typeof subArea === 'undefined') var subArea = getvar('stat_data.子区域', { defaults: '' });
if (typeof place === 'undefined') var place = getvar('stat_data.具体地点', { defaults: '' });
if (typeof _scanActivated === 'undefined') var _scanActivated = [];
function _notScanned(name) { return _scanActivated.indexOf(name) === -1; }
-%>
<% if (mainArea === '北原魔土') { %>
<%- await getwi('地图_北原魔土') %>

<% if (!subArea) { %>
<%# === 大区域级：加载所有总览 === %>
<%- await getwi('北原功法总览') %>
<%- await getwi('北原天材地宝') %>
<%- await getwi('北原谋生指南') %>
<%- await getwi('北原物价总览') %>
<%- await getwi('北原散修与凡人') %>

<% } else { %>
<%# === 子区域级：加载通用 + 对应子区域拆分条目 === %>
<%- await getwi('北原流通功法') %>
<%- await getwi('北原秘境残卷') %>
<%- await getwi('北原通用天材地宝') %>
<%- await getwi('北原通用谋生指南') %>
<%- await getwi('北原散修与凡人') %>

<% if (subArea === '北原边境') { %>
<%- await getwi('北原边境天材地宝') %>
