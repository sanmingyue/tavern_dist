@@preprocessing
<%/* 东瀛控制器
 * 根据位置变量动态激活东瀛相关世界书条目
 * 会跳过已被扫描控制器激活的条目
 */-%>
<%
if (typeof mainArea === 'undefined') var mainArea = getvar('stat_data.大区域', { defaults: '中央神州' });
if (typeof subArea === 'undefined') var subArea = getvar('stat_data.子区域', { defaults: '' });
if (typeof place === 'undefined') var place = getvar('stat_data.具体地点', { defaults: '' });
if (typeof _scanActivated === 'undefined') var _scanActivated = [];
function _notScanned(name) { return _scanActivated.indexOf(name) === -1; }
-%>
<% if (mainArea === '东瀛') { %>
<%- await getwi('地图_东瀛') %>
<%- await getwi('东瀛散修与凡人') %>

<% if (!subArea) { %>
<%/* 大区域级: 加载所有原始总览条目 */%>
<%- await getwi('东瀛功法总览') %>
<%- await getwi('东瀛天材地宝') %>
<%- await getwi('东瀛谋生指南') %>
<%- await getwi('东瀛物价总览') %>
<% } else { %>
<%/* 子区域级: 加载流通功法 + 自然地理 */%>
<%- await getwi('东瀛流通功法') %>
<%- await getwi('东瀛_环岛海岸') %>
<%- await getwi('东瀛_神岳山') %>
<%- await getwi('海底龙宫残迹') %>
<%- await getwi('神岳顶') %>

<% if (subArea === '常夜幕府' && _notScanned('常夜幕府')) { %>
<%- await getwi('常夜幕府') %>
<%- await getwi('皇城(东瀛)') %>
<%- await getwi('东瀛武家功法') %>
<% if (place) { %>
<% if (_notScanned('织田信岳')) { %><%- await getwi('织田信岳') %><% } %>
<% } %>

<% } else if (subArea === '常夜町') { %>
<%- await getwi('常夜町') %>

<% } else if (subArea === '五大武家领地') { %>
<%- await getwi('五大武家领地') %>
<%- await getwi('东瀛武家功法') %>

<% } else if (subArea === '伊势大社' && _notScanned('伊势大社')) { %>
<%- await getwi('伊势大社') %>
<%- await getwi('东瀛大社功法') %>
<% if (place) { %>
<% if (_notScanned('浅间咲')) { %><%- await getwi('浅间咲') %><% } %>
<% if (_notScanned('月咏')) { %><%- await getwi('月咏') %><% } %>
<% } %>

<% } %>
<% } %>
<% } %>
