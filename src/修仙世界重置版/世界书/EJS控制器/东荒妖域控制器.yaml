@@preprocessing
<%
/* ===== 东荒妖域控制器 =====
 * 仅当大区域为"东荒妖域"时激活
 * 大区域级: 激活地图 + 所有总览 + 独立NPC
 * 子区域级: 额外激活对应功法 + 自然地理/秘境
 * 具体地点级: 额外激活具体势力 + 子地点 + NPC
 * 会跳过已被扫描控制器激活的条目
 */
if (typeof mainArea === 'undefined') var mainArea = getvar('stat_data.大区域', { defaults: '中央神州' });
if (typeof subArea === 'undefined') var subArea = getvar('stat_data.子区域', { defaults: '' });
if (typeof place === 'undefined') var place = getvar('stat_data.具体地点', { defaults: '' });
if (typeof _scanActivated === 'undefined') var _scanActivated = [];
function _notScanned(name) { return _scanActivated.indexOf(name) === -1; }
-%>
<% if (mainArea === '东荒妖域') { %>
<%- await getwi('地图_东荒妖域') %>
<%- await getwi('东荒天材地宝') %>
<%- await getwi('东荒物价总览') %>
<%- await getwi('东荒散修与凡人') %>
<% if (_notScanned('阿福')) { %><%- await getwi('阿福') %><% } %>
<% if (_notScanned('阿狸')) { %><%- await getwi('阿狸') %><% } %>
<% if (_notScanned('银月')) { %><%- await getwi('银月') %><% } %>

<% if (!subArea) { %>
<%/* 大区域级: 加载原始总览 */%>
<%- await getwi('东荒功法总览') %>
<%- await getwi('东荒谋生指南') %>
<% } else { %>
<%/* 子区域级: 加载拆分功法 + 谋生 */%>
<%- await getwi('东荒各族功法') %>
<%- await getwi('东荒谋生指南') %>

<% if (subArea === '雷泽') { %>
<%- await getwi('东荒_雷泽') %>
<% } else if (subArea === '十万大山') { %>
<%- await getwi('东荒_十万大山') %>
<% } else if (subArea === '碎星海峡') { %>
<%- await getwi('东荒_碎星海峡') %>
<% } else if (subArea === '无尽林海') { %>
<%- await getwi('东荒_无尽林海') %>
<% } else if (subArea === '无声沼泽') { %>
<%- await getwi('东荒_无声沼泽') %>
<% } else if (subArea === '云梦大泽') { %>
<%- await getwi('东荒_云梦大泽') %>
<% } else if (subArea === '百禽祖梧桐') { %>
<%- await getwi('百禽祖梧桐') %>
<% } else if (subArea === '古妖战场') { %>
<%- await getwi('古妖战场') %>

<% } else if (subArea === '万妖国' && _notScanned('万妖国')) { %>
<%- await getwi('万妖国') %>
