@@preprocessing
<%
/* ===== 中央神州控制器 =====
 * 仅当大区域为"中央神州"时激活
 * 大区域级(无子区域): 地图 + 完整总览(功法/天材地宝/谋生/物价) + 散修NPC
 * 子区域级: 地图 + 子区域对应的拆分条目(功法/天材地宝/谋生) + 通用条目(流通功法/通用天材地宝/通用谋生) + 子区域总览/城镇 + 散修与凡人
 * 具体地点级: 额外激活具体地点(宗门/势力) + 该地点NPC
 * 会跳过已被扫描控制器激活的条目
 */
if (typeof mainArea === 'undefined') var mainArea = getvar('stat_data.大区域', { defaults: '中央神州' });
if (typeof subArea === 'undefined') var subArea = getvar('stat_data.子区域', { defaults: '' });
if (typeof place === 'undefined') var place = getvar('stat_data.具体地点', { defaults: '' });
if (typeof _scanActivated === 'undefined') var _scanActivated = [];
function _notScanned(name) { return _scanActivated.indexOf(name) === -1; }
-%>
<% if (mainArea === '中央神州') { %>
<%/* === 始终激活: 地图 === */%>
<%- await getwi('地图_中央神州') %>

<% if (!subArea) { %>
<%/* === 大区域级: 无子区域时激活完整总览 + 散修NPC === */%>
<%- await getwi('中央神州功法总览') %>
<%- await getwi('中央神州天材地宝') %>
<%- await getwi('中央神州谋生指南') %>
<%- await getwi('中央神州物价总览') %>
<%- await getwi('中央神州散修与凡人') %>
<% if (_notScanned('玄清')) { %><%- await getwi('玄清') %><% } %>
<% if (_notScanned('秦无伤')) { %><%- await getwi('秦无伤') %><% } %>
<% if (_notScanned('柳白衣')) { %><%- await getwi('柳白衣') %><% } %>
<% if (_notScanned('聆溪')) { %><%- await getwi('聆溪') %><% } %>
<% } %>

<% if (subArea) { %>
<%/* === 子区域级: 加载通用条目 + 散修与凡人 === */%>
<%- await getwi('流通功法') %>
