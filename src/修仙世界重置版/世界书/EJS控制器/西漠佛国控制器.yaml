@@preprocessing
<%/* 西漠佛国控制器
 * 根据位置变量动态激活西漠佛国相关世界书条目
 * 会跳过已被扫描控制器激活的条目
 */-%>
<%
if (typeof mainArea === 'undefined') var mainArea = getvar('stat_data.大区域', { defaults: '中央神州' });
if (typeof subArea === 'undefined') var subArea = getvar('stat_data.子区域', { defaults: '' });
if (typeof place === 'undefined') var place = getvar('stat_data.具体地点', { defaults: '' });
if (typeof _scanActivated === 'undefined') var _scanActivated = [];
function _notScanned(name) { return _scanActivated.indexOf(name) === -1; }
-%>
<% if (mainArea === '西漠佛国') { %>
<%- await getwi('地图_西漠佛国') %>
<%- await getwi('西漠秘境禁地') %>

<% if (!subArea) { %>
<%/* 大区域级: 加载所有原始总览条目 */%>
<%- await getwi('西漠功法体系') %>
<%- await getwi('西漠天材地宝') %>
<%- await getwi('西漠物价与谋生') %>
<% } else { %>
<%/* 子区域级: 加载通用拆分条目 */%>
<%- await getwi('西漠散修功法') %>
<%- await getwi('西漠绿洲区物价') %>
<%- await getwi('西漠灵材物价') %>
<%- await getwi('西漠修士谋生') %>
<%- await getwi('西漠凡人谋生') %>
<%- await getwi('西漠散修生存指南') %>

<% if (subArea === '灵山净土') { %>
<%- await getwi('灵山净土_区域总览') %>
<%- await getwi('西漠佛门功法') %>
<%- await getwi('西漠佛门圣物') %>
<%- await getwi('琉璃城') %>
<%- await getwi('灵山莲华') %>
<% if (place) { %>
<% if (place === '小雷音寺' && _notScanned('小雷音寺')) { %>
<%- await getwi('小雷音寺') %>
<%- await getwi('小雷音寺藏经阁') %>
<%- await getwi('大雄宝殿') %>
<%- await getwi('金刚峰') %>
<%- await getwi('苦行沙海') %>
<%- await getwi('菩提净土') %>
<%- await getwi('小雷音寺其他诸峰') %>
<%- await getwi('万佛窟') %>
<%- await getwi('法海') %>
<%- await getwi('慧心') %>
<%- await getwi('净尘') %>
<%- await getwi('空山') %>
<%- await getwi('沙弥') %>
<%- await getwi('无尘禅师') %>
<% } %>
<% } %>

<% } else if (subArea === '绿洲带') { %>
<%- await getwi('绿洲带_区域总览') %>
<%- await getwi('西漠大漠灵材') %>
<% if (_notScanned('阿依')) { %><%- await getwi('阿依') %><% } %>
<% if (_notScanned('梵音')) { %><%- await getwi('梵音') %><% } %>
<% if (_notScanned('杏儿')) { %><%- await getwi('杏儿') %><% } %>
<% if (place) { %>
<% if (place === '万宝楼' && _notScanned('万宝楼')) { %>
<%- await getwi('万宝楼') %>
<%- await getwi('苏清晏') %>
<%- await getwi('月牙') %>
<% } %>
<% } %>

<% } else if (subArea === '黑石深渊') { %>
<%- await getwi('黑石深渊_区域总览') %>
<%- await getwi('西漠魔道功法') %>
<%- await getwi('西漠魔道资源') %>
<% if (place) { %>
<% if (place === '幽冥魔宗' && _notScanned('幽冥魔宗')) { %>
<%- await getwi('幽冥魔宗') %>
<%- await getwi('幽冥魔殿') %>
<%- await getwi('幽冥噬魂囚阁') %>
<%- await getwi('叱骨') %>
<%- await getwi('梵楚') %>
<%- await getwi('幽冥焚天') %>
<%- await getwi('玲涟') %>
<%- await getwi('罗刹女') %>
<%- await getwi('罗刹雪') %>
<%- await getwi('阴月魔妃') %>
<%- await getwi('渊煞魔王') %>
<%- await getwi('幽冥赵曦月') %>
<% } %>
<% } %>

<% } else if (subArea === '大漠腹地') { %>
<%- await getwi('大漠腹地_区域总览') %>
<%- await getwi('西漠大漠灵材') %>
<% if (_notScanned('胡三刀')) { %><%- await getwi('胡三刀') %><% } %>

<% } else if (subArea === '焚魔战线') { %>
<%- await getwi('焚魔战线_区域总览') %>
<%- await getwi('西漠佛门功法') %>
<%- await getwi('西漠魔道功法') %>

<% } else if (subArea === '虚空边境') { %>
<%- await getwi('虚空边境_区域总览') %>
<%- await getwi('西漠域外之物') %>

<% } %>
<% } %>
<% } %>
