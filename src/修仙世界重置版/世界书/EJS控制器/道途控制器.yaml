@@preprocessing
<%
if (typeof daoPath === 'undefined') var daoPath = getvar('stat_data.道途', { defaults: '' });
if (daoPath === '正道') {
  print(await getwi('正道'));
} else if (daoPath === '邪道') {
  print(await getwi('邪道'));
} else if (daoPath === '魔道') {
  print(await getwi('魔道'));
} else if (daoPath === '中立') {
  print(await getwi('中立'));
} else if (daoPath === '混乱中立') {
  print(await getwi('混乱中立'));
}
%>
