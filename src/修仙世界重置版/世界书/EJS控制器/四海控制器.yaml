@@preprocessing
<%/* 四海控制器
 * 根据位置变量动态激活四海相关世界书条目
 * 会跳过已被扫描控制器激活的条目
 */-%>
<%
if (typeof mainArea === 'undefined') var mainArea = getvar('stat_data.大区域', { defaults: '中央神州' });
if (typeof subArea === 'undefined') var subArea = getvar('stat_data.子区域', { defaults: '' });
if (typeof place === 'undefined') var place = getvar('stat_data.具体地点', { defaults: '' });
if (typeof _scanActivated === 'undefined') var _scanActivated = [];
function _notScanned(name) { return _scanActivated.indexOf(name) === -1; }
-%>
<% if (mainArea === '四海') { %>
<%- await getwi('地图_四海') %>
<%- await getwi('四海散修与凡人') %>
<%- await getwi('四海秘境禁地') %>

<% if (!subArea) { %>
<%/* 大区域级: 加载所有原始总览条目 */%>
<%- await getwi('四海功法总览') %>
<%- await getwi('四海天材地宝') %>
<%- await getwi('四海谋生指南') %>
<%- await getwi('四海物价总览') %>
<% } else { %>
<%/* 子区域级: 加载通用/流通拆分条目 */%>
<%- await getwi('四海散修功法') %>
<%- await getwi('四海通用天材地宝') %>
<%- await getwi('四海凡人谋生') %>
<%- await getwi('四海修士谋生') %>
<%- await getwi('四海碧波城物价') %>
<%- await getwi('四海各海域物价特征') %>

<% if (subArea === '东溟海') { %>
<%- await getwi('东溟海_区域总览') %>
<%- await getwi('四海龙族功法') %>
<%- await getwi('四海海族功法') %>
<%- await getwi('四海宗门功法') %>
<%- await getwi('四海东溟海天材地宝') %>
<%- await getwi('碧波城') %>
<%- await getwi('三仙岛') %>
<% if (_notScanned('剑鱼')) { %><%- await getwi('剑鱼') %><% } %>
<% if (_notScanned('浪花')) { %><%- await getwi('浪花') %><% } %>
<% if (_notScanned('泡沫')) { %><%- await getwi('泡沫') %><% } %>
<% if (place) { %>
<% if (place === '东海龙宫' && _notScanned('东海龙宫')) { %>
<%- await getwi('东海龙宫') %>
<%- await getwi('敖青') %>
<%- await getwi('敖凝霜') %>
<%- await getwi('璃月(龙宫)') %>
<% } %>
<% } %>

<% } else if (subArea === '南离海') { %>
<%- await getwi('南离海_区域总览') %>
<%- await getwi('四海海族功法') %>
<%- await getwi('四海南离海天材地宝') %>
<%- await getwi('沉船坟场') %>
<%- await getwi('火狱群岛') %>
<% if (place) { %>
<% if (place === '南海龙宫' && _notScanned('南海龙宫')) { %>
<%- await getwi('南海龙宫') %>
<%- await getwi('烛云') %>
<% } else if (place === '珊瑚宫' && _notScanned('珊瑚宫')) { %>
<%- await getwi('珊瑚宫') %>
<%- await getwi('鲛澜') %>
<% } %>
<% } %>

<% } else if (subArea === '北冥海') { %>
<%- await getwi('北冥海_区域总览') %>
<%- await getwi('四海海族功法') %>
<%- await getwi('四海宗门功法') %>
<%- await getwi('四海北冥海天材地宝') %>
<%- await getwi('龙墓') %>
<%- await getwi('幽灵船港') %>
<% if (place) { %>
<% if (place === '魅花宫' && _notScanned('魅花宫')) { %>
<%- await getwi('魅花宫') %>
<%- await getwi('魅千姬') %>
<%- await getwi('怜星') %>
<%- await getwi('凝雨安') %>
<% } %>
<% } %>

<% } else if (subArea === '西极海') { %>
<%- await getwi('西极海_区域总览') %>
<%- await getwi('四海西极海天材地宝') %>
<%- await getwi('破败海墟') %>
<%- await getwi('风暴(西极海)') %>

<% } %>
<% } %>
<% } %>
