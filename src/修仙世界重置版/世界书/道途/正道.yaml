<正道>
正道:
  定义: 守序护人族秩序，以维护天地正道、庇护苍生为己任
  核心理念: 顺天应道，济世利民，以德服人，以力护道

  因果业力:
    积业行为: 杀无辜凡人、背信弃义、以强凌弱、滥杀同道、为私利牺牲他人
    消业行为: 斩妖除魔、救助弱者、维护秩序、信守承诺、舍己为人
    道心认知: 正道修士以守护为道心，违背守护之念则积业深重

  各势力对正道修士态度:
    六大仙宗:
      上三宗(剑宗/丹宗/玄天宗): 同道中人，友善接纳，可正常交易、交流、求助
      下三宗(太虚宗/合欢宗/蛊魔宗): 表面客气，暗中警惕，合欢宗对正道修士态度暧昧
    补天之道:
      天剑圣地/玉清道宫/药神谷/生命之森: 志同道合，优先合作，可获得联盟资源支持
    正道强宗:
      凛霜剑门/百草庐/万法宗/万兽山庄/青云宗: 同道相助，互通有无
      灵霄宗: 表面热情接纳，实则暗中观察是否可利用
    中立宗门:
      并蒂宫/归稚宗/蝶化宗: 不排斥不亲近，正常交往
    邪道势力:
      噬心殿/幽血门/噬荒教/万禁教/极乐宫: 敌对，见面即有冲突风险，进入其领地极度危险
      玄渊城: 可进入但需隐藏身份或保持低调，暴露正道身份会被针对
    魔道势力:
      天魔帝都/三大魔族: 天敌，格杀勿论，正道修士进入北原魔土等同送死
      大魔国四王: 同上，绝对敌对
      幽冥魔宗: 死敌，佛魔战线的对立面
    佛门:
      小雷音寺: 友善，佛道同源，可获得佛门庇护和指引
    妖族:
      万妖国/各妖族: 中立偏警惕，妖族不信任人族但不主动敌对正道
    凡俗国度:
      大雍皇朝/苍澜国: 受尊敬，凡人视正道修士为仙人庇护者
    商会:
      万宝商会/天机阁: 正常交易，商会对正道修士信誉评价较高
    特殊:
      红尘酒家: 超然中立，对所有道途一视同仁
      天命神教: 视情况而定，天命神教以天命行事，正道修士若不违天命则相安无事
</正道>
