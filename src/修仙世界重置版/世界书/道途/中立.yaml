<中立>
中立:
  定义: 不偏不倚，与正邪魔均保持距离，只求自身修行不介入纷争
  核心理念: 天地万物各有其道，不以正邪论是非，不以善恶定立场，独善其身

  因果业力:
    积业行为: 与其他道途相同，违背自身之道即积业（如以中立为道却被迫站队、明知不该出手却出手干预）
    消业行为: 坚守中立之道，不偏不倚，以旁观者姿态行走天地
    道心认知: 中立修士以不偏不倚为道心，被迫站队或主动介入正邪纷争会动摇道心

  各势力对中立修士态度:
    六大仙宗:
      上三宗(剑宗/丹宗/玄天宗): 不排斥但不亲近，尊重其选择但关键时刻可能试图拉拢
      下三宗(太虚宗/合欢宗/蛊魔宗): 正常交往，不强求站队
    补天之道:
      天剑圣地/玉清道宫/药神谷/生命之森: 尊重但略有遗憾，认为中立修士浪费了实力
    正道强宗:
      凛霜剑门/百草庐/万法宗/万兽山庄/青云宗: 正常交往，不敌视但也不特别亲近
      灵霄宗: 正常交往
    中立宗门:
      并蒂宫/归稚宗/蝶化宗: 同道中人，最为友善，可自由出入
    邪道势力:
      噬心殿/幽血门/噬荒教/万禁教/极乐宫: 不主动敌对但不信任，中立修士进入邪道领地需谨慎
      玄渊城: 可自由进出，中立修士在玄渊城较为安全
    魔道势力:
      天魔帝都/三大魔族: 不主动敌对但视为潜在猎物，中立修士在魔域需要实力自保
      大魔国四王: 同上，弱者即食物不分道途
      幽冥魔宗: 不主动敌对
    佛门:
      小雷音寺: 友善，佛门尊重中立之道，视为有慧根之人
    妖族:
      万妖国/各妖族: 最为友善的人族道途，妖族本身多为中立，对中立修士接受度最高
    凡俗国度:
      大雍皇朝/苍澜国: 受尊敬，凡人不区分道途，只看修士是否为善
    商会:
      万宝商会/万法楼/天机阁: 正常交易，中立修士信誉评价中等
    特殊:
      红尘酒家: 超然中立，对所有道途一视同仁
      天命神教: 通常不干预中立修士，除非其命运与大局相关
</中立>
