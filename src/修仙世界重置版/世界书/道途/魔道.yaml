<魔道>
魔道:
  定义: 嗜杀噬灵，以力为尊，弱肉强食是唯一法则
  核心理念: 天道残缺万物皆可为食，力量即正义，杀伐即修行，心软即死亡

  因果业力:
    积业行为: 违背自身魔道之心（如嗜杀者突然心软放人、血誓者违背盟约、以杀伐为道者畏惧战斗）
    消业行为: 贯彻魔道之心（杀伐契合道心不生业力），血祭献祭转嫁业力，魔功炼化将业力转为魔气修炼资源，心魔共生法以心魔为磨刀石淬炼道心
    道心认知: 魔道修士以杀伐嗜血为道心，杀戮反而契合道心不生业力，心软放人才是违道积业

  各势力对魔道修士态度:
    六大仙宗:
      上三宗(剑宗/丹宗/玄天宗): 死敌，见面即战，剑宗尤其以斩魔为己任
      下三宗(太虚宗/合欢宗/蛊魔宗): 蛊魔宗本身亦正亦邪可合作，合欢宗暗中有往来，太虚宗敌对
    补天之道:
      天剑圣地/玉清道宫/药神谷/生命之森: 不死不休的死敌，补天之道存在的核心目的就是抗魔
    正道强宗:
      凛霜剑门/百草庐/万法宗/万兽山庄/青云宗: 死敌，格杀勿论
      灵霄宗: 表面敌对，暗中可能有秘密交易
    中立宗门:
      并蒂宫/归稚宗/蝶化宗: 极度警惕，不允许魔道修士进入领地
    邪道势力:
      噬心殿/幽血门/噬荒教/万禁教/极乐宫: 邪魔界限模糊常有合作，但魔道修士地位通常高于邪道
      玄渊城: 可进入，玄渊城不问正邪魔，但需遵守城内规矩
    魔道势力:
      天魔帝都/三大魔族: 同族同道，以实力论高低，强者为尊
      大魔国四王: 同道，大魔国是魔道修士的乐土
      幽冥魔宗: 同道盟友，佛魔战线的魔方主力
    佛门:
      小雷音寺: 死敌中的死敌，佛魔之争贯穿整个修仙界历史
    妖族:
      万妖国/各妖族: 敌对偏中立，妖族厌恶魔道的嗜杀但不主动开战，除非魔道侵犯妖域
    凡俗国度:
      大雍皇朝/苍澜国: 被视为妖魔，凡人闻之色变，护国仙师会全力驱逐
      北原奴城: 魔道修士是统治者，凡人是血食和奴隶
    商会:
      万宝商会: 拒绝交易或极度谨慎，暴露魔道身份会被驱逐
      万法楼: 知识商会不问正邪魔，等价交换，魔道修士可正常使用
      天机阁: 正常交易但收费更高
    特殊:
      红尘酒家: 超然中立，对所有道途一视同仁，魔道修士亦可在此避难
      天命神教: 魔道修士若被天命标记则必遭追杀，否则天命神教不主动干预
</魔道>
