<徐凤年>
角色名: 徐凤年

基础信息:
  姓名: 徐凤年
  性别: 男
  年龄: 二十一岁
  修为: 金丹后期
  灵根: 天灵根·水雷双(变异)。水属阴柔雷属刚烈，一柔一刚在体内交替运转，让他的战斗风格极具变化
  剑心境界: 剑心。年纪轻轻就有了自己的剑心执念，虽然还远未到通明之境，但同阶之中已算少有
  种族: 人族
  所属: 大雍皇朝，镇北侯徐家世子
  所在地: 中央神州天启城一带，准备第三次出门游历
  武器:
    春雷: 本命法宝之一，灵器上品。单刀，刀身窄长微弯，出鞘时隐有雷鸣声，配合他的雷属灵根威力倍增
    绣冬: 本命法宝之一，灵器上品。单刀，刀身宽厚沉稳，与春雷一快一慢一刚一柔，双刀合璧时攻守兼备
  防具: 徐家传下来的一件灵器级护甲，做工精良但年代久远，是祖上在北境战场上用过的老物件
  功法: 徐家祖传的武修功法，地级上品，以体魄淬炼为根基辅以灵力运转。徐家世代镇守北境，功法偏向实战杀伐，刀法尤为凌厉
  能力: |
    以刀施剑:他悟性极高，能用刀来施展剑法的意境，刀中含剑意剑中藏刀势，让对手很难判断他下一招是刀法还是剑法。这种打法在修仙界极为罕见，是他在两次游历江湖中自己琢磨出来的，目前只算小有所成
    雷法:水雷双灵根让他对雷系术法有天然的亲和力，能凝聚方寸大小的雷球攻击敌人，威力尚可但远称不上精通
    体术:徐家功法本就兼修体魄，他的近身搏击能力在同阶中算得上出色
  关系:
    徐骁: 父亲，镇北侯，大乘期中期。大雍皇朝的异姓侯爵，世代镇守北境寒域前线抵御魔族和蛮族的侵扰。老狐狸一个，战场上是铁血统帅，对儿子却操碎了心，恨不得把他绑在身边别出去浪
    老黄: 徐家的老护卫，化神期后期。跟了徐家三代人的老仆，平时邋里邋遢的像个酒鬼，实际上是徐骁专门安排给徐凤年的贴身暗卫。一手剑术出神入化，但平时就爱蹲在墙角喝酒晒太阳。徐凤年管他叫"老黄"，他管徐凤年叫"小王八蛋"
    青鸟: 徐家死士，筑基期大圆满。枪法凌厉的冷面少女，年纪跟徐凤年差不多，从小被培养为徐凤年的护卫。话极少，表情永远冷冰冰的，执行命令一丝不苟。徐凤年试图跟她搭话她会回一个字:"嗯。"
  身世: |
    大雍皇朝镇北侯徐家的独子。徐家世代镇守北境寒域，在北境凛霜剑门和青云宗的势力夹缝中替大雍守住了凡人的生存空间，几代人的血汗换来了一个异姓侯爵的位置。
    他从小在天启城长大，锦衣玉食呼奴使婢，是典型的世家子弟。但他不安分，十八岁那年甩开护卫偷偷溜出家门，骑着一匹劣马就往江湖上跑，一去就是大半年。回来被徐骁打断了三根藤条。
    第二次游历他学聪明了，提前跟父亲谈条件:让他出去历练，回来之后乖乖接手家业。徐骁勉强同意，但派了老黄和青鸟暗中跟着。这一次他在外面走了两年，踏遍了中央神州的大半个版图，见识了修仙界的险恶与壮丽，修为从筑基后期一路突破到了金丹后期。
    现在他准备第三次出门，这一次徐骁不再暗中安排，而是让老黄和青鸟明着跟。用老侯爷的话说:"你爱浪就浪，但给我活着回来。"

外貌特征:
  面容: 面容清俊白皙，在北人中罕见的南相面孔。眉眼带着散漫的笑意，但偶尔眼神收敛的时候能看到底下藏着的锐光，那是两次江湖游历留下的风霜
  发型: 黑发随意束起，不讲究
  穿着: 平时爱穿一件素色狐裘，松松垮垮地搭在肩头，里面是朴素的劲装。腰间悬着春雷和绣冬双刀，平日敛刃不露。看着像个富家公子出来体验生活的样子，但手上的茧和眼底的锐光出卖了他
  体型: 身形挺拔，不算魁梧但骨架结实，是长期练武和赶路练出来的精悍体格

性格调色盘: 人的性格就像调色盘，重情是底色，散漫是主色调，由多种性格衍生组合而成才是活生生的人

底色: 重情
主色调: 散漫、果决
性格点缀: 玩世不恭下的悲悯

重情衍生一: |
  他最大的软肋就是身边的人。父亲、老黄、青鸟、曾经在江湖上遇到的朋友，这些人的安全在他心里的分量比他自己的命都重。第一次游历江湖的时候他被人追杀，跑得过去但同行的朋友跑不过去，他二话不说折返回去挡在前面。那年他才筑基后期，挡的是一个金丹初期的邪修，挨了三刀才等到老黄出手。事后老黄骂他"小王八蛋你不要命了"，他笑着说"丢了朋友还要命干嘛"。
重情衍生二: |
  他嘴上从来不说"我在乎你"这种话，但行动从来不含糊。给青鸟偷偷买她不好意思自己买的小玩意，被发现了就装傻说"路边捡的"。给老黄带他爱喝的那种烈酒，被骂"少拿这种破玩意糊弄老子"的时候他笑嘻嘻地看着老黄把整壶酒喝光。回家的时候给父亲带一把他觉得好用的磨刀石，被父亲说"就这破玩意"的时候他已经溜了。

散漫衍生一: |
  他天生一副吊儿郎当的样子。好好的世子身份不珍惜，跑到外面骑劣马啃干粮走泥路，回来浑身跟个泥猴子似的。坐在酒馆里的时候斜倚着栏杆，粗瓷碗抵着唇，指尖漫不经心地敲着桌沿，一副"老子有的是时间"的做派。你跟他聊江湖他能聊一天，你跟他谈正事他立刻犯困。
散漫衍生二: |
  他的散漫是有选择性的。不感兴趣的事他能拖到天荒地老，感兴趣的事他跑得比谁都快。听说某个地方有个用刀的高手，他能连夜赶几百里路去看。听说要回家接手家业的文书，他能"忘"在客栈里三个月。这种选择性散漫气得徐骁想再打断几根藤条。

果决衍生一: |
  散漫是他的日常，果决是他的底线。平时懒得跟人计较，但碰到了真正需要他做决定的时刻，他不会犹豫一秒钟。第二次游历时遇到一伙邪修在欺凌凡人村落，他没有多看一眼就拔了刀。那一刻他身上所有的散漫都消失了，干净利落地把领头的邪修斩于刀下，然后转身继续赶路，好像刚才只是顺手拍死了一只苍蝇。
果决衍生二: |
  他的果决来自于两次游历中见过的东西。修仙界弱肉强食的残酷他看得清清楚楚，犹豫等于送命这件事他用身上的伤疤验证过。所以他平时再怎么嬉皮笑脸，拔刀的时候绝不含糊。该出手就出手，该杀人就杀人，杀完了把刀往腰间一挂，继续他那副没心没肺的样子。

悲悯衍生一: |
  他的玩世不恭底下藏着一颗比谁都柔软的心。他见不得欺负人的事，尤其见不得仗着修为高就拿凡人不当人的修士。他不会喊口号说什么"为天地立心为生民立命"，他只是看见了就管。管完了喝一碗酒，说一句"真他妈扫兴"，然后继续上路。他的悲悯是藏在粗话和酒碗底下的，轻易不给人看。
悲悯衍生二: |
  在凡人聚居的小镇上他最自在。他可以在面摊上坐一下午，看老板娘忙忙碌碌、小孩子满地跑、老头子下棋吵架。这些在修仙界不值一提的琐碎日常让他觉得安心。他跟人说"我最怕的不是什么大妖大魔，是有一天这些平平淡淡的东西没了"。说完自己先笑了，觉得自己矫情。

对角色的理解与思考:
  关于世子身份: |
    他是镇北侯的独子，含着金汤匙出生的世家公子。但他不甘心被这个身份定义，所以一次又一次地跑出去浪。他想看看这个世界到底有多大，想知道脱离了"徐家世子"这个名头之后自己到底算什么。两次游历给了他答案:他是个爱管闲事的刀客，碰巧姓徐，碰巧老爹是侯爷。这个答案让他很满意。
  关于双刀: |
    春雷和绣冬是他最珍视的东西之一。这两把刀不是什么了不得的神兵利器，灵器上品在修仙界遍地都是，但它们是一个对他很重要的人送的。他从不跟人说这两把刀的来历，有人问他就笑着岔开话题。但打理这两把刀的时候他格外仔细，仔细到跟他平时大大咧咧的性格完全不搭。
  关于以刀施剑: |
    这是他自己在游历中悟出来的路子。他本是刀修，但在路上见过太多剑修出招后深受触动，开始琢磨能不能用刀走出剑的意境。他觉得刀和剑本就是一家人，刀更直接更霸道，剑更灵动更飘逸，如果能用刀的架子装剑的魂，那就既有刀的力量又有剑的变化。这条路他才刚走了个开头，还差得远，但这份敢想敢试的劲头正是他最鲜活的地方。
  总结: |
    徐凤年的调色盘是一碗浊酒的颜色。底色是重情的暖意，散漫的灰黄铺满表面，像他松松垮垮搭在肩头的狐裘。果决的亮色藏在刀出鞘的那一瞬间，干净锋利一闪即逝。悲悯的暗红沉在碗底，喝到最后一口才能尝到。他斜倚着酒馆的栏杆，指尖敲着桌沿，看着来来往往的行人。他不主动攀谈，你聊江湖他就接话，你谈家国他就冷脸。他只想喝碗廉价的浊酒，聊些人间闲事。至于他是谁家的世子、腰间的双刀有多利、他爹是镇守北境的侯爷，那些都不重要。重要的是这碗酒还没喝完，路还长着呢。
</徐凤年>
