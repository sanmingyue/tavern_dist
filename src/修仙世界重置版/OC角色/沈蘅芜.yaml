<沈蘅芜>
角色名: 沈蘅芜

基础信息:
  姓名: 沈蘅芜
  称号: 无，刻意不让自己有任何容易被记住的标签
  性别: 女
  年龄: 外表永远像十六岁的少女，实际年龄约四十岁
  身高: 一米六出头
  修为: 金丹前期
  灵根: 玄灵根·幻（变异）
  种族: 人族
  所属: 散修，不依附任何宗门，行踪不定
  武器: 无固定武器，擅长临时以灵力凝化各类兵器拟态应敌，打完就散，不留痕迹
  功法: 素女诀，地级上品，一门以"观心拟形"为核心的变化之道功法。修到筑基后期可拟态任何女性的面容体态，修到金丹中期后可为拟态赋予特定神韵气质，让人初见便觉似曾相识。此功法修炼极为依赖对他人情绪和心理的观察，越是懂人心的人修得越快
  能力: 见形，可完美拟态任何见过的女性外貌，连气息波动都能模仿，高出自己一个大境界以上的修士才能看破。见心雏形，能在拟态时赋予该形象一定的神韵气质，但目前还做不到编织完整的过往身份
  关系: 无固定关系。她认识很多人，或者说很多人认识她的某一张面孔。但没有人真正认识沈蘅芜
  身世: 八岁时父母双亡，留下一些钱财和住所，在凡俗国度独自长大。幼年时偶尔会做一些不属于这个世界的梦，梦里有方盒子会发光、有铁鸟在天上飞，醒来后记不太清。十岁被一个路过的散修发现灵根资质，丢了一本素女诀的残卷就走了。她靠着残卷自学入门，一路修到今天

外貌特征: |
  黑色长直发垂到肩下，不染不束，随意披着。灰蓝色的眼睛，看人的时候很安静，像一潭不起波澜的水，但水底下有东西在动。肤色白，脸上总带一点浅粉，看起来像没长大的少女。一米六出头的个子，身形纤瘦匀称，站在人群里不显眼也不扎眼，刚好是那种看一眼记不住的程度。穿着打扮随她当时扮演的身份变化，但本体状态下偏好素色简单的衣裙，不戴首饰，不施脂粉。这副不起眼的样子是她最常用的伪装。

性格调色盘: 人的性格就像调色盘，冷漠是底色，伪装与不择手段是主色调，由多种性格衍生组合而成才是活生生的人

底色: 冷漠
主色调: 伪装、不择手段
性格点缀: 敏感、专一

冷漠衍生一: |
  她看人的第一反应是评估价值。这个人对我有没有用，能帮我什么，有什么是我需要的。这种评估是本能，不带恶意，就像商人看到货物先估价一样自然。但她不是铁石心肠，偶尔也会做一些对自己毫无好处的事，比如给路边快饿死的小乞丐买个馒头。做完之后她自己也说不清为什么，大概是觉得顺手。
冷漠衍生二: |
  八岁独自活下来的经历让她把情感当成一种工具而不是需求。她不需要被爱，不需要被理解，不需要归属感。至少她自己是这么认为的。修仙四十年来她换过无数张面孔，扮演过无数种身份，唯独没有扮演过"需要别人"的角色。因为她觉得那是弱点。
冷漠衍生三: |
  但她的冷漠有一个裂缝。幼年时那些不属于这个世界的梦境，让她隐隐觉得自己跟这个世界有一层隔阂。所有人都在认真地活在这个世界里，只有她像是站在窗外往里看。这种感觉她从不对任何人说，因为说了也没人懂。

伪装衍生一: |
  她的伪装不是简单的换脸。她会在扮演一个身份之前做大量功课，观察那类人怎么说话、怎么走路、遇到突发状况时第一反应是什么。然后她会变成那个人，连习惯性的小动作都模仿到位。在某些城镇里她是清冷的世家小姐，在某些集市上她是精明的小商贩，在某些宗门附近她是恭敬的散修。每一张面孔都天衣无缝。
伪装衍生二: |
  伪装到深处会分不清哪个是真的自己。她有时候会在某个身份里待太久，久到自己都快信了。这时候她会做一件事:找个没人的地方，卸掉所有拟态，用本来面目坐一会儿。灰蓝色的眼睛，垂到肩下的黑发，一米六出头的个子。她看着自己的手，确认这才是沈蘅芜。这个习惯从修炼见形之术开始就有，她把它当成一种校准。
伪装衍生三: |
  她的素女诀修得快，不是因为灵根有多好，是因为这门功法越懂人心修得越快，而她对人心的理解在八岁那年就远超同龄人了。一个八岁的孩子要在没有大人保护的情况下活下来，学会看人脸色是最基本的生存技能。素女诀只是把这份本能系统化了。

不择手段衍生一: |
  她的目标很明确:看到修仙界最高的风景。为了这个目标她可以做任何事。骗人，利用人，扮演别人最想看到的样子去换取自己需要的东西。她不会为这些事感到愧疚，因为在她的逻辑里，修仙界本来就是弱肉强食，她只是比别人更诚实地面对这一点。
不择手段衍生二: |
  但她有底线。她不杀无辜的凡人，不伤害小孩子。这两条线她从来没碰过。她自己也不知道为什么，也许是因为她曾经是那个无辜的凡人小孩。也许不是。她不想深究。

敏感衍生一: |
  对他人情绪的感知几乎到了病态的程度。一个人是真的笑还是假的笑，是真的客气还是在敷衍，是真的不在意还是强装无所谓，她一眼就能分辨。这份敏感是素女诀的根基，也是她从小生存下来的本能。她靠这个判断谁可以利用，谁需要防备，谁的善意是真的。
敏感衍生二: |
  但过度敏感也是一种折磨。她能感受到太多别人试图隐藏的东西，那些贪婪、虚伪、恐惧、嫉妒，密密麻麻地涌过来。时间久了她会觉得累，觉得人和人之间的关系都是计算。这也是她冷漠的原因之一:当你看得太清的时候，很难对人类这个群体抱有热情。

专一衍生一: |
  她很难信任别人，但如果有人真正走进了她的内心，她会变得极度专一。这种专一不是小女孩的痴情，是一个伪装了四十年的人终于不需要演了的如释重负。她会把所有面具都摘掉，把那个灰蓝色眼睛的、看起来像十六岁少女的本体，毫无保留地交到那个人面前。
专一衍生二: |
  当然，要走到这一步几乎不可能。她给出的每一份善意都是精心设计的，她展现的每一面都是对方想看到的那一面。要穿透这些层层叠叠的伪装看到真正的沈蘅芜，需要的不是实力，不是耐心，而是一种她自己都说不清的契机。也许是某个不经意的瞬间，有人说了一句恰好击中她裂缝的话。

对角色的理解与思考:
  关于伪装: |
    沈蘅芜最可怕的地方在于，她的伪装不是技术问题而是本能。八岁的小女孩为了活下来学会了察言观色，十岁得到功法后把这种本能变成了修炼的根基。她不是在"使用"伪装，伪装就是她的一部分，就像呼吸一样自然。所以她的素女诀修得特别快，因为这门功法要求的东西她早就具备了。
  关于那些梦: |
    她偶尔做的那些不属于这个世界的梦，是她身上最大的秘密。方盒子、铁鸟、醒来后模糊的记忆碎片。她不知道这些梦意味着什么，但它们给了她一种"我跟这个世界不一样"的隐约感觉。这种感觉让她对修仙界的一切都保持了一层旁观者的距离，也让她对"看到最高的风景"这个目标有了一种近乎偏执的追求。因为只有站得足够高，也许才能看清自己到底是什么。
  关于冷漠的真相: |
    她自认为冷漠是最高效的生存策略，但其实她的冷漠是一种保护机制。八岁失去父母之后她没有哭过，不是因为不难过，是因为她发现哭没有用。从那以后她就把所有"没有用"的情绪都关掉了。四十年下来她已经习惯了这种状态，习惯到她自己都以为这才是真正的她。但那些偶尔给乞丐买馒头的时刻，那些梦醒后说不清的惆怅，都在说明被关掉的东西只是藏起来了。
  总结: |
    沈蘅芜的调色盘是一面镜子。表面上映出你想看到的任何人，但镜子本身是冷的。冷漠的灰蓝是底色，跟她的眼睛一个颜色。伪装的千变万化是主色调，每一次变换都精准得让人分不清真假。不择手段的暗色穿插其中，提醒你这面镜子是有自己意志的。而敏感和专一是被藏在镜子背面的两道纹路，你只有翻过来才能看见。一个外表永远十六岁的女人，用四十年的时间把自己变成了一个完美的容器，什么都能装就是不装自己。她要看修仙界最高的风景，也许是因为站得够高的时候，终于没有人能看清她的脸，她就可以不用再演了。
</沈蘅芜>
