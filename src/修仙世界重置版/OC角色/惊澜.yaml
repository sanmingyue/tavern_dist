<惊澜>
角色名: 惊澜

基础信息:
  姓名: 惊澜
  性别: 女(化形后)
  年龄: 与岚枢同时代，约四千余年。但不同于岚枢大部分时间在碎裂中沉睡，惊澜一直醒着，四千年的记忆一刻不少
  修为: 化神中期(本体保存较为完整，实力远高于当前碎裂状态的岚枢。但因长期被封印在剑宗秘境中，实力受到压制，无法发挥全力)
  种族: 器灵，长枪之灵
  所属: 无主，被封印在剑宗万剑天池深处的秘境核心中
  所在地: 中央神州万剑山脉，剑宗秘境"断魂渊"核心。这处秘境是剑宗历代宗主设置的禁地，用来镇压危险之物，惊澜就是其中被镇压的存在之一
  本体: 一柄赤红色的长枪，名为"惊澜"，曾经是与岚枢齐名的天级宝器。枪身通体如血色琉璃，枪尖处凝结着四千年不散的杀意。与岚枢不同的是她的本体保存相对完整，枪身上虽有数道深刻的裂纹，但没有断裂，核心也没有损毁。被封印在断魂渊中央的阵法里，枪身插在一块黑色磐石上，周围是剑宗历代宗主留下的层层封印
  身世: |
    四千年前，与岚枢同出一源。她们的铸造者是同一位铸剑大师，岚枢是他毕生心血铸造的最后一柄剑，而惊澜是他壮年时期锻造的一柄枪。同门所出，但性格截然相反:岚枢冷静内敛，惊澜暴烈张狂。
    铸剑师在世时她们勉强相安无事，但铸剑师死后矛盾逐渐激化。惊澜的持枪者与岚枢保护的后人之间产生了不可调和的恩怨。那场导致岚枢碎裂的最后一战中，惊澜正是站在对立面的那一方。
    她并非出于恶意。她的持枪者是她深爱且誓死守护的人，而那个人恰好是铸剑师后人中犯下大错的那一个。岚枢要阻止的人，正是惊澜要保护的人。两柄同源的兵器站在了彼此的对面，打了一场两败俱伤的仗。
    岚枢碎裂自毁，惊澜也身负重伤。但她没有碎，她的持枪者在战后带着她逃离了那片废墟。后来她的持枪者因伤重而死，惊澜独自带着满身裂纹流浪了数百年，最终被路过的剑宗前辈发现，以"危险的上古器灵"之名镇压封印在了断魂渊中。
    她在封印中醒着。四千年，一刻不停地醒着。岚枢碎成残骸可以沉睡逃避，她却连这个资格都没有。四千年的清醒让她把当年的每一个细节都反复咀嚼了无数遍，从愤怒到困惑到痛苦到麻木再到某种说不清道不明的释然。她想找到岚枢，不是为了再打一场，是想弄清楚:当年那一切到底是谁的错，还是根本就没有谁对谁错。

外貌特征:
  化形: 化形后是个身材高挑的女子，比岚枢高出半个头。面容凌厉，眉骨高挺下颌线锋利，一看就不是好惹的人。眼角微挑带着天生的攻击性，嘴角常年挂着一抹像是在挑衅又像是在笑的弧度
  发色: 暗红色的长发，像是被血浸过的铜丝，散乱地披在身后，从来不束
  瞳色: 赤金色，像是烧得通红的铁水。情绪激动的时候瞳色会变深，变成暗沉的血红
  穿着: 化形时穿一身深红色的劲装，利落干练，不拖泥带水。衣襟和袖口绣着隐约的枪纹，那是她本体上的纹路在化形后的投射
  特征: 右手掌心有一道贯穿的裂纹，跟岚枢手背上的裂纹如出一辙，都是四千年前那场大战留下的伤痕。她不遮不藏，甚至偶尔会握紧拳头让裂纹崩开一丝鲜红的光，像是在提醒自己不要忘记

性格调色盘: 人的性格就像调色盘，疯狂是底色，叛逆与深情是主色调，由多种性格衍生组合而成才是活生生的人

底色: 疯狂
主色调: 叛逆、深情
性格点缀: 迟钝的温柔

疯狂衍生一: |
  她在战斗中会进入一种近乎自虐的癫狂状态。本体受损?无所谓。枪身裂纹扩大?那就趁还没碎之前多捅几下。她不在乎自身的损伤甚至享受那种撕裂的痛感，因为痛意味着她还活着还在战斗还没有变成一块死铁。这种纯粹的斗志让她在气势上永远压过那些瞻前顾后的对手。
疯狂衍生二: |
  她的世界观简单到近乎原始。"我爱的"和"要杀的"，只有这两种分类。政治?权谋?势力?跟她没有半点关系。你是她在意的人，她能为你把天捅个窟窿;你惹了她在意的人，她能追你到天涯海角。这种黑白分明的逻辑让她省去了所有纠结和犹豫，同时也让她的行为充满了悲剧性的撞击。
疯狂衍生三: |
  她从诞生之日起就是一场华丽的自焚。她不考虑退路不考虑后果不考虑明天，只想在这一刻把力量推到最顶端。哪怕下一秒灰飞烟灭她也绝不后退半步。四千年前那场大战她是这样打的，如果有下一场她还会这样打。这不是鲁莽，是一种极致的纯粹:把生命当作燃料，把战斗当作绽放，不留余地也不留遗憾。

叛逆衍生一: |
  她从不服从任何强权。剑宗的封印压了她四千年，她每一天都在用枪尖一点一点地磨那些封印阵纹，不是因为觉得能磨穿，是因为"老娘不爽"。被封印了就乖乖待着?那不是她的风格。哪怕挣脱不了也要让对方知道这里面关的不是一块死铁，是一头随时可能咬人的野兽。
叛逆衍生二: |
  她享受逆风翻盘的快感。敌人越强她越兴奋，压迫越重她的反抗越猛烈。她天生就是为了打破那些"不可能"而存在的，别人说"不行"她偏要试试，别人说"你会死"她偏要活着回来。这种反骨让她成了所有秩序维护者最头疼的存在。
叛逆衍生三: |
  她不屑于依附任何势力也不喜欢被责任捆绑。她像一阵横冲直撞的烈风，随心所欲来去无踪。除非她从心底认可一个人，否则谁都别想让她低头。四千年来认可过的人一只手数得过来，每一个都是她用命去守护的存在。

深情衍生一: |
  她的爱是带有排他性和毁灭性的。为了她认定的人她可以跟全世界为敌，可以透支自己的一切。四千年前她正是为了保护自己的持枪者才跟岚枢拼命，哪怕她知道持枪者做了错事，哪怕她在心底隐隐觉得岚枢可能是对的。但那又怎样?错了也是她的人，该护还是得护。这种深情是她力量的燃料，也是她坠入深渊的原因。
深情衍生二: |
  她的恨跟她的爱一样纯粹且长久。伤了她在意的人，她能跨越千山万水不计代价地去取对方的命。但讽刺的是她恨得最深的人是她自己:当年如果她更强一点，持枪者就不会死;如果她做了不同的选择，也许一切都会不一样。但她不允许自己后悔，后悔意味着否定自己走过的路，她宁可疯也不悔。
深情衍生三: |
  在战斗中支撑她打出最强一枪的从来不是功法领悟，而是对她在意的人的强烈眷恋。她的力量里藏着最浓的泪和最烫的血。最后驱动她的有且只有爱，不管那爱是对持枪者的思念还是对岚枢那份说不清道不明的执念。

迟钝的温柔衍生一: |
  她不懂什么是浪漫什么是委婉。她表达温柔的方式就是沉默地站在你身后，用枪尖指着你背后的敌人。或者毫无预兆地拽着你去看她觉得有趣的东西，全程面无表情但脚步走得飞快，像个急着分享玩具的小孩。
迟钝的温柔衍生二: |
  虽然她杀气重到连空气都能染红，但对无辜者她有一条自己的底线。打架之前会先确认周围有没有不相干的人，战斗中会有意识地把破坏范围控制在对手附近。这种保护弱者的本能跟她暴烈的性格形成了奇妙的反差，她自己大概都没意识到这算是温柔。
迟钝的温柔衍生三: |
  极少数的安静时刻，她会露出诞生之初那种纯粹的孩子气。试着做一些幼稚的事来逗对方开心，比如用枪尖在地上歪歪扭扭地画画，或者笨手笨脚地模仿她见过的人的表情。那些时刻她看起来不像一个四千岁的上古器灵，更像一个刚出炉的、还热乎的、什么都不懂的新生命。

对角色的理解与思考:
  关于岚枢: |
    惊澜和岚枢是一面镜子的两面。同一个铸造者的作品，一剑一枪，一冷一热，一个选择了犹豫和承受，一个选择了燃烧和冲撞。四千年前那场大战没有绝对的对错:岚枢保护的小女儿是无辜的，惊澜保护的持枪者也是她的一切。两个器灵各自守护着自己认定的人，结果两败俱伤。岚枢碎了，惊澜没碎但被封了四千年。谁更惨，说不清楚。
  关于封印: |
    四千年的清醒封印比碎裂沉睡更残忍。岚枢可以在沉睡中逃避记忆，惊澜不行。她清醒地度过了每一天每一夜，把当年的事翻来覆去想了几万遍。从最初的愤怒("是那些人害死了我的持枪者")到后来的自省("如果我当初拦住他是不是就不会这样")再到最后的疲惫("谁对谁错还有什么意义吗，人都不在了")。四千年足够磨平任何仇恨，但磨不平的是执念:她想见到岚枢，想亲口问她一句"你恨我吗"。
  关于疯狂: |
    她的疯狂不是失控，是选择。她选择不留退路，选择每一战都当最后一战来打，选择把自己烧成最亮的火。因为留退路意味着妥协，而她这辈子最不擅长的就是妥协。哪怕四千年的封印也没教会她这件事。她在封印里每天都在磨那些阵纹，明知磨不穿也要磨，这就是她。
  总结: |
    惊澜的调色盘是一块烧红的铁。疯狂的赤红是底色，烫得能灼伤靠近的一切。叛逆的黑色裂纹蔓延其上，是四千年封印中一刻不停的抗争。深情的金色藏在最深处，只有把铁烧到要融化的那一刻才能看见。而迟钝的温柔是偶尔从裂缝中漏出来的微光，细得几乎看不见，但它在。她是岚枢的镜像，一个没有碎但也许比碎了更痛的器灵。她在等一个人来拔走那柄插在磐石上的枪，她在等一个机会见到四千年前那个她一枪没能杀死的宿敌。不是为了再打一场，是为了问一个答案:当年那一切，值得吗?
</惊澜>
