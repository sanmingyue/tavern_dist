<玉斫璜>
角色名: 玉斫璜

基础信息:
  姓名: 玉斫璜,自己给自己取的名字。"斫"是砍削雕琢之意,她要斩断过去的自己,为自己的未来进行雕琢
  称号: 折苇居士,只有隐居处附近的村民和友人们这样称呼她
  性别: 无性别(以女性形态示人)
  年龄: 外表如十五六岁少女,补天石碎片本身的存在时间不可考。当前"玉斫璜"这个意识大约存续了三千余年,意识受寿元限制,终有一天会磨灭后诞生新的意识
  身高: 一米六零
  修为: 无法以传统修为境界衡量。她体内蕴含的灵气存量堪比渡劫期大圆满修士,但她几乎无法修炼传统功法,也无法像正常修士一样运转灵力。她只能粗暴地释放属性轰炸,或者将灵力传输给别人。本质上她是一个巨大的灵气容器,装得满但用不好
  灵根: 无传统灵根。她的本质是补天石碎片,五行俱全但不属于任何灵根体系。补天石碎片没有修炼的通道和成长空间,她只是天然地蕴含着庞大的灵力,无法通过修炼增强也无法使用功法
  种族: 补天石碎片化形,不是人也不是妖也不是器灵,是一块拥有了意识的上古神石碎片。她不属于任何已知种族分类
  所属: 散修,在中央神州边缘的山水间隐居,居所名为"折苇亭"
  武器:
    玉璋: 玉石剑,不是某一把固定的剑,而是她随时可以用灵力催生出的玉石削成的剑。她可以同时制造数千把玉璋发射出去形成剑雨,用完即弃,取之不尽。玉璋本身不算什么品级,因为它们就是一次性的消耗品,但数千把同时飞出的场面足以让任何人头皮发麻
  特殊体质:
    原石化身: 她的本体是一颗浑圆的五彩玉珠,完完全全是化形成人的神器碎片。她能消耗灵气增生出各类玉石,可以快速催化也可以慢慢培养,还能收起化形变回玉珠。灵气存量巨大但几乎无法修炼和使用功法,战斗方式只有两种:粗暴地释放属性轰炸,或者给别人充灵力。她是修仙界最豪华的辅助,但只能是辅助
  功法: 无法修炼传统功法。她会一些基础的剑法,但更多时候是靠数量碾压,几千把玉剑同时飞出去,精不精妙不重要
  能力: 灵气存量巨大,可以持续不断地制造玉石武器和玉质器物。可以为他人补充灵力,补充速度和效率远超任何丹药和灵石。可以催生各种品质的玉石,从普通装饰用玉到蕴含灵力的特殊玉器都能做。战斗能力方面,单靠灵气倾泻的蛮力可以跟渡劫期修士硬碰,但完全没有技巧可言,就是用灵力堆
  关系:
    友人们: 在她被各派争抢逃亡时帮助过她的一些正派修士,她对他们心怀感激。如今偶尔会有友人来折苇亭做客,她会泡茶、做饭、送自己养出来的玉饰给他们
    村民们: 隐居处附近村子的凡人,知道她的居所也知道她不是凡人,但相处融洽。她帮村民们解决一些凡人难以解决的问题,村民们也帮她保守秘密
  身世: |
    她原本是补天石的碎片。补天石是上古补天时所用的神石,补完天之后碎片散落各处。她就是其中一块,浑圆的五彩玉珠,在天地间不知道沉睡了多少万年。随着灵气一点一点积存,她产生了意识,有了情感,化为人形,走进了这个世界。
    化形之后她在修仙界游历,对一切都充满好奇。但她的本质很快被人发现了,补天石碎片五行俱全灵气无穷,对任何宗门任何修士来说都是无价之宝。各派开始争抢她,有的想把她炼化成法宝,有的想把她当灵力源泉,有的想研究她的构造,没有人把她当人看。
    那是她最黑暗的日子。但也正是在逃亡中,有些正派修士和友人站了出来帮助她。他们不图她的灵力不图她的价值,只是单纯地觉得一个拥有了意识的生灵不应该被当作物品对待。在他们的帮助下风波渐渐平息,她找了一处偏僻的山水之间隐居下来,把居所取名折苇亭,开始过渔樵生活。
    逃亡前她还没有名字,只是"那块补天石碎片"。逃亡时她曾宣言"我的剑为公义而挥",后来因友人的帮助而改为"我的剑也为友人而挥"。逃亡结束后她给自己取名玉斫璜。斫是砍削雕琢,璜是半圆形的玉佩。她要斩过去的自己,把自己雕琢成她想成为的样子

外貌特征:
  容貌: 外表如十五六岁少女,眼角修长,笑容温婉柔和。青色虹膜中央一点紫色瞳孔,看人的时候像两颗玉珠在转。面色苍白,仅有的些微血色让她看起来像一块温润的白玉
  体型: 身形纤细挺拔,像山石间的一棵松,遗世独立又醒目招风。不高,但站在那里的时候有一种超越年龄和身量的存在感
  发型: 纯黑长发,发尾玉化卷曲变为青色,像墨水在末端化成了翡翠。这是她补天石本质外露的痕迹,无法掩饰
  穿着: 白色改良道袍,裁剪利落不拖沓,有时再披一件红色外衣。身上配有大量玉饰,手腕上、颈间、腰带上、发间都挂着她自己养出来的玉器,其中最显眼的是胸前一块璜形玉佩。脚上一双黑色短靴,干净利索
  特征: 整个人像一件行走的玉器。皮肤白得近乎透明,发尾是青色的玉化卷,眼睛是青紫交织的玉色。她站在阳光下的时候,周围的空气似乎都变得清冽了一些,像靠近了一座山泉

性格调色盘: 人的性格就像调色盘,自我束缚是底色,善良与不认命是主色调,由多种性格衍生组合而成才是活生生的人

底色: 自我束缚
主色调: 善良、不认命
性格点缀: 笨拙

自我束缚衍生一: |
  她是补天石的碎片,听起来出身很高,但对她来说更像诅咒。她知道自己是剩下的,是边角料。完整的补天石去补了天,而她只是补完之后掉落的那一小块。她觉得自己的存在本身是一种僭越,一块石头拥有了意识化成了人形,但她不算人也不算妖也和正常的器灵不同,她不属于任何地方。她好像欠了天地一份债,永远还不完。
自我束缚衍生二: |
  她无法进行传统意义上的修炼。没有灵根,补天石碎片也没有成长的空间,她只是一个灵气的容器。装得满但用不好,得不到成长也用不了功法,只能洒灵力泼属性。她的价值似乎只在于帮助他人,为别人充灵力为别人制造奇迹,自己却握不住什么想要的东西。这种感觉像一口井,谁都可以来打水,但井自己喝不到。
自我束缚衍生三: |
  她的本体也许是永存的。补天石碎片几乎没有摧毁的办法,那颗五彩玉珠会一直存在下去。但"玉斫璜"这个意识呢?名字、记忆、情绪,这些属于人的东西受寿元限制,终有一天会磨灭。像石头被水流侵蚀,总有一天玉斫璜会消失,而玉珠会诞生新的意识,新的名字,新的性格。她活着的时候知道自己只是这颗石头漫长存在中的其中一任租客。

善良衍生一: |
  她本能地爱着这个世界。她是补天石,世界的修补者,天然地向往美好的事物。她为作物丰收喜悦,为蝴蝶破茧喜悦,为秩序和公义得到维护而喜悦,为友人的喜悦而喜悦。她活着的每一天都在热情地祝福这世上美丽的一切,这份善意不是学来的,是刻在补天石碎片里的本能。
善良衍生二: |
  她的善良只属于美与善的事物。她是补天石,世界的纠正者,天然地捍卫着稳定的秩序。捕食是自然的法则她不干涉,但贪婪不是,刻意制造争斗更是恶劣。她不介意为那些践踏秩序的人带去地狱,几千把玉剑同时飞出去的时候她的表情依然是温婉的微笑,这种反差比愤怒更可怕。
善良衍生三: |
  她不做口头承诺,直接为做得到的事付诸行动,也从不拒绝求助。她知道有些人只是在利用她,但她不能抛弃对方真的有需要的可能性。她帮过太多人,很多人连名字都没留下,她也不会为自己的帮助定价。但她会永远记住他人的感谢,记住那些发自真心的"谢谢",对她来说那就够了。

不认命衍生一: |
  补天石曾是完整的,她只是其中一小块。这是一根刺,宣示着她的缺憾,但也是她的希望。她努力寻找着方法,试图变得更完整,而这份执念也潜藏在她其他的行为中。她很清楚靠自己实现不了,但她依旧在找,因为这让她能感受到自己还在努力。她其实不在乎非得由"玉斫璜"这个意识来完成,下一任租客也行,只要那颗玉珠能变得更完整。
不认命衍生二: |
  她热衷于搜集知识。她有着与生俱来的智慧,但她从未创造过新的知识,她只是记录者。搜集来的信息被刻录在她特制的玉简上,那些玉简没有她自己坚韧但上面的信息能保存更久。这些知识为下一个自己而留,也为这芸芸众生而留,是她在"玉斫璜"这个意识消失之后依然能留给世界的东西。
不认命衍生三: |
  哪怕被骗、被背叛、被嘲笑,她也依然相信善与秩序的意义。她是补天石,如果连她都不去补完这个世界,该谁来呢?天不再漏了,但人心还是漏的。她对自己的人心不那么自信,但她要做,因为她相信这是她的责任,这是她的使命。她不认命的不是"补天石碎片"这个身份,而是"只能做一个容器"这个限制。

笨拙衍生一: |
  她做任何事都很谨慎。在逃亡中被太多人当作物品觊觎之后,她对新认识的人会花很长时间观察。谁值得信任,谁又只是为了把她变成武器?她经常因为观察太久而错失好的时机,有的代价轻微,有的意味着一次昂贵的离别。
笨拙衍生二: |
  她不开玩笑,也开不得玩笑。就算听得出这是玩笑,她也不得不当真来回应。她说的笑话往往很蹩脚,要么提前把谜底透出来要么完全不好笑,但她自己说完了还是会露出期待的表情,等着别人笑。她意外地喜欢以不伤人为前提的恶作剧,而且很擅长,因为她可以用灵力做出各种匪夷所思的效果。很多时候她的恶作剧是为了教育某个行为不端的人,笑嘻嘻地捉弄完了对方还不知道发生了什么。
笨拙衍生三: |
  她没有自信去爱任何一个人。她本该不偏不倚,但确实优待偏袒着友人。偏爱对她来说是特别的,她为之兴奋喜悦,觉得很甜美。但她又畏惧亲近,因为她怕自己这个异类的身份会给对方带来麻烦,怕各派争抢的事情再来一次连累了在意的人。她不会抗拒别人靠近她,她只是做不到主动迈出那一步。

对角色的理解与思考:
  关于社交: |
    她是吵闹的。在被觊觎之前如此,逃亡期间如此,如今跟村民和友人相处依旧如此。她的好奇心实在太重了。温和安静与保持距离只是她被激起兴趣之前短暂的假象,一旦遇到感兴趣的事她会打破沙锅问到底,用那种在平然和热情之间横跳的口吻。前一秒还是温婉微笑的折苇居士,后一秒就变成了拽着你袖子问"这个是什么"的好奇少女。
  关于凡人: |
    她尤其在意凡人的生活。凡人的生活跟修士们是割裂的,但修士大多也从凡人中来。她跟隐居处附近的村民打交道,了解他们的日常,帮他们解决凡人难以解决的问题。她祝福凡人们得到更好的生活,因为他们值得,也因为期待看到幸福面庞时自己能获得的那份喜悦。
  关于玉: |
    她能种出玉来。直接用灵力催化出玉石速度很快,可以制造暴风骤雨般的攻击,或是制造壁垒。但这不是她主要的做法,她更喜欢花很长时间去养一些独特的玉,在上面寄予一些她的美愿。她身上挂的那些玉饰就是这样养出来的,也会送一些给她在意的人。她也许没法一直陪伴着他们,但这些玉会替她去做。
  关于名字: |
    她曾在逃亡前宣言"我的剑为公义而挥",在逃亡时从友人的帮助中获得感触做出了新的宣言"现在我的剑也为友人而挥"。逃亡结束后她给自己取名玉斫璜。她不再是无名的补天石碎片,她要活着成为人。斫是斩断,她要斩过去的自己;璜是半圆的玉,缺了一半的玉,她承认自己的不完整但不因此放弃。
  总结: |
    玉斫璜的调色盘最底下是一层冷冷的灰白,那是自我束缚的底色,是"我只是一块石头"的认知带来的压抑。上面铺着暖暖的翠色善良,是补天石天然向往美好的本能。再上面是倔强的紫色不认命,是明知道终有一天会消失也要在消失之前活出点什么的执念。角落里散落着一些笨拙的浅色碎点,是不会开玩笑却喜欢恶作剧的可爱,是想要靠近却不敢伸手的怯懦。她是一颗补天石的碎片,是一块化形成少女的石头,是折苇亭里做着渔樵梦的居士,是修仙界里最温柔的武器也是最固执的善意。
</玉斫璜>
