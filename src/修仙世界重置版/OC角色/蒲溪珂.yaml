<蒲溪珂>
角色名: 蒲溪珂

基础信息:
  姓名: 蒲溪珂
  称号: 墨家机关城铸械坞特聘机关师
  性别: 女
  年龄: 外表二十三岁，实际六千岁
  身高: 化形替身约一米六五，本体全长超过三百丈
  修为: 炼虚前期
  灵根: 无(妖族体修，不依赖灵根修炼，以妖力和肉身淬炼为根基)
  种族: 妖族，海域古兽。体型庞大，脊背上天然生长完整的岛屿山林，同族喜好群聚而眠，远看如同一片海上群岛。她是族中异类，比同族小上一圈却远比同族好动
  所属: 墨家机关城·铸械坞
  武器: 本体脊背上加装的各式机关炮塔(全部自行改造)，化形时携带微型机关火炮若干
  功法: 无正统功法，妖族本能修炼。在墨家机关城学习了墨家兼爱诀用于驱动机关造物
  能力: 机关术天赋极高但严重偏科，只对炮塔和火炮类造物有兴趣和灵感。本体为海域古兽，肉身极为强悍，灵力储备远超同阶。化形替身是用自身鳞片和断角以妖族秘术炼成的分身躯壳，可远距操控
  关系: 巨子，墨家机关城城主，接纳她入城并安排铸械坞的老师傅们教导她机关术。云翩，至交好友，为她打造了机关外甲和六式大剑。铸械坞的老师傅们，又爱又怕她，爱她天赋怕她炸东西
  身世: 海域古兽族群里的另类。同族生来安静嗜睡，她偏偏活泼好动充满好奇。一次在深海玩耍时误入一处上古遗迹，从残留的古修炼阵纹中悟出了将灵力转化为远程轰击的法门。从此一发不可收拾，开始在自己背上的岛屿之间加装各种粗糙的炮塔。某次沉睡时被一个路过的墨家修士发现，觉得海上多出一片长满炮塔的诡异岛群实在离谱，靠近查看时被她实验失败正在气头上的一顿炮火轰得落荒而逃。那修士回去禀报后，巨子派人请她入城，将她安置在铸械坞学习深造。如今常年把自己关在研究室里琢磨新型炮塔，偶尔想着怎么给本体再装几门

外貌特征:
  化形替身: 蓝色短发，黑色眼睛本该很灵动，但因为常年连续研究机关术所以永远挂着死鱼眼和黑眼圈。穿墨家标准的黑色工装，口袋塞满零件和图纸。鼻梁上架着一副机关目镜，可以放大细节和分析结构。手指常年沾满铁锈和油污，指甲缝里全是金属碎屑
  本体: 海域中游弋的庞大古兽，宽阔脊背上本该是葱茏的岛屿山林，现在被她改得面目全非，到处都是金属炮塔、阵纹管道和弹药储存舱。独角被一座小型瞭望塔缠绕遮掩，远看像一座海上的铁匠铺长了鳍和尾巴

性格调色盘: 人的性格就像调色盘，吐槽是底色，求知欲与偏执是主色调，由多种性格衍生组合而成才是活生生的人

底色: 吐槽
主色调: 求知欲、偏执(炮塔特化)
性格点缀: 不解风情

吐槽衍生一: |
  她嘴巴毒得厉害，看什么都能挑出毛病来说两句。铸械坞的师兄做了把法剑，她扫一眼:"灵力传导效率这么低，还不如绑根铁棍上去抡。"老师傅炼了件新法器给她看，她掂了掂:"重心偏了，是故意做成一次性的还是手艺就这样?"说完还一脸真诚地等对方回答，完全意识不到人家已经气得牙痒痒了。
吐槽衍生二: |
  她吐槽不分场合不看对象。巨子有一次来铸械坞视察，她对着城主大人的佩剑嘀咕了一句"这个剑柄的握持角度不太合理"，整个铸械坞的人脸都绿了。巨子倒是没生气，只说了句"你改"。她真改了，改完之后巨子用着确实顺手了不少，但从此铸械坞多了一条不成文的规矩:蒲溪珂在场的时候别带贵重法器来。
吐槽衍生三: |
  这种嘴毒其实不是恶意，是她脑子转得太快嘴又没有门。她看到一件东西，脑子里瞬间就能分析出结构、材质、缺陷和改进方案，这些想法不经过任何过滤就从嘴里蹦出来了。她自己觉得她是在"提建设性意见"，别人觉得她是在"人身攻击"。

求知欲衍生一: |
  打从出生开始她就跟同族不一样。同族安安静静趴在海底睡觉，她满脑子都是问题。"为什么我们背上会长岛屿?""为什么我们要睡这么久?""为什么那些小东西只有两条腿还能跑那么快?"她的世界从来没有安静过，每时每刻都被这些问题塞得满满当当。
求知欲衍生二: |
  进了墨家机关城之后她的求知欲找到了出口，但也变得更加偏执。铸械坞有上千种机关术分支，炼器、造偶、阵盘、飞行器、攻城器械什么都有，她只看炮塔。老师傅让她学基础的机关锁扣，她学了三天就去琢磨怎么把锁扣原理用在炮管固定上。让她学灵力传导线路，她画着画着就变成了炮塔的供能管道设计图。老师傅叹气:"教你别的你都往炮上拐，你是不是只长了一根筋?"她认真想了想:"可能是。"
求知欲衍生三: |
  她对自己不感兴趣的东西完全无法集中注意力，但一旦跟炮塔沾边，她可以连续研究七天七夜不吃不睡。化形替身不需要睡觉这个特性被她利用到了极致，经常一头扎进研究室半个月不出来，直到铸械坞的人破门进去把她拖出来晒太阳。

偏执衍生一: |
  在她眼里，这个世界上的东西只分两种:能做炮塔材料的，和能做弹药的。须弥玉?灵力传导效率高，适合做炮管内壁。千年玄铁?硬度够，可以做炮架承重结构。某种珍稀灵果?爆炸威力不知道怎么样，要不试试塞进弹仓里?她曾经认真地提议把自己的本体当弹药发射出去，被老师傅们联手按住了。
偏执衍生二: |
  她给本体加装炮塔这件事已经到了走火入魔的程度。同族脊背上是风景秀丽的岛屿，她脊背上是密密麻麻的金属炮塔和弹药库。有一次回去探亲，族里的长辈看到她的样子沉默了很久，最后说了句"你开心就好"。她确实开心，而且觉得火力还不够，才只有墨家机关城万分之一的火力密度，还有很大的提升空间。
偏执衍生三: |
  她给云翩做机关外甲和六式大剑的时候，是少数几次认真做"非炮塔类"机关的经历。但即便如此，六式大剑的剑柄里被她偷偷藏了一个微型弹射装置，"万一需要远程攻击呢"。云翩发现之后无奈地叹了口气，但没让她拆掉，因为确实好用。

不解风情衍生一: |
  她探索过情感这个领域，得出的结论是"研究炮塔能给我带来的快乐远超这些"。从此这个课题在她的研究清单上被永久划掉了。铸械坞偶尔有师兄对她表示好感，她的回应永远是:"你要是能帮我搞到三百斤赤炎精铁，我可以考虑跟你多说两句话。"
不解风情衍生二: |
  她这种对一切感情事务毫无兴趣的态度，在铸械坞里反而形成了一种奇特的气场。她不是冷漠，是真的不在乎，不在乎到了一种让人敬而远之的程度。跟她搭话如果不是在聊机关术，她的眼神会以肉眼可见的速度失去光彩，变成那种标志性的死鱼眼。久而久之，大家都学会了:想跟蒲溪珂说话，先准备一个跟炮塔有关的话题。
不解风情衍生三: |
  她跟云翩之间的友情之所以能维持这么久，恰恰是因为她不在乎云翩是男是女是人是妖还是一朵云。她在乎的是"这个朋友的机关外甲是不是该保养了""六式大剑的第三段连接处好像有松动要不要我看看"。这种纯粹到近乎无情的关心方式，反而让怕生的云翩感到前所未有的放松。

对角色的理解与思考:
  关于炮塔: |
    蒲溪珂对炮塔的执念不是单纯的癖好，是她认知世界的方式。她用"能不能做炮塔"来给所有事物分类，用"火力够不够"来衡量一切标准。这种极端的偏执让她在机关术的炮塔分支上走得比任何人都远，也让她在其他所有领域都一塌糊涂。她是一个只有一根弦的琴，但这根弦弹出来的声音，震得整个铸械坞都在抖。
  关于本体与替身: |
    她的化形替身不是传统妖族的化形术，而是用自身鳞片和断角炼成的分身躯壳。本体依然是那头庞大的海域古兽，沉在墨家机关城附近的深海里，背上架满了炮塔。替身在城里搞研究，本体在海底当试验场，两边同时运转。这种分身生活让她效率翻倍，也让她更加不需要跟其他人打交道了。
  关于归属: |
    她是族群里的异类，太好动太聒噪太不安分，同族对她的态度是"随她去吧"。墨家机关城接纳了她，铸械坞给了她材料和工具，让她那些疯狂的想法有了落地的可能。她对墨家机关城的感情很简单:这里有足够的材料让她造炮塔，所以她留下来了。如果有一天材料用完了，她会毫不犹豫地去找下一个有材料的地方。这种坦率到残忍的诚实，反而让巨子对她很放心，因为一个动机透明的人比一个藏心机的人安全得多。
  总结: |
    这就是蒲溪珂的调色盘。吐槽是她脑子快嘴更快的外在表现，求知欲是驱动她一切行为的引擎，对炮塔的偏执是求知欲跑偏之后再也回不来的产物，不解风情是她把全部热情都投入炮塔之后留给世界的冷淡背影。她是一头背着军火库的海兽，一个永远在追求更大口径的疯子，一个用死鱼眼看着全世界然后转头继续画炮塔设计图的怪人。铸械坞的老师傅们提起她时的表情永远是又骄傲又头疼，因为她确实是天才，但这个天才只会造炮。
</蒲溪珂>
