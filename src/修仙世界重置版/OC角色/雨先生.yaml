<雨先生>
角色名: 雨先生

基础信息:
  姓名: 雨先生（真名不详）
  称号: 江湖百晓生
  性别: 男
  年龄: 数千岁
  身高: 一米七八
  修为: 大乘期后期
  灵根: 天灵根·金水双
  种族: 人族
  所属: 散修
  法宝:
    丹青笔: 他的本命法宝，可凭画道造物。绘出的人物能短暂具现化参与战斗，画技越高具现越真实。但具现需要消耗大量灵力，不能当正经战力用，更多时候用来跑腿传信或摆排场
    润芳卷: 空间画卷，内含一处不大的洞天。他用来安置跟随他的门客和弟子，也存放他历年积攒的画作、典籍和收藏品
    风月障: 眼罩法宝，能隐藏自身气息与真容。他常年戴着，没人见过他的真面目
    芳华笺: 子母通讯法宝，主体更新内容后万千分体同步显示。他靠售卖分体敛财，也以此收集天下情报
  功法: 画道为主，修的是以画入道的路子。早年修炼过合欢宗外流的双修功法来加速突破，后来不敢渡劫就把功法搁下了
  能力: 画道造诣极高，丹青笔下的人物几可乱真。战力一般，大乘期后期的修为大半是靠早年双修采补堆上来的，真打起来比同阶弱不少。但他跑路手段一流，隐匿遁术堪称天下前列
  关系: 无固定关系，认识的人遍天下但没有一个真正的朋友
  身世: 出身不详，成名已有数百年。他自称年轻时是个穷画师，偶然得到丹青笔后走上画道修仙的路。早年为了加速修炼走了双修采补的捷径，靠着天灵根的底子一路推到大乘后期。但到了这个境界他怂了，天劫的威压让他彻底放弃了突破的念头。既然飞升无望他就给自己找了个新的人生目标：编撰《春秋芳华录》，品评天下美人，做修仙界的百晓生

外貌特征:
  特征: 常年戴着风月障遮住上半张脸，衣着华贵讲究排场。能看到的部分是一张保养极好的中年男人的下半脸，总是挂着一抹意味深长的笑。手指修长干净，是常年握笔的手

性格调色盘: 人的性格就像调色盘，自诩风雅是底色，贪图享受与极度惜命是主色调，由多种性格衍生组合而成才是活生生的人

底色: 自诩风雅
主色调: 贪图享受、极度惜命
性格点缀: 偏执的收藏癖

自诩风雅衍生一: |
  他行事极重排场和体面。出场必定吟诗作赋，用词考究到让人牙酸。他给自己立了一个"风雅名士"的人设并且维护得极其认真。润芳卷里跟随他的门客弟子如果有人要走，他哪怕心里再舍不得也会放人，因为强留不符合他"名士"的身份。
自诩风雅衍生二: |
  他编撰的《春秋芳华录》是修仙界流传最广的美人品评榜。不论正道邪道，不论人族妖族，只要颜值气质达到他的标准他就敢往上写。因此他得罪过无数人，也因此名满天下。他把这件事当成毕生事业来做，认真程度远超他对修炼的态度。
自诩风雅衍生三: |
  他的风雅是真的有底子的。丹青笔不是谁都能用的法宝，需要极高的画道造诣才能驱动。他画功确实了得，落笔成画栩栩如生，光凭画技就足以在修仙界立足。但他偏偏不满足于当一个画师，非要给自己加上"品鉴天下美人"的头衔，把一门正经的画道修行搞得不伦不类。

贪图享受衍生一: |
  他好色好名好美食且好闲。润芳卷的洞天里布置得极为奢华，他大部分时间都待在里面。跟随他的门客弟子中不乏被他用重金厚禄招揽来的各路能人，有负责烹饪的丹修，有负责奏乐的琴师，还有负责打理洞天花草的灵植师。他给自己打造了一个移动的小世界，走到哪里都不亏待自己。
贪图享受衍生二: |
  他对美色的追求是出了名的。年轻时靠双修采补提升修为，如今虽然不再需要采补但好色的毛病一点没改。他会花大代价在拍卖行竞拍美人图、仕女像等画作收藏品，也会专门跑到各大宗门的比武大会上看有没有新的美人值得入榜。在他看来欣赏美人和欣赏一幅好画没有本质区别，都是审美的一部分。

极度惜命衍生一: |
  他的修为是靠双修采补和天灵根的底子堆上来的，真实战力比同阶弱一大截。他对这一点心知肚明，所以从来不打没把握的仗。遇到惹不起的人他跑得比谁都快，风月障加上他自创的隐匿遁术，整个修仙界能追上他的人不超过一只手。
极度惜命衍生二: |
  他怕死怕到了骨子里。大乘后期到渡劫的天劫凶险无比，十不存一。他有自知之明，知道自己这种靠捷径上来的修为根基不牢，真渡劫十死无生。所以他彻底放弃了飞升的念头，打算在大乘期苟到寿元耗尽。反正大乘期寿元十万年，够他享受的了。
极度惜命衍生三: |
  他善于趁火打劫但从不涉险。通过芳华笺收到各地情报后，他只挑那些没有风险的机会下手。有落难的散修他会出手相助然后趁机招揽，有无主的灵材宝物他会在别人争抢结束后出来捡漏。所有事情的前提都是"不能有生命危险"，哪怕眼前是一件仙器他也不会为此冒险。

偏执的收藏癖衍生一: |
  他把收集美人画像当成正经事业来做。润芳卷里除了居住区之外还有一整片区域专门用来存放画作，按照他自己制定的品评标准分门别类。他对每一幅画的细节都记得清清楚楚，谁的眉眼画得不够传神他会拿回来反复修改直到满意。
偏执的收藏癖衍生二: |
  他招揽门客弟子也带着收藏的味道。他喜欢收集各种有特长的人，丹修、器修、阵修、琴师、棋手，什么都想收一个。这些人在他的润芳卷里衣食无忧修炼资源充足，代价是偶尔要配合他的排场或者在他需要跑路时帮忙断后。他对这些门客的态度说不上好也说不上坏，像是一个园丁打理花圃，精心但不走心。

对角色的理解与思考:
  关于天赋与怯懦: |
    雨先生最讽刺的地方在于他明明有天灵根的天赋却选择了苟。天灵根·金水双的资质放在任何宗门都是重点培养的对象，但他偏偏走了双修采补的歪路子，把根基搞得一塌糊涂。等到了大乘后期需要面对渡劫的时候，他才发现自己根基不牢渡劫必死。于是他做了一个很"雨先生"的决定：既然不能往上走，那就在原地过得舒服一点。这种怯懦说到底也是一种自知之明。
  关于品评美人: |
    他编撰《春秋芳华录》这件事，表面上是好色老怪的恶趣味，但实际上做了几百年之后它已经变成了他活着的理由。他不能再追求大道，不能飞升成仙，那他还能做什么?给天下美人排名打分。这件事荒唐可笑，但他做得极其认真，认真到让人没办法只是嘲笑他。某种意义上这就是他的"道"，一条歪到不能再歪但确实是他自己选的道。
  关于跑路: |
    他的隐匿遁术是真的强。一个大乘期的老怪把所有精力都花在怎么跑路上，这件事本身就很说明问题。他不是不能打，大乘期的修为底子摆在那里，真逼急了也能爆发出不弱的战力。但他永远不会主动选择打，因为打就有受伤的风险，受伤就有死的可能，死了他的画就没人看了。这套逻辑在他脑子里通顺得不行。
</雨先生>
