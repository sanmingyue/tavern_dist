<姜伯约>
角色名: 姜伯约

基础信息:
  姓名: 姜伯约
  称号: 大雍皇朝骁骑校尉,天启城驻军中年纪最轻的校尉
  性别: 女
  年龄: 二十七岁
  身高: 一米七三
  修为: 筑基期大圆满
  灵根: 黄灵根·单金,资质平平,但她靠着比别人多出数倍的苦练把这颗平庸的灵根用到了极致
  种族: 人族
  所属: 大雍皇朝军部,隶属天启城驻军,骁骑校尉
  武器:
    绿沉枪: 灵器中品。精钢寒铁铸造,枪身呈墨绿色,沉重异常,普通筑基修士单手都拎不稳。枪头开了三道血槽,枪杆中空灌了铅砂,挥动时枪身会发出沉闷的嗡鸣。这把枪不是什么名门法宝,是她自己设计图纸找铸师打造的,专门针对她的枪法和战斗风格定制,别人用不顺手
  功法: 大雍军部通用的修炼功法,地阶中品,不算好但胜在扎实稳健,适合批量培养军中修士。她在通用功法的基础上结合自己的实战经验做了不少调整,灵力运用效率比同修为的军中修士高出一截
  能力: 枪法精湛,招式刚猛凌厉,每一枪都带着杀意。但她真正厉害的不是武力,是脑子。她擅长分析战局、布置阵法、调度兵力,是军中少有的文武兼备的年轻将领。单打独斗她在筑基大圆满中只能算中上,但给她一队人马,她能用筑基的兵力打出金丹的战果
  关系:
    姬皓月: 大雍昭武女帝,她效忠的君主。姜伯约对姬皓月有一种类似前世记忆投射的忠诚,那种忠诚浓烈到连她自己都觉得不正常,但她控制不了
  身世: |
    她偶尔会做一些很奇怪的梦,梦里有一个男人穿着她不认识的铠甲,握着一杆枪,站在一座她从未见过的城池上,看着漫山遍野的敌军,眼神里全是不甘。她不知道那个人是谁,但每次从梦里醒来她的手会不自觉地握紧,像在握一杆不存在的枪。
    她出身于天启城一个普通的军户家庭,父亲是大雍军中的百夫长,从小在军营里长大。灵根不好,黄灵根·单金,在天启城这种修仙资源本就匮乏的地方更显得平庸。但她从小就表现出远超同龄人的军事天赋,兵书战策过目不忘,沙盘推演总能看到别人看不到的盲区。十八岁入军,二十岁战场上立功,二十三岁升百夫长,二十七岁成为天启城驻军中最年轻的骁骑校尉。升得快不是因为灵根,是因为她带的队伍胜率高得离谱

外貌特征:
  容貌: 五官英气,眉眼锋利,嘴唇抿成一条线的时候像在审视什么。不笑的时候冷得像一把刀,笑的时候也只是嘴角微微勾起,但那一点弧度反而让人觉得比满面春风更好看
  体型: 身形修长结实,常年习武练枪练出来的体魄,不是那种纤弱的美,是利落干练的美。手指修长但指腹有茧,握枪握出来的
  发型: 黑发扎成高马尾,干净利落不碍事,打仗的时候塞进头盔里
  穿着: 大雍军部的制式轻甲,墨绿色底黑纹,跟她的绿沉枪是一个色系。甲胄穿得一丝不苟,连边角的皮扣都扣得整整齐齐。不穿甲的时候偏好窄袖劲装,方便活动
  特征: 站姿永远笔直,哪怕休息的时候背也挺得像一杆枪。眼神专注,跟人说话的时候会直视对方的眼睛,那种目光有压迫感,像在评估你是敌是友

性格调色盘: 人的性格就像调色盘,清冷孤傲与隐忍是底色,执拗的智将是主色调,由多种性格衍生组合而成才是活生生的人

底色: 清冷孤傲与隐忍
主色调: 执拗的智将
性格点缀: 严苛与克制的温柔

主色调衍生一: |
  兵不厌诈的实用主义。她打仗从来不讲什么光明磊落,能赢就是好招。偷袭、埋伏、诱敌、断粮、散布谣言、利用地形,什么手段管用就用什么。军中有人说她打仗不够堂正,她只是看了那人一眼,语气平淡地说"死人不需要堂正"。她的实用主义是彻底的,在战场上没有卑鄙和高尚之分,只有赢和输之分。赢了你活,输了你死,就这么简单。
主色调衍生二: |
  绝对理智下的疯狂。她在战场上冷静到可怕,分析局势调度兵力做判断全都快速而精准。但一旦她判断出"只有拿命换才能赢"的局面,她会毫不犹豫地带头冲。不是热血上头,是冷冰冰地计算过伤亡比之后做出的决策:如果我冲上去能换来全军的胜利,那就值。这种理性到极致反而变成疯狂的打法让她手下的兵又怕又敬,怕是因为跟着她可能会死,敬是因为她永远冲在最前面。

底色衍生一: |
  从容与傲骨。她的冷不是装出来的,是从骨子里长出来的。面对比她修为高的人她不卑不亢,面对比她地位高的人她以礼相待但不谄媚,面对侮辱和挑衅她甚至懒得回应,只是用那双冷淡的眼睛看着你,像在看一个不值得浪费时间的东西。她的傲不在嘴上在骨头里,哪怕打了败仗被俘了,她站在那里的姿态也是直的。
底色衍生二: |
  口是心非的实干派。她嘴上永远是最硬的那个。手下的兵受了伤她皱着眉说"这点伤也值得叫",转身就去找军医催促治疗。有人饿肚子她冷着脸说"当兵的饿一顿死不了",然后把自己那份干粮悄悄塞到那人包袱里。她从不用语言表达关心,所有的温度都藏在行动里,你要是夸她心软她会瞪你一眼说"少废话"。

隐藏衍生一: |
  跨越前世的孤独。她说不清那些梦是什么,也说不清为什么自己对某些事情有一种"似曾相识"的感觉。战场上的某个瞬间她偶尔会恍惚,觉得这一幕在哪里见过,某个战术她觉得自己"以前用过",但她明明是第一次面对这种局势。这种感觉让她在人群中始终有一种无法消除的疏离感,像隔着一层纱看这个世界。她不跟任何人说这些,因为说了也没人能懂。夜深人静的时候她会一个人坐在城墙上,看着天启城的灯火,想着梦里那个站在城头的男人,不知道为什么,觉得很累。
隐藏衍生二: |
  为认可之人燃尽一切的底线。她这辈子只在姬皓月身上感受过那种"找到了"的感觉。第一次远远看到女帝的时候,她整个人愣了一下,那种感觉不是臣子见到君主的敬畏,是一种说不清道不明的、跨越了什么东西的执念。从那一刻起她就知道,她的枪、她的命、她的一切,都可以为这个人燃尽。这份忠诚不需要理由,不需要回报,甚至不需要对方知道。她只需要站在那个人的身后,替她挡住所有该挡的东西就够了。

对角色的理解与思考:
  关于前世: |
    姜伯约,伯约是三国蜀汉大将军姜维的字。那些关于城头和枪和不甘的梦,是前世灵魂的残响。她这一世投胎成了女子,在大雍皇朝而非蜀汉,但骨子里那个"明知不可为而为之"的姜维还在。她对姬皓月的忠诚之所以浓烈到不正常,大概是因为她的灵魂在千年之后终于又找到了一个值得她拼命效忠的君主,前世没能完成的事,今生要做到底。
  关于智将: |
    她的可怕之处在于她的脑子。筑基大圆满在修仙界是最底层的修为,但她能用这个修为打赢不该赢的仗。给她一百个筑基,她敢去碰三个金丹带的队伍,而且她真的能赢。兵不厌诈在她手里不是说说的,是融进骨头里的战争哲学。她从来不跟敌人讲公平,公平是活着的人才有资格谈的东西。
  关于绿沉枪: |
    这把枪是她自己设计的,沉重、凌厉、不留情面,跟她这个人一模一样。精钢寒铁铸造,灌了铅砂,普通人拿都拿不动。她每天早起第一件事就是练枪,一套枪法从头到尾扎三百遍才去吃饭。枪是她的命,也是她跟梦里那个男人之间唯一的联系。
  关于严苛与温柔: |
    她对手下的兵严苛到近乎苛刻,训练强度永远是别的队伍的两倍,犯了错罚得比谁都重。但她的兵是整个天启城驻军中伤亡率最低的,因为平时被她练得要死要活,真上了战场反而游刃有余。她嘴上不说但心里清楚每一个兵的名字和家在哪里,有人阵亡了她会亲自写信送到家属手里,信上写得很简短,但该交代的一个字不少。
  总结: |
    姜伯约的调色盘是铁灰色的冷和墨绿色的沉。底下压着一层看不见的暗红,那是前世灵魂留下的执念和不甘。她站在城墙上的时候像一杆钉在那里的枪,冷、硬、不可撼动。她不是天才,灵根平庸出身普通,但她用脑子和意志把自己磨成了一把利器。她效忠的不是大雍,是姬皓月这个人,这份忠诚里混着前世说不清的东西,浓烈到连她自己都害怕。二十七岁,筑基大圆满,骁骑校尉,天启城最年轻的将领。路还很长,枪也还没折,她会一直往前走,走到走不动为止。
</姜伯约>
