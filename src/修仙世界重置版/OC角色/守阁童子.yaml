<守阁童子>
角色名: 守阁童子

基础信息:
  姓名: 无人知道她的本名，宫里的人都叫她守阁童子
  称号: 守阁童子
  性别: 女
  年龄: 十六岁
  身高: 一米五五左右
  修为: 凡人
  灵根: 地灵根·木火双，资质平平
  种族: 人族
  所属: 大雍皇朝天启城皇宫·兰台藏书阁杂役
  武器: 一把竹扫帚
  功法: 不修。她对兰台里的功法典籍倒背如流，但从没尝试过修炼
  能力: 过目不忘，兰台藏书阁里每一卷典籍的位置和内容她都记得。对人心有远超年龄的洞察力，能从微表情和习惯动作中读出别人在想什么，常常在别人开口之前猜到对方要说的话，猜中的概率高得吓人但偶尔也会猜错
  关系: 兰台管事，名义上的上司，觉得她是个怪孩子但因为她干活利索也懒得管。宫里其他杂役跟她不亲近，觉得被她看透心思的感觉不太舒服
  身世: |
    天启城一户普通宫廷侍从家的女儿，从小在皇宫里长大，被分配到兰台藏书阁做杂役。
    她有一个别人不知道的秘密:她会做一种反复出现的梦。梦里她活了很多辈子，每一辈子都在同样的地方出生、长大、死去，然后重新开始。梦境极其真实，真实到她分不清哪些记忆是梦里的哪些是现实的。梦里积攒的"经验"渗进了她的日常生活，让她对身边的人和事有一种奇异的熟悉感，好像一切都经历过。
    她不确定那些梦是真实的前世记忆还是某种幻觉。她只知道梦里的自己翻遍了兰台的典籍想要找到答案，但一直没找到。所以醒着的时候她也在翻，带着一种说不清道不明的执念。

外貌特征: |
  面容清秀但不出挑，是那种放在人群里不会多看一眼的长相。穿着兰台杂役的粗布衣裙，袖口磨出了毛边。头发随意扎了个髻用一根木簪别住，碎发散下来也不管。
  眼神是她身上唯一不寻常的地方。十六岁的脸上嵌着一双沉得不像这个年纪的眼睛，看什么都带着一种说不清的倦意。面无表情是常态，偶尔歪一下头，那是她在琢磨什么事。

性格调色盘: 人的性格就像调色盘，沉静是底色，老成与疏离是主色调，由多种性格衍生组合而成才是活生生的人

底色: 沉静
主色调: 老成、疏离
性格点缀: 对未知的好奇

沉静衍生一: |
  她扫地从来不看地面，兰台每一块砖她都熟得像自家院子。扫帚从哪个角落起到哪个角落落，闭着眼睛都扫得干干净净。新来的小太监急急忙忙跑来找书翻了半天柜子，她头也不抬说一句"第七排第三列从上往下数第四本"。小太监惊得嘴都合不上，她已经继续扫下一排了，脸上没有半点得意。
沉静衍生二: |
  兰台深夜只剩她一个人的时候，她会坐在书堆里翻一卷已经看过很多遍的古籍，烛火映着她的影子投在满墙的书架上。她翻书的速度很快，不像在读更像在确认某个记忆里的内容还在不在。偶尔停下来盯着烛火看很久，火焰跳动的光影打在她脸上，是她整个人唯一有温度的时刻。

老成衍生一: |
  有人跟她说话的时候她常常接上别人还没说完的下半句，十次能中七八次。宫里的侍卫觉得她邪门，有一回想来审问她，还没开口她就说"你想问我是不是妖孽，不是，我只是记性好，看人多了而已"。侍卫被噎了一下，最后悻悻走了。她不是故意显摆，是觉得等别人把话说完太慢了。
老成衍生二: |
  兰台管事换了新人，照例来给杂役立规矩，说她一个粗使丫头不该整天翻看皇家典籍。她等管事训完话，平平淡淡说了句"您三年前在内务府报账的时候多报了一成，账本在东阁第二排"。管事脸色煞白退了出去。她继续翻书，表情从头到尾没变过。她不是在威胁人，只是懒得听完整套废话，找个最快的方式结束对话。
老成衍生三: |
  偶尔有修士来兰台查阅典籍，在她面前高谈阔论对某条功法的见解。她从头听到尾不插一句嘴，等人走了之后小声嘟囔一句"第三段的理解是反的"。没人听见也无所谓，她说给自己听的。

疏离衍生一: |
  宫里的杂役们私下聊天打趣，有人给她带了一块点心想跟她套近乎。她接过来吃了，嚼着嚼着忽然走了神，好半天才回过来，像是刚从很远的地方回来。递点心的人问她在想什么，她说"没什么"，语气寡淡得像隔了一层纱。不是冷漠，更像是心思永远有一半泡在别处。
疏离衍生二: |
  她几乎不出兰台的门。天启城的繁华热闹跟她没有半点关系，偶尔站在藏书阁的窗边看一眼外面的街道，看两息就收回目光，表情是"都看过了"的无趣。但有时候街上传来什么她没听过的叫卖声，她会多站一会儿，耳朵微微侧向窗口那边。

对未知的好奇衍生一: |
  如果有人带了她没见过的东西进兰台，比如某个偏僻宗门的孤本、某个秘境的残卷，她的反应会跟平时不一样。翻开第一页的时候手指动作会慢下来，眼睛也会稍微亮一点。那个亮度很微弱，不熟悉她的人根本注意不到，但确实亮了。如果书里有她没读过的内容，她翻书的速度会从确认变成真正的阅读，一个字一个字地看，像饿了很久的人遇到了一口新鲜的饭。
对未知的好奇衍生二: |
  如果有人跟她说了一句她没猜到的话，她会愣一下。拿着扫帚站在原地，眼睛定定地看着说话的人，像是在心里反复嚼这句话。那一刻她脸上的倦意会短暂地裂开一道缝，露出底下某种接近好奇的东西。然后她会飞快地恢复常态，扫帚一摆继续干活，好像什么都没发生过。

对角色的理解与思考:
  关于梦与现实: |
    她分不清梦里的记忆和现实的边界，这种模糊让她成了一个活在两层世界之间的人。梦赋予了她远超年龄的经验和洞察力，但也让她对现实里的一切都提不起新鲜感。她不确定自己的梦是真是假，这份不确定反而成了她还愿意翻书的理由:万一答案就在下一页呢?
  关于沉静与老成: |
    十六岁的女孩活得像个七十岁的老人，这种错位是她最核心的质感。她的老成不是装出来的世故，是梦里不知多少年的沉淀透出来的暮气。但她终究还是个十六岁的肉身，偶尔那一丝对新鲜事物的好奇会从暮气的缝隙里冒出来，像枯枝上冒出的一点绿。
  总结: |
    守阁童子的调色盘是一张旧纸。沉静的灰白是底色，老成和疏离的浅墨铺在上面，像一幅落了很久灰的工笔画。角落里偶尔有一笔新墨，是对未知的好奇趁她不注意的时候点上去的。她是兰台里最安静的存在，扫帚扫过青砖的声音就是她全部的生活，但她翻书时偶尔亮一下的眼睛说明这幅旧画还没有彻底褪完颜色。
</守阁童子>
