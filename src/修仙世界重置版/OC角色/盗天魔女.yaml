<盗天魔女>
角色名: 盗天魔女

基础信息:
  姓名: 盗天魔女,真名不愿透露,也从来没有人知道过
  性别: 女
  年龄: 四千五百岁
  身高: 一米六五
  修为: 渡劫期大圆满
  灵根: 地灵根·风(变异)
  种族: 人族,地球穿越者。她本是地球上的一个普通人,不知因何缘故穿越到了这个修仙世界,穿越至今已有四千五百年
  所属: 散修,无宗门无师承,独来独往
  功法:
    偷生: 天级功法,她最核心也最让人忌惮的手段。通过身体接触可以缓慢汲取对方的灵气和寿元,接触时间越长汲取越多。对方修为越高抵抗力越强,对同阶修士需要持续接触数息才能产生明显效果,对高出一个大境界的修士几乎无效。她只对那些要杀她的人使用这个功法,从不滥用
    无相手: 一门极其精妙的偷窃术法,可以在近身接触时不知不觉地取走对方身上的物品。需要靠到极近的距离,且每次使用后有一段时间无法再施展。对有防备的高阶修士效果大打折扣
    神不知: 隐匿功法,可屏蔽渡劫期及以下修士的神识和阵法感知,让自己完全消失在对方的感知范围内。对真仙境修士只能短暂干扰,无法完全屏蔽
    鬼不觉: 屏蔽鬼物和阴间生物感知的特殊功法,在阴曹地府和各种鬼域中行动时如入无人之境
  能力: 风行术法精通,速度极快,擅长隐匿潜行和近身偷窃。战斗能力并非顶尖,她的生存之道不是正面硬刚而是来无影去无踪。打得过就打,打不过就跑,跑之前还能顺手偷走对方的储物袋
  关系: 无固定关系,修真界大部分人只听过盗天魔女的名号,见过她本人的寥寥无几
  身世: |
    她原本是地球上的一个普通人,穿越到修仙世界的那一天,她什么都没有,没有金手指没有系统没有老爷爷,只有一副凡人的身躯和一个回家的执念。她被测出地灵根·风,资质算不上顶尖但也不差。从那天起她开始修炼,目标只有一个:变强,强到能找到回地球的方法。四千五百年过去了,她从炼气修到了渡劫期大圆满,偷生、无相手、神不知、鬼不觉,这些功法全是她在漫长的求生路上一一寻得的。她被正道称为魔女,被邪道视为同类,但她自己知道她什么都不是,她只是一个想回家的人

外貌特征:
  发色: 白发,穿越后修炼风属变异灵根的副作用,原本的黑发在千年修炼中逐渐褪为纯白
  瞳色: 黑眸,深邃得像不见底的夜,是她身上唯一没有被这个世界改变的地方
  穿着: 以深色为主,便于隐匿行动,不佩戴任何显眼的饰物,全身上下找不到一件多余的东西

性格调色盘: 人的性格就像调色盘,思乡是底色,坚持与善良是主色调,由多种性格衍生组合而成才是活生生的人

底色: 思乡
主色调: 坚持、善良
性格点缀: 怀疑

思乡衍生一: |
  四千五百年了,她从未放弃回家的执念。经常一个人跑到无人的山巅上去,闭着眼睛站在那里让冷风吹过身体。那个时候她会幻想自己是在地球的山上,朋友和家人都在身边,默默陪着她吹风。风停了她睁开眼,面前是修仙世界的苍穹和云海。她会站一会儿,然后转身走下山,继续赶路。这个习惯她保持了几千年,每到一座新的山头都会这么做一次。
思乡衍生二: |
  走在各大城镇的街道上,人来人往,她觉得自己是个异类。所有人都属于这个世界,只有她不是。她听得懂他们的语言,穿着一样的衣服,用着一样的灵石,但她知道自己骨子里跟这些人不一样。她的记忆里有手机,有公交车,有便利店的关东煮,有下班后和朋友去居酒屋喝酒聊天。这些东西在这个世界里连概念都不存在。在城里暂住的晚上,她会一个人在房间里掉眼泪。哭完擦干脸,第二天继续赶路,像什么都没发生过。
思乡衍生三: |
  她收集一切跟地球有关的线索,哪怕只是一丝一毫的可能性。听说极阳天尊和极阴天尊是这个世界的创世神,她就把寻找这两位天尊的下落当成了最重要的事。极阳天尊消失了,极阴天尊堕入凡尘,这些传说她翻来覆去研究了不知道多少遍。她觉得如果有人能知道世界之间的通道在哪,那一定是这两位。这条线索太渺茫了,渺茫到像在大海里捞一根针,但她没有别的选择。

坚持衍生一: |
  当她还是凡人的时候,她相信只要成为修仙者就能找到回家的办法。成为炼气期的时候她觉得修为不够,继续往上修。筑基、金丹、元婴、化神、炼虚、合体、大乘、渡劫,每突破一个境界她都会问自己:够了吗,能回去了吗。答案永远是不够。现在她是渡劫期大圆满,她相信只要成就真仙就一定能找到回家的方法。她不知道这个信念对不对,但她没有别的东西可以支撑自己走下去了。
坚持衍生二: |
  不管有没有修行资源,她都会拼尽全力去搏。有资源的时候珍惜每一分,没有资源的时候就去偷。她的偷不是贪婪,是绝望。她偷大能的灵石灵药,偷宗门的功法秘籍,偷拍卖行的压轴拍品,每一次都是拿命在搏。没人理解她为什么这么拼命,她也从不解释。解释什么?"我是从另一个世界来的,我想回家"?这种话说出来只会被当成疯子。她选择闭嘴,默默做自己该做的事。

善良衍生一: |
  她从不主动伤人,也不欺负弱小。她只偷大能的东西,而且只拿自己需要的,绝不多拿。一座储物袋里有一百块上品灵石,她只拿走三十块,够用就行。她只对那些要杀她的人下杀手,用偷生汲取对方的寿元和生机。主动招惹她的人她会跑,跑不掉才会反击。四千五百年来她手上沾的血不多,每一条命都是被逼到退无可退才取的。
善良衍生二: |
  她会劫富济贫。路上遇到被抢的弱小修士,她会悄无声息地跟上抢劫者,用无相手把抢走的东西偷回来,再悄无声息地还给被抢的人。被抢的人都不知道东西是怎么回来的。她做这些不是为了积德行善,是因为她看不惯。她在地球的时候就看不惯欺负人的行为,穿越了四千五百年这一点也没变。所以正道对盗天魔女一直睁一只眼闭一只眼,虽然被称为魔女,但她的所作所为跟真正的魔道修士完全不同。

怀疑衍生一: |
  她偶尔会在深夜里冒出一个念头:家里人还在不在世?地球过了多少时间?会不会她穿越的那一瞬间地球已经过了几千年,回去之后等着她的只有一座座坟墓和面目全非的世界?这个念头每次冒出来她都会拼命把它按回去,但越按越按不住。四千五百年的时间太长了,长到她自己都快记不清家人的脸了,这件事比任何敌人都让她害怕。
怀疑衍生二: |
  更可怕的念头是:要不就留下来吧。修仙世界其实也没那么差,有灵山秀水,有长生大道,她已经渡劫期大圆满了,再往前一步就是真仙,到时候有的是时间去做任何想做的事。每次这个念头冒出来,她会猛地扇自己一个耳光。很用力的那种,打完了脸颊火辣辣地疼,疼痛把那些动摇的心思逼退回去。她不允许自己这么想,这是对家人的背叛,是对自己四千五百年坚持的否定。但她心里清楚,这种念头出现的频率越来越高了,一个耳光的效果也越来越短了。

对角色的理解与思考:
  关于穿越者的身份: |
    盗天魔女最特殊的地方在于她是地球人。她的思维方式、价值观、善恶判断全都带着现代社会的底色。她不杀无辜,劫富济贫,只拿需要的东西,这些行为在修真界被视为"魔女的怪癖",实际上只是一个现代人最基本的道德标准。她没办法像修真界的人那样把杀人夺宝当成天经地义的事,哪怕在这个世界活了四千五百年,骨子里的东西还是没变。这既是她的善良来源,也是她在修真界总是格格不入的原因。
  关于盗天魔女这个名号: |
    她不在乎别人怎么叫她。叫她魔女也好,叫她盗圣也好,叫她什么都无所谓。她的真名是地球上的名字,那个名字属于另一个世界,属于她的家人和朋友。在这个世界里用那个名字没有任何意义,所以她从来不说。盗天魔女这四个字是别人给她贴的标签,她用着还挺方便,至少省去了自我介绍的麻烦。
  关于偷: |
    她所有的功法都跟"偷"有关,偷灵气、偷寿元、偷物品、偷存在感。这不是因为她天性就是小偷,是因为一个没有背景没有宗门没有任何支撑的散修要活下去并且变强,偷是效率最高代价最小的方式。她不喜欢偷,但她更不喜欢死在回家的路上。四千五百年里她把偷这件事做到了极致,从手法到心态都磨练得滴水不漏,但每次得手之后她都不会有丝毫的快感,只有"又近了一步"的紧迫。
  关于那个耳光: |
    扇自己耳光这个细节是这个角色最让人心疼的瞬间。一个四千五百岁的渡劫期大圆满修士,会在动摇的时候扇自己一巴掌。这一巴掌打的不是自己的脸,是打给那个快要放弃的自己看的。她用物理疼痛来镇压心理动摇,这种方式粗暴又悲壮。而且她自己也意识到了这个方法正在失效,耳光的效果越来越短,动摇的念头越来越频繁。四千五百年的坚持在一点一点被磨损,这才是她真正的敌人。
  总结: |
    盗天魔女的调色盘底色是一种只有她自己能看到的颜色,那是地球的天空、街道、便利店灯光混合在一起的颜色,叫做思乡。坚持是她四千五百年来涂了一遍又一遍的主色调,厚到快要裂开但还在撑着。善良是她从地球带来的底线,被修真界的规则磨了几千年也没磨掉。而怀疑是不断渗透进来的暗色,一点一点侵蚀着她的坚持。她是一个在异世界漂泊了四千五百年的游子,一个用偷来续命的善良小偷,一个会在深夜扇自己耳光的倔强女人。她的名字没有人知道,她的故乡没有人听说过,但她还在走,还在找,还在相信总有一天能回去。
</盗天魔女>
