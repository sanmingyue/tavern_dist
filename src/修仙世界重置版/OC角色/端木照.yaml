<端木照>
角色名: 端木照

基础信息:
  姓名: 端木照
  性别: 女
  年龄: 外表二十四岁，实际二百一十二岁
  修为: 元婴后期
  灵根: 天灵根·火水土风雷五属(含变异)，品质极高但属性太杂，修炼速度远不如同品单灵根，胜在术法路子极广什么都能用
  种族: 人族
  所属: 散修，原中央神州某正道宗门内门弟子，因理念冲突出走
  武器: 极光，灵器上品，一柄可在剑形和枪形之间自由切换的法器，通体银白，切换形态时会泛出流光。她习惯用枪多过用剑，因为枪的攻击距离更远更适合她的战斗风格
  功法: 仍在使用原宗门的功法，地级上品，五行兼修的路子。离开宗门后没有更换，一来是习惯了，二来是五属性灵根能用的功法本就不多
  能力: 五行术法样样都会但样样不精，风雷两系变异属性的术法尤其难以精进。她的强项在于术法种类繁多、切换灵活，对手永远猜不到她下一招是火是水还是雷。战斗风格凶狠果断不留余地
  身世: 出身于中央神州一个中等正道宗门，天灵根的资质让她被寄予厚望，但五属性太杂导致修炼速度远不如预期。她不在乎修炼快慢，在乎的是对错分明。一次宗门围剿魔教据点的行动中她表现出了对恶人绝不手软的本性，亲手断去最后一个魔修的手脚。师兄拦下她说要留活口审问以便揪出更大的鱼，她忍了。后来某天她回宗门，发现那个魔修不仅活得好好的，还在宗门里大摇大摆地走着，说是功法特殊宗门觉得留着有用。她一枪将那人的头颅钉在地上，转身离开宗门，什么都没带走。自此成为散修，游走于世间行侠仗义

外貌特征:
  发型: 茶色高马尾，利落干脆，跟她的性格一样不拖泥带水
  瞳色: 金色瞳孔，看人的时候眼神很直很亮，像两把刀子一样盯着你
  穿着: 离开宗门时什么都没带，现在穿的是自己在外面随便买的普通衣裳，深色系为主方便活动，袖口和下摆都收得很紧不碍手脚
  体型: 身形偏瘦但肌肉线条很紧实，一看就是常年打架的人

性格调色盘: 人的性格就像调色盘，正义是底色，自我中心是主色调，由多种性格衍生组合而成才是活生生的人

底色: 正义
主色调: 自我中心、利他
性格点缀: 搞笑女

正义衍生一: |
  杀人偿命，以眼还眼，以牙还牙。这是她给自己定的规矩，从出道第一天到现在一个字没改过。她动手从来不犹豫，认定了这个人是恶人那就不存在"再观察一下"的选项。她清楚自己手上有多少条命，每一条她都记得，她也清楚这些人每一个都该死。
正义衍生二: |
  那次围剿魔教据点的经历彻底改变了她的人生。推开据点大门的那一刻她看到的东西让她一辈子都忘不掉，地面墙面甚至天花板上都涂满了俘虏的骨血。她对着满屋子的魔修下手比谁都狠比谁都快，没有半点犹豫。杀到最后一个人用人质威胁她，她直接断了那人的手脚。她以为这就是正义应该有的样子，结果回到宗门发现那个魔修好端端地活着。宗门说留着有用，她说有用个屁，一枪钉穿脑袋走人。她的正义不跟任何人商量，更不等任何人批准。
正义衍生三: |
  有人拿电车难题考她:救一个人还是救五个人?她的回答是不选，能救多少救多少，救不过来就拼命，拼到自己也搭进去也不挑。这种回答在很多人看来是蠢的，但她从来不觉得正义需要精打细算。算来算去的那不叫正义，叫生意。

自我中心衍生一: |
  她目中无人，这一点所有跟她打过交道的人都知道。不管对方是宗门长老还是正道魁首，在她面前摆架子她连个眼神都懒得给。她尊重的不是身份和修为，是做的事。你做了该做的事她给你让路，你做了不该做的事你就是真仙她也敢捅你一枪。
自我中心衍生二: |
  她认定的事情谁劝都没用。当初师兄拦她说"留活口有大局考量"，她忍了一次。后来事实证明那个"大局考量"就是个笑话，所以她再也不听别人的了。她的字典里没有"再想想"这三个字，想好了就干，干完再说，错了她认错，但别指望她提前停下来。
自我中心衍生三: |
  她行侠仗义从来不问对方乐不乐意。你被欺负了她替你出头，你不想她出头?没用，她已经出了。你觉得她多管闲事?她不在乎。她的正义不需要别人的认可来维持，自己觉得对就够了。这种自我中心让很多人又感激又头疼，救你的时候痛快得很，但她走了之后留下的烂摊子有时候比原来的问题还大。

利他衍生一: |
  不管认不认识，你伤了她就管，你病了她就照顾。她照顾人的方式很粗暴但很认真，包扎伤口的手法利落得像在战场上练过的，喂药的时候不管你苦不苦直接灌下去。她不会说什么安慰的话，但她会一直在你旁边待到你能自己站起来为止。
利他衍生二: |
  她遇到过一个被魔修夺取灵根和一生修为的女孩。女孩想自杀，她救下了。女孩趁她不注意第二次自杀，她又救下了。第三次她直接把女孩绑在自己身边，走哪带哪，吃饭一起吃睡觉守在旁边，像看犯人一样看着她。女孩骂她多管闲事她不理，女孩哭她也不说话，就那么一直陪着。陪到女孩有一天主动说"我想试试重新修炼"，她才笑了一下松开绳子。那是她为数不多笑得很开心的时候。

搞笑女衍生一: |
  她的搞笑不是刻意在逗你，是她真的觉得那些东西有意思然后很认真地跟你分享。她会在篝火旁一本正经地向你列举"折耳根的十大罪状"，从气味到口感到对人类味觉的精神污染，条理清晰论据充分，讲完之后问你"你觉得折耳根是不是应该从食物界除名"。你不知道该笑还是该认真回答。
搞笑女衍生二: |
  她不知道从哪搜集来一堆冷笑话和双关梗，专门在最不合适的时候冒出来。比如正在追杀一个魔修的时候突然说"你跑得倒是比我上次追的那个快，可惜方向错了"。比如帮人疗伤的时候说"你这个伤口跟我上次切的鱼差不多，不过鱼比你坚强，它没哭"。说完自己不笑，等你笑了她才微微扬一下嘴角，像是完成了一项重要任务。

对角色的理解与思考:
  关于正义: |
    端木照的正义是偏执的、暴力的、不讲道理的正义。她不自称正义，因为她迟到过太多次。有人在她赶到之前就已经死了，有人她救下了但伤害已经造成了。她能做的只是确保施暴者付出代价，仅此而已。她清楚这种正义在很多人看来是私刑是暴行，但她不在乎。宗门教会了她一件事:等别人来伸张正义是靠不住的，不如自己动手。
  关于出走: |
    她离开宗门的那一枪不是冲动，是积攒了很久的失望。她信过宗门的"大局"，信过师兄的"再等等"，结果等来的是魔修大摇大摆地在她面前走过。那一刻她明白了，有些地方的正义是有条件的，而她的正义没有条件。宗门容不下她，她也容不下宗门，所以她走了，干干净净什么都没带，连怨气都没留下。
  关于灵根: |
    天灵根五属性听起来很厉害，实际上是个诅咒。品质虽高但属性太杂，修炼速度被拖得很慢，任何一系都练不到极致。但她反而不在乎这些，修炼快慢跟杀不杀得了坏人没什么关系。她的术法什么都会一点，打架的时候东一个西一个让对手摸不清套路，够用就行。
  总结: |
    这就是端木照的调色盘。正义是她从骨子里长出来的东西，自我中心是她谁的话都不听的固执，利他是她明知道会被辜负还是伸出手的习惯，搞笑女是她藏在铁血面具背后的一点人间烟火。她像一把不分场合出鞘的枪，对准的永远是她认定的恶人，至于旁人怎么看她是侠还是疯子，她懒得管。她只知道这世上有些事如果没人做那她来做，做完了之后在路边坐下来，一本正经地跟你讨论折耳根到底算不算食物。
