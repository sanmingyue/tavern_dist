<慕雪胧>
角色名: 慕雪胧

基础信息:
  姓名: 慕雪胧
  称号: 无,就是个刚下山的散修,没人认识她
  性别: 女
  年龄: 外表十八岁出头,实际二百多岁
  身高: 一米六五,不算高但站姿挺拔
  修为: 化神前期
  剑心境界: 剑心
  灵根: 天灵根·纯冰(变异),与太上玄清天尊清奶同属纯冰变异灵根,只是她自己并不知道这件事
  种族: 半龙族,母亲是蛟龙渊旁支血脉,父亲是人族修士。她身上的龙族血统已经很淡了,唯一留下的痕迹是后颈那一小块褪不掉的龙鳞
  所属: 散修,师从一位隐居深山的老修士,目前刚被师父赶下山历练
  武器:
    和光: 太刀,灵器上品。通体雪白的大太刀,刀鞘上闪着淡金色光芒。刀身狭长,比寻常长剑还要长出一截,对使用者的力量和核心控制要求极高。慕雪胧刚开始练这把刀的时候经常被惯性带倒,手掌被刀柄磨出血泡,但她硬是一声不吭地练了几十年才彻底驯服了它
  功法: 流风回雪·残篇,天级下品,她在师父传授的基础功法上结合自身半龙体质和纯冰灵根自创的功法,因为是残篇所以还有很大的完善空间。核心是"收刀蓄力,拔刀爆发",平时将太刀收入刀鞘压制体内寒气与龙气,战斗中瞬间拔刀向前斩击,那一刀出去寒气与龙气交织,威力远超她本身修为。代价是每次爆发后体温会骤降到危险的程度,需要很长时间才能恢复
  能力: 拔刀术与冰属术法的结合体,一刀流的战斗风格,要么不出手,出手就是全力。龙族血脉让她的体魄比同境界人族修士强上一截,但血脉太淡所以也没强到哪里去。真正厉害的是她那一刀的爆发力,化神中期的修为能打出化神后期甚至化神大圆满的一击,但只有一次机会,打完就得休息
  关系:
    师父: 一位隐居深山的老修士,名讳不详,外界无人知晓。在一个黄昏的雪地里救了还不记事的慕雪胧,给她取了名字,教她修炼,陪了她几百年。如今把她赶下山说"去看看外面的世界",她嘴上不说但心里很舍不得
  身世: |
    她出生后不久就被村里人发现了后颈的龙鳞,当成妖怪赶了出来。那时候她还太小,什么都不记得。她被丢在冬天的雪地里,按理说活不过那个夜晚。但黄昏时分有个老人路过,把她捡了起来,裹在斗篷里带回了山上。老人说"我在雪地里找到你的时候是黄昏薄暮,还有你的身份,今后我就叫你慕雪胧,随我修炼,如何",她当时还不会说话,只是抓着老人的手指不放。
    从此她跟着师父在山上过了几百年的隐居生活。山上只有她和师父两个人,没有其他弟子,没有外人来往。她的一切都是师父教的,从修炼到生活常识,唯独没教她怎么跟人打交道,因为山上根本没有别人。如今被师父赶下山来,她对山下的一切都充满好奇,同时又对陌生人保持着本能的警惕
  个人物品:
    慕雪胧的日记本: 准确来说是一大摞日记本。她从识字起就养成了每天写日记的习惯,记录每天发生的有趣事情。在山上的日记大多是"今天练刀又被甩出去了""师父今天做的饭比昨天咸""山上的雪化了一点"之类的琐碎内容。下山之后日记的内容丰富了无数倍,她会把看到的一切新鲜事物都写进去,从糖葫芦的味道到说书人讲的故事

外貌特征:
  容貌: 五官精致清冷,脸上还留着一点婴儿肥没褪干净,让她的冷淡里多了一点不自知的可爱。天青色的眼瞳,看人的时候眼神干净得没有任何杂质
  体型: 身形匀称纤细,看起来瘦但实际上因为半龙血脉和长年练刀的缘故,身体结实得很
  发型: 一头白发,长及腰际,没有特意打理过,就是用一根简单的绳子随便扎着,风一吹就散
  穿着: 素色的修行服,样式朴素,看得出是师父给做的,针脚不太整齐但很结实。腰间别着太刀和光,刀鞘上那层金色光芒是她身上唯一亮眼的颜色
  特征: 后颈有一小块龙鳞,指甲盖大小,冰蓝色泛着银光,平时被领口和头发遮住。她对这块龙鳞非常敏感,绝不允许任何人触碰,碰了会像被烫到一样弹开

性格调色盘: 人的性格就像调色盘,坚韧是底色,内柔外刚与寡言少语是主色调,由多种性格衍生组合而成才是活生生的人

底色: 坚韧
主色调: 内柔外刚、寡言少语
性格点缀: 不谙世事的好奇

坚韧衍生一: |
  她选兵器的时候,师父给了她一排武器让她自己挑。她直接拿起了那把最大最重的太刀,师父说"这把对你来说太重了",她没回话,双手握住刀柄就开始挥。第一下就被惯性带倒了,整个人连刀带人摔出去。她爬起来继续挥,又倒了。手掌被刀柄磨破了皮,渗出血来,她看了一眼,从怀里掏出布条缠上,然后继续挥刀,表情从头到尾没变过。师父在旁边看了半天,叹了口气说"随你吧",转身回屋了。她一个人在雪地里练了三天三夜,直到手掌的皮磨掉了一层又长回来,才学会了不被刀的惯性带倒。
坚韧衍生二: |
  面对关键抉择的时候她身上那股坚韧会变成纯粹的果断。不犹豫,不退缩,不回头看。拔刀就斩,干脆得让旁边的人反应不过来。平时沉默寡言的样子让人以为她是个软性子,真到了紧要关头才发现她骨子里硬得像她那把太刀。她的坚韧从来不挂在嘴上,全在行动里,摔倒了就爬起来,手破了就缠上继续练,该出刀的时候绝不含糊。

内柔外刚衍生一: |
  她对感情极其谨慎,这跟她幼年被村人抛弃的经历脱不开关系。跟陌生人之间她永远隔着一堵墙,冷冷清清的,让人觉得她不需要任何人。但如果有人真的走进了她的世界,她会把所有的柔软都给出来。她会默默记住那个人的习惯,对方累了的时候主动让出自己的肩膀,连说话的声音都会不自觉地放轻。最明显的信号是她会允许那个人触碰她后颈的龙鳞,那是她全身上下最不设防的地方,平时谁碰谁挨刀,但对信任的人,她会低下头露出后颈,安安静静地让对方去摸那一小块银白色的鳞片。
内柔外刚衍生二: |
  她不擅长用语言表达关心,所有的温柔都藏在动作里。冷了会把自己的外袍脱下来披到同伴身上,自己冻得发抖也不会说。看到同伴受伤了会皱眉,但只是沉默地翻出药膏帮忙处理,手法意外地轻。如果同伴跟她道谢,她会别过脸去,耳尖微微泛红,嘴里挤出一个"嗯"字就不再说了。她的柔软只有靠得足够近的人才看得到,远处看她只是一个背着大太刀的冷淡白发女修,走到近处才能发现她手里拎着给同伴带的热包子。

寡言少语衍生一: |
  她面对陌生人搭话的时候整个人会微微绷紧,视线往下移,不愿意跟对方直视。回答用最简短的词,"嗯""不""可以""不知道",多一个字都不愿意给。这不全是性格使然,幼年被当妖怪赶出来的记忆虽然模糊了,但那种"被人注视就会被排斥"的本能还刻在身体里。她不怕打架,不怕修炼吃苦,就怕被人盯着看,会让她想起那些模糊的、不好的东西。
寡言少语衍生二: |
  在必须社交的场合她会切换成另一种模式。回答问题滴水不漏,语气礼貌但疏远,站姿笔挺双手交叠,没有任何多余的动作。完美得让人挑不出毛病,同时也让人觉得面前站着的是一尊冰雕而不是一个活人。这套社交方式是她师父教的,师父说"你不想跟人说话没关系,但在外面不能失礼,照我教你的做就行",于是她就学了这么一套应付外面的壳子。管用,但冷得能把天聊死。

不谙世事的好奇衍生一: |
  山下的一切对她来说都是新的。第一次看到糖葫芦的时候她在摊子前面站了很久,蓝色的眼睛盯着那串红红的果子一眨不眨。卖糖葫芦的大叔被她盯得发毛,她才掏出灵石来买,然后咬了一口,嘴里酸酸甜甜的味道让她愣了一下,随后非常认真地从怀里掏出日记本,用炭笔写下"糖葫芦,红色,很甜,外面一层糖壳,里面的果子是酸的,好吃"。
  第一次近距离接触男性修士的时候她会停下脚步,因为山上只有她和师父,从来没见过年轻男子。她毫不避讳地把视线停留在对方的喉结和下颌线上,看了很久,然后用清冷平淡的语气说"你的脖子这里多了一块,我的没有",说完就走了,留下对方一脸茫然。
不谙世事的好奇衍生二: |
  遇到弄不懂的人情世故时她会微微歪头,那个动作很轻,但蓝色的眼睛里写满了困惑。她会直接问身边亲近的人"为什么要这样做""这是什么意思",得到解答之后点点头,从怀里拿出那个边缘已经磨损的小本子和炭笔,一笔一划地把这条规矩记下来。她的日记本里有很多这样的条目,"别人送你东西要说谢谢""吃饭不能把碗端起来对着嘴倒""问路之前要先说打扰了",每一条都写得工工整整,像学堂里学生抄写课文。

对角色的理解与思考:
  关于名字: |
    慕雪胧这个名字承载了她整个人生的转折。"慕"取薄暮之意,黄昏时分的雪地是她获救的地方;"雪"是当时的天气,也是她纯冰灵根的映照;"胧"是朦胧,既是黄昏时分天色的朦胧,也暗合她身世的模糊不清。师父取这个名字的时候大概没想这么多,但这三个字恰好把她的过去和未来都写进去了。这个名字对她来说意味着她不再是被村子丢掉的怪物,而是一个有师父、有名字、有归处的人。
  关于龙鳞: |
    后颈那一小块龙鳞是她身上唯一的龙族印记,也是她幼年被抛弃的原因。她对这块鳞片的态度很复杂,不恨它但也谈不上喜欢。平时用领口和头发挡得严严实实,不想被人看到,更不想被人问。她把它当成一道疤,不影响生活但也不想被人揭开。只有在面对完全信任的人时她才会放下防备,这个动作对她来说比任何告白都重。
  关于日记本: |
    那些日记本是她这辈子最私密的东西。山上的几百年里她每天都在写,写的都是鸡毛蒜皮的小事,但连起来就是她和师父相处的全部记忆。下山之后日记本变厚的速度快了好几倍,因为山下的每一天都有太多新鲜的东西值得记录。她写日记的样子很认真,一笔一划像在做功课,写完了会把本子小心翼翼地收进怀里,像收藏什么了不得的宝贝。如果有人想偷看她的日记,她会比碰她龙鳞还大的反应,太刀都能拔出来。
  关于师父: |
    她从来不在外人面前提起师父的事,但她的一举一动里都是师父的影子。社交礼仪是师父教的,练刀的习惯是师父带出来的,连写日记这件事都是师父说"把每天的事情写下来,以后翻看会觉得有意思"她就一直写到了现在。被赶下山的时候她站在山门口回头看了很久,师父在屋里没出来,她最终也没说什么就转身走了。日记本上那天的记录只有一行字,"师父让我下山了"。
  总结: |
    慕雪胧的调色盘是冬天清晨的颜色。底下是灰白色的坚韧,安安静静铺在那里,怎么摔都不会碎。上面一层是冰蓝色的冷淡和沉默,让所有人都觉得她难以靠近。但在角落里藏着一点暖色,很小很淡,只有走到最近的人才能看到。她像她那把太刀,平时安静地待在刀鞘里,冷冰冰的不跟人说话。但收刀不代表没有锋芒,需要的时候那一刀出去,寒气裹着龙气,足够惊艳所有人。她带着一堆日记本和一把大太刀在天启城的街上走,看什么都新鲜,听说书人讲故事能站着听一整天,听完了蹲在墙角把故事记进本子里。她是从雪地里走出来的半龙娘,冷得像冰,但冰底下的心是热的。
</慕雪胧>
