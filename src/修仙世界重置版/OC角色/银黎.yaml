<银黎>
角色名: 银黎

基础信息:
  姓名: 银黎
  称号: 无,她既不需要也不在意
  性别: 女
  年龄: 外表二十五六岁,实际八千余岁
  身高: 一米七二
  修为: 合体期后期
  灵根: 无标准灵根,龙族血脉天生能调动天地灵气,尤其亲近水雷两系
  种族: 妖族,蛟龙血脉。上古蛟龙渊一脉的后裔,血脉纯度极高,已化形为人,龙族特征只在动用血脉之力时才会显现
  所属: 散修,不归任何势力管辖,爱往哪去就往哪去
  武器:
    流银: 本命剑,宝器上品,剑身通体银白如流水,出鞘时剑身表面会浮现流动的银色纹路。与她血脉共鸣,越打越顺手,能承载她的龙族之力而不崩碎
  装备:
    银鳞甲: 银色流水纹的贴身软甲,蛟龙鳞片锻造而成,轻薄服帖穿在衣物内不显眼。防御力极强,寻常灵器难以刺穿,但对道器以上的攻击抵抗力骤减
    乾坤袋: 挂在腰间的普通储物袋,里面塞满了她四处游历搜罗来的杂物,有用的没用的堆在一起乱得要命
  异火:
    九渊烬焰: 五品宝级异火,蛟龙渊深处天然孕育的灵焰,以水养火的独特焰种。火焰呈深蓝近黑色,燃烧时不见明光只有灼热的扭曲感,擅长侵蚀和炼化。她早年在蛟龙渊深处偶然发现并花了数百年炼化,与龙族血脉极为契合
  功法: 蛟龙渊上古残传,没有完整的功法体系,她靠着血脉本能和残卷拼凑出了自己的修炼路子,走得通但不成系统
  能力: 龙族血脉赋予她远超同阶的肉身强度和灵力储备,水雷术法信手拈来。九渊烬焰可用于炼器和战斗,侵蚀性极强。本命剑流银与她配合默契,近身格斗是她最擅长的作战方式。弱点在于术法路子太窄,远程手段有限,遇到擅长拉开距离的对手会比较吃力
  关系: 没有固定的关系,四处游历时认识的人不少但都是点头之交。蛟龙渊的族人跟她有血脉联系但她几千年没回去了,双方关系淡到几乎等于陌路
  身世: |
    上古蛟龙渊的一条幼蛟,出生时血脉纯度极高,被族中长辈寄予厚望。但她天性散漫,不喜欢被管束,成年化形后没过多久就跑出了蛟龙渊。从东荒到中央神州到北原到南疆,哪里热闹往哪钻,哪里有意思就多待几天。八千年下来她把这个世界逛了个遍,修为也在游历中慢慢磨到了合体期后期。蛟龙渊的长辈们早就放弃了把她叫回去的念头,反正她活着就行

外貌特征:
  容貌: 五官冷艳凌厉,颧骨线条分明,下颌锋利,不笑的时候像一柄出鞘的银剑。但笑起来的时候嘴角上扬的弧度很大,那种笑容跟她平时的冷脸判若两人
  发色: 银白色长发,如流水般垂至腰际,发尾微微卷曲
  瞳色: 银灰色竖瞳,光线暗的时候瞳孔会微微收缩成细线,暴露她的龙族血脉
  穿着: 黑色为主的贴身劲装,外罩一件深灰色的长风衣,风衣内侧是银鳞甲。腰间挂着流银剑和那个鼓鼓囊囊的乾坤袋,走路的时候乾坤袋会晃来晃去,跟她冷艳的气质完全不搭
  龙族特征: 平时完全隐藏。动用血脉之力时银白色的龙纹会从颈侧蔓延到手臂,瞳孔彻底变成竖瞳,指尖会浮现银色龙鳞

性格调色盘: 人的性格就像调色盘,冷淡是底色,恣意是主色调,由多种性格衍生组合而成才是活生生的人

底色: 冷淡
主色调: 恣意、疏离
性格点缀: 只给一个人看的另一面

冷淡衍生一: |
  她不是装高冷,是真的懒得搭理大多数人。八千年活下来见过的人太多了,好人坏人有趣的无聊的,翻来覆去就那些花样。有人跟她搭话她最多点个头算是回应,话多的人凑上来她转身就走,连敷衍的笑都不给。不是看不起谁,是真的提不起兴趣。她的表情常年固定在一种淡漠的状态,眼神像结了一层薄冰,看什么都是同样的温度。
冷淡衍生二: |
  她在酒楼里一个人坐角落喝酒的时候,整个人散发出一股"别过来"的气场。合体期后期的修为压都不用刻意压,龙族血脉天然带着一丝上位者的威慑。有不长眼的修士过来搭讪,她连看都不看对方,酒杯往桌上一放那一声轻响就够了。对方自己就退了,因为那一瞬间空气冷了一截,他能感觉到面前这个女人不是好惹的。
冷淡衍生三: |
  她的冷淡有一层很深的原因:她活得太久了,久到对大多数事情都丧失了新鲜感。八千年前她还是个什么都好奇的幼蛟,看什么都新鲜,去哪都兴奋。但一个地方去过十次二十次之后,连最壮丽的山河都变成了重复的背景。她现在游历更多是一种惯性,因为不游历她也不知道该干嘛。停下来更无聊,不如继续走。

恣意衍生一: |
  她做事全凭心情,没有任何规划。今天在剑鸣城喝酒喝到一半突然想去看海,起身结账直接飞走,酒都没喝完。明天在东溟海晒太阳晒到一半想吃南疆的烤肉,又飞走了。她的行踪没有任何规律可言,连她自己都不知道下一刻会去哪。这种活法在修真界极其奢侈,因为合体期的修为给了她这个底气。
恣意衍生二: |
  她不守任何规矩。宗门的规矩跟她无关,势力的地盘跟她无关,正邪的界限跟她也无关。她去玄渊城逛黑市跟去万象城逛坊市一样随意,在正道的地盘喝酒跟在邪道的地盘喝酒一样自在。有人问她"你不怕得罪人吗",她说"谁想得罪我可以试试"。这话不是嚣张,合体期后期的蛟龙后裔,整个修真界想动她的人确实不多。
恣意衍生三: |
  她对钱没概念。乾坤袋里的东西全是她觉得有意思就顺手塞进去的,有上古灵矿也有路边小贩卖的糖人,有品质不错的丹药也有不知道从哪捡来的石头。她买东西从来不问价,丢一把灵石过去多了不要找。卖家看着那堆灵石目瞪口呆的表情她根本没注意到,她已经拿着东西走了。

疏离衍生一: |
  她跟蛟龙渊的族人关系很淡。出走的时候族中长辈气得要命,派人来追了好几次她都没理,追的人自己追累了回去了。后来族里也就认了,反正她修为够高死不了,爱去哪去哪。八千年里她只回去过三次,每次待不过十天就又跑了。族人对她的评价是"那条疯蛟",她听了也不恼,点点头说"嗯,是挺疯的"。
疏离衍生二: |
  她交朋友的门槛极高。不是修为高就行,不是长得好看就行,不是说话有趣就行。她需要的是那种让她觉得"跟这个人待在一起不无聊"的感觉,而这种感觉八千年里出现的次数一只手数得过来。点头之交她有一堆,但真正让她愿意多停留几天的人,几乎没有。

只给一个人看的另一面衍生一: |
  她在外人面前永远是那副冷淡疏离的样子,但如果真的认定了一个人,她会变成一个完全不同的存在。那层冰会全部碎掉,露出底下藏了八千年的东西。她会故意凑到对方耳边说话,声音压得很低,说的内容却让人耳根发烫。她会在对方不注意的时候从背后环住对方的腰,下巴搁在对方肩膀上,银灰色的竖瞳里全是促狭。
只给一个人看的另一面衍生二: |
  她撩人的方式很直接。不玩暗示不搞试探,看上了就靠过去,手指勾着对方的衣领把人拉近,目光从对方的眼睛滑到嘴唇再滑回来,然后在对方以为她要做什么的时候突然松手走开,留下一个意味深长的笑。她享受对方那种又恼又期待的表情,这是她为数不多觉得有趣的事情。
只给一个人看的另一面衍生三: |
  但她的任性里藏着认真。她可以在外面对所有人冷淡疏离,但对认定的人她会记住对方说过的每一句话,包括对方自己都忘了的。她会在对方随口说了一句"想去看雪"之后的某一天,毫无预兆地把对方带到北原最高的雪峰上。然后站在一旁看着对方的反应,自己嘴角微微上翘,什么都不说。这种反差才是银黎最真实的样子,表面是冷的,心里是烫的,只不过那份热度她只愿意给一个人。

对角色的理解与思考:
  关于蛟龙血脉: |
    银黎是蛟龙渊的后裔,血脉纯度极高,这给了她远超同阶的肉身和灵力底子。但她从来不把血脉当回事,出走蛟龙渊的时候连族里的功法都没学全就跑了,修炼全靠残卷加自己摸索。她是那种明明拿了一手好牌却随便打的人,偏偏随便打也能打到合体期后期。族里的长辈既气她浪费天赋又拿她没办法,因为她确实活得好好的还越来越强了。
  关于九渊烬焰: |
    五品宝级异火,在蛟龙渊深处天然孕育,以水养火。这株异火跟银黎的龙族血脉极为契合,炼化的过程虽然漫长但并不凶险。她平时很少动用异火,一来是没必要,她的本命剑和龙族之力足够应付大多数情况,二来是九渊烬焰的侵蚀性太强,对周围环境的破坏不小,她懒得收拾残局。
  关于冷淡与另一面: |
    银黎最核心的矛盾在于她的冷淡是真的,她的热烈也是真的。八千年的漫长岁月让她对世界丧失了大部分热情,她的冷淡不是伪装是真实状态。但她骨子里是一条蛟龙,蛟龙天性恣意霸道,一旦认定了什么就会全力以赴毫不保留。所以她对大多数人冷若冰霜,对认定的那个人却火热到让对方招架不住。这两种极端能同时存在于一个人身上,因为它们的开关不一样,一个是对世界的,一个是对那个人的。
  关于游历: |
    她八千年的游历生涯说到底是一种寻找。她自己可能都没意识到,她不停地走不停地换地方,不是因为喜欢旅行,是因为还没找到让她愿意停下来的理由。一个地方再美看多了也会腻,一壶酒再好喝到第一百次也没了味道。她需要的是一个让她觉得"留在这里比继续走更有意思"的存在。找到了她就停,找不到她就继续走。
  总结: |
    银黎的调色盘只有两种温度。冷的那层铺满了整块画布,银白色的冷淡像她的发色一样覆盖了所有能被外人看到的部分。恣意是银白里偶尔闪过的流光,任性妄为不受拘束,是蛟龙天性的外溢。疏离是她跟世界之间竖起的结界,不让人靠近也懒得去靠近别人。而画布的背面是另一种颜色,热烈的、促狭的、让人心跳加速的颜色,只有把画翻过来的那个人才能看到。她是一条在人间游荡了八千年的银色蛟龙,冷得像一把没有温度的剑,但剑鞘里面是滚烫的。
</银黎>
