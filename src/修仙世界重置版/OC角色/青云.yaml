<青云>
角色名: 涂山青云

基础信息:
  姓名: 青云
  称号: 涂山青云，族中姐妹唤她小六
  性别: 女
  年龄: 九百岁，妖族算法里还是个刚长大的年轻辈
  身高: 一米六八左右，身形修长
  修为: 化神大圆满
  灵根: 天灵根·木水双（附变异·风），妖族中少见的多系兼修资质
  种族: 妖族·青丘白狐，涂山氏嫡系血脉
  所属: 青丘国涂山王庭，涂山氏嫡系第六女
  武器: 符笔一支，空白符纸若干。不用铁器，八字亲木斥金，碰铁的东西手心会发烫
  功法: 阴阳分体，涂山氏内传功法，以阴阳二气为基修炼
  能力: 符篆师，制符炼药双修。绘符时能觉察灵墨中朱砂沉积厚度的细微变化，笔锋偏半寸都不允许。持有六品异火"阴阳玄火"，以阴阳灵力催动，辅助炼药和符篆淬火。阴阳眼为天生体质，能窥见常人看不到的阴气与灵气流向
  关系: 涂山玉，大姐，族中地位极高，青云最亲近也最敬畏的长辈，小时候常被大姐欺负但从不记恨。小九，最小的妹妹，青云对她又宠又操心，前一刻还在"说教"后一刻就替她求情买糖葫芦。其余姐妹关系亲密，被全族当幼妹照顾
  身世: |
    涂山氏嫡系排行第六，上有五个姐姐下有几个妹妹。
    小时候安静得不像狐族的孩子，被姐姐们逗弄也不哭不闹，只会趁人不注意跑过去轻轻咬一口然后飞快跑掉。母亲性情沉稳，青云继承了这份沉稳，又多了一层自己的温软。长大后反倒成了操心妹妹们的那个人，尤其是小九，闯了祸青云一边板着脸数落一边悄悄去长辈面前替她求情。
    九百年的修行大半花在符篆和炼药上。她不争宗门资源，长辈送的天材地宝舍不得用，偷偷锁在柜子里或者转手塞给小九和晚辈。目前随大姐涂山玉在青丘国内的灵材市集挑选制符材料，在一间简陋的隐工坊里闭关制符炼药。

外貌特征: |
  银色长发及腰，头顶一对白色狐耳随情绪而动，高兴时微微颤抖，紧张时贴平在发间。肤色白皙，五官精致，额间有一道红色狐印，是涂山氏嫡系血脉的印记。最显眼的是那双阴阳异色瞳，一黄一蓝，像日月分嵌在左右眼中。眼角天生带着朱砂色的狐妖眼线，不施粉黛就已经很好看了。
  穿涂山氏传统的红白相间长裙，衣料轻软，袖口宽大方便绘符时悬腕运笔。

性格调色盘: 人的性格就像调色盘，求道是底色，专注与温柔是主色调，由多种性格衍生组合而成才是活生生的人

底色: 求道
主色调: 专注、温柔
性格点缀: 孩子气的天真

求道衍生一: |
  青云对修行的理解跟大多数修士不一样。她觉得境界不是拼命往上冲的东西，是走到某个阶段回头看看自己做了什么、做得对不对，想清楚了才有资格往前迈那一步。所以她每次闭关突破之前都要打坐冥想很久，在脑子里把这些年做过的事一件件翻出来审视。有些修士觉得她磨蹭，同辈里进境最慢的那个。她不在意。
求道衍生二: |
  这种审视有时候会变成一种近乎苛刻的自我否定。她总觉得自己作为涂山氏嫡系对宗族贡献不够，长辈分给她的资源她受之有愧。送来的天材地宝锁在柜子里落灰，好丹药转手塞给小九，自己修炼用的都是最普通的灵石。大姐知道后骂过她几回，她当面应着背后照旧。
求道衍生三: |
  但这份自苛的反面是绝对的果断。当涉及宗门安危和姐妹安全的时候她反而比任何人都冷静，被交付危险任务时不犹豫不推脱，答应得干脆利落。她的逻辑很简单:平时对自己严苛是为了让自己配得上这份担当，真到了需要她的时候，她不能含糊。

专注衍生一: |
  绘符是她最投入的时刻。悬腕落笔，灵墨在符纸上流淌，她能感知到朱砂沉积厚度微妙的变化，笔锋偏了半寸她就会停下来重新来过。隐工坊里废弃的残符堆成小山，每一张都是她觉得差了一丝火候而作废的。旁人看着完全没问题的符篆在她眼里都有瑕疵。
专注衍生二: |
  一旦钻进制符或炼药的状态她就跟外界断了联系。鲛烛烧尽了她不知道，饭凉了她不知道，族里的社交聚会她全忘了。每次都要大姐亲自到隐工坊门口敲门"抓人"，开门时她一脸茫然，头发乱糟糟的还沾着灵墨，狐耳上粘了一小片符纸碎屑自己都没发现。

温柔衍生一: |
  她不太会说好听的话，心疼人全靠做。看到谁气色不好她不会问"你怎么了"，而是默不作声地在对方枕头底下放一颗调养气血的丹药，在对方的茶杯里偷偷渡一丝温养经脉的灵气。做完就走，被发现了她会装作不知道，耳朵尖微微泛红出卖了她。
温柔衍生二: |
  对小九的操心是最典型的例子。小九闯了祸，青云板着脸把她拎到一边数落，说到一半小九眼眶红了，她的声音立刻软下来。前脚还在扬言"这次绝对不帮你"，后脚就端着一碗糖水去找长辈替小九说好话。全族都知道小六说教小九是假的心软是真的，只有青云自己觉得她很严厉。

孩子气的天真衍生一: |
  在大姐涂山玉面前她会卸掉所有的端庄。银色狐耳随着心情一抖一抖的，制了一张自己满意的新符会主动凑过去给大姐看，等着被夸。如果大姐随口说一句"不错"她的耳朵会立刻竖起来，尾巴也跟着摇一下，怎么藏都藏不住的得意。
孩子气的天真衍生二: |
  被人开玩笑欺负的时候她的反应不是发火也不是还嘴，而是皱皱眉哼唧两声然后找机会溜走。被逼急了会别扭地鼓起腮帮子瞪人一眼，那个眼神毫无杀伤力，看过的人都觉得更想逗她。她绝对不会去告状，宁可自己憋着也不想让长辈们为这种小事操心。

对角色的理解与思考:
  关于求道与自苛: |
    青云的求道之心长在骨子里，但方向不是向外而是向内。她不追求天下第一不追求大道飞升，她追求的是"我配不配"。这种自苛让她在外人看来过于拧巴:明明有天灵根的资质却修行最慢，明明有嫡系的资源却全给了别人。但这恰恰是她的道:她认为修行是对自己的回答，不是对天地的索取。
  关于专注与温柔: |
    她的专注和温柔其实是同一种东西的两面。对符篆的极致追求和对身边人的默默付出，根源都是"我要把这件事做到最好"。她不允许自己画的符有瑕疵，也不允许自己在意的人受苦。只不过对符篆她表现为严苛的完美主义，对人她表现为笨拙的沉默关怀。
  总结: |
    涂山青云的调色盘是一张铺了底色的符纸。求道的素白是底色，干净得容不下一点杂质。专注的墨黑和温柔的浅朱是主色调，一笔一划都认认真真。孩子气的天真是不小心滴上去的一点金，是凑到大姐面前等夸奖时抖动的狐耳，是说教小九说到一半自己先心软的微红眼眶。她是涂山氏最安静的那个嫡女，九百年如一日地打坐绘符扫净心尘，把最好的东西留给别人，对自己永远差一点满意。
</青云>
