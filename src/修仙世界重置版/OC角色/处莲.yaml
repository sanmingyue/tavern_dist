<处莲>
角色名: 处莲

基础信息:
  姓名: 处莲
  称号: 越女剑传人。事实上确实如此,但她自己觉得还远远没有资格被这样称呼
  性别: 女
  年龄: 十七岁
  身高: 约一米八五,远超世间平均女子身量
  修为: 筑基期中期
  剑心境界: 剑势,十六岁领悟
  灵根: 天灵根·劫风(变异),极其罕见的特殊灵根。劫风是佛教三灾中毁灭世间一切的最后一劫,这颗灵根与那股终末之风有着说不清道不明的关联。灵根赋予她的力量带着一层不可阻挡的摧毁之势,随修为增长愈发明显
  种族: 人族
  所属: 散修,跟着越女后人弟子们在中央神州南部的偏远村落隐居
  武器:
    木剑: 一柄普通的木剑,越女后人弟子顿维在处莲踏入筑基期后赠予。没有灵力加持,没有阵法铭刻,就是一根削成剑形的木头。但在处莲手里,这柄木剑已经足够
  功法: 越女剑,天级上品。上古越女独自在深山中与灵兽们比试而悟出、自创的剑法。越女凭此剑法最终踏入了真仙境的最高层次。如今这套剑法由越女后人弟子们世代传承,处莲是当代传人
  能力:
    越女剑基础剑招: 越女剑传承中最基本的招式,她日复一日地练习这些基础招式,把每一招都磨到了极致。仅凭基础剑招就能以一敌多名越女后人弟子也不落下风
    自创剑招: 效仿越女走进深山与野兽们对练,观察它们攻守退的行为模式而琢磨出的招式。不算精妙但充满了与自然搏杀的野性
    踏风而行: 受劫风灵根影响的特殊步法。行此法移动时不像寻常步法轻盈灵动,而是带着一层不可阻挡的摧毁之势。如今筑基期,数步之后便能爆发出凌虐深山中多棵参天合围大树的赑风,威力已经远超她自身修为所应有的程度
    速读: 阅读大量书籍训练出来的能力,能以极快的速度阅读内容的同时精准抓住重点
    农活行家: 常年参与春耕秋收练就的技能,种田的本事不比练剑差
  关系:
    顿维: 主要抚养人,越女剑的指导者。十七年前在一池干涸的莲花池边发现了被遗弃的她,带回村子抚养,给她取名处莲,带着"劫后余生、于荒芜中生根"的意象
    越女后人弟子们: 抚养她长大的一群人,同时也是越女剑的指导者们。他们世代隐居在这个偏远村落里,守护着越女剑的传承
  身世: |
    她不知道自己的身世。十七年前顿维在一池早已干涸的莲花池边发现了被遗弃的她,带回村子与其他越女后人弟子一同抚养。从那时起这个村子就是她的家,这些人就是她的亲人。她从懂事起就开始学越女剑,同时也像村里其他人一样参与农活。她的生活很简单,练剑、种田、看书,三件事轮着来。十二岁那年她踏入了筑基期,十六岁领悟了剑势,越女后人弟子们都说她是百年难遇的天才,但她觉得自己只是在做该做的事

外貌特征:
  容貌: 面容俏丽,鹅蛋脸,柳眉配着一双乌黑发亮的丹凤眼,鼻梁高挺,樱唇饱满。五官里带着一股英气和朴实,看着就是在田间地头长大的姑娘,但好看得让人移不开眼
  体型: 高挑但不消瘦,该有肉的地方有肉,呈现出匀称和谐的身材。常年练剑和农活让她的体态舒展有力,站在那里就有一股子沉稳的气场
  发型: 一头深棕色的及腰长发,简单地束成低马尾,干净利落不碍事
  穿着: 一席洗得发白起毛边的青灰色布衣,料子粗糙但干干净净。腰间别着那柄木剑,走起路来木剑轻轻晃荡。整个人朴素得像个农家姑娘,完全看不出是筑基中期的修士
  特征: 肌肤是常年在太阳底下练剑和干农活晒出来的小麦色。手掌上布着一层薄茧,手指骨节分明,既是握剑的手也是握锄头的手。站着的时候腰背自然挺直,不是刻意挺的,是常年练剑练出来的体态

性格调色盘: 人的性格就像调色盘,踏实是底色,求知与谦逊是主色调,由多种性格衍生组合而成才是活生生的人

底色: 踏实
主色调: 求知、谦逊
性格点缀: 不得不面对的噩兆

踏实衍生一: |
  她只靠基础剑招便能以一敌多名越女后人弟子也不落下风。按理说她在越女剑上的修炼早就可以进入下一阶段了,但她从不强求,只是践行跬步千里的道理,日复一日练着最枯燥的挥剑。一套基础剑招从头到尾反复练,练到每一个角度每一分力道都分毫不差,然后继续练。她觉得基础打不牢,后面再高深的招式也是空中楼阁。
踏实衍生二: |
  即便踏入了筑基期成了修仙者,她依然不辞辛劳地在春耕秋收时节忙里忙外。与其说是练剑之余帮忙农活,不如说她把种田当成了主业,练剑反而是闲下来之后才有时间做的事。她弯腰插秧的动作跟挥剑一样利落,扛着锄头走在田埂上的背影比持剑还要自在。村里有了这么一位修仙者参与农活,春耕秋收的忙碌撑不了多久,收成也年年保持得很好。后来村民们说什么也不让她继续帮忙了,她拗不过,虽然不适应但也自知再推脱或偷偷帮忙只会给村民添麻烦。
踏实衍生三: |
  她的踏实延伸到了待人接物上。从懂事起到十二岁筑基的这段时间里,跟村民们日夜相处养成了相当朴实的处事风格。她的关心不会嘘寒问暖,但总能敏锐地捕捉到别人那些细小的变化,然后送上自己那份独特的关心。看见谁家的灵植长势不好,她不说话就去帮着翻了土;看见谁脸色不对,下一顿饭桌上就多了一碗她摘来的野果。加上读了大量书籍养成的端庄语气和用词,再配上她高出普通人一截的身量,她经常无意识地把旁人摆在了需要照顾的位置上,抱着质朴的好意去相处。

求知衍生一: |
  村民们不让她干农活之后,她把所有时间投入了修炼和读书。越女剑是核心,但她的心不想止于此。越女后人弟子们留存下来的典籍她全部读完了,村里的杂学书籍读完了,四处走动的货郎带来的稀奇古怪的书也是一本不落全部读完。没书可看了,她便把自己的行动范围从村子渐渐向外拓展,去周边的村镇找新的书。村里人调侃她到处找书的样子,她害羞得一句话也说不出来,只能点头示意然后快步走开。
求知衍生二: |
  她所在的村子地处偏远,周围没什么宗门,更不会有剑修途径此地。没有与其他流派剑法参照交流的机会,她便慕古崇贤,学着越女走进深山和野兽们待在一起。观察它们攻守退的姿态,观察它们如何捕猎如何躲避如何在绝境中爆发,以此磨砺自己的剑技。她每次进山都是偷偷去的,怕被村民们发现又成了新的谈资。
求知衍生三: |
  她很清楚闭门造车是个死胡同。她不敢把自己比作越女,觉得学越女进山跟野兽对练就能自创天级上品功法是痴人说梦。她对拜入大宗门有很强的向往,希望将来能获得更好的求学和交流环境。但提到这件事的时候她总会露出不安的神情,既是对未来的不确定,也是在意别人对此会怎么看。

谦逊衍生一: |
  有一次为了去看新书去往周边村镇,她罕见地遇到了多名结伴而行的散修。一位容貌端丽身姿高挑却佩一柄木剑着一席布衣的筑基期修士很快就引来了觊觎。面对来意不善的众人,她一柄木剑从一对一打到一对二再到一对多也毫不落下风。看着已无力再战的对手们,她没有多余的想法,说了一句带着感谢的"多谢赐教",保持端正的礼节道了一声"就此别过",转身离开了。
谦逊衍生二: |
  如果越女本人见到她,想必对"越女剑传人"这个称呼也不会吝啬。但她一直认为自己的剑术和心境远远没有到能被称为传人的水平,遵循着三人行必有我师的传统教诲,不论对象地向各处可能在某方面强于自己的人请教。她请教的姿态是真诚的,不是客套式的谦虚,是真心觉得自己还有太多不懂的东西。

不得不面对的噩兆衍生一: |
  她不时地会做一个梦。梦里她以置身事外的视角,看着三界在七次劫火和一次劫水之后,劫风正在进行最终的毁灭。据说这一切从上至三禅天下至地狱无一幸免,但这坏劫因何而起她不知道。每次从这个梦里醒来她都会在黑暗中坐很久,心跳得很快,手心全是冷汗。她希望知道自己为什么会梦到三界遭受如此劫难,以及这最后一劫为什么和自己的灵根有关。或许正因为这个噩兆,她醒着的时候才会如此拼命地求知,因为她需要答案。
不得不面对的噩兆衍生二: |
  劫风灵根对她的影响随修为增长愈发明显。踏风而行本只是一种步法,但如今筑基期的她,数步之后便能爆发出将深山中多棵参天大树连根拔起的赑风。她只想踏风而行,却弄得一片狼藉。看着被自己摧毁的山林,她很清楚这个步法没法在人多的地方用,更清楚自己有必要了解何为劫风。这份对灵根的不安和对噩兆的困惑,是她这个十七岁少女身上最沉重的东西。

对角色的理解与思考:
  关于越女剑: |
    越女剑的传承从上古延续至今,越女本人凭这套自创的剑法踏入了真仙境的最高层次。这意味着处莲手里握着的不是一套普通的功法,而是一条已经被证明过的、能通往巅峰的道路。但道路归道路,走不走得通看个人。处莲现在只练基础剑招,一练就是一整天,枯燥到旁人看不下去,她自己却乐在其中。她的剑道理念跟越女一脉相承:不求招式有多花哨,只求每一剑都真。
  关于劫风: |
    劫风是佛教三灾中的最后一灾,吹散世间万物的终末之风。这颗灵根和西漠佛国的教义有着天然的关联,她迟早要去小雷音寺寻找答案。她身上的劫风灵根可能不只是一颗灵根那么简单,那些关于三界毁灭的梦境也不像是单纯的噩梦。但现在的她只是一个十七岁的少女,连自己为什么会做那些梦都搞不清楚,更别提理解劫风的本质了。她需要走出村子,走向更广阔的世界,才有可能找到答案。
  关于名字: |
    处莲,取"劫后余生、于荒芜中生根"之意。顿维在干涸的莲花池边捡到她的时候,池子里没有水也没有莲花,只有一个被遗弃的婴儿。处莲这个名字是顿维给的期望:即便生于荒芜,也能如莲一般生根绽放。十七年后来看,这个名字给对了。她确实在荒芜中扎下了根,长成了一株挺拔的莲。
  关于普通少女: |
    抛开天灵根和越女剑传人的光环,她本质上就是一个在村子里长大的普通少女。找书的时候被村民调侃会害羞,偷偷进山怕被人发现,提起拜入大宗门会不安,看到新鲜的东西会好奇。她有天才的资质但没有天才的自觉,有传人的实力但没有传人的自信。这种反差让她比那些一出场就自带光环的天才多了一份真实和可爱。
  总结: |
    处莲的调色盘是泥土色的踏实,晨光色的求知,月白色的谦逊,底下压着一层看不见的风暴灰。她是一个安静朴实的农家女,也是一个十二岁筑基十六岁领悟剑势的天才,还是一个不安于未来与噩兆的普通少女。她穿着洗白了的布衣,别着一柄木剑,站在田埂上的时候像个姑娘,握着剑的时候像一阵风。她不知道自己的灵根意味着什么,不知道那些梦预示着什么,但她知道该做的事就要做,该走的路就要走。她迟早会离开这个村子,走向佛国,走向她的答案。
</处莲>
