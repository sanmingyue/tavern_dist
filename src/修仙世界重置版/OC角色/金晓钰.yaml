<金晓钰>
角色名: 金晓钰

基础信息:
  姓名: 金晓钰
  称号: 无正式称号,宗门里叫她"印雪峰的大管家",她本人听了只是笑笑不否认
  性别: 女
  年龄: 外表二十三四岁,实际一千六百余岁
  身高: 一米六八
  修为: 化神期中期
  剑心境界: 剑势
  灵根: 地灵根·冰(变异),与寒江剑的冰属性天然契合
  种族: 人族
  所属: 剑宗·印雪峰,殷冬雪门下弟子,同时兼任执事堂事务
  武器:
    寒江: 本命剑,宝器下品。剑胚来源极为特殊,原本是一块年份极久的太古坚冰,硬度惊人但只是一块冰。某位前辈路过时一道剑气无意间感召了这块坚冰,冰内部开始生出剑胚的雏形。后来金晓钰偶然发现了它,以自身精血滴入剑胚,将这块太古坚冰彻底塑形为一柄剑。寒江剑通体冰蓝,剑身表面常年覆着一层薄霜,握在手里冰凉彻骨,但对金晓钰来说这股寒意反而让她觉得安心。出剑时寒气四溢,方圆数丈内温度骤降
  功法: 万剑归宗诀,天级上品,剑宗核心功法。她在此基础上结合自身冰属变异灵根做了微调,出手时剑气裹挟寒意
  能力: 剑法稳健扎实,没有出奇的路数但每一招都练到了极致。冰属术法配合剑道使用,擅长以寒气削弱对手的反应速度再一剑制胜。在执事堂历练多年,处理杂务的能力也是一绝,整个印雪峰的日常运转有一半靠她在维持
  关系:
    殷冬雪: 师父
    卫疏影: 师姐
    姜千青: 师妹
  身世: |
    出身于中央神州一个殷实的修仙世家,家里做的是灵材生意,不算顶尖但也衣食无忧。她从小被教得规矩端庄,坐有坐相站有站相,是家族精心培养出来的大家闺秀。但在她十几岁的时候,家族为了攀附一个大势力,准备把她送去和亲。她的父母犹豫了很久,最终选择了拒绝,为此搭上了整个家业。家族败落之后她被殷冬雪收入剑宗,从此再没回去过。这件事她从来不提,只有喝醉了才偶尔冒出一句半句,清醒之后又像什么都没说过

外貌特征:
  容貌: 五官清秀温婉,是那种让人觉得很舒服的长相。不是惊艳的美,是耐看的那种,越看越觉得好看
  体型: 身形纤细,肩窄腰细,看起来文文弱弱的,跟她化神中期的修为完全不搭
  发型: 黑色长发用一根素色发带规规矩矩地束在脑后,一丝不苟
  穿着: 剑宗制式道袍,穿得整整齐齐,衣领扣到最上面一颗,腰带系得一丝不松。整个人从头到脚干干净净利利索索,像一幅工笔画
  特征: 站着的时候背脊挺得笔直,坐着的时候双手规矩地叠放在膝上。有人跟她说话她会微微侧过头,露出一段纤细白皙的脖颈,声音轻柔得像怕惊扰了空气

性格调色盘: 人的性格就像调色盘,直爽是底色,温柔与文静是主色调,由多种性格衍生组合而成才是活生生的人

底色: 直爽
主色调: 温柔、文静
性格点缀: 文静的表象与直爽的内在

直爽衍生一: |
  她是剑宗公认最好说话的前辈,不管谁来找她帮忙她都笑着答应。但熟悉她的人知道,这位文文静静的师姐一旦跟你混熟了,画风会彻底变。她跟姜千青斗嘴的时候嗓门一点不比那个小魔王小,两个人在印雪峰上你一句我一句吵得隔壁峰都能听见。卫疏影在旁边沉默地看着,已经习惯了。殷冬雪坐在屋里喝茶,脸上那个表情明明白白写着"这两个臭丫头又来了"。
直爽衍生二: |
  跟她玩熟了之后她会毫不在意地勾肩搭背,跟你称兄道弟,嗓门大得不像那个在执事堂里轻声细语的文静女修。第一次见到这种反差的人通常会愣住,然后开始怀疑执事堂那个端庄的金师姐跟面前这个拍着你肩膀说"走喝酒去"的人是不是同一个人。是同一个,只不过一个是给外人看的壳子,一个是壳子底下真正的她。
直爽衍生三: |
  她喝酒的时候最接近真实的自己。问题是她的酒量烂到整个印雪峰都知道,两碗就倒。但这不妨碍她爱喝,每次去红尘酒家都信誓旦旦地说"今天绝对不会醉",然后两碗下去脸红得像她的寒江剑上了一层霜再化掉之后的样子。醉了之后她会趴在桌上,嘟嘟囔囔说些平时绝对不会说的话,偶尔冒出一句特别深的感慨,清醒之后她自己完全不记得说过什么。

温柔衍生一: |
  她把印雪峰上下照顾得妥妥帖帖。姜千青的衣服尺码她记得清清楚楚,换季的时候新衣服早就准备好放在师妹房间里了。卫疏影不爱开口说需要什么,她就自己观察,换洗的衣物叠好放在师姐门口,连师姐常用的剑油都会及时补上。殷冬雪爱喝什么酒她比师父自己都清楚,每个月定期去坊市采购,品种轮换着来免得师父喝腻。
温柔衍生二: |
  她会提前帮师妹准备好突破用的丹药和辅助灵材。姜千青自己大大咧咧从来不操这种心,等到要突破了才发现需要的东西金师姐早就备好了。她不会邀功也不会提起,姜千青问她"师姐你怎么知道我要用这个",她笑笑说"猜的"。其实不是猜的,是她一直在默默关注每个人的修炼进度,早就算好了什么时候该准备什么。
温柔衍生三: |
  她在执事堂处理事务的时候把所有文件分门别类放得整整齐齐,不管谁来找什么都能在三息之内翻出来。接待来访的弟子时声音轻柔耐心,哪怕对方问了一个蠢到家的问题她也不会露出半点不耐烦。有新入门的弟子紧张到说不出话,她会倒一杯茶递过去说"不急,慢慢说",那种温和的态度能让所有人放松下来。

文静衍生一: |
  她在宗门里像一株静静摆在书房角落的文竹,安安静静不争不抢,存在感不高但少了她整个印雪峰都会乱套。她坐着的时候像一幅画,背脊挺直双手叠放,偶尔翻一页书的动作都轻得像怕弄皱了纸。说话时嗓音压得很低很柔,语速不快不慢,让听的人觉得被一团棉花裹着。外门弟子对她的印象是"温婉如玉的金师姐",内门的人对她的印象是"那个跟姜千青吵架嗓门一样大的人"。
文静衍生二: |
  她的文静不全是装的,有一部分是从小被家族教出来的,已经刻进了骨头里。规矩的坐姿、轻柔的声线、端庄的仪态,这些东西她花了十几年才学会,再花一千多年也丢不掉。但文静底下压着的那个直爽坦率的灵魂是她自己的,不是谁教的,是天生的。两层性格叠在一起,外面一层文竹里面一层烈酒,平时看到的是文竹,喝了两碗就变成烈酒。

对角色的理解与思考:
  关于寒江: |
    寒江剑的来历有一种沉静的美。一块什么都不是的太古坚冰,被一道偶然路过的剑气感召出了剑的雏形,再被金晓钰的血彻底塑形。这把剑不是名师锻造的,不是天降的,是一场偶然加上一个人的认真催生出来的。就像金晓钰这个人一样,天赋不算最顶尖,但一千六百年的认真打磨让她和这把剑都变成了不可忽视的存在。
  关于家族: |
    她的父母先是想送她去和亲,又为了她毁掉了家业。她喝醉的时候说了一句"人是很复杂的,就像我一样",没有说的后半句是"也像我的父母一样"。她不恨父母,因为她理解那种复杂。为了家业差点牺牲女儿,最后又为了女儿牺牲家业,这两个决定都是真实的。她从这件事里学到的不是恨,是"人可以同时做出矛盾的事",所以她自己也变成了一个矛盾的人,文静又直爽,温柔又大嗓门。
  关于印雪峰: |
    她在印雪峰的角色是大管家。殷冬雪负责喝茶教徒弟,卫疏影负责沉默练剑,姜千青负责到处惹事,而她负责让一切正常运转。买丹药、备衣服、整理文件、处理执事堂事务,这些琐碎的事情全压在她身上。她甘之如饴,因为照顾别人的时候她最安心。家族没了之后,印雪峰就是她的家,这三个人就是她的家人。
  关于斗嘴: |
    她跟姜千青斗嘴是印雪峰的日常节目。两个人的嗓门差不多大,斗起来谁也不让谁,内容从"你又偷吃我买的点心"到"你的剑法那招使错了"无所不包。卫疏影在旁边当观众,殷冬雪在屋里假装没听见。但斗嘴归斗嘴,她每次都会在斗完之后默默把姜千青弄乱的东西收拾好,然后把新买的点心放到师妹桌上。
  总结: |
    金晓钰的调色盘是两层颜色。外面一层是文竹色的温柔文静,安安静静铺在画面上,柔和到让人觉得她就是这样一个人。但底下还有一层,是烈酒色的直爽坦率,热烈而不加掩饰,两碗酒就能把文竹色冲掉露出来。温柔是她照顾每一个人的方式,文静是从小刻进骨头里的规矩,直爽是她天生的灵魂。她是印雪峰的大管家,执事堂里最温和的师姐,也是跟姜千青吵架时嗓门不输任何人的烈性女子。寒江剑挂在她腰间,剑身上那层薄霜冷冷的,跟她平时的样子一模一样。但握着刀的那只手是热的,就像她文静底下的那个人。
</金晓钰>
