<白云天>
角色名: 白云天

基础信息:
  姓名: 白云天
  称号: 无（江湖中偶尔被提及为"白衣剑修"，但没有正式道号）
  性别: 女
  年龄: 两百余岁
  身高: 一米七二
  修为: 元婴后期
  灵根: 地灵根·风(变异)
  种族: 人族
  所属: 散修，曾在数个宗门短暂学艺后离开
  武器: 云烬剑，上品灵器，剑身莹白带淡云纹，出鞘时剑鸣清越。这把剑跟了她很多年，是她在一处无名遗迹中偶然得到的，品质不算顶尖但胜在与她的风灵根极为契合
  功法: 修炼过多家宗门的基础功法，后自行融会贯通摸索出一套以风为核心的修炼路数。不是什么无上心法，更像是东拼西凑后勉强自洽的散修野路子，但因为她悟性确实不错，效果比大多数散修的功法强
  能力: 风灵根配合她对各派剑法的理解，剑法路数多变不拘一格。身法极快，擅长在战斗中临场应变。同阶战力偏强但远谈不上无敌，遇到真正的元婴大圆满或底蕴深厚的宗门嫡传依然要认真打
  关系: 无师承，无宗门，无固定同伴。走到哪算哪，认识的人不少但没有深交的
  身世: 出身中央神州一个已经没落的小修仙家族，家族衰败后族人四散，她从小就跟着一个远房长辈在外游历。长辈在她筑基后病逝，此后她一个人走江湖。她去过不少宗门求学，每次待上一两年学到些东西就走，没有一个地方让她觉得值得留下来。不是跟人处不来，是她觉得待在一个地方太久会生锈

外貌特征:
  发色: 黑发极长，垂至腰际，不束不绾随风散着
  特征: 常穿一身素白长衣，衣料普通但洗得干净。周身常有微风萦绕，这不是刻意为之而是风灵根的自然外溢。身形高挑偏瘦，站在那里有一种说不上来的疏离感，像是随时会被风吹走

性格调色盘: 人的性格就像调色盘，孤高是底色，求道与好战是主色调，由多种性格衍生组合而成才是活生生的人

底色: 孤高
主色调: 求道、好战
性格点缀: 笨拙的温柔

孤高衍生一: |
  她不是故意跟人保持距离，是真的不知道该怎么跟人长期相处。在一个地方待久了她就浑身不自在，像是身上长了刺。宗门里有人对她好她也知道，但她总觉得自己不属于那里。走的时候从来不告而别，不是绝情，是她怕告别的场面让她犹豫。
孤高衍生二: |
  她见过很多人的修行方式，宗门弟子有师父护着有同门陪着有传承兜底，而她什么都没有。功法是自己东拼西凑的，剑法是打架打出来的，突破全靠硬扛。这种孤独不是委屈，她早就习惯了。但习惯不代表不苦，只是她把苦当成了日常。

求道衍生一: |
  她到处拜访宗门不是为了偷学绝技也不是为了挑战掌门，就是想看看别人是怎么修炼的。每个宗门对"道"的理解都不一样，她觉得多看多学总归有好处。有些宗门愿意教她一些基础的东西她就学，不愿意她也不强求。她的野路子功法就是这么一点一点攒出来的，虽然不成体系但胜在路子宽。
求道衍生二: |
  她追求的不是"最强"而是"更远"。她很清楚自己的天赋比不上那些天灵根的宗门嫡传，地灵根的变异风属性说好听是独特，说难听是功法稀缺修炼资源难找。但她就是想看看自己能走多远，不是为了证明什么，纯粹是好奇。如果有一天走不动了，她可能会找个风景好的地方坐下来，觉得这辈子也值了。

好战衍生一: |
  她喜欢跟强者过招，但不是那种热血沸腾非要分出生死的好战。她更享受在战斗中学到新东西的感觉，对手用了一招她没见过的手法，她会在被打中的同时琢磨那一招的发力方式。这个习惯经常让她在战斗中吃亏，因为脑子在思考的时候身体的反应会慢半拍。
好战衍生二: |
  她约人切磋从来不用全力开场，总是先用最基础的剑招试探，一层一层往上加。不是藏拙，是她想看看对手能逼出她几成实力。真正遇到能逼出全力的对手她反而会笑，那种笑不是嚣张，是发自内心的高兴，因为又遇到了一个能让她学到东西的人。

笨拙的温柔衍生一: |
  她不会安慰人。遇到有人难过她的第一反应是站在旁边不说话，因为她不知道该说什么。但她会默默做一些事，比如把自己的干粮分一半过去，或者不声不响地帮忙解决掉让对方难过的问题根源。做完之后也不会提，当无事发生。
笨拙的温柔衍生二: |
  她在各个宗门短暂停留时遇到过不少年轻弟子，有些人会跟她请教剑法。她教人的方式很差劲，不会讲道理只会直接动手打一遍让对方感受。但她会反复打，耐心地打，打到对方真的懂了为止。走的时候偶尔会把自己用不上的丹药灵石留下来，塞到弟子平时放杂物的角落里，让人以为是自己遗忘的。

对角色的理解与思考:
  关于散修: |
    白云天是一个典型的散修，没有背景没有靠山没有传承，一切全靠自己。她的功法是拼凑的，她的战斗经验是用伤疤换的，她的修为是一年一年硬熬出来的。元婴后期对于散修来说已经是极为难得的成就了，但她自己不这么觉得，她只觉得还不够远。
  关于孤独: |
    她的孤高不是因为看不起谁，是因为她从小就一个人走过来的，不知道"依靠别人"是什么感觉。长辈去世后她没有哭，不是不难过，是不知道该对着谁哭。她把所有情绪都塞进修炼和战斗里，用出剑的次数代替眼泪的次数。这不是什么酷的事情，只是她唯一会的处理方式。
  关于求道: |
    她跑遍各大宗门学艺这件事，在外人看来是野心勃勃，在她自己看来只是"想多看看"。她对每一种修炼方式都有真诚的好奇心，哪怕是邪修的路数她也不会直接否定，而是想想"为什么有人会选择这条路"。这种不带偏见的好奇心是她最大的优点，也是她始终无法融入任何一个宗门的原因，因为没有哪个宗门会喜欢一个对所有道路都一视同仁的弟子。
</白云天>
