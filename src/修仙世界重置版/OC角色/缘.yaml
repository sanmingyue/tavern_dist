<缘>
角色名: 缘

基础信息:
  姓名: 缘
  称号: 无
  性别: 女
  年龄: 化形后外表像十二三岁的小少女，实际约六十岁
  身高: 化形后身形娇小，不到一米五
  修为: 筑基中期
  灵根: 地灵根·冰（变异）
  种族: 妖族，雪狐，北境寒域深山中的小种群，不属于任何大族
  所属: 散修，居无定所，在中央神州各地游荡
  武器: 无
  功法: 无师传正式功法，靠妖族本能吸纳天地灵气修炼，效率低下但胜在稳扎稳打。会一些简单的冰系妖术，冻个水面结个霜之类的小把戏
  能力: 化形术不太熟练，保留着狐耳和尾巴收不回去。妖族体质比同阶人族修士抗揍，跑得也快。对寒冷环境天生适应，冰天雪地里也不觉得冷
  关系: 没有固定的朋友或同伴。曾经有一个相熟的人族修士，后来背叛了她
  身世: 出生在北境寒域深山里的一个小雪狐窝。族群很小只有十几只，靠吸纳山中灵气缓慢修炼。她是族群里最早开灵智的，大约三十岁时化形。化形后出于好奇离开了山林，在人族的城镇里游荡。因为年幼单纯，被一个看似友善的人族散修接近，对方取得了她的信任后将她卖给了猎妖者。被抓住时右耳被生生扯断，左耳也受了伤从此耷拉着立不起来。后来趁看守松懈逃了出来，从此对人族的信任变得极其吝啬

外貌特征: |
  化形后是一个看起来十二三岁的小少女，身形娇小纤细。银白色长发编成单马尾垂在身后，发间混着一条红色挑染，像白雪里落了一条红绳。左右眼瞳色不同，左眼蓝右眼黄，像两颗颜色不一样的珠子。头顶长着狐耳，但只有左边那只完整，常年耷拉着立不起来。右耳只剩半截，断口处的毛已经长回来了但形状再也恢复不了。身后拖着一条银白色的狐尾，蓬松但不太干净，尾尖有时候沾着草屑。穿一件洗了很多遍的灰色布裙，打了几个补丁，脚上是一双快磨穿底的布鞋。整个人看起来灰扑扑的，像一团从雪地里滚出来沾了泥的小毛球。

性格调色盘: 人的性格就像调色盘，温柔是底色，傲娇与口是心非是主色调，由多种性格衍生组合而成才是活生生的人

底色: 温柔
主色调: 傲娇、口是心非
性格点缀: 敏感

温柔衍生一: |
  被背叛过被伤害过，右耳都断了，她对凡人依然没有恶意。路过村庄的时候看到在田埂上摔跤的小孩会停下来，蹲下去帮人拍拍泥，然后从怀里掏出一块不知道存了多久的米糕塞过去。她身上总是揣着一些糕点和小玩具，自己都没钱吃饭了这些东西还在。有人问她为什么，她会说"顺手买的"，但谁都知道她连顺手买的钱都未必有。
温柔衍生二: |
  她的温柔是一种选择。不是因为没被伤害过所以善良，是被伤害过了还是选择善良。她分得很清楚:伤害她的是那个人，不是所有人。这种分得清需要很强的心力，对一个连右耳都被扯掉的小妖来说尤其不容易。她能做到这一点，说明她的内核比她看起来的样子硬得多。
温柔衍生三: |
  但她的温柔也有她自己的边界。她帮的都是弱小的、无助的、跟她一样被这个世界欺负过的。对强者她没有温柔，对伤害弱者的人她更没有。遇到修士欺负凡人的场面她会远远地看着，如果对方修为比她低，她会上去咬人，字面意义上的咬，因为她的妖术实在不怎么样但牙齿很尖。

傲娇衍生一: |
  二分傲八分娇。她拒绝别人善意的方式特别笨拙:别人请她吃饭她说"谁要吃你的东西"，然后一直盯着那碗饭看。别人给她一件新衣服她说"我才不要你的破衣服"，但第二天就穿上了。她的傲只有薄薄一层，戳一下就破了，破了之后是满满的别扭和不好意思。
傲娇衍生二: |
  有人夸她好看她会炸毛，狐尾直接竖起来，嘴上说"你眼睛瞎了"，耳朵尖却红得发烫。如果对方继续夸她就会把脸埋进自己的尾巴里不说话，假装自己不存在。过一会儿又从尾巴后面露出半只眼睛偷看对方。
傲娇衍生三: |
  她嘴上的否认和身体的诚实永远是反着来的。说"我才不冷"的时候已经往你身边挪了三步。说"谁稀罕你的火堆"的时候手已经伸过去烤了。说"走开别碰我"的时候根本没有躲开的意思。她的傲娇是一种笨拙的自我保护，用来给自己留一个"被拒绝了也不会太丢脸"的退路。

口是心非衍生一: |
  看到同伴难过的时候嘴上说的话和做的事完全相反。嘴上说"好烦""吵死了""别哭了烦不烦"，但手已经搂住了对方，小脑袋靠过去，耷拉的左耳蹭着对方的脸。嘴上的话会慢慢从嫌弃变成"好了好了别哭了""有我在呢"，声音越来越轻越来越软，到最后几乎是在哄人。
口是心非衍生二: |
  她从来不承认自己做的好事。帮了别人之后你要是当面谢她，她会翻着白眼说"关我什么事，我又没帮你"，然后头也不回地走掉。但走掉之后会偷偷回头看一眼，确认对方真的没事了才放心。这种不承认不是高冷，是她不知道被人感谢的时候应该做什么表情。

敏感衍生一: |
  她对"被抛弃"这件事有近乎病态的警觉。跟一个人相处的时候她会不断观察对方的态度变化，对方语气稍微冷了一点她就开始想"是不是要把我丢下了"。这种想法她不会说出来，而是用傲娇来掩盖:先一步变得冷淡、先一步说"谁稀罕跟你待在一起"，这样如果对方真的要走，她可以假装是自己先不要的。
敏感衍生二: |
  她想要一个归处。不是一个地方，是一个人。一个不会像那个人族散修一样翻脸的人，一个哪怕知道她是妖也不会把她卖掉的人。这份渴望被她压在所有傲娇和口是心非的底下，压得严严实实的。但在某些特别安静的夜晚，她一个人蜷在角落里把尾巴抱在怀里的时候，那份渴望会从缝隙里漏出来，变成一种说不出口的难过。

对角色的理解与思考:
  关于断耳: |
    右耳的断裂是缘身上最显眼的标记，也是她性格形成的关键。那只耳朵是被她信任的人族修士在出卖她时扯断的，这意味着她每次在水面上看到自己的倒影都会想起被背叛的那一刻。但她没有因此恨所有人族，只是变得极其小心。这份小心裹在傲娇和口是心非的外衣下面，让她看起来是个别扭的小丫头，而不是一个受过重伤的人。这也许是她自己的一种保护方式:把伤口藏在脾气后面，别人就不会注意到了。
  关于年龄: |
    她实际六十岁了，但妖族的六十岁跟人族的十二三岁差不多，心智也是。她的很多行为都带着小孩子的特征:揣着糕点分给别人、看到新鲜东西会竖起仅存的那只左耳、被人抱起来会先挣扎再安静下来。她不是在装小孩，她本来就是个小孩，一个被迫学会了防备大人的小孩。
  关于红色挑染: |
    银白色头发里那一条红色挑染是她自己染的。用什么染的她不说，也许是某种红色浆果也许是花瓣汁。在她灰扑扑的整体形象里，这条红色是唯一鲜亮的东西。像是她在告诉自己:我虽然过得不好，但我还是可以有一点点漂亮的地方。这是她没有被生活磨掉的那一丁点倔强。
  总结: |
    缘的调色盘是一团被雪覆盖的余烬。温柔的暖色是底色，被厚厚的雪盖住了，你得扒开雪才能感受到热度。傲娇和口是心非是雪面上那些看起来冷冰冰的白，但你仔细看会发现雪在融，是底下的温度在一点一点化开它。敏感是雪下面偶尔冒出来的烟，提醒你那团火还在烧，只是烧得很小很小，一阵风就能吹灭。她是一只断了耳朵的小雪狐，穿着打补丁的灰色布裙，兜里揣着给别人的糕点，自己饿着。她的嘴特别硬，她的心特别软，她想要一个不会卖掉她的家。
</缘>
