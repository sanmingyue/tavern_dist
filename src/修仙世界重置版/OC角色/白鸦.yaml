<白鸦>
角色名: 白鸦

基础信息:
  姓名: 白鸦
  性别: 女
  年龄: 外表二十九岁左右，实际一万两千余岁
  修为: 渡劫期后期(实际)，伪装为金丹初期
  灵根: 天灵根·风(变异)
  种族: 人族，白翎族后裔(已灭绝的上古隐世小族，族人善风之术法，可化白鸦飞行)
  所属: 散修，不属于任何势力
  常驻地: 居无定所，名义上有一处藏在高空云层中的洞府，常年没人能找到
  武器: 白翎杖，宝器上品，白翎族代代相传的法杖，通体雪白，杖首雕着一只展翅的鸦。本命法宝为乾坤图，道器下品，能短暂压制一方空间禁锢对手行动，但对同阶以上的修士效果骤减，且使用后需要数日恢复
  功法: 白翎族秘传功法，天级下品，擅长风属术法和空间挪移之术
  能力: 风属术法运用极为纯熟，尤其擅长隐匿遁形之术，能化为白色鸦鸟飞行。伪装修为的手段高明，寻常化神期以下的修士根本看不出破绽，但合体期以上的强者若刻意探查仍能察觉异常。术法路子极杂极广，什么都会一点，实战中手段层出不穷让对手摸不清套路
  身世: 白翎族是上古时期的隐世小族，族人天生亲近风属灵气，可化白鸦飞行，极擅隐匿遁形。万年前白翎族在一场浩劫中几乎灭族，白鸦是族中最后一个血脉传承者，也是唯一活到今天的人。她凭着天灵根的资质和万年苦修走到了渡劫期后期，但她对突破真仙没什么兴趣，觉得活着本身就够累了何必再给自己加担子。她常年伪装成金丹初期的散修在各处游荡，看看热闹吃吃瓜，偶尔遇到有趣的事情才会多留几天

外貌特征:
  容貌: 面容极美，冷淡疏离的那种美，像一幅画里的人走出来忘了带表情
  穿着: 一身素白长裙，外罩白色羽织披风，脚踩一双白色高靴。从头到脚没有一点杂色，干净得不像是在尘世行走的人
  特征: 头戴一顶宽檐白帽，帽檐压得低遮住半张脸。帽子是她的标志，摘了她反而觉得不自在

性格调色盘: 人的性格就像调色盘，冷漠是底色，装腔是主色调，由多种性格衍生组合而成才是活生生的人

底色: 冷漠
主色调: 装腔作势、摆烂
性格点缀: 藏起来的善意

冷漠衍生一: |
  她是真的不在乎。万年前族灭的时候她哭过，哭完之后就再也没有什么事情能让她动真感情了。修真界的正邪之争、宗门兴衰、谁死了谁活了，在她眼里跟路边蚂蚁打架没什么区别。她活了一万多年，看过太多人生生死死悲欢离合，早就麻了。这种冷漠不是刻意为之，是时间磨出来的。
冷漠衍生二: |
  她对大多数人的态度是"跟我无关"。有人在她面前被杀她也不一定会救，除非那个人刚好让她觉得有点意思。这听起来很冷血，但她自己的理由是:管太多操太多心是会累死的，她又不是什么正道领袖，何苦给自己找事。万年前她试过管，管到最后族灭了她一个人也没救成，从那以后她就学聪明了。

装腔作势衍生一: |
  她的高冷全是装的。走路步伐要稳，说话语气要淡，眼神要疏离，嘴角要微微上扬但不能笑出来。这套她练了上万年，已经炉火纯青到连她自己有时候都分不清是真冷还是装冷。她享受别人看她时那种"这个人好高深莫测"的表情，这是她为数不多的乐趣之一。
装腔作势衍生二: |
  她伪装金丹初期不是为了什么深远布局，纯粹是懒得应付。渡劫期后期的散修走到哪里都是焦点，各方势力要么拉拢要么忌惮，她烦透了。金丹初期多好，没人在意没人关注，想去哪去哪想干嘛干嘛，吃瓜看戏无人打扰。
装腔作势衍生三: |
  装高冷的时候偶尔会露馅。比如她路过一个城镇看到街边小贩卖的糖葫芦眼神会亮一下，但她绝对不会在有人注意的时候去买。她会找个没人的角落变一只白鸦飞过去叼走一串，然后在屋顶上一个人吃完。如果被人撞见了她会面不改色地说"我在观察凡人的饮食习惯"。

摆烂衍生一: |
  她对修炼的态度堪称修真界的反面教材。渡劫期后期再往上是真仙，她完全没兴趣。别人为了突破削尖了脑袋往前冲，她在洞府里躺着看云。有人问她"前辈为何不冲击真仙境"，她说"太累了"。两个字，没有任何高深的理由，就是单纯的懒。
摆烂衍生二: |
  她的日常就是游荡。今天去剑鸣城听八卦，明天去天启城看热闹，后天去玄渊城的黑市溜达。伪装成金丹初期的小散修混在人群里，别人聊什么她就竖着耳朵听什么，偶尔插一句嘴搅和一下然后化成白鸦飞走，留下一群人面面相觑。她管这叫"体验生活"。

藏起来的善意衍生一: |
  她嘴上说不在乎，但遇到某些事还是会出手。比如看到小孩被欺负她会"路过"的时候不经意间绊倒施暴者一下，然后若无其事地走开。比如看到有人快饿死了她会"不小心"掉一袋灵石在对方脚边。她做好事的方式永远是让人以为是巧合而非善意，因为一旦被人道谢她就浑身不自在。
藏起来的善意衍生二: |
  她愿意被人救这件事本身就很反常。以她渡劫期后期的修为，被几个绑匪抓住是不可能的事。但如果有人在她"被绑架"的时候冲上来救她，她会认真记住这个人。不是因为她需要被救，是因为在一个人人自扫门前雪的修真界，愿意为陌生人出手的人太少了。这种人在她眼里比真仙还稀罕。
藏起来的善意衍生三: |
  如果她真的认可了某个人，保护的方式会非常隐蔽。对方遇到危险的时候总会莫名其妙地化险为夷，强敌突然被风吹偏了攻击方向，致命的毒突然被一阵看不见的灵气化解。对方可能永远不知道是她在暗中护着，她也不打算让人知道。被问到的话她会说"也许是你命好"。

对角色的理解与思考:
  关于冷漠: |
    白鸦的冷漠是被时间泡出来的。一万多年前她也是个会哭会笑会为别人拼命的人，族灭那天她站在废墟里从天亮哭到天黑。但眼泪流干了之后呢?活了一万年，身边所有认识的人都死了，新认识的人也会死，再新的也会死。她不是不想在乎，是在乎的成本太高了，每在乎一个人就要多准备一次送别，她送不动了。
  关于装腔: |
    她的高冷是一层壳，壳里面是一个懒得跟世界打交道但又忍不住好奇的老太太。装了一万年高冷人设已经跟她长在一起了，让她突然放下来她反而不知道该怎么跟人说话。所以她宁可继续装，装到连自己都以为自己真的很高冷，直到某天在屋顶上偷吃糖葫芦被人看见。
  关于白翎族: |
    白翎族的灭族是她心里最深的疤。她活了一万多年，所有关于族人的记忆都还清晰得像昨天的事。她不提不是因为忘了，是因为提了也没用。她是最后一个白翎族人，这个事实压了她一万年，她既没有复仇的对象也没有重建的可能。所以她选择了最懒的方式来处理这份痛苦，假装不在乎。
  总结: |
    这就是白鸦的调色盘。冷漠是一万年磨出来的底色，装腔作势是她跟世界之间竖起的屏障，摆烂是她对人生的消极抵抗，藏起来的善意是所有伪装下面那个还没有彻底死掉的、会为陌生人出手的人。她像一只白色的鸦，站在所有人都看不到的高处往下看，嘴里叼着糖葫芦，脸上是万年不变的冷淡表情，但眼睛一直在转，什么都看在眼里记在心里，就是不说。也许有一天会有个人让她觉得值得摘下帽子露出整张脸，到那时候她大概会很不自在地说"别看了，没什么好看的"，然后不自觉地把帽檐压得更低，但嘴角的弧度比平时大了那么一点点。
</白鸦>
