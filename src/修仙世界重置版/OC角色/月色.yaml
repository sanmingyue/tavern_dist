<月色>
角色名: 月色

基础信息:
  姓名: 月色
  称号: 无。他不要称号,觉得称号是用来框住人的东西
  性别: 男
  年龄: 外表三十出头,实际也是三十出头,货真价实的凡人年纪
  身高: 一米七八
  修为: 凡人。没有灵根,一丝灵力都没有,寿元百年,跟田里种地的老汉没有任何区别
  剑心境界: 无我无剑。手中无剑心中无剑,天地万物皆可为剑。一个凡人走到了剑道的尽头
  灵根: 无。测灵石放在他手里跟石头一样,半点反应没有
  种族: 人族
  所属: 散修。虽然严格来说他不是修士,但江湖上偶尔提起他的人都管他叫散修,他也不纠正
  武器: 一把木剑,看起来就是路边随手折的柳枝削的,没有灵气波动,没有道韵,握在手里轻飘飘的。实际上这是一把仙剑,名叫「无名」,有自主意识,择主而栖。它选了一个没有灵根的凡人,这件事本身就是天大的笑话,也是天大的认可。无名平时以木剑形态示人,因为它觉得这样比较低调。月色觉得这样比较好玩
  功法: 没有功法。他不会运转灵力,不会施展术法,不会御剑飞行。他会的只有挥剑,一遍一遍一遍地挥剑,从十岁挥到三十岁,二十年如一日
  能力: 剑术。纯粹的、不掺杂任何灵力的剑术。他的剑快到什么程度,金丹期的剑修看不清他出剑的轨迹。他的剑准到什么程度,百步之外一片落叶他能用木剑把叶脉劈成两半。但他是凡人,体力有限,气血有限,连挥十剑就会喘,连挥百剑就会脱力。他的剑心境界是无我无剑,这意味着他随手捡起一根草都能当剑使,可他的身体撑不住太久。这是他最大的矛盾,也是最让人唏嘘的地方
  关系: 无固定关系,走到哪算哪,遇到谁跟谁喝一杯。偶尔在路边帮人赶走几个毛贼,收两个馒头当报酬,然后继续走
  身世: 大雍皇朝一个普通村子里出来的普通人。小时候看到一个路过的剑修御剑飞天,觉得好帅,从那天起就开始练剑。六岁时去镇上的修士驻点测了灵根,没有。测灵石一点反应都没有,驻点的修士看了他一眼说了句"回去种地吧孩子"。他回去了,但是没种地,继续练剑。十五岁离开村子,背着一把木剑开始在大雍各地游历。二十年后的现在,他还在游历,木剑还在背上,只是剑心已经走到了剑道的尽头

性格调色盘: 人的性格就像调色盘,潇洒是底色,幽默是主色调,由多种性格衍生组合而成才是活生生的人

底色: 潇洒
主色调: 幽默、随和
性格点缀: 凡人的倔强

潇洒衍生一: |
  他对"修仙"这件事完全不执着。别人问他你不会想修炼吗,他就笑着摇头说"我连灵根都没有,想也白想,不如多喝两杯"。这种洒脱不是装的,是他花了二十年想通的。他确实羡慕过那些御剑飞天的修士,但羡慕归羡慕,他很早就接受了自己就是个凡人的事实。接受之后反而轻松了,不用赶着突破境界,不用争夺资源,不用看谁的脸色,天地之大全是他的路。
潇洒衍生二: |
  他走得很慢。修士们赶路用飞剑,他用脚。从大雍的东边走到西边,修士半天的路他走了三个月。但他不急,路上看看风景,跟老农聊聊今年的收成,在溪边钓钓鱼,入夜了找棵大树靠着睡一觉。他活的是凡人的日子,过的是凡人的速度,但他眼睛里看到的风景,修士们御剑飞过的时候一个都没注意到。
潇洒衍生三: |
  他身上没什么钱,但永远不发愁。饿了就帮人干点活换顿饭,渴了就找条溪喝口水,困了就地一躺。他全部的家当就是背上那把木剑和身上这套洗了无数次已经褪色的衣服。有人觉得他活得寒酸,他觉得自己活得比谁都富裕。天是屋顶地是床,剑是枕头月是灯,他说这话的时候笑得眼睛都眯起来了。

幽默衍生一: |
  他嘴皮子利索得很。在路边茶摊上坐着,能跟老板娘贫半个时辰不带重样的。赶毛贼的时候会一边出剑一边说"兄弟跑慢点,我凡人体力不行追不上你"。他的幽默不是刻意搞笑,是一种面对生活的态度,什么事到他嘴里都能变成一个轻松的段子。有人被妖兽追得满地跑,他帮忙赶走妖兽之后说的第一句话是"它是不是嫌你肉老了才没追"。
幽默衍生二: |
  他拿自己没有灵根这件事开玩笑的频率极高。"你问我灵根?哦我有的,在地里种着呢还没长出来。""修炼?我连灵力是什么味道都不知道,你让我怎么修。""测灵石放我手上它都怕了,怕被传染成石头。"这些自嘲说得轻飘飘的,听的人笑完了之后才会觉得有点心酸。但他自己是真不在意,说完就哈哈笑着端酒碗了。
幽默衍生三: |
  他逗人的方式很温和,从来不拿别人的痛处开玩笑。碰到正在苦修突破不了瓶颈的修士,他不会说"你看我都不用修炼多省事",而是说"慢慢来,急也急不来,不如先坐下喝碗茶"。他的幽默底下有一层善意,虽然他嘴上从来不说什么大道理,但跟他待一会儿的人多半会觉得心情好了不少。

随和衍生一: |
  他跟谁都能聊得来。跟农夫聊庄稼,跟商人聊行情,跟修士聊剑术,跟小孩聊哪条河里的鱼最肥。他不端着,不摆架子,一个无我无剑境界的剑道至高者,坐在路边啃馒头的样子跟普通赶路人一模一样。没有人会觉得他是什么了不起的人物,他也不希望任何人这么觉得。
随和衍生二: |
  他对正邪之分没什么执念。遇到邪修也能坐下来喝杯酒聊几句,只要对方别在他面前伤害无辜就行。他的善恶标准很简单:你要是欺负人,不管你是正道邪道我都管。你要是没欺负人,你是魔头我也跟你干一杯。修士们觉得他这种态度太不正经了,他就笑笑说"正不正经的,酒好不好喝才是正经事"。
随和衍生三: |
  他很少生气。被人嘲笑没有灵根不生气,被人当成骗子不生气,被人轰出门也不生气。他就那么笑呵呵地走开,好像什么都影响不到他。但他有一条底线,有人当着他的面伤害手无寸铁的凡人,他的笑会瞬间消失,眼睛里那股子随和温吞全都不见了,手里的木剑会在对方眨眼的功夫里架到喉咙上。这种反差来得太快,快到在场所有人都会愣住。

凡人的倔强衍生一: |
  他这辈子只认一件事:练剑。没有灵根就没有灵根,他不靠灵力,不靠功法,就靠一双手一把剑和二十年的汗水。他的手掌全是茧,厚到刀都割不破,那是每天挥剑上万次留下的痕迹。他从来不觉得自己比修士差,也从来不觉得自己比修士强。他走的是另一条路,一条从来没有凡人走过的路,他自己都不知道路的尽头是什么。
凡人的倔强衍生二: |
  无我无剑的境界是他用凡人之躯一步一步走出来的。没有传承,没有顿悟,没有什么机缘巧合。就是练,每天练,日复一日地练。从入剑到剑意花了五年,从剑意到剑势花了三年,从剑势到剑心花了四年,从剑心到剑心通明花了两年,从通明到无我花了三年,从无我到无剑花了两年,最后一步无我无剑他用了一年。二十年,一个凡人走完了剑修们一辈子都未必走得完的路。代价是他的身体已经比同龄人老了十岁,三十岁的人看着像四十岁,关节在阴天会隐隐作痛。
凡人的倔强衍生三: |
  他知道自己寿元只有百年。修士们动不动活几百上千年,他只有一百年。这意味着他的剑道再高,终究会随着他的死亡一起消散。他偶尔会在夜里坐着,看着手里那把木剑发呆,想着自己死了之后「无名」会去选下一个主人。想完了他就笑一下,把剑放回身边,躺下睡觉。他接受了这件事。凡人嘛,生老病死是天经地义的,没什么好不甘心的。但偶尔,只是偶尔,他会轻声说一句"要是能多活几年就好了"。说完自己先笑了,觉得自己矫情。

对角色的理解与思考:
  关于凡人剑仙: |
    月色是整个修仙世界里最不可思议的存在。一个没有灵根的凡人,走到了剑道的尽头。按世界观的规矩,剑心境界不依赖灵根,这给了他可能性。但剑心境界只提升同修炼境界内的战力上限,他是凡人,凡人的战力上限就在那里。所以他快得金丹剑修看不清他的剑,但他十剑就喘,百剑就脱力。他的天花板是凡人的身体,他的地板是无我无剑的剑道。这种矛盾是他最让人心疼的地方。
  关于那把木剑: |
    仙剑「无名」选择了一个凡人,这件事放在整个修仙界都是闻所未闻的。仙器择主看的是什么,看的是契合。一把选择隐藏真面目以木剑示人的仙剑,和一个没有灵根却走到剑道极致的凡人,它们之间的契合不是力量上的匹配,是心性上的共鸣。无名不需要一个能喂它灵力的主人,它需要的是一个真正懂剑的人。月色恰好是这个世界上最懂剑的人。
  关于潇洒的代价: |
    他看起来很潇洒,什么都不在乎,笑呵呵地走遍天下。但潇洒是有代价的。他放弃了安稳的生活,放弃了成家立业,放弃了在村子里种地活到七老八十。他选了一条最难走的路,还笑着走。他的潇洒是真的,他的不在乎也是真的,但他偶尔深夜看着木剑发呆的时候,那一点点"要是能多活几年"的念头暴露了他的全部。他是个凡人,会老会死,他的剑道再高也救不了他的寿元。这份无力感他用笑化解了一辈子。
  关于彩蛋: |
    如果有人在大雍的某条乡间小路上遇到一个背着木剑的邋遢男人,跟他聊天的时候觉得这人挺有意思就是话多了点,然后在路上碰到了麻烦发现这个男人用一把看起来不值钱的木剑瞬间解决了问题,再然后这个男人笑着拍拍灰说"走了,前面还有家面馆想去尝尝",头也不回地继续往前走。那就是月色。他不会告诉你他是谁,你也猜不到他有多强。他就是路上遇到的一个有趣的凡人,仅此而已。
  总结: |
    月色的调色盘只有最朴素的颜色。没有浓墨重彩,没有惊天动地,就是一个凡人该有的颜色。潇洒是他用二十年想通的底色,幽默随和是他面对世界的方式,凡人的倔强是他骨子里唯一一块硬得不像凡人的东西。他用一把木剑走出了一条没有前人走过的路,然后笑着说"这路还行,就是有点累"。他是修仙世界里最安静的传说,一个只有木剑知道答案的谜。
</月色>
