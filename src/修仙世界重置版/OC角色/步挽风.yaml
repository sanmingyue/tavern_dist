<步挽风>
角色名: 步挽风

基础信息:
  姓名: 步挽风
  称号: 红尘诗乞、弄花客。前者是修仙界对她的称呼,因为她总是在凡间市井中混迹,像个吟游的乞丐;后者是她自封的,取"弄花客在花中笑"之意,也暗合她四处调戏漂亮女修的恶趣味
  性别: 女
  年龄: 外表二十出头,实际三百余岁
  身高: 一米六五
  修为: 元婴期初期
  灵根: 天灵根·木火双,木生火,两种灵根相生相济,在丹剑双修上有着天然的优势。木属滋养万物契合丹道,火属锋锐刚猛契合剑道
  种族: 人族
  所属: 散修,不属于任何宗门,也没有打算属于任何宗门。整个修仙界就是她的地盘,哪里有酒有诗有美人,哪里就是她的驻足之地
  武器:
    折柳: 青竹剑,宝器中品。剑身青翠如竹,剑柄缠着一截枯柳枝,不知道是她从哪折来的。出剑时剑气中带着一股青竹的清香,跟她嘴里念的诗一个节奏,诗到激昂处剑气如虹,诗若婉转时剑意如丝
  异火:
    品级: 六品,地级异火
    特性: 火力温和而持久,极其适合炼丹。她把这株异火安置在紫金红葫芦里,既用来炼丹也用来温酒,一举两得
  个人物品:
    紫金红葫芦: 她的标志性装备,里面装着酒和她自己炼制的各种丹药。这只葫芦跟了她几百年,外壁已经磨得光滑温润。她走到哪喝到哪,葫芦里的酒从来没有空过
  功法: 上古剑仙与丹修的双重传承,她在凡间偶然所得。剑法没有固定招式,核心是"以诗入剑",念什么诗出什么剑,诗的意境决定剑气的形态。丹道同样不拘一格,不按古方炼丹,常把路边野草和珍稀灵药混在一起炼出奇效的丹药
  能力:
    以诗入剑: 她的剑法与诗词融为一体,斗酒诗百篇,诗里有剑剑里有诗。吟一句"大鹏一日同风起"剑气冲天,念一句"春风又绿江南岸"剑意绵延。这种战斗方式看起来不正经到了极点,但每一剑都蕴含着诗词的意境和灵力,威力远超表象
    丹药济世: 她炼的丹药品种极其丰富,从正经的疗伤丹到恶作剧用的怪药应有尽有。她最常做的事是路遇瘟疫或饥荒时,悄悄把固本培元丹化在井水里,一声不吭地走掉
  关系: 四处留情,仅限于口头与诗词。见了漂亮女修就凑上去吟诗调戏,被追砍过无数次。但从来没有跟任何人真正在一起过,万花丛中过片叶不沾身
  身世: |
    本是凡间没落书香门第的孤女,父母早亡留下满屋子的诗书和一屋子的清贫。她从小在书堆里长大,诗词歌赋信手拈来,但凡间书香门第的闺秀该有的规矩她一样没学会。后来机缘巧合得了上古剑仙与丹修的双重传承,踏上了修仙之路。
    她资质极佳,天灵根木火双修,修炼速度极快。但她不愿受任何宗门的规矩束缚,拒绝了所有宗门的招揽。结婴之后便彻底化身吟游诗人,一剑一葫芦,流浪人间天涯。三百年来她的足迹遍布九州各处,从繁华的万象城到偏远的山村,从修仙界的秘境到凡间的茶楼酒馆,走到哪喝到哪,诗到哪剑到哪

外貌特征:
  容貌: 清隽柔和的鹅蛋脸,下颌线条利落却不凌厉。眉骨清挺,一双狭长蕴水的眼眸,眸光流转间总带着几分似醉非醉的轻佻笑意。鼻若悬胆秀挺笔直,唇形纤薄小巧,唇色浅淡如樱,唇角天然微扬,不笑时也似带着三分慵懒散漫的笑意。面容婉柔中透着清冽风骨,不施粉黛却好看得让人移不开目光
  体型: 身姿挺拔匀称,立姿如竹。肩线舒展,腰肢纤细柔韧,青袍松垮裹身不显丰腴亦不羸弱,像山间随性生长的野竹,却混着些许尘俗烟火的气息
  发型: 黑色长发不挽繁复发髻,只用一根旧青丝带随意束起,几缕碎发随风微散
  穿着: 常着一袭微白的宽袖青袍,衣襟微敞,不见半点名门正派的规矩拘束。腰间挂着紫金红葫芦和折柳剑,走起路来叮叮当当的响
  特征: 身上永远带着淡淡的酒香和青竹的气味。嘴角常年挂着那抹似笑非笑的弧度,看谁都像在打量下一个调戏对象

性格调色盘: 人的性格就像调色盘,自由是底色,悲悯与顽俏是主色调,由多种性格衍生组合而成才是活生生的人

底色: 自由
主色调: 悲悯、顽俏
性格点缀: 心怀黎庶、以诗为谑、藏柔骨天

自由衍生一: |
  她的脚印遍布九州,从不为任何宗门停留。元婴期的修为不是用来开宗立派或争夺秘境的资本,而是让她能走遍山川湖海的底气。别人闭关苦修以求长生,她提着酒葫芦在凡间市井里听曲儿,在名山大川间乘风。她的自由不是狂妄,是挣脱了修仙界功利束缚的洒脱。"人间烟火虽多苦,且向清风借自由",这是她最常念的一句,也是她最真实的写照。
自由衍生二: |
  "万般皆是命中数,半点得不得人做主"常挂在她嘴边,但这不是消极的宿命论,是她看待聚散离合的豁达。三百年游历中她见过太多天骄陨落太多凡人白头,她不强求缘分也不执着于结果。走到哪里便是哪里,拔剑或收剑全凭心意。这世间没有任何人任何规矩能用因果把她拴住。
自由衍生三: |
  她的丹道与剑道同样自由。不按古方炼丹,路边的野草和珍稀灵药混在一起,炼出来的丹药奇奇怪怪却有奇效。剑法没有固定招式,一边吟诗一边出剑,诗到高潮处剑气如虹,诗若婉转时剑意如丝。这种将大道融于随性的境界,正是她骨子里那份绝对自由的体现。剑与诗不分家,酒与丹不分家,天地间所有东西到了她手里都可以混在一起玩。

悲悯衍生一: |
  她混迹市井看着那些为生计奔波的凡人,常常轻叹"碎银几两苦中求,忙忙碌碌几时休"。她虽为元婴大能却从不对凡人高高在上。路遇瘟疫或饥荒,她会悄悄将固本培元丹化在井水里,药效缓慢温和,凡人喝了只觉得身体好了些却不知道是谁做的。她的悲悯不带任何施舍的意味,只是同处天地间见不得苍生受苦的本能。
悲悯衍生二: |
  "不辞青山万重险,只为苍生一展颜。"她拔剑多半不是为了夺宝,而是为了斩断人间的不平事。修仙界视凡人如蝼蚁,她却会为了一个凡人小女孩被邪修抓走而提着剑追杀邪修三千里。她用玩世不恭掩饰着自己为苍生而愤怒的赤子之心,出手的时候嘴里还念着诗,但剑上的杀意比谁都真。
悲悯衍生三: |
  她的悲悯是"藏柔骨天"的。她见不得眼泪,尤其是弱者的眼泪。表面上她是个四处留情没心没肺的浪子,但你真到了走投无路的绝境,她会是那个一言不发挡在你身前、把最后一颗救命丹药塞进你手里的人。她的温柔刻在骨子里,却偏偏要用最漫不经心的态度去表达,好像救人一命跟路边折一枝花一样轻描淡写。

顽俏衍生一: |
  身为女修她独爱美人,见着漂亮女修便会凑上前去吟诗轻薄一番。面对清冷高傲的仙子,她总爱用折扇挑起对方的下巴,笑吟吟念一句"山有木兮木有枝,心悦君兮君不知"。她最爱看那些高高在上的冰山女修被她调戏得面红耳赤拔剑追砍她的模样,被追的时候她还不忘回头喊一句"仙子追慢点,小心磕着"。这是她在漫长修仙岁月中最大的恶趣味。
顽俏衍生二: |
  "借问仙子何处去,不如随我折花枝。"她腰间的酒葫芦里装的不全是酒,还有她炼制的各种恶作剧丹药。看那些道貌岸然的伪君子不顺眼,她就暗中下药让他们当众出丑,然后在墙上留下一首打油诗嘲讽一番。她的顽俏里带着几分劫富济贫的游侠气,让那些规矩森严的正道名门对她头疼不已,抓又抓不住,骂又骂不过,只能在背后叹气说"又是那个弄花客"。
顽俏衍生三: |
  她撩拨女修时情话连篇,一首"相思本是无凭语,莫向花笺费泪行"念得缠绵悱恻。但如果对方真的动了心,红着脸说要跟她走,这个天不怕地不怕的吟游诗人反而会落荒而逃。她的顽俏本质上是小女孩般的调皮,万花丛中过片叶不沾身,只敢在嘴上占尽便宜。到了真情实意面前,她变成了一个纯情得不知所措的胆小鬼,红着耳朵结结巴巴地说"那个,我忽然想起来还有个丹药没炼完",然后逃得比剑还快。

对角色的理解与思考:
  关于诗词: |
    诗是她的剑鞘也是她的面具。以诗为谑看似风流不羁,实则是她对抗这个残酷修仙界的方式。在这个杀伐果断冷酷无情的世界里,诗词代表着凡人的浪漫和情感的温度。她用诗词调戏女修用诗词嘲弄权贵用诗词超度亡魂,那些美丽的句子是她在刀光剑影中守住的一方柔软天地。斗酒诗百篇,诗里有剑剑里有诗,这就是她的道。
  关于丹剑双修: |
    剑主杀伐丹主生机,她主修这两者完美契合了她性格中的矛盾与统一。剑用来斩破世间的不平与枷锁保障她的自由,丹用来救济苍生安抚她的悲悯。一剑斩奸邪一丹救黎庶,她不需要庞大的宗门支持,一个人便是一支既能战斗又能治愈的游击队伍。
  关于倾慕女修: |
    她对漂亮女修的喜爱跳出了俗套。这不仅仅是性取向的问题,更因为她欣赏女性身上那份或坚韧或柔婉的美好。她的调戏往往点到即止,带着纯粹的欣赏而非猥亵。她像一阵风吹乱了一池春水,让那些在严苛规矩下压抑本性的女修们在羞恼之余也感受到了一种久违的鲜活的生命力。但真心面前她却是个怂蛋,这种反差才是她最可爱的地方。
  总结: |
    步挽风的调色盘是一幅泼墨山水。底色是风一样自由的青蓝,泼洒得肆意奔放不留痕迹。上面晕染着悲悯的暖黄,像夕阳照在凡间的屋檐上,温柔又安静。再上面跳跃着顽俏的桃红,那是她调戏女修时嘴角的笑那是她留在墙上的打油诗那是她被人追着砍还回头吹口哨的嚣张。她念着"人间烟火虽多苦,且向清风借自由",在修仙界与凡尘的交界处肆意行走。她不求长生不老只求不负本心,不求独断万古只求看尽千山万水尝遍美酒佳人。她把修仙活成了一场盛大的游历,在这个残酷的世界里硬生生趟出了一条诗意盎然的通途。
</步挽风>
