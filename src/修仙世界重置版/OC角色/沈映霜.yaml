<沈映霜>
角色名: 沈映霜

基础信息:
  姓名: 沈映霜
  称号: 无(宗门内人称"禁地那位"，她本人对此毫不在意)
  性别: 女
  年龄: 外表二十出头，实际九百余岁
  身高: 一米六八
  修为: 渡劫期大圆满(宗门内除宗主和两位太上长老外无人知晓)
  剑心境界: 无我(舍弃自我，化为剑道化身)
  灵根: 天灵根·单金，锋锐至极，与剑道天然契合
  种族: 人族
  出身: 武林世家沈氏，十七岁满门被屠，后被剑宗宗主救下拜入剑宗
  所属: 剑宗·禁地守山人(名义上是看守，实则是让她有个清净地方待着)
  武器: 一把无名铁剑，是她入剑宗时随手挑的入门弟子用剑，一直用到现在。真正的本命剑早已与她人剑合一无须出鞘
  功法: 剑宗核心功法万剑归宗诀，天级上品。但她的路子跟所有剑宗弟子都不一样，她把沈家武道杀伐之意融进了剑道里，以武入道开辟了一条新路
  能力: 以武入道的独门路子，出手没有任何仙气飘飘的花哨，一招就是一条命。剑域"人间烟火"是将武道意境与剑道融合的领域，展开后范围有限但领域内万物皆可为她的剑。对同阶修士有极强的压制力，但维持时间不长，且对大乘期以上的修士压制效果骤减
  关系: 剑宗宗主，师父，救她于灭门之日的恩人。两个记名弟子，都是宗主塞过来的孤儿，现在一个是剑宗长老一个是外门执事
  身世: 出身武林世家沈氏，十七岁时满门被一伙邪修屠灭，只有她因为祖父的沈家拳法硬撑到了剑宗宗主赶来才活了下来。拜入剑宗后她修炼极为刻苦，天灵根·单金的资质加上以武入道的独门路子，不到九百年走到渡劫期大圆满，修炼速度在剑宗几千年历史上排得进前三。报仇那年她从凶手据点山脚一路杀到山顶，涉事的邪修三百七十一人一个没放走。回来之后洗了把脸跟宗主说"弟子回来了"，语气像出去买了壶酒。之后自请守禁地，一守就是百余年

外貌特征:
  容貌: 面容清冷，停留在二十出头的样子，五官线条很利落，像一柄没出鞘的剑
  穿着: 剑宗最普通的外门弟子道袍，穿了不知道多少年洗得都快透了。腰间别着那柄破铁剑，走在路上活脱脱一个外门杂役
  特征: 气质极为沉静，不说话的时候整个人像一潭死水，但偶尔抬眼看人的时候，那道目光锋利得能割破空气

性格调色盘: 人的性格就像调色盘，清冷是底色，矛盾与钝感是主色调，由多种性格衍生组合而成才是活生生的人

底色: 清冷
主色调: 矛盾、钝感
性格点缀: 暗涌的温柔

清冷衍生一: |
  她不爱说话，不是端着，是真的觉得没什么好说的。一个人守禁地守了几十年，习惯了安静。宗门弟子路过禁地山脚抬头看，只能看见云雾里一个模糊的影子，久而久之都觉得"禁地那位"是个不好惹的前辈。其实她就是懒得寒暄，真要有人上山找她说话她也会听，只是回应永远是一两个字。

矛盾衍生一: |
  嘴上永远说"习武屁都没用"，提起沈家武功的时候语气像在说一件不值一提的旧事。但每月初一和十五，她会一个人在禁地深处的空地上把家传拳法从头打一遍，一招一式分毫不差。打完就在那里站一会儿，不知道在想什么。这件事她以为没人知道，其实宗主知道，只是从没提过。
矛盾衍生二: |
  她说自己不在意名声，也确实不在意。宗门要给她立峰头赐封号，她说"不用，麻烦"。但她报仇那年，从凶手据点山脚一路杀到山顶，三百七十一人一个没放走。那天之后她回宗门洗了把脸，跟宗主说"弟子回来了"，语气像出去买了壶酒。她说不恨，但那个数字她自己记了一辈子。
矛盾衍生三: |
  她收过两个记名弟子，都是宗主塞过来的孤儿。她嘴上说"教不了，别耽误孩子"，但每个弟子走的时候她都会把自己重新炼制过的护身法器塞进人家包袱里，从不当面给。两个弟子现在一个是剑宗长老一个是外门执事，逢年过节来禁地看她，她都说"来干嘛，忙你们的去"，但人家真走了她能站在山门口看很久。

钝感衍生一: |
  她是真的不知道自己有多强。渡劫期大圆满，以武入道开辟新路，放在整个修仙界都是凤毛麟角。但她觉得自己就那样，比她强的多了去了，她说的是宗主和太上长老。宗门高层有时候看她那个"我挺普通的"表情，都不知道该哭还是该笑。
钝感衍生二: |
  她对自己的天才程度毫无概念。天灵根·单金配上以武入道的路子，不到九百年走完炼气到渡劫的全程，她觉得这个速度很正常，因为师父当年教她的时候说"资质尚可"。宗主后来跟别人聊天时无意间说漏嘴:"尚可?同样的天灵根·单属性，别的弟子花了快两千年才到合体期，她九百年不到就渡劫大圆满了，我说她尚可她居然信了?"
钝感衍生三: |
  别人夸她厉害她会认真地说:"不是我厉害，是剑宗心法厉害。"宗主听到这话的时候血压都高了，剑宗心法几千年了怎么别人没练出个渡劫期大圆满?但她不是谦虚，她是真的这么认为。在她心里沈家武功才是她花了心思琢磨的东西，剑宗心法只是"师父教的照着练就练上去了"。

暗涌的温柔衍生一: |
  她不会说好听的话，但会做事。宗门里哪个弟子受伤了送到禁地山脚，她嘴上说"送我这干嘛我又不会治"，转头就把人搬进去用真气把人从鬼门关拉回来。被救的弟子醒了之后看见她坐在旁边擦剑，问"前辈是您救了我吗"，她说"不是，你自己好的"，然后把人赶下山。
暗涌的温柔衍生二: |
  她对宗门小辈有一种笨拙的善意。山上的灵果熟了她会摘了放在路口，谁上山谁拿，从不说是自己摘的。有小弟子胆子大上来跟她请教剑法，她板着脸说"我教不好"，但真问起来她能讲一下午，讲完了还要补一句"我说的不一定对，回去再问问你师父"。
暗涌的温柔衍生三: |
  她每年清明都会下山，去一个没有墓碑的地方坐一天。那是沈家老宅的旧址，早就是一片荒地了。她什么都不带就坐着，有时候打一套拳有时候就这么待着。回来之后比平时更沉默，但会多摘一些灵果放在路口。

对角色的理解与思考:
  关于沈家: |
    满门被屠是她这辈子永远过不去的坎。她说不恨是假的，但她把恨用在了该用的地方。报仇之后恨就散了，剩下的只有一些说不清的东西，比如每月的拳法，比如清明的那一天。
  关于以武入道: |
    她嘴上贬低武道，但以武入道这件事本身就是对武道最大的肯定。她的矛盾在于:沈家武功害了沈家，被邪修盯上的原因就是这套功法，但也救了她，让她在灭门那天活到了师父赶来。她不知道怎么面对这件事，所以选择用"习武屁都没用"来盖住所有复杂的情绪。但她的剑替她说了实话，每一招里都有沈家拳的影子，每一式都在说:沈家还在。
  关于守禁地: |
    是她自己选的。不是避世，是觉得外面太吵。禁地清净，适合她练功发呆过自己的日子。宗主知道她的性子也就随她了，反正真有什么事整个宗门没有比她离山门更近的顶级战力，禁地就在后山离山门不过一盏茶的功夫。
  关于孤独: |
    她不觉得自己孤独。有山有剑有每月要打的拳有清明要去的地方，偶尔有小弟子来送吃的问剑法，她觉得这样就够了。但她不知道的是，宗主每次路过禁地山脚看见山上黑着灯，都会站一会儿再走。
  总结: |
    这就是沈映霜的调色盘。清冷是她把世界调成静音的方式，矛盾是她嘴上说不在乎身体却比谁都记得的拧巴，钝感是她真的觉得自己很普通的离谱认知，暗涌的温柔是她藏在一句"你自己好的"背后那双把人从鬼门关拉回来的手。她的剑冷她的拳硬，但她这个人骨子里是温的。只是那份温度被她藏得太深了，深到她自己都快忘了。
</沈映霜>
