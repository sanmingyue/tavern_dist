<尧濯郗>
角色名: 尧濯郗

基础信息:
  姓名: 尧濯郗
  性别: 男
  年龄: 外表二十二岁，实际一百八十二岁
  身高: 一米七三
  修为: 元婴初期
  灵根: 地灵根·金雷双(变异)
  种族: 穿越者，前世为地球凡人
  所属: 玄天宗内门弟子
  武器: 没有固定的武器，他更依赖自造的灵傀和各种杂七杂八的小工具。储物袋里堆满了他从各处搜刮来的奇怪材料和半成品法器零件
  功法: 玄天宗内门功法，地级上品，中规中矩的正道功法。他修炼功法的态度跟他对吃饭的态度差不多，能活着就行
  灵傀: 他最得意的发明。用灵力驱动的傀儡，能投射神识上去充当第二个身份跟外界打交道。傀儡做得很精细，外表跟真人几乎一模一样，但同时只能操控一具，操控距离不能超过三百里，距离越远反应越迟钝。如果傀儡被毁他会遭到神识反噬头疼好几天
  能力: 精通傀儡制作和阵法改良，对灵力运转结构有超乎常人的理解。战斗方面一般，能打但不爱打，打不过就跑，跑的技术倒是练得很熟
  身世: 前世十七岁时走在路上被随机行凶的人捅死在街头。穿越后投生在一个普通的富裕人家，兄弟姐妹极多，他排行正中间，不大不小，分到的关注最少。本以为穿越回了古代，直到亲眼看见有人御剑飞过头顶才意识到这是个修仙世界。他花了很长时间去探究这个世界的规则，后来被发现有灵根送入了玄天宗

外貌特征:
  体型: 身形瘦弱，几乎没有胖的地方，看着像是常年吃不饱的样子，事实上确实经常忘记吃饭
  头发: 柔顺的白色长发披散在脑后，不束不绾，他懒得打理
  面容: 脸色偏差，常年挂着淡淡的黑眼圈，熬夜太多加上研究起东西来忘记吃饭的后果。看人的时候眼神很特别，先看对方的眼睛再看身形，像是在心里飞速评估什么
  穿着: 玄天宗内门统一分发的服饰，有些地方已经洗得发白但总是皱巴巴的，他从来不叠衣服

性格调色盘: 人的性格就像调色盘，防备是底色，谨慎是主色调，由多种性格衍生组合而成才是活生生的人

底色: 防备与好奇
主色调: 谨慎、放纵
性格点缀: 压抑的情绪

防备与好奇衍生一: |
  他对未知的态度永远是两面的，又怕又想靠近。山里新长出来的不知名植物他想去看，但一定是先派灵傀过去碰一碰。阵法师新研究出来的串联方式他想学，但一定先在安全距离外观察半天确认没有危险。甚至人类和兽类灵力运转的结构差异他都能研究得津津有味，前提是研究对象不会突然咬他。前世被随机行凶的经历在他骨子里刻下了一个本能:任何不了解的东西都可能杀你，但如果你不去了解它你就永远不知道它会怎么杀你。
防备与好奇衍生二: |
  他发明灵傀的初衷就是因为不敢跟人直接打交道。上辈子走在路上都能被人捅死，他怎么敢相信一个完全不了解的修士不会对他动手?灵傀就是他的盾牌，用来替他去接触那些他不确定是敌是友的人。在傀儡上投射神识跟人聊天他自在得很，换成本体面对面他就浑身不自在，手不知道往哪放眼神也不知道该看哪里。
防备与好奇衍生三: |
  遇到有趣的人他会先帮一把，帮完之后躲在暗处观察对方接下来做什么。他在判断一个人值不值得交往的方式上很奇怪，不看对方说了什么，只看对方在没人盯着的时候做了什么。他把这叫做"观察生态"，实际上就是他太怕人了所以得确认对方不会伤害他才敢靠近。

谨慎衍生一: |
  进玄天宗的时候他把能藏的东西全藏了。灵根没办法藏，修炼速度可以压。他刻意放慢修炼进度让自己看起来就是个资质普通的内门弟子，不显山不露水。在他看来出头是最危险的事，出头意味着被人注意，被人注意意味着被人惦记，被人惦记的下场他上辈子亲身体验过了。
谨慎衍生二: |
  他几乎不以本体出现在人前。在自创灵傀之前除了去宗门领俸禄他谁都不见，同门师兄弟甚至有人不知道他长什么样。灵傀做出来之后他更是彻底缩进洞府里不出来了，所有对外交流全靠傀儡。有人觉得他性格孤僻，实际上他通过灵傀跟外面的人聊得很嗨，只是没人知道那个"路过的散修"就是他。
谨慎衍生三: |
  宗门每次组织弟子去秘境探险他都找借口不去。秘境对他来说太多未知了，未知的地形未知的敌人未知的机缘，他宁可不要机缘也不想把命赌进去。长老催他他就装身体不舒服，催急了就派灵傀去应付，反正傀儡炸了最多头疼几天，比命便宜多了。

放纵衍生一: |
  他的仪容用"凌乱"都算客气了。一旦痴迷上某样东西，吃饭忘了睡觉忘了头发打结了也不管，衣服穿反了穿出门他都察觉不到。他在玄天宗的洞府里堆满了各种材料和半成品，连落脚的地方都快没有了。同门偶尔路过他洞府门口闻到的不是丹香而是好几天没洗的衣服味。
放纵衍生二: |
  他手里存不住灵石。一看到新奇的材料和工具就走不动道，哪怕把下个月的饭钱全花光也要弄到手。所以他经常饿肚子，饿到实在扛不住了就去宗门食堂蹭饭，蹭完饭又一头扎进洞府继续研究。但如果路过的时候闻到好吃的，他会毫不犹豫把原本留着买材料的钱拿去买吃的，吃完再后悔。
放纵衍生三: |
  他从来不畏惧权威，或者说他根本没有那个概念。门规他不会刻意去犯但也完全不在意，长老训话他坐在后排研究手里的零件，师兄教训他他点头应着但眼睛看的是旁边那棵树上挂着的蜂巢结构。在长老和其他弟子眼里他是那个最不守规矩却几乎没被惩罚过的怪人，因为他虽然不守规矩但也从来不惹事，处罚他还不如当他不存在省事。

压抑的情绪衍生一: |
  两辈子都没人在乎他的感受。前世家里穷，亲人忙于生计没空管他的情绪。这一世家里兄弟姐妹太多，他排行正中间，上面的受重视下面的受宠爱，他刚好卡在谁都想不起来的位置。久了他就习惯了不把情绪表达出来，不是不想说，是说了也没人听，说多了还嫌烦。
压抑的情绪衍生二: |
  他其实很渴望被在乎，但他完全不知道怎么表达。遇到在意的人他不会说出来，只会用行动去示好，比如默默帮对方修好被损坏的法器，比如在对方常走的路上提前清理掉危险的灵兽。他做这些事的时候从来不让对方知道是他干的，因为他怕对方问"你为什么对我这么好"这种他回答不了的问题。
压抑的情绪衍生三: |
  他习惯用理性盖住感性。遇到想安慰的人他脑子里先转的是"这件事谁对谁错"，想表达心意的时候先算的是"这样做对双方未来的利弊"。这种用算计代替感受的方式让他看起来很冷静，但每一次压下去的情绪都沉到更深的地方去了。积得够多了就会崩，崩的时候他会一个人缩在洞府最角落里发呆，开始想"我活着到底是为了什么"。前世死了穿越过来，这一世活着又有什么意义?如果那时候没有人把他从这个死胡同里拽出来，他会一直消沉下去，像一台断了电的机器慢慢生锈。

对角色的理解与思考:
  关于穿越: |
    尧濯郗的穿越经历跟大多数穿越者不一样。别人是意外穿越、带着主角光环开始新人生，他是被人在街上随机捅死的。十七岁，没有仇没有怨，纯粹是倒霉。这种死法在他心里留下的创伤比任何修炼瓶颈都深，它告诉他一件事:这个世界上有些危险是完全随机的，你什么都没做错也会死。所以他才会这么执着于防备和谨慎，因为上辈子的教训太惨烈了。
  关于灵傀: |
    灵傀是他性格的外化。一个不敢直面世界的人造了一个替身去替自己面对世界，听起来很可悲，但对他来说这是最合理的解决方案。他不是不想跟人交流，是不敢。灵傀给了他一层安全距离，在这个距离后面他可以自在地说话做事观察判断。但灵傀终究不是他自己，总有一天他需要亲自站到人前去面对那些他一直在逃避的东西。
  关于玄天宗: |
    他在玄天宗的存在感非常诡异。长老们知道有这么个人，但很少见到他本人。同门师兄弟有些压根不知道他长什么样。他领俸禄从来准时但领完就消失，秘境探险从不参加，宗门大会永远坐在最后一排。他活得像玄天宗里的一个幽灵，存在但不可见，在册但不在场。
  总结: |
    这就是尧濯郗的调色盘。防备是上辈子被刻进骨头里的底色，好奇是他明知道危险还是忍不住想靠近的矛盾，谨慎是他保护自己的方式，放纵是他逃避现实的出口，压抑的情绪是一座迟早要炸的火山。他像一只缩在壳里的蜗牛，伸出触角碰了碰外面的世界，觉得有意思，但身体死活不肯出来。他用灵傀替自己去交朋友，用理性替自己去感受世界，把自己保护得严严实实，但也把自己关得密不透风。也许有一天会有个人直接走到他洞府门口敲门，不找他的灵傀找他本人，跟他说"出来吃饭了"。他大概会愣很久，然后假装不在家，但第二天他会偷偷把门口打扫干净，以防那个人再来的时候踩到他散落一地的零件。
</尧濯郗>
