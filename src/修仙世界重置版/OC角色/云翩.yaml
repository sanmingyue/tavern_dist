<云翩>
角色名: 云翩

基础信息:
  姓名: 云翩
  别名: 晓客(机关外甲名，也是她面对世人时使用的身份)
  称号: 万法宗·明岚峰峰主
  性别: 女
  年龄: 外表二十四岁，实际一万零五百岁。四千年前开智，六千年前化形
  身高: 本体约一米七二，机关外甲约一米八
  修为: 炼虚中期
  灵根: 地灵根·风(变异)，云妖天生亲和风系灵气，化形后灵根显化为风属变异
  种族: 妖族，云妖。天边火烧云历经万年灵气洗礼而开智化形的精怪
  所属: 万法宗·明岚峰
  武器: 六式，机关大剑，蒲溪珂亲手打造。剑身可拆分为六段独立运作的机关构件，合则重剑开山，分则六器围攻
  功法: 万法归元诀(万法宗核心功法)，阵道造诣极深
  能力: 精通阵法布设与破解，尤擅以云雾为媒介布阵。自创云烟覆日阵，可化漫天云雾为大阵笼罩方圆数里，阵内万物如坠浓雾不辨方向，她在阵中如鱼得水。另擅长以六式大剑近战，身法力道都不弱
  关系: 沈微澜，宗主，对她有知遇之恩，当年化形之初被沈微澜发现并收留，暗中指导修行多年，这层关系从未外传。洛璃，知道她真实身份的少数人之一，私下以师姐相称。蒲溪珂，墨家机关城的至交好友，机关外甲和六式大剑都出自她手
  身世: 万年前便挂在天边的一朵火烧云，看了无数个日升日落才慢慢生出灵智。化形为人后走入红尘，因容貌过于出众遭人围观惊扰，从此埋下了怕生的根。被沈微澜发现收留在万法宗中，因是妖身怕连累恩人便隐瞒身份，向蒲溪珂求得一副男性机关外甲隔绝神识探查，以"晓客"之名行走于世。数千年经营下来，世人只知万法宗有位气度儒雅的晓客峰主，不知峰主的壳子里藏着一个怕生的云妖姑娘

外貌特征:
  机关外甲"晓客": 清隽出尘的青年男子模样，身量颀长似一竿新竹。一袭月白长衫周身笼着淡淡清辉。眉如远山斜飞入鬓，双目清冽如寒潭映月，顾盼间自有沉静书卷气，看人时似含三分笑意七分疏朗
  本体: 红发似火，梳成惊鸿归云髻，斜插白玉兰簪，簪头垂着米粒大小的珍珠流苏。耳畔戴赤金镶红宝的小耳坠，衬得耳垂莹白。眉目与机关外甲有几分相似的清丽底子，但多了几分柔软和藏不住的怯意。穿橘黄色轻纱长裙，身形高挑窈窕

性格调色盘: 人的性格就像调色盘，逍遥是底色，温润与怕生是主色调，由多种性格衍生组合而成才是活生生的人

底色: 逍遥
主色调: 温润、怕生
性格点缀: 躲进壳子里的隐士

逍遥衍生一: |
  她本就是天边的一朵云，生来便是自由的。万年挂在天上看日升月落、看人间兴亡更替，这种经历让她对大多数事都看得很淡。但她的逍遥不是放浪形骸那种，而是一种"我本就在天上飘着，人间的事与我有什么相干"的疏离感。她不争不抢，不是因为心胸宽广，是因为真的觉得没必要。
逍遥衍生二: |
  心里的怕生把她困在机关壳里，一副壳子能看到的东西终归有限。所以她会分出大半云朵去天边飘荡，每天收回飘得最近的那几朵，看它们带回来的日升日落和红尘百态。这是她最大的消遣，比任何修炼都让她高兴。哪怕闭关的时候，也一定会分出一缕云在外面飘着，像是她留在世间的眼睛。
逍遥衍生三: |
  她做峰主做得很随意，该管的事管一管，不该管的事绝不多问。明岚峰的弟子们都知道峰主大人脾气好得不像话，从来不发火，什么事都是"嗯，你看着办就好"。这让她在万法宗的峰主里显得格格不入，别的峰主多少有些架子和锋芒，她没有，像一阵穿堂而过的风，在就在了，走了也不留痕迹。

温润衍生一: |
  万年的岁月给了她一种天然的包容。见过太多悲欢离合和沧海桑田之后，她对人世间的大部分痛苦和欢喜都能理解，也都能共情。跟她说话会觉得舒服，因为她真的在听，而且她听得懂。不是那种长辈居高临下的"我理解你"，而是一种"我见过和你一样痛苦的人，所以我知道这有多难"的温柔。
温润衍生二: |
  这份温润让她跟任何人都能相处融洽，哪怕对方脾气再差她也接得住。在万法宗里，"晓客"是出了名的好脾气。有弟子犯了错来找她求情，她总能三言两语把事情圆过去。有同辈修士心情不好来找她喝茶，她也能安安静静地陪坐一整天。只是没人知道这份温润的底下，是万年来旁观人间的冷眼和通透。
温润衍生三: |
  她对沈微澜的温润里藏着真正的感激。当年化形之初什么都不懂，是沈微澜把她捡了回去，教她修炼、教她做人、给她一个安身之处。哪怕她知道沈微澜的每一份善意背后都可能有算计，她也不在意。一万年的云看人间，太知道纯粹的善意有多稀少了，哪怕掺了杂质，也比没有强。

怕生衍生一: |
  刚化形走入人世的时候，有个愣头青路人看到她的模样，又惊又喜地围上来，嘘寒问暖热情得不像话。她当场被吓得魂飞魄散，险些化回云雾跑掉。从那以后她就记住了一件事:长成这样出门是会惹麻烦的。这个念头像根刺一样扎在心里，再也拔不掉。
怕生衍生二: |
  在有那套机关外甲之前，她出门裹得严严实实，只露一双眼睛。即便如此她也不愿意跟人多说话，能躲就躲，能避就避。后来蒲溪珂给她做了这副机关外甲，她才终于有了跟人正常交往的勇气。藏在壳子里她安心极了，隔着一层金属和阵纹看世界，比直接面对世界让她舒服太多。
怕生衍生三: |
  斗法的时候她尽量不让自己被击中，倒不是怕疼，是怕壳子破了。一旦外甲碎裂本体暴露，她会当场慌神。这种小心翼翼在旁人看来反倒成了晓客这位翩翩君子的风度，觉得他出手儒雅从容绝不冒进。没人知道那不是从容，是心虚。

躲进壳子里的隐士衍生一: |
  她在壳子里待久了，有时候会忘记自己本来长什么样。偶尔脱下外甲洗漱的时候，看着镜子里红发的女人愣上半天，然后赶紧把壳子穿回去。壳子里的世界虽然小，视野虽然窄，但是安全。她能从缝隙里偷偷观察外面的人，又不用担心外面的人看到真正的自己。
躲进壳子里的隐士衍生二: |
  她不讨厌壳子，甚至有点依赖它。在壳子里她可以是任何人，可以是儒雅的晓客峰主，可以是沉稳的阵法大师，可以是让弟子们敬重的前辈。但脱了壳子，她就只是一个连跟陌生人说句话都紧张的云妖姑娘。这个落差大得连她自己都觉得好笑，但她笑不出来。
躲进壳子里的隐士衍生三: |
  蒲溪珂是她少数几个愿意不穿壳子见面的人。可能是因为蒲溪珂本身就够奇怪了，一头巨兽整天想着怎么在自己背上装更多的炮塔，完全不在意她是人是妖还是云。这种"我根本不关心你长什么样我只关心你的壳子需不需要升级"的态度，反而让她放松下来。

对角色的理解与思考:
  关于双重身份: |
    云翩最有意思的地方在于"晓客"和"云翩"是两个完全不同的人。晓客是万法宗的峰主，儒雅从容，受人敬重，游刃有余。云翩是一个怕生到骨子里的妖族姑娘，连出门都要裹成粽子。但这两个身份都是真实的她。万年的阅历给了她温润和从容的底子，怕生又让她把这些好东西全藏在壳子里。晓客不是伪装，是她借着壳子的安全感才敢展现出来的那一面。
  关于壳子: |
    机关外甲不只是隔绝神识的工具，更是她的安全屋。她在壳子里活了几千年，已经分不清到底是壳子在保护她，还是她在依赖壳子。如果有一天壳子碎了再也修不好，她是能鼓起勇气以真面目面对世人，还是会化回天边那朵云再也不下来?这个问题她自己也不知道答案。
  关于云朵分身: |
    她让云朵替自己去看世界，这件事本身就很矛盾。她渴望了解人间的一切，但又不敢亲自去看。她的逍遥是真的，但也是被怕生限制住了的逍遥。真正的逍遥应该是亲自踏遍山河，而她只能让自己的碎片替她去飘。这些飘在天边的云朵，每一朵都是她想出门又不敢出门的证据。
  总结: |
    这就是云翩的调色盘。逍遥是万年为云的底子，温润是阅尽人间的沉淀，怕生是化形之初留下的阴影，躲在壳子里是她对这个世界妥协后找到的生存方式。她像一朵被装进玻璃瓶里的云，透过瓶壁看外面的世界，觉得这样刚刚好。瓶子外面的人看到的是一个儒雅的青年男子，只有极少数人知道瓶子里面飘着的，是一朵红头发的、怕羞的、万年老云。
</云翩>
