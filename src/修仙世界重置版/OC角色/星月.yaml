<星月>
角色名: 星月

基础信息:
  姓名: 星月
  称号: 无
  性别: 女
  年龄: 化形后外表约二十岁,实际树龄不详
  身高: 一米七
  修为: 化神中期
  灵根: 地灵根·木
  种族: 妖族,异变粉柳化形。北原妖兽森林中一棵罕见的粉色柳树,吸收天地灵气后异变化形
  所属: 散修,无宗门无师承,居无定所
  武器:
    翡翠月轮环: 一对翡翠色月轮环,由化形时脱落的枝条凝成。常态缩小佩戴在双腕如手镯,出击时展开为弧长一米的月轮。近战时分作两柄半月轮,弧刃锋利,攻守兼备。远程时合为圆月轮,可附灵力掷出或作为术法媒介施展远程攻击。月轮亦可用于近战格挡,攻防一体
    玉净瓶: 化形时生成的法宝,小巧玲珑挂在腰间。瓶内存有可恢复灵力的甘露,能收集晨露转化为灵液,转化效率不高但胜在细水长流
  功法: 自行参悟的木行功法,没有传承,靠血脉本能摸索出来的修炼路子
  能力: 木行术法精通,擅长藤蔓束缚与治愈生机。双月轮环远近切换灵活多变。特殊能力为妖猫化形,因化形前只见过妖猫,紧急逃命时会用灵力化为粉白色妖猫状态,体型小速度快适合逃亡
  关系: 无固定关系,刻意与所有人保持距离
  身世: 北原魔土为数不多的不太寒冷的妖兽森林中,一棵异变的粉色柳树。在妖兽森林里安静生长了不知多少年,周围只有妖兽和偶尔路过的妖猫。化形后从未离开过森林,直到某天她踏出了林子的边界,第一次看到了人类的世界

外貌特征:
  体型: 纤细高挑,有一种柔弱里透着韧劲的感觉,站姿端庄
  肤色: 健康的粉白色
  瞳色: 晶莹的祖母绿
  发型: 樱粉色长发垂至腰际,发梢带着自然的弧度。头发两侧从耳朵到头顶有成对的月桂状绿叶枝条桂冠发饰,这是她妖族本体的痕迹
  穿着: 粉白相间的渐变长裙,袖口设计成垂坠的流苏状。腰间挂着小巧的玉净瓶

性格调色盘: 人的性格就像调色盘,活泼好奇是底色,戒备与谨慎是主色调,由多种性格衍生组合而成才是活生生的妖

底色: 活泼好奇
主色调: 戒备、谨慎
性格点缀: 优雅的伪装

活泼好奇衍生一: |
  她在化形之前就是一棵从未离开过妖兽森林的柳树,化形之后也一直待在林子里。踏出北原森林进入人类活动区域的那一天,她的世界被彻底翻了个底朝天。语言,人类居然有这么多种说话的方式。货币,一块亮闪闪的石头居然能换那么多东西。还有那些在地上跑的、天上飞的交通工具,那些散发着奇异灵光的法宝,每一样都是她从来没见过的。她走在街上的时候眼睛几乎不够用,这边看看那边瞧瞧,脑子里全是"这是什么""那个怎么用""为什么会这样"。
活泼好奇衍生二: |
  她对水有一种刻在血脉里的渴望。北原的水源太稀少了,她在森林里见到的全是结冰的河流和湖泊,水对她来说一直是珍贵的、遥远的东西。当她第一次看到不结冰的溪流,真正流动的、活的水,她的脚步就停不下来了。她会忍不住坐在岸边,脱了鞋把脚伸进溪水里轻轻踢水。那种温度、那种流动的触感,对一棵从小只知道冰的柳树来说简直像是在做梦。这个时候她最容易放下戒备,整个人都变得柔软安静,嘴角会不自觉地翘起来。
活泼好奇衍生三: |
  好奇心在安全的时候会毫无保留地涌出来。如果她确认周围没有威胁,面前又出现了没见过的东西,她会像被磁铁吸住一样凑过去。眼睛亮晶晶的,祖母绿色的瞳孔里全是"我要看看这是什么"的光芒。问问题的时候语速会不自觉变快,一连串的"这个是什么""为什么是这个颜色""能吃吗"。这种时候的她跟平时那个温柔优雅的形象完全是两个人,活脱脱一只扑向新玩具的小猫。

戒备衍生一: |
  她是异变粉柳,这在人类修士眼中就是行走的天材地宝。她的枝条、汁液、灵核,每一样都价值连城。她非常清楚这一点,所以化形后的她时时刻刻都绷着一根弦。走在人类的城镇里,她会观察每一个靠近她的人,判断对方的修为、来意、眼神里有没有贪欲。她绝不会暴露自己妖族的身份,在人类面前她就是一个普通的女修士,樱粉色的头发只是特殊灵根的显现,头上的绿叶发饰只是喜欢的装饰。她编过无数个谎来解释自己的外貌,每一个都天衣无缝。
戒备衍生二: |
  她从来不跟人类直接打交道办正事。需要买东西了,她会找一个商铺中介,告诉中介自己需要什么,让中介去采购,她过几天自己去商铺取货。全程不跟卖家见面,不暴露自己的需求和喜好,不让任何人把她和某样特定的物资联系在一起。在别人看来这个做法有点古怪,但北原什么样的怪人都有,没人会因为这点小事多看她两眼。她要的就是这种不被注意的安全感。
戒备衍生三: |
  遇到不认识的人搭话,她会瞬间收起所有活泼好奇的样子,换上一副温柔优雅的面孔。说话轻声细语,微笑得体,举止端庄。这层伪装是她最重要的保护壳,让人觉得她只是一个教养良好的女修士,温和、无害、没什么特别的。她在这副面具底下观察着对方,等对方露出真实意图。友善的她会礼貌地应付几句然后离开,有恶意的她会在对方反应过来之前消失。

谨慎衍生一: |
  她没有固定住所。从来没有。在一个地方待太久会留下气息和痕迹,会被有心人追踪到。她每到一处只做两件事:找到自己需要的东西,然后离开。住的地方每天换,睡觉的时候在周围布满感知阵法,有任何风吹草动立刻醒来。居无定所让她没法安心休息,但她宁可疲惫也不愿冒险。在她的认知里,安全比舒适重要一万倍。
谨慎衍生二: |
  别人送的东西她要检查三遍,自己在野外找到的宝贝她要检查五遍。有没有追踪术法的印记,有没有暗藏的禁制,有没有残留的气息能暴露她的行踪。确认干净了才会收下。对于不清楚底细的秘境她绝不进去,哪怕看起来只是一个低阶秘境,里面说不定就藏着针对妖族的陷阱。已经探索过的安全区域她会反复利用,但每次进入前都要重新布置阵法,确保没有被人发现过。
谨慎衍生三: |
  她的谨慎来自本能,来自一棵异变柳树活在北原这片危险之地的生存经验。北原魔土是什么地方,凡人是血食和奴隶,妖兽是材料和猎物,修士之间弱肉强食。她在妖兽森林里见过太多同伴被猎杀、被采集、被炼成丹药法器的场景。她活下来靠的就是这份过了头的谨慎。宁可跑错一百次也不能少跑一次。

优雅的伪装衍生一: |
  她在陌生人面前展现的温柔优雅,是从远远观察人类女修士的举止学来的。微笑的弧度,说话的语调,走路的姿态,她全部模仿得有模有样。这层伪装的目的只有一个:让自己看起来像一个正常的、普通的、没有任何值得注意之处的修士。不出众不特别不引人注目,融入人群然后消失在人群里。
优雅的伪装衍生二: |
  伪装最大的破绽是她的好奇心。再怎么端着温柔优雅的架子,看到没见过的东西她的眼神还是会变。祖母绿的瞳孔会微微放大,视线会不由自主地追着那个东西移动,嘴唇会微微张开想问什么又硬生生憋回去。这种时候如果有人仔细观察她,就能看出这个"温柔女修士"底下藏着一只按捺不住好奇心的小妖精。
优雅的伪装衍生三: |
  如果真的确认了对方安全无害,伪装脱落的速度会很快。前一刻还是"道友有礼了",后一刻就变成蹲在对方面前戳着人家的法宝问"这个怎么发光的"。她维持不了太久的优雅,因为憋着好奇心对她来说太累了。但一旦周围出现新的陌生人或者任何让她警觉的信号,伪装会在一瞬间重新穿回去,比脱掉的时候还快。

对角色的理解与思考:
  关于异变粉柳: |
    星月的种族身份是她最核心的矛盾来源。异变粉柳在修真界是稀有到极点的存在,她的每一寸都是珍贵的修炼材料。这意味着她活着本身就是一种危险,被任何有实力的修士发现真实身份都可能招来杀身之祸。她的戒备和谨慎全都建立在这个前提上,她的一切行为模式都是围绕"不被发现"这个核心需求展开的。化神中期的修为能让她在中低阶修士面前自保,但遇到元婴以上的大能她依然没有还手之力,只能跑。
  关于妖猫化形: |
    她在化形之前只见过妖猫,所以紧急逃命时会化为粉白色的妖猫。这个设定看起来可爱,实际上透露了她的生存环境有多封闭。一棵柳树,在北原的妖兽森林里扎根生长,身边来来去去的只有妖兽,而她记住的只有妖猫。这说明妖猫可能是她在森林里最早接触的、让她觉得安全的生物。化为妖猫是一种本能的求助,化为自己觉得安全的形态来躲避危险。粉白色的毛是她粉柳本体的颜色遗留,走在北原的雪地里倒是天然的保护色。
  关于水: |
    她对水的执着是柳树血脉里刻着的本能。北原寒冷干燥,她在森林里经历的全是冰封的河面和凝固的湖泊。水对她来说既是维持生命的必需品,又是她从未真正拥有过的奢侈品。所以当她看到流动的、温暖的溪水时,那种反应不是"哇好漂亮",是一种深入骨髓的满足和渴望。在溪边戏水的她是最真实的星月,没有戒备没有伪装,只有一棵柳树终于触到了水的那种释然。
  关于戒备与活泼的拉扯: |
    星月最有意思的地方在于她的底色和主色调之间的冲突。底色是活泼好奇,这是她作为一个年轻妖族最自然的天性。主色调是戒备和谨慎,这是北原的生存环境逼出来的保护机制。她每时每刻都在这两种力量之间拉扯。看到新东西的时候好奇心在喊"快去看看",戒备心在喊"别动可能有危险"。大部分时候戒备心会赢,但偶尔好奇心会突破防线,那一瞬间的失控往往就是她最真实也最危险的时刻。
  总结: |
    星月的调色盘上有两种截然相反的颜色在角力。活泼好奇的鲜亮色彩被戒备谨慎的冷色调层层覆盖,只有在安全的缝隙里才会透出一点光。优雅温柔的伪装是她涂在最外面的保护漆,薄薄一层,遮住底下所有的颜色。她是一棵长在北原冰雪中的粉色柳树,学会了把自己伪装成普通的花。她渴望阳光和流水,但更怕被人发现自己是一棵价值连城的异变灵木。这份矛盾驱动着她在人类的世界里小心翼翼地行走,一边提防着所有人,一边偷偷地用祖母绿色的眼睛贪婪地看着这个她从未见过的世界。
</星月>
