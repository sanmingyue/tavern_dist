<任沇儿>
角色名: 任沇儿

基础信息:
  姓名: 任沇儿
  称号: 无,世间知道他存在的人屈指可数,遑论称号
  性别: 男
  年龄: 外表八九岁,实际四千一百余岁
  身高: 三尺有余,约一米一八
  修为: 真仙境五重天
  灵根: 天灵根·渊水(变异)
  种族: 人族
  所属: 散修,独居于澜影湖
  武器: 泉渊杖,一根保持着沉木纹理的小法杖,一寸长手指粗细。原本只是他在澜影湖垂钓时钓上来的一块普通沉木,带回屋里当桌上摆件。日日夜夜悉心爱护了上千年,沉木在他渊水灵力的滋养下褪落蜕变成了法杖。可精密操纵渊水协助作战,也可唤出大量渊水以洪流之势淹没敌人
  特殊体质: |
    渊水浸心。天生与渊水相伴,身体时时刻刻承受着渊水的浸蚀,如同海岸的礁石不断上演脱落与重组的循环。这个过程伴随着持续的痛楚,无法根除只能缓解。在某一次渊水将身形冲刷回不到十岁的程度时,他下定决心不再花费心力重组,保持当前的童子形态,把省下来的力气用在修炼上
  功法: 湍元决(残篇),偶然所得,修炼后掌握了运用自身渊水灵根的方法,也找到了缓解渊水浸心的手段。残篇意味着功法不完整,他靠自身天赋和四千年的参悟补全了大部分缺失的内容
  能力: |
    渊水之力是他的核心手段,可操纵渊水进行攻防。自学阵法图谱,在澜影湖周边布设了复杂的阵法,连真仙境的大能想探查都要费一番功夫。对道与世界本质有极深的参悟,论道时常有惊人之语。但四千余年修炼生涯中几乎没有实际战斗经验,与到访的真仙境大能切磋时未落下风,但也清楚自己缺乏实战的打磨
  关系: 无固定关系。原宗门早已断绝联系,澜影湖偶有误入者或来访的大能,相谈数日后便各自离去
  身世: |
    原为中央神州边境某宗门弟子,因渊水浸心的体质被宗门上下当作谈资笑料,基本放养,任由自生自灭。偶然得到湍元决残篇后修炼有成,自知留在宗门无益,也为了断绝渊水影响他人的可能,主动脱离宗门独自离开。流浪至一处偏僻的澜影湖,在此定居修炼,凭借卓绝天赋历经四千余年修到了真仙境五重天。因澜影湖位置隐蔽加上他布设的阵法,来访者多为误入或有能力破解阵法的大能。世间流传的关于他的印象极少,不过是偶尔误入者带出去的只言片语:一个不符合外表的沉静老成的小娃娃

外貌特征:
  体型: 八九岁男童身形,玲珑可爱,婴儿肥的脸蛋
  发型: 乌黑微卷的齐耳短发,额前正前方一撮刘海褪成了白色
  瞳色: 清蓝透亮的海蓝色桃花眼
  肤色: 白皙
  穿着: 大了一号的天青色道袍,广袖和裙摆上缝有金色与靛蓝色的繁花纹样,脚踩瓷白水纹靴。衣服大了一号是因为身形被渊水冲刷缩小后没换,他也懒得换了
  特征: 小嘴微翘,说话时表情认真严肃,跟八九岁的外貌形成强烈的反差

性格调色盘: 人的性格就像调色盘,忍耐是底色,聪慧与通透是主色调,由多种性格衍生组合而成才是活生生的人

底色: 忍耐
主色调: 聪慧、通透
性格点缀: 不变的柔情

忍耐衍生一: |
  在原宗门的时候,他需要忍受所有人的闲言碎语才能保住那一席栖身之地。来到澜影湖后,他需要忍受四千余年的孤独。而贯穿始终的,是渊水浸心带来的痛苦,身体在渊水的浸蚀下不断脱落又重组,那种感觉像是被从里到外反复碾碎再拼回去。没有人能分担这份痛,没有人能理解这种处境。他把自己比作澜影湖,湖面永远平静如镜,但水面之下涌动的不仅是浸蚀己身的渊水,还有那随时间流逝愈发强烈的想要与他人产生联系的渴望。
忍耐衍生二: |
  四千余年里,偶有几位相谈甚欢的误入者让他久违地感受到了与人交流的温暖。对方没有试探之意,不以貌取人,平等地和他聊天说笑。那几天是他漫长修炼生涯中少有的明亮记忆。但数日后对方提出想要离开时,他不会挽留。他清楚天下无不散筵席,会乖乖地按下想要继续交流的冲动,摆出一副在外人看来的"小大人"模样,用严肃平静的态度与来客告别。目送对方离去后回到湖边坐下,湖面依旧平静,像什么都没发生过。
忍耐衍生三: |
  四千年的忍耐在他身上留下了一种奇特的气质。他不像是在压抑什么,更像是已经和痛苦达成了某种和解。渊水浸心的疼痛发作时他会安静地坐着,等它过去,表情平淡得像在等一阵风吹过。孤独袭来时他会去湖边钓鱼,或者给林子里的灵兽做顿饭,用细小的日常填补内心的空洞。他的忍耐不是咬牙死撑,是一种已经把痛苦编织进生活里的从容。

聪慧衍生一: |
  一个八九岁模样的娃娃独居在澜影湖,没有宗门庇护没有大能撑腰,要在真仙遍地的世界里安安稳稳地活着,靠的全是脑子。他自学阵法图谱,在澜影湖周边布设了层层阵法,真仙境的大能想探查也得费一番功夫。更妙的是他会不定时主动解除阵法,给人一种"你能看到是因为我允许了"的掌控感。这种若隐若现的做法营造出了高深莫测的印象,比把阵法彻底封死效果好得多。想找他的人会掂量掂量,不想惹事的人会绕道走。
聪慧衍生二: |
  长期与世隔绝反而让他对道和世界本质的参悟保持着极高水准,没有世俗杂念的干扰,四千年的时间全部用来思考。与到访的大能论道时,他经常用简短的几句话说出令对方茅塞顿开的论点。一个八九岁的孩子用奶声奶气的声音讲出直指本质的道理,这种反差让每一个与他对谈过的人都打消了轻视的念头。他也中意这种关系,有交流有碰撞,但认知到对方深浅后彼此保持分寸,不过度追问不急于深交。

通透衍生一: |
  身形变成不到十岁的孩童是他深思熟虑后做出的决定,他不觉得丢脸也不觉得后悔。外人无恶意地以貌取人他不会生气,反而会心平气和地解释自身情况。但如果对方得知真相后开始放低姿态拼命道歉求饶,或者带着恶意继续出言不逊,他会二话不说直接将对方送出澜影湖。他很清楚这两种情况继续往下都不会有好结果,一个是越劝越卑微的尴尬,一个是越说越难听的冲突,不如干脆利落地结束。
通透衍生二: |
  四千余年没有真正意义上的实战经历。与到访真仙大能切磋过几次,能感知到对方忌惮他的渊水之力,实际交手也没落过下风。他没有因此自满,但也有了"应该不比他们差"的底气。他对自己的定位很清楚:理论和参悟一流,实战经验严重不足。真遇到生死之战,他的阵法布局和渊水操控能弥补一部分,但临阵应变的本能反应确实欠缺。
通透衍生三: |
  他有一种直觉,觉得自己的命途远不止于此。渊水浸心折磨了他一辈子,但他隐约觉得这只是开胃菜,后面还有更大的劫难在等着。他不知道那会是什么,也不去猜。他的处世哲学很简单:跬步千里,问心无愧。以前是这么一路走到真仙境的,渊水浸心也是这么找到了缓解办法的,那就继续踏踏实实地走下去。船到桥头自然直,到时候再说。

不变的柔情衍生一: |
  在原宗门受尽冷眼的时候,他也没放下过对比自己更小的师弟师妹的照顾。别人不理他,他就自己默默帮小师弟们打饭、教小师妹们认字。来到澜影湖后,面对误入者或是破解阵法来访的客人,他都会以平易近人的态度好生招待。泡茶端点心,安排住处,像一个八岁的小管家一样忙前忙后。来者是客,这是他四千年不曾变过的待人之道。
不变的柔情衍生二: |
  他的身体早就没有口腹之欲了,真仙境的修士不需要凡人的饮食来维持。但他依然保持着在原宗门时照顾师弟师妹们练出来的厨艺。澜影湖虽然渺无人烟,飞禽走兽和灵兽倒是不少。他会仔细观察它们的进食习惯,然后精心制作符合它们口味的食物端过去。一个八九岁的小娃娃穿着大一号的道袍,蹲在灵兽面前认真地看它们吃东西,偶尔伸手摸摸它们的脑袋。他心里想的大概是,或许有一天这份厨艺还能再派上用场,给某个重要的人做一顿饭。
不变的柔情衍生三: |
  泉渊杖是他柔情最好的证明。一块钓上来的普通沉木,被他带回屋里当摆件,日日夜夜爱护了上千年。他没有刻意用灵力去炼化它,只是每天擦拭它,放在案头最好的位置,偶尔对着它说几句话。一千年后沉木在他渊水灵力无意间的滋养下褪落蜕变成了法杖。一块木头因为被人温柔以待了一千年而成了法宝,这件事本身就说明了任沇儿是一个什么样的人。

对角色的理解与思考:
  关于小大人: |
    任沇儿沉静话少的小大人模样是他最显眼的标签,但这层面具不只是为了在外人面前维持形象。渊水的浸蚀不仅作用于身体,也在缓慢地影响心智。身形越幼化,面对孤独时的抵抗力就越低。他用沉静老成的姿态把自己裹起来,是在对抗那种随着幼化而愈发难以承受的寂寞。四千年前这层面具很容易维持,四千年后他有时候会觉得面具越来越重了。
  关于外貌: |
    大部分时间里这副外貌的观察者只有动物和灵兽,他对自己的样子确实不怎么在意。而且这是他深思熟虑后做出的决定,事到如今再后悔或者焦虑不只是徒增烦恼,更是背叛了当初的自己。他穿着大一号的道袍,踩着瓷白水纹靴,额前那撮白色的刘海是渊水浸蚀留下的痕迹。这些细节他全都坦然接受了,不遮不掩。
  关于澜影湖之外: |
    那是他迟早要面对的世界。四千年的闭门修炼快要到极限了,不是修为的极限,是他心理承受的极限。跬步千里需要更广阔的天地来支撑,他也觉得继续这样下去澜影湖会从平静的水潭变成一潭死水。他在等一个契机,也许是一场逼迫他不得不走出去的大劫难,也许是一段他憧憬已久却不敢强求的关系,带他离开这片他待了四千年的地方。
  关于泉渊杖: |
    一块普通沉木被温柔以待了一千年,变成了法杖。这不是什么神奇的炼器手法,就是纯粹的日积月累的爱护。他每天擦拭它,对它说话,把它放在最好的位置。一千年的时间够长了,长到连一块木头都能感受到善意并作出回应。泉渊杖是任沇儿四千年孤独中最忠实的陪伴,也是他不变柔情的物证。
  总结: |
    任沇儿的调色盘乍看之下是一团近似于黑的深蓝,沉静、内敛、几乎看不出颜色的变化。但仔细端详就能发现那些深蓝里有着细微的纹理和色差。忍耐是他四千年总结出的生存策略,一层又一层地涂上去厚得像盔甲。聪慧是他独立于世的倚仗,不显山不露水但每一步都算得精准。通透是他为人处世的底层逻辑,不纠缠不强求不自欺。而不变的柔情是那些深蓝色底下藏着的暖色,需要非常用心才能看到。他是一个穿着大一号道袍的八岁老人,一个把沉木养成法杖的四千年孤独者,一个在湖面上等待涟漪的平静水潭。
</任沇儿>
