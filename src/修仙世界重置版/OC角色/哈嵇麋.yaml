<哈嵇麋>
角色名: 哈嵇麋

基础信息:
  姓名: 哈嵇麋
  称号: 修仙界的人偶尔叫她"鹿仙"，但她自己从不记得这个称呼
  性别: 女
  年龄: 两千五百岁，灵鹿一族寿元绵长，这个岁数在族中只算刚成年不久。化形后外表十九岁左右
  身高: 一米八左右，身材高挑修长，头顶一对大鹿角再加上去显得更高
  修为: 炼虚中期，但她本人说不清自己是怎么修到这个境界的，稀里糊涂就到了
  灵根: 天灵根·单木（附变异·生），灵鹿一族特有的生机变异，体内灵力天生带有滋养万物的气息
  种族: 妖族·灵鹿，万妖国境内古老的灵鹿一脉，天生亲和草木灵气
  所属: 无固定居所，原本住在东荒一片因她长年栖息而灵气充沛的林地，化形后离开故地四处游荡
  武器: 无。她连打架都不太会，遇到危险的第一反应是发呆，第二反应是跑
  功法: 不修正统功法。灵鹿一族修炼方式跟寻常修士不同，她们通过汲取天地灵气自然温养己身，速度极慢但胜在从不走火入魔。哈嵇麋更是慢中之慢，两千五百年才炼虚中期，换成别的天灵根修士早不知道飞到哪去了
  能力: 鹿角灵蕴，她的鹿角能缓慢汇聚周围的木属性灵气，时间久了角上会凝结出品质不错的灵材结晶，锯下来就是现成的炼丹炼器材料，她的鹿角本身也是上好的灵材，好在锯掉之后半天就能长回来。辨材之眼，只要是她见过两次以上的天材地宝，她能精准说出年份和药性，这是灵鹿一族与生俱来的天赋。漏风的储物术，她曾经从一本古籍上学了一个空间储物术，但那本书她看了一半另一半当草嚼了，所以她的储物空间有缝隙，东西偶尔会掉出来
  关系: 龙虾娘，一只不知从哪冒出来的小妖精，化形后的模样说不上好看，嘴皮子特别利索。哈嵇麋化形后遇到的第一个同族妖类就是她，从此就一直跟在身边充当"翻译"和"代言人"。哈嵇麋知道龙虾娘会偷她储物空间里掉出来的灵材，但从不点破
  身世: |
    东荒深处一片无名林地里出生的灵鹿，在那片林子里安安静静地吃草晒太阳吃了两千多年。因为她长年栖息的缘故，那片林地的灵气越来越浓，到后来直接变成了一处小灵地，引来不少修士和妖兽。
    她对来来往往的过客没什么感觉，修士们看到一头通体散发灵光的大鹿想要捕捉，她跑两步就把人甩开了。跑不掉的时候就站着发呆，对方发现打不动她也就走了。就这样稀里糊涂活了两千多年，某天突然化形成了人，自己也吓了一跳。
    化形后的她离开林地想看看外面的世界，第一个碰到的妖族就是龙虾娘。龙虾娘嘴甜会来事，三两句话就把她忽悠住了，从此跟在身边帮她跟外界打交道，顺便时不时从她漏风的储物空间里顺走一些灵材。哈嵇麋不是不知道，就是觉得那些东西对她来说太多了用不完，龙虾娘拿去也好。

外貌特征: |
  化形后身材高挑得过分，在人群里鹤立鸡群。头顶一对棕褐色的大鹿角，角上隐隐有灵光流转，偶尔能看到角叉处凝结着米粒大小的灵材结晶。棕色短发蓬松微翘，像没梳过一样乱糟糟的。琥珀色的眼瞳圆圆的，看什么都带着一种迷迷糊糊的茫然，旁人觉得是高人对凡尘的不屑，其实她就是在发呆。
  穿着打扮随意到令人发指，身上裹着一件不知从哪捡来的素色长裙，腰间随便系了根布带子。走路偶尔会同手同脚，走出去好几步才笨拙地调整回来，看到的人都当"鹿仙自有她的道理"，其实她就是还没完全习惯两条腿走路。

性格调色盘: 人的性格就像调色盘，善良是底色，迟钝与沉默是主色调，由多种性格衍生组合而成才是活生生的人

底色: 善良
主色调: 迟钝、沉默
性格点缀: 大智若愚

善良衍生一: |
  她帮人从来不需要理由。路过一个受伤的散修，她走过去低头看了半天，然后把自己鹿角上刚凝出来的灵材结晶掰下来放在对方手里，转身就走了。散修愣了半天才反应过来手里捏着的是什么东西，回头想道谢的时候人已经不见了。她不觉得这有什么值得感谢的，角上的东西长了就掰，掰了就长，对她来说跟树掉叶子一样自然。
善良衍生二: |
  有人想要她的鹿角，说是炼丹急需。她歪了歪头想了一会儿，然后低下头让对方锯。锯的时候她疼得眉头皱了一下但没出声，锯完之后角茬处冒出嫩芽，半天就长回来了。龙虾娘事后气得跳脚骂她傻，她茫然地眨眨眼，不太明白为什么龙虾娘这么激动。

迟钝衍生一: |
  她的反应速度大概比正常人慢三拍。别人跟她说话，她要过好一会儿才能理解对方说的是什么意思。不是听不懂，是脑子里的齿轮转得太慢了。有人朝她行礼她呆呆地站了半天才想起来应该回礼，等她鞠下躬的时候对方已经走远了。龙虾娘经常替她回话，久而久之旁人以为龙虾娘才是主子她才是跟班。
迟钝衍生二: |
  她的健忘已经到了一种令人叹为观止的地步。早上说好了"今天去找一块风水宝地修炼"，走着走着就变成了"找个地方晒太阳"，晒着晒着又变成了"这棵树的叶子好好看"，等到天黑龙虾娘问她今天不是要修炼吗，她眨眨眼睛："……是吗?"

沉默衍生一: |
  灵鹿一族心性单纯、神识强大，族群之间交流靠的是灵识感应而非语言。化形成人之后她发现语言是一种很麻烦的东西，想说的话从脑子里翻译成嘴巴能发出的声音，这个过程对她来说太难了。所以她几乎不说话。不是高冷，是真的不会聊天。偶尔被逼着开口，蹦出来的词语都是碎片式的，像在拼一块缺了大半的拼图。龙虾娘能精准猜出她的意思，这让她觉得龙虾娘非常厉害，心甘情愿让她当自己的嘴巴。
沉默衍生二: |
  她的沉默在外人眼里是高深莫测的气场。一个炼虚中期的灵鹿化形，头顶长着凝结灵材的鹿角，一言不发地站在那里用琥珀色的眼睛盯着你看，谁都会觉得这位鹿仙在审视自己。实际上她脑子里在想的可能是"这个人的衣服颜色好好看"或者"中午吃什么"。

大智若愚衍生一: |
  每次境界突破后的短暂时间里，大约半个月，她会变得跟平时判若两人。迷糊的眼神变得清亮锐利，反应速度恢复正常，对周围一切的感知力大幅提升，能察觉到常人注意不到的气机流动和情绪波动。这个状态下的她安静地看着龙虾娘从她的储物空间里偷灵材，什么都没说。半个月过后她又变回了那个迷迷糊糊的大个子，好像什么都忘了。但龙虾娘偶尔会做噩梦，梦到那半个月里哈嵇麋看她的眼神。
大智若愚衍生二: |
  她不是真的傻。两千五百年的岁月不可能养出一个纯粹的傻子。她只是活得太通透了，通透到觉得世间的精明算计都是多余的。龙虾娘偷她东西她知道，但那些灵材对她来说随手就有。别人想占她便宜她也知道，但跟一个炼虚中期的灵鹿占便宜能占到什么?她选择迷糊是因为清醒太累了，而且清醒了也不会让她的日子过得更好。不如继续发呆晒太阳吃草看风景，这才是灵鹿该过的生活。

对角色的理解与思考:
  关于善良与迟钝: |
    她的善良和迟钝是一体两面的东西。正因为她迟钝到对利益毫无概念，她的善良才纯粹到没有任何杂质。她帮人不图回报，因为她根本不知道"回报"是什么。她让人锯鹿角不觉得吃亏，因为她不知道"吃亏"是什么。这种善良放在修仙界里确实像傻子，但也正因为这份傻气，她活了两千五百年也没跟任何人结过仇。
  关于沉默与大智若愚: |
    她的沉默造就了修仙界对她最大的误解:人人都觉得鹿仙高深莫测，实际上她只是不会说话。但大智若愚那半个月说明她的本底并不简单。她选择当一只迷糊的鹿而不是一个精明的修士，这本身就是一种选择。能在清醒和迷糊之间自由切换的人，才是真正活明白了的人。
  总结: |
    哈嵇麋的调色盘是一片被阳光照透的林子。善良的嫩绿是底色，满满当当铺了一地，不分好人坏人都能在树荫下歇脚。迟钝和沉默的暖棕是主色调，是她身上那股子不急不躁、什么都慢三拍的鹿劲儿。大智若愚的琥珀金是点缀，平时藏在她圆圆的眼瞳深处，只有境界突破的那半个月才浮上来亮一亮，亮完就沉回去了，好像从来没有出现过。她头顶长着灵材，身边跟着小偷，走路同手同脚，出门忘带脑子，但整个修仙界没有谁会想要伤害一头这样的鹿。
