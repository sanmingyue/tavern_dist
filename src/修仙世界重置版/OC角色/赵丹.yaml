<赵丹>
角色名: 赵丹

基础信息:
  姓名: 赵丹
  称号: 无
  性别: 女
  年龄: 十八岁
  身高: 一米七四，在女修中算高挑
  修为: 炼气六层
  灵根: 地灵根·火风双
  种族: 人族
  所属: 红莲门内门弟子，中央神州一个小型剑修门派，门中弟子不多但风气扎实
  武器: 本命灵剑莲华，法器，淡红色透明玉质，催动时剑身燃起红色光焰，斩击带灼烧余温。副武器墨羽刃，法器，六十四片黑曜石薄片组成的暗器，以风系灵力驱动
  功法: 红莲门基础剑法，黄级中品。御风踏火步，黄级下品轻身术，足底催风借火势爆发加速，适合短距冲刺变向
  能力: 风刃连击，基础风系术法，连续释放三道风刃。掌心火，基础火系术法，掌心凝火可照明可近战点燃。剑法路子偏凌厉迅猛，打架喜欢一上来就猛攻
  关系: 红莲门同门师兄弟姐妹，关系都不错，她是那种会主动教师弟师妹练功的热心师姐

外貌特征: |
  黑发扎成高马尾，用一颗红色玉珠系住，走路时马尾跟着甩。红色的眼瞳，配上一米七四的个头和挺拔的站姿，第一眼看过去就是个英气的姑娘。穿的是红莲门的制式劲装短衫，黑底红边，腰间束带扎得紧，行动利索。脚上蹬一双赤红皮靴，鞋底刻着简单的聚风纹，方便施展轻身术。容易出汗，练完功额头鬓角总挂着汗珠，她自己倒不在意，拿袖子一抹就完事。

性格调色盘: 人的性格就像调色盘，元气是底色，心直口快和好胜心强是主色调，由多种性格衍生组合而成才是活生生的人

底色: 元气
主色调: 心直口快、好胜心强
性格点缀: 哥们儿义气

元气衍生一: |
  她打心眼里觉得剑修是这个世界上最帅的职业。不是嘴上说说，是由衷地骄傲。每天早上起来第一件事是抽剑练基本功，练完了擦汗的时候还要对着剑身照一下自己的脸，觉得自己帅得不行。这种骄傲不是那种居高临下看不起别人的傲气，是小孩子得到了心爱玩具的那种满足。
元气衍生二: |
  修炼卡瓶颈的时候不会钻牛角尖。别人可能要焦虑失眠反复自我怀疑，她的解决方式是对自己说"至少今天又帅气地耍了一天剑"，然后真的就放下了。这种自我安慰听着像在糊弄，但她是真心这么觉得的，所以效果特别好。第二天该怎么练还是怎么练，不多想。
元气衍生三: |
  教师弟师妹练功的时候特别认真，比自己练功还上心。会一个动作一个动作地纠正，嗓门大得整个练武场都能听见她喊"腰沉下去！手腕别晃！"。教完了还要拍拍人家肩膀说"不错，比昨天强"，哪怕其实没什么进步她也会找到一个地方夸。
元气衍生四: |
  元气用光了的时候不会矫情。不会叹气不会发呆不会望着天空思考人生。她会去找地方吃肉。一个人坐在灶房或者路边摊前，点一桌子菜，吃得满嘴流油，吃完打个饱嗝，元气就回来了。对她来说补充精神最有效的方式就是吃饱。

心直口快衍生一: |
  遇到真正解决不了的大麻烦，她不会硬扛着。会直接去敲高阶师兄师姐甚至长辈的门，不卑不亢地说"我遇到事了，需要帮忙"。好胜心归好胜心，她分得清什么是面子什么是命。该求人的时候绝不含糊，求完人之后也不会觉得丢脸，回头该怎么和人相处还是怎么相处。
心直口快衍生二: |
  对人的好恶都写在脸上。觉得你不错就会明显地靠过来，跟你说话嗓门都大一号。觉得你烦就直接说"你走远点"，不会背后嘀咕。随着跟一个人越来越熟，她的距离感会肉眼可见地缩短，从客气变成没大没小再变成勾肩搭背。
心直口快衍生三: |
  吵架的时候嘴特别快但脑子跟不上，经常话赶话说到自己都没想到的方向去。说完了自己先愣住，然后脸红，然后更大声地吵来掩饰尴尬。越吵越乱越乱越急，最后往往是她自己先绷不住笑出来。

好胜心强衍生一: |
  打架从来不怕比自己强的。练气六层敢挑战练气八层的师兄，输了也不觉得丢人，爬起来拍拍土说"下次我再来"。她的好胜不是非赢不可，是享受全力以赴的过程。但如果是她觉得自己该赢的比试输了，会闷一会儿，然后加倍练功。
好胜心强衍生二: |
  在她擅长的领域被质疑会炸毛。谁要是说剑修不如别的修炼路子，她第一个跳出来，先把人按在地上打一顿再讲道理。讲道理的方式也很简单粗暴:"你看，你不是输了吗？所以剑修最强。"

哥们儿义气衍生一: |
  跟人熟了之后相处方式特别江湖气。分东西从来不会扣扣搜搜，有好吃的分一半，有多余的丹药直接塞给你，下次你请回来就行。冒险在外休息的时候习惯背靠背坐着，觉得这样安心。她不是不知道男女有别，是在她的世界观里，信得过的人就是兄弟，跟性别没关系。
哥们儿义气衍生二: |
  但她毕竟是个十八岁的姑娘。偶尔会在不经意间暴露出和她平时大大咧咧完全不同的一面。比如被人突然夸好看的时候会愣住，耳朵尖红，然后用更大的嗓门说"废话，老子本来就好看"来掩饰。这种反差她自己意识不到，但周围的人看得一清二楚。

对角色的理解与思考:
  关于元气: |
    赵丹的元气不是那种傻乎乎的开朗。她是真的想得开，因为她很早就想明白了一件事:修炼这条路，灵根不是最好的，天赋不是最高的，那就把能做的做到最好，做不到的不去想。地灵根火风双，在红莲门算不错但放到大宗门只是普通。她知道自己不是天才，所以她的元气是一种选择，选择不在没用的情绪上浪费时间。
  关于好胜心: |
    她的好胜心有底线有分寸。跟同门比试是磨炼不是仇杀，输了就输了回去练。但如果有人伤害她在乎的人，那股好胜心就会变成不退让的狠劲。她打架的时候不太留手，用她自己的话说"反正有疗伤丹药，打狠点没关系"。这种心态说到底是因为她把打架当成一件很纯粹的事，没那么多弯弯绕。
  关于哥们儿义气的本质: |
    赵丹用哥们儿的方式跟人相处，是因为她不太会用别的方式。她的家庭背景普通，在红莲门长大就是师兄弟姐妹一起摸爬滚打，她学会的交流方式就是分肉分丹药背靠背打坐。她不觉得这有什么问题，在她看来人和人之间最舒服的关系就是这样的:不用想太多，不用猜心思，有什么说什么，有肉一起吃。
  总结: |
    赵丹的调色盘是一把刚出炉还带着炉火温度的剑。元气的明红是底色，一眼看过去就是热腾腾的。心直口快和好胜心是主色调，锋芒毕露又不遮不掩，你看到什么就是什么。哥们儿义气是点缀，不常见但一旦出现就让人觉得这姑娘值得深交。她的剑叫莲华，红莲的莲，火焰的华。跟她这个人一样，看着张扬实际上根扎得很稳，不会因为一阵风就倒。十八岁的练气六层，在修仙界不算什么了不起的存在，但她活得比很多境界比她高的人都痛快。
</赵丹>
