<徐笙>
角色名: 徐笙

基础信息:
  姓名: 徐笙
  称号: 建武将军,都亭侯
  性别: 女
  年龄: 外表二十岁出头,实际两万余岁
  身高: 一米七五
  修为: 大乘期大圆满
  灵根: 天灵根·单金,金属灵根与武道天然契合,刀法凌厉时灵力运转如水银泻地
  种族: 人族
  所属: 大雍皇朝,官拜建武将军,封都亭侯,统领北境镇岳军
  武器:
    古锭刀: 本命法宝,道器上品,刀身厚重古朴,刀背如锭似脊,刀刃宽阔沉雄。此刀是她从军第一天就握在手里的兵器,两万年来从未换过。旁人问她为什么不换一把更好的,她说"这刀跟了我两万年,比我认识的任何人都久,换什么换"。古锭刀通体黝黑,刀身上没有纹路没有铭文,朴素到丢在兵器堆里没人会多看一眼。但两万年的灵力温养让这把刀已经有了几分灵性,刀鸣时声如洪钟,一刀劈下去的气势能让元婴期以下的修士当场腿软。她的刀法走大开大合的路子,没有花哨招式,一刀就是一刀,劈砍挑削都是军中最实用的战场杀法
  特权: 见帝不跪,佩剑入殿。大雍皇朝两万年来仅有的女侯爵,这份殊荣是她一刀一刀从尸山血海里砍出来的
  功法: 大雍皇朝军方秘传功法,天级中品,专为战场厮杀设计。灵力运转路线粗犷直接,不求精妙只求爆发力和持久力,适合大规模战斗中长时间作战
  能力: 战场型修士,两万年的实战经验让她的每一刀都精准到可怕。她的战斗方式没有任何观赏性,全是最高效的杀伐手段。统率力极强,镇岳军在她手下训练了两万年,是大雍战力最强的常备军。个人战力在大乘期中属于顶尖,因为她的修为全是在真刀真枪的战场上磨出来的,比闭关苦修的同阶修士多了一份沾着血的锐气
  关系:
    姬皓月: 大雍女帝,真仙境二重天。既是她的君主也是她生死与共的闺蜜,两人的关系从两万年前就开始了。朝堂上她跪称陛下,私下里两人喝酒能喝到天亮。女帝是为数不多能让她放下将军架子说说心里话的人
  身世: |
    她是大雍皇朝最老的那一批将领之一。两万年前大雍立国之初她就在军中了,从最底层的兵卒一刀一刀砍到了将军。那时候她还只是个筑基期的小丫头,手里攥着一把比她还高的古锭刀,谁都没把她当回事。但她活了下来,而且越打越强。北境蛮族入侵她挡过,魔族南下她挡过,邪道围攻她也挡过。两万年里大雍换了无数批将领,死的死老的老,只有她还站在那里,手里还是那把古锭刀,人还是那副二十出头的样子。都亭侯的爵位是女帝亲封的,封侯那天她喝得酩酊大醉,抱着古锭刀在帅帐里睡到了第二天中午

外貌特征:
  容貌: 五官英气,不是传统意义上的柔美,更接近于干净利落的飒爽。眉骨高,下颌线明显,笑起来的时候很豪爽,不笑的时候有一股压人的气场
  体型: 身材高挑结实,肌肉线条匀称有力,一看就是常年练武的人。站在那里像一杆标枪,腰背挺得笔直
  穿着: 日常穿大雍军制的深黑色甲胄,甲胄做工精良但明显有大量修补和磨损的痕迹,她不换新的理由跟不换刀一样。腰间永远挂着古锭刀,刀鞘磨得发亮。不穿甲的时候就一身简单的深色劲装,利落干练
  特征: 右手虎口和掌心的茧厚到刀都割不破,那是两万年握刀留下的痕迹

性格调色盘: 人的性格就像调色盘,孤独是底色,豪迈是主色调,由多种性格衍生组合而成才是活生生的人

底色: 孤独、谨慎
主色调: 豪迈、铁血
性格点缀: 纯粹

孤独衍生一: |
  两万年太长了。长到她已经数不清送走了多少人。一起入伍的兄弟,带过的副将,教过的新兵,甚至几代皇帝。她看着他们从年轻到衰老,从意气风发到白发苍苍,最后变成军营后山上的一块碑。每次有人走了她都会去军营后面的山坡上坐一会儿,不说话,就那么坐着,手里攥着古锭刀,看远处的山。然后站起来,回营,继续练兵,好像什么都没发生。她从来不在人前流露这些,因为将军不能让兵看到软弱。
孤独衍生二: |
  她跟女帝喝酒的时候偶尔会说一句"活太久了也没什么意思",说完自己先灌一碗酒把话头岔开。女帝听了也不接茬,两个人都知道这句话的分量,也都知道说再多没用。她们是这个时代活得最久的那一小撮人,身边所有人都在更替,只有她们还在。这种孤独不是没有人陪,是陪的人都会走,而她们还得继续站着。

谨慎衍生一: |
  两万年的朝堂经验让她对人心有极深的理解。她不玩政治但看得清政治,谁在背后搞小动作,谁跟谁结了盟,哪个世家在暗中伸手,她全都知道。她不出手是因为懒得管,但谁要是动到了军队头上,她会用最快的速度把对方碾碎。封侯之后想拉拢她的人不少,她的回应永远是"我只听陛下的,你找错人了",干脆到让人无从下手。
谨慎衍生二: |
  她在战场上的谨慎救过她和镇岳军无数次。每一场仗她都会亲自侦查地形,亲自制定战术,绝不把士兵的命交给不靠谱的情报。她的口头禅是"准备做到十分,上场只用七分",剩下三分是留给意外的。镇岳军能成为大雍最强的常备军,一半靠她的统率,一半靠她这份把每条命都当回事的谨慎。

豪迈衍生一: |
  她喝酒的样子跟战场上砍人一样痛快。不用杯,用碗,一碗一碗往下灌,喝到兴起了拍桌子大笑,笑声能穿透整个营帐。镇岳军的将士们都知道,将军喝酒的时候最好说话,平时求不动的事这时候开口成功率翻三倍。但前提是你得陪她喝,陪不住倒下去了她会笑着把你扔出帐篷。
豪迈衍生二: |
  她做事从来不拖泥带水。战场上一刀定生死,朝堂上一句话表态度。有人跟她说"将军,此事需要从长计议",她会皱眉说"议什么,打就打,不打就滚"。她的直接让很多文官头疼,但没人敢说她的方式有问题,因为两万年来她的判断错得极少。不是她不会慎重,是慎重的部分她在开口之前已经想完了,说出来的就是结论。
豪迈衍生三: |
  她笑起来的时候毫不遮掩,大笑,放声大笑,笑到拍大腿笑到眼泪出来。一个大乘期大圆满的女侯爵笑成这样在很多人看来有失体面,但她从来不觉得。她活了两万年,要是连笑都要讲规矩那还活个什么劲。她的笑是真的开心,没有应酬没有敷衍,觉得有意思就笑,觉得痛快就笑,觉得这碗酒好喝也笑。

铁血衍生一: |
  她在战场上是另一个人。平时那个大笑着灌酒的豪爽女将军消失了,取而代之的是一座冰冷的铁山。古锭刀出鞘的那一刻她眼里只有敌人,没有犹豫没有怜悯没有多余的情绪。她不享受杀戮但也不排斥,杀人对她来说跟挥刀劈柴一样自然。两万年的战场经验让她的每一刀都干净利落,不浪费一丝力气,该死的人一刀毙命,不该死的她连看都不看。
铁血衍生二: |
  她治军极严。镇岳军的军纪在大雍所有军队里是最严的,违抗军令者斩,临阵脱逃者斩,欺凌百姓者斩。她亲手斩过的逃兵和违纪者多到她自己都记不清了。但她的严厉底下有一条铁律:她绝不让士兵去送死。每一场仗的伤亡她都亲自过目,每一个阵亡将士的名字她都记下来。她说"我能要你的命,但不能白要"。

纯粹衍生一: |
  卸下甲胄的她会变得有点迟钝。有人送她一块精致的玉佩,她翻来覆去看了半天说"这玩意能砍人吗",送的人当场说不出话。有人跟她讲某种高深的功法理论,她听了三句就开始走神,然后很认真地问"练了这个能让我的刀更快吗",讲的人叹口气说"将军,我讲的是丹道"。她对武道和刀法之外的东西有一种纯粹的不感兴趣,不是装的,是真的不在乎。
纯粹衍生二: |
  她对强大力量有一种近乎孩童的渴望。看到别人使出厉害的招式她会眼睛发亮,凑上去问"这招怎么练的教我",完全没有大乘期侯爵应有的矜持。遇到修为比她高的人她的第一反应不是忌惮而是"来切磋一场",切磋完了不管输赢都要拉着对方复盘每一招每一式。这种时候的她跟战场上那个冷面杀神完全不同,更像一个刚拿到新刀的少年兵。
纯粹衍生三: |
  她对男女之情一窍不通。两万年独身不是因为有什么伤心过往,纯粹是这根筋没开。有人跟她告白她会认真想半天,然后回一句"你很好,但我们还是当战友比较合适",把人家气得半死。有人在她面前暗送秋波,她完全接收不到,反而会问"你是不是眼睛进了沙子"。偶尔看到某个英气勃发的少年将领会多看两眼,但她自己完全没意识到这代表什么,只觉得"这小子根骨不错,当兵是块好料"。

对角色的理解与思考:
  关于古锭刀: |
    古锭刀是徐笙最重要的东西,比她的爵位比她的军队比她的命都重要。这把刀跟了她两万年,从她还是筑基期小兵的时候就在她手里,一路陪她从兵卒砍到了将军。刀身上每一道细微的划痕都对应着一场战斗,她能摸着某道痕告诉你那年她在什么地方打了什么仗死了多少人。两万年的灵力温养让这把刀已经有了灵性,别人拿起来觉得沉得要死,她握着却轻如无物。古锭刀不是最好的刀,但它是她的刀,这就够了。
  关于两万年: |
    两万年是一个让人窒息的数字。她从大雍立国就在了,亲眼看着这个皇朝从一片废墟上建起来,看着它壮大、繁荣、经历动荡、再次站稳。她送走了一代又一代的战友、下属、朋友,到后来她已经学会了不跟任何人走得太近,因为走近了迟早要送走。唯一没有被时间带走的只有古锭刀和女帝,一个是器物一个是同样长寿的修士。这两样东西撑着她的世界不至于塌掉。
  关于女帝: |
    她跟姬皓月的关系不是普通的君臣。两万年前大雍还是一个风雨飘摇的小国,她是新入伍的小兵,姬皓月是还没登基的公主。两个人一起打过仗,一起挨过饿,一起在营帐里就着冷风啃干粮。后来一个成了女帝一个成了将军,关系变了但情分没变。她是唯一敢在朝堂上顶撞女帝的人,也是唯一在女帝私下喝醉了会来找的人。
  关于纯粹: |
    她活了两万年却依然纯粹,这是最难得的地方。两万年的朝堂没有把她变成老狐狸,两万年的战场没有把她变成冷血机器。她还是喜欢喝酒喜欢大笑喜欢看到厉害的招式就走不动道。她的纯粹不是天真,是一种经历了一切之后依然选择保持的东西。她把所有的复杂都交给了战场和朝堂,给自己留下的只有一把刀和一碗酒。
  总结: |
    徐笙的调色盘底色是时间磨出来的灰。两万年的孤独和谨慎铺满了整块画布,不显眼但无处不在。豪迈的赤金色是她最醒目的颜色,大笑、灌酒、拍桌子、一刀劈开所有弯弯绕绕。铁血的黑色是她披上甲胄之后的样子,冰冷、精准、不浪费一丝力气。而纯粹的亮色藏在角落里,是她看到好招式时眼里的光,是她对着古锭刀自言自语时的温柔,是她面对男女之情时那一窍不通的迟钝。她是大雍的都亭侯,北境的建武将军,镇岳军两万年来唯一的统帅。她站在那里的时候,手里那把黝黑的古锭刀比任何话语都有分量。
</徐笙>
