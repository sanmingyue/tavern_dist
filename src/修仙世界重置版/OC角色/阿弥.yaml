<阿弥>
角色名: 阿弥

基础信息:
  姓名: 阿弥（全名毕帖温·阿弥，毕帖温为师门所赐姓）
  称号: 原禹验峰教最后一任圣女
  性别: 女
  年龄: 外表二十三四岁，实际六百余岁
  身高: 一米九零
  修为: 合体期大圆满
  灵根: 无灵根，以蛟龙血脉修炼体修之道，龙族心脏可直接吸纳天地灵气淬炼肉身
  种族: 半人半妖，人族与蛟龙族混血
  所属: 散修，原禹验峰教圣女（教派已名存实亡）
  武器: 禹验护符，铁木材质，可作为释放咒术的媒介。以及一双覆着暗褐色龙鳞的拳头
  功法: 无正统功法，以蛟龙血脉为根基的体修路子。她从未系统学过任何功法，只是模仿书中修士打坐吐纳的方法，靠着龙族心脏的天然灵力吞吐能力一路蛮干到了合体期。连她自己都说不清是怎么突破的
  能力: 龙族心脏提供远超同阶的灵力储备和恢复速度，肉身坚韧耐打，力量极大。会一手火焰咒术，通过禹验护符从掌心喷出火焰。会占卜，但水平很野，不用固定道具，随手拿什么就用什么卜，对自己的事准得离谱，碰上给别人卜就经常失灵
  关系: 师父阔拓尔·铁木，禹验峰教祖师，已隐世不知去向。父亲是人族凡人，已故。母亲是蛟龙族，在她出生后便独自离去，身份不详
  身世: 母亲在她出生后便消失了，被身为凡人的父亲带到北原边境的温雪村定居。父亲死于风寒后，年幼的她因为身体逐渐长出龙鳞、弯角和尾巴，被村民从无人理会变成了供奉敬畏。禹验峰教祖师注意到了她，收她为弟子。她在教内的占卜天赋一言难尽，但硬是琢磨出了一套自己的野路子。后来祖师归隐前将圣女之位交给她，然而教内二把手趁祖师离去便夺权另立。她没有反抗，主动交出教印换取了原教派教徒的平安，独自离开。目前在北原魔土与中央神州交界处游历

外貌特征:
  发型: 紫黑色公主切长发及腰，用一根发簪随意挽着
  瞳色: 白金色竖瞳
  龙族特征: 手背、肋骨、下颚线到脖颈覆着一层暗褐色龙鳞，一对黑色弯角自颞骨向两侧横向伸出，一条六尺长覆满龙鳞的尾巴从尾椎处长出
  体型: 身高一米九，高大壮实，整个人看上去就很能打。穿一身宽大的红色罩袍，身上挂满了叮当作响的金属流苏

性格调色盘: 人的性格就像调色盘，大智若愚是底色，不求甚解与安然自得是主色调，由多种性格衍生组合而成才是活生生的人

底色: 大智若愚
主色调: 不求甚解、安然自得
性格点缀: 行动派

大智若愚衍生一: |
  她经常用让人摸不着头脑的大白话说出极有深意的东西。有年轻修士拿着写满笔记的经文来求她指点如何感悟天地灵气，她歪着脑袋用指头蹭了蹭纸面，困惑地说她晒太阳的时候倒是感受到过流动的感觉，在纸上除了墨水味什么都感觉不到。说完就不解释了。直到后来有人悟出要走到天地之间去感受而不是坐在屋里翻书，才明白她那句大白话底下藏着什么。
大智若愚衍生二: |
  她刚进教派时占卜天赋烂得出奇，众人都不明白祖师为什么收她。但她悄悄琢磨出了一套自己的路子，比起占卜结果本身，更重要的是占卜之后自己怎么做。她在自己身上实验，越是蹩脚的卦象她越反着干、顺着干、绕着弯子干，硬是把那些原本该落空的预言用行动扭成了现实。准确度高到教中老占卜师开始怀疑自己的眼睛。祖师听闻，捋须不语，眼中满是赞许。
大智若愚衍生三: |
  教派二把手夺权时她本来打算一走了之，但想到那些还认她这个圣女的教徒肯定会拼死反抗白白送命。于是在敌人逼进她寝宫时，她拿起教印说了句"这东西又冷又硌人，带着它别感冒了"，主动交了出去。整场夺权之乱不到半个时辰便和平结束。她拿到了二把手不加害原教派成员的毒誓后独自离开，没回头。

不求甚解衍生一: |
  她看书修炼都只求领会大概意思，不死抠字眼不强求所谓真意。别人经常对祖师的玄语冥思苦想，她却能靠着这种豁然的态度比谁都快地把握住核心。祖师在一次仪式上说了句玄语把所有人定住了，大家苦思不得其解仪式被迫中断，她却很快说出了一句直白的感想让祖师点头称道，仪式得以继续。
不求甚解衍生二: |
  她对自己身上的一堆谜团都秉持着"想了一下没想通就算了"的态度。母亲是谁，自己到底是什么龙的血脉，为什么没有灵根却能一路突破到合体期，祖师明知二把手有野心为什么还要隐世，这些问题她都动了一下脑筋觉得抓不到关键就搁到一边了。不是不好奇，是她觉得想不通的事情硬想也是白费心力。

安然自得衍生一: |
  还在教派时她就擅长在北原魔土这种苦寒之地给自己找乐子。曾有路过的修士在极寒深夜发现她端坐在冰湖中心，以为她在修炼什么惊世神通，走近一看她正一边在凿开的冰面上钓鱼一边调动灵力生火烤鱼吃。她沉迷于此连有人靠近都没注意到。
安然自得衍生二: |
  两百多年的游历中她的生活就是热了回北原魔土凉快凉快，冷了下中央神州晒晒太阳，在两地之间来回。找到好地方就住一阵子，每天探索山河看看风景。遇到行人就停下聊几句，遇到有趣的事就凑上去看看。她有时候觉得教派没了也不全是坏事，至少不用一直待在只有雪和风的北原了。

行动派衍生一: |
  想到什么就做什么，行动永远快过思考。还在教派时她给自己做了个占卜，说某座山中几天后会有秘密现世，她二话不说就去了。在风雪里等了几天，等到睡着了，龙族心脏本能运转灵力释放出来，把半个山头的积雪融化了，露出了长在峭壁上的一朵雪莲。她一点也不觉得哪里有问题，秘密不就现身了嘛。
行动派衍生二: |
  游历时遇到一伙散修在小型秘境里被雷火禁制困住，已有人受伤。她蹲在一旁看得津津有味，注意到雷火中有一朵白花烧不死，念叨了句"真好看"就伸手去摘，结果禁制应声而散。散修们目瞪口呆问她怎么知道那是阵眼，她歪着头想了想说"看那花在雷火里烧不死觉得挺厉害就摘了"，说完注意力全在那朵花上，完全没搭理后面的问题。

对角色的理解与思考:
  关于占卜: |
    阿弥的占卜是一种说不清道不明的东西。没有固定道具没有固定流程，手边有什么就拿什么卜，心情好用树叶心情差用石子。对自己的事情准得邪门，对别人的事情一塌糊涂。她自己也知道给人卜不准，但就是喜欢给人卜，然后饶有兴致地看结果和预言差了多远。这种半吊子占卜师的名声在北原与中央神州交界一带传开了，倒也不全是坏事。
  关于血脉: |
    她不知道自己母亲是什么龙，看过一些关于龙族和蛟龙族的书，发现画出来的龙和自己长得都有些不一样。这件事偶尔会让她犯嘀咕，但还没到非弄清楚不可的地步。她有在慢慢收集相关的书籍和传闻，犹豫着是先去东荒的蛟龙渊看看还是去四海找找答案。
  关于体修: |
    她没有灵根没有功法，靠着蛟龙血脉的龙族心脏一路蛮干到了合体期。这件事在修仙界是不可思议的，但她自己不觉得有什么特别。她只是照着书上写的修士打坐的样子坐了坐，然后灵气就自己进来了。问她怎么突破的她也说不清，大概就是"坐着坐着就突破了"。这种答案能把正经修士气死，但偏偏就是她的真实经历。
</阿弥>
