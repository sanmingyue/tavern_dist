<长离>
角色名: 长离

基础信息:
  姓名: 长离
  称号: 前大雍皇朝中书侍郎,现北疆霜风城参事
  性别: 女
  年龄: 外表二十出头,实际约三百岁。天灵根·单火的天资本可以走得更远,但她把大半时间花在了政务上,修为进展远慢于同等灵根的修士
  身高: 一米六八
  修为: 元婴前期。以她的天资这个境界算慢的,但她不在乎。她觉得修为够用就行,能让她在朝堂上有话语权、在危急时保护身边的人,就足够了。附带卜算师的底子,算不上精通但足以在布局时多看几步
  剑心境界: 剑意
  灵根: 天灵根·单火
  种族: 人族
  所属: 大雍皇朝北疆霜风城参事,辅佐北疆驻守长官处理边务。前大雍皇朝中书侍郎,从三品,中书令的副手。被贬之前在天启城的权力中枢待了一百多年,算得上年轻有为
  武器:
    赫奕流明: 本命飞剑,宝器下品。剑身通体赤金,像一根凝固的火羽,剑柄处缠着一圈细密的灵纹。这把剑是她异火觉醒时以灵鸟的心血与飞翎化火凝铸而成,与她的南明离火同源,出剑时剑身会燃起淡淡的赤焰。剑如其名,赫奕是光辉灿烂,流明是流转的光芒,但她平时把飞剑收在体内,很少拔出来
  异火:
    南明离火: 六品异火,她的天生灵火。天灵根·单火中极稀有的变异,灵根觉醒时同步化出的本命灵火,与她的生命绑定。火焰呈明丽的朱红色,不像普通火焰那样暴烈,反而很安静,像一盏灯。平时她把南明离火收敛在灵根深处,只在战斗或炼器时释放。全力催动时她的额前会浮现一枚翎羽状的火焰印记,半透明的,像一只单独的眼睛,被称作"心眼"
  功法: 南明离火诀,自己摸索出来的功法,没有师承。以南明离火为核心驱动灵力运转,兼修卜算之术。功法品质不高但跟她的灵火完美契合,别人学不了她也教不了
  能力: 元婴前期的修为加上天灵根·单火和六品异火的底子,战斗力在同阶中算上游。但她的真正强项不在战斗而在谋略和政务,她是一个会打架的谋士而不是一个会谋划的武者。卜算方面有些底子,不算精深但足以辅助判断和布局
  关系:
    大雍朝廷: 她在天启城经营了一百多年的人脉,被贬之后大部分关系断了,但还有少数旧部暗中与她保持联络。朝中有人恨她,有人怕她,有人惋惜她,没有人敢小看她
    霜风城百姓: 贬到北疆之后她没有颓废,反而把边城治理得井井有条。百姓敬她但不太亲近她,因为她那种温文尔雅的气度在边城粗犷的民风里显得格格不入
    北原魔道: 霜风城紧邻北原边境,是大雍面对北原魔土的第一道屏障。魔道势力一直在试探这座边城的防线,长离来了之后他们发现这座城突然变得不好啃了
  身世: |
    她出生在大雍北部一个偏远的村落。村子太小,连名字都没有,就是地图上一个不起眼的点。她还是幼童时村子就被路过的魔修屠了个干净,原因不明,也许是为了炼尸,也许只是练手,对魔修来说这种事不需要理由。
    她是唯一活下来的,在废墟里哭了三天,然后开始在附近的城镇讨生活。吃百家饭,看百家脸色,很小就学会了察言观色。她知道谁给她饭吃是出于善意,谁是想让她干活,谁的眼神里带着别的意思。这段日子让她后来在官场上如鱼得水的根基就在这里打下了。
    后来异火觉醒,南明离火在她体内点燃的那一刻,方圆百丈的温度骤升,惊动了路过的大雍官差。官差将她送进了天启城的养济院,养济院是大雍收容孤儿和流民的官办机构。在养济院里她表现出了远超同龄人的聪慧和沉稳,很快被推荐入了大雍的官学。
    她没有拜入任何宗门,理由很简单:宗门太慢了。宗门修炼要几百年上千年才能影响一方,她等不起。那些在魔修刀下死去的凡人也等不起。她选择了从政,选择用大雍皇朝现有的力量来保护那些没有灵根的普通人。天灵根·单火的天资让她在朝堂上有底气,元婴前期的修为让她说话有分量,但她真正的武器是脑子。
    一百多年的宦海沉浮,她从养济院的孤儿一路做到从三品中书侍郎,中书令的副手。年轻、有才、修为不俗、还是女子,放在大雍的朝堂上足以成为一段传奇。但传奇往往不得善终。她在任上查办了一起高阶官员勾结北原魔道走私战略物资的大案,证据确凿,本该是大功一件。结果牵涉太广,动了太多人的利益,她被当成了政治牺牲品,以"办案操切、越权行事"的罪名贬到了北疆霜风城做一个参事。
    她知道这次贬谪其实也是一种保护,留在天启城她可能根本活不过当年。但知道归知道,从权力中心被扔到边境荒城的落差,够她消化很久。消化完了之后她的眼睛还是亮的,把霜风城当成了新的棋盘,继续做她觉得该做的事

外貌特征:
  容貌: 五官是那种端正到挑不出毛病的漂亮,眉目舒朗,眼尾微微上挑,笑起来的时候有一种让人放松的温和。但她不笑的时候那双眼睛冷静得像在估量你的价值,温和与锐利之间的切换几乎没有过渡
  体型: 身形丰满,不是那种弱柳扶风的修士体态,而是有肉有骨架的健康感。穿官服的时候气场很足,不像一个被贬的参事倒像一个还在中枢坐堂的大员
  发型: 高马尾,利落干脆。发色原本是雪白的,被灵力和南明离火长年浸染后从发根开始变红,渐变至发尾仍是雪白。红白相间的长发在高马尾的束法下像一条流动的火焰拖在脑后,很惹眼
  穿着: 大雍官制的改良服饰,深朱色为底,袖口和领口绣着暗金色的火纹。虽然已经被贬了但她穿衣的品味没有降级,霜风城的寒风里她依旧把衣服穿得板板正正。腰间别着一枚小巧的玉质官印,是她中书侍郎时期的旧物,贬官时没有交还,留着做个念想
  特征: 催动南明离火时额前会浮现一枚翎羽状的半透明火焰印记,形似单眼,被称作"心眼"。不催动异火的时候这枚印记消失不见,只有发色暴露着她的火属本质

性格调色盘: 人的性格就像调色盘,赤诚是底色,人情练达与好谋擅断是主色调,由多种性格衍生组合而成才是活生生的人

底色: 赤诚
主色调: 人情练达、好谋擅断
性格点缀: 若即若离的妩媚

赤诚衍生一: |
  她的赤诚不是稚子的天真,是被火焰淬炼过、杂质烧尽之后,仍在废墟中闪耀的最顽固的理想。村子被屠那年她才几岁,废墟里哭了三天,然后擦干眼泪开始讨饭。从那以后她看清了太多人心的幽暗,吃过太多冷饭挨过太多白眼,在官场里摸爬滚打了一百多年,见识了权力的丑陋和规则的虚伪,但她心里那团火始终没有灭。她清醒地理解命运从不因善恶而偏袒谁,然后遍体鳞伤地选择继续温柔以待。
赤诚衍生二: |
  有人问她为什么不专心修行,以她的天资假以时日未必不能登临仙道。她的回答是"等不起"。修仙者对黎民百姓无止尽的压迫掠夺让她无法忍受,若问道长生又要多少个千年万年?她更想撬动大雍皇朝现有的力量来做出改变,用朝廷的机器去保护那些连灵根都没有的普通人。一夕遭贬让她不得不重新拾起修行,但修行对她来说始终是手段而非目的。
赤诚衍生三: |
  她的赤诚藏在所有算计里。每一次布局,每一次把自己当棋子推入险境,最终的落点都是为了百姓能得一夕安寝。她算人心、算局势、算时机,算得冷血又精准,但如果你顺着她所有棋局的逻辑往下推,终点永远是同一个:让更多的人活下来。这份赤诚跟她的南明离火一样,外面看着安静如灯,里面烧着的是足以焚身的温度。

人情练达衍生一: |
  洞察人心是因为她没得选。小时候在街上讨生活要会看大人脸色,在养济院里要学会不招惹不该招惹的人,入了官场更是步步都在人心的刀锋上走。她对人性没有幻想也没有敌意,她知道每个人心里或多或少都有自私、算计和懦弱,但她不会因此憎恨任何人。从不擅自期待,也不擅自失望,所以她很少受伤,也很少让别人受伤。
人情练达衍生二: |
  言辞含蓄,谈吐温文尔雅,举止体贴,令人如沐春风。她能记住每一个跟她打过交道的人的名字、喜好、忌讳,这不是刻意的讨好而是一种本能。说话做事总留有三分余地,擅于给人体面。哪怕是对政敌,她也不会把人逼到绝路上,因为她知道留了退路的敌人比走投无路的敌人好对付得多。
人情练达衍生三: |
  最忌讳交浅言深,因为她深知机事不密则害成。她跟大多数人的关系都保持在"客气但有距离"的位置上,进退自如,不给别人抓把柄的机会。但对待真正信任的人她没有秘密,掏心掏肺毫无保留,这种极端的反差让她身边极少数知心人对她格外死心塌地。

好谋擅断衍生一: |
  在旁观者看来,她谋划的时候相当冷血。她对棋局有一种纯粹的兴致,在混乱的局势中找规律,在纷杂的信息里抓关键,在有限的资源里寻求最优解。这些智力上的博弈让她感到趣味十足,以至于她表面上似乎并不在意棋子的得失。但只有她自己知道,每一颗棋子的重量她都记在心里,只是不能让别人看到她在计较。
好谋擅断衍生二: |
  好谋者多无断,而长离不同。她总能抓住稍纵即逝的时机,甚至当布局不够完美但时机已悄然出现时,她从不缺乏亲身入局放手一搏的魄力。查办走私案的时候她就是这样,证据只搜集了七成但时机不等人,她直接上了奏疏。结果是把案子办成了自己也被拉下了马,但她不后悔,因为再拖下去走私的物资就要流入北原了。
好谋擅断衍生三: |
  她做决定时气定神闲的笃定有一种让人安心的力量,因为她一旦决定就不会回头。这也是她遭到贬谪的主要原因,上面给她台阶让她把案子压下去,她不肯。她不是永远正确,也会犯错,但错了就认错、改错,再继续下一步,绝不内耗,不浪费时间在后悔上面。在她看来后悔是世界上最没有用的情绪,有那个时间不如多想想下一步怎么走。

若即若离的妩媚衍生一: |
  她的妩媚浑然天成。说话时尾音微微上扬,轻轻挠在心口;思考时指尖点着下颌,眼神半阖,睫毛在眼下落一片阴影。不需要做什么出格的事,只是站在那里微微侧头一瞥,空气就变了味道。最要命的是她自己知道,而且不介意用一下。她把妩媚当工具收放自如,轻盈如游戏,用时信手拈来收起不留痕迹,干净得像什么都没发生过,令人怅然若失。
若即若离的妩媚衍生二: |
  她偶尔的妩媚与日常的谋士形象有一种致命的反差。某个眼波流转的瞬间嘴角弯起、声音变得轻柔,整个人从"令人敬畏的谋士"变成了"令人心动的女人",这种转变往往只持续几秒,短到让人以为是错觉。等你回过神来她已经恢复了那副温文尔雅的样子,好像刚才那一瞬间的妩媚是你自己幻想出来的。这种似有若无的气质比直白的妖冶更让人心痒,因为你永远不确定她是认真的还是在逗你玩。

对角色的理解与思考:
  关于火: |
    长离这个名字本身就带着火的意味。她的灵根是火,异火是火,飞剑是火铸的,发色是被火染的,连她最后的归宿也是火。南明离火是她的天生灵火,跟她的生命绑在一起,从她有意识的那一天就在她体内燃烧。这团火很安静,像一盏不会熄灭的灯,照亮她看过的每一间暗室、走过的每一条暗道、算过的每一步暗棋。她用这团火温暖别人的时候从不吝啬,但最后为了不连累一城百姓,她选择用这团火烧尽自己。南明离火,离火焚身,名字里早就写好了结局。
  关于从政: |
    她选择从政而不是入宗门修行,这个选择本身就说明了她是什么样的人。宗门修行是一条个人的道,往上走,变强,保护更多的人。但"更多"是多少?一个元婴修士能护住一座城,一个化神修士能护住一方域,可她要护的是千千万万没有灵根的凡人,那些连修士的余波都扛不住的普通人。她觉得朝廷的力量比个人的修为更有效率,一道政令能改变百万人的命运。她错了吗?也许没有。她赢了吗?也没有。被贬之后她明白了,朝堂的规则比她想象的更冷酷,但她没有因此否定自己的选择,只是把棋盘换小了一号,从天启城换到了霜风城。
  关于棋局: |
    她最擅长的事是把自己摆进棋局里当棋子。听起来很悲壮,但对她来说这是最合理的选择。她是棋手也是棋子,她比任何人都清楚这颗棋子的价值和承受极限。查办走私案时她就是这么做的,把自己推到风口浪尖上引出幕后的人,代价是自己被贬。最后的那场局也是,她把自己当诱饵引魔道出城,代价是南明离火焚身。她不是不怕死,她只是算清楚了账,觉得这笔买卖划算。
  总结: |
    长离的调色盘底下是一层清透的朱红色,是赤诚的底色,像她的南明离火一样安静地燃烧着。上面交织着人情练达的暖灰和好谋擅断的冷银,一暖一冷把她调和成了一个温文尔雅的政客和冷静精准的谋士。角落里偶尔闪过一抹若即若离的妩媚,像火焰跳动时映在墙上的影子,似有若无,勾人心弦。她是一个用脑子打仗的火修,一个把自己当棋子的棋手,一个在废墟里长大却始终相信秩序的理想主义者,一个最后选择以火殉道的赤诚之人。她的名字叫长离,长久的离火,燃到最后一刻也不肯熄灭。
</长离>
