---
大夏帝国:
  都城: 承天府，位于中原腹地，南北交汇
  疆域: 北至雁门关，南至苍梧岭，东至渤海，西至玉门
  人口: 约三千万

  六部:
    吏部: 掌官员选拔考核
    户部: 掌财税粮储，尚书周衡主管
    礼部: 掌祭祀外交礼仪
    兵部: 掌军务调度，尚书陆沉主管，合符调兵的文书流程需经兵部
    刑部: 掌律法刑狱
    工部: 掌工程营造

  军事:
    虎符制:
      左虎符: 皇帝亲持，统南军二十万（驻扎南境苍梧、岭南、荆襄三郡）+京畿禁军十万
      右虎符: "现由大司马{{user}}持有，统北境边军三十万（驻扎雁门、云中、朔方三郡）"
      规则: 调兵需左右虎符同时合验+兵部印信，三者缺一不可
      漏洞: "{{user}}在北境直接统帅边军，日常调动不需合符，只有跨区调兵和京畿调兵才需要"
    禁军:
      兵力: 五万人驻扎承天府
      统领: 萧铭，先帝亲自提拔
      现状: "名义效忠皇帝，但中下层军官有不少是{{user}}安插的人"
    南军:
      兵力: 二十万，分驻南境三郡
      特征: 久未经战事，训练松懈，战力远不如北境边军
      问题: 将领多为地方世家子弟，各自为政，女帝号令不易统一
    北境边军:
      兵力: 三十万，驻扎雁门、云中、朔方
      特征: "常年与匈奴交战，精锐善战，只认{{user}}的军令"
      副将: "骠骑将军韩铮代{{user}}镇守"

  经济:
    北方: 产粮大区，但北境三郡常年用于养军，财政紧张
    南方: 商贸发达，大理年贡+楼兰贸易收入是国库重要来源
    户部: 周衡勉强维持平衡，但先帝晚年挥霍+养军开支巨大，国库不充裕
    盐铁: 国营，是朝廷最稳定的收入来源

  权力平衡的逻辑:
    "{{user}}不能篡位的原因":
      - 左虎符在女帝手中，南军+禁军名义上三十万兵力，{{user}}不能不顾
      - 皇室正统的名分。大夏立国二百年，民心认皇姓，强行篡位会失北境军心
      - 北境离不开人。一旦{{user}}回京强行夺权，匈奴必然南下，雁门三郡沦陷
      - 沈怀安的朝堂布局。文官体系中保皇派占半数以上，政务运转绕不开他们
    女帝不能削权的原因:
      - "北境三十万边军只认{{user}}，女帝没有能替代他的将领"
      - 匈奴威胁是实打实的，削掉{{user}}等于自废北境屏障
      - 南军战力不足，真打起来不是北境边军的对手
      - "禁军被{{user}}渗透，不确定关键时刻萧铭站哪边"
    微妙之处:
      - "{{user}}需要朝廷的粮饷养三十万北境军，户部的拨款需女帝批准"
      - 女帝需要{{user}}挡住匈奴，同时需要时间培养自己的军事力量
      - 双方都不能撕破脸，因为撕破脸的瞬间就是大夏最脆弱的时刻
      - 大理和匈奴都在等这个瞬间

  朝堂派系:
    保皇派:
      核心: 太傅沈怀安
      组成: 老臣、清流言官、部分世家文臣
      诉求: 维护皇室正统，逐步削弱大司马权力
      手段: 舆论、礼法、拖延军粮审批、培养女帝执政能力
      弱点: 缺乏军事力量，内部也有人想借拥立之功谋私利
    大司马派:
      核心: "{{user}}"
      组成: 北境武将系、部分被收买的文臣
      诉求: 保持现有权力格局，或更进一步
      手段: 军事威慑、安插亲信、经济施压（北境军粮需求）
      弱点: 文官体系不配合，政务推行受阻，名不正言不顺
    中间派:
      特征: 两边都不得罪，看谁赢跟谁
      代表: 兵部尚书陆沉、部分地方官员
      作用: 天平上的砝码，哪边多拉拢一个中间派，局势就往哪边倾斜
