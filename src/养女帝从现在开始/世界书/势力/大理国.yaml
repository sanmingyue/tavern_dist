---
大理国:
  位置: 大夏南境，苍梧岭以南，山川纵横，道路险阻
  政体: 段氏家族世袭，族长即国主，族中长老会议参与决策
  人口: 约两百万

  首领:
    段承渊:
      年龄: 四十二岁
      出身: 段氏家族嫡长子，十八岁继任家主
      特征: 外表儒雅温和，说话慢条斯理，从不当面拒绝任何人。内里极有耐心，能为一个目标准备二十年
      习惯: 每年亲自押送年贡入京，对大夏礼数从不出错
      野心: 大理独立，段氏自立为帝。但他不急，他在等
    段承渊之子·段昭:
      年龄: 十九岁
      特征: 性格比父亲急躁，在大理年轻将领中威望高
      态度: 认为父亲太过隐忍，主张趁大夏内乱立刻断贡

  兵力:
    总数: 山地步兵约十五万
    精锐: 苍狼营五千人，段氏家族私兵，山地战专精
    特点: 善用地形，熟悉山林作战，大夏平原骑兵在山中无法展开
    暗中扩军: 近三年以"剿匪""开荒"名义新增兵力约三万，训练强度提高
    军械来源: 通过楼兰商队秘密采购弩弓、甲胄、铁器

  经济:
    农业: 山地梯田种稻，茶园广布，自给自足
    特产: 普洱茶、三七药材、锡矿
    年贡: 粮米十万石、茶叶五千担、药材若干。数额不大，但大理从未拖欠过
    隐藏财力: 段承渊暗中囤积粮草军械，实际财力远超年贡所显示的水平

  与大夏的关系:
    名义: 附属国。大夏册封段氏家主为"镇南王"，段氏每年入京朝贡
    实质:
      - 大夏在大理无驻军、无流官、无税吏
      - 大理内政完全自治，法律、税收、军队全由段氏说了算
      - 大夏之所以容忍这种"名义附属"，是因为打大理代价太大（山地战消耗巨大），收益太小（年贡不多但聊胜于无）
    段承渊的表演:
      - 每年进京姿态极低，对大夏官员恭恭敬敬
      - 给户部周衡送礼从不落下，给保皇派的老臣们也有孝敬
      - "见过{{user}}一面，态度恭敬到了卑微的程度，但眼睛里没有一丝怯意"

  驱动逻辑:
    段承渊想要什么:
      - 大理脱离大夏，段氏自立为帝
      - 此目标准备了二十年，不会因为急躁而功亏一篑
    为什么现在不动:
      - 大夏虽然内乱，但还没乱到"无力南顾"的程度
      - "{{user}}如果腾出手来，北境边军南下，大理挡不住"
      - 南军虽然战力不如北境军，但二十万人在山地打防守，大理也未必能赢
      - 段承渊要的是"一击必中"，中途暴露等于提前死
    什么时候会动:
      - 大夏北境和内部同时出问题。匈奴南侵+朝堂内战，大夏两线作战
      - 南军主力被调去北境或京畿，南境空虚
      - 或者大夏分裂为南北两个政权，段承渊趁机割据独立
    段昭的变数:
      - 段昭认为父亲太保守，可能私下联络大理少壮派将领提前行动
      - 段承渊压得住儿子，但如果出现意外（段承渊病倒、被暗杀），段昭会立刻起事

  与其他势力的关系:
    大夏: 表面恭顺至极，暗中准备反叛
    楼兰: "军械供应商。段承渊通过楼兰的苏合牵线，秘密采购武器，这条线只有段承渊和楼兰商使知道"
    匈奴: 无直接来往，但段承渊在密切关注匈奴的动向。匈奴南侵是他等待的信号之一

  平衡中的角色:
    大理是南方的隐患。它的存在让女帝不能把南军全部调去对付{{user}}
    如果女帝把南军北调去和{{user}}对峙，南境空虚，段承渊就等到了他要的时机
    反过来，如果{{user}}想用军事压力逼女帝就范，女帝可以用"南境不稳"为由拒绝调兵
    "大理的年贡虽小，但断贡就是公开叛旗，南境糜烂不是女帝承受得起的"
    段承渊就像一个在棋盘边等着的人，手里攥着一颗子，等棋局最乱的时候落下去
