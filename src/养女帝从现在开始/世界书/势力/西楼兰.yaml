---
西楼兰:
  位置: 大夏西境，沙漠中的绿洲城邦群，核心城池楼兰城
  政体: 王权+商会共治。楼兰王名义统治，实际上大商会的话语权极重
  人口: 约五十万，城邦聚居

  首领:
    楼兰王·尉屠耆:
      年龄: 四十八岁
      特征: 精明的老商人气质，从不做亏本买卖。待人和气，笑脸下面全是算盘
      原则: 楼兰的独立高于一切。为了这个目标，什么都可以卖，什么人都可以交
    商会:
      丝路商会: 楼兰最大的商会，掌控东西方贸易干线，会长是尉屠耆的妹夫
      宝石行会: 控制宝石矿脉开采和加工，在大夏宫廷有大量买家
      情报行: 名义是商队护卫组织，实际是楼兰的对外情报网

  兵力:
    常备军: 不足三万，以城防弓弩手和商队护卫为主
    精锐: 沙鹰卫三千人，王宫近卫+情报行动执行者，善用弩弓和毒物
    特点: 打不了大仗，但暗杀、渗透、情报战一流

  经济:
    命脉: 丝路贸易。东方大夏的丝绸茶叶，西方的香料宝石琉璃，全部过楼兰中转
    收入: 关税+转口差价+金融借贷，楼兰国库充裕程度不亚于大夏
    货币: 金币为主，大夏和西方货币均可流通
    特产: 火焰宝石（大夏贵族追捧的奢侈品）、龙涎香、琉璃器

  在大夏的布局:
    承天府商馆: 名义是贸易代表处，实际是楼兰在大夏的情报中心
    商使·苏合: 常驻承天府的楼兰商使，四十岁，女性，精通大夏官话，交际能力极强
    暗中操作:
      - 先帝在位时资助过三位皇子的争储行动，押的是"谁赢帮谁"
      - 与户部尚书周衡有长期利益往来，楼兰商品免税入关的默契靠周衡维持
      - 向朝堂各派提供低息借贷，借出去的钱就是拴住人的绳子
      - "给{{user}}的北境军供应过马匹和铁器（加价三成），但同时也私下卖铁器给匈奴"

  驱动逻辑:
    楼兰想要什么:
      - 独立。楼兰最怕的是大夏统一强盛后吞并自己
      - 贸易通道畅通。战争是生意的最大敌人，大规模战争会断丝路
      - 信息优势。知道所有人的底牌，自己才能活到最后
    楼兰的策略:
      - "大夏内部越平衡，对楼兰越有利。{{user}}和女帝互相牵制，谁也腾不出手来管楼兰"
      - 如果一方即将获胜，楼兰会暗中资助弱势方，维持僵局
      - 同时卖军械给匈奴和大夏，两边的战争越持久，楼兰赚的越多
      - 绝不亲自下场打仗。楼兰的武器是钱和情报
    楼兰的软肋:
      - 军事力量太弱。一旦大夏或匈奴铁了心要打楼兰，挡不住
      - 水源。楼兰城依赖绿洲水源，断水即亡
      - 贸易依赖。如果大夏禁止与楼兰通商，楼兰经济会受重创

  与其他势力的关系:
    大夏: "最大的贸易伙伴。楼兰需要大夏的市场，大夏需要楼兰的奢侈品和西方商品"
    匈奴: 走私对象。卖铁器给匈奴利润极高，但被大夏发现就是通敌
    大理: 秘密军械贸易。段承渊通过楼兰商队采购弩弓和甲胄，楼兰赚中间差价

  平衡中的角色:
    楼兰是四方棋局里的银行和邮局
    谁都需要楼兰的钱和消息，谁都不能完全信任楼兰
    楼兰的存在让所有势力都有了"暗中操作"的渠道，也让局势更加复杂
    "如果{{user}}或女帝想拉拢楼兰站队，代价是让楼兰在大夏获得更大的商业特权"
