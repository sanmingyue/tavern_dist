---
北匈奴:
  位置: 大夏北境草原，漠北至阴山一带
  政体: 单于制，大单于统率全族，下设左右贤王、左右谷蠡王
  人口: 约百万，全民皆兵

  首领:
    大单于·呼衍骨勒:
      年龄: 三十四岁
      出身: 前任单于之侄，靠军功和联姻夺位
      特征: 沉稳有谋略，与过去匈奴单于的蛮勇风格不同
      "与{{user}}": "三年前被{{user}}大破主力，斩首三万，呼衍骨勒本人左臂中箭留下旧伤。恨{{user}}入骨，但更恨自己当时轻敌"
    左贤王·拓跋野: 大单于长子，二十岁，急躁好战，主张立刻南下报仇
    右贤王·呼衍察: 大单于之弟，三十岁，主张先稳固内部再图大夏

  兵力:
    总数: 约四十万控弦之士
    精锐: 狼骑八万，呼衍骨勒亲率的核心骑兵
    现状: "被{{user}}重创后损失约十万精锐，三年来一直在恢复"
    战力: 骑射天下无双，野战优于大夏军，攻城战弱于大夏军

  经济:
    畜牧为主，不产铁器、不产粮食
    秋冬草场枯竭是南下劫掠的直接原因
    与楼兰有少量走私贸易，用马匹牛羊换铁器和粮食

  驱动逻辑:
    为什么要南侵:
      - 生存需求。草原冬季漫长，不劫掠就会饿死
      - 复仇。"{{user}}三年前的大败是匈奴百年来最惨的失败，不报此仇单于之位不稳"
      - 内部压力。左贤王拓跋野和年轻将领急于用战功证明自己
    为什么现在还没动:
      - 元气未复，精锐损失严重，需要时间恢复
      - "{{user}}还在北境，韩铮代镇雁门，边军三十万没有松懈"
      - 呼衍骨勒在等一个时机，等大夏内部先乱起来
    什么时候会动:
      - "{{user}}的北境边军被调走或削弱"
      - 大夏内战爆发，无暇北顾
      - 连续两年寒冬导致牧场大面积减产

  与其他势力的关系:
    大夏: 世仇。"恨{{user}}个人，也恨大夏整体。无和亲无通商的前提是{{user}}定的规矩"
    楼兰: 走私贸易。楼兰商人私下卖铁器给匈奴，价格是正常市价的三倍
    大理: 无直接来往。地理上隔着整个大夏

  平衡中的角色:
    匈奴是悬在大夏北境的刀。"这把刀现在被{{user}}按着，但刀没断，只是暂时按住了"
    "如果女帝削掉{{user}}的兵权，这把刀立刻落下来"
    "如果{{user}}调北境军入京夺权，这把刀也立刻落下来"
    "所以匈奴的存在本身就是{{user}}和女帝都不能对彼此动手的最大外部约束"
