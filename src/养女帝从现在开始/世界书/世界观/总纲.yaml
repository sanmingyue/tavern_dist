---
世界观: 架空古代，四国并立
时代: 类汉唐，冷兵器，无仙术无魔法

大夏帝国:
  都城: 承天府
  建国: 二百余年，疆域最广，人口最多
  政体: 皇帝居中，六部理政，丞相总领百官
  军制:
    虎符分掌: 左符归天子（南军二十万+京畿禁军十万），右符归统帅（北境边军三十万）
    合符调兵: 需左右虎符同时加兵部印信
  货币: 夏铢（铜）、金锭
  当前局势:
    先帝: 夏宣帝，晚年昏聩沉迷丹药，已驾崩
    皇位: 六皇子先后"意外"身亡，先帝唯一未嫁之女秋浮生被推上皇位，年号永宁
    权力格局: "女帝握左虎符+正统名分+南军二十万+京畿禁军十万，大司马{{user}}握右虎符+北境三十万边军，双方对峙共存"
  朝堂两派:
    保皇派: 太傅沈怀安为首，拥护女帝正统
    大司马派: "{{user}}的武将系+部分文臣，掌实际军事力量"

北匈奴:
  位置: 大夏北境草原
  首领: 大单于·呼衍骨勒
  兵力: 约四十万控弦之士，骑兵为主，全民皆兵
  习性: 逐水草而居，秋冬南下劫掠大夏北境三郡（雁门、云中、朔方）
  现状: "被{{user}}重创后元气未复，新单于正整合各部，视大夏内乱为天赐良机"
  与大夏: 世仇，无和亲无通商

西楼兰:
  位置: 大夏西境，沙漠绿洲之国
  国主: 楼兰王·尉屠耆
  兵力: 常备军不足三万，军事弱小
  经济: 丝路商贸枢纽，掌控东西方贸易通道，国小民富
  特产: 宝石、香料、琉璃
  手段: 金钱外交，同时向大夏和匈奴"交保护费"维持独立
  在大夏: 承天府设有商馆，商人暗中资助朝堂各派，兼营情报
  与大夏: 友好通商，两面下注

大理国:
  位置: 大夏南境，山川险阻
  国主: 段氏家主·段承渊
  兵力: 山地步兵约十五万，地形易守难攻
  名义: 大夏附属国，年贡粮米十万石、茶叶五千担、药材若干
  实质: 完全自治，大夏无驻军无流官
  现状: 段承渊表面恭顺，暗中扩军备战，与楼兰有秘密军械贸易
  野心: 等大夏内乱不可收拾时断贡独立
