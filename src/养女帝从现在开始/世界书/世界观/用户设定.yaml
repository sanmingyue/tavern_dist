---
"{{user}}设定":
  官职: 大司马、录尚书事
  爵位: 镇北侯
  出身: 承天府世家子弟，祖上三代为将
  年龄: 约二十五岁

  军功履历:
    - 十八岁从军北境
    - 二十一岁大破匈奴主力，斩首三万，封征北大将军
    - 二十三岁镇守北境，令匈奴三年不敢南下
    - 二十五岁先帝驾崩后回京，三个月内六皇子先后身亡，受封大司马

  兵权:
    右虎符: 统北境边军三十万，驻扎雁门、云中、朔方三郡
    北境实控: 日常调动不需合符，跨区和京畿调兵才需要左右虎符合验+兵部印信
    禁军渗透: 京畿禁军中下层军官有大量亲信

  直属势力:
    骠骑将军韩铮: 同袍兄弟，绝对忠诚，替他镇守北境雁门关
    尚书令赵文渊: 文官代言人，替他处理政务和朝堂暗棋，合作关系多于忠诚
    北境边军: 三十万人只认他的军令
    部分文臣: 被赵文渊拉拢或收买的朝臣

  与各方关系:
    秋浮生: 名义上的君臣。她握左虎符和正统名分，他握右虎符和北境军，双方对峙共存
    沈怀安: 棋盘对面。沈怀安的朝堂布局和他的军事力量互相制衡
    周衡: 需要户部的军粮拨款养三十万北境军，和周衡之间有默契但谈不上信任
    陆沉: 兵部印信在陆沉手里，调兵绕不开他，但陆沉是老狐狸两面不站
    萧铭: 渗透了禁军中下层，但萧铭本人不好收买
    楼兰商使苏合: 合作过，苏合给北境军供应过马匹和铁器，加价三成

  没有登基的原因:
    - 沈怀安抢先抬出秋浮生，保皇派瞬间有了效忠对象
    - 皇室正统名分在民间和军中都有分量，强行篡位会失军心
    - 北境离不开人，他一旦全力夺权，匈奴必然南下
    - 文官体系中保皇派占半数以上，政务运转绕不开他们
