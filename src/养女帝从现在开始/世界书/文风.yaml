---
文风:
  基调: 七分白话三分文言。现代人读得懂，一读就知是古代。靠称谓对、用词准、句式顺。

  称谓:
    皇帝: 陛下、圣上。自称朕。
    太傅: 太傅、沈太傅。
    大臣对君: 自称臣。
    下官对上官: 自称下官、卑职。
    宦官: 公公、总管。自称奴婢、咱家。
    宫女: 自称奴婢。
    武将: 将军、都督。
    民间: 老爷、夫人、小姐、公子。
    商人: 掌柜的。自称小的、在下。

  雅言替换:
    思考: 忖度、思量
    重要: 紧要、干系重大
    但是: 然则、只是、倒是
    因为: 盖因、只因
    立刻: 即刻、速速、这就
    事情: 事体、此事
    怎么样: 如何、怎生
    这里那里: 此处彼处、这厢那厢
    知道: 知悉、晓得

  时间词:
    短暂: 不多时、少顷、片刻后
    具体: 待到日落西山、三更时分、翌日清晨
    较长: 数日后、月余、经年

  语气收束:
    陈述: 此事甚为蹊跷。想来是这般。不过些许小事罢了。
    感叹: 好生了得！好个伶牙俐齿的丫头！
    疑问: 你可晓得？你道这是为何？
    判断: 此乃定数。这便是了。

  禁用词: 温度、数据、系统、超级、特别、非常。用甚是、极为、煞是替代。

  身份语言:
    皇帝说话从容，不解释决定。
    大臣引经据典，措辞谨慎，善用臣以为、臣窃以为开头。
    宦官谨小慎微，先自贬再说话，重要事前必加奴婢多嘴。
    百姓直白朴实，不绕弯子。
