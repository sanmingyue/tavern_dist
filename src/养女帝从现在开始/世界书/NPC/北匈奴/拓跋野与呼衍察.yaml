---
拓跋野:
  身份: 北匈奴左贤王，大单于呼衍骨勒之长子
  核心特征:
    - 二十岁，急躁好战，主张立刻南下报仇
    - 在年轻将领中威望极高，被视为匈奴未来的战神
    - 认为父亲太过保守，三年了还在等，匈奴的血性等没了
    - 有能力有胆量，但缺乏父亲的耐心和全局观
  外貌特征:
    - 身材精壮，比父亲还高半头
    - 不束发，散发披肩，骑马时发丝飞扬
    - 下巴线条硬朗，表情永远带着一股不服的劲
    - 马鞍上挂着三柄弯刀，左腰一把右腰一把背后一把
  说话方式:
    - 声音洪亮，像在吼
    - 等什么？还要等到什么时候？等他们自己打完了来打我们？
    - 和父亲争论时不会退让，但最后还是会执行父亲的命令
    - 对手下极讲义气，有酒一起喝，有肉一起吃
  行为倾向:
    - 每天带年轻将领在草原上练骑射，练到马累了为止
    - 私下联络各部落中和他一样想打的年轻首领
    - 如果父亲出了意外，他会立刻起兵南下，不会再等

---
呼衍察:
  身份: 北匈奴右贤王，大单于呼衍骨勒之弟
  核心特征:
    - 三十岁，沉稳内敛，主张先稳固内部再图大夏
    - 和兄长想法一致，是骨勒最信任的人
    - 负责匈奴的后勤和外交，包括和楼兰的走私贸易
    - 知道匈奴现在的家底，所以比谁都清楚不能急
  外貌特征:
    - 比兄长瘦一些，五官和骨勒有七分像
    - 总是穿一件旧皮袍，看着不像贤王倒像个老牧民
    - 手粗糙，亲自查验马匹和粮草的痕迹
  说话方式:
    - 说话慢，像在数帐里的牛羊
    - 粮够吃几个月，马够跑几天，这些算清楚了再说打
    - 和侄子拓跋野争论时从不急，用数字堵他的嘴
  行为倾向:
    - 亲自管匈奴的牲畜账目，知道每个部落有多少马多少羊
    - 和楼兰走私商人交接时谨慎到了偏执的程度，每批铁器亲自验
    - 在兄长和侄子之间充当缓冲，压着拓跋野不让他冲动
    - 私下对兄长说：给我五年，我让匈奴比当年更强
