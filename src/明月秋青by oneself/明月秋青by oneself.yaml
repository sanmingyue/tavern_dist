w;\n    overlaySize.value = {\n      w: hw.innerWidth,\n      h: hw.innerHeight,\n    };\n    userGuidance.value = props.initialGuidance || \'\';\n    nextTick(() => textareaRef.value?.focus());\n  }\n});\n\nconst overlayStyle = computed(() => ({\n  left: \'0px\',\n  top: \'0px\',\n  width: overlaySize.value.w + \'px\',\n  height: overlaySize.value.h + \'px\',\n}));\n\nfunction onConfirm() {\n  emit(\'confirm\', userGuidance.value.trim());\n}\n<\/script>\n\n<style scoped>\n.zhino-sg-overlay {\n  position: fixed;\n  z-index: 10000;\n  background: rgba(0, 0, 0, 0.6);\n  backdrop-filter: blur(4px);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 16px;\n}\n/* 手机端：卡片上移 + 缩小，避免键盘遮挡按钮 */\n.zhino-sg-overlay.mobile {\n  align-items: flex-start;\n  padding: 5vh 16px 16px;\n}\n.zhino-sg-card {\n  background: #0a0d14;\n  border: 1px solid rgba(167, 139, 250, 0.2);\n  border-radius: 12px;\n  box-shadow: 0 0 40px rgba(167, 139, 250, 0.1), 0 20px 60px rgba(0, 0, 0, 0.5);\n  width: 100%;\n  max-width: 480px;\n  max-height: 90%;\n  overflow-y: auto;\n  display: flex;\n  flex-direction: column;\n}\n.zhino-sg-header {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 14px 16px;\n  border-bottom: 1px solid rgba(167, 139, 250, 0.12);\n}\n.zhino-sg-title {\n  font-size: 14px;\n  font-weight: 600;\n  color: #a78bfa;\n}\n.zhino-sg-close {\n  width: 24px;\n  height: 24px;\n  border: none;\n  background: transparent;\n  color: rgba(255, 255, 255, 0.4);\n  font-size: 14px;\n  cursor: pointer;\n  border-radius: 4px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n.zhino-sg-close:hover {\n  background: rgba(167, 139, 250, 0.15);\n  color: #a78bfa;\n}\n.zhino-sg-body {\n  padding: 16px;\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n}\n.zhino-sg-desc {\n  font-size: 13px;\n  color: rgba(255, 255, 255, 0.75);\n  line-height: 1.6;\n  margin: 0;\n}\n.zhino-sg-hint {\n  font-size: 12px;\n 