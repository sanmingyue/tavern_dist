round:rgba(0,0,0,0.4);border:1px solid rgba(167,139,250,0.4);border-radius:4px;padding:4px 6px;font-size:12px;color:rgba(255,255,255,0.9);outline:none;font-family:inherit;resize:vertical;line-height:1.5;white-space:pre-wrap}.zhino-nsfw-field[data-v-1b41193f]{margin-bottom:8px}.zhino-nsfw-field .zhino-textarea[data-v-1b41193f]{margin-top:2px}.zhino-nsfw-row[data-v-1b41193f]{margin-bottom:8px}.zhino-nsfw-row .zhino-detail-label[data-v-1b41193f]{margin-bottom:2px}.zhino-nsfw-memory-item[data-v-1b41193f]{border-left-color:rgba(248,113,113,0.4) !important;background:rgba(248,113,113,0.04) !important}.zhino-nsfw-updated[data-v-1b41193f]{font-size:10px;color:rgba(255,255,255,0.25);margin-top:6px}.zhino-tag-nsfw[data-v-1b41193f]{background:rgba(248,113,113,0.1);border-color:rgba(248,113,113,0.2);color:rgba(248,113,113,0.8)}.zhino-behavior-header[data-v-1b41193f]{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:4px 0}.zhino-behavior-toggle[data-v-1b41193f]{font-size:10px;color:rgba(167,139,250,0.6)}.zhino-behavior-tree[data-v-1b41193f]{display:flex;flex-direction:column;gap:4px;margin-top:6px}.zhino-behavior-node[data-v-1b41193f]{display:flex;align-items:flex-start;gap:4px;font-size:11px;padding:4px 8px;background:rgba(255,255,255,0.02);border-radius:4px;border-left:2px solid rgba(167,139,250,0.25);flex-wrap:wrap;line-height:1.5}.zhino-behavior-fallback[data-v-1b41193f]{border-left-color:rgba(250,204,21,0.4)}.zhino-behavior-condition[data-v-1b41193f]{color:rgba(74,222,128,0.8);font-weight:500;word-break:break-word}.zhino-behavior-fallback .zhino-behavior-condition[data-v-1b41193f]{color:rgba(250,204,21,0.8)}.zhino-behavior-arrow[data-v-1b41193f]{color:rgba(255,255,255,0.3);flex-shrink:0}.zhino-behavior-action[data-v-1b41193f]{color:rgba(255,255,255,0.75);word-break:break-word}.zhino-behavior-loc[data-v-1b41193f]{color:rgba(255,255,255,0.4);font-size:10px;flex-shrink:0}.zhino-behavior-priority[data-v-1b41193f]{color:rgba(167,139,250,0.5);fo