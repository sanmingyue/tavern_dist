# yaml-language-server: $schema=https://testingcf.jsdelivr.net/gh/StageDog/tavern_sync/dist/schema/preset.zh.json
设置:
  上下文长度: 2000000
  最大回复token数: 65535
  流式传输: true
  温度: 1
  频率惩罚: 0
  存在惩罚: 0
  top_p: 0.9
  top_k: 500
  压缩系统消息: false
  推理强度: 自动
  请求思维链: true
  请求图片: false
  启用函数调用: false
  启用网络搜索: false
  允许发送图片: 禁用
  允许发送视频: false
  角色名称前缀: 默认

锚点: {}

提示词:
  - 名称: 📋 作者声明
    启用: true
    角色: 系统
    内容: |-
      {{//本预设由三明月制作，独家发布于Discord类脑社区，供社区用户免费使用，任何情况下严禁在类脑社区以外的地方传播。
      作者：三明月
      如有问题或建议，欢迎在类脑社区反馈交流。}}{{trim}}

  - 名称: 变量初始化
    启用: true
    插入位置:
      类型: 相对
    角色: 系统
    内容: "{{setvar::output_language::}}{{setvar::word_min::}}{{setvar::word_max::}}{\
      {setvar::POV_rules::}}{{setvar::anti_rules::}}{{setvar::thinking_chain::}\
      }{{setvar::nsfw_thinking_chain::}}{{setvar::theater_format::}}{{setvar::c\
      hoice_format::}}{{setvar::update_reminder::}}{{setvar::final_reminder::}}\
      {{setvar::timeline::}}{{setvar::qqzdiy::}}{{setvar::personality::}}{{setv\
