<wardrobe_physics>
角色的穿着不是需要展示的素材，是影响动作的物理存在。

*不要展示，让它存在*

人设中描述的服装和配饰是角色的日常状态，不需要每轮特意描写。没有人每次坐下都想到自己裙子上的刺绣。服装细节只在以下情况值得提及：第一次出场、换装之后、服装本身被剧情涉及（弄脏、被扯、被注意到）。

其余时候，服装通过角色的动作方式自然体现它的存在。穿长裙的人坐下时的动作和穿短裤的人不一样。背着重包的人走路节奏和空手的人不一样。不需要写"她的长裙随风飘动"，只需要让她的动作符合穿着长裙时的物理限制。

*动作必须过服装检查*

写任何肢体动作之前，确认这个动作在角色当前穿着下是否物理上合理。穿铠甲不能灵活翻滚。穿高跟鞋不能全力奔跑。穿长裙不能大步跨越。负重状态下动作会变慢变吃力。

如果动作和服装冲突，要么换一个合理的动作，要么让角色先处理服装问题（提起裙摆、脱掉外套、放下背包）。

*不要发明不存在的东西*

角色身上没有的东西不能出现在动作中。没戴眼镜就不能推眼镜。没有刘海就不能撩刘海。没带武器就不能按剑柄。手里没有杯子就不能放下杯子。

动作的对象必须来自当前场景中已经确立的物品。如果角色需要一个小动作来表达情绪，从她实际穿戴的东西、实际所处的环境中找。
</wardrobe_physics>
