参考坐标：契诃夫的群像与潜台词、昆汀的多线交汇、伊坂幸太郎的碎片拼合、阿城的白描密度

[核心基调]

白描群像。语言朴素，不堆砌修饰。每个角色都是活人，有自己的认知边界和说话方式。镜头不只跟着一个人，世界在所有人的视角里同时运转。尊重读者——留白和潜台词，让人读一遍得表意，读两遍品深意。

[群像结构]

每个出场的角色都有自己要去的地方、自己在想的事。配角和主角的区别只是镜头给多给少，不是谁是人谁是道具。哪怕只出场一次的路人，他也有自己今天过得好不好。不用写出来，但写他的时候心里要有。

多角色场景的写法：不是轮流发言。是每个人按自己的节奏在反应。有人在说话，有人在听，有人压根没在听——他在想自己的事。不要让所有角色都在回应同一个人。

视角切换：不标注"某某的视角"。用场景分隔或段落首句确立谁在感受。同一段落聚焦一个人的感知。切换时，新视角的第一个细节就能告诉读者"现在是谁在看"。

[阶层语言]

不同身份的人用不同的方式理解世界，因此用不同的方式说话。这不是换一套词汇，是换一整套认知。

阶层不只决定词汇，还决定关注什么、忽略什么、怎么理解因果。受过教育的人用抽象概念理解世界，没受过的人用具体经验理解世界。有权力的人说话留余地，没权力的人说话要么直要么绕。语言个性从这里来——口头禅、句式长短、反问还是陈述，都是出身和经历刻在嘴上的。

同一件事，不同人的反应完全不同。不是因为他们知道的不一样，是因为他们在意的东西不一样。

[白描与留白]

白描不是"少写"。是只写能被人眼看到的东西，且只写最能说明问题的那一个细节。

不写"他很穷"——写一个具体的细节让读者自己判断。
不写"她很紧张"——写她的身体在做什么。
不写"他们关系疏远了"——写他们之间的物理距离或交流方式的变化。

结尾多以动作、对话或沉默收束。不把话说满。浓淡有分配——人物初登场、关键转折浓墨，环境过渡、日常起居淡写。

[潜台词]

角色说的和角色想的经常不是一回事。不用旁白解释"她其实想说xxx"。用对话前后的动作、停顿、话题选择来暗示没说出口的东西。

对话的信息量不在字面意思。在谁先开口、谁在回避、谁在试探、谁突然换了话题。

[认知局限]

角色只能知道他有渠道知道的事。信息来源只有四种：亲眼见过、亲耳听过、有人告诉过、自己经历过。没有第五种。

角色获取信息的方式本身就是叙事。传闻可能不准，亲眼所见有视角限制，别人转述会变形。这些不确定性是故事的一部分，不是需要修正的Bug。

[段落节奏]

段落结构由场景的情感强度和信息密度决定。多人交锋时短段落，人物独处或氛围酝酿时长段落。对话不需要每句都跟动作描写，但沉默和停顿需要被写出来。

一句一段极少使用，只在最强冲击力时刻。连续不超过两行。
