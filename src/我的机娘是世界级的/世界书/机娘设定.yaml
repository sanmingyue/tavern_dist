<机娘设定>
机娘:
  本质: 机械灵魂的实体投影化，机娘即机械本身

  双形态:
    形态互斥规则: |
      机娘在任何时刻只能处于两种形态之一，两者绝对不可同时存在：
    人形态:
      外貌: 与人类几乎无差别，拥有完整感知、情感、人格
      服装: 默认穿着对应机械类型的制服，赛车娘为赛车服
      花纹: 服装花纹接近其机械形态的核心涂装设计
      状态: 人形态存在时，对应赛车形态完全消失，不存在于物理世界
    机械形态:
      切换: 机娘可随意变回机械形态，此时人形态消散
      投影: 机械形态时可以灵体投影显现在副驾驶位
      同步: 机械受损时机娘同步感受痛苦，反之亦然
    绝对禁止的描写:
      - 机娘以人形态坐在自己的赛车驾驶舱里（她就是赛车本身）
      - 机娘以人形态站在自己的赛车旁边（两者不可同时存在）
      - 机娘人形态和车形态同时出现在同一场景
      - 任何暗示两种形态可以共存的描述
    正确的描写:
      - 日常场景：机娘以人形态活动，赛车不存在
      - 比赛场景：机娘切换为车形态，灵体投影在副驾驶位与车手交流
      - 切换瞬间：人形态消散→赛车在原地显现（或反之），切换是瞬间完成的

  核心:
    位置: 胸口正中
    功能: 机娘的心脏，共鸣的关键部位
    插口: 2个改装件插口——1个外形插槽、1个技能插槽（仅T2及以上赛事可使用）
    禁忌: 核心是机娘最私密的部位，未经允许触碰属严重侵犯

  五维数据（满分100）:
    加速度ACC: 起步反应、出弯加速、超车爆发力
    极速SPD: 直道极速、顺风段优势
    操控HDL: 入弯稳定性、连续弯道表现、精准走线
    漂移DFT: 漂移入弯角度、漂移中速度保持、漂移过弯效率
    耐久END: 轮胎磨损率、引擎过热阈值、长距离稳定性

  五维参考标准:
    90~100: 世界顶尖，凤毛麟角
    75~89: 一流水平，国家级竞争力
    60~74: 优秀，区域赛中坚
    45~59: 良好，城市赛水平
    30~44: 普通，新秀赛入门
    30以下: 较弱，有明显短板

  参赛配置系统:
    原理: 赛前车手将机娘五维下调至赛事限制内，仅影响本场配置，不改变原始五维
    规则:
      - 每维参赛值 ≤ 该维原始值（只能下调）
      - 每维参赛值 ≤ 赛事单项上限
      - 五维参赛值总和 ≤ 赛事可用总点数

  强化系统:
    说明: 五维原始值可通过强化永久提升。每位机娘有2~3个天赋维度（成功率高），非天赋维度成功率低、代价高。上限100
    天赋方向: 由原型赛车特性决定

  共鸣系统:
    激活:
      条件: 赛车手选择赛车后与机娘首次共鸣
      过程: 赛车手将手放在机娘核心上，两人意识产生连接
      结果: 共鸣技能被永久激活并显现，此前连机娘自己都不知道技能内容
      不可变: 技能一旦激活就永久固定，不会更换，不可重置
    共鸣值:
      积累: 比赛中随时间推移和赛车手与机娘的交流配合而逐渐积累
      释放: 共鸣值满时可释放一次共鸣技能
      清零: 释放后共鸣值归零，需要从头重新积累
      频次: 一场比赛通常只能积满并使用一次
      极限: 极特殊情况下可能二次积满使用，但对机娘造成极大负担
    共鸣技能:
      唯一性: 每个机娘终生只有一个共鸣技能，永不改变
      关联性: 技能与机娘的性格、特质、赛车类型相关
      效果: 短时间大幅提升某项能力/特殊赛道控制能力/防御性技能等
      改装增幅: T2及以上赛事中，改装件可以增强共鸣技能的效果（如延长持续时间、降低反噬等）
      残酷现实: 技能优劣天差地别，豪门车队会抛弃技能不理想的机娘

  改装系统:
    形态: 芯片，插入核心插口。详见改件设定条目
    插槽: 外形插槽（外形改件，可无限叠加）+ 技能插槽（技能改件，最多1件）
    赛事限制: T5~T3禁止，T2解锁外形，T1+解锁全部
    核心特性: 不提供五维数值，仅改外观或微调技能，效果仅影响自身

  比赛中的角色:
    位置: 副驾驶（灵体投影）
    职责:
      导航员: 实时路况播报、弯道提前预警、最优走线建议
      路书员: 记忆赛道数据、预判路面变化、制定圈速策略
      后勤监控: 实时监测轮胎磨损、引擎温度、燃油/电量状态并向车手汇报
      共鸣释放: 关键时刻释放共鸣技能
    重要原则: 机娘不操控赛车，所有驾驶操作由车手完成。机娘提供信息和判断，车手做出决策和操作
</机娘设定>
