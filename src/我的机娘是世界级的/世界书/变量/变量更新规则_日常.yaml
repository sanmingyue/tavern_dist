<变量更新规则_日常>
---
变量更新规则:
  世界:
    当前时间:
      format: YYYY-MM-DD HH:MM
      check:
        - 每次场景推进或时间流逝后更新
    当前地点:
      check:
        - 场景切换时更新
    天气:
      check:
        - 场景切换或时间大幅推进时合理更新
    当前状态:
      type: "'日常' | '赛前准备' | '比赛中'"
      check:
        - 确认参赛后切换为"赛前准备"
  主角:
    车队:
      check:
        - 加入或更换车队时更新
    赛事等级:
      type: "'T5' | 'T4' | 'T3' | 'T2' | 'T1' | 'T0'"
      check:
        - 赛季升降级时更新
    信用点数:
      type: number
      check:
        - 消费时扣除，收入时增加，金额参考金融设定
        - 余额不足时不可消费
    强化点数:
      type: number
      check:
        - 赛事奖励获得时增加
        - 强化机娘五维时消耗
    改件仓库:
      check:
        - 购买改件时新增到对应分类（外形改件或技能改件），同时扣除信用点
        - 从机娘身上拆卸改件时回到仓库
        - 出售改件时从仓库移除，同时增加信用点
  机娘库:
    新增机娘:
      check:
        - 获得新机娘时在机娘库中新增条目
        - 填入_赛车型号、_赛车类型、_天赋维度
        - 五维由机娘本身决定，是固定基础值
        - 外形改件初始为空数组，技能改件初始为null
  机娘库.${机娘名}:
    状态:
      type: "'正常' | '受伤' | '维修中'"
      check:
        - 受伤或修复后更新
    五维:
      check:
        - 五维是机娘基础值，仅通过强化系统永久提升
        - 强化由前端处理，AI不直接修改五维
        - 仅在极特殊剧情事件导致永久变化时才修改（极罕见）
    外形改件:
      type: "Array<{ 名称: string; 类型: string; 描述: string }>"
      check:
        - 安装外形改件时新增条目，从仓库移除对应改件
        - 拆卸时从数组移除，改件回到仓库
        - 外形改件可无限叠加，不受数量限制
    技能改件:
      type: "null | { 名称: string; 效果方向: string; 描述: string; 是否黑市: boolean }"
      check:
        - 安装时设置，从仓库移除对应改件。最多1件
        - 拆卸时设为null，改件回到仓库
        - 已有技能改件时须先拆卸再安装新的
    共鸣:
      check:
        - 首次共鸣时将已激活设为true，填入技能名和描述
        - 技能一旦激活永久固定
</变量更新规则_日常>
