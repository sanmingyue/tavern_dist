<变量更新规则_赛前准备>
---
变量更新规则:
  世界:
    当前时间:
      format: YYYY-MM-DD HH:MM
      check:
        - 赛前准备阶段按实际进度推进时间
    当前状态:
      type: "'日常' | '赛前准备' | '比赛中'"
      check:
        - 赛前准备完毕、上赛道发车后切换为"比赛中"
  当前比赛:
    赛事名称:
      check:
        - 写入本场赛事名称
    赛事类型:
      type: "'场地赛' | '街道赛' | '拉力赛' | '漂移赛' | '耐力赛'"
      check:
        - 写入本场赛事类型
    赛事级别:
      type: "'T5' | 'T4' | 'T3' | 'T2' | 'T1' | 'T0'"
      check:
        - 写入本场赛事级别
    搭档机娘:
      check:
        - 写入本场搭档的机娘名
    赛道状态:
      check:
        - 根据天气和赛道条件初始化（干燥/湿滑/积水等）
    总圈数:
      type: number
      check:
        - 根据赛事设定写入总圈数
    参赛五维:
      type: "{ 加速度: number; 极速: number; 操控: number; 漂移: number; 耐久: number }"
      check:
        - 由前端根据玩家的点数分配写入，AI不直接设置
        - 五维总和不超过赛事可用总点数，每项不超过赛事单项上限
        - 每项不超过搭档机娘的原始五维值
    对手:
      type: |-
        {
          [对手名: string]: {
            车手名: string;
            机娘名: string;
            当前排名: number;
            参赛五维: { 加速度: number; 极速: number; 操控: number; 漂移: number; 耐久: number };
            共鸣技能: string;
            技能已使用: boolean;
          }
        }
      check:
        - 根据参赛名单初始化所有对手信息
        - 对手的参赛五维应符合赛事级别限制（总和≤可用总点数，每项≤单项上限）
        - 技能已使用初始化为false，当前排名按发车顺序写入
  主角.信用点数:
    type: number
    check:
      - 报名参赛时扣除报名费
      - 赛前购买/更换改件时扣除费用
      - 余额不足时不可消费
  机娘库.${搭档机娘名}.外形改件:
    check:
      - 赛前安装或拆卸外形改件时更新数组
      - 改件等级须符合赛事限制（T2+才可使用）
  机娘库.${搭档机娘名}.技能改件:
    check:
      - 赛前安装或拆卸技能改件时更新
      - 仅T1+赛事允许使用技能改件
</变量更新规则_赛前准备>
