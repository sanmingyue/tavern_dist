<变量更新规则_比赛中>
---
变量更新规则:
  世界:
    当前时间:
      format: YYYY-MM-DD HH:MM
      check:
        - 比赛过程中按赛事进度推进时间
    天气:
      check:
        - 比赛过程中天气可能变化，影响赛道状态
    当前状态:
      type: "'日常' | '赛前准备' | '比赛中'"
      check:
        - 比赛结束后切换回"日常"
  机娘库.${搭档机娘名}:
    状态:
      type: "'正常' | '受伤' | '维修中'"
      check:
        - 发生碰撞或事故时更新为"受伤"
    五维:
      check:
        - 五维是机娘基础值，比赛中不变化
        - 仅因事故导致永久损伤时下降（极罕见）
    共鸣.当前共鸣值:
      type: number
      range: 0~100
      check:
        - 基础每圈自然累积 +(3~5)
        - 关键弯道完美配合、精准指令执行等额外 +(5~15)
        - 失误、争吵、信任崩塌等 -(5~10)
        - 满100时可释放一次共鸣技能，释放后归零
  当前比赛:
    赛道状态:
      check:
        - 天气变化或事故影响赛道时更新
    当前圈数:
      type: number
      check:
        - 每完成一圈+1
    当前排名:
      type: number
      check:
        - 根据实际赛况实时调整
    参赛五维:
      check:
        - 比赛中参赛五维不变化（赛前已锁定）
    对手.${对手名}:
      check:
        - 仅更新当前排名和技能已使用
        - 对手使用共鸣技能后将技能已使用设为true
        - 对手退赛时移除该条目
  主角.赛季积分:
    type: number
    check:
      - 比赛结束后根据最终名次增加积分
  主角.信用点数:
    type: number
    check:
      - 比赛结束后根据最终名次和赛事级别发放奖金，金额参考金融设定
      - 比赛中因碰撞/事故产生的维修费在赛后扣除
  主角.强化点数:
    type: number
    check:
      - 比赛结束后根据名次和赛事级别奖励强化点数
</变量更新规则_比赛中>
