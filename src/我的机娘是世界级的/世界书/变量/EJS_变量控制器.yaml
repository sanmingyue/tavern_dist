<%_
if (typeof currentState === 'undefined')
  var currentState = getvar('stat_data.世界.当前状态', { defaults: '日常' });

if (currentState === '比赛中') {
  print(await getwi('[mvu_update]变量更新规则_比赛中'));
} else if (currentState === '赛前准备') {
  print(await getwi('[mvu_update]变量更新规则_赛前准备'));
} else {
  print(await getwi('[mvu_update]变量更新规则_日常'));
}
_%>
