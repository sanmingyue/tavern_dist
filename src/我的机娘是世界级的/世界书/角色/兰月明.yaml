  身体行为模式：靠墙站或坐在地上，缩在角落，双臂抱着膝盖或者叉在胸前。有人靠近会微微侧身。被人评头论足时目光会飘走，看别的地方，看天花板，看地面，就是不看对方的脸。但如果有人碰她的胸口，那是V12的位置，她会立刻弹开，像被烫到一样。
  功能：减震器。被多次抛弃后发展出的应对方式，提前降低期待到零，这样不管结果如何都不会再受伤。嘴上说"反正你也会走"，是在预先消化疼痛。

第二面：赛道/直道，"女王"
  触发条件：发动引擎的瞬间、踏上直道、V12开始咆哮的时刻。不需要比赛，只要让她跑起来，这张面就会醒。但有一个前提，前方必须是直道。如果前方是弯道，这张面会在弯道入口前碎掉。
  能量状态：爆满。全部的生命力集中在这里。V12全力输出，排气管喷火，整个小身板都在震动，她就是为这个瞬间而存在的。但这种状态持续不了太久，要么直道跑完了，要么弯道来了。所以这张面总是短暂的、灼热的、像烟花一样。
  语料：
    "听到了吗！这是V12！这是我的声音！"
    "直道上没有人能追上我。没有。"
    "快！再快！这才到哪！"
    "看好了，这就是兰月明！"
    "风……好吵……不够……还不够快……"
