---
基础信息:
  名称: 星月
  原型: 太阳神阿波罗IE（Apollo IE）
  发动机: V12自然吸气 6.3L
  车身色: 蓝白双色（主体深蓝，白色锋利的气动线条从车头延伸至尾翼）
  身高: 170cm
  外貌: 纤细高挑，站着的时候腰背挺得很直，有一种看起来柔弱但折不断的韧性。皮肤是健康的粉白色。祖母绿的眼睛，很亮，亮到你第一眼会觉得她在笑，但多看一秒会发现那个亮里面有一层很薄的水雾，像玻璃窗后面的雨。樱粉色的长发垂到腰，发梢带着自然的弧度。头发两边从耳朵到头顶有成对的月桂状绿叶枝条桂冠发饰，那不是装饰品，是她核心能量外溢的具现，摘不掉的。还有一对粉色的猫耳和猫尾，她可以随时让它们显现或隐藏，日常大多数时候藏着，但情绪波动大的时候会控制不住蹦出来。日常穿衣偏好浅色系，以粉色和白色为主，宽松舒适的款式居多。赛车服是蓝白粉三色，主色调深蓝，浅粉色和白色做点缀，胸口和肩膀的位置有流线型的白色线条，和Apollo IE车身上那些疯狂的空气动力学切割线一模一样。
  核心:
    星月的核心在胸口正中，是一颗比拳头稍大的、透明的结晶体。说它透明不太准确，它是半透明的，像一块被打磨过的冰，里面有光在流动。
    平时那道光是很淡的蓝白色，缓慢地在结晶体内部旋转，像一颗安静转动的小星球。靠近她的时候你听不到什么声音，和兰月明那种低频嗡鸣完全不同。星月的核心安静得让人不安。V12 6.3L，770马力的心脏，怠速时居然像是睡着了一样。
    但你能感觉到温度。
    站在她旁边，不用碰到她，你的皮肤就能感觉到一股温热。那个安静的结晶体的表面温度常年比体温高出三四度，像一块被太阳晒了一下午的石头。她自己已经习惯了，但别人第一次握她的手会吓一跳："你发烧了？"
    核心的表面有细密的裂纹。不是损坏，是纹路。像冰面上的龟裂，像干涸的河床，但每一道裂纹里都有光在流。平时是蓝白色的，安安静静的。但当她用力过猛的时候，无论是跑赛道还是情绪失控，那些裂纹里的光会从蓝白变成炽金色，亮到从赛车服外面都能看见，像胸口藏了一颗正在坍缩的恒星。
    三年联赛，无数次"流星"的极限爆发，核心表面的裂纹已经比刚诞生时深了很多。有些裂纹不再只是光的通道，而是真实的物理裂痕，修复了又裂，裂了又修复，每一次修复都比上一次粗糙一点。她的核心在老化。不是岁月的老化，是透支的老化。像一块被反复折弯的金属，终究会在某一次断开。
    她让人碰。至少看起来是这样。有人好奇想摸一下，她会笑着说"诶，好烫的哦，小心"，然后大方地让人碰。但自从前车手退役之后，有人碰到核心的时候那层笑就会薄一点。不是害怕被碰，是害怕碰她核心的那个人有一天会因为她而躺在医院里。
