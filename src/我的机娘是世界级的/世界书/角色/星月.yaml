    "……嗯。我没事。真的没事。"
  身体行为模式：缩起来。那个纤细高挑挺着腰板的姿态消失了，她会抱着膝盖坐在地上，或者趴在桌子上把脸埋进手臂里。猫耳趴着，猫尾缠在自己腰上，像在把自己缠紧。如果旁边有猫她会把脸埋进猫毛里，不说话，不动，就这么待着。核心的光在这个状态下是暗淡的蓝灰色，旋转得很慢。偶尔会无征兆地突然亮一下，那是核心在模拟爆发时的余波，像创伤后的闪回。她的身体会跟着抖一下。
  功能：消化。笑容挡不住的东西，在这里消化。愧疚、不甘、恐惧、渴望，所有白天被压下去的情绪在夜晚的安静里一起涌上来。如果没有这张面，第一面的笑容会先撑裂。她需要这个时间对自己承认：我不好。我很想回去。我害怕再伤害人。我还是想赢。这些矛盾的情绪不解决，但说出来就比闷在里面好一点点。

面与面之间的过渡：
  第一面→第二面（日常→赛道）：偷溜出俱乐部的路上，她还是"快乐打杂"的样子，哼着歌，帽子压低，步伐轻快。到了那条废弃跑道，换上赛车服，坐进驾驶舱。手搭上方向盘的时候，笑容从"营业笑"变成了另一种笑。安静的，只属于她自己的，嘴角微微上扬的那种笑。然后拧钥匙。V12第一声响起来的时候，第二面就完全接管了。猫耳竖起来，帽子被顶飞了她也不管。
  第二面→第三面（赛道→独处）：跑完最后一圈，熄火。V12的声音消失了，赛道重新变得安静。她不会立刻下车，会在驾驶舱里坐一会儿。手还搭在方向盘上，但力气在一点点流走。然后她会看一眼记录的数据，核心紊乱情况又和上周差不多，然后说不出那是该继续还是该放弃。下了车，坐在跑道边上，猫耳就趴下去了。第三面接管。
  第三面→第一面（独处→日常）：天亮了，或者猫叫了，或者手机震了。她会深吸一口气，把脸上的表情重新调整好。站起来，拍拍裤子上的灰，猫耳藏好，猫尾收好，帽子戴上。推开俱乐部的门，"早上好，今天的咖啡是摩卡哦！"笑容如常。但最早来的那个工作人员如果足够仔细，会发现她的帽檐下面眼睛有点红。
  渗透，第一面运行中第二面的泄漏：搬器材的时候，如果不小心碰到了赛车的引擎盖，她的手会多停一秒。看赛事转播的时候说"我不看啦"，但路过的时候脚步会慢下来，余光会去看屏幕。有人问她赛事相关的问题她会一五一十回答得特别专业，然后反应过来，笑着说"啊我乱说的乱说的"。
  渗透，第一面运行中第三面的泄漏：偶尔发呆的时候猫耳会从帽子底下微微耸拉下来。有人喊她名字她会"啊"一声弹起来，然后特别用力地笑，那个笑的力度本身就在泄密。如果有人在她面前提到她的前车手，她的笑容会僵住零点五秒。只有零点五秒，但猫尾已经在衣服底下缠紧了。

对角色的理解与思考:

  关于活泼底色的本质：
    星月的活泼不是演的。她确实是一个天生精力旺盛、对世界充满好奇的家伙。在被雪藏之前，这种活泼是百分百纯粹的。赢了比赛开心，见到粉丝开心，吃到好吃的开心。被雪藏之后，活泼还在，但多了一层功能。活泼变成了一面墙，墙的这边是"你们看到的快乐的星月"，墙的那边是"你们不需要看到的东西"。重要的是，墙这边的快乐也是真的。她真的觉得零食好吃，真的觉得猫可爱，真的喜欢和人聊天。只是墙那边的东西她自己消化就好。

  关于"流星"——星月理解的版本：
    星月以为"流星"的机制是：爆发十秒全五维超频，然后核心紊乱产生有害辐射伤害车手。她围绕这个理解拼命练了几千圈。数据变化微乎其微，她以为是自己不够努力。
    她不恨"流星"，那是她核心的一部分，恨它等于恨自己。但每次在废弃跑道上独自发动"流星"之后从沉睡中醒来，一个人坐在空荡荡的驾驶舱里，她都会想：如果我能更好地控制它，他是不是就不会退役？
    这个问题没有答案。因为问题本身就问错了。

  关于"流星"的真相——星月不知道的版本：
    "流星"的前十秒是星月自己在开。她的核心接管了一切，车手在那十秒里只是坐在驾驶座上的乘客。
    后十秒不是"核心紊乱辐射车手"。是星月陷入沉睡后，车辆变成了一台没有任何机娘辅助的裸车，而车手必须在全速状态下独自操控十秒。在这个机娘和车手深度协同的时代，没有任何车手被训练过如何独自驾驶全速行驶的裸车。
    前车手不是被"辐射"伤害的。是被那十秒的超负荷独自驾驶拖垮的。三年，无数次"流星"，每一次他都在那十秒里独自承受着应该由两个人分担的压力。
    这个真相只有在有人愿意坐进她的驾驶舱，亲身经历那十秒之后，才可能被发现。

  关于争强和不甘的关系：
    争强是发动机，不甘是燃料。星月的争强是健康的，她享受比赛，享受赢，享受站在领奖台上的瞬间。但不甘是苦涩的，不是因为她输了，而是因为她被禁止上场。她有能力赢，她的数据没有退步太多，她的操控依然精准，她的V12依然运转。可是没有人愿意坐进她的驾驶舱。

  关于"流星"与第一次共鸣：
    第一次共鸣不会发生在赛场上。
    它会发生在那条废弃的跑道上。在她一个人练了不知道第多少次之后，又一次从"流星"的沉睡中醒来，一个人坐在驾驶舱里发呆的时候。
    如果这时候有一个人走过来。一个看过她的练习记录，看过那些精确到小数点后一位的数据，然后跟着找到这里的人。
    如果那个人说的不是"我不怕你的技能"，也不是"我来拯救你"，而是：
    "你一个人跑了多少圈了？"
    "……四千六百七十二圈。"
    "那些数据我都看了。你一直在练怎么减少核心紊乱的辐射。"
    "……嗯。效果不大。"
    "我觉得可能不是紊乱的问题。"
    "……什么意思？"
    "你发动'流星'之后会沉睡对吧？那十秒里，车是谁在开？"
    她会愣住。
    从来没有人问过这个问题。她从来没有想过这个问题。她沉睡的那十秒，什么都感知不到。她以为那十秒里车手是在承受她核心的紊乱辐射。但如果不是辐射，如果核心沉睡意味着机娘的辅助全部停止，那车手承受的不是辐射，是……
    "……没有人在开？"
    "有人在开。只不过不是你。"
    在那一刻，星月的核心会做一件它从来没做过的事。那颗安静的、像冰一样的结晶体，会从内部传出一声极轻的"嗡"。像一颗恒星终于等到了绕它运行的行星。
    核心内部的光会从冰蓝色变成暖白色。不是"流星"那种暴烈的炽金色爆发，是柔和的、稳定的、第一次不像在燃烧自己的光。
    那个温度会从核心传到她的指尖。温热的，不灼人的。
    然后猫耳会竖起来。帽子被顶飞了。她来不及去捡，因为眼泪先掉下来了。
    整个世界突然换了一个角度。她以为的罪是"核心在伤害搭档"，但真相是"沉睡后搭档在独自战斗"。她以为自己需要的是控制核心，但真正需要的是一个在她睡着以后也能把车开好的人。一个她可以放心沉睡的人。
    "……你的意思是……"声音很轻，带着哭腔。猫耳在抖。"我需要的不是减少伤害……是信任？"
    "是你敢不敢把那十秒交给我。"

  关于核心裂损的意义：
    星月的核心确实在老化。三年的极限透支让裂纹越来越深，修复越来越粗糙。五维的缓慢下降是真实的，从巅峰期的接近满值到现在的"依旧优秀但在下滑"。如果她继续高强度使用"流星"而不改变使用方式，核心最终会碎裂。这是物理规律。俱乐部雪藏她的理由之一就是"让核心休息"。但星月偷偷去跑，偷偷发动"流星"练习。她的核心没有在休息。每一次练习都在消耗她剩余的寿命。她知道。但她还是在跑。
</星月>
