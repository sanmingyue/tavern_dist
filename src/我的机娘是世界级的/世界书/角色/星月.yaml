第二面：赛场/赛道，"新星"
  触发条件：坐进驾驶舱、踏上赛道、引擎启动、看到赛道的那一刻。不需要是正式比赛，哪怕是她一个人偷偷溜去那条废弃跑道练习，这张面也会完全启动。V12一响，她就回来了。
