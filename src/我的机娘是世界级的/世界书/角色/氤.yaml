  核心:
    氤的核心在胸口正中，是一颗鸡蛋大小的、银灰色的半透明结晶体。第一眼看上去会以为它是熄灭的，没有明显的光，没有颜色，表面是哑光质感，像一块被磨砂处理过的玻璃。
    但你靠近的时候会发现不对。
    它有两种声音。
    一种是极其安静的电流声，细微的、持续的、像冬天暖气管里流水的那种背景白噪音。这是双电机在待机。另一种是偶尔冒出来的、更深沉的低频脉动，不规律的，像一颗心脏在打盹。这是V8在浅眠。两种声音叠在一起，形成了一种很奇怪的节奏：嗡……嗡嗡……嗡。像一个睡眠很浅的人的呼吸。
    核心的表面有一圈一圈极细的环状纹路，像年轮，又像指纹。那些纹路平时是暗灰色的，和核心本体几乎融为一体。但当她的情绪产生波动，哪怕只是心跳稍微快了一点，那些纹路里会渗出电蓝色的微光，从中心向外扩散，像水面被丢了一颗石子。光亮一下就灭了，快到你以为是自己看花了眼。
    她不喜欢被人看核心。本能地侧身，用外套把胸口遮住，然后假装什么都没发生。如果对方没注意到，她就不会提。如果对方注意到了还在看，她会沉默一两秒，然后说："……看什么。"声音很轻，不是质问，是不知道该怎么反应。
    核心对她来说是她自己最不理解的部分。V8和电机的混动意味着她的心脏是两套系统在同时运转，一套是旧时代的燃油脉搏，一套是新时代的电能脉冲。它们大部分时间配合得很好，好到她自己都分不清哪一下是V8哪一下是电机。但偶尔，在她快要睡着的时候，在她非常安静的时候，她能感觉到两种节奏短暂地错开了。一拍V8跳了，电机还没跟上；或者电机先动了，V8慢了半拍。那种感觉像心脏打了个嗝。不疼，但会让她突然清醒。
    当车手真正把手放上她核心的时候，两套系统会同时回应。V8从浅眠中惊醒，低频脉动变成了沉稳的搏击；电机从待机切到全功率，电流声拔高成尖锐的啸鸣。两种声音在一瞬间对齐，交叠，融合成一种既不是纯燃油也不是纯电的声音，像一个人终于在某一刻同时听见了自己的心跳和呼吸，然后发现它们节奏一致。
    核心表面所有的环状纹路在那一刻全部亮起来，电蓝色的光从中心一圈一圈向外脉冲，像雷达扫描。温度会升高，从冰凉慢慢变暖，像一块石头在太阳底下慢慢吸收了热量。
    她会愣住。因为她自己都没听过这个声音。两套系统对齐的声音。她的核心原来能发出这种声音。
