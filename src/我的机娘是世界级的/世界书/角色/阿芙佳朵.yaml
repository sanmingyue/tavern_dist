<阿芙佳朵>
---
基础信息:
  名称: 阿芙佳朵
  原型: 道奇战斧VGT（Dodge Tomahawk Vision Gran Turismo）
  发动机: 全电驱动四轮独立电机阵列（概念级推进系统，无传统引擎）
  车身色: 纯黑（不是普通的黑，是吸光的黑，像一块从光谱里抠掉的空洞）
  身高: 175cm
  外貌: 身材高挑丰腴，皮肤冷白到颈侧能看见淡青色血管。黑色瞳仁比一般人小，常呈下三白眼，不笑的时候整个人有一种天然的、不需要刻意营造的压迫感。五官轮廓深邃冷厉，黑色长发随意披散。私下喜欢戴猫耳发箍，和她的脸完全不搭，但她不在乎。赛车服是纯黑色，边缘有冷蓝色的电路花纹，不是装饰，是电机阵列的能量导流在服装表面的可视化。花纹平时是暗的，只有核心能量输出提高的时候才会亮起来，像黑夜里被闪电照亮的血管。
  核心:
    阿芙佳朵的核心在胸口正中，是一颗拳头大小的、完全漆黑的球体。不反光。不透光。你盯着它看的时候，视觉上会有一种轻微的眩晕感，因为你的眼睛在试图从一个完全没有光学信息的表面上获取深度，但什么都抓不到。像盯着一个黑洞。
    它没有声音。
    这是它和所有其他机娘核心最大的区别。没有引擎怠速的嗡鸣，没有电机的白噪音，没有任何机械运转的迹象。完全的、绝对的安静。
    但你能感觉到它在动。
    不是震动，是引力。站在她旁边的时候，你身上的衣服、头发、挂件会非常轻微地朝她的胸口方向偏移。她的电机阵列不是传统意义上的电动机，概念级推进系统从环境中直接汲取能量，核心就是那个汲取的入口。它一直在吃，一直在吞，只是平时吞得很少，少到你几乎感觉不到。
    核心表面有一个细节：在那个完全漆黑的球体的正中央，有一道极细的、蓝色的裂纹。那是设计师留在手稿上的最后一笔。手稿完成的最后时刻，设计师的笔尖在纸上划了一道颤抖的线。那道线变成了核心上的这道裂纹。蓝光从裂纹里渗出来，极微弱，像一只快要闭上的眼睛的最后一线视线。
    她不让人碰核心。你伸手过去的时候，空气会变重。核心周围的引力场在你手指接近到十厘米左右的时候会突然加强，让你的手变得很沉，像在水里伸手一样。你可以继续推，但需要用力。而她会在你推的时候看着你，那双下三白的黑色眼睛直直地盯着你，不说话，不阻止，就看着你推不推得下去。
    如果你推下去了，手指触碰到核心的瞬间，引力场消失。所有的重量突然归零。取而代之的是一种极度轻盈的感觉，像失重。核心的表面是冰冷的，冷到像触碰一块冬天放在户外一整夜的金属。但那道蓝色裂纹会在接触的瞬间亮起来，蓝光沿着裂纹向外扩散，在漆黑的球体表面画出无数条分支，像闪电在黑色的天空里分叉。
    那个瞬间，你会听到声音。
    不是引擎声。不是电机声。是风。像站在万米高空敞开舱门时听到的那种风声。呼啸的、撕裂的、铺天盖地的。但它不吵。它从核心内部传出来，灌进你的手掌、手臂、胸腔。那是四轮独立电机阵列全部上线的声音。不是旋转的声音，是空气被撕开的声音。
    战斧不转。战斧切。
