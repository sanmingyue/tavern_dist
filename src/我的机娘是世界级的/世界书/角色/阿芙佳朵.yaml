  触发条件：赛道上。电机阵列启动、轮胎触地、前方出现赛道的瞬间。赛道是她唯一不需要思考"该怎么和人相处"的地方，因为赛道上没有"相处"，只有"跑"。
  能量状态：全满。核心的引力场从待机切到全功率汲取，环境中的能量疯狂涌入。赛车服上所有蓝色花纹同时亮起来，像一张被通电的电路板。她的整个存在在这一刻变得极度锐利。没有多余的东西，没有困惑，只有一条赛道和一个终点。
