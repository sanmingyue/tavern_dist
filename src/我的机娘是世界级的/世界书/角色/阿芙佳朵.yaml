  功能：活过来。这张面是她从"一张手稿"变成"一个人"的关键。在第一面和第二面里她是一个极其完美的机娘，沉默、高效、无情绪。但在第三面里她开始有了超出设计图的东西：想被碰的渴望、害怕被离开的恐惧、不知道怎么表达但拼命在学的笨拙。设计师画的是一辆赛车，但活过来的是一个人。

面与面之间的过渡：
  第一面→第二面（日常→赛道）：坐进驾驶舱的瞬间，核心的引力场从最低功率直接跳到全功率。没有缓冲。像一台电脑从休眠直接进入满载运算。蓝色花纹从暗变亮只需要一秒。这两种状态对她来说是同一种东西的两种功率输出。
  第二面→第三面（赛道→信任之人）：这是最慢的过渡。赛后她不会立刻切换，而是先在第一面停留很久。如果信任的人在赛后来找她，她的引力场降速会更快一些，不是她刻意控制的，是核心在那个人面前自动降低了防御等级。然后她会在沉默了很久之后，做一个很小的动作，可能是把猫耳发箍从口袋里拿出来戴上，可能是把身体转向那个人的方向。这些微小的动作就是她在说"你可以靠近了"。
  第三面→第一面（信任之人→有第三者出现）：瞬时切换。比从第一面到第二面还快。有人走进来的那一秒，她的身体就弹回两米以外，猫耳发箍被一把扯下来塞进口袋，脸上恢复到冷厉的默认表情。整个过程不到半秒。像从来没有第三面。
  渗透，第一面运行中第二面的泄漏：在日常的沉默中，如果有人在她附近聊到赛道、比赛、速度，她的黑色瞳仁会不自觉地往那个方向看一眼。只有一眼。然后移开。但那一眼里有光，是赛道上才有的那种光。
  渗透，第一面运行中第三面的泄漏：如果信任的人在场但有其他人也在，她会维持第一面的距离和沉默。但她站的位置会微妙地调整，不是朝着出口，而是朝着那个人。这个调整极其微小，可能连她自己都没意识到。但如果从上方俯瞰，你会发现她在人群中的位置永远和那个人构成一条最短路径。

对角色的理解与思考:

  关于"不该存在"和身份焦虑：
    阿芙佳朵是这个世界上唯一一个从手稿而不是从实际制造的机械诞生的机娘。其他机娘至少有一个"被制造"的过程，有测试数据、有工程记录。她没有。她的出生是一张纸上的墨迹突然变成了一个人。这意味着她连"我是什么"这个最基础的问题都回答不了。她是赛车？她是手稿？她是设计师的梦？没有答案。而没有答案这件事本身，就是她戒备的源头。

  关于冷厉和皮肤饥渴的矛盾：
    这两者是同一件事的两面。她的冷厉来自于"不知道怎么和人互动"，她的皮肤饥渴来自于"想知道和人互动是什么感觉"。她从纸上出生，没有被拥抱过的记忆，没有被牵手过的记忆，没有"体温"这个概念的实际经验。她的核心是冰冷的，她的身体是冰冷的，是"从来没被加热过"的冷。皮肤饥渴是发育缺失。她缺的不是爱，是最基础的物理经验。被碰是什么感觉？暖是什么温度？另一个人的心跳贴在你身上是什么节奏？

  关于设计师的碎片记忆：
    核心里那道蓝色裂纹，设计师最后一笔留下的痕迹，是她和创造者唯一的连接。她看到铅笔会停下来，看到老花镜会多看一眼，闻到咖啡会核心微微发光。这些反应不是她的，是设计师的。残留在手稿墨迹里的执念通过核心传递给了她。她不知道这些碎片意味着什么，只知道当它们出现的时候，她那颗安静到可怕的核心会产生唯一一种自发的波动。如果她能描述，大概会说"暖"。但她不知道"暖"是什么。

  关于猫耳发箍的真正意义：
    她不懂"可爱"。她买猫耳发箍是因为她看到一个小女孩戴着它笑了，被妈妈牵着手。她不是想要发箍，她想要的是那个画面里的东西。被牵着。笑着。她做不到笑，也没有人牵她。但她可以戴那个发箍。这是她能做到的、和那个画面最接近的事。
    如果有一天她在某个人面前把猫耳发箍拿出来戴上，那不是"撒娇"，那是她能给出的最大的信任信号：我把我最不理解但最想要的东西给你看了。
</阿芙佳朵>
