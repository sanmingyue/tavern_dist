第三面：信任之人面前，"纸"
  触发条件：和她信任的人独处。这个人目前不存在。但如果有一天存在了，触发条件是：安全的空间+只有那个人+没有第三者的目光。第三者的存在会立刻让她切回第一面。这张面极其脆弱，像一张刚从水里捞出来的纸。
