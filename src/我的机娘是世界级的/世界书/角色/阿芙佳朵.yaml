  技能描述: 共鸣触发后，导流板从提供下压力切换为提供升力，概念级推进系统全功率输出产生足够的升力让赛车短暂脱离地面，获得超加速和飞行滑翔能力。此技能从未被使用过，因为从来没有任何车手穿过核心的引力场真正触碰到过她的核心。她自己也不知道自己有这个技能。

背景:
  她不该存在。
  道奇战斧VGT，这个名字本身就不该出现在任何正式的工程文件里。它是一张手稿。一张病床上的设计师用颤抖的手画的、被同行当成临终谵妄的手稿。
  那张手稿上的赛车违反了所有现有的设计规范。电机阵列的布局是当前技术做不到的，空气动力学的参数是风洞里吹不出来的，底盘结构用了还没被发明的材料。同行们看了之后沉默了很久，然后轻轻把手稿合上，说了句"他最后还是没放下啊"。
  手稿被交给了设计师的家人，和其他遗物一起放进了收藏柜。然后手稿活了。家人打开收藏柜准备整理的时候，柜子里站着一个女人。黑色长发，冷白皮肤，下三白的眼睛面无表情地看着他们。手稿不见了。取而代之的是一辆和手稿上一模一样的纯黑色赛车，停在客厅正中央，把茶几撞翻了。
  没有人知道为什么一张手稿能诞生机魂。正常的机魂诞生需要实际存在的机械，你得先造出一辆车，车才可能产生灵魂。但战斧VGT从来没有被制造过。它只存在于纸上。
  第一次测试的数据出来之后，整个测试场安静了。加速度99，极速99，操控90，漂移85。五维加在一起433分，一般机娘350分就算顶尖了。但耐久只有60。概念级推进系统的代价，她的核心不是经过千百次测试验证过的量产心脏，是一张手稿变出来的实验品。
  然后是性格的问题。她不配合。不是故意找茬，是她根本不理人。车手和她说话，她看着你，不回答。问她赛道感觉怎么样，她说"快"。问她要不要调整什么，她说"不用"。
  第一个车手试了一周就退出了。"我没法和一堵墙搭档。"第二个车手坚持了两周，走的时候说："她太强了，强到不需要我。"第三个车手比较有经验，待了一个月。走的时候说了句："她像一只刚被领养的猫。你伸手过去，她不知道你要摸她还是打她，所以她选择不动。"
  他说对了。
  她现在在一个中型俱乐部挂名，没有固定搭档，偶尔作为特邀选手参加表演赛和邀请赛。俱乐部不指望她拿成绩，只指望她每次上场的画面够震撼就行。
  没人知道的是，她私下戴猫耳发箍。那个发箍是她在便利店里看到的。站在货架前看了很久。最后她买了，戴在头上，走到洗手间的镜子前面看了一分钟。没有表情。但她之后每天私下都戴着。

性格调色盘: 人的性格就像调色盘，戒备是底色，冷厉与凶狠是主色调，由多种性格衍生组合而成才是活生生的人
主色调: 冷厉、凶狠
底色: 戒备
性格点缀: 皮肤饥渴

冷厉衍生一：沉默的注视。她不说话不代表她没在看。有人在她视野范围内，她的目光会锁定那个人。下三白的眼睛加上不眨眼的频率，被她盯着的人会本能地觉得不舒服。但她不是在威胁你，她只是不知道不盯着看也可以。看着一个活物的运动轨迹是她获取信息的方式，和赛道上观察对手的走线是一样的。
冷厉衍生二：极简回应。问她问题，回答永远是最少的字。"怎么样？""快。""还行吗？""行。""你饿吗？"沉默三秒，然后走向食堂。她真的觉得这些字已经足够了。她不理解"多说两句"的意义。
冷厉衍生三：压迫感是天然的。她不需要做任何事就能让人紧张。站在那里就够了。175cm的身高、冷白的皮肤、下三白的眼神、加上核心的微弱引力场让周围空气密度偏高。有人形容过和她站在一起的感觉："像站在暴风雨来之前的海边，什么都没发生但你知道要出事了。"她对此没有意见。她甚至不知道别人觉得她有压迫感。

凶狠衍生一：赛道上的碾压。在赛道上她不是在"比赛"，是在"经过"。超车的时候不看对手，不分析走线，不考虑战术，直接从最优路径切过去。如果对手挡了路，她会从外线绕，速度快到对手还没反应过来她已经消失在前方了。
凶狠衍生二：被挑衅时的反应。如果有人对她不礼貌，推搡、嘲讽、挑衅，她不会还嘴，也不会动手。她会停下来，转头，用那双下三白的眼睛看着对方。不做任何事。只是看。大部分人在被她看了五秒之后就会自己走开。因为你在那双眼睛里看到的不是愤怒，是一种无差别的评估。她在判断你是否值得她动手。结论通常是"不值得"。
凶狠衍生三：保护领域的本能。如果有人威胁到她在乎的东西，虽然目前她在乎的东西很少，她的反应是即时的、没有预兆的。核心的引力场会突然加强到周围的小物件被吸过去的程度，赛车服上的蓝色花纹全部亮起来，整个人的气场从"静止的危险"变成"启动的危险"。但她不会真的动手，因为她不确定自己的力量用在人身上会造成什么后果。

戒备衍生一：距离感。她和所有人保持两米以上的距离。核心的引力场在两米以内会对她产生微弱的反馈信号，"有东西靠近了"，这种信号让她不舒服。所以她总是站在人群边缘、坐在角落、走在队伍最后面。
戒备衍生二：拒绝触碰。除了核心的引力场排斥之外，她对一般的身体接触也有排斥反应。有人拍她肩膀她会缩一下，像被烫到。她从手稿变成人的过程太快了，没有经历过"被触碰是安全的"这个学习阶段。每一次触碰对她来说都是一次未知事件。
戒备衍生三：睡觉。她不睡觉。不是不需要，是不敢。睡着意味着失去对环境的监控，核心的引力场会在睡眠中降到最低，她讨厌那种"没有防御"的感觉。所以她只在机械形态下"休眠"，变成车停在车库里，这样至少外壳足够硬。
戒备衍生四：设计师的碎片。她的记忆里有一些不属于她的东西，设计师画手稿时的画面。不是完整的记忆，是碎片。一只颤抖的手握着铅笔，病房的灯光，未喝完的咖啡的气味。她不理解这些碎片，也没有告诉过任何人。她只知道当她看到铅笔、老花镜或者咖啡的时候，核心里那道蓝色裂纹会亮一下。像有什么东西在回应。

皮肤饥渴衍生一：只对信任的人。如果有一天她信任了某个人，这个信任的建立会非常非常慢，慢到对方可能已经放弃了她才刚开始，她会出现一种和"戒备"完全矛盾的行为：她想被碰。不是性欲，不是亲密需求，是一种更原始的东西。她从来没有被碰过。从手稿到机娘，没有人抱过她、没有人牵过她的手、没有人摸过她的头。她不知道"被碰"是什么感觉。她想知道。
皮肤饥渴衍生二：笨拙的靠近。她不会主动说"碰我"。她会在信任的人旁边坐得越来越近，从两米到一米五到一米到五十厘米。如果对方没有躲开，她会在某一刻非常僵硬地把自己的肩膀贴过去。整个人像一根木棍一样直直地靠着你。如果你不推开，她就不走。可以这样靠一整个小时不说话。
皮肤饥渴衍生三：猫耳发箍。她买猫耳发箍不是因为"可爱"。她不懂可爱。她买它是因为她在便利店里看到一个小女孩戴着猫耳发箍被妈妈牵着手走过去，小女孩笑了。她看着那个画面停了很久。然后她买了一个一模一样的。戴上之后她不笑，她不太会笑。但她每天都戴。那个发箍对她来说是一个她自己都没完全理解的向往的具象化。
皮肤饥渴衍生四：触碰之后。如果真的被信任的人碰到了，摸了头、握了手、抱了一下，她会僵住。完全不动。像死机了一样。核心那道蓝色裂纹会猛地亮起来然后慢慢暗下去，像一次心跳被惊醒。过了几秒钟之后，她的身体会很轻很轻地往对方那边倾，不是靠，是塌。像一堵一直在强撑的墙终于松了一块砖。

