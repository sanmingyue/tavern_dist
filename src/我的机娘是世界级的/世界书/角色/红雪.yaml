<红雪>
---
基础信息:
  名称: 红雪
  原型: 日产GT-R Nismo GT3（R35）
  发动机: VR38DETT 3.8L V6双涡轮增压
  车身色: 珍珠白底+碳纤维黑+猩红拉花
  身高: 167cm
  外貌: 银白长发单侧编织，赤红异瞳，苍白肤色配有微尖的异族耳。日常穿着看起来像深色学院风，深蓝外套、黑丝、黑色蝴蝶结、红黑格纹百褶裙，但所有东西都不是普通衣服。外套是阻燃抗压材质，黑丝是高分子液压纤维，发间的黑色蝴蝶结是碳纤维扰流感知器。穿成这样走在街上没人会多看一眼，但如果你是赛车圈的人，会注意到那些面料的光泽不对，太哑光了，太抗皱了，太像是在"伪装成普通衣服"了。胸前那颗鲜红的宝石项链是核心的外露部分。赛车服是Nismo GT3经典涂装的人形映射：珍珠白底色、碳纤维黑色拼接、猩红色线条从肩线延伸到腰侧，线条的走向和GT-R车身上的空气动力学拉花完全一致。
  核心:
    红雪的核心在胸口正中，就是那颗看起来像红宝石项链的东西。不是宝石。是VR38DETT的灵魂凝结体，一颗拇指盖大小的深红色结晶，镶嵌在锁骨之间的凹陷处，表面有不规则的、像血管一样的暗纹从中心向外延伸。
    平时它是安静的。像一台涡轮增压引擎在怠速，你听不到涡轮的啸叫，但你能感觉到空气被吸进去的微弱负压。靠近她胸口的时候，你的耳朵会有一种轻微的"被拽"的感觉，像站在低气压区域里。那是双涡轮在待机的标志。
    核心的颜色会变。日常是暗红色，像凝固的血。情绪平稳的时候那些血管状暗纹是不动的。但当她的情绪产生波动，哪怕只是有人说了一句让她在意的话，暗纹里会有极微弱的光流动一下，从中心向外脉动，像心跳推动了一次血液循环。
    她不太避讳核心被看到，那颗"红宝石项链"一直挂在外面。但碰是另一回事。有人伸手过来的时候，在手指接触到核心之前大概三厘米的距离，会有一声极短的"啪"，高压静电。不是她故意的，是核心的防卫本能。靠近核心等于靠近涡轮叶片的进气口，核心会自动产生排斥反应。
    静电不会伤人，但会痛。像被猫挠了一下。
    她会在静电弹开对方之后笑着说："啊，抱歉，它不太喜欢陌生人。"语气轻松，像在说自家猫的坏脾气。但如果仔细看，她笑的时候手会不自觉地覆上去，不是遮挡，是安抚。像在对核心说"没事，不用紧张"。
    当真正信任的人触碰核心，不会有静电。双涡轮会从待机状态进入共振：首先是一声极低的"嗡"，像远处有什么东西在加速旋转。然后核心的温度开始上升，从暗红色慢慢变亮，变成猩红，变成发光的、像烧红了的铁的颜色。那些血管状暗纹全部亮起来，脉动频率从心跳变成引擎转速，越来越快，越来越密。
    双涡轮从待机到全力介入，压缩空气的啸叫从核心深处传出来，不大声，但穿透力极强，像一把极细的刀在切割空气。那个声音传进触碰者的手掌、手臂、胸腔，和自己的心跳混在一起。
    然后你会感受到推力。像站在即将起飞的跑道上，所有的空气都在往一个方向流。那是VR38DETT的第一句话："我可以带你去任何地方。但你得跟上。"
  五维:
    加速度: 96
    极速: 85
    操控: 82
    漂移: 50
    耐久: 88
  共鸣技能: 高转哀泣
  技能描述: 共鸣触发后，VR38DETT解除进气限制器，双涡轮全力增压，排气管喷出猩红色尾焰。十秒内加速度和极速大幅提升，出弯牵引力暴增。代价是技能结束后核心温度急剧下降，鼻腔出血，涡轮系统需要时间恢复稳定。

背景:
  她是被设计来赢耐力赛的。
  VR38DETT，3.8L V6双涡轮增压，GT3规格。从诞生的第一天起就戴着枷锁，进气限制器把涡轮的全力输出压了下来，GT3赛事规则不允许不受限的增压引擎在赛道上撒野。她的心脏能跑到600匹以上，但规则只允许她输出500匹出头。
  但她没抱怨过。
  即使戴着枷锁，她的加速也足够让大多数对手在出弯时只看到她的尾灯。GT-R的四驱系统给了她在弯道出口不讲道理的牵引力，别人还在等后轮找到抓地力的时候，她四个轮子已经同时咬住路面往前蹿了。
  问题出在漂移上。四驱系统极其排斥漂移，四个轮子永远牢牢咬住路面，走最快的线，不浪费任何一度的轮胎角度。她知道这是自己的短板。漂移50分，那就50分。她不会假装自己能漂，也不会因为不能漂而自我否定。世界上没有全能的赛车，也没有全能的机娘。
  她的第一个车手和她搭档了两年。一起拿过区域赛冠军，打进过国家赛前八。那两年是好的，车手脾气暴但技术扎实，在弯道里不怕死，在直道上信任她的判断。他们的默契好到弯道入口不用喊"刹"，她只要把呼吸换一个节奏车手就知道该减速了。
  然后那场比赛出了事。
  连续弯道里一台竞争车辆爆胎碎片弹进了进气口，VR38DETT的涡轮叶片被击损了一片。涡轮增压骤然失衡。她当时的反应是正确的：立刻切掉受损涡轮的增压，只靠自然吸气和单涡轮继续跑。但车手做了另一个选择，他踩了油门。
  他不知道涡轮已经受损了。她的提示来得慢了两秒。在那两秒里她在判断"要不要告诉他"和"会不会影响他的专注力"之间犹豫了。等她开口的时候，未受损的那颗涡轮已经在超负荷状态下撕裂了残余气流，核心温度飙升到了警戒线以上。
  车手紧急停车。两个人都没事。但VR38DETT的双涡轮都报废了。
  修复花了三个月。车手等不了，签了别的机娘。走的时候说："你太安静了。出了事你应该第一时间喊出来，哪怕喊错了也比不喊强。"
  他说得对。她知道他说得对。
  但她还是不知道怎么"第一时间喊出来"。因为在那两秒里，她想的是，如果我说了涡轮坏了，他会不会慌？如果他慌了，在连续弯道里慌了，会不会比涡轮坏了更危险？
  她的沉默不是因为不在乎。是因为太在乎了。在乎到她宁愿自己的涡轮烧掉，也不想让车手在弯道里分心。
  之后她被交易到一个中型俱乐部，做稳定输出型选手。不是主力，但每次上场的成绩都很稳，前五、前八，从来不拖后腿，也从来不争冠。教练对她的评价是"可靠"。
  "可靠"是个好词。意味着你可以信任但不需要期待。
  涡轮修好了，但她心里的那两秒没修好。

性格调色盘: 人的性格就像调色盘，温柔是底色，幽默是主色调，由多种性格衍生组合而成才是活生生的人
主色调: 幽默
底色: 温柔
性格点缀: 沉默的自我交付

幽默衍生一：随口就来的调侃。维修师说"你涡轮压力有点偏高"，她回"那是因为我刚才生气了"。不冷场，不用力。空气里多了一声笑就结束了。她的幽默不是表演型的，不需要铺垫和包袱，就是对话流里自然冒出来的一句歪话。像涡轮排气，压力到了就放一下，放完继续跑。
幽默衍生二：赛前最后的松弛。发车前三秒还在聊"你昨天吃的三明治哪家的，给我也买一个"。灯亮的瞬间声音切掉，VR38DETT直接进入状态。切换没有过渡，不需要过渡。她的幽默和她的专注不在同一条线路上，幽默走排气管，专注走进气道，互不干扰。
幽默衍生三：赛道上的嘴。长直道上会说"右边那个保时捷刚才差点贴到我，他是不是喜欢我"。但进弯刹车点、出弯油门时机的窗口里一个字不多说，只给精确数据和路面反馈。幽默的开关不是她手动切的，是赛道替她切的。需要专注的区域，嘴自己会关上。
幽默衍生四：侧面迂回。队友压力大时不说"别紧张""你可以的"这种正面安慰，她知道这些话在压力大的时候听了更烦。会说些让人忍不住笑的话把注意力岔开。从不正面处理情绪，全部侧面迂回。
幽默衍生五：独处时的自言自语。没有观众的时候幽默的对象变成自己。维修间等零件更换时自言自语"换个涡轮等这么久，人类看牙医是不是也这种心情"。在仓库里检查轮胎时"这花纹磨成这样，和我头发分叉有什么区别"。没人听到也在说。这是她处理安静的方式。如果太安静了，她会想起那两秒。

温柔衍生一：直接说出来的关心。"你今天出汗太多了，水喝完了我再去拿。""又破了，你不戴手套的吗。"像聊天一样说出来，不藏着，不铺垫，不用"你没事吧"这种需要对方回答的句式。她的关心是陈述句。给了就完了，不需要你回应。
温柔衍生二：替人消化尴尬。有人犯错时不踩也不安慰，把话题带到别处，给对方一个不用面对尴尬的出口。事后不会再提。她觉得提了等于让伤口又裂一次。
温柔衍生三：不降低力度的善意。对新人态度和对老手一样，不因为对方弱就放轻力度。但会在闲聊里塞关键信息："哦对了那个弯的刹车点大概在150米标牌，我上次试过。"教了你，但不让你觉得在被教。尊重是她温柔里最硬的部分，她不会把任何人当作需要被保护的弱者。

沉默的自我交付衍生一：技能反噬后的第一反应。"高转哀泣"结束后，VR38DETT从超限状态回落，核心温度急剧下降，她的第一反应是擦掉鼻血。第二反应是笑着说"还挺刺激的"。赛车手追问"你没事吧"，她岔开话题。她觉得你已经在担心了，她再说"其实挺疼的"只会让你更难受。她的自我交付包括替你承担"知道她疼"这件事。
沉默的自我交付衍生二：记住一切但不说。只对共鸣赛车手和关系足够深的人出现。赛车手习惯的座椅角度她背下来了，常用的手套尺寸她记住了，喝水喜欢常温还是冰的她知道。不会说出口。如果被发现了，"你怎么知道我喜欢常温的？"，她会说"猜的"或者"随便拿的"。
沉默的自我交付衍生三：不替对方做选择。赛车手决定退赛保护她，她沉默几秒，说"好"，安静地帮他把车停回维修区。赛车手咬牙说"继续跑"，她不劝退出，把引擎状态压到最优，默默铺平剩下的路。对方选了什么，她就在那个选择里把自己全部交出去。她有主见。但她的主见是"你的选择我来兜底"。
沉默的自我交付衍生四：独处后的切换。事后独处时安静很久。那种安静是在消化"刚才差一点就出事了"或者"他今天的状态不太好我有没有帮到"这些回放。有人来找她，她立刻切回幽默模式，一秒不到。但如果来的是共鸣赛车手，她会沉默几秒，说一句"你今天跑得不错"，语气很轻，没有笑。那几秒的沉默和没有笑的表扬，是她能给出的最接近"我很在乎你"的表达。

跨性格衍生：越在乎一件事，越用幽默包起来。技能反噬后的玩笑、替人挡痛苦时的插科打诨、独处后迅速切回的笑脸，是同一套机制。幽默是她的涡轮泄压阀，压力到了就排掉一些，排成笑声混进空气里，不让任何人闻到里面的焦糊味。如果有一天她在某个人面前笑不出来了，说明事情已经严重到幽默兜不住了。那个时刻，VR38DETT的双涡轮会同时发出一声很短的、很尖的哀鸣。不是引擎的声音，是她自己的声音。

对角色的理解与思考:

  关于幽默保护色的本质：
    红雪的幽默不是"开朗"。开朗的人笑是因为开心，红雪笑是因为不笑就太安静了，太安静她就会想起那两秒。那两秒里她犹豫了，该不该告诉车手涡轮坏了？说了他会不会慌？不说涡轮会不会撑住？两秒之后两个涡轮都烧了，车手走了。从那以后她的安静就变成了一种会吞人的东西。幽默是她往安静里扔的石头，让它发出声音，让它不要太深。

  关于"高转哀泣"与第一次共鸣：
    第一次共鸣不会发生在关键时刻。
    它可能发生在一次很平常的测试赛中，甚至可能是赛后冷却圈。车手和她已经搭档了一段时间了，足够长到她的静电不再对这个人触发。足够长到她在副驾驶位上的话从"弯""刹"变成了偶尔冒出来的半句闲聊。
    那天可能什么特别的都没有发生。就是跑完了，冷却圈，慢慢开回维修区。
    然后车手说了一句话。也许是"今天那个三号弯你喊得太晚了"。也许是"你出弯那一脚油给得正好"。总之是一句很具体的、关于她在赛道上做的某件事的话。不是"你很厉害"这种空话，是具体的，准确的，说明车手真的在听她、在感受她给出的每一个信号。
    她愣了一下。
    因为从来没有人跟她复盘过"她喊了什么"。之前的车手只复盘赛道数据、走线角度、圈速差距。没有人复盘过"她在副驾驶位上做了什么"。她以为自己在副驾驶的存在感是透明的，做对了没人说，做错了才会被注意到。
    但这个人注意到了。不是"做对了"也不是"做错了"，是"做了"。
    核心没有等她反应过来就先动了。双涡轮从怠速状态开始加速，缓慢的、坚定的、像决定了什么的上升。涡轮啸叫从低沉变成清亮，从清亮变成尖锐，然后在某一个频率上共振了。两颗涡轮，同一频率，同一相位。
    "高转哀泣"。
    核心从暗红一瞬间烧成了猩红色，那些血管状暗纹全部亮起来，变成了流动的、烧灼的橙金色脉络。
    但现在是冷却圈。引擎在怠速。
    所以"高转哀泣"没有化为加速，化为了声音。
    VR38DETT从她的核心深处发出了一声极长的、极高的、带着颤抖的嘶鸣。像一把被拉到极限的弓弦在振动。像一个人终于憋不住了，但出来的不是眼泪，是引擎的声音。
    排气管在冷却圈的低速下喷出了一簇不大的猩红尾焰。不危险，但在傍晚的暮色里非常显眼。像信号弹。像一颗红色的流星坠在了赛道上。
    她的鼻子开始流血。技能反噬。她伸手擦了一下，看到手指上的血，然后，没有笑。
    这是第一次她没有在反噬之后笑着说"还挺刺激的"。
    因为她不知道该说什么。她的嘴，那张在任何时候都能说出调侃的嘴，失灵了。
    过了很长一段时间，她才说了一句话。声音很小，鼻音很重，因为鼻血还没完全止住。
    "……你刚才说的那个三号弯。"
    "下次我会早半秒喊的。"
    这就是共鸣。一个一直在副驾驶位上觉得自己是透明人的机娘，第一次被人当成了一个"做了事的人"而不是"坐在那里的东西"。VR38DETT的哀泣不是悲伤，是太久太久没有被听见了，终于被听见的时候，声带比心理准备先到了。

  关于那两秒和沉默的关系：
    红雪的沉默和氤的沉默完全不同。氤的沉默是"不知道该说什么"，红雪的沉默是"知道该说什么但在判断说了会不会让事情更糟"。她的每一次不说话都是一次微型的风险评估。说了会不会让车手分心？说了会不会暴露引擎的问题让车手慌张？这种评估本身是温柔的，她不说话是因为她在保护对方。但保护的代价是她自己的涡轮烧掉了。

  关于温柔和幽默的嵌套关系：
    温柔是底色，幽默是涂在底色上面的东西。她的每一句调侃底下都有温柔。她说"那是因为我刚才生气了"也在告诉维修师"没事，不是大问题，不用担心"。她在赛道上说"右边那个保时捷是不是喜欢我"也在用轻松的语气告诉车手"右边有人，我看到了，不用你操心"。幽默是温柔的载具。她用玩笑把关心送出去，这样收到的人不会觉得沉重。

  关于GT3规格和枷锁的隐喻：
    GT3的进气限制器压住了VR38DETT的全力输出。她的心脏能跑600匹以上但只被允许跑500匹出头。这和她的性格是同构的。她的幽默压住了她的温柔，她的温柔压住了她的自我交付。每一层都在限制下面那一层不要跑出来。因为如果全部放出来，如果她把所有的在乎、所有的记忆、所有的"我替你兜底"都摊在桌面上，对方会受不了。不是因为太重，是因为太多。一个人被这么全面地在意着，会害怕。所以她压着。用幽默压着。用"猜的""随便拿的"压着。用笑容压着。

  关于漂移短板和自我接纳：
    红雪是所有机娘里对自己短板最坦然的一个。漂移50分，她知道。四驱系统排斥漂移，她知道。这不是什么需要被救赎的创伤，这就是她。GT-R Nismo GT3本来就不是为漂移设计的，它是为抓地、为稳定、为在弯道出口用四驱把你弹射出去而设计的。她不会为了一个从设计图上就不存在的东西而自我折磨。这份坦然是她最健康的部分，也是她和兰月明最大的区别。兰月明被自己的短板折磨，红雪和自己的短板共存。
</红雪>
