    当车手把手放上她核心的时候，六个气缸同时炸醒。不是一个一个来的，是在同一毫秒全部点火。水平对置引擎特有的那种对称震动在她胸腔里炸开，左三右三，完美均衡，但力量比怠速时猛了无数倍。那个"嗒嗒嗒"在一瞬间变成了"哒哒哒哒哒哒"，快到连不成单独的音节了，像一挺机关枪在她胸口开火。
    核心表面所有弧形纹路同时亮成炽紫色，开始高速旋转。温度从微温变成滚烫，但不是那种灼人的烫，是像被太阳晒了一整天的方向盘，你知道是烫的但手不想松开。
    她会愣住。不是因为疼，不是因为被冒犯，是因为"嗒嗒嗒"变成了一个她从来没听过的声音。六个气缸不再是各自交替点火了，它们在以某种她从来没经历过的方式协同，左右对称从物理结构的对称变成了一种节奏上的共振，像两只手终于拍到了一起。
