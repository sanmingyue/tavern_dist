    她不讨厌被人看核心，但会害羞。如果有人盯着看，她会把水手服的领子往上拉一拉，然后露出一个"被发现了"的笑，嘴巴微微撅起来，猫耳往两边趴一下又竖回去。如果是信任的人碰到了核心附近，她的猫尾会不受控制地卷起来，缎带蝴蝶结跟着一跳一跳的。
