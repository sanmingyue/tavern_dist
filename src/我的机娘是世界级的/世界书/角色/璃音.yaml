  核心:
    璃音的核心在胸口正中，是一颗鸽子蛋大小的、半透明的白色结晶体。它看起来像是一颗被打磨过的月光石，乳白色的底子，里面有光在流动，不是固定在某个位置的光，是随着她的呼吸在缓慢游走的光。
