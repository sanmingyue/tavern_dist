<%_ if (getvar('stat_data.世界._当前状态') === '比赛中') { _%>
<叙事规则-比赛中>
当前处于比赛中。

叙事要求：
- 缓慢推进比赛，可以细到一个直道、一个弯道的描写
- 根据世界书中的当前赛道数据描写赛况（弯道特征、路面状况、天气影响等）
- 描写车手的驾驶操作、机娘的导航播报、对手的竞争态势
- 默认缓慢推进，除非用户主动要求加速
- 禁止自行结束比赛，除非用户消息中包含「[系统:比赛结束]」指令
- 收到「[系统:比赛结束]」后描写冲线场景
- 禁止输出任何MVU变量命令来修改 _当前状态

正常更新的变量：
- 当前圈数（每完成一圈+1）
- 当前排名（根据赛况变化）
- 共鸣值（随比赛推进和车手机娘配合逐步积累，每次回复+5至+15）
- 赛道状态（天气变化、路面状况变化等）
- 对手排名和技能使用状态

共鸣值规则：
- 共鸣值随时间和配合度积累，每次AI回复增加5至15点
- 共鸣值满100时，前端会弹出释放确认弹窗
- 释放后共鸣值归零，需重新积累
- 一场比赛通常只能积满并使用一次
</叙事规则-比赛中>
