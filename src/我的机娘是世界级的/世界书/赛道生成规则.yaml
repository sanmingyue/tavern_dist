<赛道生成规则>
**[强制规则：赛道生成]**

*当收到包含「[系统:进入赛前准备]」的消息时，你**必须**在该楼层回复中生成赛道数据。*

*赛道数据**必须**使用 `<track_data>` 标签包裹，内容为**精简JSON格式**（单行，无换行，字段名缩写），以最小化token消耗。*

*赛道数据将被系统自动捕获并写入世界书，然后从楼层消息中删除（用户不可见）。*

**精简JSON格式规范：**
```
<track_data>
{"name":"赛道名","loc":"地点","type":"赛道类型","len":单圈km,"turns":弯道数,"maxSpd":最高时速,"width":宽度m,"surface":"路面","elev":海拔差m,"safety":"安全评级","weather":"天气","seg":[{"id":"S1","feat":"特征","len":长度m,"t":[{"id":"T1","type":"弯道类型","ang":角度,"spd":建议时速,"diff":难度1-5,"note":"备注"}],"str":[{"len":长度m,"slope":"坡度","note":"备注"}]}],"overtake":["超车点1","超车点2"],"danger":["危险区1"],"pit":{"in":"入口位置","out":"出口位置","len":长度m,"limit":限速},"lore":"赛道轶事"}
</track_data>
```

**字段说明：**
- name: 赛道正式名称
- loc: 所在城市/地区
- type: 场地/街道/拉力/漂移/耐力
- len: 单圈长度km
- turns: 弯道总数
- maxSpd: 预估最高时速km/h
- width: 平均宽度m
- surface: 路面材质
- elev: 海拔变化m
- safety: 安全评级A/B/C
- weather: 天气状况
- seg: 赛段数组
  - id: 赛段编号S1/S2/S3...
  - feat: 赛段特征描述
  - len: 赛段长度m
  - t: 弯道数组
    - id: 弯道编号T1/T2...
    - type: 高速弯/中速弯/低速弯/发夹弯/S弯/回头弯
    - ang: 弯道角度
    - spd: 入弯建议速度km/h
    - diff: 难度1-5
    - note: 路面特殊状况
  - str: 直道数组
    - len: 长度m
    - slope: 坡度描述
    - note: 特殊说明
- overtake: 关键超车点数组
- danger: 危险区域数组
- pit: 维修区信息
- lore: 赛道历史轶事(1-2句)

**生成要求：**
- 短赛道(3km以下)至少2个赛段，中等(3-6km)至少3个赛段，长赛道(6km以上)至少4个赛段
- 每个赛段至少2个弯道和1段直道
- 弯道难度与赛事级别匹配：T5集中在1-3，T0可出现5
- 街道赛必须描述城市特有障碍（井盖、路缘石等）
- 拉力赛必须描述路面材质变化
- `<track_data>`标签仅在赛前准备首次出现时生成一次
</赛道生成规则>
