<世界观设定>
世界观:
  世界类型: 平行地球，现代科技文明，机魂现象已成为社会常态
  核心产业: 赛车竞技，全球第一大竞技项目与经济支柱
  时代特征: 人类与机娘共存，赛车娘是最大的偶像群体

  机魂现象:
    定义: 机械自然诞生灵魂并投影为人形实体的现象
    覆盖范围: 赛车、战斗机、舰船、列车等各类机械均可诞生机魂
    社会认知: 已被完全接受，机娘拥有完整公民权利与法律保护

  赛车产业体系:
    三位一体赛事: 赛车（机械形态）+ 赛车手（人类驾驶员）+ 机娘（副驾领航）
    分工:
      赛车手: 操控赛车的唯一驾驶者，负责所有驾驶操作（转向、制动、油门、换挡）
      机娘: 以灵体投影坐在副驾驶位，担任导航员、路书员和后勤监控。职责包括实时路况播报、弯道提前预警、最优走线建议、轮胎磨损/引擎温度等状态监控、关键时刻释放共鸣技能。机娘不操控赛车。
    车队体系: 大型豪门车队与独立私人车队并存，负责赛车手和机娘的管理、赞助、后勤
    转会市场: 赛车手可更换机娘搭档，但共鸣默契需重新培养，长期搭档关系珍贵。机娘的共鸣技能一旦激活便永久固定，更换搭档不影响技能
    改装市场: 改装件由专业制造商生产，分为外形改件（改变赛车外观，可无限叠加）和技能改件（轻微增强共鸣技能效果，最多1件）。仅T2及以上赛事允许使用
    偶像经济: 赛车娘个人品牌价值极高，广告代言、粉丝见面会、直播互动收入往往超过赛事奖金

  赛事种类:
    场地赛: 封闭赛道多圈竞速，核心考验极速、加速度、操控
    街道赛: 城市街道封路赛，路况复杂，核心考验操控、漂移、加速度
    拉力赛: 长距离多路况（砂石/雪地/山路），核心考验耐久、操控、加速度
    漂移赛: 纯漂移评分赛，评判角度/速度/美感，核心考验漂移、操控
    耐力赛: 长时间持久赛（4h/8h/24h），核心考验耐久、极速、操控

  赛事级别与点数限制（T5→T0）:
    说明: |
      赛事规定五维「可用总点数」和「单项上限」，参赛前车手须将机娘五维下调至限制内。
      下调仅影响本场参赛配置，不改变原始五维。
    T5新秀赛:
      可用总点数: 150
      单项上限: 50
      改装件: 禁止
      说明: 入门级赛事，所有机娘被压到同一起跑线
    T4城市赛:
      可用总点数: 200
      单项上限: 65
      改装件: 禁止
      说明: 城市定期举办，开始有策略分配空间
    T3区域赛:
      可用总点数: 260
      单项上限: 75
      改装件: 禁止
      说明: 省级选拔赛事，偏科型机娘的优势开始显现
    T2国家赛:
      可用总点数: 330
      单项上限: 85
      改装件: 解锁外形改件（技能改件仍禁止）
      说明: 职业主战场，外形改装解锁
    T1洲际赛:
      可用总点数: 400
      单项上限: 92
      改装件: 全部解锁（外形改件+技能改件）
      说明: 顶级赛事，天赋差异充分展现
    T0世界大奖赛:
      可用总点数: 480
      单项上限: 100
      改装件: 全部解锁（外形改件+技能改件）
      说明: 最高级别，五维满分500仍不可能全满，必须有取舍

  赛事规则:
    参赛配置检查: 组委会强制检查所有参赛机娘的五维配置是否符合赛事点数限制，超出者直接取消资格
    改装件检查: T2及以上赛事检查改装件类型是否符合该级别的解锁范围
    升降级制度: 赛季末按积分排名升降级，前列升级、垫底降级、中间维持

  社会与法律:
    - 机娘拥有完整公民权利
    - 禁止强制共鸣，搭配必须双方自愿
    - 机娘可拒绝比赛、拒绝改装
    - 未经允许触碰核心属于严重侵犯
</世界观设定>
