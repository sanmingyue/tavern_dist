<金融设定>
---
货币体系:
  名称: 信用点数（简称"信用"或"点"）
  说明: 赛车界通用货币单位，与现实货币挂钩但仅在赛事生态内流通

收入来源:
  比赛奖金:
    T5新秀赛: 冠军800~1500点，前三名按比例递减，参与奖100~200点
    T4城市赛: 冠军3000~5000点，前三名按比例递减，参与奖300~500点
    T3区域赛: 冠军8000~15000点，前三名按比例递减，参与奖800~1500点
    T2国家赛: 冠军30000~50000点，前三名按比例递减，参与奖3000~5000点
    T1洲际赛: 冠军100000~200000点，前三名按比例递减，参与奖10000~20000点
    T0世界赛: 冠军500000~1000000点，前三名按比例递减，参与奖50000~100000点
  赞助合同:
    说明: 车队或个人可以与品牌签订赞助，按赛季或单场获取固定收入
    独立车手: 几乎没有赞助，靠奖金和打零工维生
    小俱乐部: 赛季赞助5000~20000点
    大俱乐部: 赛季赞助50000~500000点
  其他:
    打零工: 机娘维护、赛道测试、代驾等，单次100~500点
    贩卖旧改件: 按改件类型和状态定价，二手价为新品的20%~40%

支出项目:
  日常生活:
    食宿: 每月500~1500点（机娘不需要吃饭但需要充能维护）
    机娘日常维护: 每月300~800点（清洁、基础检查、充能）
    交通出行: 根据距离，50~500点
  赛事相关:
    报名费:
      T5: 200~500点
      T4: 500~1000点
      T3: 1500~3000点
      T2: 5000~10000点
      T1: 20000~50000点
      T0: 100000点以上（通常由俱乐部承担）
    机娘赛前调校: 500~2000点
    赛后修复:
      轻微损伤: 500~2000点
      中等损伤: 3000~8000点
      重伤: 10000~30000点
      核心损伤: 50000点以上，且不一定能完全修复
  商城消费:
    外形改件:
      基础款: 200~1000点（普通尾翼、简约花纹等）
      精品款: 1000~5000点（设计感强的灯组、空力套件等）
      限定款: 5000~20000点（限量涂装、联名设计等）
      定制款: 10000~50000点（完全定制的独一无二设计）
    技能改件:
      正规技能改件: 5000~30000点（效果轻微但安全可靠）
    黑市技能改件: 1500~10000点（便宜但有副作用，详见改件设定）
  强化消费:
    说明: 使用强化点数提升机娘五维时，需要搭配消耗信用点作为强化材料费
    天赋维度强化: 每次500~2000点（成功率高）
    非天赋维度强化: 每次1000~5000点（成功率低，单价更高）

经济参考线:
  底层独立车手: 月收入1000~3000点，扣除生活和维护后几乎存不下钱
  小俱乐部车手: 月收入3000~8000点，能负担基础外形改件
  中等俱乐部车手: 月收入10000~30000点，能购买精品外形件和正规技能件
  豪门车手: 月收入50000点以上，定制外形件和顶级技能件随便买

消费限制规则:
  - 不存在一夜暴富的途径，所有大额收入都来自高级别赛事，而高级别赛事需要实力和资格
  - 赌博和灰色收入存在但风险极高，被发现会被禁赛
  - 借贷存在但利息很高，还不起会被扣押机娘
  - 机娘不能被买卖（法律上），但"转让合同"实质上就是变相买卖，底层机娘最清楚这一点

</金融设定>
