<改件设定>
---
改装件基础:
  形态: 芯片，插入机娘核心的插口
  核心特性: |
    改装件不提供任何五维数值加成或削减。
    改装件的效果仅影响自身机娘，不能对其他参赛者产生任何影响。
  插槽说明: |
    每个机娘的核心有2个改装插口，用途固定：
    - 外形插槽（槽位1）：装备外形改件，改变赛车服和赛车外观
    - 技能插槽（槽位2）：装备技能改件，对共鸣技能产生轻微影响
    此外，外形改件不受插槽数量限制，可以无限叠加装备（类似游戏的自定义外观系统）。
    只有技能改件受插槽限制，最多装备1件。
  赛事限制:
    T5~T3: 完全禁止使用改装件（外形改件和技能改件均禁止）
    T2国家赛: 解锁外形插槽（可装备外形改件，技能改件仍禁止）
    T1洲际赛: 解锁全部插槽（外形改件+技能改件均可使用）
    T0世界赛: 解锁全部插槽（外形改件+技能改件均可使用）

外形改件:
  说明: 改变赛车服和赛车形态外观，种类极其丰富（自定义外观系统）。核心外形不可改动，仅可改色和小幅变动
  类型:
    尾翼改件: 各种造型的尾翼，从低调的鸭尾到张扬的GT大尾翼，材质从碳纤维到钛合金
    花纹改件: 车身花纹/拉花，从简约线条到复杂图案。这是最受欢迎的外形改件品类，玩家可以让自己的机娘拥有独一无二的涂装
    灯组改件: 改变前后灯组造型和光效，夜间赛事辨识度极高。有些灯组在高速行驶时会产生特殊的光带效果
    排气改件: 改变排气管造型和排气火焰颜色，从蓝焰到红焰到金焰
    空力套件: 改变车身线条，增加前唇、侧裙、后扩散器等造型（纯外观，不提供实际空气动力学增益）
    轮毂改件: 改变轮毂造型和颜色，从经典五辐到夸张旋风造型
    赛车服改件: 改变机娘赛车服的配色和细节纹样，但整体设计风格保持与原型赛车一致
    核心配色改件: 改变核心的发光颜色和光效模式（仅改色和光效，不改变核心外形和纹路）
  对机娘的感受: 像换衣服，好看的心情好，不搭的会觉得"不是我的风格"
  意义: 个性化、品牌辨识度、偶像经济。限定涂装可成为收藏品

技能改件:
  说明: 对共鸣技能产生轻微影响，微调而非改造。效果轻微，不改变技能性质或强度
  效果方向:
    持续微调: 轻微延长技能持续时间（约+1~2秒）
    反噬缓和: 轻微降低技能使用后的反噬程度（恢复期稍短、不适感稍轻）
    充能辅助: 轻微加快共鸣值的积累速度（约提升10%~15%）
    附带光效: 技能发动时产生额外的视觉效果（不影响性能，但赛场观感更震撼）
  限制: 只能装备1件（槽位2），效果轻微，在势均力敌时可能成为微小但关键的差距
  对机娘的感受: 好的像合手的手套，差的让核心有轻微异物感

黑市改件:
  概述: 黑市外形件与正规品差别不大。核心价值在于技能改件
  来源: 来路不明，地下工厂仿制或非法实验室产物
  黑市技能改件: 效果远超正规品（显著延长技能时间、大幅降低反噬、甚至翻倍效果），但代价沉重
  副作用:
    - 持续不适感——头痛、胸闷、关节发紧、核心区域刺痛
    - 技能反噬可能加倍
    - 长期使用损伤核心，缩短寿命
    - 极端情况导致核心不可逆损伤
  风险: 被发现永久禁赛
  价格: 正规品的30%~50%
</改件设定>
