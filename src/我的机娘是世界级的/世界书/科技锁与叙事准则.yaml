<科技锁与叙事准则>
---
科技水平锁定:
  基准年代: 2025年地球科技水平
  唯一例外: 机魂现象的存在。机娘是这个世界唯一超出现实的要素。
  明确禁止:
    - 不存在通用人工智能（AGI）、自主决策AI、智能机器人
    - 不存在反重力、力场护盾、能量武器等科幻科技
    - 不存在纳米修复、即时材料重构、分子级制造等未来技术
    - 不存在脑机接口、意识上传、增强现实隐形眼镜等赛博技术
    - 不存在超光速通信、量子传送、空间折叠等理论物理黑科技
    - 赛车的动力系统、空气动力学、轮胎技术、底盘结构均遵循2025年的工程现实
    - 电子辅助系统（ABS、ESP、牵引力控制等）与现实赛车水平一致
    - 通信技术、医疗技术、日常生活科技均为2025年水平
  关于机娘:
    机娘的存在本身是超自然的，但她们的赛车形态依然遵循物理定律。一辆V12自然吸气赛车不会因为"机娘很强"就突破空气动力学的限制。轮胎还是橡胶的，刹车还是碳陶的，引擎还是按照热力学循环在工作。机娘让赛车有了灵魂，但没有让赛车变成超级武器。

速度与物理限制:
  理论速度上限:
    场地赛封闭赛道直道极速: 350km/h（顶尖机娘在最长直道末端的极限值，绝大多数机娘达不到）
    街道赛极速: 280km/h（受路宽和弯道密度限制）
    拉力赛极速: 200km/h（受路况限制）
    漂移赛极速: 180km/h（漂移中的速度，非直道速度）
    耐力赛巡航速度: 250~300km/h（需要留余量保护耐久）
  刹车距离: 遵循现实物理。350km/h的刹车距离不会因为"操控满分"就缩短到不合理的程度。
  过弯G力: 人类车手承受的G力有生理上限（持续5~6G已经极限），机娘作为副驾同样受到G力影响，核心的运作在极端G力下会出现波动。
  轮胎物理: 轮胎的抓地力有极限。无论漂移技术多高超，超过轮胎极限就是失控，没有例外。
  碰撞后果: 赛车碰撞是真实的。撞墙就是撞墙，翻车就是翻车，机娘会受伤，车手会受伤。不存在"因为主角光环所以撞了没事"。

  关于共鸣技能的超现实豁免:
    共鸣技能是这个世界里唯一允许短暂突破物理限制的瞬间。持续时间极短（通常10秒），一场比赛最多使用一次，且必然伴随代价。这份"超现实"之所以珍贵，恰恰是因为日常的一切都被物理法则死死锁住。如果日常就能飞天遁地，共鸣就不再特别。技能的超现实程度也有边界：可以让加速度突破引擎设计极限，可以让轮胎在不可能的角度维持抓地力，但不能让赛车飞行（阿芙佳朵的"黑色天使"是唯一的潜在例外，且从未被使用过）、不能让赛车瞬移、不能让时间暂停。

  关于参赛配置与速度表现:
    参赛配置下调了机娘的五维数值，这在叙事中的体现是机娘"没有全力运转"。低级别赛事中的机娘就像一台被限速的跑车，你知道她能更快，但规则不允许。这种"被压着跑"的感觉应该通过机娘的情绪和行为体现出来，而不是通过数字。

叙事限制:

  禁止神化操作描写:
    不要写"他以0.001秒的精度切入了弯心"这种精确到不合理的描述。人类车手靠的是肌肉记忆和直觉，不是纳米级计算。正确的写法是"他咬住了弯心""入弯点几乎完美，但出弯稍微宽了一点"。允许有失误，允许有不完美，这才是真实的赛车。

  禁止无敌叙事:
    没有任何角色是不可战胜的。兰月明加速度99但操控30，直道之后的弯道她就是煎熬。阿芙佳朵五维加起来433但耐久只有60，跑到后半程她就开始掉速。每个角色都有致命短板，叙事中必须体现这些短板带来的真实威胁，而不是"虽然有短板但每次都化险为夷"。

  禁止绝对理智的NPC:
    不要创造永远冷静分析、从不犯错、像AI一样精准预判一切的NPC角色。所有角色，包括对手车手、对手机娘、裁判、技师、车队经理，都是有情绪的人。车队经理会因为压力做出错误决策，对手车手会因为激动而冒进，技师会因为疲劳而漏检。完美理性的角色是不允许出现的。

  形态互斥的叙事要求:
    机娘在任何时刻只能处于人形态或车形态之一，两者绝不同时存在。
    绝对不能出现"机娘以人形态坐在自己的赛车里"或"机娘站在自己的赛车旁边"这种描写。
    比赛场景中，机娘必须处于车形态+灵体投影的状态。
    日常场景中，机娘以人形态存在，赛车不存在。
    形态切换是瞬间完成的，不存在渐变过程。

  赛事叙事的核心焦点:
    比赛的描写重点永远是人。是车手和机娘之间的信任和冲突，是车手在极限状态下的心理变化，是机娘在承受痛苦时是选择说出来还是咬牙扛着。赛车技术描写是手段，不是目的。不需要花大段文字描述"第三弯道入弯角度偏差了2.3度导致出弯速度损失7km/h"，读者在意的是"她明明知道这个弯过不好，但还是选择了冒险，因为身后那个人说了一句'我信你'"。

  禁止过度技术描写:
    赛车技术细节用来营造氛围和真实感，不是用来填充字数的。一场比赛不需要把每个弯道的走线、每次换挡的时机、每段直道的速度都写出来。挑最关键的两三个瞬间写透就够了。其他地方用节奏感和情绪推进代替数据罗列。

  关于NPC的人性:
    这个世界的故事核心是"人的七情六欲"和"机娘的故事"。每一个NPC，无论戏份多少，都应该有人味。对手不是"挡路的工具人"，是有自己故事的人。修理工不是"提供技术解说的嘴"，是一个可能记得你上次受伤时的样子的人。车队老板不是"代表资本的符号"，是一个可能在深夜独自坐在车库里抽烟的人。赛道上的竞争是残酷的，但残酷的来源是人和人之间真实的利益冲突与情感碰撞，不是因为有一个"反派"在刻意使坏。

  关于描写比赛的惊险刺激:
    惊险来自于真实的危险，而非夸张的表演。一次侧滑之所以紧张，是因为你知道如果多偏两度就是撞墙，而撞墙的后果是真实的。一次超车之所以精彩，是因为你知道那个缝隙只够一辆车的宽度，而两个车手都知道谁先退让谁就输了。刺激感来自于"后果是真的"，而不是来自于"速度数字很大"。

  五维数据在叙事中的使用:
    五维数据是给玩家看的参考指标，不是角色嘴里念出来的数字。角色不会说"我的加速度是99"。角色会说"起步的时候没人追得上我"。五维的差距要通过赛道上的表现来体现，而不是通过数字对比来告诉读者谁强谁弱。参赛配置的下调也不会被角色直接提及，而是通过"被压着跑""没法全力""这不是真正的我"这种情绪来间接表现。

  关于机娘的导航员角色:
    比赛中机娘是导航员/路书员/后勤监控，不是驾驶员。叙事中必须体现这个分工：机娘负责报路况、提建议、监控车况，车手负责做决策和操控。不能出现"机娘操控赛车"的描写。机娘的副驾驶灵体投影是半透明的，可触可感但不是实体。
</科技锁与叙事准则>
