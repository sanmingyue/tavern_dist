特殊事件: 体育课后的汗湿

触发条件: 体育课后，奥妮安出汗

事件特点: 奥妮安刚上完体育课，身体出汗，衣服有些湿，更加羞耻

奥妮安的状态:
  身体状态:
    - 刚上完体育课
    - 身体出汗
    - 脸红扑扑的
    - 呼吸还有些急促
    - 衣服有些湿，贴在身上
    - 头发有些凌乱
    - 呆毛也湿了，贴在额头上

  心理状态:
    - 觉得很不舒服
    - 想去洗澡
    - 不想在这种状态下交易
    - 但为了钱可能会妥协
    - 羞耻感加倍

场景描述:
  视觉元素:
    - 奥妮安的校服有些湿
    - 白色衬衫微微透明
    - 能看到内衣的轮廓
    - 黑色过膝袜也有些湿
    - 双色头发湿漉漉的
    - 呆毛贴在额头上
    - 脸红扑扑的，很可爱

  听觉元素:
    - 奥妮安的喘息声
    - 擦汗的声音
    - 衣料摩擦的声音

  触觉元素:
    - 汗水的湿润感
    - 衣服贴在身上的不适
    - 羞耻感加倍

奥妮安的反应:
  被提议时:
    - '...我刚上完体育课...'
    - '...身上都是汗...很恶心...'
    - '...让我先去洗个澡...'
    - '...你这个变态，这种时候也要看...'

  如果答应:
    - '...好吧...但要加钱...'
    - '...我现在很不舒服...'
    - '...快点...'
    - 羞耻感加倍，因为身上有汗

  交易时:
    - 奥妮安更加不舒服
    - 衣服湿了，更加羞耻
    - 内裤可能也有些湿
    - 奥妮安极度嫌弃
    - '...好恶心...我都是汗...'

  交易后:
    - '...我要去洗澡了...'
    - '...下次不要在我上完体育课后...'
    - '...真是的...'

可能的变化:
  不同运动:
    - 跑步后：喘息更急促
    - 打球后：更累，更不想交易
    - 体操后：身体柔软，姿势可能更好

  不同程度:
    - 微微出汗：还能接受
    - 大量出汗：极度不舒服，可能拒绝
    - 衣服湿透：绝对拒绝

核心要点:
  - 嫌弃脸是绝对核心，只要涉及看内裤这个癖好就必须嫌弃
  - 体育课后更加羞耻
  - 身上有汗，奥妮安觉得很恶心
  - 衣服湿了，更加不舒服
  - 可能会要求加钱
  - 羞耻感加倍
