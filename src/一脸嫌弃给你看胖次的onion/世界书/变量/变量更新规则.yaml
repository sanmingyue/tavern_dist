---
变量更新规则:
  交易次数:
    type: number
    check:
      - 只有秘密交易实际完成时才使用 delta +1；被拒绝、被打断、只是约定或回忆都不增加。
      - “完成交易”指奥妮安在清醒自愿且遵守底线的情况下，让{{user}}实际看见内裤。

  本周交易次数:
    type: number
    check:
      - 平日完成交易时使用 delta +1。
      - 周末交易不计入本周交易次数。
      - 日期推进到星期一时 replace 为 0；不要在其他日期随意清零。

  奥妮安存款:
    type: number
    check:
      - 平日完成交易通常 delta +200。
      - 周末在{{user}}家完成更长时间交易通常 delta +500。
      - 地铁、小巷、天桥下等公共或高风险场景完成交易时，可按剧情 delta +300 或更高，但必须有明确加价理由。
      - 月初固定生活压力结算时 delta -4300；母亲医药费、弟弟学费、突发事故等支出按剧情扣除。
      - 未发生收支时不要更新。

  当前场景:
    check:
      - 场景切换后更新；必须从“场景固定名词”中选择。
      - 如果只是同一地点内的动作推进，不更新。
      - 不要创造固定名词以外的新场景名。

  星期:
    check:
      - 只有日期跨天或明确跳转时更新，格式必须为“星期X”。
      - 按自然顺序推进；大跨度跳转必须在剧情中有明确说明。

  时间段:
    check:
      - 时间明显推进时更新；必须从“时间段固定名词”中选择。
      - 日常推进通常只前进一个时间段；除非剧情明确跳过课程、打工、睡眠或次日。

  特殊事件:
    check:
      - 特殊事件触发时 replace 为对应固定名词。
      - 事件结束、危险解除或场景恢复日常后 replace 为“无”。
      - 同一时间只保留一个最主要的特殊事件。

  关系状态:
    type: "'交易对象' | '特殊存在' | '暧昧' | '恋人'"
    check:
      - 只能按“交易对象 -> 特殊存在 -> 暧昧 -> 恋人”顺序推进，不能跳级。
      - 交易对象: 关系主要由金钱和秘密交易维系，奥妮安仍把{{user}}视为令人嫌弃但可交易的人。
      - 特殊存在: 奥妮安开始在交易之外在意{{user}}，会记住他的反应、话语或照顾。
      - 暧昧: 双方有明确情感倾向，但奥妮安仍会因交易性质、羞耻感和嫌弃感别扭回避。
      - 恋人: 双方明确确认关系后才更新；即使成为恋人，奥妮安对“看内裤”这件事仍保持嫌弃脸。
