<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>状态栏外壳草稿</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18211f;
      --muted: #62706b;
      --line: rgba(31, 45, 42, 0.13);
      --panel: #f7f5ef;
      --panel-2: #ece9df;
      --cold: #325c9d;
      --sky: #4eb9e7;
      --soft: #f5b7c9;
      --hot: #bd2d3a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.74), rgba(229, 232, 225, 0.82)),
        #e9e5dc;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    .demo-page {
      width: min(980px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 28px 0;
    }

    .demo-controls {
      display: grid;
      grid-template-columns: minmax(160px, 1fr) minmax(160px, 1fr) 170px;
      gap: 10px;
      margin-bottom: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.58);
      padding: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
    }

    input {
      width: 100%;
      min-width: 0;
      height: 34px;
      border: 1px solid rgba(31, 45, 42, 0.16);
      border-radius: 6px;
      background: #fffefa;
      color: var(--ink);
      padding: 0 9px;
      font: inherit;
      outline: none;
    }

    input[type="range"] {
      padding: 0;
      accent-color: #4eb9e7;
    }

    .status-wrap {
      width: 100%;
    }

    .qz-status-shell {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: 1fr;
      align-items: stretch;
      min-height: 108px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.56);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(247, 245, 239, 0.96), rgba(230, 236, 232, 0.96)),
        #f1eee7;
      box-shadow: 0 16px 38px rgba(21, 29, 27, 0.13);
    }

    .qz-status-shell.has-avatar {
      grid-template-columns: auto 1fr;
    }

    .qz-status-shell.has-bg {
      color: #fff;
      background-image:
        linear-gradient(90deg, rgba(9, 14, 18, 0.74), rgba(9, 14, 18, 0.54) 48%, rgba(9, 14, 18, 0.26)),
        var(--status-bg);
      background-size: cover;
      background-position: center;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .qz-status-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.12), transparent 34%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.16), transparent 52%);
    }

    .qz-avatar {
      display: none;
      width: 104px;
      min-height: 108px;
      padding: 12px 0 12px 12px;
    }

    .qz-status-shell.has-avatar .qz-avatar {
      display: block;
    }

    .qz-avatar-frame {
      width: 80px;
      height: 80px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.68);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.18);
      box-shadow: 0 10px 24px rgba(18, 26, 24, 0.18);
    }

    .qz-avatar-frame img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .qz-status-body {
      display: grid;
      align-content: center;
      gap: 12px;
      min-width: 0;
      padding: 15px 18px;
    }

    .qz-status-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      min-width: 0;
    }

    .qz-title-group {
      min-width: 0;
    }

    .qz-kicker {
      margin: 0 0 3px;
      color: color-mix(in srgb, currentColor 58%, transparent);
      font-size: 11px;
      letter-spacing: 0;
    }

    .qz-name {
      margin: 0;
      overflow: hidden;
      color: currentColor;
      font-size: 20px;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .qz-scene {
      display: grid;
      gap: 3px;
      min-width: 112px;
      color: color-mix(in srgb, currentColor 68%, transparent);
      font-size: 12px;
      text-align: right;
    }

    .qz-affection {
      display: grid;
      grid-template-columns: 78px minmax(120px, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .qz-heartline {
      display: block;
      width: 78px;
      height: 28px;
      color: color-mix(in srgb, var(--affection-color, #4eb9e7) 88%, currentColor);
      filter: drop-shadow(0 2px 7px color-mix(in srgb, var(--affection-color, #4eb9e7) 44%, transparent));
    }

    .qz-progress {
      position: relative;
      min-width: 0;
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.28);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28);
    }

    .qz-status-shell:not(.has-bg) .qz-progress {
      background: rgba(33, 45, 42, 0.09);
      box-shadow: inset 0 0 0 1px rgba(31, 45, 42, 0.1);
    }

    .qz-progress-fill {
      position: relative;
      display: block;
      width: calc(var(--affection, 0) * 1%);
      height: 100%;
      overflow: hidden;
      border-radius: inherit;
      background: transparent;
      box-shadow: 0 0 16px color-mix(in srgb, var(--affection-color, #4eb9e7) 38%, transparent);
      transition: width 0.24s ease;
    }

    .qz-progress-fill::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--gradient-width, 100%);
      min-width: 100%;
      border-radius: inherit;
      background:
        linear-gradient(90deg, var(--cold) 0%, var(--sky) 40%, var(--soft) 72%, var(--hot) 100%);
    }

    .qz-affection-value {
      min-width: 46px;
      color: var(--affection-color, #4eb9e7);
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
      text-align: right;
      text-shadow: 0 6px 18px color-mix(in srgb, var(--affection-color, #4eb9e7) 24%, transparent);
    }

    .qz-affection-value small {
      margin-left: 1px;
      color: color-mix(in srgb, currentColor 66%, transparent);
      font-size: 12px;
      font-weight: 500;
    }

    .qz-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: color-mix(in srgb, currentColor 58%, transparent);
      font-size: 12px;
    }

    @media (max-width: 720px) {
      .demo-page {
        width: min(100vw - 18px, 980px);
        padding: 14px 0;
      }

      .demo-controls {
        grid-template-columns: 1fr;
      }

      .qz-status-shell {
        min-height: 96px;
      }

      .qz-avatar {
        width: 84px;
        min-height: 96px;
        padding: 10px 0 10px 10px;
      }

      .qz-avatar-frame {
        width: 64px;
        height: 64px;
      }

      .qz-status-body {
        padding: 12px;
      }

      .qz-scene {
        display: none;
      }

      .qz-affection {
        grid-template-columns: 58px minmax(88px, 1fr) auto;
        gap: 8px;
      }

      .qz-heartline {
        width: 58px;
      }

      .qz-name {
        font-size: 18px;
      }

      .qz-affection-value {
        font-size: 21px;
      }
    }

    @media (max-width: 420px) {
      .qz-status-shell {
        grid-template-columns: 1fr;
      }

      .qz-avatar {
        width: auto;
        min-height: 0;
        padding: 10px 12px 0;
      }

      .qz-avatar-frame {
        width: 58px;
        height: 58px;
      }

      .qz-foot {
        display: block;
      }

    }
  </style>
</head>
<body>
  <main class="demo-page">
    <section class="demo-controls" aria-label="状态栏预览接口">
      <label>
        头像 URL
        <input id="avatarInput" type="url" placeholder="https://...">
      </label>
      <label>
        背景 URL
        <input id="bgInput" type="url" placeholder="https://...">
      </label>
      <label>
        好感度
        <input id="affectionInput" type="range" min="0" max="100" value="62">
      </label>
    </section>

    <section class="status-wrap">
      <article id="statusShell" class="qz-status-shell no-assets" style="--affection: 62; --gradient-width: 161.29%; --affection-color: #ee9db5;">
        <aside class="qz-avatar" aria-hidden="true">
          <div class="qz-avatar-frame">
            <img id="avatarImage" alt="">
          </div>
        </aside>

        <div class="qz-status-body">
          <div class="qz-status-top">
            <div class="qz-title-group">
              <p class="qz-kicker">CURRENT STATUS</p>
              <h1 class="qz-name">角色状态</h1>
            </div>
            <div class="qz-scene">
              <span>开局</span>
              <span>待定</span>
            </div>
          </div>

          <div class="qz-affection">
            <svg class="qz-heartline" viewBox="0 0 120 40" role="img" aria-label="好感度">
              <path d="M4 22 H22 L31 8 L42 33 L55 16 L66 22 H84" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div class="qz-progress" aria-hidden="true">
              <span class="qz-progress-fill"></span>
            </div>
            <strong class="qz-affection-value"><span id="affectionValue">62</span></strong>
          </div>

          <div class="qz-foot">
            <span>好感度</span>
          </div>
        </div>
      </article>
    </section>
  </main>

  <script>
    const shell = document.querySelector('#statusShell');
    const avatarInput = document.querySelector('#avatarInput');
    const bgInput = document.querySelector('#bgInput');
    const avatarImage = document.querySelector('#avatarImage');
    const affectionInput = document.querySelector('#affectionInput');
    const affectionValue = document.querySelector('#affectionValue');

    function affectionColor(value) {
      if (value <= 33) return '#325c9d';
      if (value <= 58) return '#4eb9e7';
      if (value <= 82) return '#f5b7c9';
      return '#bd2d3a';
    }

    function updateAssets() {
      const avatarUrl = avatarInput.value.trim();
      const bgUrl = bgInput.value.trim();
      shell.classList.toggle('has-avatar', Boolean(avatarUrl));
      shell.classList.toggle('has-bg', Boolean(bgUrl));
      shell.classList.toggle('no-assets', !avatarUrl && !bgUrl);
      avatarImage.src = avatarUrl;
      shell.style.setProperty('--status-bg', bgUrl ? `url("${bgUrl.replaceAll('"', '\\"')}")` : 'none');
    }

    function updateAffection() {
      const value = Number(affectionInput.value);
      shell.style.setProperty('--affection', String(value));
      shell.style.setProperty('--gradient-width', `${10000 / Math.max(value, 1)}%`);
      shell.style.setProperty('--affection-color', affectionColor(value));
      affectionValue.textContent = String(value);
    }

    avatarInput.addEventListener('input', updateAssets);
    bgInput.addEventListener('input', updateAssets);
    affectionInput.addEventListener('input', updateAffection);
    updateAssets();
    updateAffection();
  </script>
</body>
</html>
