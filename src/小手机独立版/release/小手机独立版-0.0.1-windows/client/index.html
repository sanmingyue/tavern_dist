<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101114" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="小手机" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <title>小手机独立版</title>
  </head>
  <body>
    <main id="app" class="app">
      <section class="phone">
        <header class="statusbar">
          <span id="clock">20:31</span>
          <div class="statusbar__right">
            <span id="bridge-dot" class="dot"></span>
            <span>5G</span>
            <span>87%</span>
          </div>
        </header>

        <section id="lock-view" class="screen screen--home">
          <div class="hero">
            <p class="eyebrow">独立版</p>
            <h1>小手机</h1>
            <p id="connection-text">正在连接本地服务...</p>
          </div>
          <form id="pair-form" class="pair">
            <label for="token-input">配对码</label>
            <div class="pair__row">
              <input id="token-input" autocomplete="one-time-code" placeholder="服务窗口显示的 6 位码" />
              <button type="submit">连接</button>
            </div>
          </form>
          <div class="dock">
            <button data-open="messages">闪讯</button>
            <button data-open="contacts">通讯录</button>
            <button data-open="events">事件</button>
            <button data-open="settings">设置</button>
          </div>
        </section>

        <section id="messages-view" class="screen hidden">
          <nav class="nav">
            <button data-back>‹</button>
            <h2>闪讯</h2>
            <button id="add-contact-btn">＋</button>
          </nav>
          <div class="split">
            <aside id="contact-list" class="contacts"></aside>
            <section class="chat">
              <div id="chat-title" class="chat__title">选择联系人</div>
              <div id="message-list" class="messages"></div>
              <form id="send-form" class="composer">
                <input id="message-input" placeholder="输入消息，会同步到酒馆输入框" />
                <button type="submit">发送</button>
              </form>
            </section>
          </div>
        </section>

        <section id="contacts-view" class="screen hidden">
          <nav class="nav">
            <button data-back>‹</button>
            <h2>通讯录</h2>
            <button id="contact-create-btn">＋</button>
          </nav>
          <div id="contacts-page-list" class="list"></div>
        </section>

        <section id="events-view" class="screen hidden">
          <nav class="nav">
            <button data-back>‹</button>
            <h2>酒馆事件</h2>
            <button id="refresh-btn">↻</button>
          </nav>
          <div id="event-list" class="list"></div>
        </section>

        <section id="settings-view" class="screen hidden">
          <nav class="nav">
            <button data-back>‹</button>
            <h2>设置</h2>
            <span></span>
          </nav>
          <div class="settings">
            <div class="settings__card">
              <strong>连接状态</strong>
              <p id="settings-status">未连接</p>
            </div>
            <div class="settings__card">
              <strong>访问地址</strong>
              <p id="settings-urls"></p>
            </div>
            <div class="settings__card">
              <strong>安装为 App</strong>
              <p>桌面和安卓浏览器可直接安装 PWA。iOS 用 Safari 添加到主屏幕。</p>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
