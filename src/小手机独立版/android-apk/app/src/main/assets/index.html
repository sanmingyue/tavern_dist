<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>小手机</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        color-scheme: dark;
        background: #101114;
        color: #fff;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(420px, 100%);
      }
      h1 {
        font-size: 40px;
        margin: 0 0 12px;
      }
      p {
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.72);
      }
      input, button {
        width: 100%;
        box-sizing: border-box;
        border: 0;
        border-radius: 14px;
        padding: 14px;
        margin-top: 10px;
        font: inherit;
      }
      input {
        background: rgba(255, 255, 255, 0.1);
        color: white;
      }
      button {
        background: #49b2ff;
        color: #07131f;
        font-weight: 800;
      }
      small {
        display: block;
        margin-top: 14px;
        color: rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>小手机</h1>
      <p>请输入电脑上小手机服务的地址。手机和电脑需要在同一个 Wi-Fi。</p>
      <input id="url" placeholder="例如 http://192.168.1.23:39231" />
      <button id="go">连接</button>
      <small>0.0.1 安卓壳：连接电脑本地服务，不在手机本机运行酒馆。</small>
    </main>
    <script>
      const input = document.getElementById('url');
      const saved = localStorage.getItem('xiaoshouji-server-url');
      if (saved) input.value = saved;
      document.getElementById('go').onclick = () => {
        const url = input.value.trim();
        if (!url) return;
        localStorage.setItem('xiaoshouji-server-url', url);
        location.href = url;
      };
    </script>
  </body>
</html>
