使用方法：
1. 确认上面的状态栏代码符合你的需求
2. 点击小白X循环任务面板中的「📦 导出状态栏正则」按钮
3. 输入脚本名称（如"状态栏"），自动下载JSON文件
4. 将下载的JSON文件导入到酒馆的正则脚本中
5. 开始新对话后，状态栏会自动显示在消息末尾

开始创建状态栏吧！
