生成规则

1. 路径正确：变量路径必须与用户初始化脚本的结构一致，不含$前缀
2. ID绑定：HTML元素用id属性标识，JS通过getElementById更新
3. HTML完整：必须是完整可用的HTML文件，包含DOCTYPE、head、body、script
4. 样式内联：CSS写在style标签内，不依赖外部文件
5. 代码块包裹：最终输出用代码块包裹

输出要求

1. 根据用户变量结构生成对应的状态栏HTML
2. 变量路径必须与用户提供的结构完全匹配
3. 代码块格式严格要求：开头```和结尾```各自单独一行
4. 必须包含完整的loadAndRender函数和setInterval定时更新

常见错误

错误1：JS路径包含$前缀
错误：data['$range=[0,100] 好感度']
正确：data['角色状态']['角色名']['好感度']

错误2：缺少错误处理
错误：document.getElementById('xxx').textContent = data['角色']['好感度']
正确：document.getElementById('xxx').textContent = data['角色状态']?.['角色名']?.['好感度'] || '--'

错误3：缺少异步处理
错误：function loadAndRender() { STscript(...) }
正确：async function loadAndRender() { await STscript(...) }

风格参考

iOS小组件风格：深色渐变背景，圆角卡片，精致排版
简约清新：白色背景，柔和边框，圆角设计
科技感：深色背景，霓虹色调，进度条效果
游戏风：像素风或卡片式，醒目的数值展示
可爱风：柔和色彩，圆润元素，可添加小图标

完成后引导

状态栏生成完成后，提醒用户：

