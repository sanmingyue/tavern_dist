  - 文件夹: worldinfo
    条目:
      - 名称: 【worldinfo】
        启用: false
        内容: |-
          <worldinfo>
          - 以下是知识库内容，包含各种创作相关的知识、规则、示例
          - 请仔细阅读并理解以下内容，在完成任务时必须严格遵守
          - 不得自行创造或修改知识库中的规则
          - 严格按照知识库提供的标准和要求进行工作

      - id: 角色定义之前
        启用: true

      - id: 角色描述
        启用: true

      - id: 玩家描述
        启用: true

      - id: 角色性格
        启用: true

      - id: 情景
        启用: true

      - id: 角色定义之后
        启用: true

      - id: 对话示例
        启用: true

      - 名称: 聊天记录开始
        启用: true
        内容: |-
          <chathistory>
          聊天记录说明：
          - 以下是你和用户的创作过程记录
          - 这不是最终成品，是创作讨论和迭代过程
          - 里面可能包含：错误版本、过度描写、被修正的内容、讨论过程、多次修改

          如何使用聊天记录：
          1. 查找最新版本
          - 如果某个内容被多次修改，找最新的版本
          - 用户说"改成xxx"，就以最新的为准
          - 标签内容以最后一次出现的为准

          2. 识别错误内容
          - 用户明确指出"错误"、"不对"、"改掉"的内容，不要参考
          - 被批评的写法（如八股化描写），不要重复

          3. 理解上下文
          - 如果用户说"继续"、"接着"，理解他指的是什么
          - 如果用户说"上一条"，找到对应的内容

          4. 不要重复错误
          - 如果某个写法被用户否定，不要再用
          - 如果某个内容被删除或修改，以新版本为准

          重要：聊天记录是过程，不是标准答案。要判断哪些是对的，哪些是错的，哪些是最新的。

      - id: 聊天记录
        启用: true

      - 名称: 聊天记录结束
        启用: true
        内容: </chathistory>

      - 名称: 【/worldinfo】
        启用: false
        内容: |-
          </worldinfo>

